<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Introduction à l'Évaluation",
        "contenu": "<div style='background: linear-gradient(135deg, #1a237e, #0d47a1); padding: 20px; border-radius: 10px; color: white;'><h2 style='color: #ffeb3b;'>Bienvenue !</h2><p style='font-size: 1.2rem;'>Nous abordons aujourd'hui l'évaluation des modèles de Machine Learning.</p><p>C'est l'étape où l'on vérifie si notre modèle est <strong>performant</strong> et <strong>fiable</strong>.</p><ul style='list-style-type: none; padding-left: 0;'><li>🔹 <strong>Objectif :</strong> Savoir évaluer un modèle avec les bonnes métriques</li><li>🔹 <strong>Mots-clés :</strong> Métriques, erreurs, biais, performance</li><li>🔹 <strong>Pourquoi ?</strong> Pour prendre des décisions éclairées</li></ul></div>",
        "texteParle": "Bonjour à tous. Aujourd'hui, nous allons parler de l'évaluation des modèles. Après avoir entraîné votre modèle, il est essentiel de savoir s'il est vraiment performant. C'est comme un examen : vous avez travaillé, mais il faut vérifier si vous avez bien compris. Nous allons voir ensemble les différents outils pour évaluer nos modèles.",
        "note": "L'évaluation est une étape cruciale pour valider la performance d'un modèle."
    },
    {
        "titre": "Pourquoi Évaluer un Modèle ?",
        "contenu": "<div style='background: #f5f5f5; padding: 15px; border-left: 5px solid #1a237e; border-radius: 5px;'><p><strong>Évaluer un modèle</strong> permet de répondre à des questions essentielles :</p><ul><li>✅ <strong>Est-ce que le modèle fonctionne bien ?</strong></li><li>✅ <strong>Peut-on lui faire confiance ?</strong></li><li>✅ <strong>Est-il meilleur qu'un autre modèle ?</strong></li><li>✅ <strong>Est-il prêt pour la production ?</strong></li></ul><p style='margin-top: 10px; background: #fff3e0; padding: 10px; border-radius: 5px;'><strong>💡 Au Cameroun :</strong> Un modèle qui prédit la production agricole doit être fiable pour aider les agriculteurs à prendre des décisions.</p><div class='math-block'><div class='math'>$$ \\text{Performance} = f(\\text{Modèle}, \\text{Données}) $$</div></div></div>",
        "texteParle": "Pourquoi évaluer un modèle ? C'est une question fondamentale. On évalue pour savoir si le modèle est performant, si on peut lui faire confiance, s'il est meilleur qu'un autre, et s'il est prêt à être utilisé. Imaginez un modèle qui prédit les rendements agricoles au Cameroun. S'il n'est pas fiable, les agriculteurs pourraient prendre de mauvaises décisions. L'évaluation est donc essentielle.",
        "note": "L'évaluation permet de s'assurer de la fiabilité du modèle avant son déploiement."
    },
    {
        "titre": "Métriques pour la Régression",
        "contenu": "<div style='background: #e8f5e9; padding: 20px; border-radius: 10px; border: 1px solid #4caf50;'><h3 style='color: #1b5e20;'>Mesurer l'erreur de prédiction</h3><p>Pour les problèmes de <strong>régression</strong>, on utilise des métriques qui mesurent l'écart entre les prédictions et les valeurs réelles.</p><ul><li>🔸 <strong>MAE</strong> (Mean Absolute Error) : erreur absolue moyenne</li><li>🔸 <strong>MSE</strong> (Mean Squared Error) : erreur quadratique moyenne</li><li>🔸 <strong>RMSE</strong> (Root Mean Squared Error) : racine de l'erreur quadratique moyenne</li><li>🔸 <strong>R²</strong> : coefficient de détermination</li></ul><div class='math-block'><div class='math'>$$ \\text{MAE} = \\frac{1}{n} \\sum_{i=1}^{n} |y_i - \\hat{y}_i| $$</div></div><div class='math-block'><div class='math'>$$ \\text{MSE} = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2 $$</div></div><p><strong>Exemple :</strong> Prédire le prix du cacao (en FCFA).</p></div>",
        "texteParle": "Commençons par les métriques pour la régression. La régression, c'est quand on prédit une valeur continue, comme le prix du cacao. La MAE, c'est l'erreur absolue moyenne. La MSE, c'est l'erreur quadratique moyenne. La RMSE, c'est la racine de la MSE. Et le R², c'est le coefficient de détermination. Chaque métrique a ses avantages. La MAE est facile à interpréter, tandis que la MSE pénalise davantage les grandes erreurs.",
        "note": "Le choix de la métrique dépend du problème et de la sensibilité aux erreurs."
    },
    {
        "titre": "Métriques pour la Classification",
        "contenu": "<div style='background: #e3f2fd; padding: 20px; border-radius: 10px; border: 1px solid #2196f3;'><h3 style='color: #0d47a1;'>Mesurer la justesse des prédictions</h3><p>Pour les problèmes de <strong>classification</strong>, on utilise des métriques basées sur la <strong>matrice de confusion</strong>.</p><ul><li>🔸 <strong>Accuracy</strong> : proportion de bonnes prédictions</li><li>🔸 <strong>Precision</strong> : précision des prédictions positives</li><li>🔸 <strong>Recall</strong> : capacité à trouver les vrais positifs</li><li>🔸 <strong>F1-Score</strong> : moyenne harmonique de precision et recall</li></ul><div class='math-block'><div class='math'>$$ \\text{Accuracy} = \\frac{VP + VN}{VP + VN + FP + FN} $$</div></div><p><strong>Exemple :</strong> Classifier si un produit est de bonne qualité.</p></div>",
        "texteParle": "Pour la classification, on utilise d'autres métriques. La matrice de confusion est un outil fondamental. Elle nous permet de calculer l'accuracy, la precision, le recall et le F1-score. L'accuracy, c'est la proportion de bonnes prédictions. La precision, c'est la proportion de vrais positifs parmi les positifs prédits. Le recall, c'est la proportion de vrais positifs parmi tous les positifs réels. Le F1-score combine la precision et le recall.",
        "note": "La matrice de confusion est la base de l'évaluation des modèles de classification."
    },
    {
        "titre": "La Matrice de Confusion",
        "contenu": "<div style='background: #fff3e0; padding: 20px; border-radius: 10px; border: 1px solid #ff9800;'><h3 style='color: #e65100;'>Un outil fondamental</h3><p>La matrice de confusion permet de visualiser les performances d'un classifieur.</p><table style='width: 100%; border-collapse: collapse; background: white; border-radius: 5px; overflow: hidden;'><tr><th style='padding: 10px; background: #263238; color: white;'></th><th style='padding: 10px; background: #263238; color: white;'>Prédit Positif</th><th style='padding: 10px; background: #263238; color: white;'>Prédit Négatif</th></tr><tr><td style='padding: 10px; background: #37474f; color: white;'><strong>Réel Positif</strong></td><td style='padding: 10px; background: #4caf50; color: white; text-align: center;'>VP</td><td style='padding: 10px; background: #f44336; color: white; text-align: center;'>FN</td></tr><tr><td style='padding: 10px; background: #37474f; color: white;'><strong>Réel Négatif</strong></td><td style='padding: 10px; background: #f44336; color: white; text-align: center;'>FP</td><td style='padding: 10px; background: #4caf50; color: white; text-align: center;'>VN</td></tr></table><ul style='margin-top: 10px;'><li>✅ <strong>VP</strong> : Vrais Positifs</li><li>✅ <strong>VN</strong> : Vrais Négatifs</li><li>❌ <strong>FP</strong> : Faux Positifs (Erreur de type I)</li><li>❌ <strong>FN</strong> : Faux Négatifs (Erreur de type II)</li></ul><p><strong>💡 Au Cameroun :</strong> Un modèle qui prédit des maladies doit éviter les faux négatifs.</p></div>",
        "texteParle": "La matrice de confusion est un tableau qui résume les performances d'un classifieur. Elle montre les vrais positifs, les vrais négatifs, les faux positifs et les faux négatifs. Les faux positifs, c'est quand le modèle prédit positif alors que c'est négatif. Les faux négatifs, c'est l'inverse. Selon le contexte, certaines erreurs sont plus graves que d'autres. Par exemple, en médecine, un faux négatif peut être très dangereux.",
        "note": "La matrice de confusion permet d'analyser les types d'erreurs du modèle."
    },
    {
        "titre": "Accuracy et ses Limites",
        "contenu": "<div style='background: #fce4ec; padding: 20px; border-radius: 10px; border: 1px solid #e91e63;'><h3 style='color: #880e4f;'>Attention aux données déséquilibrées</h3><p>L'<strong>accuracy</strong> n'est pas toujours la meilleure métrique.</p><p><strong>Problème :</strong> Si les classes sont déséquilibrées, l'accuracy peut être trompeuse.</p><p><strong>Exemple :</strong> 95% des clients ne font pas défaut. Un modèle qui prédit toujours \"pas défaut\" aura une accuracy de 95% mais sera inutile.</p><div class='math-block'><div class='math'>$$ \\text{Accuracy} = \\frac{VP + VN}{VP + VN + FP + FN} $$</div></div><p><strong>Solution :</strong> Utiliser d'autres métriques comme la <strong>precision</strong>, le <strong>recall</strong> ou le <strong>F1-score</strong>.</p></div>",
        "texteParle": "L'accuracy, c'est la proportion de bonnes prédictions. Mais attention, elle peut être trompeuse dans certains cas. Si les classes sont déséquilibrées, un modèle peut avoir une bonne accuracy tout en étant mauvais. Par exemple, si 95% des clients sont solvables, un modèle qui prédit toujours solvable aura 95% de bonnes prédictions. Pourtant, il ne détecte pas les clients à risque. Il faut donc utiliser d'autres métriques.",
        "note": "Dans les données déséquilibrées, l'accuracy n'est pas une métrique fiable."
    },
    {
        "titre": "Precision et Recall",
        "contenu": "<div style='background: #e8eaf6; padding: 20px; border-radius: 10px; border: 1px solid #3f51b5;'><h3 style='color: #1a237e;'>Deux métriques complémentaires</h3><ul><li>🔸 <strong>Precision</strong> : \"Parmi les cas prédits positifs, combien sont réellement positifs ?\"</li><li>🔸 <strong>Recall</strong> : \"Parmi les cas réellement positifs, combien ont été prédits positifs ?\"</li></ul><div class='math-block'><div class='math'>$$ \\text{Precision} = \\frac{VP}{VP + FP} $$</div></div><div class='math-block'><div class='math'>$$ \\text{Recall} = \\frac{VP}{VP + FN} $$</div></div><p><strong>Compromis :</strong> Augmenter le recall diminue souvent la precision et inversement.</p><p><strong>Exemple :</strong> Détection de spams. On veut une bonne precision (pas de faux positifs) et un bon recall (peu de spams manqués).</p></div>",
        "texteParle": "La precision et le recall sont deux métriques complémentaires. La precision mesure la proportion de vrais positifs parmi les positifs prédits. Le recall mesure la proportion de vrais positifs parmi tous les positifs réels. Il y a souvent un compromis entre les deux. Si vous voulez augmenter le recall, vous risquez de diminuer la precision. Le choix dépend de votre problème. Pour la détection de spams, on veut une bonne precision pour ne pas classifier un bon email comme spam.",
        "note": "Le compromis precision/recall est important à comprendre pour choisir la bonne métrique."
    },
    {
        "titre": "Le F1-Score",
        "contenu": "<div style='background: #f3e5f5; padding: 20px; border-radius: 10px; border: 1px solid #9c27b0;'><h3 style='color: #4a148c;'>La moyenne harmonique</h3><p>Le <strong>F1-Score</strong> est la <strong>moyenne harmonique</strong> de la precision et du recall.</p><div class='math-block'><div class='math'>$$ F1 = 2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}} $$</div></div><ul><li>✅ Utile quand on veut un bon équilibre entre precision et recall</li><li>✅ Pénalise les modèles qui sacrifient une métrique pour l'autre</li><li>✅ Souvent utilisé quand les classes sont déséquilibrées</li></ul><p><strong>Exemple :</strong> Classification de maladies rares.</p><p style='margin-top: 10px; background: #fff9c4; padding: 10px; border-radius: 5px;'>💡 Au Cameroun, le F1-score est utile pour les projets de santé publique.</p></div>",
        "texteParle": "Le F1-score est la moyenne harmonique de la precision et du recall. Il est utile quand on veut un bon équilibre entre les deux. Il pénalise les modèles qui sacrifient une métrique pour l'autre. C'est souvent utilisé quand les classes sont déséquilibrées. Par exemple, pour la classification de maladies rares, on veut à la fois une bonne precision et un bon recall. Le F1-score est alors une bonne métrique.",
        "note": "Le F1-score est particulièrement utile pour les données déséquilibrées."
    },
    {
        "titre": "Courbe ROC et AUC",
        "contenu": "<div style='background: #e0f7fa; padding: 20px; border-radius: 10px; border: 1px solid #00bcd4;'><h3 style='color: #006064;'>Visualisation des performances</h3><p>La <strong>courbe ROC</strong> (Receiver Operating Characteristic) montre le compromis entre le taux de vrais positifs et le taux de faux positifs.</p><ul><li>🔹 <strong>Taux de vrais positifs (TPR)</strong> = Recall</li><li>🔹 <strong>Taux de faux positifs (FPR)</strong> = FP / (FP + VN)</li><li>🔹 <strong>AUC</strong> (Area Under the Curve) : mesure la performance globale</li></ul><div class='math-block'><div class='math'>$$ \\text{AUC} \\in [0, 1] $$</div></div><p><strong>Interprétation :</strong></p><ul><li>🔸 AUC = 0.5 : modèle aléatoire</li><li>🔸 AUC = 1 : modèle parfait</li><li>🔸 AUC > 0.8 : bon modèle</li></ul></div>",
        "texteParle": "La courbe ROC est un outil puissant pour visualiser les performances d'un classifieur. Elle montre le compromis entre le taux de vrais positifs et le taux de faux positifs. L'AUC, ou Area Under the Curve, résume cette performance. Une AUC de 0.5 signifie que le modèle est aléatoire. Une AUC de 1 signifie qu'il est parfait. En pratique, une AUC supérieure à 0.8 est considérée comme bonne.",
        "note": "La courbe ROC et l'AUC sont des outils standards pour évaluer les classifieurs."
    },

        "texteParle": "L'analyse des erreurs est une étape qui permet de comprendre pourquoi le modèle se trompe. Quelles sont les erreurs les plus fréquentes ? Y a-t-il des patterns dans les erreurs ? Comment réduire ces erreurs ? On peut analyser les cas mal classifiés, visualiser les erreurs, ou identifier les biais du modèle. Cette analyse est essentielle pour améliorer le modèle. Au Cameroun, elle permet d'adapter le modèle au contexte local.",

    {
        "titre": "Biais et Variance",
        "contenu": "<div style='background: #fafafa; padding: 15px; border-left: 5px solid #d32f2f; border-radius: 5px;'><h3 style='color: #b71c1c;'>Sources d'erreur</h3><ul><li><strong>Biais (Bias)</strong> : erreur due à des hypothèses trop simplistes du modèle.</li><li><strong>Variance</strong> : sensibilité du modèle aux fluctuations des données.</li></ul><p><strong>Compromis :</strong> Un modèle avec un biais élevé sous-apprend. Un modèle avec une variance élevée sur-apprend.</p><div style='background: #e3f2fd; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Comment les détecter ?</strong></p><ul><li>🔸 <strong>Biais élevé</strong> : mauvaises performances en train et en test</li><li>🔸 <strong>Variance élevée</strong> : bonnes performances en train, mauvaises en test</li></ul></div></div>",
        "texteParle": "Le biais et la variance sont deux sources d'erreur importantes. Le biais, c'est l'erreur due à des hypothèses trop simplistes. La variance, c'est la sensibilité du modèle aux données. Un modèle avec un biais élevé sous-apprend. Un modèle avec une variance élevée sur-apprend. Pour détecter un biais élevé, on observe de mauvaises performances en train et en test. Pour une variance élevée, on observe de bonnes performances en train mais de mauvaises en test.",
        "note": "Le compromis biais-variance est un concept clé en Machine Learning."
    },
    {
        "titre": "Validation Croisée pour l'Évaluation",
        "contenu": "<div style='background: #e8f5e9; padding: 20px; border-radius: 10px; border: 1px solid #4caf50;'><h3 style='color: #1b5e20;'>Une évaluation plus robuste</h3><p>La <strong>validation croisée</strong> permet d'obtenir une évaluation plus fiable des performances.</p><ul><li>🔹 On divise les données en <strong>k</strong> folds</li><li>🔹 On entraîne sur k-1 folds et on évalue sur le fold restant</li><li>🔹 On répète k fois et on moyenne les résultats</li></ul><div class='math-block'><div class='math'>$$ \\text{Performance} = \\frac{1}{k} \\sum_{i=1}^{k} \\text{Score}_i $$</div></div><p><strong>Avantages :</strong></p><ul><li>✅ Moins de variance dans l'évaluation</li><li>✅ Utilisation plus efficace des données</li><li>✅ Détection plus fiable de l'overfitting</li></ul></div>",

        "texteParle": "Pour résumer, nous avons vu plusieurs métriques. Pour la régression, on utilise la MAE, la MSE, la RMSE et le R². Pour la classification, on utilise l'accuracy, la precision, le recall, le F1-score et l'AUC. Le choix de la métrique dépend de votre problème. En Data Science, il n'y a pas de métrique universelle. Il faut choisir celle qui correspond le mieux à vos objectifs.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });

        if (statusBadge) {

        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
