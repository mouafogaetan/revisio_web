<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Projet de Fin d'Études - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4 - Évaluation Finale",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie 1 - Questions de Cours",
      "points": "6 pts",
      "enonce": "<div style='font-family: system-ui, sans-serif; padding: 5px; color: #0f172a;'><p>Répondez de manière claire et concise aux questions suivantes. Chaque réponse doit montrer une bonne compréhension des concepts abordés dans le cours.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1 (1.5 pt)</strong> Expliquez ce qu'est une <strong>revue de littérature</strong> et pourquoi elle est essentielle dans un projet de Data Science. Citez deux outils qui peuvent être utilisés pour la réaliser.</p>",
          "reponse": "<p>La revue de littérature est une analyse systématique et critique des publications scientifiques existantes sur un sujet donné [citation:1]. Elle est essentielle car elle permet de :</p><ul><li><strong>Éviter le plagiat</strong> en connaissant ce qui a déjà été fait</li><li><strong>Justifier son projet</strong> en démontrant son originalité</li><li><strong>S'inspirer</strong> des méthodes et approches existantes</li></ul><p><strong>Outils :</strong> Google Scholar, IEEE Xplore, ACM Digital Library, ScienceDirect, ou arXiv.org.</p>"
        },
        {
          "question": "<p><strong>1.2 (1.5 pt)</strong> Dans le contexte de l'évaluation des modèles de Machine Learning, distinguez les notions de <strong>biais</strong> et de <strong>variance</strong>. Comment se manifeste un biais élevé et une variance élevée dans les performances d'un modèle ?</p>",
          "reponse": "<ul><li><strong>Biais élevé :</strong> Modèle trop simple qui sous-apprend (underfitting). Performance faible sur les données d'entraînement et de test.</li><li><strong>Variance élevée :</strong> Modèle trop complexe qui sur-apprend (overfitting). Excellente performance sur l'entraînement, mauvaise sur les données de test.</li></ul><p>Le dilemme biais-variance est un compromis fondamental : augmenter la complexité du modèle diminue le biais mais augmente la variance.</p>"
        },
        {
          "question": "<p><strong>1.3 (1.5 pt)</strong> Qu'est-ce que l'<strong>Analyse Exploratoire de Données (EDA)</strong> ? Quels sont ses principaux objectifs et quelles techniques peut-on utiliser ?</p>",
          "reponse": "<p>L'EDA est une approche d'analyse des données qui vise à explorer et comprendre les données avant la modélisation. Ses objectifs sont :</p><ul><li>Comprendre la structure des données</li><li>Identifier les valeurs aberrantes et les données manquantes</li><li>Détecter les patterns et tendances</li><li>Formuler des hypothèses</li></ul><p><strong>Techniques :</strong> Statistiques descriptives (moyenne, médiane, écart-type), visualisations (histogrammes, boxplots, scatter plots, matrices de corrélation).</p>"
        },
        {
          "question": "<p><strong>1.4 (1.5 pt)</strong> Quels sont les <strong>quatre livrables</strong> principaux attendus à la fin d'un Projet de Fin d'Études en Data Science selon votre programme ? Décrivez brièvement chacun d'eux.</p>",
          "reponse": "<p><strong>1. Rapport de projet :</strong> Document structuré présentant la problématique, la méthodologie, les résultats et la discussion [citation:1].</p><p><strong>2. Code source :</strong> L'ensemble des scripts et notebooks utilisés pour la collecte, le prétraitement et la modélisation.</p><p><strong>3. Présentation orale :</strong> Présentation de soutenance devant le jury pour défendre le projet.</p><p><strong>4. Documentation :</strong> Documentation technique du code et des modèles pour assurer la reproductibilité.</p>"
        }
      ]
    },
    {
      "titre": "Partie 2 - Étude de Cas",
      "points": "7 pts",
      "enonce": "<div style='font-family: system-ui, sans-serif; padding: 5px; color: #0f172a;'><p>Lisez attentivement l'étude de cas suivante et répondez aux questions.</p><div style='background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Contexte :</strong> Vous êtes Data Scientist au sein d'une entreprise de logistique camerounaise. L'entreprise souhaite développer un modèle pour <strong>prédire les retards de livraison</strong> afin d'améliorer la satisfaction client.</p><p>Vous disposez d'un jeu de données contenant :</p><ul><li>100 000 livraisons historiques</li><li>Colonnes : ville_depart, ville_arrivee, distance_km, poids_colis, date_livraison, heure_livraison, retard (0/1)</li><li>5% des livraisons sont en retard</li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>2.1 (1.5 pt)</strong> Vous constatez que la colonne <code>distance_km</code> contient 15% de valeurs manquantes et que la colonne <code>ville_arrivee</code> a des noms non standardisés (ex: 'Douala', 'DOUALA', 'dla'). Proposez un plan de nettoyage pour ces deux problèmes.</p>",
          "reponse": "<p><strong>Traitement des valeurs manquantes (distance_km) :</strong></p><ul><li>Imputer par la <strong>médiane</strong> de la distance pour chaque couple de villes (plus robuste que la moyenne).</li><li>Si la médiane n'est pas disponible, utiliser la médiane globale.</li></ul><p><strong>Standardisation des noms de villes (ville_arrivee) :</strong></p><ul><li>Créer un dictionnaire de correspondance (ex: 'DOUALA' → 'Douala', 'dla' → 'Douala').</li><li>Utiliser des techniques de <strong>fuzzy matching</strong> pour les noms proches.</li><li>Mettre en place un référentiel des villes du Cameroun.</li></ul>"
        },
        {
          "question": "<p><strong>2.2 (1.5 pt)</strong> Le jeu de données est très déséquilibré (5% de retards). Expliquez pourquoi l'accuracy n'est pas une métrique appropriée ici et proposez deux métriques alternatives avec leur interprétation.</p>",
          "reponse": "<p>L'accuracy n'est pas appropriée car un modèle qui prédirait toujours 'pas de retard' aurait 95% d'accuracy mais ne détecterait aucune livraison en retard.</p><p><strong>Métriques alternatives :</strong></p><ul><li><strong>Rappel (Recall) :</strong> Proportion de vrais retards correctement identifiés. Important si on veut minimiser les retards non détectés.</li><li><strong>F1-score :</strong> Moyenne harmonique de la précision et du rappel. Bon compromis pour les données déséquilibrées.</li><li><strong>AUC-ROC :</strong> Capacité du modèle à distinguer les classes, indépendamment du seuil de décision.</li></ul>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> Vous avez entraîné trois modèles et obtenu les résultats suivants :</p><table style='border-collapse: collapse; width: 100%; font-size: 0.9em;'><tr style='background: #e2e8f0;'><th style='padding: 6px; border: 1px solid #cbd5e1;'>Modèle</th><th style='padding: 6px; border: 1px solid #cbd5e1;'>Accuracy</th><th style='padding: 6px; border: 1px solid #cbd5e1;'>Rappel</th><th style='padding: 6px; border: 1px solid #cbd5e1;'>Précision</th><th style='padding: 6px; border: 1px solid #cbd5e1;'>F1-score</th></tr><tr><td style='padding: 6px; border: 1px solid #cbd5e1;'>Régression Logistique</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>94%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>45%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>80%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>58%</td></tr><tr><td style='padding: 6px; border: 1px solid #cbd5e1;'>Forêt Aléatoire</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>93%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>82%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>70%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>76%</td></tr><tr><td style='padding: 6px; border: 1px solid #cbd5e1;'>XGBoost</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>94%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>78%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>78%</td><td style='padding: 6px; border: 1px solid #cbd5e1;'>78%</td></tr></table><p>Quel modèle recommanderiez-vous pour ce projet ? Justifiez votre choix en utilisant les métriques appropriées.</p>",
          "reponse": "<p>Je recommanderais le <strong>modèle Forêt Aléatoire</strong>.</p><p><strong>Justification :</strong></p><ul><li>Il a le <strong>meilleur rappel (82%)</strong>, ce qui signifie qu'il détecte 82% des retards réels. C'est la métrique la plus importante pour ce projet.</li><li>Son <strong>F1-score (76%)</strong> est le plus élevé, indiquant le meilleur compromis entre précision et rappel.</li><li>Il est moins sensible aux données déséquilibrées que la Régression Logistique.</li><li>Le modèle XGBoost est bon (78% rappel), mais la Forêt Aléatoire offre de meilleures performances pour ce problème.</li></ul>"
        },
        {
          "question": "<p><strong>2.4 (2 pts)</strong> Après validation du modèle, vous devez préparer la soutenance. Proposez une structure de présentation (5 sections principales) pour convaincre le jury de la qualité de votre projet. Pour chaque section, mentionnez le message clé.</p>",
          "reponse": "<p><strong>Structure de présentation :</strong></p><ol><li><strong>Introduction (2 min) :</strong> Problème métier des retards de livraison au Cameroun. Message clé : L'enjeu économique et client.</li><li><strong>Données et Méthodologie (4 min) :</strong> Sources, prétraitement, EDA. Message clé : La rigueur de la préparation.</li><li><strong>Modèles et Résultats (5 min) :</strong> Comparaison des approches, métriques. Message clé : Le modèle Forêt Aléatoire est le meilleur.</li><li><strong>Discussion (3 min) :</strong> Limites (données, contexte), perspectives. Message clé : Le projet est robuste mais peut être amélioré.</li><li><strong>Conclusion (2 min) :</strong> Bilan des apports, impact potentiel. Message clé : La solution est opérationnelle et pertinente.</li></ol><p>Total : ~16 minutes, avec 3 minutes de marge pour les questions.</p>"
        }
      ]
    },
    {
      "titre": "Partie 3 - Analyse Critique",
      "points": "3 pts",
      "enonce": "<div style='font-family: system-ui, sans-serif; padding: 5px; color: #0f172a;'><p>Cette partie évalue votre capacité à analyser de manière critique un projet de Data Science. Lisez l'extrait de rapport de projet fictif ci-dessous et répondez aux questions.</p><div style='background: #fef3c7; padding: 15px; border-radius: 8px; margin: 10px 0; color: #92400e;'><p><strong>Extrait du rapport :</strong></p><p><em>\"Nous avons utilisé un modèle SVM pour prédire le churn des clients. Les données ont été collectées via une API. L'accuracy du modèle est de 92%. Nous avons optimisé les hyperparamètres avec Grid Search. Les résultats montrent que notre modèle est performant.\"</em></p></div></div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
