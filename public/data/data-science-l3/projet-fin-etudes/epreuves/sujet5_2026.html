<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Projet de Fin d'Études - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Épreuve Sequentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Étude de Cas : Optimisation de la chaîne logistique",
      "points": "8 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1.1em; line-height: 1.6; padding: 10px;'>\n  <p>Une entreprise de distribution au Cameroun souhaite optimiser ses tournées de livraison pour réduire ses coûts. Pour ce faire, elle a collecté des données sur les trajets effectués par ses camions, incluant la <strong>distance parcourue (km)</strong>, le <strong>temps de trajet (minutes)</strong>, le <strong>nombre de livraisons effectuées</strong>, et le <strong>type de véhicule</strong> (petit, moyen, grand).</p>\n  <p>Dans le cadre de votre projet de fin d'études, vous êtes chargé de prédire le <strong>temps de trajet</strong> en fonction des autres variables. Après une première analyse, vous avez décidé d'utiliser un modèle de régression linéaire multiple.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>1.1</strong> Justifiez le choix de la régression linéaire multiple pour ce problème. (1 pt)</p>\n  <p><strong>1.2</strong> Identifiez la variable cible (<em>target</em>) et les variables indépendantes (<em>features</em>) dans ce cas. (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>1.1</strong> La régression linéaire multiple est un bon choix pour modéliser la relation entre une variable quantitative continue (temps de trajet) et plusieurs variables explicatives (distance, nombre de livraisons, type de véhicule). De plus, elle est simple à interpréter et rapide à entraîner.</p>\n  <p><strong>1.2</strong> Variable cible (<em>target</em>) : Temps de trajet (minutes). Variables indépendantes (<em>features</em>) : Distance parcourue, Nombre de livraisons, Type de véhicule.</p>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>1.3</strong> Avant d'entraîner le modèle, vous devez traiter la variable <strong>Type de véhicule</strong> (catégorielle). Quelle transformation proposez-vous ? Justifiez. (1 pt)</p>\n  <p><strong>1.4</strong> Après entraînement, vous obtenez un coefficient de détermination \( R^2 = 0.75 \). Interprétez ce résultat. (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>1.3</strong> Le <strong>One-Hot Encoding</strong> est la méthode appropriée pour transformer la variable 'Type de véhicule' (petit, moyen, grand) en variables numériques binaires. Cela permet au modèle de capturer l'effet de chaque catégorie sans introduire une relation d'ordre erronée.</p>\n  <p><strong>1.4</strong> Un \( R^2 = 0.75 \) signifie que 75% de la variabilité du temps de trajet est expliquée par les variables indépendantes dans le modèle. C'est un bon indicateur de la qualité de l'ajustement du modèle.</p>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>1.5</strong> L'entreprise souhaite maintenant que votre modèle puisse être utilisé par ses équipes sur le terrain via une application mobile. Proposez une solution technique de déploiement et justifiez votre choix. (2 pts)</p>\n  <p><strong>1.6</strong> Discutez une limite potentielle de votre modèle de régression linéaire dans ce contexte logistique. (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>1.5</strong> Une solution consiste à déployer le modèle entraîné sous la forme d'une <strong>API REST</strong> (par exemple avec Flask ou FastAPI) hébergée sur un serveur cloud. L'application mobile enverra les données (distance, livraisons, type de véhicule) à l'API via une requête HTTP, qui retournera la prédiction en temps réel. Cette approche est modulable, permet des mises à jour faciles du modèle et offre une bonne sécurité.</p>\n  <p><strong>1.6</strong> La régression linéaire suppose une <strong>relation linéaire</strong> entre les variables. Or, en logistique, le temps de trajet peut avoir des relations non-linéaires (ex: embouteillages aux heures de pointe). Le modèle pourrait donc sous-performer dans ces cas-là.</p>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>1.7</strong> En tant que chef de projet, comment assurerez-vous le <strong>suivi</strong> de ce projet avec votre équipe de 3 stagiaires tout au long du semestre ? (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p>Je mettrai en place des <strong>points de suivi hebdomadaires</strong> avec chaque stagiaire, et une <strong>réunion d'équipe toutes les deux semaines</strong>. J'utiliserai un tableau de bord partagé (Trello ou Jira) pour visualiser l'avancement des tâches, identifier les blocages et réattribuer les tâches en fonction des compétences et de la charge de travail.</p>\n</div>"
        }
      ]
    },
    {
      "titre": "Questions de Cours",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1.1em; line-height: 1.6; padding: 10px;'>\n  <p>Répondez aux questions suivantes de manière claire et concise.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>2.1</strong> Définissez ce qu'est un hyperparamètre dans un modèle de Machine Learning et donnez deux exemples. (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p>Un hyperparamètre est une valeur définie <strong>avant</strong> l'entraînement du modèle et qui contrôle le processus d'apprentissage. Il n'est pas appris à partir des données.</p>\n  <p><strong>Exemples :</strong> La profondeur maximale d'un arbre de décision (<code>max_depth</code>), le nombre d'arbres dans une forêt aléatoire (<code>n_estimators</code>), le taux d'apprentissage dans un réseau de neurones (<code>learning_rate</code>).</p>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>2.2</strong> Quelle est la différence entre l'optimisation des hyperparamètres et l'entraînement des paramètres du modèle ? (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>Entraînement des paramètres :</strong> Il s'agit de trouver les valeurs des poids du modèle qui minimisent une fonction de perte sur les données d'entraînement (via la descente de gradient).</p>\n  <p><strong>Optimisation des hyperparamètres :</strong> Il s'agit de trouver la meilleure combinaison de valeurs de contrôle (hyperparamètres) qui permet au modèle d'obtenir les meilleures performances sur un jeu de validation, souvent via des méthodes comme Grid Search, Random Search ou l'optimisation bayésienne.</p>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>2.3</strong> Citez deux méthodes d'optimisation des hyperparamètres et décrivez brièvement leurs principes. (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <ul>\n    <li><strong>Grid Search (Recherche par grille) :</strong> Définit une grille de valeurs pour chaque hyperparamètre et teste toutes les combinaisons possibles. C'est une méthode exhaustive mais coûteuse.</li>\n    <li><strong>Random Search (Recherche aléatoire) :</strong> Choisit un nombre fixe de combinaisons d'hyperparamètres aléatoirement dans un espace défini. Elle est souvent plus efficace que Grid Search, surtout pour les grands espaces.</li>\n  </ul>\n</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>2.4</strong> Pourquoi est-il important de documenter son code dans un projet de Data Science ? (1 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p>La documentation du code est essentielle pour :</p>\n  <ul>\n    <li><strong>Assurer la reproductibilité :</strong> Permettre à d'autres (ou à soi-même plus tard) de comprendre, d'exécuter et de reproduire les résultats.</li>\n    <li><strong>Faciliter le partage et la collaboration :</strong> Rendre le projet compréhensible pour les autres membres de l'équipe.</li>\n    <li><strong>Garantir la maintenabilité :</strong> Faciliter la modification, la correction de bugs et l'évolution du code.</li>\n  </ul>\n</div>"
        }
      ]
    },
    {
      "titre": "Application Pratique",
      "points": "8 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1.1em; line-height: 1.6; padding: 10px;'>\n  <p>Vous êtes data scientist dans une start-up camerounaise spécialisée dans l'agritech. L'entreprise a développé un prototype de capteur qui mesure en temps réel l'<strong>humidité du sol</strong>, la <strong>température</strong> et le <strong>taux de lumière</strong> pour aider les agriculteurs à optimiser l'irrigation.</p>\n  <p>Après plusieurs mois de collecte de données, vous devez construire un <strong>modèle de classification</strong> pour prédire si le champ a <strong>besoin d'être irrigué (Classe 1)</strong> ou non <strong>(Classe 0)</strong>.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>3.1</strong> Vous disposez de 1000 échantillons, mais 800 appartiennent à la Classe 0 et 200 à la Classe 1. Quel est ce phénomène et pourquoi est-ce un problème pour votre projet ? (1.5 pts)</p>\n  <p><strong>3.2</strong> Proposez une méthode pour résoudre ce problème en expliquant son fonctionnement. (1.5 pts)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>3.1</strong> C'est un problème de <strong>déséquilibre de classes</strong>. C'est un problème car un modèle entraîné sur ces données aurait tendance à prédire majoritairement la Classe 0 (pas d'irrigation) pour obtenir une bonne précision globale, même s'il n'est pas capable d'identifier correctement les rares cas où une irrigation est nécessaire.</p>\n  <p><strong>3.2</strong> Une méthode est le <strong>sur-échantillonnage (Oversampling)</strong> avec la technique <strong>SMOTE</strong> (Synthetic Minority Over-sampling Technique). SMOTE crée de nouveaux exemples synthétiques de la classe minoritaire (Classe 1) en interpolant entre des points existants. Cela permet d'équilibrer l'ensemble d'entraînement et d'éviter le biais envers la classe majoritaire.</p>\n</div>"
        },
        {

          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>3.3</strong> La métrique la plus appropriée est le <strong>F1-score</strong> (ou la moyenne harmonique de la précision et du rappel). Elle est plus pertinente que la simple précision car elle pénalise les faux positifs et les faux négatifs. Le but est de ne pas manquer un besoin d'irrigation (faux négatif), mais aussi de ne pas gaspiller d'eau (faux positif).</p>\n  <p><strong>3.4</strong> Un F1-score de 0.85 est un excellent score, signifiant que le modèle a un bon équilibre entre précision et rappel. Il prédit correctement les besoins d'irrigation dans 85% des cas en moyenne, en tenant compte à la fois des erreurs de type I et de type II.</p>\n</div>"

        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 1.05em; line-height: 1.6;'>\n  <p><strong>3.5</strong> L'entreprise souhaite maintenant déployer ce modèle. Décrivez brièvement les étapes que vous suivrez pour assurer la <strong>maintenance</strong> de ce modèle une fois en production. (1.5 pts)</p>\n  <p><strong>3.6</strong> Quelle est votre responsabilité en tant que data scientist vis-à-vis des agriculteurs qui utiliseront votre application ? (0.5 pt)</p>\n</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'>\n  <p><strong>3.5</strong> Pour assurer la maintenance :</p>\n  <ul>\n    <li><strong>Monitoring des performances :</strong> Mettre en place un tableau de bord pour suivre en temps réel la précision et le F1-score du modèle.</li>\n    <li><strong>Plan de ré-entraînement :</strong> Prévoir un ré-entraînement périodique du modèle (ex: mensuel) avec les nouvelles données collectées pour éviter le 'concept drift'.</li>\n    <li><strong>Logging des erreurs :</strong> Enregistrer les prédictions où le modèle a échoué pour analyser les causes et améliorer les futures versions.</li>\n  </ul>\n  <p><strong>3.6</strong> Ma responsabilité est d'assurer que le modèle est <strong>fiable et éthique</strong>. Cela signifie qu'il ne doit pas générer de faux positifs (gaspillage d'eau) ou de faux négatifs (champs non irrigués). Je dois également expliquer clairement les limites du modèle aux agriculteurs.</p>\n</div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
