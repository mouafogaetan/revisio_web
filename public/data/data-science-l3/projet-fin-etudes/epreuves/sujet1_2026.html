<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Projet de Fin d'Études - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Définition et Cadrage du Projet",
      "points": "4 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'> <p>Une entreprise camerounaise de distribution de produits agricoles souhaite optimiser sa chaîne d'approvisionnement pour réduire les pertes post-récolte. Elle vous contacte pour mener un projet de Data Science.</p> <ol style='padding-left: 20px;'> <li>Formuler une <strong>problématique</strong> Data Science pertinente pour cette entreprise.</li> <li>Proposer un <strong>objectif SMART</strong> en lien avec cette problématique.</li> <li>Identifier le <strong>périmètre</strong> du projet en listant ce qui est inclus et ce qui est exclu.</li> <li>Définir les <strong>parties prenantes</strong> (stakeholders) de ce projet.</li> </ol> </div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> Formuler une problématique Data Science pertinente pour cette entreprise.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #10b981;'>\"Comment prédire les quantités de produits agricoles à stocker par région afin de minimiser les pertes post-récolte et d'optimiser la distribution ?\"</div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> Proposer un objectif SMART en lien avec cette problématique.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #f59e0b;'>\"Réduire les pertes post-récolte de 25 % dans les 12 mois suivant le déploiement du modèle, en utilisant les données de vente historiques et les prévisions météorologiques.\"</div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> Identifier le périmètre du projet (inclus/exclus).</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><p style='margin: 0;'><strong style='color: #34d399;'>✅ Inclus :</strong> Analyse des données de vente, modélisation prédictive, tableau de bord de suivi des stocks, rapport final.</p><p style='margin: 10px 0 0 0;'><strong style='color: #f87171;'>❌ Exclus :</strong> Changement du système de gestion de stock existant, formation des équipes terrain, développement d'une application mobile.</p></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>4)</span> Définir les parties prenantes de ce projet.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li><strong>Équipe Data Science</strong> (vous)</li><li><strong>Direction de l'entreprise</strong> (financement, validation)</li><li><strong>Responsables logistiques</strong> (utilisateurs finaux)</li><li><strong>Fournisseurs de données</strong> (météo, ventes)</li><li><strong>Les agriculteurs</strong> (impactés par les décisions)</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Revue de Littérature et Sources de Données",
      "points": "5 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'> <p>Vous devez mener une revue de littérature et identifier les sources de données pour votre projet de prédiction des prix du cacao au Cameroun.</p> <ol style='padding-left: 20px;'> <li>Proposer <strong>3 mots-clés</strong> pour une recherche bibliographique pertinente.</li> <li>Citer <strong>2 bases de données</strong> académiques où effectuer cette recherche.</li> <li>Identifier <strong>3 sources de données</strong> exploitables pour ce projet.</li> <li>Expliquer comment vous évalueriez la <strong>qualité</strong> des données identifiées.</li> </ol> </div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> Proposer 3 mots-clés pour une recherche bibliographique pertinente.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li>\"Cocoa price prediction\"</li><li>\"Machine learning agricultural commodities\"</li><li>\"Time series forecasting Cameroon\"</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> Citer 2 bases de données académiques où effectuer cette recherche.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li><strong>Google Scholar</strong></li><li><strong>IEEE Xplore</strong></li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> Identifier 3 sources de données exploitables pour ce projet.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li><strong>Données de l'Institut National de la Statistique (INS)</strong> - Production agricole</li><li><strong>Données météorologiques</strong> (Météo Cameroun, API)</li><li><strong>Données de prix</strong> (Marchés internationaux, sites spécialisés)</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>4)</span> Expliquer comment vous évalueriez la qualité des données identifiées.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><p style='margin: 0;'>La qualité des données serait évaluée selon les critères suivants :</p><ul style='margin: 5px 0 0 20px;'><li><strong>Complétude</strong> : taux de valeurs manquantes</li><li><strong>Exactitude</strong> : cohérence avec d'autres sources</li><li><strong>Actualité</strong> : périodicité des mises à jour</li><li><strong>Accessibilité</strong> : format, coût, conditions d'utilisation</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Choix et Justification des Modèles",
      "points": "5 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'> <p>Vous devez choisir des modèles pour prédire le taux de désabonnement (churn) des clients d'une compagnie de téléphonie mobile au Cameroun.</p> <ol style='padding-left: 20px;'> <li>Justifier le choix de <strong>3 modèles</strong> que vous testeriez.</li> <li>Expliquer quelles <strong>métriques</strong> vous utiliseriez pour évaluer et comparer les modèles.</li> <li>Décrire le <strong>protocole de validation</strong> que vous mettriez en place.</li> <li>Proposer une méthode pour <strong>optimiser les hyperparamètres</strong> du modèle sélectionné.</li> </ol> </div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> Justifier le choix de 3 modèles que vous testeriez.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li><strong>Régression Logistique</strong> : simple, interprétable, idéale pour la classification binaire</li><li><strong>Forêt Aléatoire (Random Forest)</strong> : robuste, gère les non-linéarités, bonne performance</li><li><strong>Gradient Boosting (XGBoost)</strong> : très performant, souvent utilisé en compétition</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> Expliquer quelles métriques vous utiliseriez pour évaluer et comparer les modèles.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><ul style='margin: 0; padding-left: 20px;'><li><strong>Précision (Accuracy)</strong> : taux global de bonnes prédictions</li><li><strong>Rappel (Recall)</strong> : capacité à détecter les vrais churns</li><li><strong>F1-Score</strong> : moyenne harmonique de la précision et du rappel</li><li><strong>AUC-ROC</strong> : performance du classifieur à différents seuils</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> Décrire le protocole de validation que vous mettriez en place.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><p style='margin: 0;'>J'utiliserais une <strong>validation croisée stratifiée à 10 plis</strong> (10-fold cross-validation) pour chaque modèle. Cela permet d'obtenir une estimation fiable de la performance et de réduire la variance des résultats. Les données seraient divisées en 70% entraînement et 30% test final.</p></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>4)</span> Proposer une méthode pour optimiser les hyperparamètres du modèle sélectionné.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0;'><p style='margin: 0;'>J'utiliserais la méthode <strong>Grid Search</strong> pour explorer de manière exhaustive une grille d'hyperparamètres définie, ou <strong>Random Search</strong> pour un échantillonnage aléatoire plus efficace. Pour XGBoost, les paramètres clés à optimiser seraient :</p><ul style='margin: 5px 0 0 20px;'><li><code>max_depth</code> : profondeur des arbres</li><li><code>learning_rate</code> : taux d'apprentissage</li><li><code>n_estimators</code> : nombre d'arbres</li><li><code>subsample</code> : proportion d'échantillons utilisés</li></ul></div>"
        }
      ]
    },
    {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
