<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Projet de Fin d'Études - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse d'une Problématique Data Science",
      "points": "6 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p><strong>Contexte :</strong> Vous êtes consultant en Data Science pour une <strong>coopérative agricole camerounaise</strong> qui souhaite optimiser sa production de cacao. La coopérative regroupe 500 producteurs répartis dans 10 villages de la région du Centre.</p><p>La coopérative dispose des données suivantes :</p><ul><li>Les volumes de production des 5 dernières années (par producteur et par village).</li><li>Les superficies cultivées par producteur.</li><li>Des données météorologiques (pluviométrie, température) issues d'une station locale.</li><li>Des données sur les prix de vente du cacao sur les marchés internationaux.</li></ul><p>L'objectif est de <strong>prédire les rendements</strong> pour mieux planifier les exportations.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> (2 pts) <strong>Identifier</strong> la problématique Data Science de ce projet. <strong>Formuler</strong> la question de recherche correspondante. (Verbe : <em>Identifier, Formuler</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Problématique :</strong> La coopérative agricole ne dispose pas d'un outil fiable pour anticiper ses volumes de production et optimiser ses exportations de cacao.</p><p><strong>Question de recherche :</strong> Est-il possible, à partir des données historiques de production, des superficies cultivées, des données météorologiques et des prix du marché, de développer un modèle prédictif capable d'estimer les rendements futurs de cacao pour aider la coopérative à planifier ses exportations ?</p></div>"
        },
        {
          "question": "<p><strong>1.2</strong> (2 pts) <strong>Définir</strong> les objectifs du projet et <strong>délimiter</strong> son périmètre. (Verbe : <em>Définir, Délimiter</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Objectifs :</strong></p><ul><li>Construire un modèle de régression pour prédire le rendement en cacao (kg/ha) par producteur.</li><li>Identifier les facteurs clés influençant la production (pluviométrie, type de sol, etc.).</li><li>Proposer un outil de visualisation pour aider la coopérative à prendre des décisions.</li></ul><p><strong>Périmètre :</strong></p><ul><li><strong>Inclus :</strong> Les données des 5 dernières années, les 10 villages, la prédiction des rendements.</li><li><strong>Exclus :</strong> L'analyse des maladies du cacao, la logistique de transport, la prédiction des prix.</li></ul></div>"
        },
        {
          "question": "<p><strong>1.3</strong> (2 pts) <strong>Justifier</strong> le choix d'une approche de régression plutôt qu'une approche de classification pour ce projet. (Verbe : <em>Justifier</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p>Le problème consiste à <strong>prédire une valeur continue</strong> (le rendement en kg/ha), et non à classer les producteurs dans des catégories (par exemple : \"bon rendement\" / \"mauvais rendement\").</p><p>La régression est appropriée car elle permet d'estimer des valeurs numériques précises, utiles pour la planification des exportations. La classification serait moins précise et perdrait l'information de l'ampleur des variations de rendement.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Collecte, Préparation, Modélisation et Évaluation",
      "points": "14 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p><strong>Contexte :</strong> Suite à l'analyse de la problématique, vous passez à la collecte et à la préparation des données pour le projet de prédiction des rendements de cacao.</p><p>Vous disposez maintenant d'un jeu de données contenant des informations sur 500 producteurs :</p><ul><li><strong>producteur_id</strong> : identifiant unique.</li><li><strong>village</strong> : nom du village (10 villages).</li><li><strong>superficie_ha</strong> : superficie cultivée en hectares.</li><li><strong>pluie_mm</strong> : pluviométrie annuelle en mm.</li><li><strong>temperature_c</strong> : température moyenne annuelle en °C.</li><li><strong>rendement_kg_ha</strong> : rendement en kg/ha (variable cible).</li><li><strong>prix_fcfa</strong> : prix du cacao sur le marché (FCFA/kg).</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> (2 pts) <strong>Identifier</strong> les sources de données possibles pour ce projet. (Verbe : <em>Identifier</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Sources de données :</strong></p><ul><li><strong>Données internes :</strong> Archives de la coopérative (production, superficies).</li><li><strong>Données météo :</strong> Stations météo locales ou données satellitaires (NASA, Meteosat).</li><li><strong>Données économiques :</strong> Marchés internationaux des matières premières (prix du cacao).</li><li><strong>Données de référence :</strong> Institut de Recherche Agricole pour le Cameroun (IRAD) pour les données agronomiques.</li></ul></div>"
        },
        {
          "question": "<p><strong>2.2</strong> (2 pts) Vous constatez que 15% des valeurs de la colonne <strong>pluie_mm</strong> sont manquantes. <strong>Proposer</strong> une stratégie de nettoyage et <strong>expliquer</strong> votre choix. (Verbe : <em>Proposer, Expliquer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Stratégie d'imputation :</strong></p><ul><li><strong>Imputation par la moyenne</strong> de la pluviométrie par village. Cette méthode est simple et préserve la variance des données.</li><li>Si les valeurs manquantes sont liées à une autre variable (ex: année), utiliser une <strong>imputation par régression</strong>.</li></ul><p><strong>Justification :</strong> La suppression des lignes serait inefficace (perte de données). La moyenne est une solution robuste pour un petit pourcentage de données manquantes.</p></div>"
        },
        {
          "question": "<p><strong>2.3</strong> (2 pts) Avant de construire un modèle, vous réalisez une Analyse Exploratoire (EDA). <strong>Identifier</strong> deux techniques de visualisation pertinentes pour analyser ce jeu de données et <strong>expliquer</strong> leur utilité. (Verbe : <em>Identifier, Expliquer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Visualisations :</strong></p><ul><li><strong>Histogramme</strong> du rendement pour visualiser sa distribution (symétrique ou asymétrique).</li><li><strong>Nuage de points (scatter plot)</strong> entre la pluie (pluie_mm) et le rendement (rendement_kg_ha) pour visualiser la relation entre les deux variables.</li><li><strong>Boxplot</strong> du rendement par village pour identifier les villages les plus performants.</li></ul></div>"
        },
        {
          "question": "<p><strong>2.4</strong> (2 pts) <strong>Décrire</strong> la procédure de validation croisée (k-fold cross-validation) et <strong>justifier</strong> son utilisation dans ce projet. (Verbe : <em>Décrire, Justifier</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Description :</strong> La validation croisée consiste à diviser les données en <em>k</em> sous-ensembles (folds) de taille égale. Pour chaque fold, on entraîne le modèle sur les <em>k-1</em> folds restants et on le valide sur le fold exclu. On répète l'opération <em>k</em> fois et on moyenne les performances.</p><p><strong>Justification :</strong> La validation croisée permet d'obtenir une évaluation plus robuste du modèle que le simple train/test split, surtout avec un échantillon de 500 observations.</p></div>"
        },
        {
          "question": "<p><strong>2.5</strong> (3 pts) Après entraînement, votre modèle de régression linéaire donne les résultats suivants : <strong>R² = 0.78</strong> et <strong>RMSE = 85 kg/ha</strong>. <strong>Interpréter</strong> ces deux métriques dans le contexte du projet. (Verbe : <em>Interpréter</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Interprétation du R² (0.78) :</strong> 78% de la variabilité du rendement en cacao est expliquée par le modèle (variables pluie, superficie, température). C'est un bon score, mais il reste 22% de variabilité non expliquée.</p><p><strong>Interprétation du RMSE (85 kg/ha) :</strong> En moyenne, la prédiction du rendement s'écarte de la valeur réelle de 85 kg/ha. Pour un rendement moyen de 800 kg/ha, cela représente une erreur d'environ 10%, ce qui est acceptable pour la planification des exportations.</p></div>"
        },
        {
          "question": "<p><strong>2.6</strong> (3 pts) <strong>Analyser</strong> les risques potentiels de ce modèle et <strong>proposer</strong> des solutions pour les atténuer. (Verbe : <em>Analyser, Proposer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Risques identifiés :</strong></p><ul><li><strong>Overfitting :</strong> Le modèle est trop complexe et ne généralise pas bien sur de nouvelles données (problème de données rares).</li><li><strong>Données obsolètes :</strong> Les données historiques ne reflètent pas les changements récents (climat, variétés de cacao).</li><li><strong>Biais géographique :</strong> Le modèle peut ne pas être performant dans des villages non représentés dans les données d'entraînement.</li><li><strong>Non-linéarité :</strong> La relation entre les variables météo et le rendement peut ne pas être linéaire.</li></ul><p><strong>Solutions :</strong></p><ul><li>Utiliser la <strong>régularisation</strong> (Ridge, Lasso) pour réduire le risque d'overfitting.</li><li>Mettre en place un <strong>monitoring continu</strong> du modèle en production pour détecter la dérive.</li><li>Collecter des données <strong>régulièrement</strong> et ré-entraîner le modèle périodiquement.</li><li>Utiliser des modèles non-linéaires (Random Forest, XGBoost) pour capturer les relations complexes.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
