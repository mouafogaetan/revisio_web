<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Projet de Fin d'Études - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 6 : Déploiement et Documentation",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Concepts fondamentaux du déploiement (Ressource)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice évalue votre compréhension des concepts et technologies clés pour le déploiement d'un modèle de Data Science, comme vus dans les leçons 16, 17 et 18.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (2 pts)</strong> Expliquez en vos propres termes la différence entre le déploiement d'un modèle via une <strong>API REST</strong> et via un <strong>conteneur Docker</strong>. Pour chaque méthode, citez un avantage majeur et un cas d'usage concret dans le contexte d'un projet de fin d'études.</p>",
         "reponse": "<p><strong>Différence :</strong> Une API REST est une interface qui expose le modèle comme un service accessible via des requêtes HTTP. Docker est une plateforme de containerisation qui empaquète le modèle, ses dépendances et son environnement d'exécution dans un conteneur isolé.</p><p><strong>Avantage d'une API :</strong> Légèreté et facilité de mise en œuvre. <strong>Cas d'usage :</strong> Mettre à disposition d'une application web interne le résultat d'un modèle de prédiction.</p><p><strong>Avantage de Docker :</strong> Assure la reproductibilité et la portabilité de l'environnement. <strong>Cas d'usage :</strong> Déployer un modèle sur différents serveurs (cloud ou locaux) sans risque de conflit de dépendances.</p>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> Pourquoi le <strong>monitoring</strong> et la <strong>documentation</strong> sont-ils des étapes cruciales après le déploiement d'un modèle ? Donnez un exemple de métrique à surveiller et un élément clé à documenter.</p>",
         "reponse": "<p><strong>Monitoring :</strong> Essentiel pour détecter en temps réel une éventuelle dégradation des performances du modèle due à une évolution des données (data drift) ou un changement de la relation cible-variables (concept drift). Un modèle qui n'est pas surveillé peut devenir obsolète et produire des résultats erronés. <strong>Exemple :</strong> Surveiller la latence moyenne des requêtes.</p><p><strong>Documentation :</strong> Cruciale pour assurer la reproductibilité, faciliter la maintenance, et permettre à d'autres personnes de comprendre et d'utiliser le projet. <strong>Exemple :</strong> Documenter le pipeline de déploiement (étapes, commandes, configuration).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Conception d'une solution de déploiement (Compétence)",
     "points": "6 pts",
     "enonce": "<p>Vous êtes data scientist dans une startup qui vient de développer un modèle de classification pour détecter les emails frauduleux. Ce modèle, entraîné en Python avec la bibliothèque scikit-learn, obtient d'excellentes performances. La startup souhaite le déployer en production pour le mettre à disposition de ses 500 clients entreprises.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (2 pts)</strong> Proposez une architecture de déploiement complète pour ce modèle. Décrivez les composants que vous utiliseriez (API, conteneur, cloud, base de données, etc.) et expliquez le rôle de chacun d'eux.</p>",
         "reponse": "<p><strong>Architecture proposée :</strong></p><ul><li><strong>API (FastAPI) :</strong> Expose le modèle via un endpoint /predict. Elle reçoit le contenu de l'email en JSON, le transforme, fait la prédiction et renvoie le résultat.</li><li><strong>Conteneur Docker :</strong> Empaquète l'API, le modèle sérialisé (pickle), et toutes les dépendances Python.</li><li><strong>Cloud Provider (AWS) :</strong> Héberge la solution. Utiliser ECS (Elastic Container Service) pour orchestrer le conteneur et assurer la scalabilité.</li><li><strong>Application Load Balancer (ALB) :</strong> Distribue les requêtes entrantes entre les différentes instances du conteneur.</li><li><strong>Base de données (RDS) :</strong> Stocke l'historique des requêtes et des prédictions pour analyse et monitoring (en respectant le RGPD).</li><li><strong>CloudWatch :</strong> Assure le monitoring des métriques (latence, taux d'erreur, utilisation CPU) et déclenche des alertes.</li></ul>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> Vous devez maintenant planifier la mise en production de cette solution. Décrivez les grandes étapes de votre stratégie de déploiement, en insistant sur la réduction des risques.</p>",
         "reponse": "<p><strong>Stratégie de déploiement (Blue-Green) :</strong></p><ol><li><strong>Environnement de test (staging) :</strong> Déployer la solution dans un environnement identique à la production pour effectuer les tests finaux (charges, intégration).</li><li><strong>Déploiement Blue-Green :</strong> Avoir deux environnements de production (Blue = actif, Green = nouveau). Déployer la nouvelle version sur l'environnement Green.</li><li><strong>Validation :</strong> Effectuer des tests de smoke test sur l'environnement Green. Basculer une petite partie du trafic (5%) vers Green pour un test A/B ou canary.</li><li><strong>Bascule :</strong> Si les tests sont concluants, basculer tout le trafic vers l'environnement Green. L'environnement Blue devient l'environnement de rollback.</li><li><strong>Monitoring :</strong> Surveiller intensivement les métriques après la bascule. Être prêt à rebasculer (rollback) rapidement en cas de problème.</li></ol>"
       },
       {
         "question": "<p><strong>3. (2 pts)</strong> L'un de vos clients se plaint que les prédictions du modèle ne sont plus aussi fiables qu'avant. Quelle est la cause probable ? Proposez un plan d'actions pour diagnostiquer et résoudre le problème.</p>",
         "reponse": "<p><strong>Cause probable :</strong> Dérive du concept (concept drift) ou dérive des données (data drift). Les emails frauduleux évoluent avec le temps, le modèle entraîné sur d'anciennes données perd en efficacité.</p><p><strong>Plan d'actions :</strong></p><ol><li><strong>Diagnostic :</strong> Analyser le Population Stability Index (PSI) pour détecter des changements dans la distribution des caractéristiques d'entrée. Comparer les performances du modèle avec un échantillon de données récentes (si des labels sont disponibles).</li><li><strong>Action immédiate :</strong> Si les performances se sont dégradées de manière critique, envisager de revenir (rollback) à une version antérieure plus stable.</li><li><strong>Action à court terme :</strong> Collecter de nouvelles données étiquetées (en collaborant avec les équipes de sécurité) et ré-entraîner le modèle en urgence.</li><li><strong>Action à long terme :</strong> Mettre en place un pipeline de ré-entraînement continu (automated retraining) mensuel ou trimestriel. Améliorer le monitoring avec des alertes sur la performance du modèle.</li></ol>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Rédaction d'une documentation technique (Compétence)",
     "points": "4 pts",
     "enonce": "<p>La startup de l'exercice précédent souhaite maintenant que vous documentiez le projet. Vous devez produire un guide à l'intention des développeurs qui seront chargés de la maintenance future.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (2 pts)</strong> Proposez une structure pour le guide du développeur, en listant les sections principales et en décrivant brièvement le contenu de chacune.</p>",
         "reponse": "<p><strong>Structure du guide :</strong></p><ul><li><strong>1. Introduction :</strong> Présentation du projet, objectifs, lien vers la documentation de l'API.</li><li><strong>2. Architecture :</strong> Diagramme d'architecture détaillé décrivant les composants (API, Docker, Cloud, BDD) et leurs interactions.</li><li><strong>3. Installation et Configuration :</strong> Instructions pour configurer l'environnement de développement en local, installer les dépendances, configurer les variables d'environnement.</li><li><strong>4. Déploiement :</strong> Étapes pour construire l'image Docker, la pousser sur le registre, et déployer sur le cloud.</li><li><strong>5. API :</strong> Spécification de l'API (Swagger/OpenAPI) avec exemples d'appels.</li><li><strong>6. Modèle :</strong> Description du modèle, algorithmes, métriques de performance, données d'entraînement, processus de ré-entraînement.</li><li><strong>7. Monitoring & Maintenance :</strong> Indicateurs à surveiller, alertes configurées, procédures de rollback.</li></ul>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> Pour la section relative au modèle, quelles informations techniques sont indispensables à documenter pour garantir la reproductibilité ?</p>",
         "reponse": "<p><strong>Informations indispensables :</strong></p><ul><li><strong>Version des bibliothèques :</strong> La version exacte de Python et des packages utilisés (scikit-learn, pandas, numpy, etc.), idéalement listée dans un fichier <code>requirements.txt</code>.</li><li><strong>Données d'entraînement :</strong> Description des données (source, période, transformations appliquées).</li><li><strong>Code d'entraînement :</strong> Le script exact utilisé pour entraîner le modèle.</li><li><strong>Paramètres du modèle :</strong> Les hyperparamètres choisis pour l'algorithme (ex: <code>n_estimators</code> pour une forêt aléatoire).</li><li><strong>Artéfacts du modèle :</strong> Le fichier du modèle sérialisé (ex: un fichier <code>.pkl</code>), versionné dans un registre de modèles.</li><li><strong>Métriques de performance :</strong> Les performances obtenues lors de la validation (ex: précision, rappel, F1-score sur l'ensemble de test).</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Mise en pratique (Déploiement simplifié) (Compétence)",
     "points": "6 pts",
     "enonce": "<p><strong>Contexte :</strong> Une ONG a développé un modèle de régression linéaire pour estimer les besoins en nourriture dans les zones rurales. Le modèle est simple et contient 3 caractéristiques (nombre d'habitants, distance au marché, taux de pluviométrie). Il a été sauvegardé dans un fichier nommé <code>food_need_model.pkl</code>. L'ONG souhaite le déployer rapidement et à moindre coût pour ses équipes terrain.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (3 pts)</strong> Écrivez le code Python d'une API minimaliste avec Flask ou FastAPI pour servir ce modèle. L'API doit :</p><ul><li>Charger le modèle au démarrage.</li><li>Disposer d'un endpoint <code>/predict</code> qui accepte une requête POST avec les 3 caractéristiques en format JSON.</li><li>Retourner une prédiction.</li></ul><p><strong>Exemple de requête attendue :</strong></p><pre>{\"habitants\": 1500, \"distance_marche\": 12.5, \"pluviometrie\": 450}</pre>",
         "reponse": "<pre><code>from flask import Flask, request, jsonify\nimport pickle\nimport numpy as np\n\napp = Flask(__name__)\n\n# Charger le modèle\nwith open('food_need_model.pkl', 'rb') as f:\n    model = pickle.load(f)\n\n@app.route('/predict', methods=['POST'])\ndef predict():\n    try:\n        # Récupérer les données\n        data = request.get_json()\n        \n        # Extraire les caractéristiques dans l'ordre\n        features = [\n            data['habitants'],\n            data['distance_marche'],\n            data['pluviometrie']\n        ]\n        \n        # Convertir en tableau numpy\n        input_data = np.array([features])\n        \n        # Faire la prédiction\n        prediction = model.predict(input_data)\n        \n        # Retourner le résultat\n        return jsonify({'prediction': float(prediction[0])})\n    except Exception as e:\n        return jsonify({'error': str(e)}), 400\n\nif __name__ == '__main__':\n    app.run(host='0.0.0.0', port=5000, debug=True)</code></pre>"
       },
       {
         "question": "<p><strong>2. (3 pts)</strong> Imaginez que le modèle de l'ONG soit déployé en production. Après quelques mois, vous remarquez que la distribution des caractéristiques a évolué : les distances au marché sont plus élevées en moyenne. Décrivez :</p><ul><li>Le type de drift que vous identifiez.</li><li>Ses conséquences potentielles sur les prédictions.</li><li>Les solutions de monitoring et de maintenance à mettre en place.</li></ul>",
         "reponse": "<p><strong>Type de drift :</strong> Il s'agit d'un <strong>data drift</strong> (dérive des données). La relation entre les caractéristiques et le besoin en nourriture reste la même, mais la distribution de la caractéristique \"distance au marché\" change.</p><p><strong>Conséquences :</strong> Le modèle, entraîné sur des données anciennes, peut sous-estimer ou surestimer les besoins pour les zones éloignées. Il devient moins précis et peut conduire à des décisions erronées de distribution.</p><p><strong>Solutions :</strong></p><ul><li><strong>Monitoring :</strong> Mettre en place une surveillance du PSI sur la caractéristique 'distance_marche'. Définir un seuil d'alerte.</li><li><strong>Maintenance :</strong> Planifier un ré-entraînement régulier du modèle (par exemple, tous les 6 mois) avec les nouvelles données collectées. Mettre en place un pipeline de ré-entraînement automatique si les ressources le permettent.</li><li><strong>Détection précoce :</strong> Si le drift est détecté, analyser les performances du modèle sur un échantillon de données récentes pour quantifier l'impact et décider de la fréquence de ré-entraînement.</li></ul>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
