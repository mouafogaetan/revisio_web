<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Projet de Fin d'Études - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Définition et Cadrage du Projet (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Vous êtes consultant en Data Science. Une entreprise de distribution d'eau au Cameroun vous sollicite pour optimiser la gestion de son réseau. Actuellement, les fuites d'eau représentent environ 30% de la production. L'entreprise souhaiterait développer un système de prédiction des zones à risque de fuite pour prioriser les interventions.</p><ol><li>Formulez la problématique métier et la question de recherche associée.</li><li>Identifiez les objectifs du projet et définissez son périmètre.</li><li>Proposez un cahier des charges fonctionnel simplifié en listant les fonctionnalités attendues.</li><li>Présentez le planning du projet sous forme d'un diagramme de Gantt simplifié avec les 5 étapes principales.</li></ol>",
      "questions": [
        {
          "question": "1) Formulez la problématique métier et la question de recherche associée.",
          "reponse": "<strong>Problématique métier :</strong> L'entreprise de distribution d'eau perd 30% de sa production à cause de fuites non détectées, ce qui génère des pertes financières et une mauvaise gestion des ressources en eau.<br><strong>Question de recherche :</strong> Comment prédire les zones à risque de fuite sur le réseau de distribution d'eau à partir des données historiques (pression, débit, âge des canalisations, données météorologiques, etc.) ?"
        },
        {
          "question": "2) Identifiez les objectifs du projet et définissez son périmètre.",
          "reponse": "<strong>Objectifs :</strong><br>- Développer un modèle de prédiction des zones à risque de fuite.<br>- Prioriser les interventions de maintenance.<br>- Réduire les pertes d'eau d'au moins 15% en 18 mois.<br><strong>Périmètre :</strong><br>- Se concentrer sur le réseau de distribution de la ville de Douala.<br>- Utiliser les données des 5 dernières années (pression, débit, âge des canalisations, données météorologiques).<br>- Le modèle produira une carte des zones à risque par quartier."
        },
        {
          "question": "3) Proposez un cahier des charges fonctionnel simplifié en listant les fonctionnalités attendues.",
          "reponse": "<strong>Fonctionnalités attendues :</strong><br>- Importation automatique des données de capteurs.<br>- Nettoyage et prétraitement des données.<br>- Visualisation des zones à risque sur une carte interactive.<br>- Génération d'alertes automatiques pour les zones critiques.<br>- Export des rapports de maintenance."
        },
        {
          "question": "4) Présentez le planning du projet sous forme d'un diagramme de Gantt simplifié avec les 5 étapes principales.",
          "reponse": "<div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><strong>Diagramme de Gantt simplifié :</strong><ul><li><strong>Étape 1 :</strong> Cadrage et collecte des données (2 semaines)</li><li><strong>Étape 2 :</strong> Nettoyage et préparation (3 semaines)</li><li><strong>Étape 3 :</strong> Modélisation et évaluation (4 semaines)</li><li><strong>Étape 4 :</strong> Déploiement et test (2 semaines)</li><li><strong>Étape 5 :</strong> Documentation et formation (1 semaine)</li></ul><p>Durée totale : 12 semaines</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Collecte et Préparation des Données (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Pour le projet de prédiction des fuites d'eau, les sources de données suivantes sont disponibles :<ul><li>Base de données SQL des débits et pressions mesurés par les capteurs (horodatage, valeur)</li><li>Fichier Excel avec l'âge et le matériau des canalisations (ID_canalisation, date_installation, matériau)</li><li>API météo (température, précipitations, humidité)</li><li>Rapports d'intervention des techniciens (PDF)</li></ul></p>",
      "questions": [
        {
          "question": "1) Pour chaque source de données, identifiez son type (structurée, semi-structurée, non structurée) et la méthode de collecte adaptée.",
          "reponse": "<ul><li><strong>Base de données SQL :</strong> Structurée - Connexion directe via SQLAlchemy ou API</li><li><strong>Fichier Excel :</strong> Structurée - Lecture avec pandas (pd.read_excel)</li><li><strong>API météo :</strong> Semi-structurée - Requête HTTP avec requests et parsing JSON</li><li><strong>Rapports PDF :</strong> Non structurée - Extractions avec PyPDF2 ou OCR (si nécessaire)</li></ul>"
        },
        {
          "question": "2) Proposez un plan de nettoyage des données pour chacune de ces sources.",
          "reponse": "<ul><li><strong>Base SQL :</strong> Supprimer les doublons, traiter les valeurs manquantes (interpolation pour les séries temporelles)</li><li><strong>Fichier Excel :</strong> Standardiser les formats de date, vérifier la cohérence (ex: matériaux valides)</li><li><strong>API météo :</strong> Gérer les erreurs d'appel API, imputer les données manquantes par la moyenne</li><li><strong>PDF :</strong> Extraire les informations textuelles, structurer en tableau (date, lieu, problème, solution)</li></ul>"
        },
        {
          "question": "3) Proposez 3 nouvelles features (Feature Engineering) à créer pour améliorer le modèle de prédiction.",
          "reponse": "<ul><li><strong>Âge de la canalisation :</strong> Annee_actuelle - Annee_installation</li><li><strong>Variation de pression :</strong> Pression_max - Pression_min sur une période donnée</li><li><strong>Indice de pluviométrie :</strong> Cumul des précipitations sur les 7 derniers jours</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Modélisation et Évaluation (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Après préparation des données, vous entraînez plusieurs modèles pour prédire les zones à risque de fuite. Voici les résultats obtenus :<br><br><table style='width:100%; border-collapse:collapse;'><tr style='background-color:#e0e0e0;'><th style='padding:8px; border:1px solid #ccc;'>Modèle</th><th style='padding:8px; border:1px solid #ccc;'>Accuracy</th><th style='padding:8px; border:1px solid #ccc;'>Précision</th><th style='padding:8px; border:1px solid #ccc;'>Recall</th><th style='padding:8px; border:1px solid #ccc;'>F1-Score</th></tr><tr><td style='padding:8px; border:1px solid #ccc;'>Régression Logistique</td><td style='padding:8px; border:1px solid #ccc;'>0.78</td><td style='padding:8px; border:1px solid #ccc;'>0.75</td><td style='padding:8px; border:1px solid #ccc;'>0.72</td><td style='padding:8px; border:1px solid #ccc;'>0.73</td></tr><tr><td style='padding:8px; border:1px solid #ccc;'>Random Forest</td><td style='padding:8px; border:1px solid #ccc;'>0.85</td><td style='padding:8px; border:1px solid #ccc;'>0.83</td><td style='padding:8px; border:1px solid #ccc;'>0.81</td><td style='padding:8px; border:1px solid #ccc;'>0.82</td></tr><tr><td style='padding:8px; border:1px solid #ccc;'>XGBoost</td><td style='padding:8px; border:1px solid #ccc;'>0.89</td><td style='padding:8px; border:1px solid #ccc;'>0.88</td><td style='padding:8px; border:1px solid #ccc;'>0.85</td><td style='padding:8px; border:1px solid #ccc;'>0.86</td></tr></table></p>",
      "questions": [
        {
          "question": "1) Justifiez le choix du modèle XGBoost par rapport aux autres modèles.",
          "reponse": "XGBoost est le meilleur modèle car :<br>- Il a la meilleure Accuracy (0.89) et F1-Score (0.86).<br>- Le F1-Score est particulièrement important car il équilibre précision et rappel, ce qui est essentiel pour minimiser les faux négatifs (fuites non détectées).<br>- L'écart entre précision et rappel est le plus faible (0.88 vs 0.85), indiquant un bon équilibre."
        },
        {
          "question": "2) Comparez les performances de la Régression Logistique et de Random Forest. Quelles conclusions en tirez-vous ?",
          "reponse": "Random Forest surpasse nettement la Régression Logistique sur toutes les métriques :<br>- Accuracy : +0.07<br>- F1-Score : +0.09<br>Conclusion : Les relations dans les données sont probablement non-linéaires, ce que Random Forest capture mieux que la régression logistique."
        },
        {
          "question": "3) Proposez une méthode d'optimisation des hyperparamètres pour améliorer XGBoost.",
          "reponse": "Méthode : Grid Search ou Random Search avec validation croisée (5-fold cross-validation).<br><strong>Hyperparamètres à optimiser :</strong><br>- n_estimators : [100, 200, 300]<br>- max_depth : [3, 5, 7]<br>- learning_rate : [0.01, 0.1, 0.2]<br>- subsample : [0.7, 0.8, 0.9]<br><strong>Objectif :</strong> Maximiser le F1-Score sur la validation croisée."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Déploiement et Documentation (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Le modèle XGBoost est retenu pour être déployé en production. L'entreprise souhaite que le modèle soit accessible via une API pour intégration dans son système de gestion.</p>",
      "questions": [
        {
          "question": "1) Décrivez les étapes pour déployer le modèle en production avec une API REST.",
          "reponse": "<strong>Étapes :</strong><br>1. Sérialiser le modèle entraîné (avec joblib ou pickle)<br>2. Créer une application web avec FastAPI ou Flask<br>3. Définir un endpoint POST (/predict) qui reçoit les données et renvoie la prédiction<br>4. Conteneuriser l'application avec Docker<br>5. Déployer sur un serveur (cloud ou local)<br>6. Tester l'API avec des requêtes de test<br>7. Mettre en place un monitoring de base"
        },
        {
          "question": "2) Quels éléments doit contenir la documentation du projet ?",
          "reponse": "<strong>Documentation :</strong><br>- README.md avec description du projet et instructions d'installation<br>- Documentation du code (docstrings, type hints)<br>- Rapport de projet (méthodologie, résultats, discussion)<br>- Guide utilisateur pour l'API<br>- Fichier requirements.txt pour les dépendances<br>- Dockerfile pour la reproduction de l'environnement"
        },
        {
          "question": "3) Expliquez comment assurer la reproductibilité du projet.",
          "reponse": "<strong>Reproductibilité :</strong><br>- Utiliser un environnement virtuel (venv, conda) avec versionnage des dépendances<br>- Versionner le code avec Git<br>- Stocker les données brutes (ou un échantillon) dans un dossier data/<br>- Utiliser un fichier requirements.txt ou environment.yml<br>- Documenter le pipeline complet (collecte → nettoyage → modélisation → déploiement)<br>- Inclure un script d'exécution qui reproduit les résultats"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Communication et Restitution (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Vous devez présenter les résultats de votre projet devant un jury mixte (enseignants et professionnels de l'entreprise de distribution d'eau).</p>",
      "questions": [
        {
          "question": "1) Structurez votre présentation de soutenance en 5 parties principales.",
          "reponse": "<ol><li><strong>Introduction et contexte</strong> (2 min) : Présenter le problème des fuites d'eau et son impact</li><li><strong>Méthodologie</strong> (4 min) : Sources de données, préparation, feature engineering, modèles testés</li><li><strong>Résultats</strong> (3 min) : Métriques de performance, comparaison des modèles, visualisations</li><li><strong>Déploiement et impact</strong> (2 min) : API, intégration, bénéfices attendus</li><li><strong>Conclusion et perspectives</strong> (2 min) : Limites, améliorations possibles</li></ol>"
        },
        {
          "question": "2) Anticipez 3 questions que le jury pourrait poser et proposez des réponses.",
          "reponse": "<strong>Question 1 : \"Comment justifiez-vous la fiabilité de votre modèle avec des données limitées ?\"</strong><br>Réponse : Nous avons utilisé la validation croisée à 5 plis pour évaluer la robustesse du modèle. Les résultats montrent un écart-type de ±0.02 sur le F1-Score, ce qui indique une bonne stabilité. De plus, nous avons complété les données avec des sources externes (météo, démographie) pour enrichir le jeu de données.<br><br><strong>Question 2 : \"Quel est l'impact financier attendu ?\"</strong><br>Réponse : Le modèle permet de prioriser les interventions. En réduisant le temps de détection des fuites, nous estimons une réduction des pertes d'eau de 15%, soit environ 100 millions de FCFA d'économies annuelles.<br><br><strong>Question 3 : \"Comment le modèle évolue-t-il dans le temps ?\"</strong><br>Réponse : Nous avons prévu un système de monitoring qui détecte le data drift (évolution des données) et le concept drift (évolution des relations). Un réentraînement automatique est planifié tous les 3 mois avec les nouvelles données."
        },
        {
          "question": "3) Que doivent contenir les livrables finaux du projet ?",
          "reponse": "<strong>Livrables :</strong><br>- Code source complet sur GitHub<br>- Rapport de projet détaillé (PDF)<br>- Présentation de soutenance (PowerPoint)<br>- Documentation API (Swagger/OpenAPI)<br>- Dockerfile et instructions de déploiement<br>- Jeu de données d'entraînement (anonymisé si nécessaire)<br>- Manuel utilisateur"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
