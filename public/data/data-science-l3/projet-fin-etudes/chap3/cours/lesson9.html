<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Choix des Modèles",
    "contenu": "<div style='display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; padding: 20px; border-radius: 16px;'> <h1 style='font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; color: #38bdf8;'>🤖 Choix des Modèles</h1> <h2 style='font-size: 1.5rem; font-weight: 300; margin-bottom: 20px; color: #cbd5e1;'>Projet de Fin d'Études - L3 Data Science</h2> <div style='background: #334155; padding: 15px 25px; border-radius: 40px; font-size: 1.1rem; color: #facc15; border: 1px solid #475569;'> Chapitre 3 - Modélisation </div> <p style='margin-top: 30px; font-size: 1.1rem; color: #94a3b8; max-width: 400px;'>\"Choisir le bon modèle, c'est comme choisir le bon outil pour un travail : cela détermine la qualité du résultat.\"</p> </div>",
    "texteParle": "Bonjour à toutes et à tous. Aujourd'hui, nous abordons une étape cruciale de tout projet de Data Science : le choix des modèles. C'est le moment où l'on décide quel algorithme de Machine Learning nous allons utiliser pour résoudre notre problématique. Ce choix n'est pas anodin, il détermine la pertinence et la performance de notre solution. Comme le dit le proverbe, bien choisir son outil, c'est déjà garantir la moitié du succès.",
    "note": "Introduction générale de la leçon sur le choix des modèles."
  },
  {
    "titre": "Objectifs de la Leçon",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0; border-left: 6px solid #3b82f6;'> <p style='font-weight: 600; color: #60a5fa; margin-bottom: 12px;'>🎯 À la fin de ce cours, vous saurez :</p> <ul style='list-style: none; padding: 0; margin: 0;'> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #3b82f6; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>1</span> <div><strong>Choisir les modèles adaptés</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Selon le type de problème et les données</span></div> </li> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #f59e0b; color: black; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>2</span> <div><strong>Justifier le choix des modèles</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Argumenter scientifiquement vos décisions</span></div> </li> <li style='background: #2d3748; margin-bottom: 0; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #10b981; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>3</span> <div><strong>Comprendre les notions clés</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Choix de modèles, justification, contexte</span></div> </li> </ul> </div>",
    "texteParle": "Les objectifs de cette leçon sont trois. D'abord, apprendre à choisir les modèles adaptés à notre problème en fonction du type de données et de la tâche à accomplir. Ensuite, savoir justifier ce choix de manière scientifique et argumentée. Enfin, maîtriser les notions clés comme le choix de modèles, la justification et le contexte d'application. Nous allons voir que choisir un modèle n'est pas un acte au hasard, mais une décision réfléchie.",
    "note": "Rappel des objectifs pédagogiques de la leçon."
  },
  {
    "titre": "Types de Modèles",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Les modèles se classent en plusieurs catégories :</p> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px;'> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 1.8rem;'>📊</span> <span style='font-weight: 600; color: #60a5fa;'>Supervisé</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Avec données étiquetées<br>Régression / Classification</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 1.8rem;'>🔍</span> <span style='font-weight: 600; color: #facc15;'>Non Supervisé</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Sans étiquettes<br>Clustering / Réduction</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 1.8rem;'>🏆</span> <span style='font-weight: 600; color: #10b981;'>Renforcement</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Apprentissage par essai-erreur<br>Jeux, robotique</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 1.8rem;'>🧠</span> <span style='font-weight: 600; color: #ec4899;'>Deep Learning</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Réseaux de neurones profonds<br>Images, NLP, Audio</span> </div> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 12px; border: 1px dashed #475569;'> <span style='font-size: 0.9rem;'>⚡ Le choix dépend du problème, des données et de la performance souhaitée</span> </div> </div>",
    "texteParle": "Les modèles de Machine Learning se classent en plusieurs grandes catégories. D'abord, l'apprentissage supervisé, où l'on dispose de données étiquetées pour faire de la régression ou de la classification. Ensuite, l'apprentissage non supervisé, où l'on cherche des structures cachées dans les données sans étiquettes, comme le clustering. Puis l'apprentissage par renforcement, basé sur un système de récompenses. Et enfin, le Deep Learning, avec des réseaux de neurones profonds pour des tâches complexes comme l'image ou le langage. Le choix dépendra de votre problème spécifique.",
    "note": "Présentation des grandes familles de modèles en Machine Learning."
  },
  {
    "titre": "Problème de Régression",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #3b82f6;'> <h4 style='margin: 0; color: #60a5fa;'>📈 Prédiction d'une valeur continue</h4> <p style='margin: 8px 0 0 0;'>Exemple : <strong>Prédire le prix d'une maison</strong> en fonction de sa superficie, du nombre de pièces, et de la localisation.</p> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔧 Modèles recommandés</h4> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>Régression Linéaire</strong> - Simple, interprétable</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>Régression Ridge / Lasso</strong> - Réduction des sur-apprentissages</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>Forêts Aléatoires (Random Forest)</strong> - Non linéaire, robuste</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px;'>✅ <strong>Gradient Boosting (XGBoost)</strong> - Performance élevée</li> </ul> </div> </div>",
    "texteParle": "Dans un problème de régression, nous cherchons à prédire une valeur numérique continue. Par exemple, prédire le prix d'une maison en fonction de sa superficie et de sa localisation. Pour ce type de problème, plusieurs modèles sont recommandés. La régression linéaire est simple et interprétable. La régression Ridge ou Lasso permet de réduire le sur-apprentissage. Les forêts aléatoires sont robustes et gèrent bien la non-linéarité. Et enfin, les modèles de Gradient Boosting comme XGBoost offrent généralement d'excellentes performances.",
    "note": "Présentation des modèles pour un problème de régression."
  },
  {
    "titre": "Problème de Classification",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #f59e0b;'> <h4 style='margin: 0; color: #fbbf24;'>🏷️ Prédiction d'une catégorie</h4> <p style='margin: 8px 0 0 0;'>Exemple : <strong>Détecter si un email est un spam</strong> ou non (classification binaire).</p> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔧 Modèles recommandés</h4> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>Régression Logistique</strong> - Simple, interprétable, probabiliste</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>SVM (Support Vector Machines)</strong> - Efficace pour séparer les classes</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>k-NN (k-Nearest Neighbors)</strong> - Basé sur la proximité</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px;'>✅ <strong>Arbres de Décision / Forêts</strong> - Interprétables et non linéaires</li> </ul> </div> </div>",
    "texteParle": "Dans un problème de classification, nous cherchons à assigner une étiquette ou une catégorie à chaque observation. Par exemple, détecter si un email est un spam ou non. Pour la classification, plusieurs modèles sont très utilisés. La régression logistique est simple et donne une probabilité, ce qui est pratique. Les SVM sont efficaces pour séparer les classes. Le k-NN classifie en fonction des voisins les plus proches. Et les arbres de décision et forêts aléatoires sont à la fois interprétables et performants.",
    "note": "Présentation des modèles pour un problème de classification."
  },
  {
    "titre": "Problème de Clustering",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #10b981;'> <h4 style='margin: 0; color: #34d399;'>🔗 Regrouper des données similaires</h4> <p style='margin: 8px 0 0 0;'>Exemple : <strong>Segmenter les clients d'une banque</strong> en groupes homogènes pour des offres personnalisées.</p> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔧 Modèles recommandés</h4> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>K-Means</strong> - Simple, efficace pour groupes sphériques</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>DBSCAN</strong> - Détecte les clusters de forme quelconque et les outliers</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>Clustering Hiérarchique</strong> - Construit une arborescence de clusters</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px;'>✅ <strong>Gaussian Mixture Models (GMM)</strong> - Approche probabiliste</li> </ul> </div> </div>",
    "texteParle": "Dans un problème de clustering, nous cherchons à regrouper des données similaires sans étiquettes préexistantes. Par exemple, segmenter les clients d'une banque pour proposer des offres personnalisées. Plusieurs modèles sont adaptés au clustering. Le K-Means est simple et efficace pour des groupes de forme sphérique. DBSCAN est plus flexible et détecte les valeurs aberrantes. Le clustering hiérarchique construit une arborescence de groupes. Et les GMM offrent une approche probabiliste. Le choix dépendra de la forme et de la distribution de vos données.",
    "note": "Présentation des modèles pour un problème de clustering."
  },
  {
    "titre": "Deep Learning",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ec4899;'> <h4 style='margin: 0; color: #f472b6;'>🧠 Réseaux de neurones profonds</h4> <p style='margin: 8px 0 0 0;'>Exemple : <strong>Reconnaître des visages</strong> sur des photos (classification d'images).</p> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔧 Modèles recommandés</h4> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>CNN (Convolutional Neural Networks)</strong> - Images, vidéos, vision par ordinateur</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>RNN (Recurrent Neural Networks)</strong> - Séries temporelles, texte, séquences</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px; margin-bottom: 6px;'>✅ <strong>LSTM / GRU</strong> - Gestion de la mémoire à long terme</li> <li style='background: #2d3748; padding: 10px; border-radius: 8px;'>✅ <strong>Transformers</strong> - NLP, BERT, GPT (modèles modernes)</li> </ul> </div> <div style='background: #7f1d1d; padding: 10px; border-radius: 12px; margin-top: 12px; border-left: 6px solid #ef4444;'> <span style='color: #f87171;'>⚠️ Nécessite beaucoup de données et de puissance de calcul</span> </div> </div>",
    "texteParle": "Le Deep Learning, ou apprentissage profond, utilise des réseaux de neurones avec plusieurs couches pour apprendre des représentations complexes des données. Par exemple, pour reconnaître des visages sur des photos. Les CNN sont spécialisés dans les images et la vision par ordinateur. Les RNN et leurs variantes LSTM sont utilisés pour les séries temporelles et le texte. Et les Transformers sont aujourd'hui la référence en traitement du langage naturel avec des modèles comme BERT ou GPT. Mais attention, ces modèles nécessivent beaucoup de données et de puissance de calcul.",
    "note": "Présentation des modèles de Deep Learning."
  },
  {
    "titre": "Critères de Choix",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Le choix d'un modèle dépend de plusieurs facteurs :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #3b82f6;'> <span style='font-size: 1.8rem;'>📊</span> <div><strong>Nature du problème</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Régression, classification, clustering, etc.</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #f59e0b;'> <span style='font-size: 1.8rem;'>💾</span> <div><strong>Volume et type de données</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Petit/grand jeu de données, structuré/non structuré</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #10b981;'> <span style='font-size: 1.8rem;'>🎯</span> <div><strong>Performance souhaitée</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Précision, rapidité, interprétabilité</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #ec4899;'> <span style='font-size: 1.8rem;'>⏱️</span> <div><strong>Contraintes techniques</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Temps, puissance de calcul, mémoire</span></div> </div> </div> </div>",
    "texteParle": "Le choix d'un modèle n'est jamais anodin. Il dépend de plusieurs critères. La nature du problème bien sûr : régression, classification, clustering ou autre. Le volume et le type de données : avez-vous beaucoup de données, sont-elles structurées ou non ? La performance souhaitée : recherchez-vous une grande précision, une rapidité d'exécution ou une bonne interprétabilité ? Et les contraintes techniques : quel temps avez-vous, quelle puissance de calcul, quelle mémoire disponible ? Tous ces éléments doivent guider votre décision.",
    "note": "Critères à prendre en compte pour choisir un modèle."
  },
  {
    "titre": "Interprétabilité vs Performance",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0;'>Un compromis fondamental en Data Science :</p> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 15px;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #3b82f6;'> <h4 style='margin: 0; color: #60a5fa;'>📖 Interprétabilité</h4> <ul style='list-style: none; padding: 0; text-align: left; font-size: 0.95rem;'> <li style='padding: 4px 0;'>✅ Régression Linéaire</li> <li style='padding: 4px 0;'>✅ Arbres de Décision</li> <li style='padding: 4px 0;'>✅ Régression Logistique</li> <li style='padding: 4px 0; color: #94a3b8; font-size: 0.85rem;'>On comprend facilement <br>les décisions du modèle</li> </ul> </div> <div style='background: #2d3748; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #10b981;'> <h4 style='margin: 0; color: #34d399;'>⚡ Performance</h4> <ul style='list-style: none; padding: 0; text-align: left; font-size: 0.95rem;'> <li style='padding: 4px 0;'>✅ XGBoost</li> <li style='padding: 4px 0;'>✅ Forêts Aléatoires</li> <li style='padding: 4px 0;'>✅ Réseaux de Neurones</li> <li style='padding: 4px 0; color: #94a3b8; font-size: 0.85rem;'>Meilleure précision <br>mais parfois \"boîte noire\"</li> </ul> </div> </div> <div style='background: #334155; padding: 12px; border-radius: 12px; text-align: center; margin-top: 15px; border: 1px solid #475569;'> <span style='color: #facc15;'>💡 Le choix dépend du contexte métier</span> </div> </div>",
    "texteParle": "En Data Science, il existe souvent un compromis entre interprétabilité et performance. Les modèles simples comme la régression linéaire ou les arbres de décision sont très interprétables : on comprend facilement comment ils prennent leurs décisions. Mais ils peuvent être moins performants. À l'inverse, des modèles complexes comme XGBoost ou les réseaux de neurones offrent généralement une meilleure précision, mais sont parfois considérés comme des 'boîtes noires' car leurs décisions sont plus difficiles à expliquer. Le choix dépend de votre contexte : dans un domaine comme la santé ou la finance, l'interprétabilité est souvent primordiale.",
    "note": "Compromis entre interprétabilité et performance des modèles."
  },
  {
    "titre": "Justification du Choix",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0;'>Pour justifier votre choix de modèle, vous devez répondre à ces questions :</p> <div style='display: flex; flex-direction: column; gap: 12px;'> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>1. Pourquoi ce modèle est-il adapté ?</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Il correspond à la nature du problème et aux données</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>2. Quels sont ses avantages ?</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Bonne performance, rapidité, interprétabilité, robustesse</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>3. Quelles sont ses limites ?</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Risque de sur-apprentissage, temps d'entraînement, mémoire</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>4. Quelles alternatives avez-vous envisagées ?</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Pourquoi avez-vous écarté les autres modèles ?</span> </div> </div> </div>",
    "texteParle": "Pour justifier votre choix de modèle, vous devez être capable de répondre à quatre questions. D'abord, pourquoi ce modèle est-il adapté à votre problème ? Ensuite, quels sont ses avantages par rapport aux autres ? Puis, quelles sont ses limites ou ses inconvénients ? Et enfin, quelles alternatives avez-vous envisagées et pourquoi les avez-vous écartées ? Cette justification est essentielle dans un rapport de projet pour démontrer la rigueur de votre démarche scientifique.",
    "note": "Éléments de justification pour le choix d'un modèle."
  },
  {
    "titre": "Exemple Concret Camerounais",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0; color: #fbbf24;'>🌍 Projet : Prédiction des Rendements Agricoles</h4> <p style='margin: 10px 0;'><strong>Contexte :</strong> Dans la région du Nord Cameroun, les agriculteurs peinent à anticiper leurs récoltes.</p> <div style='background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px;'> <span style='font-weight: 600;'>📊 Données disponibles :</span> Précipitations, température, type de sol, historique des rendements (2000-2024) </div> <div style='background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px;'> <span style='font-weight: 600;'>🎯 Objectif :</span> Prédire les rendements en kg/ha pour la saison à venir </div> <div style='background: #1e293b; padding: 12px; border-radius: 8px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>✅ Modèle choisi :</span> Forêt Aléatoire (Random Forest) - <span style='color: #94a3b8;'>Robuste, gère les non-linéarités, interprétable via l'importance des variables</span> </div> </div> </div>",
    "texteParle": "Prenons un exemple concret dans le contexte camerounais. Imaginez un projet de prédiction des rendements agricoles dans la région du Nord. Vous disposez de données sur les précipitations, la température, le type de sol et l'historique des rendements. L'objectif est de prédire les rendements pour la saison à venir. Dans ce cas, le modèle Random Forest serait un excellent choix : il est robuste, gère bien les relations non linéaires entre les variables, et permet d'identifier l'importance de chaque facteur sur le rendement. Une justification solide pour votre projet.",
    "note": "Application concrète du choix de modèle dans un contexte local."
  },
  {
    "titre": "À retenir",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; margin-bottom: 12px; padding: 15px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; border-left: 6px solid #3b82f6;'> <span style='font-size: 1.5rem; min-width: 30px;'>1️⃣</span> <div><strong>Le modèle s'adapte au problème</strong><br><span style='color: #94a3b8;'>Régression, classification, clustering, etc.</span></div> </li> <li style='background: #2d3748; margin-bottom: 12px; padding: 15px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; border-left: 6px solid #f59e0b;'> <span style='font-size: 1.5rem; min-width: 30px;'>2️⃣</span> <div><strong>Justifiez toujours votre choix</strong><br><span style='color: #94a3b8;'>Avantages, limites et alternatives envisagées</span></div> </li> <li style;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
