<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Calcul Stochastique et Processus Aléatoires - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Évaluation Séquentielle N°6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Processus de Poisson et Applications",
     "points": "6 pts",
     "enonce": "<p>Cet exercice porte sur les propriétés fondamentales du processus de Poisson et sa modélisation dans le contexte des files d'attente.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> Soit \\( (N_t)_{t \\geq 0} \\) un processus de Poisson d'intensité \\( \\lambda > 0 \\).</p><p><strong>a)</strong> Rappeler la définition des accroissements indépendants et stationnaires pour ce processus. [1 pt]</p>",
         "reponse": "<p><strong>a)</strong> Un processus de Poisson \\( (N_t) \\) a des accroissements indépendants : pour tous \\( 0 \\leq t_1 < t_2 < \\cdots < t_n \\), les variables \\( N_{t_1}, N_{t_2} - N_{t_1}, \\ldots, N_{t_n} - N_{t_{n-1}} \\) sont indépendantes. Il a des accroissements stationnaires : la loi de \\( N_{t+s} - N_t \\) ne dépend que de \\( s \\), et suit une loi de Poisson de paramètre \\( \\lambda s \\) [citation:3][citation:5].</p>"
       },
       {
         "question": "<p><strong>b)</strong> Démontrer que la fonction de covariance de \\( (N_t) \\) est donnée par \\( \\text{Cov}(N_s, N_t) = \\lambda \\min(s, t) \\). [1.5 pts]</p>",
         "reponse": "<p><strong>b)</strong> Pour \\( s \\leq t \\), on a \\( \\text{Cov}(N_s, N_t) = \\text{Cov}(N_s, N_s + (N_t - N_s)) = \\text{Var}(N_s) + \\text{Cov}(N_s, N_t - N_s) \\). Par indépendance des accroissements, la covariance est nulle, donc \\( \\text{Cov}(N_s, N_t) = \\text{Var}(N_s) = \\lambda s \\). Ainsi, \\( \\text{Cov}(N_s, N_t) = \\lambda \\min(s, t) \\) [citation:5].</p>"
       },
       {
         "question": "<p><strong>1.2</strong> Un centre d'appels reçoit des appels selon un processus de Poisson d'intensité \\( \\lambda = 2 \\) appels par minute.</p><p><strong>a)</strong> Quelle est la probabilité qu'aucun appel ne soit reçu pendant les 30 prochaines secondes ? [1 pt]</p>",
         "reponse": "<p><strong>a)</strong> Soit \\( t = 0.5 \\) minute. Le nombre d'appels \\( N_{0.5} \\) suit une loi de Poisson de paramètre \\( \\lambda t = 2 \\times 0.5 = 1 \\). La probabilité de ne recevoir aucun appel est \\( \\mathbb{P}(N_{0.5} = 0) = e^{-1} \\approx 0.3679 \\).</p>"
       },
       {
         "question": "<p><strong>b)</strong> Sachant qu'exactement un appel a été reçu pendant ces 30 secondes, quelle est la probabilité que cet appel ait eu lieu avant la 20e seconde ? [1.5 pts]</p>",
         "reponse": "<p><strong>b)</strong> Conditionnellement à \\( N_t = 1 \\), l'instant d'arrivée \\( T_1 \\) est uniformément distribué sur \\( [0, t] \\) [citation:7]. Donc \\( \\mathbb{P}(T_1 < 20 \\text{ sec} | N_{0.5} = 1) = \\frac{20}{30} = \\frac{2}{3} \\).</p>"
       },
       {
         "question": "<p><strong>c)</strong> Si les appels durent en moyenne 3 minutes, et en supposant une file d'attente M/M/1, quel est le taux d'occupation du système ? [1 pt]</p>",
         "reponse": "<p><strong>c)</strong> Le taux d'arrivée est \\( \\lambda = 2 \\) appels/min. Le taux de service est \\( \\mu = 1/3 \\) appel/min. Le taux d'occupation est \\( \\rho = \\lambda / \\mu = 2 / (1/3) = 6 \\). Comme \\( \\rho > 1 \\), le système est instable ; la file d'attente croît indéfiniment.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Mouvement Brownien et Intégrale d'Itô",
     "points": "7 pts",
     "enonce": "<p>Cet exercice explore les propriétés du mouvement brownien et l'application de la formule d'Itô.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> Soit \\( (B_t)_{t \\geq 0} \\) un mouvement brownien standard.</p><p><strong>a)</strong> Montrer que \\( \\mathbb{E}[B_t^4] = 3t^2 \\). [1.5 pts]</p>",
         "reponse": "<p><strong>a)</strong> La variable \\( B_t \\) suit une loi normale \\( \\mathcal{N}(0, t) \\). Le moment d'ordre 4 d'une variable normale centrée de variance \\( \\sigma^2 = t \\) est \\( 3\\sigma^4 = 3t^2 \\). [citation:8]</p>"
       },
       {
         "question": "<p><strong>b)</strong> Calculer la covariance \\( \\text{Cov}(B_s^2, B_t^2) \\) pour \\( 0 \\leq s \\leq t \\). En déduire que \\( \\text{Cov}(B_s^2, B_t^2) = 2s^2 \\). [1.5 pts]</p>",
         "reponse": "<p><strong>b)</strong> On a \\( \\text{Cov}(B_s^2, B_t^2) = \\mathbb{E}[B_s^2 B_t^2] - \\mathbb{E}[B_s^2]\\mathbb{E}[B_t^2] \\). Pour \\( s \\leq t \\), \\( B_t = B_s + (B_t - B_s) \\). En utilisant l'indépendance et les moments, on trouve \\( \\mathbb{E}[B_s^2 B_t^2] = \\mathbb{E}[B_s^4] + \\mathbb{E}[B_s^2]\\mathbb{E}[(B_t - B_s)^2] = 3s^2 + s(t-s) = s^2 + st \\). Donc \\( \\text{Cov}(B_s^2, B_t^2) = (s^2 + st) - (s)(t) = 2s^2 \\). [citation:8]</p>"
       },
       {
         "question": "<p><strong>c)</strong> Rappeler la propriété d'isométrie d'Itô pour l'intégrale stochastique. À quoi sert-elle ? [1 pt]</p>",
         "reponse": "<p><strong>c)</strong> L'isométrie d'Itô stipule que pour un processus adapté \\( (X_t) \\) tel que \\( \\mathbb{E}[\\int_0^T X_t^2 dt] < \\infty \\), on a \\( \\mathbb{E}\\left[\\left(\\int_0^T X_t dB_t\\right)^2\\right] = \\mathbb{E}\\left[\\int_0^T X_t^2 dt\\right] \\). Elle permet de calculer la variance d'une intégrale stochastique et est fondamentale pour l'analyse du risque en finance.</p>"
       },
       {
         "question": "<p><strong>2.2</strong> Soit \\( X_t = e^{\\sigma B_t - \\frac{1}{2}\\sigma^2 t} \\).</p><p><strong>a)</strong> En appliquant la formule d'Itô, montrer que \\( X_t \\) est une martingale. [2 pts]</p>",
         "reponse": "<p><strong>a)</strong> Posons \\( f(t, x) = e^{\\sigma x - \\frac{1}{2}\\sigma^2 t} \\). On a \\( \\partial_t f = -\\frac{1}{2}\\sigma^2 f \\), \\( \\partial_x f = \\sigma f \\), et \\( \\partial_{xx}^2 f = \\sigma^2 f \\). La formule d'Itô donne \\( dX_t = \\partial_t f dt + \\partial_x f dB_t + \\frac{1}{2}\\partial_{xx}^2 f (dB_t)^2 = (-\\frac{1}{2}\\sigma^2 f + \\frac{1}{2}\\sigma^2 f)dt + \\sigma f dB_t = \\sigma X_t dB_t \\). L'intégrale stochastique étant une martingale (sous réserve d'intégrabilité), \\( X_t \\) est une martingale [citation:5][citation:7].</p>"
       },
       {
         "question": "<p><strong>b)</strong> Calculer \\( \\mathbb{E}[X_t] \\) et identifier le processus obtenu. [1 pt]</p>",
         "reponse": "<p><strong>b)</strong> Par définition d'une martingale, \\( \\mathbb{E}[X_t] = \\mathbb{E}[X_0] = 1 \\). \\( X_t \\) est l'exponentielle de Doléans-Dade, ou le facteur de Radon-Nikodym pour un changement de probabilité (théorème de Girsanov). C'est un mouvement brownien géométrique d'espérance 1.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Équations Différentielles Stochastiques (EDS) et Chaines de Markov",
     "points": "7 pts",
     "enonce": "<p>Cet exercice aborde les concepts de résolution d'EDS et l'analyse d'une chaîne de Markov à temps continu.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> Soit l'EDS \\( dX_t = \\mu X_t dt + \\sigma X_t dB_t \\), avec \\( X_0 = x_0 > 0 \\).</p><p><strong>a)</strong> En utilisant la formule d'Itô sur \\( Y_t = \\ln X_t \\), résoudre cette EDS. Identifier le processus obtenu. [2 pts]</p>",
         "reponse": "<p><strong>a)</strong> Posons \\( f(x) = \\ln x \\). Alors \\( f'(x) = 1/x \\), \\( f''(x) = -1/x^2 \\). Par la formule d'Itô, \\( dY_t = (1/X_t)dX_t + \\frac{1}{2}(-1/X_t^2)(dX_t)^2 = (\\mu dt + \\sigma dB_t) - \\frac{1}{2}\\sigma^2 dt = (\\mu - \\frac{1}{2}\\sigma^2)dt + \\sigma dB_t \\). En intégrant, \\( Y_t = \\ln x_0 + (\\mu - \\frac{1}{2}\\sigma^2)t + \\sigma B_t \\). Donc \\( X_t = x_0 \\exp((\\mu - \\frac{1}{2}\\sigma^2)t + \\sigma B_t) \\), c'est un mouvement brownien géométrique [citation:8].</p>"
       },
       {
         "question": "<p><strong>b)</strong> On considère maintenant l'EDS d'Ornstein-Uhlenbeck : \\( dX_t = -\\theta X_t dt + \\sigma dB_t \\). Quelle est la principale caractéristique de ce processus par rapport à un mouvement brownien standard ? [1 pt]</p>",
         "reponse": "<p><strong>b)</strong> Le processus d'Ornstein-Uhlenbeck est un processus de retour vers la moyenne (mean-reverting). Il possède une distribution stationnaire gaussienne et sa variance est bornée, contrairement à celle du mouvement brownien qui croît linéairement avec le temps.</p>"
       },
       {
         "question": "<p><strong>3.2</strong> Soit une chaîne de Markov à temps continu \\( (X_t) \\) sur l'espace d'états \\( \\{0, 1\\} \\) avec la matrice de taux (générateur infinitésimal) suivante :</p><div class='math-block'><div class='math'>$$ Q = \\begin{pmatrix} -\\lambda & \\lambda \\\\ \\mu & -\\mu \\end{pmatrix}, \\quad \\lambda, \\mu > 0 $$</div></div>",
         "reponse": "<p><strong>a)</strong> La distribution stationnaire \\( \\pi = (\\pi_0, \\pi_1) \\) est la solution de \\( \\pi Q = 0 \\) et \\( \\pi_0 + \\pi_1 = 1 \\). \\( \\pi Q = 0 \\) donne \\( -\\lambda \\pi_0 + \\mu \\pi_1 = 0 \\) et \\( \\lambda \\pi_0 - \\mu \\pi_1 = 0 \\). On en déduit \\( \\lambda \\pi_0 = \\mu \\pi_1 \\). Donc \\( \\pi_0 = \\frac{\\mu}{\\lambda + \\mu} \\) et \\( \\pi_1 = \\frac{\\lambda}{\\lambda + \\mu} \\).</p>"
       },
       {
         "question": "<p><strong>a)</strong> Déterminer la distribution stationnaire \\( \\pi = (\\pi_0, \\pi_1) \\) de cette chaîne. [1.5 pts]</p>",
         "reponse": "<p><strong>b)</strong> Un processus de naissance et de mort est une CMTC où les transitions ne peuvent se faire que vers les états voisins (généralement \\( i \\to i+1 \\) et \\( i \\to i-1 \\)). La CMTC à deux états est un cas particulier, car elle permet les transitions \\( 0 \\to 1 \\) (naissance) et \\( 1 \\to 0 \\) (mort). La classification d'un état est immédiate : si \\( \\lambda > 0 \\) et \\( \\mu > 0 \\), la chaîne est irréductible et tous les états sont positifs récurrents (car une distribution stationnaire existe).</p>"
       },
       {
         "question": "<p><strong>b)</strong> Comment cette chaîne peut-elle être interprétée comme un processus de naissance et de mort ? Classifier ses états en fonction de \\( \\lambda \\) et \\( \\mu \\). [1.5 pts]</p>",
         "reponse": "<p><strong>c)</strong> Cette chaîne modélise l'état d'un système qui alterne entre deux modes (ex: système de fiabilité avec un état \"en marche\" et un état \"en panne\"). C'est aussi une base pour des modèles plus complexes en biologie (gène activé/désactivé) ou en finance (régime-switching).</p>"
       },
       {
         "question": "<p><strong>c)</strong> Citer une application concrète en Data Science où un tel modèle à deux états pourrait être utile. [1 pt]</p>",
         "reponse": ""
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
