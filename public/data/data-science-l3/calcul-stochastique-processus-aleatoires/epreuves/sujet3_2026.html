<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Calcul Stochastique et Processus Aléatoires - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Mouvement Brownien et Processus de Wiener",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Le <strong>mouvement brownien</strong> (ou <strong>processus de Wiener</strong>) est l'un des processus stochastiques les plus fondamentaux en calcul stochastique. Il est caractérisé par des accroissements indépendants et stationnaires, de loi normale.</p> <p>Soit <span class='math'>\\( (W_t)_{t \\geq 0} \\)</span> un mouvement brownien standard. On rappelle que pour <span class='math'>\\( 0 \\leq s < t \\)</span>, <span class='math'>\\( W_t - W_s \\sim \\mathcal{N}(0, t-s) \\)</span>.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>1. (2 pts)</strong> Calculer, en justifiant, la covariance <span class='math'>\\( \\text{Cov}(W_s, W_t) \\)</span> pour <span class='math'>\\( 0 \\leq s \\leq t \\)</span>. En déduire la fonction de covariance du processus.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>On a <span class='math'>\\( W_s = W_s - W_0 \\)</span> et <span class='math'>\\( W_t = W_s + (W_t - W_s) \\)</span>. Par indépendance des accroissements :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ \\text{Cov}(W_s, W_t) = \\text{Cov}(W_s, W_s) + \\text{Cov}(W_s, W_t - W_s) = \\text{Var}(W_s) = s $$</div> </div> <p>La fonction de covariance est donc <span class='math'>\\( \\text{Cov}(W_s, W_t) = \\min(s, t) \\)</span>.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>2. (2 pts)</strong> Énoncer les propriétés de <strong>continuité des trajectoires</strong> et de <strong>non-différentiabilité</strong> du mouvement brownien. Expliquer brièvement pourquoi ces propriétés sont importantes pour la modélisation.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Le mouvement brownien possède des trajectoires <strong>continues</strong> mais <strong>nulle part différentiables</strong>.</p> <ul style='padding-left: 1.5rem;'> <li><strong>Continuité :</strong> Les trajectoires sont continues en tout point <span class='math'>\\( t \\)</span>. Cela signifie qu'il n'y a pas de sauts brusques, ce qui est réaliste pour modéliser des phénomènes physiques comme le mouvement de particules.</li> <li><strong>Non-différentiabilité :</strong> La dérivée n'existe en aucun point. Cela reflète l'irrégularité et la nature fractale des trajectoires. Cette propriété est cruciale en finance car elle rend les modèles de variation de prix très sensibles aux chocs et justifie l'utilisation du calcul d'Itô.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>3. (2 pts)</strong> Soit <span class='math'>\\( X_t = \\mu t + \\sigma W_t \\)</span> un mouvement brownien avec dérive. Déterminer la loi de <span class='math'>\\( X_t \\)</span> et donner son espérance et sa variance.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Puisque <span class='math'>\\( W_t \\sim \\mathcal{N}(0, t) \\)</span>, on a :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ X_t \\sim \\mathcal{N}(\\mu t, \\sigma^2 t) $$</div> </div> <p>L'espérance est <span class='math'>\\( \\mathbb{E}[X_t] = \\mu t \\)</span> et la variance est <span class='math'>\\( \\text{Var}(X_t) = \\sigma^2 t \\)</span>.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Processus de Poisson et Applications",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Le <strong>processus de Poisson</strong> est un processus de comptage utilisé pour modéliser des événements aléatoires dans le temps.</p> <p>Soit <span class='math'>\\( (N_t)_{t \\geq 0} \\)</span> un processus de Poisson d'intensité <span class='math'>\\( \\lambda > 0 \\)</span>. On rappelle que pour tout <span class='math'>\\( t > 0 \\)</span>, <span class='math'>\\( N_t \\sim \\mathcal{P}(\\lambda t) \\)</span>.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>1. (2 pts)</strong> Définir un processus de Poisson composé. Donner un exemple concret d'application dans le domaine de l'assurance.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Un <strong>processus de Poisson composé</strong> est défini par :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ Y_t = \\sum_{i=1}^{N_t} X_i $$</div> </div> <p>où <span class='math'>\\( (N_t) \\)</span> est un processus de Poisson d'intensité <span class='math'>\\( \\lambda \\)</span> et les <span class='math'>\\( X_i \\)</span> sont des variables aléatoires i.i.d. indépendantes de <span class='math'>\\( N_t \\)</span>.</p> <p><strong>Exemple en assurance :</strong> <span class='math'>\\( N_t \\)</span> représente le nombre de sinistres survenus jusqu'à l'instant <span class='math'>\\( t \\)</span>, et <span class='math'>\\( X_i \\)</span> le montant du <span class='math'>\\( i \\)</span>-ème sinistre. La variable <span class='math'>\\( Y_t \\)</span> modélise alors le montant total des sinistres.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>2. (2 pts)</strong> Soit <span class='math'>\\( T_n \\)</span> le temps d'arrivée du <span class='math'>\\( n \\)</span>-ème événement. Rappeler la loi des inter-arrivées <span class='math'>\\( \\tau_i = T_i - T_{i-1} \\)</span> et donner sa fonction de densité.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Les inter-arrivées <span class='math'>\\( \\tau_i \\)</span> sont indépendantes et suivent une <strong>loi exponentielle</strong> de paramètre <span class='math'>\\( \\lambda \\)</span>.</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ f_{\\tau}(x) = \\lambda e^{-\\lambda x}, \\quad x \\geq 0 $$</div> </div> <p>Cette propriété est fondamentale car elle caractérise l'absence de mémoire du processus de Poisson.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>3. (2 pts)</strong> Dans une file d'attente, les arrivées suivent un processus de Poisson d'intensité <span class='math'>\\( \\lambda = 2 \\)</span> clients par minute. Calculer la probabilité qu'il y ait <strong>exactement 5 arrivées</strong> en 3 minutes.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>On a <span class='math'>\\( \\lambda = 2 \\)</span> et <span class='math'>\\( t = 3 \\)</span> min, donc <span class='math'>\\( \\lambda t = 6 \\)</span>.</p> <p>La probabilité est donnée par la loi de Poisson :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ \\mathbb{P}(N_3 = 5) = \\frac{e^{-6} \\cdot 6^5}{5!} $$</div> </div> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ \\mathbb{P}(N_3 = 5) = \\frac{e^{-6} \\cdot 7776}{120} \\approx 0.1606 $$</div> </div> <p>La probabilité est donc d'environ <strong>16,06 %</strong>.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations Différentielles Stochastiques",
      "points": "8 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Les <strong>équations différentielles stochastiques</strong> (EDS) sont l'outil central pour modéliser l'évolution de systèmes soumis à des perturbations aléatoires.</p> <p>On considère l'EDS suivante :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ dX_t = \\mu X_t dt + \\sigma X_t dW_t, \\quad X_0 = x_0 > 0 $$</div> </div> <p>où <span class='math'>\\( \\mu \\)</span> et <span class='math'>\\( \\sigma \\)</span> sont des constantes, et <span class='math'>\\( (W_t) \\)</span> est un mouvement brownien standard.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>1. (2 pts)</strong> Identifier le type de cette EDS. Quel est le nom du processus solution ?</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>Il s'agit d'une <strong>EDS linéaire</strong> avec coefficient multiplicatif. Le processus solution est le <strong>mouvement brownien géométrique</strong>.</p> <p>Ce processus est très utilisé en finance pour modéliser le prix des actifs financiers.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>2. (3 pts)</strong> Résoudre explicitement cette EDS en utilisant la <strong>formule d'Itô</strong>. On rappelle que pour <span class='math'>\\( f \\in C^2 \\)</span> :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ df(X_t) = f'(X_t) dX_t + \\frac{1}{2} f''(X_t) d\\langle X, X \\rangle_t $$</div> </div> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>On applique la formule d'Itô à <span class='math'>\\( f(x) = \\ln(x) \\)</span>.</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ d(\\ln X_t) = \\frac{1}{X_t} dX_t - \\frac{1}{2X_t^2} d\\langle X, X \\rangle_t $$</div> </div> <p>On a <span class='math'>\\( d\\langle X, X \\rangle_t = \\sigma^2 X_t^2 dt \\)</span> car <span class='math'>\\( d\\langle W, W \\rangle_t = dt \\)</span>.</p> <p>Donc :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ d(\\ln X_t) = \\left(\\mu - \\frac{\\sigma^2}{2}\\right) dt + \\sigma dW_t $$</div> </div> <p>En intégrant entre 0 et <span class='math'>\\( t \\)</span> :</p> <div class='math-block' style='background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 0.5rem 0; text-align: center;'> <div class='math'>$$ X_t = X_0 \\exp\\left(\\left(\\mu - \\frac{\\sigma^2}{2}\\right)t + \\sigma W_t\\right) $$</div> </div> </div>"
        },
        {
          "question": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p><strong>3. (3 pts)</strong> Donner l'espérance et la variance de <span class='math'>\\( X_t \\)</span>. En déduire la condition pour que le processus soit une martingale.</p> </div>",
          "reponse": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'> <p>On a <span class='math'>\\( \\ln X_t \\sim \\mathcal{N}\\left(\\ln X_0 + (\\mu - \\frac{\\sigma^2}{2})t, \\sigma^2 t\\right) \\)</span>.</p> <p>Donc <span class='math'>\\( X_t \\)</span> suit une loi log-normale :</p> <ul style='padding-left: 1.5rem;'> <li><span class='math'>\\( \\mathbb{E}[X_t] = X_0 e^{\\mu t} \\)</span></li> <li><span class='math'>\\( \\text{Var}(X_t) = X_0^2 e^{2\\mu t} (e^{\\sigma^2 t} - 1) \\)</span></li> </ul> <p>Pour que <span class='math'>\\( X_t \\)</span> soit une martingale, il faut que <span class='math'>\\( \\mathbb{E}[X_t | \\mathcal{F}_s] = X_s \\)</span>, ce qui est équivalent à <span class='math'>\\( \\mu = 0 \\)</span>.</p> <p>Ainsi, le processus <span class='math'>\\( X_t = X_0 e^{-\\frac{\\sigma^2}{2}t + \\sigma W_t} \\)</span> est une martingale exponentielle.</p> </div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
