<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Calcul Stochastique et Processus Aléatoires - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4 - Application des Processus Stochastiques en Data Science",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Processus de Poisson et Files d'Attente (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Un centre d'appels reçoit en moyenne 60 appels par heure. La durée moyenne d'un appel est de 4 minutes. On suppose que les arrivées suivent un processus de Poisson et que la durée des appels suit une loi exponentielle. Le centre dispose d'un seul opérateur.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décrire le processus d'arrivée des appels. Quelle est la loi du nombre d'appels reçus en une heure ? (1 pt)</p>",
          "reponse": "<p>Le nombre d'appels reçus en une heure suit une loi de Poisson de paramètre $\\lambda = 60$. La probabilité d'avoir $k$ appels en une heure est $P(N(1)=k) = e^{-60} \\frac{60^k}{k!}$.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Calculer l'intensité de trafic $\\rho$ du système. Que peut-on en déduire ? (1 pt)</p>",
          "reponse": "<p>$\\lambda = 60$ appels/heure = 1 appel/minute. $\\mu = 1/4 = 0.25$ appel/minute. $\\rho = \\lambda / \\mu = 1 / 0.25 = 4$. Comme $\\rho > 1$, le système est instable : la file d'attente va croître indéfiniment.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Combien d'opérateurs supplémentaires faut-il pour que le système soit stable (c'est-à-dire $\\rho < 1$) ? (1 pt)</p>",
          "reponse": "<p>Pour que le système soit stable, il faut $\\rho < 1$, soit $c \\times \\mu > \\lambda$, où $c$ est le nombre d'opérateurs. On a $\\lambda = 1$, $\\mu = 0.25$, donc $c \\times 0.25 > 1$, soit $c > 4$. Il faut donc $c \\geq 5$ opérateurs. Soit 4 opérateurs supplémentaires.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Avec 4 opérateurs (soit 5 au total), calculer la probabilité que le système soit vide à l'équilibre. (1 pt)</p>",
          "reponse": "<p>Pour une file $M/M/c$, avec $c = 5$, $\\lambda = 1$ et $\\mu = 0.25$, on a $\\rho = \\lambda/(c\\mu) = 1/(5 \\times 0.25) = 1/1.25 = 0.8$.</p><p>$\\pi_0 = \\left[ \\sum_{k=0}^{c-1} \\frac{(c\\rho)^k}{k!} + \\frac{(c\\rho)^c}{c!(1-\\rho)} \\right]^{-1}$</p><p>$\\pi_0 = \\left[ \\sum_{k=0}^{4} \\frac{(5 \\times 0.8)^k}{k!} + \\frac{(5 \\times 0.8)^5}{5!(1-0.8)} \\right]^{-1}$</p><p>$\\pi_0 = \\left[ \\sum_{k=0}^{4} \\frac{4^k}{k!} + \\frac{4^5}{120 \\times 0.2} \\right]^{-1} = \\left[ (1 + 4 + 8 + 10.67 + 10.67) + \\frac{1024}{24} \\right]^{-1}$</p><p>$\\pi_0 = [34.34 + 42.67]^{-1} = [77.01]^{-1} \\approx 0.013$</p><p>La probabilité que le système soit vide est d'environ $1.3\\%$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement Brownien et Modèle de Black-Scholes (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Le prix d'une action est modélisé par un mouvement brownien géométrique : $S_t = S_0 \\exp\\left(\\left(\\mu - \\frac{\\sigma^2}{2}\\right)t + \\sigma W_t\\right)$ où $W_t$ est un mouvement brownien standard.</p><p>On donne : $S_0 = 100$ FCFA, $\\mu = 10\\%$, $\\sigma = 25\\%$ et $r = 4\\%$.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Calculer l'espérance de $S_t$ et sa variance. (1 pt)</p>",
          "reponse": "<p>$\\mathbb{E}[S_t] = S_0 e^{\\mu t} = 100 e^{0.1t}$.</p><p>$\\text{Var}(S_t) = S_0^2 e^{2\\mu t} (e^{\\sigma^2 t} - 1) = 10000 e^{0.2t} (e^{0.0625t} - 1)$.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Déterminer la probabilité que le prix de l'action soit supérieur à $120$ FCFA dans un an. (1 pt)</p>",
          "reponse": "<p>$P(S_1 > 120) = P\\left(100 \\exp\\left(\\left(0.1 - \\frac{0.0625}{2}\\right) \\times 1 + 0.25 W_1\\right) > 120\\right)$</p><p>$= P\\left(\\exp(0.06875 + 0.25 W_1) > 1.2\\right)$</p><p>$= P(0.06875 + 0.25 W_1 > \\ln(1.2)) = P(0.25 W_1 > 0.1823 - 0.06875)$</p><p>$= P(W_1 > 0.4542) = 1 - \\Phi(0.4542) \\approx 1 - 0.675 = 0.325$.</p><p>La probabilité est d'environ $32.5\\%$.</p>"
        },
        {
          "question": "<p><strong>3.</strong> En utilisant la formule de Black-Scholes, calculer le prix d'une option call européenne de prix d'exercice $K = 110$ FCFA et de maturité $T = 1$ an. (2 pts)</p>",
          "reponse": "<p>$d_1 = \\frac{\\ln(S_0/K) + (r + \\sigma^2/2)T}{\\sigma\\sqrt{T}} = \\frac{\\ln(100/110) + (0.04 + 0.0625/2) \\times 1}{0.25}$</p><p>$d_1 = \\frac{-0.0953 + 0.07125}{0.25} = -0.0962$</p><p>$d_2 = d_1 - \\sigma\\sqrt{T} = -0.0962 - 0.25 = -0.3462$</p><p>$N(d_1) = 0.4617$, $N(d_2) = 0.3646$</p><p>$C = S_0 N(d_1) - K e^{-rT} N(d_2) = 100 \\times 0.4617 - 110 \\times e^{-0.04} \\times 0.3646$</p><p>$C = 46.17 - 110 \\times 0.9608 \\times 0.3646 = 46.17 - 38.54 = 7.63$ FCFA</p><p>Le prix de l'option call est d'environ $7.63$ FCFA.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Interpréter le delta de l'option. (1 pt)</p>",
          "reponse": "<p>Le delta de l'option est $\\Delta = N(d_1) \\approx 0.462$. Cela signifie que si le prix de l'action augmente de 1 FCFA, le prix de l'option augmentera d'environ 0.462 FCFA. Le delta représente la sensibilité du prix de l'option par rapport au prix du sous-jacent.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Processus de Lévy et Applications (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Un processus de Lévy est un processus stochastique à accroissements indépendants et stationnaires. On considère un processus de Poisson composé défini par $X_t = \\sum_{k=1}^{N_t} Y_k$, où $N_t$ est un processus de Poisson de paramètre $\\lambda$ et $(Y_k)$ sont des variables aléatoires i.i.d. indépendantes de $N_t$.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Donner la fonction caractéristique de $X_t$. (1 pt)</p>",
          "reponse": "<p>La fonction caractéristique de $X_t$ est : $\\varphi_{X_t}(u) = \\exp\\left(\\lambda t (\\varphi_Y(u) - 1)\\right)$, où $\\varphi_Y$ est la fonction caractéristique des $Y_k$.</p>"
        },
        {
          "question": "<p><strong>2.</strong> On suppose que les $Y_k$ suivent une loi exponentielle de paramètre $\\alpha > 0$. Déterminer la fonction caractéristique de $X_t$. (1 pt)</p>",
          "reponse": "<p>$\\varphi_Y(u) = \\frac{\\alpha}{\\alpha - iu}$.</p><p>Donc $\\varphi_{X_t}(u) = \\exp\\left(\\lambda t \\left(\\frac{\\alpha}{\\alpha - iu} - 1\\right)\\right) = \\exp\\left(\\frac{\\lambda t \\, iu}{\\alpha - iu}\\right)$.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Calculer l'espérance et la variance de $X_t$. (1 pt)</p>",
          "reponse": "<p>$\\mathbb{E}[X_t] = \\lambda t \\, \\mathbb{E}[Y_1] = \\lambda t / \\alpha$.</p><p>$\\text{Var}(X_t) = \\lambda t \\, \\mathbb{E}[Y_1^2] = \\lambda t \\times \\frac{2}{\\alpha^2}$.</p>"
        },
        {
          "question": "<p><strong>4.</strong> En finance, quel type de phénomène peut-on modéliser avec un processus de Poisson composé ? (1 pt)</p>",
          "reponse": "<p>Un processus de Poisson composé est utilisé pour modéliser des phénomènes avec des sauts aléatoires, comme les mouvements soudains du prix d'un actif financier (ex: annonces économiques, catastrophes naturelles). Il permet de capturer les discontinuités dans les séries financières.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Chaînes de Markov à Temps Continu et Détection de Ruptures (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On considère une chaîne de Markov à temps continu à deux états : 0 (système en fonctionnement) et 1 (système en panne). Les taux de transition sont $q_{01} = \\lambda > 0$ et $q_{10} = \\mu > 0$.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Définir le générateur infinitésimal $Q$ de la chaîne. (1 pt)</p>",
          "reponse": "<p>$Q = \\begin{pmatrix} -\\lambda & \\lambda \\\\ \\mu & -\\mu \\end{pmatrix}$</p>"
        },
        {
          "question": "<p><strong>2.</strong> Déterminer la distribution stationnaire $\\pi$. (1 pt)</p>",
          "reponse": "<p>$\\pi Q = 0$ donne : $\\pi_0 (-\\lambda) + \\pi_1 \\mu = 0$ et $\\pi_0 \\lambda - \\pi_1 \\mu = 0$.</p><p>Donc $\\pi_0 \\lambda = \\pi_1 \\mu$ et $\\pi_0 + \\pi_1 = 1$.</p><p>D'où $\\pi_0 = \\frac{\\mu}{\\lambda + \\mu}$ et $\\pi_1 = \\frac{\\lambda}{\\lambda + \\mu}$.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Interpréter la probabilité $\\pi_0$ en termes de fiabilité du système. (1 pt)</p>",
          "reponse": "<p>$\\pi_0$ est la proportion de temps où le système fonctionne à long terme. C'est la disponibilité du système (ou fiabilité).</p>"
        },
        {
          "question": "<p><strong>4.</strong> Comment peut-on utiliser ce modèle pour détecter une rupture de comportement du système ? (1 pt)</p>",
          "reponse": "<p>On peut surveiller les taux de transition $\\lambda$ et $\\mu$. Une rupture (changement) serait détectée si ces taux changent significativement dans le temps. Par exemple, une augmentation soudaine de $\\lambda$ (plus de pannes) ou une diminution de $\\mu$ (réparations plus lentes) indiquerait un problème. Les modèles CUSUM ou de Page peuvent être appliqués pour détecter ces changements de paramètres.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Modèle de Volatilité Stochastique (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Le modèle de Heston est un modèle de volatilité stochastique défini par :</p><p>$dS_t = \\mu S_t dt + \\sqrt{V_t} S_t dW_t^1$</p><p>$dV_t = \\kappa(\\theta - V_t)dt + \\xi \\sqrt{V_t} dW_t^2$</p><p>avec $\\langle dW_t^1, dW_t^2 \\rangle = \\rho dt$.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Expliquer le rôle de chaque paramètre du modèle. (1 pt)</p>",
          "reponse": "<p>- $\\mu$ : taux de rendement moyen de l'actif.<br>- $\\kappa$ : vitesse de retour vers la moyenne de la volatilité.<br>- $\\theta$ : niveau moyen de la volatilité à long terme.<br>- $\\xi$ : volatilité de la volatilité (ou 'vol of vol').<br>- $\\rho$ : corrélation entre les deux mouvements browniens.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Pourquoi ce modèle est-il plus réaliste que le modèle de Black-Scholes pour modéliser les actifs financiers ? (1 pt)</p>",
          "reponse": "<p>Le modèle de Black-Scholes suppose une volatilité constante, ce qui n'est pas réaliste. Le modèle de Heston permet à la volatilité de varier dans le temps et d'être corrélée avec les rendements de l'actif. Cela permet de mieux capturer les phénomènes de 'smile de volatilité' observés sur les marchés.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Proposer une méthode pour estimer les paramètres du modèle à partir de données de prix observées. (1 pt)</p>",
          "reponse": "<p>Une méthode courante est l'estimation par maximum de vraisemblance (MLE) ou par la méthode des moments généralisée (GMM). On peut aussi utiliser des filtres de Kalman pour estimer la volatilité latente et les paramètres du modèle.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
