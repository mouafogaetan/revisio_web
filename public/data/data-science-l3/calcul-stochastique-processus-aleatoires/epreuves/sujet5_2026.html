<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Calcul Stochastique et Processus Aléatoires - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Processus de Poisson et Renouvellement (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les concepts fondamentaux des processus de Poisson et de renouvellement vus en cours.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1.1 Processus de Poisson Homogène (3 pts)</strong></div><div style='margin-bottom: 10px;'>Soit \\( (N_t)_{t \\geq 0} \\) un processus de Poisson homogène d'intensité \\( \\lambda > 0 \\).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Rappeler la définition d'un processus de Poisson homogène en termes d'accroissements et donner la loi de \\( N_t \\).</div><div style='margin-bottom: 8px;'><strong>b)</strong> On note \\( T_1, T_2, \\ldots \\) les temps d'arrivée. Quelle est la loi de \\( T_1 \\) ? Et celle de \\( T_n - T_{n-1} \\) pour \\( n \\geq 2 \\) ? Justifier brièvement.</div><div style='margin-bottom: 8px;'><strong>c)</strong> Soient \\( 0 \\leq s < t \\). Calculer \\( \\text{Cov}(N_s, N_t) \\).</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> Un processus de Poisson homogène d'intensité \\( \\lambda \\) est un processus de comptage tel que :<ul><li>\\( N_0 = 0 \\) p.s.</li><li>Il a des accroissements indépendants.</li><li>Pour \\( 0 \\leq s < t \\), \\( N_t - N_s \\sim \\mathcal{P}(\\lambda (t-s)) \\).<br>Ainsi, \\( N_t \\sim \\mathcal{P}(\\lambda t) \\).</li></ul><strong>b)</strong> Les temps d'inter-arrivée \\( T_1, T_2 - T_1, \\ldots \\) sont indépendants et suivent une loi exponentielle de paramètre \\( \\lambda \\), i.e., \\( T_1 \\sim \\mathcal{E}(\\lambda) \\) et \\( T_n - T_{n-1} \\sim \\mathcal{E}(\\lambda) \\). Cela découle de la propriété de l'absence de mémoire du processus de Poisson.</div>",
          "question": "<div style='margin-bottom: 8px;'><strong>d)</strong> Énoncer et démontrer la propriété de l'absence de mémoire pour le temps d'attente \\( T_1 \\) dans le cas d'un processus de Poisson.</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'>La propriété d'absence de mémoire s'énonce : pour \\( s, t \\geq 0 \\), \\( \\mathbb{P}(T_1 > s + t \\mid T_1 > s) = \\mathbb{P}(T_1 > t) \\).<br>Preuve : \\( \\mathbb{P}(T_1 > s+t \\mid T_1 > s) = \\frac{\\mathbb{P}(T_1 > s+t)}{\\mathbb{P}(T_1 > s)} = \\frac{e^{-\\lambda(s+t)}}{e^{-\\lambda s}} = e^{-\\lambda t} = \\mathbb{P}(T_1 > t) \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1.2 Processus de Renouvellement (3 pts)</strong></div><div style='margin-bottom: 10px;'>Soit \\( (X_n)_{n \\geq 1} \\) une suite de variables aléatoires indépendantes et de même loi (i.i.d.) de fonction de répartition \\( F \\) et d'espérance \\( \\mu = \\mathbb{E}[X_1] > 0 \\). On définit le processus de renouvellement \\( (N_t)_{t \\geq 0} \\) par \\( N_t = \\sup\\{n \\geq 0 : S_n \\leq t\\} \\), avec \\( S_0 = 0 \\) et \\( S_n = X_1 + \\ldots + X_n \\).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Définir la fonction de renouvellement \\( m(t) \\).</div><div style='margin-bottom: 8px;'><strong>b)</strong> Écrire l'équation de renouvellement satisfaite par \\( m(t) \\) et l'interpréter.</div><div style='margin-bottom: 8px;'><strong>c)</strong> Énoncer le théorème de renouvellement élémentaire. Que donne-t-il dans le cas où \\( X_1 \\sim \\mathcal{E}(\\lambda) \\) ?</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> La fonction de renouvellement est \\( m(t) = \\mathbb{E}[N_t] = \\sum_{n=1}^{+\\infty} F^{\\star n}(t) \\), où \\( F^{\\star n} \\) est la n-ième convolution de \\( F \\). Elle représente le nombre moyen de renouvellements jusqu'au temps \\( t \\).</div><div style='margin-top: 10px;'><strong>b)</strong> L'équation de renouvellement est \\( m(t) = F(t) + \\int_0^t m(t-x) \\, dF(x) \\).</div><div style='margin-top: 10px;'><strong>c)</strong> Le théorème de renouvellement élémentaire stipule que \\( \\frac{m(t)}{t} \\to \\frac{1}{\\mu} \\) lorsque \\( t \\to +\\infty \\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement Brownien et Intégrale d'Itô (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Les questions suivantes portent sur le mouvement brownien et l'intégrale stochastique d'Itô.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2.1 Mouvement Brownien (2.5 pts)</strong></div><div style='margin-bottom: 10px;'>Soit \\( (W_t)_{t \\geq 0} \\) un mouvement brownien standard (processus de Wiener).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Donner les trois propriétés caractéristiques d'un mouvement brownien.</div><div style='margin-bottom: 8px;'><strong>b)</strong> Calculer la covariance \\( \\text{Cov}(W_s, W_t) \\) pour \\( s, t \\geq 0 \\).</div><div style='margin-bottom: 8px;'><strong>c)</strong> Soit \\( X_t = \\mu t + \\sigma W_t \\) un mouvement brownien avec dérive. Calculer \\( \\mathbb{E}[X_t] \\) et \\( \\text{Var}(X_t) \\).</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> Un mouvement brownien standard est un processus stochastique à temps continu tel que :<ul><li>\\( W_0 = 0 \\) p.s.</li><li>Les accroissements sont indépendants et stationnaires : pour \\( 0 \\leq s < t \\), \\( W_t - W_s \\sim \\mathcal{N}(0, t-s) \\).</li><li>Les trajectoires sont continues p.s.</li></ul></div><div style='margin-top: 10px;'><strong>b)</strong> Pour \\( s \\leq t \\), \\( \\text{Cov}(W_s, W_t) = \\mathbb{E}[W_s W_t] = \\mathbb{E}[W_s (W_t - W_s + W_s)] = \\mathbb{E}[W_s^2] = s \\). Donc, pour \\( s, t \\geq 0 \\), \\( \\text{Cov}(W_s, W_t) = \\min(s, t) \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2.2 Intégrale d'Itô et Formule d'Itô (3.5 pts)</strong></div><div style='margin-bottom: 10px;'>On considère le processus \\( X_t \\) défini par l'équation différentielle stochastique (EDS) : \\( dX_t = \\mu X_t \\, dt + \\sigma X_t \\, dW_t \\), avec \\( X_0 > 0 \\) (mouvement brownien géométrique).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Quelle est la solution de cette EDS ? Justifier en utilisant la formule d'Itô avec la fonction \\( f(t, x) = \\ln(x) \\).</div><div style='margin-bottom: 8px;'><strong>b)</strong> Calculer \\( \\mathbb{E}[X_t] \\).</div><div style='margin-bottom: 8px;'><strong>c)</strong> Soit \\( Y_t = \\int_0^t W_s \\, dW_s \\). Calculer \\( Y_t \\) en utilisant la formule d'Itô.</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> La solution est \\( X_t = X_0 \\exp\\left(\\left(\\mu - \\frac{\\sigma^2}{2}\\right)t + \\sigma W_t\\right) \\). En posant \\( f(t, x) = \\ln(x) \\), on a \\( \\partial_t f = 0 \\), \\( \\partial_x f = 1/x \\), \\( \\partial_{xx}^2 f = -1/x^2 \\). Par la formule d'Itô : \\( d(\\ln X_t) = \\frac{1}{X_t} dX_t + \\frac{1}{2} \\left(-\\frac{1}{X_t^2}\\right) (dX_t)^2 = \\frac{1}{X_t} (\\mu X_t dt + \\sigma X_t dW_t) - \\frac{1}{2X_t^2} (\\sigma^2 X_t^2 dt) = (\\mu - \\frac{\\sigma^2}{2}) dt + \\sigma dW_t \\). En intégrant, on obtient le résultat.</div><div style='margin-top: 10px;'><strong>b)</strong> \\( \\mathbb{E}[X_t] = X_0 e^{\\mu t} \\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations Différentielles Stochastiques (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice traite des équations différentielles stochastiques et de leur résolution.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>3.1 EDS Linéaire (2.5 pts)</strong></div><div style='margin-bottom: 10px;'>On considère l'équation d'Ornstein-Uhlenbeck : \\( dX_t = -\\theta X_t \\, dt + \\sigma \\, dW_t \\), avec \\( X_0 = x_0 \\), \\( \\theta > 0 \\), \\( \\sigma > 0 \\).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Résoudre cette EDS en utilisant la méthode du facteur intégrant.</div><div style='margin-bottom: 8px;'><strong>b)</strong> Calculer \\( \\mathbb{E}[X_t] \\) et \\( \\text{Var}(X_t) \\).</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'>La solution est donnée par \\( X_t = x_0 e^{-\\theta t} + \\sigma \\int_0^t e^{-\\theta (t-s)} \\, dW_s \\).</div><div style='margin-top: 10px;'><strong>b)</strong> \\( \\mathbb{E}[X_t] = x_0 e^{-\\theta t} \\) et \\( \\text{Var}(X_t) = \\frac{\\sigma^2}{2\\theta} (1 - e^{-2\\theta t}) \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>3.2 Schéma d'Euler-Maruyama (2.5 pts)</strong></div><div style='margin-bottom: 10px;'>On souhaite simuler numériquement l'EDS suivante : \\( dX_t = a(X_t) \\, dt + b(X_t) \\, dW_t \\).</div><div style='margin-bottom: 8px;'><strong>a)</strong> Décrire le schéma d'Euler-Maruyama pour cette EDS en donnant la formule de discrétisation.</div><div style='margin-bottom: 8px;'><strong>b)</strong> Donner un exemple d'application de ce schéma pour l'équation d'Ornstein-Uhlenbeck.</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> Le schéma d'Euler-Maruyama s'écrit, pour une discrétisation de pas \\( \\Delta t > 0 \\) : \\( X_{n+1} = X_n + a(X_n) \\Delta t + b(X_n) \\Delta W_n \\), où \\( \\Delta W_n = W_{t_{n+1}} - W_{t_n} \\sim \\mathcal{N}(0, \\Delta t) \\).</div><div style='margin-top: 10px;'><strong>b)</strong> Pour l'équation \\( dX_t = -\\theta X_t \\, dt + \\sigma \\, dW_t \\), le schéma est : \\( X_{n+1} = X_n - \\theta X_n \\Delta t + \\sigma \\Delta W_n = (1 - \\theta \\Delta t) X_n + \\sigma \\Delta W_n \\).</div>"

    {
      "titre": "Exercice 4 : Processus de Lévy et Chaînes de Markov à Temps Continu (3 pts)",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Questions de cours et applications sur les processus de Lévy et les chaînes de Markov à temps continu.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 8px;'><strong>4.1 Processus de Lévy (1.5 pt)</strong></div><div style='margin-bottom: 8px;'><strong>a)</strong> Définir un processus de Lévy.</div><div style='margin-bottom: 8px;'><strong>b)</strong> Citer trois exemples de processus de Lévy.</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> Un processus de Lévy est un processus stochastique à temps continu, issu de 0, dont les accroissements sont indépendants et stationnaires, et dont les trajectoires sont continues en probabilité.</div><div style='margin-top: 10px;'><strong>b)</strong> Des exemples sont : le mouvement brownien, le processus de Poisson (composé) et les processus alpha-stables.</div>"

        {
          "question": "<div style='margin-bottom: 8px;'><strong>4.2 Chaînes de Markov à temps continu (CMTC) (1.5 pt)</strong></div><div style='margin-bottom: 8px;'><strong>a)</strong> Qu'est-ce que la matrice des taux de transition (générateur infinitésimal) d'une CMTC à espace d'états fini ?</div><div style='margin-bottom: 8px;'><strong>b)</strong> Soit une CMTC de générateur \\( Q \\). Que signifie l'équation \\( \\pi Q = 0 \\) ?</div>",
          "reponse": "<div style='background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px;'><strong>Corrigé :</strong></div><div style='margin-top: 10px;'><strong>a)</strong> La matrice des taux de transition \\( Q = (q_{ij}) \\) est telle que \\( q_{ij} \\geq 0 \\) pour \\( i \\neq j \\) est le taux de transition de l'état \\( i \\) à l'état \\( j \\), et \\( q_{ii} = -\\sum_{j \\neq i} q_{ij} \\).</div><div style='margin-top: 10px;'><strong>b)</strong> L'équation \\( \\pi Q = 0 \\) définit la distribution stationnaire \\( \\pi \\) de la CMTC, c'est-à-dire une distribution de probabilité qui est invariante dans le temps.</div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
