<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Transfert Learning pour la Vision",
    "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px;'> <h1 style='font-size: 1.8rem; margin-bottom: 20px; color: #2c3e50;'>🧠 Transfert Learning pour la Vision</h1> <div style='background: linear-gradient(135deg, #8e44ad, #6c3483); padding: 30px; border-radius: 15px; color: white; margin: 20px 0; width: 100%;'> <p style='font-size: 1.2rem; margin: 0;'>Leçon 13 - Computer Vision (Introduction)</p> <p style='font-size: 1rem; margin-top: 10px; opacity: 0.9;'>Licence 3 Data Science - Cameroun</p> </div> <div style='background: #ecf0f1; padding: 20px; border-radius: 10px; width: 100%; margin-top: 15px;'> <h3 style='color: #2c3e50; margin: 0;'>🎯 Objectifs de la leçon</h3> <ul style='text-align: left; color: #2c3e50;'> <li>Appliquer le transfert learning avec CNN pré-entraînés</li> <li>Utiliser ResNet, VGG, Inception pré-entraînés</li> <li>Maîtriser la technique du fine-tuning</li> </ul> </div> </div>",
    "texteParle": "Bonjour à tous. Bienvenue dans ce cours sur le transfert learning pour la vision par ordinateur. Aujourd'hui, nous allons découvrir l'une des techniques les plus puissantes du deep learning : comment réutiliser des modèles pré-entraînés sur des millions d'images pour résoudre nos propres problèmes de vision, même avec peu de données. Nous allons explorer les architectures célèbres comme VGG, ResNet et Inception, et apprendre à les adapter à nos besoins spécifiques grâce au fine-tuning. Cette approche a révolutionné le domaine en rendant la vision par ordinateur accessible à tous, même sans ressources de calcul énormes.",
    "note": "Le transfert learning est l'une des techniques les plus importantes en deep learning pour la vision."
  },
  {
    "titre": "Pourquoi le Transfert Learning ?",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🤔 Pourquoi le Transfert Learning ?</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Les défis du deep learning</h3> <ul style='color: #2c3e50;'> <li><strong>Données :</strong> Besoin de milliers/millions d'images étiquetées</li> <li><strong>Temps :</strong> Entraînement de plusieurs jours/semaines</li> <li><strong>Ressources :</strong> GPUs puissants nécessaires</li> <li><strong>Expertise :</strong> Ajustement des hyperparamètres complexe</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>La solution</h3> <ul style='color: #2c3e50;'> <li>Utiliser des modèles <strong>pré-entraînés</strong> sur de grands datasets</li> <li>Réutiliser les <strong>caractéristiques apprises</strong></li> <li>Adapter le modèle à votre tâche spécifique</li> <li><strong>Résultat :</strong> Moins de données, moins de temps, meilleures performances</li> </ul> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>À retenir :</strong> Le transfert learning permet de partir d'une solution déjà performante pour l'adapter à votre problème</p> </div> </div>",
    "texteParle": "Pourquoi avons-nous besoin du transfert learning ? Tout simplement parce que l'entraînement d'un réseau de neurones profond à partir de zéro est un défi de taille. Il faut énormément de données étiquetées, des semaines d'entraînement, et des ressources de calcul considérables. Le transfert learning offre une solution élégante : au lieu de partir de zéro, on part d'un modèle déjà entraîné sur des millions d'images. Ce modèle a déjà appris à reconnaître des caractéristiques générales comme les bords, les textures, les formes, et même des concepts plus complexes. On va simplement l'adapter à notre tâche spécifique, ce qui est bien plus rapide et nécessite beaucoup moins de données.",
    "note": "Le transfert learning est particulièrement utile quand vous avez peu de données pour votre tâche spécifique."
  },
  {
    "titre": "Les Architectures Célèbres",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🏛️ Architectures Pré-entraînées</h2> <div style='display: grid; grid-template-columns: 1fr; gap: 12px; margin: 10px 0;'> <div style='background: #f8f9fa; padding: 12px; border-radius: 10px; border-left: 4px solid #3498db;'> <h3 style='color: #2c3e50; margin: 0; font-size: 1rem;'>VGG (2014)</h3> <ul style='color: #2c3e50; margin: 5px 0;'> <li>Très simple et régulier</li> <li>16-19 couches avec des convolutions 3×3</li> <li>Performant mais <strong>lourd</strong> (~140 Mo)</li> </ul> </div> <div style='background: #e8f4fd; padding: 12px; border-radius: 10px; border-left: 4px solid #e74c3c;'> <h3 style='color: #2c3e50; margin: 0; font-size: 1rem;'>ResNet (2015)</h3> <ul style='color: #2c3e50; margin: 5px 0;'> <li>Introduit les <strong>connexions résiduelles</strong></li> <li>Permet des réseaux très profonds (50-152 couches)</li> <li>Excellent compromis performance/poids</li> </ul> </div> <div style='background: #d4edda; padding: 12px; border-radius: 10px; border-left: 4px solid #27ae60;'> <h3 style='color: #2c3e50; margin: 0; font-size: 1rem;'>Inception (GoogleNet, 2014)</h3> <ul style='color: #2c3e50; margin: 5px 0;'> <li>Utilise des <strong>modules Inception</strong></li> <li>Convolutions de différentes tailles en parallèle</li> <li>Très efficace en termes de paramètres</li> </ul> </div> </div> <div style='background: #fff3cd; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Remarque :</strong> Ces modèles sont disponibles dans torchvision, keras, etc.</p> </div> </div>",
    "texteParle": "Plusieurs architectures de réseaux de neurones sont devenues des références en vision par ordinateur. VGG est apprécié pour sa simplicité et sa régularité, mais il est assez lourd en mémoire. ResNet a révolutionné le domaine avec ses connexions résiduelles qui permettent d'entraîner des réseaux très profonds. Inception, ou GoogleNet, utilise des modules qui combinent des convolutions de différentes tailles pour une meilleure efficacité. Ces modèles sont tous disponibles pré-entraînés dans les bibliothèques comme torchvision, keras ou tensorflow, ce qui facilite grandement leur utilisation.",
    "note": "ResNet a popularisé les connexions résiduelles qui permettent d'entraîner des réseaux très profonds."
  },
  {
    "titre": "Pourquoi les Modèles Fonctionnent-ils ?",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🔬 Pourquoi ça marche ?</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Hiérarchie des caractéristiques</h3> <ul style='color: #2c3e50;'> <li><strong>Couches précoces :</strong> Bords, couleurs, textures (génériques)</li> <li><strong>Couches intermédiaires :</strong> Formes, parties d'objets</li> <li><strong>Couches profondes :</strong> Concepts sémantiques, objets complets</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Transfert de connaissances</h3> <p style='color: #2c3e50;'>Les caractéristiques apprises sur ImageNet (1000 classes d'objets) sont <strong>universelles</strong> et utiles pour de nombreuses tâches</p> <ul style='color: #2c3e50;'> <li>Reconnaissance de visages</li> <li>Détection d'objets</li> <li>Classification médicale</li> <li>Analyse de scènes</li> </ul> </div> <div style='background: #d4edda; padding: 15px; radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>Principe :</strong> Les couches précoces apprennent des caractéristiques universelles, réutilisables pour d'autres tâches</p> </div> </div>",
    "texteParle": "Pourquoi les modèles pré-entraînés fonctionnent-ils si bien ? Parce qu'ils apprennent une hiérarchie de caractéristiques. Les premières couches du réseau détectent des motifs simples comme les bords ou les couleurs. Les couches intermédiaires reconnaissent des formes ou des parties d'objets. Les couches profondes identifient des concepts complets comme des visages ou des animaux. Ces caractéristiques sont universelles : un modèle entraîné sur ImageNet sait déjà reconnaître des bords, des textures, des formes, ce qui est utile pour n'importe quelle tâche de vision. C'est comme si vous appreniez d'abord les lettres et les syllabes avant d'apprendre à lire des mots complexes.",
    "note": "Les caractéristiques apprises sur ImageNet sont réutilisables car elles capturent des motifs visuels universels."
  },
  {
    "titre": "Les Approches de Transfert Learning",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🔄 Approches de Transfert</h2> <div style='display: grid; grid-template-columns: 1fr; gap: 15px; margin: 10px 0;'> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #3498db;'> <h3 style='color: #2c3e50; font-size: 1rem;'>1️⃣ Feature Extraction</h3> <ul style='color: #2c3e50;'> <li>Utiliser le modèle comme un <strong>extracteur de caractéristiques</strong> fixe</li> <li>Les poids du modèle sont <strong>gelés</strong> (non entraînés)</li> <li>On ajoute un nouveau classifieur entraîné sur nos données</li> <li><strong>Avantage :</strong> Très rapide, peu de données nécessaires</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border-left: 4px solid #e74c3c;'> <h3 style='color: #2c3e50; font-size: 1rem;'>2️⃣ Fine-Tuning</h3> <ul style='color: #2c3e50;'> <li>On <strong>dégèle</strong> certaines couches (ou toutes)</li> <li>On continue l'entraînement sur nos données</li> <li>On adapte le modèle à notre tâche spécifique</li> <li><strong>Avantage :</strong> Meilleures performances si on a assez de données</li> </ul> </div> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Choix :</strong> Feature extraction si peu de données, fine-tuning si vous avez assez de données</p> </div> </div>",
    "texteParle": "Il y a deux approches principales pour utiliser le transfert learning. La première, l'extraction de caractéristiques, consiste à utiliser le modèle pré-entraîné comme un extracteur de caractéristiques fixe. On gèle tous les poids du modèle, on lui fait traiter nos images, et on utilise les caractéristiques obtenues pour entraîner un nouveau classifieur. C'est rapide et efficace avec peu de données. La seconde approche, le fine-tuning, est plus puissante mais nécessite plus de données. On dégèle tout ou partie des couches du modèle et on continue l'entraînement sur nos propres données. Cela permet d'adapter le modèle à notre tâche spécifique, mais il faut faire attention à ne pas trop modifier les caractéristiques utiles déjà apprises.",
    "note": "Le fine-tuning nécessite généralement un taux d'apprentissage plus faible que pour un entraînement de zéro."
  },
  {
    "titre": "Feature Extraction en Pratique",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>⚙️ Feature Extraction</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Étapes</h3> <ul style='color: #2c3e50;'> <li><strong>Charger</strong> un modèle pré-entraîné (ex: ResNet50)</li> <li><strong>Geler</strong> tous les poids du modèle</li> <li><strong>Remplacer</strong> la dernière couche par un nouveau classifieur</li> <li><strong>Entraîner</strong> uniquement le nouveau classifieur</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple avec PyTorch</h3> <div style='background: #2c3e50; padding: 12px; border-radius: 8px; overflow-x: auto;'> <pre style='color: #ecf0f1; font-size: 0.75rem; margin: 0;'>import torchvision.models as models\nmodel = models.resnet50(pretrained=True)\nfor param in model.parameters():\n    param.requires_grad = False  # Geler les poids\nnum_features = model.fc.in_features\nmodel.fc = nn.Linear(num_features, 10)  # Nouveau classifieur\n# Entraîner uniquement model.fc</pre> </div> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>Avantage :</strong> Très rapide à entraîner, fonctionne avec peu de données</p> </div> </div>",
    "texteParle": "Voyons comment implémenter l'extraction de caractéristiques en pratique. La première étape consiste à charger un modèle pré-entraîné comme ResNet50. Ensuite, on gèle tous les poids du modèle pour qu'ils ne soient pas modifiés pendant l'entraînement. On remplace la dernière couche, qui correspond au classifieur spécifique à ImageNet, par un nouveau classifieur adapté à notre nombre de classes. Puis on entraîne uniquement ce nouveau classifieur. L'avantage est que l'entraînement est très rapide car on n'a que quelques couches à entraîner, et cela fonctionne bien même avec un petit nombre d'images. C'est la solution à privilégier quand on a moins de 1000 images par classe.",
    "note": "La feature extraction est idéale quand vous avez un petit dataset (moins de 1000 images par classe)."
  },
  {
    "titre": "Fine-Tuning en Pratique",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🔧 Fine-Tuning</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Étapes</h3> <ul style='color: #2c3e50;'> <li><strong>Charger</strong> le modèle pré-entraîné</li> <li><strong>Remplacer</strong> la dernière couche</li> <li><strong>Dégeler</strong> tout ou partie du modèle</li> <li><strong>Entraîner</strong> avec un taux d'apprentissage plus faible</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Bonnes pratiques</h3> <ul style='color: #2c3e50;'> <li>Commencer par entraîner uniquement la nouvelle couche (<strong>warm-up</strong>)</li> <li>Utiliser un <strong>taux d'apprentissage</strong> 10 fois plus faible</li> <li>Dégeler progressivement les couches</li> <li>Surveiller l'<strong>overfitting</strong> avec des données de validation</li> </ul> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>⚠️ <strong>Attention :</strong> Trop de fine-tuning peut détruire les caractéristiques utiles du modèle</p> </div> </div>",
    "texteParle": "Le fine-tuning est plus sophistiqué que l'extraction de caractéristiques. Après avoir chargé le modèle pré-entraîné et remplacé la dernière couche, on dégèle tout ou partie des couches du modèle et on poursuit l'entraînement sur nos données. Il y a plusieurs bonnes pratiques à suivre. D'abord, commencer par entraîner uniquement la nouvelle couche pendant quelques époques, c'est ce qu'on appelle le warm-up. Ensuite, utiliser un taux d'apprentissage beaucoup plus faible que pour un entraînement de zéro, typiquement 10 fois plus petit. On peut aussi dégeler les couches progressivement pour éviter de trop perturber les caractéristiques déjà apprises. Il faut aussi surveiller attentivement l'overfitting, surtout si vous n'avez pas beaucoup de données.",
    "note": "Le fine-tuning est une technique qui demande de la prudence pour ne pas détruire les connaissances du modèle."
  },
  {
    "titre": "Quand Utiliser Quelle Approche ?",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📊 Guide de Choix</h2> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0;'> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border: 2px solid #3498db;'> <h3 style='color: #2c3e50; font-size: 1rem; text-align: center;'>Petit Dataset</h3> <p style='color: #2c3e50; text-align: center;'>< 1000 images par classe</p> <ul style='color: #2c3e50;'> <li><strong>✅ Feature Extraction</strong></li> <li>Risque d'overfitting élevé</li> <li>Seule la dernière couche est entraînée</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border: 2px solid #e74c3c;'> <h3 style='color: #2c3e50; font-size: 1rem; text-align: center;'>Grand Dataset</h3> <p style='color: #2c3e50; text-align: center;'>> 1000 images par classe</p> <ul style='color: #2c3e50;'> <li><strong>✅ Fine-Tuning</strong></li> <li>Peut adapter toutes les couches</li> <li>Meilleure performance</li> </ul> </div> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>📌 <strong>Règle d'or :</strong> Plus votre dataset est proche d'ImageNet, moins vous avez besoin de fine-tuning</p> </div> </div>",
    "texteParle": "Comment choisir entre l'extraction de caractéristiques et le fine-tuning ? La règle est simple : tout dépend de la taille de votre dataset. Si vous avez moins de 1000 images par classe, privilégiez l'extraction de caractéristiques. Le risque d'overfitting est trop grand avec le fine-tuning. Si vous avez plus de 1000 images par classe, le fine-tuning est possible et vous donnera de meilleures performances. Une autre règle : plus votre tâche est proche d'ImageNet, moins vous avez besoin de fine-tuning. Si vous reconnaissez des objets naturels similaires à ceux d'ImageNet, l'extraction de caractéristiques peut suffire. Si votre tâche est très spécifique, comme l'imagerie médicale, le fine-tuning est presque toujours nécessaire.",
    "note": "Le choix entre feature extraction et fine-tuning dépend principalement de la taille de votre dataset."
  },
  {
    "titre": "Comparaison des Architectures",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📊 Comparaison</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0; overflow-x: auto;'> <table style='width: 100%; border-collapse: collapse; color: #2c3e50; font-size: 0.85rem;'> <thead style='background: #3498db; color: white;'> <tr> <th style='padding: 8px; border: 1px solid #ddd;'>Modèle</th> <th style='padding: 8px; border: 1px solid #ddd;'>Couches</th> <th style='padding: 8px; border: 1px solid #ddd;'>Paramètres</th> <th style='padding: 8px; border: 1px solid #ddd;'>Poids (Mo)</th> <th style='padding: 8px; border: 1px solid #ddd;'>Précision Top-5</th> </tr> </thead> <tbody> <tr><td style='padding: 6px; border: 1px solid #ddd;'>VGG16</td><td style='padding: 6px; border: 1px solid #ddd;'>16</td><td style='padding: 6px; border: 1px solid #ddd;'>138M</td><td style='padding: 6px; border: 1px solid #ddd;'>528</td><td style='padding: 6px; border: 1px solid #ddd;'>90.0%</td></tr> <tr style='background: #ecf0f1;'><td style='padding: 6px; border: 1px solid #ddd;'>ResNet50</td><td style='padding: 6px; border: 1px solid #ddd;'>50</td><td style='padding: 6px; border: 1px solid #ddd;'>25M</td><td style='padding: 6px; border: 1px solid #ddd;'>98</td><td style='padding: 6px; border: 1px solid #ddd;'>92.0%</td></tr> <tr><td style='padding: 6px; border: 1px solid #ddd;'>InceptionV3</td><td style='padding: 6px; border: 1px solid #ddd;'>~48</td><td style='padding: 6px; border: 1px solid #ddd;'>24M</td><td style='padding: 6px; border: 1px solid #ddd;'>92</td><td style='padding: 6px; border: 1px solid #ddd;'>93.0%</td></tr> <tr style='background: #ecf0f1;'><td style='padding: 6px; border: 1px solid #ddd;'>ResNet152</td><td style='padding: 6px; border: 1px solid #ddd;'>152</td><td style='padding: 6px; border: 1px solid #ddd;'>60M</td><td style='padding: 6px; border: 1px solid #ddd;'>230</td><td style='padding: 6px; border: 1px solid #ddd;'>93.5%</td></tr> </tbody> </table> </div> <div style='background: #fff3cd; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Conseil :</strong> Commencez par ResNet50 : bon compromis performance/poids</p> </div> </div>",
    "texteParle": "Voici une comparaison des architectures les plus populaires. VGG16 est simple et performant, mais il est très lourd avec 138 millions de paramètres. ResNet50 est un excellent compromis avec seulement 25 millions de paramètres pour des performances supérieures. InceptionV3 est encore plus efficace en termes de paramètres. ResNet152 est plus profond et plus précis, mais il est aussi plus lourd. Mon conseil : commencez par ResNet50. C'est un excellent compromis entre performance, poids et rapidité. Vous pourrez toujours passer à une architecture plus grande si vous en avez besoin.",
    "note": "ResNet50 est souvent le premier choix pour le transfert learning grâce à son excellent rapport performance/poids."
  },
  {
    "titre": "Exemple Complet d'Application",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>💡 Exemple Concret</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Problème</h3> <p style='color: #2c3e50;'>Identifier des maladies du cacao à partir de photos de feuilles au Cameroun</p> <ul style='color: #2c3e50;'> <li><strong>Données :</strong> 500 images par classe (5 classes)</li> <li><strong>Approche :</strong> Feature Extraction avec ResNet50</li> <li><strong>Étapes :</strong> Charger ResNet50, geler les poids, ajouter un classifieur, entraîner</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Résultats attendus</h3> <ul style='color: #2c3e50;'> <li>Précision : ~92% avec feature extraction</li> <li>Entraînement en quelques minutes sur un GPU</li> <li>Peut être déployé sur une application mobile</li> <li>Peut être amélioré avec fine-tuning si plus de données</li> </ul> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>À retenir :</strong> Le transfert learning permet de créer des applications de vision avec peu de ressources</p> </div> </div>",
    "texteParle": "Prenons un exemple concret. Imaginez que vous voulez identifier des maladies du cacao à partir de photos de feuilles au Cameroun. Vous avez collecté 500 images par classe pour 5 classes différentes. Avec seulement 2500 images, vous ne pouvez pas entraîner un réseau de neurones de zéro. Mais avec le transfert learning, c'est parfaitement possible. Vous utilisez ResNet50 pré-entraîné, vous gelez tous les poids, vous ajoutez un nouveau classifieur, et vous l'entraînez sur vos données. En quelques minutes sur un GPU, vous pouvez atteindre une précision d'environ 92%. C'est assez bon pour une première version qui pourrait être déployée sur une application mobile pour aider les agriculteurs camerounais.",
    "note": "Le transfert learning rend accessible la vision par ordinateur même avec des ressources limitées."
  },
  {
    "titre": "Pièges et Bonnes Pratiques",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>⚠️ Pièges et Bonnes Pratiques</h2> <div style='display: grid; grid-template-columns: 1fr; gap: 12px; margin: 10px 0;'> <div style='background: #f8d7da; padding: 12px; border-radius: 10px; border-left: 4px solid #dc3545;'> <h3 style='color: #721c24; font-size: 1rem;'>❌ Pièges à éviter</h3> <ul style='color: #721c24;'> <li><strong>Overfitting :</strong> Trop de fine-tuning avec peu de données</li> <li><strong>Forgetting :</strong> Taux d'apprentissage trop élevé (détruit les caractéristiques)</li> <li><strong>Mauvaise normalisation :</strong> Ne pas normaliser comme le modèle pré-entraîné</li> <li><strong>Données proches :</strong> Utiliser le fine-tuning quand la feature extraction suffit</li> </ul> </div> <div style='background: #d4edda; padding: 12px; border-radius: 10px; border-left: 4px solid #28a745;'> <h3 style='color: #155724; font-size: 1rem;'>✅ Bonnes pratiques</h3> <ul style='color: #155724;'> <li>Commencer par la <strong>feature extraction</strong> pour benchmark</li> <li>Utiliser un <strong>taux d'apprentissage</strong> 10x plus petit pour le fine-tuning</li> <li><strong>Augment;

        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
