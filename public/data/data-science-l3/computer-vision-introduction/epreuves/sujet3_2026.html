<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Computer Vision (Introduction)",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "duree": "2 heures",
  "barème": "sur 20 points",
  "exercices": [
    {
      "titre": "Questions de cours",
      "points": "6 pts",
      "enonce": "<p>Répondez de manière concise et précise aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (3 pts)</strong> Expliquez la différence fondamentale entre :</p><ul><li>La segmentation sémantique et la segmentation d'instances.</li><li>L'approche <em>one-shot</em> (YOLO) et l'approche <em>two-stage</em> (Faster R-CNN).</li><li>Le suivi d'objets (tracking) et la détection d'objets.</li></ul>",
          "reponse": "<p><strong>Segmentation sémantique vs Segmentation d'instances :</strong> La segmentation sémantique assigne une classe à chaque pixel sans distinguer les différentes instances d'une même classe (ex: tous les pixels 'voiture' sont groupés). La segmentation d'instances distingue chaque objet individuellement (voiture 1, voiture 2, etc.) [citation:3].</p><p><strong>YOLO vs Faster R-CNN :</strong> YOLO est une approche <em>one-shot</em> qui prédit directement les boîtes et les classes en une seule passe, ce qui le rend très rapide. Faster R-CNN est une approche <em>two-stage</em> qui propose d'abord des régions d'intérêt, puis les classifie, offrant une meilleure précision mais une vitesse moindre.</p><p><strong>Tracking vs Détection :</strong> La détection identifie et localise les objets dans une image individuelle. Le suivi (tracking) consiste à associer les détections d'objet à travers les frames d'une vidéo pour maintenir leur identité au fil du temps.</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Citez deux métriques couramment utilisées pour évaluer les modèles de détection d'objets.</p>",
          "reponse": "<p>Le <strong>mAP (mean Average Precision)</strong> est la métrique principale, qui mesure la précision moyenne sur toutes les classes. L'<strong>IoU (Intersection over Union)</strong> mesure le chevauchement entre la boîte prédite et la vérité terrain, servant de seuil pour déterminer si une détection est correcte.</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Expliquez ce qu'est le transfert learning en vision par ordinateur et pourquoi il est utile.</p>",
          "reponse": "<p>Le transfert learning consiste à utiliser un modèle pré-entraîné sur une grande tâche (ex: classification sur ImageNet) comme point de départ pour une nouvelle tâche. Il permet de bénéficier des caractéristiques déjà apprises (bords, textures, formes) et réduit considérablement le besoin de données et de temps d'entraînement pour la nouvelle tâche. C'est particulièrement utile quand le dataset de la tâche cible est petit.</p>"
        }
      ]
    },
    {
      "titre": "Analyse d'architectures",
      "points": "6 pts",
      "enonce": "<p>On considère une tâche de détection d'objets en temps réel sur une vidéo de surveillance urbaine. L'application doit fonctionner sur un système embarqué avec des ressources limitées.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Justifiez le choix de YOLO plutôt que Faster R-CNN pour cette application.</p>",
          "reponse": "<p>YOLO est plus adapté pour cette application car :</p><ul><li>Sa vitesse d'inférence élevée (temps réel) est cruciale pour la surveillance en continu.</li><li>Son architecture <em>one-shot</em> est moins gourmande en ressources, ce qui convient aux systèmes embarqués.</li><li>Il offre un bon compromis précision/vitesse pour la détection de personnes et de véhicules en milieu urbain.</li></ul>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Décrivez comment OpenCV peut être utilisé pour implémenter cette solution de détection.</p>",
          "reponse": "<p>OpenCV permet d'implémenter la solution via :</p><ul><li>Le module DNN (<code>cv2.dnn.readNet()</code>) pour charger un modèle YOLO pré-entraîné [citation:24].</li><li>La capture vidéo avec <code>cv2.VideoCapture()</code> pour traiter le flux frame par frame.</li><li>Les fonctions de dessin (<code>cv2.rectangle()</code>, <code>cv2.putText()</code>) pour visualiser les boîtes de détection.</li><li>Le prétraitement des images (<code>cv2.resize()</code>, <code>cv2.dnn.blobFromImage()</code>) pour préparer les données.</li></ul>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Quelles adaptations pourriez-vous apporter pour optimiser le modèle sur un système à ressources limitées ?</p>",
          "reponse": "<p>Pour optimiser le modèle sur un système embarqué :</p><ul><li>Utiliser une version légère de YOLO (YOLOv8-nano ou YOLOv8-small).</li><li>Réduire la résolution d'entrée des images (ex: 320x320 au lieu de 640x640).</li><li>Appliquer la quantification (int8) pour réduire la taille du modèle et accélérer l'inférence.</li><li>Utiliser l'accélération matérielle (GPU/NPU) si disponible.</li><li>Réduire la fréquence d'inférence (traiter 1 frame sur 2 ou 3).</li></ul>"
        }
      ]
    },
    {
      "titre": "Problème pratique : Estimation de pose",
      "points": "8 pts",
      "enonce": "<p>Vous devez développer une application d'analyse de mouvement pour un coach sportif. L'application doit estimer la pose des athlètes en temps réel à partir de vidéos et fournir des informations sur les angles articulaires.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Comparez les approches <em>bottom-up</em> (OpenPose) et <em>top-down</em> (PoseNet) pour cette application. Laquelle recommanderiez-vous pour une utilisation en salle de sport avec plusieurs athlètes ? Justifiez.</p>",
          "reponse": "<p><strong>OpenPose (bottom-up) :</strong> Détecte d'abord toutes les parties du corps (keypoints) dans l'image, puis les assemble en squelettes. Avantage : temps de calcul indépendant du nombre de personnes, idéal pour les scènes avec plusieurs athlètes.</p><p><strong>PoseNet (top-down) :</strong> Détecte d'abord les personnes, puis estime la pose pour chacune. Avantage : plus précis pour les poses individuelles, mais le temps de calcul augmente avec le nombre de personnes.</p><p><strong>Recommandation :</strong> OpenPose est plus adapté car une salle de sport peut contenir plusieurs athlètes simultanément, et sa robustesse aux occlusions est un atout majeur.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Décrivez le pipeline complet d'estimation de pose que vous mettriez en place, de l'acquisition vidéo à la visualisation des angles.</p>",
          "reponse": "<p><strong>Pipeline :</strong></p><ol><li><strong>Acquisition</strong> : Vidéo haute vitesse (120+ FPS).</li><li><strong>Prétraitement</strong> : Redimensionnement, normalisation.</li><li><strong>Détection des personnes</strong> : YOLO pour localiser les athlètes.</li><li><strong>Estimation de pose</strong> : OpenPose pour extraire les keypoints 2D.</li><li><strong>Calcul des angles</strong> : À partir des coordonnées des articulations.</li><li><strong>Analyse</strong> : Comparaison avec des références (athlètes experts).</li><li><strong>Visualisation</strong> : Affichage de la pose avec les angles annotés.</li></ol>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Quelles métriques utiliseriez-vous pour évaluer la qualité de votre système d'estimation de pose ?</p>",
          "reponse": "<p><strong>Métriques d'évaluation :</strong></p><ul><li><strong>PCK (Percentage of Correct Keypoints)</strong> : Pourcentage de keypoints correctement localisés dans un rayon donné.</li><li><strong>OKS (Object Keypoint Similarity)</strong> : Combine distance et échelle, utilisé sur COCO.</li><li><strong>Précision des angles</strong> : Comparaison des angles calculés avec des mesures de référence.</li><li><strong>Latence</strong> : Temps de traitement par frame (critique pour le temps réel).</li><li><strong>Taux de détection</strong> : Pourcentage de frames où la pose est correctement détectée.</li></ul>"
        },
        {
          "question": "<p><strong>4. (2 pts)</strong> Proposez des solutions pour gérer les occlusions (un athlète qui passe devant un autre) dans votre système.</p>",
          "reponse": "<p><strong>Gestion des occlusions :</strong></p><ul><li><strong>Approche multi-caméras</strong> : Placer plusieurs caméras sous différents angles pour avoir toujours une vue dégagée.</li><li><strong>Filtrage de Kalman</strong> : Prédire la position des keypoints lorsqu'ils sont temporairement masqués.</li><li><strong>Modèle de squelette</strong> : Utiliser les contraintes biomécaniques pour estimer les positions manquantes (ex: longueur des membres constante).</li><li><strong>OpenPose</strong> : L'approche bottom-up est naturellement plus robuste aux occlusions car elle détecte les parties du corps indépendamment.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
