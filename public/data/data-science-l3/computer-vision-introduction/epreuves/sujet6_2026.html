<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "intitule": "Comprendre les datasets de détection d'objets",
    "type": "ressource",
    "niveau": "medium",
    "enonce": {
      "texte": "<p>Les datasets de détection d'objets sont essentiels pour l'entraînement des modèles. Chaque dataset a ses propres caractéristiques : nombre de classes, type d'annotations, taille des images, etc.</p><p>Voici les caractéristiques de deux datasets populaires :</p><ul><li><strong>COCO (Common Objects in Context)</strong> : 80 classes, 330 000 images, 1.5 million d'instances annotées, 5 masques de segmentation par image</li><li><strong>Pascal VOC</strong> : 20 classes, ~11 500 images, ~27 000 instances annotées</li></ul><p>Les annotations de détection d'objets incluent généralement :</p><ul><li>La classe de l'objet</li><li>Les coordonnées de la boîte englobante $(x_{min}, y_{min}, x_{max}, y_{max})$</li><li>Optionnellement : un score de confiance (pour les prédictions)</li></ul>",
      "images": [
        "Exemple d'image annotée avec des boîtes englobantes de différentes couleurs pour différentes classes (personnes, voitures, animaux) avec les étiquettes correspondantes."
      ]
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Expliquer en détail les différences entre les datasets COCO et Pascal VOC en termes de taille, de nombre de classes, et de types d'annotations. Analyser comment ces différences influencent le choix du dataset pour un projet de détection.",
        "niveau": "medium",
        "reponse": "<b>Différences entre COCO et Pascal VOC :</b>\n\n1. <b>Taille</b> : COCO est beaucoup plus grand (330 000 images vs 11 500 pour Pascal VOC), ce qui permet d'entraîner des modèles plus robustes avec une meilleure généralisation.\n\n2. <b>Nombre de classes</b> : COCO a 80 classes contre 20 pour Pascal VOC. COCO couvre donc une plus grande variété d'objets, incluant des classes plus spécifiques (ex: 'broccoli', 'tie', 'frisbee').\n\n3. <b>Types d'annotations</b> : COCO offre non seulement des boîtes englobantes mais aussi des masques de segmentation (polygones), ce qui permet des tâches de segmentation d'instances. Pascal VOC propose principalement des boîtes englobantes et des annotations de segmentation pour certaines versions.\n\n<b>Choix du dataset :</b>\n- Choisir COCO pour des projets nécessitant une grande variété d'objets ou des tâches de segmentation\n- Choisir Pascal VOC pour des projets avec des contraintes de ressources (mémoire, temps d'entraînement) ou pour des benchmarks standardisés\n- Pour des applications spécifiques (ex: détection de voitures au Cameroun), on peut aussi créer un dataset personnalisé",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Décrire comment les annotations d'un dataset de détection sont généralement structurées (format de fichier, structure des données). Donner un exemple concret d'une annotation.",
            "niveau": "medium",
            "reponse": "Les annotations de détection sont souvent stockées dans des fichiers JSON (pour COCO) ou XML (pour Pascal VOC).\n\n<b>Format COCO (JSON) :</b>\n```\n{\n  \"images\": [\n    {\"id\": 1, \"file_name\": \"image1.jpg\", \"width\": 640, \"height\": 480}\n  ],\n  \"annotations\": [\n    {\n      \"id\": 1,\n      \"image_id\": 1,\n      \"category_id\": 1,\n      \"bbox\": [100, 150, 200, 300],  // [x_min, y_min, width, height]\n      \"area\": 60000,\n      \"segmentation\": [[...]],  // polygone pour la segmentation\n      \"iscrowd\": 0\n    }\n  ],\n  \"categories\": [\n    {\"id\": 1, \"name\": \"person\"}\n  ]\n}\n```\n\n<b>Format Pascal VOC (XML) :</b>\n```\n<annotation>\n  <folder>VOC2007</folder>\n  <filename>image1.jpg</filename>\n  <size>\n    <width>640</width>\n    <height>480</height>\n  </size>\n  <object>\n    <name>person</name>\n    <bndbox>\n      <xmin>100</xmin>\n      <ymin>150</ymin>\n      <xmax>300</xmax>\n      <ymax>450</ymax>\n    </bndbox>\n  </object>\n</annotation>\n```\n\nCes formats permettent de stocker toutes les informations nécessaires : l'image source, les coordonnées des boîtes, les classes, et les métadonnées."
          },
          {
            "numero": "1.b",
            "texte": "Justifier l'importance de la qualité des annotations pour la performance d'un modèle de détection. Quels problèmes peuvent survenir avec des annotations de mauvaise qualité ?",
            "niveau": "hard",
            "reponse": "La qualité des annotations est cruciale car le modèle apprend directement à partir de ces données. Des annotations de mauvaise qualité peuvent causer :\n\n1. <b>Boîtes mal localisées</b> : Si les boîtes sont imprécises (ex: ne couvrent pas parfaitement l'objet), le modèle apprendra des localisations incorrectes.\n\n2. <b>Classes mal assignées</b> : Si un objet est mal étiqueté (ex: un chien étiqueté comme chat), le modèle apprendra des associations erronées.\n\n3. <b>Faux positifs/négatifs</b> : Des objets manquants dans les annotations (faux négatifs) ou des boîtes sur du background (faux positifs) peuvent détériorer l'apprentissage.\n\n4. <b>Déséquilibre de classes</b> : Si certaines classes sont sous-représentées ou mal annotées, le modèle performera mal sur ces classes.\n\n<b>Conséquences pratiques :</b>\n- Perte de précision\n- Difficulté de convergence\n- Mauvaise généralisation\n- Augmentation du temps d'entraînement\n\n<b>Solutions :</b> Utiliser des outils de validation des annotations, faire des révisions par plusieurs annotateurs, utiliser des techniques d'augmentation de données pour compenser certaines erreurs."
          }
        ]
      }
    ]
  },
  {
    "intitule": "Application de YOLO à la détection de véhicules à Douala",
    "type": "competence",
    "niveau": "hard",
    "enonce": {
      "texte": "<p>Vous êtes data scientist et travaillez pour la mairie de Douala. Vous devez développer un système de détection de véhicules pour optimiser la gestion du trafic aux carrefours. Le système doit détecter en temps réel : voitures, motos (motos-taxi), camions et bus.</p><p>Vous disposez de :</p><ul><li>5000 images annotées avec des boîtes englobantes pour les 4 classes</li><li>Le dataset est déséquilibré : 60% voitures, 25% motos, 10% camions, 5% bus</li><li>Les images sont de résolution 1280×720</li><li>Vous devez utiliser YOLOv8 pour la détection</li></ul><p>La solution doit être déployée sur des caméras de surveillance avec des ressources matérielles limitées (CPU seulement, pas de GPU).</p>",
      "images": [
        "Image d'un carrefour à Douala avec différents types de véhicules : voitures, motos, camions, bus, avec des boîtes colorées pour chaque type."
      ]
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Détailler les étapes de prétraitement des données pour ce projet : (a) l'analyse du déséquilibre des classes, (b) les techniques d'augmentation de données adaptées, (c) la préparation des données pour YOLOv8.",
        "niveau": "hard",
        "reponse": "<b>(a) Analyse du déséquilibre des classes :</b>\n1. Calculer la distribution des classes : voitures (60%), motos (25%), camions (10%), bus (5%)\n2. Identifier le déséquilibre : les classes 'camions' et 'bus' sont sous-représentées\n3. Stratégies : pondération des pertes (loss weighting) ou augmentation ciblée\n\n<b>(b) Techniques d'augmentation de données :</b>\n1. <b>Augmentation de base</b> : Rotation (±15°), flip horizontal, variation de luminosité, bruit\n2. <b>Augmentation ciblée pour les classes rares</b> :\n   - Copier-coller des bus et camions sur différentes images\n   - Mosaïque (mosaïc) pour combiner 4 images en une\n3. <b>Augmentation avancée</b> : Changement de contraste, saturation, flou\n\n<b>(c) Préparation pour YOLOv8 :</b>\n1. Organiser les données dans la structure YOLOv8 :\n   ```\n   dataset/\n   ├── train/\n   │   ├── images/\n   │   └── labels/\n   ├── val/\n   │   ├── images/\n   │   └── labels/\n   └── data.yaml\n   ```\n2. Convertir les annotations au format YOLO : `<class> <x_center> <y_center> <width> <height>` (coordonnées normalisées entre 0 et 1)\n3. Créer le fichier `data.yaml` avec les chemins et les noms des classes\n4. Redimensionner les images à la taille d'entrée de YOLOv8 (640×640)",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Expliquer le choix de YOLOv8 plutôt que Faster R-CNN ou SSD pour ce projet. Justifier en fonction des contraintes matérielles (CPU seulement) et des exigences de temps réel.",
            "niveau": "hard",
            "reponse": "Le choix de YOLOv8 est justifié par plusieurs facteurs :\n\n1. <b>Vitesse d'inférence</b> : YOLOv8 est significativement plus rapide que Faster R-CNN, ce qui est crucial pour le traitement en temps réel sur CPU. YOLOv8 nano peut atteindre 30-50 FPS sur CPU, tandis que Faster R-CNN est généralement trop lent pour une utilisation en temps réel sans GPU.\n\n2. <b>Efficacité</b> : YOLOv8 a une architecture plus efficace avec moins de paramètres (YOLOv8n a ~3.2M paramètres) comparé à Faster R-CNN (~40M+).\n\n3. <b>Facilité de déploiement</b> : YOLOv8 est facile à exporter vers des formats optimisés pour CPU (ONNX, TensorRT).\n\n4. <b>Performance sur petits objets</b> : Les motos étant des objets relativement petits, YOLOv8 avec ses améliorations (anchor-free) donne de bons résultats.\n\n<b>Pourquoi pas SSD ?</b> : Bien que SSD soit aussi rapide, YOLOv8 offre généralement une meilleure précision sur le dataset COCO (mAP ~50% vs ~45% pour SSD). De plus, YOLOv8 bénéficie d'une communauté active et de nombreux tutoriels.",
            "note": "YOLOv8 est un excellent compromis pour les applications embarquées avec des ressources limitées"
          },
          {
            "numero": "1.b",
            "texte": "Concevoir une stratégie pour évaluer le modèle, en détaillant : (a) les métriques à utiliser, (b) la méthode de validation croisée adaptée pour ce dataset, (c) les seuils de performance acceptables pour le déploiement.",
            "niveau": "very hard",
            "reponse": "<b>(a) Métriques d'évaluation :</b>\n1. <b>mAP@0.5</b> : Précision moyenne sur les classes avec IoU=0.5\n2. <b>mAP@0.5:0.95</b> : Précision moyenne sur plusieurs seuils IoU (plus exigeant)\n3. <b>Précision par classe</b> : Pour identifier les classes où le modèle est faible\n4. <b>Rappel par classe</b> : Pour évaluer la capacité à détecter tous les objets\n5. <b>FPS (images par seconde)</b> : Pour valider les performances temps réel sur CPU\n6. <b>Latence moyenne</b> : Temps moyen par image\n\n<b>(b) Validation croisée :</b>\n- Utiliser un split standard : 80% train, 10% validation, 10% test\n- Validation croisée à 5-folds pour les classes rares (bus, camions)\n- S'assurer que les images sont bien réparties spatialement (pas de fuite de données)\n\n<b>(c) Seuils de performance :</b>\n1. <b>Performance minimum</b> : mAP@0.5 > 0.70\n2. <b>Performance par classe</b> :\n   - Voitures : précision > 0.85, rappel > 0.90\n   - Motos : précision > 0.75, rappel > 0.80\n   - Camions : précision > 0.70, rappel > 0.75\n   - Bus : précision > 0.65, rappel > 0.70\n3. <b>Performance temps réel</b> : FPS > 20 (sur CPU), latence < 50ms\n4. <b>Confidence threshold</b> : 0.3-0.5 selon le compromis précision/rappel souhaité\n\nCes seuils garantissent que le système est à la fois précis et rapide pour une utilisation opérationnelle."
          }

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
