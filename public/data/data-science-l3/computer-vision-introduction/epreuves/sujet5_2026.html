        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Computer Vision (Introduction) - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Détection d'Objets : Comprendre YOLO et Faster R-CNN",
     "points": "6 pts",
     "enonce": "<p>La détection d'objets est une tâche fondamentale de la vision par ordinateur qui combine localisation et classification. Deux approches majeures existent : les méthodes à deux étapes (comme Faster R-CNN) et les méthodes à une étape (comme YOLO). L'architecture de YOLO est basée sur une seule CNN qui prédit simultanément les boîtes englobantes et les classes, en divisant l'image en une grille [citation:5].</p><p>Considérez une image 448×448 pixels que vous souhaitez analyser pour détecter des piétons, des voitures et des motos. L'image est divisée en une grille 7×7. Chaque cellule de la grille prédit 2 boîtes englobantes.</p><p>Les sorties de YOLO pour une cellule de la grille sont : <strong>(x, y, w, h, confiance)</strong> pour chaque boîte, et les probabilités de classe <strong>(P(pieton), P(voiture), P(moto))</strong>.</p>",
     "questions": [
       {
         "question": "<p><strong>1) (1,5 pt)</strong> Expliquez les avantages de l'approche one-shot de YOLO par rapport à l'approche two-stage de Faster R-CNN en termes de rapidité et de précision.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p><strong>Avantages de YOLO (one-shot) :</strong></p><ul><li><strong>Rapidité</strong> : Traite l'image en une seule passe, ce qui le rend extrêmement rapide pour les applications en temps réel (jusqu'à 30-155 FPS selon les versions)</li><li><strong>Contexte global</strong> : Voit l'image entière, ce qui réduit les faux positifs</li><li><strong>Simplicité</strong> : Architecture plus simple à entraîner end-to-end</li></ul><p><strong>Avantages de Faster R-CNN (two-stage) :</strong></p><ul><li><strong>Précision</strong> : Meilleure précision, notamment pour les petits objets</li><li><strong>ROI Align</strong> : Plus précis pour la localisation</li></ul><p>Le compromis principal est donc : Rapidité (YOLO) vs Précision (Faster R-CNN).</p>"
       },
       {
         "question": "<p><strong>2) (2 pts)</strong> Pour une cellule donnée, YOLO prédit 2 boîtes avec les scores de confiance suivants :\nBoîte 1 : confiance = 0.85\nBoîte 2 : confiance = 0.60\nLes probabilités de classe pour la cellule sont :\nP(pieton) = 0.8, P(voiture) = 0.15, P(moto) = 0.05\n\nCalculez le score final pour chaque boîte pour la classe 'piéton'. Interprétez les résultats.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>Le score final pour une détection est donné par :\n<code>Score final = Confiance × P(classe|objet)</code></p><p><strong>Boîte 1 :</strong>\nScore = 0.85 × 0.8 = <strong>0.68</strong></p><p><strong>Boîte 2 :</strong>\nScore = 0.60 × 0.8 = <strong>0.48</strong></p><p><strong>Interprétation :</strong></p><ul><li>La Boîte 1 a un score de 0.68, ce qui signifie que la probabilité qu'elle contienne un piéton est de 68%</li><li>La Boîte 2 a un score plus faible (48%)</li><li>Après la NMS (Non-Maximum Suppression), la Boîte 1 serait probablement conservée et la Boîte 2 éliminée car elles se chevauchent probablement</li></ul>"
       },
       {
         "question": "<p><strong>3) (1,5 pt)</strong> Expliquez le rôle de la fonction de perte dans l'entraînement de YOLO. Quels sont les trois types d'erreurs qu'elle pénalise ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>La fonction de perte de YOLO pénalise trois types d'erreurs :</p><ol><li><strong>Erreur de localisation</strong> : Écart entre les coordonnées prédites et réelles des boîtes englobantes</li><li><strong>Erreur de confiance</strong> : Différence entre le score de confiance prédit et la réalité (présence ou non d'un objet)</li><li><strong>Erreur de classification</strong> : Différence entre les probabilités de classe prédites et réelles</li></ol><p>La perte totale est une somme pondérée de ces trois composantes. Les coefficients de pondération permettent de donner plus d'importance aux erreurs sur les objets (présence d'objet) qu'aux erreurs sur le fond.</p>"
       },
       {
         "question": "<p><strong>4) (1 pt)</strong> Qu'est-ce que la Non-Maximum Suppression (NMS) et pourquoi est-elle utilisée dans YOLO ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>La Non-Maximum Suppression (NMS) est une technique de post-traitement qui élimine les détections redondantes.</p><p><strong>Principe :</strong></p><ul><li>Les boîtes sont triées par score de confiance décroissant</li><li>La boîte avec le score le plus élevé est sélectionnée</li><li>Toutes les boîtes ayant un IoU (Intersection over Union) > seuil avec cette boîte sont supprimées</li></ul><p><strong>Pourquoi elle est nécessaire :</strong></p><ul><li>YOLO prédit plusieurs boîtes par cellule (généralement 3)</li><li>Plusieurs cellules peuvent détecter le même objet</li><li>La NMS permet de ne garder qu'une seule détection par objet</li></ul>"
       }
     ]
   },
   {
     "titre": "Segmentation d'Images : U-Net et Mask R-CNN",
     "points": "7 pts",
     "enonce": "<p>La segmentation est une tâche de vision par ordinateur qui consiste à classifier chaque pixel d'une image. Deux approches principales existent : la segmentation sémantique (U-Net) et la segmentation d'instances (Mask R-CNN). Les architectures modernes utilisent des réseaux de neurones convolutifs avec des connexions skip pour préserver les détails spatiaux.</p>",
     "questions": [
       {
         "question": "<p><strong>1) (1,5 pt)</strong> Expliquez la différence entre la segmentation sémantique et la segmentation d'instances. Donnez un exemple concret pour chaque cas.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p><strong>Segmentation sémantique :</strong></p><ul><li>Chaque pixel est classé selon une catégorie (ex: 'voiture', 'personne', 'route')</li><li>Ne distingue pas les différentes instances d'une même catégorie</li><li><strong>Exemple</strong> : Dans une image de rue, tous les pixels des voitures seront de la même couleur, sans distinction entre les différentes voitures</li></ul><p><strong>Segmentation d'instances :</strong></p><ul><li>Distingue chaque objet individuellement, même s'ils appartiennent à la même catégorie</li><li>Chaque objet a son propre masque</li><li><strong>Exemple</strong> : Dans une image de rue, chaque voiture aura un masque distinct (voiture 1, voiture 2, etc.)</li></ul>"
       },
       {
         "question": "<p><strong>2) (2 pts)</strong> Dans l'architecture U-Net, expliquez le rôle des connexions skip (connexions entre l'encodeur et le décodeur). Pourquoi sont-elles essentielles pour la segmentation ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>Les connexions skip dans U-Net sont des connexions directes entre les couches de l'encodeur (partie descendante) et les couches du décodeur (partie ascendante).</p><p><strong>Rôle :</strong></p><ul><li>Permettent de récupérer les détails spatiaux perdus lors du downsampling (pooling)</li><li>L'encodeur capture le contexte (ce qui est dans l'image)</li><li>Le décodeur restaure les détails spatiaux grâce aux connexions skip</li></ul><p><strong>Pourquoi c'est essentiel :</strong></p><ul><li>La segmentation nécessite une classification précise pixel-par-pixel</li><li>Sans les connexions skip, les contours des objets seraient flous</li><li>Les connexions skip permettent de combiner les informations de bas niveau (détails) et de haut niveau (contexte)</li></ul>"
       },
       {
         "question": "<p><strong>3) (2 pts)</strong> Comparez Mask R-CNN et YOLO en termes d'architecture et de tâches réalisées. Quelle est la particularité de Mask R-CNN par rapport à Faster R-CNN ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p><strong>Mask R-CNN :</strong></p><ul><li>Extension de Faster R-CNN pour la segmentation d'instances</li><li>Ajoute une troisième branche : la prédiction du masque</li><li>Utilise ROI Align (interpolation bilinéaire) au lieu de ROI Pooling pour préserver les détails</li><li>Prédit : classification, boîte englobante, et masque</li></ul><p><strong>YOLO :</strong></p><ul><li>Approche one-shot (une seule passe)</li><li>Détection d'objets uniquement (pas de segmentation)</li><li>Plus rapide mais moins précis pour les petits objets</li></ul><p><strong>Particularité de Mask R-CNN :</strong></p><ul><li>ROI Align remplace ROI Pooling pour éviter la quantification</li><li>Branche masque indépendante de la classification</li><li>Permet une segmentation précise des instances</li></ul>"
       },
       {
         "question": "<p><strong>4) (1,5 pt)</strong> Pour un projet de segmentation de tumeurs cérébrales, quel modèle recommanderiez-vous entre U-Net et Mask R-CNN ? Justifiez votre réponse en tenant compte des spécificités de chaque architecture.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>Je recommande <strong>U-Net</strong> pour la segmentation de tumeurs cérébrales.</p><p><strong>Raisons :</strong></p><ul><li><strong>Précision des contours</strong> : Les connexions skip de U-Net préservent parfaitement les détails spatiaux, ce qui est crucial pour délimiter des tumeurs</li><li><strong>Données limitées</strong> : U-Net fonctionne bien avec des datasets médicaux généralement petits</li><li><strong>Simplicité</strong> : Architecture plus simple, plus facile à adapter</li><li><strong>Segmentation sémantique</strong> : Dans ce cas, nous n'avons pas besoin de distinguer des instances multiples, juste de classifier les pixels comme 'tumeur' ou 'non-tumeur'</li></ul><p>Mask R-CNN serait plus adapté s'il y avait plusieurs types de tumeurs à distinguer ou si la détection d'instances était nécessaire.</p>"
       }
     ]
   },
   {
     "titre": "Estimation de Pose Humaine avec OpenPose",
     "points": "7 pts",
     "enonce": "<p>L'estimation de pose humaine est une tâche de vision par ordinateur qui consiste à localiser les articulations du corps humain dans une image. OpenPose est un framework open-source développé par Carnegie Mellon University, qui utilise une architecture en deux branches parallèles avec des Part Affinity Fields (PAFs) pour associer les articulations entre les personnes.</p>",
     "questions": [
       {
         "question": "<p><strong>1) (1,5 pt)</strong> Décrivez le rôle des Part Affinity Fields (PAFs) dans OpenPose et leur importance pour la détection multi-personnes.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>Les Part Affinity Fields (PAFs) sont des champs vectoriels qui encodent la direction et la force des connexions entre les articulations (ex: épaule → coude).</p><p><strong>Rôle :</strong></p><ul><li>Permettent d'associer les articulations détectées entre elles pour former un squelette cohérent</li><li>Indiquent la probabilité d'une connexion entre deux articulations</li></ul><p><strong>Importance pour la détection multi-personnes :</strong></p><ul><li>Dans une image avec plusieurs personnes, il faut déterminer quelles articulations appartiennent à quelle personne</li><li>Les PAFs permettent de résoudre ce problème d'association en indiquant quelles articulations sont connectées</li><li>Sans les PAFs, OpenPose ne pourrait pas distinguer les différentes personnes</li></ul>"
       },

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
