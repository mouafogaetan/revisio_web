<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Représentation des Images",
    "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px;'> <h1 style='font-size: 1.8rem; margin-bottom: 20px; color: #2c3e50;'>🖼️ Représentation des Images</h1> <div style='background: linear-gradient(135deg, #e74c3c, #c0392b); padding: 30px; border-radius: 15px; color: white; margin: 20px 0; width: 100%;'> <p style='font-size: 1.2rem; margin: 0;'>Leçon 3 - Computer Vision (Introduction)</p> <p style='font-size: 1rem; margin-top: 10px; opacity: 0.9;'>Licence 3 Data Science - Cameroun</p> </div> <div style='background: #ecf0f1; padding: 20px; border-radius: 10px; width: 100%; margin-top: 15px;'> <h3 style='color: #2c3e50; margin: 0;'>🎯 Objectifs de la leçon</h3> <ul style='text-align: left; color: #2c3e50;'> <li>Représenter une image sous forme de matrice</li> <li>Comprendre les types d'images (binaire, niveau de gris, couleur)</li> <li>Maîtriser la résolution et la profondeur de couleur</li> </ul> </div> </div>",
    "texteParle": "Bonjour à tous. Bienvenue dans ce cours sur la représentation des images en vision par ordinateur. Aujourd'hui, nous allons découvrir comment une image est représentée numériquement dans un ordinateur. Nous allons voir que derrière chaque photo que nous voyons se cache une matrice de nombres. Nous aborderons les différents types d'images, la notion de résolution et de profondeur de couleur. Ces concepts sont fondamentaux pour comprendre comment les algorithmes de vision par ordinateur fonctionnent. Préparez-vous pour un voyage au cœur des pixels !",
    "note": "La compréhension de la représentation numérique des images est essentielle pour toute application en vision par ordinateur."
  },
  {
    "titre": "L'Image : Une Matrice de Pixels",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📊 Une Image est une Matrice</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <p style='color: #2c3e50;'><strong>Principe fondamental :</strong></p> <ul style='color: #2c3e50;'> <li>Une image numérique est une <strong>grille rectangulaire</strong> de points</li> <li>Chaque point est appelé un <strong>pixel</strong> (Picture Element)</li> <li>Chaque pixel a une <strong>valeur numérique</strong> qui représente sa couleur ou son intensité</li> <li>L'image est stockée comme une <strong>matrice</strong> de valeurs</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple d'image en niveau de gris</h3> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='font-family: monospace; font-size: 1.2rem; color: #2c3e50;'> [ 120, 125, 130, 135, 140 ] <br/> [ 115, 120, 125, 130, 135 ] <br/> [ 110, 115, 120, 125, 130 ] <br/> [ 105, 110, 115, 120, 125 ] <br/> [ 100, 105, 110, 115, 120 ] </p> </div> <p style='color: #2c3e50; font-size: 0.9rem; margin-top: 5px;'>Les valeurs vont de 0 (noir) à 255 (blanc)</p> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>À retenir :</strong> Une image numérique n'est pas une image, c'est un tableau de nombres !</p> </div> </div>",
    "texteParle": "Une image numérique est fondamentalement une matrice de nombres. Imaginez que vous preniez une photo et que vous la découpiez en une grille de petits carrés. Chaque petit carré est un pixel, et sa valeur numérique représente sa couleur. Pour une image en niveaux de gris, chaque pixel a une valeur entre 0 et 255 : 0 c'est le noir pur, 255 c'est le blanc pur, et les valeurs intermédiaires sont des nuances de gris. Ainsi, une image n'est pas vraiment une image pour l'ordinateur, c'est un tableau de nombres que l'ordinateur peut manipuler mathématiquement.",
    "note": "Pixel = Picture Element, c'est l'unité de base d'une image numérique."
  },
  {
    "titre": "Dimensions d'une Matrice d'Image",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📐 Dimensions d'une Image</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Les trois paramètres essentiels</h3> <ul style='color: #2c3e50;'> <li><strong>Hauteur</strong> : Nombre de lignes de pixels</li> <li><strong>Largeur</strong> : Nombre de colonnes de pixels</li> <li><strong>Profondeur</strong> : Nombre de canaux (1 pour niveau de gris, 3 pour RGB)</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Structure d'une image</h3> <div style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-family: monospace;'><strong>Image niveau de gris</strong> : <span style='color: #2980b9;'>Hauteur × Largeur</span> <br/> <strong>Image couleur RGB</strong> : <span style='color: #2980b9;'>Hauteur × Largeur × 3</span></p> </div> <p style='color: #2c3e50; font-size: 0.95rem; margin-top: 5px;'>Exemple : une image de 1024×768 en RGB a <br/><span style='font-family: monospace; background: #ecf0f1; padding: 3px 8px; border-radius: 4px;'>1024 × 768 × 3 = 2 359 296</span> valeurs numériques !</p> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Remarque :</strong> Les bibliothèques Python comme NumPy représentent les images comme des tableaux de dimensions (hauteur, largeur, canaux)</p> </div> </div>",
    "texteParle": "Une image numérique a trois paramètres importants : la hauteur, la largeur et la profondeur. La hauteur et la largeur déterminent la taille de l'image en pixels, et la profondeur indique le nombre de canaux. Une image en niveaux de gris n'a qu'un seul canal, donc une seule valeur par pixel. Une image couleur RGB, que nous utilisons quotidiennement, a trois canaux : rouge, vert et bleu. Cela signifie qu'une image couleur est en réalité trois matrices superposées ! Une image de 1024 par 768 pixels en couleurs contient plus de 2 millions de valeurs numériques que l'ordinateur doit traiter.",
    "note": "Une image en RGB est en réalité trois matrices de valeurs : Rouge, Vert, Bleu."

    "titre": "Types d'Images selon les Pixels",

    "texteParle": "Il existe principalement trois types d'images selon la valeur des pixels. L'image binaire, où chaque pixel est soit noir soit blanc, avec seulement deux valeurs possibles. L'image en niveaux de gris, où chaque pixel a une valeur entre 0 et 255, représentant une nuance de gris du noir au blanc. Et l'image couleur RGB, où chaque pixel est composé de trois valeurs : rouge, vert et bleu, qui se combinent pour créer toutes les couleurs que nous voyons. Chaque type a ses utilisations : l'image binaire est utilisée pour la segmentation, les niveaux de gris pour l'imagerie médicale, et le RGB pour les applications grand public.",
    "note": "Une image RGB est trois fois plus grande en mémoire qu'une image en niveaux de gris."

  {
    "titre": "La Résolution d'une Image",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🔍 La Résolution</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Définition</h3> <p style='color: #2c3e50;'>La résolution est le <strong>nombre total de pixels</strong> dans l'image</p> <div class='math-block' style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <div class='math'>$$R = H \\times L$$</div> </div> <p style='color: #2c3e50; text-align: center;'>où <strong>H</strong> = hauteur en pixels et <strong>L</strong> = largeur en pixels</p> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemples de résolutions courantes</h3> <ul style='color: #2c3e50;'> <li><strong>HD (720p)</strong> : 1280 × 720 ≈ 0.9 mégapixels</li> <li><strong>Full HD (1080p)</strong> : 1920 × 1080 ≈ 2.1 mégapixels</li> <li><strong>4K</strong> : 3840 × 2160 ≈ 8.3 mégapixels</li> <li><strong>8K</strong> : 7680 × 4320 ≈ 33.2 mégapixels</li> </ul> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>📌 <strong>À retenir :</strong> Plus la résolution est élevée, plus l'image est détaillée, mais plus elle est lourde en mémoire !</p> </div> </div>",
    "texteParle": "La résolution d'une image est le nombre total de pixels qu'elle contient. Elle se calcule en multipliant la hauteur par la largeur en pixels. Par exemple, une image Full HD de 1920 par 1080 pixels contient plus de 2 millions de pixels. On parle de mégapixels pour les grandes images. Plus la résolution est élevée, plus l'image est détaillée, mais elle occupe aussi plus d'espace mémoire. C'est un compromis important en vision par ordinateur : les images haute résolution donnent de meilleurs résultats mais sont plus lentes à traiter.",
    "note": "1 mégapixel = 1 million de pixels (1 000 000)."
  },
  {
    "titre": "La Profondeur de Couleur",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🎨 Profondeur de Couleur</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Définition</h3> <p style='color: #2c3e50;'>La profondeur de couleur est le <strong>nombre de bits</strong> utilisés pour représenter la couleur d'un pixel</p> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;'> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>1 bit</p> <p style='color: #7f8c8d; font-size: 0.9rem;'>2 couleurs (binaire)</p> </div> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>8 bits</p> <p style='color: #7f8c8d; font-size: 0.9rem;'>256 couleurs/niveaux de gris</p> </div> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>16 bits</p> <p style='color: #7f8c8d; font-size: 0.9rem;'>65 536 couleurs</p> </div> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>24 bits</p> <p style='color: #7f8c8d; font-size: 0.9rem;'>~16.7 millions de couleurs</p> </div> </div> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>L'image RGB 24 bits</h3> <p style='color: #2c3e50;'>3 canaux × 8 bits = 24 bits par pixel</p> <div class='math-block' style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <div class='math'>$$2^{24} = 16 777 216 \\text{ couleurs possibles}$$</div> </div> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>À retenir :</strong> 8 bits par canal = 256 valeurs par couleur (0 à 255)</p> </div> </div>",
    "texteParle": "La profondeur de couleur est le nombre de bits utilisés pour représenter la couleur d'un pixel. Une image en 1 bit n'a que deux couleurs : noir et blanc. Une image en 8 bits a 256 couleurs ou niveaux de gris. L'image couleur standard est en 24 bits : 8 bits pour le rouge, 8 pour le vert et 8 pour le bleu, ce qui donne environ 16,7 millions de couleurs possibles. Cette profondeur est suffisante pour représenter fidèlement la réalité que nous percevons, car l'œil humain ne peut pas distinguer beaucoup plus de couleurs.",
    "note": "La profondeur de couleur standard en photographie numérique est de 24 bits (RGB 8-8-8)."

    "titre": "Taille d'une Image en Mémoire",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>💾 Taille d'une Image</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Calcul de la taille</h3> <div class='math-block' style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <div class='math'>$$\\text{Taille (bits)} = H \\times L \\times \\text{profondeur}$$</div> </div> <p style='color: #2c3e50; text-align: center;'>ou en octets : <span style='font-family: monospace;'>Taille (octets) = (H × L × profondeur) / 8</span></p> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple concret</h3> <ul style='color: #2c3e50;'> <li>Image 1920 × 1080 en RGB 24 bits</li> <li>Taille : 1920 × 1080 × 3 = 6 220 800 octets ≈ 5.93 Mo</li> <li><strong>C'est la taille non compressée !</strong></li> </ul> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Remarque :</strong> La compression (JPG, PNG) réduit considérablement la taille, mais au prix d'une perte de qualité.</p> </div> </div>",
    "texteParle": "La taille d'une image en mémoire se calcule en multipliant la hauteur, la largeur, et la profondeur de couleur. Par exemple, une image Full HD en 24 bits occupe environ 6 mégaoctets en mémoire. C'est la taille non compressée. Dans la réalité, les formats comme JPG ou PNG compressent les images pour réduire leur taille, mais cela se fait souvent au prix d'une certaine perte de qualité. C'est pourquoi il est important de bien choisir le format selon l'utilisation : le JPG pour les photos, le PNG pour les images avec transparence, et le TIFF pour les applications professionnelles sans perte.",
    "note": "La taille non compressée d'une image est souvent beaucoup plus grande que sa taille sur le disque dur."

    "texteParle": "Pour accéder à un pixel dans une image, on utilise ses coordonnées : la ligne et la colonne. La ligne est comptée du haut vers le bas, et la colonne de la gauche vers la droite. L'origine est en haut à gauche de l'image. Avec des bibliothèques comme OpenCV en Python, on peut très facilement accéder aux pixels ou les modifier. Par exemple, on peut changer la couleur d'un pixel ou parcourir toute l'image. Cette capacité à manipuler les pixels individuellement est la base de tous les algorithmes de traitement d'images.",

                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
