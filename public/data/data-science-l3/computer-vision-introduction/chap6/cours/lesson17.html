<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à la Segmentation Sémantique",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Qu'est-ce que la segmentation sémantique ?</h2><div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'><p style='font-size: 1.1rem; line-height: 1.6; color: #2c3e50;'>La segmentation sémantique est une tâche de vision par ordinateur qui consiste à <strong>classifier chaque pixel</strong> d'une image en lui attribuant une <strong>étiquette de classe</strong> (ex: route, voiture, piéton, ciel).</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 8px; border-left: 4px solid #1abc9c; margin: 15px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #1a5276;'><strong>Objectif :</strong> Obtenir une carte de segmentation où chaque pixel est coloré selon sa classe, permettant une compréhension <strong>pixel-par-pixel</strong> de l'image.</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin: 15px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #7d6608;'><strong>Exemple :</strong> Dans une image de rue, les pixels des voitures seront marqués comme \"voiture\", ceux de la route comme \"route\", et ceux des bâtiments comme \"bâtiment\".</p></div></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons découvrir la segmentation sémantique. Il s'agit d'une technique fondamentale en vision par ordinateur. Contrairement à la détection d'objets qui donne des boîtes englobantes, la segmentation sémantique travaille au niveau du pixel. Chaque pixel de l'image reçoit une étiquette correspondant à sa classe. Par exemple, dans une image de rue, nous allons colorer tous les pixels de la route en une couleur, tous les pixels des voitures en une autre couleur, et ainsi de suite. Cela permet une analyse très fine de l'image.",
    "note": "La segmentation sémantique est utilisée dans les voitures autonomes pour comprendre l'environnement routier."
  },
  {
    "titre": "Segmentation vs Détection vs Classification",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Comparaison des tâches</h2><div style='display: grid; grid-template-columns: 1fr; gap: 10px;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db;'><p style='font-size: 1rem; line-height: 1.5; color: #1a5276;'><strong>📊 Classification</strong> : Une étiquette par image entière. (<em>Ex: \"Chat\"</em>)</p></div><div style='background-color: #fdedec; padding: 12px; border-radius: 8px; border-left: 4px solid #e74c3c;'><p style='font-size: 1rem; line-height: 1.5; color: #7b241c;'><strong>📦 Détection</strong> : Boîtes englobantes autour des objets. (<em>Ex: Boîte autour d'un chien</em>)</p></div><div style='background-color: #e9f7ef; padding: 12px; border-radius: 8px; border-left: 4px solid #27ae60;'><p style='font-size: 1rem; line-height: 1.5; color: #1e5a3a;'><strong>🎨 Segmentation</strong> : Étiquette par pixel. (<em>Ex: Chaque pixel de l'animal est coloré</em>)</p></div></div><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 1rem; line-height: 1.5; color: #2c3e50;'><strong>💡 Résumé :</strong> La segmentation sémantique est la tâche la plus <strong>fine</strong> et la plus <strong>précise</strong> pour comprendre une scène.</p></div></div>",
    "texteParle": "Il est important de bien distinguer la segmentation sémantique des autres tâches de vision par ordinateur. Dans la classification, nous attribuons une seule étiquette à toute l'image. Par exemple, nous disons simplement que c'est une image de chat. Dans la détection d'objets, nous plaçons des boîtes englobantes autour des objets et nous les classifions. Par exemple, nous entourons chaque chat et chaque chien d'une boîte. Mais dans la segmentation sémantique, nous allons beaucoup plus loin. Nous attribuons une étiquette à chaque pixel de l'image. Ainsi, les pixels qui appartiennent au chat auront l'étiquette chat, et les pixels qui appartiennent au fond auront l'étiquette fond. C'est une analyse beaucoup plus fine et détaillée.",
    "note": "La segmentation sémantique est essentielle pour l'interprétation précise des scènes complexes."
  },
  {
    "titre": "Principes des FCN (Fully Convolutional Networks)",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Les réseaux entièrement convolutifs (FCN)</h2><div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #2c3e50;'><strong>🔑 Idée clé :</strong> Remplacer les couches <strong>fully connected (denses)</strong> par des couches <strong>convolutives</strong> pour préserver les informations spatiales.</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #7d6608;'><strong>📐 Architecture :</strong> Une FCN prend une image en entrée et produit une <strong>carte de segmentation</strong> de même taille ou plus petite que l'entrée.</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 8px; border-left: 4px solid #1abc9c; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #1a5276;'><strong>⚙️ Fonctionnement :</strong> Les FCN utilisent des <strong>convolutions</strong> et des <strong>upsampling</strong> pour restaurer la résolution spatiale après le downsampling.</p></div><div style='background-color: #f5eef8; padding: 15px; border-radius: 8px; border-left: 4px solid #8e44ad; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #4a235a;'><strong>📊 Sortie :</strong> La sortie est une carte de scores où chaque pixel a un vecteur de probabilités pour chaque classe.</p></div></div>",
    "texteParle": "Maintenant, regardons comment les réseaux de neurones peuvent réaliser la segmentation sémantique. Le premier grand modèle dans ce domaine s'appelle FCN, pour Fully Convolutional Network. Avant FCN, les réseaux de neurones pour la classification utilisaient des couches denses, ou fully connected, en fin de réseau. Mais ces couches détruisent l'information spatiale. Pour la segmentation, nous avons besoin de conserver la position de chaque pixel. L'idée de FCN est donc de remplacer toutes les couches denses par des couches convolutives. Ainsi, le réseau peut traiter une image de n'importe quelle taille et produire une carte de scores de la même taille. Cette carte contient, pour chaque pixel, un vecteur de probabilités pour chaque classe. C'est une innovation majeure qui a ouvert la voie à la segmentation par réseaux de neurones.",
    "note": "Les FCN ont posé les bases de la segmentation sémantique moderne en utilisant des réseaux entièrement convolutifs."
  },
  {
    "titre": "Architecture d'une FCN",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Architecture type d'une FCN</h2><div style='display: flex; flex-direction: column; gap: 10px;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db;'><p style='font-size: 1rem; line-height: 1.5; color: #1a5276;'><strong>1️⃣ Partie descendante (Encoder) :</strong> Des couches de convolution et de pooling pour <strong>réduire la résolution</strong> et extraire des caractéristiques de haut niveau. (Style VGG ou ResNet)</p></div><div style='background-color: #fdedec; padding: 12px; border-radius: 8px; border-left: 4px solid #e74c3c;'><p style='font-size: 1rem; line-height: 1.5; color: #7b241c;'><strong>2️⃣ Partie montante (Decoder) :</strong> Des couches de <strong>upsampling</strong> (convolution transposée ou interpolation) pour augmenter la résolution jusqu'à la taille de l'image originale.</p></div><div style='background-color: #e9f7ef; padding: 12px; border-radius: 8px; border-left: 4px solid #27ae60;'><p style='font-size: 1rem; line-height: 1.5; color: #1e5a3a;'><strong>3️⃣ Connexions de saut (Skip connections) :</strong> Connexions entre les couches de l'encodeur et du décodeur pour <strong>récupérer les détails fins</strong> perdus lors du downsampling.</p></div></div><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 1rem; line-height: 1.5; color: #2c3e50;'><strong>📌 Exemple :</strong> FCN-8s, FCN-16s, FCN-32s selon le nombre de skip connections utilisées.</p></div></div>",
    "texteParle": "L'architecture d'une FCN est assez simple à comprendre. On peut la diviser en trois parties principales. D'abord, la partie descendante, que l'on appelle aussi l'encodeur. C'est un réseau de convolution classique, comme VGG, qui va réduire progressivement la résolution de l'image tout en extrayant des caractéristiques de plus en plus abstraites. Ensuite, la partie montante, ou décodeur, qui va faire le chemin inverse. Elle va augmenter la résolution de la carte de caractéristiques pour retrouver une taille proche de l'image originale. Pour cela, on utilise des opérations d'upsampling comme la convolution transposée. Enfin, les connexions de saut, ou skip connections, sont très importantes. Elles permettent de réinjecter des informations des couches intermédiaires de l'encodeur dans le décodeur. Cela permet de récupérer les détails fins de l'image, comme les contours, qui sont perdus lors du downsampling. Il existe plusieurs versions de FCN, comme FCN-32s, FCN-16s, et FCN-8s, selon le nombre de sauts effectués.",
    "note": "Les skip connections sont essentielles pour restaurer les détails fins dans la segmentation."
  },
  {
    "titre": "U-Net : Architecture emblématique",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>U-Net : L'architecture en U</h2><div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #2c3e50;'><strong>📐 Origine :</strong> Développée pour la <strong>segmentation biomédicale</strong> (images médicales).</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 8px; border-left: 4px solid #1abc9c; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #1a5276;'><strong>🔹 Structure :</strong> Une forme de <strong>U</strong> avec une partie descendante (encodeur) et une partie montante (décodeur) symétriques.</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #7d6608;'><strong>🔗 Connexions :</strong> Des <strong>skip connections</strong> entre chaque couche de l'encodeur et la couche symétrique du décodeur, créant un chemin direct pour les détails.</p></div><div style='background-color: #f5eef8; padding: 15px; border-radius: 8px; border-left: 4px solid #8e44ad; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #4a235a;'><strong>🎯 Avantage :</strong> U-Net est très efficace avec <strong>peu de données</strong> et produit des segmentations de <strong>haute qualité</strong>.</p></div></div>",
    "texteParle": "Un autre modèle très célèbre pour la segmentation sémantique est U-Net. Il a été développé pour la segmentation d'images médicales, comme les scanners ou les IRM. Son nom vient de sa forme en U. L'architecture de U-Net est symétrique. La partie descendante, l'encodeur, réduit la résolution tout en augmentant le nombre de canaux. La partie montante, le décodeur, augmente la résolution pour retrouver la taille originale. Mais la particularité de U-Net, ce sont ses nombreuses skip connections. Chaque couche de l'encodeur est connectée à la couche correspondante du décodeur. Cela permet de transférer directement les informations spatiales de l'encodeur vers le décodeur. Ce design est très efficace, surtout quand on a peu de données d'entraînement. C'est pour cela que U-Net reste très utilisé en imagerie médicale et dans de nombreuses autres applications.",
    "note": "U-Net est particulièrement adapté aux images médicales où les données annotées sont souvent rares."
  },
  {
    "titre": "SegNet : Architecture de décodage différente",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>SegNet : Un décodeur innovant</h2><div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #2c3e50;'><strong>🔄 Principe :</strong> Utilise des <strong>indices de pooling</strong> (positions des max) pour faire l'upsampling au lieu d'apprendre des paramètres.</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 8px; border-left: 4px solid #1abc9c; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #1a5276;'><strong>📊 Fonctionnement :</strong> Lors du <strong>max-pooling</strong> dans l'encodeur, SegNet enregistre les positions des valeurs maximales. Le décodeur utilise ces positions pour placer les valeurs lors de l'upsampling.</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #7d6608;'><strong>⚡ Avantage :</strong> Permet de préserver les <strong>détails de structure</strong> (contours) sans ajouter de paramètres supplémentaires.</p></div><div style='background-color: #f5eef8; padding: 15px; border-radius: 8px; border-left: 4px solid #8e44ad; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #4a235a;'><strong>🔍 Comparaison :</strong> SegNet est souvent plus <strong>mémoire efficace</strong> que U-Net, mais peut être moins précis sur certains détails.</p></div></div>",
    "texteParle": "Parlons maintenant de SegNet, un autre modèle populaire. SegNet utilise une approche différente pour le décodage. Dans la partie descendante, quand on fait du max-pooling, on perd de l'information spatiale. SegNet va garder en mémoire la position du maximum pour chaque fenêtre de pooling. Ensuite, dans la partie montante, il utilise ces positions pour placer les valeurs lors de l'upsampling. Les autres positions sont remplies de zéros. Cela permet de reconstruire une carte de caractéristiques qui préserve bien les détails de structure, comme les contours, sans avoir à apprendre de paramètres supplémentaires. C'est une approche élégante et efficace en mémoire. SegNet est donc un bon choix quand on a des contraintes de mémoire, bien qu'il puisse être un peu moins précis que U-Net sur certains détails fins.",
    "note": "SegNet utilise les indices de max-pooling pour l'upsampling, ce qui réduit le nombre de paramètres à apprendre."
  },
  {
    "titre": "Comparaison U-Net et SegNet",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>U-Net vs SegNet</h2><div style='display: grid; grid-template-columns: 1fr; gap: 10px;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db;'><p style='font-size: 1rem; line-height: 1.5; color: #1a5276;'><strong>U-Net</strong></p><ul style='color: #2c3e50; font-size: 0.95rem; line-height: 1.4; padding-left: 20px;'><li>Connexions de saut <strong>denses</strong> entre encodeur et décodeur</li><li>Upsampling <strong>appris</strong> (convolution transposée)</li><li>Excellente précision, surtout pour les détails</li><li>Plus de paramètres, plus de mémoire</li></ul></div><div style='background-color: #fdedec; padding: 12px; border-radius: 8px; border-left: 4px solid #e74c3c;'><p style='font-size: 1rem; line-height: 1.5; color: #7b241c;'><strong>SegNet</strong></p><ul style='color: #2c3e50; font-size: 0.95rem; line-height: 1.4; padding-left: 20px;'><li>Utilise les <strong>indices de pooling</strong> pour l'upsampling</li><li>Pas de skip connections (ou moins)</li><li>Bonne précision, moins de paramètres</li><li>Plus efficace en mémoire</li></ul></div></div><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 1rem; line-height: 1.5; color: #2c3e50;'><strong>📌 À retenir :</strong> U-Net est souvent meilleur pour les détails fins, tandis que SegNet est plus léger.</p></div></div>",
    "texteParle": "Il est intéressant de comparer U-Net et SegNet, car ils représentent deux approches différentes. U-Net est très connecté. Il a des skip connections entre chaque couche de l'encodeur et du décodeur. Il utilise des convolutions transposées pour l'upsampling, ce qui permet d'apprendre les paramètres de l'upsampling. U-Net est très précis et donne d'excellents résultats, surtout pour les détails fins, comme les contours des objets. Mais il a beaucoup de paramètres et demande plus de mémoire. SegNet, de son côté, est plus léger. Il n'a pas de skip connections denses. Il utilise les indices de max-pooling pour l'upsampling, ce qui ne nécessite pas de paramètres supplémentaires. Il est donc plus efficace en mémoire, mais peut être un peu moins précis sur les détails très fins. Le choix entre les deux dépend donc de vos besoins : si vous avez besoin de la meilleure précision possible, choisissez U-Net. Si vous avez des contraintes de mémoire, SegNet est un bon compromis.",
    "note": "U-Net est recommandé pour les applications nécessitant une grande précision, tandis que SegNet est préféré pour les environnements à mémoire limitée."
  },
  {
    "titre": "Fonction de perte pour la segmentation",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Fonction de perte : Cross-Entropy</h2><div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #2c3e50;'><strong>📐 Formule :</strong> La fonction de perte standard pour la segmentation est l'<strong>entropie croisée</strong> (cross-entropy) sur chaque pixel.</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #7d6608;'><strong>🧮 Expression :</strong> <div class='math-block' style='background-color: #fcf8e8; padding: 10px; border-radius: 5px; text-align: center;'><div class='math'>$$ \\mathcal{L} = -\\frac{1}{N} \\sum_{i=1}^{N} \\sum_{c=1}^{C} y_{i,c} \\log(\\hat{y}_{i,c}) $$</div></div></p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 8px; border-left: 4px solid #1abc9c; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #1a5276;'><strong>📌 Où :</strong> <em>N</em> est le nombre de pixels, <em>C</em> le nombre de classes, <em>y</em> la vérité terrain (one-hot) et <em>ŷ</em> la prédiction du modèle.</p></div><div style='background-color: #f5eef8; padding: 15px; border-radius: 8px; border-left: 4px solid #8e44ad; margin: 10px 0;'><p style='font-size: 1rem; line-height: 1.6; color: #4a235a;'><strong>⚠️ Problème :</strong> L'entropie croisée peut être biaisée en cas de <strong>déséquilibre de classes</strong> (ex: plus de pixels de route que de piétons). Des variantes comme la <strong>Dice loss</strong> ou la <strong>Focal loss</strong> sont alors utilisées.</p></div></div>",
    "texteParle": "Pour entraîner un modèle de segmentation sémantique, nous avons besoin d'une fonction de perte qui mesure l'erreur entre la prédiction du modèle et la vérité terrain. La fonction de perte la plus classique est l'entropie croisée, ou cross-entropy. Elle compare, pour chaque pixel, la distribution de probabilités prédite par le modèle avec la distribution réelle, qui est encodée en one-hot. L'entropie croisée pénalise les pixels où le modèle n'est pas sûr de sa prédiction. Cependant, l'entropie croisée peut poser problème si les classes sont déséquilibrées. Par exemple, dans une image de rue, il y a beaucoup plus de pixels de route que de piétons. Le modèle pourrait alors être biaisé vers la classe majoritaire. Pour remédier à cela, on utilise des variantes comme la Dice loss, qui est basée sur le coefficient de Dice, ou la Focal loss, qui se concentre sur les pixels difficiles. Ces fonctions de perte sont mieux adaptées aux données déséquilibrées.",
    "note": "La Dice loss est souvent préférée à l'entropie croisée pour les données déséquilibrées en segmentation."
  },
  {
    "titre": "Métriques d'évaluation",
    "contenu": "<div style='font-family: \"Segoe UI\", Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.5rem;'>Évaluer la segmentation</h2><div style='display: grid; grid-template-columns: 1fr; gap: 10px;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db;'><p style='font-size: 1rem; line-height: 1.5; color: #1a5276;'><strong>📊 Intersection over Union (IoU) :</strong> Mesure le chevauchement entre la prédiction et la vérité terrain. <div class='math-block' style='background-color: #fcf8e8; padding: 8px; border-radius: 5px; text-align: center; margin: 5px 0;'><div class='math'>$$ IoU = \\frac{|Prédiction \\cap Vérité|}{|Prédiction \\cup Vérité|} $$</div></div>Pour chaque classe, puis moyenne (mIoU).</p></div><div style='background-color: #fdedec; padding: 12px; border-radius: 8px; border-left: 4px solid #e74c3c;'><p style='font-size: 1rem; line-height: 1.5; color: #7b241c;'><strong>📈 Coefficient de Dice :</strong> Similaire à l'IoU mais donne plus de poids au chevauchement. <div class='math-block' style='background-color: #fcf8e8; padding: 8px; border-radius: 5px; text-align: center; margin: 5px 0;'><div class='math'>$$ Dice = \\frac{2|Prédiction \\cap Vérité|}{|Prédiction| + |Vérité|} $$</div></div>Souvent utilisé pour les données déséquilibrées.</p></div></div><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 1rem; line-height: 1.5; color: #2c3e50;'><strong>💡 À retenir :</strong> La <strong>mIoU</strong> est la métrique de référence, mais le <strong>Dice</strong> est plus robuste aux déséquilibres.</p></div></div>",
    "texteParle": "Pour évaluer la performance de nos modèles de segmentation, nous utilisons des métriques spécifiques. La métrique la plus courante est l'Intersection over Union, ou IoU. Elle mesure le chevauchement entre la prédiction du modèle et la vérité terrain. L'IoU est calculée pour chaque classe, puis on fait la moyenne sur toutes les classes pour obtenir la mIoU. Une autre métrique populaire est le coefficient de Dice. Il est très similaire à l'IoU, mais donne un peu plus de poids au chevauchement. Le Dice est souvent utilisé lorsque les classes sont déséquilibrées, car il est plus robuste aux classes minoritaires. En pratique, la mIoU est la métrique de référence dans la plupart des compétitions de segmentation, comme celles de Cityscapes ou de COCO. Mais il est bon de connaître les deux métriques et de les utiliser selon le contexte.",
    "note": "La mIoU est la métrique standard pour évaluer la segmentation sémantique dans les compétitions."
  },

        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
