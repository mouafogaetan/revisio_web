<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Deep Learning - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Fondamentaux des Réseaux de Neurones",
      "points": "5 pts",
      "enonce": "<p>Un perceptron multicouche (MLP) est l'architecture de base du deep learning. Il est composé d'une couche d'entrée, de couches cachées et d'une couche de sortie.</p><p>Soit un MLP avec les caractéristiques suivantes :</p><ul><li>Couche d'entrée : 4 neurones (caractéristiques d'entrée)</li><li>Couche cachée 1 : 6 neurones avec activation ReLU</li><li>Couche cachée 2 : 4 neurones avec activation ReLU</li><li>Couche de sortie : 3 neurones avec activation Softmax</li></ul>",
      "questions": [
        {
          "question": "1) a) Calculez le nombre total de paramètres (poids et biais) de ce réseau.<br><br>b) Expliquez le rôle de la fonction d'activation ReLU. Pourquoi est-elle souvent préférée à la fonction sigmoïde dans les réseaux profonds ?<br><br>c) Pour une tâche de classification multi-classe, justifiez le choix de la fonction de coût cross-entropy plutôt que l'erreur quadratique moyenne (MSE).",
          "reponse": "<p>a) Calcul des paramètres :<br>- Couche d'entrée → cachée 1 : (4 × 6) + 6 = 24 + 6 = 30 paramètres<br>- Couche cachée 1 → cachée 2 : (6 × 4) + 4 = 24 + 4 = 28 paramètres<br>- Couche cachée 2 → sortie : (4 × 3) + 3 = 12 + 3 = 15 paramètres<br><strong>Total : 30 + 28 + 15 = 73 paramètres</strong></p><p>b) ReLU (Rectified Linear Unit) est définie par \( f(x) = \\max(0, x) \). Elle est préférée car elle atténue le problème du gradient évanescent (sa dérivée est 1 pour \( x > 0 \)) et permet un entraînement plus rapide.</p><p>c) La cross-entropy est adaptée à la classification car elle mesure l'écart entre une distribution de probabilités prédite et la distribution réelle (one-hot). La MSE est plus adaptée aux problèmes de régression.</p>"
        },
        {
          "question": "2) On vous donne un nouvel échantillon \( x = [0.5, -0.3, 1.2, 0.8] \). Écrivez les équations de la propagation avant (forward pass) pour ce réseau.",
          "reponse": "<p>Pour la couche cachée 1 :<br>\( z_1 = W_1 \\cdot x + b_1 \)<br>\( a_1 = \\text{ReLU}(z_1) \)</p><p>Pour la couche cachée 2 :<br>\( z_2 = W_2 \\cdot a_1 + b_2 \)<br>\( a_2 = \\text{ReLU}(z_2) \)</p><p>Pour la couche de sortie :<br>\( z_3 = W_3 \\cdot a_2 + b_3 \)<br>\( \\hat{y} = \\text{Softmax}(z_3) \)</p>"
        }
      ]
    },
    {
      "titre": "Rétropropagation et Optimisation",
      "points": "5 pts",
      "enonce": "<p>La rétropropagation (backpropagation) est l'algorithme clé qui permet d'entraîner les réseaux de neurones en calculant les gradients de la fonction de coût par rapport aux paramètres du modèle.</p><p>On considère un réseau simple avec une couche cachée :<br>Entrée \( x \\), couche cachée \( h = \\sigma(W_1 x + b_1) \), sortie \( \\hat{y} = W_2 h + b_2 \).</p>",
      "questions": [
        {
          "question": "3) a) Expliquez le principe de la rétropropagation et le rôle de la règle de la chaîne dans ce processus.<br><br>b) Écrivez l'équation du gradient de la fonction de coût par rapport au poids \( W_2 \) de la couche de sortie, en supposant une fonction de coût MSE : \( L = \\frac{1}{2}(y - \\hat{y})^2 \).<br><br>c) L'optimiseur Adam combine les avantages de Momentum et de RMSprop. Expliquez brièvement son fonctionnement et pourquoi il est souvent préféré à la SGD classique.",
          "reponse": "<p>a) La rétropropagation propage l'erreur de la sortie vers l'entrée en calculant les dérivées partielles de la fonction de coût par rapport à chaque poids. La règle de la chaîne permet de décomposer le calcul du gradient en produits de dérivées locales.</p><p>b) \( \\frac{\\partial L}{\\partial W_2} = \\frac{\\partial L}{\\partial \\hat{y}} \\cdot \\frac{\\partial \\hat{y}}{\\partial W_2} = -(y - \\hat{y}) \\cdot h^T \)</p><p>c) Adam maintient une moyenne exponentielle des gradients (momentum) et des carrés des gradients (RMSprop), avec des corrections de biais. Il est robuste au choix du taux d'apprentissage et converge rapidement.</p>"
        }
      ]
    },
    {
      "titre": "CNN et Vision par Ordinateur",
      "points": "6 pts",
      "enonce": "<p>Les Réseaux de Neurones Convolutifs (CNN) sont la base de la vision par ordinateur moderne. Ils exploitent la structure spatiale des images grâce aux couches de convolution et de pooling.</p><p>On considère une image d'entrée de taille \( 32 \\times 32 \) avec 3 canaux (RGB). On applique une couche de convolution avec 16 filtres de taille \( 5 \\times 5 \), un stride de 1 et un padding de 2.</p>",
      "questions": [
        {
          "question": "4) a) Calculez la taille de la carte de caractéristiques en sortie de cette convolution. Justifiez votre réponse avec la formule appropriée.<br><br>b) Décrivez le rôle de la couche de pooling (max pooling) dans un CNN. Quel est l'impact d'un pooling \( 2 \\times 2 \) avec stride 2 sur la taille de l'image ?<br><br>c) Dans un contexte de classification d'images au Cameroun (ex: reconnaissance de cultures agricoles), le transfert learning avec un modèle pré-entraîné (ResNet) est souvent utilisé. Expliquez le principe du transfert learning et les étapes du fine-tuning.",
          "reponse": "<p>a) Formule : \( \\text{TailleSortie} = \\frac{\\text{TailleEntrée} - \\text{TailleFiltre} + 2 \\times \\text{Padding}}{\\text{Stride}} + 1 \)<br>\( \\text{TailleSortie} = \\frac{32 - 5 + 2 \\times 2}{1} + 1 = \\frac{32 - 5 + 4}{1} + 1 = 31 + 1 = 32 \)<br>La carte de caractéristiques fait \( 32 \\times 32 \\times 16 \) (16 filtres).</p><p>b) Le max pooling réduit la dimension en prenant la valeur maximale dans chaque fenêtre. Un pooling \( 2 \\times 2 \) avec stride 2 divise la taille de l'image par 2 (ex: 32×32 → 16×16).</p><p>c) Le transfert learning consiste à réutiliser un modèle pré-entraîné sur un grand dataset (ImageNet). Le fine-tuning consiste à :<br>1. Remplacer la couche de classification par une nouvelle couche adaptée au problème.<br>2. Entraîner le modèle sur le nouveau dataset avec un taux d'apprentissage faible pour ajuster les poids.</p>"
        }
      ]
    },
    {
      "titre": "RNN et Données Séquentielles",
      "points": "4 pts",
      "enonce": "<p>Les RNN sont conçus pour traiter des données séquentielles. Ils sont utilisés pour des tâches comme la prévision de séries temporelles, le traitement du langage naturel et la traduction automatique.</p>",
      "questions": [
        {
          "question": "5) a) Expliquez le problème du gradient évanescent dans les RNN classiques et comment LSTM permet de le résoudre.<br><br>b) Pour une tâche de prévision des prix du cacao au Cameroun, vous devez choisir entre un LSTM et un GRU. Comparez ces deux architectures et justifiez votre choix.",
          "reponse": "<p>a) Le gradient évanescent se produit lorsque les gradients deviennent très petits dans les couches profondes, ralentissant l'apprentissage. LSTM utilise des portes (entrée, sortie, oubli) et une cellule mémoire pour contrôler le flux d'information, permettant de conserver des dépendances à long terme.</p><p>b) LSTM a 3 portes (entrée, sortie, oubli), GRU en a 2 (mise à jour, reset). GRU est plus simple et rapide, LSTM est plus expressif. Pour la prévision des prix du cacao, un LSTM est recommandé si on a des séries longues avec des dépendances complexes. Sinon, un GRU suffit.</p>"
        }
      ]
    },
    {
      "titre": "Transformers et NLP",
      "points": "5 pts",
      "enonce": "<p>Les Transformers ont révolutionné le traitement automatique du langage naturel. Ils utilisent le mécanisme d'attention pour capturer les relations entre les mots d'une phrase.</p><p>BERT (Bidirectional Encoder Representations from Transformers) est un modèle pré-entraîné très utilisé pour les tâches de classification de texte.</p>",
      "questions": [
        {
          "question": "6) a) Expliquez le mécanisme d'attention dans un Transformer. En quoi diffère-t-il des mécanismes utilisés dans les RNN ?<br><br>b) Vous devez classifier des avis clients en français et en pidgin english. Proposez une stratégie utilisant BERT ou un modèle multilingue. Quelles étapes suivriez-vous pour le fine-tuning ?<br><br>c) Quelles sont les principales différences entre GPT (génération) et BERT (classification) ?",
          "reponse": "<p>a) L'attention permet au modèle de pondérer l'importance de chaque mot par rapport aux autres. Contrairement aux RNN (séquentiels), l'attention est parallélisable et capture mieux les dépendances longues.</p><p>b) Stratégie :<br>1. Utiliser mBERT (BERT multilingue) ou XLM-R.<br>2. Collecter et annoter un corpus d'avis en français et pidgin.<br>3. Fine-tuner le modèle sur ce corpus avec un taux d'apprentissage faible.<br>4. Évaluer avec la précision et le F1-score.</p><p>c) BERT est un encodeur bidirectionnel (MLM) pour la compréhension du langage. GPT est un décodeur auto-régressif (génération de texte).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
