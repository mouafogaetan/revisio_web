                skipHtmlTypes: 'script',

            }

    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>

</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Deep Learning - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Architectures CNN et Transfert Learning",
      "points": "5 pts",
      "enonce": "<div><p>Cet exercice porte sur les réseaux de neurones convolutifs (CNN), les architectures profondes et le transfert learning.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Expliquer le problème du gradient évanescent dans les réseaux profonds et comment ResNet le résout grâce aux connexions résiduelles (skip connections).</p>",
          "reponse": "<p><strong>Réponse 1.1</strong></p><p>Le gradient évanescent se produit lorsque le gradient de la fonction de coût, en se propageant des couches de sortie vers les couches d'entrée, devient très petit. Cela est dû à la multiplication répétée de gradients inférieurs à 1 (notamment avec les fonctions d'activation sigmoïde ou tanh). Les couches profondes apprennent alors très lentement, voire pas du tout.</p><p>ResNet résout ce problème en introduisant des connexions résiduelles (skip connections) :</p><div class='math-block'><div class='math'>$$y = F(x, \\{W_i\\}) + x$$</div></div><p>Le gradient peut alors circuler directement via la connexion résiduelle, contournant les couches intermédiaires. Même si les gradients sont petits dans les couches, le gradient global reste significatif. De plus, il est plus facile d'apprendre une correction $F(x)$ que toute la fonction $H(x)$.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Décrire le principe du transfert learning en vision par ordinateur. Expliquer la différence entre l'extraction de caractéristiques et le fine-tuning d'un modèle pré-entraîné.</p>",
          "reponse": "<p><strong>Réponse 1.2</strong></p><p>Le transfert learning consiste à réutiliser un modèle pré-entraîné sur une grande tâche générique (comme la classification sur ImageNet) pour une nouvelle tâche avec moins de données.</p><p><strong>Extraction de caractéristiques :</strong> On utilise le modèle pré-entraîné comme extracteur de caractéristiques. Les couches convolutionnelles sont gelées et servent à transformer les images en vecteurs de caractéristiques. Seule la couche de classification finale est entraînée sur le nouveau jeu de données.</p><p><strong>Fine-tuning :</strong> On dégèle les dernières couches du modèle pré-entraîné et on les réentraîne sur le nouveau jeu de données avec un faible taux d'apprentissage. On peut aussi adapter toutes les couches si on a suffisamment de données.</p><p>Le fine-tuning donne généralement de meilleurs résultats quand on a assez de données, tandis que l'extraction est plus rapide et nécessite moins de ressources.</p>"
        }
      ]
    },
    {
      "titre": "RNN, LSTM et Problème du Gradient Évanescent",
      "points": "6 pts",
      "enonce": "<div><p>Cet exercice explore les architectures récurrentes (RNN, LSTM) et leurs applications aux séries temporelles.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Soit un RNN simple avec la mise à jour suivante : $h_t = \\phi(W_{xh} x_t + W_{hh} h_{t-1} + b_h)$. Expliquer pourquoi les RNNs souffrent du problème du gradient évanescent lors de la rétropropagation à travers le temps (BPTT) pour de longues séquences.</p>",
          "reponse": "<p><strong>Réponse 2.1</strong></p><p>Dans un RNN, l'état caché $h_t$ dépend de $h_{t-1}$, qui dépend de $h_{t-2}$, etc. Lors de la rétropropagation à travers le temps (BPTT), le gradient de l'erreur à un pas $T$ par rapport à un paramètre $W_{hh}$ est une somme de produits de matrices $\\frac{\\partial h_k}{\\partial h_{k-1}}$[citation:5].</p><p>Si les valeurs propres de $W_{hh}$ sont inférieures à 1, le produit de matrices tend vers 0, d'où le gradient évanescent. Inversement, si elles sont supérieures à 1, le gradient explose.</p><p>Le gradient évanescent empêche le RNN d'apprendre des dépendances à long terme, car l'information des premiers pas se dissipe rapidement.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Décrire l'architecture LSTM et expliquer comment les portes (forget gate, input gate, output gate) permettent de résoudre le problème du gradient évanescent.</p>",
          "reponse": "<p><strong>Réponse 2.2</strong></p><p>LSTM introduit une cellule mémoire $c_t$ et trois portes gérées par des sigmoïdes[citation:7] :</p><ul><li><strong>Forget gate</strong> : $f_t = \\sigma(W_f \\cdot [h_{t-1}, x_t] + b_f)$ - décide quelles informations oublier de la cellule mémoire</li><li><strong>Input gate</strong> : $i_t = \\sigma(W_i \\cdot [h_{t-1}, x_t] + b_i)$ - décide quelles informations ajouter à la cellule</li><li><strong>Output gate</strong> : $o_t = \\sigma(W_o \\cdot [h_{t-1}, x_t] + b_o)$ - décide quoi exporter comme sortie</li></ul><div class='math-block'><div class='math'>$$c_t = f_t \\odot c_{t-1} + i_t \\odot \\tilde{c}_t$$</div></div><div class='math-block'><div class='math'>$$h_t = o_t \\odot \\tanh(c_t)$$</div></div><p>La cellule mémoire permet au gradient de circuler directement avec une atténuation contrôlée par la forget gate (qui peut être proche de 1)[citation:5]. Cela permet de préserver les informations sur de longues périodes et d'éviter la disparition du gradient.</p>"
        }
      ]
    },
    {
      "titre": "Transformers et Mécanismes d'Attention",
      "points": "5 pts",
      "enonce": "<div><p>Cet exercice porte sur les mécanismes d'attention et l'architecture Transformer.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Expliquer le principe du mécanisme d'attention scaled dot-product utilisé dans les Transformers. Donner la formule et expliquer le rôle du facteur de scaling.</p>",
          "reponse": "<p><strong>Réponse 3.1</strong></p><p>L'attention scaled dot-product calcule l'attention entre une requête $Q$ et des clés $K$ pour produire des poids sur les valeurs $V$ :</p><div class='math-block'><div class='math'>$$Attention(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$</div></div><p>Le facteur de scaling $\\sqrt{d_k}$ (où $d_k$ est la dimension des clés) permet d'éviter que le produit scalaire ne devienne trop grand quand la dimension est élevée, ce qui ferait entrer le softmax dans une zone où le gradient est très faible[citation:9].</p><p>L'attention multi-têtes applique ce mécanisme plusieurs fois en parallèle avec des projections linéaires différentes, permettant de capturer différents types de relations dans les données[citation:9].</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Comparer les architectures RNN/LSTM et Transformers. Expliquer pourquoi les Transformers sont devenus la référence pour le traitement du langage naturel.</p>",
          "reponse": "<p><strong>Réponse 3.2</strong></p><table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'><tr style='background: #1a237e;'><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>Critère</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>RNN/LSTM</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>Transformer</th></tr><tr style='background: #e3f2fd;'><td style='padding: 8px; border: 1px solid #90caf9;'>Traitement</td><td style='padding: 8px; border: 1px solid #90caf9;'>Séquentiel</td><td style='padding: 8px; border: 1px solid #90caf9;'>Parallèle</td></tr><tr style='background: #e8f5e9;'><td style='padding: 8px; border: 1px solid #90caf9;'>Dépendances longues</td><td style='padding: 8px; border: 1px solid #90caf9;'>Difficiles (LSTM améliore)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Excellentes (attention)</td></tr><tr style='background: #f3e5f5;'><td style='padding: 8px; border: 1px solid #90caf9;'>Vitesse d'entraînement</td><td style='padding: 8px; border: 1px solid #90caf9;'>Lente</td><td style='padding: 8px; border: 1px solid #90caf9;'>Rapide</td></tr></table><p>Les Transformers sont devenus la référence car ils résolvent plusieurs limitations des RNN : le traitement parallèle permet d'entraîner sur des corpus beaucoup plus grands[citation:7], et le mécanisme d'attention permet de capturer des dépendances à très longue distance sans les limitations séquentielles des RNN[citation:7].</p>"
        }
      ]
    },
    {
      "titre": "Autoencodeurs et Modèles Génétatifs",
      "points": "4 pts",
      "enonce": "<div><p>Cet exercice aborde les autoencodeurs, les VAE et les GANs.</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Décrire l'architecture d'un autoencodeur et expliquer son principe d'apprentissage par reconstruction[citation:9].</p>",
          "reponse": "<p><strong>Réponse 4.1</strong></p><p>Un autoencodeur est composé de deux parties :</p><ul><li><strong>Encodeur</strong> : compresse l'entrée $x$ en une représentation latente $z$ de dimension réduite (espace latent)</li><li><strong>Décodeur</strong> : reconstruit l'entrée à partir de la représentation $z$ pour produire $x'$</li></ul><p>L'apprentissage consiste à minimiser l'erreur de reconstruction entre l'entrée $x$ et la sortie $x'$[citation:9]. Cette contrainte de reconstruction force l'autoencodeur à capturer les variations les plus importantes des données dans l'espace latent.</p><p>Les autoencodeurs sont utilisés pour la réduction de dimension, le débruitage (denoising autoencoder), et comme base pour des modèles génétatifs plus avancés comme les VAE.</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Expliquer le principe des GANs (Generative Adversarial Networks) et le rôle du générateur et du discriminateur[citation:9].</p>",
          "reponse": "<p><strong>Réponse 4.2</strong></p><p>Un GAN est composé de deux réseaux antagonistes :</p><ul><li><strong>Générateur (G)</strong> : prend un bruit aléatoire $z$ en entrée et génère des échantillons $G(z)$ qui imitent la distribution des données réelles</li><li><strong>Discriminateur (D)</strong> : prend des échantillons (réels ou générés) et prédit s'ils sont authentiques</li></ul><p>L'entraînement est un jeu à somme nulle :</p><ul><li>Le générateur cherche à tromper le discriminateur en générant des échantillons de plus en plus réalistes</li><li>Le discriminateur cherche à distinguer les vrais des faux</li></ul><p>Cette compétition pousse les deux réseaux à s'améliorer progressivement[citation:9]. Le générateur finit par produire des échantillons de haute qualité, indiscernables des données réelles. Des variantes comme DCGAN ou StyleGAN ont permis des avancées spectaculaires en génération d'images.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
