<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Deep Learning - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Fondamentaux du Perceptron et MLP",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Le perceptron multicouche (MLP) est l'un des fondements du deep learning. Pour en comprendre le fonctionnement, nous allons étudier un exemple simple.</p><p>On considère un neurone artificiel dont l'entrée est \\( x = (x_1, x_2) \\) avec \\( x_1 = 0.5 \\) et \\( x_2 = 0.8 \\). Les poids sont \\( w_1 = 0.4 \\), \\( w_2 = 0.6 \\) et le biais est \\( b = -0.2 \\).</p><p>Définissez la fonction d'activation sigmoïde : \\( \\sigma(z) = \\frac{1}{1 + e^{-z}} \\).</p></div>",
     "questions":[
       {
         "question": "1) Calculez la somme pondérée \\( z \\) avant activation.",
         "reponse": "\\( z = w_1 \\cdot x_1 + w_2 \\cdot x_2 + b = 0.4 \\times 0.5 + 0.6 \\times 0.8 - 0.2 = 0.2 + 0.48 - 0.2 = 0.48 \\)"
       },
       {
         "question": "2) Calculez l'activation \\( a = \\sigma(z) \\) du neurone. On donnera le résultat arrondi à 10⁻³.",
         "reponse": "\\( a = \\sigma(0.48) = \\frac{1}{1 + e^{-0.48}} \\approx 0.618 \\)"
       },
       {
         "question": "3) Expliquez brièvement pourquoi le perceptron simple ne peut pas résoudre le problème XOR.",
         "reponse": "Le perceptron simple est un classifieur linéaire. Le problème XOR (ou exclusif) n'est pas linéairement séparable, c'est-à-dire qu'il est impossible de trouver une droite qui sépare les points (0,0) et (1,1) des points (0,1) et (1,0). Par conséquent, un perceptron simple ne peut pas résoudre ce problème."
       }
     ]
   },
   {
     "titre": "Architectures RNN et LSTM",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'><p>Les réseaux de neurones récurrents (RNN) sont conçus pour traiter des données séquentielles. Cependant, ils souffrent du problème du gradient évanescent. Les LSTM ont été proposés pour y remédier.</p></div>",
     "questions":[
       {
         "question": "1) Décrivez le principe de fonctionnement d'un RNN en expliquant le rôle de l'état caché \\( h_t \\).",
         "reponse": "Un RNN traite les données séquentiellement. À chaque pas de temps \\( t \\), il reçoit en entrée le token courant \\( x_t \\) et l'état caché précédent \\( h_{t-1} \\) (qui résume l'information des pas précédents). Il calcule un nouvel état caché \\( h_t \\) à l'aide d'une fonction de transition non linéaire \\( h_t = f(W_{hh} h_{t-1} + W_{xh} x_t + b_h) \\). Cet état caché est utilisé pour prédire la sortie suivante et est transmis au pas suivant."
       },
       {
         "question": "2) Expliquez en quoi consiste le problème du gradient évanescent dans les RNN.",
         "reponse": "Lors de la rétropropagation dans le temps, les gradients doivent traverser de nombreuses étapes temporelles. La multiplication répétée des gradients peut entraîner leur décroissance exponentielle (problème du gradient évanescent), ce qui rend difficile l'apprentissage des dépendances à long terme. Les informations importantes peuvent être 'oubliées' car les gradients deviennent trop petits pour mettre à jour efficacement les poids des couches éloignées dans le temps."
       },
       {
         "question": "3) Quels sont les mécanismes des portes d'un LSTM et comment permettent-ils de résoudre le problème du gradient évanescent ?",
         "reponse": "Un LSTM possède trois portes : la porte d'oubli (décide quelles informations de l'état cellulaire précédent doivent être oubliées), la porte d'entrée (décide quelles nouvelles informations doivent être ajoutées à l'état cellulaire), et la porte de sortie (filtre l'état cellulaire pour produire l'état caché). Ces portes contrôlent le flux d'information grâce à des fonctions sigmoïdes. L'état cellulaire peut transporter des informations sur de très longues séquences sans dégradation, ce qui résout le problème du gradient évanescent et permet au modèle de capturer des dépendances à long terme."
       }
     ]
   },
   {
     "titre": "Transformers et Mécanismes d'Attention",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'><p>Le mécanisme d'attention et l'architecture Transformer ont révolutionné le traitement automatique du langage. Nous allons étudier les principes de base de l'attention.</p></div>",
     "questions":[
       {
         "question": "1) Quels sont les trois composants principaux du mécanisme d'attention (Query, Key, Value) ? Expliquez le rôle de chacun.",
         "reponse": "Query (Q) représente la requête ou la question posée. Key (K) représente les clés indexées qui sont comparées à la requête. Value (V) représente les valeurs qui contiennent l'information à récupérer. Le mécanisme d'attention calcule la similarité entre la Query et les Keys pour déterminer les poids d'attention, puis effectue une moyenne pondérée des Values pour produire la sortie."
       },
       {
         "question": "2) Donnez la formule de l'attention scaled dot-product et expliquez le rôle du facteur de scaling \\( \\sqrt{d_k} \\) dans la formule.",
         "reponse": "La formule est \\( \\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right) V \\). Le facteur de scaling \\( \\sqrt{d_k} \\) permet d'éviter que les produits scalaires ne deviennent trop grands, ce qui pourrait pousser le softmax vers des extrêmes et causer des problèmes de gradient. Cette normalisation stabilise l'apprentissage."
       },
       {
         "question": "3) Qu'est-ce que l'attention multi-têtes et pourquoi est-elle bénéfique dans les Transformers ?",
         "reponse": "L'attention multi-têtes exécute plusieurs mécanismes d'attention en parallèle, chacun avec ses propres projections de Q, K et V. Les résultats de toutes les têtes sont concaténés et projetés pour obtenir la sortie finale. Cette approche est bénéfique car chaque tête peut se concentrer sur différents aspects des données (relations de différentes natures), ce qui permet au modèle d'apprendre des représentations plus riches et de capturer différents types de dépendances."
       }
     ]
   },
   {
     "titre": "Projet : Analyse de Sentiments avec BERT",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Vous travaillez pour une entreprise camerounaise qui souhaite analyser les sentiments des clients à partir d'avis en français sur les réseaux sociaux. Vous devez utiliser BERT pour cette tâche.</p></div>",
     "questions":[
       {
         "question": "1) Expliquez les étapes clés du fine-tuning de BERT pour une tâche d'analyse de sentiments.",
         "reponse": "Les étapes clés sont : (1) Chargement du modèle pré-entraîné BERT adapté au français (ex: Camembert) avec AutoModelForSequenceClassification.from_pretrained, (2) Chargement du tokenizer associé et tokenisation des textes avec ajout des tokens spéciaux [CLS] et [SEP], (3) Définition du nombre de classes (par exemple 3 : positif, négatif, neutre), (4) Préparation des données avec un Dataset, (5) Définition des arguments d'entraînement (learning_rate=2e-5, epochs=3-5), (6) Entraînement avec la classe Trainer, (7) Évaluation sur un ensemble de test."
       },
       {
         "question": "2) Quels sont les principaux avantages de BERT par rapport à des modèles classiques comme TF-IDF + SVM pour l'analyse de sentiments ?",
         "reponse": "BERT offre une compréhension contextuelle du langage grâce à son attention bidirectionnelle. Contrairement aux modèles classiques qui traitent les mots de manière indépendante ou unidirectionnelle, BERT lit le texte dans les deux sens, ce qui lui permet de comprendre le contexte global. Il capture également les relations sémantiques complexes et les dépendances à longue distance, ce qui donne de meilleures performances sur des textes naturels. BERT est pré-entraîné sur d'énormes corpus, ce qui lui donne une connaissance linguistique solide avant le fine-tuning."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
