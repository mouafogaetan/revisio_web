<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Deep Learning - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de cours sur les Fondamentaux",
     "points": "8 pts",
     "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Cet exercice porte sur les chapitres 1 et 2 du cours (Fondamentaux des réseaux de neurones et CNN). Répondez de manière concise mais précise.</div>",
     "questions": [
       {
         "question": "1) Définissez un <strong>Perceptron Multicouche (MLP)</strong> et décrivez son architecture. Citez deux fonctions d'activation couramment utilisées et donnez leurs formules.",
         "reponse": "Un <strong>Perceptron Multicouche (MLP)</strong> est un réseau de neurones feedforward composé d'une couche d'entrée, d'une ou plusieurs couches cachées et d'une couche de sortie. Chaque neurone d'une couche est connecté à tous les neurones de la couche suivante (connexion fully connected).<br><br>Deux fonctions d'activation courantes :<br><ul><li><strong>Sigmoid :</strong> \\( \\sigma(x) = \\frac{1}{1 + e^{-x}} \\)</li><li><strong>ReLU :</strong> \\( f(x) = \\max(0, x) \\)</li></ul>"
       },
       {
         "question": "2) Expliquez le principe de la <strong>rétropropagation du gradient (backpropagation)</strong> et son importance pour l'entraînement des réseaux de neurones.",
         "reponse": "La <strong>rétropropagation du gradient</strong> est un algorithme qui permet de calculer les gradients de la fonction de coût par rapport à tous les poids du réseau [citation:11]. Elle repose sur la règle de la chaîne (chain rule) pour propager l'erreur de la sortie vers l'entrée à travers les couches. Elle est essentielle car elle permet d'ajuster les poids pour minimiser l'erreur de prédiction."
       },
       {
         "question": "3) Qu'est-ce qu'une <strong>couche de convolution</strong> dans un CNN ? Expliquez les paramètres <strong>stride</strong> et <strong>padding</strong>.",
         "reponse": "Une <strong>couche de convolution</strong> applique des filtres (ou noyaux) sur l'image d'entrée pour extraire des caractéristiques locales comme les bords et les textures [citation:11].<br><ul><li><strong>Stride</strong> : le nombre de pixels dont on décale le filtre à chaque étape.</li><li><strong>Padding</strong> : l'ajout de pixels (généralement des zéros) autour de l'image pour contrôler la taille de la sortie et éviter la perte d'informations en bordure [citation:4][citation:11].</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Calculs autour des CNN",
     "points": "6 pts",
     "enonce": "<div style='font-size:1.1em; line-height:1.6;'>On considère une couche de convolution avec une image d'entrée de taille 32x32x3, un filtre de taille 5x5, un stride de 1 et un padding de 0.</div>",
     "questions": [
       {
         "question": "1) Calculez la taille de la carte de caractéristiques (feature map) en sortie.",
         "reponse": "La formule pour calculer la taille de sortie d'une convolution est : <div class='math-block'> <div class='math'>$$\\text{taille}_{sortie} = \\frac{\\text{taille}_{entrée} - \\text{taille}_{filtre} + 2 \\times \\text{padding}}{\\text{stride}} + 1$$</div></div><br>Ici : (32 - 5 + 0) / 1 + 1 = 28. La carte de caractéristiques aura une taille de 28x28."
       },
       {
         "question": "2) Si on utilise 80 filtres, quelle est la profondeur de la sortie et quel est le nombre total de paramètres (poids + biais) de cette couche ?",
         "reponse": "La profondeur de la sortie est égale au nombre de filtres, soit 80.<br><br>Nombre de paramètres : chaque filtre a 5x5x3 = 75 poids. Pour 80 filtres, cela fait 80 x 75 = 6000 poids, plus 80 biais (un par filtre), soit un total de <strong>6080 paramètres</strong> [citation:11]."
       },
       {
         "question": "3) Si on ajoute une couche de pooling 2x2 avec un stride de 2 après cette convolution, quelle sera la taille de la sortie ?",
         "reponse": "La formule pour le pooling est : taille_sortie = (taille_entrée - taille_fenêtre) / stride + 1. Ici : (28 - 2) / 2 + 1 = 14. La sortie aura une taille de 14x14x80."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Architectures CNN Classiques",
     "points": "4 pts",
     "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Les architectures comme LeNet-5, AlexNet, VGGNet, GoogLeNet et ResNet ont marqué l'histoire du deep learning. Répondez aux questions suivantes.</div>",
     "questions": [
       {
         "question": "1) Citez les trois principales innovations introduites par <strong>AlexNet</strong> qui ont permis de remporter le concours ImageNet en 2012.",
         "reponse": "<ul><li>L'utilisation de la fonction d'activation <strong>ReLU</strong> pour accélérer l'apprentissage.</li><li>L'utilisation de la technique de régularisation <strong>dropout</strong> pour réduire le surapprentissage.</li><li>L'utilisation de <strong>GPU</strong> pour l'entraînement, permettant une architecture plus profonde [citation:4].</li></ul>"
       },
       {
         "question": "2) Quelle est la principale caractéristique de l'architecture <strong>VGGNet</strong> ? Quel est l'avantage d'utiliser des filtres 3x3 de manière répétée ?",
         "reponse": "VGGNet se caractérise par l'utilisation systématique de <strong>filtres de taille 3x3</strong> avec un stride de 1 et un padding de 1, et des couches de pooling 2x2. L'avantage est que deux couches 3x3 successives ont un champ réceptif équivalent à une couche 5x5, mais avec plus de non-linéarité et moins de paramètres."
       },
       {
         "question": "3) Expliquez le rôle des <strong>connexions résiduelles (skip connections)</strong> introduites dans ResNet.",
         "reponse": "Les connexions résiduelles permettent de résoudre le problème du gradient évanescent dans les réseaux profonds [citation:4]. Elles ajoutent la sortie d'une couche à la sortie d'une couche plus profonde, ce qui permet au gradient de circuler directement sans être atténué par les couches intermédiaires. Cela permet de construire des réseaux très profonds (plus de 100 couches)."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Problème de Conception de CNN",
     "points": "7 pts",
     "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Vous êtes chargé de concevoir un CNN pour la classification d'images de fruits et légumes. Vous disposez d'un jeu de données de 10 000 images réparties en 10 catégories. Les images font 128x128 pixels en couleurs (3 canaux).</div>",
     "questions": [
       {
         "question": "1) Proposez une architecture CNN simple (nombre de couches, types de couches, et leur rôle) adaptée à ce problème.",
         "reponse": "<ul><li><strong>Couche d'entrée :</strong> 128x128x3</li><li><strong>Couche de convolution :</strong> 32 filtres 3x3, activation ReLU, padding='same' → extraction de caractéristiques de bas niveau.</li><li><strong>Couche de pooling :</strong> MaxPooling 2x2, stride 2 → réduction de dimension.</li><li><strong>Couche de convolution :</strong> 64 filtres 3x3, activation ReLU → extraction de caractéristiques de niveau intermédiaire.</li><li><strong>Couche de pooling :</strong> MaxPooling 2x2, stride 2 → réduction de dimension.</li><li><strong>Couche de convolution :</strong> 128 filtres 3x3, activation ReLU → extraction de caractéristiques de haut niveau.</li><li><strong>Couche de pooling :</strong> MaxPooling 2x2, stride 2 → réduction de dimension.</li><li><strong>Flatten :</strong> Aplatir les caractéristiques.</li><li><strong>Couche dense :</strong> 256 neurones, activation ReLU, dropout 0.5 → classification.</li><li><strong>Couche de sortie :</strong> 10 neurones avec activation softmax → prédiction des 10 classes [citation:11].</li></ul>"
       },
       {
         "question": "2) Expliquez comment vous évalueriez les performances de votre modèle (métriques et protocole d'évaluation).",
         "reponse": "Pour évaluer les performances, j'utiliserais :<br><ul><li><strong>Accuracy (précision globale)</strong> : pourcentage de classifications correctes.</li><li><strong>Matrice de confusion</strong> : pour visualiser les erreurs par classe.</li><li><strong>F1-score</strong> : particulièrement utile si les classes sont déséquilibrées.</li><li><strong>Protocole :</strong> division des données en ensembles d'entraînement (70%), de validation (15%) et de test (15%), avec validation croisée si les données sont limitées.</li></ul>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
