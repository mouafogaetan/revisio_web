<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Deep Learning - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours",
      "points": "6 pts",
      "enonce": "<p>Répondez de manière précise et concise aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Expliquez ce qu'est un perceptron simple et citez l'une de ses principales limites.</p>",
          "reponse": "<p>Un perceptron simple est un classifieur binaire qui applique une fonction d'activation par seuil à une combinaison linéaire des entrées. Sa principale limite est son incapacité à résoudre des problèmes non linéairement séparables, comme le OU exclusif (XOR).</p>"
        },
        {
          "question": "<p><strong>1.2</strong> En quoi la rétropropagation (backpropagation) est-elle essentielle pour l'apprentissage des réseaux de neurones multicouches ? Faites un lien avec la règle de la chaîne.</p>",
          "reponse": "<p>La rétropropagation est essentielle car elle permet de calculer le gradient de la fonction de coût par rapport à chaque poids du réseau. Elle utilise la règle de la chaîne pour propager l'erreur de la sortie vers les couches cachées, calculant ainsi la contribution de chaque poids à l'erreur totale et permettant leur mise à jour via descente de gradient.</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Citez deux fonctions d'activation couramment utilisées et donnez une caractéristique pour chacune.</p>",
          "reponse": "<p><strong>ReLU</strong> : \\( f(x) = \\max(0, x) \\). Elle est simple et efficace, mais peut entraîner la mort des neurones pour des valeurs négatives. <br><strong>Sigmoid</strong> : \\( \\sigma(x) = \\frac{1}{1 + e^{-x}} \\). Elle borne les sorties entre 0 et 1, mais souffre du problème du gradient évanescent.</p>"
        },
        {
          "question": "<p><strong>1.4</strong> Expliquez le concept de transfert d'apprentissage (transfer learning) et pourquoi il est intéressant pour les tâches de vision par ordinateur.</p>",
          "reponse": "<p>Le transfert d'apprentissage consiste à utiliser un modèle pré-entraîné sur une grande tâche générique (ex: classification sur ImageNet) comme point de départ pour une nouvelle tâche. Il est intéressant car il permet d'obtenir de bonnes performances avec beaucoup moins de données et de temps d'entraînement, en réutilisant les caractéristiques générales apprises par le modèle.</p>"
        },
        {
          "question": "<p><strong>1.5</strong> Quel est le principal problème des RNN classiques dans le traitement de longues séquences et comment les LSTM tentent-ils de le résoudre ?</p>",
          "reponse": "<p>Le principal problème est le gradient évanescent, où les gradients deviennent très petits en se propageant à travers de nombreuses étapes temporelles, empêchant l'apprentissage des dépendances à long terme. Les LSTM tentent de résoudre ce problème en introduisant une cellule mémoire et des portes (oubli, entrée, sortie) qui permettent de contrôler le flux d'information et de maintenir un gradient constant sur de longues périodes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Problème - Optimisation et Régularisation",
      "points": "8 pts",
      "enonce": "<p>On considère un problème d'apprentissage supervisé où l'on cherche à minimiser une fonction de coût. L'objectif est d'étudier l'impact des techniques d'optimisation et de régularisation.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Définissez le principe de la descente de gradient stochastique (SGD) et citez un avantage et un inconvénient de cette méthode par rapport à la descente de gradient classique (batch).</p>",
          "reponse": "<p>La descente de gradient stochastique (SGD) met à jour les poids en utilisant un seul échantillon (ou un petit lot) à la fois pour estimer le gradient. <br><strong>Avantage :</strong> Elle est beaucoup plus rapide et permet de traiter de très grands jeux de données. <br><strong>Inconvénient :</strong> Le gradient est bruité, ce qui peut rendre la convergence moins stable et plus erratique.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Expliquez le fonctionnement de l'optimiseur Adam. En quoi se distingue-t-il de SGD classique ?</p>",
          "reponse": "<p>Adam (Adaptive Moment Estimation) est un optimiseur qui combine les avantages de deux méthodes : il utilise les moments de premier ordre (comme le momentum) et de second ordre (comme RMSprop) des gradients pour adapter le taux d'apprentissage pour chaque paramètre. Contrairement à SGD qui utilise un taux d'apprentissage unique, Adam ajuste dynamiquement le pas d'apprentissage individuellement, ce qui le rend souvent plus rapide et plus robuste au choix du taux d'apprentissage initial.</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Décrivez le principe du <em>dropout</em> comme technique de régularisation. Comment cette méthode aide-t-elle à lutter contre le surapprentissage (overfitting) ?</p>",
          "reponse": "<p>Le <em>dropout</em> consiste, à chaque itération d'entraînement, à désactiver aléatoirement une fraction des neurones d'une couche (et leurs connexions). Cela empêche les neurones de trop dépendre les uns des autres et force le réseau à apprendre des représentations plus robustes et redondantes. En simulant l'entraînement d'un grand nombre de réseaux plus petits, le <em>dropout</em> réduit le surapprentissage et améliore la généralisation.</p>"
        },
        {
          "question": "<p><strong>2.4</strong> Que sont les connexions résiduelles (skip connections) dans un réseau ResNet ? Quel problème majeur résolvent-elles ?</p>",
          "reponse": "<p>Les connexions résiduelles, ou skip connections, consistent à ajouter la sortie d'une couche à la sortie d'une couche ultérieure (généralement en sautant quelques couches). Elles résolvent le problème du gradient évanescent dans les réseaux très profonds, car elles offrent un chemin direct pour la propagation du gradient et permettent ainsi l'entraînement de réseaux extrêmement profonds sans dégradation des performances.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse de Scénario",
      "points": "6 pts",
      "enonce": "<p><strong>Mise en situation :</strong> Vous êtes chargé de concevoir un système de Deep Learning pour une entreprise. Lisez attentivement chaque scénario et choisissez la technique la plus adaptée en justifiant votre réponse.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> L'entreprise souhaite analyser le sentiment de milliers d'avis clients sur les réseaux sociaux. Vous disposez d'un grand jeu de données non étiqueté. Quelle approche de modélisation avec les Transformers est la plus appropriée pour l'analyse de sentiments ? Justifiez.</p>",
          "reponse": "<p>L'approche la plus appropriée est d'utiliser un modèle pré-entraîné comme BERT et de le <em>fine-tuner</em> sur votre jeu de données d'avis clients étiqueté (si vous en avez un). Si vous ne disposez pas de données étiquetées, l'idéal serait de collecter un échantillon représentatif pour l'étiqueter (annotation manuelle ou semi-automatique) et de l'utiliser pour le fine-tuning. BERT est un choix idéal car il capte le contexte bidirectionnel, essentiel pour l'analyse de sentiments.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Vous devez prédire la consommation électrique de la ville pour les 24 prochaines heures à partir de données historiques (séries temporelles). Entre un RNN, un LSTM et un Transformer, quel modèle proposeriez-vous et pourquoi ?</p>",
          "reponse": "<p>Les trois modèles peuvent être utilisés, mais les LSTM sont historiquement très performants pour ce type de tâche à long terme. Cependant, les Transformers ont récemment montré des performances supérieures sur de nombreuses tâches de séries temporelles grâce à leur mécanisme d'attention qui capture mieux les dépendances à long terme. Je proposerais un Transformer si les données sont suffisamment volumineuses et si les ressources de calcul le permettent, ou un LSTM comme solution robuste et éprouvée.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Votre modèle de classification d'images montre de très bonnes performances sur l'ensemble d'entraînement mais de mauvaises performances sur l'ensemble de test. Quel est le problème, et quelles techniques de régularisation pouvez-vous appliquer pour tenter de le résoudre ?</p>",
          "reponse": "<p>Le problème est un surapprentissage (overfitting) : le modèle a mémorisé les données d'entraînement mais n'a pas généralisé. Pour résoudre ce problème, je peux appliquer les techniques de régularisation suivantes : <br>- <strong>Ajout de dropout</strong> dans les couches denses pour forcer le réseau à être plus robuste. <br>- <strong>Utiliser la régularisation L2 (weight decay)</strong> pour pénaliser les poids importants. <br>- <strong>Augmentation des données</strong> (rotation, zoom, etc.) pour créer plus de variations à partir de l'ensemble d'entraînement. <br>- <strong>Early stopping</strong> pour arrêter l'entraînement avant que le modèle ne commence à surapprendre.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
