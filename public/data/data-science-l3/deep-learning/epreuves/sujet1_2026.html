<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Deep Learning - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur les Fondamentaux",
      "points": "5 pts",
      "enonce": "<p>Répondez de manière concise et précise aux questions suivantes. Les notions abordées couvrent le Perceptron, les fonctions d'activation, l'apprentissage et la régularisation.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Expliquez la principale limite du perceptron simple. Quelle modification architecturale fondamentale permet de la dépasser ?</p>",
          "reponse": "<p>La principale limite du perceptron simple est qu'il ne peut résoudre que des problèmes <strong>linéairement séparables</strong>. Il est incapable de traiter des fonctions non-linéaires comme le XOR.</p><p>L'ajout de <strong>couches cachées</strong> entre l'entrée et la sortie, donnant naissance au <strong>Perceptron Multicouche (MLP)</strong>, permet de dépasser cette limite. L'utilisation de fonctions d'activation non-linéaires dans ces couches cachées est essentielle pour apprendre des frontières de décision complexes.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1,5 pts) :</strong> La fonction d'activation <strong>ReLU</strong> est très utilisée. Donnez sa formule mathématique, décrivez son comportement et expliquez pourquoi elle est souvent préférée à la fonction sigmoïde dans les couches cachées.</p>",
          "reponse": "<p>La fonction ReLU (Rectified Linear Unit) est définie par :</p><div class='math-block'><div class='math'>$$ \\text{ReLU}(x) = \\max(0, x) $$</div></div><p>Elle renvoie 0 pour toute entrée négative et \(x\) pour toute entrée positive. Son comportement est donc linéaire pour les valeurs positives et nul pour les négatives.</p><p>Elle est préférée à la sigmoïde pour plusieurs raisons :</p><ul><li><strong>Atténuation du gradient évanescent</strong> : Sa dérivée est constante (1) pour \(x > 0\), contrairement à la sigmoïde dont la dérivée tend vers 0. Cela permet une meilleure propagation du gradient.</li><li><strong>Efficacité computationnelle</strong> : Elle est très simple à calculer (comparaison à 0).</li><li><strong>Parcimonie</strong> : Elle permet de désactiver certains neurones (sortie à 0), ce qui peut avoir un effet de régularisation.</li></ul>"
        },
        {
          "question": "<p><strong>Question 3 (1 pt) :</strong> Définissez ce qu'est le <strong>surapprentissage (overfitting)</strong> dans le contexte de l'apprentissage automatique. Citez deux techniques de régularisation permettant de le combattre.</p>",
          "reponse": "<p>Le <strong>surapprentissage (overfitting)</strong> se produit lorsqu'un modèle apprend trop bien les données d'entraînement, y compris leur bruit et leurs spécificités, au point de perdre sa capacité à généraliser sur de nouvelles données. Ses performances sont excellentes sur l'ensemble d'entraînement mais médiocres sur l'ensemble de test.</p><p>Deux techniques de régularisation permettant de limiter le surapprentissage sont :</p><ul><li><strong>Le Dropout</strong> : qui consiste à désactiver aléatoirement une fraction des neurones du réseau à chaque itération d'entraînement, forçant le réseau à apprendre des représentations plus robustes et moins dépendantes de neurones spécifiques.</li><li><strong>La régularisation L2 (ou weight decay)</strong> : qui ajoute un terme de pénalité sur les poids du modèle à la fonction de coût, décourageant les poids trop importants.</li></ul>"
        },
        {
          "question": "<p><strong>Question 4 (1,5 pts) :</strong> Quel est le rôle de la <strong>fonction de coût</strong> dans l'apprentissage d'un réseau de neurones ? Pour un problème de classification multi-classes, quelle est la fonction de coût la plus appropriée ?</p>",
          "reponse": "<p>La <strong>fonction de coût</strong> (ou fonction de perte) mesure <strong>l'écart</strong> entre les prédictions du modèle et les valeurs réelles (cibles). L'objectif de l'apprentissage est de <strong>minimiser</strong> cette fonction de coût en ajustant les paramètres du réseau (les poids). Elle quantifie donc la performance du modèle.</p><p>Pour un problème de <strong>classification multi-classes</strong>, la fonction de coût la plus appropriée est l'<strong>entropie croisée catégorielle (Categorical Cross-Entropy)</strong>. Elle est utilisée en combinaison avec la fonction d'activation <strong>Softmax</strong> en sortie, qui convertit les logits (valeurs brutes) en une distribution de probabilités sur les différentes classes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Rétropropagation et Calcul de Gradients",
      "points": "6 pts",
      "enonce": "<p>On considère un réseau de neurones très simple pour comprendre le mécanisme de la rétropropagation. Le réseau est un Perceptron Multicouche (MLP) avec <strong>une couche cachée</strong> composée de deux neurones (N1 et N2) et une couche de sortie avec <strong>un neurone (N3)</strong>.</p><p>L'architecture est la suivante :</p><ul><li>Couche d'entrée : \(x_1, x_2\)</li><li>Couche cachée : \(h_1, h_2\), avec fonction d'activation \(f\) (sigmoid).</li><li>Couche de sortie : \(y\), avec fonction d'activation \(g\) (sigmoïde ou identité selon le problème).</li></ul><p>Les poids sont notés \(w_{11}, w_{12}, w_{21}, w_{22}\) pour les connexions entrée-caché, et \(v_1, v_2\) pour les connexions caché-sortie. Le biais est inclus en ajoutant une entrée constante \(x_0 = 1\) avec des poids \(b_1, b_2\) pour les neurones cachés et \(b_3\) pour le neurone de sortie.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (2 pts) :</strong> Écrivez les équations de la <strong>propagation avant (forward pass)</strong> pour ce réseau. Exprimez clairement les valeurs de \(z_1, z_2\) (entrées de la couche cachée), \(h_1, h_2\) (sorties de la couche cachée), \(z_3\) (entrée de la couche de sortie) et la sortie finale \(y\).</p>",
          "reponse": "<p><strong>Propagation avant :</strong></p><ul><li><strong>Entrée de la couche cachée :</strong><br><div class='math-block'><div class='math'>$$ z_1 = w_{11} x_1 + w_{12} x_2 + b_1 $$</div><div class='math'>$$ z_2 = w_{21} x_1 + w_{22} x_2 + b_2 $$</div></div></li><li><strong>Sortie de la couche cachée (après activation sigmoïde) :</strong><br><div class='math-block'><div class='math'>$$ h_1 = f(z_1) = \\frac{1}{1 + e^{-z_1}} $$</div><div class='math'>$$ h_2 = f(z_2) = \\frac{1}{1 + e^{-z_2}} $$</div></div></li><li><strong>Entrée de la couche de sortie :</strong><br><div class='math-block'><div class='math'>$$ z_3 = v_1 h_1 + v_2 h_2 + b_3 $$</div></div></li><li><strong>Sortie finale (après activation \(g\)) :</strong><br><div class='math-block'><div class='math'>$$ y = g(z_3) $$</div></div></li></ul>"
        },
        {
          "question": "<p><strong>Question 2 (2 pts) :</strong> On considère que la fonction de coût est l'<strong>Erreur Quadratique Moyenne (MSE)</strong> pour une seule observation, définie par \(L = \\frac{1}{2} (y - t)^2\), où \(t\) est la cible. On suppose que l'activation de sortie est l'identité (\(g(z) = z\)). Calculez le gradient de l'erreur par rapport au poids \(v_1\), c'est-à-dire \( \\frac{\\partial L}{\\partial v_1} \\. Utilisez la règle de la chaîne pour décomposer ce calcul.</p>",
          "reponse": "<p>Le gradient de l'erreur par rapport au poids \(v_1\) se calcule par la règle de la chaîne :</p><div class='math-block'><div class='math'>$$ \\frac{\\partial L}{\\partial v_1} = \\frac{\\partial L}{\\partial y} \\times \\frac{\\partial y}{\\partial z_3} \\times \\frac{\\partial z_3}{\\partial v_1} $$</div></div><p>Calcul des dérivées partielles :</p><ul><li><strong>Erreur à la sortie :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial L}{\\partial y} = \\frac{\\partial}{\\partial y} \\left[ \\frac{1}{2} (y - t)^2 \\right] = y - t $$</div></div></li><li><strong>Dérivée de l'activation de sortie (identité) :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial y}{\\partial z_3} = 1 $$</div></div></li><li><strong>Dérivée de l'entrée de sortie par rapport à \(v_1\) :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial z_3}{\\partial v_1} = h_1 $$</div></div></li></ul><p>En combinant ces termes, on obtient :</p><div class='math-block'><div class='math'>$$ \\frac{\\partial L}{\\partial v_1} = (y - t) \\times h_1 $$</div></div>"
        },
        {
          "question": "<p><strong>Question 3 (2 pts) :</strong> Maintenant, calculez le gradient de l'erreur par rapport au poids \(w_{11}\), c'est-à-dire \( \\frac{\\partial L}{\\partial w_{11}} \\. Montrez comment l'erreur se propage jusqu'à la couche d'entrée en utilisant la règle de la chaîne.</p>",
          "reponse": "<p>Pour calculer \( \\frac{\\partial L}{\\partial w_{11}} \\), il faut considérer que \(w_{11}\) n'affecte l'erreur qu'à travers \(z_1\) (et donc \(h_1\), \(z_3\), et \(y\)).</p><p>Appliquons la règle de la chaîne :</p><div class='math-block'><div class='math'>$$ \\frac{\\partial L}{\\partial w_{11}} = \\frac{\\partial L}{\\partial y} \\times \\frac{\\partial y}{\\partial z_3} \\times \\frac{\\partial z_3}{\\partial h_1} \\times \\frac{\\partial h_1}{\\partial z_1} \\times \\frac{\\partial z_1}{\\partial w_{11}} $$</div></div><p>Calcul des dérivées partielles :</p><ul><li><strong>Déjà calculés :</strong> \( \\frac{\\partial L}{\\partial y} = (y - t) \\) et \( \\frac{\\partial y}{\\partial z_3} = 1 \\)</li><li><strong>Dérivée de l'entrée de sortie par rapport à \(h_1\) :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial z_3}{\\partial h_1} = v_1 $$</div></div></li><li><strong>Dérivée de \(h_1\) par rapport à \(z_1\) (dérivée de la sigmoïde) :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial h_1}{\\partial z_1} = h_1 (1 - h_1) $$</div></div></li><li><strong>Dérivée de l'entrée de la couche cachée par rapport à \(w_{11}\) :</strong><br><div class='math-block'><div class='math'>$$ \\frac{\\partial z_1}{\\partial w_{11}} = x_1 $$</div></div></li></ul><p>En combinant tous les termes, on obtient l'expression complète du gradient :</p><div class='math-block'><div class='math'>$$ \\frac{\\partial L}{\\partial w_{11}} = (y - t) \\times v_1 \\times h_1 (1 - h_1) \\times x_1 $$</div></div><p>Ce calcul montre comment l'erreur \( (y - t) \) est propagée en arrière (rétropropagation) pour mettre à jour le poids \(w_{11}\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Optimisation et Régularisation",
      "points": "4 pts",
      "enonce": "<p>Vous entraînez un réseau de neurones profond sur un jeu de données de classification d'images. Vous observez que l'erreur d'entraînement diminue rapidement et atteint une valeur très basse, mais l'erreur de validation reste élevée et ne diminue plus. Vous soupçonnez un cas de surapprentissage (overfitting).</p>",
      "questions": [
        {

          "reponse": "<p>Trois stratégies pour lutter contre le surapprentissage :</p><ol><li><strong>Augmentation des données (Data Augmentation) :</strong> Créer artificiellement de nouvelles données d'entraînement en appliquant des transformations (rotations, zooms, ajout de bruit). Cela augmente la variabilité du jeu d'entraînement et force le modèle à apprendre des caractéristiques plus robustes.</li><li><strong>Régularisation L2 (Weight Decay) :</strong> Ajouter un terme de pénalité sur les poids du modèle à la fonction de coût. Cela décourage les poids trop importants, ce qui rend le modèle moins sensible au bruit et aux variations spécifiques du jeu d'entraînement.</li><li><strong>Dropout :</strong> Désactiver aléatoirement un pourcentage de neurones à chaque itération d'entraînement. Cela empêche le réseau de trop dépendre d'un neurone ou d'une combinaison spécifique de neurones, favorisant l'apprentissage de représentations redondantes et robustes.</li></ol>"

          "reponse": "<p>L'<strong>early stopping</strong> consiste à arrêter l'entraînement du modèle avant qu'il n'atteigne son minimum sur l'ensemble d'entraînement. Pour cela, on surveille la performance du modèle sur un <strong>ensemble de validation</strong> à la fin de chaque époque.</p><p>Son principe : on continue l'entraînement tant que la performance sur l'ensemble de validation s'améliore. Dès que cette performance commence à se dégrader (l'erreur de validation augmente) alors que l'erreur d'entraînement continue de diminuer, c'est un signe de surapprentissage. On arrête alors l'entraînement et on conserve le modèle de l'époque où la performance était la meilleure.</p><p>Cette technique est simple à mettre en œuvre car elle ne nécessite pas de modifier l'architecture du réseau ou la fonction de coût, seulement de sauvegarder le modèle à intervalles réguliers et de surveiller une métrique de validation.</p>"

          "reponse": "<p><strong>SGD</strong> met à jour les poids en utilisant un gradient estimé sur un mini-batch. Il a un taux d'apprentissage fixe qui peut être difficile à régler.</p><p><strong>Adam</strong> (Adaptive Moment Estimation) est un optimiseur adaptatif qui combine les avantages de deux autres méthodes : il utilise une moyenne exponentielle des gradients passés (comme le momentum) et une moyenne exponentielle des carrés des gradients (comme RMSprop). Son avantage principal est qu'il <strong>adapte le taux d'apprentissage</strong> pour chaque paramètre individuellement. Cela le rend plus robuste au choix du taux d'apprentissage et lui permet de converger plus rapidement sur de nombreux problèmes par rapport au SGD standard.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
