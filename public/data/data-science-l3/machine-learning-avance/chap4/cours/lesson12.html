<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux CNN",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h2 style='color: #2c3e50;'>Bienvenue dans les CNN</h2>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Aujourd'hui, nous allons découvrir les <strong>Réseaux de Neurones Convolutifs (CNN)</strong>, l'architecture qui a révolutionné la vision par ordinateur.</p>\n  <div style='background-color: #e8f4f8; padding: 15px; border-radius: 10px; margin: 15px 0;'>\n    <p style='margin: 0; font-weight: bold; color: #1a5276;'>🎯 Objectif de la leçon</p>\n    <p style='margin: 5px 0 0 0; color: #1a5276;'>Comprendre comment les CNN traitent les images, leurs composants clés, et leurs architectures les plus célèbres.</p>\n  </div>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'>\n    <p style='margin: 0; font-weight: bold;'>📋 Plan du cours</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Couches de convolution et de pooling</li>\n      <li>Architectures CNN classiques (LeNet, AlexNet, VGG, ResNet, Inception)</li>\n      <li>Transfert learning avec les CNN</li>\n    </ul>\n  </div>\n</div>",
    "texteParle": "Bonjour à tous ! Bienvenue dans cette leçon sur les Réseaux de Neurones Convolutifs, ou CNN pour faire court. Ces réseaux ont révolutionné la vision par ordinateur. Nous allons voir comment ils fonctionnent, quels sont leurs composants essentiels comme les couches de convolution et de pooling, et nous explorerons les architectures les plus célèbres comme LeNet, AlexNet, VGG, ResNet et Inception. Nous terminerons par le transfert learning, une technique très puissante qui permet de réutiliser des modèles déjà entraînés.",
    "note": "Les CNN sont spécialisés dans le traitement des données structurées en grille, comme les images."
  },
  {
    "titre": "La Couche de Convolution",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>La Couche de Convolution</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>C'est le <strong>cœur</strong> des CNN. Elle permet d'extraire des caractéristiques locales des images.</p>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>🔍 Principe :</p>\n    <p>On fait glisser un <strong>filtre</strong> (ou noyau) sur l'image et on calcule le <strong>produit scalaire</strong> à chaque position.</p>\n  </div>\n  <div style='display: flex; flex-wrap: wrap; justify-content: space-between; margin: 10px 0;'>\n    <div style='background-color: #d6eaf8; padding: 12px; border-radius: 8px; flex: 1; min-width: 150px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1a5276; margin: 0;'>📐 Paramètres clés</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li><strong>Taille du filtre</strong> (ex: 3x3, 5x5)</li>\n        <li><strong>Stride</strong> : pas de déplacement</li>\n        <li><strong>Padding</strong> : ajout de zéros pour contrôler la taille</li>\n        <li><strong>Nombre de filtres</strong> : profondeur de sortie</li>\n      </ul>\n    </div>\n    <div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px; flex: 1; min-width: 150px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1e8449; margin: 0;'>✨ Pourquoi ça marche ?</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li>Capture les motifs locaux (bords, textures)</li>\n        <li>Invariance aux translations</li>\n        <li>Partage des poids (efficacité)</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> Chaque filtre apprend à détecter un motif spécifique dans l'image.</p>\n  </div>\n</div>",
    "texteParle": "La couche de convolution est le cœur des CNN. Elle permet d'extraire automatiquement des caractéristiques locales des images. Le principe est simple : on fait glisser un petit filtre, par exemple de taille 3x3, sur toute l'image, et on calcule à chaque position le produit scalaire entre le filtre et la zone de l'image. Les paramètres clés sont la taille du filtre, le stride qui est le pas de déplacement, le padding qui permet de contrôler la taille de sortie, et le nombre de filtres. Chaque filtre apprend à détecter un motif spécifique comme des bords, des textures ou des formes. Cette approche est très efficace car elle capture les motifs locaux et est invariante aux translations.",
    "note": "La convolution est l'opération fondamentale des CNN pour l'extraction de caractéristiques."
  },
  {
    "titre": "La Couche de Pooling",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>La Couche de Pooling</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>La couche de pooling permet de <strong>réduire la dimension</strong> spatiale des représentations.</p>\n  <div style='display: flex; flex-wrap: wrap; justify-content: space-between; margin: 10px 0;'>\n    <div style='background-color: #d5f5e3; padding: 15px; border-radius: 10px; flex: 1; min-width: 200px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1e8449; margin-top: 0;'>Max Pooling</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li>Prend la valeur <strong>maximale</strong> dans chaque fenêtre</li>\n        <li>Réduit la dimension</li>\n        <li>Mieux conserve les caractéristiques dominantes</li>\n      </ul>\n    </div>\n    <div style='background-color: #d6eaf8; padding: 15px; border-radius: 10px; flex: 1; min-width: 200px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1a5276; margin-top: 0;'>Average Pooling</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li>Prend la <strong>moyenne</strong> des valeurs dans chaque fenêtre</li>\n        <li>Réduit la dimension</li>\n        <li>Lisse les caractéristiques</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📊 Bénéfices du pooling :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>Réduction de la dimensionnalité</strong> → moins de paramètres</li>\n      <li><strong>Invariance aux petites translations</strong> → robustesse</li>\n      <li><strong>Contrôle du surapprentissage</strong> → régularisation</li>\n    </ul>\n  </div>\n</div>",
    "texteParle": "La couche de pooling est utilisée pour réduire la dimension spatiale des représentations. Le plus courant est le max pooling, qui prend la valeur maximale dans une fenêtre donnée, par exemple 2x2. Cela permet de réduire la taille de moitié tout en conservant les caractéristiques les plus importantes. Il existe aussi l'average pooling qui prend la moyenne. Les bénéfices sont multiples : réduction du nombre de paramètres, invariance aux petites translations, et une forme de régularisation qui aide à contrôler le surapprentissage.",
    "note": "Le pooling réduit la dimensionnalité et apporte de l'invariance aux translations."
  },
  {
    "titre": "LeNet-5 (1998)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>LeNet-5 : L'Architecture Pionnière</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Contexte :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Créée par <strong>Yann LeCun</strong> en 1998</li>\n      <li>Conçue pour la reconnaissance de <strong>chiffres manuscrits</strong> (MNIST)</li>\n      <li>Première architecture CNN moderne</li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🏛️ Architecture :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Entrée : 32x32 en niveaux de gris</li>\n      <li><strong>2 couches de convolution</strong> (filtres 5x5)</li>\n      <li><strong>2 couches de pooling</strong> (average pooling)</li>\n      <li><strong>3 couches fully connected</strong></li>\n      <li>Sortie : 10 classes (chiffres 0-9)</li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Héritage :</strong> LeNet-5 a posé les bases des architectures CNN modernes avec sa structure séquentielle convolution → pooling → convolution → pooling → fully connected.</p>\n  </div>\n</div>",
    "texteParle": "Commençons par LeNet-5, l'architecture pionnière des CNN. Créée par Yann LeCun en 1998, elle a été conçue pour la reconnaissance des chiffres manuscrits sur le jeu de données MNIST. C'est la première architecture CNN moderne. Sa structure est simple mais efficace : une entrée de 32x32 pixels en niveaux de gris, suivie de deux couches de convolution avec des filtres 5x5, deux couches de pooling de type average pooling, et trois couches entièrement connectées. La sortie donne les 10 classes des chiffres de 0 à 9. LeNet-5 a posé les bases de toutes les architectures CNN qui ont suivi.",
    "note": "LeNet-5 est l'ancêtre de tous les CNN modernes pour la vision par ordinateur."

  {
    "titre": "AlexNet (2012)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>AlexNet : La Révolution</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Contexte :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Créée par <strong>Alex Krizhevsky</strong> en 2012</li>\n      <li>A remporté <strong>ImageNet ILSVRC</strong> avec une erreur de 15.3%</li>\n      <li>A popularisé les CNN dans le monde</li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🚀 Innovations clés :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>ReLU</strong> : fonction d'activation plus rapide que sigmoïde</li>\n      <li><strong>Max Pooling</strong> : au lieu d'Average Pooling</li>\n      <li><strong>Dropout</strong> : régularisation puissante</li>\n      <li><strong>GPU</strong> : utilisation de deux GPU pour l'entraînement</li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Impact :</strong> AlexNet a montré que les CNN profonds pouvaient surpasser les méthodes traditionnelles sur des données complexes.</p>\n  </div>\n</div>",
    "texteParle": "Passons maintenant à AlexNet, qui a révolutionné le domaine en 2012. Créé par Alex Krizhevsky, il a remporté le concours ImageNet avec une erreur de seulement 15.3%, un exploit à l'époque. AlexNet a introduit plusieurs innovations clés : l'utilisation de la fonction d'activation ReLU, beaucoup plus rapide que la sigmoïde, le max pooling au lieu de l'average pooling, le dropout pour la régularisation, et surtout l'utilisation de deux GPU pour l'entraînement. Ces innovations ont permis d'entraîner des réseaux beaucoup plus profonds et ont montré que les CNN pouvaient surpasser les méthodes traditionnelles.",
    "note": "AlexNet a popularisé les CNN et démontré leur supériorité sur ImageNet."

    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>VGGNet : La Simplicité Efficace</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Contexte :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Créée par le <strong>Visual Geometry Group</strong> (Oxford) en 2014</li>\n      <li>Architecture <strong>VGG-16</strong> et <strong>VGG-19</strong></li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🏛️ Architecture :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>16 ou 19 couches</strong> (profondeur)</li>\n      <li>Uniquement des <strong>filtres 3x3</strong> pour les convolutions</li>\n      <li><strong>Max pooling 2x2</strong> pour réduire les dimensions</li>\n      <li>3 couches fully connected à la fin</li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> VGGNet a montré que l'augmentation de la profondeur avec de petits filtres améliorait les performances, mais au prix d'un très grand nombre de paramètres (138 millions).</p>\n  </div>\n</div>",
    "texteParle": "VGGNet, développé par le Visual Geometry Group d'Oxford en 2014, est une architecture qui mise sur la simplicité. Elle utilise uniquement des petits filtres 3x3 pour les convolutions, ce qui permet d'augmenter la profondeur du réseau. Les versions VGG-16 et VGG-19 ont respectivement 16 et 19 couches. Cette approche a montré que plus de profondeur avec de petits filtres améliorait les performances. Cependant, le nombre de paramètres est énorme, jusqu'à 138 millions, ce qui rend VGGNet très lourd en calcul.",

  {
    "titre": "ResNet (2015)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>ResNet : Les Connexions Résiduelles</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Contexte :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Créée par <strong>Kaiming He</strong> (Microsoft) en 2015</li>\n      <li>A remporté ImageNet 2015</li>\n      <li>Architecture <strong>ResNet-152</strong> (152 couches)</li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🚀 Innovation clé :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>Connexions résiduelles (skip connections)</strong></li>\n      <li>Sortie : \( F(x) + x \) au lieu de \( F(x) \)</li>\n      <li>Permet d'entraîner des réseaux très profonds</li>\n      <li>Résout le problème du <strong>gradient évanescent</strong></li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Impact :</strong> ResNet a permis d'entraîner des réseaux de plus de 1000 couches, ouvrant la voie aux architectures extrêmement profondes.</p>\n  </div>\n</div>",
    "texteParle": "ResNet, créé par Kaiming He en 2015, a révolutionné le deep learning avec son innovation des connexions résiduelles. L'idée est simple : au lieu d'apprendre directement la fonction \( F(x) \), le réseau apprend \( F(x) + x \), ce qui signifie qu'il apprend la différence entre l'entrée et la sortie. Ces connexions résiduelles permettent de résoudre le problème du gradient évanescent, ce qui permet d'entraîner des réseaux extrêmement profonds, jusqu'à 152 couches pour ResNet-152, voire plus de 1000 couches dans certaines variantes. C'est une architecture de référence aujourd'hui.",
    "note": "ResNet a introduit les connexions résiduelles pour permettre des réseaux très profonds."

    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Inception : Le Module Efficace</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Contexte :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Créée par <strong>Google</strong> (Christian Szegedy) en 2014</li>\n      <li>A remporté ImageNet 2014</li>\n      <li>Nommée <strong>GoogLeNet</strong></li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🚀 Innovation clé :</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>Module Inception</strong> : plusieurs filtres de tailles différentes en parallèle</li>\n      <li><strong>1x1 convolutions</strong> : pour réduire les dimensions</li>\n      <li><strong>Très efficace</strong> : seulement 5 millions de paramètres</li>\n      <li><strong>Moins de paramètres</strong> que VGGNet (138 millions)</li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> Le module Inception permet d'utiliser des filtres de différentes tailles en parallèle, ce qui permet de capturer des motifs à différentes échelles.</p>\n  </div>\n</div>",

  {
    "titre": "Transfert Learning avec CNN",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Transfert Learning avec CNN</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Le <strong>transfert learning</strong> est une technique puissante pour réutiliser des modèles pré-entraînés.</p>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Principe :</p>\n    <ol style='font-size: 1em; line-height: 1.8;'>\n      <li>Prendre un modèle <strong>pré-entraîné</strong> (ex: ResNet sur ImageNet)</li>\n      <li>Garder les couches de base (extraction de caractéristiques)</li>\n      <li>Remplacer la <strong>dernière couche</strong> par une couche adaptée à votre tâche</li>\n      <li><strong>Fine-tune</strong> le modèle sur votre jeu de données</li>\n    </ol>\n  </div>\n  <div style='display: flex; flex-wrap: wrap; justify-content: space-between; margin: 10px 0;'>\n    <div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px; flex: 1; min-width: 150px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1e8449; margin: 0;'>✅ Avantages</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li>Moins de données nécessaires</li>\n        <li>Entraînement plus rapide</li>\n        <li>Meilleures performances</li>\n      </ul>\n    </div>\n    <div style='background-color: #d6eaf8; padding: 12px; border-radius: 8px; flex: 1; min-width: 150px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1a5276; margin: 0;'>📊 Approches</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li><strong>Extraction</strong> : couches figées</li>\n        <li><strong>Fine-tuning</strong> : entraînement partiel</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Application :</strong> Très utilisé en médecine (radiologie), en agriculture (détection de maladies), et dans l'industrie (contrôle qualité).</p>\n  </div>\n</div>",
    "texteParle": "Le transfert learning est une technique qui permet de réutiliser des modèles pré-entraînés sur de grandes bases de données comme ImageNet pour les adapter à de nouvelles tâches. Le principe est simple : on prend un modèle comme ResNet pré-entraîné, on garde toutes ses couches de base qui extraient les caractéristiques générales, on remplace la dernière couche par une couche adaptée à notre problème, et on ré-entraîne partiellement le modèle sur notre jeu de données. Les avantages sont nombreux : moins de données nécessaires, entraînement plus rapide, et souvent de meilleures performances. Cette technique est très utilisée en médecine, en agriculture, et dans l'industrie.",
    "note": "Le transfert learning permet de réutiliser des modèles pré-entraînés avec peu de données."
  },

    "texteParle": "Pour résumer cette leçon sur les CNN. Nous avons vu que les couches de convolution extraient des caractéristiques locales via des filtres, et que les couches de pooling réduisent la dimensionnalité. Nous avons parcouru les architectures classiques : LeNet l'ancêtre, AlexNet qui a révolutionné le domaine, VGG avec sa simplicité, ResNet avec ses connexions résiduelles, et Inception avec ses modules efficaces. Nous avons également découvert le transfert learning, une technique puissante pour réutiliser des modèles pré-entraînés. Les CNN sont aujourd'hui l'architecture de référence pour la vision par ordinateur. Dans la prochaine leçon, nous nous intéresserons aux RNN pour les données séquentielles.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
