<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Épreuve Séquentielle N°4 - Interprétabilité et Modèles Génératifs",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse du Compromis Biais-Variance",
      "points": "6 pts",
      "enonce": "<p>Lors de la conception d'un modèle d'apprentissage automatique, vous êtes confronté au compromis fondamental entre le biais et la variance. Cet exercice évalue votre compréhension de ce compromis et de ses implications pratiques.</p><p>On considère un modèle d'apprentissage supervisé pour une tâche de régression. L'erreur de généralisation peut se décomposer en trois termes.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Rappelez la décomposition de l'erreur de généralisation en biais, variance et bruit. Écrivez la formule mathématique correspondante. (1.5 pt)</p>",
          "reponse": "<p>La décomposition de l'erreur de généralisation est :</p><div class='math-block'><div class='math'>$$ \\text{Erreur}(x) = \\text{Biais}^2 + \\text{Variance} + \\text{Bruit} $$</div></div><p>Où :</p><ul><li><strong>Biais²</strong> : mesure l'écart entre la prédiction moyenne du modèle et la valeur réelle. Un biais élevé indique un modèle trop simple (sous-apprentissage).</li><li><strong>Variance</strong> : mesure la sensibilité du modèle aux variations des données d'entraînement. Une variance élevée indique un modèle trop complexe (sur-apprentissage).</li><li><strong>Bruit</strong> : est l'erreur irréductible due au caractère aléatoire des données.</li></ul>"
        },
        {
          "question": "<p><strong>1.2</strong> Expliquez comment se manifeste un modèle avec un biais élevé et une variance faible, et à l'inverse, un modèle avec un biais faible et une variance élevée. (1.5 pt)</p>",
          "reponse": "<ul><li><strong>Biais élevé et variance faible</strong> : Le modèle est trop simple, il ne capture pas les relations complexes dans les données. Il fait des erreurs systématiques (sous-apprentissage). Exemple : une régression linéaire sur des données non linéaires.</li><li><strong>Biais faible et variance élevée</strong> : Le modèle est trop complexe, il s'adapte parfaitement aux données d'entraînement mais ne généralise pas bien. Il est très sensible aux variations des données (sur-apprentissage). Exemple : un arbre de décision très profond entraîné sur un petit jeu de données.</li></ul>"
        },
        {
          "question": "<p><strong>1.3</strong> Proposez deux techniques pour réduire le surapprentissage (overfitting) et expliquez brièvement comment elles agissent sur le compromis biais-variance. (1.5 pt)</p>",
          "reponse": "<ul><li><strong>Régularisation (L1 ou L2) :</strong> Ajoute une pénalité à la fonction de coût pour limiter la complexité du modèle. Cela augmente légèrement le biais mais réduit significativement la variance, améliorant ainsi la généralisation.</li><li><strong>Validation croisée :</strong> Permet de sélectionner les hyperparamètres en minimisant l'erreur sur des données non vues. Elle aide à trouver le bon équilibre entre le biais et la variance en évitant de trop s'adapter aux données d'entraînement.</li></ul>"
        },
        {
          "question": "<p><strong>1.4</strong> Un modèle sur-apprend sur un jeu de données. Que peut-on en déduire sur son biais et sa variance ? Justifiez votre réponse. (1.5 pt)</p>",
          "reponse": "<p>Un modèle qui sur-apprend a un <strong>biais faible</strong> car il s'ajuste très bien aux données d'entraînement, mais une <strong>variance élevée</strong> car il est très sensible aux variations des données. En effet, le modèle est trop complexe et capture le bruit présent dans les données d'entraînement plutôt que les tendances générales, ce qui le rend incapable de bien généraliser sur de nouvelles données.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Régularisation et Pénalités",
      "points": "6 pts",
      "enonce": "<p>La régularisation est une technique essentielle pour éviter le sur-apprentissage. Cet exercice porte sur les normes L1 et L2 utilisées en régularisation.</p><p>La régularisation consiste à ajouter un terme de pénalité à la fonction de coût. On note $\\beta$ le vecteur des coefficients du modèle.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Écrivez les fonctions de coût pour la régression ridge (pénalité L2) et la régression lasso (pénalité L1). (1.5 pt)</p>",
          "reponse": "<p><strong>Régression Ridge (L2) :</strong></p><div class='math-block'><div class='math'>$$ \\min_{\\beta} \\left\\{ \\sum_{i=1}^{n} (y_i - x_i^T \\beta)^2 + \\lambda \\sum_{j=1}^{p} \\beta_j^2 \\right\\} $$</div></div><p><strong>Régression Lasso (L1) :</strong></p><div class='math-block'><div class='math'>$$ \\min_{\\beta} \\left\\{ \\sum_{i=1}^{n} (y_i - x_i^T \\beta)^2 + \\lambda \\sum_{j=1}^{p} |\\beta_j| \\right\\} $$</div></div><p>Où $\\lambda \\ge 0$ est le paramètre de régularisation.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Expliquez la principale différence entre les pénalités L1 et L2 en termes de sélection de variables. (1.5 pt)</p>",
          "reponse": "<ul><li><strong>Pénalité L1 (Lasso) :</strong> Elle a tendance à produire des coefficients <strong>épars</strong> (sparse), c'est-à-dire qu'elle force certains coefficients à être exactement nuls. Cela permet de <strong>sélectionner les variables</strong> les plus importantes, car les variables non pertinentes se voient attribuer un coefficient nul.</li><li><strong>Pénalité L2 (Ridge) :</strong> Elle réduit les coefficients vers zéro sans les annuler complètement. Elle ne réalise pas de sélection de variables ; tous les coefficients restent non nuls, mais ils sont rétrécis.</li></ul>"
        },
        {
          "question": "<p><strong>2.3</strong> Si vous disposez d'un jeu de données avec un grand nombre de variables (p > n), laquelle des deux régularisations (ridge ou lasso) est la plus appropriée ? Justifiez. (1.5 pt)</p>",
          "reponse": "<p>Dans un contexte où $p > n$ (plus de variables que d'observations), la <strong>régularisation Lasso</strong> est souvent plus appropriée.</p><p><strong>Justification :</strong> Le Lasso réalise une sélection de variables, ce qui permet de réduire le nombre de variables actives dans le modèle. C'est particulièrement utile quand le nombre de variables est très grand, car cela permet d'identifier un sous-ensemble de variables pertinentes. La régression Ridge, quant à elle, tend à conserver toutes les variables avec des coefficients non nuls, ce qui peut rendre le modèle difficile à interpréter dans un espace de grande dimension.</p>"
        },
        {
          "question": "<p><strong>2.4</strong> Il est recommandé de normaliser les variables avant d'appliquer une régularisation. Pourquoi ? (1.5 pt)</p>",
          "reponse": "<p>La normalisation des variables est essentielle car les pénalités L1 et L2 sont <strong>sensibles à l'échelle des variables</strong>. Si une variable a des valeurs beaucoup plus grandes que les autres, elle aura un coefficient naturellement plus petit, et la pénalité la concernant sera plus grande. Cela biaise la sélection des variables, car la régularisation pénalisera proportionnellement plus les variables ayant de grandes valeurs. La normalisation permet de traiter toutes les variables avec la même importance, en les ramenant à une échelle comparable (par exemple, via StandardScaler ou MinMaxScaler).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : SHAP et LIME pour l'Interprétabilité",
      "points": "6 pts",
      "enonce": "<p>L'interprétabilité des modèles complexes est cruciale pour établir la confiance et répondre aux exigences réglementaires. Cet exercice porte sur deux méthodes populaires : SHAP et LIME.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Définissez LIME (Local Interpretable Model-agnostic Explanations). Expliquez son principe de fonctionnement en quelques phrases. (1.5 pt)</p>",
          "reponse": "<p><strong>LIME</strong> est une méthode d'explication locale et agnostique au modèle. Son principe est le suivant : pour expliquer une prédiction spécifique, LIME perturbe les données autour de l'observation cible, fait prédire ces données perturbées par le modèle complexe, puis entraîne un modèle simple et interprétable (comme une régression linéaire) sur ces données pondérées. Les coefficients de ce modèle simple indiquent l'importance de chaque caractéristique pour la prédiction locale.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Qu'est-ce que la valeur de Shapley et comment est-elle utilisée par SHAP ? (1.5 pt)</p>",
          "reponse": "<p>La <strong>valeur de Shapley</strong> est un concept issu de la théorie des jeux qui permet de répartir équitablement la contribution de chaque joueur à un résultat collectif. Dans le contexte de SHAP, la valeur de Shapley est utilisée pour attribuer à chaque caractéristique sa contribution à la prédiction. SHAP calcule l'impact marginal moyen de chaque caractéristique sur la prédiction, en considérant toutes les combinaisons possibles de caractéristiques. Cela permet d'obtenir des explications à la fois locales et globales, avec des propriétés théoriques solides comme l'additivité et la cohérence.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Comparez SHAP et LIME en termes de propriétés et de domaine d'application. Dans quel contexte privilégier l'une plutôt que l'autre ? (1.5 pt)</p>",
          "reponse": "<ul><li><strong>SHAP</strong> : Basé sur la théorie des jeux, il offre des propriétés théoriques fortes (additivité, cohérence). Il fournit des explications globales et locales, mais peut être coûteux en calcul pour les grands modèles. Il est privilégié quand la cohérence mathématique et l'interprétation globale sont importantes.</li><li><strong>LIME</strong> : Agnostique et plus rapide que SHAP sur des sous-ensembles de données. Il est plus flexible et adaptable à différents types de données. Il est privilégié quand on a besoin d'explications rapides et locales, ou quand on travaille avec des modèles très complexes où SHAP est trop lent.</li></ul>"
        },
        {
          "question": "<p><strong>3.4</strong> Un modèle de classification de crédit refuse un client. Comment utiliser LIME pour expliquer ce refus au client ? (1.5 pt)</p>",
          "reponse": "<p>Pour expliquer ce refus, on peut utiliser LIME de la manière suivante :</p><ol><li>Identifier les caractéristiques du client (revenu, âge, score de crédit, etc.).</li><li>Appliquer LIME pour générer une explication locale de la prédiction.</li><li>LIME va fournir une liste de coefficients indiquant l'importance de chaque caractéristique pour le refus.</li><li>On peut alors présenter au client les facteurs qui ont le plus contribué au refus, par exemple : 'Votre refus est principalement dû à un revenu trop bas et à un score de crédit insuffisant.'</li><li>Cette explication permet de justifier la décision de manière transparente et de fournir des conseils pour améliorer le dossier du client.</li></ol>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Modèles Génératifs - VAE et GAN",
      "points": "6 pts",
      "enonce": "<p>Les modèles génératifs sont utilisés pour créer de nouvelles données à partir d'une distribution apprise. Cet exercice explore les Autoencodeurs Variationnels (VAE) et les Réseaux Antagonistes Génératifs (GAN).</p>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Expliquez le principe d'un Autoencodeur Variationnel (VAE). Quelle est la différence principale entre un autoencodeur standard et un VAE ? (1.5 pt)</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
