<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Machine Learning Avancé - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 2 - Évaluation des Connaissances",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Compromis Biais-Variance et Régularisation (Théorie)",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice porte sur les fondements théoriques de l'apprentissage vus en début de séquence, notamment le compromis biais-variance et les techniques de régularisation associées.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Définissez clairement ce qu'est le <em>compromis biais-variance</em> dans un modèle de Machine Learning. Comment se manifeste-t-il dans le cas d'un <strong>sous-apprentissage</strong> et d'un <strong>sur-apprentissage</strong> ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le compromis biais-variance est la difficulté qu'un modèle a à minimiser simultanément deux sources d'erreur :</p><ul><li><strong>Le biais :</strong> L'erreur due à des hypothèses trop simplificatrices dans le modèle. Un biais élevé conduit à un sous-apprentissage (modèle trop rigide).</li><li><strong>La variance :</strong> L'erreur due à une trop grande sensibilité du modèle aux fluctuations des données d'entraînement. Une variance élevée conduit à un sur-apprentissage (modèle trop flexible, qui mémorise le bruit).</li></ul><p>L'objectif est de trouver le juste milieu où l'erreur de généralisation est minimale.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (1.5 pt)</strong> Expliquez comment la <strong>régularisation L2</strong> (aussi appelée <em>weight decay</em>) agit sur les coefficients d'un modèle linéaire pour lutter contre le sur-apprentissage. Quel est l'effet de l'hyperparamètre de régularisation \\( \\lambda \\) ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La régularisation L2 ajoute une pénalité proportionnelle à la somme des carrés des coefficients (\\( \\sum w_i^2 \\)) à la fonction de coût. Cela a pour effet de contraindre les coefficients à rester petits, ce qui lisse le modèle et réduit sa variance. L'hyperparamètre \\( \\lambda \\) contrôle l'intensité de la pénalité : plus \\( \\lambda \\) est grand, plus les coefficients sont réduits, ce qui peut conduire à un biais plus élevé mais à une variance plus faible. À l'inverse, un \\( \\lambda \\) trop faible annule l'effet de la régularisation.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Comparez les régularisations <strong>L1</strong> et <strong>L2</strong> en termes d'effet sur les coefficients du modèle. À quel type de problème <strong>L1</strong> est-elle particulièrement adaptée et pourquoi ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>L2 (Ridge) :</strong> Réduit les coefficients de manière proportionnelle, mais ne les annule pas. Elle est efficace pour gérer la multicolinéarité.</li><li><strong>L1 (Lasso) :</strong> Peut forcer certains coefficients à être exactement nuls. Elle est donc particulièrement adaptée pour la <strong>sélection de caractéristiques (feature selection)</strong> dans des problèmes avec un grand nombre de variables, car elle produit des modèles plus simples et plus interprétables.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4. (1.5 pt)</strong> Dans un contexte de régularisation structurée, quel est l'objectif principal du <strong>Group Lasso</strong> ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le Group Lasso est une extension du Lasso qui sélectionne des <strong>groupes de variables</strong> entiers plutôt que des variables individuelles. L'objectif est d'utiliser l'information de structure connue à l'avance (ex: des variables représentant un même facteur) pour n'inclure dans le modèle que des groupes de caractéristiques pertinents dans leur ensemble, améliorant ainsi l'interprétabilité et la performance.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Méthodes à Noyaux et Machines à Vecteurs de Support (SVM)",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice explore les concepts fondamentaux des méthodes à noyaux, en particulier les SVM pour la classification non linéaire.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1 pt)</strong> Quel est le rôle d'une <strong>fonction noyau</strong> dans un algorithme comme la SVM ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La fonction noyau permet de calculer le produit scalaire dans un espace de caractéristiques de très grande dimension (voire infini) sans avoir à effectuer explicitement la transformation des données dans cet espace. C'est le principe du <strong>kernel trick</strong>. Elle permet de trouver des séparateurs linéaires dans un espace transformé, ce qui équivaut à des séparateurs non linéaires dans l'espace d'origine.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (1.5 pt)</strong> Citez trois types de noyaux usuels en SVM et donnez une brève description de chacun.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Noyau linéaire :</strong> \\( K(x, x') = x \\cdot x' \\). Simple et efficace pour des données linéairement séparables.</li><li><strong>Noyau polynomial :</strong> \\( K(x, x') = (\\gamma \\cdot x \\cdot x' + r)^d \\). Permet de créer des frontières de décision polynomiales.</li><li><strong>Noyau RBF (Radial Basis Function) :</strong> \\( K(x, x') = \\exp(-\\gamma \\cdot ||x - x'||^2) \\). Est un noyau très flexible qui peut modéliser des frontières complexes. C'est un noyau gaussien.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Pour le noyau RBF, expliquez l'effet du paramètre \\( \\gamma \\) sur la forme de la frontière de décision.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li>Un <strong>\\gamma très petit</strong> donne un noyau avec une portée large. La frontière de décision sera plus lisse et plus linéaire (biais plus élevé, variance plus faible).</li><li>Un <strong>\\gamma très grand</strong> donne un noyau avec une portée très restreinte. La frontière de décision sera très complexe et sinueuse, s'ajustant étroitement aux données d'entraînement (variance élevée, risque de sur-apprentissage).</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4. (1 pt)</strong> Quel est le lien entre un noyau et un espace RKHS ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Un <strong>RKHS (Reproducing Kernel Hilbert Space)</strong> est un espace de Hilbert de fonctions associé à un noyau positif défini. Le noyau \\( K \\) agit comme un produit scalaire dans cet espace. Tout noyau défini positif définit un RKHS, et l'apprentissage dans ce RKHS (via des SVM par exemple) consiste à trouver une fonction dans cet espace.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Méthodes d'Ensemble - XGBoost, LightGBM et CatBoost",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Les méthodes d'ensemble à base d'arbres sont incontournables en data science. Cet exercice vous demande de détailler leurs spécificités.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> XGBoost est réputé pour sa rapidité et ses performances. Citez et expliquez <strong>deux</strong> des améliorations clés qu'il apporte par rapport au gradient boosting standard.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Régularisation avancée :</strong> XGBoost intègre des pénalités L1 et L2 dans sa fonction objectif, ce qui permet de contrôler la complexité du modèle et de réduire le sur-apprentissage.</li><li><strong>Parallélisation et Pruning :</strong> XGBoost construit les arbres de manière parallèle et utilise une technique de 'pruning' pour élaguer les branches qui n'apportent pas de gain suffisant, ce qui optimise les performances et la vitesse.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (1.5 pt)</strong> Quels sont les principaux avantages de <strong>LightGBM</strong> par rapport à XGBoost ? Expliquez brièvement le principe du <strong>GOSS</strong> (Gradient-based One-Side Sampling).</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>LightGBM est souvent plus rapide et plus efficace en mémoire, surtout sur de très grands jeux de données. Il utilise une croissance <em>leaf-wise</em> (par feuille) au lieu de <em>level-wise</em> (par niveau).</p><p><strong>GOSS :</strong> C'est une technique d'échantillonnage qui conserve les instances avec les gradients les plus élevés (les plus mal prédites) et échantillonne aléatoirement les instances avec des petits gradients. Cela permet de se concentrer sur les données les plus difficiles à apprendre, réduisant ainsi le temps d'entraînement sans trop dégrader la précision [citation:2][citation:8][citation:12].</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1 pt)</strong> Quelle est la spécialité de <strong>CatBoost</strong> qui le rend particulièrement performant sur certains types de données ? Expliquez.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La spécialité de CatBoost est sa <strong>gestion native et avancée des variables catégorielles</strong>. Il utilise une technique d'encodage appelée 'ordered encoding', qui est moins sujette au fuite de données (data leakage) que les encodages traditionnels comme le one-hot encoding. Il traite ces variables de manière optimale, ce qui le rend très puissant sur des données tabulaires contenant de nombreuses colonnes catégorielles [citation:2][citation:6].</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4. (1 pt)</strong> Quand est-il préférable d'utiliser un <strong>Stacking</strong> plutôt qu'un simple <strong>Blending</strong> pour combiner les modèles ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le <strong>Stacking</strong> est généralement préféré car il utilise une <strong>validation croisée</strong> pour générer les prédictions qui serviront à entraîner le méta-modèle. Cela permet d'utiliser toutes les données d'entraînement de manière plus robuste et de réduire le risque de sur-apprentissage par rapport au <strong>Blending</strong>, qui utilise un simple ensemble de validation (hold-out) [citation:2][citation:10].</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Architectures de Réseaux de Neurones Profonds",
     "points": "4 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
