<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Théorie de l'Apprentissage et Régularisation",
      "points": "6 pts",
      "enonce": "<p>L'erreur de généralisation est au cœur de l'apprentissage statistique. La décomposition biais-variance permet de comprendre les sources d'erreur d'un modèle.</p><p>On considère un modèle de régression avec une fonction cible \( f(x) = x^2 \) et un ensemble d'entraînement de taille \( n \).</p>",
      "questions": [
        {
          "question": "1) a) Décomposez l'erreur de généralisation en biais, variance et bruit. Définissez chaque terme.<br><br>b) Expliquez comment le paramètre de régularisation \( \\lambda \) dans une régression ridge (\( L_{totale} = L_{originale} + \\lambda \\sum w_i^2 \)) influence le compromis biais-variance.",
          "reponse": "a) L'erreur de généralisation se décompose en trois termes :<br>- Biais : Erreur due à l'incapacité du modèle à représenter la fonction cible (sous-apprentissage).<br>- Variance : Erreur due à la sensibilité du modèle aux fluctuations des données d'entraînement (sur-apprentissage).<br>- Bruit : Erreur irréductible due au bruit intrinsèque des données.<br><br>b) Une augmentation de \( \\lambda \) pénalise les grands coefficients, ce qui réduit la variance du modèle (il devient plus simple et moins sensible aux données) mais augmente le biais (il s'éloigne de la fonction cible). Inversement, une diminution de \( \\lambda \) réduit le biais mais augmente la variance."
        },
        {
          "question": "2) a) Énoncez la borne de généralisation basée sur la VC-dimension.<br><br>b) Expliquez pourquoi un modèle avec une VC-dimension élevée a besoin de plus de données pour bien généraliser.",
          "reponse": "a) La borne de généralisation s'écrit : \( E_{test} \\leq E_{train} + O\\left(\\sqrt{\\frac{VC}{n}}\\right) \), où \( VC \) est la VC-dimension et \( n \) le nombre d'échantillons.<br><br>b) Une VC-dimension élevée signifie que le modèle peut shatter (classifier parfaitement) des ensembles de points plus grands. Cela augmente le terme de pénalité dans la borne de généralisation, ce qui signifie que le modèle peut surapprendre si le nombre d'échantillons \( n \) n'est pas suffisamment grand."
        }
      ]
    },
    {
      "titre": "SVM à Noyaux et Kernel PCA",
      "points": "5 pts",
      "enonce": "<p>Les méthodes à noyaux permettent de traiter des données non linéairement séparables en les projetant dans un espace de dimension supérieure.</p><p>On considère un jeu de données avec deux classes non linéairement séparables (ex: cercles concentriques).</p>",
      "questions": [
        {
          "question": "3) a) Expliquez le principe du 'kernel trick' dans le contexte des SVM. Comment permet-il de classifier des données non linéaires ?<br><br>b) Présentez le noyau RBF (Gaussien) et ses hyperparamètres. Que contrôle le paramètre \( \\gamma \) ?",
          "reponse": "a) Le kernel trick consiste à remplacer le produit scalaire dans l'espace original par une fonction noyau \( K(x, x') = \\langle \\phi(x), \\phi(x') \\rangle \), où \( \\phi \) est une projection dans un espace de dimension supérieure. Cela permet d'apprendre une séparation linéaire dans l'espace projeté sans avoir à calculer explicitement \( \\phi \).<br><br>b) Le noyau RBF est défini par : \( K(x, x') = \\exp\\left(-\\gamma \\|x - x'\\|^2\\right) \\). Le paramètre \( \\gamma \) contrôle la portée du noyau : un \( \\gamma \) élevé rend le noyau très local, ce qui peut conduire à du surapprentissage. Un \( \\gamma \) faible rend le noyau plus global, ce qui peut conduire à du sous-apprentissage."
        },
        {
          "question": "4) a) Quel est l'objectif de la Kernel PCA par rapport à l'ACP classique ?<br><br>b) En quoi la Kernel PCA est-elle utile pour la visualisation de données complexes ?",
          "reponse": "a) La Kernel PCA applique le kernel trick à l'analyse en composantes principales pour capturer des structures non linéaires dans les données, là où l'ACP classique ne peut capturer que des structures linéaires.<br><br>b) La Kernel PCA permet de projeter des données non linéairement séparables dans un espace où les structures deviennent visibles (ex: séparation de cercles concentriques en une représentation linéaire). C'est un outil puissant pour la visualisation et l'exploration de données complexes."
        }
      ]
    },
    {
      "titre": "Méthodes d'Ensemble Avancées",
      "points": "5 pts",
      "enonce": "<p>Les méthodes d'ensemble comme XGBoost, LightGBM et CatBoost sont des piliers des compétitions de machine learning pour les données tabulaires.</p><p>Vous travaillez sur un jeu de données avec des variables numériques et catégorielles pour prédire le prix du cacao au Cameroun.</p>",
      "questions": [
        {
          "question": "5) a) Décrivez les avantages de XGBoost par rapport au gradient boosting classique (régularisation, parallélisation, pruning).<br><br>b) Quel paramètre de XGBoost contrôle la réduction de perte minimale nécessaire pour effectuer un split ? Comment son réglage influence-t-il le modèle ?",
          "reponse": "a) XGBoost apporte :<br>- Régularisation L1/L2 pour réduire le surapprentissage.<br>- Parallélisation pour accélérer l'entraînement.<br>- Pruning (élagage) des arbres pour supprimer les branches qui n'apportent pas de gain.<br><br>b) Le paramètre \( \\gamma \) contrôle la réduction de perte minimale nécessaire pour effectuer un split. Un \( \\gamma \) élevé réduit le nombre de splits, créant des arbres plus simples et réduisant le surapprentissage, mais peut augmenter le biais."
        },
        {
          "question": "6) a) Expliquez les algorithmes GOSS et EFB utilisés par LightGBM.<br><br>b) Comparez XGBoost et LightGBM en termes de vitesse d'entraînement et de gestion de la mémoire.",
          "reponse": "a) GOSS (Gradient-based One-Side Sampling) est une technique d'échantillonnage qui conserve les exemples avec de grands gradients (importants pour l'apprentissage) et échantillonne aléatoirement les exemples avec de petits gradients. EFB (Exclusive Feature Bundling) regroupe les caractéristiques mutuellement exclusives pour réduire la dimensionnalité.<br><br>b) LightGBM est généralement plus rapide que XGBoost grâce à sa croissance leaf-wise (vs level-wise) et à l'utilisation d'histogrammes pour les splits. Il est aussi plus efficace en mémoire."
        },
        {
          "question": "7) a) Qu'est-ce qui rend CatBoost particulièrement adapté aux données avec des variables catégorielles ?<br><br>b) Pour votre problème de prédiction du prix du cacao, quel algorithme recommanderiez-vous (XGBoost, LightGBM ou CatBoost) et pourquoi ?",
          "reponse": "a) CatBoost utilise le 'ordered encoding' qui traite les variables catégorielles de manière ordonnée, en utilisant des statistiques basées sur les exemples précédents dans l'ordre d'entraînement. Cela évite le data leakage souvent présent dans les encodages classiques.<br><br>b) CatBoost est recommandé car il gère nativement les variables catégorielles (région, type de cacao) sans prétraitement complexe, tout en offrant d'excellentes performances."
        }
      ]
    },
    {
      "titre": "Architectures Profondes et GANs",
      "points": "4 pts",
      "enonce": "<p>Les réseaux de neurones profonds et les modèles génératifs ont révolutionné le machine learning. Ils permettent de modéliser des données complexes et de générer de nouvelles données.</p><p>On s'intéresse à la génération d'images de produits artisanaux camerounais à partir d'un petit jeu de données.</p>",
      "questions": [
        {
          "question": "8) a) Expliquez le problème du gradient évanescent dans les réseaux profonds et comment les connexions résiduelles (ResNet) y remédient.<br><br>b) Pourquoi les méthodes de régularisation comme le dropout et la batch normalization sont-elles essentielles pour les réseaux profonds ?",
          "reponse": "a) Le gradient évanescent se produit lorsque les gradients deviennent très petits en se propageant vers les couches initiales, ralentissant ou bloquant l'apprentissage. Les connexions résiduelles (skip connections) permettent aux gradients de circuler directement des couches profondes vers les couches initiales, facilitant l'entraînement des réseaux très profonds.<br><br>b) Le dropout réduit le surapprentissage en désactivant aléatoirement des neurones pendant l'entraînement. La batch normalization normalise les activations à chaque couche, stabilisant l'apprentissage, accélérant la convergence et agissant comme un régularisateur."
        },
        {
          "question": "9) a) Décrivez le principe des GANs (générateur et discriminateur).<br><br>b) Pour générer des images de produits artisanaux avec peu de données, recommanderiez-vous un VAE ou un GAN ? Justifiez votre réponse.",
          "reponse": "a) Un GAN se compose de deux réseaux : un générateur qui crée de nouvelles données à partir de bruit aléatoire, et un discriminateur qui distingue les données réelles des données générées. Ils sont entraînés en compétition (jeu antagoniste).<br><br>b) Avec peu de données, un VAE est plus adapté car il est plus stable à entraîner et moins sensible aux problèmes de mode collapse qui affectent les GANs. Les VAE produisent des images plus lisses mais généralement de bonne qualité avec des données limitées."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
