<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Théorie de l'Apprentissage et Noyaux",
      "points": "6 pts",
      "enonce": "<div><p>Cet exercice porte sur les fondements théoriques de l'apprentissage (biais-variance, PAC-learning, régularisation) et les méthodes à noyaux (RKHS, SVM, Kernel PCA).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Expliquer le compromis biais-variance en détaillant la décomposition de l'erreur de généralisation. Illustrer avec un exemple d'un modèle simple versus un modèle complexe.</p>",
          "reponse": "<p><strong>Réponse 1.1</strong></p><p>L'erreur de généralisation se décompose en :</p><div class='math-block'><div class='math'>$$E[(\\hat{f}(x) - y)^2] = \\text{Biais}^2 + \\text{Variance} + \\text{Bruit}$$</div></div><p>où :</p><ul><li><strong>Biais</strong> : erreur due à l'incapacité du modèle à capturer la vraie relation (modèle trop simple → sous-apprentissage)</li><li><strong>Variance</strong> : sensibilité du modèle aux fluctuations des données (modèle trop complexe → sur-apprentissage)</li><li><strong>Bruit</strong> : erreur irréductible liée aux données</li></ul><p><strong>Exemple :</strong></p><ul><li>Modèle linéaire (simple) : biais élevé, variance faible → sous-apprentissage</li><li>Modèle polynomial de degré élevé (complexe) : biais faible, variance élevée → sur-apprentissage</li></ul><p>Le compromis consiste à trouver le modèle qui minimise la somme biais² + variance.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Définir un noyau positif défini et expliquer le principe du 'kernel trick' dans les SVM. Donner la formulation du problème dual des SVM avec noyaux.</p>",
          "reponse": "<p><strong>Réponse 1.2</strong></p><p>Un noyau $k: \\mathcal{X} \\times \\mathcal{X} \\rightarrow \\mathbb{R}$ est positif défini s'il est symétrique et vérifie :</p><div class='math-block'><div class='math'>$$\\sum_{i=1}^{n} \\sum_{j=1}^{n} \\alpha_i \\alpha_j k(x_i, x_j) > 0$$</div></div><p>pour tout $\\alpha \\neq 0$.</p><p><strong>Kernel trick :</strong> On remplace le produit scalaire $\\langle \\phi(x), \\phi(z) \\rangle$ par $k(x,z)$ sans avoir à expliciter $\\phi$. Cela permet de travailler dans un espace de grande dimension implicitement.</p><p><strong>Problème dual SVM :</strong></p><div class='math-block'><div class='math'>$$\\max_{\\alpha} \\sum_{i=1}^{n} \\alpha_i - \\frac{1}{2} \\sum_{i=1}^{n} \\sum_{j=1}^{n} \\alpha_i \\alpha_j y_i y_j k(x_i, x_j)$$</div></div><p>sous contraintes : $0 \\le \\alpha_i \\le C$ et $\\sum_{i=1}^{n} \\alpha_i y_i = 0$.</p>"
        }
      ]
    },
    {
      "titre": "Méthodes d'Ensemble Avancées",
      "points": "7 pts",
      "enonce": "<div><p>Cet exercice aborde les méthodes d'ensemble avancées : XGBoost, LightGBM, CatBoost, et Stacking.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Comparer XGBoost, LightGBM et CatBoost en termes d'architecture, d'optimisations et de gestion des données. Pour chaque algorithme, citer une spécificité clé.</p>",
          "reponse": "<p><strong>Réponse 2.1</strong></p><table style='width: 100%; border-collapse: collapse; font-size: 0.85em;'><tr style='background: #1a237e;'><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>Critère</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>XGBoost</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>LightGBM</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>CatBoost</th></tr><tr style='background: #e3f2fd;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Architecture</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Gradient Boosting</td><td style='padding: 8px; border: 1px solid #90caf9;'>Gradient Boosting (leaf-wise)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Gradient Boosting (symmetric trees)</td></tr><tr style='background: #e8f5e9;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Spécificité</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Régularisation L1/L2, pruning</td><td style='padding: 8px; border: 1px solid #90caf9;'>GOSS, EFB, croissance leaf-wise</td><td style='padding: 8px; border: 1px solid #90caf9;'>Ordered encoding, gestion catégories</td></tr><tr style='background: #f3e5f5;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Données</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Gestion native des manquantes</td><td style='padding: 8px; border: 1px solid #90caf9;'>Gestion native des manquantes</td><td style='padding: 8px; border: 1px solid #90caf9;'>Gestion native des catégorielles</td></tr></table><p><strong>Spécificités clés :</strong></p><ul><li><strong>XGBoost</strong> : régularisation (lambda, alpha) et pruning pour éviter le sur-apprentissage</li><li><strong>LightGBM</strong> : GOSS échantillonne les gradients, EFB réduit les caractéristiques</li><li><strong>CatBoost</strong> : ordered encoding évite le leakage pour les variables catégorielles</li></ul>"
        },
        {
          "question": "<p><strong>2.2</strong> Décrire le principe du stacking. Expliquer le rôle des base learners, du meta-learner, et l'importance de la validation croisée.</p>",
          "reponse": "<p><strong>Réponse 2.2</strong></p><p><strong>Stacking :</strong> Technique d'ensemble à deux niveaux qui combine les prédictions de plusieurs modèles.</p><p><strong>Composants :</strong></p><ul><li><strong>Base learners (niveau 0)</strong> : plusieurs modèles diversifiés (XGBoost, LightGBM, etc.) entraînés sur les données</li><li><strong>Meta-learner (niveau 1)</strong> : modèle qui apprend à combiner les prédictions des base learners</li></ul><p><strong>Validation croisée :</strong> Essentielle pour éviter le surapprentissage. On génère les prédictions des base learners sur des données non vues (via K-fold), puis on entraîne le meta-learner sur ces prédictions.</p><p><strong>Avantage :</strong> Le stacking exploite les forces complémentaires des modèles, produisant des prédictions plus robustes.</p>"
        }
      ]
    },
    {
      "titre": "Apprentissage Semi-Supervisé et Faiblement Supervisé",
      "points": "5 pts",
      "enonce": "<div><p>Cet exercice aborde l'apprentissage semi-supervisé, faiblement supervisé, et autosupervisé.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Expliquer le principe du cadre semi-supervisé et citer trois méthodes (Co-training, Self-training, Label Propagation).</p>",
          "reponse": "<p><strong>Réponse 3.1</strong></p><p>L'apprentissage semi-supervisé utilise à la fois des données étiquetées (peu nombreuses) et non étiquetées (abondantes) pour améliorer les performances.</p><p><strong>Méthodes :</strong></p><ul><li><strong>Co-training</strong> : entraîne plusieurs classifieurs sur différentes vues des données, chaque classifieur étiquette les données non étiquetées pour l'autre</li><li><strong>Self-training</strong> : entraîne un modèle sur les données étiquetées, utilise ses prédictions les plus confiantes pour étiqueter de nouvelles données, et réitère</li><li><strong>Label Propagation</strong> : propage les étiquettes à travers un graphe de similarité entre les points</li></ul>"
        },
        {
          "question": "<p><strong>3.2</strong> Présenter l'apprentissage faiblement supervisé et le framework Snorkel. Expliquer le rôle des fonctions d'étiquetage (labeling functions).</p>",
          "reponse": "<p><strong>Réponse 3.2</strong></p><p><strong>Apprentissage faiblement supervisé :</strong> Utilise des sources de supervision imparfaites (règles heuristiques, connaissances du domaine) pour générer des étiquettes.</p><p><strong>Snorkel :</strong> Framework de programmation probabiliste qui permet de :</p><ul><li>Écrire des fonctions d'étiquetage (labeling functions) heuristiques</li><li>Combiner ces fonctions via un modèle génératif qui apprend leurs précisions</li><li>Générer des étiquettes probabilistes pour les données non étiquetées</li></ul><p><strong>Fonctions d'étiquetage :</strong> Fonctions qui attribuent une étiquette à un exemple ou s'abstiennent (retournent -1). Elles peuvent être basées sur des règles, des motifs, des dictionnaires, etc.</p>"
        }
      ]
    },
    {
      "titre": "Modèles Génératifs",
      "points": "7 pts",
      "enonce": "<div><p>Cet exercice porte sur les modèles génératifs : VAE, GANs, et modèles de diffusion.</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Expliquer le principe des VAE (Autoencodeurs Variationnels). Décrire l'architecture, la fonction objectif (ELBO) et le rôle du reparametrization trick.</p>",
          "reponse": "<p><strong>Réponse 4.1</strong></p><p><strong>VAE :</strong> Autoencodeur variationnel qui apprend une distribution latente $p(z)$ pour générer de nouvelles données.</p><p><strong>Architecture :</strong></p><ul><li><strong>Encodeur</strong> : $q_\\phi(z|x)$ approximé par un réseau qui prédit $\\mu$ et $\\sigma$ de la distribution latente</li><li><strong>Décodeur</strong> : $p_\\theta(x|z)$ génère les données à partir de l'espace latent</li></ul><p><strong>ELBO (Evidence Lower Bound) :</strong></p><div class='math-block'><div class='math'>$$\\mathcal{L}(\\theta, \\phi; x) = \\mathbb{E}_{q_\\phi(z|x)}[\\log p_\\theta(x|z)] - D_{KL}(q_\\phi(z|x) || p(z))$$</div></div><p><strong>Reparametrization trick :</strong> $z = \\mu + \\sigma \\odot \\epsilon$ avec $\\epsilon \\sim \\mathcal{N}(0,1)$ permet la rétropropagation à travers l'échantillonnage.</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Comparer VAE, GANs et modèles de diffusion en termes de principe, stabilité d'entraînement et qualité de génération.</p>",
          "reponse": "<p><strong>Réponse 4.2</strong></p><table style='width: 100%; border-collapse: collapse; font-size: 0.85em;'><tr style='background: #1a237e;'><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>Critère</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>VAE</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>GANs</th><th style='padding: 8px; border: 1px solid #90caf9; color: white;'>Diffusion</th></tr><tr style='background: #e3f2fd;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Principe</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Inférence variationnelle</td><td style='padding: 8px; border: 1px solid #90caf9;'>Adversarial (G/D)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Débruitage progressif</td></tr><tr style='background: #e8f5e9;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Stabilité</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Très stable</td><td style='padding: 8px; border: 1px solid #90caf9;'>Instable (mode collapse)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Stable</td></tr><tr style='background: #f3e5f5;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Qualité</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Moyenne (images floues)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Très bonne (photoréaliste)</td><td style='padding: 8px; border: 1px solid #90caf9;'>Excellente (état de l'art)</td></tr><tr style='background: #fff3e0;'><td style='padding: 8px; border: 1px solid #90caf9;'><strong>Coût</strong></td><td style='padding: 8px; border: 1px solid #90caf9;'>Faible</td><td style='padding: 8px; border: 1px solid #90caf9;'>Moyen</td><td style='padding: 8px; border: 1px solid #90caf9;'>Élevé (inférence lente)</td></tr></table>"

      ]
    },
    {
      "titre": "Transfert Learning, Méta-Apprentissage et Interprétabilité",
      "points": "5 pts",
      "enonce": "<div><p>Cet exercice porte sur le transfert learning, le méta-apprentissage, et les techniques d'interprétabilité (SHAP, LIME, Grad-CAM).</p></div>",
      "questions": [
        {

          "reponse": "<p><strong>Réponse 5.1</strong></p><p><strong>Extraction de caractéristiques :</strong> Utilisation du modèle pré-entraîné comme extracteur fixe. Les poids sont gelés, seule la couche de classification est entraînée. Privilégier quand les données sont très limitées.</p><p><strong>Fine-tuning :</strong> Réentraînement de certaines couches (généralement les dernières) du modèle pré-entraîné. Privilégier quand on dispose de plus de données et que la tâche cible est proche de la tâche source.</p><p><strong>Règle :</strong> Extraction si < 100 exemples/classe, fine-tuning si > 1000 exemples/classe.</p>"
        },
        {
          "question": "<p><strong>5.2</strong> Comparer SHAP et LIME pour l'explication des modèles. Pour chaque méthode, décrire le principe et citer un avantage et un inconvénient.</p>",
          "reponse": "<p><strong>Réponse 5.2</strong></p><p><strong>SHAP :</strong> Basé sur les valeurs de Shapley (théorie des jeux). Attribue à chaque caractéristique une contribution à la prédiction.</p><ul><li><strong>Avantage :</strong> Propriétés théoriques solides (additivité, consistance)</li><li><strong>Inconvénient :</strong> Coût computationnel élevé</li></ul><p><strong>LIME :</strong> Perturbe l'entrée et entraîne un modèle interprétable localement (régression linéaire).</p><ul><li><strong>Avantage :</strong> Rapide, model-agnostic</li><li><strong>Inconvénient :</strong> Instabilité des explications, choix des paramètres influent</li></ul>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
