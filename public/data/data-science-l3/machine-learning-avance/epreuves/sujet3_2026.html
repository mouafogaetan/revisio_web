<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Avancé",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Théorie de l'Apprentissage et Régularisation (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice évalue votre compréhension des concepts fondamentaux de la théorie de l'apprentissage.</p>",
      "questions": [
        {
          "question": "<p>1) Expliquez le compromis biais-variance dans vos propres termes. Comment ce compromis est-il lié aux problèmes de sous-apprentissage et de surapprentissage ? (2 pts)</p>",
          "reponse": "<p>Le compromis biais-variance est un concept fondamental en apprentissage statistique. Un modèle avec un <strong>biais élevé</strong> est un modèle trop simple qui ne capture pas la complexité des données (sous-apprentissage). Il fait des erreurs systématiques importantes. Un modèle avec une <strong>variance élevée</strong> est un modèle trop complexe qui s'adapte trop au bruit des données (surapprentissage). Il est très sensible aux fluctuations des données. L'objectif est de trouver un équilibre qui minimise l'erreur de généralisation. Le sous-apprentissage est caractérisé par un biais élevé, tandis que le surapprentissage est caractérisé par une variance élevée.</p>"
        },
        {
          "question": "<p>2) Comparez les régularisations L1 et L2. Quels sont leurs effets respectifs sur les coefficients du modèle et dans quelles situations préférer l'une à l'autre ? (2 pts)</p>",
          "reponse": "<p>La <strong>régularisation L2</strong> (Ridge) ajoute une pénalité proportionnelle au carré des coefficients. Elle tend à réduire l'amplitude de tous les coefficients de manière uniforme, sans les annuler. La <strong>régularisation L1</strong> (Lasso) ajoute une pénalité proportionnelle à la valeur absolue des coefficients. Elle a tendance à produire des coefficients épars, c'est-à-dire à annuler certains coefficients. On préfère L1 lorsqu'on souhaite une <strong>sélection de caractéristiques</strong> automatique ou lorsqu'on a un grand nombre de caractéristiques potentiellement non pertinentes. On préfère L2 pour traiter la <strong>multicolinéarité</strong> ou lorsque toutes les caractéristiques sont susceptibles d'être pertinentes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Méthodes à Noyaux et Kernel Trick (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Les méthodes à noyaux permettent de traiter des problèmes non linéaires sans calcul explicite de la transformation.</p>",
      "questions": [
        {
          "question": "<p>1) Définissez ce qu'est un noyau positif défini et donnez un exemple de noyau usuel avec sa formule. (2 pts)</p>",
          "reponse": "<p>Un <strong>noyau positif défini</strong> est une fonction \( K: \mathcal{X} \times \mathcal{X} \to \mathbb{R} \) symétrique telle que la matrice de Gram associée à tout ensemble fini de points soit semi-définie positive. <br> <strong>Exemple :</strong> Le noyau gaussien ou RBF (Radial Basis Function) : \( K(x, y) = \exp\left(-\frac{\|x - y\|^2}{2\sigma^2}\right) \). Ce noyau est très utilisé pour sa capacité à approximer une grande variété de fonctions.</p>"
        },
        {
          "question": "<p>2) Expliquez le principe du <strong>kernel trick</strong>. En quoi est-il particulièrement utile pour les SVM et les méthodes comme la Kernel PCA ? (3 pts)</p>",
          "reponse": "<p>Le <strong>kernel trick</strong> est une technique qui permet d'appliquer des méthodes linéaires (comme la SVM ou l'ACP) dans un espace de caractéristiques de très grande dimension, sans avoir à calculer explicitement la transformation \( \phi \) des données. Il suffit de remplacer les produits scalaires par un noyau \( K(x, y) = \langle \phi(x), \phi(y) \rangle \). Cela permet : <br> - Pour les SVM : de créer des frontières de décision non linéaires. <br> - Pour la Kernel PCA : de capturer des structures non linéaires dans les données et de les visualiser. Cette technique est puissante car elle permet d'utiliser des espaces de caractéristiques de dimension infinie tout en gardant un coût de calcul raisonnable.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodes d'Ensemble Avancées (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Cet exercice porte sur les frameworks de boosting et les techniques d'ensemble.</p>",
      "questions": [
        {
          "question": "<p>1) Comparez les stratégies de construction d'arbres de XGBoost, LightGBM et CatBoost. (3 pts)</p>",
          "reponse": "<p>Ces trois frameworks diffèrent dans leur approche de construction des arbres : <br> - <strong>XGBoost</strong> : utilise une croissance en <strong>profondeur</strong> (level-wise), ce qui donne des arbres équilibrés. C'est une approche stable. <br> - <strong>LightGBM</strong> : utilise une croissance en <strong>feuilles</strong> (leaf-wise), qui est plus rapide mais peut mener au surapprentissage si elle n'est pas contrôlée. <br> - <strong>CatBoost</strong> : utilise des arbres <strong>symétriques</strong> (équilibrés), ce qui est plus rapide et robuste, et gère particulièrement bien les variables catégorielles.</p>"
        },
        {
          "question": "<p>2) Présentez le principe du stacking (empilement de modèles). Décrivez les étapes de mise en œuvre et expliquez pourquoi l'utilisation d'une validation croisée est recommandée. (3 pts)</p>",
          "reponse": "<p>Le <strong>stacking</strong> est une méthode d'ensemble qui combine plusieurs modèles de base (<em>base learners</em>) en utilisant un méta-modèle (<em>meta-learner</em>). Les étapes sont : <br> 1. Entraîner les modèles de base sur l'ensemble d'entraînement. <br> 2. Générer les prédictions de ces modèles pour servir de caractéristiques d'entrée au méta-modèle. <br> 3. Entraîner le méta-modèle sur ces nouvelles caractéristiques. <br> La <strong>validation croisée</strong> est recommandée à l'étape 2 pour éviter le surapprentissage. On peut utiliser une validation croisée 5-folds pour produire des prédictions 'out-of-fold' pour chaque modèle de base, qui seront utilisées pour entraîner le méta-modèle.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Interprétabilité avec SHAP et LIME (5 pts)",
      "points": "5 pts",
      "enonce": "<p>L'interprétabilité est cruciale pour la confiance dans les modèles de machine learning.</p>",
      "questions": [
        {
          "question": "<p>1) Expliquez le principe de SHAP (SHapley Additive exPlanations) et sa base théorique. (2 pts)</p>",
          "reponse": "<p><strong>SHAP</strong> est une méthode d'explication des modèles basée sur les <strong>valeurs de Shapley</strong> issues de la théorie des jeux coopératifs. Pour une prédiction donnée, SHAP calcule la contribution marginale moyenne de chaque caractéristique sur toutes les combinaisons possibles de caractéristiques. Cela permet de décomposer la prédiction en contributions additives : \( f(x) = \phi_0 + \sum_{j} \phi_j \), où \( \phi_0 \) est la prédiction de base et \( \phi_j \) est l'impact de la caractéristique \( j \).</p>"
        },
        {
          "question": "<p>2) Comparez SHAP et LIME. Dans quels contextes choisiriez-vous l'un plutôt que l'autre ? (3 pts)</p>",
          "reponse": "<p><strong>SHAP</strong> et <strong>LIME</strong> sont tous deux des méthodes d'interprétabilité modèle-agnostiques. <br> - <strong>SHAP</strong> est basé sur une théorie solide (valeurs de Shapley) et offre des propriétés de cohérence et d'additivité. Il fournit des explications locales et globales cohérentes. En revanche, il peut être coûteux en calcul. <br> - <strong>LIME</strong> est plus simple et plus rapide. Il approche localement le modèle complexe par un modèle linéaire simple. <br> On choisira <strong>SHAP</strong> lorsqu'on a besoin d'explications cohérentes et robustes, notamment pour des rapports ou une conformité réglementaire. On choisira <strong>LIME</strong> pour une analyse rapide ou lorsque SHAP est trop coûteux en calcul (grand nombre de caractéristiques).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
