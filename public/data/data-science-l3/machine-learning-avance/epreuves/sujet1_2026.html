<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Compromis Biais-Variance et Théorie de l'Apprentissage",
      "points": "5 pts",
      "enonce": "<p>Le compromis biais-variance est un concept fondamental en apprentissage automatique. Répondez aux questions suivantes pour démontrer votre compréhension de ce compromis et de la théorie de l'apprentissage.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Définissez le <strong>biais</strong> et la <strong>variance</strong> dans le contexte de l'apprentissage statistique. Comment ces deux quantités contribuent-elles à l'erreur de généralisation d'un modèle ?</p>",
          "reponse": "<p>Le <strong>biais</strong> est l'erreur introduite par l'approximation d'une réalité complexe par un modèle trop simple. Il représente l'incapacité du modèle à capturer la vraie relation entre les variables.</p><p>La <strong>variance</strong> est l'erreur introduite par la sensibilité du modèle aux fluctuations des données d'entraînement. Un modèle avec une variance élevée s'adapte trop aux spécificités du jeu de données.</p><p>L'erreur de généralisation se décompose comme :</p><div class='math-block'><div class='math'>$$ \\text{Erreur} = \\text{Biais}^2 + \\text{Variance} + \\text{Bruit} $$</div></div><p>Le bruit est une composante irréductible due au bruit intrinsèque des données.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1,5 pts) :</strong> Expliquez le <strong>compromis biais-variance</strong>. Comment le choix de la complexité d'un modèle influence-t-il ces deux quantités ? Reliez ce compromis aux notions de <strong>sous-apprentissage</strong> et de <strong>surapprentissage</strong>.</p>",
          "reponse": "<p>Le <strong>compromis biais-variance</strong> est le fait qu'on ne peut pas minimiser simultanément le biais et la variance.</p><ul><li><strong>Modèle trop simple</strong> (ex: régression linéaire sur des données non-linéaires) → <strong>Biais élevé</strong>, <strong>Variance faible</strong> → <strong>Sous-apprentissage</strong> (underfitting). Le modèle ne capture pas la structure des données.</li><li><strong>Modèle trop complexe</strong> (ex: arbre de décision très profond) → <strong>Biais faible</strong>, <strong>Variance élevée</strong> → <strong>Surapprentissage</strong> (overfitting). Le modèle s'adapte trop aux données d'entraînement.</li></ul><p>L'objectif est de trouver le <strong>point d'équilibre</strong> où l'erreur de généralisation est minimale.</p>"
        },
        {
          "question": "<p><strong>Question 3 (1,5 pts) :</strong> Le cadre <strong>PAC (Probably Approximately Correct)</strong> fournit des garanties théoriques sur l'apprentissage. <strong>Définissez</strong> l'erreur d'entraînement et l'erreur de généralisation dans ce cadre. <strong>Expliquez</strong> le rôle de la <strong>dimension VC</strong> dans les bornes de généralisation.</p>",
          "reponse": "<p>Dans le cadre PAC :</p><ul><li><strong>Erreur d'entraînement</strong> : l'erreur du modèle sur l'ensemble d'entraînement. Elle est facile à calculer mais peut être trompeuse (peut être très faible en cas de surapprentissage).</li><li><strong>Erreur de généralisation</strong> : l'erreur du modèle sur de nouvelles données (données de test). C'est la véritable mesure de la performance.</li></ul><p>La <strong>dimension VC</strong> (Vapnik-Chervonenkis) mesure la <strong>capacité</strong> d'une classe de modèles à séparer des points de différentes manières. Plus la dimension VC est élevée, plus le modèle est complexe.</p><p>La borne de généralisation s'écrit :</p><div class='math-block'><div class='math'>$$ \\text{Erreur}_{\\text{gén}} \\leq \\text{Erreur}_{\\text{ent}} + \\text{terme dépendant de la VC-dimension et du nombre d'exemples} $$</div></div><p>Cette borne montre qu'à taille d'échantillon fixée, un modèle avec une dimension VC trop élevée aura une mauvaise généralisation.</p>"
        },
        {
          "question": "<p><strong>Question 4 (1 pt) :</strong> Citez <strong>deux techniques de régularisation</strong> permettant de réduire le surapprentissage. Expliquez brièvement le principe de chacune.</p>",
          "reponse": "<p><strong>1. Régularisation L2 (Ridge / Weight Decay) :</strong> On ajoute un terme de pénalité quadratique sur les poids du modèle à la fonction de coût :</p><div class='math-block'><div class='math'>$$ L_{\\text{total}} = L_{\\text{original}} + \\lambda ||w||_2^2 $$</div></div><p>Cela décourage les poids trop importants, ce qui rend le modèle moins sensible aux variations des données.</p><p><strong>2. Dropout :</strong> Pendant l'entraînement, on désactive aléatoirement une fraction des neurones du réseau à chaque itération. Cela empêche le réseau de trop dépendre de neurones spécifiques et favorise l'apprentissage de représentations robustes.</p><p><strong>Autre exemple :</strong> Early stopping (arrêt précoce) qui consiste à arrêter l'entraînement lorsque la performance sur l'ensemble de validation commence à se dégrader.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Méthodes à Noyaux et Kernel PCA",
      "points": "5 pts",
      "enonce": "<p>Les méthodes à noyaux permettent de traiter des problèmes non-linéaires en projetant les données dans un espace de dimension supérieure. La <strong>Kernel PCA</strong> est une extension de l'ACP classique aux données non-linéaires.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Expliquez le principe du <strong>kernel trick</strong>. En quoi permet-il d'effectuer des calculs dans un espace de caractéristiques de grande dimension sans les effectuer explicitement ?</p>",
          "reponse": "<p>Le <strong>kernel trick</strong> consiste à utiliser une <strong>fonction noyau</strong> \( k(x, x') = \\langle \\phi(x), \\phi(x') \\rangle \) pour calculer le produit scalaire dans un espace de caractéristiques \( \\mathcal{H} \) (espace de Hilbert) <strong>sans avoir à calculer explicitement</strong> la transformation \( \\phi(x) \\) elle-même.</p><p>L'avantage est que l'espace \( \\mathcal{H} \) peut être de dimension très élevée, voire infinie (comme avec le noyau RBF). Le kernel trick permet de faire des calculs (SVM, PCA, etc.) dans cet espace avec un coût computationnel qui dépend uniquement de la taille de la matrice de Gram \( K_{ij} = k(x_i, x_j) \\), et non de la dimension de \( \\mathcal{H} \\).</p>"
        },
        {
          "question": "<p><strong>Question 2 (1 pt) :</strong> Définissez un <strong>noyau positif défini</strong>. Donnez un exemple de noyau couramment utilisé avec sa formule.</p>",
          "reponse": "<p>Un <strong>noyau positif défini</strong> est une fonction \( k: \\mathcal{X} \\times \\mathcal{X} \\rightarrow \\mathbb{R} \) telle que pour tout \( n \\geq 1 \\) et tout ensemble de points \( x_1, ..., x_n \\in \\mathcal{X} \\), la matrice de Gram \( K \) définie par \( K_{ij} = k(x_i, x_j) \) est <strong>symétrique</strong> et <strong>semi-définie positive</strong> (toutes ses valeurs propres sont positives ou nulles).</p><p><strong>Exemple : le noyau RBF (Gaussien)</strong></p><div class='math-block'><div class='math'>$$ k(x, x') = \\exp\\left(-\\frac{||x - x'||^2}{2\\sigma^2}\\right) $$</div></div><p>où \( \\sigma \) est un paramètre de largeur. Ce noyau est très utilisé car il permet de capturer des relations non-linéaires complexes.</p>"
        },
        {
          "question": "<p><strong>Question 3 (1,5 pts) :</strong> La <strong>Kernel PCA</strong> est une extension de l'ACP classique. Décrivez ses <strong>étapes principales</strong> et expliquez en quoi elle diffère de l'ACP classique.</p>",
          "reponse": "<p><strong>Étapes principales de la Kernel PCA :</strong></p><ol><li><strong>Choix du noyau</strong> : On choisit une fonction noyau \( k \\) (ex: RBF).</li><li><strong>Calcul de la matrice de Gram</strong> : \( K_{ij} = k(x_i, x_j) \\) pour toutes les paires de données.</li><li><strong>Centrage</strong> : On centre la matrice \( K \) pour que les données aient une moyenne nulle dans l'espace des caractéristiques.</li><li><strong>Diagonalisation</strong> : On calcule les vecteurs propres et valeurs propres de la matrice de Gram centrée.</li><li><strong>Projection</strong> : On projette les données sur les vecteurs propres pour obtenir les composantes principales.</li></ol><p><strong>Différence avec l'ACP classique :</strong></p><ul><li>L'ACP classique diagonalise la <strong>matrice de covariance</strong> \( C = X^T X \\) dans l'espace original.</li><li>La Kernel PCA diagonalise la <strong>matrice de Gram</strong> \( K \\) dans l'espace des caractéristiques, ce qui permet de capturer des <strong>structures non-linéaires</strong>.</li></ul>"
        },
        {
          "question": "<p><strong>Question 4 (1,5 pts) :</strong> Donnez un exemple concret de données où la Kernel PCA serait plus efficace que l'ACP classique pour la visualisation. <strong>Justifiez</strong> votre réponse.</p>",
          "reponse": "<p><strong>Exemple :</strong> Des données disposées en <strong>cercle</strong> ou en <strong>deux lunes</strong> (two moons) dans un espace 2D.</p><ul><li><strong>Données en cercle</strong> : Des points répartis sur un cercle avec une classification binaire à l'intérieur et à l'extérieur du cercle. L'ACP classique projettera ces données de manière linéaire sans séparer les classes.</li><li><strong>Données en deux lunes</strong> : Deux distributions en forme de croissant. L'ACP classique ne pourra pas séparer ces deux classes en 2D.</li></ul><p><strong>Justification :</strong></p><ul><li>L'ACP classique est <strong>linéaire</strong> : elle cherche des directions de variance maximale dans l'espace original. Elle ne peut pas capturer des structures courbes ou non-convexes.</li><li>La Kernel PCA avec un noyau RBF peut projeter ces données dans un espace de caractéristiques de dimension supérieure où elles deviennent <strong>linéairement séparables</strong>, permettant ainsi une visualisation efficace en 2D ou 3D.</li></ul><p>La Kernel PCA est donc idéale pour visualiser des données non-linéairement séparables.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodes d'Ensemble Avancées",
      "points": "5 pts",
      "enonce": "<p>Les méthodes d'ensemble améliorent les performances en combinant plusieurs modèles. Parmi les plus avancées, on trouve <strong>XGBoost</strong>, <strong>LightGBM</strong>, <strong>CatBoost</strong> et le <strong>Stacking</strong>.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1,5 pts) :</strong> Citez <strong>trois hyperparamètres clés</strong> de XGBoost. Expliquez leur rôle et comment ils influencent l'apprentissage.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
