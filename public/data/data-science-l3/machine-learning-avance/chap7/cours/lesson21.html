<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction au Méta-Apprentissage",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h2 style='color: #2c3e50;'>Méta-Apprentissage : Apprendre à Apprendre</h2>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Le <strong>méta-apprentissage</strong> est une approche qui vise à apprendre <strong>comment apprendre</strong> efficacement.</p>\n  <div style='background-color: #e8f4f8; padding: 15px; border-radius: 10px; margin: 15px 0;'>\n    <p style='margin: 0; font-weight: bold; color: #1a5276;'>🎯 Pourquoi le méta-apprentissage ?</p>\n    <p style='margin: 5px 0 0 0; color: #1a5276;'>Les modèles traditionnels doivent être ré-entraînés pour chaque nouvelle tâche. Le méta-apprentissage vise à <strong>généraliser</strong> à de nouvelles tâches avec <strong>peu de données</strong>.</p>\n  </div>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'>\n    <p style='margin: 0; font-weight: bold;'>📋 Plan du cours</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li>Qu'est-ce que le méta-apprentissage ?</li>\n      <li>Approches basées sur l'optimisation (MAML)</li>\n      <li>Approches basées sur les métriques (Prototypical Networks)</li>\n    </ul>\n  </div>\n</div>",
    "texteParle": "Bonjour à tous ! Aujourd'hui, nous allons découvrir le méta-apprentissage, aussi appelé Learning to Learn ou apprendre à apprendre. L'idée est simple : au lieu d'entraîner un modèle pour une tâche spécifique, on entraîne un modèle qui apprend comment apprendre efficacement une nouvelle tâche avec très peu de données. C'est particulièrement utile quand on n'a pas beaucoup de données étiquetées. Nous allons voir deux grandes approches : les approches basées sur l'optimisation, avec MAML, et les approches basées sur les métriques, avec les Prototypical Networks.",
    "note": "Le méta-apprentissage permet de généraliser à de nouvelles tâches avec peu de données."
  },
  {
    "titre": "Pourquoi le Méta-Apprentissage ?",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Le Problème de l'Apprentissage Classique</h3>\n  <div style='display: flex; flex-wrap: wrap; justify-content: space-between; margin: 10px 0;'>\n    <div style='background-color: #fadbd8; padding: 15px; border-radius: 10px; flex: 1; min-width: 200px; margin: 5px;'>\n      <p style='font-weight: bold; color: #922b21; margin-top: 0;'>⚠️ Les limites</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li><strong>Données</strong> : Besoin de beaucoup de données étiquetées</li>\n        <li><strong>Temps</strong> : Entraînement long et coûteux</li>\n        <li><strong>Spécificité</strong> : Un modèle = une tâche</li>\n        <li><strong>Généralisation</strong> : Difficulté à s'adapter à de nouvelles tâches</li>\n      </ul>\n    </div>\n    <div style='background-color: #d5f5e3; padding: 15px; border-radius: 10px; flex: 1; min-width: 200px; margin: 5px;'>\n      <p style='font-weight: bold; color: #1e8449; margin-top: 0;'>💡 La promesse du méta-apprentissage</p>\n      <ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'>\n        <li><strong>Few-shot learning</strong> : Apprendre avec peu d'exemples</li>\n        <li><strong>Adaptation rapide</strong> : Quelques itérations suffisent</li>\n        <li><strong>Généralisation</strong> : Transférer l'apprentissage à de nouvelles tâches</li>\n        <li><strong>Efficacité</strong> : Moins de données et de temps</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> Le méta-apprentissage imite la capacité humaine à apprendre rapidement de nouvelles tâches avec peu d'exemples.</p>\n  </div>\n</div>",
    "texteParle": "Pourquoi avons-nous besoin du méta-apprentissage ? L'apprentissage classique a plusieurs limites. D'abord, il nécessite énormément de données étiquetées, ce qui est coûteux et long à obtenir. Ensuite, l'entraînement est long et demande beaucoup de ressources. De plus, chaque modèle est spécifique à une tâche : si on change de tâche, il faut ré-entraîner tout le modèle. Enfin, les modèles classiques ont du mal à généraliser à de nouvelles tâches. Le méta-apprentissage promet de résoudre ces problèmes en permettant d'apprendre avec peu d'exemples, de s'adapter rapidement, de transférer l'apprentissage à de nouvelles tâches, et de le faire avec moins de données et de temps.",
    "note": "Le méta-apprentissage vise à imiter la flexibilité de l'apprentissage humain."
  },
  {
    "titre": "Few-Shot Learning",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Few-Shot Learning</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Le <strong>few-shot learning</strong> est un sous-domaine du méta-apprentissage où l'on apprend à classer de nouvelles classes avec <strong>très peu d'exemples</strong>.</p>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📊 Définitions</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>N-way K-shot</strong> : N classes, K exemples par classe</li>\n      <li><strong>Support set</strong> : Les K exemples d'entraînement pour chaque classe</li>\n      <li><strong>Query set</strong> : Les exemples à classer</li>\n    </ul>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>📝 Exemple</p>\n    <ul style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>5-way 1-shot</strong> : 5 classes, 1 exemple par classe</li>\n      <li><strong>5-way 5-shot</strong> : 5 classes, 5 exemples par classe</li>\n    </ul>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Intuition :</strong> On apprend à comparer des exemples plutôt qu'à reconnaître des classes spécifiques.</p>\n  </div>\n</div>",
    "texteParle": "Le few-shot learning est l'application la plus connue du méta-apprentissage. L'idée est d'apprendre à classer de nouvelles classes avec très peu d'exemples. Par exemple, pour un problème de classification d'images, on peut avoir un support set avec 5 classes et un seul exemple par classe, c'est ce qu'on appelle 5-way 1-shot. Ou bien 5 exemples par classe, c'est du 5-way 5-shot. L'astuce est que le modèle apprend à comparer des exemples plutôt qu'à reconnaître des classes spécifiques. Ainsi, quand il voit une nouvelle classe, il peut la comparer aux exemples de support et faire une prédiction.",
    "note": "Le few-shot learning permet de classer de nouvelles classes avec peu d'exemples."
  },
  {
    "titre": "MAML (Model-Agnostic Meta-Learning)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>MAML : Apprentissage par Optimisation</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Qu'est-ce que MAML ?</p>\n    <p>MAML (Model-Agnostic Meta-Learning) est une approche où l'on cherche des <strong>paramètres initiaux</strong> qui permettent une <strong>adaptation rapide</strong> à de nouvelles tâches.</p>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🏛️ Principe</p>\n    <ol style='font-size: 1em; line-height: 1.8;'>\n      <li><strong>Méta-entraînement</strong> : On entraîne le modèle sur plusieurs tâches</li>\n      <li>Pour chaque tâche, on fait quelques <strong>mises à jour</strong> (1-5 steps)</li>\n      <li>On calcule le gradient sur <strong>les paramètres initiaux</strong> pour qu'ils soient optimaux</li>\n      <li><strong>Méta-test</strong> : On adapte le modèle à une nouvelle tâche en quelques étapes</li>\n    </ol>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> MAML apprend des paramètres qui sont <strong>facilement adaptables</strong> à de nouvelles tâches, plutôt que de mémoriser des solutions spécifiques.</p>\n  </div>\n</div>",
    "texteParle": "MAML, ou Model-Agnostic Meta-Learning, est l'une des approches les plus populaires du méta-apprentissage basé sur l'optimisation. L'idée est de trouver des paramètres initiaux qui permettent une adaptation rapide à de nouvelles tâches. Pendant le méta-entraînement, on entraîne le modèle sur plusieurs tâches. Pour chaque tâche, on fait quelques mises à jour, généralement une à cinq étapes. Ensuite, on calcule le gradient sur les paramètres initiaux pour les rendre optimaux. Ainsi, lors du méta-test, le modèle peut s'adapter à une nouvelle tâche en très peu d'étapes. C'est comme si on apprenait à apprendre en trouvant un bon point de départ.",
    "note": "MAML cherche des paramètres initiaux qui s'adaptent rapidement à de nouvelles tâches."
  },
  {
    "titre": "MAML : Formulation Mathématique",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>MAML : La Formule</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>🎯 Objectif</p>\n    <p>Trouver \( \\theta \) tel que pour une nouvelle tâche \( \\mathcal{T}_i \), quelques mises à jour suffisent :</p>\n    <div class='math-block'><div class='math'>$$ \\theta_i' = \\theta - \\alpha \\nabla_\\theta L_{\\mathcal{T}_i}(f_\\theta) $$</div></div>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>📊 Fonction de coût méta</p>\n    <div class='math-block'><div class='math'>$$ \\min_\\theta \\sum_{\\mathcal{T}_i \\sim p(\\mathcal{T})} L_{\\mathcal{T}_i}(f_{\\theta_i'}) = \\sum_{\\mathcal{T}_i \\sim p(\\mathcal{T})} L_{\\mathcal{T}_i}(f_{\\theta - \\alpha \\nabla_\\theta L_{\\mathcal{T}_i}(f_\\theta)}) $$</div></div>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Interprétation :</strong> On minimise la perte après une (ou plusieurs) mises à jour, ce qui rend \( \\theta \) optimal pour l'adaptation rapide.</p>\n  </div>\n</div>",
    "texteParle": "Passons maintenant à la formulation mathématique de MAML. L'objectif est de trouver des paramètres notés thêta tels que pour une nouvelle tâche, quelques mises à jour du gradient suffisent à obtenir de bonnes performances. La mise à jour se fait avec la formule classique du gradient descent, où thêta prime est égal à thêta moins le taux d'apprentissage alpha multiplié par le gradient de la perte. La fonction de coût méta est la somme sur toutes les tâches de la perte après cette mise à jour. On minimise donc la perte après adaptation, ce qui rend les paramètres initiaux optimaux pour l'apprentissage rapide.",
    "note": "MAML optimise la perte après quelques mises à jour, pas seulement la perte initiale."
  },
  {
    "titre": "Prototypical Networks",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Prototypical Networks : Approche par Métriques</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>📌 Principe</p>\n    <p>Au lieu d'apprendre des paramètres pour une tâche spécifique, on apprend un <strong>espace de représentation</strong> où les exemples d'une même classe sont proches.</p>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>🏛️ Architecture</p>\n    <ol style='font-size: 1em; line-height: 1.8;'>\n      <li>On projette les exemples dans un <strong>espace de représentation</strong> via un CNN</li>\n      <li>On calcule le <strong>prototype</strong> de chaque classe : moyenne des représentations du support set</li>\n      <li>Pour un nouvel exemple, on calcule la <strong>distance</strong> (Euclidienne) à chaque prototype</li>\n      <li>On prédit la classe la plus proche</li>\n    </ol>\n  </div>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>🔑 Clé :</strong> Les Prototypical Networks apprennent une <strong>métrique</strong> qui permet de comparer des exemples, plutôt que de classifier directement.</p>\n  </div>\n</div>",
    "texteParle": "Les Prototypical Networks sont une approche basée sur les métriques. Au lieu d'apprendre des paramètres pour classifier directement, on apprend un espace de représentation où les exemples d'une même classe sont proches les uns des autres. Concrètement, on projette les exemples dans cet espace à l'aide d'un CNN. Ensuite, pour chaque classe, on calcule un prototype, qui est simplement la moyenne des représentations des exemples de support de cette classe. Pour un nouvel exemple, on calcule sa distance à chaque prototype, et on prédit la classe du prototype le plus proche. C'est une approche simple et efficace.",
    "note": "Les Prototypical Networks apprennent une métrique pour comparer des exemples."

  {
    "titre": "Prototypical Networks : Formulation",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>Prototypical Networks : La Formule</h3>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold;'>🎯 Objectif</p>\n    <p>Apprendre une fonction d'encodage \( f_\\phi \) qui projette les données dans un espace métrique.</p>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>📊 Prototype d'une classe</p>\n    <div class='math-block'><div class='math'>$$ c_k = \\frac{1}{|S_k|} \\sum_{(x_i, y_i) \\in S_k} f_\\phi(x_i) $$</div></div>\n    <p>où \( S_k \) est le support set de la classe \( k \).</p>\n  </div>\n  <div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px; margin: 10px 0;'>\n    <p style='font-weight: bold; color: #1a5276;'>📊 Classification</p>\n    <div class='math-block'><div class='math'>$$ p(y = k | x) = \\frac{\\exp(-d(f_\\phi(x), c_k))}{\\sum_{j} \\exp(-d(f_\\phi(x), c_j))} $$</div></div>\n    <p>où \( d \) est une fonction de distance (généralement la distance euclidienne).</p>\n  </div>\n</div>",
    "texteParle": "Passons à la formulation mathématique des Prototypical Networks. L'objectif est d'apprendre une fonction d'encodage, notée f phi, qui projette les données dans un espace métrique. Le prototype d'une classe, noté c_k, est simplement la moyenne des représentations de tous les exemples de support de cette classe. Pour classifier un nouvel exemple, on calcule la probabilité qu'il appartienne à chaque classe en utilisant une fonction softmax inversement proportionnelle à la distance entre la représentation de l'exemple et le prototype de la classe. La distance utilisée est généralement la distance euclidienne.",
    "note": "Les prototypes sont les moyennes des représentations des exemples de support."
  },
  {
    "titre": "Comparaison des Approches",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'>\n  <h3 style='color: #2c3e50;'>MAML vs Prototypical Networks</h3>\n  <table border='1' style='border-collapse: collapse; width: 100%; font-size: 0.95em;'>\n    <tr style='background-color: #f2f2f2;'>\n      <th style='padding: 8px;'>Aspect</th>\n      <th style='padding: 8px;'>MAML</th>\n      <th style='padding: 8px;'>Prototypical Networks</th>\n    </tr>\n    <tr>\n      <td style='padding: 8px;'><strong>Approche</strong></td>\n      <td style='padding: 8px;'>Basée sur l'<strong>optimisation</strong></td>\n      <td style='padding: 8px;'>Basée sur les <strong>métriques</strong></td>\n    </tr>\n    <tr>\n      <td style='padding: 8px;'><strong>Adaptation</strong></td>\n      <td style='padding: 8px;'>Mise à jour des paramètres</td>\n      <td style='padding: 8px;'>Calcul de prototypes</td>\n    </tr>\n    <tr>\n      <td style='padding: 8px;'><strong>Paramètres</strong></td>\n      <td style='padding: 8px;'>\( \\theta \) (paramètres du modèle)</td>\n      <td style='padding: 8px;'>\( \\phi \) (paramètres de l'encodeur)</td>\n    </tr>\n    <tr>\n      <td style='padding: 8px;'><strong>Few-shot</strong></td>\n      <td style='padding: 8px;'>✓ (1-5 étapes)</td>\n      <td style='padding: 8px;'>✓ (direct)</td>\n    </tr>\n    <tr>\n      <td style='padding: 8px;'><strong>Complexité</strong></td>\n      <td style='padding: 8px;'>Élevée (calcul du gradient secondaire)</td>\n      <td style='padding: 8px;'>Faible</td>\n    </tr>\n  </table>\n  <div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; margin-top: 10px;'>\n    <p style='margin: 0; color: #7d6608;'><strong>💡 Choisir :</strong> MAML est plus flexible mais plus complexe. Prototypical Networks est plus simple mais moins flexible pour des tâches variées.</p>\n  </div>\n</div>",
    "texteParle": "Comparons maintenant les deux approches. MAML est basé sur l'optimisation : on met à jour les paramètres pour s'adapter à une nouvelle tâche. Prototypical Networks est basé sur les métriques : on calcule des prototypes dans un espace de représentation. MAML est plus flexible car il peut s'adapter à des tâches très variées, mais il est aussi plus complexe car il nécessite de calculer des gradients secondaires. Prototypical Networks est plus simple : il suffit de calculer des moyennes et des distances. En résumé, MAML est plus puissant mais plus difficile à entraîner, tandis que Prototypical Networks est plus simple et efficace pour les tâches de few-shot learning.",

    "texteParle": "Le méta-apprentissage présente de nombreux avantages. Il permet l'apprentissage avec très peu de données, ce qu'on appelle le few-shot learning. L'adaptation est rapide, quelques itérations suffisent. Il permet aussi une bonne généralisation à de nouvelles tâches et une transférabilité des connaissances. Cependant, il a aussi des limites. L'entraînement est plus complexe et difficile à mettre en œuvre. Il nécessite de nombreuses tâches d'entraînement pour être efficace. La généralisation n'est pas toujours parfaite sur des tâches très différentes. Et le coût computationnel est plus élevé. C'est un domaine en pleine expansion avec des applications prometteuses.",

    "texteParle": "Pour résumer cette leçon sur le méta-apprentissage. Nous avons vu que le méta-apprentissage consiste à apprendre à apprendre, pour s'adapter rapidement à de nouvelles tâches. Nous avons découvert deux grandes approches : MAML, qui est basé sur l'optimisation et cherche des paramètres initiaux facilement adaptables, et Prototypical Networks, qui est basé sur les métriques et apprend un espace de représentation. Le few-shot learning, avec des problèmes comme N-way K-shot, est l'application principale. Le méta-apprentissage est un domaine puissant mais complexe, qui offre un compromis intéressant entre flexibilité et performance. Dans la prochaine leçon, nous aborderons les techniques d'interprétabilité.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
