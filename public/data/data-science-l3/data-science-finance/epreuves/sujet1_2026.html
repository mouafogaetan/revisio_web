<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Spécialisation A : Data Science pour la Finance - L3",
    "classe": "Licence 3 Data Science",
    "sequence": "Séquence 1",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Exercice 1 : Marchés Financiers et Produits Dérivés (6 pts)",
            "points": "6 pts",
            "enonce": "<p>Les marchés financiers jouent un rôle central dans l'économie en permettant la rencontre entre offreurs et demandeurs de capitaux. Cet exercice explore les concepts fondamentaux des marchés financiers et des produits dérivés, en les contextualisant dans l'environnement économique du Cameroun.</p><p style='font-size: 0.85rem; color: #555;'><em>Contexte : Le Cameroun est un pays d'Afrique centrale membre de la CEMAC (Communauté Économique et Monétaire de l'Afrique Centrale), dont la monnaie est le franc CFA, arrimé à l'euro (1 EUR = 655,957 FCFA) [citation:2]. Le pays dispose de marchés financiers en développement, comme la Bourse des Valeurs Mobilières de l'Afrique Centrale (BVMAC), basée à Douala, qui permet aux entreprises de se financer et aux investisseurs de placer leurs capitaux.</em></p>",
            "questions": [
                {
                    "question": "<p><strong>1.1 (2 pts)</strong> Définissez un marché financier. Distinguez le marché primaire du marché secondaire et donnez un exemple d'opération pour chacun.</p>",
                    "reponse": "<p>Un marché financier est un lieu (physique ou virtuel) où s'échangent des actifs financiers (actions, obligations, etc.), permettant aux agents à capacité de financement (investisseurs) de placer leurs capitaux et aux agents à besoin de financement (entreprises, États) de se financer.</p><p>Le <strong>marché primaire</strong> est celui de l'émission des titres. L'entreprise émet des actions ou des obligations pour lever des fonds. <em>Exemple : Une entreprise camerounaise introduit une partie de son capital en bourse sur la BVMAC pour financer son expansion.</em></p><p>Le <strong>marché secondaire</strong> est celui où les titres déjà émis sont échangés entre investisseurs. <em>Exemple : Un investisseur revend ses actions de la Société Générale Cameroun à un autre investisseur sur le marché de la BVMAC.</em></p>"
                },
                {
                    "question": "<p><strong>1.2 (2 pts)</strong> Définissez les trois principaux produits dérivés : les options, les futures (contrats à terme) et les swaps. Précisez l'utilité de chacun pour un investisseur.</p>",
                    "reponse": "<p>Un produit dérivé est un contrat financier dont la valeur dépend de l'évolution d'un actif sous-jacent (action, obligation, matière première, taux de change). Les trois principaux sont :</p><ul><li><strong>Options :</strong> Donnent le droit (mais pas l'obligation) d'acheter (call) ou de vendre (put) un actif à un prix fixé jusqu'à une date donnée. Utilité : couverture (hedging) contre une baisse, ou spéculation sur la volatilité.</li><li><strong>Futures (Contrats à terme) :</strong> Obligation d'acheter ou de vendre un actif à une date future à un prix fixé. Utilité : couverture contre les fluctuations de prix (ex : producteur de cacao qui fixe son prix de vente).</li><li><strong>Swaps :</strong> Accord d'échange de flux financiers (ex : taux d'intérêt fixe contre variable). Utilité : gestion du risque de taux ou de change.</li></ul>"
                },
                {
                    "question": "<p><strong>1.3 (2 pts)</strong> D'après la fiche pays du Cameroun, le franc CFA est la monnaie officielle avec une parité fixe de 1 EUR = 655,957 FCFA [citation:2]. Expliquez comment un exportateur camerounais de coton pourrait utiliser un contrat à terme (future) sur le taux de change EUR/FCFA pour se couvrir contre le risque de change.</p>",
                    "reponse": "<p>Un exportateur camerounais vend du coton à un acheteur européen. Il est payé en euros, mais ses coûts (production, salaires) sont en FCFA. Le risque est que l'euro se déprécie par rapport au FCFA avant la réception du paiement.</p><p>Pour se couvrir, il peut vendre à terme des euros contre des FCFA sur le marché des changes (contrat future). Il fixe ainsi le taux de change auquel il échangera ses euros en FCFA à une date future. Même si l'euro baisse, il bénéficie du taux fixé, ce qui sécurise sa marge bénéficiaire. Le contrat future lui permet de transformer un taux de change incertain en un taux certain.</p>"
                }
            ]
        },
        {
            "titre": "Exercice 2 : Pricing des Options avec l'Arbre Binomial (4 pts)",
            "points": "4 pts",
            "enonce": "<p>Le modèle binomial est une méthode intuitive pour valoriser les options. Il repose sur l'idée que le prix de l'actif sous-jacent ne peut prendre que deux valeurs à chaque période (hausse ou baisse), ce qui permet de construire un arbre des prix et de calculer la valeur de l'option par actualisation.</p>",
            "questions": [
                {
                    "question": "<p><strong>2.1 (2 pts)</strong> Le prix d'une action est aujourd'hui de 100 FCFA. Dans un an, selon le modèle binomial, il pourra être soit de 120 FCFA (hausse de 20%), soit de 90 FCFA (baisse de 10%). Le taux sans risque est de 5% par an. Construisez l'arbre binomial du prix de l'action et calculez la probabilité risque-neutre (p) de hausse.</p>",
                    "reponse": "<p>Arbre binomial :</p><ul><li>Nœud initial : S0 = 100</li><li>Nœud haut : S<sub>u</sub> = 100 × 1,20 = 120</li><li>Nœud bas : S<sub>d</sub> = 100 × 0,90 = 90</li></ul><p>La probabilité risque-neutre de hausse se calcule par :</p><div class='math-block'><div class='math'>$$ p = \\frac{e^{rT} - d}{u - d} $$</div></div><p>Avec u = 1,20, d = 0,90, r = 5% = 0,05, T = 1 an :</p><div class='math-block'><div class='math'>$$ p = \\frac{e^{0,05} - 0,90}{1,20 - 0,90} = \\frac{1,0513 - 0,90}{0,30} = \\frac{0,1513}{0,30} = 0,5043 $$</div></div><p>La probabilité risque-neutre de hausse est d'environ <strong>50,43%</strong>.</p>"
                },
                {
                    "question": "<p><strong>2.2 (2 pts)</strong> En utilisant l'arbre binomial précédent, calculez le prix d'une option d'achat (call) européenne de prix d'exercice K = 105 FCFA, échéance dans un an.</p>",
                    "reponse": "<p>1) Payoffs à l'échéance :</p><ul><li>Si hausse (S<sub>u</sub> = 120) : payoff = max(120 - 105, 0) = 15</li><li>Si baisse (S<sub>d</sub> = 90) : payoff = max(90 - 105, 0) = 0</li></ul><p>2) Valorisation par actualisation :</p><div class='math-block'><div class='math'>$$ C = e^{-rT} \\times [p \\times C_u + (1-p) \\times C_d] $$</div></div><div class='math-block'><div class='math'>$$ C = e^{-0,05} \\times [0,5043 \\times 15 + (1 - 0,5043) \\times 0] $$</div></div><div class='math-block'><div class='math'>$$ C = 0,9512 \\times (7,5645) \\approx 7,19 $$</div></div><p>Le prix de l'option d'achat est d'environ <strong>7,19 FCFA</strong>.</p>"
                }
            ]
        },
        {
            "titre": "Exercice 3 : Modèle de Black-Scholes (5 pts)",
            "points": "5 pts",
            "enonce": "<p>Le modèle de Black-Scholes est la référence pour la valorisation des options européennes. Cet exercice vise à vérifier votre compréhension de la formule et de ses hypothèses.</p>",
            "questions": [
                {
                    "question": "<p><strong>3.1 (1 pt)</strong> Énoncez les cinq hypothèses principales du modèle de Black-Scholes.</p>",
                    "reponse": "<p>Les hypothèses principales sont :</p><ol><li>Le marché est parfait (pas de coûts de transaction, pas de taxes, possibilité de vente à découvert).</li><li>Le sous-jacent suit un mouvement brownien géométrique (rendements log-normaux).</li><li>La volatilité σ est constante.</li><li>Le taux sans risque r est constant.</li><li>L'option est européenne (exercice uniquement à l'échéance).</li></ol>"
                },
                {
                    "question": "<p><strong>3.2 (2 pts)</strong> Expliquez la signification de d₁ et d₂ dans la formule de Black-Scholes pour un call : <br>C = S₀·N(d₁) − K·e⁻ʳᵀ·N(d₂)</p>",
                    "reponse": "<p>d₁ et d₂ sont des intermédiaires de calcul qui mesurent le 'degré de monnaie' de l'option.</p><ul><li><strong>d₁</strong> : Il est lié à la probabilité risque-neutre que l'option soit exercée. Plus d₁ est élevé, plus le prix du sous-jacent a de chances de dépasser le prix d'exercice.</li><li><strong>d₂</strong> : Il est égal à d₁ − σ√T. C'est la distance entre le prix du sous-jacent et le prix d'exercice, ajustée de la volatilité.</li></ul><p>N(d₁) est la probabilité risque-neutre que l'option soit exercée, tandis que N(d₂) est la probabilité (sous la mesure risque-neutre) que le sous-jacent dépasse le prix d'exercice.</p>"
                },
                {
                    "question": "<p><strong>3.3 (2 pts)</strong> Une option call a un prix de 8 FCFA, un delta de 0,6, un gamma de 0,05. Si le prix du sous-jacent augmente de 1 FCFA, quelle sera la variation estimée du prix de l'option ?</p>",
                    "reponse": "<p>La variation du prix de l'option s'approche par le delta pour une petite variation :</p><div class='math-block'><div class='math'>$$ \\Delta C \\approx \\Delta \\times \\Delta S = 0,6 \\times 1 = 0,6 $$</div></div><p>Le prix de l'option augmenterait d'environ <strong>0,60 FCFA</strong>.</p><p>Pour une estimation plus précise, on peut inclure le gamma (variation du delta) :</p><div class='math-block'><div class='math'>$$ \\Delta C \\approx \\Delta \\times \\Delta S + \\frac{1}{2} \\Gamma \\times (\\Delta S)^2 = 0,6 \\times 1 + 0,5 \\times 0,05 \\times 1 = 0,625 $$</div></div><p>La variation serait donc d'environ <strong>0,625 FCFA</strong>.</p>"
                }
            ]
        },
        {
            "titre": "Exercice 4 : Les Grecques et Gestion des Risques (5 pts)",
            "points": "5 pts",
            "enonce": "<p>Les 'Grecques' mesurent la sensibilité du prix d'une option aux différents paramètres de marché. Elles sont essentielles pour la couverture (hedging) et la gestion des risques.</p>",
            "questions": [
                {
                    "question": "<p><strong>4.1 (2 pts)</strong> Définissez les cinq Grecques principales : Delta, Gamma, Vega, Theta, Rho.</p>",
                    "reponse": "<p><strong>Delta (Δ) :</strong> Sensibilité du prix de l'option à une variation du prix du sous-jacent. Δ = ∂C/∂S. Il varie entre 0 et 1 pour un call, et -1 et 0 pour un put.</p><p><strong>Gamma (Γ) :</strong> Sensibilité du delta à une variation du prix du sous-jacent. Γ = ∂²C/∂S². Il mesure la convexité.</p><p><strong>Vega (ν) :</strong> Sensibilité du prix de l'option à une variation de la volatilité. ν = ∂C/∂σ.</p><p><strong>Theta (Θ) :</strong> Sensibilité du prix de l'option à l'écoulement du temps. Θ = ∂C/∂t. Souvent négatif pour les options (perte de valeur temporelle).</p><p><strong>Rho (ρ) :</strong> Sensibilité du prix de l'option à une variation du taux sans risque. ρ = ∂C/∂r.</p>"
                },
                {
                    "question": "<p><strong>4.2 (1,5 pts)</strong> Un gestionnaire de portefeuille détient un portefeuille d'options dont le delta est de +500. Il souhaite se couvrir (delta-neutral) en utilisant l'actif sous-jacent. Quelle position doit-il prendre sur le sous-jacent ?</p>",
                    "reponse": "<p>Le delta du portefeuille est de +500. Pour atteindre un delta neutre, il faut vendre l'équivalent de 500 unités de l'actif sous-jacent. En effet, la position de couverture a un delta de -500, annulant le delta du portefeuille.</p><p>La vente de 500 actions (ou contrats) permet d'atteindre la neutralité delta.</p>"
                },
                {
                    "question": "<p><strong>4.3 (1,5 pts)</strong> Expliquez pourquoi un portefeuille gamma-négatif est risqué. Comment un trader peut-il gérer ce risque ?</p>",
                    "reponse": "<p>Un portefeuille avec un gamma négatif signifie que le delta diminue lorsque le prix du sous-jacent augmente (et augmente lorsque le prix baisse). Cela expose le portefeuille à un risque de sensibilité directionnelle : en cas de grand mouvement du sous-jacent, la couverture delta doit être réajustée fréquemment (coûts de transaction) et le portefeuille subit des pertes de convexité.</p><p>Pour gérer ce risque, un trader peut acheter des options (qui ont un gamma positif) pour augmenter le gamma du portefeuille, ou procéder à un <strong>re-balancing</strong> dynamique de la couverture delta.</p>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
