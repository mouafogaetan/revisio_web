<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation A : Data Science pour la Finance - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modélisation de la Volatilité - Modèles GARCH",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>On considère une série de rendements financiers \\( R_t \\) pour laquelle on souhaite modéliser la volatilité conditionnelle à l'aide d'un modèle GARCH(1,1).</p> <div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 10px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\sigma_t^2 = \\omega + \\alpha \\epsilon_{t-1}^2 + \\beta \\sigma_{t-1}^2 $$ </div> </div> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Avec \\( \\epsilon_t = \\sigma_t z_t \\) et \\( z_t \\sim \\mathcal{N}(0,1) \\).</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Expliquer le rôle de chacun des paramètres \\( \\omega \\), \\( \\alpha \\) et \\( \\beta \\) dans le modèle GARCH(1,1). Quelles sont les conditions nécessaires pour que la variance conditionnelle soit positive et stationnaire ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Rôle des paramètres :</strong></p> <ul> <li><strong>\\( \\omega \\)</strong> : constante positive qui représente la variance de long terme du processus.</li> <li><strong>\\( \\alpha \\)</strong> : coefficient de l'effet ARCH qui mesure l'impact du choc passé (carré du résidu) sur la volatilité actuelle.</li> <li><strong>\\( \\beta \\)</strong> : coefficient GARCH qui mesure la persistance de la volatilité passée.</li> </ul> <p><strong>Conditions :</strong></p> <ul> <li>Pour la positivité : \\( \\omega > 0 \\), \\( \\alpha \\geq 0 \\), \\( \\beta \\geq 0 \\).</li> <li>Pour la stationnarité : \\( \\alpha + \\beta < 1 \\).</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) On estime le modèle GARCH(1,1) et on obtient les paramètres suivants : \\( \\omega = 0.0001 \\), \\( \\alpha = 0.08 \\), \\( \\beta = 0.88 \\). La volatilité conditionnelle à la date \\( t-1 \\) est \\( \\sigma_{t-1}^2 = 0.0004 \\) et le choc \\( \\epsilon_{t-1} = -0.02 \\). Calculer la volatilité conditionnelle \\( \\sigma_t^2 \\) à la date \\( t \\).</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Calcul :</strong></p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\sigma_t^2 = 0.0001 + 0.08 \\times (-0.02)^2 + 0.88 \\times 0.0004 = 0.0001 + 0.000032 + 0.000352 = 0.000484 $$ </div> </div> <p>La volatilité conditionnelle à la date \\( t \\) est donc \\( \\sigma_t^2 = 0.000484 \\).</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Interpréter le résultat obtenu. Que signifie la valeur de \\( \\alpha + \\beta = 0.96 \\) sur la persistance de la volatilité ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>La somme \\( \\alpha + \\beta = 0.96 \\) est proche de 1, ce qui indique une forte persistance de la volatilité. Autrement dit, un choc sur la volatilité mettra beaucoup de temps à s'amortir. La volatilité actuelle est influencée à la fois par le choc récent et par la volatilité passée.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Gestion des Risques - VaR et Expected Shortfall",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un gestionnaire de portefeuille souhaite évaluer le risque de son portefeuille composé d'actions. Il dispose des rendements quotidiens des 500 derniers jours. On suppose que les rendements suivent une loi normale avec une moyenne de 0,01 % et un écart-type de 1,2 %.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Définir la Value at Risk (VaR) au seuil de 95 % pour un portefeuille de 10 millions d'euros.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Définition :</strong> La Value at Risk (VaR) est la perte maximale attendue sur un horizon donné avec un niveau de confiance donné. Pour un seuil de 95 %, la VaR est le 5<sup>ème</sup> percentile de la distribution des pertes.</p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\text{VaR}_{95\\%} = -\\left(\\mu - 1.645 \\times \\sigma\\right) \\times V = -(0.0001 - 1.645 \\times 0.012) \\times 10\\,000\\,000 = 196\\,680 \\, \\text{\\euros} $$ </div> </div> <p>La VaR à 95 % est d'environ 196 680 euros.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Calculer l'Expected Shortfall (ES) au seuil de 95 %. Quelle est la différence fondamentale entre la VaR et l'ES ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Calcul de l'ES :</strong></p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\text{ES}_{95\\%} = -\\left(\\mu - \\frac{\\phi(1.645)}{0.05} \\times \\sigma\\right) \\times V $$ </div> </div> <p>Avec \\( \\phi(1.645) \\approx 0.103 \\), on obtient ES ≈ 226 000 euros.</p> <p><strong>Différence :</strong> La VaR indique la perte maximale avec un niveau de confiance donné, mais elle ne dit rien sur l'ampleur des pertes au-delà de ce seuil. L'ES, en revanche, est la perte moyenne en cas de dépassement du seuil de VaR. Elle est donc plus complète pour l'évaluation du risque de queue.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Détection de Fraude - Approches par Deep Learning",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un système de détection de fraude utilise un autoencodeur pour identifier les transactions anormales. L'autoencodeur est entraîné uniquement sur des transactions normales.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Expliquer le principe de l'autoencodeur pour la détection d'anomalies. Comment décide-t-on qu'une transaction est frauduleuse ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Principe de l'autoencodeur :</strong> L'autoencodeur est un réseau de neurones qui apprend à reconstruire ses entrées. Il est entraîné uniquement sur les transactions normales. Il apprend donc à compresser puis décompresser les données normales avec une erreur de reconstruction minimale.</p> <p><strong>Décision de fraude :</strong> Une transaction frauduleuse, qui diffère des normales, sera mal reconstruite. L'erreur de reconstruction (souvent l'erreur quadratique moyenne) est utilisée comme score d'anomalie. Si ce score dépasse un seuil fixé, la transaction est considérée comme frauduleuse.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Pourquoi le déséquilibre des classes pose-t-il un problème en détection de fraude et comment les autoencodeurs peuvent-ils y faire face ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Problème du déséquilibre :</strong> Dans un jeu de données financières, les transactions frauduleuses sont extrêmement rares par rapport aux transactions normales. Un classifieur supervisé classique aurait tendance à prédire la classe majoritaire et à ignorer les fraudes.</p> <p><strong>Solution avec les autoencodeurs :</strong> Les autoencodeurs contournent ce problème en apprenant uniquement sur les données normales. Ils ne nécessitent pas d'exemples de fraudes pour l'entraînement, ce qui les rend très adaptés à ce contexte. La détection se fait par la reconstruction, ce qui permet de gérer efficacement le déséquilibre.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Optimisation de Portefeuille - Black-Litterman",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Le modèle de Black-Litterman permet d'intégrer des opinions d'experts dans l'optimisation de portefeuille. Considérons un marché avec trois actifs A, B et C.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Expliquer les deux sources d'information utilisées par le modèle de Black-Litterman.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Sources d'information :</strong></p> <ul> <li><strong>L'équilibre du marché :</strong> Les rendements implicites déduits des pondérations du marché (ex: un indice boursier). Cette information est stable et bien diversifiée.</li> <li><strong>Les opinions des experts :</strong> Des vues subjectives sur les actifs (ex: \"l'actif A surperformera l'actif B\"). Ces opinions sont pondérées par un niveau de confiance.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Un expert estime que l'actif A surperformera l'actif B de 2 % avec un niveau de confiance élevé. Décrire comment cette opinion sera intégrée dans le modèle de Black-Litterman.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Intégration de l'opinion :</strong></p> <ul> <li>Cette opinion est une <strong>vue relative</strong> : \\( \\mu_A - \\mu_B = 0.02 \\).</li> <li>Elle est représentée dans la matrice \\( P \\) des vues et le vecteur \\( Q \\) des rendements des vues.</li> <li>Le niveau de confiance élevé est traduit par une faible variance dans la matrice \\( \\Omega \\) des erreurs des vues.</li> <li>Plus le niveau de confiance est élevé, plus l'opinion influencera les rendements espérés ajustés et donc le portefeuille final.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Quels sont les avantages du modèle de Black-Litterman par rapport à l'optimisation de Markowitz traditionnelle ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Avantages :</strong></p> <ul> <li><strong>Stabilité :</strong> Les rendements espérés sont moins sensibles aux données historiques.</li> <li><strong>Diversification :</strong> Le portefeuille reste bien diversifié grâce à l'équilibre du marché comme point de départ.</li> <li><strong>Intégration des vues :</strong> Permet d'incorporer des opinions qualitatives d'experts.</li> <li><strong>Contrôle du risque :</strong> Les niveaux de confiance permettent de gérer l'impact des opinions.</li> </ul> </div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
