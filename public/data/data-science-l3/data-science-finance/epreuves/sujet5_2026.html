<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation A : Data Science pour la Finance - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Théorie Moderne du Portefeuille de Markowitz",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice teste votre compréhension des concepts fondamentaux de la théorie de Markowitz, de la construction de la frontière efficiente et de l'optimisation du ratio de Sharpe.</p></div><p>Répondez aux questions suivantes en vous appuyant sur vos connaissances du cours.</p>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Expliquez en quelques lignes le concept de <span style='font-weight: bold;'>frontière efficiente</span> selon Markowitz. Quel est son utilité dans la gestion de portefeuille ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>La frontière efficiente est l'ensemble des portefeuilles qui offrent le rendement attendu le plus élevé pour un niveau de risque (volatilité) donné. Elle est représentée graphiquement par une courbe convexe dans le plan (Risque, Rendement). Son utilité est de permettre à l'investisseur de visualiser le compromis risque-rendement et de sélectionner le portefeuille optimal en fonction de son aversion au risque. Tout portefeuille situé en dessous de cette frontière est considéré comme sous-optimal car il offre un rendement inférieur pour le même risque.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> Qu'est-ce que le <span style='font-weight: bold;'>ratio de Sharpe</span> et comment est-il utilisé dans le cadre de l'optimisation de portefeuille ? Écrivez sa formule.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le ratio de Sharpe mesure la performance d'un investissement ajustée au risque. Il indique le rendement excédentaire (par rapport au taux sans risque) obtenu par unité de risque prise. Sa formule est :</p><div class='math-block'><div class='math'>$$\\text{Ratio de Sharpe} = \\frac{\\mathbb{E}(R_p) - R_f}{\\sigma_p}$$</div></div><p>où \\(\\mathbb{E}(R_p)\\) est le rendement attendu du portefeuille, \\(R_f\\) le taux sans risque et \\(\\sigma_p\\) l'écart-type des rendements du portefeuille. Dans l'optimisation, on cherche le portefeuille qui maximise ce ratio, c'est-à-dire le portefeuille tangent à la frontière efficiente partant du taux sans risque.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Un portefeuille est composé de deux actifs A et B avec les caractéristiques suivantes :<br>- Actif A : rendement attendu \\( \\mathbb{E}(R_A) = 12\\% \\), volatilité \\( \\sigma_A = 20\\% \\)<br>- Actif B : rendement attendu \\( \\mathbb{E}(R_B) = 18\\% \\), volatilité \\( \\sigma_B = 30\\% \\)<br>- Coefficient de corrélation : \\( \\rho_{A,B} = 0.3 \\)<br><br>Calculez l'écart-type d'un portefeuille équipondéré (poids de 50% chacun).</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>L'écart-type du portefeuille se calcule avec la formule :</p><div class='math-block'><div class='math'>$$\\sigma_p = \\sqrt{w_A^2\\sigma_A^2 + w_B^2\\sigma_B^2 + 2w_Aw_B\\rho_{A,B}\\sigma_A\\sigma_B}$$</div></div><p>En remplaçant par les valeurs :</p><div class='math-block'><div class='math'>$$\\sigma_p = \\sqrt{0.5^2 \\times 0.20^2 + 0.5^2 \\times 0.30^2 + 2 \\times 0.5 \\times 0.5 \\times 0.3 \\times 0.20 \\times 0.30}$$</div></div><div class='math-block'><div class='math'>$$\\sigma_p = \\sqrt{0.01 + 0.0225 + 0.009} = \\sqrt{0.0415} \\approx 0.2037$$</div></div><p>Soit un écart-type d'environ <strong>20.37%</strong>.</p></div>"
        }
      ]
    },
    {
      "titre": "Optimisation sous Contraintes et Méthodes Avancées",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice aborde les contraintes pratiques en optimisation de portefeuille, ainsi que les modèles Black-Litterman, Fama-French et Risk Parity.</p></div><p>Répondez aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Dans un problème d'optimisation de portefeuille, on souhaite ajouter une contrainte interdisant la vente à découvert. À quelle contrainte mathématique cela correspond-il ? Expliquez brièvement l'impact de cette contrainte sur le portefeuille optimal.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>L'interdiction de la vente à découvert correspond à la contrainte de positivité des poids :</p><div class='math-block'><div class='math'>$$w_i \\geq 0 \\quad \\forall i \\in \\{1, \\dots, n\\}$$</div></div><p>Cette contrainte, dite <span style='font-weight: bold;'>'long only'</span>, a pour impact de limiter la diversification du portefeuille et peut conduire à des solutions moins efficaces sur le plan théorique, car elle empêche de tirer parti d'actifs surévalués (en les vendant à découvert). En pratique, elle rend cependant le portefeuille plus simple à gérer et plus conforme aux mandats de gestion traditionnels.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> Décrivez le principe du <span style='font-weight: bold;'>modèle de Black-Litterman</span>. En quoi se distingue-t-il de l'approche de Markowitz standard et quel est son principal avantage ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le modèle de Black-Litterman est une approche d'optimisation de portefeuille qui combine les rendements d'équilibre du marché (déduits de la théorie du CAPM) avec les <span style='font-weight: bold;'>opinions</span> d'un investisseur sur certains actifs. Il utilise le théorème de Bayes pour ajuster les rendements attendus en fonction de ces opinions et de leur niveau de confiance.</p><p>Il se distingue de l'approche de Markowitz standard qui utilise directement des estimations historiques des rendements, souvent bruitées et instables. Son principal avantage est de produire des portefeuilles plus stables et plus diversifiés, tout en permettant d'intégrer des vues qualitatives (opinions d'experts) de manière cohérente.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Expliquez le concept de <span style='font-weight: bold;'>Risk Parity</span> (parité des risques). En quoi cette stratégie diffère-t-elle d'une stratégie d'optimisation moyenne-variance classique ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>La stratégie <span style='font-weight: bold;'>Risk Parity</span> consiste à allouer les poids du portefeuille de manière à ce que chaque actif contribue de manière égale au risque total du portefeuille. L'objectif n'est plus de maximiser le rendement pour un risque donné (comme en moyenne-variance), mais d'équilibrer les sources de risque.</p><p>Contrairement à l'optimisation moyenne-variance classique qui se concentre sur le couple rendement-risque (et peut conduire à une forte concentration dans certaines classes d'actifs à haut rendement), le Risk Parity se focalise uniquement sur la répartition du risque, ce qui conduit généralement à des portefeuilles plus diversifiés et plus résilients, souvent avec un biais vers les actifs moins volatils comme les obligations.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>4.</span> Citez les trois facteurs principaux du modèle de <span style='font-weight: bold;'>Fama-French à 3 facteurs</span>. Que mesurent-ils ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le modèle de Fama-French à 3 facteurs étend le CAPM en ajoutant deux facteurs supplémentaires. Les trois facteurs sont :</p><ul><li><span style='font-weight: bold;'>Le facteur de marché (MKT)</span> : le rendement excédentaire du marché, identique au CAPM.</li><li><span style='font-weight: bold;'>Le facteur taille (SMB - Small Minus Big)</span> : le rendement excédentaire des actions de petite capitalisation par rapport aux actions de grande capitalisation.</li><li><span style='font-weight: bold;'>Le facteur valeur (HML - High Minus Low)</span> : le rendement excédentaire des actions à forte valeur comptable/marché (value stocks) par rapport aux actions à faible valeur comptable/marché (growth stocks).</li></ul><p>Ces facteurs mesurent respectivement le risque de marché, le risque lié à la taille de l'entreprise et le risque lié au style de valorisation.</p></div>"
        }
      ]
    },
    {
      "titre": "Mise en Situation : Projet d'Optimisation de Portefeuille",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice pratique vous met en situation de Data Scientist. Vous devez mener un projet d'optimisation de portefeuille pour un client.</p></div><div style='background-color: #fff3cd; padding: 12px; border-radius: 6px; border-left: 4px solid #ffc107; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Contexte :</p><p>Votre client, un fonds d'investissement, souhaite optimiser son portefeuille composé de 5 actions. Il vous fournit les données historiques de prix. Vous devez mettre en place un pipeline complet d'optimisation.</p></div><p>Répondez aux questions détaillées ci-dessous.</p>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Quelle est la première étape de votre projet après avoir reçu les données de prix ? Décrivez brièvement les traitements que vous effectueriez.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>La première étape est le <span style='font-weight: bold;'>chargement et le prétraitement des données</span>. Je procéderais comme suit :</p><ul><li>Chargement des données avec une librairie comme <code>pandas</code> en Python.</li><li>Nettoyage des données : gestion des valeurs manquantes (par exemple, par 'forward fill'), vérification des doublons et des incohérences.</li><li>Calcul des rendements : <span style='font-weight: bold;'>rendements journaliers</span> puis <span style='font-weight: bold;'>annualisation</span> (rendement et volatilité).</li><li>Analyse exploratoire : statistiques descriptives, visualisation des séries, calcul de la matrice de corrélation.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> Vous décidez de construire la frontière efficiente. Quels sont les deux paramètres clés que vous devez estimer à partir des données et comment les estimez-vous ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Les deux paramètres clés à estimer sont :</p><ul><li><span style='font-weight: bold;'>Le vecteur des rendements attendus</span> : généralement estimé par la moyenne historique des rendements annualisée.</li><li><span style='font-weight: bold;'>La matrice de covariance des rendements</span> : estimée à partir des données historiques, souvent annualisée. Des méthodes alternatives comme le <span style='font-weight: bold;'>lissage exponentiel</span> (EWMA) peuvent être utilisées pour donner plus de poids aux observations récentes.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Après avoir construit la frontière efficiente, votre client vous demande un portefeuille qui minimise le risque. Quelle est la formulation mathématique de ce problème ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le problème de minimisation du risque (portefeuille de variance minimale) s'écrit :</p><div class='math-block'><div class='math'>$$\\min_{\\mathbf{w}} \\quad \\frac{1}{2} \\mathbf{w}^T \\Sigma \\mathbf{w}$$</div></div><p>sous les contraintes :</p><div class='math-block'><div class='math'>$$\\sum_{i=1}^n w_i = 1$$</div></div><div class='math-block'><div class='math'>$$w_i \\geq 0 \\quad \\text{(si on interdit la vente à découvert)}$$</div></div><p>où \\(\\mathbf{w}\\) est le vecteur des poids et \\(\\Sigma\\) la matrice de covariance. C'est un problème d'optimisation quadratique.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>4.</span> Pour évaluer la robustesse de votre optimisation, vous souhaitez effectuer un <span style='font-weight: bold;'>backtest</span>. Décrivez brièvement la méthodologie et les métriques que vous utiliseriez pour évaluer la performance.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le backtest consiste à simuler l'application de votre stratégie d'optimisation sur des données historiques. La méthodologie est la suivante :</p><ul><li>Définir une <span style='font-weight: bold;'>fenêtre de ré-estimation</span> glissante (ex: 3 ans) pour recalculer les paramètres (rendements et covariance) à chaque rééquilibrage.</li><li>Appliquer la stratégie d'optimisation sur la fenêtre de données passées pour obtenir les poids pour la période suivante.</li><li>Calculer la performance du portefeuille sur la période de test (ex: le mois suivant).</li><li>Répéter l'opération sur toute la période historique.</li></ul><p>Les métriques à utiliser sont : le <span style='font-weight: bold;'>rendement annualisé</span>, la <span style='font-weight: bold;'>volatilité</span>, le <span style='font-weight: bold;'>ratio de Sharpe</span>, le <span style='font-weight: bold;'>drawdown maximum</span> et le <span style='font-weight: bold;'>taux de turnover</span> (pour mesurer les coûts de rééquilibrage).</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
