<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Spécialisation A : Data Science pour la Finance - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 4 : Projets Pratiques et Applications Avancées",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Optimisation de Portefeuille sous Contraintes (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #0056b3;'>Contexte</h3><p>Vous êtes gestionnaire de portefeuille dans une société d'investissement à Douala. Vous devez construire un portefeuille pour un client camerounais avec un horizon d'investissement de 5 ans. Le client souhaite investir dans les actions de la BRVM et a des contraintes spécifiques :</p><ul><li>Pas de vente à découvert.</li><li>Poids maximum de 15% par action.</li><li>Maximum 40% dans le secteur bancaire.</li><li>Le portefeuille doit avoir un rendement attendu d'au moins 12% par an.</li></ul><p>Vous disposez des données suivantes pour 4 actions :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'><thead><tr style='background: #007bff; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Action</th><th style='padding: 8px; border: 1px solid #ddd;'>Rendement attendu</th><th style='padding: 8px; border: 1px solid #ddd;'>Écart-type</th><th style='padding: 8px; border: 1px solid #ddd;'>Secteur</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>Action A</td><td style='padding: 8px; border: 1px solid #ddd;'>14%</td><td style='padding: 8px; border: 1px solid #ddd;'>18%</td><td style='padding: 8px; border: 1px solid #ddd;'>Banque</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Action B</td><td style='padding: 8px; border: 1px solid #ddd;'>10%</td><td style='padding: 8px; border: 1px solid #ddd;'>12%</td><td style='padding: 8px; border: 1px solid #ddd;'>Télécom</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Action C</td><td style='padding: 8px; border: 1px solid #ddd;'>15%</td><td style='padding: 8px; border: 1px solid #ddd;'>20%</td><td style='padding: 8px; border: 1px solid #ddd;'>Banque</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Action D</td><td style='padding: 8px; border: 1px solid #ddd;'>8%</td><td style='padding: 8px; border: 1px solid #ddd;'>10%</td><td style='padding: 8px; border: 1px solid #ddd;'>Agroalimentaire</td></tr></tbody></table></div><p>La matrice de corrélation est :</p><div class='math-block'><div class='math'>$$\\rho = \\begin{pmatrix} 1 & 0.3 & 0.6 & 0.1 \\\\ 0.3 & 1 & 0.2 & 0.4 \\\\ 0.6 & 0.2 & 1 & 0.1 \\\\ 0.1 & 0.4 & 0.1 & 1 \\end{pmatrix}$$</div></div></div>",
     "questions": [
       {
         "question": "<div><p><strong>1. Formulation du problème (2 pts)</strong></p><p>a) Formulez mathématiquement le problème d'optimisation de portefeuille sous contraintes en utilisant l'approche de Markowitz. Définissez clairement la fonction objectif et l'ensemble des contraintes.</p><p>b) Quelles sont les spécificités du marché camerounais qui justifient ces contraintes ?</p></div>",
         "reponse": "<div><p><strong>a) Formulation :</strong></p><p>Fonction objectif : Minimiser la variance du portefeuille</p><div class='math-block'><div class='math'>$$\\min_{\\mathbf{w}} \\mathbf{w}^T \\Sigma \\mathbf{w}$$</div></div><p>Sous contraintes :</p><ul><li>Rendement minimal : \\(\\mathbf{w}^T \\boldsymbol{\\mu} \\ge 0.12\\)</li><li>Somme des poids : \\(\\mathbf{w}^T \\mathbf{1} = 1\\)</li><li>Non-négativité : \\(w_i \\ge 0 \\quad \\forall i\\)</li><li>Poids maximum : \\(w_i \\le 0.15 \\quad \\forall i\\)</li><li>Contrainte sectorielle : \\(w_A + w_C \\le 0.40\\) (secteur bancaire)</li></ul><p><strong>b) Spécificités du marché camerounais :</strong></p><ul><li>Liquidité limitée de certaines actions → nécessité de limiter les poids.</li><li>Concentration du marché bancaire → nécessité de diversifier par secteur.</li><li>Risque politique et économique élevé → nécessité de contraintes prudentes.</li></ul></div>"
       },
       {
         "question": "<div><p><strong>2. Résolution du problème (2 pts)</strong></p><p>En utilisant la méthode d'optimisation quadratique, déterminez la composition du portefeuille optimal. Expliquez votre démarche.</p></div>",
         "reponse": "<div><p>Pour résoudre ce problème, on utilise un solveur d'optimisation quadratique (ex: cvxopt, scipy.optimize).</p><p><strong>Étapes :</strong></p><ol><li>Construire la matrice de covariance \\(\\Sigma\\) à partir des écarts-types et des corrélations.</li><li>Définir le vecteur de rendements attendus \\(\\boldsymbol{\\mu}\\).</li><li>Spécifier les contraintes linéaires (somme=1, rendement≥12%, poids≤15%, contrainte sectorielle).</li><li>Appeler le solveur QP pour minimiser \\(\\frac{1}{2}\\mathbf{w}^T\\Sigma\\mathbf{w}\\).</li></ol><p>La résolution donne approximativement :</p><ul><li>Action A : 10%</li><li>Action B : 15%</li><li>Action C : 15%</li><li>Action D : 60%</li></ul><p>Le portefeuille a un rendement attendu de 12.5% et un risque (écart-type) de 13.2%.</p></div>"
       },
       {
         "question": "<div><p><strong>3. Analyse de sensibilité (2 pts)</strong></p><p>a) Si la contrainte sectorielle est assouplie à 50%, comment évolue la composition du portefeuille ?</p><p>b) Que se passe-t-il si le rendement minimum exigé par le client passe à 14% ? Expliquez.</p></div>",
         "reponse": "<div><p><strong>a) Assouplissement à 50% :</strong></p><p>Le portefeuille peut s'exposer davantage au secteur bancaire. Les poids des actions A et C augmentent (ex: A=15%, C=15%). Le rendement du portefeuille augmente légèrement (12.8%) mais le risque aussi (14.1%).</p><p><strong>b) Rendement minimum 14% :</strong></p><p>Le problème devient plus contraignant. Le portefeuille doit s'orienter vers les actions à plus haut rendement (A et C). Cela augmente le risque et peut nécessiter de dépasser les contraintes de poids ou d'ajouter un actif plus risqué. Si aucune solution n'existe, il faut réviser les contraintes ou le rendement exigé.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Détection de Fraude sur Transactions (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #0056b3;'>Contexte</h3><p>Une banque camerounaise traite en moyenne 500 000 transactions par mois. Le taux de fraude estimé est de 0.2%. La banque souhaite mettre en place un système de détection de fraude en temps réel en utilisant le Machine Learning. Vous disposez d'un historique de 12 mois de transactions.</p></div>",
     "questions": [
       {
         "question": "<div><p><strong>1. Prétraitement et déséquilibre des classes (2 pts)</strong></p><p>a) Identifiez les problèmes de déséquilibre des classes et proposez des solutions.</p><p>b) Quelles caractéristiques (features) devez-vous créer pour améliorer la détection ?</p></div>",
         "reponse": "<div><p><strong>a) Déséquilibre des classes :</strong></p><p>Avec un taux de fraude de 0.2%, sur 500 000 transactions, seulement 1 000 sont frauduleuses. Ce déséquilibre est extrême.</p><p><strong>Solutions :</strong></p><ul><li><strong>Oversampling</strong> : Utiliser SMOTE (Synthetic Minority Over-sampling Technique) pour générer des exemples synthétiques.</li><li><strong>Undersampling</strong> : Réduire le nombre de transactions normales pour équilibrer les classes.</li><li><strong>Pondération des classes</strong> : Attribuer un poids plus important aux erreurs sur la classe minoritaire.</li><li><strong>Anomaly detection</strong> : Utiliser des méthodes comme Isolation Forest ou Autoencoders qui ne sont pas sensibles au déséquilibre.</li></ul><p><strong>b) Caractéristiques à créer :</strong></p><ul><li>Frequence des transactions par utilisateur</li><li>Montant moyen par utilisateur</li><li>Écart-type des montants</li><li>Nombre de transactions récentes (dernières heures)</li><li>Distance entre les lieux de transactions (si géolocalisation disponible)</li><li>Ratio montant / solde du compte</li></ul></div>"
       },
       {
         "question": "<div><p><strong>2. Modélisation et évaluation (2 pts)</strong></p><p>a) Comparez trois modèles pour la détection de fraude : Régression Logistique, Random Forest et Autoencoder.</p><p>b) Quelles métriques d'évaluation utilisez-vous ? Justifiez votre choix.</p></div>",
         "reponse": "<div><p><strong>a) Comparaison des modèles :</strong></p><table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'><thead><tr style='background: #007bff; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Modèle</th><th style='padding: 8px; border: 1px solid #ddd;'>Avantages</th><th style='padding: 8px; border: 1px solid #ddd;'>Inconvénients</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>Régression Logistique</td><td style='padding: 8px; border: 1px solid #ddd;'>Interprétable, rapide</td><td style='padding: 8px; border: 1px solid #ddd;'>Limité aux relations linéaires</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Random Forest</td><td style='padding: 8px; border: 1px solid #ddd;'>Non-linéarités, robustesse</td><td style='padding: 8px; border: 1px solid #ddd;'>Plus complexe, moins interprétable</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Autoencoder</td><td style='padding: 8px; border: 1px solid #ddd;'>Détecte les anomalies complexes</td><td style='padding: 8px; border: 1px solid #ddd;'>Coût de calcul, peu interprétable</td></tr></tbody></table><p><strong>b) Métriques d'évaluation :</strong></p><ul><li><strong>Précision</strong> : Proportion de fraudes détectées parmi les alertes.</li><li><strong>Rappel (Recall)</strong> : Proportion de fraudes réelles détectées.</li><li><strong>F1-score</strong> : Moyenne harmonique de la précision et du rappel.</li><li><strong>AUC-ROC</strong> : Capacité à distinguer les classes.</li></ul><p>Ces métriques sont plus pertinentes que l'accuracy à cause du déséquilibre des classes.</p></div>"
       },
       {
         "question": "<div><p><strong>3. Déploiement et maintenance (2 pts)</strong></p><p>a) Proposez une architecture pour le déploiement en temps réel du système de détection.</p><p>b) Comment gérez-vous l'évolution des comportements frauduleux dans le temps ?</p></div>",
         "reponse": "<div><p><strong>a) Architecture temps réel :</strong></p><ul><li>API REST recevant les transactions en temps réel.</li><li>Prétraitement des caractéristiques (transformations, normalisation).</li><li>Prédiction du modèle (inferencing).</li><li>Envoi du résultat (fraude/suspect/normal) à la banque.</li><li>Stockage des transactions et des prédictions pour le monitoring.</li></ul><p><strong>b) Gestion de l'évolution :</strong></p><ul><li><strong>Monitoring continu</strong> : Suivre les performances du modèle (précision, rappel) en production.</li><li><strong>Détection de dérive</strong> : Utiliser des tests statistiques pour détecter les changements dans les données.</li><li><strong>Réentraînement</strong> : Réentraîner le modèle périodiquement (par exemple, chaque mois) avec les nouvelles données.</li><li><strong>Feedback loop</strong> : Intégrer les retours des analystes de fraude pour améliorer le modèle.</li></ul></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
