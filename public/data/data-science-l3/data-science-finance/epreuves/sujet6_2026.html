<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation A : Data Science pour la Finance - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Trading Algorithmique et Backtesting",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un trader quantitatif développe une stratégie de <strong>mean reversion</strong> sur l'action XYZ. La stratégie consiste à acheter lorsque le prix est inférieur de 2 écarts-types à sa moyenne mobile sur 20 jours, et à vendre lorsqu'il est supérieur de 2 écarts-types.</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Il teste cette stratégie sur des données historiques de 2015 à 2020. Les résultats du backtesting sont les suivants :</p> <ul style='font-size: 0.95em; line-height: 1.6; color: #333;'> <li>Rendement annualisé : 12 %</li> <li>Volatilité annualisée : 15 %</li> <li>Drawdown maximum : 22 %</li> <li>Taux de gain (win rate) : 58 %</li> </ul> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Définir le concept de <strong>mean reversion</strong> et expliquer pourquoi cette stratégie peut être efficace sur les marchés financiers.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Mean reversion</strong> est un concept qui postule que les prix des actifs ont tendance à revenir vers leur moyenne historique ou leur niveau d'équilibre. Si le prix s'écarte trop de cette moyenne, il est censé y revenir.</p> <p>Cette stratégie peut être efficace car les marchés financiers sont souvent sujets à des mouvements excessifs à court terme (surréactions) qui créent des opportunités de profit lorsque les prix reviennent à leur niveau moyen.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Calculer le <strong>ratio de Sharpe</strong> de la stratégie. Interpréter le résultat.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Calcul :</strong></p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\text{Sharpe} = \\frac{R_p - R_f}{\\sigma_p} = \\frac{0.12 - 0.02}{0.15} \\approx 0.67 $$ </div> </div> <p>En supposant un taux sans risque de 2 %, le ratio de Sharpe est d'environ 0,67.</p> <p><strong>Interprétation :</strong> Un ratio de Sharpe de 0,67 indique que la stratégie génère 0,67 % de rendement excédentaire par unité de risque. C'est un résultat correct mais modeste, qui montre que la stratégie n'est pas exceptionnellement performante.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Le drawdown maximum est de 22 %. Expliquer ce qu'est un drawdown et discuter de l'importance de cette métrique pour l'évaluation d'une stratégie de trading.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Drawdown :</strong> Le drawdown mesure la baisse maximale d'un portefeuille par rapport à son pic précédent. Il est généralement exprimé en pourcentage.</p> <p><strong>Importance :</strong> Le drawdown est une métrique cruciale car il indique le risque de perte maximal que l'investisseur pourrait subir. Un drawdown élevé peut être difficile à supporter psychologiquement et peut contraindre à liquider des positions au plus mauvais moment. Un drawdown de 22 % est significatif mais reste acceptable pour certaines stratégies agressives.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Prévision des Prix avec Deep Learning - LSTM",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>On souhaite utiliser un modèle LSTM (Long Short-Term Memory) pour prévoir le prix d'une action à partir de ses prix historiques. Le dataset contient les prix journaliers sur 10 ans. On décide d'utiliser une fenêtre temporelle de 60 jours pour prédire le prix du jour suivant.</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Le modèle LSTM est composé de :</p> <ul style='font-size: 0.95em; line-height: 1.6; color: #333;'> <li>2 couches LSTM de 64 neurones chacune.</li> <li>1 couche Dense de sortie.</li> <li>Un dropout de 0.2 entre les couches.</li> </ul> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Expliquer le rôle de la <strong>fenêtre temporelle (window size)</strong> dans un modèle LSTM. Pourquoi 60 jours est-elle un choix raisonnable pour la prévision des prix ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Rôle de la fenêtre temporelle :</strong> La fenêtre temporelle (window size) définit le nombre de pas de temps passés que le modèle utilise pour prédire la valeur future. Elle détermine la quantité d'information historique prise en compte.</p> <p><strong>Choix de 60 jours :</strong> 60 jours (environ 3 mois de trading) est un choix raisonnable car il capture les tendances à moyen terme tout en étant suffisamment court pour que le modèle ne soit pas trop complexe. Cela correspond à des cycles économiques et à des motifs saisonniers potentiels.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Décrire l'architecture du modèle LSTM présenté. Justifier l'utilisation du <strong>dropout</strong> dans cette architecture.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Architecture :</strong></p> <ul> <li>Couche d'entrée : séquence de 60 pas de temps avec les prix.</li> <li>Couche LSTM 1 : 64 neurones, retourne les séquences (return_sequences=True) pour alimenter la deuxième couche.</li> <li>Couche Dropout : 0.2 (désactive 20 % des neurones aléatoirement).</li> <li>Couche LSTM 2 : 64 neurones.</li> <li>Couche Dense de sortie : 1 neurone pour prédire le prix.</li> </ul> <p><strong>Justification du dropout :</strong> Le dropout est une technique de régularisation qui aide à prévenir le surapprentissage (overfitting). En désactivant aléatoirement des neurones pendant l'entraînement, le modèle est forcé d'apprendre des caractéristiques plus robustes et généralisables.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Quelles précautions de <strong>prétraitement des données</strong> sont nécessaires avant d'entraîner un LSTM sur des données financières ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Précautions de prétraitement :</strong></p> <ul> <li><strong>Normalisation/Standardisation :</strong> Mettre les données à l'échelle (ex: MinMaxScaler) pour éviter que les grandes valeurs dominent l'apprentissage.</li> <li><strong>Stationnarisation :</strong> Rendre la série stationnaire (par différenciation ou transformation logarithmique) pour stabiliser la variance.</li> <li><strong>Gestion des données manquantes :</strong> Imputer ou supprimer les valeurs manquantes.</li> <li><strong>Division des données :</strong> Séparer en ensembles d'entraînement, validation et test (généralement 70/15/15).</li> <li><strong>Création des séquences :</strong> Convertir les données en séquences temporelles de longueur fixe (la fenêtre temporelle).</li> </ul> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Stratégies Quantitatives - Momentum et Pairs Trading",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un fonds d'investissement souhaite diversifier ses stratégies quantitatives. Il envisage d'ajouter une stratégie <strong>momentum</strong> et une stratégie de <strong>pairs trading</strong> à son portefeuille.</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>La stratégie momentum consiste à acheter les actions qui ont le mieux performé sur les 12 derniers mois et à vendre celles qui ont le moins performé. La stratégie de pairs trading consiste à identifier deux actions historiquement corrélées et à parier sur le retour à la moyenne de leur écart.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Définir la stratégie <strong>momentum</strong> et expliquer son fondement théorique.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Définition :</strong> La stratégie momentum consiste à acheter les actifs qui ont surperformé (winners) et à vendre ceux qui ont sous-performé (losers) sur une période donnée. L'hypothèse est que les tendances passées se poursuivent à court/moyen terme.</p> <p><strong>Fondement théorique :</strong> Le momentum s'explique par des biais comportementaux comme le conservatisme des investisseurs (ils réagissent trop lentement aux nouvelles informations) et l'effet de disposition (ils conservent les perdants et vendent les gagnants). Il est également soutenu par des frictions de marché (coûts de transaction, illiquidité).</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Décrire le principe du <strong>pairs trading</strong>. Quelles sont les conditions nécessaires pour qu'une paire d'actions soit appropriée pour cette stratégie ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Principe :</strong> Le pairs trading est une stratégie de market-neutral qui consiste à identifier deux actions historiquement corrélées. Lorsque l'écart (spread) entre leurs prix s'écarte de sa moyenne historique, on achète l'action sous-performante et on vend l'action surperformante, en pariant sur le retour à la moyenne.</p> <p><strong>Conditions nécessaires :</strong></p> <ul> <li>Les actions doivent avoir une forte corrélation historique.</li> <li>Le spread doit être stationnaire (cointégration).</li> <li>Les actions doivent appartenir au même secteur ou avoir des fondamentaux similaires.</li> <li>Il doit y avoir une liquidité suffisante pour entrer et sortir des positions.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Comparer les deux stratégies en termes de : risque, rendement, conditions de marché favorables.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Comparaison :</strong></p> <ul> <li><strong>Risque :</strong> Le momentum est plus risqué car il est exposé au bêta du marché (risque systémique). Le pairs trading est market-neutral (risque réduit).</li> <li><strong>Rendement :</strong> Le momentum peut offrir des rendements plus élevés en période de tendance. Le pairs trading offre des rendements plus stables mais plus modestes.</li> <li><strong>Conditions de marché :</strong> Le momentum est favorable en période de tendance forte. Le pairs trading est favorable en période de marché sans tendance (range), où les écarts de prix ont tendance à revenir à la moyenne.</li> </ul> </div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
