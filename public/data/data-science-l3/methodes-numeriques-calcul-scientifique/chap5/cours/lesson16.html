<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Objectifs du cours :</p><ul style='color: #0b3d5c; margin-bottom: 0;'><li>Étendre les méthodes numériques aux systèmes d'équations différentielles.</li><li>Comprendre et résoudre les systèmes raides (stiff).</li><li>Utiliser des méthodes adaptatives à pas variable.</li></ul></div><div style='background: #fff3cd; padding: 15px; border-radius: 10px; border-left: 5px solid #ffc107;'><p style='color: #856404; margin: 0;'><strong>Contexte :</strong> Jusqu'à présent, nous avons étudié des équations différentielles scalaires (une seule équation, une seule inconnue). En Data Science et en modélisation, on rencontre souvent des systèmes couplés : plusieurs équations, plusieurs inconnues qui interagissent. Il faut donc adapter nos méthodes.</p></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons généraliser ce que nous avons appris sur les équations différentielles aux systèmes d'équations. Un système, c'est plusieurs équations couplées, par exemple un modèle de population avec plusieurs espèces, ou un système mécanique. Nous verrons aussi comment gérer les systèmes dits raides, qui sont très difficiles à résoudre numériquement, et nous introduirons les méthodes à pas variable qui s'adaptent automatiquement à la solution.",
    "note": "Introduction aux systèmes d'équations différentielles et aux défis associés."
  },
  {
    "titre": "Définition d'un Système",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Forme générale d'un système d'ordre 1 :</strong></p><div class='math-block'><div class='math'>$$ \\begin{cases} y_1'(t) = f_1(t, y_1, y_2, \\dots, y_n) \\\\ y_2'(t) = f_2(t, y_1, y_2, \\dots, y_n) \\\\ \\vdots \\\\ y_n'(t) = f_n(t, y_1, y_2, \\dots, y_n) \\end{cases} $$</div></div></div><p><strong>Notation vectorielle :</strong></p><div class='math-block'><div class='math'>$$ \\mathbf{y}'(t) = \\mathbf{f}(t, \\mathbf{y}(t)), \\quad \\mathbf{y}(t_0) = \\mathbf{y}_0 $$</div></div><p>où <span class='math-inline'>\\( \\mathbf{y}(t) \\in \\mathbb{R}^n \\)</span> est le vecteur des inconnues et <span class='math-inline'>\\( \\mathbf{f} : \\mathbb{R} \\times \\mathbb{R}^n \\to \\mathbb{R}^n \\)</span> est la fonction vectorielle.</p>",
    "texteParle": "Un système d'équations différentielles, c'est un ensemble d'équations où chaque dérivée dépend de toutes les inconnues. Par exemple, y1 prime dépend de t, de y1, de y2, et ainsi de suite. On peut le réécrire de manière très compacte en utilisant des vecteurs : on a un vecteur y des inconnues, et un vecteur f qui contient toutes les fonctions. La condition initiale est également un vecteur. Cette notation vectorielle est très pratique car elle permet d'étendre simplement les méthodes scalaires.",
    "note": "Définition d'un système d'équations différentielles sous forme vectorielle."
  },
  {
    "titre": "Extension des Méthodes aux Systèmes",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Principe :</p><p style='color: #0b3d5c; margin: 0;'>Remplacer les <span class='math-inline'>\\( y \\)</span> scalaires par des vecteurs <span class='math-inline'>\\( \\mathbf{y} \\)</span>.</p></div><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Exemple : Euler explicite</strong></p><ul><li>Scalaire : <span class='math-inline'>\\( y_{n+1} = y_n + h f(t_n, y_n) \\)</span></li><li>Vectoriel : <span class='math-inline'>\\( \\mathbf{y}_{n+1} = \\mathbf{y}_n + h \\mathbf{f}(t_n, \\mathbf{y}_n) \\)</span></li></ul></div><div style='background: #d4edda; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; margin-top: 10px;'><p style='color: #155724; margin: 0;'><strong>Remarque :</strong> Toutes les méthodes vues (Euler, Runge-Kutta, multi-pas) s'étendent directement en remplaçant les scalaires par des vecteurs. Le coût de calcul augmente avec la dimension du système.</p></div>",
    "texteParle": "La bonne nouvelle, c'est que toutes les méthodes que nous avons vues pour les équations scalaires s'étendent très facilement aux systèmes. Il suffit de remplacer les nombres par des vecteurs. Par exemple, pour Euler explicite, on remplace y par le vecteur y, et f par le vecteur f. C'est valable pour Euler, Runge-Kutta, les méthodes multi-pas, etc. La seule différence, c'est que les calculs sont plus lourds, car on manipule des vecteurs et potentiellement des matrices.",
    "note": "Extension simple des méthodes scalaires aux systèmes par vectorisation."
  },
  {
    "titre": "Exemple : Modèle Proie-Prédateur (Lotka-Volterra)",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Système :</strong></p><div class='math-block'><div class='math'>$$ \\begin{cases} \\frac{dx}{dt} = \\alpha x - \\beta xy \\\\ \\frac{dy}{dt} = -\\gamma y + \\delta xy \\end{cases} $$</div></div></div><ul><li><span class='math-inline'>\\( x(t) \\)</span> : population de proies.</li><li><span class='math-inline'>\\( y(t) \\)</span> : population de prédateurs.</li><li><span class='math-inline'>\\( \\alpha, \\beta, \\gamma, \\delta \\)</span> : paramètres positifs.</li></ul><div style='background: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'><p style='color: #0c5460; margin: 0;'><strong>Interprétation :</strong></p><ul><li>Les proies se reproduisent (terme <span class='math-inline'>\\( \\alpha x \\)</span>) et sont mangées par les prédateurs (terme <span class='math-inline'>\\( -\\beta xy \\)</span>).</li><li>Les prédateurs meurent naturellement (terme <span class='math-inline'>\\( -\\gamma y \\)</span>) et se reproduisent en mangeant des proies (terme <span class='math-inline'>\\( +\\delta xy \\)</span>).</li></ul></div>",
    "texteParle": "Prenons un exemple classique : le modèle proie-prédateur de Lotka-Volterra. Ce système modélise l'évolution de deux populations : les proies x et les prédateurs y. Les proies augmentent naturellement, mais sont décimées par la rencontre avec les prédateurs. Les prédateurs, eux, diminuent naturellement, mais augmentent en fonction du nombre de proies disponibles. Ce système est un exemple typique de système non linéaire que l'on rencontre en biologie et en Data Science.",
    "note": "Exemple concret d'un système non linéaire : le modèle de Lotka-Volterra."
  },
  {
    "titre": "Résolution Numérique de Systèmes",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Démarche :</p></div><p>Pour résoudre un système, on applique la méthode choisie (Euler, RK4, etc.) à toutes les composantes à chaque pas.</p><div style='background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace;'><p style='font-weight: bold;'>Algorithme Euler explicite pour un système :</p><ol style='margin-bottom: 0;'><li>Initialiser <span class='math-inline'>\\( \\mathbf{y}_0 \\)</span> à <span class='math-inline'>\\( t_0 \\)</span>.</li><li>Pour chaque pas <span class='math-inline'>\\( n \\)</span> :<ul><li>Calculer <span class='math-inline'>\\( \\mathbf{y}_{n+1} = \\mathbf{y}_n + h \\mathbf{f}(t_n, \\mathbf{y}_n) \\)</span>.</li><li>Mettre à jour <span class='math-inline'>\\( t_{n+1} = t_n + h \\)</span>.</li></ul></li></ol></div><div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; margin-top: 10px;'><p style='color: #856404; margin: 0;'><strong>Important :</strong> Le pas <span class='math-inline'>\\( h \\)</span> est le même pour toutes les composantes.</p></div>",
    "texteParle": "Pour résoudre un système, on applique simplement la méthode à toutes les composantes en même temps. Par exemple, avec Euler explicite, on calcule le nouveau vecteur y en ajoutant h fois le vecteur f évalué au temps et au vecteur courant. Le pas h est le même pour toutes les composantes. C'est très simple à implémenter, surtout si on utilise un langage comme Python ou Julia qui manipule facilement les vecteurs.",
    "note": "Application directe des méthodes numériques aux systèmes avec un pas commun."
  },
  {
    "titre": "Problèmes Raides (Stiff)",
    "contenu": "<div style='background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545;'><p style='color: #721c24; font-weight: bold;'>Définition :</p></div><p>Un système est dit <strong>raide (stiff)</strong> lorsque la solution contient des composantes qui varient à des échelles de temps très différentes.</p><ul><li><strong>Exemple :</strong> <span class='math-inline'>\\( y' = -1000 y + 1000 \\sin(t) \\)</span>. La solution a une composante en <span class='math-inline'>\\( e^{-1000t} \\)</span> qui décroît très vite, et une composante en <span class='math-inline'>\\( \\sin(t) \\)</span> qui varie lentement.</li><li><strong>Conséquence :</strong> Les méthodes explicites (Euler, RK4) nécessitent un pas très petit pour être stables, même si la solution varie lentement.</li><li><strong>Solution :</strong> Utiliser des méthodes implicites (Euler implicite, BDF) qui sont inconditionnellement stables pour les systèmes raides.</li></ul>",
    "texteParle": "Un concept très important est celui de système raide, ou 'stiff' en anglais. Cela se produit lorsque la solution a des composantes qui évoluent à des vitesses très différentes. Par exemple, une composante qui décroît exponentiellement très vite, et une autre qui oscille lentement. Avec des méthodes explicites, on serait obligé d'utiliser un pas extrêmement petit pour suivre la composante rapide, ce qui rend le calcul très coûteux. Il faut donc utiliser des méthodes implicites, qui sont plus stables pour ce genre de problèmes.",
    "note": "Introduction aux problèmes raides et à leur difficulté numérique."
  },
  {
    "titre": "Stabilité des Systèmes Raides",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Analyse de stabilité :</p></div><p>On généralise l'équation test <span class='math-inline'>\\( y' = \\lambda y \\)</span> au cas vectoriel : <span class='math-inline'>\\( \\mathbf{y}' = \\Lambda \\mathbf{y} \\)</span>, où <span class='math-inline'>\\( \\Lambda \\)</span> est une matrice diagonale dont les valeurs propres sont <span class='math-inline'>\\( \\lambda_i \\)</span>.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Condition de stabilité pour Euler explicite :</strong></p><div class='math-block'><div class='math'>$$ |1 + h\\lambda_i| \\le 1, \\quad \\forall i $$</div></div></div><p><strong>Pour un système raide :</strong></p><ul><li>Certaines valeurs propres <span class='math-inline'>\\( \\lambda_i \\)</span> sont très grandes en valeur absolue et négatives.</li><li>La condition <span class='math-inline'>\\( |1 + h\\lambda_i| \\le 1 \\)</span> impose <span class='math-inline'>\\( h \\le 2/|\\lambda_i| \\)</span>, donc un pas très petit.</li></ul>",
    "texteParle": "Pour analyser la stabilité des systèmes, on généralise l'équation test scalaire. On considère un système où la matrice est diagonale, avec des valeurs propres lambda i. Pour Euler explicite, la condition de stabilité est que, pour chaque valeur propre, le facteur d'amplification en valeur absolue soit inférieur ou égal à 1. Si une valeur propre est très grande en valeur absolue et négative, cela impose un pas h très petit pour toutes les composantes, même celles qui varient lentement. C'est le problème des systèmes raides.",
    "note": "Analyse de la stabilité pour les systèmes et impact des valeurs propres."
  },
  {
    "titre": "Méthodes Implicites pour Systèmes Raides",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Solution : Méthodes Implicites</p></div><p>Les méthodes implicites (Euler implicite, méthodes de type BDF) sont <strong>inconditionnellement stables</strong> pour les systèmes raides.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Exemple : Euler implicite</strong></p><div class='math-block'><div class='math'>$$ \\mathbf{y}_{n+1} = \\mathbf{y}_n + h \\mathbf{f}(t_{n+1}, \\mathbf{y}_{n+1}) $$</div></div></div><div style='background: #d4edda; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; margin-top: 10px;'><p style='color: #155724; margin: 0;'><strong>Avantage :</strong> La stabilité ne dépend plus du pas <span class='math-inline'>\\( h \\)</span>. On peut utiliser des pas plus grands, même pour les composantes rapides.</p></div><div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; margin-top: 10px;'><p style='color: #856404; margin: 0;'><strong>Inconvénient :</strong> Il faut résoudre un système (potentiellement non linéaire) à chaque pas.</p></div>",
    "texteParle": "La solution pour les systèmes raides est d'utiliser des méthodes implicites. Contrairement aux méthodes explicites, elles sont inconditionnellement stables. Cela signifie que la stabilité ne dépend pas du pas h. On peut donc utiliser des pas beaucoup plus grands, ce qui réduit le temps de calcul. L'inconvénient, c'est qu'à chaque pas, on doit résoudre un système d'équations, ce qui est plus coûteux. Mais pour les problèmes raides, c'est souvent le seul moyen efficace.",
    "note": "Utilisation des méthodes implicites pour garantir la stabilité des systèmes raides."
  },
  {
    "titre": "Méthodes BDF (Backward Differentiation Formulas)",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Principe :</strong> Méthodes multi-pas implicites spécialement conçues pour les systèmes raides.</p></div><p><strong>Formules BDF d'ordre 1, 2, 3 :</strong></p><ul><li><strong>BDF1 (Euler implicite) :</strong> <span class='math-inline'>\\( y_{n+1} = y_n + h f_{n+1} \\)</span></li><li><strong>BDF2 :</strong> <span class='math-inline'>\\( y_{n+1} = \\frac{4}{3} y_n - \\frac{1}{3} y_{n-1} + \\frac{2}{3} h f_{n+1} \\)</span></li><li><strong>BDF3 :</strong> <span class='math-inline'>\\( y_{n+1} = \\frac{18}{11} y_n - \\frac{9}{11} y_{n-1} + \\frac{2}{11} y_{n-2} + \\frac{6}{11} h f_{n+1} \\)</span></li></ul><div style='background: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'><p style='color: #0c5460; margin: 0;'><strong>Propriété :</strong> Les méthodes BDF d'ordre 1 à 6 sont <strong>A-stables</strong> (inconditionnellement stables pour tous les problèmes raides). Au-delà de l'ordre 6, elles perdent cette propriété.</p></div>",
    "texteParle": "Les méthodes BDF, ou Backward Differentiation Formulas, sont des méthodes multi-pas implicites conçues spécifiquement pour les problèmes raides. La plus simple, BDF1, n'est autre que la méthode d'Euler implicite. BDF2 et BDF3 utilisent les valeurs aux pas précédents pour une meilleure précision. Une propriété remarquable est que les BDF d'ordre 1 à 6 sont A-stables, c'est-à-dire inconditionnellement stables. Au-delà de l'ordre 6, elles ne le sont plus. Ces méthodes sont très utilisées dans les solveurs professionnels.",
    "note": "Présentation des méthodes BDF, spécialisées pour les systèmes raides."
  },
  {
    "titre": "Méthodes Adaptatives à Pas Variable",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Principe :</p><p style='color: #0b3d5c; margin: 0;'>Adapter le pas d'intégration en fonction du comportement de la solution.</p></div><ul><li><strong>Si la solution varie rapidement :</strong> Réduire le pas pour une meilleure précision.</li><li><strong>Si la solution est régulière :</strong> Augmenter le pas pour gagner en efficacité.</li></ul><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Estimation de l'erreur :</strong> On utilise deux méthodes d'ordre différent (par exemple, RK4 et RK5) pour estimer l'erreur locale.</p><div class='math-block'><div class='math'>$$ \\text{Erreur estimée} = \\| \\mathbf{y}_{n+1}^{(5)} - \\mathbf{y}_{n+1}^{(4)} \\| $$</div></div></div><p><strong>Stratégie :</strong> Si l'erreur est trop grande, on réduit le pas (<span class='math-inline'>\\( h \\leftarrow h/2 \\)</span>). Si elle est trop petite, on l'augmente (<span class='math-inline'>\\( h \\leftarrow 2h \\)</span>).</p>",
    "texteParle": "Les méthodes adaptatives à pas variable sont très intelligentes. Elles ajustent automatiquement le pas d'intégration en fonction de la solution. Là où la solution varie rapidement, on réduit le pas pour être plus précis. Là où elle est régulière, on augmente le pas pour gagner du temps. Pour estimer l'erreur, on compare deux approximations de la solution avec des ordres différents, par exemple une méthode d'ordre 4 et une d'ordre 5. Si l'erreur est trop grande, on réduit le pas, sinon on l'augmente.",
    "note": "Principe des méthodes adaptatives à pas variable pour optimiser le calcul."
  },
  {
    "titre": "Méthodes Adaptatives : Stratégie de Contrôle du Pas",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Algorithme :</strong></p><ol style='margin-bottom: 0;'><li>Choisir un pas initial <span class='math-inline'>\\( h \\)</span> et une tolérance <span class='math-inline'>\\( \\epsilon \\)</span>.</li><li>Calculer les approximations <span class='math-inline'>\\( y_{n+1}^{(p)} \\)</span> (d'ordre <span class='math-inline'>\\( p \\)</span>) et <span class='math-inline'>\\( y_{n+1}^{(p+1)} \\)</span> (d'ordre <span class='math-inline'>\\( p+1 \\)</span>).</li><li>Estimer l'erreur <span class='math-inline'>\\( E = \\| y_{n+1}^{(p+1)} - y_{n+1}^{(p)} \\| \\)</span>.</li><li>Si <span class='math-inline'>\\( E \\le \\epsilon \\)</span> : accepter le pas et augmenter <span class='math-inline'>\\( h \\)</span>.</li><li>Si <span class='math-inline'>\\( E > \\epsilon \\)</span> : rejeter le pas, réduire <span class='math-inline'>\\( h \\)</span> et réessayer.</li></ol></div><div style='background: #d4edda; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; margin-top: 10px;'><p style='color: #155724; margin: 0;'><strong>Avantage :</strong> La précision est garantie (contrôlée par <span class='math-inline'>\\( \\epsilon \\)</span>) et le nombre de pas est minimisé.</p></div>",
    "texteParle": "Voici comment fonctionne concrètement le contrôle du pas. On se donne une tolérance, une erreur maximale que l'on accepte. On calcule la solution avec deux méthodes d'ordre différent. Si l'erreur estimée est inférieure à la tolérance, on accepte le pas et on peut même l'augmenter pour le pas suivant. Si l'erreur est trop grande, on rejette le pas, on le réduit, et on recommence le calcul. Cela garantit que la précision demandée est atteinte avec le nombre minimal de pas.",
    "note": "Stratégie de contrôle du pas pour garantir la précision."
  },
  {
    "titre": "Exemple de Méthode Adaptative : RK45 (ou Runge-Kutta-Fehlberg)",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Méthode très utilisée en pratique.</p></div><ul><li><strong>Ordre 4 :</strong> Approximation principale (la plus précise).</li><li><strong>Ordre 5 :</strong> Approximation utilisée pour l'estimation de l'erreur.</li><li><strong>Avantage :</strong> Les deux approximations partagent les mêmes évaluations de <span class='math-inline'>\\( f \\)</span>, ce qui est économique.</li></ul><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Fonctions intégrées :</strong></p><ul><li><strong>Python (SciPy) :</strong> <code>scipy.integrate.solve_ivp</code> avec <code>method='RK45'</code></li><li><strong>Julia :</strong> <code>solve(prob, Tsit5())</code> (variante de RK45)</li><li><strong>MATLAB :</strong> <code>ode45</code></li></ul></div>",
    "texteParle": "Une des méthodes adaptatives les plus populaires est la méthode RK45, aussi appelée Runge-Kutta-Fehlberg. Elle combine une méthode d'ordre 4 et une méthode d'ordre 5 pour estimer l'erreur. L'avantage est que les deux méthodes partagent les mêmes évaluations de la fonction, ce qui rend le calcul très efficace. C'est la méthode standard dans de nombreuses bibliothèques : par exemple, ode45 dans MATLAB, ou solve_ivp avec method RK45 dans SciPy en Python. C'est souvent un bon choix par défaut.",
    "note": "Présentation de la méthode RK45, un standard pour les problèmes non raides."
  },
  {
    "titre": "Résumé et Mots-Clés",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='font-weight: bold;'>Ce qu'il faut retenir :</p><ul><li><strong>Systèmes :</strong> Extension vectorielle des méthodes scalaires.</li><li><strong>Problèmes raides :</strong> Composantes à échelles de temps très différentes. Exigent des méthodes implicites.</li><li><strong>Méthodes implicites :</strong> Euler implicite, BDF. Inconditionnellement stables.</li><li><strong>Méthodes adaptatives :</strong> Ajustent le pas en fonction de la solution. RK45 est un standard.</li></ul></div><div style='background: #fff3cd; padding: 15px; border-radius: 10px; border-left: 5px solid #ffc107;'><p style='color: #856404; font-weight: bold; margin: 0;'>Mots-clés :</p><p style='color: #856404; margin: 0;'>Systèmes d'équations différentielles, raide (stiff), méthodes implicites, BDF, méthodes adaptatives, pas variable, RK45.</p></div>",
    "texteParle": "Pour conclure cette leçon, rappelons les points essentiels. Un système d'équations différentielles se résout en appliquant les méthodes scalaires à chaque composante. Les problèmes raides, où les échelles de temps sont très différentes, nécessitent des méthodes implicites pour garantir la stabilité. Les méthodes BDF sont spécialement conçues pour cela. Enfin, les méthodes adaptatives à pas variable, comme RK45, permettent d'ajuster automatiquement le pas pour obtenir une précision donnée avec un coût minimal. Ces outils sont essentiels en modélisation numérique.",
    "note": "Résumé des concepts clés de la leçon sur les systèmes d'équations différentielles."
  }
];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        if (statusBadge) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
