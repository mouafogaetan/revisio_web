<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='text-align: center; padding: 20px;'><h2 style='color: #2c3e50;'>Bienvenue au Cours</h2><h1 style='color: #2980b9; font-size: 2em;'>Méthode d'Euler</h1><p style='font-size: 1.2em; color: #34495e; margin-top: 20px;'>Résolution numérique des équations différentielles</p><div style='background: #ecf0f1; border-radius: 10px; padding: 15px; margin-top: 20px;'><p style='color: #2c3e50;'><strong>Licence 3 Data Science</strong></p><p style='color: #2c3e50;'>Méthodes Numériques et Calcul Scientifique</p></div></div>",
    "texteParle": "Bonjour et bienvenue à tous. Aujourd'hui, nous allons aborder la méthode d'Euler, une technique fondamentale en calcul numérique pour résoudre des équations différentielles. Cette méthode est essentielle pour modéliser des phénomènes qui évoluent dans le temps, comme la croissance d'une population ou la propagation d'une épidémie. Nous verrons ensemble les versions explicite et implicite, leurs propriétés et leurs applications.",
    "note": "Cours de Méthodes Numériques - Licence 3 Data Science"
  },
  {
    "titre": "Objectifs du Cours",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Ce que vous allez apprendre</h3><ul style='list-style-type: none; padding: 0;'><li style='background: #e8f4f8; margin: 10px 0; padding: 12px; border-radius: 8px; border-left: 4px solid #2980b9;'><strong>✓</strong> Présenter la méthode d'Euler explicite</li><li style='background: #e8f4f8; margin: 10px 0; padding: 12px; border-radius: 8px; border-left: 4px solid #e67e22;'><strong>✓</strong> Présenter la méthode d'Euler implicite</li><li style='background: #e8f4f8; margin: 10px 0; padding: 12px; border-radius: 8px; border-left: 4px solid #27ae60;'><strong>✓</strong> Analyser la convergence des méthodes d'Euler</li><li style='background: #e8f4f8; margin: 10px 0; padding: 12px; border-radius: 8px; border-left: 4px solid #8e44ad;'><strong>✓</strong> Étudier la stabilité numérique</li></ul></div>",
    "texteParle": "Dans ce cours, nous allons atteindre quatre objectifs principaux. Premièrement, nous présenterons la méthode d'Euler explicite, qui est la plus simple à comprendre et à implémenter. Deuxièmement, nous verrons la méthode d'Euler implicite, qui est plus stable mais plus difficile à mettre en œuvre. Troisièmement, nous analyserons la convergence de ces méthodes pour savoir si elles approchent bien la solution exacte. Enfin, nous étudierons leur stabilité numérique, qui est cruciale pour éviter des résultats explosifs.",
    "note": "Objectifs : Explicite, Implicite, Convergence, Stabilité"
  },
  {
    "titre": "Le Problème de Cauchy",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Position du problème</h3><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 15px 0; border: 1px solid #dee2e6;'><p style='font-size: 1.1em; text-align: center;'>\\( \\frac{dy}{dt} = f(t, y) \\)</p><p style='text-align: center;'>avec \\( y(t_0) = y_0 \\)</p></div><p style='color: #2c3e50;'>On cherche à approcher la solution \\( y(t) \\) sur un intervalle \\( [t_0, t_f] \\)</p><div style='background: #d4edda; border-radius: 8px; padding: 12px; margin-top: 15px;'><p style='color: #155724;'><strong>Exemple concret :</strong> Modélisation de la croissance d'une population</p><p style='color: #155724;'>\\( \\frac{dP}{dt} = r P \\) où \\( r \\) est le taux de croissance</p></div></div>",
    "texteParle": "Commençons par poser le problème. Nous avons une équation différentielle du premier ordre de la forme dy sur dt égale f de t et y, avec une condition initiale y de t0 égale y0. Notre objectif est de trouver une approximation de la solution y de t sur un intervalle allant de t0 à tf. Par exemple, en biologie, on peut modéliser la croissance d'une population avec l'équation dP sur dt égale r fois P, où r est le taux de croissance. C'est un problème classique que nous allons résoudre numériquement.",
    "note": "Problème de Cauchy : équation différentielle + condition initiale"
  },
  {
    "titre": "Principe de la Méthode d'Euler",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Approximation de la dérivée</h3><p>On utilise le développement de Taylor pour approcher \\( y(t_{n+1}) \\) :</p><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #dee2e6;'><p style='text-align: center;'>\\( y(t_{n+1}) \\approx y(t_n) + h \\cdot f(t_n, y(t_n)) \\)</p></div><div style='display: flex; flex-wrap: wrap; justify-content: space-around; margin: 15px 0;'><div style='background: #e8f4f8; padding: 12px; border-radius: 8px; flex: 1; margin: 5px; min-width: 120px; text-align: center;'><p><strong>\\( h \\)</strong><br>Pas de temps</p></div><div style='background: #e8f4f8; padding: 12px; border-radius: 8px; flex: 1; margin: 5px; min-width: 120px; text-align: center;'><p><strong>\\( t_n \\)</strong><br>Temps actuel</p></div><div style='background: #e8f4f8; padding: 12px; border-radius: 8px; flex: 1; margin: 5px; min-width: 120px; text-align: center;'><p><strong>\\( y_n \\)</strong><br>Approximation actuelle</p></div></div></div>",
    "texteParle": "Le principe de la méthode d'Euler est simple. Nous utilisons un développement de Taylor pour approcher la solution au temps suivant. L'idée est que si nous connaissons la valeur de y au temps tn, nous pouvons estimer y au temps tn plus h en utilisant la pente de la tangente donnée par f de tn et y de tn. Cette approximation est d'autant meilleure que le pas h est petit. Nous allons maintenant détailler les deux versions de cette méthode.",
    "note": "Approximation de Taylor au premier ordre"
  },
  {
    "titre": "Méthode d'Euler Explicite",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Schéma itératif</h3><div style='background: #d4edda; border-radius: 10px; padding: 20px; margin: 10px 0; border: 2px solid #28a745;'><p style='text-align: center; font-size: 1.2em;'><strong>\\( y_{n+1} = y_n + h \\cdot f(t_n, y_n) \\)</strong></p></div><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; margin: 10px 0;'><p><strong>Algorithme :</strong></p><ol style='color: #2c3e50;'><li>Choisir \\( t_0 \\), \\( y_0 \\), \\( h \\) et \\( N \\)</li><li>Pour \\( n = 0, 1, 2, ..., N-1 \\) :<br>\\( y_{n+1} = y_n + h \\cdot f(t_n, y_n) \\)</li></ol></div><div style='background: #fff3cd; border-radius: 8px; padding: 12px; border-left: 4px solid #ffc107;'><p style='color: #856404;'><strong>Remarque :</strong> La nouvelle valeur \\( y_{n+1} \\) est calculée <strong>explicitement</strong> à partir de valeurs connues.</p></div></div>",
    "texteParle": "La méthode d'Euler explicite est la plus simple. Elle s'écrit sous la forme y indice n plus 1 égale y indice n plus h fois f de tn et y indice n. Pour l'implémenter, on choisit le point de départ t0, y0, le pas de temps h et le nombre d'itérations N. Ensuite, pour chaque étape, on calcule explicitement la nouvelle valeur à partir des valeurs connues. Cette méthode est dite explicite car la nouvelle valeur est calculée directement à l'aide d'une formule simple. C'est la méthode la plus facile à programmer, comme nous allons le voir dans l'exemple suivant.",
    "note": "Schéma explicite : simple à implémenter"
  },
  {
    "titre": "Exemple : Croissance Exponentielle",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>\\( \\frac{dy}{dt} = y \\), \\( y(0) = 1 \\)</h3><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #dee2e6;'><p style='text-align: center;'><strong>Solution exacte :</strong> \\( y(t) = e^t \\)</p></div><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.9em;'><tr style='background: #2980b9; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>\\( n \\)</th><th style='padding: 8px; border: 1px solid #ddd;'>\\( t_n \\)</th><th style='padding: 8px; border: 1px solid #ddd;'>\\( y_n \\) (Euler)</th><th style='padding: 8px; border: 1px solid #ddd;'>\\( e^{t_n} \\) (Exact)</th><th style='padding: 8px; border: 1px solid #ddd;'>Erreur</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.000</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.000</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0.000</td></tr><tr style='background: #f8f9fa;'><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0.1</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.100</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.105</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0.005</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0.2</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.210</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>1.221</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>0.011</td></tr></table></div></div>",
    "texteParle": "Prenons un exemple classique : l'équation différentielle dy sur dt égale y, avec y à 0 égale 1. La solution exacte est y de t égale exponentielle de t. Avec un pas de temps h égale 0,1, nous appliquons la méthode d'Euler explicite. Nous constatons que les approximations sont proches de la solution exacte. Par exemple, à t égale 0,1, nous obtenons 1,100 alors que la solution exacte est 1,105. L'erreur est de 0,005. Cette erreur va augmenter avec le temps, mais reste acceptable pour un pas de temps suffisamment petit.",
    "note": "Exemple : y' = y, y(0) = 1, h = 0.1"
  },
  {
    "titre": "Méthode d'Euler Implicite",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Schéma implicite</h3><div style='background: #d4edda; border-radius: 10px; padding: 20px; margin: 10px 0; border: 2px solid #28a745;'><p style='text-align: center; font-size: 1.2em;'><strong>\\( y_{n+1} = y_n + h \\cdot f(t_{n+1}, y_{n+1}) \\)</strong></p></div><div style='background: #fff3cd; border-radius: 8px; padding: 15px; margin: 10px 0; border-left: 4px solid #ffc107;'><p style='color: #856404;'><strong>Difficulté :</strong> \\( y_{n+1} \\) apparaît des deux côtés de l'équation.</p></div><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; margin: 10px 0;'><p><strong>Résolution :</strong> Pour résoudre, on utilise souvent la méthode de Newton.</p></div><div style='background: #d4edda; border-radius: 8px; padding: 12px; margin-top: 10px; border-left: 4px solid #28a745;'><p style='color: #155724;'><strong>Avantage :</strong> Plus stable que la méthode explicite.</p></div></div>",
    "texteParle": "La méthode d'Euler implicite est une variante plus complexe. Le schéma est similaire, mais cette fois-ci, on utilise la pente au point futur tn+1 au lieu du point actuel. Cela donne l'équation y indice n plus 1 égale y indice n plus h fois f de tn+1 et yn+1. La difficulté est que yn+1 apparaît des deux côtés de l'équation, ce qui en fait une équation implicite. Pour la résoudre, on utilise généralement la méthode de Newton. L'avantage de cette approche est qu'elle est bien plus stable que la méthode explicite, particulièrement pour les problèmes raides, comme nous le verrons plus tard.",
    "note": "Schéma implicite : plus stable mais plus coûteux"

  {
    "titre": "Comparaison Explicite vs Implicite",
    "contenu": "<div style='padding: 10px;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background: #2980b9; color: white;'><th style='padding: 12px; border: 1px solid #ddd;'>Critère</th><th style='padding: 12px; border: 1px solid #ddd;'>Explicite</th><th style='padding: 12px; border: 1px solid #ddd;'>Implicite</th></tr><tr><td style='padding: 10px; border: 1px solid #ddd;'><strong>Simplicité</strong></td><td style='padding: 10px; border: 1px solid #ddd;'>✓ Facile à implémenter</td><td style='padding: 10px; border: 1px solid #ddd;'>✗ Nécessite un solveur</td></tr><tr style='background: #f8f9fa;'><td style='padding: 10px; border: 1px solid #ddd;'><strong>Coût</strong></td><td style='padding: 10px; border: 1px solid #ddd;'>✓ Faible par itération</td><td style='padding: 10px; border: 1px solid #ddd;'>✗ Élevé par itération</td></tr><tr><td style='padding: 10px; border: 1px solid #ddd;'><strong>Stabilité</strong></td><td style='padding: 10px; border: 1px solid #ddd;'>✗ Conditionnelle</td><td style='padding: 10px; border: 1px solid #ddd;'>✓ Inconditionnelle</td></tr><tr style='background: #f8f9fa;'><td style='padding: 10px; border: 1px solid #ddd;'><strong>Précision</strong></td><td style='padding: 10px; border: 1px solid #ddd;'>Ordre 1</td><td style='padding: 10px; border: 1px solid #ddd;'>Ordre 1</td></tr></table><div style='background: #d4edda; border-radius: 8px; padding: 15px; margin-top: 15px; border-left: 4px solid #28a745;'><p style='color: #155724;'><strong>À retenir :</strong> L'explicite est simple mais instable pour les grands pas. L'implicite est stable mais plus complexe.</p></div></div>",
    "texteParle": "Comparons maintenant les deux méthodes sur plusieurs critères. En termes de simplicité, l'explicite est clairement gagnant, car elle est facile à implémenter, tandis que l'implicite nécessite un solveur d'équation. En termes de coût, l'explicite est moins chère par itération, mais l'implicite peut nécessiter moins d'itérations. Pour la stabilité, c'est là que la différence est cruciale : l'explicite est conditionnellement stable, c'est-à-dire qu'elle n'est stable que si le pas de temps est suffisamment petit. L'implicite, elle, est inconditionnellement stable. Enfin, les deux méthodes ont la même précision d'ordre 1. Le choix dépend donc du problème à résoudre.",
    "note": "Choisir la méthode selon le problème"

  {
    "titre": "Convergence de la Méthode d'Euler",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Erreur de troncature locale</h3><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #dee2e6;'><p style='text-align: center;'>\\( \\text{Erreur} = \\frac{h^2}{2} y''(\\xi) \\)</p></div><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; margin: 10px 0;'><p style='color: #2c3e50;'><strong>Propriétés :</strong></p><ul style='color: #2c3e50;'><li><strong>Consistance :</strong> L'erreur locale tend vers 0 quand \\( h \\to 0 \\)</li><li><strong>Ordre :</strong> La méthode est d'ordre 1</li><li><strong>Convergence :</strong> Si la méthode est consistante et stable, elle converge</li></ul></div><div style='background: #fff3cd; border-radius: 8px; padding: 12px; border-left: 4px solid #ffc107;'><p style='color: #856404;'><strong>Important :</strong> L'erreur globale est en \\( O(h) \\), donc diviser \\( h \\) par 2 divise l'erreur par 2.</p></div></div>",
    "texteParle": "Nous allons maintenant analyser la convergence de la méthode d'Euler. L'erreur de troncature locale, c'est-à-dire l'erreur commise à chaque pas, est proportionnelle à h au carré sur deux fois y seconde de xi. La méthode est consistante car cette erreur tend vers zéro lorsque le pas de temps h tend vers zéro. Elle est d'ordre 1, ce qui signifie que l'erreur globale est proportionnelle à h. En pratique, si on divise le pas de temps par deux, l'erreur globale est divisée par deux. C'est une propriété importante à retenir pour choisir le pas de temps dans vos simulations.",
    "note": "Convergence : O(h), ordre 1"

  {
    "titre": "Stabilité Numérique",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Équation test : \\( y' = \\lambda y \\)</h3><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #dee2e6;'><p style='text-align: center;'><strong>Explicite :</strong> \\( |1 + h\\lambda| < 1 \\)</p><p style='text-align: center;'><strong>Implicite :</strong> \\( \\left| \\frac{1}{1 - h\\lambda} \\right| < 1 \\)</p></div><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; margin: 10px 0;'><p style='color: #2c3e50;'><strong>Interprétation :</strong></p><ul style='color: #2c3e50;'><li>Explicite : stable si \\( h < \\frac{2}{|\\lambda|} \\)</li><li>Implicite : stable pour tout \\( h > 0 \\)</li></ul></div><div style='background: #d4edda; border-radius: 8px; padding: 12px; border-left: 4px solid #28a745;'><p style='color: #155724;'><strong>À retenir :</strong> Pour les problèmes raides (|λ| grand), seule l'implicite est stable.</p></div></div>",
    "texteParle": "La stabilité numérique est cruciale pour les équations différentielles. Pour l'étudier, on utilise souvent l'équation test y prime égale lambda fois y. Pour la méthode explicite, la condition de stabilité est valeur absolue de 1 plus h lambda inférieur à 1. Cela signifie que le pas de temps h doit être inférieur à 2 sur valeur absolue de lambda. Pour la méthode implicite, la condition est valeur absolue de 1 sur 1 moins h lambda inférieur à 1, ce qui est toujours vrai pour lambda négatif. Ainsi, l'implicite est inconditionnellement stable. C'est particulièrement important pour les problèmes raides, où le paramètre lambda est très grand en valeur absolue. Dans ce cas, seule la méthode implicite peut être utilisée de manière stable.",

    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Définition</h3><div style='background: #f8f9fa; border-radius: 10px; padding: 20px; margin: 10px 0; border: 1px solid #dee2e6;'><p>Un problème est dit <strong>raide</strong> s'il comporte des dynamiques à la fois très rapides et très lentes.</p></div><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; margin: 10px 0;'><p><strong>Exemple :</strong> \\( y' = -1000y + 1000 \\), \\( y(0) = 2 \\)</p></div><div style='display: flex; flex-wrap: wrap; justify-content: space-around; margin: 15px 0;'><div style='background: #f8d7da; padding: 12px; border-radius: 8px; flex: 1; margin: 5px; min-width: 150px; text-align: center; border: 1px solid #f5c6cb;'><p style='color: #721c24;'><strong>Explicite</strong><br>Nécessite \\( h < 0.002 \\)</p></div><div style='background: #d4edda; padding: 12px; border-radius: 8px; flex: 1; margin: 5px; min-width: 150px; text-align: center; border: 1px solid #c3e6cb;'><p style='color: #155724;'><strong>Implicite</strong><br>Stable pour tout \\( h \\)</p></div></div></div>",
    "texteParle": "Parlons maintenant des problèmes raides, ou stiff en anglais. Un problème est dit raide lorsqu'il contient des dynamiques à la fois très rapides et très lentes. Un exemple classique est l'équation y prime égale moins 1000 y plus 1000. Ici, la solution tend rapidement vers la valeur 1, mais la dynamique est très rapide. Pour la méthode explicite, on est obligé d'utiliser un pas de temps très petit, inférieur à 0,002, pour garantir la stabilité. En revanche, la méthode implicite est stable pour n'importe quel pas de temps. C'est pourquoi, pour ce type de problèmes, on préfère toujours la méthode implicite.",

    "titre": "Application en Data Science",

    "texteParle": "En Data Science, les méthodes numériques pour les équations différentielles sont très utilisées. Par exemple, en modélisation de la croissance des populations ou en épidémiologie, on utilise des modèles comme le modèle SIR pour étudier la propagation des maladies. En finance, on peut modéliser l'évolution des prix avec des équations différentielles stochastiques. En apprentissage automatique, la descente de gradient peut être vue comme une version discrète d'une équation différentielle. La méthode d'Euler, dans sa version explicite, est d'ailleurs très proche de l'algorithme de descente de gradient avec un pas d'apprentissage fixe. Ces liens montrent l'importance de maîtriser ces méthodes numériques.",

  {
    "titre": "Implémentation en Python",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Code pour y' = y</h3><div style='background: #1e1e1e; border-radius: 10px; padding: 20px; margin: 10px 0; overflow-x: auto;'><pre style='color: #d4d4d4; font-family: monospace; margin: 0;'>import numpy as np\nimport matplotlib.pyplot as plt\n\ndef euler_explicite(f, t0, y0, h, N):\n    t = np.zeros(N+1)\n    y = np.zeros(N+1)\n    t[0], y[0] = t0, y0\n    for n in range(N):\n        t[n+1] = t[n] + h\n        y[n+1] = y[n] + h * f(t[n], y[n])\n    return t, y\n\n# Exemple : y' = y, y(0) = 1\ndef f(t, y):\n    return y\n\nt, y = euler_explicite(f, 0, 1, 0.1, 50)\nplt.plot(t, y, label='Euler')\nplt.plot(t, np.exp(t), label='Exact')\nplt.legend()\nplt.show()</pre></div></div>",
    "texteParle": "Voici maintenant comment implémenter la méthode d'Euler en Python. La fonction euler explicite prend en entrée la fonction f, le temps initial t0, la condition initiale y0, le pas de temps h et le nombre d'itérations N. Elle retourne les tableaux des temps et des approximations. Pour l'équation y prime égale y, on définit simplement la fonction f qui retourne y. Ensuite, on exécute la méthode et on compare avec la solution exacte en traçant les deux courbes. Vous pouvez tester ce code avec différents pas de temps pour observer l'effet sur la précision et la stabilité. N'hésitez pas à modifier les paramètres pour bien comprendre le comportement de la méthode.",
    "note": "Code Python pour la méthode d'Euler explicite"
  },
  {
    "titre": "Résumé",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #2c3e50;'>Points clés à retenir</h3><div style='display: flex; flex-direction: column; gap: 10px; margin: 15px 0;'><div style='background: #e8f4f8; border-radius: 8px; padding: 15px; border-left: 4px solid #2980b9;'><p style='color: #2c3e50; margin: 0;'><strong>1.</strong> La méthode d'Euler approxime la solution d'une équation différentielle</p></div><div style='background: #d4edda; border-radius: 8px; padding: 15px; border-left: 4px solid #28a745;'><p style='color: #155724; margin: 0;'><strong;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
