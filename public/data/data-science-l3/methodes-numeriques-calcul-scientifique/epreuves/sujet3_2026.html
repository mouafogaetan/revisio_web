<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Méthodes Numériques et Calcul Scientifique - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse d'une Équation Différentielle",
      "points": "5 pts",
      "enonce": "<p>On considère l'équation différentielle suivante :</p><div class='math-block'><div class='math'>$$ \\frac{dy}{dt} = -10y + 10, \\quad y(0) = 0 $$</div></div><p>Cette équation modélise, par exemple, le refroidissement d'un objet ou la dynamique d'un système simple.</p><ul><li><strong>Question 1.1</strong> : Déterminer la solution exacte de cette équation différentielle.</li><li><strong>Question 1.2</strong> : On applique la méthode d'Euler explicite avec un pas de temps \(h = 0.2\). Calculer les premières itérations pour \(t = 0.2\), \(t = 0.4\) et \(t = 0.6\).</li><li><strong>Question 1.3</strong> : Analyser la stabilité de la méthode d'Euler explicite pour cette équation. Pour quelles valeurs de \(h\) la méthode est-elle stable ?</li><li><strong>Question 1.4</strong> : Proposer une méthode plus stable et justifier votre choix.</li></ul>",
      "questions": [
        {
          "question": "1.1) Déterminer la solution exacte de l'équation \( \\frac{dy}{dt} = -10y + 10 \\), avec \(y(0)=0\).",
          "reponse": "La solution exacte est \( y(t) = 1 - e^{-10t} \).<br/><br/>En effet, l'équation est linéaire du premier ordre : \( y' + 10y = 10 \\). La solution générale est \( y(t) = C e^{-10t} + 1 \\). Avec \(y(0)=0\), on a \( C + 1 = 0 \\), donc \(C = -1\). La solution est donc \( y(t) = 1 - e^{-10t} \)."
        },
        {
          "question": "1.2) Appliquer la méthode d'Euler explicite avec \(h = 0.2\) pour \(t = 0.2\), \(t = 0.4\) et \(t = 0.6\).",
          "reponse": "La méthode d'Euler explicite est : \( y_{n+1} = y_n + h f(t_n, y_n) = y_n + 0.2 \\times (-10y_n + 10) = y_n - 2y_n + 2 = -y_n + 2 \\).<br/><br/>Avec \(y(0)=0\) :<br/>- \(t=0.2\) : \(y_1 = -0 + 2 = 2\)<br/>- \(t=0.4\) : \(y_2 = -2 + 2 = 0\)<br/>- \(t=0.6\) : \(y_3 = -0 + 2 = 2\)<br/><br/>On observe une oscillation entre 0 et 2."
        },
        {
          "question": "1.3) Analyser la stabilité de la méthode d'Euler explicite pour \( \\frac{dy}{dt} = -10y + 10 \\). Pour quelles valeurs de \(h\) la méthode est-elle stable ?",
          "reponse": "Pour l'équation \( y' = \\lambda y \\) avec \( \\lambda = -10 \\), la méthode d'Euler explicite est stable si \( |1 + h\\lambda| \\le 1 \\).<br/><br/>Cela donne \( |1 - 10h| \\le 1 \\), soit \(-1 \\le 1 - 10h \\le 1\).<br/>- \(1 - 10h \\le 1 \\Rightarrow h \\ge 0\)<br/>- \(1 - 10h \\ge -1 \\Rightarrow -10h \\ge -2 \\Rightarrow h \\le 0.2\)<br/><br/>La méthode est donc stable pour \( 0 < h \\le 0.2 \\). Avec \(h=0.2\), on est à la limite de stabilité (d'où les oscillations observées)."
        },
        {
          "question": "1.4) Proposer une méthode plus stable et justifier votre choix.",
          "reponse": "La méthode d'Euler <strong>implicite</strong> est plus stable. Pour cette équation, elle s'écrit : \( y_{n+1} = y_n + h f(t_{n+1}, y_{n+1}) = y_n + 0.2(-10y_{n+1} + 10) \\).<br/><br/>Cela donne \( y_{n+1} = y_n - 2y_{n+1} + 2 \\), soit \( 3y_{n+1} = y_n + 2 \\), donc \( y_{n+1} = (y_n + 2)/3 \\).<br/><br/>Avec \(y(0)=0\) :<br/>- \(t=0.2\) : \(y_1 = 2/3 \\approx 0.667\)<br/>- \(t=0.4\) : \(y_2 = (0.667 + 2)/3 = 0.889\)<br/>- \(t=0.6\) : \(y_3 = (0.889 + 2)/3 = 0.963\)<br/><br/>La solution implicite est stable pour tout \(h>0\), et converge vers la solution exacte."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Optimisation Numérique",
      "points": "6 pts",
      "enonce": "<p>On considère la fonction de Rosenbrock, souvent utilisée comme test pour les algorithmes d'optimisation :</p><div class='math-block'><div class='math'>$$ f(x, y) = (1 - x)^2 + 100(y - x^2)^2 $$</div></div><p>Cette fonction a un minimum global en \((1, 1)\) avec \(f(1, 1) = 0\).</p><ul><li><strong>Question 2.1</strong> : Calculer le gradient \(\\nabla f(x, y)\) de cette fonction.</li><li><strong>Question 2.2</strong> : Donner l'expression de la méthode de descente de gradient pour minimiser cette fonction.</li><li><strong>Question 2.3</strong> : Expliquer pourquoi cette fonction est difficile à minimiser pour la descente de gradient.</li><li><strong>Question 2.4</strong> : Comparer la descente de gradient, la méthode de Newton et la méthode BFGS pour ce type de problème.</li></ul>",
      "questions": [
        {
          "question": "2.1) Calculer le gradient \( \\nabla f(x, y) \) de la fonction de Rosenbrock.",
          "reponse": "Le gradient est le vecteur des dérivées partielles :<br/><br/>\( \\frac{\\partial f}{\\partial x} = -2(1 - x) - 400x(y - x^2) = 2(x - 1) - 400x(y - x^2) \)<br/><br/>\( \\frac{\\partial f}{\\partial y} = 200(y - x^2) \)<br/><br/>Donc \( \\nabla f(x, y) = \\begin{pmatrix} 2(x-1) - 400x(y - x^2) \\\\ 200(y - x^2) \\end{pmatrix} \\)"
        },
        {
          "question": "2.2) Donner l'expression de la méthode de descente de gradient pour minimiser cette fonction.",
          "reponse": "La méthode de descente de gradient s'écrit :<br/><br/>\( \\begin{pmatrix} x_{k+1} \\\\ y_{k+1} \\end{pmatrix} = \\begin{pmatrix} x_k \\\\ y_k \\end{pmatrix} - \\alpha \\nabla f(x_k, y_k) \)<br/><br/>où \( \\alpha > 0 \) est le pas (taux d'apprentissage).<br/><br/>Soit explicitement :<br/>\( x_{k+1} = x_k - \\alpha \\left[ 2(x_k - 1) - 400x_k(y_k - x_k^2) \\right] \)<br/>\( y_{k+1} = y_k - \\alpha \\left[ 200(y_k - x_k^2) \\right] \)"
        },
        {
          "question": "2.3) Expliquer pourquoi la fonction de Rosenbrock est difficile à minimiser pour la descente de gradient.",
          "reponse": "La fonction de Rosenbrock présente un <strong>vallée étroite et courbe</strong>. Le gradient est presque orthogonal à la direction de la vallée, ce qui fait que la descente de gradient oscille d'un côté à l'autre de la vallée, avançant très lentement vers le minimum.<br/><br/>Les valeurs propres de la hessienne sont très différentes (mal conditionnement), avec un rapport pouvant atteindre 1000. La descente de gradient est très sensible au choix du pas \( \\alpha \) : un pas trop grand provoque des oscillations, un pas trop petit rend la convergence très lente."
        },
        {
          "question": "2.4) Comparer la descente de gradient, la méthode de Newton et la méthode BFGS pour ce type de problème.",
          "reponse": "<ul><li><strong>Descente de gradient</strong> : Convergence lente due au mauvais conditionnement. Nécessite un réglage fin du pas ou des méthodes adaptatives.</li><li><strong>Méthode de Newton</strong> : Convergence rapide (quadratique) mais nécessite le calcul et l'inversion de la hessienne. La hessienne peut être mal conditionnée, ce qui pose des problèmes numériques.</li><li><strong>Méthode BFGS</strong> : Bon compromis. Approxime la hessienne pour éviter son calcul et son inversion. Convergence superlinéaire. Particulièrement adaptée aux problèmes de grande dimension.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème d'Optimisation avec Contraintes",
      "points": "4 pts",
      "enonce": "<p>Un agriculteur camerounais souhaite maximiser sa production de maïs. La production \(P\) (en tonnes) en fonction de la surface cultivée \(x\) (en hectares) et de la quantité d'engrais \(y\) (en kg) est donnée par :</p><div class='math-block'><div class='math'>$$ P(x, y) = 2x - x^2 + 4y - y^2 + 2xy $$</div></div><p>L'agriculteur dispose d'un budget de 100 000 FCFA. Le coût d'un hectare est de 20 000 FCFA et le coût d'un kg d'engrais est de 10 000 FCFA.</p><ul><li><strong>Question 3.1</strong> : Écrire le problème d'optimisation sous contrainte.</li><li><strong>Question 3.2</strong> : Résoudre ce problème par la méthode du Lagrangien.</li><li><strong>Question 3.3</strong> : Interpréter économiquement le multiplicateur de Lagrange.</li></ul>",
      "questions": [
        {
          "question": "3.1) Écrire le problème d'optimisation sous contrainte.",
          "reponse": "Le problème est :<br/><br/>Maximiser \( P(x, y) = 2x - x^2 + 4y - y^2 + 2xy \)<br/><br/>Sous la contrainte budgétaire : \( 20 000x + 10 000y = 100 000 \)<br/><br/>Soit, en divisant par 10 000 : \( 2x + y = 10 \).<br/><br/>On a aussi \( x \\ge 0 \) et \( y \\ge 0 \)."
        },
        {
          "question": "3.2) Résoudre ce problème par la méthode du Lagrangien.",
          "reponse": "Le Lagrangien est : \( \\mathcal{L}(x, y, \\lambda) = 2x - x^2 + 4y - y^2 + 2xy + \\lambda(10 - 2x - y) \).<br/><br/>Les conditions du premier ordre (CPO) sont :<br/><br/>(1) \( \\frac{\\partial \\mathcal{L}}{\\partial x} = 2 - 2x + 2y - 2\\lambda = 0 \)<br/>(2) \( \\frac{\\partial \\mathcal{L}}{\\partial y} = 4 - 2y + 2x - \\lambda = 0 \)<br/>(3) \( \\frac{\\partial \\mathcal{L}}{\\partial \\lambda} = 10 - 2x - y = 0 \)<br/><br/>De (1) : \( 2 - 2x + 2y - 2\\lambda = 0 \\Rightarrow 1 - x + y - \\lambda = 0 \\Rightarrow \\lambda = 1 - x + y \)<br/><br/>De (2) : \( 4 - 2y + 2x - \\lambda = 0 \\Rightarrow \\lambda = 4 - 2y + 2x \)<br/><br/>Donc \( 1 - x + y = 4 - 2y + 2x \\Rightarrow 1 - x + y - 4 + 2y - 2x = 0 \\Rightarrow -3 - 3x + 3y = 0 \\Rightarrow y = x + 1 \).<br/><br/>La contrainte (3) donne : \( 10 - 2x - (x + 1) = 0 \\Rightarrow 9 - 3x = 0 \\Rightarrow x = 3 \).<br/><br/>Donc \( y = 4 \\).<br/><br/>La solution est \( (x^*, y^*) = (3, 4) \), avec \(\\lambda = 1 - 3 + 4 = 2\).<br/><br/>La production maximale est \( P(3, 4) = 6 - 9 + 16 - 16 + 24 = 21 \) tonnes."
        },
        {
          "question": "3.3) Interpréter économiquement le multiplicateur de Lagrange.",
          "reponse": "Le multiplicateur de Lagrange \( \\lambda = 2 \) représente le taux marginal de la production par rapport au budget.<br/><br/>Une augmentation de 1000 FCFA du budget (soit 0.1 dans l'unité simplifiée) augmenterait la production maximale d'environ \( 2 \\times 0.1 = 0.2 \) tonnes.<br/><br/>C'est le prix implicite du budget. Si l'agriculteur pouvait obtenir un financement supplémentaire, chaque tranche de 1000 FCFA supplémentaire rapporterait 0.2 tonne de maïs en plus."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Méthodes Multi-pas et Problèmes Raides",
      "points": "5 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
