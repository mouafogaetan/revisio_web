<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Méthodes Numériques et Calcul Scientifique - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse de la convergence de la méthode de Newton",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>On considère la méthode de Newton pour la recherche de racines d'une fonction <span style='font-style: italic;'>f</span> dérivable. Elle est définie par la suite :</p>\n  <div class='math-block' style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.1em; color: #1a1a1a;'>\n      $$ x_{n+1} = x_n - \\frac{f(x_n)}{f'(x_n)} $$\n    </div>\n  </div>\n  <p>Soit la fonction <span style='font-style: italic;'>f</span>(<span style='font-style: italic;'>x</span>) = <span style='font-style: italic;'>x</span>² − 4. Cette fonction possède une racine simple en <span style='font-style: italic;'>x</span>* = 2.</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>a)</strong> Appliquer une itération de la méthode de Newton à partir du point initial <span style='font-style: italic;'>x</span><sub>0</sub> = 3 pour trouver <span style='font-style: italic;'>x</span><sub>1</sub>.</li>\n    <li><strong>b)</strong> La méthode de Newton a-t-elle un ordre de convergence quadratique pour cette fonction ? Justifier brièvement.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "a) Calculer la dérivée de la fonction, puis appliquer la formule pour déterminer \\( x_1 \\).",
          "reponse": "La dérivée de \\( f(x) = x^2 - 4 \\) est \\( f'(x) = 2x \\).<br>En appliquant la formule de Newton :<br><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ x_1 = 3 - \\frac{3^2 - 4}{2 \\times 3} = 3 - \\frac{5}{6} = \\frac{13}{6} \\approx 2.1667 $$</div></div>"
        },
        {
          "question": "b) La méthode de Newton est-elle d'ordre de convergence quadratique pour cette fonction ? Justifier.",
          "reponse": "Oui. Comme la racine \\( x^* = 2 \\) est simple (c'est-à-dire que \\( f'(x^*) \\neq 0 \\)), l'ordre de convergence de la méthode de Newton est quadratique, à condition de partir d'une valeur initiale suffisamment proche de la racine."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application de la méthode de Newton à l'optimisation",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>La méthode de Newton peut être adaptée à l'optimisation de fonctions en remplaçant la dérivée par le gradient et la dérivée seconde par la Hessienne.</p>\n  <p>On souhaite minimiser la fonction <span style='font-style: italic;'>f</span>(<span style='font-style: italic;'>x</span>) = <span style='font-style: italic;'>x</span><sup>3</sup> − 3<span style='font-style: italic;'>x</span> + 2.</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>a)</strong> Calculer le gradient \\( f'(x) \\) et la Hessienne (ici un scalaire) \\( f''(x) \\).</li>\n    <li><strong>b)</strong> Appliquer une itération de Newton à partir de \\( x_0 = 1 \\) pour obtenir \\( x_1 \\).</li>\n    <li><strong>c)</strong> Cette itération approche-t-elle un point critique (minimum ou maximum) ? Justifier.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "a) Calculer \\( f'(x) \\) et \\( f''(x) \\).",
          "reponse": "<div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ f'(x) = 3x^2 - 3 $$</div></div><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ f''(x) = 6x $$</div></div>"
        },
        {
          "question": "b) Appliquer une itération de Newton à partir de \\( x_0 = 1 \\).",
          "reponse": "La méthode de Newton pour l'optimisation est : <span style='font-style: italic;'>x</span><sub>1</sub> = <span style='font-style: italic;'>x</span><sub>0</sub> − <span style='font-style: italic;'>f</span>'(<span style='font-style: italic;'>x</span><sub>0</sub>) / <span style='font-style: italic;'>f</span>''(<span style='font-style: italic;'>x</span><sub>0</sub>)<br>On a \\( f'(1) = 0 \\) et \\( f''(1) = 6 \\).<br>Donc :<br><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ x_1 = 1 - \\frac{0}{6} = 1 $$</div></div>"
        },
        {
          "question": "c) L'itération obtenue est-elle un point critique ? Quelle est sa nature ?",
          "reponse": "Oui, \\( x = 1 \\) est un point critique car \\( f'(1) = 0 \\).<br>Comme \\( f''(1) = 6 > 0 \\), il s'agit d'un minimum local. La méthode de Newton est restée bloquée à ce point dès la première itération."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Comparaison des méthodes de Quasi-Newton",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>Les méthodes de Quasi-Newton, comme BFGS, sont utilisées pour l'optimisation sans calcul direct de la Hessienne.</p>\n  <p>On considère une fonction coût \\( J(\\theta) \\) que l'on cherche à minimiser. On dispose d'une approximation initiale de la Hessienne inverse \\( H_0 = I \\) (matrice identité).</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>a)</strong> Quel est l'avantage principal de la méthode BFGS par rapport à la méthode de Newton pure ?</li>\n    <li><strong>b)</strong> La méthode L-BFGS est une variante de BFGS. Dans quel contexte est-elle particulièrement utile ?</li>\n    <li><strong>c)</strong> Si on a une fonction fortement non-linéaire avec une Hessienne qui varie beaucoup, laquelle des méthodes serait préférable et pourquoi ?</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "a) Quel est l'avantage principal de BFGS par rapport à la méthode de Newton pure ?",
          "reponse": "BFGS évite le calcul coûteux et parfois instable de la Hessienne. Il construit une approximation de la Hessienne inverse à partir des gradients, ce qui réduit le coût par itération."
        },
        {
          "question": "b) À quel type de problème s'adresse L-BFGS ?",
          "reponse": "L-BFGS (Limited-memory BFGS) est adapté aux problèmes de grande dimension où le stockage de la matrice Hessienne approximative serait trop coûteux en mémoire. Il ne stocke que quelques vecteurs de mise à jour."
        },
        {
          "question": "c) Quelle méthode serait préférable pour une fonction fortement non-linéaire avec une Hessienne variable ?",
          "reponse": "La méthode de Newton pure (ou Newton avec recherche de ligne) serait préférable, car elle utilise la Hessienne exacte, ce qui capture mieux la courbure locale de la fonction. BFGS peut être moins efficace si l'approximation de la Hessienne est trop lente à s'ajuster."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème de convergence de Newton en optimisation",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>La méthode de Newton pour l'optimisation peut parfois diverger ou converger vers un point de selle.</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>a)</strong> Quel est l'effet d'une Hessienne non définie positive sur la direction de Newton ?</li>\n    <li><strong>b)</strong> Que peut-on faire pour corriger ce problème et garantir une direction de descente ?</li>\n    <li><strong>c)</strong> Un des objectifs des méthodes de Quasi-Newton est de maintenir une approximation de la Hessienne définie positive. Expliquer pourquoi.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "a) Qu'arrive-t-il si la Hessienne n'est pas définie positive ?",
          "reponse": "La direction de Newton \\( d = -H^{-1} \\nabla f \\) n'est pas nécessairement une direction de descente (i.e., \\( \\nabla f^T d < 0 \\) peut ne pas être vérifié). La méthode peut diverger ou converger vers un point de selle ou un maximum."
        },
        {
          "question": "b) Comment corriger ce problème ?",
          "reponse": "On peut modifier la Hessienne en ajoutant un multiple de l'identité (régularisation) : \\( H_{\\text{mod}} = H + \\lambda I \\) avec \\( \\lambda > 0 \\) suffisamment grand pour rendre la matrice définie positive, ou utiliser des méthodes de région de confiance."
        },
        {
          "question": "c) Pourquoi les méthodes de Quasi-Newton maintiennent-elles une Hessienne définie positive ?",
          "reponse": "Pour garantir que la direction de recherche est toujours une direction de descente, ce qui assure une certaine stabilité et convergence de l'algorithme, en particulier pour les fonctions convexes."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Mise en œuvre de l'algorithme BFGS",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>On cherche à minimiser la fonction \\( f(x, y) = x^2 + 2y^2 \\). On part du point \\( (x_0, y_0) = (1, 1) \\). L'algorithme BFGS est lancé.</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>a)</strong> Calculer le gradient de \\( f \\) au point initial.</li>\n    <li><strong>b)</strong> Si la direction de descente trouvée par BFGS est \\( d = -\\nabla f \\) (cas d'une première itération), calculer le nouveau point après un pas de \\( \\alpha = 0.5 \\).</li>\n    <li><strong>c)</strong> Ce point est-il plus proche du minimum global \\( (0, 0) \\) ? Justifier.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "a) Calculer le gradient de \\( f \\) au point \\( (1, 1) \\).",
          "reponse": "Le gradient est : <br><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ \\nabla f(x, y) = (2x, 4y) $$</div></div><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ \\nabla f(1, 1) = (2, 4) $$</div></div>"
        },
        {
          "question": "b) Calculer le nouveau point avec la direction de descente et un pas de 0.5.",
          "reponse": "La direction de descente est \\( d = -\\nabla f(1, 1) = (-2, -4) \\).<br>Avec un pas \\( \\alpha = 0.5 \\), on a :<br><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ (x_1, y_1) = (1, 1) + 0.5 \\times (-2, -4) = (1 - 1, 1 - 2) = (0, -1) $$</div></div>"
        },
        {
          "question": "c) Le point \\( (0, -1) \\) est-il plus proche du minimum \\( (0, 0) \\) que \\( (1, 1) \\) ?",
          "reponse": "Oui. La norme au carré de \\( (1, 1) \\) est \\( 1^2 + 1^2 = 2 \\). Celle de \\( (0, -1) \\) est \\( 0^2 + (-1)^2 = 1 \\), ce qui est plus petit. La valeur de la fonction passe de \\( f(1,1) = 1 + 2 = 3 \\) à \\( f(0,-1) = 0 + 2(1) = 2 \\), donc la fonction a diminué."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
