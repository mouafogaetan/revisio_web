<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Méthodes Numériques et Calcul Scientifique - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Sequence 1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Arithmétique en Virgule Flottante et Erreurs",
     "points": "4 pts",
     "enonce": "<p>On considère les nombres suivants en base 10 : $x = 1.234$ et $y = 1.235$. On les représente en virgule flottante avec une mantisse de 4 chiffres décimaux significatifs.</p>",
     "questions": [
       {
         "question": "1) Donner la représentation en virgule flottante normalisée de $x$ et $y$ (écriture avec 4 chiffres significatifs).",
         "reponse": "<p>Pour $x = 1.234$, la représentation normalisée est $0.1234 \\times 10^1$.</p><p>Pour $y = 1.235$, la représentation normalisée est $0.1235 \\times 10^1$ (arrondi au plus proche).</p>"
       },
       {
         "question": "2) Calculer l'erreur absolue et l'erreur relative pour chaque nombre.",
         "reponse": "<p>Pour $x$ : Erreur absolue = $|1.234 - 1.234| = 0$ ; Erreur relative = $0$.</p><p>Pour $y$ : Erreur absolue = $|1.235 - 1.235| = 0$ ; Erreur relative = $0$.</p><p>Remarque : Dans ce cas précis, il n'y a pas d'erreur car les nombres sont représentés exactement avec la mantisse de 4 chiffres.</p>"
       },
       {
         "question": "3) Si on calcule $x - y$ avec ces représentations, quel résultat obtient-on ? En déduire l'erreur absolue et relative commise sur la différence. Que peut-on en conclure sur la stabilité de cette opération ?",
         "reponse": "<p>Avec les représentations : $0.1234 \\times 10^1 - 0.1235 \\times 10^1 = -0.0001 \\times 10^1 = -0.001$.</p><p>La valeur exacte de $x - y$ est $-0.001$. L'erreur absolue est $|-0.001 - (-0.001)| = 0$. L'erreur relative est $0$.</p><p>Conclusion : Ici, l'opération est stable car les deux nombres sont représentés exactement. Cependant, si les nombres étaient très proches et que leurs représentations étaient arrondies, on pourrait avoir une perte de précision (phénomène de cancellation).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Conditionnement d'un Problème",
     "points": "3 pts",
     "enonce": "<p>On considère la fonction $f(x) = \\sqrt{x}$.</p>",
     "questions": [
       {
         "question": "1) Calculer le nombre de conditionnement de cette fonction. Que signifie-t-il ?",
         "reponse": "<p>Le nombre de conditionnement de $f(x) = \\sqrt{x}$ est $\\kappa = \\left| \\frac{x f'(x)}{f(x)} \\right| = \\left| \\frac{x \\cdot \\frac{1}{2\\sqrt{x}}}{\\sqrt{x}} \\right| = \\frac{1}{2}$.</p><p>Un nombre de conditionnement de $0.5$ signifie que le problème est bien conditionné. Une erreur relative sur $x$ sera réduite d'un facteur 2 sur $f(x)$.</p>"
       },
       {
         "question": "2) Si on approxime $x = 4$ par $\\tilde{x} = 4.01$, estimer l'erreur relative sur $f(x)$.",
         "reponse": "<p>Erreur relative sur $x$ : $\\frac{|4.01 - 4|}{4} = 0.0025$.</p><p>Erreur relative sur $f(x)$ : $\\kappa \\times 0.0025 = 0.5 \\times 0.0025 = 0.00125$.</p><p>Donc $f(\\tilde{x}) \\approx \\sqrt{4.01} \\approx 2.0025$ (valeur exacte $\\sqrt{4.01} \\approx 2.002497$).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Résolution d'un Système Linéaire",
     "points": "6 pts",
     "enonce": "<p>On considère le système linéaire suivant :</p><div class='math-block'><div class='math'>\\begin{cases} x + 2y = 5 \\\\ 3x + 4y = 13 \\end{cases}</div></div>",
     "questions": [
       {
         "question": "1) Résoudre ce système par la méthode d'élimination de Gauss.",
         "reponse": "<p>Élimination de Gauss :</p><p>Ligne 2 ← Ligne 2 - 3 × Ligne 1 :</p><p>$(3 - 3)x + (4 - 6)y = 13 - 15$</p><p>$-2y = -2 \\Rightarrow y = 1$</p><p>Remontée : $x + 2(1) = 5 \\Rightarrow x = 3$.</p><p>Solution : $\\boxed{x = 3, y = 1}$.</p>"
       },
       {
         "question": "2) Écrire le système sous forme matricielle $A\\mathbf{x} = \\mathbf{b}$ et déterminer la décomposition LU de $A$.",
         "reponse": "<p>$A = \\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}$, $\\mathbf{x} = \\begin{pmatrix} x \\\\ y \\end{pmatrix}$, $\\mathbf{b} = \\begin{pmatrix} 5 \\\\ 13 \\end{pmatrix}$.</p><p>Décomposition LU :</p><p>Multiplicateur $l_{21} = a_{21}/a_{11} = 3/1 = 3$.</p><p>$U = \\begin{pmatrix} 1 & 2 \\\\ 0 & -2 \\end{pmatrix}$, $L = \\begin{pmatrix} 1 & 0 \\\\ 3 & 1 \\end{pmatrix}$.</p><p>Vérification : $LU = A$.</p>"
       },
       {
         "question": "3) Utiliser la décomposition LU pour résoudre le système.",
         "reponse": "<p>Résoudre $L\\mathbf{y} = \\mathbf{b}$ :</p><p>$\\begin{pmatrix} 1 & 0 \\\\ 3 & 1 \\end{pmatrix} \\begin{pmatrix} y_1 \\\\ y_2 \\end{pmatrix} = \\begin{pmatrix} 5 \\\\ 13 \\end{pmatrix}$</p><p>$y_1 = 5$ ; $3y_1 + y_2 = 13 \\Rightarrow 15 + y_2 = 13 \\Rightarrow y_2 = -2$.</p><p>Résoudre $U\\mathbf{x} = \\mathbf{y}$ :</p><p>$\\begin{pmatrix} 1 & 2 \\\\ 0 & -2 \\end{pmatrix} \\begin{pmatrix} x \\\\ y \\end{pmatrix} = \\begin{pmatrix} 5 \\\\ -2 \\end{pmatrix}$</p><p>$-2y = -2 \\Rightarrow y = 1$ ; $x + 2(1) = 5 \\Rightarrow x = 3$.</p><p>Solution : $\\boxed{x = 3, y = 1}$.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Méthodes Itératives (Jacobi et Gauss-Seidel)",
     "points": "7 pts",
     "enonce": "<p>On considère le système linéaire suivant :</p><div class='math-block'><div class='math'>\\begin{cases} 4x - y = 1 \\\\ -x + 4y - z = 2 \\\\ -y + 4z = 3 \\end{cases}</div></div>",
     "questions": [
       {
         "question": "1) Vérifier que la matrice du système est à diagonale strictement dominante.",
         "reponse": "<p>Matrice du système : $A = \\begin{pmatrix} 4 & -1 & 0 \\\\ -1 & 4 & -1 \\\\ 0 & -1 & 4 \\end{pmatrix}$.</p><p>Vérification de la dominance diagonale :</p><p>Ligne 1 : $|4| = 4 > |-1| + |0| = 1$.</p><p>Ligne 2 : $|4| = 4 > |-1| + |-1| = 2$.</p><p>Ligne 3 : $|4| = 4 > |-1| + |0| = 1$.</p><p>La matrice est à diagonale strictement dominante, donc les méthodes de Jacobi et Gauss-Seidel convergent.</p>"
       },
       {
         "question": "2) Écrire les schémas itératifs de Jacobi pour ce système.",
         "reponse": "<p>Schéma de Jacobi :</p><p>$x^{(k+1)} = \\frac{1 + y^{(k)}}{4}$</p><p>$y^{(k+1)} = \\frac{2 + x^{(k)} + z^{(k)}}{4}$</p><p>$z^{(k+1)} = \\frac{3 + y^{(k)}}{4}$</p>"
       },
       {
         "question": "3) Effectuer les deux premières itérations de Jacobi avec $\\mathbf{x}^{(0)} = (0, 0, 0)^T$.",
         "reponse": "<p>Itération 1 :</p><p>$x^{(1)} = \\frac{1 + 0}{4} = 0.25$</p><p>$y^{(1)} = \\frac{2 + 0 + 0}{4} = 0.5$</p><p>$z^{(1)} = \\frac{3 + 0}{4} = 0.75$</p><p>Itération 2 :</p><p>$x^{(2)} = \\frac{1 + 0.5}{4} = 0.375$</p><p>$y^{(2)} = \\frac{2 + 0.25 + 0.75}{4} = 0.75$</p><p>$z^{(2)} = \\frac{3 + 0.5}{4} = 0.875$</p><p>La solution exacte est $x = y = z = 1$. Les itérations convergent vers cette solution.</p>"
       },
       {
         "question": "4) Écrire le schéma itératif de Gauss-Seidel pour ce système.",
         "reponse": "<p>Schéma de Gauss-Seidel :</p><p>$x^{(k+1)} = \\frac{1 + y^{(k)}}{4}$</p><p>$y^{(k+1)} = \\frac{2 + x^{(k+1)} + z^{(k)}}{4}$</p><p>$z^{(k+1)} = \\frac{3 + y^{(k+1)}}{4}$</p><p>Remarque : On utilise les valeurs les plus récentes dès qu'elles sont disponibles.</p>"
       },
       {
         "question": "5) Effectuer les deux premières itérations de Gauss-Seidel avec $\\mathbf{x}^{(0)} = (0, 0, 0)^T$.",
         "reponse": "<p>Itération 1 :</p><p>$x^{(1)} = \\frac{1 + 0}{4} = 0.25$</p><p>$y^{(1)} = \\frac{2 + 0.25 + 0}{4} = 0.5625$</p><p>$z^{(1)} = \\frac{3 + 0.5625}{4} = 0.890625$</p><p>Itération 2 :</p><p>$x^{(2)} = \\frac{1 + 0.5625}{4} = 0.390625$</p><p>$y^{(2)} = \\frac{2 + 0.390625 + 0.890625}{4} = 0.8203125$</p><p>$z^{(2)} = \\frac{3 + 0.8203125}{4} = 0.955078125$</p><p>On constate que Gauss-Seidel converge plus rapidement que Jacobi vers la solution $x = y = z = 1$.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
