<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Méthodes Numériques et Calcul Scientifique - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Intégration Numérique (6 pts)",
      "points": "6 pts",
      "enonce": "<p>On cherche à évaluer numériquement l'intégrale suivante :</p><div class='math-block'><div class='math'>$$ I = \\int_{0}^{1} \\frac{1}{1+x^2} \\, dx $$</div></div><p>Cette intégrale est l'archétype de celles que l'on rencontre en physique et en statistique. Votre mission est de la calculer avec différentes méthodes de quadrature.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Calculer la valeur exacte de l'intégrale <span class='math-inline'>\\( I \\)</span> en utilisant le fait que la primitive de <span class='math-inline'>\\( 1/(1+x^2) \\)</span> est <span class='math-inline'>\\( \\arctan(x) \\)</span>.</p>",
          "reponse": "<p>La valeur exacte de l'intégrale est :</p><div class='math-block'><div class='math'>$$ I_{\\text{exact}} = \\left[ \\arctan(x) \\right]_0^1 = \\arctan(1) - \\arctan(0) = \\frac{\\pi}{4} \\approx 0.7853981633974483 $$</div></div>"
        },
        {
          "question": "<p><strong>2. (4 pts)</strong> Appliquer successivement la méthode des trapèzes et la méthode de Simpson pour approcher la valeur de <span class='math-inline'>\\( I \\)</span>.</p><ul><li><strong>a.</strong> Avec un seul intervalle (<span class='math-inline'>\\( n=1 \\)</span>) pour la méthode des trapèzes.</li><li><strong>b.</strong> Avec deux intervalles (<span class='math-inline'>\\( n=2 \\)</span>) pour la méthode de Simpson.</li><li><strong>c.</strong> Calculer l'erreur absolue pour chaque approximation. Conclure sur la précision relative des deux méthodes.</li></ul>",
          "reponse": "<p><strong>a. (1 pt)</strong> Avec un seul intervalle, la méthode des trapèzes donne :</p><div class='math-block'><div class='math'>$$ T_1 = \\frac{b-a}{2} \\left( f(a) + f(b) \\right) = \\frac{1-0}{2} \\left( \\frac{1}{1+0^2} + \\frac{1}{1+1^2} \\right) = \\frac{1}{2} \\left( 1 + \\frac{1}{2} \\right) = \\frac{3}{4} = 0.75 $$</div></div><p><strong>b. (1.5 pts)</strong> Avec deux intervalles, la méthode de Simpson s'écrit :</p><div class='math-block'><div class='math'>$$ S_2 = \\frac{h}{3} \\left( f(x_0) + 4f(x_1) + f(x_2) \\right) $$</div></div><p>Avec <span class='math-inline'>\\( h = (1-0)/2 = 0.5 \\)</span>, <span class='math-inline'>\\( x_0=0 \\)</span>, <span class='math-inline'>\\( x_1=0.5 \\)</span>, <span class='math-inline'>\\( x_2=1 \\)</span>.</p><div class='math-block'><div class='math'>$$ S_2 = \\frac{0.5}{3} \\left( 1 + 4 \\times \\frac{1}{1+0.5^2} + \\frac{1}{2} \\right) = \\frac{1}{6} \\left( 1.5 + 4 \\times 0.8 \\right) = \\frac{1}{6} \\left( 1.5 + 3.2 \\right) = \\frac{4.7}{6} \\approx 0.7833333333333333 $$</div></div><p><strong>c. (1.5 pts)</strong> Les erreurs absolues sont :</p><ul><li>Erreur Trapèzes : <span class='math-inline'>\\( |0.75 - 0.785398| \\approx 0.0354 \\)</span></li><li>Erreur Simpson : <span class='math-inline'>\\( |0.783333 - 0.785398| \\approx 0.00206 \\)</span></li></ul><p>La méthode de Simpson est nettement plus précise que celle des trapèzes pour un même nombre d'intervalles car son ordre d'erreur est plus élevé.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations Différentielles et Modèles (7 pts)",
      "points": "7 pts",
      "enonce": "<p>La modélisation de la propagation d'une épidémie peut se faire à l'aide du modèle SIR (Susceptibles, Infectieux, Retirés). Le système d'équations différentielles suivant décrit la dynamique :</p><div class='math-block'><div class='math'>$$ \\begin{cases} \\frac{dS}{dt} = -\\beta S I \\\\ \\frac{dI}{dt} = \\beta S I - \\gamma I \\\\ \\frac{dR}{dt} = \\gamma I \\end{cases} $$</div></div><p>Avec les conditions initiales <span class='math-inline'>\\( S(0) = S_0 \\)</span>, <span class='math-inline'>\\( I(0) = I_0 \\)</span>, <span class='math-inline'>\\( R(0) = 0 \\)</span>. On prendra <span class='math-inline'>\\( \\beta = 0.3 \\)</span>, <span class='math-inline'>\\( \\gamma = 0.1 \\)</span>, <span class='math-inline'>\\( S_0 = 0.99 \\)</span> et <span class='math-inline'>\\( I_0 = 0.01 \\)</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1.5 pts)</strong> En analysant les équations, que représentent physiquement les paramètres <span class='math-inline'>\\( \\beta \\)</span> et <span class='math-inline'>\\( \\gamma \\)</span> ?</p>",
          "reponse": "<p>Le paramètre <span class='math-inline'>\\( \\beta \\)</span> est le taux de transmission de la maladie, représentant la probabilité qu'un individu susceptible entre en contact avec un individu infectieux et soit contaminé. Le paramètre <span class='math-inline'>\\( \\gamma \\)</span> est le taux de guérison, indiquant la vitesse à laquelle les infectieux quittent le compartiment <span class='math-inline'>\\( I \\)</span> pour rejoindre <span class='math-inline'>\\( R \\)</span>.</p>"
        },
        {
          "question": "<p><strong>2. (3 pts)</strong> Appliquer une étape de la méthode d'Euler explicite avec un pas de temps <span class='math-inline'>\\( h = 1 \\)</span> pour calculer les valeurs de <span class='math-inline'>\\( S(1) \\)</span>, <span class='math-inline'>\\( I(1) \\)</span> et <span class='math-inline'>\\( R(1) \\)</span>.</p>",
          "reponse": "<p>La méthode d'Euler explicite s'écrit :</p><div class='math-block'><div class='math'>$$ \\begin{cases} S_{n+1} = S_n + h \\cdot (-\\beta S_n I_n) \\\\ I_{n+1} = I_n + h \\cdot (\\beta S_n I_n - \\gamma I_n) \\\\ R_{n+1} = R_n + h \\cdot (\\gamma I_n) \\end{cases} $$</div></div><p>En appliquant avec <span class='math-inline'>\\( h=1 \\)</span> pour <span class='math-inline'>\\( n=0 \\)</span> (à <span class='math-inline'>\\( t=0 \\)</span>) :</p><ul><li><span class='math-inline'>\\( S(1) = S(0) + 1 \\cdot (-0.3 \\times 0.99 \\times 0.01) = 0.99 - 0.00297 = 0.98703 \\)</span></li><li><span class='math-inline'>\\( I(1) = 0.01 + 1 \\cdot (0.3 \\times 0.99 \\times 0.01 - 0.1 \\times 0.01) = 0.01 + 0.00297 - 0.001 = 0.01197 \\)</span></li><li><span class='math-inline'>\\( R(1) = 0 + 1 \\cdot (0.1 \\times 0.01) = 0.001 \\)</span></li></ul>"
        },
        {
          "question": "<p><strong>3. (2.5 pts)</strong> Expliquer pourquoi, pour un modèle raide (stiff) comme celui-ci, la méthode d'Euler explicite nécessite un pas de temps très petit. Proposer une alternative numérique plus stable.</p>",
          "reponse": "<p>Le modèle SIR peut devenir raide, notamment lorsque les taux de transmission et de guérison diffèrent fortement. Dans ce cas, la méthode d'Euler explicite, qui est conditionnellement stable, impose une condition de stabilité sévère : <span class='math-inline'>\\( h < 2 / \\lambda_{\\max} \\)</span> où <span class='math-inline'>\\( \\lambda_{\\max} \\)</span> est la plus grande valeur propre du système linéarisé. Si cette condition n'est pas respectée, les solutions numériques divergent ou oscillent de manière non physique. Une alternative consiste à utiliser une méthode implicite, comme Euler implicite, ou une méthode de Runge-Kutta adaptative, qui offrent de meilleures propriétés de stabilité.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Optimisation Numérique (7 pts)",
      "points": "7 pts",
      "enonce": "<p>On considère la fonction de Rosenbrock, souvent utilisée comme test pour les algorithmes d'optimisation :</p><div class='math-block'><div class='math'>$$ f(x, y) = (1 - x)^2 + 100(y - x^2)^2 $$</div></div><p>Cette fonction est connue pour son \"vallée\" en forme de banane, ce qui la rend difficile à minimiser pour les algorithmes de descente de gradient simples.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Calculer le gradient de cette fonction, <span class='math-inline'>\\( \\nabla f(x, y) = \\left( \\frac{\\partial f}{\\partial x}, \\frac{\\partial f}{\\partial y} \\right) \\)</span>. Montrer que le point minimum global est <span class='math-inline'>\\( (1,1) \\)</span>.</p>",
          "reponse": "<p>Les dérivées partielles sont :</p><div class='math-block'><div class='math'>$$ \\frac{\\partial f}{\\partial x} = -2(1-x) - 400x(y - x^2) $$</div></div><div class='math-block'><div class='math'>$$ \\frac{\\partial f}{\\partial y} = 200(y - x^2) $$</div></div><p>Au point <span class='math-inline'>\\( (x,y) = (1,1) \\)</span>, on a <span class='math-inline'>\\( \\partial f / \\partial y = 200(1 - 1) = 0 \\)</span> et <span class='math-inline'>\\( \\partial f / \\partial x = -2(0) - 400 \\cdot 1 \\cdot 0 = 0 \\)</span>. Le gradient est nul, ce qui en fait un point stationnaire. De plus, <span class='math-inline'>\\( f(1,1) = 0 \\)</span>, et la fonction est positive pour tout <span class='math-inline'>\\( (x,y) \\)</span> car elle est la somme de carrés. Il s'agit donc bien du minimum global.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Donner l'expression de l'itération de la méthode du gradient (ou descente de gradient) à pas fixe pour minimiser cette fonction. Est-il facile de choisir un pas <span class='math-inline'>\\( \\alpha \\)</span> approprié pour cette fonction ? Justifier.</p>",
          "reponse": "<p>L'itération de la descente de gradient s'écrit :</p><div class='math-block'><div class='math'>$$ \\mathbf{x}_{k+1} = \\mathbf{x}_k - \\alpha \\nabla f(\\mathbf{x}_k) $$</div></div><p>Il est difficile de choisir un pas <span class='math-inline'>\\( \\alpha \\)</span> fixe pour la fonction de Rosenbrock. La vallée est très étroite : le gradient est très raide dans une direction et très faible dans l'autre. Un pas trop grand fait sortir de la vallée, un pas trop petit entraîne une convergence extrêmement lente. C'est une illustration classique du mauvais conditionnement en optimisation.</p>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> Proposer une méthode de descente de gradient améliorée pour résoudre ce problème d'optimisation. Expliquer son principe et pourquoi elle est plus efficace sur ce type de fonction.</p>",
          "reponse": "<p>Plusieurs améliorations sont possibles. La méthode de Newton, qui utilise l'inverse de la Hessienne, est très efficace car elle tient compte de la courbure de la fonction. La méthode BFGS, une méthode quasi-Newton, approche la Hessienne pour éviter de la calculer explicitement. Ces méthodes sont plus efficaces car elles adaptent la direction de descente à la géométrie locale de la fonction, contrairement à la descente de gradient qui avance perpendiculairement aux courbes de niveau. L'utilisation d'une recherche de ligne (line search) pour déterminer le pas <span class='math-inline'>\\( \\alpha \\)</span> à chaque itération est également une amélioration cruciale.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
