<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Méthodes Numériques et Calcul Scientifique",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique en Virgule Flottante et Stabilité (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les erreurs numériques et la stabilité des algorithmes.</p>",
      "questions": [
        {
          "question": "<p>1) Expliquez la différence entre l'erreur absolue et l'erreur relative. Donnez un exemple concret où l'erreur relative est plus pertinente que l'erreur absolue. (1.5 pt)</p>",
          "reponse": "<p>L'<strong>erreur absolue</strong> est la valeur absolue de la différence entre la valeur approchée et la valeur exacte : \( |x - x_{exact}| \). L'<strong>erreur relative</strong> est le rapport de l'erreur absolue sur la valeur exacte : \( \\frac{|x - x_{exact}|}{|x_{exact}|} \). L'erreur relative est plus pertinente lorsque les grandeurs sont de tailles très différentes. Par exemple, une erreur de 1 cm sur une distance de 1 km est négligeable en relatif (0.001%), mais une erreur de 1 cm sur une distance de 10 cm est très importante (10%).</p>"
        },
        {
          "question": "<p>2) Qu'est-ce qu'un algorithme numériquement stable ? Donnez un exemple d'algorithme instable et expliquez pourquoi il est instable. (2.5 pts)</p>",
          "reponse": "<p>Un algorithme est <strong>numériquement stable</strong> si les erreurs d'arrondi introduites pendant le calcul ne sont pas amplifiées de manière excessive, c'est-à-dire si une petite perturbation en entrée ou en cours de calcul entraîne une petite perturbation en sortie [citation:1].</p><p>Un exemple classique d'algorithme instable est le calcul de \( e^{-x} \) pour \( x \) grand en utilisant la série de Taylor \( e^{-x} = 1 - x + \\frac{x^2}{2} - \\cdots \). Pour \( x \) grand, les termes sont alternés et de grande amplitude avant de s'annuler. Les erreurs d'arrondi sur ces grands termes sont ensuite amplifiées. Une approche stable consiste à utiliser \( e^{-x} = 1 / e^{x} \).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Résolution de Systèmes Linéaires (6 pts)",
      "points": "6 pts",
      "enonce": "<p>On considère le système linéaire \( A X = B \) où \( A = \\begin{pmatrix} 4 & 1 \\\\ 2 & 3 \\end{pmatrix} \) et \( B = \\begin{pmatrix} 5 \\\\ 4 \\end{pmatrix} \).</p>",
      "questions": [
        {
          "question": "<p>1) Résoudre le système en utilisant la décomposition LU (sans pivotage). (2 pts)</p>",
          "reponse": "<p>On cherche \( L \) et \( U \) telles que \( A = LU \), avec \( L \) triangulaire inférieure (diagonale 1) et \( U \) triangulaire supérieure.</p><p>On a : \( U = A \) et on élimine le coefficient \( a_{21} = 2 \) en utilisant \( l_{21} = a_{21}/a_{11} = 2/4 = 0.5 \).</p><p>On soustrait \( 0.5 \\times L_1 \) à \( L_2 \) : \( U = \\begin{pmatrix} 4 & 1 \\\\ 0 & 3 - 0.5 \\times 1 \\end{pmatrix} = \\begin{pmatrix} 4 & 1 \\\\ 0 & 2.5 \\end{pmatrix} \).</p><p>Donc \( L = \\begin{pmatrix} 1 & 0 \\\\ 0.5 & 1 \\end{pmatrix} \) et \( U = \\begin{pmatrix} 4 & 1 \\\\ 0 & 2.5 \\end{pmatrix} \).</p><p>On résout \( LY = B \) : \( y_1 = 5 \), puis \( 0.5 \\times 5 + y_2 = 4 \\Rightarrow y_2 = 1.5 \).</p><p>On résout \( UX = Y \) : \( 4x_1 + x_2 = 5 \) et \( 2.5 x_2 = 1.5 \\Rightarrow x_2 = 0.6 \).</p><p>On remplace : \( 4x_1 + 0.6 = 5 \\Rightarrow x_1 = 1.1 \).</p><p>La solution est \( X = \\begin{pmatrix} 1.1 \\\\ 0.6 \\end{pmatrix} \).</p>"
        },
        {
          "question": "<p>2) Appliquer la méthode de Jacobi sur ce système, en effectuant 2 itérations à partir du vecteur initial \( X^{(0)} = (0, 0)^T \). (2 pts)</p>",
          "reponse": "<p>Les équations de Jacobi pour ce système sont :</p><p>\( x_1^{(k+1)} = \\frac{5 - x_2^{(k)}}{4} \)</p><p>\( x_2^{(k+1)} = \\frac{4 - 2 x_1^{(k)}}{3} \)</p><p><strong>Itération 1 :</strong> \( x_1^{(1)} = \\frac{5 - 0}{4} = 1.25 \), \( x_2^{(1)} = \\frac{4 - 2 \\times 0}{3} = 1.3333 \).</p><p><strong>Itération 2 :</strong> \( x_1^{(2)} = \\frac{5 - 1.3333}{4} = 0.9167 \), \( x_2^{(2)} = \\frac{4 - 2 \\times 1.25}{3} = 0.5 \).</p><p>Donc \( X^{(1)} = (1.25, 1.3333)^T \) et \( X^{(2)} = (0.9167, 0.5)^T \).</p>"
        },
        {
          "question": "<p>3) Appliquer la méthode de Gauss-Seidel sur ce système, en effectuant 2 itérations à partir de \( X^{(0)} = (0, 0)^T \). (2 pts)</p>",
          "reponse": "<p>Les équations de Gauss-Seidel sont :</p><p>\( x_1^{(k+1)} = \\frac{5 - x_2^{(k)}}{4} \)</p><p>\( x_2^{(k+1)} = \\frac{4 - 2 x_1^{(k+1)}}{3} \)</p><p><strong>Itération 1 :</strong> \( x_1^{(1)} = \\frac{5 - 0}{4} = 1.25 \), \( x_2^{(1)} = \\frac{4 - 2 \\times 1.25}{3} = 0.5 \).</p><p><strong>Itération 2 :</strong> \( x_1^{(2)} = \\frac{5 - 0.5}{4} = 1.125 \), \( x_2^{(2)} = \\frac{4 - 2 \\times 1.125}{3} = 0.5833 \).</p><p>Donc \( X^{(1)} = (1.25, 0.5)^T \) et \( X^{(2)} = (1.125, 0.5833)^T \).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Intégration Numérique (5 pts)",
      "points": "5 pts",
      "enonce": "<p>On souhaite calculer numériquement l'intégrale \( I = \\int_0^1 x^2 dx \) en utilisant différentes méthodes.</p>",
      "questions": [
        {
          "question": "<p>1) Calculer la valeur exacte de l'intégrale. (1 pt)</p>",
          "reponse": "<p>\( I = \\int_0^1 x^2 dx = \\left[ \\frac{x^3}{3} \\right]_0^1 = \\frac{1}{3} \\approx 0.333333 \).</p>"
        },
        {
          "question": "<p>2) Calculer une approximation de \( I \) en utilisant la méthode des trapèzes avec \( n = 4 \) sous-intervalles. (2 pts)</p>",
          "reponse": "<p>Le pas est \( h = \\frac{1 - 0}{4} = 0.25 \). Les points sont : \( x_0 = 0, x_1 = 0.25, x_2 = 0.5, x_3 = 0.75, x_4 = 1 \).</p><p>\( f(x) = x^2 \).</p><p>\( f(0) = 0 \\), \( f(0.25) = 0.0625 \\), \( f(0.5) = 0.25 \\), \( f(0.75) = 0.5625 \\), \( f(1) = 1 \).</p><p>La méthode des trapèzes :</p><p>\( I_{trap} = h \\left( \\frac{f(0) + f(1)}{2} + f(0.25) + f(0.5) + f(0.75) \\right) \)</p><p>\( I_{trap} = 0.25 \\left( \\frac{0 + 1}{2} + 0.0625 + 0.25 + 0.5625 \\right) = 0.25 \\times (0.5 + 0.875) = 0.25 \\times 1.375 = 0.34375 \).</p><p>L'erreur est \( 0.34375 - 0.333333 = 0.010417 \\).</p>"
        },
        {
          "question": "<p>3) Calculer une approximation de \( I \) en utilisant la méthode de Simpson avec \( n = 4 \) sous-intervalles. (2 pts)</p>",
          "reponse": "<p>La méthode de Simpson avec \( n = 4 \) est :</p><p>\( I_{Simp} = \\frac{h}{3} \\left( f(0) + f(1) + 4(f(0.25) + f(0.75)) + 2f(0.5) \\right) \)</p><p>\( I_{Simp} = \\frac{0.25}{3} \\left( 0 + 1 + 4(0.0625 + 0.5625) + 2(0.25) \\right) \)</p><p>\( I_{Simp} = \\frac{0.25}{3} \\left( 1 + 4 \\times 0.625 + 0.5 \\right) = \\frac{0.25}{3} \\times (1 + 2.5 + 0.5) = \\frac{0.25}{3} \\times 4 = \\frac{1}{3} = 0.333333 \).</p><p>La méthode de Simpson donne la valeur exacte car la fonction est un polynôme de degré 2 et Simpson est exacte pour les polynômes de degré ≤ 3.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Méthodes de Puissance et QR (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Soit la matrice \( A = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} \).</p>",
      "questions": [
        {
          "question": "<p>1) Calculer les valeurs propres de la matrice \( A \). (1 pt)</p>",
          "reponse": "<p>On calcule le polynôme caractéristique : \( \\det(A - \\lambda I) = \\begin{vmatrix} 2-\\lambda & 1 \\\\ 1 & 2-\\lambda \\end{vmatrix} = (2-\\lambda)^2 - 1 = \\lambda^2 - 4\\lambda + 3 = (\\lambda - 1)(\\lambda - 3) \).</p><p>Les valeurs propres sont \( \\lambda_1 = 1 \) et \( \\lambda_2 = 3 \).</p>"
        },
        {
          "question": "<p>2) Appliquer la méthode de la puissance à la matrice \( A \) à partir du vecteur initial \( X^{(0)} = (1, 0)^T \). Effectuer 2 itérations et donner l'estimation de la plus grande valeur propre. (2 pts)</p>",
          "reponse": "<p><strong>Itération 1 :</strong></p><p>\( Y^{(1)} = A X^{(0)} = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix} = \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} \).</p><p>Normalisation : \( \\|Y^{(1)}\\|_{\\infty} = 2 \\).</p><p>\( X^{(1)} = \\frac{1}{2} \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} 1 \\\\ 0.5 \\end{pmatrix} \).</p><p>Estimation de la valeur propre : \( \\lambda^{(1)} = \\frac{(X^{(0)})^T A X^{(0)}}{(X^{(0)})^T X^{(0)}} = \\frac{(1,0) \\cdot (2,1)^T}{1} = 2 \).</p><p><strong>Itération 2 :</strong></p><p>\( Y^{(2)} = A X^{(1)} = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} \\begin{pmatrix} 1 \\\\ 0.5 \\end{pmatrix} = \\begin{pmatrix} 2.5 \\\\ 2 \\end{pmatrix} \).</p><p>Normalisation : \( \\|Y^{(2)}\\|_{\\infty} = 2.5 \).</p><p>\( X^{(2)} = \\frac{1}{2.5} \\begin{pmatrix} 2.5 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 1 \\\\ 0.8 \\end{pmatrix} \).</p><p>Estimation de la valeur propre : \( \\lambda^{(2)} = \\frac{(X^{(1)})^T A X^{(1)}}{(X^{(1)})^T X^{(1)}} \).</p><p>\( A X^{(1)} = \\begin{pmatrix} 2.5 \\\\ 2 \\end{pmatrix} \).</p><p>\( \\lambda^{(2)} = \\frac{(1, 0.5) \\cdot (2.5, 2)^T}{1 + 0.25} = \\frac{2.5 + 1}{1.25} = \\frac{3.5}{1.25} = 2.8 \).</p><p>La méthode converge vers la plus grande valeur propre \( \\lambda = 3 \).</p>"
        },
        {
          "question": "<p>3) Donner la décomposition QR de la matrice \( A \). (2 pts)</p>",
          "reponse": "<p>On utilise l'orthonormalisation de Gram-Schmidt sur les colonnes de \( A \).</p><p>Colonne 1 : \( v_1 = (2, 1)^T \\). Norme \( \\|v_1\\| = \\sqrt{4 + 1} = \\sqrt{5} \\).</p><p>\( q_1 = \\frac{1}{\\sqrt{5}} \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} \).</p><p>Colonne 2 : \( v_2 = (1, 2)^T \\). Projection sur \( q_1 \) : \( (v_2 \\cdot q_1) q_1 = \\frac{2 \\times 1 + 1 \\times 2}{\\sqrt{5}} q_1 = \\frac{4}{\\sqrt{5}} \\times \\frac{1}{\\sqrt{5}} \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} = \\frac{4}{5} \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} 1.6 \\\\ 0.8 \\end{pmatrix} \).</p><p>\( u_2 = v_2 - \\begin{pmatrix} 1.6 \\\\ 0.8 \\end{pmatrix} = \\begin{pmatrix} -0.6 \\\\ 1.2 \\end{pmatrix} \\). Norme \( \\|u_2\\| = \\sqrt{0.36 + 1.44} = \\sqrt{1.8} \\).</p><p>\( q_2 = \\frac{1}{\\sqrt{1.8}} \\begin{pmatrix} -0.6 \\\\ 1.2 \\end{pmatrix} = \\begin{pmatrix} -0.4472 \\\\ 0.8944 \\end{pmatrix} \).</p><p>Donc \( Q = \\begin{pmatrix} \\frac{2}{\\sqrt{5}} & -\\frac{0.6}{\\sqrt{1.8}} \\\\ \\frac{1}{\\sqrt{5}} & \\frac{1.2}{\\sqrt{1.8}} \\end{pmatrix} \).</p><p>\( R = Q^T A = \\begin{pmatrix} \\frac{2}{\\sqrt{5}} & \\frac{1}{\\sqrt{5}} \\\\ -\\frac{0.6}{\\sqrt{1.8}} & \\frac{1.2}{\\sqrt{1.8}} \\end{pmatrix} \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} = \\begin{pmatrix} \\sqrt{5} & \\frac{4}{\\sqrt{5}} \\\\ 0 & \\frac{3}{\\sqrt{1.8}} \\end{pmatrix} \).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
