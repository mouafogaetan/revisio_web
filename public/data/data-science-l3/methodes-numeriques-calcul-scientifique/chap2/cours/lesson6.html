<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Objectifs du cours :</p><ul style='color: #0b3d5c; margin-bottom: 0;'><li>Comprendre les méthodes de gradient pour résoudre \( Ax = b \).</li><li>Découvrir la descente de gradient et le gradient conjugué.</li><li>Analyser leur convergence.</li><li>Introduction aux préconditionneurs.</li></ul></div><div style='background: #fff3cd; padding: 15px; border-radius: 10px; border-left: 5px solid #ffc107;'><p style='color: #856404; margin: 0;'><strong>Contexte :</strong> Nous savons résoudre \( Ax = b \) avec Gauss (Chap. 4). Ces méthodes sont exactes mais coûteuses pour les grandes matrices. Les méthodes itératives (Jacobi, GS) sont alternatives. Les méthodes de gradient sont une autre famille d'itératives, très puissantes pour les matrices symétriques définies positives (souvent rencontrées en Data Science).</p></div>",
    "texteParle": "Bonjour à tous. Bienvenue dans ce nouveau chapitre sur les méthodes de gradient pour les systèmes linéaires. Dans cette leçon, nous allons explorer une famille d'algorithmes itératifs particulièrement efficace pour résoudre les grands systèmes d'équations, un problème central en Data Science. Nous verrons comment utiliser la direction du gradient pour converger vers la solution, et nous introduirons des techniques avancées comme le gradient conjugué et les préconditionneurs.",
    "note": "Contexte et rappel sur l'importance des méthodes itératives pour les grandes matrices."
  },
  {
    "titre": "Formulation du Problème",
    "contenu": "<p style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><strong>Rappel :</strong> Résoudre \( Ax = b \), où \( A \) est une matrice <strong>symétrique définie positive (SDP)</strong>.</p><div style='text-align: center; background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>Problème équivalent :</strong> Minimiser la fonctionnelle quadratique</p><div class='math-block'><div class='math'>$$ f(x) = \\frac{1}{2} x^T A x - b^T x $$</div></div></div><p style='margin-top: 15px;'><strong>Pourquoi ?</strong> Le gradient de \( f \) est \( \\nabla f(x) = Ax - b \). Le minimum de \( f \) est atteint lorsque \( \\nabla f(x) = 0 \), c'est-à-dire \( Ax = b \).</p><div style='background: #d4edda; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745;'><p style='color: #155724; margin: 0;'><strong>Exemple simple :</strong> \( A = [2] \), \( b = [4] \). \( f(x) = \\frac{1}{2} (2)x^2 - 4x = x^2 - 4x \). La solution est \( x=2 \), le minimum de la parabole \( x^2 - 4x \).</p></div>",
    "texteParle": "Avant de commencer, reformulons notre problème. Résoudre un système linéaire Ax égal b, où A est une matrice symétrique définie positive, est équivalent à trouver le minimum d'une fonction mathématique bien particulière, que l'on appelle une fonctionnelle quadratique. Si vous dérivez cette fonction, vous obtenez exactement Ax moins b. Donc, trouver où la dérivée s'annule revient à résoudre notre système. C'est cette idée de minimisation qui est au cœur des méthodes de gradient.",
    "note": "Lien entre la résolution de système linéaire et la minimisation d'une fonction quadratique."
  },
  {
    "titre": "Principe de la Descente de Gradient",
    "contenu": "<p>La méthode du gradient (ou descente de gradient) est une méthode itérative qui construit une suite \( x^{(k)} \) convergeant vers la solution \( x^* \).</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Principe :</strong></p><ol style='margin-bottom: 0;'><li><strong>Choisir</strong> un point de départ \( x^{(0)} \).</li><li><strong>Calculer</strong> la direction de plus grande pente : \( r^{(k)} = b - A x^{(k)} \).</li><li><strong>Se déplacer</strong> dans cette direction : \( x^{(k+1)} = x^{(k)} + \\alpha_k r^{(k)} \).</li></ol></div><p><strong>Le paramètre \( \\alpha_k \) :</strong> Le <strong>pas</strong> de descente. Il détermine la longueur du déplacement.</p><div style='background: #e8f4f8; padding: 15px; border-radius: 8px;'><p style='margin: 0;'><strong>Pas optimal :</strong> Choisir \( \\alpha_k \) qui minimise \( f(x^{(k)} + \\alpha r^{(k)}) \).</p><div class='math-block'><div class='math'>$$ \\alpha_k = \\frac{(r^{(k)})^T r^{(k)}}{(r^{(k)})^T A r^{(k)}} $$</div></div></div>",
    "texteParle": "L'idée de la descente de gradient est très intuitive. Imaginez que vous êtes au sommet d'une colline et que vous voulez descendre au point le plus bas. Vous regardez autour de vous, vous identifiez la direction où la pente est la plus raide, et vous faites un pas dans cette direction. En mathématiques, le résidu, que nous notons r, est exactement cette direction de plus grande pente. Le paramètre alpha, que l'on appelle le pas, contrôle la taille de chaque pas. Pour être efficace, on choisit un pas qui nous fait descendre le plus possible le long de cette direction, c'est ce qu'on appelle le pas optimal.",
    "note": "Explication intuitive de la descente de gradient (analogie de la descente d'une colline)."
  },
  {
    "titre": "Algorithme de la Descente de Gradient",
    "contenu": "<div style='background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace;'><p style='font-weight: bold;'>Algorithme :</p><ol style='margin-bottom: 0;'><li>Choisir \( x^{(0)} \) et une tolérance \( \\epsilon &gt; 0 \).</li><li>Pour \( k = 0, 1, 2, \\dots \) :<ul><li>Calculer \( r^{(k)} = b - A x^{(k)} \).</li><li>Si \( \\|r^{(k)}\\| &lt; \\epsilon \), arrêter.</li><li>Calculer \( \\alpha_k = \\frac{(r^{(k)})^T r^{(k)}}{(r^{(k)})^T A r^{(k)}} \).</li><li>Mettre à jour : \( x^{(k+1)} = x^{(k)} + \\alpha_k r^{(k)} \).</li></ul></li></ol></div><div style='background: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'><p style='color: #0c5460; margin: 0;'><strong>Remarque :</strong> Le critère d'arrêt est basé sur la norme du résidu. Le résidu est un vecteur, on mesure sa taille avec la norme euclidienne.</p></div>",
    "texteParle": "Voici l'algorithme de la descente de gradient étape par étape. On commence par choisir un point de départ, souvent le vecteur nul. Ensuite, on répète les étapes suivantes : on calcule le résidu, qui est la différence entre b et Ax. Si ce résidu est suffisamment petit, on s'arrête, car on est proche de la solution. Sinon, on calcule le pas optimal et on met à jour notre approximation. C'est un processus itératif qui va peu à peu nous rapprocher de la solution exacte.",
    "note": "Déroulement pratique de l'algorithme de descente de gradient."
  },
  {
    "titre": "Convergence de la Descente de Gradient",
    "contenu": "<p>La vitesse de convergence dépend du <strong>conditionnement</strong> de la matrice \( A \), mesuré par son <strong>nombre de conditionnement</strong> \( \\kappa(A) \).</p><div style='background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545;'><p style='color: #721c24; margin: 0;'><strong>Résultat :</strong></p><div class='math-block'><div class='math'>$$ \\| x^{(k)} - x^* \\|_A \\leq \\left( \\frac{\\kappa(A) - 1}{\\kappa(A) + 1} \\right)^k \\| x^{(0)} - x^* \\|_A $$</div></div></div><ul><li><strong>\( \\kappa(A) \) proche de 1 :</strong> Convergence rapide (courbes circulaires).</li><li><strong>\( \\kappa(A) \) grand :</strong> Convergence lente (vallées allongées).</li></ul><div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107;'><p style='color: #856404; margin: 0;'><strong>Exemple :</strong> Si \( \\kappa = 1000 \), le taux de convergence est d'environ \( 0.998 \). Il faudra beaucoup d'itérations !</p></div>",
    "texteParle": "La descente de gradient n'est pas toujours rapide. Sa vitesse dépend d'une propriété de la matrice A appelée le nombre de conditionnement. Si ce nombre est proche de 1, la convergence est très rapide. En revanche, si ce nombre est grand, ce qui arrive souvent en pratique, la convergence devient très lente. C'est comme si on se trouvait dans une vallée très allongée. On avance en zigzagant, ce qui est inefficace. C'est la principale limitation de cette méthode.",
    "note": "Analyse de la convergence et impact du conditionnement de la matrice."
  },
  {
    "titre": "Limites de la Descente de Gradient",
    "contenu": "<div style='background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545;'><p style='color: #721c24; font-weight: bold;'>Problème principal : L'effet de \"zigzag\"</p></div><p>La descente de gradient a tendance à prendre des directions <strong>orthogonales</strong> d'une itération à l'autre.</p><div style='background: #e9ecef; padding: 15px; border-radius: 8px;'><p style='margin: 0;'><strong>Illustration :</strong></p><ul><li>Si \( A \) est mal conditionnée, les itérées oscillent.</li><li>Chaque nouvelle direction est perpendiculaire à la précédente.</li><li>Ceci ralentit considérablement la convergence.</li></ul></div><div style='background: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'><p style='color: #0c5460; margin: 0;'><strong>Conséquence :</strong> Inefficace pour les problèmes de grande taille ou mal conditionnés. D'où l'idée d'améliorer l'algorithme.</p></div>",
    "texteParle": "Le principal défaut de la descente de gradient est qu'elle avance en zigzag. Chaque nouvelle direction est perpendiculaire à la précédente. Cela signifie que l'on passe son temps à corriger les erreurs de la direction précédente, ce qui est très inefficace, surtout pour les problèmes mal conditionnés. Heureusement, il existe une amélioration majeure de cet algorithme, que nous allons voir maintenant : le gradient conjugué.",
    "note": "Limites de la descente de gradient: oscillations et lenteur."
  },
  {
    "titre": "Introduction au Gradient Conjugué",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Objectif :</p><p style='color: #0b3d5c; margin: 0;'>Résoudre les problèmes de convergence lente de la descente de gradient.</p></div><div style='background: #f0f4f8; padding: 15px; border-radius: 8px;'><p><strong>Idée clé :</strong> Utiliser des directions de descente <strong>conjuguées</strong> par rapport à \( A \).</p><p>Deux vecteurs \( u \) et \( v \) sont conjugués si :</p><div class='math-block'><div class='math'>$$ u^T A v = 0 $$</div></div></div><p><strong>Avantage :</strong> Permet d'éviter le \"zigzag\" et d'accélérer la convergence.</p><ul><li>Chaque direction est choisie pour ne pas \"refaire\" le travail des précédentes.</li><li>Pour une matrice de taille \( n \), converge théoriquement en \( n \) itérations.</li></ul>",
    "texteParle": "Le gradient conjugué est une amélioration brillante de la descente de gradient. Le mot 'conjugué' fait référence à une propriété mathématique spécifique. L'idée est de choisir des directions de descente qui ne sont pas orthogonales, mais qui sont conjuguées par rapport à la matrice A. Cela signifie que chaque nouvelle direction est choisie de manière à ne pas interférer avec les directions précédentes. On avance ainsi de manière plus directe vers la solution. En théorie, pour une matrice de taille n, le gradient conjugué trouve la solution en au plus n itérations, ce qui est une amélioration spectaculaire.",
    "note": "Principe du gradient conjugué : directions conjuguées."

  {
    "titre": "Algorithme du Gradient Conjugué",
    "contenu": "<div style='background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9em;'><p style='font-weight: bold;'>Algorithme :</p><ol style='margin-bottom: 0;'><li>Choisir \( x^{(0)} \), tolérance \( \\epsilon &gt; 0 \).</li><li>Initialiser \( r^{(0)} = b - A x^{(0)} \), \( p^{(0)} = r^{(0)} \).</li><li>Pour \( k = 0, 1, 2, \\dots \) :<ul><li>Calculer \( \\alpha_k = \\frac{(r^{(k)})^T r^{(k)}}{(p^{(k)})^T A p^{(k)}} \).</li><li>Mettre à jour \( x^{(k+1)} = x^{(k)} + \\alpha_k p^{(k)} \).</li><li>Mettre à jour \( r^{(k+1)} = r^{(k)} - \\alpha_k A p^{(k)} \).</li><li>Si \( \\|r^{(k+1)}\\| &lt; \\epsilon \), arrêter.</li><li>Calculer \( \\beta_k = \\frac{(r^{(k+1)})^T r^{(k+1)}}{(r^{(k)})^T r^{(k)}} \).</li><li>Mettre à jour \( p^{(k+1)} = r^{(k+1)} + \\beta_k p^{(k)} \).</li></ul></li></ol></div>",
    "texteParle": "Voici l'algorithme du gradient conjugué. Il ressemble à la descente de gradient, mais avec une différence cruciale : on ne prend plus simplement le résidu comme direction. On construit une direction de recherche p, qui est une combinaison du résidu actuel et de la direction précédente. Le coefficient bêta permet de s'assurer que les directions sont bien conjuguées. C'est cette conjugaison qui accélère la convergence et permet de résoudre le problème en un nombre fini d'itérations.",
    "note": "Algorithme pratique du gradient conjugué."

  {
    "titre": "Convergence du Gradient Conjugué",
    "contenu": "<p>Propriétés remarquables de l'algorithme :</p><ul><li><strong>Propriété de terminaison :</strong> Pour une matrice de taille \( n \), la solution exacte est trouvée en au plus \( n \) itérations (en arithmétique exacte).</li><li><strong>Convergence super-linéaire :</strong> En pratique, la convergence est beaucoup plus rapide que la descente de gradient.</li></ul><div style='background: #d4edda; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745;'><p style='color: #155724; margin: 0;'><strong>Comparaison :</strong></p><ul><li>Descente de gradient : \( O(\\kappa) \) itérations.</li><li>Gradient conjugué : \( O(\\sqrt{\\kappa}) \) itérations.</li></ul></div><div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; margin-top: 10px;'><p style='color: #856404; margin: 0;'><strong>Exemple :</strong> Si \( \\kappa = 10^4 \), la descente de gradient a besoin de \( 10^4 \) itérations, tandis que le gradient conjugué n'en a besoin que de \( 10^2 \). Une amélioration de 100 fois !</p></div>",
    "texteParle": "Le gradient conjugué a des propriétés de convergence exceptionnelles. D'abord, en théorie, il trouve la solution exacte en un nombre d'itérations égal à la taille de la matrice, pas plus. En pratique, il converge beaucoup plus vite que la descente de gradient, surtout lorsque la matrice est mal conditionnée. Alors que la descente de gradient a besoin d'un nombre d'itérations proportionnel au nombre de conditionnement, le gradient conjugué n'en a besoin que proportionnellement à la racine carrée de ce nombre. C'est un gain considérable.",
    "note": "Convergence rapide du gradient conjugué comparée à la descente de gradient."
  },
  {
    "titre": "Préconditionnement",
    "contenu": "<div style='background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='color: #0b3d5c; font-weight: bold; margin: 0;'>Objectif :</p><p style='color: #0b3d5c; margin: 0;'>Accélérer encore la convergence du gradient conjugué en améliorant le conditionnement de la matrice.</p></div><p><strong>Idée :</strong> Au lieu de résoudre \( Ax = b \), on résout le système préconditionné :</p><div class='math-block'><div class='math'>$$ M^{-1} A x = M^{-1} b $$</div></div><p>où \( M \) est une matrice facile à inverser, proche de \( A \).</p><p><strong>Exigences pour \( M \) :</strong></p><ul><li>Facile à inverser (diagonale, triangulaire, ...).</li><li>Approche \( A \) pour que \( \\kappa(M^{-1}A) \) soit petit.</li></ul><div style='background: #d1ecf1; padding: 15px; border-radius: 8px;'><p style='color: #0c5460; margin: 0;'><strong>Exemples :</strong></p><ul><li><strong>Préconditionneur diagonal (Jacobi) :</strong> \( M = \\text{diag}(A) \).</li><li><strong>Préconditionneur par factorisation incomplète :</strong> \( M = \\tilde{L} \\tilde{U} \\approx A \).</li></ul></div>",
    "texteParle": "Le gradient conjugué est très performant, mais on peut l'améliorer encore avec une technique appelée le préconditionnement. L'idée est de transformer notre système en un autre système équivalent, mais avec une matrice mieux conditionnée. Pour cela, on utilise une matrice M, que l'on appelle le préconditionneur. Cette matrice M doit être proche de A, mais surtout, elle doit être très facile à inverser. Par exemple, on peut choisir M comme la diagonale de A. Un bon préconditionneur peut réduire considérablement le nombre d'itérations nécessaires.",

    "texteParle": "Prenons un exemple simple pour illustrer le préconditionnement. Nous avons une matrice A tridiagonale. Le préconditionneur de Jacobi consiste simplement à prendre la diagonale de A, qui est 10 fois la matrice identité. En multipliant notre système par l'inverse de M, la nouvelle matrice a des uns sur sa diagonale et des 0.1 sur ses voisins. Elle est beaucoup mieux conditionnée. Grâce à cela, la convergence du gradient conjugué est accélérée, et le nombre d'itérations peut passer de plusieurs dizaines à seulement quelques unités.",

    "titre": "Résumé et Mots-Clés",
    "contenu": "<div style='background: #f0f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p style='font-weight: bold;'>Ce qu'il faut retenir :</p><ul><li><strong>Problème :</strong> Résoudre \( Ax = b \) \( \Leftrightarrow \) Minimiser \( f(x) \).</li><li><strong>Descente de gradient :</strong> Simple, mais convergence lente si \( A \) est mal conditionnée.</li><li><strong>Gradient conjugué :</strong> Utilise des directions conjuguées, converge beaucoup plus vite.</li><li><strong>Préconditionnement :</strong> Technique pour améliorer le conditionnement de \( A \) et accélérer la convergence.</li></ul></div><div style='background: #fff3cd; padding: 15px; border-radius: 10px; border-left: 5px solid #ffc107;'><p style='color: #856404; font-weight: bold; margin: 0;'>Mots-clés :</p><p style='color: #856404; margin: 0;'>Gradient, Descente de gradient, Gradient conjugué, Préconditionnement, Convergence, Conditionnement.</p></div>",
    "texteParle": "Pour conclure cette leçon, rappelons les points essentiels. Résoudre un système linéaire peut être vu comme la minimisation d'une fonction. La descente de gradient est une méthode simple mais lente pour les matrices mal conditionnées. Le gradient conjugué est une amélioration majeure qui utilise des directions conjuguées pour une convergence rapide. Enfin, le préconditionnement est une technique pour améliorer le conditionnement de la matrice et accélérer encore la convergence. Retenez bien ces notions, elles sont fondamentales en calcul scientifique et en Data Science.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

        }

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

        document.querySelectorAll('.math-block').forEach(block => {

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
