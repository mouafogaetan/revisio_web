<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse du Comportement Client et Segmentation",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>La société <strong>\"DigitalMarket SARL\"</strong>, une entreprise camerounaise de e-commerce, souhaite mieux comprendre le comportement de ses clients pour optimiser ses campagnes marketing. Elle vous fournit un extrait de ses données de transaction pour l'année 2025. Votre mission est d'analyser ces données pour proposer des segments de clients pertinents et des recommandations stratégiques.</p>\n  \n  <h3 style='color: #2c3e50; margin-top: 20px;'>Données disponibles (Extrait fictif) :</h3>\n  <p>Le dataset <strong>\"clients_digitalmarket.csv\"</strong> contient les colonnes suivantes :</p>\n  <ul style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; list-style-type: none;'>\n    <li style='margin-bottom: 8px;'>• <strong>client_id</strong> : Identifiant unique du client</li>\n    <li style='margin-bottom: 8px;'>• <strong>date_derniere_achat</strong> : Date du dernier achat (format JJ/MM/AAAA)</li>\n    <li style='margin-bottom: 8px;'>• <strong>nombre_transactions</strong> : Nombre total d'achats depuis l'inscription</li>\n    <li style='margin-bottom: 8px;'>• <strong>montant_total_achats</strong> : Montant total dépensé (en FCFA)</li>\n    <li style='margin-bottom: 8px;'>• <strong>nb_produits_differents</strong> : Nombre de catégories de produits différentes achetées</li>\n  </ul>\n  \n  <div style='background-color: #e8f0fe; padding: 15px; border-left: 4px solid #1a73e8; margin: 20px 0; border-radius: 4px;'>\n    <p style='margin: 0;'><strong>💡 Note :</strong> Considérez la date de référence au 31/12/2025 pour vos calculs de récence.</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<div><strong>1. (2 pts) - Analyse RFM</strong></div><div style='margin-top: 10px;'>À partir des données, calculez les métriques RFM (Récence, Fréquence, Montant) pour les clients suivants :</div><ul style='list-style-type: none; padding-left: 10px;'><li>• Client A : Dernier achat le 15/12/2025, 25 transactions, 450 000 FCFA dépensés</li><li>• Client B : Dernier achat le 20/10/2025, 8 transactions, 95 000 FCFA dépensés</li><li>• Client C : Dernier achat le 05/01/2025, 3 transactions, 12 500 FCFA dépensés</li></ul><div style='margin-top: 10px;'>Déterminez pour chaque client sa note RFM (de 1 à 5 pour chaque dimension, 5 étant la meilleure note) et proposez un segment marketing approprié (ex: \"clients VIP\", \"clients occasionnels\", \"clients à risque\"). Justifiez vos choix.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>Client A :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Récence : 16 jours (très récent) → Note 5/5</li><li>• Fréquence : 25 transactions (très élevée) → Note 5/5</li><li>• Montant : 450 000 FCFA (très élevé) → Note 5/5</li><li>• Segment : <span style='font-weight: bold; color: #2e7d32;'>\"Clients VIP\"</span> - Clients très actifs, à fort potentiel, à fidéliser avec des offres exclusives.</li></ul><div style='margin-top: 10px;'><strong>Client B :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Récence : 72 jours (moyennement récent) → Note 3/5</li><li>• Fréquence : 8 transactions (moyenne) → Note 3/5</li><li>• Montant : 95 000 FCFA (moyen) → Note 3/5</li><li>• Segment : <span style='font-weight: bold; color: #f57c00;'>\"Clients occasionnels\"</span> - Clients réguliers mais à faible valeur, à encourager avec des promotions ciblées.</li></ul><div style='margin-top: 10px;'><strong>Client C :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Récence : 360 jours (très ancien) → Note 1/5</li><li>• Fréquence : 3 transactions (faible) → Note 1/5</li><li>• Montant : 12 500 FCFA (très faible) → Note 1/5</li><li>• Segment : <span style='font-weight: bold; color: #c62828;'>\"Clients à risque\"</span> - Clients inactifs, à réactiver avec des offres spéciales de réengagement.</li></ul>"
        },
        {
          "question": "<div><strong>2. (2 pts) - Segmentation par Clustering</strong></div><div style='margin-top: 10px;'>Vous décidez d'appliquer un algorithme de clustering k-means pour affiner votre segmentation. Les données sont normalisées.</div><div style='margin-top: 10px;'>a) Expliquez brièvement les étapes de l'algorithme k-means.</div><div style='margin-top: 10px;'>b) Après avoir appliqué k-means avec <code>k=3</code> sur les données normalisées (Récence, Fréquence, Montant), vous obtenez les centres de clusters suivants :</div><ul style='list-style-type: none; padding-left: 10px;'><li>• Cluster 1 : [0.9, 0.8, 0.9]</li><li>• Cluster 2 : [0.1, 0.3, 0.2]</li><li>• Cluster 3 : [0.5, 0.1, 0.3]</li></ul><div style='margin-top: 10px;'>Interprétez ces clusters. À quels segments marketing peuvent-ils correspondre ? Proposez des actions marketing pour chaque cluster.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Algorithme k-means :</strong></div><ol style='padding-left: 20px;'><li>Choisir k points initiaux aléatoirement comme centres de clusters</li><li>Assigner chaque point au cluster du centre le plus proche</li><li>Recalculer les centres comme la moyenne des points de chaque cluster</li><li>Répéter les étapes 2 et 3 jusqu'à convergence</li></ol><div style='margin-top: 10px;'><strong>b) Interprétation des clusters :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <span style='font-weight: bold; color: #2e7d32;'>Cluster 1 [0.9, 0.8, 0.9]</span> : Valeurs élevées dans les 3 dimensions → <strong>\"Clients VIP\"</strong>. Actions : programmes de fidélisation premium, offres personnalisées, accès anticipé aux nouveautés.</li><li>• <span style='font-weight: bold; color: #c62828;'>Cluster 2 [0.1, 0.3, 0.2]</span> : Valeurs faibles, surtout récence et montant → <strong>\"Clients à risque\"</strong> (anciens clients avec faible valeur). Actions : campagnes de réactivation, offres spéciales, enquêtes de satisfaction.</li><li>• <span style='font-weight: bold; color: #f57c00;'>Cluster 3 [0.5, 0.1, 0.3]</span> : Récence moyenne mais fréquence et montant bas → <strong>\"Nouveaux clients\"</strong> ou \"Clients à fort potentiel\". Actions : campagnes d'engagement, éducation produit, programmes de parrainage.</li></ul>"
        },
        {
          "question": "<div><strong>3. (2 pts) - Analyse de Cohortes et Recommandations Stratégiques</strong></div><div style='margin-top: 10px;'>Le responsable marketing souhaite comprendre la rétention des clients par mois d'acquisition.</div><div style='margin-top: 10px;'>a) Définissez ce qu'est une cohorte et comment on calcule le taux de rétention.</div><div style='margin-top: 10px;'>b) Si le taux de rétention à 6 mois des clients acquis en janvier 2025 est de 45% et celui des clients acquis en juillet 2025 est de 60%, que pouvez-vous en déduire ? Proposez des pistes d'amélioration.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Cohorte et taux de rétention :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Une <strong>cohorte</strong> est un groupe de clients partageant une caractéristique commune (ici le mois d'acquisition).</li><li>Le <strong>taux de rétention</strong> est le pourcentage de clients d'une cohorte qui sont encore actifs (ont effectué un achat) après une période donnée.</li><li>Formule : \( \text{Taux de rétention} = \frac{\text{Nombre de clients actifs à la période T}}{\text{Nombre de clients de la cohorte}} \times 100 \).</li></ul><div style='margin-top: 10px;'><strong>b) Interprétation :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• La cohorte de janvier 2025 a un taux de rétention plus faible (45% vs 60%), ce qui suggère que ces clients sont moins fidèles.</li><li>• <strong>Pistes d'amélioration :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li>Analyser les différences entre les deux cohortes (offres, saisonnalité, expérience d'achat).</li><li>Mettre en place des campagnes de fidélisation spécifiques pour la cohorte de janvier.</li><li>Identifier les points de friction qui pourraient expliquer ce taux de rétention plus faible.</li><li>Utiliser l'analyse des cohortes pour prévenir le churn et ajuster les stratégies d'acquisition.</li></ul></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes de Recommandation et Marketing Mix",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>\n  <p>L'entreprise <strong>\"SoundWave\"</strong>, une plateforme de streaming musical au Cameroun, souhaite améliorer son système de recommandation de chansons et optimiser son budget marketing. Vous disposez des données suivantes :</p>\n  \n  <ul style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; list-style-type: none;'>\n    <li style='margin-bottom: 8px;'>• <strong>Données utilisateurs</strong> : 10 000 utilisateurs, 5 000 chansons, 500 000 écoutes (interactions).</li>\n    <li style='margin-bottom: 8px;'>• <strong>Données marketing</strong> : Budgets mensuels par canal (réseaux sociaux, radio, TV, partenariats), ventes de tickets pour les événements.</li>\n  </ul>\n\n  <div style='background-color: #e8f0fe; padding: 15px; border-left: 4px solid #1a73e8; margin: 20px 0; border-radius: 4px;'>\n    <p style='margin: 0;'><strong>💡 Objectifs :</strong> Évaluer et proposer des améliorations pour le système de recommandation et le mix marketing.</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<div><strong>1. (2 pts) - Filtrage Collaboratif et Défis</strong></div><div style='margin-top: 10px;'>a) Expliquez les différences entre le filtrage collaboratif \"user-based\" et \"item-based\". Pour SoundWave, lequel serait le plus pertinent et pourquoi ?</div><div style='margin-top: 10px;'>b) La matrice utilisateur-chanson est très sparse (faible densité). Quelles techniques peuvent être utilisées pour gérer la sparsité et le problème du \"cold start\" (nouveaux utilisateurs ou nouvelles chansons) ?</div>",

          "question": "<div><strong>3. (3 pts) - Marketing Mix Modeling (MMM) et Attribution</strong></div><div style='margin-top: 10px;'>SoundWave investit dans 4 canaux marketing. Les données mensuelles sur 24 mois sont disponibles.</div><div style='margin-top: 10px;'>a) Expliquez l'objectif du Marketing Mix Modeling (MMM) et comment il peut aider SoundWave.</div><div style='margin-top: 10px;'>b) Comparez les modèles d'attribution \"last-click\" et \"data-driven\". Quel modèle serait le plus approprié pour SoundWave et pourquoi ?</div><div style='margin-top: 10px;'>c) Proposez une méthode simple pour optimiser le budget marketing entre les 4 canaux, en supposant que vous connaissez le retour sur investissement (ROI) estimé de chaque canal.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Marketing Mix Modeling (MMM) :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Le MMM est une technique statistique qui mesure l'impact des différentes activités marketing sur les ventes.</li><li>Pour SoundWave, le MMM permet de :</li><ul style='list-style-type: circle; padding-left: 20px;'><li>Quantifier l'efficacité de chaque canal (ROI).</li><li>Optimiser le budget en allouant plus aux canaux les plus performants.</li><li>Comprendre les synergies entre canaux.</li><li>Prendre des décisions basées sur les données.</li></ul></ul><div style='margin-top: 10px;'><strong>b) Modèles d'attribution :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Last-click :</strong> Attribue 100% du crédit au dernier point de contact. Simple mais ignore les contributions des autres canaux.</li><li>• <strong>Data-driven :</strong> Utilise les données pour attribuer le crédit en fonction de l'impact réel de chaque point de contact. Plus juste mais plus complexe.</li><li>Pour SoundWave, <strong>un modèle data-driven serait plus approprié</strong> car le parcours client dans le streaming peut être complexe (découverte sur les réseaux sociaux, engagement via les playlists, etc.).</li></ul><div style='margin-top: 10px;'><strong>c) Optimisation du budget :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• Supposons les ROI suivants : Réseaux sociaux (RS) : 3, Radio (R) : 2, TV : 1.5, Partenariats (P) : 2.5.</li><li>• <strong>Méthode :</strong> Allouer le budget proportionnellement au ROI.</li><li>• <strong>Exemple</strong> avec un budget total de 100M FCFA :</li><ul style='list-style-type: circle; padding-left: 20px;'><li>RS : \( \frac{3}{3+2+1.5+2.5} \times 100 = 33.3M \)</li><li>Radio : \( \frac{2}{9} \times 100 = 22.2M \)</li><li>TV : \( \frac{1.5}{9} \times 100 = 16.7M \)</li><li>Partenariats : \( \frac{2.5}{9} \times 100 = 27.8M \)</li></ul></ul>"

          "question": "<div><strong>1. (2 pts) - A/B Testing et Bandits Manchots</strong></div><div style='margin-top: 10px;'>a) SoundWave veut tester deux versions d'emails (A et B) pour promouvoir une nouvelle playlist. Expliquez les étapes clés pour mener ce test A/B : taille d'échantillon, métrique de succès, durée du test, analyse des résultats.</div><div style='margin-top: 10px;'>b) En quoi un algorithme de \"Multi-Armed Bandit\" peut-il être plus efficace qu'un test A/B classique dans ce contexte ? Expliquez son fonctionnement avec un exemple simple.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Test A/B :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Étapes clés :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li><strong>Taille d'échantillon :</strong> Calculée en fonction de la différence minimale à détecter, de la puissance statistique (80-90%) et du niveau de significativité (5%). Nécessite souvent plusieurs milliers d'utilisateurs.</li><li><strong>Métrique de succès :</strong> Taux de clics (CTR) ou taux d'inscription.</li><li><strong>Durée du test :</strong> Dépend du trafic et de la taille d'échantillon, généralement 1 à 4 semaines pour capturer les variations.</li><li><strong>Analyse des résultats :</strong> Utiliser un test statistique (ex: test de Student) pour comparer les moyennes. Vérifier la significativité (p-value < 0.05).</li></ul></ul><div style='margin-top: 10px;'><strong>b) Multi-Armed Bandit :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Principe :</strong> Un bandit manchot alloue le trafic de manière dynamique en apprenant en temps réel. Contrairement au test A/B (exploration puis exploitation), le bandit manchot est un équilibre entre exploration et exploitation en continu.</li><li>• <strong>Fonctionnement :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li><strong>Exploration (ε-greedy) :</strong> Avec une probabilité ε, tester un bras aléatoirement. Sinon, choisir le meilleur bras connu.</li><li><strong>Avantage :</strong> Plus efficace car il concentre le trafic sur les meilleures variantes au fur et à mesure, réduisant les coûts d'opportunité et s'adaptant aux changements.</li><li><strong>Exemple :</strong> Avec ε=0.1, 90% du trafic va vers le meilleur email (A si meilleur), et 10% explore B. Si B devient meilleur, le bandit s'adapte.</li></ul></ul>"

          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Analyse des avis :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Avis 1</strong> : Sentiment <span style='font-weight: bold; color: #2e7d32;'>positif</span>. Thèmes : sonorités africaines, beats modernes, plaisir d'écoute.</li><li>• <strong>Avis 2</strong> : Sentiment <span style='font-weight: bold; color: #c62828;'>négatif</span>. Thèmes : chansons répétitives, manque d'originalité, problèmes de performance de l'application.</li></ul><div style='margin-top: 10px;'><strong>b) LDA (Latent Dirichlet Allocation) :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Principe :</strong> LDA est un modèle génératif de topic modeling qui découvre des thèmes (topics) dans un corpus de textes. Chaque document est une distribution de topics, et chaque topic est une distribution de mots.</li><li>• <strong>Processus :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li>Prétraitement : tokenization, stop words, lemmatisation.</li><li>Choisir le nombre de topics k.</li><li>Entraîner le modèle LDA.</li><li>Interpréter les topics (ex: Topic 1: \"qualité sonore, artiste, album\"; Topic 2: \"application, interface, bug\").</li></ul><li>• <strong>Bénéfices pour SoundWave :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li>Identifier les points forts et faibles des playlists.</li><li>Détecter les thèmes récurrents (satisfaction, problèmes techniques).</li><li>Orienter les améliorations produit et les stratégies de contenu.</li></ul></ul>"

        {
          "question": "<div><strong>3. (3 pts) - Projets Pratiques : Prédiction du Churn et Personas</strong></div><div style='margin-top: 10px;'>SoundWave souhaite lancer deux projets Data Science : la prédiction du churn et la création de personas.</div><div style='margin-top: 10px;'>a) Décrivez les étapes clés d'un projet de prédiction du churn : données nécessaires, modèle à utiliser, évaluation.</div><div style='margin-top: 10px;'>b) Comment la segmentation par RFM et clustering peut-elle aider à créer des personas pour SoundWave ? Donnez 3 exemples de personas avec leurs caractéristiques et leurs besoins en musique.</div><div style='margin-top: 10px;'>c) Proposez un plan d'action simple pour réduire le churn et améliorer l'engagement des utilisateurs en vous basant sur ces personas.</div>",
          "reponse": "<div><strong>Correction :</strong></div><div style='margin-top: 10px;'><strong>a) Projet de prédiction du churn :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Données nécessaires :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li>Historique des écoutes (fréquence, durée, variété).</li><li>Informations de profil (âge, localisation, abonnement).</li><li>Interactions marketing (emails, notifications).</li><li>Période d'observation pour définir le churn (ex: 30 jours sans activité).</li></ul><li>• <strong>Modèle à utiliser :</strong> Régression logistique, Random Forest, ou XGBoost.</li><li>• <strong>Évaluation :</strong> AUC-ROC, précision, rappel, F1-score.</li></ul><div style='margin-top: 10px;'><strong>b) Création de personas :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Exemple de personas :</strong></li><ul style='list-style-type: circle; padding-left: 20px;'><li><strong>\"Hip-Hop Addict\"</strong> : 18-25 ans, écoute quotidienne, préfère les artistes locaux. Besoin : découvrir les nouveaux talents.</li><li><strong>\"Amateur de Musique du Monde\"</strong> : 30-50 ans, écoute variée, apprécie les playlists thématiques. Besoin : explorer des genres du monde.</li><li><strong>\"Auditeur Occasionnel\"</strong> : 25-40 ans, écoute en voiture ou au travail, préfère les hits. Besoin : des playlists \"best of\".</li></ul></ul><div style='margin-top: 10px;'><strong>c) Plan d'action anti-churn basé sur les personas :</strong></div><ul style='list-style-type: none; padding-left: 10px;'><li>• <strong>Pour \"Hip-Hop Addict\" :</strong> Envoyer des notifications pour les nouvelles sorties. Proposer un accès anticipé aux albums.</li><li>• <strong>Pour \"Amateur de Musique du Monde\" :</strong> Créer des playlists collaboratives. Organiser des événements;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
