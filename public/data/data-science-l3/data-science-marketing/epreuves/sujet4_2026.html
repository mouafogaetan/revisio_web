<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modèles d'Attribution (8 points)",
      "points": "8 pts",
      "enonce": "<p>Une entreprise camerounaise de vente de produits électroniques, <strong>\"TechBuy.cm\"</strong>, souhaite analyser l'efficacité de ses campagnes marketing. Elle a suivi le parcours de 4 clients types sur une période donnée. Le tableau suivant présente les canaux qui ont contribué à la conversion finale pour chaque client :</p><div style='background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;border:1px solid #dee2e6;'><table style='width:100%;border-collapse:collapse;'><thead><tr style='background:#e9ecef;'><th style='padding:8px;border:1px solid #dee2e6;'>Client</th><th style='padding:8px;border:1px solid #dee2e6;'>Parcours (chronologique)</th></tr></thead><tbody><tr><td style='padding:8px;border:1px solid #dee2e6;'>Client 1</td><td style='padding:8px;border:1px solid #dee2e6;'>Facebook Ads → Google Search → Email → Achat</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Client 2</td><td style='padding:8px;border:1px solid #dee2e6;'>Instagram Ads → Google Search → Achat</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Client 3</td><td style='padding:8px;border:1px solid #dee2e6;'>TV → Facebook Ads → Achat</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Client 4</td><td style='padding:8px;border:1px solid #dee2e6;'>Email → Google Search → Facebook Ads → Achat</td></tr></tbody></table></div><p>Le budget marketing total de TechBuy.cm est de <strong>5 000 000 FCFA</strong> pour le trimestre. Les coûts moyens par canal sont les suivants :</p><ul><li><strong>Facebook Ads</strong> : 500 FCFA par clic</li><li><strong>Instagram Ads</strong> : 400 FCFA par clic</li><li><strong>Google Search</strong> : 600 FCFA par clic</li><li><strong>Email</strong> : 100 FCFA par envoi</li><li><strong>TV</strong> : 1 000 000 FCFA par spot</li></ul>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Pour le parcours du Client 4, calculez le crédit attribué à chaque canal selon les modèles suivants :</p><ul><li><strong>a)</strong> Modèle Last-Click</li><li><strong>b)</strong> Modèle Linéaire (Linear)</li><li><strong>c)</strong> Modèle Time-Decay (en supposant que le temps entre chaque étape est identique)</li></ul><p>Justifiez vos réponses en quelques phrases.</p>",
          "reponse": "<p><strong>a) Modèle Last-Click :</strong> Ce modèle attribue 100% du crédit au dernier point de contact avant la conversion. Pour le Client 4, le dernier point de contact est <strong>Facebook Ads</strong>. Le crédit est donc : Facebook Ads = 100%, Google Search = 0%, Email = 0%.</p><p><strong>b) Modèle Linéaire :</strong> Ce modèle distribue le crédit de manière égale entre tous les points de contact. Pour le Client 4, il y a 3 points de contact (Email, Google Search, Facebook Ads). Le crédit est donc : <strong>33.33% pour chaque canal</strong>.</p><p><strong>c) Modèle Time-Decay :</strong> Ce modèle accorde plus de poids aux interactions les plus proches de la conversion. Avec des étapes espacées de manière égale, on peut utiliser une pondération exponentielle décroissante. Par exemple, avec un facteur de décroissance de 2 :<br/>Facebook Ads (le plus proche) = \( \\frac{4}{7} \\approx 57.14\\% \)<br/>Google Search = \( \\frac{2}{7} \\approx 28.57\\% \)<br/>Email (le plus ancien) = \( \\frac{1}{7} \\approx 14.29\\% \)<br/>Ce modèle reflète l'idée que les actions récentes du client sont plus déterminantes dans sa décision finale.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Une étude menée par TechBuy.cm a révélé que la valeur moyenne d'un client (Customer Lifetime Value - LTV) est de <strong>150 000 FCFA</strong>. En utilisant le modèle d'attribution de votre choix (justifiez votre choix), déterminez quel canal a le meilleur retour sur investissement (ROI) et proposez une réallocation du budget marketing de 5 000 000 FCFA pour maximiser les conversions. Les contraintes de capacité sont les suivantes :</p><ul><li>Facebook Ads : maximum 1 500 000 FCFA</li><li>Instagram Ads : maximum 1 000 000 FCFA</li><li>Google Search : maximum 2 000 000 FCFA</li><li>Email : maximum 1 000 000 FCFA</li><li>TV : maximum 2 000 000 FCFA</li></ul>",
          "reponse": "<p><strong>Choix du modèle :</strong> Je choisis le modèle <strong>Time-Decay</strong> car il reflète mieux la réalité du parcours client. Les actions récentes sont généralement plus influentes, mais les actions plus anciennes ont aussi contribué à la conversion. Le modèle linéaire est trop simpliste et le Last-Click ignore complètement les efforts des autres canaux. <strong>[citation:6]</strong> <strong>[citation:7]</strong></p><p><strong>Calcul du ROI par canal (basé sur le modèle Time-Decay) :</strong></p><ul><li><strong>Facebook Ads :</strong> Coût moyen = 500 FCFA/clic. Si on dépense 1 500 000 FCFA, on obtient 3 000 clics. Crédit moyen par clic ≈ 57% d'une conversion. Conversions = 3 000 × 0.57 ≈ 1 710. Revenu = 1 710 × 150 000 = 256 500 000 FCFA. ROI = (256 500 000 - 1 500 000) / 1 500 000 ≈ 17 000%.</li><li><strong>Google Search :</strong> Coût moyen = 600 FCFA/clic. Pour 2 000 000 FCFA, on obtient 3 333 clics. Crédit ≈ 28% d'une conversion. Conversions = 3 333 × 0.28 ≈ 933. Revenu = 933 × 150 000 = 139 950 000 FCFA. ROI = (139 950 000 - 2 000 000) / 2 000 000 ≈ 6 898%.</li></ul><p><strong>Réallocation optimale :</strong> En priorisant les canaux avec le meilleur ROI et en respectant les contraintes de capacité :</p><ul><li><strong>Facebook Ads :</strong> 1 500 000 FCFA (maximum autorisé)</li><li><strong>Google Search :</strong> 2 000 000 FCFA (maximum autorisé)</li><li><strong>Instagram Ads :</strong> 1 000 000 FCFA (maximum autorisé)</li><li><strong>Email :</strong> 500 000 FCFA (budget restant)</li><li><strong>TV :</strong> 0 FCFA (car son ROI est difficile à calculer avec les données disponibles, et il consomme une part importante du budget pour un seul point de contact)</li></ul><p>Cette allocation maximise le nombre de points de contact avec les canaux les plus rentables, tout en respectant les contraintes de capacité et en diversifiant les canaux pour toucher différents segments de clients.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Marketing Mix Modeling (MMM) (7 points)",
      "points": "7 pts",
      "enonce": "<p>TechBuy.cm souhaite maintenant utiliser le Marketing Mix Modeling (MMM) pour optimiser son budget à long terme. L'entreprise dispose des données suivantes pour les 12 derniers mois :</p><div style='background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;border:1px solid #dee2e6;'><table style='width:100%;border-collapse:collapse;'><thead><tr style='background:#e9ecef;'><th style='padding:8px;border:1px solid #dee2e6;'>Mois</th><th style='padding:8px;border:1px solid #dee2e6;'>Ventes (millions FCFA)</th><th style='padding:8px;border:1px solid #dee2e6;'>Dépenses TV (millions FCFA)</th><th style='padding:8px;border:1px solid #dee2e6;'>Dépenses Digitales (millions FCFA)</th><th style='padding:8px;border:1px solid #dee2e6;'>Dépenses Promotions (millions FCFA)</th></tr></thead><tbody><tr><td style='padding:8px;border:1px solid #dee2e6;'>Jan</td><td style='padding:8px;border:1px solid #dee2e6;'>18</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td><td style='padding:8px;border:1px solid #dee2e6;'>1</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Fév</td><td style='padding:8px;border:1px solid #dee2e6;'>20</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td><td style='padding:8px;border:1px solid #dee2e6;'>4</td><td style='padding:8px;border:1px solid #dee2e6;'>1</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Mar</td><td style='padding:8px;border:1px solid #dee2e6;'>22</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Avr</td><td style='padding:8px;border:1px solid #dee2e6;'>25</td><td style='padding:8px;border:1px solid #dee2e6;'>4</td><td style='padding:8px;border:1px solid #dee2e6;'>6</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Mai</td><td style='padding:8px;border:1px solid #dee2e6;'>24</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>1</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Juin</td><td style='padding:8px;border:1px solid #dee2e6;'>28</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>7</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Juil</td><td style='padding:8px;border:1px solid #dee2e6;'>30</td><td style='padding:8px;border:1px solid #dee2e6;'>4</td><td style='padding:8px;border:1px solid #dee2e6;'>8</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Août</td><td style='padding:8px;border:1px solid #dee2e6;'>32</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>9</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Sep</td><td style='padding:8px;border:1px solid #dee2e6;'>29</td><td style='padding:8px;border:1px solid #dee2e6;'>4</td><td style='padding:8px;border:1px solid #dee2e6;'>8</td><td style='padding:8px;border:1px solid #dee2e6;'>2</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Oct</td><td style='padding:8px;border:1px solid #dee2e6;'>33</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>10</td><td style='padding:8px;border:1px solid #dee2e6;'>3</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Nov</td><td style='padding:8px;border:1px solid #dee2e6;'>35</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td><td style='padding:8px;border:1px solid #dee2e6;'>11</td><td style='padding:8px;border:1px solid #dee2e6;'>4</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>Déc</td><td style='padding:8px;border:1px solid #dee2e6;'>40</td><td style='padding:8px;border:1px solid #dee2e6;'>6</td><td style='padding:8px;border:1px solid #dee2e6;'>12</td><td style='padding:8px;border:1px solid #dee2e6;'>5</td></tr></tbody></table></div><p>Le modèle MMM estimé par régression linéaire multiple est le suivant :</p><div class='math-block'><div class='math'>$$ Ventes = 5 + 2 \\times TV + 1.5 \\times Digital + 3 \\times Promotions $$</div></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Interprétez les coefficients du modèle MMM. Que signifient les valeurs <strong>2</strong> pour la TV, <strong>1.5</strong> pour le Digital, et <strong>3</strong> pour les Promotions ?</p>",
          "reponse": "<p>Les coefficients du modèle MMM représentent l'impact marginal de chaque canal sur les ventes, en maintenant les autres canaux constants :</p><ul><li><strong>TV (coefficient = 2) :</strong> Une augmentation de 1 million de FCFA des dépenses TV est associée à une augmentation de 2 millions de FCFA des ventes, toutes choses égales par ailleurs.</li><li><strong>Digital (coefficient = 1.5) :</strong> Une augmentation de 1 million de FCFA des dépenses Digitales est associée à une augmentation de 1.5 million de FCFA des ventes.</li><li><strong>Promotions (coefficient = 3) :</strong> Une augmentation de 1 million de FCFA des dépenses de Promotion est associée à une augmentation de 3 millions de FCFA des ventes. C'est le canal avec l'impact le plus fort sur les ventes, selon ce modèle. <strong>[citation:4]</strong> <strong>[citation:6]</strong></li></ul><p>L'ordonnée à l'origine (5) représente les ventes de base en l'absence de tout investissement marketing.</p>"

          "reponse": "<p>Pour maximiser les ventes, il faut allouer le budget en priorité au canal avec le coefficient le plus élevé (le plus grand impact marginal). L'ordre de priorité est donc :</p><ol><li><strong>Promotions (coefficient = 3)</strong> : le plus efficace. On alloue le maximum autorisé : 8 millions FCFA. Budget restant : 30 - 8 = 22 millions FCFA.</li><li><strong>TV (coefficient = 2)</strong> : deuxième plus efficace. On alloue le maximum autorisé : 10 millions FCFA. Budget restant : 22 - 10 = 12 millions FCFA.</li><li><strong>Digital (coefficient = 1.5)</strong> : le moins efficace des trois. On alloue le budget restant : 12 millions FCFA (qui est inférieur au maximum de 15 millions).</li></ol><p><strong>Allocation optimale :</strong> Promotions = 8M, TV = 10M, Digital = 12M.</p><p><strong>Ventes prédites :</strong> \( Ventes = 5 + 2 \\times 10 + 1.5 \\times 12 + 3 \\times 8 = 5 + 20 + 18 + 24 = 67 \) millions FCFA.</p><p>Cette allocation maximise les ventes en se basant sur les coefficients du modèle MMM, tout en respectant les contraintes de capacité. <strong>[citation:4]</strong> <strong>[citation:8]</strong></p>"
        },
        {
          "question": "<p><strong>3)</strong> Un dirigeant de TechBuy.cm affirme que <em>\"les promotions sont le canal le plus efficace car elles ont le coefficient le plus élevé dans le MMM\"</em>. Discutez de cette affirmation en évoquant les limites du MMM et les concepts de <strong>corrélation vs causalité</strong> et de <strong>rendements décroissants</strong>.</p>",
          "reponse": "<p>Cette affirmation mérite d'être nuancée pour plusieurs raisons :</p><ul><li><strong>Corrélation vs causalité :</strong> Le MMM est un modèle statistique basé sur des données historiques. Il identifie des corrélations, mais pas nécessairement des relations causales. Par exemple, les promotions sont souvent réalisées pendant les périodes de forte demande (ex: fêtes de fin d'année). Le modèle pourrait attribuer à la promotion des ventes qui auraient eu lieu de toute façon. <strong>[citation:3]</strong> <strong>[citation:10]</strong></li><li><strong>Rendements décroissants :</strong> Le modèle MMM suppose un impact linéaire des dépenses sur les ventes. En réalité, chaque canal a des rendements décroissants : au-delà d'un certain seuil, chaque FCFA supplémentaire génère de moins en moins de ventes. Le coefficient de 3 pour les promotions pourrait ne pas être valable si on double les dépenses de promotion. <strong>[citation:2]</strong> <strong>[citation:4]</strong></li><li><strong>Effets à long terme :</strong> Le MMM ne capture pas toujours bien les effets à long terme des canaux de marque (comme la TV). Un coefficient plus faible sur le court terme peut cacher un impact plus fort sur la notoriété et les ventes futures. <strong>[citation:4]</strong></li><li><strong>Qualité des données :</strong> Le modèle dépend de la qualité des données historiques. Si les données ne sont pas suffisantes ou si elles contiennent des biais, les coefficients peuvent être inexacts. <strong>[citation:3]</strong> <strong>[citation:10]</strong></li></ul><p>Pour valider cette affirmation, il serait nécessaire de mener des <strong>tests d'incrémentabilité</strong> (geo holdout tests, tests A/B) pour mesurer l'impact causal réel des promotions, et d'utiliser des modèles MMM plus avancés qui intègrent les rendements décroissants (ex: modèles Bayésiens, modèles non-linéaires). <strong>[citation:2]</strong> <strong>[citation:5]</strong> <strong>[citation:6]</strong></p>"
        }

          "reponse": "<p><strong>Différence fondamentale :</strong></p><ul><li><strong>Tests d'incrémentabilité (geo holdout tests) :</strong> Ce sont des expériences contrôlées qui mesurent l'effet causal d'une campagne ou d'un canal en comparant un groupe exposé (groupe test) à un groupe non exposé (groupe témoin). Ils répondent à la question : <em>\"Quelle est l'augmentation réelle des ventes générée par cette campagne ?\"</em> <strong>[citation:4]</strong> <strong>[citation:6]</strong></li><li><strong>Algorithmes de bandits manchots :</strong> Ce sont des algorithmes d'apprentissage en ligne qui optimisent en temps réel l'allocation du budget entre plusieurs options (les \"bras\") en explorant les options moins testées et en exploitant les options qui semblent les plus performantes. Ils répondent à la question : <em>\"Comment allouer mon budget maintenant pour maximiser les gains à long terme ?\"</em> <strong>[citation:7]</strong></li></ul><p><strong>Situations recommandées :</strong></p><ul><li><strong>Tests d'incrémentabilité :</strong> Pour valider les hypothèses du MMM, pour mesurer l'impact d'un nouveau canal ou d'une nouvelle stratégie, pour justifier des décisions budgétaires importantes auprès de la direction. Ils sont particulièrement utiles pour les canaux hors-ligne (TV, radio) ou les canaux où les données d'attribution sont peu fiables. <strong>[citation:6]</strong></li><li><strong>Bandits manchots :</strong> Pour l'optimisation en temps réel des campagnes digitales, pour tester simultanément plusieurs variantes (ex: plusieurs créations publicitaires), pour s'adapter rapidement aux changements de comportement des consommateurs. Ils sont efficaces lorsque les données sont disponibles en temps réel et que les coûts d'exploration sont faibles. <strong>[citation:7]</strong></li></ul>"

es relations causales et non sur de simples corrélations. <strong>[citation:12]</strong></li></ul>\n</div><p>Cette approche en trois couches (stratégique, causale, tactique) permet à TechBuy.cm de prendre des décisions éclairées à tous les niveaux, en combinant la puissance prédictive du MMM, la rigueur des tests d'incrémentabilité et la réactivité des bandits manchots. <strong>[citation:10]</strong> <strong>[citation:12]</strong></p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
