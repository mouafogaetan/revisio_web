<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6 : Projet Pratique - Attribution et Optimisation du Budget",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur l'Attribution et le MMM",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>Cet exercice évalue votre compréhension des concepts fondamentaux du Marketing Mix Modeling (MMM) et de l'Attribution.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (3 pts)</strong> Expliquez la différence fondamentale entre le <strong>Marketing Mix Modeling (MMM)</strong> et le <strong>Multi-Touch Attribution (MTA)</strong>. Dans quel contexte chaque approche est-elle la plus pertinente ?</p>",
          "reponse": "<p>Le MMM est une approche <strong>stratégique et globale</strong> (top-down) qui analyse les données agrégées (ex: dépenses mensuelles par canal, ventes) pour estimer l'impact des efforts marketing sur les performances commerciales. Il est idéal pour l'allocation budgétaire stratégique et l'évaluation des canaux hors-ligne [citation:9]. L'MTA est une approche <strong>tactique et granulaire</strong> (bottom-up) qui attribue les conversions aux points de contact individuels dans le parcours client. Il est plus adapté aux optimisations en temps réel et aux canaux digitaux [citation:4].</p>"
        },
        {
          "question": "<p><strong>2. (3 pts)</strong> Parmi les modèles d'attribution suivants : <strong>Last-Click</strong>, <strong>Linear</strong>, <strong>Time-Decay</strong> et <strong>Position-Based</strong>, lequel est le plus adapté pour mesurer l'efficacité d'une campagne de notoriété (branding) sur les réseaux sociaux ? Justifiez votre réponse.</p>",
          "reponse": "<p>Le modèle <strong>Position-Based</strong> (ou U-Shaped) est le plus adapté car il accorde 40% du crédit au premier point de contact et 40% au dernier, les 20% restants étant répartis entre les interactions intermédiaires [citation:4]. Pour une campagne de notoriété, l'objectif est de capter l'attention initiale. Le modèle Position-Based valorise ce premier contact, ce que ne ferait pas un modèle comme le Last-Click.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mise en Pratique et Calculs",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>Vous êtes consultant pour une entreprise camerounaise de distribution d'énergie solaire. Vous disposez des données mensuelles suivantes pour les 12 derniers mois :</p><ul><li><strong>Ventes</strong> : en millions de FCFA</li><li><strong>Dépenses Facebook</strong> : en milliers de FCFA</li><li><strong>Dépenses Radio</strong> : en milliers de FCFA</li></ul><p>Un modèle MMM simple a été estimé, donnant la formule suivante :</p><div class='math-block' style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$ \\text{Ventes} = 50 + 0.8 \\times \\text{Facebook} + 0.5 \\times \\text{Radio} $$</div></div><p>Où les coefficients (0.8 et 0.5) représentent l'impact marginal de chaque canal sur les ventes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Le budget total pour le mois prochain est de <strong>20 millions de FCFA</strong> (soit 20 000 milliers de FCFA). Vous devez allouer ce budget entre Facebook et Radio pour <strong>maximiser les ventes</strong>. Sachant que vous ne pouvez pas dépenser plus de 15 000 milliers de FCFA sur Facebook, quelle est la répartition optimale du budget ?</p>",
          "reponse": "<p>Étant donné que le coefficient de Facebook (0.8) est supérieur à celui de la Radio (0.5), chaque FCFA dépensé sur Facebook génère plus de ventes. Pour maximiser les ventes, il faut donc allouer le budget maximum autorisé à Facebook, soit <strong>15 000 milliers de FCFA</strong>. Le reste du budget (20 000 - 15 000 = 5 000 milliers de FCFA) sera alloué à la Radio.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Calculez le <strong>Retour sur Investissement (ROI)</strong> marginal pour chaque canal, sachant qu'une vente marginale génère un bénéfice de <strong>2 millions de FCFA</strong>. Le ROI marginal est défini comme : (Bénéfice marginal - Coût) / Coût.</p>",
          "reponse": "<p>Le bénéfice marginal pour Facebook est de 0.8 * 2 = 1.6 million de FCFA. Le ROI marginal = (1.6 - 1) / 1 = 60%. <br>Le bénéfice marginal pour la Radio est de 0.5 * 2 = 1.0 million de FCFA. Le ROI marginal = (1.0 - 1) / 1 = 0%.</p>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> Expliquez le concept de <strong>saturation publicitaire</strong> en vous basant sur l'exemple ci-dessus. Comment la prise en compte de la saturation pourrait-elle modifier la répartition du budget optimal trouvée à la question 1 ?</p>",
          "reponse": "<p>La <strong>saturation publicitaire</strong> désigne le phénomène où l'efficacité d'un canal marketing diminue à mesure que les dépenses augmentent. Dans notre exemple, le modèle suppose un impact linéaire constant, ce qui est irréaliste. En réalité, au-delà d'un certain seuil, l'impact marginal de Facebook diminuerait, et l'allouer à la Radio deviendrait plus rentable. L'optimisation intégrant la saturation utiliserait des fonctions de réponse (ex: courbes de Hill) pour trouver l'équilibre où les ROI marginaux sont égaux [citation:11].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de Cas - Application sur un Marché Local",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>Une brasserie locale, <strong>'Bière du Sahel'</strong>, souhaite optimiser sa stratégie marketing pour la fin d'année. Elle investit dans trois canaux :</p><ul><li><strong>Télévision (TV)</strong> : pour la notoriété de la marque.</li><li><strong>Réseaux Sociaux (RS)</strong> : pour l'engagement et la promotion.</li><li><strong>Promotions en magasin (PM)</strong> : pour inciter à l'achat.</li></ul><p>La brasserie a mené une analyse sur les 6 derniers mois et souhaite appliquer l'<strong>équilibre marginal</strong> pour allouer son budget de 30 millions de FCFA.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Définissez le principe de l'<strong>équilibre marginal</strong> dans le contexte de l'optimisation du budget marketing.</p>",
          "reponse": "<p>Le principe de l'<strong>équilibre marginal</strong> stipule que pour maximiser l'efficacité d'un budget marketing, il faut répartir les dépenses entre les canaux de manière que les <strong>retours marginaux</strong> (le bénéfice supplémentaire apporté par le dernier FCFA investi) soient <strong>égaux</strong> sur tous les canaux [citation:11]. Si un canal offre un retour marginal plus élevé qu'un autre, il est plus rentable d'y réallouer une partie du budget.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Voici les données estimées pour les canaux :</p><table style='width:100%; border-collapse: collapse;'><tr style='background-color: #f2f2f2;'><td style='padding:8px; border:1px solid #ddd;'><strong>Canal</strong></td><td style='padding:8px; border:1px solid #ddd;'><strong>Dépenses Actuelles (millions FCFA)</strong></td><td style='padding:8px; border:1px solid #ddd;'><strong>ROI Marginal Estimé</strong></td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>TV</td><td style='padding:8px; border:1px solid #ddd;'>12</td><td style='padding:8px; border:1px solid #ddd;'>1.5</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>RS</td><td style='padding:8px; border:1px solid #ddd;'>10</td><td style='padding:8px; border:1px solid #ddd;'>2.0</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>PM</td><td style='padding:8px; border:1px solid #ddd;'>8</td><td style='padding:8px; border:1px solid #ddd;'>1.2</td></tr></table><p>Proposez une <strong>réallocation du budget</strong> (en justifiant) pour améliorer le retour global, sachant que le budget total est de 30 millions et que vous pouvez ajuster les dépenses de ±2 millions par canal.</p>",
          "reponse": "<p>Le ROI marginal le plus élevé est celui des Réseaux Sociaux (2.0). Pour maximiser le retour global, il faut réallouer le budget des canaux avec le ROI marginal le plus faible (Promotions en magasin, 1.2) vers le plus performant. <br><strong>Proposition :</strong> Augmenter le budget des RS de 2 millions (passant à 12 millions) en le prélevant sur les PM (qui passent à 6 millions). Le nouveau ROI marginal des RS diminuera probablement, mais devrait rester supérieur à celui des PM. Une autre option serait de réduire légèrement la TV (11 millions) pour l'ajouter aux RS (11 millions), si les contraintes le permettent.</p>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> La brasserie souhaite évaluer l'impact d'une campagne de notoriété sur la TV. Expliquez comment un <strong>test d'incrémentalité (Geo-Lift)</strong> pourrait être mis en place pour mesurer l'impact causal de la TV sur les ventes dans la région de Douala.</p>",
          "reponse": "<p>Un test <strong>Geo-Lift</strong> consiste à sélectionner deux groupes de régions similaires (ex: Douala et Yaoundé). On suspend la publicité TV dans le groupe test (Douala) pendant une période définie, tandis que le groupe contrôle (Yaoundé) continue de recevoir la publicité. On compare ensuite l'évolution des ventes entre les deux groupes. La différence de performance (lift) est attribuée à l'impact causal de la publicité TV [citation:5]. Ce test est particulièrement utile pour les canaux hors-ligne où l'attribution est difficile.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
