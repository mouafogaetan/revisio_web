<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Segmentation Client avec RFM et Clustering",
      "points": "8 pts",
      "enonce": "<p>Le responsable marketing d'une entreprise de e-commerce vous confie un projet de segmentation client. Vous disposez d'un extrait du CRM contenant les données de 1000 clients.</p><p>Le dataset contient les colonnes suivantes : <code>client_id</code>, <code>date_dernier_achat</code>, <code>nb_achats_total</code>, <code>montant_total_depense</code>, <code>age</code>, <code>ville</code>.</p>",
      "questions": [
        {
          "question": "1) Calculez les scores RFM (Récence, Fréquence, Montant) pour chaque client. Expliquez comment vous interpréteriez un client avec un score RFM de 5-5-5. (2 pts)",
          "reponse": "Pour calculer les scores RFM :<br/>- <strong>Récence (R)</strong> : nombre de jours depuis le dernier achat. Plus petit = meilleur. On divise les clients en 5 quintiles du plus récent au plus ancien (5 = plus récent).<br/>- <strong>Fréquence (F)</strong> : nombre total d'achats. Plus grand = meilleur. Quintiles du plus fréquent au moins fréquent (5 = plus fréquent).<br/>- <strong>Montant (M)</strong> : montant total dépensé. Plus grand = meilleur. Quintiles du plus dépensier au moins dépensier (5 = plus dépensier).<br/><br/>Un client avec un score <strong>5-5-5</strong> est le meilleur client possible : il a acheté récemment, très fréquemment, et a dépensé le plus. C'est un client fidèle et très rentable, à choyer avec des offres VIP."
        },
        {
          "question": "2) Après avoir calculé les scores RFM, vous décidez d'appliquer un clustering K-Means. Quelles variables utilisez-vous pour le clustering ? Pourquoi devez-vous normaliser ces variables ? (2 pts)",
          "reponse": "Les variables utilisées pour le clustering sont les <strong>scores RFM</strong> (R, F, M) ou directement les valeurs brutes de récence, fréquence et montant. On peut aussi ajouter d'autres variables comme l'âge.<br/><br/>Il est <strong>essentiel de normaliser</strong> (standardisation avec StandardScaler) car les variables n'ont pas la même échelle : la récence peut être de 0 à 365 jours, la fréquence de 1 à 100, le montant de 10 à 10 000 €. Sans normalisation, le montant dominerait le calcul des distances et le clustering serait biaisé."
        },
        {
          "question": "3) Vous obtenez 4 clusters. Interprétez les centroïdes suivants. Proposez une stratégie marketing pour chaque segment. (4 pts)",
          "reponse": "<strong>Centroïdes obtenus :</strong><br/><br/><strong>Cluster 1 :</strong> R=5, F=2, M=2<br/>- <strong>Profil :</strong> Clients récents mais avec une fréquence et un montant moyens. Ce sont des nouveaux clients prometteurs.<br/>- <strong>Stratégie :</strong> Les fidéliser rapidement avec des offres de bienvenue et des programmes de parrainage.<br/><br/><strong>Cluster 2 :</strong> R=1, F=5, M=5<br/>- <strong>Profil :</strong> Anciens clients très fréquents et très dépensiers. Ce sont des clients perdus mais très rentables.<br/>- <strong>Stratégie :</strong> Campagne de réactivation avec des offres spéciales (ex: réduction de 20% sur le prochain achat).<br/><br/><strong>Cluster 3 :</strong> R=3, F=5, M=3<br/>- <strong>Profil :</strong> Clients réguliers, fréquence élevée mais panier moyen modéré.<br/>- <strong>Stratégie :</strong> Augmenter le panier moyen avec du cross-selling et des offres groupées.<br/><br/><strong>Cluster 4 :</strong> R=5, F=5, M=5<br/>- <strong>Profil :</strong> Meilleurs clients : récents, fréquents, très dépensiers.<br/>- <strong>Stratégie :</strong> Programme de fidélité premium, accès anticipé aux nouvelles collections, invitations à des événements exclusifs."
        }
      ]
    },
    {
      "titre": "Analyse d'un Tunnel de Conversion",
      "points": "4 pts",
      "enonce": "<p>Vous analysez le tunnel de conversion d'un site e-commerce pour identifier les points de friction. Les données du mois dernier sont les suivantes :</p><ul><li>Visiteurs uniques : 10 000</li><li>Pages vues : 35 000</li><li>Ajouts au panier : 1 500</li><li>Début du checkout : 1 200</li><li>Paiement validé : 900</li><li>Confirmation de commande : 870</li></ul>",
      "questions": [
        {
          "question": "1) Calculez les taux de conversion à chaque étape du tunnel. Quelle est l'étape avec la plus forte perte (friction) ? (2 pts)",
          "reponse": "<strong>Taux de conversion :</strong><br/>- Visiteurs → Pages vues : 35 000 / 10 000 = 350% (les visiteurs consultent en moyenne 3,5 pages)<br/>- Pages vues → Ajout panier : 1 500 / 10 000 = <strong>15%</strong><br/>- Ajout panier → Début checkout : 1 200 / 1 500 = <strong>80%</strong><br/>- Début checkout → Paiement : 900 / 1 200 = <strong>75%</strong><br/>- Paiement → Confirmation : 870 / 900 = <strong>96,7%</strong><br/><br/><strong>Point de friction majeur :</strong> L'étape <strong>Visiteurs → Ajout au panier</strong> avec seulement 15% de conversion. C'est ici que la plus forte perte se produit. Les causes possibles : des fiches produits peu convaincantes, des prix trop élevés, ou un manque de confiance."
        },
        {
          "question": "2) Proposez 3 actions concrètes pour améliorer le taux de conversion à cette étape critique. (2 pts)",
          "reponse": "Pour améliorer le taux de conversion Visiteurs → Ajout au panier :<br/><br/>1. <strong>Optimiser les fiches produits</strong> : Ajouter des photos de qualité, des vidéos, des avis clients authentifiés, et un descriptif détaillé avec les caractéristiques techniques.<br/><br/>2. <strong>Rassurer le client</strong> : Ajouter des badges de sécurité, des témoignages clients, et des garanties (livraison gratuite, retour facile).<br/><br/>3. <strong>Faciliter l'action</strong> : Un bouton \"Ajouter au panier\" bien visible, avec un appel à l'action clair. Proposer une suggestion de produits complémentaires pour augmenter la valeur du panier."
        }
      ]
    },
    {
      "titre": "Analyse de Sentiments sur Twitter",
      "points": "4 pts",
      "enonce": "<p>Une marque de cosmétiques lance une nouvelle gamme de produits. Vous récupérez 500 tweets mentionnant la marque et la nouvelle gamme. Après annotation manuelle, vous obtenez la distribution suivante : 300 tweets positifs, 120 négatifs, 80 neutres.</p>",
      "questions": [
        {
          "question": "1) Calculez le score de sentiment global (polarité) pour cette campagne sur une échelle de -1 (très négatif) à 1 (très positif). Interprétez le résultat. (1.5 pts)",
          "reponse": "Le score de sentiment se calcule comme : (Positif - Négatif) / Total<br/><br/>Soit : (300 - 120) / 500 = 180 / 500 = <strong>0,36</strong><br/><br/>Le score de 0,36 indique une <strong>opinion globalement positive</strong> (entre 0,2 et 0,5). La campagne est bien accueillie, mais il y a encore une proportion significative d'avis négatifs (24%) à surveiller."
        },
        {
          "question": "2) Pour une analyse plus fine, vous décidez d'utiliser l'analyse de sentiments au niveau des aspects. Citez 3 aspects que vous pourriez analyser pour cette gamme de cosmétiques. (1.5 pts)",
          "reponse": "Trois aspects à analyser :<br/><br/>1. <strong>La qualité du produit</strong> : Les clients sont-ils satisfaits de la texture, du rendu, de la tenue ?<br/><br/>2. <strong>Le prix</strong> : Le rapport qualité-prix est-il jugé bon ou trop élevé ?<br/><br/>3. <strong>L'emballage et le design</strong> : L'esthétique du produit est-elle appréciée ? Est-il facile à utiliser ?"
        },
        {
          "question": "3) Proposez une stratégie pour traiter les tweets négatifs identifiés. (1 pt)",
          "reponse": "Stratégie de traitement des tweets négatifs :<br/><br/>1. <strong>Priorisation</strong> : Répondre en priorité aux tweets négatifs les plus viraux ou émanant d'influenceurs.<br/><br/>2. <strong>Réponse personnalisée</strong> : Ne pas répondre automatiquement. Proposer une solution concrète (remboursement, échange, conseil d'utilisation).<br/><br/>3. <strong>Analyse des causes</strong> : Si un même problème remonte souvent (ex: allergie, mauvaise odeur), remonter l'information à l'équipe R&D pour améliorer le produit."
        }
      ]
    },
    {
      "titre": "Choix d'un Modèle d'Attribution",
      "points": "4 pts",
      "enonce": "<p>Un client a interagi avec votre marque à travers plusieurs canaux avant d'acheter un produit à 100 € :</p><ul><li>J-7 : Clic sur une publicité Facebook (coût : 0,50 €)</li><li>J-5 : Recherche Google (coût : 1,00 €)</li><li>J-3 : Clic sur une newsletter (coût : 0,10 €)</li><li>J-1 : Clic sur une publicité display (coût : 0,80 €)</li><li>J-0 : Conversion sur le site via un clic direct</li></ul>",
      "questions": [
        {
          "question": "1) Attribuez la conversion (100 €) selon les modèles suivants : last-click, first-click, linear et position-based. (2 pts)",
          "reponse": "<strong>Attribution des crédits (100 €) :</strong><br/><br/>- <strong>Last-click</strong> : 100 € au dernier canal (clic direct).<br/><br/>- <strong>First-click</strong> : 100 € au premier canal (Facebook).<br/><br/>- <strong>Linear</strong> : 100 € / 5 = <strong>20 € par canal</strong> (Facebook, Google, Newsletter, Display, Direct).<br/><br/>- <strong>Position-based</strong> : 40% au premier (Facebook) = 40 €, 40% au dernier (Direct) = 40 €, et les 20% restants (20 €) répartis entre les canaux intermédiaires (Google, Newsletter, Display) soit 6,66 € chacun."
        },
        {
          "question": "2) Le modèle last-click est souvent critiqué. Expliquez pourquoi et proposez une alternative data-driven. (2 pts)",
          "reponse": "Le modèle <strong>last-click est critiqué</strong> car il attribue 100% du crédit au dernier canal, ignorant tous les efforts marketing précédents qui ont pourtant contribué à la conversion. Par exemple, la newsletter qui a rappelé le produit au client n'est pas récompensée.<br/><br/>Une <strong>alternative data-driven</strong> consiste à utiliser un <strong>modèle d'attribution algorithmique</strong> (ex: Markov Chains, Shapley Value). Ces modèles analysent l'historique des parcours clients pour estimer la contribution réelle de chaque canal, en tenant compte des interactions et des chemins alternatifs. Ils sont plus justes mais nécessitent des données de parcours clients complètes."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
