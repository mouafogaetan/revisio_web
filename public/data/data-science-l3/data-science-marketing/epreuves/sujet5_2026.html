<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
    "classe": "Licence 3 Data Science",
    "sequence": "Évaluation Séquentielle N°5",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Exercice 1 : Questions de Cours (8 pts)",
            "points": "8 pts",
            "enonce": "<div style='font-family: Arial, sans-serif; padding: 5px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>Répondez de manière claire et concise aux questions suivantes en vous appuyant sur les notions vues en cours.</p></div>",
            "questions": [
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>1) (2 pts)</strong> Définissez le <em>Marketing Data-Driven</em> et expliquez en quoi il se distingue d'une approche marketing traditionnelle.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'>Le Marketing Data-Driven est une approche qui consiste à prendre des décisions marketing basées sur l'analyse de données plutôt que sur l'intuition ou l'expérience seule. Il se distingue de l'approche traditionnelle par l'utilisation systématique des données pour comprendre les clients, mesurer l'efficacité des campagnes et optimiser les stratégies en temps réel.</div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>2) (2 pts)</strong> Citez et expliquez brièvement deux métriques marketing clés : le <strong>CAC</strong> (Customer Acquisition Cost) et le <strong>LTV</strong> (Customer Lifetime Value).</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'>Le <strong>CAC</strong> (Coût d'Acquisition Client) est le coût total engagé pour acquérir un nouveau client (marketing, ventes, etc.). Le <strong>LTV</strong> (Valeur Vie Client) est le chiffre d'affaires total qu'un client génère pendant toute sa relation avec l'entreprise. L'équilibre idéal est d'avoir un LTV supérieur au CAC (généralement LTV > 3x CAC).</div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>3) (2 pts)</strong> Qu'est-ce que l'analyse de cohortes ? Donnez un exemple d'application dans le cadre d'une campagne marketing.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'>L'analyse de cohortes consiste à regrouper les clients en fonction d'une caractéristique commune (ex : mois de premier achat) et à suivre leur comportement dans le temps. Exemple : suivre le taux de rétention des clients acquis en janvier vs ceux acquis en juin pour voir si une campagne promotionnelle a amélioré la fidélisation des clients.</div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>4) (2 pts)</strong> Expliquez le principe du <strong>filtrage collaboratif</strong> dans les systèmes de recommandation et citez un exemple concret d'application.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'>Le filtrage collaboratif est une technique de recommandation qui prédit les préférences d'un utilisateur en se basant sur les préférences d'utilisateurs similaires. Il existe deux approches : user-based (recommandations basées sur les utilisateurs proches) et item-based (recommandations basées sur les articles similaires). Exemple : les recommandations de films sur Netflix ou de produits sur Amazon.</div>"
                }
            ]
        },
        {
            "titre": "Exercice 2 : Étude de Cas - Analyse RFM (6 pts)",
            "points": "6 pts",
            "enonce": "<div style='font-family: Arial, sans-serif; padding: 5px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>Vous êtes Data Scientist dans une entreprise de vente en ligne. Le service marketing vous demande d'analyser le comportement des clients pour optimiser les campagnes de fidélisation.</p><div style='background-color: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='font-size: 15px; color: #1a5276;'><strong>📊 Données clients (extrait) :</strong></p><ul style='font-size: 14px; line-height: 1.8; color: #1a5276;'><li><strong>Client A :</strong> Dernier achat = 5 jours, Fréquence = 12 achats, Montant total = 450 000 FCFA</li><li><strong>Client B :</strong> Dernier achat = 90 jours, Fréquence = 2 achats, Montant total = 35 000 FCFA</li><li><strong>Client C :</strong> Dernier achat = 15 jours, Fréquence = 8 achats, Montant total = 280 000 FCFA</li><li><strong>Client D :</strong> Dernier achat = 200 jours, Fréquence = 1 achat, Montant total = 120 000 FCFA</li></ul></div><p style='font-size: 15px; line-height: 1.6; color: #333;'>Le scoring RFM est défini comme suit :<br>• Récence (R) : 1 (≥ 90 jours) à 5 (≤ 7 jours)<br>• Fréquence (F) : 1 (1-2 achats) à 5 (≥ 10 achats)<br>• Montant (M) : 1 (≤ 50 000 FCFA) à 5 (≥ 400 000 FCFA)</p></div>",
            "questions": [
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>1) (3 pts)</strong> Calculez le score RFM pour chacun des quatre clients.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><p><strong>Client A :</strong> R=5, F=5, M=5 → Score = 555</p><p><strong>Client B :</strong> R=1, F=2, M=1 → Score = 121</p><p><strong>Client C :</strong> R=4, F=4, M=3 → Score = 443</p><p><strong>Client D :</strong> R=1, F=1, M=3 → Score = 113</p></div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>2) (2 pts)</strong> Classez ces clients en segments (ex : champions, fidèles, clients à risque, clients perdus). Justifiez votre classification.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><p><strong>Client A (555) :</strong> Champion - Très récent, très fréquent et très dépensier.</p><p><strong>Client C (443) :</strong> Fidèle - Récent et fréquent mais dépenses moyennes.</p><p><strong>Client B (121) :</strong> Client à risque - Dernier achat ancien, faible fréquence et faible montant.</p><p><strong>Client D (113) :</strong> Client perdu - Dernier achat très ancien, seul achat unique de montant moyen.</p></div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>3) (1 pt)</strong> Proposez une action marketing ciblée pour le segment des \"clients à risque\".</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'>Pour les clients à risque (comme le Client B), il est recommandé de lancer une campagne de réactivation : envoi d'un email personnalisé avec une offre spéciale (réduction, bon de réduction, etc.) pour les inciter à revenir. L'objectif est de raviver l'intérêt et de créer une nouvelle interaction avant de les considérer comme perdus.</div>"
                }
            ]
        },
        {
            "titre": "Exercice 3 : Modélisation et Analyse (6 pts)",
            "points": "6 pts",
            "enonce": "<div style='font-family: Arial, sans-serif; padding: 5px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>Une entreprise de télécommunications souhaite prédire le <strong>churn client</strong> (désabonnement) pour mettre en place des actions de rétention. Après analyse, les variables suivantes ont été identifiées comme pertinentes : durée de l'abonnement (en mois), nombre d'appels au service client, montant moyen des factures, et utilisation de l'application mobile (1 si utilisé, 0 sinon).</p><p style='font-size: 15px; line-height: 1.6; color: #333;'>Les données montrent que les clients qui ont contacté le service client plus de 3 fois au cours des 6 derniers mois ont un taux de churn de <strong>25%</strong> contre <strong>5%</strong> pour les autres.</p></div>",
            "questions": [
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>1) (2 pts)</strong> Construisez la matrice de confusion pour un échantillon de 1000 clients sachant que 200 clients ont contacté le service client plus de 3 fois. Utilisez les taux de churn fournis.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><p>Pour 200 clients avec >3 appels : Churn = 200 × 0,25 = 50 clients ; Non-churn = 200 - 50 = 150 clients</p><p>Pour 800 clients avec ≤3 appels : Churn = 800 × 0,05 = 40 clients ; Non-churn = 800 - 40 = 760 clients</p><div style='background-color: #f4f6f7; padding: 10px; border-radius: 5px; margin: 10px 0;'><p style='font-size: 14px; color: #2c3e50;'><strong>Matrice de confusion :</strong></p><p style='font-size: 14px; color: #2c3e50;'>VP (Churn prédit, Churn réel) = 50<br>FP (Churn prédit, Non-churn réel) = 150<br>VN (Non-churn prédit, Non-churn réel) = 760<br>FN (Non-churn prédit, Churn réel) = 40</p></div></div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>2) (2 pts)</strong> Calculez la <strong>précision</strong> (accuracy) du modèle et interprétez le résultat.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><div class='math-block' style='background-color: #f4f6f7; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math' style='font-size: 18px; color: #2c3e50;'>Accuracy = (VP + VN) / Total = (50 + 760) / 1000 = 810 / 1000 = <strong>81%</strong></div></div><p style='font-size: 15px; line-height: 1.6; color: #333;'>Le modèle a une précision de 81%, ce qui signifie qu'il classifie correctement 81% des clients. Cependant, le modèle identifie mieux les non-churn (760/800) que les churn (50/90), ce qui pourrait nécessiter une amélioration du rappel pour les clients à risque.</p></div>"
                },
                {
                    "question": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><strong>3) (2 pts)</strong> Calculez le <strong>Rappel</strong> (Recall) et la <strong>Précision</strong> (Precision) pour la classe \"Churn\". Interprétez ces métriques.</div>",
                    "reponse": "<div style='font-size: 15px; line-height: 1.6; color: #333;'><div class='math-block' style='background-color: #f4f6f7; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math' style='font-size: 18px; color: #2c3e50;'>Recall = VP / (VP + FN) = 50 / (50 + 40) = 50/90 ≈ <strong>55,6%</strong><br>Precision = VP / (VP + FP) = 50 / (50 + 150) = 50/200 = <strong>25%</strong></div></div><p style='font-size: 15px; line-height: 1.6; color: #333;'>Le <strong>rappel de 55,6%</strong> indique que le modèle identifie environ 56% des clients qui vont réellement se désabonner. Le <strong>précision de 25%</strong> signifie que seulement 25% des clients identifiés comme churn le sont réellement. Ce faible score suggère que le modèle a beaucoup de faux positifs (150 clients classés à tort comme churn), ce qui n'est pas idéal pour des actions de rétention ciblées.</p></div>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
