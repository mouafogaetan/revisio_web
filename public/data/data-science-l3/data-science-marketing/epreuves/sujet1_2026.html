<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation C : Data Science pour le Marketing - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°1 (Semestre 1)",
  "anneeScolaire": "2026-2027",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements du Marketing Analytique",
      "points": "6 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Dans le cadre de votre stage au sein d'une entreprise de télécommunications au Cameroun, le directeur marketing souhaite moderniser la stratégie de l'entreprise. Il vous demande de l'aider à comprendre comment les données peuvent améliorer les décisions marketing.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (2 pts)</strong> Définissez le <strong>marketing data-driven</strong> et énumérez <strong>trois</strong> de ses objectifs principaux.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Le marketing data-driven est une approche stratégique qui consiste à utiliser l'analyse des données et des informations clients pour orienter et optimiser toutes les décisions marketing. Il ne s'agit pas seulement de collecter des données, mais de les transformer en insights actionnables.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Ses objectifs sont notamment :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Personnalisation :</strong> Adapter les messages et les offres à chaque client.</li><li><strong>Optimisation du ROI :</strong> Allouer le budget aux canaux et campagnes les plus performants.</li><li><strong>Compréhension client :</strong> Mieux connaître le parcours, les préférences et les freins des clients.</li></ul>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2 pts)</strong> Identifiez <strong>quatre</strong> sources de données marketing essentielles pour l'entreprise. Expliquez en quoi <strong>chacune</strong> est utile.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Les quatre sources de données sont :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>CRM (Customer Relationship Management) :</strong> Contient les données clients (nom, historique d'achat, interactions avec le service client). Permet une connaissance fine des clients existants.</li><li><strong>Données web (Google Analytics) :</strong> Traque le comportement sur le site web (pages visitées, temps passé, abandon de panier). Aide à comprendre les intentions et les points de friction.</li><li><strong>Réseaux sociaux :</strong> Données sur l'engagement des utilisateurs, les mentions de la marque, les sentiments exprimés. Permet d'évaluer la notoriété et la réputation de la marque.</li><li><strong>Données transactionnelles :</strong> Historique des achats, montants dépensés. Permet de calculer des métriques clés comme le LTV.</li></ul>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>3. (2 pts)</strong> À l'aide d'un exemple concret lié au Cameroun, décrivez le <strong>cycle de vie du client</strong> pour un abonnement mobile.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Le cycle de vie du client pour un abonnement mobile au Cameroun peut se décomposer comme suit :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Acquisition :</strong> Un client voit une publicité pour un nouveau forfait data 5G sur Facebook et clique sur l'annonce.</li><li><strong>Activation :</strong> Le client se rend en boutique ou souscrit en ligne pour activer sa nouvelle ligne.</li><li><strong>Rétention :</strong> L'entreprise lui envoie des offres personnalisées par SMS (ex : double data le week-end) pour l'inciter à rester.</li><li><strong>Croissance :</strong> Le client, satisfait, ajoute une option de streaming à son forfait.</li><li><strong>Churn :</strong> Si le client n'est pas satisfait (couverture réseau, prix), il peut résilier son abonnement pour un concurrent.</li></ul><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>L'analyse de données à chaque étape permet d'optimiser les actions marketing.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Métriques et Indicateurs Marketing",
      "points": "7 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Pour valider la performance des campagnes, le directeur marketing vous demande de calculer des métriques clés à partir des données du dernier trimestre.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (2 pts)</strong> Définissez le <strong>CAC (Customer Acquisition Cost)</strong> et le <strong>LTV (Customer Lifetime Value)</strong>. Expliquez leur importance pour la rentabilité.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>CAC (Coût d'Acquisition Client) :</strong> C'est le coût total engagé pour acquérir un nouveau client. Il se calcule en divisant le budget total de la campagne marketing (salaires, publicité, etc.) par le nombre de nouveaux clients acquis.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>LTV (Valeur Vie Client) :</strong> C'est le bénéfice net total qu'un client génère pour l'entreprise durant toute la durée de sa relation avec celle-ci.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Leur importance est cruciale : pour qu'une entreprise soit rentable, la <strong>LTV doit être supérieure au CAC</strong>. Un ratio LTV/CAC sain (généralement >3) indique que l'entreprise investit efficacement pour acquérir des clients rentables.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2.5 pts)</strong> Une campagne sur les réseaux sociaux a coûté <strong>2 500 000 FCFA</strong> et a attiré <strong>100 nouveaux clients</strong>. Calculez le <strong>CAC</strong> de cette campagne.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Un client de cette campagne dépense en moyenne <strong>25 000 FCFA</strong> par mois et reste abonné pendant <strong>12 mois</strong> en moyenne, avec une marge de 30%. Calculez la <strong>LTV</strong> de ce client.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Calcul du CAC :</strong> 2 500 000 FCFA / 100 nouveaux clients = <strong>25 000 FCFA</strong>.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Calcul de la LTV :</strong></p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li>Chiffre d'affaires total généré = 25 000 FCFA/mois × 12 mois = <strong>300 000 FCFA</strong>.</li><li>Bénéfice net (marge) = 300 000 FCFA × 30% = <strong>90 000 FCFA</strong>.</li></ul><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>La LTV de ce client est donc de <strong>90 000 FCFA</strong>.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Analyse du ratio LTV/CAC :</strong> Le ratio est de 90 000 / 25 000 = <strong>3.6</strong>. Un ratio supérieur à 3 indique une campagne très rentable.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>3. (2.5 pts)</strong> Expliquez la différence entre le <strong>ROI</strong> d'une campagne et son <strong>taux de conversion</strong>. Comment sont-ils liés pour un e-commerce ?</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Taux de conversion :</strong> Indique le pourcentage de visiteurs qui effectuent l'action souhaitée (exemple : achat).</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>ROI (Retour sur Investissement) :</strong> Mesure la rentabilité financière d'une campagne.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Lien entre les deux pour un e-commerce :</strong></p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Hypothèse 1 :</strong> Le taux de conversion est un des leviers principaux pour améliorer le ROI.</li><li><strong>Hypothèse 2 :</strong> Le ROI prend également en compte les revenus générés (influencés par le taux de conversion et la valeur du panier) et les coûts.</li><li><strong>Conclusion :</strong> Augmenter le taux de conversion se traduira par une augmentation du ROI, à condition de ne pas augmenter les coûts de la campagne de manière disproportionnée.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse du Comportement Client",
      "points": "7 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Votre entreprise a lancé une nouvelle offre de forfait mobile en décembre 2025. Le directeur marketing souhaite évaluer la performance de l'acquisition et de la rétention de ces nouveaux clients.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (2 pts)</strong> Définissez l'<strong>analyse de cohortes</strong>. Expliquez son utilité pour analyser la performance du nouveau forfait.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>L'analyse de cohortes est une technique statistique qui consiste à regrouper des clients en fonction d'une caractéristique commune, souvent leur date d'acquisition (cohorte temporelle).</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Pour le nouveau forfait, l'entreprise pourrait par exemple créer des cohortes par mois d'acquisition :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li>Les clients ayant souscrit en décembre 2025.</li><li>Les clients ayant souscrit en janvier 2026.</li></ul><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>L'analyse de ces cohortes permet de répondre à des questions clés :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Taux de rétention :</strong> Quel pourcentage des clients de la cohorte de décembre est encore actif après 2 mois ?</li><li><strong>Churn :</strong> À quel moment les clients ont-ils tendance à résilier leur abonnement ?</li></ul><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Ces insights permettent de détecter des problèmes et d'optimiser les actions marketing pour améliorer la fidélisation.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2.5 pts)</strong> Expliquez la méthode <strong>RFM</strong> (Récence, Fréquence, Montant). Comment peut-elle être appliquée pour personnaliser les offres des clients de l'entreprise de télécommunications ?</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>RFM</strong> est une méthode de segmentation comportementale qui classe les clients selon trois dimensions :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Récence :</strong> Depuis combien de temps le client a-t-il effectué son dernier achat ou interaction ?</li><li><strong>Fréquence :</strong> À quelle fréquence le client achète-t-il ?</li><li><strong>Montant :</strong> Quel est le montant total dépensé par le client ?</li></ul><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Pour l'entreprise de télécommunications, cette méthode peut être utilisée pour :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Clients \"Champions\" (Récence faible, Fréquence & Montant élevés) :</strong> Envoyer des offres de remerciement, des programmes de fidélité, ou des invitations à des événements exclusifs.</li><li><strong>Clients à risque de churn (Récence élevée) :</strong> Proposer des offres de réactivation, des bonus de recharge, ou des appels de courtoisie pour comprendre leur mécontentement.</li><li><strong>Grands dépensiers (Montant élevé) :</strong> Leur proposer des forfaits premium ou des options avantageuses.</li></ul>"

          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Tunnel de conversion :</strong> Un tunnel de conversion représente les étapes clés qu'un visiteur doit suivre pour devenir client. Pour l'achat d'un forfait mobile :</p><ol style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Étape 1 :</strong> Visite de la page d'accueil du site.</li><li><strong>Étape 2 :</strong> Consultation de la page des forfaits mobiles.</li><li><strong>Étape 3 :</strong> Sélection d'un forfait.</li><li><strong>Étape 4 :</strong> Remplissage du formulaire d'inscription (informations personnelles, coordonnées).</li><li><strong>Étape 5 :</strong> Choix du mode de paiement et validation de l'achat.</li></ol><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Points de friction et solutions :</strong></p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Friction 1 (Étape 4) :</strong> Le formulaire d'inscription est trop long. <strong>Solution :</strong> Réduire le nombre de champs obligatoires (ex: utiliser le numéro de téléphone comme identifiant) et intégrer une option de connexion via les réseaux sociaux.</li><li><strong>Friction 2 (Étape 4/5) :</strong> Les options de paiement ne sont pas claires ou sont limitées. <strong>Solution :</strong> Mettre en avant les options de paiement mobile (Mobile Money) populaires au Cameroun, comme Orange Money ou MTN Mobile Money, dès le début du formulaire.</li></ul>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
