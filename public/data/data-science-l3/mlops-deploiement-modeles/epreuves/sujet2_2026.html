<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "MLOps et Déploiement de Modèles - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Évaluation Séquentielle 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours",
     "points": "8 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Répondez de manière claire et concise aux questions suivantes. Chaque réponse est notée sur 2 points.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Définissez le MLOps et ses objectifs principaux. Distinguez-le du DevOps.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le MLOps (Machine Learning Operations) est un ensemble de pratiques visant à déployer et à maintenir des modèles de Machine Learning en production de manière fiable et efficace. Ses objectifs sont d'automatiser le cycle de vie des modèles, de garantir leur performance et leur qualité, et de faciliter la collaboration entre les équipes. Contrairement au DevOps, qui se concentre sur le déploiement de logiciels, le MLOps intègre des spécificités comme la gestion des données, le versionnement des modèles, et le monitoring de la dérive des données.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Décrivez les différents modes de déploiement d'un modèle en production (batch, online, streaming) et leurs contraintes respectives.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Batch :</strong> Le modèle est exécuté sur des lots de données à intervalles réguliers. La latence n'est pas critique, mais la scalabilité et le traitement de gros volumes sont importants.</li><li><strong>Online :</strong> Le modèle est déployé comme un service qui répond en temps réel. La latence est très critique et la scalabilité doit être garantie.</li><li><strong>Streaming :</strong> Le modèle traite des flux de données en continu. La latence doit être faible pour traiter les événements en temps quasi-réel.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Expliquez le rôle des serveurs de modèles (Model Serving) dans l'architecture d'un système ML. Citez deux serveurs de modèles et leurs cas d'usage.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les serveurs de modèles sont des outils qui permettent de déployer des modèles entraînés pour l'inférence. Ils les exposent via une API (REST/gRPC), gèrent les versions, le batching et le monitoring. <strong>TensorFlow Serving</strong> est idéal pour les modèles TensorFlow, et <strong>TorchServe</strong> pour les modèles PyTorch.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4)</strong> Quels sont les piliers du MLOps ? Pourquoi l'automatisation est-elle fondamentale ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les piliers du MLOps sont le CI/CD (Intégration Continue/Déploiement Continu), le monitoring et le versionnement. L'automatisation est fondamentale car elle réduit les erreurs humaines, accélère le cycle de développement, et garantit la reproductibilité des expériences et des déploiements.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : CI/CD pour un Modèle de Prédiction",
     "points": "8 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Contexte :</strong> Une entreprise de logistique souhaite déployer un modèle pour prédire les délais de livraison. L'équipe a développé un modèle XGBoost et veut mettre en place un pipeline CI/CD avec GitHub Actions.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Proposez les étapes d'un pipeline CI/CD pour ce modèle, en détaillant les phases d'intégration continue et de déploiement continu. (3 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Intégration Continue (CI) :</strong></p><ul><li>Exécution des tests unitaires et de données.</li><li>Entraînement du modèle sur un échantillon de validation.</li><li>Validation des performances (comparaison avec le modèle en production).</li><li>Packaging du modèle (artefact) et construction de l'image Docker.</li></ul><p><strong>Déploiement Continu (CD) :</strong></p><ul><li>Déploiement de l'image sur un environnement de staging.</li><li>Tests de performance (latence, débit).</li><li>Déploiement progressif en production (Canary Deployment).</li><li>Rollback automatique en cas d'échec.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Quels tests devez-vous inclure dans la phase CI pour garantir la qualité du modèle ? (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Tests unitaires :</strong> Vérification des fonctions de prétraitement et du code.</li><li><strong>Tests de données :</strong> Validation du schéma et de la qualité des données (valeurs manquantes, outliers).</li><li><strong>Tests du modèle :</strong> Calcul des métriques de performance (précision, F1) sur un jeu de validation.</li><li><strong>Tests d'intégration :</strong> Vérification que l'API et le modèle fonctionnent ensemble.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Expliquez comment vous géreriez les différentes versions du modèle dans ce pipeline. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Pour gérer les versions :</p><ul><li>Utiliser un registre de modèles (ex: MLflow Model Registry) pour stocker et versionner les modèles entraînés.</li><li>Chaque nouveau modèle est tagué avec une version (ex: v1.0, v2.0).</li><li>Le pipeline CI/CD peut automatiquement enregistrer le modèle après validation.</li><li>En production, on peut déployer une version spécifique ou utiliser des stratégies de déploiement (Canary) pour tester une nouvelle version.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4)</strong> Comment assurer le rollback en cas de problème en production ? (1 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Un rollback peut être assuré en :</p><ul><li>Conservant les versions précédentes du modèle dans le registre.</li><li>Configurant le pipeline CD pour qu'il puisse redéployer automatiquement la dernière version stable.</li><li>Utilisant des stratégies comme le Blue-Green ou le Canary, qui permettent de basculer facilement entre deux versions.</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Conteneurisation et Orchestration",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Contexte :</strong> L'entreprise a décidé d'utiliser Docker et Kubernetes pour déployer son modèle de prédiction. L'API est développée avec FastAPI.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Décrivez les étapes pour conteneuriser l'API FastAPI avec Docker. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ol><li>Écrire un <strong>Dockerfile</strong> : spécifier l'image de base (python:3.9-slim), installer les dépendances (requirements.txt), copier le code et le modèle.</li><li>Construire l'image : <code>docker build -t mon-api:latest .</code></li><li>Tester l'image localement : <code>docker run -p 8000:8000 mon-api:latest</code>.</li><li>Pousser l'image vers un registre (ex: Docker Hub, AWS ECR).</li></ol></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Expliquez comment vous déploieriez cette image sur Kubernetes. Quels objets Kubernetes utiliseriez-vous ? (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Deployment :</strong> Pour gérer les réplicas (Pods) de l'API, définir l'image, les variables d'environnement.</li><li><strong>Service :</strong> Pour exposer l'API (ex: LoadBalancer) à l'extérieur du cluster.</li><li><strong>ConfigMap/Secret :</strong> Pour gérer les configurations (ex: liens vers le modèle) et les secrets (identifiants).</li><li><strong>Ingress :</strong> Optionnel, pour le routage avancé.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Comment Kubernetes assure-t-il la scalabilité et la résilience de ce déploiement ? (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Scalabilité :</strong> Horizontal Pod Autoscaler (HPA) ajuste automatiquement le nombre de réplicas en fonction de la charge (CPU, mémoire).</li><li><strong>Résilience :</strong> Les Pods sont répartis sur plusieurs nœuds. Les sondes de santé (liveness/readiness) redémarrent les Pods défaillants. Le contrôleur de réplication maintient le nombre souhaité de réplicas.</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Monitoring et Observabilité",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Une fois le modèle en production, vous devez mettre en place un système de monitoring.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Expliquez la différence entre Data Drift et Concept Drift. Donnez un exemple pour chacun. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Data Drift :</strong> La distribution des variables d'entrée change. Exemple : les clients deviennent plus jeunes, donc la distribution de l'âge change.</li><li><strong>Concept Drift :</strong> La relation entre les variables d'entrée et la cible change. Exemple : la relation entre le revenu et le risque de défaut de paiement change à cause d'une crise économique.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Quels indicateurs (métriques) devez-vous surveiller pour ce modèle de prédiction de livraison ? (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Métriques système :</strong> Latence de l'API, débit (requêtes/seconde), utilisation CPU/mémoire, taux d'erreur.</li><li><strong>Métriques du modèle :</strong> Distribution des prédictions, erreur moyenne (MAE, RMSE) si la ground truth est disponible, dérive des variables d'entrée (Data Drift).</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Comment configureriez-vous une alerte pour détecter une dégradation de performance du modèle ? (2 pts)</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
