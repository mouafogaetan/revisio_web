<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "MLOps et Déploiement de Modèles - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 1 - Introduction au MLOps",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Fondamentaux du MLOps",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#2d3748;'>\n  <p>Cet exercice porte sur les concepts fondamentaux du MLOps, son cycle de vie, et sa comparaison avec le DevOps.</p>\n  <div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p><strong>Contexte :</strong> La société <em>AfriData</em>, une entreprise camerounaise spécialisée dans l'analyse de données, souhaite mettre en place une stratégie MLOps pour ses modèles de Machine Learning. Actuellement, les modèles sont développés dans des notebooks par des Data Scientists et déployés manuellement en production, ce qui entraîne des problèmes de reproductibilité et de monitoring.</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:10px;'><strong>1. (2 pts)</strong> Définissez le MLOps et expliquez ses objectifs principaux. En quoi diffère-t-il du DevOps ?</div>",
          "reponse": "<div style='background: #ebf8ff; padding: 12px; border-radius: 8px; color: #1e3a8a;'>\n  <p><strong>MLOps</strong> est un ensemble de pratiques qui vise à automatiser et à standardiser le cycle de vie des modèles de Machine Learning, de l'expérimentation à la production [citation:8][citation:12].</p>\n  <p><strong>Objectifs principaux :</strong></p>\n  <ul>\n    <li>Assurer la reproductibilité des expériences et des résultats.</li>\n    <li>Automatiser l'entraînement, les tests et le déploiement des modèles.</li>\n    <li>Surveiller les performances des modèles en production (détection des dérives).</li>\n    <li>Faciliter la collaboration entre Data Scientists, Data Engineers et DevOps.</li>\n  </ul>\n  <p><strong>Différence avec le DevOps :</strong> Le MLOps étend les pratiques DevOps en ajoutant des spécificités liées au Machine Learning [citation:8]. Contrairement au DevOps qui se concentre sur le code, le MLOps doit gérer trois artefacts : le <strong>code</strong>, les <strong>données</strong> et les <strong>modèles</strong> [citation:8]. De plus, le MLOps intègre des composants comme le suivi d'expériences, la gestion du data drift et le versionnement des données [citation:1][citation:4].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>2. (2 pts)</strong> Décrivez le cycle de vie d'un modèle en production selon les principes du MLOps. Identifiez les étapes clés.</div>",
          "reponse": "<div style='background: #f0fff4; padding: 12px; border-radius: 8px; color: #14532d;'>\n  <p>Le cycle de vie d'un modèle en production comprend les étapes suivantes [citation:4][citation:12] :</p>\n  <ol>\n    <li><strong>Préparation des données :</strong> Collecte, nettoyage, et transformation des données (ETL/ELT).</li>\n    <li><strong>Exploration et expérimentation :</strong> Analyse exploratoire et entraînement de modèles par les Data Scientists.</li>\n    <li><strong>Validation du modèle :</strong> Évaluation des performances du modèle sur des données de validation (tests offline).</li>\n    <li><strong>Déploiement :</strong> Passage en production (API, batch, ou streaming).</li>\n    <li><strong>Monitoring :</strong> Surveillance des performances (latence, précision) et détection des dérives (data drift, concept drift) [citation:1][citation:4].</li>\n    <li><strong>Ré-entraînement :</strong> Si nécessaire, déclencher un nouvel entraînement pour mettre à jour le modèle.</li>\n  </ol>\n  <p>Le MLOps vise à automatiser et à itérer sur ce cycle pour garantir la fiabilité et la performance des modèles en production [citation:6][citation:10].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>3. (2 pts)</strong> Dans le contexte d'AfriData, identifiez au moins trois risques liés à l'absence de MLOps (déploiement manuel) et proposez une solution pour chacun d'eux.</div>",
          "reponse": "<div style='background: #fff7ed; padding: 12px; border-radius: 8px; color: #7c2d12;'>\n  <p><strong>Risque 1 : Manque de reproductibilité</strong><br>\n  Sans versionnement du code et des données, il est impossible de reproduire un résultat ou de comprendre pourquoi un modèle a été déployé.<br>\n  <strong>Solution :</strong> Utiliser Git pour le code, DVC pour les données, et MLflow pour le suivi des expériences [citation:1][citation:12].</p>\n  <p><strong>Risque 2 : Dégradation silencieuse des performances</strong><br>\n  Un modèle peut se dégrader dans le temps à cause du data drift ou du concept drift, sans que l'équipe le sache [citation:4].<br>\n  <strong>Solution :</strong> Mettre en place un système de monitoring avec Prometheus et Grafana, et des alertes pour détecter les baisses de performance [citation:1].</p>\n  <p><strong>Risque 3 : Erreurs de déploiement et temps d'arrêt</strong><br>\n  Le déploiement manuel est source d'erreurs et peut entraîner des temps d'arrêt du service [citation:6].<br>\n  <strong>Solution :</strong> Automatiser le déploiement via un pipeline CI/CD (GitHub Actions, Jenkins) et utiliser des stratégies comme le canary ou le blue/green [citation:3][citation:12].</p>\n</div>"
        }
      ]
    },
    {
      "titre": "Les Piliers du MLOps",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#2d3748;'>\n  <p>Le MLOps repose sur plusieurs piliers fondamentaux qui permettent d'assurer la fiabilité et la scalabilité des systèmes ML en production.</p>\n  <div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p><strong>Contexte :</strong> AfriData décide de structurer sa démarche MLOps autour de trois piliers : le CI/CD, le monitoring et le versionnement. Vous êtes chargé de les mettre en œuvre pour un modèle de prédiction de churn.</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:10px;'><strong>1. (2 pts)</strong> Expliquez le rôle du <strong>versionnement</strong> dans le MLOps. Quels artefacts doivent être versionnés et pourquoi ?</div>",
          "reponse": "<div style='background: #f3e8ff; padding: 12px; border-radius: 8px; color: #4c1d95;'>\n  <p>Le versionnement est un pilier essentiel du MLOps car il garantit la traçabilité et la reproductibilité des modèles. Il permet de revenir à une version antérieure en cas de problème [citation:3].</p>\n  <p><strong>Artefacts à versionner :</strong></p>\n  <ul>\n    <li><strong>Code :</strong> Le code d'entraînement et de l'API (via Git) [citation:3].</li>\n    <li><strong>Données :</strong> Les jeux de données d'entraînement et de validation (via DVC) [citation:3].</li>\n    <li><strong>Modèles :</strong> Les poids du modèle entraîné et les hyperparamètres (via un Model Registry comme MLflow) [citation:3].</li>\n    <li><strong>Environnement :</strong> Les dépendances et la configuration (via Docker et requirements.txt) [citation:3].</li>\n  </ul>\n  <p>Le versionnement permet de savoir exactement quel code, quelles données et quel environnement ont produit un modèle donné [citation:3].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>2. (2 pts)</strong> Qu'est-ce que le <strong>CI/CD</strong> dans le contexte du MLOps ? Décrivez un pipeline CI/CD typique pour un modèle de Machine Learning.</div>",
          "reponse": "<div style='background: #ebf8ff; padding: 12px; border-radius: 8px; color: #1e3a8a;'>\n  <p>Le CI/CD (Continuous Integration / Continuous Deployment) est l'automatisation des tests, de l'entraînement et du déploiement des modèles [citation:8].</p>\n  <p><strong>Pipeline CI/CD typique :</strong></p>\n  <ul>\n    <li><strong>CI (Continuous Integration) :</strong> À chaque commit, on exécute des tests sur le code, les données (qualité, validation), et les performances du modèle [citation:1][citation:4].</li>\n    <li><strong>CD (Continuous Deployment) :</strong> Si les tests sont validés, on déploie automatiquement le modèle en production (API, batch, ou streaming).</li>\n    <li><strong>CT (Continuous Training) :</strong> Optionnellement, on peut déclencher un ré-entraînement du modèle si les performances chutent [citation:4].</li>\n  </ul>\n  <p>Le CI/CD permet de réduire les erreurs de déploiement et d'accélérer la mise à disposition des modèles [citation:6].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>3. (2 pts)</strong> Le <strong>monitoring</strong> est le troisième pilier. Expliquez ce qu'est le <strong>data drift</strong> et le <strong>concept drift</strong>, et comment les détecter.</div>",
          "reponse": "<div style='background: #fff7ed; padding: 12px; border-radius: 8px; color: #7c2d12;'>\n  <p><strong>Data Drift :</strong> C'est le changement dans la distribution des données d'entrée (features) par rapport aux données d'entraînement [citation:4].</p>\n  <ul>\n    <li><strong>Cause :</strong> Changement de comportement des utilisateurs, saisonnalité, nouvelle population.</li>\n    <li><strong>Détection :</strong> On compare la distribution des données en production avec celle des données d'entraînement à l'aide de tests statistiques (ex: KS test, KL-divergence) [citation:12].</li>\n  </ul>\n  <p><strong>Concept Drift :</strong> C'est le changement dans la relation entre les données d'entrée et la cible (la variable à prédire) [citation:4].</p>\n  <ul>\n    <li><strong>Cause :</strong> Évolution du contexte métier (ex: nouvelle réglementation, changement de marché).</li>\n    <li><strong>Détection :</strong> On surveille l'évolution des métriques de performance (précision, rappel) dans le temps [citation:4].</li>\n  </ul>\n  <p>Le monitoring permet de détecter ces dérives et de déclencher un ré-entraînement pour maintenir la performance du modèle [citation:1].</p>\n</div>"
        }
      ]
    },
    {
      "titre": "Architecture et Déploiement d'un Système ML",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#2d3748;'>\n  <p>Cet exercice aborde les modes de déploiement, les contraintes de production, et les serveurs de modèles.</p>\n  <div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p><strong>Contexte :</strong> AfriData souhaite déployer un modèle de prédiction de fraude en temps réel pour son application mobile de paiement. Le modèle est entraîné avec TensorFlow et doit répondre en moins de 100 ms.</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:10px;'><strong>1. (2 pts)</strong> Distinguez les modes de déploiement <strong>batch</strong>, <strong>online</strong> et <strong>streaming</strong>. Quel mode recommandez-vous pour la prédiction de fraude en temps réel ?</div>",
          "reponse": "<div style='background: #f0fff4; padding: 12px; border-radius: 8px; color: #14532d;'>\n  <p><strong>Batch :</strong> Les prédictions sont effectuées sur des lots de données à intervalle régulier (ex: chaque nuit). Latence élevée (minutes/heures). Convient aux tâches de reporting ou de scoring périodiques [citation:3].</p>\n  <p><strong>Online (ou Real-time) :</strong> Le modèle est exposé via une API qui reçoit des requêtes et renvoie des prédictions instantanément. Latence très faible (< 100 ms) [citation:3].</p>\n  <p><strong>Streaming :</strong> Le modèle traite les données en flux continu (ex: depuis Kafka) et génère des prédictions en quasi temps réel [citation:2].</p>\n  <p><strong>Recommandation :</strong> Pour la détection de fraude en temps réel, le mode <strong>online</strong> est le plus adapté car il garantit une latence très faible et une réactivité immédiate [citation:1].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>2. (3 pts)</strong> Quelles sont les contraintes de production à prendre en compte pour ce type de déploiement ? (latence, scalabilité, fiabilité). Proposez des solutions pour chacune.</div>",
          "reponse": "<div style='background: #f3e8ff; padding: 12px; border-radius: 8px; color: #4c1d95;'>\n  <p><strong>Latence :</strong> L'API doit répondre en moins de 100 ms [citation:3].<br>\n  <strong>Solution :</strong> Utiliser un serveur de modèles performant (TensorFlow Serving, ONNX Runtime), optimiser le modèle (quantification, pruning), et utiliser des instances CPU/GPU adaptées [citation:3].</p>\n  <p><strong>Scalabilité :</strong> Le système doit gérer des pics de trafic (ex: pendant les promotions).<br>\n  <strong>Solution :</strong> Utiliser un orchestrateur de conteneurs (Kubernetes) avec auto-scaling pour ajuster le nombre de réplicas en fonction de la charge [citation:2][citation:3].</p>\n  <p><strong>Fiabilité :</strong> Le système doit être résilient et tolérant aux pannes.<br>\n  <strong>Solution :</strong> Mettre en place un monitoring (Prometheus, Grafana), des alertes, et des stratégies de déploiement comme le canary ou le blue/green pour les mises à jour sans interruption [citation:3][citation:6].</p>\n</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>3. (3 pts)</strong> Présentez le concept de <strong>serveur de modèles (Model Serving)</strong>. Citez trois solutions et comparez-les selon leurs cas d'usage.</div>",
          "reponse": "<div style='background: #ebf8ff; padding: 12px; border-radius: 8px; color: #1e3a8a;'>\n  <p>Un <strong>serveur de modèles</strong> est un service qui expose un modèle entraîné sous forme d'API, gère les requêtes et les réponses, et assure la scalabilité [citation:5][citation:7].</p>\n  <p><strong>Solutions :</strong></p>\n  <ul>\n    <li><strong>TensorFlow Serving :</strong> Spécialisé pour les modèles TensorFlow. Très performant et intègre le versionnement des modèles [citation:5]. Idéal pour les applications TensorFlow en production.</li>\n    <li><strong>TorchServe :</strong> Conçu pour les modèles PyTorch. Offre des fonctionnalités de gestion de versions et de monitoring [citation:5].</li>\n    <li><strong>ONNX Runtime :</strong> Supporte de nombreux frameworks (TensorFlow, PyTorch, Scikit-learn). Permet une inférence optimisée sur CPU et GPU [citation:3].</li>\n  </ul>\n  <p><strong>Comparaison :</strong> TensorFlow Serving et TorchServe sont spécialisés, tandis qu'ONNX Runtime est polyvalent. Le choix dépend du framework utilisé [citation:5].</p>\n</div>"
        }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
