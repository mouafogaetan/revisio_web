<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "MLOps et Déploiement de Modèles - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Épreuve séquentielle n°3 : Plateformes de déploiement et Outils MLOps",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "1. Écosystème MLOps et Plateformes de Déploiement",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; color: #1a1a2e; margin-bottom: 15px;'><strong>Contexte :</strong> Dans le cadre de la digitalisation des services financiers de la CEMAC, une institution panafricaine cherche à déployer un système de scoring de crédit basé sur le Machine Learning. L'enjeu est d'évaluer la solvabilité des clients en temps réel pour des demandes de microcrédit, tout en respectant les contraintes réglementaires et en assurant une haute disponibilité. Ce projet pilote est une opportunité pour l'équipe Data Science de se former aux bonnes pratiques du MLOps.</div><p>Vous êtes l'ingénieur MLOps chargé de ce projet. En vous appuyant sur les concepts fondamentaux du MLOps, de l'architecture des systèmes ML et des plateformes de déploiement, répondez aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<div style='font-weight: bold;'>1.1) Définir le MLOps et ses objectifs. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(1 pt)</span></div><p>En une phrase, définissez le MLOps. Puis, listez au moins trois de ses objectifs principaux dans le cadre de ce projet de scoring de crédit.</p>",
          "reponse": "<strong>Définition :</strong> Le MLOps est un ensemble de pratiques visant à déployer et maintenir des modèles de Machine Learning en production de manière fiable, efficace et scalable [citation:7].<br><br><strong>Objectifs pour le projet :</strong><br>1. <strong>Automatisation :</strong> Automatiser l'entraînement, le test et le déploiement du modèle de scoring.<br>2. <strong>Fiabilité et Monitoring :</strong> Surveiller en continu les performances du modèle, détecter les dérives (data/concept drift) pour garantir la pertinence des décisions de crédit.<br>3. <strong>Reproductibilité :</strong> Assurer la reproductibilité des expériences et des versions du modèle [citation:5]."
        },
        {
          "question": "<div style='font-weight: bold;'>1.2) Architecture d'un système ML en production. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Dessinez l'architecture type d'un système ML en production pour ce service de scoring de crédit. Nommez et décrivez au moins quatre composants essentiels que vous intégreriez.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px;'><strong>Architecture proposée :</strong> Ingestion de données (API) ➔ Stockage (Data Lake/Base de données) ➔ Traitement & Prétraitement ➔ Serveur de Modèle (Endpoint de prédiction) ➔ Monitoring.</div><br><strong>Composants :</strong><br>1. <strong>Ingestion de données :</strong> Collecte des données clients via une API REST (FastAPI/Flask).<br>2. <strong>Stockage :</strong> Utilisation d'un Data Lake (S3, GCS) ou d'une base de données sécurisée pour stocker les données historiques et les logs des prédictions.<br>3. <strong>Serveur de Modèle :</strong> Déploiement du modèle de scoring sur un serveur dédié (ex: TensorFlow Serving, TorchServe ou directement via SageMaker/Vertex AI) [citation:6].<br>4. <strong>Orchestration et Tests :</strong> Intégration d'un pipeline CI/CD pour les tests de données et de modèles [citation:6]."
        },
        {
          "question": "<div style='font-weight: bold;'>1.3) AWS SageMaker & Alternatives. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(3 pts)</span></div><p>Comparez les trois principales plateformes de déploiement (AWS SageMaker, GCP AI Platform/Vertex AI, Azure ML) pour ce projet. Pour chaque plateforme, identifiez deux avantages et un inconvénient qui pourraient influencer votre choix pour cette institution financière.</p>",
          "reponse": "<table style='border-collapse: collapse; width: 100%; background: #f8f9fa;'><tr style='background: #343a40; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Plateforme</th><th style='padding: 8px; border: 1px solid #ddd;'>Avantages</th><th style='padding: 8px; border: 1px solid #ddd;'>Inconvénients</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>AWS SageMaker</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>- Plus mature et large écosystème de services [citation:4].<br>- Excellente scalabilité pour les déploiements complexes [citation:6].</td><td style='padding: 8px; border: 1px solid #ddd;'>- Courbe d'apprentissage plus raide ; coûts parfois imprévisibles [citation:4].</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>GCP Vertex AI</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>- Interface développeur-friendly et outillage innovant (AutoML) [citation:6].<br>- Optimisé pour TensorFlow et les TPUs, idéal pour la recherche [citation:4].</td><td style='padding: 8px; border: 1px solid #ddd;'>- Parts de marché plus faibles, ce qui peut limiter l'intégration avec des outils tiers.</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Azure ML</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>- Excellente intégration avec l'écosystème Microsoft, courant en entreprise [citation:6].<br>- Outils renforcés pour l'IA responsable (équité, explicabilité) [citation:4].</td><td style='padding: 8px; border: 1px solid #ddd;'>- Interface parfois fragmentée ; la configuration des autorisations peut être complexe [citation:4].</td></tr></table><p><strong>Recommandation :</strong> AWS SageMaker pourrait être un excellent choix pour sa maturité et sa scalabilité, mais si l'institution utilise déjà des outils Microsoft, Azure ML serait plus cohérent [citation:6]. L'investissement dans la formation sera à prendre en compte.</p>"
        }
      ]
    },
    {
      "titre": "2. Mise en Pratique du CI/CD et Monitoring",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f0fff4; padding: 15px; border-radius: 8px; color: #1a1a2e; margin-bottom: 15px;'><strong>Contexte :</strong> L'équipe a développé un premier modèle de scoring avec une accuracy de 85%. Mais lors des tests en conditions réelles, la latence est parfois trop élevée, et des doutes subsistent sur la stabilité des prédictions dans le temps. Le responsable technique exige une automatisation complète du cycle de vie du modèle.</div><p>Vous devez concevoir un pipeline CI/CD pour ce modèle de Machine Learning et mettre en place un système de monitoring robuste.</p>",
      "questions": [
        {
          "question": "<div style='font-weight: bold;'>2.1) Intégration Continue (CI) pour le ML. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Décrivez les étapes du pipeline d'Intégration Continue (CI) que vous mettriez en place. Expliquez les types de tests qui sont critiques pour un modèle ML avant son déploiement.</p>",
          "reponse": "<strong>Pipeline CI :</strong><br>1. <strong>Déclenchement :</strong> Un commit sur la branche principale du dépôt Git.<br>2. <strong>Tests :</strong><br>   - <strong>Tests de données :</strong> Validation du schéma, détection de valeurs aberrantes, distribution des données d'entrée.<br>   - <strong>Tests de modèles :</strong> Évaluation des performances (accuracy, F1-score), test de non-régression par rapport à la version précédente.<br>   - <strong>Tests d'intégration :</strong> Vérification du bon fonctionnement de l'API de prédiction [citation:5].<br>3. <strong>Package :</strong> Si les tests passent, le modèle est empaqueté (ex: conteneur Docker) et poussé vers un registre d'artefacts."
        },
        {
          "question": "<div style='font-weight: bold;'>2.2) Déploiement Continu (CD) et Stratégies. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(3 pts)</span></div><p>Proposez une stratégie de déploiement (CD) pour minimiser les risques lors de la mise en production de ce modèle. Vous comparerez au moins deux stratégies et justifierez votre choix.</p>",
          "reponse": "<strong>Stratégie de déploiement :</strong><br><strong>Déploiement Canary (ou Canary Release) :</strong> La nouvelle version du modèle est déployée sur une petite partie de l'infrastructure (ex: 10% du trafic). On surveille les métriques et les erreurs pendant une période déterminée. Si tout est stable, on augmente progressivement le trafic vers la nouvelle version [citation:6].<br><br><strong>Comparaison :</strong><br>- <strong>Déploiement Blue/Green :</strong> Déploiement d'une version 'green' en parallèle de la version 'blue' (production). Le basculement se fait d'un bloc (toute l'infrastructure d'un coup). C'est plus risqué, car une erreur impacterait 100% des utilisateurs.<br>- <strong>Déploiement Canary :</strong> Réduit l'impact en cas de bug sur la nouvelle version et permet de valider les performances en conditions réelles avec un faible risque [citation:5]."
        },
        {
          "question": "<div style='font-weight: bold;'>2.3) Observabilité et Monitoring. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Mettez en place une architecture de monitoring pour ce modèle. Quels indicateurs (métriques) et alertes mettriez-vous en place avec des outils comme Prometheus et Grafana ?</p>",
          "reponse": "<strong>Architecture de Monitoring :</strong><br>1. <strong>Collecte de métriques :</strong> Utilisation de <strong>Prometheus</strong> pour récupérer les métriques du serveur de modèle et de l'application.<br>2. <strong>Visualisation :</strong> Tableaux de bord avec <strong>Grafana</strong> pour visualiser les métriques en temps réel.<br>3. <strong>Métriques clés :</strong><br>   - <strong>Performance :</strong> Latence (temps de réponse), débit (requêtes/seconde).<br>   - <strong>Qualité :</strong> Détection de Data Drift et Concept Drift [citation:5].<br>   - <strong>Système :</strong> Utilisation CPU, mémoire.<br>4. <strong>Alertes :</strong> Mise en place d'alertes via Prometheus Alertmanager ou Grafana pour notifier l'équipe en cas de dérive de performance ou de détection de drift."
        }
      ]
    },
    {
      "titre": "3. Problématique Avancée : Data Drift, Sécurité et Orchestration",
      "points": "7 pts",
      "enonce": "<div style='background-color: #fff8f0; padding: 15px; border-radius: 8px; color: #1a1a2e;'><strong>Contexte :</strong> Un an après le déploiement, le taux d'approbation des crédits a chuté. Les performances du modèle se sont dégradées. L'équipe suspecte une évolution du profil des clients (data drift). De plus, une faille de sécurité a été signalée sur le serveur de modèle, et la politique de l'entreprise exige une mise à jour immédiate sans interruption de service.</div><p>Analysez la situation et proposez une solution.</p>",
      "questions": [
        {
          "question": "<div style='font-weight: bold;'>3.1) Data Drift et Concept Drift. <span style='font-style: italic; color: #6c757d; font-weight: normal;'>(2 pts)</span></div><p>Expliquez ce qu'est le Data Drift et le Concept Drift. Donnez un exemple concret pour ce modèle de scoring de crédit. Proposez une solution pour les détecter et les traiter.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
