<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "MLOps et Déploiement de Modèles - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Étude de Cas : Déploiement d'un Modèle de Scoring de Crédit",
      "points": "6 pts",
      "enonce": "<p>Dans le cadre de la digitalisation des services financiers, une fintech camerounaise a développé un modèle de scoring de crédit pour automatiser l'octroi de microcrédits à ses clients. Ce modèle, entraîné avec <strong>scikit-learn</strong>, prédit la solvabilité d'un client à partir de 12 caractéristiques numériques. L'entreprise souhaite déployer ce modèle en production et le rendre accessible via une API REST.</p><p>L'équipe technique a défini les exigences suivantes :</p><ul><li><strong>Latence</strong> : Chaque prédiction doit être effectuée en moins de 200 ms.</li><li><strong>Scalabilité</strong> : L'API doit pouvoir traiter jusqu'à 500 requêtes par minute.</li><li><strong>Versionnement</strong> : Le modèle doit être versionné pour permettre des rollbacks faciles.</li><li><strong>Monitoring</strong> : Les performances du modèle (précision, rappel) et l'état de l'API doivent être surveillés.</li></ul><p>L'équipe propose l'architecture suivante :</p><ul><li>Un service <strong>FastAPI</strong> qui charge le modèle en mémoire.</li><li>Le modèle est sauvegardé au format <code>.pkl</code>.</li><li>L'API est conteneurisée avec <strong>Docker</strong>.</li><li>Le déploiement se fait sur un serveur cloud.</li><li>Les logs sont écrits dans un fichier local.</li></ul>",
      "questions": [
        {
          "question": "<strong>1.1</strong> Identifiez et décrivez les composants de l'architecture proposée qui correspondent aux catégories suivantes : <strong>Ingestion</strong>, <strong>Traitement</strong>, <strong>Serveur de Modèle</strong>, <strong>Stockage</strong>. (2 pts)",
          "reponse": "<p><strong>Ingestion :</strong> Le service FastAPI est le point d'entrée, il reçoit les données (les caractéristiques du client) et les valide via des modèles Pydantic.<br/><strong>Traitement :</strong> Le modèle chargé en mémoire effectue la prédiction.<br/><strong>Serveur de Modèle :</strong> Le service FastAPI, car il héberge le modèle et sert les prédictions.<br/><strong>Stockage :</strong> Le fichier <code>model.pkl</code> stocke le modèle entraîné. Les logs locaux représentent également un stockage d'état.</p>"
        },
        {
          "question": "<strong>1.2</strong> Évaluez les risques associés à cette architecture par rapport aux exigences de <strong>scalabilité</strong> et de <strong>latence</strong>. Proposez des améliorations en vous basant sur les concepts du cours (CI/CD, monitoring, conteneurisation). (4 pts)",
          "reponse": "<p><strong>Risques :</strong></p><ul><li><strong>Scalabilité :</strong> Le modèle est couplé au serveur FastAPI. En cas de pic de charge, un seul conteneur ne suffira pas. Il faudra du scaling horizontal, ce qui nécessite de gérer plusieurs instances du modèle.</li><li><strong>Latence :</strong> Charger le modèle au démarrage peut être lent. Les accès aux logs locaux peuvent aussi introduire de la latence.</li></ul><p><strong>Améliorations :</strong></p><ul><li><strong>Scalabilité :</strong> Déployer l'API dans un cluster Kubernetes avec un <strong>Horizontal Pod Autoscaler (HPA)</strong> qui augmentera le nombre de pods en fonction de la charge. Utiliser un LoadBalancer pour répartir le trafic.</li><li><strong>Latence :</strong> Optimiser le chargement du modèle en utilisant un <strong>serveur de modèles</strong> dédié (ex: <strong>TensorFlow Serving</strong> ou <strong>MLflow Models</strong>) qui est optimisé pour les performances de prédiction.</li><li><strong>Monitoring :</strong> Mettre en place <strong>Prometheus</strong> pour collecter les métriques (latence, requêtes) et <strong>Grafana</strong> pour les visualiser. Remplacer les logs locaux par un système centralisé (ex: ELK Stack).</li><li><strong>Versionnement :</strong> Utiliser <strong>MLflow</strong> pour versionner le modèle et permettre un rollback facile. Le pipeline CI/CD (ex: <strong>GitHub Actions</strong>) peut déployer la nouvelle version via une stratégie blue/green.</li></ul>"
        }
      ]
    },
    {
      "titre": "Versionnement et Suivi d'Expériences avec MLflow",
      "points": "3 pts",
      "enonce": "<p>Une équipe de data scientists travaille sur un projet de classification d'images. Ils testent différentes architectures de réseaux de neurones (ResNet, EfficientNet) et différents hyperparamètres. Ils souhaitent suivre leurs expériences de manière centralisée et versionner leurs modèles pour faciliter la collaboration et le déploiement.</p>",
      "questions": [
        {
          "question": "<strong>2.1</strong> Décrivez comment <strong>MLflow</strong> peut être utilisé pour répondre à ce besoin. Expliquez le rôle des composants suivants : <strong>Tracking</strong>, <strong>Projects</strong>, <strong>Models</strong>, <strong>Model Registry</strong>. (1.5 pts)",
          "reponse": "<ul><li><strong>MLflow Tracking</strong> : Permet d'enregistrer les paramètres (taux d'apprentissage, nombre d'époques), les métriques (précision, F1-score) et les artefacts (graphiques, fichiers du modèle) de chaque expérience.</li><li><strong>MLflow Projects</strong> : Permet de définir un projet reproductible avec ses dépendances (conda) et son point d'entrée, facilitant le partage et l'exécution sur différentes machines.</li><li><strong>MLflow Models</strong> : Offre un format standardisé pour empaqueter les modèles, ce qui facilite leur déploiement.</li><li><strong>MLflow Model Registry</strong> : Gère le cycle de vie des modèles (staging, production, archived), permettant de versionner et de promouvoir les modèles de manière centralisée.</li></ul>"
        },
        {
          "question": "<strong>2.2</strong> Une fois que le modèle est enregistré dans le Model Registry, comment peut-il être déployé en production tout en assurant la reproductibilité de l'environnement ? (1.5 pts)",
          "reponse": "<p>MLflow permet de déployer le modèle en utilisant la commande <code>mlflow models serve</code> qui lance un serveur REST local. Pour un déploiement en production, l'environnement est reproductible car MLflow empaquette le modèle avec toutes ses dépendances (dans un fichier conda.yaml). On peut construire une image Docker à partir de ce modèle (via <code>mlflow models build-docker</code>) et la déployer sur Kubernetes. Le Model Registry assure le suivi des versions et permet un rollback rapide en cas de problème.</p>"
        }
      ]
    },
    {
      "titre": "Monitoring et Détection de Dérive (Drift)",
      "points": "4 pts",
      "enonce": "<p>Un modèle de détection de fraude est en production depuis six mois. Il a été entraîné sur des données de 2025. L'équipe constate une baisse progressive de sa précision. Ils suspectent un <strong>Data Drift</strong> ou un <strong>Concept Drift</strong>.</p>",
      "questions": [
        {
          "question": "<strong>3.1</strong> Distinguez le <strong>Data Drift</strong> du <strong>Concept Drift</strong>. Illustrez votre réponse avec des exemples concrets dans le contexte de la détection de fraude. (2 pts)",
          "reponse": "<p><strong>Data Drift (Dérive des données) :</strong> Changement dans la distribution des données d'entrée (features). Les données que le modèle reçoit en production sont différentes de celles sur lesquelles il a été entraîné.<br/><strong>Exemple :</strong> Le montant moyen des transactions augmente (les fraudeurs utilisent des montants plus élevés). Le modèle n'a pas vu cette nouvelle distribution de montants pendant l'entraînement.<br/><br/><strong>Concept Drift (Dérive du concept) :</strong> Changement dans la relation entre les données d'entrée et la cible. La définition même de ce qui est une fraude évolue.<br/><strong>Exemple :</strong> Les fraudeurs adoptent de nouvelles techniques (ex: micro-transactions) qui n'étaient pas considérées comme frauduleuses auparavant. La relation entre les caractéristiques de la transaction et le fait qu'elle soit frauduleuse a changé.</p>"
        },
        {
          "question": "<strong>3.2</strong> Proposez une stratégie de monitoring pour détecter ces dérives. Quels outils et métriques utiliseriez-vous ? Que faire si une dérive est détectée ? (2 pts)",
          "reponse": "<p><strong>Stratégie de monitoring :</strong><br/><strong>Détection du Data Drift :</strong> Utiliser des tests statistiques (ex: test de Kolmogorov-Smirnov) ou des mesures de distance (ex: divergence de Kullback-Leibler) pour comparer les distributions des données d'entrée sur des fenêtres de temps glissantes. Des outils comme <strong>Evidently AI</strong> ou <strong>Alibi Detect</strong> peuvent être intégrés.<br/><strong>Détection du Concept Drift :</strong> Surveiller les métriques de performance du modèle (précision, rappel, F1-score) sur des fenêtres glissantes. Une baisse significative indique un possible Concept Drift.<br/><strong>Outils :</strong> <strong>Prometheus</strong> pour la collecte de métriques, <strong>Grafana</strong> pour la visualisation, et des alertes (via <strong>Alertmanager</strong>) pour prévenir l'équipe.<br/><br/><strong>Action en cas de dérive :</strong><br/>1. <strong>Investiguer</strong> : Analyser les causes de la dérive (changement de source de données, nouvelles stratégies des fraudeurs).<br/>2. <strong>Ré-entraîner</strong> : Mettre en place un pipeline de retraining (automatisé ou manuel) avec les nouvelles données.<br/>3. <strong>Valider</strong> : Tester le nouveau modèle sur un jeu de validation avant de le déployer.<br/>4. <strong>Déployer</strong> : Utiliser une stratégie de déploiement (blue/green, canary) pour mettre la nouvelle version en production.</p>"
        }
      ]
    },
    {
      "titre": "Pipelines CI/CD pour le Machine Learning",
      "points": "3 pts",
      "enonce": "<p>Une équipe souhaite automatiser le déploiement de ses modèles de Machine Learning. Ils ont un repository GitHub contenant le code d'entraînement, l'API FastAPI, un Dockerfile, et les tests unitaires. Ils veulent mettre en place un pipeline CI/CD avec <strong>GitHub Actions</strong>.</p>",
      "questions": [
        {
          "question": "<strong>4.1</strong> Rédigez un workflow GitHub Actions (en YAML) qui : (a) exécute les tests, (b) construit l'image Docker, (c) pousse l'image sur Docker Hub, (d) déploie sur un serveur (simulé par une commande echo). (1.5 pts)",
          "reponse": "<pre style='background-color: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>name: ML Pipeline CI/CD\n\non:\n  push:\n    branches: [ main ]\n\nenv:\n  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}\n  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/mon-modele-api\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - name: Set up Python\n        uses: actions/setup-python@v4\n        with:\n          python-version: '3.9'\n      - name: Install dependencies\n        run: pip install -r requirements.txt\n      - name: Run tests\n        run: pytest tests/\n\n  build-and-push:\n    needs: test\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - name: Login to Docker Hub\n        uses: docker/login-action@v2\n        with:\n          username: ${{ secrets.DOCKER_USERNAME }}\n          password: ${{ secrets.DOCKER_PASSWORD }}\n      - name: Build and push Docker image\n        uses: docker/build-push-action@v4\n        with:\n          context: .\n          push: true\n          tags: ${{ env.DOCKER_IMAGE }}:latest\n\n  deploy:\n    needs: build-and-push\n    runs-on: ubuntu-latest\n    if: github.ref == 'refs/heads/main'\n    steps:\n      - name: Deploy to server\n        run: |\n          echo \"Déploiement de l'image ${{ env.DOCKER_IMAGE }}:latest\"\n          # Ici, la commande réelle pour déployer sur le serveur (ex: kubectl apply)</pre>"
        },
        {

          "reponse": "<p><strong>Importance des secrets :</strong> Les secrets (comme <code>DOCKER_USERNAME</code> et <code>DOCKER_PASSWORD</code>) sont des variables d'environnement chiffrées qui permettent de stocker des identifiants sensibles (les identifiants Docker Hub) de manière sécurisée dans GitHub. Ils ne sont pas visibles dans les logs du workflow, ce qui empêche les fuites de données.<br/><br/><strong>Ajouts pour intégrer MLflow :</strong><br/>1. Ajouter une étape pour entraîner le modèle et enregistrer l'expérience dans MLflow Tracking (ex: <code>mlflow run</code>).<br/>2. Ajouter une étape pour enregistrer le modèle dans le Model Registry (ex: <code>mlflow register-model</code>).<br/>3. Utiliser le numéro de version du modèle dans le tag de l'image Docker pour associer l'image à une version de modèle.<br/>4. Ajouter une étape de validation du modèle (performance sur un jeu de test) avant le déploiement.</p>"
        }
      ]
    },
    {
      "titre": "Question à Choix Multiples (QCM)",
      "points": "4 pts",
      "enonce": "<p>Cochez la ou les bonnes réponses pour chaque question.</p>",
      "questions": [
        {
          "question": "<strong>5.1</strong> Quels sont les trois piliers fondamentaux du MLOps ? (1 pt)<br/>A. CI/CD, Monitoring, Versionnement<br/>B. Data Engineering, Data Science, DevOps<br/>C. Entraînement, Validation, Déploiement<br/>D. Docker, Kubernetes, Airflow",
          "reponse": "<p>Réponse correcte : <strong>A</strong></p>"
        },
        {
          "question": "<strong>5.2</strong> Lequel de ces outils est principalement utilisé pour l'orchestration de conteneurs ? (1 pt)<br/>A. Docker<br/>B. Kubernetes<br/>C. FastAPI<br/>D. MLflow",
          "reponse": "<p>Réponse correcte : <strong>B</strong></p>"
        },
        {
          "question": "<strong>5.3</strong> Laquelle de ces affirmations concernant le <strong>Data Drift</strong> est vraie ? (1 pt)<br/>A. Le Data Drift est un changement dans la relation entre les entrées et la sortie.<br/>B. Le Data Drift est un changement dans la distribution des données d'entrée.<br/>C. Le Data Drift est détecté en surveillant la précision du modèle.<br/>D. Le Data Drift est un changement dans la version du modèle.",
          "reponse": "<p>Réponse correcte : <strong>B</strong></p>"
        },
        {
          "question": "<strong>5.4</strong> Quel est le rôle du <strong>Model Registry</strong> dans MLflow ? (1 pt)<br/>A. Suivre les paramètres et métriques des expériences.<br/>B. Gérer le cycle de vie des modèles (staging, production, archived).<br/>C. Construire des images Docker.<br/>D. Orchestrer les pipelines de données.",
          "reponse": "<p>Réponse correcte : <strong>B</strong></p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
