<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "MLOps et Déploiement de Modèles - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5 : Outils MLOps et Projets Pratiques",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Diagnostic d'un Pipeline MLOps (8 points)",
      "points": "8 pts",
      "enonce": "<p>Vous êtes consultant en MLOps pour une startup camerounaise spécialisée dans la logistique. Ils ont développé un modèle de prédiction des retards de livraison avec une précision de 90% en validation. Cependant, depuis son déploiement en production il y a 6 mois, la performance a chuté à 70%. L'équipe a constaté que les données d'entrée ont changé : de nouvelles routes ont été ouvertes, et le comportement des livreurs a évolué.</p><p>L'équipe actuelle est composée de 3 data scientists qui entraînent les modèles localement, puis les déploient manuellement sur un serveur EC2 toutes les 2 semaines. Il n'y a pas de monitoring, pas de versionnement des données, et les tests sont quasi inexistants.</p><p><strong>Question : Analysez la situation en vous basant sur les piliers du MLOps (CI/CD, Monitoring, Versionnement) et proposez un plan d'action pour sauver le projet.</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Identifiez et expliquez les trois problèmes majeurs de ce pipeline en les reliant aux piliers du MLOps vus en cours.</p>",
          "reponse": "<p><strong>Problème 1 (Versionnement) :</strong> L'absence de versionnement des données et des modèles [citation:2][citation:10]. Les data scientists entraînent localement sans traçabilité. On ne sait pas quel modèle est en production, ni sur quelles données il a été entraîné. Cela rend impossible la reproductibilité des performances [citation:7].<br><strong>Problème 2 (Monitoring) :</strong> L'absence totale de monitoring [citation:1][citation:5]. La chute de performance de 90% à 70% n'a été détectée que par des plaintes clients. Un monitoring continu avec détection de <strong>Data Drift</strong> (changement des données d'entrée) et de <strong>Concept Drift</strong> (changement de la relation entrée/sortie) aurait permis une détection précoce [citation:1].<br><strong>Problème 3 (CI/CD) :</strong> Le déploiement manuel et peu fréquent [citation:3]. L'absence d'un pipeline CI/CD automatisé entraîne des erreurs humaines, un déploiement lent et une incapacité à réagir rapidement aux changements (ré-entraînement).</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Proposez un plan d'action en trois phases pour corriger ces problèmes.</p>",
          "reponse": "<p><strong>Phase 1 (Urgence - 1 semaine) :</strong> <br>1. Mettre en place un monitoring basique : logger les performances (latence, erreurs) et la distribution des features pour détecter le <strong>Data Drift</strong> [citation:11].<br>2. Effectuer un ré-entraînement manuel avec les données récentes pour stabiliser le modèle en production.<br><strong>Phase 2 (Fondations - 1 mois) :</strong> <br>1. Mettre en place un système de versionnement : Git pour le code, <strong>DVC</strong> pour les données et les modèles [citation:3][citation:7].<br>2. Automatiser l'entraînement et les tests avec un pipeline CI/CD (GitHub Actions) [citation:3].<br><strong>Phase 3 (Industrialisation - 2 mois) :</strong> <br>1. Mettre en place un pipeline de déploiement continu avec des stratégies de déploiement (ex: canary) [citation:1].<br>2. Configurer un ré-entraînement automatique déclenché par la détection de drift [citation:1][citation:5].<br>3. Former l'équipe aux bonnes pratiques MLOps.</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Expliquez comment vous détecteriez le <strong>Concept Drift</strong> dans ce cas, et proposez une stratégie pour le gérer.</p>",
          "reponse": "<p>Le <strong>Concept Drift</strong> se produit lorsque la relation entre les variables d'entrée (routes, livreurs) et la variable cible (retard) change [citation:1]. Ici, l'ouverture de nouvelles routes modifie le temps de trajet, ce qui invalide les anciennes relations.</p><p><strong>Détection :</strong> <br>1. Surveiller la performance (F1-score) en temps réel [citation:1].<br>2. Utiliser des outils comme <strong>Evidently AI</strong> ou <strong>WhyLogs</strong> pour détecter les changements dans la distribution des erreurs du modèle.</p><p><strong>Stratégie :</strong> <br>1. <strong>Ré-entraînement automatique</strong> : Mettre en place un pipeline qui ré-entraîne le modèle automatiquement lorsque le Concept Drift est détecté [citation:5].<br>2. <strong>Data Augmentation</strong> : Ajouter des données simulées des nouvelles routes lors du ré-entraînement.<br>3. <strong>Ensemble de modèles</strong> : Utiliser plusieurs modèles (ancien + nouveaux) avec un mécanisme de pondération pour gérer les changements progressifs [citation:7].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mise en Œuvre d'un Pipeline CI/CD (6 points)",
      "points": "6 pts",
      "enonce": "<p>Vous devez concevoir un pipeline CI/CD pour un modèle de classification de fraudes bancaires. Ce pipeline doit automatiser l'entraînement, les tests, et le déploiement du modèle.</p><p>Le projet est structuré comme suit :</p><ul><li>Code source : GitHub</li><li>Données : Stockées dans un bucket S3 (versionnées avec <strong>DVC</strong>)</li><li>Modèle : Sauvegardé au format <strong>MLflow</strong> [citation:3]</li><li>Déploiement : Sur un cluster <strong>Kubernetes</strong> [citation:3]</li></ul>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Décrivez les étapes de votre pipeline CI/CD, de la phase de build à la phase de déploiement.</p>",
          "reponse": "<p><strong>1. Phase Build (CI) :</strong> <br>- Déclenchement sur un push sur la branche `main`. <br>- Tests unitaires (code, fonctions de preprocessing). <br>- Validation des données avec <strong>Great Expectations</strong> (qualité, schéma).<br><strong>2. Phase Test et Entraînement :</strong> <br>- Entraînement du modèle sur un échantillon de données (validation rapide). <br>- Tests de performance (F1-score > seuil). <br>- Tests de robustesse et de biais.<br><strong>3. Phase Packaging :</strong> <br>- Sauvegarde du modèle avec <strong>MLflow</strong> [citation:3]. <br>- Construction de l'image Docker (FastAPI + modèle). <br>- Push de l'image vers un registre (Docker Hub / ECR).<br><strong>4. Phase Déploiement (CD) :</strong> <br>- Déploiement sur l'environnement de staging (Kubernetes) [citation:3]. <br>- Tests d'intégration et de performance. <br>- Déploiement progressif en production (ex: canary). <br>- Rollback automatique en cas d'échec des tests [citation:1][citation:5].</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Expliquez comment vous intégreriez <strong>MLflow</strong> dans ce pipeline pour assurer la traçabilité et la gestion des versions.</p>",
          "reponse": "<p><strong>MLflow Tracking</strong> sera utilisé pour logger chaque expérience : paramètres, métriques, artefacts (modèles, graphiques) [citation:3][citation:5].</p><p><strong>MLflow Model Registry</strong> sera utilisé pour gérer le cycle de vie des modèles :<br>- <strong>Staging</strong> : Modèle ayant passé les tests de performance. <br>- <strong>Production</strong> : Modèle déployé et validé en staging. <br>- <strong>Archived</strong> : Modèles retirés.</p><p>Le pipeline CI/CD interagira avec le Registry pour :<br>- <strong>CI</strong> : Enregistrer automatiquement le modèle dans le registre (tag `staging`) après les tests. <br>- <strong>CD</strong> : Promouvoir le modèle de `staging` à `production` après validation humaine ou automatique. <br>- Permettre un rollback facile en repromouvant une version antérieure [citation:7].</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Proposez une stratégie de déploiement (Blue/Green ou Canary) pour minimiser les risques de la mise en production d'une nouvelle version du modèle.</p>",
          "reponse": "<p>Je recommande une stratégie <strong>Canary</strong> pour ce cas d'usage [citation:1][citation:3]. Elle consiste à déployer la nouvelle version sur un petit pourcentage de l'infrastructure (ex: 5% des pods) et à router un faible pourcentage du trafic vers cette version.</p><p><strong>Avantages :</strong> <br>- Permet de tester la nouvelle version en conditions réelles sur un petit échantillon d'utilisateurs. <br>- Si une anomalie est détectée (erreurs, latence), le rollback est immédiat en redirigeant tout le trafic vers la version stable.</p><p><strong>Mise en œuvre :</strong> <br>- Utiliser <strong>Kubernetes</strong> avec un service de load balancing (ex: Istio ou un Ingress controller) [citation:3]. <br>- Augmenter progressivement le pourcentage de trafic vers la nouvelle version (5% → 20% → 50% → 100%) en surveillant les métriques de performance [citation:1].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Questions de Cours (6 points)",
      "points": "6 pts",
      "enonce": "<p>Répondez aux questions suivantes en vous appuyant sur les notions vues en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Distinguez le <strong>Data Drift</strong> du <strong>Concept Drift</strong>. Donnez un exemple concret pour chaque phénomène dans le domaine de la banque.</p>",
          "reponse": "<p><strong>Data Drift</strong> (ou covariate shift) : Changement dans la distribution des données d'entrée. La relation entre les entrées et la sortie reste la même, mais les données en production sont différentes de celles d'entraînement [citation:1]. <br><strong>Exemple bancaire :</strong> Le modèle de détection de fraude a été entraîné sur des transactions de 100 à 1000 FCFA. Après une campagne marketing, la banque reçoit des transactions de 5000 à 10000 FCFA. La distribution des montants change (Data Drift).</p><p><strong>Concept Drift</strong> : Changement dans la relation entre les variables d'entrée et la cible. La relation apprise par le modèle n'est plus valable [citation:1]. <br><strong>Exemple bancaire :</strong> Le modèle de scoring de crédit se base sur l'historique de paiement. Suite à une récession économique, des clients avec un bon historique deviennent soudainement défaillants. La relation entre l'historique et le risque de défaut a changé (Concept Drift).</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Expliquez l'intérêt de la conteneurisation (Docker) pour un projet de Machine Learning.</p>",
          "reponse": "<p>La conteneurisation avec Docker offre plusieurs avantages pour un projet ML [citation:2][citation:3] :</p><p><strong>1. Reproductibilité :</strong> L'image Docker empaquète le modèle, ses dépendances (bibliothèques), et l'environnement d'exécution. On obtient ainsi le même environnement sur toutes les machines (développement, test, production) [citation:3].</p><p><strong>2. Isolation :</strong> Chaque modèle s'exécute dans son propre conteneur, évitant les conflits de dépendances entre différents projets.</p><p><strong>3. Portabilité :</strong> L'image Docker peut être déployée sur n'importe quelle infrastructure (machine locale, cloud, Kubernetes) sans modification.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Décrivez le rôle de <strong>Kubernetes</strong> dans l'orchestration des modèles ML en production.</p>",
          "reponse": "<p><strong>Kubernetes</strong> est un orchestrateur de conteneurs qui gère le déploiement, le scaling et la résilience des applications conteneurisées [citation:2][citation:3][citation:8].</p><p><strong>Rôle dans le ML :</strong> <br><strong>1. Scaling automatique :</strong> Kubernetes peut augmenter ou diminuer le nombre de pods (instances du modèle) en fonction de la charge (CPU, mémoire, nombre de requêtes) [citation:3]. Cela permet de gérer les pics de trafic.</p><p><strong>2. Résilience :</strong> En cas de panne d'un pod ou d'un nœud, Kubernetes redémarre automatiquement les pods défaillants pour maintenir la disponibilité du service.</p><p><strong>3. Gestion des déploiements :</strong> Kubernetes facilite les déploiements progressifs (Canary, Blue/Green) et les rollbacks [citation:1][citation:3].</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
