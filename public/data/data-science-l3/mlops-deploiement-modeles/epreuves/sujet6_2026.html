<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>

                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>

    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "MLOps et Déploiement de Modèles - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 6 : Projet MLOps et Monitoring",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours (8 pts)",
     "points": "8 pts",
     "enonce": "<p>Répondez de manière claire et concise aux questions suivantes :</p>",
     "questions": [
       {
         "question": "<p><strong>1.1 (2 pts)</strong> Définissez le <strong>MLOps</strong> et expliquez son objectif principal.</p>",
         "reponse": "<p>Le MLOps (Machine Learning Operations) est un ensemble de pratiques visant à automatiser, déployer, surveiller et gérer le cycle de vie des modèles de machine learning en production de manière fiable et efficace [citation:3][citation:12]. Son objectif principal est de faire le pont entre le développement de modèles (Data Science) et les opérations, afin d'industrialiser leur mise en production et d'assurer leur performance et leur robustesse dans le temps [citation:14].</p>"
       },
       {
         "question": "<p><strong>1.2 (2 pts)</strong> Distinguez le <strong>Data Drift</strong> du <strong>Concept Drift</strong>.</p>",
         "reponse": "<p>Le <strong>Data Drift</strong> (ou dérive des données) se produit lorsque la distribution des données d'entrée change en production, alors que la relation avec la variable cible reste inchangée. Le <strong>Concept Drift</strong>, quant à lui, est un changement dans la relation statistique entre les données d'entrée et la variable cible, même si la distribution des données d'entrée reste stable [citation:7]. Dans les deux cas, les performances du modèle peuvent se dégrader, d'où l'importance d'un monitoring continu.</p>"
       },
       {
         "question": "<p><strong>1.3 (2 pts)</strong> Citez et expliquez brièvement <strong>deux</strong> piliers fondamentaux du MLOps.</p>",
         "reponse": "<p>Deux piliers fondamentaux sont :</p><ul><li><strong>Le CI/CD (Intégration Continue / Déploiement Continu)</strong> : Automatisation des tests et du déploiement des modèles pour garantir des mises à jour rapides et fiables.</li><li><strong>Le Monitoring et l'Observabilité</strong> : Surveillance continue des performances du modèle, de la latence des prédictions et détection des dérives (drift) pour assurer la qualité et la fiabilité en production [citation:2][citation:3].</li></ul>"
       },
       {
         "question": "<p><strong>1.4 (2 pts)</strong> Quel est le rôle de <strong>Kubernetes</strong> dans l'écosystème MLOps et pourquoi est-il important ?</p>",
         "reponse": "<p>Kubernetes est un orchestrateur de conteneurs utilisé pour automatiser le déploiement, la mise à l'échelle et la gestion des applications conteneurisées, comme les modèles de ML. Il est important car il permet une scalabilité automatique, une résilience (auto-réparation) et une standardisation des déploiements, facilitant ainsi la gestion des modèles en production à grande échelle [citation:3].</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Étude de Cas - Monitoring et Alerte (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;'><p><strong>Contexte :</strong></p><p>Vous êtes MLOps Engineer dans une startup qui a déployé un modèle de recommandation de produits sur Google Cloud Platform. L'API est conteneurisée avec Docker, orchestrée sur un cluster Kubernetes et expose ses métriques à Prometheus. Vous avez configuré Grafana pour la visualisation.</p></div>",
     "questions": [
       {
         "question": "<p><strong>2.1 (1,5 pts)</strong> Vous recevez une alerte indiquant que la <strong>latence</strong> des prédictions dépasse les 500ms depuis 5 minutes. Quelles sont les causes potentielles ? Proposez des actions à mener.</p>",
         "reponse": "<p><strong>Causes potentielles :</strong></p><ul><li>Augmentation soudaine du trafic (le service est saturé, l'auto-scaling n'a pas suivi).</li><li>Problème de performance dans le code (ex: traitement plus long, fuite mémoire).</li><li>Problème d'infrastructure sous-jacente (contention CPU, latence réseau sur le cluster Kubernetes).</li></ul><p><strong>Actions à mener :</strong></p><ul><li>Vérifier les métriques de scaling Kubernetes (nombre de réplicas) sur Grafana.</li><li>Consulter les logs de l'API pour identifier d'éventuelles erreurs ou ralentissements.</li><li>Analyser les métriques Prometheus de l'infrastructure (CPU, mémoire, réseau).</li><li>Si le problème persiste, envisager un rollback vers une version stable du modèle.</li></ul>"
       },
       {
         "question": "<p><strong>2.2 (1,5 pts)</strong> Comment configureriez-vous une <strong>alerte</strong> dans Prometheus pour être notifié si le <strong>taux d'erreur</strong> de l'API (code 5xx) dépasse 5% ?</p>",
         "reponse": "<p>Voici un exemple de règle d'alerte Prometheus :</p><div style='background: #1e272e; color: #dcdde1; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9rem;'>groups:\n- name: api_alerts\n  rules:\n  - alert: HighErrorRate\n    expr: (\n        rate(http_requests_total{status=~\"5..\"}[5m]) /\n        rate(http_requests_total[5m])\n      ) * 100 > 5\n    for: 2m\n    labels:\n      severity: critical\n    annotations:\n      summary: \"Taux d'erreur élevé\"\n      description: \"Le taux d'erreur (5xx) est de {{ $value }}% depuis 2 minutes.\"</div><p>Cette règle calcule le ratio des requêtes 5xx sur les 5 dernières minutes. Si ce ratio dépasse 5% pendant plus de 2 minutes, une alerte est déclenchée.</p>"
       },
       {
         "question": "<p><strong>2.3 (1,5 pts)</strong> Vous constatez que l'<strong>accuracy</strong> du modèle a chuté en production. Expliquez comment utiliser le monitoring pour distinguer un <strong>Data Drift</strong> d'un <strong>Concept Drift</strong>.</p>",
         "reponse": "<p>Pour distinguer les deux, on peut utiliser différents types de métriques :</p><ul><li><strong>Pour le Data Drift :</strong> Utiliser des outils comme Evidently ou des bibliothèques de monitoring pour comparer la distribution des caractéristiques (features) en production avec celles des données d'entraînement. Un changement significatif de distribution indique un Data Drift [citation:2].</li><li><strong>Pour le Concept Drift :</strong> Il faut monitorer la performance du modèle sur des données récentes, par exemple en calculant l'accuracy sur des échantillons de données pour lesquelles la vérité terrain est connue avec un certain délai. Une baisse de performance alors que la distribution des données d'entrée est stable indique un Concept Drift.</li></ul>"
       },
       {
         "question": "<p><strong>2.4 (1,5 pts)</strong> Si vous détectez un <strong>Concept Drift</strong>, quelle serait la procédure à suivre pour remédier au problème ?</p>",
         "reponse": "<p>La procédure standard consiste à :</p><ul><li>Ré-entraîner le modèle sur un jeu de données plus récent qui reflète la nouvelle relation entre les données et la cible.</li><li>Mettre à jour les pipelines de données pour intégrer ces nouvelles données.</li><li>Automatiser ce processus de ré-entraînement via un pipeline CI/CD, déclenché par des alertes de drift [citation:2].</li><li>Dans certains cas, il peut être nécessaire de repenser la conception du modèle ou d'ajouter de nouvelles features.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Modélisation de l'Architecture (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;'><p>Vous devez concevoir l'architecture d'un système MLOps complet pour une application de prédiction en temps réel.</p></div>",
     "questions": [
       {
         "question": "<p><strong>3.1 (2 pts)</strong> Décrivez les composants de cette architecture et leur rôle. Vous pouvez mentionner des exemples d'outils pour chaque étape.</p>",
         "reponse": "<p>Une architecture MLOps complète se compose de plusieurs couches :</p><ul><li><strong>Ingestion des données :</strong> Collecte et stockage des données de production (ex: bucket Google Cloud Storage, base de données).</li><li><strong>Pipeline de données :</strong> Transformation et préparation des données pour l'entraînement (ex: Dataflow, dbt).</li><li><strong>Expérimentation et entraînement :</strong> Environnement pour développer et entraîner les modèles (ex: Jupyter sur Kubeflow, scripts Python).</li><li><strong>CI/CD :</strong> Automatisation des tests et du déploiement des modèles (ex: GitHub Actions, GitLab CI).</li><li><strong>Registre de modèles :</strong> Stockage et versionnement des modèles entraînés (ex: MLflow Model Registry).</li><li><strong>Serveur de prédiction :</strong> Exposition du modèle via une API (ex: FastAPI, TensorFlow Serving, KServe).</li><li><strong>Monitoring et Observabilité :</strong> Collecte de métriques, détection de drift, alertes (ex: Prometheus, Grafana, Evidently).</li><li><strong>Orchestration :</strong> Gestion des workflows (ex: Kubeflow Pipelines, Apache Airflow).</li></ul>"
       },
       {
         "question": "<p><strong>3.2 (2 pts)</strong> Choisissez une plateforme cloud (GCP, AWS ou Azure) et <strong>décrivez</strong> son service de ML géré que vous utiliseriez pour la couche 'Serveur de prédiction'. Justifiez votre choix.</p>",
         "reponse": "<p><strong>Choix : Google Cloud AI Platform Prediction</strong></p><p><strong>Justification :</strong></p><ul><li>Il permet de déployer facilement des modèles entraînés avec différents frameworks (TensorFlow, Scikit-learn, XGBoost) avec une seule commande.</li><li>Il gère automatiquement l'infrastructure (serveurs, scaling) et propose des modes de prédiction en ligne (faible latence) et par lots.</li><li>Il s'intègre nativement avec les autres services GCP (Cloud Storage, BigQuery).</li><li>Il offre des fonctionnalités de monitoring intégré et de détection de drift [citation:2][citation:3].</li></ul><p><strong>Alternatives :</strong></p><ul><li><strong>AWS SageMaker :</strong> Equivalent chez AWS. Offre des fonctionnalités similaires et une intégration profonde avec AWS.</li><li><strong>Azure Machine Learning :</strong> Service géré chez Microsoft Azure.</li></ul>"
       },
       {
         "question": "<p><strong>3.3 (2 pts)</strong> Expliquez comment vous intégreriez <strong>MLflow</strong> dans cette architecture. Quel problème spécifique cela résout-il ?</p>",
         "reponse": "<p>MLflow serait intégré pour <strong>gérer le cycle de vie des modèles</strong> [citation:3][citation:5]. Plus précisément :</p><ul><li><strong>MLflow Tracking :</strong> Pour enregistrer les paramètres, les métriques et les artefacts de chaque entraînement. Cela permet de comparer les expériences et de choisir le meilleur modèle.</li><li><strong>MLflow Models :</strong> Pour sauvegarder le modèle dans un format standardisé.</li><li><strong>MLflow Model Registry :</strong> Pour versionner les modèles, gérer les transitions (Staging, Production, Archived) et centraliser le stockage des modèles.</li></ul><p><strong>Problème résolu :</strong></p><p>MLflow résout le problème de <strong>traçabilité et de reproductibilité</strong> des modèles. Il permet de savoir exactement quel code, quelles données et quels paramètres ont produit un modèle spécifique, facilitant ainsi l'audit, le debug et le rollback si nécessaire [citation:15].</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
