<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à gRPC",
    "contenu": "<div style='padding: 20px; background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%); border-radius: 15px; color: white;'><h2 style='color: white;'>🚀 Qu'est-ce que gRPC ?</h2><p style='color: #e2e8f0; font-size: 1.1em;'>gRPC est un framework de RPC (Remote Procedure Call) haute performance développé par Google. Il permet une communication efficace entre services (microservices) en utilisant HTTP/2 et Protocol Buffers.</p><div style='margin-top: 15px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px;'><p style='color: #e2e8f0; margin: 0;'><strong>Caractéristiques clés :</strong></p><ul style='color: #e2e8f0; list-style-type: none; padding: 0;'><li style='padding: 5px 0;'>✅ Communication binaire (plus rapide que JSON)</li><li style='padding: 5px 0;'>✅ Multiplexage des requêtes sur une seule connexion</li><li style='padding: 5px 0;'>✅ Support du streaming (bidirectionnel)</li><li style='padding: 5px 0;'>✅ Génération automatique de code client/serveur</li></ul></div><div style='margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;'><p style='color: #e2e8f0; margin: 0; font-size: 0.9em;'><strong>💡 gRPC = gRPC Remote Procedure Call</strong></p></div></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons découvrir gRPC, un framework de communication moderne qui va remplacer progressivement les API REST traditionnelles dans les architectures de Machine Learning. gRPC a été développé par Google pour permettre une communication très rapide et efficace entre microservices. Il utilise des données binaires, ce qui le rend beaucoup plus léger que le JSON, et il supporte le streaming, ce qui est parfait pour les applications de Machine Learning. Nous allons voir pourquoi gRPC est particulièrement adapté pour le déploiement de modèles.",
    "note": "gRPC est le choix privilégié pour les systèmes distribués haute performance."
  },
  {
    "titre": "gRPC vs REST API",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>⚖️ Comparaison des Technologies</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px;'><div style='flex: 1; min-width: 250px; background: #ebf8ff; padding: 15px; border-radius: 10px; border-left: 5px solid #3182ce;'><h4 style='color: #2b6cb0;'>REST API</h4><ul style='color: #2d3748; padding-left: 20px;'><li>📄 Format texte (JSON/XML)</li><li>📡 HTTP/1.1</li><li>🔄 Unidirectional</li><li>📖 Documentation (Swagger/OpenAPI)</li><li>🐢 Plus lent (parsing JSON)</li></ul></div><div style='flex: 1; min-width: 250px; background: #faf5ff; padding: 15px; border-radius: 10px; border-left: 5px solid #805ad5;'><h4 style='color: #6b46c1;'>gRPC</h4><ul style='color: #2d3748; padding-left: 20px;'><li>💾 Format binaire (Protobuf)</li><li>📡 HTTP/2 (multiplexage)</li><li>🔄 Bidirectionnel & Streaming</li><li>📖 Auto-généré (protocole)</li><li>🚀 Très rapide (jusqu'à 10x)</li></ul></div></div><div style='margin-top: 15px; background: #f7fafc; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>📊 Performance :</strong> gRPC est jusqu'à <strong>10 fois plus rapide</strong> que REST pour des messages volumineux, et consomme <strong>50% moins de bande passante</strong>.</p></div></div>",
    "texteParle": "Pour comprendre l'importance de gRPC, comparons-le avec les API REST que vous connaissez déjà. REST utilise du texte, généralement en JSON, qui est lisible mais assez lourd. gRPC, lui, utilise un format binaire compact appelé Protocol Buffers. Il se base sur HTTP/2, qui permet de multiplexer plusieurs requêtes sur une seule connexion, contrairement à HTTP/1.1. Résultat : gRPC peut être jusqu'à 10 fois plus rapide et consomme deux fois moins de bande passante. C'est un avantage énorme pour les modèles de Machine Learning qui doivent répondre à des milliers de requêtes par seconde.",
    "note": "gRPC est particulièrement adapté aux environnements où la latence est critique."
  },
  {
    "titre": "Protocol Buffers (Protobuf)",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>📦 Protocol Buffers : Le Langage des Données</h3><div style='background: #f0fff4; padding: 20px; border-radius: 10px; border: 1px solid #48bb78; margin: 15px 0;'><p style='color: #2d3748;'><strong>Principe :</strong> Protobuf est un langage de description de données neutre et extensible. On définit un schéma dans un fichier <code>.proto</code>, et on génère automatiquement le code client/serveur dans plusieurs langages.</p></div><div style='background: #f7fafc; padding: 15px; border-radius: 10px;'><h4 style='color: #2d3748;'>Exemple d'un fichier <code>model.proto</code></h4><pre style='background: #2d3748; color: #e2e8f0; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.85em;'>syntax = \"proto3\";\n\nservice PredictionService {\n  rpc Predict (PredictRequest) returns (PredictResponse) {}\n}\n\nmessage PredictRequest {\n  repeated float features = 1;\n  string model_version = 2;\n}\n\nmessage PredictResponse {\n  float prediction = 1;\n  float confidence = 2;\n}</pre></div><div style='margin-top: 15px; background: #ebf8ff; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>✅ Avantage :</strong> Un seul schéma définit l'interface, la validation et la sérialisation. Le code est généré automatiquement.</p></div></div>",
    "texteParle": "Le cœur de gRPC, c'est Protocol Buffers, qu'on appelle souvent Protobuf. C'est un langage de description de données qui permet de définir la structure exacte de vos messages et de vos services. Vous écrivez un fichier avec l'extension .proto, où vous décrivez par exemple vos requêtes et vos réponses. Ensuite, grâce à un compilateur, vous générez automatiquement le code client et serveur dans le langage de votre choix, que ce soit Python, Java, Go, ou C++. Cela élimine les erreurs de sérialisation et garantit que le client et le serveur parlent le même langage.",
    "note": "Le fichier .proto est le contrat unique qui définit l'API gRPC."
  },
  {
    "titre": "Modes de Communication gRPC",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🔄 Les 4 Modes de Communication</h3><div style='display: flex; flex-direction: column; gap: 12px; margin-top: 15px;'><div style='background: #ebf8ff; padding: 12px; border-radius: 8px; border-left: 4px solid #3182ce;'><h4 style='color: #2b6cb0; margin: 0;'>1. Unary RPC</h4><p style='color: #2d3748; margin: 5px 0 0 0;'>Requête unique → Réponse unique (comme REST)</p></div><div style='background: #faf5ff; padding: 12px; border-radius: 8px; border-left: 4px solid #805ad5;'><h4 style='color: #6b46c1; margin: 0;'>2. Server Streaming</h4><p style='color: #2d3748; margin: 5px 0 0 0;'>Requête unique → Flux de réponses (ex: inférence par lot)</p></div><div style='background: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #48bb78;'><h4 style='color: #276749; margin: 0;'>3. Client Streaming</h4><p style='color: #2d3748; margin: 5px 0 0 0;'>Flux de requêtes → Réponse unique (ex: agrégation de données)</p></div><div style='background: #fefcbf; padding: 12px; border-radius: 8px; border-left: 4px solid #d69e2e;'><h4 style='color: #744210; margin: 0;'>4. Bidirectional Streaming</h4><p style='color: #2d3748; margin: 5px 0 0 0;'>Flux de requêtes ↔ Flux de réponses (ex: chat en temps réel)</p></div></div><div style='margin-top: 15px; background: #f7fafc; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>💡 Pour le ML :</strong> Le Server Streaming est idéal pour l'inférence batch où plusieurs échantillons sont envoyés en une seule requête.</p></div></div>",
    "texteParle": "Contrairement à REST qui ne permet qu'un échange unique requête-réponse, gRPC offre quatre modes de communication. Le mode Unary est le plus simple, comme une API REST classique. Mais vous avez aussi le Server Streaming, où vous envoyez une requête et le serveur vous renvoie un flux de réponses, parfait pour l'inférence de lots de données. Le Client Streaming permet d'envoyer un flux de requêtes pour une seule réponse, utile pour des agrégations. Enfin, le Bidirectional Streaming permet une conversation en temps réel, où client et serveur s'échangent des messages en continu. C'est une flexibilité incroyable pour les applications de Machine Learning.",
    "note": "Le Server Streaming gRPC permet de renvoyer des milliers de prédictions en une seule connexion."
  },
  {
    "titre": "gRPC pour le Machine Learning",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🧠 Pourquoi gRPC pour les Modèles ML ?</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0;'><div style='flex: 1; min-width: 200px; background: #ebf8ff; padding: 15px; border-radius: 10px;'><h4 style='color: #2b6cb0;'>🚀 Performance</h4><p style='color: #2d3748;'>Réduction de la latence de 50-70% par rapport à REST, crucial pour les modèles temps réel.</p></div><div style='flex: 1; min-width: 200px; background: #faf5ff; padding: 15px; border-radius: 10px;'><h4 style='color: #6b46c1;'>📦 Streaming</h4><p style='color: #2d3748;'>Envoi de gros volumes de données (ex: batch de 10 000 images) en streaming sans timeout.</p></div><div style='flex: 1; min-width: 200px; background: #f0fff4; padding: 15px; border-radius: 10px;'><h4 style='color: #276749;'>🔒 Typage Fort</h4><p style='color: #2d3748;'>Les schémas Protobuf garantissent que le serveur reçoit exactement les données attendues.</p></div></div><div style='background: #f7fafc; padding: 15px; border-radius: 10px; margin-top: 15px;'><p style='color: #2d3748;'><strong>📊 Cas d'usage typique :</strong> Serveur de prédiction TensorFlow Serving expose nativement une API gRPC, ce qui en fait le standard pour le déploiement de modèles TensorFlow en production.</p></div></div>",
    "texteParle": "Alors, pourquoi gRPC est-il si populaire pour le Machine Learning ? C'est simple : les modèles ML ont besoin de performances. Une API REST avec JSON peut ajouter une latence de 100 à 200 millisecondes juste pour le parsing, sans compter le temps d'inférence. Avec gRPC, cette latence est réduite de 50 à 70%. De plus, le streaming permet d'envoyer des données volumineuses, comme des images ou des séries temporelles, sans les découper. Et avec le typage fort de Protobuf, vous êtes sûr que votre serveur reçoit les données exactement comme prévu. C'est pour cela que TensorFlow Serving, un des serveurs de modèles les plus utilisés, supporte nativement gRPC.",
    "note": "TensorFlow Serving, TorchServe et NVIDIA Triton supportent tous gRPC pour l'inférence."
  },
  {
    "titre": "Mise en Œuvre d'un Serveur gRPC",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🔧 Exemple : Serveur de Prédiction</h3><div style='background: #2d3748; padding: 15px; border-radius: 10px; color: #e2e8f0; margin: 15px 0;'><pre style='margin: 0; font-size: 0.85em; overflow-x: auto;'>import grpc\nfrom concurrent import futures\nimport model_pb2\nimport model_pb2_grpc\n\nclass PredictorServicer(model_pb2_grpc.PredictionServiceServicer):\n    def Predict(self, request, context):\n        # Charger le modèle (chargé une fois au démarrage)\n        features = request.features\n        prediction = model.predict([features])[0]\n        confidence = model.confidence(features)\n        return model_pb2.PredictResponse(\n            prediction=prediction,\n            confidence=confidence\n        )\n\ndef serve():\n    server = grpc.server(futures.ThreadPoolExecutor(max_workers=10))\n    model_pb2_grpc.add_PredictionServiceServicer_to_server(\n        PredictorServicer(), server\n    )\n    server.add_insecure_port('[::]:50051')\n    server.start()\n    server.wait_for_termination()\n\nif __name__ == '__main__':\n    serve()</pre></div><div style='background: #f7fafc; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>💡 Points clés :</strong> Le modèle est chargé une fois au démarrage (pas à chaque requête). Le serveur est thread-safe et peut gérer des requêtes concurrentes.</p></div></div>",
    "texteParle": "Voyons maintenant comment implémenter un serveur gRPC pour un modèle de Machine Learning en Python. La première étape est de générer les classes Python à partir de votre fichier .proto. Ensuite, vous créez une classe qui implémente le service défini dans votre protocole. La méthode Predict reçoit une requête qui contient les caractéristiques, fait la prédiction avec votre modèle, et renvoie une réponse avec la prédiction et le niveau de confiance. Le serveur est lancé sur le port 50051 et peut gérer plusieurs requêtes en parallèle grâce à un pool de threads. La beauté de cette approche, c'est que votre modèle est chargé une seule fois au démarrage, ce qui est crucial pour la performance.",
    "note": "Le serveur gRPC charge le modèle en mémoire une seule fois, à l'initialisation."
  },
  {
    "titre": "Client gRPC pour l'Inférence",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>👤 Exemple : Client de Prédiction</h3><div style='background: #2d3748; padding: 15px; border-radius: 10px; color: #e2e8f0; margin: 15px 0;'><pre style='margin: 0; font-size: 0.85em; overflow-x: auto;'>import grpc\nimport model_pb2\nimport model_pb2_grpc\n\ndef predict(channel, features):\n    stub = model_pb2_grpc.PredictionServiceStub(channel)\n    request = model_pb2.PredictRequest(\n        features=features,\n        model_version=\"v1.0\"\n    )\n    response = stub.Predict(request)\n    return response.prediction, response.confidence\n\n# Connexion au serveur\nchannel = grpc.insecure_channel('localhost:50051')\nprediction, confidence = predict(channel, [0.5, 1.2, 3.4])\nprint(f\"Prédiction : {prediction}, Confiance : {confidence}\")</pre></div><div style='background: #f7fafc; padding: 15px; border-radius: 10px; margin-top: 15px;'><p style='color: #2d3748;'><strong>✅ Simple et intuitif :</strong> Le client crée un stub (proxy) qui cache tous les détails de la communication réseau.</p></div></div>",
    "texteParle": "Le client gRPC est tout aussi simple à implémenter. Vous créez un canal de communication vers votre serveur, puis vous créez un stub, qui est comme un proxy qui va envoyer vos requêtes. Vous construisez votre message PredictRequest avec les caractéristiques, vous l'envoyez via le stub, et vous recevez une réponse. Le stub gère toute la complexité de la sérialisation, de la compression, et de la communication réseau. C'est très propre et très fiable. Ce client peut être embarqué dans une application web, mobile, ou dans un service backend.",
    "note": "Le stub gère automatiquement la sérialisation/désérialisation des données."
  },
  {
    "titre": "Performance et Benchmarking",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>📊 Comparaison des Performances</h3><div style='background: #f7fafc; padding: 15px; border-radius: 10px; margin: 15px 0;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'><tr style='background: #2d3748; color: white;'><th style='padding: 10px; text-align: left;'>Métrique</th><th style='padding: 10px; text-align: center;'>REST (JSON)</th><th style='padding: 10px; text-align: center;'>gRPC (Protobuf)</th></tr><tr style='border-bottom: 1px solid #e2e8f0;'><td style='padding: 10px;'><strong>Latence (P50)</strong></td><td style='padding: 10px; text-align: center;'>~120 ms</td><td style='padding: 10px; text-align: center; color: #48bb78; font-weight: bold;'>~30 ms</td></tr><tr style='border-bottom: 1px solid #e2e8f0;'><td style='padding: 10px;'><strong>Throughput (RPS)</strong></td><td style='padding: 10px; text-align: center;'>~800 req/s</td><td style='padding: 10px; text-align: center; color: #48bb78; font-weight: bold;'>~2500 req/s</td></tr><tr><td style='padding: 10px;'><strong>Bande passante</strong></td><td style='padding: 10px; text-align: center;'>1.2 MB (10k req)</td><td style='padding: 10px; text-align: center; color: #48bb78; font-weight: bold;'>0.5 MB (10k req)</td></tr></table></div><div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>⚠️ Attention :</strong> Les gains sont maximisés pour les gros volumes de données. Pour les micro-requêtes, la différence peut être moins significative.</p></div></div>",
    "texteParle": "Pour vous convaincre de la supériorité de gRPC, voici des chiffres concrets. Pour des requêtes de prédiction de taille moyenne, gRPC est 4 fois plus rapide en latence : 30 millisecondes contre 120 millisecondes pour REST. En termes de débit, gRPC peut traiter plus de 2500 requêtes par seconde contre seulement 800 pour REST. Et la bande passante est réduite de moitié ! Ce sont des différences énormes qui peuvent transformer une application. Évidemment, pour des requêtes très simples, la différence est moins marquée, mais pour le ML, où les données sont souvent volumineuses, gRPC est le choix évident.",
    "note": "gRPC est particulièrement performant pour les messages de plus de 1KB."
  },
  {
    "titre": "gRPC et les Modèles Lourds",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🖼️ Cas d'Usage : Modèles Vision</h3><div style='background: #f0fff4; padding: 20px; border-radius: 10px; border: 1px solid #48bb78; margin: 15px 0;'><p style='color: #2d3748;'><strong>Problème :</strong> Une image de 224x224 pixels en JSON peut peser <strong>400 KB</strong>. Avec gRPC, la même image sérialisée en Protobuf pèse <strong>150 KB</strong> (compression incluse).</p></div><div style='background: #ebf8ff; padding: 15px; border-radius: 10px;'><h4 style='color: #2b6cb0;'>Stratégie de Streaming</h4><ul style='color: #2d3748; padding-left: 20px;'><li><strong>Unary RPC :</strong> Envoyer l'image entière dans une seule requête (simplifié)</li><li><strong>Client Streaming :</strong> Envoyer l'image en morceaux (chunks) pour éviter les timeouts</li><li><strong>Server Streaming :</strong> Renvoyer les prédictions pour plusieurs images dans un flux</li></ul></div><div style='margin-top: 15px; background: #faf5ff; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>💡 Bonne Pratique :</strong> Pour les modèles très lourds (ex: GPT, LLaMA), combiner gRPC avec un système de batch asynchrone.</p></div></div>",
    "texteParle": "Prenons un cas concret : un modèle de vision par ordinateur qui reçoit des images de 224x224 pixels. En JSON, une seule image peut peser 400 kilo-octets. En gRPC avec Protobuf et la compression, elle ne pèse que 150 kilo-octets, soit 60% de moins. Pour les modèles qui traitent des lots d'images, le streaming client permet d'envoyer les images morceau par morceau pour éviter les timeouts. Et le serveur peut renvoyer les prédictions en streaming, ce qui est plus efficace. Pour les très gros modèles comme les modèles de langage, on combine souvent gRPC avec un système de batch pour maximiser l'utilisation du GPU.",
    "note": "La réduction de taille des messages est critique pour les applications mobiles en Afrique."
  },
  {
    "titre": "Sécurité avec gRPC",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🔒 Sécuriser la Communication</h3><div style='background: #fefcbf; padding: 20px; border-radius: 10px; border: 1px solid #d69e2e; margin: 15px 0;'><p style='color: #744210;'><strong>⚠️ Attention :</strong> Par défaut, gRPC n'est pas sécurisé (communication en clair). En production, il est impératif d'activer la sécurité !</p></div><div style='display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0;'><div style='flex: 1; min-width: 200px; background: #ebf8ff; padding: 15px; border-radius: 10px;'><h4 style='color: #2b6cb0;'>🔐 TLS/SSL</h4><p style='color: #2d3748;'>Chiffrement des communications (comme HTTPS).</p><pre style='background: #2d3748; color: #e2e8f0; padding: 10px; border-radius: 5px; font-size: 0.8em;'>channel = grpc.secure_channel(\n    'localhost:50051',\n    grpc.ssl_channel_credentials()\n)</pre></div><div style='flex: 1; min-width: 200px; background: #faf5ff; padding: 15px; border-radius: 10px;'><h4 style='color: #6b46c1;'>🔑 Authentification</h4><p style='color: #2d3748;'>Interception des requêtes pour ajouter des tokens JWT.</p><pre style='background: #2d3748; color: #e2e8f0; padding: 10px; border-radius: 5px; font-size: 0.8em;'>metadata = [('authorization',\n    'Bearer <token>')]\nresponse = stub.Predict(\n    request, metadata=metadata\n)</pre></div></div></div>",
    "texteParle": "La sécurité est un aspect crucial quand vous déployez des modèles. Par défaut, gRPC n'est pas sécurisé, tout comme HTTP. Il est donc impératif d'activer le chiffrement TLS/SSL pour protéger vos données en transit, surtout si vous avez des données sensibles comme des informations médicales ou financières. Vous pouvez aussi ajouter une couche d'authentification en interceptant les requêtes pour vérifier des tokens JWT. C'est la même approche que pour les API REST, mais intégrée au framework gRPC. Ne négligez jamais la sécurité, surtout dans des contextes régulés.",
    "note": "La sécurité TLS/SSL est indispensable pour les modèles traitant des données personnelles."
  },
  {
    "titre": "gRPC dans l'Écosystème MLOps",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>🔧 Intégration avec les Outils MLOps</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0;'><div style='flex: 1; min-width: 150px; background: #f0fff4; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #48bb78;'><h4 style='color: #276749;'>TensorFlow Serving</h4><p style='color: #2d3748;'>API gRPC native pour l'inférence TF</p></div><div style='flex: 1; min-width: 150px; background: #faf5ff; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #805ad5;'><h4 style='color: #6b46c1;'>TorchServe</h4><p style='color: #2d3748;'>Support gRPC pour PyTorch</p></div><div style='flex: 1; min-width: 150px; background: #ebf8ff; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #3182ce;'><h4 style='color: #2b6cb0;'>NVIDIA Triton</h4><p style='color: #2d3748;'>Inference Server multi-framework avec gRPC</p></div></div><div style='background: #f7fafc; padding: 15px; border-radius: 10px; margin-top: 15px;'><p style='color: #2d3748;'><strong>✅ Avantage :</strong> Tous ces outils utilisent le même protocole, ce qui permet une interopérabilité totale. Le même client gRPC peut appeler TensorFlow Serving, TorchServe ou Triton sans changement de code.</p></div></div>",
    "texteParle": "La bonne nouvelle, c'est que gRPC est déjà intégré dans tous les serveurs de modèles modernes. TensorFlow Serving, TorchServe pour PyTorch, et NVIDIA Triton supportent tous nativement gRPC. Cela signifie que vous pouvez utiliser le même client pour appeler différents types de modèles, sans changer votre code. Cette standardisation est un énorme avantage pour les architectures MLOps : vous pouvez facilement basculer d'un framework à l'autre, faire du A/B testing, ou déployer plusieurs modèles dans des microservices différents, le tout avec la même interface gRPC.",
    "note": "L'utilisation de gRPC standardise l'inférence et facilite l'interopérabilité."
  },
  {
    "titre": "Synthèse et Bonnes Pratiques",
    "contenu": "<div style='padding: 15px;'><h3 style='color: #2d3748;'>📝 À Retenir sur gRPC pour le ML</h3><div style='background: #f7fafc; padding: 20px; border-radius: 15px; margin: 15px 0;'><ul style='color: #2d3748; list-style-type: none; padding: 0;'><li style='padding: 10px 0; border-bottom: 1px solid #e2e8f0;'>🚀 <strong>Performance</strong> : Jusqu'à 10x plus rapide que REST</li><li style='padding: 10px 0; border-bottom: 1px solid #e2e8f0;'>📦 <strong>Protobuf</strong> : Définition unique et typage fort</li><li style='padding: 10px 0; border-bottom: 1px solid #e2e8f0;'>🔄 <strong>Streaming</strong> : Idéal pour les gros volumes de données</li><li style='padding: 10px 0; border-bottom: 1px solid #e2e8f0;'>🔗 <strong>Interopérabilité</strong> : Supporté par TF Serving, TorchServe, Triton</li><li style='padding: 10px 0;'>🔐 <strong>Sécurité</strong> : TLS/SSL et authentification JWT</li></ul></div><div style='background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%); padding: 20px; border-radius: 15px; color: white;'><p style='color: #f0f0f0; text-align: center; margin: 0;'><strong>💡 gRPC est le standard de facto pour les architectures ML en production.</strong></p></div></div>",
    "texteParle": "Pour conclure cette leçon, retenons les points essentiels. gRPC est jusqu'à 10 fois plus rapide que REST, ce qui est crucial pour le Machine Learning. Il utilise Protocol Buffers pour une définition unique et un typage fort, ce qui élimine les erreurs de sérialisation. Le streaming permet de gérer efficacement les gros volumes de données. Tous les serveurs de modèles modernes le supportent, ce qui garantit l'interopérabilité. Et bien sûr, la sécurité n'est pas oubliée avec TLS/SSL. En résumé, si vous déployez des modèles en production, gRPC est le choix évident pour la communication. C'est le standard de facto dans l'industrie.",
    "note": "gRPC est devenu le standard pour l'inférence en production;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
