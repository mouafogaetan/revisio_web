<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Data Engineering Avancé - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Évaluation Séquentielle 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Répondez de manière claire et concise aux questions suivantes. Chaque réponse est notée sur 1,5 point.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Distinguez les architectures Data Lake, Data Warehouse et Data Lakehouse en décrivant leurs caractéristiques principales et leurs cas d'usage respectifs.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Data Warehouse :</strong> Entreposage de données structurées, optimisé pour le traitement de requêtes analytiques (BI). Schéma défini en amont (schema-on-write) [citation:1][citation:9].</p><p><strong>Data Lake :</strong> Stockage de données brutes en vaste quantité, non structurées, semi-structurées ou structurées. Schéma défini à la lecture (schema-on-read) [citation:1].</p><p><strong>Data Lakehouse :</strong> Combine les avantages des deux. Stocke les données brutes comme un Data Lake et ajoute des couches de gestion pour les requêtes ACID, le schéma et la performance, comme un Data Warehouse [citation:1].</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Expliquez la différence fondamentale entre les approches ETL et ELT. Pourquoi l'ELT est-il devenu plus courant avec les Data Warehouses modernes ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>ETL (Extract, Transform, Load) :</strong> Les données sont extraites, transformées (nettoyage, agrégation) avant d'être chargées dans l'entrepôt [citation:3][citation:5][citation:7].</p><p><strong>ELT (Extract, Load, Transform) :</strong> Les données sont extraites et chargées brutes dans l'entrepôt, puis transformées à l'intérieur de celui-ci [citation:3][citation:5].</p><p>L'ELT est privilégié car les Data Warehouses cloud modernes (BigQuery, Redshift) sont extrêmement puissants et scalables, permettant des transformations massives sur les données déjà chargées [citation:3][citation:5].</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Qu'est-ce que l'architecture Lambda dans le contexte du Data Engineering ? Décrivez ses deux couches principales et leur finalité.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>L'architecture Lambda est une architecture de traitement de données conçue pour gérer à la fois des données en batch et en temps réel. Elle repose sur deux couches principales :</p><ul><li><strong>Batch Layer :</strong> Traite les données en lots pour produire une vue précise et complète (consistante).</li><li><strong>Speed Layer :</strong> Traite les données en temps réel pour compenser le délai de la batch layer et fournir des vues rapides.</li></ul><p>Un service de requêtage fusionne les résultats des deux couches pour répondre aux requêtes.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4)</strong> Définissez brièvement les concepts suivants dans le contexte d'Apache Kafka : <strong>Topic</strong>, <strong>Partition</strong>, <strong>Producer</strong>, <strong>Consumer</strong>.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Topic :</strong> C'est un flux de messages, un canal de communication. Il est comparable à une table de base de données.</li><li><strong>Partition :</strong> Un topic est divisé en partitions pour la scalabilité et le parallélisme. Les messages sont écrits et lus sur les partitions.</li><li><strong>Producer :</strong> Une application qui publie (écrit) des messages sur un topic.</li><li><strong>Consumer :</strong> Une application qui lit (souscrit) les messages d'un topic.</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Analyse et Conception d'un Pipeline",
     "points": "8 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Contexte :</strong> Une entreprise de livraison de repas à Douala souhaite améliorer son système en analysant les données de ses commandes en temps réel. Actuellement, les données sont stockées dans une base de données relationnelle (PostgreSQL). L'entreprise veut pouvoir :</p><ul><li>Analyser les commandes en temps réel pour optimiser les livraisons.</li><li>Générer des rapports quotidiens sur les performances des livreurs.</li><li>Conserver un historique complet des commandes pour des analyses futures.</li></ul><p>En tant qu'ingénieur de données, vous devez concevoir une architecture pour répondre à ces besoins en utilisant les composants suivants : Apache Kafka, Apache Flink, Data Warehouse (BigQuery), Data Lake (GCS).</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Proposez une architecture en détaillant le rôle de chaque composant (Kafka, Flink, BigQuery, GCS) dans le pipeline de données que vous concevez. (3 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>PostgreSQL (Source) :</strong> Base de données source des commandes.</li><li><strong>Apache Kafka (Ingestion) :</strong> Capture en temps réel des événements (nouvelles commandes, mises à jour de statut) et les publie sur un topic [citation:1][citation:4][citation:5].</li><li><strong>Apache Flink (Processing) :</strong> Consomme les flux Kafka, effectue des transformations complexes (fenêtres, agrégations) pour les analyses en temps réel [citation:5].</li><li><strong>Google Cloud Storage (Data Lake) :</strong> Stockage des données brutes (archives) et des résultats des traitements pour une analyse future [citation:1].</li><li><strong>BigQuery (Data Warehouse) :</strong> Stockage des données transformées pour les rapports et l'analyse historique [citation:1].</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Expliquez comment vous géreriez les erreurs dans votre pipeline (ex : un message invalide dans Kafka). (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Pour gérer les erreurs, on peut implémenter :</p><ul><li><strong>Dead Letter Queue (DLQ) :</strong> Les messages invalides de Kafka sont redirigés vers un topic spécifique pour une analyse et un rejeu manuel ultérieur.</li><li><strong>Gestion des exceptions dans Flink :</strong> Utiliser des mécanismes de tolérance aux pannes de Flink (checkpoints) pour réexécuter des traitements en cas d'échec [citation:5].</li><li><strong>Monitoring et Alertes :</strong> Mettre en place des tableaux de bord (ex: avec Grafana) pour surveiller la santé du pipeline et être alerté en cas d'anomalie [citation:5].</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Décrivez comment vous utiliseriez le Data Lineage pour assurer la conformité et l'audit de ce pipeline. (1 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le Data Lineage est crucial pour la conformité. Il permet de suivre un datapoint depuis sa source jusqu'à son utilisation finale [citation:5]. Pour cela, on peut :</p><ul><li><strong>Outils de Lineage :</strong> Utiliser des outils (ex: OpenLineage, Apache Atlas) pour capturer automatiquement les métadonnées.</li><li><strong>Traçabilité :</strong> Documenter chaque étape de transformation appliquée aux données. Cela permet de répondre à des questions d'audit sur la provenance et les transformations des données [citation:5].</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4)</strong> Comparez Apache Flink et Apache Spark Streaming. Justifiez votre choix de Flink dans cette architecture. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Flink :</strong> Véritable traitement de flux (true stream processing) avec de très faibles latences (< milliseconde). Idéal pour des cas d'usage nécessitant un temps réel strict, comme l'optimisation de livraison.</li><li><strong>Spark Streaming (Structured Streaming) :</strong> Traitement par micro-batch, ce qui donne des latences plus élevées (quelques secondes).</li><li><strong>Justification du choix :</strong> Étant donné que l'entreprise a un besoin de calculs en temps réel pour l'optimisation immédiate des livraisons, Flink est le plus adapté grâce à sa capacité de traitement événementiel en continu [citation:1][citation:5].</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Sécurité et Gouvernance",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Dans le pipeline que vous avez conçu à l'Exercice 2, les données contiennent des informations personnelles (noms, adresses, coordonnées bancaires). L'entreprise est soumise au RGPD.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1)</strong> Citez deux mesures de sécurité que vous mettriez en place pour protéger les données (au repos et en transit). (1 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Données en transit :</strong> Utiliser le chiffrement TLS/SSL pour toutes les communications entre les composants (Kafka, Flink, BigQuery, GCS).</li><li><strong>Données au repos :</strong> Activer le chiffrement au repos (encryption at rest) pour les données stockées dans GCS (Data Lake) et BigQuery (Data Warehouse) en utilisant les clés de chiffrement gérées par le fournisseur cloud (CMEK).</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2)</strong> Expliquez comment vous géreriez l'accès aux données pour les data scientists en respectant le principe du 'moindre privilège'. (1 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le principe du moindre privilège signifie que les data scientists ne doivent avoir que les droits strictement nécessaires à leur travail [citation:8].</p><p>Pour cela, on peut :</p><ul><li><strong>RBAC/ABAC :</strong> Utiliser un contrôle d'accès basé sur les rôles (RBAC) ou les attributs (ABAC) [citation:5][citation:6].</li><li><strong>Accès en lecture seule :</strong> Leur accorder un accès en lecture seule aux données pseudonymisées ou agrégées dans BigQuery, sans accès direct aux données brutes ou aux informations personnelles identifiables (PII).</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3)</strong> Quel est le rôle du Data Governance dans ce contexte, et comment le Data Lineage peut-il aider à le remplir ? (2 pts)</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
