<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Data Engineering Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Répondez de manière claire et précise aux questions suivantes en vous appuyant sur les concepts vus en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Définissez la <strong>Data Governance</strong> et expliquez en quoi elle est essentielle pour une entreprise comme une banque ou une compagnie d'assurance au Cameroun.</p>",
          "reponse": "<p>La <strong>Data Governance</strong> est l'ensemble des processus, politiques, standards et métriques qui assurent l'utilisation efficace et efficiente des données afin de permettre à une organisation d'atteindre ses objectifs [citation:10][citation:12]. Elle définit qui peut entreprendre quelles actions, sur quelles données, dans quelles circonstances.</p><p>Dans une banque ou une compagnie d'assurance camerounaise, elle est essentielle pour : assurer la conformité avec la loi sur la protection des données, améliorer la qualité des données clients pour une meilleure prise de décision, et instaurer une confiance numérique auprès des parties prenantes en garantissant la traçabilité et la sécurité des informations.</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Qu'est-ce que le <strong>Data Fabric</strong> ? Comparez-le brièvement au <strong>Data Mesh</strong>.</p>",
          "reponse": "<p>Le <strong>Data Fabric</strong> est une architecture qui fournit une couche d'intégration et d'orchestration des données. Elle connecte de manière transparente des sources de données hétérogènes (cloud, on-premise, edge) pour offrir une vue unifiée et des services de données intégrés [citation:10]. Il se concentre sur l'aspect technique : connectivité, transformation et orchestration automatisée des données.</p><p>Le <strong>Data Mesh</strong> est un paradigme organisationnel qui prône la décentralisation et la propriété des données par domaine métier. La principale différence est donc que l'un est un levier technique (Data Fabric) et l'autre un levier organisationnel (Data Mesh) ; ils peuvent être complémentaires.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> Distinguez le <strong>chiffrement symétrique</strong> du <strong>chiffrement asymétrique</strong> en donnant un exemple d'utilisation pour la sécurisation d'un pipeline de données.</p>",
          "reponse": "<p>Le <strong>chiffrement symétrique</strong> utilise une seule et même clé pour chiffrer et déchiffrer les données. Il est rapide et adapté au chiffrement de gros volumes de données. Exemple : chiffrer une base de données contenant des informations clients avec AES-256.</p><p>Le <strong>chiffrement asymétrique</strong> utilise une paire de clés (publique et privée). Il est plus lent mais permet l'échange sécurisé de clés et les signatures numériques. Exemple : utiliser la clé publique d'un service pour chiffrer un mot de passe ou un token, qui ne pourra être déchiffré qu'avec la clé privée de ce service [citation:6].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Étude de Cas - Pipeline de Données pour une Plateforme de Téléphonie Mobile (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Une entreprise de télécommunications camerounaise souhaite moderniser son infrastructure data. Elle collecte chaque jour des milliards d'événements (logs d'appels, données de localisation, historiques de navigation) pour améliorer la qualité de service et personnaliser l'expérience client.</p><p>Elle souhaite mettre en place un pipeline de données traitant des flux en temps réel et en batch.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> Concevez une architecture de pipeline de données (ETL/ELT) pour cette entreprise, en précisant les composants (ingestion, transformation, stockage) et le type de traitement utilisé (batch ou stream).</p>",
          "reponse": "<p>Une architecture possible est une architecture <strong>Lambda</strong> qui combine stream et batch [citation:4][citation:6][citation:12] :</p><ul><li><strong>Ingestion des flux</strong> : Utiliser <strong>Apache Kafka</strong> pour collecter les données en temps réel depuis les antennes et les applications mobiles.</li><li><strong>Stockage brut</strong> : Ingérer les données dans un <strong>Data Lake</strong> (ex: AWS S3, GCS) pour conserver l'historique.</li><li><strong>Traitement rapide (Stream)</strong> : Utiliser <strong>Apache Flink</strong> ou <strong>Spark Streaming</strong> pour des traitements en temps réel (détection d'anomalies, aggrégations par cellule) [citation:2][citation:6].</li><li><strong>Traitement par lots (Batch)</strong> : Utiliser <strong>Apache Airflow</strong> pour orchestrer des traitements périodiques (calcul des KPI, rapports quotidiens) dans un <strong>Data Warehouse</strong> Cloud comme BigQuery.</li></ul>"
        },
        {
          "question": "<p><strong>2.2 (3 pts)</strong> Détaillez le rôle d'<strong>Apache Airflow</strong> dans ce pipeline. Décrivez un exemple de DAG (tâches et dépendances) pour le traitement des données de localisation.</p>",
          "reponse": "<p><strong>Apache Airflow</strong> est l'orchestrateur. Il gère la planification, l'exécution et la supervision des tâches batch. Il permet de :</p><ul><li>Planifier des tâches de manière fiable (ex: tous les jours à 2h).</li><li>Gérer les dépendances entre les tâches et les reprises sur erreur [citation:4][citation:6][citation:10].</li><li>Surveiller les pipelines via l'interface Web et les alertes.</li></ul><p><strong>Exemple de DAG</strong> pour les données de localisation :</p><ol><li><strong>extract_data</strong> (PythonOperator) : Télécharge les fichiers CSV du jour depuis un bucket S3.</li><li><strong>clean_geoloc</strong> (PythonOperator) : Nettoie les données (valeurs aberrantes, doublons).</li><li><strong>aggregate_by_region</strong> (PythonOperator) : Calcule le nombre d'appels par région.</li><li><strong>load_to_warehouse</strong> (PostgresOperator/BigQueryOperator) : Charge les données agrégées dans le Data Warehouse.</li></ol><p><strong>Dépendances :</strong> extract_data >> clean_geoloc >> aggregate_by_region >> load_to_warehouse.</p>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> Proposez des mesures de <strong>sécurité</strong> à mettre en œuvre pour ce pipeline, en abordant le chiffrement et le contrôle des accès.</p>",
          "reponse": "<p>Pour sécuriser ce pipeline :</p><ul><li><strong>Chiffrement</strong> :<ul><li><strong>En transit</strong> : Utiliser le protocole TLS pour toutes les communications (entre Kafka, le Data Lake, et les bases de données).</li><li><strong>Au repos</strong> : Activer le chiffrement côté serveur (ex: AWS S3 SSE) sur le Data Lake et chiffrer les bases de données.</li></ul></li><li><strong>Contrôle des accès</strong> :<ul><li><strong>Authentification</strong> : Implémenter des mécanismes comme OAuth ou LDAP pour les utilisateurs [citation:12].</li><li><strong>Autorisation</strong> : Mettre en place un modèle <strong>RBAC</strong> (Role-Based Access Control) pour définir qui peut lire, écrire ou exécuter des tâches sur le pipeline.</li></ul></li><li><strong>Gestion des secrets</strong> : Utiliser un outil comme HashiCorp Vault pour stocker les mots de passe et clés API de manière sécurisée [citation:10].</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse d'Architecture et de Gouvernance (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Une grande banque camerounaise a adopté une architecture <strong>Data Lakehouse</strong> moderne (combinant Data Lake et Data Warehouse) utilisant le format <strong>Delta Lake</strong>. Elle utilise <strong>dbt</strong> pour les transformations et <strong>Airflow</strong> pour l'orchestration. Cependant, elle rencontre des difficultés de gouvernance et de qualité des données.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Expliquez les avantages d'un <strong>Data Lakehouse</strong> par rapport à un Data Warehouse traditionnel dans le contexte de cette banque.</p>",
          "reponse": "<p>Un <strong>Data Lakehouse</strong> (comme Delta Lake) offre :</p><ul><li><strong>Flexibilité</strong> : Capacité à stocker tous types de données (structurées, semi-structurées comme les logs, non-structurées comme les documents) dans un Data Lake, tout en offrant des performances de requêtage proches d'un Data Warehouse [citation:6][citation:8].</li><li><strong>Fiabilité ACID</strong> : Transactions ACID (Atomicité, Cohérence, Isolation, Durabilité) assurant l'intégrité des données, cruciales pour des données financières [citation:8].</li><li><strong>Réduction des coûts</strong> : Séparation du stockage (moins cher) et du calcul, avec la possibilité d'utiliser des formats ouverts comme Parquet [citation:12].</li></ul>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> Proposez des mécanismes pour assurer la <strong>qualité des données</strong> (data quality) et la <strong>traçabilité</strong> (data lineage) dans ce pipeline.</p>",
          "reponse": "<p><strong>Qualité des données</strong> :</p><ul><li>Mettre en œuvre des tests de validation avec des outils comme <strong>Great Expectations</strong> ou des tests intégrés à <strong>dbt</strong> (tests sur les modèles) [citation:4][citation:10].</li><li>Vérifier la complétude, l'unicité, la conformité aux règles métier (ex: montants positifs).</li></ul><p><strong>Traçabilité (Data Lineage)</strong> :</p><ul><li>Utiliser des fonctionnalités natives de la plateforme (ex: Delta Lake logs) et dbt (docs générées).</li><li>Mettre en place un outil de <strong>Data Lineage</strong> (ex: OpenLineage) pour tracer le parcours des données de l'ingestion à la visualisation, facilitant l'audit et la conformité [citation:10][citation:12].</li></ul>"
        },
        {
          "question": "<p><strong>3.3 (3 pts)</strong> La banque souhaite également mettre en place une <strong>Data Governance</strong> structurée. Détaillez les éléments clés de cette gouvernance : rôles, politiques et outils.</p>",
          "reponse": "<p>Une gouvernance structurée pour cette banque inclurait :</p><p><strong>Rôles & Responsabilités</strong> : Un <strong>Chief Data Officer (CDO)</strong> pour la stratégie, un <strong>Comité de gouvernance</strong> pour valider les politiques, des <strong>Data Stewards</strong> par métier (crédit, marketing) pour la qualité, et une <strong>équipe Data Engineering</strong> pour la mise en œuvre technique [citation:12].</p><p><strong>Politiques</strong> :</p><ul><li>Politique de qualité des données (métriques, contrôles).</li><li>Politique de sécurité et de confidentialité.</li><li>Politique de gestion des métadonnées (catalogage).</li></ul><p><strong>Outils</strong> :</p><ul><li>Un <strong>catalogue de données</strong> (ex: Amundsen) pour rendre les données découvrables.</li><li>Un outil de <strong>Data Lineage</strong> pour l'audit.</li><li>L'intégration avec un outil de <strong>gestion de la qualité</strong> [citation:6][citation:12].</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
