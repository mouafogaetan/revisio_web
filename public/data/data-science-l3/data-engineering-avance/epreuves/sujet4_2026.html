<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Data Engineering Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Étude de Cas : Gouvernance des Données en Santé",
      "points": "6 pts",
      "enonce": "<p>Vous êtes Data Engineer au sein du ministère de la Santé du Cameroun. Le ministère souhaite mettre en place une plateforme centralisée pour gérer les données de santé des citoyens (dossiers médicaux, campagnes de vaccination, épidémies, etc.).</p><p>Vous devez proposer une stratégie de gouvernance de données solide, incluant des politiques, des standards et des processus. Utilisez le framework DAMA (DMBOK) pour structurer votre réponse.</p>",
      "questions": [
        {
          "question": "1) Définissez ce qu'est la gouvernance des données dans le contexte de la santé camerounaise. (2 pts)",
          "reponse": "La gouvernance des données est un ensemble de politiques, de standards, de processus et de contrôles visant à garantir la disponibilité, l'utilisabilité, l'intégrité, la sécurité et la conformité des données de santé. Dans le contexte camerounais, cela implique de définir qui (les hôpitaux, les agences de santé, le ministère) est responsable de quelles données, comment les données sont collectées, stockées et partagées, et comment elles sont protégées contre les accès non autorisés tout en respectant les réglementations locales."
        },
        {
          "question": "2) Citez et expliquez brièvement deux fonctions clés de la gouvernance des données (selon DAMA) qui sont critiques pour ce projet. (2 pts)",
          "reponse": "Deux fonctions clés selon DAMA, critiques pour le projet :\n- **Gestion des données maîtres (MDM)** : Nécessaire pour créer une vue unique et cohérente des patients, des professionnels de santé et des établissements à travers le pays.\n- **Gestion de la qualité des données** : Indispensable pour s'assurer que les données des patients sont exactes, complètes et à jour. Cela inclut la mise en place de contrôles pour détecter les doublons, les erreurs de saisie ou les données manquantes."
        },
        {
          "question": "3) Expliquez comment le data lineage peut être utilisé pour assurer la conformité et l'audit dans ce projet. (2 pts)",
          "reponse": "Le data lineage permet de tracer l'origine des données, leur transformation et leur destination finale. Dans le domaine de la santé, cela est crucial pour répondre aux audits réglementaires. Par exemple, si une erreur est découverte dans un rapport de vaccination, le data lineage permet de retracer cette donnée jusqu'à son enregistrement initial dans le système d'un hôpital, en passant par toutes les transformations, ce qui facilite l'identification de la source de l'erreur et la correction du processus."
        }
      ]
    },
    {
      "titre": "Contrôle de la Qualité des Données",
      "points": "4 pts",
      "enonce": "<p>Un Data Lake contenant des transactions bancaires (montant, date, type, client_id) souffre de problèmes de qualité. Des montants négatifs sont détectés, des dates futures apparaissent et des client_id sont manquants.</p>",
      "questions": [
        {
          "question": "1) Citez une dimension de la qualité des données qui est violée pour chaque problème. (1.5 pts)",
          "reponse": "- Montant négatif : **Exactitude** (ou Intégrité).\n- Date future : **Actualité** (ou Fraîcheur).\n- client_id manquant : **Complétude**."
        },
        {
          "question": "2) Proposez une stratégie (une règle de contrôle) pour prévenir ces trois types de problèmes dans le pipeline d'ingestion. (1.5 pts)",
          "reponse": "Pour prévenir ces problèmes, on peut mettre en place des contrôles de qualité avant le chargement des données dans le Data Lake :\n- **Contrôle sur le montant** : Vérifier que `montant > 0`.\n- **Contrôle sur la date** : Vérifier que `date <= CURRENT_DATE`.\n- **Contrôle sur le client_id** : Vérifier que `client_id IS NOT NULL` et qu'il existe dans la table de référence des clients."
        },
        {
          "question": "3) Imaginez qu'une règle de qualité échoue lors de l'exécution d'un pipeline batch. Décrivez le processus de gestion de cette erreur (logging, alerte, etc.). (1 pt)",
          "reponse": "Lorsqu'une règle de qualité échoue, le processus doit : 1) **Logger l'erreur** en détail (date, heure, lot de données concerné, règle violée, valeurs incriminées). 2) **Envoyer une alerte** à l'équipe de Data Engineering (via email, Slack ou un outil comme PagerDuty) pour une intervention manuelle. 3) **Décider du comportement du pipeline** : soit arrêter le pipeline pour éviter de charger des données corrompues, soit isoler les données défectueuses dans un dossier 'quarantaine' et continuer le traitement avec les données valides, selon la criticité."
        }
      ]
    },
    {
      "titre": "Mise en Place du Contrôle d'Accès pour une Banque",
      "points": "5 pts",
      "enonce": "<p>Une grande banque camerounaise a migré son Data Lake sur Amazon S3. Le Data Lake contient :</p><ul><li>Données clients (nom, adresse, numéro de compte, etc.)</li><li>Données de transaction (montant, date, type, etc.)</li><li>Rapports financiers</li></ul><p>Les équipes suivantes doivent y avoir accès :</p><ul><li>**Data Science** : accès en lecture sur toutes les données.</li><li>**Conformité (Audit)** : accès en lecture sur toutes les données.</li><li>**Marketing** : accès en lecture aux données clients uniquement.</li><li>**Data Engineering** : accès complet (lecture, écriture, suppression).</li></ul>",
      "questions": [
        {
          "question": "1) En utilisant AWS IAM, créez les groupes, les politiques et les permissions nécessaires pour ces équipes. (2.5 pts)",
          "reponse": "**Organisation du Data Lake (dossiers S3)** : `s3://banque-data-lake/clients/`, `s3://banque-data-lake/transactions/`, `s3://banque-data-lake/rapports/`.\n\n**Groupes IAM** :\n- **Data-Science-Group** : Accès `s3:GetObject` et `s3:ListBucket` sur les trois dossiers. Refus de `s3:PutObject`, `s3:DeleteObject`.\n- **Conformite-Group** : Accès `s3:GetObject` et `s3:ListBucket` sur les trois dossiers. Refus de `s3:PutObject`, `s3:DeleteObject`.\n- **Marketing-Group** : Accès `s3:GetObject` et `s3:ListBucket` sur `clients/`. Refus d'accès aux autres dossiers.\n- **Data-Engineering-Group** : Accès complet sur tous les dossiers."
        },
        {
          "question": "2) Quelle est la différence fondamentale entre l'authentification et l'autorisation dans ce contexte ? (1 pt)",
          "reponse": "**Authentification** : Vérification de l'identité de l'utilisateur (ex : login/mot de passe). **Autorisation** : Détermine ce que l'utilisateur authentifié a le droit de faire (ex : lecture, écriture). Dans le contexte AWS, l'authentification est gérée par les identifiants IAM, et l'autorisation par les politiques IAM attachées aux groupes."
        },
        {
          "question": "3) Comment pourriez-vous utiliser le SSO (Single Sign-On) pour simplifier l'accès des utilisateurs ? (1.5 pts)",
          "reponse": "On peut configurer **AWS IAM Identity Center** pour fédérer les identités avec un annuaire central (comme Azure AD ou Google Workspace). Ainsi, les utilisateurs se connectent une fois à leur annuaire et obtiennent automatiquement les droits correspondants sur la console AWS et les services, sans avoir besoin de mots de passe AWS séparés. On mappe alors les groupes de l'annuaire aux groupes IAM déjà définis."
        }
      ]
    },
    {
      "titre": "Sécurité des Données en Transit et au Repos",
      "points": "3 pts",
      "enonce": "<p>Dans le cadre du projet de la banque, les données sont en transit entre les services (S3 et un Data Warehouse) et au repos sur S3 et le Data Warehouse.</p>",
      "questions": [
        {
          "question": "1) Citez un mécanisme pour chiffrer les données en transit. (1 pt)",
          "reponse": "Utiliser **TLS (Transport Layer Security)** pour sécuriser les connexions entre les services (ex : AWS S3 utilise HTTPS pour les transferts)."
        },
        {
          "question": "2) Citez deux options pour chiffrer les données au repos sur S3. (1 pt)",
          "reponse": "1. **SSE-S3** : Chiffrement géré par AWS (clés gérées par S3).\n2. **SSE-KMS** : Chiffrement avec des clés gérées par AWS Key Management Service (KMS), offrant un contrôle plus fin."
        },
        {
          "question": "3) Expliquez l'intérêt de la gestion des clés de chiffrement. (1 pt)",
          "reponse": "La gestion des clés de chiffrement permet de :\n- Contrôler qui peut chiffrer/déchiffrer les données.\n- Effectuer une rotation régulière des clés pour réduire les risques.\n- Auditer l'utilisation des clés pour détecter des accès suspects ou des anomalies."
        }
      ]
    },
    {
      "titre": "Sécurisation des Pipelines de Données",
      "points": "2 pts",
      "enonce": "<p>Un pipeline Airflow est utilisé pour orchestrer l'ETL des données de la banque. Une vulnérabilité a été découverte : un attaquant pourrait modifier les scripts Python exécutés par Airflow.</p>",
      "questions": [
        {
          "question": "1) Proposez deux bonnes pratiques pour sécuriser ce pipeline. (2 pts)",
          "reponse": "1. **Contrôle d'accès strict** : Restreindre l'accès aux fichiers DAG et aux scripts Python via des permissions sur le système de fichiers (ex : l'utilisateur Airflow a des droits en lecture seule sur les DAGs, sauf pour les développeurs autorisés).\n2. **Isolation** : Utiliser des environnements virtuels ou des conteneurs (Docker) pour exécuter chaque DAG. Ainsi, même si un script est compromis, l'attaquant ne pourra pas accéder au système hôte."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
