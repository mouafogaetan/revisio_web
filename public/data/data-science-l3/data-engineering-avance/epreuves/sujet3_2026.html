            }

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>

            <span id="subjectInfo">Matière</span>

            <span id="sequenceInfo">Séquence</span>

                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Data Engineering Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 3 - Stream Processing & Projets",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Traitement de Flux et Architectures Modernes",
      "points": "10 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#2d3748;'>\n  <p>Cet exercice porte sur les concepts fondamentaux du traitement de flux, les outils comme Kafka et Flink, ainsi que les architectures de données modernes (Lambda, Kappa).</p>\n  <p><strong>Contexte :</strong> La société <em>AfriCloud</em> souhaite migrer son système de traitement des logs vers une architecture en temps réel. Actuellement, les logs sont traités par batch chaque nuit, ce qui entraîne des retards dans la détection des anomalies.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:10px;'><strong>1. (2 pts)</strong> Distinguez l'approche ETL de l'approche ELT en précisant l'ordre des étapes. Expliquez pourquoi l'ELT est privilégié dans le contexte du Cloud.</div>",
          "reponse": "<div style='background:#f0f9ff; padding:12px; border-radius:8px; color:#1e3a8a;'><strong>ETL :</strong> Extract (Extraire) -> Transform (Transformer) -> Load (Charger). La transformation est effectuée avant le chargement, souvent dans un serveur ETL dédié.<br><strong>ELT :</strong> Extract -> Load -> Transform. On charge les données brutes dans le Data Warehouse (ex: BigQuery) et on effectue les transformations directement dans le Data Warehouse.<br><strong>Privilège du Cloud :</strong> Les Data Warehouses modernes (BigQuery, Redshift) ont une puissance de calcul énorme. L'ELT permet d'exploiter cette puissance (Massively Parallel Processing) et d'éviter de déplacer les données inutilement, réduisant ainsi la latence et les coûts.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>2. (2 pts)</strong> Expliquez les différences fondamentales entre Apache Kafka et Apache Flink. Quels sont leurs rôles respectifs dans une architecture de stream processing ?</div>",
          "reponse": "<div style='background:#f0fdf4; padding:12px; border-radius:8px; color:#14532d;'><strong>Apache Kafka :</strong> C'est une plateforme de messagerie distribuée. Il agit comme un bus de données (broker) et un système de stockage durable (log). <br><strong>Rôle :</strong> Ingérer, stocker et distribuer les flux de données (messages) en garantissant une haute disponibilité et une rejouabilité (replay) des événements.<br><br><strong>Apache Flink :</strong> C'est un moteur de traitement de flux (stream processor). <br><strong>Rôle :</strong> Lire les données d'un source (ex: Kafka), effectuer des calculs complexes en temps réel (fenêtres, états, agrégations), et écrire les résultats dans un sink (ex: base de données). Flink gère la sémantique exactly-once et le temps d'événement.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>3. (2 pts)</strong> Dans le contexte du traitement de flux, expliquez ce qu'est un Watermark dans Apache Flink. À quoi sert-il et comment permet-il de gérer les événements en retard (late events) ?</div>",
          "reponse": "<div style='background:#fff7ed; padding:12px; border-radius:8px; color:#7c2d12;'><strong>Watermark :</strong> C'est un horodatage qui indique la progression du temps d'événement (event time). Il sert de signal pour déclencher les calculs de fenêtres (windows).<br><br><strong>Rôle :</strong> Il permet de gérer les événements qui arrivent dans le désordre (out-of-order) ou avec du retard. En définissant un watermark, on dit à Flink : \"Jusqu'à présent, j'ai traité tous les événements avec un timestamp inférieur à cette date, je peux donc déclencher les fenêtres concernées\".<br><strong>Gestion des retards :</strong> Les événements qui arrivent après le watermark (late events) peuvent soit être ignorés, soit être traités dans une fenêtre de tolérance (allowed lateness) pour mettre à jour les résultats.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>4. (4 pts)</strong> AfriCloud vous demande de choisir entre l'architecture Lambda et l'architecture Kappa pour son nouveau pipeline. Comparez ces deux architectures en justifiant votre choix en fonction des besoins.</div>",
          "reponse": "<div style='background:#f3e8ff; padding:12px; border-radius:8px; color:#4c1d95;'><strong>Architecture Lambda :</strong> <br>- Double voie de traitement : Batch (couche froide) et Speed (couche chaude). <br>- Résultat : Fusion des deux vues. <br>- Avantages : Robuste, tolérant aux pannes, permet de recalculer les données en batch. <br>- Inconvénients : Complexité à maintenir deux pipelines différents, latence potentielle dans la fusion des données.<br><br><strong>Architecture Kappa :</strong> <br>- Une seule voie de traitement : Le flux (streaming) gère tout. <br>- Le batch n'est qu'une version rejouée du flux (reprocessing). <br>- Avantages : Simplification radicale de l'architecture, une seule codebase. <br>- Inconvénients : Moins adaptée si la rejouabilité de longues périodes est complexe.<br><br><strong>Recommandation :</strong> Je recommande <strong>l'architecture Kappa</strong>. Puisque le besoin est de détecter des anomalies en temps réel et que les données de logs sont volumineuses, Kappa simplifie la maintenance. Avec Kafka comme source de vérité et Flink pour le traitement, on peut rejouer les données en cas de besoin sans maintenir un pipeline batch séparé. Si l'entreprise souhaite garder une option batch pour l'historique, on peut toujours utiliser Flink pour un traitement batch (Flink Batch).</div>"
        }
      ]
    },
    {
      "titre": "Mise en Œuvre d'un Pipeline de Streaming avec Kafka & Flink",
      "points": "10 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#2d3748;'>\n  <p>L'objectif de cet exercice est d'évaluer votre capacité à concevoir et implémenter un pipeline de streaming en utilisant Apache Kafka et Apache Flink, en prenant en compte la gouvernance et la qualité des données.</p>\n  <p><strong>Contexte :</strong> La banque <em>AfriBank</em> souhaite analyser en temps réel les transactions des utilisateurs de l'application mobile pour détecter les pics de dépenses et proposer des offres personnalisées.</p>\n</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:10px;'><strong>1. (3 pts)</strong> Décrivez l'architecture du pipeline en justifiant les composants (Source, Broker, Moteur de traitement, Sinks).</div>",
          "reponse": "<div style='background:#f0f9ff; padding:12px; border-radius:8px; color:#1e3a8a;'><strong>Source :</strong> L'API REST de l'application mobile envoie chaque transaction sous forme de message JSON au Broker.<br><strong>Broker (Kafka) :</strong> Le topic <em>transactions-raw</em> avec 6 partitions pour le parallélisme. Kafka assure la persistance et la rejouabilité des données.<br><strong>Moteur de traitement (Flink) :</strong> Le job Flink lit le topic Kafka, nettoie les données, calcule les agrégations par utilisateur (fenêtre glissante de 5 minutes), et enrichit avec des données d'utilisateur en cache (Redis).<br><strong>Sinks :</strong> <br>- <em>Data Warehouse (BigQuery) :</em> Pour le stockage final des transactions enrichies et historisées. <br>- <em>Topic Kafka de résultats (alerts) :</em> Pour les notifications en temps réel à destination de l'application mobile.<br><strong>Justification :</strong> Kafka pour la robustesse et la distribution, Flink pour le traitement stateful à faible latence, et BigQuery pour l'analyse historique.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>2. (3 pts)</strong> Implémentez (ou pseudo-code) un job Flink qui lit les données du topic <em>transactions-raw</em>, les nettoie et les aggrège par utilisateur sur des fenêtres de 5 minutes.</div>",
          "reponse": "<div style='background:#f0fdf4; padding:12px; border-radius:8px; color:#14532d;'><pre style='background:#1e1e2e; color:#cdd6f4; padding:15px; border-radius:8px; overflow-x:auto;'>\n<strong>Pseudo-code Java/Scala :</strong>\n\n// 1. Configuration de l'environnement\nStreamExecutionEnvironment env = StreamExecutionEnvironment.getExecutionEnvironment();\nenv.setStreamTimeCharacteristic(TimeCharacteristic.EventTime);\n\n// 2. Source Kafka\nDataStream<Transaction> transactionStream = env\n    .addSource(new FlinkKafkaConsumer<>(\"transactions-raw\", new TransactionDeserializationSchema(), properties))\n    .assignTimestampsAndWatermarks(WatermarkStrategy.<Transaction>forBoundedOutOfOrderness(Duration.ofSeconds(10))\n        .withTimestampAssigner((event, timestamp) -> event.getTimestamp()));\n\n// 3. Nettoyage des données : Filtrage des transactions nulles ou invalides\nDataStream<Transaction> cleanedStream = transactionStream\n    .filter(transaction -> transaction != null && transaction.getAmount() > 0);\n\n// 4. Agrégation : Fenêtres glissantes de 5 minutes\nDataStream<UserAggregation> aggregatedStream = cleanedStream\n    .keyBy(Transaction::getUserId)\n    .window(SlidingEventTimeWindows.of(Time.minutes(5), Time.minutes(1)))\n    .aggregate(new AverageAmountAggregator(), new AggregationWindowFunction());\n\n// 5. Enrichissement et écriture dans le Sink\naggregatedStream.addSink(new FlinkKafkaProducer<>(\"user-aggregations\", new AggregationSerializer(), properties));\n\nenv.execute(\"AfriBank Transaction Processor\");\n</pre>\n<em>Explication :</em> On utilise le temps d'événement (EventTime) pour gérer les retards. Le filtre nettoie les données. Le fenêtrage glissant permet d'actualiser les agrégations toutes les minutes.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>3. (2 pts)</strong> Analysez les dimensions de la qualité des données que vous devez vérifier pour ces transactions. Proposez un contrôle dans le pipeline Flink.</div>",
          "reponse": "<div style='background:#fff7ed; padding:12px; border-radius:8px; color:#7c2d12;'><strong>Dimensions :</strong> <br>- <strong>Complétude :</strong> Vérifier que les champs essentiels (userId, montant, timestamp) sont présents. (Contrôle : Filtrage des nulls). <br>- <strong>Exactitude :</strong> Le montant doit être un nombre positif. Le timestamp doit être une date valide. (Contrôle : Validation de format et de plage). <br>- <strong>Cohérence :</strong> Vérifier que le userId existe dans la base de référence (contrôle d'intégrité référentielle). <br>- <strong>Unicité :</strong> Vérifier qu'il n'y a pas de doublons sur l'ID de transaction (au cas où). <br><br><strong>Implémentation Flink :</strong> Utiliser un <em>FilterFunction</em> pour rejeter les transactions invalides et les envoyer dans un <em>Side Output</em> (flux secondaire) pour les stocker dans une table de quarantaine (ex: Kafka topic \"quarantine\"), permettant l'analyse des erreurs.</div>"
        },
        {
          "question": "<div style='margin-bottom:10px;'><strong>4. (2 pts)</strong> Expliquez comment vous assurez la sécurité de ce pipeline (chiffrement, authentification, autorisation).</div>",
          "reponse": "<div style='background:#f3e8ff; padding:12px; border-radius:8px; color:#4c1d95;'><strong>Authentification & Autorisation :</strong> <br>- Mettre en place <strong>OAuth 2.0 / OIDC</strong> pour l'authentification des micro-services. <br>- Utiliser <strong>RBAC (Role-Based Access Control)</strong> sur Kafka (via SASL/SCRAM) et BigQuery (IAM) pour limiter les accès.<br><br><strong>Chiffrement :</strong> <br>- <strong>En transit :</strong> Utiliser TLS/SSL pour toutes les communications (API -> Kafka, Kafka -> Flink, Flink -> BigQuery). <br>- <strong>Au repos :</strong> Activer le chiffrement AES-256 sur les topics Kafka et sur les tables BigQuery. Gérer les clés via un KMS (ex: AWS KMS, Google Cloud KMS).<br><br><strong>Gouvernance :</strong> <br>- Mettre en place un <strong>Data Lineage</strong> pour tracer le chemin des données (API -> Kafka -> Flink -> BigQuery) afin de faciliter les audits et la conformité (RGPD, lois camerounaises).</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
