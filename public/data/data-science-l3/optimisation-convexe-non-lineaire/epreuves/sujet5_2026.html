<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Optimisation Convexe et Non Linéaire - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements de l'Optimisation Convexe",
      "points": "5 pts",
      "enonce": "<p>Cet exercice porte sur les concepts fondamentaux de l'optimisation convexe.</p><ul><li><strong>Question 1.1</strong> : Définir un ensemble convexe et donner un exemple concret en dimension 2.</li><li><strong>Question 1.2</strong> : Énoncer le critère de convexité d'une fonction deux fois dérivable. Appliquer ce critère à la fonction \( f(x) = x^4 - 2x^2 + 3 \).</li><li><strong>Question 1.3</strong> : Expliquer pourquoi, dans un problème d'optimisation convexe, tout minimum local est un minimum global.</li></ul>",
      "questions": [
        {
          "question": "1.1) Définir un ensemble convexe et donner un exemple concret en dimension 2.",
          "reponse": "Un ensemble \( C \\subset \\mathbb{R}^n \) est convexe si pour tous \( x, y \\in C \) et tout \( \\theta \\in [0, 1] \\), on a \( \\theta x + (1-\\theta)y \\in C \\).<br/><br/>Exemple en dimension 2 : un disque fermé \( \\{ (x, y) : x^2 + y^2 \\le 1 \\} \) est convexe. Un carré est également convexe."
        },
        {
          "question": "1.2) Énoncer le critère de convexité d'une fonction deux fois dérivable. Appliquer ce critère à \( f(x) = x^4 - 2x^2 + 3 \).",
          "reponse": "Pour une fonction \( f : \\mathbb{R} \\rightarrow \\mathbb{R} \) deux fois dérivable, \( f \) est convexe si et seulement si \( f''(x) \\ge 0 \) pour tout \( x \\).<br/><br/>Pour \( f(x) = x^4 - 2x^2 + 3 \) :<br/>\( f'(x) = 4x^3 - 4x \)<br/>\( f''(x) = 12x^2 - 4 = 4(3x^2 - 1) \)<br/><br/>La fonction est convexe quand \( f''(x) \\ge 0 \\), soit \( 3x^2 - 1 \\ge 0 \\), c'est-à-dire \( x \\le -1/\\sqrt{3} \) ou \( x \\ge 1/\\sqrt{3} \\).<br/>La fonction est concave sur \( [-1/\\sqrt{3}, 1/\\sqrt{3}] \)."
        },
        {
          "question": "1.3) Expliquer pourquoi, dans un problème d'optimisation convexe, tout minimum local est un minimum global.",
          "reponse": "Soit \( x^* \) un minimum local d'une fonction convexe \( f \\). Supposons par l'absurde qu'il existe \( y \) tel que \( f(y) < f(x^*) \\).<br/><br/>Par convexité, pour tout \( \\theta \\in [0, 1] \) :<br/>\( f(\\theta y + (1-\\theta)x^*) \\le \\theta f(y) + (1-\\theta) f(x^*) < f(x^*) \)<br/><br/>En prenant \( \\theta \) suffisamment petit, le point \( \\theta y + (1-\\theta)x^* \) est arbitrairement proche de \( x^* \), ce qui contredit le fait que \( x^* \) est un minimum local.<br/><br/>Donc \( x^* \) est un minimum global. Cette propriété est fondamentale en optimisation convexe et explique pourquoi les méthodes de descente convergent vers le minimum global."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Dualité et Conditions KKT",
      "points": "6 pts",
      "enonce": "<p>On considère le problème d'optimisation suivant :</p><div class='math-block'><div class='math'>$$ \\begin{aligned} & \\min_{x \\in \\mathbb{R}^2} && f_0(x) = x_1^2 + x_2^2 \\\\ & \\text{s.c.} && x_1 + x_2 \\ge 2 \\\\ & && x_1, x_2 \\ge 0 \\end{aligned} $$</div></div><p>Ce problème modélise par exemple la minimisation de l'énergie d'un système sous contrainte de production minimale.</p><ul><li><strong>Question 2.1</strong> : Écrire le Lagrangien du problème.</li><li><strong>Question 2.2</strong> : Résoudre le problème primal en utilisant les conditions KKT.</li><li><strong>Question 2.3</strong> : Écrire le problème dual et déterminer la fonction duale.</li><li><strong>Question 2.4</strong> : Vérifier la dualité forte et interpréter le multiplicateur de Lagrange.</li></ul>",
      "questions": [
        {
          "question": "2.1) Écrire le Lagrangien du problème.",
          "reponse": "On réécrit les contraintes sous forme standard \( g_i(x) \\le 0 \) :<br/>\( g_1(x) = 2 - x_1 - x_2 \\le 0 \)<br/>\( g_2(x) = -x_1 \\le 0 \)<br/>\( g_3(x) = -x_2 \\le 0 \)<br/><br/>Le Lagrangien est :<br/>\( \\mathcal{L}(x, \\lambda) = x_1^2 + x_2^2 + \\lambda_1(2 - x_1 - x_2) - \\lambda_2 x_1 - \\lambda_3 x_2 \)<br/><br/>avec \( \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0 \\) (multiplicateurs pour les contraintes d'inégalité)."
        },
        {
          "question": "2.2) Résoudre le problème primal en utilisant les conditions KKT.",
          "reponse": "Les conditions KKT sont :<br/><br/>(1) Stationnarité : \( \\nabla f_0(x) + \\sum \\lambda_i \\nabla g_i(x) = 0 \)<br/>\( 2x_1 - \\lambda_1 - \\lambda_2 = 0 \\Rightarrow 2x_1 = \\lambda_1 + \\lambda_2 \)<br/>\( 2x_2 - \\lambda_1 - \\lambda_3 = 0 \\Rightarrow 2x_2 = \\lambda_1 + \\lambda_3 \)<br/><br/>(2) Complémentarité : \( \\lambda_1(2 - x_1 - x_2) = 0, \\lambda_2(-x_1) = 0, \\lambda_3(-x_2) = 0 \)<br/><br/>(3) Faisabilité : \( x_1 + x_2 \\ge 2, x_1 \\ge 0, x_2 \\ge 0 \)<br/><br/>(4) Multiplicateurs : \( \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0 \)<br/><br/>Puisque \( x_1 > 0 \) et \( x_2 > 0 \) (sinon la contrainte \( x_1 + x_2 \\ge 2 \) serait violée), on a \( \\lambda_2 = \\lambda_3 = 0 \).<br/><br/>On a donc \( 2x_1 = \\lambda_1 \) et \( 2x_2 = \\lambda_1 \\), donc \( x_1 = x_2 = \\lambda_1/2 \).<br/><br/>La contrainte est active : \( x_1 + x_2 = 2 \\Rightarrow \\lambda_1 = 2 \\).<br/><br/>La solution est \( (x_1^*, x_2^*) = (1, 1) \), avec \( \\lambda_1 = 2, \\lambda_2 = \\lambda_3 = 0 \)."
        },
        {
          "question": "2.3) Écrire le problème dual et déterminer la fonction duale.",
          "reponse": "La fonction duale est :<br/>\( g(\\lambda) = \\min_{x \\ge 0} \\mathcal{L}(x, \\lambda) \)<br/><br/>Pour \( \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0 \) :<br/><br/>\( g(\\lambda) = \\min_{x \\ge 0} \\left[ x_1^2 + x_2^2 + \\lambda_1(2 - x_1 - x_2) - \\lambda_2 x_1 - \\lambda_3 x_2 \\right] \)<br/><br/>Le minimum en \( x_1 \) est atteint quand :<br/>\( 2x_1 - \\lambda_1 - \\lambda_2 = 0 \\Rightarrow x_1 = (\\lambda_1 + \\lambda_2)/2 \)<br/><br/>Le minimum en \( x_2 \) est atteint quand :<br/>\( 2x_2 - \\lambda_1 - \\lambda_3 = 0 \\Rightarrow x_2 = (\\lambda_1 + \\lambda_3)/2 \)<br/><br/>En substituant :<br/>\( g(\\lambda) = -\\frac{(\\lambda_1 + \\lambda_2)^2}{4} - \\frac{(\\lambda_1 + \\lambda_3)^2}{4} + 2\\lambda_1 \)<br/><br/>Le problème dual est :<br/>\( \\max_{\\lambda \\ge 0} g(\\lambda) \)"
        },
        {
          "question": "2.4) Vérifier la dualité forte et interpréter le multiplicateur de Lagrange.",
          "reponse": "La valeur primale optimale est \( p^* = f_0(1, 1) = 1^2 + 1^2 = 2 \).<br/><br/>À l'optimum dual, on a \( \\lambda_1 = 2, \\lambda_2 = \\lambda_3 = 0 \).<br/><br/>La valeur duale est \( d^* = g(2, 0, 0) = -\\frac{(2)^2}{4} - \\frac{(2)^2}{4} + 2 \\times 2 = -1 - 1 + 4 = 2 \).<br/><br/>On a bien \( p^* = d^* = 2 \), c'est la dualité forte.<br/><br/><strong>Interprétation économique :</strong> Le multiplicateur de Lagrange \( \\lambda_1 = 2 \) représente le prix implicite (ombre) de la contrainte \( x_1 + x_2 \\ge 2 \\). Une augmentation de la production minimale de 1 unité augmenterait la fonction objectif optimale d'environ 2 unités. C'est le coût marginal de la contrainte."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodes de Descente et Optimisation",
      "points": "5 pts",
      "enonce": "<p>On considère une start-up camerounaise spécialisée dans l'agriculture de précision. Elle souhaite optimiser sa production de maïs en fonction de deux variables : la quantité d'engrais \( x \) (en kg/ha) et la quantité d'eau \( y \) (en m³/ha). La fonction de production est donnée par :</p><div class='math-block'><div class='math'>$$ f(x, y) = -x^2 - 2y^2 + 4x + 8y $$</div></div><ul><li><strong>Question 3.1</strong> : Déterminer le point optimal (maximun) de cette fonction par le calcul direct.</li><li><strong>Question 3.2</strong> : Appliquer une itération de la méthode du gradient (descente) à partir du point \( (0, 0) \) avec un pas \( \\alpha = 0.1 \\) pour minimiser \( -f(x, y) \\).</li><li><strong>Question 3.3</strong> : Expliquer en quoi la méthode de Newton pourrait accélérer la convergence sur ce type de problème.</li></ul>",
      "questions": [
        {
          "question": "3.1) Déterminer le point optimal (maximum) de cette fonction par le calcul direct.",
          "reponse": "Le gradient de \( f \) est :<br/>\( \\nabla f = \\begin{pmatrix} -2x + 4 \\\\ -4y + 8 \\end{pmatrix} \)<br/><br/>Au point optimal, le gradient est nul :<br/>\( -2x + 4 = 0 \\Rightarrow x = 2 \)<br/>\( -4y + 8 = 0 \\Rightarrow y = 2 \)<br/><br/>La hessienne est \( H = \\begin{pmatrix} -2 & 0 \\\\ 0 & -4 \\end{pmatrix} \\), qui est définie négative. Le point \( (2, 2) \) est donc un maximum.<br/><br/>La valeur maximale est \( f(2, 2) = -4 - 8 + 8 + 16 = 12 \)."
        },
        {
          "question": "3.2) Appliquer une itération de la méthode du gradient à partir de \( (0, 0) \) avec \( \\alpha = 0.1 \) pour minimiser \( -f(x, y) \\).",
          "reponse": "On pose \( g(x, y) = -f(x, y) = x^2 + 2y^2 - 4x - 8y \).<br/><br/>Le gradient de \( g \) est : \( \\nabla g = \\begin{pmatrix} 2x - 4 \\\\ 4y - 8 \\end{pmatrix} \).<br/><br/>Au point \( (0, 0) \) : \( \\nabla g(0, 0) = \\begin{pmatrix} -4 \\\\ -8 \\end{pmatrix} \).<br/><br/>La mise à jour est :<br/>\( \\begin{pmatrix} x_1 \\\\ y_1 \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} - 0.1 \\begin{pmatrix} -4 \\\\ -8 \\end{pmatrix} = \\begin{pmatrix} 0.4 \\\\ 0.8 \\end{pmatrix} \).<br/><br/>La nouvelle valeur de \( g \) est :<br/>\( g(0.4, 0.8) = 0.16 + 2(0.64) - 1.6 - 6.4 = 0.16 + 1.28 - 8 = -6.56 \).<br/><br/>La fonction a diminué (elle était à 0 initialement)."
        },
        {
          "question": "3.3) Expliquer en quoi la méthode de Newton pourrait accélérer la convergence sur ce type de problème.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
