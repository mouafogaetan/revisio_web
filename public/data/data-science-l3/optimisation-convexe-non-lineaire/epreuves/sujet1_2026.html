<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Optimisation Convexe et Non Linéaire - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements de l'optimisation convexe",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>On considère la fonction <span style='font-weight: bold;'>f: ℝ<sup>n</sup> → ℝ</span> définie par :</p><div class='math-block' style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 18px; color: #2c3e50;'>$$f(x) = \\begin{cases} \\|x\\|_2 & \\text{si } \\|x\\|_2 \\leq 1 \\\\ +\\infty & \\text{sinon} \\end{cases}$$</div></div><p style='font-size: 16px; line-height: 1.6; color: #333;'>où <span style='font-weight: bold;'>\\(\\|x\\|_2 = \\sqrt{\\sum_{i=1}^n x_i^2}\\)</span> est la norme euclidienne.</p><p style='font-size: 16px; line-height: 1.6; color: #333;'><span style='font-weight: bold;'>Rappel :</span> La boule unité fermée de ℝ<sup>n</sup> est notée <span style='font-weight: bold;'>B</span>.</p></div>",
      "questions": [
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>1.</strong> (1 pt) La fonction <span style='font-weight: bold;'>f</span> est-elle convexe ? Justifier votre réponse.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>La fonction <span style='font-weight: bold;'>f</span> est la fonction indicatrice de la boule unité fermée additionnée de la norme euclidienne. La norme est convexe [citation:1], et la fonction indicatrice d'un ensemble convexe est convexe. La somme de deux fonctions convexes est convexe. Donc <span style='font-weight: bold;'>f</span> est <span style='font-weight: bold;'>convexe</span>.</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>2.</strong> (2 pts) Calculer le sous-différentiel <span style='font-weight: bold;'>∂f(x)</span> en tout point <span style='font-weight: bold;'>x</span>.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>En s'inspirant des résultats de la littérature [citation:1][citation:3], on distingue plusieurs cas :</p><ul style='font-size: 15px; line-height: 1.8; color: #333;'><li>Si <span style='font-weight: bold;'>\\(\\|x\\| < 1\\)</span> : <span style='font-weight: bold;'>∂f(x) = {x/||x||}</span></li><li>Si <span style='font-weight: bold;'>x = 0</span> : <span style='font-weight: bold;'>∂f(0) = B</span> (la boule unité fermée)</li><li>Si <span style='font-weight: bold;'>\\(\\|x\\| = 1\\)</span> : <span style='font-weight: bold;'>∂f(x) = {t x : t ≥ 1}</span></li><li>Si <span style='font-weight: bold;'>\\(\\|x\\| > 1\\)</span> : <span style='font-weight: bold;'>∂f(x) = ∅</span></li></ul></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>3.</strong> (1 pt) La fonction <span style='font-weight: bold;'>f</span> est-elle différentiable en <span style='font-weight: bold;'>x = 0</span> ? Justifier.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>Non. En <span style='font-weight: bold;'>x = 0</span>, le sous-différentiel est <span style='font-weight: bold;'>B</span>, qui contient plus d'un élément. Une fonction différentiable a un sous-différentiel réduit à un singleton (son gradient). Donc <span style='font-weight: bold;'>f</span> n'est pas différentiable en <span style='font-weight: bold;'>0</span>.</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>4.</strong> (2 pts) Donner la condition d'optimalité pour le problème <span style='font-weight: bold;'>\\(\\min_{x \\in \\mathbb{R}^n} f(x)\\)</span>.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>La condition d'optimalité est <span style='font-weight: bold;'>0 ∈ ∂f(x*)</span>. D'après le sous-différentiel calculé, on a <span style='font-weight: bold;'>0 ∈ ∂f(x*)</span> si et seulement si <span style='font-weight: bold;'>x* = 0</span> (car <span style='font-weight: bold;'>∂f(0) = B</span>). Le minimiseur est donc <span style='font-weight: bold;'>x* = 0</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions convexes et dualité",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>Soit <span style='font-weight: bold;'>g: ℝ → ℝ</span> une fonction de classe <span style='font-weight: bold;'>C²</span>. On définit <span style='font-weight: bold;'>f: ℝ<sup>n</sup> → ℝ</span> par <span style='font-weight: bold;'>f(x) = g(||x||)</span>.</p><p style='font-size: 16px; line-height: 1.6; color: #333;'>On rappelle que la Hessienne d'une fonction radiale s'exprime dans une base orthonormée <span style='font-weight: bold;'>{e₁, ..., e<sub>n</sub>}</span> avec <span style='font-weight: bold;'>e₁ = x/||x||</span> sous forme diagonale dont les valeurs propres sont <span style='font-weight: bold;'>g''(||x||)</span> (pour la direction radiale) et <span style='font-weight: bold;'>g'(||x||)/||x||</span> (pour les directions orthogonales) [citation:1][citation:3].</p></div>",
      "questions": [
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>1.</strong> (1 pt) Calculer le gradient de <span style='font-weight: bold;'>f</span> en tout point <span style='font-weight: bold;'>x ≠ 0</span>.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>Le gradient est <span style='font-weight: bold;'>∇f(x) = g'(||x||) · x/||x||</span> [citation:1].</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>2.</strong> (2 pts) Donner une condition sur <span style='font-weight: bold;'>g</span> pour que <span style='font-weight: bold;'>f</span> soit convexe.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>D'après l'expression des valeurs propres de la Hessienne [citation:1][citation:3], <span style='font-weight: bold;'>f</span> est convexe si et seulement si :</p><ul style='font-size: 15px; line-height: 1.8; color: #333;'><li><span style='font-weight: bold;'>g''(t) ≥ 0</span> pour tout <span style='font-weight: bold;'>t > 0</span></li><li><span style='font-weight: bold;'>g'(t)/t ≥ 0</span> pour tout <span style='font-weight: bold;'>t > 0</span></li></ul><p style='font-size: 16px; line-height: 1.6; color: #333;'>Ces conditions équivalent à <span style='font-weight: bold;'>g</span> convexe et <span style='font-weight: bold;'>g'</span> positive sur ℝ<sub>+</sub>*.</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>3.</strong> (2 pts) On suppose maintenant que <span style='font-weight: bold;'>g(t) = √(1 + t²)</span>. <span style='font-weight: bold;'>f</span> est-elle convexe ?</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>On a <span style='font-weight: bold;'>g'(t) = t/√(1+t²) ≥ 0</span> et <span style='font-weight: bold;'>g''(t) = 1/(1+t²)<sup>3/2</sup> ≥ 0</span>. Les deux conditions sont vérifiées. Donc <span style='font-weight: bold;'>f</span> est <span style='font-weight: bold;'>convexe</span>. On retrouve un résultat classique [citation:4][citation:5].</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>4.</strong> (2 pts) Calculer la transformée de Legendre-Fenchel (fonction conjuguée) de <span style='font-weight: bold;'>f(x) = √(1 + ||x||²)</span>.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>D'après [citation:5], pour <span style='font-weight: bold;'>f(x) = √(1 + ||x||²)</span>, on a :</p><div class='math-block' style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 18px; color: #2c3e50;'>$$f^*(y) = \\begin{cases} -\\sqrt{1 - ||y||^2} & \\text{si } ||y|| \\leq 1 \\\\ +\\infty & \\text{sinon} \\end{cases}$$</div></div><p style='font-size: 16px; line-height: 1.6; color: #333;'>Le sous-différentiel de <span style='font-weight: bold;'>f*</span> est non-vide pour <span style='font-weight: bold;'>||y|| < 1</span> [citation:5].</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problèmes d'optimisation convexe en Machine Learning",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 16px; line-height: 1.6; color: #333;'>On considère le problème de régression logistique régularisé suivant :</p><div class='math-block' style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 18px; color: #2c3e50;'>$$\\min_{x \\in \\mathbb{R}^n} \\frac{1}{m} \\sum_{i=1}^m \\log(1 + e^{-y_i a_i^T x}) + \\lambda \\|x\\|_2^2$$</div></div><p style='font-size: 16px; line-height: 1.6; color: #333;'>où <span style='font-weight: bold;'>(a<sub>i</sub>, y<sub>i</sub>)</span> sont des données d'apprentissage avec <span style='font-weight: bold;'>a<sub>i</sub> ∈ ℝ<sup>n</sup></span> et <span style='font-weight: bold;'>y<sub>i</sub> ∈ {-1, 1}</span>, et <span style='font-weight: bold;'>λ > 0</span> est un paramètre de régularisation.</p></div>",
      "questions": [
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>1.</strong> (1 pt) Montrer que la fonction objectif est convexe.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>La fonction <span style='font-weight: bold;'>φ(t) = log(1 + e<sup>-t</sup>)</span> est convexe (car <span style='font-weight: bold;'>φ''(t) > 0</span>). La composition <span style='font-weight: bold;'>φ(y<sub>i</sub> a<sub>i</sub><sup>T</sup>x)</span> est convexe en <span style='font-weight: bold;'>x</span>. La somme de fonctions convexes est convexe. La régularisation <span style='font-weight: bold;'>λ||x||₂²</span> est convexe. Donc la fonction objectif est <span style='font-weight: bold;'>convexe</span>.</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>2.</strong> (2 pts) Calculer le gradient de la fonction objectif.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>Le gradient est [citation:9][citation:10] :</p><div class='math-block' style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 18px; color: #2c3e50;'>$$\\nabla J(x) = -\\frac{1}{m} \\sum_{i=1}^m \\frac{y_i a_i}{1 + e^{y_i a_i^T x}} + 2\\lambda x$$</div></div></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>3.</strong> (2 pts) Peut-on utiliser la descente de gradient pour résoudre ce problème ? Justifier.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>Oui. La fonction est <span style='font-weight: bold;'>différentiable</span> et <span style='font-weight: bold;'>convexe</span>. La descente de gradient est donc applicable et converge vers le minimum global [citation:9]. Le gradient est <span style='font-weight: bold;'>Lipschitz</span> (car <span style='font-weight: bold;'>φ</span> est lisse), ce qui garantit la convergence avec un pas bien choisi.</p></div>"
        },
        {
          "question": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'><strong>4.</strong> (2 pts) Proposer une condition suffisante pour que la fonction objectif soit fortement convexe.</p></div>",
          "reponse": "<div><p style='font-size: 16px; line-height: 1.6; color: #333;'>La régularisation <span style='font-weight: bold;'>λ||x||₂²</span> est <span style='font-weight: bold;'>λ</span>-fortement convexe. La fonction de perte logistique est convexe mais pas nécessairement fortement convexe. La somme est donc <span style='font-weight: bold;'>λ</span>-fortement convexe. Une condition suffisante est <span style='font-weight: bold;'>λ > 0</span>.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
