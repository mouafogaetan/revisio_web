<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Optimisation Convexe et Non Linéaire - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 6 - Optimisation Non Lisse et Applications",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Fondements de l'Optimisation Non Lisse",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice porte sur les concepts fondamentaux de l'optimisation non lisse, notamment le sous-gradient et la méthode du sous-gradient.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Définissez le sous-gradient d'une fonction convexe \\( f: \\mathbb{R}^n \\to \\mathbb{R} \\) en un point \\( x \\). Donnez un exemple pour la fonction \\( f(x) = |x| \\) en \\( x = 0 \\).</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le sous-gradient de \\( f \\) en \\( x \\) est l'ensemble :</p><div class='math-block'><div class='math'>$$ \\partial f(x) = \\{ g \\in \\mathbb{R}^n \\mid f(y) \\ge f(x) + g^T(y - x), \\; \\forall y \\in \\mathbb{R}^n \\} $$</div></div><p>Pour \\( f(x) = |x| \\), en \\( x = 0 \\), le sous-gradient est \\( \\partial f(0) = [-1, 1] \\). En effet, tout \\( g \\in [-1, 1] \\) satisfait \\( |y| \\ge 0 + g \\cdot y \\) pour tout \\( y \\).</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Énoncez la condition d'optimalité pour un problème de minimisation convexe non lisse \\( \\min_{x} f(x) \\) où \\( f \\) est convexe mais non différentiable.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Pour une fonction convexe \\( f \\) (non nécessairement différentiable), le point \\( x^* \\) est un minimiseur global de \\( f \\) si et seulement si :</p><div class='math-block'><div class='math'>$$ 0 \\in \\partial f(x^*) $$</div></div><p>C'est la généralisation de la condition \\( \\nabla f(x^*) = 0 \\) pour les fonctions différentiables.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Décrivez la méthode du sous-gradient pour minimiser une fonction convexe non lisse. Expliquez pourquoi la convergence est plus lente que celle de la descente de gradient.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La méthode du sous-gradient itère :</p><div class='math-block'><div class='math'>$$ x_{k+1} = x_k - \\eta_k g_k, \\quad g_k \\in \\partial f(x_k) $$</div></div><p>Contrairement à la descente de gradient, la direction \\( g_k \\) n'est pas nécessairement une direction de descente. La convergence n'est que sous-linéaire (avec un taux en \\( O(1/\\sqrt{k}) \\) ou \\( O(1/k) \\) selon le choix du pas \\( \\eta_k \\)), tandis que la descente de gradient a une convergence linéaire pour les fonctions fortement convexes.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Gradient Proximal et Application au Lasso",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice aborde la méthode du gradient proximal, un outil clé pour les problèmes de régularisation en Machine Learning.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Définissez l'opérateur proximal d'une fonction convexe \\( g: \\mathbb{R}^n \\to \\mathbb{R} \\).</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>L'opérateur proximal de \\( g \\) au point \\( z \\) avec paramètre \\( \\lambda > 0 \\) est défini par :</p><div class='math-block'><div class='math'>$$ \\text{prox}_{\\lambda g}(z) = \\arg\\min_{x} \\left\\{ g(x) + \\frac{1}{2\\lambda} \\|x - z\\|^2 \\right\\} $$</div></div><p>Il s'agit du point qui équilibre la minimisation de \\( g \\) et la proximité à \\( z \\).</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Considérez le problème Lasso : \\( \\min_{\\beta} \\frac{1}{2} \\|y - X\\beta\\|_2^2 + \\lambda \\|\\beta\\|_1 \\). Appliquez la méthode du gradient proximal pour résoudre ce problème. Calculez explicitement l'opérateur proximal de la fonction \\( g(\\beta) = \\lambda \\|\\beta\\|_1 \\).</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La méthode du gradient proximal applique :</p><div class='math-block'><div class='math'>$$ \\beta_{k+1} = \\text{prox}_{\\eta \\lambda \\|\\cdot\\|_1} \\left( \\beta_k - \\eta X^T(X\\beta_k - y) \\right) $$</div></div><p>Le proximal de la norme \\( \\ell_1 \\) est l'opérateur de seuillage (soft-thresholding) :</p><div class='math-block'><div class='math'>$$ (\\text{prox}_{\\eta \\lambda \\|\\cdot\\|_1}(z))_i = \\text{sign}(z_i) \\max(|z_i| - \\eta \\lambda, 0) $$</div></div><p>C'est-à-dire qu'on réduit chaque coefficient vers zéro en soustrayant \\( \\eta\\lambda \\), ce qui encourage la parcimonie.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Comparez la régularisation Lasso (norme \\( \\ell_1 \\)) avec la régularisation Ridge (norme \\( \\ell_2 \\)) en termes d'effet sur les coefficients et d'application pratique.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Lasso (L1) :</strong> Force certains coefficients à être exactement nuls, réalisant ainsi une sélection de variables. Adapté aux problèmes où on soupçonne que seules quelques variables sont pertinentes.</li><li><strong>Ridge (L2) :</strong> Réduit les coefficients de manière proportionnelle sans les annuler. Efficace pour gérer la multicolinéarité et améliorer la stabilité numérique.</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : ADMM pour les Problèmes de Régularisation",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice porte sur la méthode ADMM (Alternating Direction Method of Multipliers) et son application aux problèmes de régularisation.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Présentez le cadre général d'ADMM pour le problème \\( \\min_{x,z} f(x) + g(z) \\) avec \\( Ax + Bz = c \\). Écrivez le lagrangien augmenté et décrivez les trois étapes d'une itération.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le lagrangien augmenté est :</p><div class='math-block'><div class='math'>$$ L_\\rho(x,z,y) = f(x) + g(z) + y^T(Ax + Bz - c) + \\frac{\\rho}{2} \\|Ax + Bz - c\\|^2 $$</div></div><p>Les trois étapes d'une itération sont :</p><ol><li><strong>Minimisation en \\( x \\) :</strong> \\( x^{k+1} = \\arg\\min_x L_\\rho(x, z^k, y^k) \\)</li><li><strong>Minimisation en \\( z \\) :</strong> \\( z^{k+1} = \\arg\\min_z L_\\rho(x^{k+1}, z, y^k) \\)</li><li><strong>Mise à jour du multiplicateur :</strong> \\( y^{k+1} = y^k + \\rho(Ax^{k+1} + Bz^{k+1} - c) \\)</li></ol></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Appliquez ADMM au problème Lasso en le reformulant comme un problème avec deux blocs. Expliquez pourquoi chaque sous-problème est facile à résoudre.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>On reformule le Lasso \\( \\min_{\\beta} \\frac{1}{2} \\|y - X\\beta\\|_2^2 + \\lambda \\|\\beta\\|_1 \\) comme :</p><div class='math-block'><div class='math'>$$ \\min_{\\beta, z} \\frac{1}{2} \\|y - X\\beta\\|_2^2 + \\lambda \\|z\\|_1 \\quad \\text{s.c. } \\beta - z = 0 $$</div></div><p>Les sous-problèmes sont :</p><ul><li><strong>Minimisation en \\( \\beta \\) :</strong> Résolution d'un système linéaire (avec matrice \\( X^T X + \\rho I \\)).</li><li><strong>Minimisation en \\( z \\) :</strong> Application de l'opérateur de seuillage (soft-thresholding) sur les coefficients.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Discutez de l'efficacité d'ADMM par rapport à la méthode du gradient proximal pour les problèmes de régularisation de grande taille.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>ADMM est particulièrement efficace lorsque les sous-problèmes sont faciles à résoudre. Pour les problèmes de grande taille, ADMM bénéficie de la parallélisation et de la décomposition des variables. Le gradient proximal est plus simple mais peut être moins efficace pour certaines structures de matrices. ADMM est souvent préféré pour les problèmes où on peut exploiter la structure des données (ex: matrices creuses).</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Application à la Régression Logistique",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice applique les méthodes d'optimisation non lisse à un problème de régression logistique avec régularisation \\( \\ell_1 \\).</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Formulez le problème de régression logistique avec régularisation \\( \\ell_1 \\).</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le problème est :</p><div class='math-block'><div class='math'>$$ \\min_{\\theta} \\frac{1}{n} \\sum_{i=1}^n \\log\\left(1 + e^{-y_i \\theta^T x_i}\\right) + \\lambda \\|\\theta\\|_1 $$</div></div><p>où \\( y_i \\in \\{-1, 1\\} \\) sont les labels et \\( \\theta \\) les paramètres du modèle.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Expliquez pourquoi ce problème est non lisse et comment le gradient proximal peut être utilisé pour le résoudre.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le problème est non lisse à cause du terme \\( \\lambda \\|\\theta\\|_1 \\). La fonction de perte logistique est lisse (différentiable) et la régularisation \\( \\ell_1 \\) est non lisse. On peut utiliser la méthode du gradient proximal :</p><div class='math-block'><div class='math'>$$ \\theta_{k+1} = \\text{prox}_{\\eta \\lambda \\|\\cdot\\|_1} \\left( \\theta_k - \\eta \\nabla f(\\theta_k) \\right) $$</div></div><p>où \\( \\nabla f(\\theta) \\) est le gradient de la perte logistique.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Quels sont les avantages de la régularisation \\( \\ell_1 \\) pour la régression logistique par rapport à la régularisation \\( \\ell_2 \\) ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>Avantage de L1 :</strong> Effectue une sélection de variables, ce qui est utile lorsqu'on a un grand nombre de caractéristiques et qu'on pense que seules certaines sont pertinentes.</li><li><strong>Interprétabilité :</strong> Le modèle résultant est plus simple et plus interprétable.</li><li><strong>Régularisation L2 (Ridge) :</strong> Ne sélectionne pas les variables mais stabilise l'estimation, particulièrement utile en présence de multicolinéarité.</li></ul></div>"
       }

   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
