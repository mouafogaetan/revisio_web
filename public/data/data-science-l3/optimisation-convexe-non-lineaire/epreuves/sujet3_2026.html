<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Optimisation Convexe et Non Linéaire - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 3 - Évaluation des Connaissances",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Fondements de l'Optimisation et Dualité",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice porte sur les fondements de l'optimisation convexe et la théorie de la dualité.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Soit <span class='math'>\\(f: \\mathbb{R}^n \\to \\mathbb{R}\\)</span> une fonction convexe. Montrez que tout minimum local de <span class='math'>\\(f\\)</span> est un minimum global.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Soit <span class='math'>\\(x^*\\)</span> un minimum local de <span class='math'>\\(f\\)</span>. Supposons par l'absurde qu'il existe <span class='math'>\\(y\\)</span> tel que <span class='math'>\\(f(y) < f(x^*)\\)</span>. Par convexité, pour tout <span class='math'>\\(t \\in [0,1]\\)</span> :</p><div class='math-block'><div class='math'>$$ f((1-t)x^* + ty) \\le (1-t)f(x^*) + t f(y) $$</div></div><p>Comme <span class='math'>\\(f(y) < f(x^*)\\)</span>, pour <span class='math'>\\(t > 0\\)</span> petit, on a <span class='math'>\\(f((1-t)x^* + ty) < f(x^*)\\)</span>, ce qui contredit le fait que <span class='math'>\\(x^*\\)</span> soit un minimum local.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Considérez le problème primal suivant : <span class='math'>\\(\\min_{x} f(x)\\)</span> avec <span class='math'>\\(g_i(x) \\le 0, i=1,\\ldots,m\\)</span>. Définissez le lagrangien, la fonction duale, et énoncez le théorème de dualité forte en précisant les conditions de Slater.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Lagrangien :</strong> <span class='math'>\\(L(x, \\lambda) = f(x) + \\sum_{i=1}^m \\lambda_i g_i(x)\\)</span> avec <span class='math'>\\(\\lambda_i \\ge 0\\)</span>.</p><p><strong>Fonction duale :</strong> <span class='math'>\\(g(\\lambda) = \\inf_x L(x, \\lambda)\\)</span>.</p><p><strong>Théorème de dualité forte :</strong> Si le problème primal est convexe et que les conditions de Slater sont vérifiées (i.e., il existe <span class='math'>\\(x\\)</span> strictement réalisable pour les contraintes d'inégalité non affines, <span class='math'>\\(g_i(x) < 0\\)</span>), alors <span class='math'>\\(p^* = d^*\\)</span>, c'est-à-dire qu'il n'y a pas d'écart de dualité.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (2.5 pts)</strong> Appliquez la théorie de la dualité au problème des SVM (marge souple). Écrivez le problème primal, le lagrangien, le problème dual et les conditions KKT.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Problème primal des SVM (marge souple) :</strong></p><div class='math-block'><div class='math'>$$ \\min_{w,b,\\xi} \\frac{1}{2} \\|w\\|^2 + C \\sum_{i=1}^n \\xi_i $$</div></div><p>sous les contraintes <span class='math'>\\(y_i(w^T x_i + b) \\ge 1 - \\xi_i\\)</span>, <span class='math'>\\(\\xi_i \\ge 0\\)</span>.</p><p><strong>Lagrangien :</strong></p><div class='math-block'><div class='math'>$$ L(w,b,\\xi,\\alpha,\\mu) = \\frac{1}{2} \\|w\\|^2 + C \\sum_{i=1}^n \\xi_i - \\sum_{i=1}^n \\alpha_i [y_i(w^T x_i + b) - 1 + \\xi_i] - \\sum_{i=1}^n \\mu_i \\xi_i $$</div></div><p><strong>Problème dual :</strong></p><div class='math-block'><div class='math'>$$ \\max_{\\alpha} \\sum_{i=1}^n \\alpha_i - \\frac{1}{2} \\sum_{i,j} \\alpha_i \\alpha_j y_i y_j x_i^T x_j $$</div></div><p>sous <span class='math'>\\(0 \\le \\alpha_i \\le C\\)</span> et <span class='math'>\\(\\sum_{i=1}^n \\alpha_i y_i = 0\\)</span>.</p><p><strong>Conditions KKT :</strong> <span class='math'>\\(\\nabla_w L = 0 \\Rightarrow w = \\sum \\alpha_i y_i x_i\\)</span>, <span class='math'>\\(\\nabla_b L = 0 \\Rightarrow \\sum \\alpha_i y_i = 0\\)</span>, <span class='math'>\\(\\alpha_i [y_i(w^T x_i + b) - 1 + \\xi_i] = 0\\)</span>, <span class='math'>\\((C - \\alpha_i)\\xi_i = 0\\)</span>, et <span class='math'>\\(\\alpha_i \\ge 0, \\mu_i \\ge 0\\)</span>.</p></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Méthodes de Points Intérieurs",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice explore les méthodes de points intérieurs pour l'optimisation convexe.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Décrivez le principe général des méthodes de points intérieurs. Quelle est la différence entre les méthodes de barrière et les méthodes primales-duales ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les méthodes de points intérieurs transforment un problème contraint en une séquence de problèmes non contraints en utilisant une fonction de barrière. Les itérés restent strictement à l'intérieur de la région réalisable.</p><p><strong>Méthodes de barrière :</strong> Transforment le problème en une séquence de problèmes non contraints en ajoutant une fonction de barrière (souvent logarithmique). Le paramètre de barrière <span class='math'>\\(\\mu\\)</span> tend vers 0.</p><p><strong>Méthodes primales-duales :</strong> Traitent simultanément les variables primales et duales en résolvant le système d'équations de KKT via une méthode de Newton, tout en maintenant la positivité des variables duales.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (2 pts)</strong> Pour le problème <span class='math'>\\(\\min_{x} c^T x\\)</span> sous <span class='math'>\\(Ax = b\\)</span> et <span class='math'>\\(x \\ge 0\\)</span>, écrivez la fonction de barrière logarithmique et le problème de barrière associé. Expliquez comment le paramètre de barrière permet de retrouver la solution du problème original.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Fonction de barrière logarithmique :</strong></p><div class='math-block'><div class='math'>$$ \\phi(x) = -\\sum_{i=1}^n \\log(x_i) $$</div></div><p><strong>Problème de barrière :</strong></p><div class='math-block'><div class='math'>$$ \\min_{x \\ge 0, Ax = b} c^T x - \\mu \\sum_{i=1}^n \\log(x_i) $$</div></div><p>Lorsque <span class='math'>\\(\\mu > 0\\)</span>, la solution du problème de barrière est strictement intérieure. Lorsque <span class='math'>\\(\\mu \\to 0\\)</span>, la solution du problème de barrière tend vers la solution du problème original. On résout une séquence de problèmes de barrière avec <span class='math'>\\(\\mu_k \\to 0\\)</span>.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (1.5 pt)</strong> Pourquoi les méthodes de points intérieurs sont-elles particulièrement adaptées à la programmation linéaire (LP) et quadratique (QP) de grande taille ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les méthodes de points intérieurs sont adaptées car :</p><ul><li>Leur complexité est polynomiale en <span class='math'>\\(O(\\sqrt{n})\\)</span> itérations pour une précision donnée.</li><li>Elles exploitent la structure creuse des matrices des problèmes LP et QP.</li><li>Contrairement aux méthodes de pénalité, elles maintiennent la faisabilité stricte des itérés.</li><li>Elles sont plus robustes que les méthodes de simplexe pour les LP de grande taille.</li></ul></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Optimisation Non Linéaire et Machine Learning",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'><p>Cet exercice porte sur l'application des méthodes d'optimisation au Machine Learning.</p></div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. (1.5 pt)</strong> Décrivez l'algorithme de rétropropagation (backpropagation) pour les réseaux de neurones. Expliquez comment il permet de calculer les gradients de la fonction de perte par rapport aux poids.</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La rétropropagation est un algorithme qui calcule les gradients de la fonction de perte par rapport aux poids d'un réseau de neurones en deux phases :</p><ul><li><strong>Propagation avant (forward pass) :</strong> On calcule la sortie du réseau pour une entrée donnée en propageant les valeurs à travers les couches.</li><li><strong>Propagation arrière (backward pass) :</strong> On propage l'erreur de la sortie vers l'entrée en utilisant la règle de la chaîne pour calculer les gradients de l'erreur par rapport à chaque poids.</li></ul><p>Cette méthode est essentielle pour l'entraînement des réseaux de neurones par descente de gradient.</p></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2. (1.5 pt)</strong> Comparez la descente de gradient stochastique (SGD) avec les optimiseurs Adam et RMSprop. Quels sont les avantages de ces derniers pour l'entraînement des réseaux de neurones profonds ?</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>SGD :</strong> Met à jour les poids en utilisant une estimation du gradient sur un mini-batch. Simple mais peut être lent et sensible au choix du taux d'apprentissage.</li><li><strong>RMSprop :</strong> Adapte le taux d'apprentissage pour chaque paramètre en normalisant par la moyenne des carrés des gradients passés. Efficace pour les problèmes avec des gradients de magnitudes différentes.</li><li><strong>Adam :</strong> Combine les avantages de RMSprop et du momentum en maintenant à la fois une moyenne exponentielle des gradients et de leurs carrés. Il est robuste, converge rapidement et est peu sensible au choix des hyperparamètres.</li></ul></div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3. (2 pts)</strong> L'optimisation des réseaux de neurones est un problème non convexe. Expliquez pourquoi et décrivez les stratégies pour gérer cette non-convexité (initialisation, momentum, taux d'apprentissage adaptatif, etc.).</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
