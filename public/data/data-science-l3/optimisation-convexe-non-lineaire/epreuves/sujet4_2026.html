<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Optimisation Convexe et Non Linéaire - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Optimisation sans contraintes et Quasi-Newton",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>On considère la fonction \( f : \mathbb{R}^2 \to \mathbb{R} \) définie par :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'>\n<div class='math'>$$ f(x, y) = x^2 + 2y^2 - 2xy - 2x $$</div>\n</div>\n<p>Cette fonction est utilisée comme fonction test en optimisation non linéaire.</p>\n</div>",
     "questions": [
       {
         "question": "<div><p><strong>1.1</strong> Calculer le gradient de \( f \) et déterminer son point critique. (1.5 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>Le gradient est :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\nabla f(x, y) = \\begin{pmatrix} 2x - 2y - 2 \\\\ 4y - 2x \\end{pmatrix} $$</div>\n</div>\n<p>En annulant le gradient, on obtient le système :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\begin{cases} 2x - 2y - 2 = 0 \\\\ -2x + 4y = 0 \\end{cases} $$</div>\n</div>\n<p>De la deuxième équation, on a \( x = 2y \). En substituant dans la première : \( 4y - 2y - 2 = 0 \Rightarrow 2y = 2 \Rightarrow y = 1 \).</p>\n<p>Le point critique est donc \( (x^*, y^*) = (2, 1) \).</p>\n</div>"
       },
       {
         "question": "<div><p><strong>1.2</strong> Calculer la matrice hessienne de \( f \). En déduire la nature du point critique. (1.5 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>La matrice hessienne est :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ H = \\begin{pmatrix} 2 & -2 \\\\ -2 & 4 \\end{pmatrix} $$</div>\n</div>\n<p>Les valeurs propres sont solutions de \( \\det(H - \\lambda I) = 0 \) :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\begin{vmatrix} 2-\\lambda & -2 \\\\ -2 & 4-\\lambda \\end{vmatrix} = (2-\\lambda)(4-\\lambda) - 4 = \\lambda^2 - 6\\lambda + 4 = 0 $$</div>\n</div>\n<p>Les valeurs propres sont \( \\lambda_1 = 3 - \\sqrt{5} > 0 \) et \( \\lambda_2 = 3 + \\sqrt{5} > 0 \).</p>\n<p>La hessienne est définie positive, donc \( f \) est strictement convexe et le point critique \( (2, 1) \) est un minimum global.</p>\n</div>"
       },
       {
         "question": "<div><p><strong>1.3</strong> On souhaite appliquer l'algorithme de Newton pour minimiser \( f \) en partant de \( x_0 = (0, 0) \). Déterminer la direction de Newton \( d_0 \). (1.5 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>On a \( \\nabla f(0,0) = \\begin{pmatrix} -2 \\\\ 0 \\end{pmatrix} \) et \( H = \\begin{pmatrix} 2 & -2 \\\\ -2 & 4 \\end{pmatrix} \).</p>\n<p>La direction de Newton \( d_0 \) est solution de \( H d_0 = -\\nabla f(0,0) \).</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\begin{pmatrix} 2 & -2 \\\\ -2 & 4 \\end{pmatrix} \\begin{pmatrix} d_x \\\\ d_y \\end{pmatrix} = \\begin{pmatrix} 2 \\\\ 0 \\end{pmatrix} $$</div>\n</div>\n<p>On a : \( 2d_x - 2d_y = 2 \Rightarrow d_x - d_y = 1 \) et \( -2d_x + 4d_y = 0 \Rightarrow d_x = 2d_y \).</p>\n<p>En substituant : \( 2d_y - d_y = 1 \Rightarrow d_y = 1 \) et \( d_x = 2 \).</p>\n<p>La direction de Newton est donc \( d_0 = (2, 1) \).</p>\n</div>"
       },
       {
         "question": "<div><p><strong>1.4</strong> En supposant un pas de \( \\alpha = 1 \), donner la nouvelle itération \( x_1 \). (1.5 pt)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>Pour \( \\alpha = 1 \), on a :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ x_1 = x_0 + \\alpha d_0 = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} + 1 \\times \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix} $$</div>\n</div>\n<p>On constate que l'algorithme de Newton a convergé en une seule itération car la fonction est quadratique.</p>\n</div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Méthodes de Points Intérieurs pour les SVM",
     "points": "7 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>On considère un problème de classification binaire avec un jeu de données linéairement séparable de \( n \) points \( (\\mathbf{x}_i, y_i) \). Le problème primal des SVM est :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'>\n<div class='math'>$$ \\begin{aligned} & \\min_{\\mathbf{w}, b, \\boldsymbol{\\xi}} \\frac{1}{2} \\|\\mathbf{w}\\|^2 + C \\sum_{i=1}^n \\xi_i \\\\ & \\text{s.c. } y_i(\\mathbf{w} \\cdot \\mathbf{x}_i + b) \\geq 1 - \\xi_i, \\quad \\xi_i \\geq 0 \\end{aligned} $$</div>\n</div>\n<p>Le paramètre \( C > 0 \) contrôle le compromis entre la maximisation de la marge et la minimisation des erreurs.</p>\n</div>",
     "questions": [
       {
         "question": "<div><p><strong>2.1</strong> Écrire le Lagrangien du problème primal en introduisant les multiplicateurs \( \\alpha_i \\geq 0 \) pour les contraintes de marge et \( \\beta_i \\geq 0 \) pour les contraintes \( \\xi_i \\geq 0 \). (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>Le Lagrangien est :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ L(\\mathbf{w}, b, \\boldsymbol{\\xi}, \\boldsymbol{\\alpha}, \\boldsymbol{\\beta}) = \\frac{1}{2} \\|\\mathbf{w}\\|^2 + C \\sum_{i=1}^n \\xi_i - \\sum_{i=1}^n \\alpha_i \\left[ y_i(\\mathbf{w} \\cdot \\mathbf{x}_i + b) - 1 + \\xi_i \\right] - \\sum_{i=1}^n \\beta_i \\xi_i $$</div>\n</div>\n<p>où \( \\alpha_i \\geq 0 \) et \( \\beta_i \\geq 0 \) sont les multiplicateurs de Lagrange.</p>\n</div>"
       },
       {
         "question": "<div><p><strong>2.2</strong> En annulant les dérivées partielles du Lagrangien par rapport à \( \\mathbf{w}, b, \\xi_i \), retrouver les conditions d'optimalité du problème dual des SVM. (3 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>Les conditions de stationnarité sont :</p>\n<ul>\n<li><p>Dérivée par rapport à \( \\mathbf{w} \) :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\nabla_{\\mathbf{w}} L = \\mathbf{w} - \\sum_{i=1}^n \\alpha_i y_i \\mathbf{x}_i = 0 \\Rightarrow \\mathbf{w} = \\sum_{i=1}^n \\alpha_i y_i \\mathbf{x}_i $$</div>\n</div></li>\n<li><p>Dérivée par rapport à \( b \) :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\frac{\\partial L}{\\partial b} = - \\sum_{i=1}^n \\alpha_i y_i = 0 \\Rightarrow \\sum_{i=1}^n \\alpha_i y_i = 0 $$</div>\n</div></li>\n<li><p>Dérivée par rapport à \( \\xi_i \) :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\frac{\\partial L}{\\partial \\xi_i} = C - \\alpha_i - \\beta_i = 0 \\Rightarrow \\alpha_i + \\beta_i = C $$</div>\n</div>\n<p>Comme \( \\beta_i \\geq 0 \), on a \( 0 \\leq \\alpha_i \\leq C \).</p></li>\n</ul>\n<p>En substituant \( \\mathbf{w} \) dans le Lagrangien, on obtient le problème dual :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\max_{\\boldsymbol{\\alpha}} \\sum_{i=1}^n \\alpha_i - \\frac{1}{2} \\sum_{i,j=1}^n \\alpha_i \\alpha_j y_i y_j (\\mathbf{x}_i \\cdot \\mathbf{x}_j) \\quad \\text{s.c. } 0 \\leq \\alpha_i \\leq C, \\quad \\sum_{i=1}^n \\alpha_i y_i = 0 $$</div>\n</div>\n</div>"
       },
       {
         "question": "<div><p><strong>2.3</strong> Expliquer comment l'algorithme SMO permet de résoudre efficacement le problème dual des SVM. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>L'algorithme SMO (Sequential Minimal Optimization) résout le problème dual des SVM en le décomposant en une série de sous-problèmes de dimension 2 (deux multiplicateurs \( \\alpha_i \) et \( \\alpha_j \) à la fois).</p>\n<p><strong>Principe :</strong></p>\n<ul>\n<li><strong>Sélection des multiplicateurs :</strong> À chaque itération, on sélectionne deux multiplicateurs \( \\alpha_i \) et \( \\alpha_j \) qui violent le plus les conditions KKT.</li>\n<li><strong>Résolution analytique :</strong> Le sous-problème à deux variables a une solution analytique, ce qui évite de résoudre un QP général.</li>\n<li><strong>Mise à jour :</strong> On met à jour \( \\alpha_i \) et \( \\alpha_j \) en respectant les contraintes \( 0 \\leq \\alpha \\leq C \) et \( \\sum \\alpha_i y_i = 0 \).</li>\n</ul>\n<p><strong>Avantages :</strong></p>\n<ul>\n<li>Complexité en \( O(n^2) \) dans le pire cas, mais souvent beaucoup plus rapide en pratique.</li>\n<li>Pas besoin de stocker la matrice de Gram entière.</li>\n<li>Facile à implémenter et très efficace pour les SVM avec un grand nombre de données.</li>\n</ul>\n</div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Application à la Régularisation Lasso",
     "points": "7 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>On considère le problème de régression linéaire avec régularisation Lasso :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'>\n<div class='math'>$$ \\min_{\\boldsymbol{\\beta} \\in \\mathbb{R}^p} \\frac{1}{2} \\|\\mathbf{X} \\boldsymbol{\\beta} - \\mathbf{y}\\|_2^2 + \\lambda \\|\\boldsymbol{\\beta}\\|_1 $$</div>\n</div>\n<p>où \( \\mathbf{X} \\in \\mathbb{R}^{n \\times p} \), \( \\mathbf{y} \\in \\mathbb{R}^n \), et \( \\lambda > 0 \) est le paramètre de régularisation.</p>\n</div>",
     "questions": [
       {
         "question": "<div><p><strong>3.1</strong> Montrer que la fonction objectif du Lasso est convexe. Justifier pourquoi l'algorithme de descente de gradient converge vers le minimum global. (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>La fonction \( f(\\boldsymbol{\\beta}) = \\frac{1}{2} \\|\\mathbf{X} \\boldsymbol{\\beta} - \\mathbf{y}\\|_2^2 + \\lambda \\|\\boldsymbol{\\beta}\\|_1 \) est la somme de deux fonctions convexes :</p>\n<ul>\n<li>\( f_1(\\boldsymbol{\\beta}) = \\frac{1}{2} \\|\\mathbf{X} \\boldsymbol{\\beta} - \\mathbf{y}\\|_2^2 \) est convexe car sa matrice hessienne \( \\mathbf{X}^T \\mathbf{X} \) est semi-définie positive.</li>\n<li>\( f_2(\\boldsymbol{\\beta}) = \\lambda \\|\\boldsymbol{\\beta}\\|_1 \) est convexe car la norme \( \\ell_1 \) est une norme (donc convexe).</li>\n</ul>\n<p>La somme de deux fonctions convexes est convexe, donc \( f \) est convexe.</p>\n<p>La descente de gradient converge vers le minimum global car pour une fonction convexe, tout minimum local est un minimum global. De plus, la fonction est coercive (tend vers \( +\\infty \) lorsque \( \\|\\boldsymbol{\\beta}\\| \\to \\infty \)), ce qui garantit l'existence d'un minimum.</p>\n</div>"
       },
       {
         "question": "<div><p><strong>3.2</strong> Écrire la mise à jour de la descente de coordonnées pour ce problème. Expliquer le rôle de l'opérateur de soft-thresholding. (3 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<p>La mise à jour de la descente de coordonnées pour le coefficient \( \\beta_j \) est :</p>\n<div class='math-block' style='background: #f0f4f8; padding: 10px; border-radius: 8px;'>\n<div class='math'>$$ \\beta_j^{\\text{new}} = S_{\\lambda} \\left( \\frac{1}{n} \\sum_{i=1}^n x_{ij} \\left( y_i - \\sum_{k \\neq j} x_{ik} \\beta_k \\right) \\right) $$</div>\n</div>\n<p>où \( S_{\\lambda}(z) = \\text{sign}(z) \\max(|z| - \\lambda, 0) \) est l'opérateur de soft-thresholding.</p>\n<p><strong>Rôle de l'opérateur de soft-thresholding :</strong></p>\n<ul>\n<li>Il est la solution du problème proximal de la norme \( \\ell_1 \).</li>\n<li>Il permet de rendre certains coefficients exactement nuls, ce qui assure la parcimonie de la solution.</li>\n<li>La valeur \( \\lambda \) contrôle le seuil : plus \( \\lambda \) est grand, plus la solution est parcimonieuse.</li>\n</ul>\n</div>"
       },
       {
         "question": "<div><p><strong>3.3</strong> Comparer les avantages et les inconvénients du Lasso par rapport à la régression Ridge (régularisation \( \\ell_2 \)). (2 pts)</p></div>",
         "reponse": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'>\n<table style='width: 100%; border-collapse: collapse;'>\n<thead>\n<tr style='background: #e0e0e0;'><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Critère</th><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Lasso (L1)</th><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Ridge (L2)</th></tr>\n</thead>\n<tbody>\n<tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Parcimonie</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>Oui, produit des coefficients nuls</td><td style='padding: 8px; border: 1px solid #ddd;'>Non, coefficients réduits mais non nuls</td></tr>\n<tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Sélection de variables</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>Automatique</td><td style='padding: 8px; border: 1px solid #ddd;'>Non</td></tr>\n<tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Stabilité</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>Moins stable avec variables corrélées</td><td style='padding: 8px; border: 1px solid #ddd;'>Plus stable avec variables corrélées</td></tr>\n<tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Solution unique</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>Pas toujours unique si n < p</td><td style='padding: 8px; border: 1px solid #ddd;'>Toujours unique</td></tr>\n<tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>Interprétabilité</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>Élevée (modèle parcimonieux)</td><td style='padding: 8px; border: 1px solid #ddd;'>Moins élevée</td></tr>\n</tbody>\n</table>\n</div>"
       }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
