<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Innovation et Entrepreneuriat - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse d'Échec et Leçons Apprises",
      "points": "5 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'><p><strong>DataHealth</strong> était une startup camerounaise qui proposait une plateforme de télémédecine et de gestion des dossiers médicaux électroniques. Après 24 mois d'activité, la startup a échoué.</p><p>Voici les données clés du projet :</p><ul><li>Modèle de prédiction des besoins en consultations avec une précision de 82%</li><li>30 cliniques partenaires</li><li>Chiffre d'affaires : 1,5 million FCFA par mois</li><li>Coût d'acquisition client : 300 000 FCFA par clinique</li><li>Équipe : 4 data scientists, 3 développeurs, 2 commerciaux, 1 chef de projet</li><li>Dépenses mensuelles : 10 millions FCFA</li><li>Levée de fonds initiale : 80 millions FCFA (business angels)</li></ul></div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> <strong>Identifier</strong> les causes principales de l'échec de DataHealth. Justifier chaque cause à partir des données fournies.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #ef4444;'><ul><li><strong>Cause 1 - Déséquilibre financier majeur :</strong> Burn rate de 8,5 millions FCFA/mois (10 millions de dépenses - 1,5 million de revenus). Autonomie de seulement 9,4 mois avec 80 millions FCFA.</li><li><strong>Cause 2 - CAC trop élevé :</strong> 300 000 FCFA par clinique pour un revenu moyen de 50 000 FCFA/mois par clinique.</li><li><strong>Cause 3 - Équipe trop grande :</strong> 10 personnes pour 30 cliniques est excessif. Le coût moyen par personne est de 1 million FCFA/mois.</li><li><strong>Cause 4 - Croissance trop lente :</strong> 30 cliniques en 24 mois = seulement 1,25 nouvelle clinique par mois.</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> <strong>Analyser</strong> les leçons que les fondateurs de DataHealth auraient dû tirer plus tôt. Quelles décisions auraient pu sauver la startup ?</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #f59e0b;'><ul><li><strong>Leçon 1 - Valider le modèle économique avant la croissance :</strong> Tester la viabilité du modèle (CAC vs LTV) avec un petit nombre de cliniques.</li><li><strong>Leçon 2 - Atteindre la rentabilité avant de scaler :</strong> Se concentrer sur 5-10 cliniques rentables avant d'étendre.</li><li><strong>Leçon 3 - Itérer sur le produit :</strong> 82% de précision est bon, mais il faut s'assurer que les cliniques l'utilisent réellement.</li><li><strong>Leçon 4 - Surveiller les indicateurs clés :</strong> CAC, LTV, burn rate, churn rate, et agir rapidement si les indicateurs se dégradent.</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> <strong>Proposer</strong> un plan de redressement pour DataHealth si elle avait encore 6 mois de trésorerie. Quelles actions auraient été prioritaires ?</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #10b981;'><p><strong>Plan de redressement (6 mois) :</strong></p><ul><li><strong>Mois 1-2 :</strong> Audit des 30 cliniques (identifier les plus rentables), réduction de l'équipe à 5 personnes, renégociation des coûts</li><li><strong>Mois 3-4 :</strong> Recentrage sur les 10 cliniques les plus prometteuses, amélioration du produit, réduction du CAC</li><li><strong>Mois 5-6 :</strong> Si rentabilité atteinte : scaling avec modèle validé. Sinon : pivot vers une licence API</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Scalabilité et Internationalisation",
      "points": "5 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'><p><strong>DataPay</strong> est une startup camerounaise de paiement mobile pour les commerçants. Actuellement, elle compte <strong>2 000 commerçants</strong> actifs au Cameroun.</p><p>L'objectif est d'atteindre <strong>50 000 commerçants</strong> dans 5 pays d'Afrique de l'Ouest et Centrale d'ici 3 ans.</p></div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> <strong>Analyser</strong> les défis de scalabilité pour DataPay. Proposer une architecture technique scalable.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #3b82f6;'><p><strong>Défis :</strong></p><ul><li>Gestion de 500 000+ transactions/jour</li><li>Sécurité et protection des données</li><li>Disponibilité 24/7</li></ul><p><strong>Architecture scalable :</strong></p><ul><li><strong>Backend :</strong> Architecture microservices (paiements, inventaire, analytics, authentification)</li><li><strong>Base de données :</strong> Sharding par pays</li><li><strong>Cache :</strong> Redis pour les données fréquemment consultées</li><li><strong>Cloud :</strong> AWS ou Azure avec auto-scaling</li><li><strong>Monitoring :</strong> Logs, métriques, alertes</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> <strong>Élaborer</strong> une stratégie d'internationalisation pour DataPay. Classer les pays cibles par ordre de priorité.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #f59e0b;'><p><strong>Phase 1 (6 mois) - Côte d'Ivoire :</strong> Forte utilisation du mobile money, proximité culturelle, marché de taille moyenne</p><p><strong>Phase 2 (12 mois) - Sénégal :</strong> Économie en croissance, cadre réglementaire favorable</p><p><strong>Phase 3 (18 mois) - Nigeria :</strong> Plus grand marché, forte concurrence, adaptation en anglais requise</p><p><strong>Phase 4 (24-36 mois) - Bénin, Togo :</strong> Marchés en émergence, choix stratégique pour la couverture régionale</p></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> <strong>Évaluer</strong> les risques financiers de cette expansion. Proposer des solutions pour gérer la trésorerie.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #10b981;'><p><strong>Risques :</strong></p><ul><li>Besoin de trésorerie pour financer la croissance</li><li>Augmentation des coûts (équipes, marketing, infrastructure)</li><li>Variations des taux de change</li></ul><p><strong>Solutions :</strong></p><ul><li>Levée de fonds série A pour financer l'expansion</li><li>Optimisation des coûts (cloud pay-as-you-go)</li><li>Modèle de tarification adapté à chaque pays</li><li>Prévision financière rigoureuse et suivi mensuel</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse d'Innovation dans les GAFAM",
      "points": "5 pts",
      "enonce": "<div style='background: #1e293b; border-radius: 12px; padding: 16px; color: #e2e8f0;'><p>Les GAFAM (Google, Amazon, Microsoft, Apple, Facebook) sont des leaders mondiaux de l'innovation en Data Science.</p><p>Pour chaque entreprise, identifiez une innovation majeure en Data Science et analysez son impact.</p></div>",
      "questions": [
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>1)</span> <strong>Identifier</strong> une innovation Data Science majeure pour chaque GAFAM et expliquer son impact.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #3b82f6;'><ul><li><strong>Google :</strong> Transformers (BERT, LaMDA) - Révolution du NLP, compréhension du langage naturel</li><li><strong>Amazon :</strong> Systèmes de recommandation (AWS Personalize) - Personnalisation du commerce en ligne</li><li><strong>Microsoft :</strong> Azure AI (OpenAI) - Services IA pour les entreprises, productivité</li><li><strong>Apple :</strong> Core ML - IA sur les appareils, protection de la vie privée</li><li><strong>Meta (Facebook) :</strong> PyTorch - Framework open source, démocratisation de l'IA</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>2)</span> <strong>Analyser</strong> les stratégies d'innovation des GAFAM. Quels sont leurs modèles d'innovation ?</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #f59e0b;'><ul><li><strong>Google :</strong> Innovation radicale (Google Research, X), open source, acquisition de startups</li><li><strong>Amazon :</strong> Innovation incrémentale, customer-centric, AWS comme plateforme d'innovation</li><li><strong>Microsoft :</strong> Innovation via partenariats (OpenAI), cloud comme levier</li><li><strong>Apple :</strong> Innovation centrée sur l'expérience utilisateur, intégration hardware-software</li><li><strong>Meta :</strong> Innovation open source, recherche fondamentale (FAIR), métaverse</li></ul></div>"
        },
        {
          "question": "<div style='background: #2d3748; border-radius: 8px; padding: 12px; color: #e2e8f0;'><span style='font-weight: 600; color: #60a5fa;'>3)</span> <strong>Évaluer</strong> l'impact de ces innovations sur le marché de la Data Science.</div>",
          "reponse": "<div style='background: #0f172a; border-radius: 8px; padding: 12px; color: #e2e8f0; border-left: 4px solid #10b981;'><ul><li><strong>Démocratisation de l'IA :</strong> Frameworks open source, APIs accessibles</li><li><strong>Accélération de la recherche :</strong> Publications, modèles pré-entraînés</li><li><strong>Nouveaux business models :</strong> IA-as-a-Service, cloud computing</li><li><strong>Concurrence :</strong> Guerre des talents, acquisition de startups</li><li><strong>Défis :</strong> Éthique, régulation, concentration du marché</li></ul></div>"
        }
      ]
    },
    {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
