<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

                processEscapes: true

            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Innovation et Entrepreneuriat - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Questions de Cours",
      "points": "6 pts",
      "enonce": "<p>Répondez aux questions suivantes en vous appuyant sur les notions vues en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> En vous appuyant sur Joseph Schumpeter, expliquez ce qui distingue fondamentalement un entrepreneur d'un simple gestionnaire. (1 pt)</p>",
          "reponse": "<p>Pour Schumpeter, l'entrepreneur se distingue par sa capacité à <strong>innover</strong> en introduisant de nouvelles combinaisons (nouveaux produits, méthodes, marchés). Il est l'agent du \"changement créatif\" et casse les équilibres économiques existants, alors que le gestionnaire se concentre sur l'optimisation des processus existants dans un cadre stable [citation:2].</p>"
        },
        {
          "question": "<p><strong>2)</strong> Distinguez les notions d'\"esprit d'entreprendre\" et de \"culture entrepreneuriale\". (1 pt)</p>",
          "reponse": "<p>L'<strong>esprit d'entreprendre</strong> est une force intérieure, une motivation personnelle et un état d'esprit qui pousse un individu à créer, innover et prendre des risques. La <strong>culture entrepreneuriale</strong> est un ensemble de valeurs, de normes et de comportements partagés au sein d'une société qui favorisent et soutiennent la création d'entreprises. L'une est individuelle, l'autre est collective [citation:2].</p>"
        },
        {
          "question": "<p><strong>3)</strong> Le gouvernement encourage l'entrepreneuriat principalement pour une raison. Laquelle ? (0.5 pt)</p>",
          "reponse": "<p>Le gouvernement encourage l'entrepreneuriat principalement car il contribue à <strong>augmenter la puissance économique</strong> des citoyens et du pays en créant des emplois et de la richesse [citation:2].</p>"
        },
        {
          "question": "<p><strong>4)</strong> Citez deux défis majeurs auxquels les entrepreneurs camerounais sont confrontés. (1 pt)</p>",
          "reponse": "<p>Deux défis majeurs pour les entrepreneurs au Cameroun sont :</p><ul><li><strong>L'accès inadéquat au financement</strong>, qui freine le démarrage et la croissance des entreprises.</li><li><strong>La corruption</strong>, un obstacle important à l'expansion des affaires [citation:2].</li></ul>"
        },
        {
          "question": "<p><strong>5)</strong> Qu'est-ce qu'une \"start-up scalable\" et en quoi se distingue-t-elle d'une petite entreprise traditionnelle ? (1 pt)</p>",
          "reponse": "<p>Une <strong>start-up scalable</strong> est une entreprise conçue pour une croissance rapide et exponentielle, visant un marché vaste, souvent mondial, grâce à un modèle d'affaires reproductible. Elle se distingue d'une petite entreprise traditionnelle, qui reste souvent locale et dont la croissance est linéaire et proportionnelle aux ressources investies [citation:2].</p>"
        },
        {
          "question": "<p><strong>6)</strong> Donnez la définition d'un \"entrepreneur drone\". (0.5 pt)</p>",
          "reponse": "<p>Un <strong>entrepreneur drone</strong> est un entrepreneur qui utilise des méthodes de production traditionnelles et qui est résistant au changement [citation:2].</p>"
        },
        {
          "question": "<p><strong>7)</strong> Quelle est la principale source de revenus pour un entrepreneur, en tant qu'individu ? (0.5 pt)</p>",
          "reponse": "<p>La principale source de revenus pour un entrepreneur est la <strong>création de son propre revenu</strong>, de ses bénéfices, à travers son activité [citation:2].</p>"
        },
        {
          "question": "<p><strong>8)</strong> Quelle est la vision d'un entrepreneur qui crée une \"scalable start-up\" ? (0.5 pt)</p>",
          "reponse": "<p>La vision d'un entrepreneur de \"scalable start-up\" est de <strong>changer le monde</strong> en résolvant un problème à grande échelle, en partant d'une petite structure mais avec une ambition mondiale [citation:2].</p>"
        }
      ]
    },
    {
      "titre": "Analyse d'Écosystème",
      "points": "4 pts",
      "enonce": "<p>L'écosystème entrepreneurial camerounais est dynamique mais confronté à des défis structurels. Lisez le texte suivant et répondez aux questions.</p><p><em>\"Selon le rapport de la Banque Mondiale, le Cameroun se classe 167ème sur 190 pays pour la facilité de faire des affaires. Les entrepreneurs se heurtent à des obstacles majeurs : l'accès au crédit, la lourdeur administrative, les coupures d'électricité et la corruption. Malgré ces défis, des start-ups comme 'Kiro'o Games' (jeux vidéo) ou 'Nkami' (services mobiles) montrent la voie.\"</em></p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Identifiez et expliquez brièvement deux obstacles structurels mentionnés dans le texte qui freinent l'entrepreneuriat au Cameroun. (1 pt)</p>",
          "reponse": "<p>Deux obstacles structurels sont :</p><ul><li><strong>L'accès au crédit</strong> : les entrepreneurs ont du mal à obtenir des financements pour lancer ou développer leur activité.</li><li><strong>La corruption</strong> : elle rend les processus administratifs incertains et peut décourager l'investissement.</li></ul>"
        },
        {
          "question": "<p><strong>2)</strong> Pourquoi l'écosystème camerounais est-il qualifié de \"dynamique\" malgré ses défis ? (1 pt)</p>",
          "reponse": "<p>Il est qualifié de <strong>dynamique</strong> car des start-ups innovantes comme 'Kiro'o Games' ou 'Nkami' émergent et montrent la voie, prouvant que des entrepreneurs créatifs trouvent des solutions et créent de la valeur malgré les difficultés.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Selon vous, quel rôle peuvent jouer les data scientists dans cet écosystème pour résoudre les problèmes mentionnés ? (2 pts)</p>",
          "reponse": "<p>Les data scientists peuvent jouer un rôle clé en utilisant les données pour :</p><ul><li><strong>Optimiser l'accès au crédit</strong> : en développant des modèles de scoring alternatifs pour évaluer la solvabilité des entrepreneurs n'ayant pas d'historique bancaire traditionnel.</li><li><strong>Lutter contre la corruption</strong> : en créant des outils d'analyse de données pour détecter les anomalies dans les marchés publics ou les processus administratifs.</li><li><strong>Améliorer les infrastructures</strong> : en prévoyant les coupures d'électricité ou en optimisant la logistique pour les entreprises.</li></ul>"
        }
      ]
    },
    {
      "titre": "Le Prototype et le MVP",
      "points": "5 pts",
      "enonce": "<p>Vous êtes un data scientist camerounais et vous souhaitez lancer une start-up. Vous avez identifié un problème : les petits agriculteurs de la région de l'Ouest manquent d'accès aux prix des marchés, ce qui les rend vulnérables face aux intermédiaires.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Décrivez un prototype de votre solution. En quoi est-ce un prototype et non un produit fini ? (1.5 pts)</p>",
          "reponse": "<p>Mon prototype pourrait être une <strong>maquette d'application mobile</strong> ou un <strong>schéma fonctionnel</strong> illustrant comment l'utilisateur pourrait accéder aux prix des marchés. Il ne serait pas fonctionnel ; il servirait uniquement à visualiser l'interface et le concept. C'est un prototype car il est conçu pour démontrer le concept et tester la faisabilité, pas pour être utilisé en production.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Quel serait votre MVP (Minimum Viable Product) ? Justifiez votre choix en précisant les fonctionnalités minimales. (2 pts)</p>",

        },
        {
          "question": "<p><strong>3)</strong> Vous testez votre MVP avec 50 agriculteurs. Citez deux indicateurs clés (KPIs) que vous suivriez et expliquez pourquoi ils sont importants. (1.5 pts)</p>",

        }

    {
      "titre": "Le Financement du Projet",

          "question": "<p><strong>1)</strong> Votre projet se situe entre l'amorçage (seed) et la série A. Quelles sources de financement sont les plus adaptées à ce stade au Cameroun ? (1.5 pts)</p>",

        }
      ]

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
