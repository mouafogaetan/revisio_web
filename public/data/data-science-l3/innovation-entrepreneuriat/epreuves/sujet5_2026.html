<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Innovation et Entrepreneuriat - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Stratégies d'Innovation des GAFAM",
      "points": "6 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p><strong>Contexte :</strong> Les GAFAM (Google, Amazon, Facebook/Meta, Apple, Microsoft) sont des leaders mondiaux de l'innovation en Data Science. Leurs stratégies d'innovation sont souvent étudiées comme modèles pour les startups et les entreprises.</p><p>Dans le cadre de votre projet de fin d'études, vous analysez les stratégies d'innovation de ces entreprises pour en tirer des leçons applicables au contexte camerounais.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> (2 pts) <strong>Identifier</strong> et <strong>décrire</strong> la stratégie d'innovation de Google concernant TensorFlow, son framework open source de Machine Learning. (Verbe : <em>Identifier, Décrire</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Stratégie identifiée :</strong> Innovation ouverte (open innovation) et stratégie de plateforme.</p><p><strong>Description :</strong> Google a développé TensorFlow et l'a rendu open source. Cette stratégie permet :</p><ul><li>D'attirer la communauté des data scientists et des développeurs.</li><li>De bénéficier des contributions de la communauté pour améliorer le framework.</li><li>D'établir TensorFlow comme un standard de l'industrie.</li><li>De former une main-d'œuvre qualifiée qui connaît les outils Google.</li><li>De renforcer l'écosystème Google Cloud et ses services Data Science.</li></ul></div>"
        },
        {
          "question": "<p><strong>1.2</strong> (2 pts) <strong>Analyser</strong> la stratégie d'innovation d'Amazon concernant ses algorithmes de recommandation et son service AWS SageMaker. (Verbe : <em>Analyser</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Stratégie d'Amazon :</strong></p><ul><li><strong>Algorithmes de recommandation</strong> : Stratégie de différenciation centrée sur le client. Les algorithmes personnalisent l'expérience d'achat, augmentant les ventes et la fidélité des clients.</li><li><strong>AWS SageMaker</strong> : Stratégie de plateforme et de services cloud. Amazon propose une suite complète d'outils Data Science, attirant les entreprises qui souhaitent développer leurs propres modèles sans gérer l'infrastructure.</li><li><strong>Synergie</strong> : Les données d'e-commerce alimentent les modèles, qui sont ensuite déployés via SageMaker, créant un écosystème intégré.</li></ul></div>"
        },
        {
          "question": "<p><strong>1.3</strong> (2 pts) <strong>Comparer</strong> les approches d'Apple et de Meta (Facebook) en matière d'innovation en Data Science. (Verbe : <em>Comparer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Comparaison :</strong></p><ul><li><strong>Apple</strong> : Stratégie de différenciation par la confidentialité (privacy) et l'intégration verticale. Apple développe ses propres puces neurales pour l'IA sur appareil (on-device AI), protégeant les données des utilisateurs. C'est une approche <em>Privacy by Design</em>.</li><li><strong>Meta (Facebook)</strong> : Stratégie d'innovation disruptive et de diversification. Meta investit massivement dans le métavers et la réalité augmentée. C'est un pari sur l'avenir des interactions sociales, avec une approche plus risquée mais potentiellement très rémunératrice.</li><li><strong>Contraste</strong> : Apple mise sur la protection des données comme avantage concurrentiel, tandis que Meta mise sur la création de nouveaux marchés (métavers).</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Prototype et MVP",
      "points": "7 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p><strong>Contexte :</strong> Vous êtes le fondateur d'une startup camerounaise qui souhaite développer une solution Data Science pour aider les agriculteurs à optimiser leurs rendements. Vous avez identifié un besoin : les agriculteurs manquent d'outils pour anticiper les maladies des cultures et les conditions météorologiques défavorables.</p><p>Vous décidez de suivre la méthode Lean Startup pour développer votre produit.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> (2 pts) <strong>Définir</strong> ce qu'est un MVP (Minimum Viable Product) et <strong>proposer</strong> un MVP pour votre solution Data Science agricole. (Verbe : <em>Définir, Proposer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Définition d'un MVP :</strong> Un MVP est la version la plus simple d'un produit qui permet de tester une hypothèse avec un minimum d'effort et de ressources. Il permet de recueillir des retours utilisateurs pour itérer.</p><p><strong>Proposition de MVP :</strong></p><ul><li><strong>Hypothèse :</strong> Les agriculteurs sont prêts à utiliser un outil simple qui leur donne des prévisions météo et des alertes sur les maladies.</li><li><strong>MVP :</strong> Une application mobile simple qui :<br>- Affiche les prévisions météo à 3 jours (données d'API publique).<br>- Envoie des alertes SMS sur les conditions propices aux maladies courantes.<br>- Permet aux agriculteurs de signaler des problèmes (collecte de données).</li><li><strong>Objectif du MVP :</strong> Tester l'engagement des agriculteurs et collecter des données sur leurs besoins réels.</li></ul></div>"
        },
        {
          "question": "<p><strong>2.2</strong> (2 pts) <strong>Expliquer</strong> le cycle 'Build-Measure-Learn' du Lean Startup et <strong>l'appliquer</strong> à votre MVP agricole. (Verbe : <em>Expliquer, Appliquer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Cycle Build-Measure-Learn :</strong></p><ul><li><strong>Build (Construire)</strong> : Développer le MVP avec les fonctionnalités minimales.</li><li><strong>Measure (Mesurer)</strong> : Mesurer l'utilisation du MVP (nombre d'installations, taux d'engagement, retours des agriculteurs).</li><li><strong>Learn (Apprendre)</strong> : Analyser les données pour valider ou invalider les hypothèses.</li></ul><p><strong>Application au MVP agricole :</strong></p><ul><li><strong>Build</strong> : Développer l'application mobile et l'API météo en 2 semaines.</li><li><strong>Measure</strong> : Suivre les indicateurs : nombre de téléchargements, nombre d'alertes consultées, feedback des utilisateurs.</li><li><strong>Learn</strong> : Découvrir si les agriculteurs utilisent l'outil, s'ils trouvent les alertes utiles, et quelles fonctionnalités ils souhaitent.</li></ul></div>"
        },
        {
          "question": "<p><strong>2.3</strong> (3 pts) <strong>Analyser</strong> les avantages et les limites de l'utilisation d'un prototype et d'un MVP pour développer votre solution agricole. (Verbe : <em>Analyser</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Avantages :</strong></p><ul><li><strong>Réduction des risques</strong> : Tester les hypothèses avant d'investir massivement.</li><li><strong>Apprentissage rapide</strong> : Recueillir des retours utilisateurs réels.</li><li><strong>Économie de ressources</strong> : Éviter de développer des fonctionnalités inutiles.</li><li><strong>Attractivité pour les investisseurs</strong> : Démontrer un produit fonctionnel et un intérêt du marché.</li></ul><p><strong>Limites :</strong></p><ul><li><strong>Simplification excessive</strong> : Le MVP peut ne pas capturer toute la complexité du problème.</li><li><strong>Risque de mauvaise interprétation</strong> : Les utilisateurs peuvent ne pas comprendre qu'il s'agit d'une version test.</li><li><strong>Biais des premiers utilisateurs</strong> : Les premiers utilisateurs peuvent ne pas être représentatifs du marché.</li><li><strong>Dépendance aux données</strong> : Le succès du MVP dépend de la qualité des données disponibles.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Leçons des Échecs en Data Science",
      "points": "7 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;'><p><strong>Contexte :</strong> De nombreux projets Data Science échouent. Comprendre les causes d'échec est essentiel pour éviter les pièges et réussir ses projets. Les GAFAM eux-mêmes ont connu des échecs notables.</p><p>Cet exercice vous invite à analyser des cas d'échec et à en tirer des leçons pour vos projets.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> (2 pts) <strong>Identifier</strong> au moins trois causes d'échec fréquentes dans les projets Data Science. (Verbe : <em>Identifier</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Causes d'échec fréquentes :</strong></p><ul><li><strong>Problèmes de données</strong> : Données de qualité insuffisante, données manquantes, biais dans les données.</li><li><strong>Mauvaise définition du problème</strong> : Le problème métier n'est pas clairement défini ou n'est pas aligné avec les objectifs Data Science.</li><li><strong>Manque de compétences</strong> : L'équipe ne maîtrise pas les compétences nécessaires (data engineering, ML Ops, interprétation).</li><li><strong>Problèmes d'organisation</strong> : Manque de support de la direction, mauvaise communication entre les équipes métier et techniques.</li><li><strong>Échec de l'adoption</strong> : Les utilisateurs n'utilisent pas le produit final (manque de formation, interface peu intuitive).</li></ul></div>"
        },
        {
          "question": "<p><strong>3.2</strong> (2 pts) Amazon a abandonné un outil de recrutement basé sur l'IA car il présentait des biais de genre. <strong>Analyser</strong> cet échec et <strong>expliquer</strong> les leçons à en tirer. (Verbe : <em>Analyser, Expliquer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Analyse de l'échec :</strong></p><ul><li><strong>Cause</strong> : L'algorithme a été entraîné sur des données historiques où les hommes étaient majoritaires dans les postes techniques. Il a appris et amplifié ce biais.</li><li><strong>Conséquence</strong> : L'algorithme pénalisait les CV féminins, ce qui a conduit à l'abandon du projet après des critiques.</li></ul><p><strong>Leçons à tirer :</strong></p><ul><li><strong>Auditer les données</strong> : Vérifier les biais dans les données d'entraînement avant de développer l'algorithme.</li><li><strong>Tester les algorithmes</strong> : Évaluer les performances sur différents sous-groupes (genre, origine, etc.).</li><li><strong>Diversifier les équipes</strong> : Impliquer des personnes de différents profils pour détecter les biais potentiels.</li><li><strong>Transparence</strong> : Documenter les limites du modèle et les biais identifiés.</li><li><strong>Éthique by Design</strong> : Intégrer l'éthique dès la conception du projet.</li></ul></div>"
        },
        {
          "question": "<p><strong>3.3</strong> (3 pts) <strong>Élaborer</strong> un plan pour éviter ces échecs dans votre startup Data Science agricole. (Verbe : <em>Élaborer</em>)</p>",
          "reponse": "<div style='background: #e8f5e9; padding: 12px; border-radius: 8px;'><p><strong>Plan pour éviter les échecs :</strong></p><ol><li><strong>Définir clairement le problème</strong> : Travailler avec les agriculteurs pour comprendre leurs besoins réels.</li><li><strong>Assurer la qualité des données</strong> : Mettre en place des processus de collecte, de nettoyage et de validation des données.</li><li><strong>Commencer avec un MVP</strong> : Tester les hypothèses avec un minimum de ressources.</li><li><strong>Constituer une équipe pluridisciplinaire</strong> : Inclure des data scientists, des agronomes et des représentants des agriculteurs.</li><li><strong>Intégrer l'éthique dès le départ</strong> : <ul><li>S'assurer de la représentativité des données (tous les types d'exploitations).</li><li>Protéger les données des agriculteurs (confidentialité).</li><li>Impliquer les utilisateurs dans la conception.</li></ul></li><li><strong>Planifier le déploiement et l'adoption</strong> : Former les agriculteurs, simplifier l'interface.</li><li><strong>Mettre en place un monitoring</strong> : Surveiller les performances du modèle et détecter les dérives.</li></ol></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
