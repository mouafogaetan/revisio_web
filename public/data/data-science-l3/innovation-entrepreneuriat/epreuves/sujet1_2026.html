<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Innovation et Entrepreneuriat - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Compréhension des Fondements de l'Innovation",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #000000; padding: 10px;'> <p>Cet exercice vise à évaluer votre compréhension des concepts fondamentaux abordés dans les trois premières leçons.</p> <ul style='margin-top: 10px;'> <li><strong>1.1 Définitions</strong> (3 pts)</li> <li><strong>1.2 Cycle de l'Innovation</strong> (2 pts)</li> <li><strong>1.3 Rôle de la Data Science</strong> (1 pt)</li> </ul> </div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>1.1 Définitions (3 pts)</strong><br> <span style='font-weight: bold;'>a) </span>Définissez les trois types d'innovation suivants : <span style='font-style: italic;'>incrémentale</span>, <span style='font-style: italic;'>disruptive</span> et <span style='font-style: italic;'>radicale</span>. (2 pts)<br> <span style='font-weight: bold;'>b) </span>Expliquez clairement la différence entre <span style='font-style: italic;'>invention</span> et <span style='font-style: italic;'>innovation</span> en donnant un exemple concret issu du domaine de la Data Science. (1 pt)</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>Éléments de réponse :</strong><br> <strong>a) </strong> • <strong>Innovation incrémentale :</strong> Amélioration continue et progressive d'un produit, service ou processus existant. Elle vise à optimiser les performances ou l'efficacité sans changer fondamentalement la technologie. Par exemple, l'ajout de nouvelles fonctionnalités à un logiciel.<br> • <strong>Innovation disruptive :</strong> Introduit une nouvelle technologie ou un nouveau modèle d'affaires qui, initialement moins performant sur certains critères, finit par remplacer les solutions établies en répondant à des besoins non satisfaits ou en simplifiant l'accès. Par exemple, les services de cloud computing ont perturbé le marché des serveurs physiques.<br> • <strong>Innovation radicale :</strong> Repose sur une rupture technologique majeure qui crée un nouveau marché ou transforme radicalement un secteur existant. Elle est souvent le résultat de découvertes scientifiques fondamentales. Par exemple, l'invention du transistor.<br> <strong>b) </strong>L'<strong>invention</strong> est la découverte d'un nouveau concept, d'une nouvelle méthode ou d'un nouvel objet. Elle représente une avancée technique ou scientifique. L'<strong>innovation</strong>, quant à elle, est la mise en œuvre réussie de cette invention dans un contexte économique ou social, créant ainsi de la valeur. Un exemple en Data Science : l'invention d'un nouvel algorithme de deep learning n'est pas encore une innovation. Elle le devient lorsqu'elle est intégrée dans une application commerciale, comme un système de reconnaissance faciale pour la sécurité ou un outil de diagnostic médical.</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>1.2 Cycle de l'Innovation (2 pts)</strong><br> <span style='font-weight: bold;'>a) </span>Décrivez les trois phases principales du cycle de l'innovation. (1 pt)<br> <span style='font-weight: bold;'>b) </span>Expliquez ce qu'est le processus de <span style='font-style: italic;'>diffusion de l'innovation</span> et son importance dans le cycle. (1 pt)</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>Éléments de réponse :</strong><br> <strong>a) </strong>Le cycle de l'innovation comprend trois grandes phases :<br> 1. <strong>Idéation (ou génération d'idées) :</strong> Phase de créativité où l'on explore et identifie des opportunités, des besoins ou des problèmes à résoudre.<br> 2. <strong>Développement :</strong> Phase où l'idée est transformée en un concept tangible, puis en un prototype ou un produit minimum viable (MVP). Elle inclut la recherche, le design, les tests et les itérations.<br> 3. <strong>Mise sur le marché (ou commercialisation) :</strong> Phase où le produit ou service est lancé sur le marché. Cela implique la production à grande échelle, la distribution, le marketing et la vente.<br> <strong>b) </strong>La <strong>diffusion de l'innovation</strong> est le processus par lequel une innovation se propage dans une population ou un marché au fil du temps. Elle est cruciale car une innovation, aussi géniale soit-elle, n'a d'impact que si elle est adoptée par ses utilisateurs cibles. La diffusion dépend de facteurs comme les avantages perçus de l'innovation, sa compatibilité avec les habitudes existantes, sa complexité, la possibilité de la tester, et l'influence des réseaux sociaux et des leaders d'opinion [citation:1].</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>1.3 Rôle de la Data Science (1 pt)</strong><br> Identifiez et expliquez brièvement <span style='font-weight: bold;'>deux</span> rôles clés que la Data Science joue dans le processus d'innovation.</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>Éléments de réponse :</strong><br> 1. <strong>Identification des opportunités :</strong> La Data Science permet d'analyser de grandes quantités de données (marché, clients, tendances) pour identifier des besoins non satisfaits, des problèmes émergents ou des niches de marché, alimentant ainsi la phase d'idéation.<br> 2. <strong>Amélioration et optimisation :</strong> La Data Science est au cœur de l'innovation <strong>incrémentale</strong> en permettant d'optimiser en continu les produits et services. L'analyse des données d'usage, des tests A/B, et la modélisation prédictive aident à prendre des décisions éclairées pour améliorer l'efficacité, la performance et l'expérience utilisateur.</div>"
        }
      ]
    },
    {
      "titre": "De l'Idée au Projet : Application de la Méthode Lean Startup",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #000000; padding: 10px;'> <p>Le <span style='font-weight: bold;'>Lean Startup</span> est une méthodologie qui permet de valider une idée de manière itérative et rapide.</p> <ul style='margin-top: 10px;'> <li><strong>2.1 Cycle Build-Measure-Learn</strong> (2 pts)</li> <li><strong>2.2 Concept de MVP</strong> (2 pts)</li> </ul> </div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>2.1 Cycle Build-Measure-Learn (2 pts)</strong><br> <span style='font-weight: bold;'>a) </span>Schématisez et expliquez le cycle <span style='font-style: italic;'>Build-Measure-Learn</span> de la méthode Lean Startup. (1 pt)<br> <span style='font-weight: bold;'>b) </span>Pourquoi ce cycle est-il considéré comme fondamental pour la validation d'une idée de projet ? (1 pt)</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>Éléments de réponse :</strong><br> <strong>a) </strong>Le cycle <strong>Build-Measure-Learn</strong> est le moteur de la méthode Lean Startup :<br> 1. <strong>Build (Construire) :</strong> Transformer l'idée en un produit minimum viable (MVP) pour tester une hypothèse.<br> 2. <strong>Measure (Mesurer) :</strong> Recueillir des données sur l'utilisation du MVP par les premiers utilisateurs (taux d'adoption, feedback, métriques clés).<br> 3. <strong>Learn (Apprendre) :</strong> Analyser les données pour valider ou infirmer l'hypothèse de départ. L'apprentissage permet de décider de <em>pivoter</em> (changer de stratégie) ou de <em>persévérer</em> (continuer à améliorer le produit).<br> <strong>b) </strong>Ce cycle est fondamental car il permet de valider une idée <span style='font-weight: bold;'>avant</span> d'investir massivement dans le développement d'un produit fini. Il transforme l'incertitude en apprentissage, réduisant le risque d'échec et assurant que le produit répond effectivement à un besoin réel du marché. L'objectif est d'apprendre le plus vite possible ce que les clients veulent vraiment.</div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>2.2 Concept de MVP (2 pts)</strong><br> <span style='font-weight: bold;'>a) </span>Définissez ce qu'est un <span style='font-style: italic;'>Minimum Viable Product (MVP)</span>. (1 pt)<br> <span style='font-weight: bold;'>b) </span>Donnez un exemple concret de MVP dans le domaine de la Data Science. (1 pt)</div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #000000;'><strong>Éléments de réponse :</strong><br> <strong>a) </strong>Un <strong>Minimum Viable Product (MVP)</strong> est la version la plus simple d'un produit qui peut être créée pour recueillir le maximum d'apprentissages sur les clients avec le moins d'effort. Il ne s'agit pas d'un produit final ou parfait, mais d'un outil de test et d'expérimentation.<br> <strong>b) </strong>Exemple en Data Science : <span style='font-style: italic;'>Imaginez une startup qui veut créer une application de recommandation de films basée sur le machine learning. Au lieu de développer un algorithme complexe et une application mobile complète, le MVP pourrait être un simple formulaire en ligne (ou même une simulation manuelle) où l'utilisateur saisit ses films préférés. En arrière-plan, l'équipe pourrait utiliser des règles simples (comme 'si l'utilisateur aime X, alors recommander Y') ou même faire manuellement les recommandations pour les premiers utilisateurs. L'objectif est de tester l'intérêt des utilisateurs pour le concept et de collecter des données sur leurs préférences avant de construire l'algorithme complet.</span></div>"
        }
      ]
    },
    {
      "titre": "Étude de Marché et Entrepreneuriat Data-Driven",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #000000; padding: 10px;'> <p>L'étude de marché est une étape cruciale pour valider la pertinence d'un projet. L'entrepreneuriat <span style='font-style: italic;'>Data-Driven</span> utilise les données pour éclairer ces décisions.</p> <ul style='margin-top: 10px;'> <li><strong>3.1 Analyse de l'Étude de Marché</strong> (2 pts)</li> <li><strong>3.2 Entrepreneuriat Data-Driven</strong> (2 pts)</li> <li><strong>3.3 Cas Pratique</strong> (1 pt)</li> </ul> </div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
