<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Innovation et Entrepreneuriat - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Analyse de l'Innovation en Data Science (8 pts)",
     "points": "8 pts",
     "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #000;'>Cet exercice porte sur les concepts fondamentaux de l'innovation, le cycle de l'innovation, et leurs applications dans le domaine de la Data Science.</div>",
     "questions": [
       {
         "question": "<div style='font-weight: bold;'>1) Définissez l'innovation et distinguez-la de l'invention. (2 pts)</div><div style='margin-top: 5px;'>Expliquez brièvement les trois types d'innovation (incrémentale, disruptive, radicale) et donnez un exemple pour chacun.</div>",
         "reponse": "<div style='background-color: #e6f2ff; padding: 10px; border-radius: 5px; color: #000;'>L'<strong>invention</strong> est la création d'une idée ou d'un produit nouveau, tandis que l'<strong>innovation</strong> est la mise en œuvre réussie de cette idée pour créer de la valeur. Les trois types d'innovation sont :<br>- <strong>Innovation incrémentale</strong> : Amélioration continue d'un produit existant (ex : mise à jour d'un algorithme).<br>- <strong>Innovation disruptive</strong> : Introduit une nouvelle technologie qui bouleverse le marché (ex : l'IA générative).<br>- <strong>Innovation radicale</strong> : Introduit un concept totalement nouveau (ex : la révolution des voitures autonomes).</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>2) Présentez le cycle de l'innovation et son processus de diffusion. (2 pts)</div><div style='margin-top: 5px;'>Décrivez les étapes du cycle de l'innovation, de l'idéation à la mise sur le marché, ainsi que la théorie de la diffusion.</div>",
         "reponse": "<div style='background-color: #e6f2ff; padding: 10px; border-radius: 5px; color: #000;'>Le <strong>cycle de l'innovation</strong> se compose de trois étapes principales : l'<strong>idéation</strong> (génération d'idées), le <strong>développement</strong> (prototypage et tests) et la <strong>mise sur le marché</strong> (lancement et commercialisation). La <strong>théorie de la diffusion</strong> décrit comment une innovation se propage à travers une population, passant par les innovateurs, les premiers adoptants, la majorité précoce, la majorité tardive et les retardataires.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>3) Rôle de la Data Science dans l'innovation. (2 pts)</div><div style='margin-top: 5px;'>Identifiez et expliquez trois innovations majeures apportées par la Data Science, ainsi que leur impact sur les business models.</div>",
         "reponse": "<div style='background-color: #e6f2ff; padding: 10px; border-radius: 5px; color: #000;'>Trois innovations majeures sont :<br>1. <strong>Nouveaux modèles prédictifs</strong> : Amélioration de la prise de décision.<br>2. <strong>Applications en temps réel</strong> : Permettent des services personnalisés.<br>3. <strong>Automatisation des processus</strong> : Réduction des coûts et optimisation des ressources.<br>Ces innovations transforment les <strong>business models</strong> en créant des modèles <strong>Data-Driven</strong>, où les données deviennent un actif central pour la création de valeur.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>4) Étude de cas : Innovation en Data Science. (2 pts)</div><div style='margin-top: 5px;'>Choisissez une entreprise innovante dans le domaine de la Data Science (ex: Datadog, Snowflake) et décrivez son modèle d'innovation, son marché cible et son positionnement.</div>",
         "reponse": "<div style='background-color: #e6f2ff; padding: 10px; border-radius: 5px; color: #000;'>Prenons l'exemple de <strong>Snowflake</strong>. <br>- <strong>Modèle d'innovation</strong> : Plateforme de données en tant que service (SaaS) permettant le stockage et l'analyse de données à grande échelle.<br>- <strong>Marché cible</strong> : Entreprises de toutes tailles nécessitant des solutions de big data.<br>- <strong>Positionnement</strong> : Simplicité d'utilisation et architecture multi-cloud.</div>"
       }
     ]
   },
   {
     "titre": "De l'Idée au Projet : Lean Startup et Business Plan (8 pts)",
     "points": "8 pts",
     "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #000;'>Cet exercice vous permet d'appliquer les concepts de l'idéation, de la validation et du Lean Startup.</div>",
     "questions": [
       {
         "question": "<div style='font-weight: bold;'>1) Techniques de génération d'idées. (2 pts)</div><div style='margin-top: 5px;'>Présentez la technique du Design Thinking et expliquez comment elle peut être utilisée pour identifier des opportunités en Data Science.</div>",
         "reponse": "<div style='background-color: #e6ffe6; padding: 10px; border-radius: 5px; color: #000;'>Le <strong>Design Thinking</strong> est une approche centrée sur l'utilisateur qui comprend cinq étapes : Empathie, Définition, Idéation, Prototypage et Test. En Data Science, cette méthode permet de comprendre les besoins profonds des utilisateurs et de générer des solutions innovantes basées sur les données.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>2) Méthode Lean Startup et MVP. (2 pts)</div><div style='margin-top: 5px;'>Expliquez le cycle 'Build-Measure-Learn' et le concept de Minimum Viable Product (MVP).</div>",
         "reponse": "<div style='background-color: #e6ffe6; padding: 10px; border-radius: 5px; color: #000;'>La <strong>méthode Lean Startup</strong> se base sur le cycle <strong>'Build-Measure-Learn'</strong> :<br>- <strong>Build</strong> : Créer un prototype ou un MVP.<br>- <strong>Measure</strong> : Tester le produit auprès des utilisateurs.<br>- <strong>Learn</strong> : Analyser les retours et itérer.<br>Le <strong>MVP</strong> est une version minimale du produit qui permet de valider rapidement l'idée sans investir de lourds développements.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>3) Validation d'idée et Étude de Marché. (2 pts)</div><div style='margin-top: 5px;'>Vous avez une idée de startup Data Science. Décrivez comment vous allez réaliser une étude de marché (concurrence, clients, tendances) pour valider votre idée.</div>",
         "reponse": "<div style='background-color: #e6ffe6; padding: 10px; border-radius: 5px; color: #000;'>Pour valider une idée, une <strong>étude de marché</strong> doit comprendre :<br>- <strong>Analyse de la concurrence</strong> : Identifier les acteurs existants et leurs forces.<br>- <strong>Analyse des clients</strong> : Définir les persona et comprendre leurs besoins.<br>- <strong>Tendances</strong> : Analyser les évolutions technologiques et réglementaires.<br>Cela permet de définir un <strong>positionnement</strong> clair et un <strong>marché cible</strong> pertinent.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>4) Application pratique. (2 pts)</div><div style='margin-top: 5px;'>Proposez un business plan simplifié pour une startup Data Science en identifiant son modèle économique (SaaS, Freemium, etc.) et ses sources de financement potentielles.</div>",
         "reponse": "<div style='background-color: #e6ffe6; padding: 10px; border-radius: 5px; color: #000;'>Un <strong>business plan</strong> simplifié pourrait inclure :<br>- <strong>Modèle économique</strong> : SaaS pour une plateforme d'analyse de données.<br>- <strong>Sources de financement</strong> : Bootstrapping dans un premier temps, puis levée de fonds auprès de Business Angels ou de Venture Capital (VC).<br>- Le plan doit détailler la proposition de valeur, la stratégie go-to-market et les prévisions financières.</div>"
       }
     ]
   },
   {
     "titre": "Analyse d'Études de Cas et Entrepreneuriat (4 pts)",
     "points": "4 pts",
     "enonce": "<div style='background-color: #fff0f5; padding: 15px; border-radius: 8px; color: #000;'>Cet exercice vous invite à analyser des cas réels d'innovation et d'entrepreneuriat en Data Science.</div>",
     "questions": [
       {
         "question": "<div style='font-weight: bold;'>1) Stratégie d'Innovation des GAFAM. (2 pts)</div><div style='margin-top: 5px;'>Analysez la stratégie d'innovation de Google dans le domaine de la Data Science. Quels sont les facteurs de succès de son modèle data-driven ?</div>",
         "reponse": "<div style='background-color: #ffe6f0; padding: 10px; border-radius: 5px; color: #000;'>Google, en tant que GAFAM, innove en utilisant des <strong>modèles de Deep Learning</strong> et des données massives. Les <strong>facteurs de succès</strong> incluent une culture de l'innovation, la capacité à collecter et analyser des données à grande échelle, et un modèle économique basé sur la publicité et le cloud.</div>"
       },
       {
         "question": "<div style='font-weight: bold;'>2) Échecs en Data Science. (2 pts)</div><div style='margin-top: 5px;'>Identifiez un échec de projet Data Science dans une grande entreprise et les leçons qui peuvent en être tirées.</div>",
         "reponse": "<div style='background-color: #ffe6f0; padding: 10px; border-radius: 5px; color: #000;'>Un exemple est l'échec de l'IA de diagnostic médical de certains hôpitaux, souvent dû à des données biaisées ou mal étiquetées. Les <strong>leçons apprises</strong> sont : l'importance de la <strong>qualité des données</strong>, la nécessité d'une <strong>validation rigoureuse</strong> et la prise en compte des <strong>aspects éthiques</strong>.</div>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
