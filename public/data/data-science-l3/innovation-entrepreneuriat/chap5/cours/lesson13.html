<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Transfert de Technologie",
    "contenu": "<div style='display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; padding: 20px; border-radius: 16px;'> <h1 style='font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; color: #38bdf8;'>🔬 Transfert de Technologie</h1> <h2 style='font-size: 1.5rem; font-weight: 300; margin-bottom: 20px; color: #cbd5e1;'>De la Recherche à l'Industrie</h2> <div style='background: #334155; padding: 15px 25px; border-radius: 40px; font-size: 1.1rem; color: #facc15; border: 1px solid #475569;'> Chapitre 5 - De la Recherche à l'Industrie </div> <p style='margin-top: 30px; font-size: 1.1rem; color: #94a3b8; max-width: 400px;'>\"La recherche ne vaut que si elle est transférée et utilisée pour résoudre des problèmes concrets.\"</p> </div>",
    "texteParle": "Bonjour à toutes et à tous. Aujourd'hui, nous abordons un sujet crucial dans le parcours de l'innovation : le transfert de technologie. C'est le processus par lequel les connaissances et les découvertes issues de la recherche académique sont transformées en solutions concrètes utilisées par l'industrie et la société. En Data Science, ce transfert est particulièrement important car nos modèles et algorithmes doivent sortir des laboratoires pour avoir un impact réel sur le terrain.",
    "note": "Introduction générale de la leçon sur le transfert de technologie."
  },
  {
    "titre": "Objectifs de la Leçon",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0; border-left: 6px solid #3b82f6;'> <p style='font-weight: 600; color: #60a5fa; margin-bottom: 12px;'>🎯 À la fin de ce cours, vous saurez :</p> <ul style='list-style: none; padding: 0; margin: 0;'> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #3b82f6; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>1</span> <div><strong>Comprendre le transfert de technologie</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>De la recherche académique à l'industrie</span></div> </li> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #f59e0b; color: black; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>2</span> <div><strong>Identifier les obstacles</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Les freins au transfert et comment les surmonter</span></div> </li> <li style='background: #2d3748; margin-bottom: 0; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #10b981; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>3</span> <div><strong>Maîtriser les notions clés</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Transfert de technologie, obstacles, solutions</span></div> </li> </ul> </div>",
    "texteParle": "Les objectifs de cette leçon sont triples. D'abord, comprendre ce qu'est le transfert de technologie, ce processus qui permet de faire passer les connaissances des laboratoires de recherche vers le monde industriel. Ensuite, identifier les obstacles qui peuvent entraver ce transfert, comme les différences de culture, les problèmes de propriété intellectuelle, ou le manque de ressources. Enfin, maîtriser les notions clés pour réussir ce transfert, notamment les solutions et les bonnes pratiques à mettre en œuvre.",
    "note": "Rappel des objectifs pédagogiques de la leçon."
  },
  {
    "titre": "Définition du Transfert de Technologie",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #3b82f6;'> <h4 style='margin: 0; color: #60a5fa;'>📘 Définition</h4> <p style='margin: 8px 0 0 0;'>Le <strong>transfert de technologie</strong> est l'ensemble des processus visant à transmettre des connaissances, des compétences, des procédés ou des technologies issues de la recherche (académique ou industrielle) vers des applications commerciales ou industrielles concrètes.</p> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔑 Points clés</h4> <ul style='list-style: none; padding: 0;'> <li style='padding: 6px 0;'>✅ <strong>Transfert de connaissances</strong> : savoir-faire, expertise</li> <li style='padding: 6px 0;'>✅ <strong>Transfert de technologies</strong> : brevets, logiciels, prototypes</li> <li style='padding: 6px 0;'>✅ <strong>Commercialisation</strong> : création de valeur économique</li> <li style='padding: 6px 0;'>✅ <strong>Impact social</strong> : résolution de problèmes concrets</li> </ul> </div> </div>",
    "texteParle": "Le transfert de technologie est un processus fondamental qui permet de faire le pont entre la recherche et le monde réel. Il s'agit de transmettre les connaissances, les compétences et les technologies issues des laboratoires de recherche vers des applications industrielles et commerciales. Cela peut prendre plusieurs formes : le transfert de connaissances, le transfert de brevets ou de logiciels, la commercialisation de produits, ou encore l'impact social. L'objectif est de créer de la valeur économique et de résoudre des problèmes concrets.",
    "note": "Définition et concepts clés du transfert de technologie."
  },
  {
    "titre": "Pourquoi le Transfert est Important",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Le transfert de technologie est essentiel pour :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #3b82f6;'> <span style='font-size: 1.8rem;'>💰</span> <div><strong>Créer de la valeur économique</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Transformer la recherche en produits et services commercialisables</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #10b981;'> <span style='font-size: 1.8rem;'>🌍</span> <div><strong>Résoudre des problèmes sociétaux</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Apporter des solutions concrètes aux défis du monde réel</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #f59e0b;'> <span style='font-size: 1.8rem;'>🎓</span> <div><strong>Valoriser la recherche</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Donner un sens et une utilité aux travaux académiques</span></div> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 6px solid #ec4899;'> <span style='font-size: 1.8rem;'>🇨🇲</span> <div><strong>Renforcer la compétitivité nationale</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Pour les pays comme le Cameroun, c'est un levier de développement</span></div> </div> </div> </div>",
    "texteParle": "Le transfert de technologie est essentiel pour plusieurs raisons. D'abord, il permet de créer de la valeur économique en transformant la recherche en produits et services commercialisables. Ensuite, il permet de résoudre des problèmes sociétaux concrets, comme l'amélioration des soins de santé ou de l'agriculture. Il valorise également la recherche en donnant un sens et une utilité aux travaux académiques. Enfin, pour des pays comme le Cameroun, c'est un levier important pour renforcer la compétitivité nationale et le développement économique.",
    "note": "Les bénéfices du transfert de technologie."
  },
  {
    "titre": "Le Parcours du Transfert",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Les étapes du transfert de technologie :</p> <div style='display: flex; flex-direction: column; gap: 8px;'> <div style='background: #2d3748; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #3b82f6;'> <span style='font-weight: bold; min-width: 30px;'>🔬</span> <div><span style='font-weight: 600;'>1. Recherche fondamentale</span> - Découverte de nouvelles connaissances</div> </div> <div style='background: #2d3748; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #f59e0b;'> <span style='font-weight: bold; min-width: 30px;'>⚗️</span> <div><span style='font-weight: 600;'>2. Recherche appliquée</span> - Développement d'applications concrètes</div> </div> <div style='background: #2d3748; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #10b981;'> <span style='font-weight: bold; min-width: 30px;'>📦</span> <div><span style='font-weight: 600;'>3. Prototypage</span> - Création d'un prototype fonctionnel</div> </div> <div style='background: #2d3748; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #ec4899;'> <span style='font-weight: bold; min-width: 30px;'>🏭</span> <div><span style='font-weight: 600;'>4. Industrialisation</span> - Passage à l'échelle industrielle</div> </div> <div style='background: #2d3748; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #8b5cf6;'> <span style='font-weight: bold; min-width: 30px;'>📈</span> <div><span style='font-weight: 600;'>5. Commercialisation</span> - Mise sur le marché et diffusion</div> </div> </div> </div>",
    "texteParle": "Le transfert de technologie suit un parcours qui commence par la recherche fondamentale, où l'on découvre de nouvelles connaissances. Ensuite, la recherche appliquée permet de développer des applications concrètes de ces découvertes. Puis vient l'étape du prototypage, où l'on crée un premier modèle fonctionnel de la solution. Enfin, l'industrialisation permet de passer à l'échelle, et la commercialisation permet de mettre le produit sur le marché. C'est un cheminement long qui nécessite de la persévérance et des compétences variées.",
    "note": "Les différentes étapes du processus de transfert de technologie."
  },
  {
    "titre": "Les Acteurs du Transfert",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Le transfert de technologie implique plusieurs acteurs :</p> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px;'> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 2rem;'>🏛️</span> <span style='font-weight: 600; color: #60a5fa;'>Universités</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Production de connaissances</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 2rem;'>🏢</span> <span style='font-weight: 600; color: #fbbf24;'>Entreprises</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Application industrielle</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 2rem;'>🌐</span> <span style='font-weight: 600; color: #34d399;'>Centres de recherche</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Transfert et développement</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='display: block; font-size: 2rem;'>💰</span> <span style='font-weight: 600; color: #f472b6;'>Investisseurs</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Financement et accompagnement</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #475569; grid-column: span 2;'> <span style='display: block; font-size: 2rem;'>🏛️</span> <span style='font-weight: 600; color: #8b5cf6;'>Gouvernement</span> <span style='display: block; font-size: 0.85rem; color: #94a3b8;'>Politiques publiques, financement, cadre réglementaire</span> </div> </div> </div>",
    "texteParle": "Le transfert de technologie implique plusieurs acteurs. Les universités et les centres de recherche produisent les connaissances. Les entreprises les appliquent pour créer des produits et services. Les investisseurs fournissent les ressources financières nécessaires. Et le gouvernement joue un rôle crucial en mettant en place des politiques publiques, des incitations fiscales et un cadre réglementaire favorable. Au Cameroun, la collaboration entre ces acteurs est essentielle pour réussir le transfert de technologie et stimuler l'innovation.",
    "note": "Présentation des acteurs impliqués dans le transfert de technologie."
  },
  {
    "titre": "Les Obstacles au Transfert",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Principaux obstacles au transfert :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ef4444;'> <span style='font-weight: 600; color: #f87171;'>🌉 Barrières culturelles</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Différence entre le monde académique et industriel (priorités, temporalités)</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ef4444;'> <span style='font-weight: 600; color: #f87171;'>🔒 Propriété intellectuelle</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Défis de protection, partage et exploitation des résultats</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ef4444;'> <span style='font-weight: 600; color: #f87171;'>💰 Manque de ressources</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Financement insuffisant, infrastructures inadéquates</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ef4444;'> <span style='font-weight: 600; color: #f87171;'>🔗 Absence de ponts</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Manque d'intermédiaires pour faciliter le transfert</span> </div> </div> </div>",
    "texteParle": "Le transfert de technologie rencontre plusieurs obstacles. D'abord, des barrières culturelles entre le monde académique et industriel : les chercheurs et les industriels n'ont pas les mêmes priorités ni les mêmes temporalités. Ensuite, les questions de propriété intellectuelle : comment protéger et partager les résultats de la recherche ? Il y a aussi le manque de ressources : financement insuffisant, infrastructures inadéquates. Enfin, l'absence d'intermédiaires pour faciliter le transfert. Ces obstacles sont particulièrement présents dans les pays en développement comme le Cameroun.",
    "note": "Les principaux freins au transfert de technologie."
  },
  {
    "titre": "Solutions pour un Transfert Réussi",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Solutions pour surmonter les obstacles :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>🤝 Partenariats</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Collaborations public-privé, conventions de recherche</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>🏢 Structures de transfert</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Bureaux de transfert, incubateurs, SATT (Sociétés d'Accélération du Transfert de Technologies)</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>💼 Formation</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Développer les compétences en entrepreneuriat pour les chercheurs</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>💰 Financement</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Fonds d'amorçage, subventions, investissement public</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>⚖️ Cadre réglementaire</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Lois favorables à l'innovation, simplification des démarches</span> </div> </div> </div>",
    "texteParle": "Pour réussir le transfert de technologie, plusieurs solutions existent. Les partenariats entre le public et le privé sont essentiels, avec des conventions de recherche qui favorisent les collaborations. La création de structures de transfert comme les bureaux de transfert ou les incubateurs permet de faciliter le passage de la recherche à l'industrie. La formation des chercheurs à l'entrepreneuriat est également importante. Un financement adapté, des fonds d'amorçage et des subventions peuvent soutenir les projets. Enfin, un cadre réglementaire favorable et des lois qui encouragent l'innovation sont nécessaires.",
    "note": "Solutions pour faciliter le transfert de technologie."
  },
  {
    "titre": "Transfert en Data Science",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #3b82f6;'> <h4 style='margin: 0; color: #60a5fa;'>📊 Spécificités du transfert en Data Science</h4> <ul style='margin: 8px 0 0 0; padding-left: 20px;'> <li>Nécessité de <strong>données réelles</strong> pour valider les modèles</li> <li>Enjeux de <strong>confidentialité</strong> et de protection des données</li> <li>Besoin de <strong>compétences hybrides</strong> (Data Science + métier)</li> <li>Évolution rapide des <strong>technologies et algorithmes</strong></li> </ul> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #facc15;'>🔧 Exemples concrets</h4> <ul style='list-style: none; padding: 0;'> <li style='padding: 6px 0;'>✅ Modèle de recherche → Produit SaaS</li> <li style='padding: 6px 0;'>✅ Algorithme académique → API commerciale</li> <li style='padding: 6px 0;'>✅ Thèse doctorale → Startup DeepTech</li> </ul> </div> </div>",
    "texteParle": "Le transfert de technologie en Data Science présente des spécificités. Il nécessite des données réelles pour valider les modèles, ce qui peut être difficile à obtenir. Il y a aussi des enjeux de confidentialité et de protection des données, surtout dans des secteurs comme la santé ou la finance. Le transfert exige des compétences hybrides : il faut à la fois des data scientists et des experts du métier. Les technologies et les algorithmes évoluent rapidement, ce qui rend le transfert plus complexe. Des exemples concrets incluent la transformation d'un modèle de recherche en produit SaaS, ou d'une thèse doctorale en startup DeepTech.",
    "note": "Spécificités du transfert de technologie en Data Science."
  },
  {
    "titre": "Cas Pratique : Transfert au Cameroun",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0; color: #fbbf24;'>🌍 Contexte camerounais</h4> <p style='margin: 8px 0;'>Au Cameroun, le transfert de technologie est en plein développement avec des initiatives comme :</p> <ul style='padding-left: 20px;'> <li><strong>ACTIF</strong> - Agence Camerounaise de Transformation et d'Innovation Financière</li> <li><strong>Programmes d'incubation</strong> (Orange Fab, ActivSpaces, etc.)</li> <li><strong>Partenariats université-entreprise</strong> (ex: Université de Yaoundé I avec les entreprises locales)</li> <li><strong>Projets de recherche appliquée</strong> (AgriTech, HealthTech, FinTech)</li> </ul> </div> <div style='background: #0f172a; padding: 15px; border-radius: 12px; margin-top: 12px;'> <h4 style='margin: 0 0 10px 0; color: #34d399;'>💡 Opportunités</h4> <ul style='padding-left: 20px;'> <li>Solutions adaptées aux besoins locaux</li> <li>Valorisation de la recherche nationale</li> <li>Création d'emplois et développement économique</li> </ul> </div> </div>",
    "texteParle": "Au Cameroun, le transfert de technologie est en plein développement. Des initiatives comme l'ACTIF, l'Agence Camerounaise de Transformation et d'Innovation Financière, soutiennent l'innovation. Des programmes d'incubation comme Orange Fab ou ActivSpaces accompagnent les startups. Les partenariats entre les universités et les entreprises se multiplient, par exemple entre l'Université de Yaoundé I et les entreprises locales. Des projets de recherche appliquée émergent dans des secteurs comme l'AgriTech, la HealthTech ou la FinTech. Ces initiatives créent des opportunités pour valoriser la recherche nationale et stimuler le développement économique.",
    "note": "Application du transfert de technologie dans le contexte camerounais."
  },
  {
    "titre": "Rôle du Data Scientist",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Le Data Scientist joue un rôle clé dans le transfert :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>🔬 Traducteur</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Transformer la recherche en applications pratiques</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>🌉 Pont</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Faire le lien entre les chercheurs et les industriels</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>🛠️ Artisan</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Développer les prototypes et les démonstrateurs</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>📢 Communiquant</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Expliquer la valeur de la solution aux non-spécialistes</span> </div> </div> </div>",
    "texteParle": "Le Data Scientist joue un rôle clé dans le transfert de technologie. Il est d'abord un traducteur, capable de transformer une recherche complexe en applications pratiques. Il est aussi un pont, qui fait le lien entre le monde des chercheurs et celui des industriels. Il est un artisan, qui développe des prototypes et des démonstrateurs pour montrer la faisabilité de la solution. Enfin, il est un communicateur, qui sait expliquer la valeur de la solution à des non-spécialistes, comme les investisseurs ou les utilisateurs finaux. C'est un métier polyvalent au cœur de l'innovation.",
    "note": "Le rôle du Data Scientist dans le transfert de technologie."
  },
  {
    "titre": "À retenir",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <ul style='list-style: none; padding: 0;'> <li style='background: #2d3748; margin-bottom: 12px; padding: 15px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; border-left: 6px solid #3b82f6;'> <span style='font-size: 1.5rem; min-width: 30px;'>1️⃣</span> <div><strong>Le transfert de technologie est un processus</strong><br><span style='color: #94a3b8;'>De la recherche fondamentale à la commercialisation</span></div> </li> <li style='background: #2d3748; margin-bottom: 12px; padding: 15px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; border-left: 6px solid #f59e0b;'> <span style='font-size: 1.5rem; min-width: 30px;'>2️⃣</span> <div><strong>Il nécessite la collaboration</strong><br><span style='color: #94;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
