<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>

        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation B : Data Science pour la Santé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondamentaux de la Data Science en Santé et Éthique (6 pts)",
      "points": "6 pts",
      "enonce": "<p><strong>Partie 1 : Questions de Cours (3 pts)</strong></p><p>Répondez de manière concise et précise aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> (1 pt) Définissez les 4 défis majeurs liés aux données de santé (Volume, Variété, Vélocité, Véracité). Donnez un exemple pour chaque défi.</p>",
          "reponse": "<p><strong>Les 4 V :</strong></p><ul><li><strong>Volume :</strong> La quantité colossale de données générées (ex. : un hôpital produit des téraoctets de données par an).</li><li><strong>Variété :</strong> La diversité des formats de données (ex. : textes cliniques, images DICOM, données génomiques, signaux physiologiques).</li><li><strong>Vélocité :</strong> La rapidité de génération et de mise à jour des données (ex. : données en temps réel des moniteurs de soins intensifs).</li><li><strong>Véracité :</strong> L'incertitude et la fiabilité des données (ex. : données manquantes, erreurs de saisie dans les dossiers patients).</li></ul>"
        },
        {
          "question": "<p><strong>1.2</strong> (1 pt) Expliquez le rôle et les principales exigences du Règlement Général sur la Protection des Données (RGPD) dans le contexte de la santé.</p>",
          "reponse": "<p>Le <strong>RGPD</strong> est un règlement européen qui vise à protéger les données personnelles des citoyens. Dans le domaine de la santé, il impose des exigences strictes :</p><ul><li><strong>Consentement explicite :</strong> Le patient doit donner son accord clair pour la collecte et l'utilisation de ses données.</li><li><strong>Droit à l'oubli :</strong> Le patient peut demander la suppression de ses données.</li><li><strong>Portabilité des données :</strong> Le patient peut récupérer ses données et les transférer à un autre prestataire.</li><li><strong>Responsabilité (Accountability) :</strong> Les organismes doivent démontrer leur conformité et mettre en place des mesures de sécurité.</li></ul>"
        },
        {
          "question": "<p><strong>1.3</strong> (1 pt) Décrivez la structure et le rôle d'un <i>Dossier Médical Électronique (EHR)</i> par rapport à un <i>Dossier de Santé Personnel (PHR)</i>.</p>",
          "reponse": "<p><strong>EHR (Dossier Médical Électronique) :</strong> C'est un dossier géré par les professionnels de santé (médecins, hôpitaux). Il contient l'historique médical du patient, les diagnostics, les prescriptions, les résultats de laboratoire, les imageries, etc. Son rôle est clinique et administratif.<br><strong>PHR (Dossier de Santé Personnel) :</strong> C'est un dossier géré par le patient lui-même. Il permet de centraliser ses informations de santé (symptômes, médicaments, activités) pour un suivi personnel et un meilleur échange avec les soignants.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Interopérabilité et Normes en Santé (5 pts)",
      "points": "5 pts",
      "enonce": "<p>L'interopérabilité est cruciale pour échanger des données de santé.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> (2 pts) Définissez les normes <strong>HL7</strong> et <strong>FHIR</strong>. Expliquez en quoi FHIR constitue une avancée significative par rapport à HL7 v2 pour la Data Science.</p>",
          "reponse": "<p><strong>HL7 (Health Level Seven) :</strong> Ensemble de normes internationales pour l'échange, l'intégration, le partage et la récupération d'informations électroniques en santé. La v2 est un standard largement utilisé, basé sur des messages structurés.</p><p><strong>FHIR (Fast Healthcare Interoperability Resources) :</strong> Norme récente qui combine les atouts de HL7 v2/v3 avec les technologies web modernes (API RESTful, JSON, XML).</p><p><strong>Avancée de FHIR :</strong> FHIR facilite l'accès aux données grâce à des APIs standardisées, ce qui est un atout majeur pour la Data Science. Il permet d'extraire et d'intégrer plus facilement des données hétérogènes provenant de différentes sources pour des analyses avancées.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> (2 pts) Parmi les normes suivantes, identifiez celles qui sont des systèmes de classification médicale, et celles qui sont des standards de messagerie : <i>CIM-10, FHIR, CCAM, HL7 v2.</i></p>",
          "reponse": "<ul><li><strong>Classification :</strong> <strong>CIM-10</strong> (Classification Internationale des Maladies) et <strong>CCAM</strong> (Classification Commune des Actes Médicaux).</li><li><strong>Standards de messagerie :</strong> <strong>HL7 v2</strong> et <strong>FHIR</strong> (bien que FHIR soit plus large qu'un simple standard de messagerie).</li></ul>"
        },
        {
          "question": "<p><strong>2.3</strong> (1 pt) Expliquez l'importance du codage (comme la CIM-10) pour l'analyse de données cliniques à grande échelle.</p>",
          "reponse": "<p>Le codage standardisé comme la <strong>CIM-10</strong> est essentiel car :</p><ul><li>Il <strong>uniformise</strong> les diagnostics et procédures entre différents professionnels et établissements.</li><li>Il permet de <strong>regrouper et d'agréger</strong> les données pour analyser des tendances, calculer des prévalences, ou évaluer des parcours de soins.</li><li>Il est indispensable pour la recherche, le pilotage des politiques de santé publique, et le <strong>Data Mining</strong>.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de Cas en Imagerie Médicale (6 pts)",
      "points": "6 pts",
      "enonce": "<div class='case-study'><p style='background-color: #f8f9fa; padding: 12px; border-radius: 8px; color: black;'><strong>Mise en situation :</strong> Un hôpital dispose d'un grand nombre d'images radiographiques thoraciques non annotées. Vous êtes chargé de développer une solution pour détecter automatiquement les anomalies pulmonaires (comme la pneumonie) en utilisant des techniques de <i>Deep Learning</i>.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> (2 pts) Décrivez les étapes clés du prétraitement (préprocessing) pour ce type de données, en évoquant le format DICOM.</p>",
          "reponse": "<p>Les étapes de prétraitement sont :</p><ol><li><strong>Extraction et conversion :</strong> Lire les fichiers <strong>DICOM</strong> (contenant les images et métadonnées). Convertir les pixels en un format numérique utilisable.</li><li><strong>Normalisation des intensités :</strong> Ajuster les niveaux de gris pour garantir une certaine homogénéité, essentiel pour que le modèle apprenne des motifs et non des variations d'éclairage.</li><li><strong>Rééchantillonnage :</strong> Redimensionner toutes les images à une taille standard (ex. : 224x224 pixels) pour les réseaux de neurones.</li><li><strong>Augmentation des données :</strong> Créer des variations synthétiques (rotations, retournements, zooms) pour améliorer la robustesse du modèle.</li></ol>"
        },
        {
          "question": "<p><strong>3.2</strong> (2 pts) Quel type de réseau de neurones (CNN) utiliseriez-vous pour ce problème de classification ? Justifiez votre choix en mentionnant un modèle classique.</p>",
          "reponse": "<p>J'utiliserais un <strong>Réseau de Neurones Convolutif (CNN)</strong>, qui est l'architecture de référence pour l'analyse d'images.</p><p>Les CNN sont parfaits car ils :</p><ul><li>Capturent les caractéristiques spatiales (formes, textures) des images.</li><li>Sont efficaces pour la classification d'images.</li><li>Permettent l'utilisation du <strong>Transfert Learning</strong>.</li></ul><p>Un modèle classique comme <strong>ResNet</strong> ou <strong>VGG</strong>, pré-entraîné sur un grand dataset (ImageNet), serait un excellent point de départ pour obtenir de bonnes performances rapidement [citation:4][citation:8].</p>"
        },
        {
          "question": "<p><strong>3.3</strong> (2 pts) Expliquez comment vous évalueriez les performances de votre modèle de classification de pathologies pulmonaires. Nommez les métriques que vous utiliseriez.</p>",
          "reponse": "<p>Pour évaluer un modèle de classification binaire (ex. : Normal / Pneumonie), j'utiliserais les métriques suivantes :</p><ul><li><strong>Accuracy (Exactitude) :</strong> Proportion de prédictions correctes.</li><li><strong>Précision (Precision) :</strong> Parmi les cas prédits comme \"Pneumonie\", combien le sont réellement. Important pour éviter les faux positifs.</li><li><strong>Rappel (Recall) / Sensibilité :</strong> Parmi les vrais cas de \"Pneumonie\", combien ont été détectés. Crucial en santé pour ne pas manquer de cas (éviter les faux négatifs).</li><li><strong>F1-Score :</strong> La moyenne harmonique de la précision et du rappel, utile pour un équilibre.</li><li><strong>Courbe ROC et AUC :</strong> Pour visualiser les performances du modèle à différents seuils de classification.</li></ul><p>Une validation croisée est également essentielle pour s'assurer de la robustesse des résultats [citation:15].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Questions de Réflexion sur le Système de Santé (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Répondez en 5 à 10 lignes maximum à cette question de réflexion.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> (3 pts) D'après vous, quels sont les obstacles majeurs à une plus large adoption de l'Intelligence Artificielle dans les hôpitaux camerounais ? Proposez une ou deux solutions pour y remédier.</p>",
          "reponse": "<p><strong>Obstacles :</strong></p><ul><li><strong>Infrastructure :</strong> Manque d'équipements (serveurs, connexion internet) et d'électricité fiable.</li><li><strong>Données :</strong> Manque de données structurées et standardisées (EHR), avec des problèmes de qualité et de volume.</li><li><strong>Compétences :</strong> Pénurie de data scientists et d'ingénieurs formés dans ce domaine précis, capables de développer et maintenir ces solutions [citation:10].</li><li><strong>Ressources financières :</strong> Coût élevé des solutions technologiques.</li></ul><p><strong>Solutions :</strong></p><ul><li><strong>Investissement dans la formation :</strong> Renforcer les programmes de formation (comme cette licence) et développer des programmes courts pour former les professionnels de santé aux bases de la Data Science.</li><li><strong>Mise en place d'infrastructures partagées :</strong> Développer des plateformes de santé numérique nationales et collaboratives pour mutualiser les coûts et les données (dans le respect de la vie privée).</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
