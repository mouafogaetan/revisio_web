<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation B : Data Science pour la Santé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2 : Données Cliniques et Dossiers Médicaux Électroniques",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur les EHR et le Codage Médical",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>Cet exercice évalue votre compréhension des concepts fondamentaux des Dossiers Médicaux Électroniques (EHR) et des classifications médicales.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (3 pts)</strong> Définissez ce qu'est un <strong>Dossier Médical Électronique (EHR)</strong> et expliquez en quoi il se distingue d'un simple dossier papier. Citez deux avantages majeurs de l'utilisation des EHR pour le suivi des patients dans un hôpital camerounais.</p>",
          "reponse": "<p>Un <strong>Dossier Médical Électronique (EHR)</strong> est une version numérisée du dossier médical d'un patient. Il contient l'ensemble des informations cliniques, administratives et biologiques le concernant. Contrairement au dossier papier, l'EHR est structuré, facilement consultable, partageable entre professionnels de santé (avec les autorisations adéquates) et permet des analyses de données à grande échelle. <br><strong>Avantages :</strong> (1) Amélioration de la continuité des soins grâce à un accès rapide aux antécédents du patient, même dans des régions reculées. (2) Possibilité de conduire des études épidémiologiques et de santé publique en analysant les données agrégées et anonymisées des patients.</p>"
        },
        {
          "question": "<p><strong>2. (3 pts)</strong> Expliquez brièvement ce qu'est la <strong>Classification Internationale des Maladies (CIM-10)</strong> et donnez un exemple de son utilisation concrète dans un hôpital de district.</p>",
          "reponse": "<p>La <strong>CIM-10</strong> est une classification standardisée, développée par l'OMS, qui attribue des codes alphanumériques à toutes les maladies et problèmes de santé. Elle permet de faciliter le codage, la collecte, le traitement et l'analyse des données de morbidité et de mortalité. <br><strong>Exemple :</strong> Dans un hôpital de district, lorsqu'un patient est diagnostiqué avec un paludisme, le médecin utilise le code B50.9. Ce code est ensuite utilisé pour la facturation, les statistiques et le suivi épidémiologique local.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mise en Pratique et Cas Concrets",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>Vous êtes data scientist pour un centre de santé intégré (CSI) au Cameroun. Vous avez pour mission de structurer les données des patients pour faciliter le suivi des <strong>maladies chroniques</strong> comme le diabète et l'hypertension.</p><p>Le médecin-chef vous fournit un extrait des dossiers patients <em>en format papier</em>. Vous devez proposer une méthode pour numériser et organiser ces données.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Proposez une <strong>structure de base pour une base de données</strong> qui permettra de stocker les informations cliniques de ces patients (identifiant, données démographiques, consultations, diagnostics, traitements). Schématisez-la avec les tables principales et les liens entre elles.</p>",
          "reponse": "<p>Une structure possible comprendrait : <br>- <strong>Table PATIENT</strong> : id_patient, nom, prenom, date_naissance, sexe, lieu_residence. <br>- <strong>Table CONSULTATION</strong> : id_consultation, id_patient, date_consultation, diagnostique_principal, poids, tension_arterielle (si hypertension). <br>- <strong>Table TRAITEMENT</strong> : id_traitement, id_patient, id_consultation, nom_medicament, dosage, date_debut, date_fin. <br>- <strong>Table DIAGNOSTIC</strong> : id_diagnostic, id_consultation, code_CIM10, description. <br><strong>Liens :</strong> Les tables sont liées par les identifiants (<em>foreign keys</em>). Par exemple, la table CONSULTATION est liée à PATIENT via id_patient.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Décrivez les <strong>étapes de prétraitement</strong> nécessaires avant de pouvoir analyser les données de cette base de données, en mettant l'accent sur les données manquantes et les erreurs de saisie potentielles.</p>",
          "reponse": "<p>Les étapes de prétraitement incluent : <br>1) <strong>Nettoyage</strong> : détection et correction des erreurs de saisie (ex : formats de date, valeurs aberrantes). <br>2) <strong>Gestion des données manquantes</strong> : identification des valeurs vides et décision d'imputation ou de suppression (si le taux de manque est trop élevé). <br>3) <strong>Standardisation</strong> : mise en conformité des unités (ex : grammes vs kilogrammes, cm vs m) et des codages (ex : CIM-10). <br>4) <strong>Anonymisation</strong> : suppression des identifiants directs (nom, prénom) pour la recherche.</p>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> Comment pourriez-vous utiliser ces données pour <strong>identifier les patients à risque de complications</strong> liées à un diabète mal équilibré ? Proposez une approche simple (ex : utiliser une règle de décision, un seuil de glycémie).</p>",
          "reponse": "<p>On peut définir une règle simple : un patient est considéré à risque si sa glycémie à jeun est > 1.26 g/L (7.0 mmol/L) à deux consultations consécutives, ou si la glycémie aléatoire > 2 g/L. Une approche plus avancée consisterait à développer un modèle de régression logistique qui prend en compte l'âge, l'IMC, la tension artérielle, et l'historique des glycémies pour prédire le risque de complications (ex : néphropathie, rétinopathie).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de Cas - Optimisation des Ressources",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p>L'Hôpital Régional de Bafoussam souhaite optimiser la gestion de ses <strong>lits d'hospitalisation</strong> et la planification des rendez-vous de suivi.</p><p>Vous avez accès à des données historiques de 2023 et 2024 : dates d'admission et de sortie, diagnostics, et nombre de lits disponibles par service (Médecine, Chirurgie, Pédiatrie, Maternité).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Quel <strong>indicateur clé de performance (KPI)</strong> proposez-vous pour mesurer l'efficacité de l'occupation des lits ? Calculez-le à partir des données fournies si vous avez le temps de l'hospitalisation moyen.</p>",
          "reponse": "<p>Je propose le <strong>taux d'occupation des lits</strong> = (nombre de lits occupés en moyenne / nombre total de lits) * 100. <br>Si la durée moyenne d'hospitalisation est de 5 jours pour un service, on peut estimer le nombre de lits nécessaires. Un taux d'occupation supérieur à 85% est souvent considéré comme saturé.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Proposez un modèle simple (par exemple, basé sur les séries temporelles) pour <strong>prédire le nombre d'admissions</strong> à venir, en expliquant brièvement comment il pourrait être construit.</p>",
          "reponse": "<p>On peut utiliser un modèle de prévision de séries temporelles, comme <strong>ARIMA</strong> ou <strong>Prophet</strong>. <br>Le modèle serait entraîné sur les données historiques d'admission quotidiennes ou hebdomadaires. Il peut prendre en compte la saisonnalité (ex : plus de paludisme en saison des pluies, plus de grippe en saison froide) et les tendances. <br>L'objectif est d'anticiper les pics d'activité pour mieux répartir les ressources (personnel, lits, médicaments).</p>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> Expliquez comment l'analyse des données pourrait aider à <strong>réduire le temps d'attente</strong> pour une consultation externe, en utilisant l'exemple des rendez-vous de suivi pour les patients chroniques.</p>",
          "reponse": "<p>En analysant les données historiques de rendez-vous, on peut identifier : <br>1) Les jours et créneaux horaires les plus chargés. <br>2) Le taux de non-présentation (<em>no-show</em>) et les motifs. <br>3) La durée moyenne des consultations par type de pathologie. <br>Ces informations permettent d'optimiser la planification : ajuster les plages de rendez-vous, envoyer des rappels (SMS) pour réduire les non-présentations, et allouer plus de temps aux consultations complexes. <br>L'<strong>attribution basée sur les données</strong> peut aider à déterminer l'impact de ces changements sur les temps d'attente.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
