<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation B : Data Science pour la Santé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°3 (Semestre 1)",
  "anneeScolaire": "2026-2027",
  "exercices": [
    {
      "titre": "Exercice 1 : Génomique et Bioinformatique",
      "points": "8 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Un laboratoire de recherche au Cameroun souhaite étudier la diversité génétique d'une population locale. Pour ce faire, il a génotypé 500 individus à l'aide d'une puce à ADN contenant des marqueurs SNP. Vous êtes chargé d'analyser ces données.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (2 pts)</strong> Expliquez ce qu'est un <strong>SNP</strong> (Single Nucleotide Polymorphism) et son importance en génétique des populations.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Un SNP est une variation d'une seule paire de bases dans la séquence d'ADN. C'est le type de variation génétique le plus fréquent chez l'humain. En génétique des populations, les SNPs sont utilisés comme marqueurs pour étudier la diversité génétique, identifier les variations entre populations, et retracer les migrations et les origines des populations.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2 pts)</strong> Décrivez l'étape de <strong>contrôle qualité</strong> pour des données SNP. Quels filtres sont généralement appliqués avant l'analyse ?</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Le contrôle qualité comprend plusieurs étapes :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Filtrage des SNPs :</strong> On élimine les SNPs avec un taux de génotypage faible (par exemple < 95 %) et ceux qui dévient de l'équilibre de Hardy-Weinberg (p-value < 10⁻⁶).</li><li><strong>Filtrage des individus :</strong> On élimine les individus avec un taux de génotypage faible.</li><li><strong>Filtrage des variants rares :</strong> On élimine les SNPs avec une fréquence allélique minoritaire (MAF) très faible (par exemple < 1-5 %).</li></ul>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>3. (2 pts)</strong> Expliquez le principe de l'<strong>analyse en composantes principales (PCA)</strong> appliquée aux données génétiques. Quelle est son utilité ?</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>La PCA est une méthode de réduction de dimensionnalité qui transforme les données (des milliers de SNPs) en quelques composantes principales. En génétique, la PCA permet de :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li>Visualiser la structure des populations : les individus d'une même population se regroupent.</li><li>Détecter des outliers (individus qui ne correspondent pas à la population attendue).</li><li>Corriger les biais de structure de population dans les analyses GWAS.</li></ul>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>4. (2 pts)</strong> Qu'est-ce qu'une <strong>étude d'association génomique (GWAS)</strong> ? Décrivez brièvement le principe et les étapes clés.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Un GWAS est une méthode qui permet d'identifier des variants génétiques (SNPs) associés à un phénotype ou une maladie. Les étapes clés sont :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li><strong>Génotypage :</strong> Obtenir les génotypes pour des milliers de SNPs.</li><li><strong>Analyse statistique :</strong> Tester l'association entre chaque SNP et le phénotype (test de tendance, régression logistique).</li><li><strong>Visualisation :</strong> Manhattan plot pour visualiser les SNPs significatifs.</li><li><strong>Correction :</strong> Ajustement pour tests multiples (Bonferroni, FDR) pour éviter les faux positifs.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Épidémiologie et Modélisation des Maladies",
      "points": "6 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Une épidémie de grippe saisonnière touche une ville de 500 000 habitants. Les autorités sanitaires disposent des données des premiers jours et souhaitent utiliser un modèle SIR pour prédire l'évolution de l'épidémie.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (1.5 pt)</strong> Définissez les trois compartiments du modèle SIR. Expliquez brièvement comment la population évolue entre ces compartiments.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>S (Susceptible) :</strong> Personnes pouvant contracter la maladie.<br><strong>I (Infectieux) :</strong> Personnes infectées et contagieuses.<br><strong>R (Rétabli) :</strong> Personnes guéries et immunisées.</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>La population évolue de S à I (infection) puis de I à R (guérison). On suppose que la population totale est constante (S + I + R = N).</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2 pts)</strong> Le taux de transmission (\\(\\beta\\)) est de 0.4 par jour et le taux de guérison (\\(\\gamma\\)) est de 0.15 par jour. Calculez le nombre de reproduction de base (\\(R_0\\)) et interprétez le résultat.</p>",
          "reponse": "<div class='math-block' style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math' style='font-size: 18px;'>$$ R_0 = \\frac{\\beta}{\\gamma} = \\frac{0.4}{0.15} \\approx 2.67 $$</div></div><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Un \\(R_0 = 2.67\\) signifie qu'en moyenne, chaque personne infectée contamine environ 2.67 nouvelles personnes. Comme \\(R_0 > 1\\), l'épidémie va se propager et s'intensifier sans intervention.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>3. (2.5 pts)</strong> Expliquez l'<strong>intérêt du modèle SEIR</strong> par rapport au modèle SIR, et précisez un contexte où il est plus adapté.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Le modèle SEIR ajoute un compartiment <strong>E (Exposé)</strong> pour les personnes en période d'incubation (infectées mais pas encore contagieuses). Il est plus réaliste pour des maladies comme la COVID-19 ou la grippe où il existe un délai entre l'infection et la contagiosité. Le SEIR permet une meilleure estimation de l'impact des mesures comme la quarantaine des contacts.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Pharmacogénomique et Découverte de Médicaments",
      "points": "6 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Une équipe de recherche en pharmacogénomique souhaite développer un modèle prédictif pour identifier les patients qui répondront bien à un traitement anticancéreux. Le modèle est entraîné sur des données cliniques et génomiques.</p>",
      "questions": [
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>1. (2 pts)</strong> Définissez la <strong>pharmacogénomique</strong> et expliquez comment elle peut améliorer la prise en charge des patients.</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>La pharmacogénomique est l'étude de l'influence des variations génétiques sur la réponse aux médicaments. Elle permet de :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li>Prédire l'efficacité d'un traitement pour un patient.</li><li>Éviter les effets secondaires graves en identifiant les patients à risque.</li><li>Optimiser la dose du médicament.</li><li>Personnaliser les traitements, ce qui améliore les résultats cliniques et réduit les coûts.</li></ul>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>2. (2 pts)</strong> Un modèle de régression logistique est utilisé pour prédire la réponse au traitement (répondeur = 1, non-répondeur = 0). À partir de la matrice de confusion suivante, calculez la <strong>sensibilité</strong> et la <strong>spécificité</strong> du modèle.</p><table style='width: 80%; border-collapse: collapse; font-size: 14px; margin: 10px auto;'><tr style='background-color: #e0e0e0;'><th style='padding: 8px; border: 1px solid #ccc;'></th><th style='padding: 8px; border: 1px solid #ccc;'>Prédit Répondeur</th><th style='padding: 8px; border: 1px solid #ccc;'>Prédit Non-Répondeur</th></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>Réel Répondeur</td><td style='padding: 8px; border: 1px solid #ccc;'>60</td><td style='padding: 8px; border: 1px solid #ccc;'>15</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>Réel Non-Répondeur</td><td style='padding: 8px; border: 1px solid #ccc;'>10</td><td style='padding: 8px; border: 1px solid #ccc;'>75</td></tr></table>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Sensibilité</strong> = \\(\\frac{VP}{VP + FN} = \\frac{60}{60 + 15} = \\frac{60}{75} = 0.80 = 80\\%\\).</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>Spécificité</strong> = \\(\\frac{VN}{VN + FP} = \\frac{75}{75 + 10} = \\frac{75}{85} \\approx 0.882 = 88.2\\%\\).</p><p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>Le modèle est plus spécifique que sensible, il est donc efficace pour exclure les non-répondeurs.</p>"
        },
        {
          "question": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'><strong>3. (2 pts)</strong> Dans le contexte de la découverte de médicaments, quelle est l'importance de la <strong>diversité chimique</strong> dans les données d'entraînement d'un modèle d'apprentissage automatique ?</p>",
          "reponse": "<p style='font-size: 16px; line-height: 1.6; color: #2d3748;'>La diversité chimique est cruciale car elle :</p><ul style='font-size: 16px; line-height: 1.6; color: #2d3748;'><li>Permet au modèle de généraliser à des composés de différentes classes chimiques.</li><li>Réduit les biais (un modèle entraîné sur une famille chimique unique sera moins performant).</li><li>Augmente les chances de découvrir des composés novateurs avec des structures différentes.</li><li>Rend le modèle plus robuste et fiable pour l'exploration de l'espace chimique.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
