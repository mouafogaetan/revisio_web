<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Spécialisation B : Data Science pour la Santé - L3",
    "classe": "Licence 3 Data Science",
    "sequence": "Séquence 4",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Exercice 1 : Interopérabilité et Standards en Santé (8 pts)",
            "points": "8 pts",
            "enonce": "<p>L'interop\u00e9rabilit\u00e9 est un enjeu majeur pour la transformation num\u00e9rique des syst\u00e8mes de sant\u00e9. Elle permet aux diff\u00e9rents acteurs (h\u00f4pitaux, laboratoires, m\u00e9decins, patients) d'\u00e9changer et de comprendre les donn\u00e9es de sant\u00e9 de mani\u00e8re fluide et s\u00e9curis\u00e9e. Ce concept repose sur des standards techniques et s\u00e9mantiques qui garantissent que l'information est interpr\u00e9table par tous les syst\u00e8mes.</p><p style='font-size: 0.85rem; color: #555;'><em>Contexte : Vous travaillez en tant que data scientist au sein du Minist\u00e8re de la Sant\u00e9 du Cameroun. Vous \u00eates charg\u00e9 de concevoir une architecture d'\u00e9change de donn\u00e9es de sant\u00e9 pour relier les h\u00f4pitaux r\u00e9gionaux entre eux et avec une plateforme nationale.</em></p>",
            "questions": [
                {
                    "question": "<p><strong>1.1</strong> D\u00e9finissez le concept d'interop\u00e9rabilit\u00e9 en sant\u00e9. Identifiez les trois niveaux d'interop\u00e9rabilit\u00e9 (technique, s\u00e9mantique, organisationnelle) et expliquez bri\u00e8vement l'importance de chacun.</p>",
                    "reponse": "<p>L'interop\u00e9rabilit\u00e9 est la capacit\u00e9 de diff\u00e9rents syst\u00e8mes et logiciels \u00e0 \u00e9changer et \u00e0 utiliser les donn\u00e9es de mani\u00e8re coh\u00e9rente [citation:1][citation:5].</p><ul><li><strong>Niveau technique :</strong> Capacit\u00e9 des syst\u00e8mes \u00e0 se connecter et \u00e0 \u00e9changer des donn\u00e9es (formats, protocoles).</li><li><strong>Niveau s\u00e9mantique :</strong> Capacit\u00e9 \u00e0 interpr\u00e9ter les donn\u00e9es de la m\u00eame mani\u00e8re gr\u00e2ce \u00e0 des terminologies standardis\u00e9es (SNOMED CT, LOINC).</li><li><strong>Niveau organisationnel :</strong> Capacit\u00e9 des organisations \u00e0 \u00e9tablir des accords et des processus pour faciliter l'\u00e9change de donn\u00e9es.</li></ul>"
                },
                {
                    "question": "<p><strong>1.2</strong> Pr\u00e9sentez les normes HL7 et FHIR. Expliquez en quoi FHIR repr\u00e9sente une \u00e9volution par rapport aux normes pr\u00e9c\u00e9dentes.</p>",
                    "reponse": "<p>HL7 (Health Level 7) est un organisme de normalisation qui d\u00e9veloppe des standards pour l'\u00e9change de donn\u00e9es cliniques et administratives. La version 2 est largement utilis\u00e9e mais repose sur des messages textuels complexes.</p><p>FHIR (Fast Healthcare Interoperability Resources) est un standard r\u00e9cent qui combine les meilleures caract\u00e9ristiques des versions pr\u00e9c\u00e9dentes en utilisant des technologies web modernes (API RESTful, JSON, XML) [citation:1][citation:5]. FHIR repose sur des 'Ressources' (Patient, Observation, etc.), des briques \u00e9l\u00e9mentaires d'information facilement \u00e9changeables.</p>"
                },
                {
                    "question": "<p><strong>1.3</strong> La structure d'un \u00e9change FHIR repose sur des 'Ressources'. D\u00e9crivez ce concept et donnez trois exemples de ressources couramment utilis\u00e9es.</p>",
                    "reponse": "<p>Une 'Ressource' dans FHIR est l'unit\u00e9 de base de l'\u00e9change d'informations. Chaque ressource a un type et une structure d\u00e9finis pour repr\u00e9senter un concept de sant\u00e9 [citation:1][citation:5].</p><p>Exemples :</p><ul><li><strong>Patient :</strong> Informations d\u00e9mographiques d'un patient.</li><li><strong>Observation :</strong> Un r\u00e9sultat clinique (tension art\u00e9rielle, glyc\u00e9mie).</li><li><strong>MedicationRequest :</strong> Une prescription m\u00e9dicamenteuse.</li></ul>"
                },
                {
                    "question": "<p><strong>1.4</strong> Expliquez pourquoi l'utilisation de syst\u00e8mes de codage comme SNOMED CT ou LOINC est cruciale pour une interop\u00e9rabilit\u00e9 r\u00e9ussie dans le domaine de la sant\u00e9.</p>",
                    "reponse": "<p>Ces syst\u00e8mes de codage assurent l'interop\u00e9rabilit\u00e9 s\u00e9mantique. Par exemple, le diagnostic 'Diab\u00e8te de type 2' ou les examens comme la 'Glyc\u00e9mie \u00e0 jeun' doivent \u00eatre compris de la m\u00eame mani\u00e8re par tous les syst\u00e8mes pour une analyse coh\u00e9rente.</p><p>Un 'serveur de terminologie' fournit et valide ces codes standardis\u00e9s (SNOMED CT, LOINC) [citation:5].</p>"
                },
                {
                    "question": "<p><strong>1.5</strong> Quels sont les d\u00e9fis sp\u00e9cifiques \u00e0 l'adoption de standards comme FHIR dans un pays comme le Cameroun ? Proposez une solution ou une approche pour y rem\u00e9dier.</p>",
                    "reponse": "<p>Les d\u00e9fis incluent :</p><ul><li>Manque d'infrastructures r\u00e9seaux stables.</li><li>H\u00e9t\u00e9rog\u00e9n\u00e9it\u00e9 des syst\u00e8mes d'information hospitaliers.</li><li>Co\u00fbt de la modernisation et manque de comp\u00e9tences techniques.</li><li>Absence d'un cadre national d'interop\u00e9rabilit\u00e9 clair.</li></ul><p>Approche : D\u00e9velopper un r\u00e9f\u00e9rentiel national pour l'interop\u00e9rabilit\u00e9, investir dans la formation et adopter une approche incr\u00e9mentale en commen\u00e7ant par les cas d'usage les plus critiques.</p>"
                }
            ]
        },
        {
            "titre": "Exercice 2 : Interopérabilité et Standards (6 pts)",
            "points": "6 pts",
            "enonce": "<p>Les standards comme HL7 FHIR permettent aux diff\u00e9rents acteurs d'\u00e9changer des donn\u00e9es de mani\u00e8re standardis\u00e9e. Cet exercice porte sur les concepts fondamentaux de l'interop\u00e9rabilit\u00e9.</p>",
            "questions": [
                {
                    "question": "<p><strong>2.1 (1 pt)</strong> Qu'est-ce qu'une ressource FHIR ?</p>",
                    "reponse": "<p>Une ressource est l'unit\u00e9 de base d'\u00e9change dans FHIR. C'est un mod\u00e8le de donn\u00e9es structur\u00e9 et identifi\u00e9 de mani\u00e8re unique, repr\u00e9sentant un concept de sant\u00e9 (Patient, Observation, etc.) [citation:1].</p>"
                },
                {
                    "question": "<p><strong>2.2 (1 pt)</strong> Expliquez la diff\u00e9rence entre l'interop\u00e9rabilit\u00e9 technique et l'interop\u00e9rabilit\u00e9 s\u00e9mantique.</p>",
                    "reponse": "<p>L'interop\u00e9rabilit\u00e9 technique concerne la transmission des donn\u00e9es (format, protocole), tandis que l'interop\u00e9rabilit\u00e9 s\u00e9mantique garantit que le sens des donn\u00e9es est compris de mani\u00e8re identique par tous les syst\u00e8mes (gr\u00e2ce \u00e0 des terminologies standardis\u00e9es).</p>"
                },
                {
                    "question": "<p><strong>2.3 (2 pts)</strong> Pour une plateforme nationale de t\u00e9l\u00e9m\u00e9decine au Cameroun, listez trois avantages cl\u00e9s que l'utilisation de FHIR apporterait par rapport \u00e0 des \u00e9changes de donn\u00e9es non standardis\u00e9s (ex: PDF par email).</p>",
                    "reponse": "<p>Avantages de FHIR :</p><ol><li><strong>Structuration des donn\u00e9es :</strong> Les donn\u00e9es sont interpr\u00e9tables par les syst\u00e8mes, permettant une analyse automatis\u00e9e.</li><li><strong>Interop\u00e9rabilit\u00e9 :</strong> Les donn\u00e9es peuvent \u00eatre facilement partag\u00e9es entre diff\u00e9rents acteurs.</li><li><strong>Mise \u00e0 jour en temps r\u00e9el :</strong> Les API permettent un acc\u00e8s et une mise \u00e0 jour instantan\u00e9e des donn\u00e9es [citation:5].</li></ol>"
                },
                {
                    "question": "<p><strong>2.4 (2 pts)</strong> Citez et expliquez bri\u00e8vement deux syst\u00e8mes de codage s\u00e9mantique utilis\u00e9s en sant\u00e9.</p>",
                    "reponse": "<p><strong>SNOMED CT :</strong> Terminologie clinique de r\u00e9f\u00e9rence pour les diagnostics, les sympt\u00f4mes et les proc\u00e9dures.</p><p><strong>LOINC :</strong> Standard pour l'identification des tests de laboratoire et des observations cliniques [citation:5].</p>"
                }
            ]
        },
        {
            "titre": "Exercice 3 : Découverte de Médicaments (6 pts)",
            "points": "6 pts",
            "enonce": "<p>La d\u00e9couverte de m\u00e9dicaments est un processus long et co\u00fbteux. La data science offre des solutions pour acc\u00e9l\u00e9rer ce processus et r\u00e9duire les co\u00fbts. Cet exercice explore ces applications.</p>",
            "questions": [
                {
                    "question": "<p><strong>3.1 (1.5 pts)</strong> Expliquez comment la mod\u00e9lisation QSAR (Quantitative Structure-Activity Relationship) permet d'acc\u00e9l\u00e9rer la d\u00e9couverte de m\u00e9dicaments.</p>",
                    "reponse": "<p>La mod\u00e9lisation QSAR \u00e9tablit une relation math\u00e9matique entre la structure chimique d'une mol\u00e9cule et son activit\u00e9 biologique. Cette approche permet de cribler virtuellement des millions de compos\u00e9s et d'identifier ceux ayant le plus grand potentiel th\u00e9rapeutique avant de passer aux tests en laboratoire, ce qui r\u00e9duit consid\u00e9rablement le temps et les co\u00fbts [citation:3].</p>"
                },
                {
                    "question": "<p><strong>3.2 (2 pts)</strong> D\u00e9crivez comment l'IA et le machine learning peuvent \u00eatre utilis\u00e9s pour la d\u00e9couverte de m\u00e9dicaments.</p>",
                    "reponse": "<p>L'IA permet de simuler les interactions entre un m\u00e9dicament et les prot\u00e9ines de l'organisme [citation:3]. Des startups comme BenevolentAI d\u00e9veloppent des 'cerveaux artificiels' capables de cr\u00e9er de nouveaux m\u00e9dicaments et traitements. L'apprentissage profond peut analyser les donn\u00e9es g\u00e9nomiques, les structures prot\u00e9iques et les donn\u00e9es des essais cliniques pour identifier de nouvelles cibles th\u00e9rapeutiques.</p>"
                },
                {
                    "question": "<p><strong>3.3 (2.5 pts)</strong> Comparez l'approche traditionnelle de d\u00e9couverte de m\u00e9dicaments \u00e0 une approche bas\u00e9e sur la data science. Quels sont les gains potentiels en termes de temps et de co\u00fbts ?</p>",
                    "reponse": "<p>L'approche traditionnelle prend en moyenne 12 ans et co\u00fbte environ 2,6 milliards de dollars. La data science permet de simuler la r\u00e9action d'un m\u00e9dicament avec les prot\u00e9ines, ce qui pourrait r\u00e9duire ce processus \u00e0 moins de deux ans [citation:3]. Les gains sont donc consid\u00e9rables en temps et en co\u00fbts, avec une augmentation de l'efficacit\u00e9 gr\u00e2ce aux simulations et \u00e0 l'analyse des donn\u00e9es g\u00e9nomiques.</p>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
