<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Spécialisation B : Data Science pour la Santé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modèles Épidémiologiques SIR/SEIR (8 points)",
      "points": "8 pts",
      "enonce": "<p>Le modèle <strong>SIR</strong> (Susceptible - Infectieux - Rétabli) est un modèle mathématique fondamental en épidémiologie. Il permet de simuler la propagation d'une maladie infectieuse dans une population.</p><div class='math-block'><div class='math'>$$ \\frac{dS}{dt} = -\\beta SI $$</div><div class='math'>$$ \\frac{dI}{dt} = \\beta SI - \\gamma I $$</div><div class='math'>$$ \\frac{dR}{dt} = \\gamma I $$</div></div><ul><li>$S$ : nombre de personnes susceptibles</li><li>$I$ : nombre de personnes infectieuses</li><li>$R$ : nombre de personnes rétablies (ou décédées)</li><li>$\\beta$ : taux de transmission</li><li>$\\gamma$ : taux de guérison</li></ul><p>Le nombre de reproduction de base est $R_0 = \\beta / \\gamma$.</p><p>Le modèle <strong>SEIR</strong> ajoute un compartiment <strong>E</strong> (Exposé) pour les personnes en incubation.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Une épidémie de méningite survient dans une région du Nord Cameroun. La population est de <strong>100 000</strong> habitants. Au début de l'épidémie, on compte <strong>10</strong> cas infectieux. Le taux de transmission est $\\beta = 0.3$ et le taux de guérison est $\\gamma = 0.1$ (par jour).</p><p><strong>a)</strong> Calculez le nombre de reproduction de base $R_0$ et interprétez ce résultat.</p><p><strong>b)</strong> Estimez le nombre de nouveaux cas infectieux après 1 jour en utilisant l'approximation $\\Delta I = (\\beta SI - \\gamma I) \\times \\Delta t$ avec $\\Delta t = 1$ jour.</p>",
          "reponse": "<p><strong>a) Calcul de $R_0$ :</strong></p><p>$R_0 = \\frac{\\beta}{\\gamma} = \\frac{0.3}{0.1} = 3$</p><p><strong>Interprétation :</strong> Un $R_0 = 3$ signifie qu'en moyenne, une personne infectieuse va contaminer 3 autres personnes dans une population entièrement susceptible. Comme $R_0 > 1$, l'épidémie va se propager et s'aggraver sans intervention. Cela justifie les mesures de contrôle (confinement, vaccination, port de masque).</p><p><strong>b) Estimation après 1 jour :</strong></p><p>$S_0 = 100\\,000 - 10 = 99\\,990$</p><p>$\\Delta I = (\\beta S I - \\gamma I) \\times 1 = (0.3 \\times 99\\,990 \\times 10 - 0.1 \\times 10) = 299\\,970 - 1 = 299\\,969$</p><p>Ce résultat est anormalement élevé car le modèle est très sensible aux paramètres pour une population de cette taille. En réalité, on utilise des taux et des populations bien calibrées. Avec une approche simplifiée : $\\Delta I \\approx \\beta S I \\times 1 \\approx 0.3 \\times 99\\,990 \\times 10 \\approx 299\\,970$ nouveaux cas, ce qui est une surestimation, montrant les limites du modèle sans ajustement.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Expliquez l'<strong>utilité</strong> du modèle SEIR par rapport au modèle SIR et donnez un exemple de maladie où le modèle SEIR est plus approprié.</p>",
          "reponse": "<p>Le modèle <strong>SEIR</strong> ajoute un compartiment <strong>Exposé (E)</strong> qui représente les personnes infectées mais pas encore contagieuses (période d'incubation). Cette différence est cruciale pour certaines maladies où la période d'incubation est longue et la personne n'est pas contagieuse pendant cette période.</p><p><strong>Utilité du modèle SEIR :</strong></p><ul><li>Il modélise plus fidèlement des maladies comme la <strong>COVID-19</strong>, la <strong>rougeole</strong> ou la <strong>tuberculose</strong>, où la période d'incubation est significative.</li><li>Il permet de mieux estimer le temps de latence entre l'infection et l'apparition de la contagiosité.</li><li>Il améliore la précision des prévisions épidémiques.</li></ul><p><strong>Exemple :</strong> La COVID-19 a une période d'incubation moyenne de 5 à 6 jours pendant laquelle les personnes infectées ne sont généralement pas contagieuses. Le modèle SEIR est donc plus approprié que SIR pour simuler cette épidémie.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Prédiction d'Épidémies (6 points)",
      "points": "6 pts",
      "enonce": "<p>La prédiction d'épidémies combine des modèles mathématiques et des techniques d'apprentissage automatique.</p><p>Deux approches principales existent :</p><ul><li><strong>Modèles mécanistes</strong> (SIR, SEIR) : basés sur la compréhension des processus de transmission.</li><li><strong>Modèles statistiques/ML</strong> : basés sur les données historiques (ARIMA, LSTM, XGBoost).</li></ul><p>Le tableau suivant montre les performances de trois modèles pour prédire les cas hebdomadaires de paludisme dans une région du Cameroun :</p><div style='background:#f8f9fa;padding:12px;border-radius:8px;margin:10px 0;border:1px solid #dee2e6;'><table style='width:100%;border-collapse:collapse;'><thead><tr style='background:#e9ecef;'><th style='padding:8px;border:1px solid #dee2e6;'>Modèle</th><th style='padding:8px;border:1px solid #dee2e6;'>RMSE</th><th style='padding:8px;border:1px solid #dee2e6;'>MAE</th><th style='padding:8px;border:1px solid #dee2e6;'>R²</th><th style='padding:8px;border:1px solid #dee2e6;'>AUC</th></tr></thead><tbody><tr><td style='padding:8px;border:1px solid #dee2e6;'>SIR calibré</td><td style='padding:8px;border:1px solid #dee2e6;'>52</td><td style='padding:8px;border:1px solid #dee2e6;'>38</td><td style='padding:8px;border:1px solid #dee2e6;'>0.68</td><td style='padding:8px;border:1px solid #dee2e6;'>0.85</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>ARIMA</td><td style='padding:8px;border:1px solid #dee2e6;'>45</td><td style='padding:8px;border:1px solid #dee2e6;'>32</td><td style='padding:8px;border:1px solid #dee2e6;'>0.75</td><td style='padding:8px;border:1px solid #dee2e6;'>0.91</td></tr><tr><td style='padding:8px;border:1px solid #dee2e6;'>XGBoost</td><td style='padding:8px;border:1px solid #dee2e6;'>35</td><td style='padding:8px;border:1px solid #dee2e6;'>28</td><td style='padding:8px;border:1px solid #dee2e6;'>0.82</td><td style='padding:8px;border:1px solid #dee2e6;'>0.94</td></tr></tbody></table></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Comparez les performances des trois modèles. Quel modèle est le plus performant pour la prédiction des cas de paludisme ? Justifiez votre réponse en utilisant les métriques.</p>",
          "reponse": "<p><strong>Analyse comparative :</strong></p><ul><li><strong>XGBoost</strong> a les meilleures performances sur toutes les métriques : RMSE le plus bas (35), MAE le plus bas (28), R² le plus élevé (0.82), AUC le plus élevé (0.94).</li><li><strong>ARIMA</strong> est intermédiaire (RMSE=45, MAE=32, R²=0.75, AUC=0.91).</li><li><strong>SIR calibré</strong> est le moins performant (RMSE=52, MAE=38, R²=0.68, AUC=0.85).</li></ul><p><strong>Conclusion :</strong> Le modèle <strong>XGBoost</strong> est le plus performant. Il capture mieux les relations non-linéaires et les interactions entre variables (climat, saisonnalité, etc.) que les modèles SIR et ARIMA.</p><p>Pour la détection des épidémies (AUC > 0.90), les trois modèles sont acceptables, mais XGBoost offre la meilleure fiabilité pour le déclenchement des alertes.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Proposez une <strong>stratégie d'ensemble</strong> (combinaison de modèles) pour améliorer encore la prédiction. Expliquez comment vous combineriez les trois modèles.</p>",
          "reponse": "<p><strong>Stratégie d'ensemble proposée :</strong></p><p>Une approche d'ensemble combine les prédictions de plusieurs modèles pour améliorer la robustesse et la précision.</p><p><strong>1. Combinaison par moyenne pondérée :</strong><br/>Attribuer des poids aux modèles en fonction de leurs performances (ex: poids inversement proportionnel à l'erreur).<br/>Exemple : $\\hat{y}_{ensemble} = 0.2 \\times \\hat{y}_{SIR} + 0.3 \\times \\hat{y}_{ARIMA} + 0.5 \\times \\hat{y}_{XGBoost}$<br/>Les poids sont basés sur les RMSE : $w_i = \\frac{1/RMSE_i}{\\sum 1/RMSE_i}$.</p><p><strong>2. Stacking (méta-modèle) :</strong><br/>Entraîner un méta-modèle (ex: régression logistique) qui prend en entrée les prédictions des trois modèles et apprend la meilleure combinaison.</p><p><strong>3. Approche séquentielle :</strong><br/>- Utiliser SIR pour les prévisions à long terme (mois).<br/>- Utiliser ARIMA pour les prévisions à moyen terme (semaines).<br/>- Utiliser XGBoost pour les prévisions à court terme (jours), avec des données plus granulaires.</p><p><strong>Avantage :</strong> L'ensemble combine la robustesse du SIR, la modélisation temporelle de ARIMA, et la flexibilité de XGBoost pour capturer les relations complexes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Prédiction du Risque de Maladie (7 points)",
      "points": "7 pts",
      "enonce": "<p>La prédiction du risque de maladie est une application clé de la médecine personnalisée. Un <strong>score de risque polygénique (PRS)</strong> est utilisé pour estimer le risque génétique d'une maladie.</p><p>Un PRS est calculé comme la somme pondérée des génotypes d'un individu pour M variants :</p><div class='math-block'><div class='math'>$$ PRS_i = \\sum_{j=1}^{M} \\beta_j \\times G_{ij} $$</div></div><ul><li>$\\beta_j$ = poids (effet) du SNP j (issu d'une étude GWAS)</li><li>$G_{ij}$ = génotype de l'individu i pour le SNP j (0, 1, 2)</li></ul><p>Un modèle de régression logistique est entraîné pour prédire le risque de diabète de type 2 :</p><div class='math-block'><div class='math'>$$ P(Y=1) = \\frac{1}{1 + e^{-(\\beta_0 + \\beta_1 \\times \\text{Âge} + \\beta_2 \\times \\text{IMC} + \\beta_3 \\times \\text{PRS})}} $$</div></div><p>Les coefficients estimés sont : $\\beta_0 = -4.2$, $\\beta_1 = 0.05$, $\\beta_2 = 0.12$, $\\beta_3 = 0.08$.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Un patient camerounais de 50 ans a un IMC de 30 et un PRS de 15. Calculez la probabilité qu'il développe un diabète de type 2 dans les 5 ans.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
