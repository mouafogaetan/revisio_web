<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Data Science pour la Santé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "1. Prédiction du risque de diabète : Prétraitement et Modélisation",
      "points": "6 pts",
      "enonce": "<p>Vous êtes data scientist dans un centre de santé. On vous confie le projet de construire un modèle de prédiction du risque de diabète de type 2 à partir de données cliniques. Le dataset (fictif) contient les variables suivantes :</p><ul><li><strong>age</strong> : âge du patient (en années)</li><li><strong>imc</strong> : Indice de Masse Corporelle (kg/m²)</li><li><strong>glycemie</strong> : glycémie à jeun (mg/dL)</li><li><strong>pression_arterielle</strong> : pression artérielle moyenne (mmHg)</li><li><strong>tabagisme</strong> : 'oui' ou 'non'</li><li><strong>antecedents</strong> : 'oui' si antécédents familiaux de diabète, 'non' sinon</li><li><strong>diabete</strong> : variable cible (1 si diabète diagnostiqué dans les 5 ans, 0 sinon)</li></ul><p>Le dataset contient 1500 patients, dont 200 ont développé un diabète (classe minoritaire).</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (1 pt)</strong> Identifiez les étapes de prétraitement nécessaires pour préparer ces données à l'entraînement d'un modèle de régression logistique. Justifiez chaque étape.</p>",
          "reponse": "<p>Les étapes de prétraitement sont :</p><ul><li><strong>Encodage des variables catégorielles</strong> : 'tabagisme' et 'antecedents' doivent être transformées en variables numériques (par exemple, one-hot encoding) car la régression logistique ne traite que les données numériques.</li><li><strong>Gestion des valeurs manquantes</strong> : Il faut vérifier la présence de valeurs manquantes et les traiter (imputation par la moyenne, la médiane, ou suppression si la proportion est faible).</li><li><strong>Normalisation/Standardisation</strong> : Les variables continues (age, imc, glycemie, pression_arterielle) doivent être standardisées (Z-score) ou normalisées (Min-Max) pour éviter que certaines variables dominent le modèle en raison de leurs échelles différentes.</li><li><strong>Gestion du déséquilibre des classes</strong> : La classe cible est déséquilibrée (200 positifs contre 1300 négatifs). Il faut envisager des techniques comme le sur-échantillonnage (SMOTE), le sous-échantillonnage, ou l'utilisation de poids de classe.</li></ul>"
        },
        {
          "question": "<p><strong>1.2 (1.5 pts)</strong> Comment évaluer la performance de votre modèle de régression logistique ? Proposez une stratégie de validation et listez les métriques que vous utiliserez, en justifiant votre choix au regard du contexte clinique.</p>",
          "reponse": "<p><strong>Stratégie de validation :</strong> Utiliser une <strong>validation croisée stratifiée à 5 plis</strong> pour avoir une estimation robuste de la performance du modèle tout en respectant la proportion de cas dans chaque pli.</p><p><strong>Métriques :</strong></p><ul><li><strong>Aire sous la courbe ROC (AUC)</strong> : Mesure la capacité du modèle à discriminer entre les patients qui développeront un diabète et ceux qui ne le développeront pas. C'est une métrique clé pour la prédiction du risque.</li><li><strong>Sensibilité (Rappel)</strong> : Proportion de vrais positifs parmi les patients qui ont réellement développé un diabète. Très importante pour ne pas manquer de patients à risque.</li><li><strong>Précision</strong> : Proportion de patients prédits à risque qui le sont réellement. Permet d'évaluer le taux de faux positifs.</li><li><strong>F1-score</strong> : Moyenne harmonique de la précision et du rappel, utile en cas de déséquilibre des classes.</li><li><strong>Courbe de calibration</strong> : Pour vérifier si les probabilités prédites sont bien calibrées (le risque prédit correspond au risque observé).</li></ul>"
        },
        {
          "question": "<p><strong>1.3 (1.5 pts)</strong> Le modèle de régression logistique donne les coefficients suivants (après standardisation) :</p><div class='math-block'><div class='math'>\\begin{aligned} \\beta_{age} &= 0.35 \\\\ \\beta_{imc} &= 0.50 \\\\ \\beta_{glycemie} &= 0.80 \\\\ \\beta_{pression} &= 0.15 \\\\ \\beta_{tabagisme} &= 0.10 \\\\ \\beta_{antecedents} &= 0.60 \\end{aligned}</div></div><p>Interprétez ces coefficients. Quelle variable a le plus d'influence sur le risque de diabète ?</p>",
          "reponse": "<p>Dans une régression logistique, le coefficient $\\beta$ représente le log du rapport de cotes (log-odds). Un coefficient positif signifie que lorsque la variable augmente, la probabilité de développer un diabète augmente.</p><p><strong>Interprétation :</strong></p><ul><li><strong>La glycémie</strong> ($\\beta=0.80$) est le prédicteur le plus influent : une augmentation d'un écart-type de la glycémie est associée à une augmentation significative du risque de diabète.</li><li><strong>Les antécédents familiaux</strong> ($\\beta=0.60$) sont également un facteur de risque important.</li><li><strong>L'IMC</strong> ($\\beta=0.50$) est un facteur de risque modéré.</li><li>L'âge ($\\beta=0.35$) et la pression artérielle ($\\beta=0.15$) ont une influence plus faible.</li><li>Le tabagisme ($\\beta=0.10$) semble avoir un effet faible dans ce modèle.</li></ul><p>Le coefficient le plus élevé est celui de la glycémie, ce qui est cohérent avec la physiopathologie du diabète.</p>"
        },
        {
          "question": "<p><strong>1.4 (1 pt)</strong> Proposez deux actions concrètes pour améliorer la performance du modèle.</p>",
          "reponse": "<p>Deux actions pour améliorer le modèle :</p><ul><li><strong>Ajout de variables prédictives</strong> : Intégrer d'autres facteurs de risque comme l'activité physique, les habitudes alimentaires, ou des données génétiques (PRS - Polygenic Risk Score).</li><li><strong>Utilisation d'un modèle plus complexe</strong> : Tester d'autres algorithmes comme les forêts aléatoires (Random Forest) ou le Gradient Boosting (XGBoost), qui peuvent capturer des relations non-linéaires et des interactions entre variables.</li></ul>"
        },
        {
          "question": "<p><strong>1.5 (1 pt)</strong> Vous souhaitez intégrer un score de risque polygénique (PRS) au modèle. Expliquez ce qu'est un PRS et comment il pourrait améliorer la prédiction du risque de diabète.</p>",
          "reponse": "<p>Un <strong>score de risque polygénique (PRS)</strong> est une mesure qui agrège l'effet de nombreux variants génétiques (SNPs) associés à une maladie ou un trait. Il est calculé comme une somme pondérée des génotypes d'un individu :</p><div class='math-block'><div class='math'> PRS = \\sum_{i=1}^{M} \\beta_i \\times G_i </div></div><p>où $\\beta_i$ est l'effet estimé du variant $i$ (issu d'un GWAS) et $G_i$ est le génotype de l'individu.</p><p><strong>Amélioration de la prédiction :</strong> Le PRS capture l'information génétique indépendante des facteurs de risque cliniques. L'ajouter au modèle clinique peut :</p><ul><li>Améliorer la <strong>discrimination</strong> (AUC) du modèle.</li><li>Améliorer la <strong>reclassification</strong> des patients (NRI), en permettant de mieux identifier les patients à risque élevé qui pourraient bénéficier d'une prévention plus intensive.</li></ul>"
        }
      ]
    },
    {
      "titre": "2. Évaluation du risque de réhospitalisation",
      "points": "4 pts",
      "enonce": "<p>Un hôpital souhaite développer un modèle pour prédire le risque de réhospitalisation dans les 30 jours suivant la sortie. Le dataset contient des données de 5000 patients. La variable cible est 'readmission' (1 si réhospitalisation, 0 sinon).</p><p>Après entraînement, vous obtenez une <strong>AUC de 0.78</strong> sur les données de test. Un médecin vous demande si le modèle est \"bon\".</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (1 pt)</strong> Expliquez ce que signifie une AUC de 0.78. Donnez une interprétation simple pour un clinicien non spécialiste en data science.</p>",
          "reponse": "<p>Une AUC de 0.78 signifie que si l'on prend au hasard un patient qui a été réhospitalisé et un patient qui ne l'a pas été, le modèle a <strong>78% de chances</strong> d'attribuer un score de risque plus élevé au patient réhospitalisé. C'est une performance correcte, mais pas parfaite. Une AUC de 0.5 correspond au hasard, et 1.0 à une discrimination parfaite.</p><p><strong>Pour un clinicien :</strong> \"Notre modèle est capable de distinguer les patients à risque de réhospitalisation dans 78% des cas. C'est mieux que le hasard, mais il reste 22% de paires où le modèle se trompe. Il peut être un outil d'aide à la décision, mais ne remplace pas le jugement clinique.\"</p>"
        },
        {
          "question": "<p><strong>2.2 (1 pt)</strong> Le médecin souhaite connaître la probabilité de réhospitalisation pour un patient spécifique. Quel est le rôle du <strong>seuil de décision</strong> ? Comment le choix du seuil influence-t-il les décisions cliniques ?</p>",
          "reponse": "<p>Un modèle de classification (comme la régression logistique) prédit une <strong>probabilité</strong> (par exemple, le risque de réhospitalisation). Le <strong>seuil de décision</strong> est la valeur de probabilité à partir de laquelle on classe un patient comme 'à risque' (positif).</p><p><strong>Influence du seuil :</strong></p><ul><li><strong>Seuil bas (ex: 0.3)</strong> : On classe plus de patients comme 'à risque'. La sensibilité augmente (on détecte plus de vrais réhospitalisés), mais la précision diminue (plus de faux positifs).</li><li><strong>Seuil élevé (ex: 0.7)</strong> : On classe moins de patients comme 'à risque'. La spécificité augmente (moins de faux positifs), mais la sensibilité diminue (on risque de manquer des patients réellement à risque).</li></ul><p>Le choix du seuil dépend du <strong>contexte clinique</strong> : si le coût d'un faux négatif (manquer un patient à risque) est très élevé, on préférera un seuil bas pour maximiser la sensibilité.</p>"
        },
        {
          "question": "<p><strong>2.3 (1 pt)</strong> Le médecin vous demande de vérifier la <strong>calibration</strong> du modèle. Qu'est-ce que la calibration et comment l'évaluer ?</p>",
          "reponse": "<p>La <strong>calibration</strong> d'un modèle mesure la correspondance entre les probabilités prédites et les fréquences observées. Un modèle est bien calibré si, pour les patients à qui le modèle attribue un risque de 30%, environ 30% d'entre eux sont effectivement réhospitalisés.</p><p><strong>Évaluation :</strong> On évalue la calibration à l'aide d'un <strong>calibration plot</strong> (ou reliability diagram) :</p><ul><li>On regroupe les patients par déciles de risque prédit.</li><li>Pour chaque décile, on calcule le risque moyen prédit et la proportion observée de réhospitalisations.</li><li>On trace ces points. Un modèle parfaitement calibré aura des points alignés sur la diagonale (risque prédit = risque observé).</li></ul><p>On peut également utiliser le <strong>test de Hosmer-Lemeshow</strong> pour évaluer statistiquement la calibration.</p>"
        },
        {
          "question": "<p><strong>2.4 (1 pt)</strong> Un autre modèle, utilisant des techniques de machine learning (XGBoost), obtient une AUC de 0.82 et une meilleure calibration. Que conseillez-vous à l'hôpital ?</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
