<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Séries Temporelles et Données Séquentielles - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Analyse des fondements d'une série temporelle",
      "points": "4 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'>Le tableau ci-dessous présente l'évolution du nombre de passagers d'une compagnie aérienne entre 2010 et 2020.<br><br><div style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr style='background-color: #e0e7ef;'><th style='padding: 8px; border: 1px solid #ccc;'>Année</th><th style='padding: 8px; border: 1px solid #ccc;'>2010</th><th style='padding: 8px; border: 1px solid #ccc;'>2011</th><th style='padding: 8px; border: 1px solid #ccc;'>2012</th><th style='padding: 8px; border: 1px solid #ccc;'>2013</th><th style='padding: 8px; border: 1px solid #ccc;'>2014</th><th style='padding: 8px; border: 1px solid #ccc;'>2015</th><th style='padding: 8px; border: 1px solid #ccc;'>2016</th><th style='padding: 8px; border: 1px solid #ccc;'>2017</th><th style='padding: 8px; border: 1px solid #ccc;'>2018</th><th style='padding: 8px; border: 1px solid #ccc;'>2019</th><th style='padding: 8px; border: 1px solid #ccc;'>2020</th></tr><tr><td style='padding: 8px; border: 1px solid #ccc; background-color: #f9fafb;'><strong>Passagers (millions)</strong></td><td style='padding: 8px; border: 1px solid #ccc;'>12.5</td><td style='padding: 8px; border: 1px solid #ccc;'>13.0</td><td style='padding: 8px; border: 1px solid #ccc;'>13.8</td><td style='padding: 8px; border: 1px solid #ccc;'>14.5</td><td style='padding: 8px; border: 1px solid #ccc;'>15.2</td><td style='padding: 8px; border: 1px solid #ccc;'>16.0</td><td style='padding: 8px; border: 1px solid #ccc;'>17.1</td><td style='padding: 8px; border: 1px solid #ccc;'>18.0</td><td style='padding: 8px; border: 1px solid #ccc;'>19.2</td><td style='padding: 8px; border: 1px solid #ccc;'>20.5</td><td style='padding: 8px; border: 1px solid #ccc;'>9.8</td></tr></table></div><br>L'objectif est d'analyser cette série pour en comprendre les composantes.</div>",
      "questions": [
        {
          "question": "<strong>1. Définir</strong> ce qu'est une série temporelle et <strong>distinguer</strong> cette série de données d'une série transversale. [1 pt]",
          "reponse": "<p>Une <strong>série temporelle</strong> est un ensemble d'observations ordonnées dans le temps, généralement à intervalles réguliers. Dans ce cas, les observations sont les nombres de passagers enregistrés chaque année de 2010 à 2020.</p><p>La <strong>série transversale</strong> (ou données en coupe instantanée) capture des observations à un instant donné pour plusieurs unités (ex: le nombre de passagers de plusieurs compagnies en 2020). <br>La série fournie est temporelle car elle suit l'évolution d'une même unité (la compagnie) à travers le temps.</p>"
        },
        {
          "question": "<strong>2. Identifier</strong> et <strong>décomposer</strong> les composantes visibles de cette série temporelle. Justifier votre réponse. [2 pts]",
          "reponse": "<p>On peut identifier plusieurs composantes dans cette série :</p><ul><li><strong>Tendance</strong> : Entre 2010 et 2019, on observe une augmentation constante du nombre de passagers, ce qui indique une tendance à la hausse.</li><li><strong>Saisonnalité</strong> : Les données sont annuelles, donc il n'est pas possible d'identifier de saisonnalité intra-annuelle, mais il pourrait y avoir une saisonnalité annuelle sur une décennie.</li><li><strong>Cycle</strong> : On pourrait éventuellement parler d'un cycle économique sur plusieurs années, mais pas très marqué ici.</li><li><strong>Résidu (ou bruit)</strong> : La chute brutale en 2020 est un événement exceptionnel (probablement dû à la pandémie), qui peut être considéré comme un résidu ou une composante irrégulière.</li></ul>"
        },
        {
          "question": "<strong>3. Discuter</strong> du caractère stationnaire de cette série. Pourquoi est-il important de tester la stationnarité en modélisation ? [1 pt]",
          "reponse": "<p>Cette série semble <strong>non stationnaire</strong> car elle présente une tendance claire à la hausse, ce qui signifie que sa moyenne évolue dans le temps. Une série stationnaire a une moyenne, une variance et une autocorrélation constantes dans le temps.</p><p>Il est crucial de tester la stationnarité car la plupart des modèles statistiques (comme ARIMA) exigent que la série soit stationnaire. Une série non stationnaire peut conduire à des prévisions erronées. Des tests comme ADF ou KPSS sont utilisés pour confirmer la stationnarité.</p>"
        }
      ]
    },
    {
      "titre": "Modélisation et prévision avec un processus ARIMA",
      "points": "4 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'>Une équipe de data scientists étudie les ventes mensuelles d'un produit. Après analyse, ils estiment qu'un modèle ARIMA (1, 1, 1) est approprié. L'équation estimée est :<br><div class='math-block' style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;'><div class='math'>$$ (1 - 0.7B)(1 - B)Y_t = (1 + 0.3B)\varepsilon_t $$</div></div>où <span style='font-family: monospace;'>B</span> est l'opérateur de retard et <span style='font-family: monospace;'>ε_t</span> est un bruit blanc.</div>",
      "questions": [
        {
          "question": "<strong>1. Interpréter</strong> chacun des paramètres du modèle ARIMA (1,1,1). Déterminer les ordres p, d et q. [1 pt]",
          "reponse": "<p>Le modèle <strong>ARIMA (p,d,q)</strong> est composé de :</p><ul><li><strong>p = 1</strong> : ordre de la partie autorégressive (AR). L'équation comporte un terme <span style='font-family: monospace;'>0.7B</span> appliqué à la série <span style='font-family: monospace;'>Y_t</span>, indiquant qu'une observation dépend de la précédente.</li><li><strong>d = 1</strong> : ordre de différenciation. Le terme <span style='font-family: monospace;'>(1 - B)</span> montre que la série a été différenciée une fois pour la rendre stationnaire.</li><li><strong>q = 1</strong> : ordre de la partie moyenne mobile (MA). Le terme <span style='font-family: monospace;'>0.3B</span> appliqué au bruit <span style='font-family: monospace;'>ε_t</span> indique que l'erreur actuelle dépend de l'erreur précédente.</li></ul>"
        },
        {
          "question": "<strong>2. Exprimer</strong> l'équation du modèle sous forme d'une équation de prévision pour <span style='font-family: monospace;'>Y_t</span> en fonction de <span style='font-family: monospace;'>Y_{t-1}</span>, <span style='font-family: monospace;'>Y_{t-2}</span> et des erreurs. [2 pts]",
          "reponse": "<p>En développant l'équation :</p><div class='math-block' style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>$$ (1 - 0.7B - B + 0.7B^2)Y_t = (1 + 0.3B)\varepsilon_t $$</div><p>Soit :</p><div class='math-block' style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>$$ (1 - 1.7B + 0.7B^2)Y_t = (1 + 0.3B)\varepsilon_t $$</div><p>En développant :</p><div class='math-block' style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>$$ Y_t - 1.7Y_{t-1} + 0.7Y_{t-2} = \varepsilon_t + 0.3\varepsilon_{t-1} $$</div><p>D'où l'équation de prévision :</p><div class='math-block' style='background-color: #f4f6f8; padding: 15px; border-radius: 8px; margin: 10px 0;'>$$ Y_t = 1.7Y_{t-1} - 0.7Y_{t-2} + \varepsilon_t + 0.3\varepsilon_{t-1} $$</div>"
        },
        {
          "question": "<strong>3. Proposer</strong> une méthode pour vérifier si ce modèle est bien spécifié. [1 pt]",
          "reponse": "<p>Pour vérifier la spécification du modèle, on peut :</p><ul><li><strong>Analyser les résidus</strong> : Tester l'autocorrélation des résidus à l'aide du test de Ljung-Box. Si les résidus sont un bruit blanc (non corrélés), le modèle est adéquat.</li><li><strong>Comparer avec d'autres modèles</strong> : Utiliser des critères d'information comme AIC ou BIC pour comparer ce modèle avec d'autres ordres (p, d, q).</li></ul>"
        }
      ]
    },
    {
      "titre": "Application des HMM à la finance",
      "points": "3 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'>Dans le cadre d'un stage en finance, on vous demande de modéliser les rendements d'un actif financier. On suppose que l'actif peut évoluer dans deux régimes : un régime de <strong>forte volatilité</strong> et un régime de <strong>faible volatilité</strong>. Le passage d'un régime à l'autre est modélisé par une chaîne de Markov cachée (HMM).</div>",
      "questions": [
        {
          "question": "<strong>1. Décrire</strong> les composants d'un modèle de Markov caché (HMM) et <strong>identifier</strong> les éléments correspondants à ce contexte financier. [1 pt]",
          "reponse": "<p>Un HMM est composé de :</p><ul><li><strong>États cachés</strong> : les régimes de volatilité (forte/faible).</li><li><strong>Observations</strong> : les rendements observés (qui dépendent du régime).</li><li><strong>Matrice de transition</strong> : les probabilités de passer d'un régime à l'autre.</li><li><strong>Probabilités d'émission</strong> : la distribution des rendements conditionnellement à chaque régime.</li></ul><p>Dans ce contexte, on peut modéliser les rendements par une loi normale dont les paramètres (moyenne et variance) dépendent du régime.</p>"
        },
        {
          "question": "<strong>2. Expliquer</strong> l'objectif de l'algorithme de Viterbi dans ce modèle. [1 pt]",
          "reponse": "<p>L'algorithme de Viterbi est utilisé pour le <strong>décodage</strong>. Étant donné une séquence d'observations (les rendements), il permet de trouver la séquence d'états cachés (les régimes) la plus probable. C'est un problème de recherche du chemin le plus probable dans un graphe dynamique.</p>"
        },
        {
          "question": "<strong>3. Proposer</strong> une méthode pour estimer les paramètres du HMM à partir des données. [1 pt]",
          "reponse": "<p>Pour estimer les paramètres (matrice de transition, paramètres des distributions d'émission), on utilise l'<strong>algorithme de Baum-Welch</strong> (qui est une instance de l'algorithme EM pour les HMM). Cet algorithme estime itérativement les paramètres en maximisant la vraisemblance des observations.</p>"
        }
      ]
    },
    {
      "titre": "Détection de ruptures dans une série industrielle",
      "points": "3 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'>Dans une usine, un capteur mesure la température d'une machine toutes les minutes. Une température stable indique un fonctionnement normal, tandis qu'une déviation soudaine peut signaler une panne ou une anomalie. L'objectif est de détecter les changements de comportement de la température.</div>",
      "questions": [
        {
          "question": "<strong>1. Décrire</strong> la méthode CUSUM (cumulative sum) pour la détection de ruptures et expliquer son principe. [1.5 pts]",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
