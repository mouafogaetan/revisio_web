<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "intitule": "Compréhension du projet de prévision de ventes",
    "type": "ressource",
    "niveau": "easy",
    "enonce": {
      "texte": "<p>Le projet de prévision de ventes ou de demande est un cas d'application classique des séries temporelles. Il consiste à utiliser des données historiques pour anticiper les ventes futures.</p>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Décrivez les principales composantes d'une série de ventes que vous devez identifier lors de l'analyse exploratoire.",
        "niveau": "easy",
        "reponse": "<p>Les principales composantes à identifier dans une série de ventes sont :</p><ul><li><strong>Tendance :</strong> L'évolution à long terme des ventes (hausse ou baisse sur plusieurs années). Par exemple, une croissance annuelle de 5% des ventes.</li><li><strong>Saisonnalité :</strong> Les variations régulières et prévisibles sur des périodes fixes (mensuelles, trimestrielles, annuelles). Par exemple, un pic de ventes en décembre pour les fêtes de fin d'année.</li><li><strong>Cycle :</strong> Les fluctuations non saisonnières sur des périodes plus longues (expansion/récession économique).</li><li><strong>Résidu/Bruit :</strong> Les variations aléatoires non expliquées par les autres composantes.</li></ul>",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Distinguez les données de ventes hebdomadaires des données de ventes mensuelles en termes de saisonnalité.",
            "niveau": "easy",
            "reponse": "<p><strong>Données hebdomadaires :</strong> La saisonnalité est plus complexe avec des cycles hebdomadaires (week-end vs semaine) et annuels. Il peut y avoir des jours fériés qui créent des effets particuliers.</p><p><strong>Données mensuelles :</strong> La saisonnalité est plus régulière avec des patterns annuels (période des soldes, vacances, etc.). L'identification de la saisonnalité est généralement plus facile car la période est fixe (s=12).</p><p>Le choix de la granularité dépend des besoins métier et de la disponibilité des données.</p>"
          }
        ]
      }
    ]
  },
  {
    "intitule": "Analyse exploratoire des ventes",
    "type": "competence",
    "niveau": "medium",
    "enonce": {
      "texte": "<p>Vous êtes consultant en data science pour une entreprise de commerce électronique. Vous recevez un fichier CSV contenant les ventes quotidiennes des trois dernières années. Voici les premières lignes du fichier :</p><pre>date, ventes<br>2021-01-01, 1523<br>2021-01-02, 1487<br>2021-01-03, 1621<br>...<br>2023-12-31, 2845</pre>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Décrivez les étapes d'analyse exploratoire que vous réaliseriez sur ces données avant de commencer la modélisation.",
        "niveau": "medium",
        "reponse": "<p><strong>Étapes de l'analyse exploratoire :</strong></p><ol><li><strong>Visualisation de la série :</strong> Tracer la série temporelle pour identifier visuellement la tendance et la saisonnalité.</li><li><strong>Décomposition de la série :</strong> Utiliser une méthode de décomposition (additive ou multiplicative) pour extraire la tendance, la saisonnalité et les résidus.</li><li><strong>Test de stationnarité :</strong> Appliquer le test ADF et KPSS pour vérifier si la série est stationnaire.</li><li><strong>Analyse des corrélations :</strong> Calculer et analyser l'ACF et la PACF pour identifier la structure de dépendance temporelle.</li><li><strong>Identification des valeurs aberrantes :</strong> Détecter les points anormaux (pics, creux) qui pourraient être des erreurs ou des événements spéciaux.</li><li><strong>Analyse de la saisonnalité :</strong> Utiliser un graphique des sous-séries saisonnières pour visualiser les patterns par mois ou par jour.</li></ol>",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Expliquez comment vous utiliseriez un graphique des sous-séries saisonnières pour analyser les ventes et ce que vous chercheriez à y observer.",
            "niveau": "medium",
            "reponse": "<p>Un graphique des sous-séries saisonnières (seasonal subseries plot) permet de visualiser les données regroupées par saison (mois, trimestres, jours de la semaine).</p><p><strong>Ce qu'on cherche à y observer :</strong></p><ul><li>L'évolution des ventes pour chaque mois au fil des années : permet d'identifier des tendances spécifiques à chaque saison.</li><li>La variabilité intra-saisonnière : certains mois peuvent être plus volatils que d'autres.</li><li>La stabilité du pattern saisonnier : si le pattern change d'une année à l'autre, cela peut indiquer une évolution des comportements des consommateurs.</li><li>Des anomalies : des mois qui s'écartent significativement du pattern habituel peuvent indiquer des événements particuliers (promotions, ruptures de stock).</li></ul>",
            "niveau": "medium"
          }
        ]
      }
    ]
  },
  {
    "intitule": "Prévision des ventes avec SARIMA",
    "type": "competence",
    "niveau": "hard",
    "enonce": {
      "texte": "<p>Après analyse exploratoire, vous constatez que les ventes présentent :</p><ul><li>Une tendance à la hausse</li><li>Une saisonnalité annuelle marquée (données mensuelles, s=12)</li><li>Un effet de la période des fêtes (décembre) très prononcé</li><li>Les tests ADF et KPSS indiquent que la série n'est pas stationnaire</li></ul>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Proposez un modèle SARIMA pour ce problème et justifiez le choix des paramètres.",
        "niveau": "hard",
        "reponse": "<p><strong>Modèle proposé :</strong> SARIMA(p,d,q)(P,D,Q,12)</p><p><strong>Choix des paramètres :</strong></p><ul><li><strong>d = 1</strong> : La série n'est pas stationnaire, une différenciation d'ordre 1 est nécessaire pour éliminer la tendance.</li><li><strong>D = 1</strong> : La saisonnalité annuelle est forte, une différenciation saisonnière d'ordre 1 est nécessaire.</li><li><strong>p et q</strong> : À déterminer par l'analyse de l'ACF et PACF de la série après les différenciations.</li><li><strong>P et Q</strong> : À déterminer par l'analyse de l'ACF et PACF aux décalages saisonniers (12, 24, 36...).</li></ul><p>Après examen des corrélégrammes, on pourrait proposer un SARIMA(1,1,1)(1,1,1,12) qui est souvent un bon point de départ pour des données avec saisonnalité annuelle et tendance.</p>",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Comparez l'approche SARIMA avec une approche LSTM pour ce problème de prévision de ventes.",
            "niveau": "hard",
            "reponse": "<p><strong>Avantages de SARIMA :</strong></p><ul><li>Interprétabilité : les coefficients ont une signification claire.</li><li>Nécessite moins de données pour un bon ajustement.</li><li>Rapide à estimer.</li><li>Permet de construire des intervalles de confiance directement.</li></ul><p><strong>Avantages de LSTM :</strong></p><ul><li>Capacité à capturer des relations non linéaires complexes.</li><li>Peut intégrer automatiquement de nombreuses variables exogènes.</li><li>Performance potentiellement meilleure sur de longues séries.</li></ul><p><strong>Choix :</strong> Pour ce problème, SARIMA est un bon point de départ en raison de la saisonnalité claire. Si les performances ne sont pas satisfaisantes, on peut comparer avec LSTM. L'approche combinée (ensemble) peut aussi être envisagée.</p>",
            "niveau": "hard"
          },
          {
            "numero": "1.b",
            "texte": "Proposez une stratégie pour valider le modèle SARIMA avant de l'utiliser en production.",
            "niveau": "hard",
            "reponse": "<p><strong>Stratégie de validation :</strong></p><ol><li><strong>Validation croisée temporelle :</strong> Diviser les données en ensemble d'entraînement (70%) et de test (30%) en respectant l'ordre temporel.</li><li><strong>Analyse des résidus :</strong> Vérifier que les résidus sont du bruit blanc (test de Ljung-Box, normalité).</li><li><strong>Comparaison des critères :</strong> Utiliser AIC et BIC pour comparer différents modèles.</li><li><strong>Backtesting :</strong> Reconstruire le modèle sur différents sous-ensembles et vérifier la stabilité des paramètres.</li><li><strong>Mesures de performance :</strong> Calculer RMSE, MAE et MAPE sur l'ensemble de test.</li><li><strong>Analyse des prévisions :</strong> Vérifier que les prévisions sont cohérentes avec le comportement attendu de la série.</li></ol>",
            "niveau": "hard"
          }
        ]
      }
    ]
  },
  {
    "intitule": "Application pratique à la prévision de la demande",
    "type": "competence",
    "niveau": "very hard",
    "enonce": {
      "texte": "<p>Une chaîne de supermarchés vous demande de prévoir la demande pour un produit frais (pain) dans un de ses magasins. Vous disposez des données suivantes :</p><ul><li>Ventes quotidiennes du produit (3 ans de données)</li><li>Données météo (température, précipitations)</li><li>Jours fériés</li><li>Promotions appliquées</li><li>Prix du produit et des produits concurrents</li></ul>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Concevez une méthodologie complète pour prévoir la demande de ce produit, en justifiant vos choix méthodologiques.",
        "niveau": "very hard",
        "reponse": "<p><strong>Méthodologie complète :</strong></p><p><strong>Étape 1 : Préparation des données</strong></p><ul><li>Nettoyage des données : gestion des valeurs manquantes, des doublons.</li><li>Agrégation et alignement temporel des différentes sources.</li><li>Création de variables dérivées (jour de la semaine, mois, indicateur de week-end).</li></ul><p><strong>Étape 2 : Analyse exploratoire</strong></p><ul><li>Visualisation de la série et de ses composantes.</li><li>Analyse de corrélation entre les ventes et les variables exogènes.</li><li>Identification des périodes de forte variation (fêtes).</li></ul><p><strong>Étape 3 : Modélisation avec SARIMAX</strong></p><ul><li>Intégrer les variables exogènes (météo, promotions, jours fériés).</li><li>Utiliser SARIMAX(p,d,q)(P,D,Q,s) avec s=7 (saisonnalité hebdomadaire) ou s=365 (annuelle).</li><li>Estimer les paramètres par maximum de vraisemblance.</li></ul><p><strong>Étape 4 : Modélisation avec LSTM</strong></p><ul><li>Préparer les données en séquences glissantes (fenêtres de 30 jours).</li><li>Intégrer les variables exogènes comme entrées supplémentaires.</li><li>Entraîner un modèle LSTM multicouche.</li></ul><p><strong>Étape 5 : Comparaison et sélection</strong></p><ul><li>Comparer les performances des deux approches sur l'ensemble de test.</li><li>Utiliser le modèle le plus performant ou une combinaison des deux.</li></ul>",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Discutez des avantages et des limites du SARIMAX par rapport au LSTM pour ce problème spécifique.",
            "niveau": "very hard",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
