<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Séries Temporelles et Données Séquentielles - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Composants d'un HMM",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Un HMM est utilisé pour modéliser les changements de régimes dans une série temporelle financière. Les données observées sont les rendements quotidiens d'une action.</p><p><strong>Consigne :</strong> Répondez aux questions suivantes en vous basant sur vos connaissances des HMM.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Définissez les trois principaux composants d'un HMM dans le contexte de l'analyse de séries temporelles.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les trois composants d'un HMM sont :</p><ul><li><strong>Les états cachés</strong> : Ce sont les régimes de marché non observables (ex: haussier, baissier, latéral).</li><li><strong>Les observations</strong> : Ce sont les données mesurables, comme les rendements de l'action.</li><li><strong>La matrice de transition</strong> : Elle contient les probabilités de passer d'un état à un autre entre deux instants consécutifs.</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Expliquez la propriété de Markov et son importance dans le fonctionnement d'un HMM.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La propriété de Markov stipule que la probabilité de se trouver dans un état futur ne dépend que de l'état présent, et non de l'historique complet des états passés. Mathématiquement, cela s'écrit :</p><div class='math-block'><div class='math'>$$ P(q_t = S_j | q_{t-1} = S_i, q_{t-2} = S_k, ...) = P(q_t = S_j | q_{t-1} = S_i) $$</div></div><p>Cette propriété est fondamentale car elle rend le modèle mathématiquement traitable et permet d'utiliser des algorithmes comme Viterbi ou Baum-Welch.</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3.</strong> Dans le contexte de la modélisation des rendements financiers, comment sont généralement modélisées les probabilités d'émission ?</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Les probabilités d'émission sont généralement modélisées par des distributions gaussiennes (normales) :</p><div class='math-block'><div class='math'>$$ P(O_t | q_t = S_i) = \\frac{1}{\\sqrt{2\\pi\\sigma_i^2}} \\exp\\left(-\\frac{(O_t - \\mu_i)^2}{2\\sigma_i^2}\\right) $$</div></div><p>Chaque état $S_i$ est associé à une moyenne $\\mu_i$ (rendement moyen) et une variance $\\sigma_i^2$ (volatilité) qui lui sont propres. Cette modélisation est justifiée par la distribution souvent approximativement normale des rendements financiers.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Algorithme de Viterbi",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>On considère un HMM avec 2 états cachés :</p><ul><li>$S_1$ : marché calme (volatilité faible)</li><li>$S_2$ : marché volatile (volatilité élevée)</li></ul><p>Les paramètres du modèle sont les suivants :</p><p><strong>Probabilités initiales :</strong></p><ul><li>$\\pi(S_1) = 0.7$</li><li>$\\pi(S_2) = 0.3$</li></ul><p><strong>Matrice de transition :</strong></p><ul><li>$P(S_1 \\rightarrow S_1) = 0.8$, $P(S_1 \\rightarrow S_2) = 0.2$</li><li>$P(S_2 \\rightarrow S_1) = 0.3$, $P(S_2 \\rightarrow S_2) = 0.7$</li></ul><p><strong>Probabilités d'émission (observations discrètes) :</strong></p><ul><li>$P(\\text{Hausse} | S_1) = 0.7$, $P(\\text{Baisse} | S_1) = 0.3$</li><li>$P(\\text{Hausse} | S_2) = 0.4$, $P(\\text{Baisse} | S_2) = 0.6$</li></ul><p>On observe la séquence : <strong>Hausse, Baisse, Hausse</strong> (soit H, B, H).</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Calculez les probabilités initiales pour la première observation (t=1, H).</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>$v_1(S_1) = \\pi(S_1) \\times P(H|S_1) = 0.7 \\times 0.7 = 0.49$</p><p>$v_1(S_2) = \\pi(S_2) \\times P(H|S_2) = 0.3 \\times 0.4 = 0.12$</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Calculez les probabilités pour la deuxième observation (t=2, B). Déterminez le chemin optimal.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>$v_2(S_1) = \\max(v_1(S_1) \\times P(S_1\\rightarrow S_1), v_1(S_2) \\times P(S_2\\rightarrow S_1)) \\times P(B|S_1)$</p><p>$= \\max(0.49 \\times 0.8, 0.12 \\times 0.3) \\times 0.3$</p><p>$= \\max(0.392, 0.036) \\times 0.3 = 0.392 \\times 0.3 = 0.1176$</p><p>$v_2(S_2) = \\max(v_1(S_1) \\times P(S_1\\rightarrow S_2), v_1(S_2) \\times P(S_2\\rightarrow S_2)) \\times P(B|S_2)$</p><p>$= \\max(0.49 \\times 0.2, 0.12 \\times 0.7) \\times 0.6$</p><p>$= \\max(0.098, 0.084) \\times 0.6 = 0.098 \\times 0.6 = 0.0588$</p><p>Le chemin optimal pour arriver en $S_1$ vient de $S_1 \\rightarrow S_1$. Le chemin optimal pour arriver en $S_2$ vient de $S_1 \\rightarrow S_2$.</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3.</strong> Calculez les probabilités pour la troisième observation (t=3, H) et déterminez la séquence d'états la plus probable.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>$v_3(S_1) = \\max(v_2(S_1) \\times P(S_1\\rightarrow S_1), v_2(S_2) \\times P(S_2\\rightarrow S_1)) \\times P(H|S_1)$</p><p>$= \\max(0.1176 \\times 0.8, 0.0588 \\times 0.3) \\times 0.7$</p><p>$= \\max(0.09408, 0.01764) \\times 0.7 = 0.09408 \\times 0.7 = 0.065856$</p><p>$v_3(S_2) = \\max(v_2(S_1) \\times P(S_1\\rightarrow S_2), v_2(S_2) \\times P(S_2\\rightarrow S_2)) \\times P(H|S_2)$</p><p>$= \\max(0.1176 \\times 0.2, 0.0588 \\times 0.7) \\times 0.4$</p><p>$= \\max(0.02352, 0.04116) \\times 0.4 = 0.04116 \\times 0.4 = 0.016464$</p><p>La séquence d'états la plus probable est : $S_1 \\rightarrow S_1 \\rightarrow S_1$ (marché calme, calme, calme).</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4.</strong> Interprétez ces résultats. Que signifie cette séquence d'états en termes de comportement du marché ?</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La séquence $S_1 \\rightarrow S_1 \\rightarrow S_1$ indique que le marché est resté calme sur les trois jours observés. Cela signifie que :</p><ul><li>Le marché n'a pas connu de choc majeur</li><li>La volatilité est restée faible</li><li>Les rendements sont restés relativement stables</li></ul><p>Cette interprétation est cohérente avec la séquence observée H, B, H qui montre une alternance de hausses et baisses de faible amplitude, caractéristique d'un marché calme.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Segmentation de Série Temporelle avec HMM",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Vous êtes data scientist dans une entreprise de maintenance industrielle. Vous disposez de données de capteurs mesurant la température d'un moteur toutes les heures pendant 30 jours. Le moteur peut être dans trois états de fonctionnement :</p><ul><li><strong>État 1</strong> : Fonctionnement normal (température moyenne 45°C, faible variance)</li><li><strong>État 2</strong> : Surveillance (température moyenne 55°C, variance modérée)</li><li><strong>État 3</strong> : Critique (température moyenne 70°C, forte variance)</li></ul><p>Vous souhaitez utiliser un HMM pour segmenter la série temporelle et identifier les périodes où le moteur est dans un état critique.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Décrivez les composants du HMM dans ce contexte industriel.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><ul><li><strong>États cachés</strong> : Les trois états de fonctionnement du moteur (Normal, Surveillance, Critique)</li><li><strong>Observations</strong> : Les mesures de température relevées par les capteurs</li><li><strong>Matrice de transition</strong> : Les probabilités de passer d'un état à l'autre (ex: normal → surveillance, surveillance → critique)</li><li><strong>Probabilités d'émission</strong> : Modélisées par des distributions gaussiennes $\\mathcal{N}(\\mu_i, \\sigma_i^2)$ où $\\mu_i$ et $\\sigma_i$ sont la moyenne et l'écart-type de la température pour chaque état</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Quelle approche méthodologique proposez-vous pour l'apprentissage du modèle ?</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Démarche proposée :</strong></p><ol><li><strong>Préparation des données</strong> : Nettoyer les données (valeurs manquantes, outliers), normaliser si nécessaire</li><li><strong>Initialisation</strong> : Utiliser un clustering (K-means) pour initialiser les paramètres des distributions d'émission</li><li><strong>Apprentissage</strong> : Appliquer l'algorithme de Baum-Welch (EM) pour estimer les paramètres du modèle</li><li><strong>Validation</strong> : Utiliser un ensemble de validation pour éviter le surapprentissage</li><li><strong>Sélection du modèle</strong> : Réaliser plusieurs initialisations aléatoires et sélectionner le modèle avec la plus grande vraisemblance</li></ol></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>3.</strong> Une fois le modèle entraîné, comment procédez-vous pour détecter les périodes critiques ?</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Détection des périodes critiques :</strong></p><ol><li>Appliquer l'algorithme de Viterbi sur l'ensemble des données pour obtenir la séquence d'états la plus probable</li><li>Identifier dans cette séquence les segments où le moteur est dans l'État 3 (Critique)</li><li>Visualiser les résultats en superposant la séquence d'états à la série temporelle</li><li>Mettre en place un système d'alerte lorsque le modèle détecte une transition vers l'État critique</li></ol></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>4.</strong> Comparez brièvement l'approche HMM avec une approche par seuillage simple (ex: alerte quand T > 65°C).</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Avantages du HMM par rapport au seuillage simple :</strong></p><ul><li>Le HMM prend en compte la dynamique temporelle (probabilités de transition)</li><li>Il est plus robuste aux fluctuations aléatoires : une courte dépassement de seuil peut être ignoré si elle est considérée comme peu probable par le modèle</li><li>Il fournit une probabilité d'être dans chaque état, ce qui permet une évaluation du risque</li><li>Il permet de détecter les transitions progressives entre états (ex: normal → surveillance → critique)</li></ul><p><strong>Inconvénients :</strong></p><ul><li>Plus complexe à implémenter et à maintenir</li><li>Nécessite plus de données pour l'apprentissage</li><li>Moins interprétable qu'une règle simple</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
