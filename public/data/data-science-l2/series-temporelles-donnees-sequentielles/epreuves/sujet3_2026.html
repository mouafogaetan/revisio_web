<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Séries Temporelles et Données Séquentielles",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Composantes d'une série temporelle et Stationnarité",
      "points": "6 pts",
      "enonce": "<p>On considère une série temporelle trimestrielle des ventes d'une entreprise camerounaise sur la période 2015-2024. Les données présentent une tendance à la hausse, des pics de ventes pendant les fêtes de fin d'année ainsi qu'un cycle économique d'environ 5 ans. On vous demande d'analyser cette série.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Identifiez et décrivez les quatre composantes principales de cette série temporelle en les reliant au contexte décrit.</p>",
          "reponse": "<p><strong>Tendance :</strong> Mouvement à long terme à la hausse des ventes sur la période 2015-2024, reflétant la croissance de l'entreprise.</p><p><strong>Saisonnalité :</strong> Fluctuations régulières et prévisibles avec des pics pendant les fêtes de fin d'année, se répétant chaque année.</p><p><strong>Cycle :</strong> Mouvement économique d'environ 5 ans, correspondant aux fluctuations de l'économie camerounaise.</p><p><strong>Résidu :</strong> Partie aléatoire ou irrégulière non expliquée par les trois autres composantes.</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Définissez la stationnarité faible (ou stationnarité du second ordre). Pourquoi est-il important de vérifier cette propriété avant de modéliser une série temporelle avec un modèle ARIMA ?</p>",
          "reponse": "<p>La stationnarité faible signifie que la moyenne et la variance sont constantes dans le temps et que l'autocovariance ne dépend que du décalage temporel et non de la position dans le temps. Mathématiquement, pour tout t et tout k :</p><div class='math-block'><div class='math'>$$E(Y_t) = \\mu$$</div><div class='math'>$$Var(Y_t) = \\sigma^2$$</div><div class='math'>$$Cov(Y_t, Y_{t-k}) = \\gamma_k$$</div></div><p>La vérification de la stationnarité est essentielle car les modèles ARIMA supposent que la série est stationnaire pour une estimation fiable des paramètres. Une série non stationnaire peut conduire à des relations fallacieuses (régression fallacieuse) et à des prévisions non fiables.</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Expliquez brièvement le principe du test de Dickey-Fuller Augmenté (ADF). Quelle est l'hypothèse nulle de ce test ?</p>",
          "reponse": "<p>Le test ADF est un test de racine unitaire. Son principe est de tester la présence d'une racine unitaire dans le processus autorégressif de la série. Il s'agit d'une extension du test de Dickey-Fuller qui inclut des termes de décalage pour tenir compte d'une éventuelle autocorrélation d'ordre supérieur.</p><p><strong>Hypothèse nulle (H₀) :</strong> La série possède une racine unitaire, c'est-à-dire qu'elle est non stationnaire.</p><p><strong>Hypothèse alternative (H₁) :</strong> La série est stationnaire (ou trend-stationnaire selon la spécification du test).</p><p>Si la statistique de test est inférieure à la valeur critique, on rejette H₀ et on conclut à la stationnarité.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Modèles ARMA et ARIMA",
      "points": "7 pts",
      "enonce": "<p>On s'intéresse à la modélisation des rendements quotidiens d'une action cotée à la Bourse de Douala. Après avoir rendu la série stationnaire, on estime plusieurs modèles et on obtient les résultats d'identification suivants : l'autocorrélogramme (ACF) présente une décroissance exponentielle, tandis que l'autocorrélogramme partiel (PACF) présente une coupure après le décalage 2.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1.5 pts)</strong> En vous basant sur les informations fournies par l'ACF et le PACF, quel modèle ARIMA serait le plus approprié pour ces données ? Justifiez votre réponse.</p>",
          "reponse": "<p>Il s'agit d'un modèle AR(2) ou ARIMA(2,0,0).</p><p><strong>Justification :</strong></p><ul><li>L'ACF avec décroissance exponentielle est caractéristique d'un processus autorégressif (AR).</li><li>Le PACF avec coupure après le décalage 2 indique que l'ordre du processus AR est p=2.</li><li>Ainsi, le modèle recommandé est ARIMA(2,0,0).</li></ul>"
        },
        {
          "question": "<p><strong>2) (1.5 pts)</strong> On décide finalement d'estimer un modèle ARIMA(1,1,1). Écrivez l'équation de ce modèle.</p>",
          "reponse": "<p>Un modèle ARIMA(1,1,1) est un modèle avec une différenciation d'ordre 1, une partie autorégressive d'ordre 1 et une partie moyenne mobile d'ordre 1.</p><p>En posant \( W_t = Y_t - Y_{t-1} \), l'équation est :</p><div class='math-block'><div class='math'>$$ W_t = c + \\phi_1 W_{t-1} + \\theta_1 \\varepsilon_{t-1} + \\varepsilon_t $$</div></div><p>En remplaçant \( W_t \) :</p><div class='math-block'><div class='math'>$$ Y_t - Y_{t-1} = c + \\phi_1 (Y_{t-1} - Y_{t-2}) + \\theta_1 \\varepsilon_{t-1} + \\varepsilon_t $$</div></div>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Pour sélectionner le meilleur modèle parmi plusieurs candidats ARIMA, on utilise les critères AIC et BIC. Définissez ces deux critères et expliquez comment ils permettent de trancher entre plusieurs modèles.</p>",
          "reponse": "<p><strong>AIC (Critère d'information d'Akaike) :</strong> \( AIC = -2\\ln(L) + 2k \) où L est la vraisemblance maximisée et k le nombre de paramètres du modèle.</p><p><strong>BIC (Critère d'information bayésien) :</strong> \( BIC = -2\\ln(L) + k\\ln(n) \) où n est le nombre d'observations.</p><p>Ces deux critères pénalisent la complexité du modèle (nombre de paramètres), le BIC ayant une pénalité plus forte (k ln(n) vs 2k).</p><p>Le principe de sélection est le suivant : on calcule les critères pour chaque modèle candidat, et on retient celui qui a la plus petite valeur. Le BIC est asymptotiquement consistant (il sélectionne le bon modèle quand la taille de l'échantillon est grande), tandis que l'AIC est plus efficace mais peut sélectionner des modèles plus complexes.</p>"
        },
        {
          "question": "<p><strong>4) (2 pts)</strong> Une fois le modèle ARIMA sélectionné et estimé, on vérifie la qualité de l'ajustement en analysant les résidus. Expliquez ce que le test de Ljung-Box permet de vérifier et comment interpréter son résultat.</p>",
          "reponse": "<p>Le test de Ljung-Box est un test d'autocorrélation des résidus. Il permet de vérifier si les résidus du modèle sont indépendants (absence d'autocorrélation).</p><p>La statistique du test est :</p><div class='math-block'><div class='math'>$$ Q = n(n+2)\\sum_{k=1}^{m} \\frac{\\hat{\\rho}_k^2}{n-k} $$</div></div><p>où \( \\hat{\\rho}_k \) sont les autocorrélations estimées des résidus, n la taille de l'échantillon, et m le nombre de décalages considérés.</p><p><strong>Interprétation :</strong></p><ul><li><strong>Hypothèse nulle (H₀) :</strong> Les résidus sont indépendants (pas d'autocorrélation).</li><li>Si la p-value est supérieure à 0.05, on ne rejette pas H₀ : les résidus sont bien indépendants, le modèle est adéquat.</li><li>Si la p-value est inférieure à 0.05, on rejette H₀ : il reste de l'autocorrélation dans les résidus, le modèle doit être amélioré.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Modèles Saisonniers et VAR",
      "points": "7 pts",
      "enonce": "<p>Une entreprise de production d'électricité au Cameroun souhaite prévoir sa demande mensuelle d'énergie. Les données montrent une saisonnalité annuelle (plus de consommation en saison sèche) et une tendance à la hausse. Par ailleurs, une autre série, le prix de l'énergie, semble avoir une influence sur la demande.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Proposez un modèle SARIMA pour modéliser cette série de demande d'énergie. Justifiez les composantes du modèle et indiquez comment s'écrit la notation SARIMA.</p>",
          "reponse": "<p>Pour modéliser une série mensuelle avec tendance et saisonnalité annuelle, on utilise un modèle SARIMA (Seasonal ARIMA).</p><p><strong>Notation :</strong> SARIMA(p,d,q)(P,D,Q)ₛ, où s = 12 (données mensuelles).</p><p><strong>Composantes :</strong></p><ul><li>(p,d,q) : partie non saisonnière (AR, différenciation, MA).</li><li>(P,D,Q) : partie saisonnière (AR saisonnier, différenciation saisonnière, MA saisonnier).</li><li>s : période saisonnière (ici s = 12).</li></ul><p><strong>Exemple de modèle :</strong> SARIMA(1,1,1)(1,1,1)₁₂</p><ul><li>d=1 : une différenciation pour éliminer la tendance.</li><li>D=1 : une différenciation saisonnière pour éliminer la saisonnalité annuelle.</li><li>p=1, P=1, q=1, Q=1 : composantes AR et MA aux ordres 1.</li></ul>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Si on souhaite intégrer le prix de l'énergie comme variable explicative, quel modèle peut-on utiliser ? Quel est l'intérêt de cette approche ?</p>",
          "reponse": "<p>On peut utiliser un modèle SARIMAX (SARIMA avec variables exogènes).</p><p>L'intérêt est de prendre en compte l'influence du prix sur la demande d'énergie, ce qui permet d'améliorer les prévisions en intégrant une information complémentaire. Le modèle devient :</p><div class='math-block'><div class='math'>$$ Y_t = \\beta X_t + \\text{partie SARIMA} $$</div></div><p>où \( X_t \) est le prix de l'énergie à l'instant t.</p>"
        },
        {
          "question": "<p><strong>3) (3 pts)</strong> Pour une analyse conjointe de la demande d'énergie et du prix, on propose un modèle VAR. Répondez aux questions suivantes :</p><p>a) Qu'est-ce qu'un modèle VAR(p) et dans quel contexte est-il approprié ?</p><p>b) Comment détermine-t-on l'ordre p d'un modèle VAR ?</p><p>c) Quelle est l'équation générale d'un VAR(p) à deux variables ?</p>",
          "reponse": "<p><strong>a) Modèle VAR(p) :</strong> Le modèle VAR (Vector AutoRegressive) est un modèle pour séries temporelles multivariées où chaque variable est expliquée par ses propres valeurs passées et par les valeurs passées des autres variables du système. Il est approprié lorsqu'on étudie des interactions dynamiques entre plusieurs variables (ici demande et prix).</p><p><strong>b) Détermination de l'ordre p :</strong> L'ordre p du VAR est généralement déterminé à l'aide des critères d'information (AIC, BIC) en sélectionnant l'ordre qui minimise ces critères. On peut aussi utiliser le test du rapport de vraisemblance.</p><p><strong>c) Équation générale d'un VAR(p) à deux variables :</strong></p><p>Soit \( Y_t = \\begin{pmatrix} y_{1t} \\\\ y_{2t} \\end{pmatrix} \), avec \( y_{1t} \) la demande et \( y_{2t} \) le prix.</p><div class='math-block'><div class='math'>$$ Y_t = c + \\Phi_1 Y_{t-1} + \\Phi_2 Y_{t-2} + ... + \\Phi_p Y_{t-p} + \\varepsilon_t $$</div></div><p>où :</p><ul><li>c est un vecteur de constantes (2x1).</li><li>\( \\Phi_i \) sont des matrices de coefficients (2x2) pour chaque décalage i.</li><li>\( \\varepsilon_t \) est un vecteur d'erreurs (bruit blanc multivarié).</li></ul><p>En détail, pour y₁ (demande) :</p><div class='math-block'><div class='math'>$$ y_{1t} = c_1 + \\phi_{11}^{(1)} y_{1,t-1} + \\phi_{12}^{(1)} y_{2,t-1} + ... + \\phi_{11}^{(p)} y_{1,t-p} + \\phi_{12}^{(p)} y_{2,t-p} + \\varepsilon_{1t} $$</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
