<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Séries Temporelles et Données Séquentielles - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Stationnarité et Modèles ARIMA",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>On considère une série temporelle <span style='font-style: italic;'>Y</span><sub><span style='font-style: italic;'>t</span></sub> représentant le nombre de passagers d'une compagnie aérienne, observée mensuellement de 2000 à 2025. On souhaite modéliser cette série à l'aide d'un modèle ARIMA.</p>\n  <p>Les étapes préliminaires de l'analyse ont donné les résultats suivants :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li>Le test ADF (Dickey-Fuller Augmenté) sur la série brute donne une p-valeur de 0.45.</li>\n    <li>Le test ADF sur la série différenciée une fois (différence d'ordre 1) donne une p-valeur de 0.01.</li>\n    <li>Le corrélogramme (ACF) de la série différenciée montre une décroissance exponentielle avec une forte autocorrélation au lag 1.</li>\n    <li>Le corrélogramme (PACF) de la série différenciée montre une coupure après le lag 1.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "1) La série brute est-elle stationnaire ? Justifier votre réponse à l'aide des résultats du test ADF.",
          "reponse": "<p>Non, la série brute n'est pas stationnaire. Le test ADF a une p-valeur de 0.45, ce qui est supérieur au seuil de significativité de 5% (ou 1%). On ne peut donc pas rejeter l'hypothèse nulle de présence d'une racine unitaire. La série est donc non stationnaire.</p>"
        },
        {
          "question": "2) Quel ordre de différenciation <span style='font-style: italic;'>d</span> faut-il choisir pour un modèle ARIMA ? Justifier.",
          "reponse": "<p>Il faut choisir <span style='font-style: italic;'>d</span> = 1. Le test ADF sur la série différenciée une fois donne une p-valeur de 0.01, ce qui est inférieur au seuil de 5%. On rejette donc l'hypothèse de racine unitaire, et la série différenciée est stationnaire. Une seule différenciation est suffisante.</p>"
        },
        {
          "question": "3) En analysant les corrélogrammes ACF et PACF de la série différenciée, quel modèle ARIMA semble approprié ? Justifier en identifiant les ordres <span style='font-style: italic;'>p</span> et <span style='font-style: italic;'>q</span>.",
          "reponse": "<p>Le PACF montre une coupure après le lag 1, ce qui suggère un ordre <span style='font-style: italic;'>p</span> = 1 (modèle autorégressif d'ordre 1). L'ACF montre une décroissance exponentielle, ce qui est cohérent avec un modèle autorégressif. Le modèle ARIMA approprié serait donc ARIMA(1,1,0) : un modèle autorégressif d'ordre 1 avec une différenciation d'ordre 1.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Modèles SARIMA et Prévision Saisonnière",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>On s'intéresse à la série des ventes mensuelles d'un magasin de détail, qui présente une forte saisonnalité annuelle. Après analyse, on propose un modèle SARIMA(1,0,0)(1,1,0)<sub>12</sub> pour modéliser les ventes.</p>\n  <p>On rappelle l'équation générale d'un modèle SARIMA :</p>\n  <div class='math-block' style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.1em; color: #1a1a1a;'>\n      $$ \\Phi_P(B^s) \\phi_p(B) \\nabla^d \\nabla_s^D Y_t = \\Theta_Q(B^s) \\theta_q(B) \\epsilon_t $$\n    </div>\n  </div>\n</div>",
      "questions": [
        {
          "question": "1) Décomposer le modèle SARIMA(1,0,0)(1,1,0)<sub>12</sub> en identifiant clairement les composantes non saisonnières et saisonnières. Que représentent les nombres entre parenthèses ?",
          "reponse": "<p>Le modèle SARIMA(1,0,0)(1,1,0)<sub>12</sub> se décompose comme suit :</p><ul><li><strong>Partie non saisonnière :</strong> (1,0,0) signifie <span style='font-style: italic;'>p</span>=1 (ordre autorégressif non saisonnier), <span style='font-style: italic;'>d</span>=0 (pas de différenciation non saisonnière), <span style='font-style: italic;'>q</span>=0 (pas de moyenne mobile non saisonnière).</li><li><strong>Partie saisonnière :</strong> (1,1,0)<sub>12</sub> signifie <span style='font-style: italic;'>P</span>=1 (ordre autorégressif saisonnier), <span style='font-style: italic;'>D</span>=1 (différenciation saisonnière d'ordre 1, de période 12), <span style='font-style: italic;'>Q</span>=0 (pas de moyenne mobile saisonnière).</li></ul>"
        },
        {
          "question": "2) Écrire explicitement l'équation de ce modèle SARIMA en utilisant l'opérateur de retard <span style='font-style: italic;'>B</span>.",
          "reponse": "<p>L'équation du modèle SARIMA(1,0,0)(1,1,0)<sub>12</sub> est :</p><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ (1 - \\phi_1 B)(1 - \\Phi_1 B^{12}) \\nabla_{12} Y_t = \\epsilon_t $$</div></div><p>où <span style='font-style: italic;'>\\nabla_{12} Y_t = Y_t - Y_{t-12}</span> est la différenciation saisonnière, <span style='font-style: italic;'>\\phi_1</span> est le paramètre AR non saisonnier, et <span style='font-style: italic;'>\\Phi_1</span> est le paramètre AR saisonnier.</p>"
        },
        {
          "question": "3) Expliquer l'utilité de la différenciation saisonnière dans ce modèle. Pourquoi est-elle nécessaire ?",
          "reponse": "<p>La différenciation saisonnière est nécessaire pour éliminer la tendance saisonnière présente dans les données. Comme les ventes mensuelles présentent une forte saisonnalité annuelle, la différenciation saisonnière d'ordre 1 (période 12) permet de stabiliser la série en supprimant la composante saisonnière. Cela rend la série stationnaire, ce qui est une condition pour l'application des modèles ARIMA.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Application pratique des HMM",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>On souhaite modéliser les rendements quotidiens d'une action à l'aide d'un modèle de Markov caché (HMM). On suppose que les rendements peuvent être dans deux régimes : un régime de faible volatilité (état 1) et un régime de forte volatilité (état 2).</p>\n  <p>Les paramètres du HMM sont les suivants :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li>Matrice de transition : <div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ P = \\begin{pmatrix} 0.8 & 0.2 \\\\ 0.3 & 0.7 \\end{pmatrix} $$</div></li>\n    <li>Probabilités initiales : <div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ \\pi = (0.6, 0.4) $$</div></li>\n    <li>Les rendements suivent une loi normale dans chaque état : état 1 : <span style='font-style: italic;'>\\mu</span><sub>1</sub> = 0.001, <span style='font-style: italic;'>\\sigma</span><sub>1</sub> = 0.01 ; état 2 : <span style='font-style: italic;'>\\mu</span><sub>2</sub> = -0.002, <span style='font-style: italic;'>\\sigma</span><sub>2</sub> = 0.03.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "1) Quelle est la probabilité d'être dans l'état 1 au temps <span style='font-style: italic;'>t</span> = 2 si l'on était dans l'état 1 au temps <span style='font-style: italic;'>t</span> = 1 ?",
          "reponse": "<p>La probabilité de transition de l'état 1 à l'état 1 est donnée par le premier élément de la première ligne de la matrice de transition : <span style='font-weight: bold;'>0.8</span>. Il y a 80% de chances de rester dans l'état 1 (faible volatilité).</p>"
        },
        {
          "question": "2) Sachant que l'on observe un rendement <span style='font-style: italic;'>R</span> = 0.02 au temps <span style='font-style: italic;'>t</span>, quelle est la vraisemblance d'observer ce rendement dans l'état 2 ?",
          "reponse": "<p>On utilise la densité de la loi normale pour l'état 2 :</p><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>$$ f(R|\\text{état 2}) = \\frac{1}{\\sigma_2 \\sqrt{2\\pi}} \\exp\\left(-\\frac{(R - \\mu_2)^2}{2\\sigma_2^2}\\right) = \\frac{1}{0.03\\sqrt{2\\pi}} \\exp\\left(-\\frac{(0.02 + 0.002)^2}{2 \\times 0.03^2}\\right) $$</div></div><p>Le calcul donne une valeur d'environ 3.97.</p>"
        },
        {
          "question": "3) Interpréter les résultats : quel état est le plus probable au temps <span style='font-style: italic;'>t</span> si le rendement observé est fortement négatif (par exemple, <span style='font-style: italic;'>R</span> = -0.05) ? Justifier.",
          "reponse": "<p>Si le rendement est fortement négatif, l'état 2 (forte volatilité, rendement moyen négatif) est plus probable. En effet, <span style='font-style: italic;'>\\mu</span><sub>2</sub> = -0.002 est plus proche de -0.05 que <span style='font-style: italic;'>\\mu</span><sub>1</sub> = 0.001. De plus, la variance plus élevée dans l'état 2 (0.03) rend les rendements extrêmes plus probables. Le HMM permet donc de détecter les régimes de forte volatilité et de rendements négatifs, ce qui est utile pour la gestion de portefeuille.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Détection de Ruptures",
      "points": "4 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
