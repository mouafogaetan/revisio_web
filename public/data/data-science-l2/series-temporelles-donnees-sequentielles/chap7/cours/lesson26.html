<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'Analyse Spectrale",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.3em;'>Qu'est-ce que l'analyse spectrale ?</h2><p style='font-size: 1em; line-height: 1.6; color: #333;'>L'analyse spectrale est une méthode qui permet d'étudier les séries temporelles dans le <strong>domaine des fréquences</strong> plutôt que dans le domaine temporel. Elle décompose une série en ses composantes oscillatoires de différentes fréquences.</p><div style='background-color: #e8f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #1a5276;'><strong>Objectif :</strong> Identifier les cycles et les périodicités cachées dans les données temporelles.</p></div><div style='background-color: #fef9e7; padding: 10px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #7d6608;'><strong>Analogies :</strong> Comme un prisme qui décompose la lumière blanche en couleurs, l'analyse spectrale décompose un signal temporel en ses fréquences composantes.</p></div></div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons explorer l'analyse spectrale des séries temporelles. Cette approche est fondamentale car elle nous permet de voir nos données sous un angle complètement différent : celui des fréquences. Au lieu de regarder comment la série évolue dans le temps, nous allons voir quelles sont les fréquences ou cycles qui la composent. C'est comme si vous écoutiez un orchestre et que vous essayiez d'identifier chaque instrument, c'est exactement ce que fait l'analyse spectrale avec vos données !",
    "note": "L'analyse spectrale permet de passer du domaine temporel au domaine fréquentiel."
  },
  {
    "titre": "Domaine temporel vs Fréquentiel",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Deux visions complémentaires</h2><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Domaine temporel :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>On observe l'évolution de la série au fil du temps.</li><li>On voit les tendances, les saisonnalités, les cycles longs.</li><li>Utile pour la prévision et la détection de ruptures.</li></ul></div><div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Domaine fréquentiel :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>On observe la décomposition en fréquences de la série.</li><li>On identifie les cycles périodiques et leurs amplitudes.</li><li>Utile pour le filtrage, la compression et la détection de motifs.</li></ul></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>💡 Exemple :</strong> Les variations saisonnières (ex: ventes de Noël) apparaissent comme un pic à la fréquence annuelle.</p></div></div>",
    "texteParle": "Pour bien comprendre l'analyse spectrale, il faut d'abord distinguer deux manières de voir une série temporelle. Le domaine temporel, c'est ce que vous connaissez déjà : vous regardez comment les valeurs évoluent dans le temps. Le domaine fréquentiel, c'est nouveau : vous regardez quelles sont les fréquences qui composent votre signal. Un exemple simple : si vous avez des ventes qui augmentent chaque année pendant les fêtes de fin d'année, dans le domaine temporel, vous voyez des pics réguliers ; dans le domaine fréquentiel, vous verrez un pic à la fréquence annuelle. Les deux points de vue se complètent.",
    "note": "Le domaine temporel montre l'évolution temporelle, le domaine fréquentiel montre les cycles."
  },
  {
    "titre": "La Transformée de Fourier",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Le cœur de l'analyse spectrale</h2><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #7d6608; margin: 0;'><strong>Définition :</strong> La transformée de Fourier décompose un signal en une somme de sinusoïdes de différentes fréquences.</p></div><div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Formule fondamentale :</strong></p><div class='math-block'><div class='math' style='background: white; padding: 10px; border-radius: 6px;'>$$ X(f) = \\int_{-\\infty}^{\\infty} x(t) e^{-2\\pi i f t} dt $$</div></div><p style='color: #333; margin-top: 8px;'>Où :</p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li><span style='font-weight: bold;'>x(t)</span> est le signal dans le domaine temporel.</li><li><span style='font-weight: bold;'>X(f)</span> est le signal dans le domaine fréquentiel.</li><li><span style='font-weight: bold;'>f</span> représente la fréquence.</li></ul></div><div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Transformée de Fourier Discrète (TFD) :</strong> Version adaptée aux données discrètes (échantillonnées).</p><div class='math-block'><div class='math' style='background: white; padding: 10px; border-radius: 6px;'>$$ X_k = \\sum_{n=0}^{N-1} x_n e^{-2\\pi i \\frac{kn}{N}} $$</div></div></div></div>",
    "texteParle": "La transformée de Fourier est l'outil mathématique central de l'analyse spectrale. Elle permet de passer du domaine temporel au domaine fréquentiel. Concrètement, elle prend votre signal temporel et le décompose en une somme de sinusoïdes. Chaque sinusoïde a une fréquence, une amplitude et une phase différentes. La formule peut sembler complexe, mais retenez l'idée principale : la transformée de Fourier calcule pour chaque fréquence combien cette fréquence est présente dans votre signal. Pour des données discrètes, comme celles que nous manipulons, on utilise la transformée de Fourier discrète.",
    "note": "La transformée de Fourier décompose un signal en ses fréquences composantes."
  },
  {
    "titre": "Le Périodogramme",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Estimation de la densité spectrale</h2><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Définition :</strong> Le périodogramme est une estimation de la densité spectrale de puissance d'un signal.</p><div class='math-block'><div class='math' style='background: white; padding: 10px; border-radius: 6px;'>$$ I(f) = \\frac{1}{N} \\left| \\sum_{t=1}^{N} x_t e^{-2\\pi i f t} \\right|^2 $$</div></div></div><div style='background-color: #e8f4f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Interprétation :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Un pic dans le périodogramme indique une fréquence dominante dans le signal.</li><li>La hauteur du pic indique l'importance de cette fréquence.</li><li>Les fréquences sont exprimées en cycles par unité de temps.</li></ul></div><div style='background-color: #fef9e7; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #7d6608; margin: 0;'><strong>💡 Exemple :</strong> Pour des données mensuelles, un pic à 1/12 signifie une saisonnalité annuelle.</p></div></div>",
    "texteParle": "Le périodogramme est un outil pratique pour estimer la densité spectrale d'un signal. Concrètement, c'est un graphique qui montre l'importance de chaque fréquence dans votre série temporelle. Les pics dans ce graphique indiquent les fréquences dominantes. Par exemple, si vous avez des données mensuelles et que vous observez un pic à la fréquence 1/12, cela signifie que votre série a une saisonnalité annuelle. Plus le pic est haut, plus cette saisonnalité est forte. C'est un excellent outil pour identifier les périodicités cachées.",
    "note": "Le périodogramme permet d'identifier visuellement les fréquences dominantes d'un signal."
  },
  {
    "titre": "Le Spectre d'un Signal",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Le spectre : vision complète</h2><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Le spectre d'un signal est composé de deux parties :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li><span style='font-weight: bold;'>Spectre d'amplitude :</span> Montre l'amplitude de chaque fréquence.</li><li><span style='font-weight: bold;'>Spectre de phase :</span> Montre le décalage temporel de chaque fréquence.</li></ul></div><div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Propriétés importantes :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Le spectre d'amplitude est symétrique pour les signaux réels.</li><li>La fréquence zéro (f=0) correspond à la moyenne du signal.</li><li>Les fréquences positives et négatives sont symétriques.</li></ul></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>📌 Application :</strong> En analyse des séries temporelles, on utilise souvent le spectre d'amplitude pour identifier les cycles dominants.</p></div></div>",
    "texteParle": "Le spectre d'un signal est la représentation complète de ce signal dans le domaine fréquentiel. Il comprend deux informations : le spectre d'amplitude, qui nous dit à quel point chaque fréquence est importante, et le spectre de phase, qui nous donne le décalage temporel associé à chaque fréquence. Dans la pratique, pour l'analyse des séries temporelles, on utilise surtout le spectre d'amplitude pour identifier les cycles dominants. Une propriété intéressante : pour des signaux réels comme nos données, le spectre est symétrique, ce qui signifie que les fréquences positives et négatives donnent les mêmes informations.",
    "note": "Le spectre d'amplitude montre l'importance de chaque fréquence dans le signal."
  },
  {
    "titre": "Applications en Séries Temporelles",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Pourquoi utiliser l'analyse spectrale ?</h2><div style='background-color: #e8f4f8; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Applications principales :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li><strong>Identification des saisonnalités :</strong> Détecter automatiquement les cycles dans les données.</li><li><strong>Filtrage :</strong> Supprimer des fréquences indésirables (bruit, tendances).</li><li><strong>Compression :</strong> Représenter un signal avec peu de fréquences.</li><li><strong>Analyse de motifs :</strong> Identifier des comportements périodiques.</li></ul></div><div style='background-color: #fef9e7; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #7d6608; margin: 0;'><strong>Exemples concrets :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Économie : Identifier les cycles économiques.</li><li>Météo : Détecter les cycles saisonniers et les tendances.</li><li>Finance : Analyser les cycles de marché.</li></ul></div></div>",
    "texteParle": "L'analyse spectrale a de nombreuses applications en séries temporelles. Elle est particulièrement utile pour identifier automatiquement les saisonnalités, ce qui évite de les chercher manuellement. Elle permet aussi de filtrer votre signal pour éliminer le bruit, de compresser vos données ou d'identifier des motifs périodiques. Par exemple, en économie, elle aide à identifier les cycles économiques ; en météo, à détecter les cycles saisonniers ; en finance, à analyser les cycles de marché. C'est un outil polyvalent qui complète parfaitement les approches temporelles comme ARIMA.",
    "note": "L'analyse spectrale permet de découvrir des cycles cachés dans les données."

  {
    "titre": "Filtrage dans le Domaine Fréquentiel",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Filtrer son signal</h2><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Principe du filtrage fréquentiel :</strong></p><ol style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Appliquer la transformée de Fourier.</li><li>Modifier les coefficients (annuler, atténuer, amplifier).</li><li>Appliquer la transformée inverse.</li></ol></div><div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Types de filtres :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li><span style='font-weight: bold;'>Passe-bas :</span> Garde les basses fréquences (tendance).</li><li><span style='font-weight: bold;'>Passe-haut :</span> Garde les hautes fréquences (détails).</li><li><span style='font-weight: bold;'>Passe-bande :</span> Garde une bande de fréquences.</li><li><span style='font-weight: bold;'>Coupe-bande :</span> Supprime une bande de fréquences.</li></ul></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>💡 Astuce :</strong> Le filtrage fréquentiel est souvent plus efficace que le filtrage temporel pour supprimer des cycles indésirables.</p></div></div>",
    "texteParle": "Une application très pratique de l'analyse spectrale est le filtrage. L'idée est simple : on décompose le signal en fréquences, on modifie certaines fréquences, et on reconstruit le signal. Par exemple, un filtre passe-bas garde les basses fréquences, donc la tendance générale, et supprime les hautes fréquences, donc le bruit. Un filtre passe-haut fait l'inverse, il garde les détails rapides. Le filtrage fréquentiel est souvent plus efficace que le filtrage temporel pour éliminer des cycles indésirables, comme une saisonnalité à une fréquence spécifique.",
    "note": "Le filtrage fréquentiel permet de modifier sélectivement les composantes d'un signal."

  {
    "titre": "Transformée de Fourier Rapide (FFT)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>FFT : L'algorithme magique</h2><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #7d6608; margin: 0;'><strong>Problème :</strong> La transformée de Fourier discrète naïve est en O(N²), trop lente pour de grandes séries.</p><p style='color: #7d6608; margin: 5px 0;'><strong>Solution :</strong> La FFT (Fast Fourier Transform) est en O(N log N).</p></div><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Avantages de la FFT :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Extrêmement rapide pour les grandes séries temporelles.</li><li>La plupart des bibliothèques scientifiques l'implémentent (NumPy, SciPy, R).</li><li>Permet l'analyse spectrale en temps réel.</li></ul></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>📌 À retenir :</strong> La FFT est utilisée dans tous les outils modernes d'analyse spectrale.</p></div></div>",
    "texteParle": "La transformée de Fourier rapide, ou FFT, est une avancée majeure. Sans elle, l'analyse spectrale serait trop lente pour les grandes séries temporelles. La FFT réduit la complexité de O(N²) à O(N log N), ce qui est beaucoup plus rapide. Toutes les bibliothèques scientifiques modernes comme NumPy en Python ou les packages R l'implémentent. Grâce à la FFT, vous pouvez analyser spectroscopiquement de très grandes séries en quelques secondes. C'est un outil indispensable du data scientist.",
    "note": "La FFT rend l'analyse spectrale rapide même pour de très grandes séries."

  {
    "titre": "Interprétation des Résultats",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Lire le périodogramme</h2><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #333; margin: 0;'><strong>Guide d'interprétation :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li><span style='font-weight: bold;'>Pic dominant :</span> Fréquence principale du signal (ex: saisonnalité).</li><li><span style='font-weight: bold;'>Pics secondaires :</span> Harmonics ou autres cycles.</li><li><span style='font-weight: bold;'>Bruit :</span> Partie aléatoire du signal, généralement répartie sur toutes les fréquences.</li><li><span style='font-weight: bold;'>Tendance :</span> Apparaît comme un pic à très basse fréquence (proche de 0).</li></ul></div><div style='background-color: #e8f4f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>Pièges à éviter :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Ne pas confondre fréquence et période (période = 1/fréquence).</li><li>Vérifier la significativité des pics (tests de significativité).</li><li>Attention aux artefacts dus à l'échantillonnage.</li></ul></div></div>",
    "texteParle": "Savoir interpréter un périodogramme est essentiel. Le pic le plus élevé vous indique la fréquence dominante de votre signal. Par exemple, si vous avez un pic à la fréquence 0.083 (1/12), vous avez une saisonnalité mensuelle. Les pics secondaires peuvent indiquer des cycles additionnels. Le bruit apparaît comme une variation aléatoire sur toutes les fréquences. Une tendance se manifeste par un pic proche de la fréquence zéro. Attention à ne pas confondre fréquence et période : une fréquence de 0.25 signifie une période de 4 (quart de la longueur totale). Prenez toujours le temps de vérifier la significativité de vos pics, surtout avec peu de données.",
    "note": "Un pic dans le périodogramme indique une fréquence dominante dans la série."

  {
    "titre": "Limites et Précautions",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #2c3e50; font-size: 1.2em;'>Quand l'analyse spectrale est-elle utile ?</h2><div style='background-color: #fdedec; padding: 12px; border-radius: 8px; margin: 8px 0;'><p style='color: #922b21; margin: 0;'><strong>Limites de l'analyse spectrale :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Hypothèse de stationnarité nécessaire pour une interprétation fiable.</li><li>Difficile pour les signaux non-stationnaires ou avec des changements de régime.</li><li>Résolution fréquentielle limitée par la longueur de la série.</li><li>Peu adaptée aux prévisions à court terme.</li></ul></div><div style='background-color: #fef9e7; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #7d6608; margin: 0;'><strong>Quand l'utiliser :</strong></p><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>Séries avec des cycles réguliers (économie, météo, écologie).</li><li>Pour découvrir des périodicités cachées.</li><li>Comme complément des modèles temporels (ARIMA).</li></ul></div><div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; margin: 8px 0;'><p style='color: #1a5276; margin: 0;'><strong>💡 Recommandation :</strong> Utilisez l'analyse spectrale en complément des outils classiques de prévision, pas en remplacement.</p></div></div>",
    "texteParle": "L'analyse spectrale a aussi ses limites. Elle suppose que votre série est stationnaire, ce qui n'est pas toujours le cas. Pour les signaux non-stationnaires, les résultats peuvent être difficiles à interpréter. La résolution fréquentielle est limitée par la longueur de votre série : avec peu de données, vous aurez une résolution grossière. L'analyse spectrale est excellente pour découvrir des cycles, mais moins adaptée pour la prévision à court terme. Elle doit être utilisée comme un complément aux modèles comme ARIMA, pas comme un remplacement. Elle est particulièrement efficace pour les séries avec des cycles réguliers, comme en économie ou en météo.",

];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

        }

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

        document.querySelectorAll('.math-block').forEach(block => {

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
