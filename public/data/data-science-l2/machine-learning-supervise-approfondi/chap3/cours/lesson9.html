<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à AdaBoost",
    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Qu'est-ce qu'AdaBoost ?</h3> <p><strong>AdaBoost</strong> (Adaptive Boosting) est un algorithme de <strong>boosting</strong> qui combine séquentiellement plusieurs <strong>classifieurs faibles</strong> pour former un <strong>classifieur fort</strong>.</p> <div style='background-color: #e8f4f8; padding: 15px; border-radius: 8px; margin: 15px 0;'> <p style='margin: 0;'><strong>🎯 Objectif :</strong> Améliorer la performance d'apprentissage en se concentrant sur les <strong>échantillons mal classifiés</strong> par les classifieurs précédents.</p> </div> <ul style='list-style-type: none; padding-left: 0;'> <li style='padding: 8px 0; border-bottom: 1px solid #eee;'>📌 <strong>Adaptatif :</strong> Les poids des échantillons sont ajustés à chaque itération.</li> <li style='padding: 8px 0; border-bottom: 1px solid #eee;'>📌 <strong>Séquentiel :</strong> Les classifieurs sont entraînés les uns après les autres.</li> <li style='padding: 8px 0;'>📌 <strong>Combinaison :</strong> Les classifieurs sont combinés par <strong>vote pondéré</strong> selon leur performance.</li> </ul> <div style='background-color: #fff3cd; padding: 12px; border-radius: 6px; margin-top: 10px; border-left: 4px solid #ffc107;'> <p style='margin: 0;'><strong>💡 Analogie :</strong> Comme un groupe d'experts qui apprennent de leurs erreurs successives pour améliorer leurs décisions.</p> </div> </div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons aborder AdaBoost, un algorithme de boosting très populaire. AdaBoost signifie Adaptive Boosting, c'est-à-dire un boosting adaptatif. C'est une méthode qui combine séquentiellement plusieurs classifieurs faibles pour former un classifieur fort. L'objectif est d'améliorer la performance en se concentrant sur les échantillons mal classifiés par les classifieurs précédents. AdaBoost est adaptatif car les poids des échantillons sont ajustés à chaque itération. Les classifieurs sont entraînés les uns après les autres et combinés par un vote pondéré selon leur performance.",
    "note": "AdaBoost est un algorithme de boosting adaptatif qui combine séquentiellement des classifieurs faibles."
  },
  {
    "titre": "Le Principe du Boosting",
    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Apprentissage Séquentiel</h3> <p>Le boosting est une stratégie d'apprentissage <strong>séquentiel</strong> où chaque nouveau classifieur est entraîné pour <strong>corriger les erreurs</strong> du classifieur précédent.</p> <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db;'> <p style='margin: 0;'><strong>📊 Étape 1 :</strong> Entraîner un premier classifieur faible sur les données initiales (poids uniformes).</p> </div> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #e74c3c;'> <p style='margin: 0;'><strong>📊 Étape 2 :</strong> Augmenter les poids des échantillons <strong>mal classifiés</strong> par ce classifieur.</p> </div> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2ecc71;'> <p style='margin: 0;'><strong>📊 Étape 3 :</strong> Entraîner un nouveau classifieur sur les données <strong>pondérées</strong>.</p> </div> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #e67e22;'> <p style='margin: 0;'><strong>📊 Étape 4 :</strong> Répéter les étapes 2 et 3 jusqu'à atteindre le nombre d'itérations souhaité.</p> </div> </div> <div style='background-color: #e8f4f8; padding: 12px; border-radius: 6px;'> <p style='margin: 0;'><strong>📌 Clé :</strong> L'algorithme se concentre progressivement sur les <strong>échantillons difficiles</strong> à classifier.</p> </div> </div>",
    "texteParle": "Le boosting est une stratégie d'apprentissage séquentiel où chaque nouveau classifieur est entraîné pour corriger les erreurs du classifieur précédent. Voici comment cela fonctionne en quatre étapes. D'abord, on entraîne un premier classifieur faible sur les données initiales avec des poids uniformes. Ensuite, on augmente les poids des échantillons mal classifiés par ce classifieur. Puis, on entraîne un nouveau classifieur sur les données pondérées. Enfin, on répète ces étapes jusqu'à atteindre le nombre d'itérations souhaité. L'algorithme se concentre progressivement sur les échantillons difficiles à classifier.",
    "note": "Le boosting se concentre séquentiellement sur les échantillons mal classifiés pour améliorer la performance."
  },
  {
    "titre": "Les Poids dans AdaBoost",
    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Deux Types de Poids</h3> <p>AdaBoost utilise deux types de poids pour guider l'apprentissage :</p> <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'> <div style='background-color: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db;'> <h4 style='margin-top: 0; color: #2c3e50;'>Poids des Échantillons</h4> <p>Notés \(w_i^{(t)}\), ils indiquent l'<strong>importance</strong> de chaque échantillon à l'itération \(t\).</p> <ul> <li><strong>Initialisation :</strong> \(w_i^{(1)} = \\frac{1}{N}\) (poids uniformes).</li> <li><strong>Mise à jour :</strong> Les poids des échantillons <strong>mal classifiés</strong> sont augmentés.</li> <li><strong>Normalisation :</strong> Les poids sont normalisés pour que leur somme soit égale à 1.</li> </ul> </div> <div style='background-color: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid #2ecc71;'> <h4 style='margin-top: 0; color: #2c3e50;'>Poids des Classifieurs</h4> <p>Notés \(\\alpha_t\), ils mesurent l'<strong>importance</strong> de chaque classifieur dans la décision finale.</p> <ul> <li><strong>Calcul :</strong> \(\\alpha_t = \\frac{1}{2} \\ln \\left( \\frac{1 - \\text{erreur}_t}{\\text{erreur}_t} \\right)\).</li> <li><strong>Interprétation :</strong> Un classifieur avec une <strong>faible erreur</strong> a un poids <strong>élevé</strong>.</li> <li><strong>Erreur :</strong> \(\\text{erreur}_t = \\sum_i w_i^{(t)} \\cdot \\mathbb{1}(h_t(x_i) \\neq y_i)\).</li> </ul> </div> </div> </div>",
    "texteParle": "AdaBoost utilise deux types de poids. Les poids des échantillons, notés w_i^(t), indiquent l'importance de chaque échantillon à l'itération t. Ils sont initialisés uniformément, puis les poids des échantillons mal classifiés sont augmentés à chaque itération. Les poids sont normalisés pour que leur somme soit égale à 1. Les poids des classifieurs, notés alpha_t, mesurent l'importance de chaque classifieur dans la décision finale. Ils sont calculés à partir de l'erreur de chaque classifieur. Un classifieur avec une faible erreur a un poids élevé.",
    "note": "AdaBoost utilise des poids pour les échantillons et les classifieurs afin de guider l'apprentissage adaptatif."
  },
  {
    "titre": "L'Algorithme AdaBoost",
    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Étapes de l'Algorithme</h3> <div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;'> <p style='margin: 0; font-weight: bold;'>Algorithme AdaBoost :</p> <ol style='padding-left: 20px;'> <li>Initialiser les poids des échantillons \(w_i^{(1)} = \\frac{1}{N}\).</li> <li>Pour \(t = 1\) à \(T\) : <ol style='padding-left: 20px;'> <li>Entraîner un classifieur faible \(h_t\) sur les données pondérées.</li> <li>Calculer l'erreur \( \\text{erreur}_t = \\sum_i w_i^{(t)} \\cdot \\mathbb{1}(h_t(x_i) \\neq y_i)\).</li> <li>Si \( \\text{erreur}_t \\geq 0.5\), arrêter l'algorithme.</li> <li>Calculer \( \\alpha_t = \\frac{1}{2} \\ln \\left( \\frac{1 - \\text{erreur}_t}{\\text{erreur}_t} \\right)\).</li> <li>Mettre à jour les poids des échantillons : <br> \(w_i^{(t+1)} = w_i^{(t)} \\cdot e^{-\\alpha_t y_i h_t(x_i)}\).</li> <li>Normaliser les poids : \(w_i^{(t+1)} = \\frac{w_i^{(t+1)}}{\\sum_j w_j^{(t+1)}}\).</li> </ol> </li> <li>Classifieur final : \(H(x) = \\text{sign} \\left( \\sum_{t=1}^T \\alpha_t h_t(x) \\right)\).</li> </ol> </div> <div style='background-color: #d4edda; padding: 12px; border-radius: 6px;'> <p style='margin: 0;'><strong>💡 Remarque :</strong> Les classifieurs faibles peuvent être des arbres de décision peu profonds (stumps) ou tout autre classifieur simple.</p> </div> </div>",
    "texteParle": "Voici l'algorithme AdaBoost étape par étape. On commence par initialiser les poids des échantillons uniformément. Ensuite, pour chaque itération t, on entraîne un classifieur faible sur les données pondérées. On calcule son erreur, et si elle est supérieure à 0.5, on arrête l'algorithme. Sinon, on calcule son poids alpha_t, puis on met à jour les poids des échantillons. Les échantillons mal classifiés voient leurs poids augmenter. Enfin, on normalise les poids. Le classifieur final est une combinaison linéaire pondérée de tous les classifieurs faibles.",
    "note": "AdaBoost entraîne séquentiellement des classifieurs faibles en ajustant les poids des échantillons mal classifiés."
  },
  {
    "titre": "Le Classifieur Faible",
    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Qu'est-ce qu'un Classifieur Faible ?</h3> <p>Un <strong>classifieur faible</strong> est un classifieur dont la performance est <strong>légèrement meilleure</strong> que le hasard.</p> <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db;'> <h4 style='margin-top: 0; color: #2c3e50;'>Caractéristiques</h4> <ul> <li>Erreur <strong>inférieure</strong> à 0.5 (50%).</li> <li>Performance <strong>faible</strong> mais meilleure que le hasard.</li> <li>Généralement <strong>simple</strong> et rapide à entraîner.</li> </ul> </div> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2ecc71;'> <h4 style='margin-top: 0; color: #2c3e50;'>Exemples</h4> <ul> <li><strong>Stumps :</strong> Arbres de décision avec une seule couche (un seul nœud).</li> <li><strong>Classifieurs linéaires :</strong> Régression logistique simple.</li> <li><strong>Perceptrons :</strong> Un seul neurone.</li> <li><strong>Règle de décision :</strong> Seuil sur une seule caractéristique.</li> </ul> </div> </div> <div style='background-color: #fff3cd; padding: 12px; border-radius: 6px; border-left: 4px solid #ffc107;'> <p style='margin: 0;'><strong>💡 Pourquoi ?</strong> AdaBoost fonctionne en combinant plusieurs classifieurs faibles pour créer un classifieur fort, plus robuste et précis.</p> </div> </div>",
    "texteParle": "Un classifieur faible est un classifieur dont la performance est légèrement meilleure que le hasard. Cela signifie que son erreur est inférieure à 50%. Il est généralement simple et rapide à entraîner. Des exemples de classifieurs faibles incluent les stumps, qui sont des arbres de décision avec une seule couche, les classifieurs linéaires simples, les perceptrons, ou des règles de décision sur une seule caractéristique. AdaBoost fonctionne en combinant plusieurs de ces classifieurs faibles pour créer un classifieur fort, plus robuste et précis.",
    "note": "AdaBoost combine des classifieurs faibles (performance légèrement meilleure que le hasard) pour former un classifieur fort."

    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Boosting vs Bagging</h3> <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db;'> <h4 style='margin-top: 0; color: #2c3e50;'>Bagging (ex: Random Forest)</h4> <ul> <li><strong>Parallélisme :</strong> Entraîne plusieurs classifieurs <strong>en parallèle</strong>.</li> <li><strong>Échantillonnage :</strong> Utilise le <strong>bootstrap</strong> (échantillonnage avec remplacement).</li> <li><strong>Objectif :</strong> <strong>Réduire la variance</strong> en moyennant les prédictions.</li> <li><strong>Poids :</strong> Tous les classifieurs ont le <strong>même poids</strong>.</li> </ul> </div> <div style='background-color: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #e74c3c;'> <h4 style='margin-top: 0; color: #2c3e50;'>Boosting (AdaBoost)</h4> <ul> <li><strong>Séquentiel :</strong> Entraîne plusieurs classifieurs <strong>en série</strong>.</li> <li><strong>Pondération :</strong> Se concentre sur les <strong>erreurs</strong> précédentes.</li> <li><strong>Objectif :</strong> <strong>Réduire le biais</strong> en corrigeant les erreurs.</li> <li><strong>Poids :</strong> Les classifieurs ont des <strong>poids différents</strong> selon leur performance.</li> </ul> </div> </div> <div style='background-color: #e8f4f8; padding: 12px; border-radius: 6px;'> <p style='margin: 0;'><strong>📌 À retenir :</strong> Bagging réduit la variance, Boosting réduit le biais. Boosting est généralement plus performant mais peut surapprendre.</p> </div> </div>",
    "texteParle": "Comparons AdaBoost avec le bagging. Le bagging, comme dans Random Forest, entraîne plusieurs classifieurs en parallèle, en utilisant le bootstrap. Son objectif est de réduire la variance en moyennant les prédictions. Tous les classifieurs ont le même poids. Le boosting, comme AdaBoost, entraîne les classifieurs en série, en se concentrant sur les erreurs précédentes. Son objectif est de réduire le biais en corrigeant les erreurs. Les classifieurs ont des poids différents selon leur performance. Bagging réduit la variance, boosting réduit le biais. Boosting est généralement plus performant mais peut surapprendre.",
    "note": "Boosting réduit le biais en corrigeant les erreurs, tandis que bagging réduit la variance en moyennant les prédictions."

    "contenu": "<div style='font-family: Arial, sans-serif; color: #333; line-height: 1.6;'> <h3 style='color: #2c3e50;'>Points Forts et Faiblesses</h3> <div style='display: flex; flex-direction: column; gap: 15px;'> <div style='background-color: #d4edda; padding: 15px; border-radius: 8px; border-left: 4px solid #28a745;'> <h4 style='margin-top: 0; color: #155724;'>✅ Avantages</h4> <ul> <li><strong>Performance :</strong> Souvent très performant, même avec des classifieurs faibles.</li> <li><strong>Simplicité :</strong> Facile à comprendre et à implémenter.</li> <li><strong>Flexibilité :</strong> Peut être utilisé avec tout type de classifieur faible.</li> <li><strong>Interprétabilité :</strong> Les résultats sont généralement interprétables.</li> <li><strong>Pas de réglage complexe :</strong> Peu d'hyperparamètres à régler.</li> </ul> </div> <div style='background-color: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545;'> <h4 style='margin-top: 0; color: #721c24;'>❌ Limites</h4> <ul> <li><strong>Overfitting :</strong> Peut surapprendre avec des données bruitées ou des classifieurs trop complexes.</li> <li><strong>Sensibilité au bruit :</strong> Sensible aux outliers et aux valeurs aberrantes.</li> <li><strong>Données déséquilibrées :</strong> Peut être désavantagé par des classes très déséquilibrées.</li> <li><strong>Séquentiel :</strong> Ne peut pas être parallélisé, contrairement au bagging.</li> <li><strong>Performance :</strong> Peut être moins efficace que Gradient Boosting sur certains problèmes.</li> </ul> </div> </div> </div>",
    "texteParle": "AdaBoost a ses avantages et ses limites. Parmi ses avantages, il est souvent très performant, même avec des classifieurs faibles. Il est facile à comprendre et à implémenter, flexible, et peu d'hyperparamètres sont à régler. Parmi ses limites, il peut surapprendre avec des données bruitées. Il est sensible aux valeurs aberrantes et peut être désavantagé par des classes déséquilibrées. Il ne peut pas être parallélisé car il est séquentiel. Il peut être moins efficace que Gradient Boosting sur certains problèmes.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

        if (statusBadge) {

        }
        
        const slideCounter = document.querySelector('.slide-counter');

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
