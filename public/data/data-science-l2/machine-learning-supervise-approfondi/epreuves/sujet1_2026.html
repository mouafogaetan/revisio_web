<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
 {
   "matiere": "Machine Learning Supervisé Approfondi - L2",
   "classe": "Licence 2 Data Science",
   "sequence": "Évaluation Séquentielle n° 1",
   "anneeScolaire": "2025-2026",
   "exercices": [
     {
       "titre": "Exercice 1 : Arbres de Décision et Élagage",
       "points": "6 pts",
       "enonce": "<p>On considère un jeu de données contenant des informations sur 10 clients d'une banque. La variable cible est <strong>risque_credit</strong> (0 : bon risque, 1 : mauvais risque). Les caractéristiques sont :</p><ul><li><strong>age</strong> : âge du client</li><li><strong>revenu</strong> : revenu mensuel en milliers de FCFA</li><li><strong>emploi</strong> : type d'emploi (CDI, CDD, Sans)</li><li><strong>dette</strong> : montant de la dette en milliers de FCFA</li></ul><p>Un arbre de décision a été construit pour classifier les clients. Voici une partie de l'arbre :</p><div class='math-block' style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; text-align: left; margin: 12px 0;'><div style='font-family: monospace; white-space: pre-wrap;'>Racine : Revenu ≤ 100 ?<br/>├── Oui : Dette ≤ 20 ?<br/>│   ├── Oui : CDI ?<br/>│   │   ├── Oui : Bon risque (0)<br/>│   │   └── Non : Mauvais risque (1)<br/>│   └── Non : Mauvais risque (1)<br/>└── Non : Âge ≤ 35 ?<br/>    ├── Oui : Mauvais risque (1)<br/>    └── Non : Bon risque (0)</div></div><p>Le coefficient d'impureté de Gini pour l'ensemble initial est de 0.48. Après la première partition sur <strong>Revenu</strong>, le gain d'information est de 0.15.</p>",
       "questions": [
         {
           "question": "1) <strong>Analyser</strong> la structure de l'arbre. Expliquer comment la décision est prise pour un client ayant un revenu de 120 000 FCFA, un âge de 40 ans, une dette de 15 000 FCFA et un emploi en CDI. Justifier la réponse.",
           "reponse": "<p>Pour un client ayant <strong>Revenu = 120 000 FCFA</strong> (soit > 100), on suit la branche de droite de la racine : <strong>Âge ≤ 35 ?</strong>.</p><p>Le client a 40 ans, donc la condition est fausse. On suit la branche <strong>Non</strong>.</p><p>La feuille finale prédit <strong>Bon risque (0)</strong>.</p><p>Justification : L'arbre de décision fonctionne par division récursive de l'espace des caractéristiques. Chaque nœud test une caractéristique et chaque branche correspond à une valeur de cette caractéristique. L'algorithme de construction (CART) choisit la partition qui maximise le gain d'information (ou minimise l'impureté).</p>"
         },
         {
           "question": "2) <strong>Évaluer</strong> la performance de l'arbre sur ce client. Que peut-on dire de la confiance du modèle ?",
           "reponse": "<p>L'arbre donne une prédiction catégorique pour ce client (<strong>Bon risque</strong>). Cependant, sans métrique sur le nombre d'observations par feuille ou la probabilité associée (par exemple, la proportion de bons risques dans la feuille), on ne peut pas quantifier la confiance du modèle.</p><p>Pour évaluer la performance, il faudrait un ensemble de test. La confiance peut être améliorée en utilisant des méthodes d'ensemble (forêts aléatoires) ou l'élagage (pruning) pour éviter le sur-apprentissage.</p>"
         },
         {
           "question": "3) <strong>Expliquer</strong> le concept de l'élagage par coût-complexité. Comment le paramètre \\( \\alpha \\) influence-t-il la taille finale de l'arbre ?",
           "reponse": "<p>L'élagage par coût-complexité est une méthode pour réduire la taille d'un arbre de décision après sa construction, afin de diminuer le risque de sur-apprentissage (overfitting).</p><p>Le principe est d'ajouter une pénalité à l'erreur d'entraînement pour chaque nœud terminal (feuille). La fonction de coût est :</p><div class='math-block'><div class='math'>$$ C_{\\alpha}(T) = C(T) + \\alpha \\cdot |T| $$</div></div><p>où <strong>C(T)</strong> est l'erreur d'entraînement (ou l'impureté) de l'arbre T, <strong>|T|</strong> est le nombre de feuilles, et <strong>\\( \\alpha \\)</strong> est le paramètre de régularisation.</p><ul><li>Si <strong>\\( \\alpha = 0 \\)</strong>, on garde l'arbre maximal.</li><li>Si <strong>\\( \\alpha \\to \\infty \\)</strong>, la pénalité est si grande qu'on garde seulement la racine.</li></ul><p>On sélectionne le meilleur \\( \\alpha \\) par validation croisée.</p>"
         }
       ]
     },
     {
       "titre": "Exercice 2 : Forêts Aléatoires et Importance des Caractéristiques",
       "points": "6 pts",
       "enonce": "<p>Vous êtes chargé de développer un modèle pour prédire le <strong>chômage</strong> dans différentes régions du Cameroun à partir de données socio-économiques. Vous disposez de 2000 observations et de 50 caractéristiques. Vous décidez d'utiliser une <strong>forêt aléatoire (Random Forest)</strong>.</p>",
       "questions": [
         {
           "question": "1) <strong>Décrire</strong> le fonctionnement d'une forêt aléatoire. En quoi se distingue-t-elle du simple bagging appliqué aux arbres de décision ?",
           "reponse": "<p>Une forêt aléatoire est une méthode d'ensemble qui combine un grand nombre d'arbres de décision (bagging). Elle se distingue du bagging simple par une <strong>étape supplémentaire de randomisation</strong>.</p><p>Pour chaque arbre :</p><ol><li>Un échantillon bootstrap est tiré des données d'entraînement (bagging).</li><li>À chaque nœud de l'arbre, <strong>un sous-ensemble aléatoire des caractéristiques</strong> est sélectionné pour déterminer la meilleure partition.</li></ol><p>Cette randomisation permet de décorréler les arbres, réduisant ainsi la variance et améliorant la généralisation par rapport à un bagging simple qui utiliserait toutes les caractéristiques à chaque nœud.</p>"
         },
         {
           "question": "2) <strong>Justifier</strong> le choix des hyperparamètres <strong>n_estimators</strong>, <strong>max_features</strong> et <strong>max_depth</strong>. Donner une valeur typique pour <strong>max_features</strong> en classification.",
           "reponse": "<ul><li><strong>n_estimators</strong> : Nombre d'arbres dans la forêt. Plus il est élevé, plus la performance est stable (réduction de la variance), mais au-delà d'un seuil, les gains sont marginaux et le coût de calcul augmente.</li><li><strong>max_features</strong> : Nombre de caractéristiques sélectionnées aléatoirement à chaque nœud. Une valeur typique est \\( \\sqrt{p} \\) en classification (où p est le nombre total de caractéristiques).</li><li><strong>max_depth</strong> : Profondeur maximale de chaque arbre. Si elle est trop grande, les arbres peuvent sur-apprendre.</li></ul><p>Ces paramètres permettent de contrôler le compromis biais-variance.</p>"
         },
         {
           "question": "3) <strong>Calculer</strong> l'importance d'une caractéristique dans une forêt aléatoire. Décrire la méthode de <strong>permutation importance</strong>.",
           "reponse": "<p>L'importance d'une caractéristique peut être calculée de deux manières :</p><ul><li><strong>Gini importance</strong> (ou Mean Decrease Impurity) : elle mesure la réduction moyenne de l'impureté (Gini) apportée par une caractéristique dans tous les arbres.</li><li><strong>Permutation importance</strong> : elle mesure la dégradation de la performance du modèle lorsque les valeurs de la caractéristique sont permutées aléatoirement. Une forte dégradation indique que la caractéristique est importante.</li></ul>"
         }
       ]
     },
     {
       "titre": "Exercice 3 : Machines à Vecteurs de Support (SVM) et Noyaux",
       "points": "8 pts",
       "enonce": "<p>On considère un ensemble de données non linéairement séparable. Vous décidez d'utiliser une <strong>Machine à Vecteurs de Support (SVM)</strong> avec un <strong>noyau RBF</strong>.</p>",
       "questions": [
         {
           "question": "1) <strong>Expliquer</strong> le principe de la marge maximale. Que sont les <strong>vecteurs de support</strong> ?",
           "reponse": "<p>Le principe des SVM est de trouver l'hyperplan qui sépare les classes avec la <strong>marge maximale</strong>, c'est-à-dire la plus grande distance possible entre l'hyperplan de séparation et les points d'entraînement les plus proches.</p><p>Les <strong>vecteurs de support</strong> sont les points d'entraînement qui se trouvent sur les bords de la marge (ou qui la violent dans le cas de la marge souple). Ce sont eux qui déterminent l'hyperplan optimal.</p>"
         },
         {
           "question": "2) <strong>Décrire</strong> le problème de la marge souple (<strong>soft margin</strong>). Quel est le rôle du paramètre \\( C \\) ?",
           "reponse": "<p>La marge souple permet de tolérer des erreurs de classification lorsque les données ne sont pas linéairement séparables. Elle introduit des <strong>variables de relaxation (slack variables)</strong> qui mesurent l'écart d'un point par rapport à sa marge.</p><p>Le paramètre \\( C \\) contrôle le compromis entre la maximisation de la marge et la minimisation des erreurs :</p><ul><li>Un <strong>grand C</strong> pénalise fortement les erreurs => marge étroite, risque de sur-apprentissage.</li><li>Un <strong>petit C</strong> tolère plus d'erreurs => marge large, risque de sous-apprentissage.</li></ul>"
         },
         {
           "question": "3) <strong>Définir</strong> le <strong>kernel trick</strong>. Pourquoi est-il important dans le traitement des données non linéaires ?",
           "reponse": "<p>Le <strong>kernel trick</strong> consiste à projeter les données dans un espace de dimension supérieure via une fonction \\( \\phi \\), où elles deviennent linéairement séparables, sans avoir à calculer explicitement cette projection.</p><p>Au lieu de calculer \\( \\phi(\\mathbf{x}) \\cdot \\phi(\\mathbf{x}') \\), on utilise un noyau \\( K(\\mathbf{x}, \\mathbf{x}') \\) qui est le produit scalaire dans l'espace de projection. Cela permet de traiter des données non linéaires avec une complexité de calcul maîtrisée.</p>"
         },
         {
           "question": "4) <strong>Comparer</strong> le noyau RBF et le noyau polynomial. Pourquoi le noyau RBF est-il souvent recommandé en premier choix ?",
           "reponse": "<ul><li><strong>Noyau Polynomial</strong> : \\( K(x, x') = (x \\cdot x' + c)^d \\). Il est adapté lorsque les données ont des interactions polynomiales.</li><li><strong>Noyau RBF</strong> : \\( K(x, x') = \\exp(-\\gamma \\|x - x'\\|^2) \\). Il est très flexible et peut approximer de nombreuses fonctions.</li></ul><p>Le <strong>noyau RBF</strong> est souvent recommandé comme premier choix car il est <strong>universel</strong> : avec des paramètres appropriés, il peut séparer n'importe quel ensemble de données (à condition d'avoir suffisamment de vecteurs de support). Il ne nécessite pas de connaître a priori la structure des données.</p>"
         }
       ]
     }
   ]
 }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
