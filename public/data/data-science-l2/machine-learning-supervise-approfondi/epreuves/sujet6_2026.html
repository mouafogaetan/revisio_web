<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Supervisé Approfondi - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6 - Modèles Linéaires Généralisés et Analyse Discriminante",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Modélisation du Nombre de Sinistres",
      "points": "8 pts",
      "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #0d6efd;'><p>Une compagnie d'assurance souhaite modéliser le nombre de sinistres déclarés par ses clients en fonction de plusieurs caractéristiques. Les données sont les suivantes :</p><ul><li><strong>Âge du conducteur</strong> (en années)</li><li><strong>Bonus-Malus</strong> (coefficient)</li><li><strong>Puissance du véhicule</strong> (en chevaux)</li><li><strong>Zone géographique</strong> (Rurale, Urbaine, Périurbaine)</li></ul><p>La variable cible est le <strong>nombre de sinistres</strong> sur une année, qui est une variable de comptage. Les données présentent une <strong>surdispersion</strong> : la variance est environ 2.5 fois supérieure à la moyenne.</p></div>",
      "questions": [
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>1) (2 pts)</div><div>Expliquer pourquoi la régression de Poisson serait inadaptée pour ce problème, et quel modèle serait plus approprié. Justifier votre réponse.</div>",
          "reponse": "<div><p>La <strong>régression de Poisson</strong> serait inadaptée car elle suppose que la <strong>variance est égale à la moyenne</strong> (équidispersion). Or, les données présentent une <strong>surdispersion</strong> (variance 2.5 fois supérieure à la moyenne).</p><p>Le modèle plus approprié est la <strong>régression binomiale négative</strong>, qui introduit un paramètre de dispersion supplémentaire pour modéliser la surdispersion.</p></div>"
        },
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>2) (3 pts)</div><div>La fonction de lien utilisée est le logarithme. Écrire l'équation du modèle et interpréter le coefficient de la variable 'Âge' si \\( \\beta = -0.02 \\).</div>",
          "reponse": "<div><p><strong>Équation du modèle :</strong></p><div class='math-block'><div class='math'>$$ \\ln(\\mu) = \\beta_0 + \\beta_1 \\times \\text{Âge} + \\beta_2 \\times \\text{BonusMalus} + \\beta_3 \\times \\text{Puissance} + \\beta_4 \\times \\text{Zone} $$</div></div><p>où \\( \\mu \\) est le nombre moyen de sinistres attendu.</p><p><strong>Interprétation de \\( \\beta_{\\text{Âge}} = -0.02 \\) :</strong></p><ul><li>Chaque année supplémentaire d'âge est associée à une <strong>réduction</strong> du log du nombre de sinistres de 0.02.</li><li>L'<strong>odds ratio</strong> est \\( e^{-0.02} \\approx 0.9802 \\), soit une réduction de <strong>1.98%</strong> du nombre de sinistres pour chaque année d'âge supplémentaire.</li></ul></div>"
        },
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>3) (3 pts)</div><div>Comparer la régression binomiale négative et la régression de Poisson. Quels sont les avantages et les limites de chaque approche ?</div>",
          "reponse": "<div><p><strong>Régression de Poisson :</strong></p><ul><li><strong>Avantages :</strong> Simple, rapide, bien adaptée si l'équidispersion est vérifiée.</li><li><strong>Limites :</strong> Inadaptée en cas de surdispersion (erreurs de type I, intervalles de confiance trop étroits).</li></ul><p><strong>Régression binomiale négative :</strong></p><ul><li><strong>Avantages :</strong> Gère la surdispersion, plus robuste, généralisation de Poisson.</li><li><strong>Limites :</strong> Plus complexe, nécessite l'estimation d'un paramètre supplémentaire.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Analyse Discriminante Régularisée",
      "points": "6 pts",
      "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #198754;'><p>Un chercheur en biologie souhaite classer des patients en trois groupes (Sain, Malade Stade 1, Malade Stade 2) à partir de 50 marqueurs biologiques. Le jeu de données contient 60 patients (20 par groupe).</p><p>Il hésite entre une Analyse Discriminante Linéaire (LDA) et une Analyse Discriminante Quadratique (QDA).</p></div>",
      "questions": [
        {
          "question": "<div style='color: #198754; font-weight: bold;'>1) (2 pts)</div><div>Expliquer pourquoi QDA est inadaptée dans ce contexte et proposer une alternative.</div>",
          "reponse": "<div><p>QDA est inadaptée car elle nécessite d'estimer une <strong>matrice de covariance différente pour chaque classe</strong>. Avec 50 variables et seulement 20 patients par classe, les matrices de covariance sont <strong>singulières</strong> (non inversibles).</p><p>L'alternative est l'<strong>Analyse Discriminante Régularisée (RDA)</strong> qui régularise les matrices de covariance grâce à deux paramètres :</p><ul><li><strong>\\( \\lambda \\)</strong> : mélange entre LDA (0) et QDA (1).</li><li><strong>\\( \\gamma \\)</strong> : régularisation vers une matrice diagonale.</li></ul></div>"
        },
        {
          "question": "<div style='color: #198754; font-weight: bold;'>2) (2 pts)</div><div>Expliquer le rôle des paramètres \\( \\lambda \\) et \\( \\gamma \\) dans la RDA.</div>",
          "reponse": "<div><p><strong>Paramètre \\( \\lambda \\) :</strong></p><ul><li>Contrôle le <strong>mélange</strong> entre la covariance poolée (LDA) et les covariances spécifiques (QDA).</li><li>\\( \\lambda = 0 \\) → LDA, \\( \\lambda = 1 \\) → QDA.</li></ul><p><strong>Paramètre \\( \\gamma \\) :</strong></p><ul><li>Contrôle la <strong>régularisation vers une matrice diagonale</strong>.</li><li>\\( \\gamma = 0 \\) → pas de régularisation, \\( \\gamma = 1 \\) → covariance diagonale.</li></ul></div>"
        },
        {
          "question": "<div style='color: #198754; font-weight: bold;'>3) (2 pts)</div><div>Proposer une stratégie pour choisir les valeurs optimales de \\( \\lambda \\) et \\( \\gamma \\) dans ce contexte.</div>",
          "reponse": "<div><p>La stratégie recommandée est la <strong>validation croisée</strong> :</p><ul><li>Définir une <strong>grille de valeurs</strong> pour \\( \\lambda \\) (0 à 1 par pas de 0.1) et \\( \\gamma \\) (0 à 1 par pas de 0.1).</li><li>Pour chaque combinaison, effectuer une <strong>validation croisée</strong> (ex: 5-fold).</li><li>Choisir la combinaison qui <strong>minimise l'erreur de classification</strong>.</li></ul><p>Cette approche permet d'adapter le modèle aux données tout en évitant le sur-apprentissage.</p></div>"
        }
      ]
    },
    {
      "titre": "Application des Modèles Linéaires Généralisés",
      "points": "6 pts",
      "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #dc3545;'><p>Un institut de sondage souhaite analyser le nombre d'achats en ligne effectués par mois par les consommateurs. Les données incluent :</p><ul><li><strong>Âge</strong> (années)</li><li><strong>Revenu</strong> (en milliers de FCFA)</li><li><strong>Statut marital</strong> (Célibataire, Marié, Divorcé)</li><li><strong>Nombre d'enfants</strong></li></ul><p>La variable cible est le <strong>nombre d'achats par mois</strong>. L'analyse préliminaire montre une moyenne de 8 achats avec une variance de 12.</p></div>",
      "questions": [
        {
          "question": "<div style='color: #dc3545; font-weight: bold;'>1) (2 pts)</div><div>Calculer le rapport variance/moyenne. Conclure sur la présence de surdispersion.</div>",
          "reponse": "<div><p><strong>Rapport variance/moyenne = 12 / 8 = 1.5</strong></p><p>Un rapport <strong>supérieur à 1</strong> indique une <strong>surdispersion</strong>. Les données présentent donc une surdispersion modérée.</p></div>"
        },
        {
          "question": "<div style='color: #dc3545; font-weight: bold;'>2) (2 pts)</div><div>Justifier l'utilisation d'un GLM de type binomial négatif plutôt qu'un modèle de Poisson.</div>",
          "reponse": "<div><p>L'utilisation d'un modèle <strong>binomial négatif</strong> est justifiée car :</p><ul><li>La variable cible est un <strong>comptage</strong> (nombre d'achats).</li><li>Il y a <strong>surdispersion</strong> (rapport variance/moyenne > 1).</li><li>Le modèle binomial négatif permet de modéliser cette surdispersion grâce à un paramètre supplémentaire \\( \\theta \\).</li></ul></div>"
        },
        {
          "question": "<div style='color: #dc3545; font-weight: bold;'>3) (2 pts)</div><div>Quelles sont les conséquences de l'utilisation d'un modèle de Poisson malgré la surdispersion ?</div>",
          "reponse": "<div><p>L'utilisation d'un modèle de Poisson en présence de surdispersion conduit à :</p><ul><li>Des <strong>intervalles de confiance trop étroits</strong> (optimistes).</li><li>Des <strong>tests de Wald trop significatifs</strong> (faux positifs).</li><li>Une <strong>sous-estimation de l'incertitude</strong> des coefficients.</li><li>Un risque de <strong>mauvaise sélection de variables</strong>.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
