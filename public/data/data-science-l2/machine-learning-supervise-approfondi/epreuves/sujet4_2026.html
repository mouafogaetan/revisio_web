<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Supervisé Approfondi - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Arbres de Décision, Forêts Aléatoires et SVM (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice porte sur les concepts fondamentaux des arbres de décision, des forêts aléatoires et des Machines à Vecteurs de Support (SVM).</p></div>",
      "questions": [
        {
          "question": "<strong>1. (1 pt)</strong> Expliquez en quoi l'élagage (pruning) des arbres de décision permet de lutter contre le sur-apprentissage (overfitting).",
          "reponse": "L'élagage consiste à supprimer certaines branches de l'arbre de décision qui ne contribuent pas significativement à la réduction de l'erreur. En réduisant la taille de l'arbre, on diminue sa complexité, ce qui réduit le risque de sur-apprentissage et améliore la capacité de généralisation du modèle."
        },
        {
          "question": "<strong>2. (1.5 pts)</strong> Quelles sont les principales différences entre les méthodes d'ensemble Bagging (Forêts Aléatoires) et Boosting (AdaBoost, Gradient Boosting) en termes de réduction d'erreur ?",
          "reponse": "Le Bagging vise à réduire la variance du modèle en entraînant des modèles en parallèle sur différents échantillons bootstrap, puis en moyennant leurs prédictions. Il est efficace pour réduire le sur-apprentissage. Le Boosting vise à réduire le biais en entraînant des modèles séquentiellement, chaque nouveau modèle se concentrant sur les erreurs du précédent. Il est efficace pour améliorer la précision du modèle."
        },
        {
          "question": "<strong>3. (1.5 pts)</strong> Expliquez le principe du 'truc du noyau' (kernel trick) dans les SVM. Quel est son intérêt pour les données non linéairement séparables ?",
          "reponse": "Le kernel trick consiste à projeter les données dans un espace de dimension supérieure où elles deviennent linéairement séparables, sans avoir à calculer explicitement les coordonnées dans cet espace. Cela permet de traiter des problèmes de classification non linéaires avec un coût de calcul raisonnable."
        },
        {
          "question": "<strong>4. (1 pt)</strong> Citez deux hyperparamètres clés d'une forêt aléatoire (Random Forest) et expliquez leur rôle.",
          "reponse": "<strong>n_estimators</strong> : le nombre d'arbres dans la forêt. Un nombre plus élevé améliore la performance mais augmente le temps de calcul. <strong>max_features</strong> : le nombre de caractéristiques à considérer pour la meilleure division. Permet de réduire la corrélation entre les arbres et d'augmenter la diversité du modèle."
        }
      ]
    },
    {
      "titre": "Régularisation Avancée (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice aborde les techniques de régularisation Ridge, Lasso et ElasticNet.</p></div>",
      "questions": [
        {
          "question": "<strong>1. (1.5 pts)</strong> Formulez mathématiquement la fonction de coût de la régression Ridge (pénalité L2). Quelle est l'effet de cette pénalité sur les coefficients du modèle ?",
          "reponse": "La fonction de coût de Ridge est : <div class='math-block'><div class='math'>$$ \\text{Cost} = \\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2 + \\alpha \\sum_{j=1}^{p} \\beta_j^2 $$</div></div>La pénalité L2 réduit la magnitude des coefficients, les rapprochant de zéro sans les annuler, ce qui stabilise le modèle et réduit la variance."
        },
        {
          "question": "<strong>2. (1.5 pts)</strong> Comparez les effets de la régularisation L1 (Lasso) et L2 (Ridge) sur la sélection des variables.",
          "reponse": "La régularisation L1 (Lasso) peut annuler certains coefficients, ce qui entraîne une sélection de variables et un modèle parcimonieux. La régularisation L2 (Ridge) réduit les coefficients sans les annuler, ce qui permet de conserver toutes les variables mais avec des contributions pondérées."
        },
        {
          "question": "<strong>3. (2 pts)</strong> Expliquez ce qu'est ElasticNet et dans quel cas il est préférable d'utiliser cette technique plutôt que Ridge ou Lasso seuls.",
          "reponse": "ElasticNet est une combinaison des pénalités L1 et L2. Sa fonction de coût est : <div class='math-block'><div class='math'>$$ \\text{Cost} = \\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2 + \\alpha \\left( \\rho \\sum_{j=1}^{p} |\\beta_j| + \\frac{1-\\rho}{2} \\sum_{j=1}^{p} \\beta_j^2 \\right) $$</div></div>Il est préférable d'utiliser ElasticNet lorsque les variables sont corrélées, car Lasso a tendance à en sélectionner une aléatoirement, tandis qu'ElasticNet permet de garder des groupes de variables corrélées."
        }
      ]
    },
    {
      "titre": "Feature Engineering Avancé (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice traite des techniques avancées de création et de sélection de caractéristiques.</p></div>",
      "questions": [
        {
          "question": "<strong>1. (1 pt)</strong> Qu'est-ce que la discrétisation (binning) et quel est son intérêt dans le Feature Engineering ?",
          "reponse": "La discrétisation consiste à transformer une variable continue en catégories (bins). Elle permet de capturer des relations non linéaires, de simplifier le modèle et de le rendre plus interprétable."
        },
        {
          "question": "<strong>2. (1.5 pts)</strong> Expliquez le principe du Target Encoding (Mean Encoding) pour les variables catégorielles. Quel est son principal risque ?",
          "reponse": "Le Target Encoding remplace chaque catégorie par la moyenne de la variable cible pour les observations de cette catégorie. Le principal risque est la fuite de données (data leakage), c'est-à-dire l'utilisation de l'information de la cible pour encoder les variables, ce qui peut biaiser les performances du modèle."
        },
        {
          "question": "<strong>3. (1.5 pts)</strong> Décrivez les trois approches de sélection de caractéristiques : filtre, enveloppe et embarquée.",
          "reponse": "<strong>Filtre :</strong> Sélectionne les caractéristiques en fonction de critères statistiques (corrélation, information mutuelle) indépendamment du modèle. <strong>Enveloppe :</strong> Utilise un modèle pour évaluer la performance de sous-ensembles de caractéristiques (ex: RFE). <strong>Embarquée :</strong> Intègre la sélection dans le processus d'entraînement du modèle (ex: Lasso, importances des arbres)."
        },
        {
          "question": "<strong>4. (1 pt)</strong> Quelle est l'utilité de créer des caractéristiques de type 'interaction' ou 'ratio' ?",
          "reponse": "Les interactions (produits de variables) permettent de capturer l'effet conjoint de deux variables sur la cible. Les ratios (division de variables) permettent de capturer des relations relatives et de normaliser les comparaisons."
        }
      ]
    },
    {
      "titre": "Modèles Linéaires Généralisés (GLM) et Analyse Discriminante (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice porte sur les GLM, la régression logistique et l'analyse discriminante.</p></div>",
      "questions": [
        {
          "question": "<strong>1. (1 pt)</strong> Quels sont les trois composants principaux d'un modèle linéaire généralisé (GLM) ?",
          "reponse": "Les trois composants sont : 1) la distribution de probabilité de la variable cible (famille exponentielle), 2) le prédicteur linéaire (combinaison linéaire des variables explicatives), et 3) la fonction de lien qui relie le prédicteur linéaire à la moyenne de la distribution."
        },
        {
          "question": "<strong>2. (1.5 pts)</strong> Dans une régression logistique, comment interprète-t-on le coefficient \( \\beta_1 \) associé à la variable \( X_1 \) ? Que représente \( \\exp(\\beta_1) \) ?",
          "reponse": "Le coefficient \( \\beta_1 \) représente la variation du log-odds (logarithme de l'odds) lorsque \( X_1 \) augmente d'une unité. \( \\exp(\\beta_1) \) représente l'odds ratio, c'est-à-dire le rapport des odds pour une augmentation d'une unité de \( X_1 \)."
        },
        {
          "question": "<strong>3. (1.5 pts)</strong> Comparez l'Analyse Discriminante Linéaire (LDA) et l'Analyse Discriminante Quadratique (QDA) en termes d'hypothèses sur les matrices de covariance.",
          "reponse": "La LDA suppose que les matrices de covariance sont identiques pour toutes les classes, ce qui donne des frontières de décision linéaires. La QDA permet des matrices de covariance différentes pour chaque classe, ce qui donne des frontières de décision quadratiques."
        },
        {
          "question": "<strong>4. (1 pt)</strong> Quelle est l'utilité de l'Analyse Discriminante Régularisée (RDA) ?",
          "reponse": "La RDA combine LDA et QDA en régularisant les matrices de covariance. Elle est utile lorsque le nombre d'observations est limité par rapport au nombre de caractéristiques, permettant de stabiliser l'estimation des matrices de covariance et d'améliorer la généralisation."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
