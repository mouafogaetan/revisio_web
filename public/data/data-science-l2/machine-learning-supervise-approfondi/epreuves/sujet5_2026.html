<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Machine Learning Supervisé Approfondi - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Sequence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Arbres de Décision Avancés et Élagage",
     "points": "6 pts",
     "enonce": "<p style='text-align: justify;'>Considérez un ensemble de données pour la classification binaire avec deux variables numériques \\(X_1\\) et \\(X_2\\). On souhaite entraîner un arbre de décision. Les données d'entraînement sont présentées ci-dessous.</p><div style='background: #f4f4f4; padding: 12px; border-radius: 8px; color: #333; margin: 15px 0; overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr style='background: #ddd;'><th style='padding: 8px; border: 1px solid #ccc;'>\\(X_1\\)</th><th style='padding: 8px; border: 1px solid #ccc;'>\\(X_2\\)</th><th style='padding: 8px; border: 1px solid #ccc;'>Classe</th></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>1.2</td><td style='padding: 8px; border: 1px solid #ccc;'>3.4</td><td style='padding: 8px; border: 1px solid #ccc;'>0</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>2.1</td><td style='padding: 8px; border: 1px solid #ccc;'>1.5</td><td style='padding: 8px; border: 1px solid #ccc;'>1</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>3.5</td><td style='padding: 8px; border: 1px solid #ccc;'>5.2</td><td style='padding: 8px; border: 1px solid #ccc;'>0</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>4.8</td><td style='padding: 8px; border: 1px solid #ccc;'>2.9</td><td style='padding: 8px; border: 1px solid #ccc;'>1</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>1.8</td><td style='padding: 8px; border: 1px solid #ccc;'>4.1</td><td style='padding: 8px; border: 1px solid #ccc;'>0</td></tr><tr><td style='padding: 8px; border: 1px solid #ccc;'>5.0</td><td style='padding: 8px; border: 1px solid #ccc;'>1.0</td><td style='padding: 8px; border: 1px solid #ccc;'>1</td></tr></table></div>",
     "questions": [
       {
         "question": "<strong>1.1</strong> Expliquez le principe des arbres de décision pour la classification. Quels critères de pureté peut-on utiliser pour choisir la meilleure partition ? [citation:2]",
         "reponse": "<p style='text-align: justify;'>Un arbre de décision est un modèle prédictif qui utilise une structure arborescente pour prendre des décisions. Pour la classification, l'arbre divise récursivement l'espace des caractéristiques en régions plus pures, où chaque région correspond à une classe. Le but est de trouver les partitions qui séparent le mieux les classes. Les critères de pureté couramment utilisés sont :</p><ul style='text-align: justify;'><li><strong>Gini :</strong> Mesure l'impureté d'un nœud. Un Gini de 0 signifie que le nœud est parfaitement pur.</li><li><strong>Entropie :</strong> Mesure le désordre ou l'incertitude dans un nœud. Comme pour Gini, plus l'entropie est faible, plus le nœud est pur.</li><li><strong>Erreur de classification :</strong> Proportions d'éléments mal classés dans un nœud.</li></ul>"
       },
       {
         "question": "<strong>1.2</strong> En vous basant sur les données, calculez l'indice de Gini pour une première partition potentielle sur la variable \\(X_1\\) avec un seuil \\(\\leq 3.0\\). Justifiez votre calcul.",
         "reponse": "<p style='text-align: justify;'>Pour calculer l'indice de Gini, nous devons d'abord calculer la probabilité de chaque classe dans chaque nœud fils.</p><p style='text-align: justify;'><strong>Nœud gauche (\\(X_1 \\leq 3.0\\)) :</strong> Les points avec \\(X_1 \\leq 3.0\\) sont (1.2, 3.4, Classe 0), (2.1, 1.5, Classe 1), (1.8, 4.1, Classe 0).<br />Classe 0 : 2/3, Classe 1 : 1/3.<br />\\(Gini_{gauche} = 1 - [(2/3)^2 + (1/3)^2] = 1 - (4/9 + 1/9) = 1 - 5/9 = 4/9 \\approx 0.444\\).</p><p style='text-align: justify;'><strong>Nœud droit (\\(X_1 > 3.0\\)) :</strong> Les points avec \\(X_1 > 3.0\\) sont (3.5, 5.2, Classe 0), (4.8, 2.9, Classe 1), (5.0, 1.0, Classe 1).<br />Classe 0 : 1/3, Classe 1 : 2/3.<br />\\(Gini_{droit} = 1 - [(1/3)^2 + (2/3)^2] = 1 - (1/9 + 4/9) = 1 - 5/9 = 4/9 \\approx 0.444\\).</p><p style='text-align: justify;'>L'indice de Gini pour cette partition est la moyenne pondérée des indices de Gini des nœuds fils : <br />\\(Gini_{partition} = (3/6) * Gini_{gauche} + (3/6) * Gini_{droit} = 0.5 * 4/9 + 0.5 * 4/9 = 4/9 \\approx 0.444\\).</p>"
       },
       {
         "question": "<strong>1.3</strong> Discutez du phénomène de sur-apprentissage (overfitting) dans les arbres de décision et expliquez comment l'élagage par coût-complexité (cost-complexity pruning) permet de le réduire.",
         "reponse": "<p style='text-align: justify;'>Le sur-apprentissage se produit lorsqu'un arbre de décision devient trop complexe et s'adapte parfaitement aux données d'entraînement, y compris au bruit. Cela se traduit par une mauvaise performance sur de nouvelles données. L'élagage par coût-complexité est une technique qui consiste à tailler les branches les moins importantes de l'arbre. Le principe est de pénaliser la complexité de l'arbre en ajoutant un terme de coût, défini par le paramètre \\(\\alpha\\). La fonction de coût à minimiser est : \\(R_{\\alpha}(T) = R(T) + \\alpha |T|\\), où \\(R(T)\\) est le taux d'erreur de l'arbre sur les données d'entraînement et \\(|T|\\) le nombre de feuilles. En augmentant \\(\\alpha\\), on obtient des arbres plus petits et plus généralisables.</p>"
       },
       {
         "question": "<strong>1.4</strong> Soit un arbre de régression. Expliquez comment il prédit une valeur continue et quel critère est généralement utilisé pour déterminer les meilleures partitions.",
         "reponse": "<p style='text-align: justify;'>Un arbre de régression prédit une valeur continue en calculant la moyenne des valeurs cibles des échantillons se trouvant dans une feuille donnée. Pour déterminer la meilleure partition, on utilise le critère de l'erreur quadratique moyenne (MSE). Le but est de trouver la partition qui minimise la somme des carrés des résidus (ou MSE) à l'intérieur de chaque nœud fils. La formule pour le critère de partition est : \\(\\min_{split} [\\sum_{i \\in left} (y_i - \\bar{y}_{left})^2 + \\sum_{i \\in right} (y_i - \\bar{y}_{right})^2]\\).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Méthodes d'Ensemble et Boosting",
     "points": "6 pts",
     "enonce": "<p style='text-align: justify;'>On s'intéresse à l'amélioration des performances d'un modèle prédictif en utilisant des méthodes d'ensemble. Deux grandes familles de méthodes d'ensemble sont le Bagging et le Boosting.</p><div style='background: #e7f3fe; padding: 12px; border-radius: 8px; color: #1a3b5c; margin: 15px 0;'><p><strong>Question ouverte :</strong> Décrivez les concepts clés du Bagging et du Boosting. Pourquoi ces méthodes sont-elles particulièrement efficaces pour réduire la variance ou le biais des modèles ?</p></div>",
     "questions": [
       {
         "question": "<strong>2.1</strong> Expliquez le principe du Bootstrap Aggregating (Bagging). En quoi consiste l'échantillonnage bootstrap et comment les prédictions des différents modèles sont-elles agrégées ?",
         "reponse": "<p style='text-align: justify;'>Le Bagging est une méthode d'ensemble qui vise à réduire la variance d'un modèle en entraînant plusieurs instances du même modèle sur des échantillons bootstrap de l'ensemble d'entraînement. L'échantillonnage bootstrap consiste à créer plusieurs échantillons de même taille que l'ensemble d'origine en effectuant un tirage aléatoire avec remise. Chaque modèle est entraîné sur un échantillon bootstrap différent. Pour l'agrégation des prédictions : en classification, on utilise un vote majoritaire ; en régression, on fait la moyenne des prédictions.</p>"
       },
       {
         "question": "<strong>2.2</strong> Présentez les Forêts Aléatoires (Random Forests). En quoi cette méthode étend-elle le Bagging et quel est l'intérêt de la sélection aléatoire des caractéristiques ?",
         "reponse": "<p style='text-align: justify;'>Les Forêts Aléatoires sont une extension du Bagging appliqué aux arbres de décision. Elles apportent une amélioration cruciale : lors de la construction de chaque arbre, à chaque nœud, la recherche de la meilleure partition ne se fait pas sur l'ensemble des variables, mais sur un sous-ensemble de variables choisi aléatoirement. Cela a pour effet de décorréler les arbres entre eux, ce qui, combiné au Bagging, permet de réduire encore plus la variance et d'obtenir un modèle plus robuste et plus généralisable.</p>"
       },
       {
         "question": "<strong>2.3</strong> Décrivez le principe du Boosting. En quoi est-il fondamentalement différent du Bagging ?",
         "reponse": "<p style='text-align: justify;'>Le Boosting est une méthode d'ensemble séquentielle. Contrairement au Bagging où les modèles sont entraînés en parallèle, dans le Boosting, les modèles sont construits les uns après les autres. Chaque nouveau modèle est entraîné pour corriger les erreurs du modèle précédent. Pour ce faire, les échantillons mal classés se voient attribuer des poids plus élevés, ce qui force le modèle suivant à se concentrer sur les exemples les plus difficiles. Le Boosting réduit principalement le biais, mais peut aussi réduire la variance dans certains cas. La principale différence est donc le caractère séquentiel et la pondération adaptative des données.</p>"
       },
       {
         "question": "<strong>2.4</strong> Citez au moins trois hyperparamètres clés pour un modèle XGBoost et expliquez brièvement le rôle de chacun.",
         "reponse": "<p style='text-align: justify;'>Voici trois hyperparamètres clés pour XGBoost :</p><ul style='text-align: justify;'><li><strong><code>learning_rate</code> (ou eta) :</strong> Il contrôle la contribution de chaque arbre au modèle final. Une valeur plus petite rend l'apprentissage plus lent mais peut conduire à de meilleures performances en réduisant le risque de sur-apprentissage.</li><li><strong><code>max_depth</code> :</strong> Il définit la profondeur maximale de chaque arbre. Une profondeur plus grande permet de capturer des interactions plus complexes, mais augmente le risque de sur-apprentissage.</li><li><strong><code>n_estimators</code> :</strong> Il correspond au nombre d'arbres (ou de rounds de boosting) à construire. Un nombre plus élevé peut améliorer la performance, mais il faut le contrôler avec le <code>learning_rate</code> pour éviter le sur-apprentissage.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Machines à Vecteurs de Support (SVM)",
     "points": "5 pts",
     "enonce": "<p style='text-align: justify;'>Les Machines à Vecteurs de Support (SVM) sont des classifieurs puissants, notamment pour les données de grande dimension. Elles sont basées sur le concept de la marge maximale.</p><div style='background: #f9f9f9; padding: 12px; border-radius: 8px; color: #333; margin: 15px 0; text-align: center;'><p><strong>Question théorique :</strong> Expliquez le concept de \"marge\" dans le contexte des SVM et pourquoi les SVM cherchent à maximiser cette marge.</p></div>",
     "questions": [
       {
         "question": "<strong>3.1</strong> Définissez ce qu'est un vecteur de support et expliquez son rôle dans la construction du classifieur.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
