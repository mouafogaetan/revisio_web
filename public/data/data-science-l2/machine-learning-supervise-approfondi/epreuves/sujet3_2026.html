<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Machine Learning Supervisé Approfondi - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 3 : Modèles Avancés et Techniques de Régularisation",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours",
     "points": "6 pts",
     "enonce": "<p>Répondez aux questions suivantes par Vrai ou Faux, ou en choisissant la ou les bonnes réponses. Justifiez brièvement chaque réponse.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1 pt)</strong> Le Bagging (Bootstrap Aggregating) est une méthode d'ensemble qui réduit le biais des modèles de base.</p>",
         "reponse": "<p><strong>Réponse : Faux.</strong></p><p>Le Bagging réduit principalement la <strong>variance</strong> des modèles instables comme les arbres de décision en agrégeant les prédictions de plusieurs modèles entraînés sur des échantillons bootstrap. Il n'a pas d'effet significatif sur le biais.</p>"
       },
       {
         "question": "<p><strong>2. (1 pt)</strong> Les Extra-Trees et les Random Forests sont identiques, à l'exception du fait que les Extra-Trees n'utilisent pas de bootstrap.</p>",
         "reponse": "<p><strong>Réponse : Faux.</strong></p><p>La différence principale est que les Extra-Trees (Extremely Randomized Trees) choisissent les <strong>seuils de division de manière aléatoire</strong> pour chaque caractéristique, alors que les Random Forests cherchent le seuil optimal. L'absence de bootstrap est possible dans Extra-Trees mais ce n'est pas la seule différence.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Dans la régression de Poisson, l'hypothèse d'équidispersion signifie que la moyenne est égale à la variance.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>Pour une distribution de Poisson, on a <span style='font-weight:bold;'>E[Y] = Var[Y] = λ</span>. C'est l'hypothèse d'équidispersion. Si la variance est plus grande que la moyenne, on parle de surdispersion, qui nécessite des modèles comme le quasi-Poisson ou la binomiale négative.</p>"
       },
       {
         "question": "<p><strong>4. (1 pt)</strong> La fonction de lien log dans la régression de Poisson garantit que les prédictions sont toujours positives.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>La régression de Poisson utilise le lien log : <span style='font-weight:bold;'>log(λ) = Xβ</span>, donc <span style='font-weight:bold;'>λ = exp(Xβ) > 0</span>. Cela garantit que le paramètre λ (le nombre attendu d'événements) est toujours strictement positif, ce qui est une condition nécessaire pour la distribution de Poisson.</p>"
       },
       {
         "question": "<p><strong>5. (1 pt)</strong> L'Analyse Discriminante Quadratique (QDA) suppose que toutes les classes ont la même matrice de covariance.</p>",
         "reponse": "<p><strong>Réponse : Faux.</strong></p><p>La principale différence entre LDA et QDA est que <strong>QDA permet à chaque classe d'avoir sa propre matrice de covariance</strong> (Σ₁ ≠ Σ₂ ≠ ... ≠ Σ_K), tandis que LDA suppose une matrice de covariance commune. C'est cette flexibilité qui donne à QDA des frontières de décision quadratiques.</p>"
       },
       {
         "question": "<p><strong>6. (1 pt)</strong> Les paramètres λ (reg_lambda) et γ (gamma) dans XGBoost sont tous les deux des paramètres de régularisation qui pénalisent la complexité du modèle.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>Les deux sont des paramètres de régularisation dans XGBoost :</p><ul><li><span style='font-weight:bold;'>λ (reg_lambda)</span> est une pénalité L2 sur les poids des feuilles.</li><li><span style='font-weight:bold;'>γ (gamma)</span> est la réduction minimale de perte nécessaire pour diviser un nœud (contrôle la profondeur de l'arbre).</li></ul><p>Les deux contribuent à réduire la complexité du modèle et à éviter le sur-apprentissage.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Méthodes d'Ensemble et Régularisation",
     "points": "8 pts",
     "enonce": "<p>Une entreprise de e-commerce souhaite prédire le montant des achats futurs de ses clients (régression). Elle dispose de 50 000 clients et de 100 variables (démographiques, historiques d'achat, comportement sur le site). Après avoir testé plusieurs modèles, elle obtient les résultats suivants :</p><ul><li>Arbre de régression simple : RMSE = 45.2, R² = 0.62</li><li>Random Forest : RMSE = 38.7, R² = 0.73</li><li>XGBoost : RMSE = 37.1, R² = 0.76</li><li>Gradient Boosting : RMSE = 38.2, R² = 0.74</li></ul>",
     "questions": [
       {
         "question": "<p><strong>1. (1.5 pts)</strong> Expliquez pourquoi les méthodes d'ensemble (Random Forest, XGBoost, Gradient Boosting) performent mieux que l'arbre simple sur ce problème.</p>",
         "reponse": "<p>Les méthodes d'ensemble performent mieux pour plusieurs raisons :</p><ul><li><strong>Réduction de la variance :</strong> L'arbre simple souffre de sur-apprentissage (haute variance). Les méthodes d'ensemble agrégeaient les prédictions de plusieurs arbres, ce qui lisse les erreurs et réduit la variance.</li><li><strong>Gestion des interactions :</strong> Les ensembles capturent mieux les interactions complexes entre les 100 variables.</li><li><strong>Diversité des modèles :</strong> Chaque arbre capture des aspects différents des données, et leur combinaison donne une meilleure généralisation.</li></ul><p>Le gain est particulièrement marqué entre l'arbre simple (R²=0.62) et le Random Forest (R²=0.73), soit une amélioration de 11 points.</p>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> XGBoost donne les meilleurs résultats. Expliquez comment les paramètres de régularisation (λ, γ, α) peuvent être utilisés pour améliorer encore le modèle.</p>",
         "reponse": "<p>Les paramètres de régularisation de XGBoost permettent de contrôler la complexité du modèle :</p><ul><li><span style='font-weight:bold;'>γ (gamma) :</span> Réduction minimale de perte pour diviser un nœud. <ul><li>Augmenter γ réduit le nombre de divisions → arbres plus simples.</li><li>Utile si le modèle est en sur-apprentissage (RMSE sur validation > RMSE sur entraînement).</li></ul></li><li><span style='font-weight:bold;'>λ (reg_lambda) :</span> Pénalité L2 sur les poids des feuilles. <ul><li>Réduit la magnitude des poids → prédictions plus lisses.</li><li>Valeur typique : 0.1 à 10 (par défaut = 1).</li></ul></li><li><span style='font-weight:bold;'>α (reg_alpha) :</span> Pénalité L1 sur les poids des feuilles. <ul><li>Favorise la sparsité (certains poids à zéro).</li><li>Utile pour la sélection des caractéristiques.</li></ul></li></ul><p>On peut aussi agir sur <span style='font-weight:bold;'>max_depth</span> (profondeur des arbres) et <span style='font-weight:bold;'>learning_rate</span> (taux d'apprentissage).</p>"
       },
       {
         "question": "<p><strong>3. (1.5 pts)</strong> L'équipe métier souhaite comprendre quelles variables influencent le plus les achats. Proposez une méthode pour déterminer l'importance des variables avec XGBoost.</p>",
         "reponse": "<p>Pour déterminer l'importance des variables avec XGBoost, on peut utiliser :</p><ol><li><span style='font-weight:bold;'>Gain (importance par gain) :</span> Somme de l'amélioration de la performance (gain) obtenue à chaque division utilisant la variable. C'est la mesure la plus fiable.</li><li><span style='font-weight:bold;'>Weight (fréquence) :</span> Nombre de fois qu'une variable est utilisée pour une division.</li><li><span style='font-weight:bold;'>Cover :</span> Nombre d'échantillons affectés par les divisions utilisant la variable.</li></ol><p>Ces importances peuvent être visualisées via <code>xgboost.plot_importance()</code> ou extraites via <code>model.feature_importances_</code>. On peut ensuite sélectionner les variables les plus importantes (ex : top 20) pour simplifier le modèle et améliorer l'interprétabilité.</p>"
       },
       {
         "question": "<p><strong>4. (1.5 pts)</strong> L'équipe vous informe qu'elle doit aussi prédire le nombre de produits différents achetés par client (comptage). Quel modèle proposeriez-vous et pourquoi ?</p>",
         "reponse": "<p>Pour prédire un nombre de produits (variable de comptage), je proposerais une <span style='font-weight:bold;'>régression de Poisson</span> car :</p><ul><li>La variable cible est un <span style='font-weight:bold;'>entier positif</span> (0, 1, 2, ...).</li><li>La distribution de Poisson est naturellement adaptée aux données de comptage.</li><li>Le lien log garantit des prédictions positives.</li><li>Les coefficients s'interprètent en termes multiplicatifs (effet sur le nombre attendu de produits).</li></ul><p>Il faudra cependant <span style='font-weight:bold;'>vérifier l'hypothèse d'équidispersion</span> (moyenne ≈ variance). Si la variance est plus grande que la moyenne (surdispersion), on utilisera un modèle <span style='font-weight:bold;'>quasi-Poisson</span> ou une <span style='font-weight:bold;'>régression binomiale négative</span>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Analyse Discriminante",
     "points": "6 pts",
     "enonce": "<p>Un hôpital souhaite classer les patients en trois catégories de risque (faible, moyen, élevé) en fonction de 8 variables médicales (âge, pression artérielle, cholestérol, etc.). Vous disposez de 300 patients dont le niveau de risque est connu.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1.5 pts)</strong> Comparez LDA (Analyse Discriminante Linéaire) et QDA (Analyse Discriminante Quadratique) pour ce problème. Quel modèle choisiriez-vous en premier lieu ? Justifiez.</p>",
         "reponse": "<p><strong>Comparaison LDA vs QDA :</strong></p><ul><li><span style='font-weight:bold;'>LDA</span> suppose que les 3 classes ont la même matrice de covariance → frontières linéaires. Avec 8 variables, LDA estime <strong>8×3 + 8×9/2 + 2 = 62 paramètres</strong>.</li><li><span style='font-weight:bold;'>QDA</span> permet à chaque classe d'avoir sa propre covariance → frontières quadratiques. QDA estime <strong>8×3 + 3×36 + 2 = 122 paramètres</strong>.</li></ul><p><strong>Choix :</strong> Avec 300 patients et 8 variables, les deux modèles sont envisageables. Je commencerais par <span style='font-weight:bold;'>LDA</span> car :</p><ul><li>Il est plus simple et plus interprétable.</li><li>Il nécessite moins de données (62 vs 122 paramètres).</li><li>Si les covariances sont effectivement différentes, QDA pourra être testé ensuite.</li></ul><p>La validation croisée permettra de choisir le meilleur.</p>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> Après avoir entraîné LDA, vous obtenez les résultats de validation croisée suivants :</p><ul><li>Classe \"Faible\" : Précision = 0.85, Rappel = 0.88</li><li>Classe \"Moyen\" : Précision = 0.78, Rappel = 0.75</li><li>Classe \"Élevé\" : Précision = 0.82, Rappel = 0.80</li></ul><p>Interprétez ces résultats. Quelle classe est la mieux classifiée ? Quelle est la plus difficile ?</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
