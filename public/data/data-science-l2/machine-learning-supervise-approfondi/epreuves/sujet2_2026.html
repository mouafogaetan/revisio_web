<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Supervisé Approfondi - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arbres de Décision et Élagage (Questions de Cours et Application)",
      "points": "5 pts",
      "enonce": "<p>Cet exercice porte sur les principes fondamentaux des arbres de décision, leur construction et les techniques d'élagage pour lutter contre le sur-apprentissage.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (1 pt)</strong> Rappelez le principe général d'un arbre de décision pour la classification. Décrivez brièvement le processus de construction d'un nœud en utilisant le critère de Gini. Quelle est l'interprétation d'une valeur de Gini égale à 0 ?</p>",
          "reponse": "<p>Un arbre de décision est un modèle prédictif qui utilise une structure arborescente pour prendre des décisions. Le principe est de partitionner l'espace des caractéristiques en régions de plus en plus homogènes par rapport à la variable cible. La construction d'un nœud consiste à choisir la caractéristique et le seuil de coupure qui minimisent l'impureté des partitions filles. Le critère de Gini mesure l'impureté d'un nœud. Il est défini comme : <div class='math-block'><div class='math'>$$ Gini(t) = 1 - \\sum_{i=1}^{C} (p_i)^2 $$ </div></div> où \\( p_i \\) est la proportion d'observations de la classe \\( i \\) dans le nœud \\( t \\). Une valeur de Gini égale à 0 signifie que le nœud est parfaitement pur : toutes les observations qu'il contient appartiennent à la même classe.</p>"
        },
        {
          "question": "<p><strong>1.2 (1 pt)</strong> Expliquez le problème du sur-apprentissage (overfitting) dans le contexte des arbres de décision. Quelle technique, vue en cours, est utilisée pour y remédier ? Présentez brièvement cette technique.</p>",
          "reponse": "<p>Le sur-apprentissage se produit lorsqu'un arbre de décision est trop complexe et s'adapte parfaitement aux données d'entraînement, y compris à leur bruit, ce qui dégrade ses performances sur de nouvelles données. Pour y remédier, on utilise l'élagage (<i>pruning</i>). L'élagage par coût-complexité (<i>cost-complexity pruning</i>) consiste à construire un arbre maximal, puis à le réduire en supprimant des sous-arbres. On évalue chaque coupe par un critère qui pénalise la complexité, de sorte à trouver le meilleur compromis entre la performance sur les données d'entraînement et la taille de l'arbre. Un paramètre \\( \\alpha \\) contrôle ce compromis.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> Un arbre de régression est construit sur un ensemble de données. À un nœud donné, les valeurs de la variable cible sont les suivantes : <br> <code>[10, 12, 15, 18, 20]</code>. <br> Calculez l'erreur quadratique moyenne (MSE) de ce nœud. Si une coupure sépare les données en deux groupes, [10, 12] et [15, 18, 20], calculez la MSE pondérée de cette partition. Le gain de réduction de l'erreur est-il positif ?</p>",
          "reponse": "<p><strong>MSE du nœud parent :</strong> <br> Moyenne = \\( (10+12+15+18+20)/5 = 75/5 = 15 \\). <br> MSE = \\( ((10-15)^2 + (12-15)^2 + (15-15)^2 + (18-15)^2 + (20-15)^2)/5 = (25 + 9 + 0 + 9 + 25)/5 = 68/5 = 13.6 \\). <br><br> <strong>MSE de la partition :</strong> <br> Groupe 1 : [10, 12], moyenne = 11, MSE = \\( ((10-11)^2 + (12-11)^2)/2 = (1+1)/2 = 1 \\). <br> Groupe 2 : [15, 18, 20], moyenne = 17.67, MSE ≈ \\( ((15-17.67)^2 + (18-17.67)^2 + (20-17.67)^2)/3 ≈ (7.11 + 0.11 + 5.44)/3 ≈ 4.22 \\). <br> MSE pondérée = \\( (2/5)*1 + (3/5)*4.22 = 0.4 + 2.53 = 2.93 \\). <br><br> <strong>Réduction de l'erreur :</strong> \\( 13.6 - 2.93 = 10.67 > 0 \\), la réduction est donc positive.</p>"
        },
        {
          "question": "<p><strong>1.4 (1 pt)</strong> Citez une différence majeure entre les algorithmes CART et ID3/C4.5.</p>",
          "reponse": "<p>Une différence majeure est que CART construit des arbres binaires (chaque nœud a exactement deux enfants), tandis qu'ID3 et C4.5 peuvent produire des arbres où les nœuds ont plusieurs branches (en particulier pour les variables catégorielles). De plus, CART peut traiter à la fois la classification et la régression, ce qui n'est pas le cas d'ID3.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Méthodes d'Ensemble - Bagging et Forêts Aléatoires",
      "points": "5 pts",
      "enonce": "<p>Cet exercice explore les techniques d'ensemble visant à réduire la variance des modèles, en particulier le Bagging et les Forêts Aléatoires.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (1 pt)</strong> Décrivez le principe du Bootstrap Aggregating (Bagging). En quoi l'échantillonnage bootstrap permet-il de réduire la variance d'un modèle instable comme un arbre de décision ?</p>",
          "reponse": "<p>Le Bagging consiste à créer plusieurs échantillons d'entraînement à partir du jeu de données initial par rééchantillonnage bootstrap (tirage aléatoire avec remise). Un modèle (par ex., un arbre de décision non élagué) est entraîné sur chaque échantillon bootstrap. Les prédictions finales sont obtenues par vote (classification) ou moyenne (régression). L'échantillonnage bootstrap crée des jeux de données légèrement différents, et les modèles entraînés sur ces jeux auront des prédictions décorrélées. En moyennant leurs prédictions, on réduit la variance globale sans trop augmenter le biais.</p>"
        },
        {
          "question": "<p><strong>2.2 (1.5 pts)</strong> Expliquez en quoi les Forêts Aléatoires (<i>Random Forests</i>) améliorent le Bagging. Identifiez et décrivez le rôle de deux hyperparamètres clés.</p>",
          "reponse": "<p>Les Forêts Aléatoires améliorent le Bagging en ajoutant une étape de sélection aléatoire des caractéristiques à chaque nœud de l'arbre. Lors de la construction d'un arbre, au lieu de considérer toutes les caractéristiques pour trouver la meilleure coupure, on n'en sélectionne qu'un sous-ensemble aléatoire. Cela permet de décorréler davantage les arbres entre eux, rendant l'agrégation plus efficace pour réduire la variance. <br><br> <strong>Hyperparamètres clés :</strong> <br> - <code>n_estimators</code> : Le nombre d'arbres dans la forêt. Une valeur plus élevée améliore généralement la performance mais augmente le temps de calcul. <br> - <code>max_features</code> : Le nombre de caractéristiques à considérer pour la meilleure coupure à chaque nœud. Réduire cette valeur augmente la décorrélation entre les arbres.</p>"
        },
        {
          "question": "<p><strong>2.3 (1.5 pts)</strong> Qu'est-ce que l'importance des caractéristiques dans une Forêt Aléatoire ? Expliquez brièvement le principe du calcul de l'importance via la réduction d'impureté (Gini importance).</p>",
          "reponse": "<p>L'importance des caractéristiques permet d'identifier les variables les plus influentes pour la prédiction. Le calcul par réduction d'impureté (Gini importance) mesure la contribution de chaque caractéristique à l'homogénéité des nœuds dans l'ensemble de la forêt. Le principe est le suivant : pour chaque arbre, on additionne les réductions d'impureté (par exemple, la diminution du coefficient de Gini) obtenues à chaque nœud où la caractéristique est utilisée. Cette somme est ensuite pondérée par le nombre d'observations dans chaque nœud et moyennée sur tous les arbres de la forêt. Plus la caractéristique contribue à réduire l'impureté, plus son importance est élevée.</p>"
        },
        {
          "question": "<p><strong>2.4 (1 pt)</strong> Quelle est la principale différence entre une Forêt Aléatoire et les Extremely Randomized Trees (Extra-Trees) ?</p>",
          "reponse": "<p>La principale différence réside dans la manière dont les coupures sont choisies à chaque nœud. Pour une Forêt Aléatoire, la meilleure coupure est déterminée en testant des seuils optimaux sur un sous-ensemble aléatoire de caractéristiques. En revanche, Extra-Trees pousse l'aléa plus loin en choisissant non seulement les caractéristiques au hasard, mais aussi les seuils de coupure de manière totalement aléatoire, puis en sélectionnant la meilleure de ces coupures aléatoires.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Boosting et SVM (Questions de Cours)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les méthodes de Boosting et les Machines à Vecteurs de Support (SVM).</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (1 pt)</strong> Distinguez les approches du Bagging et du Boosting. Quelle est la philosophie de base de chaque méthode ?</p>",
          "reponse": "<p><strong>Bagging :</strong> Approche parallèle qui vise à réduire la variance en entraînant plusieurs modèles forts de manière indépendante et en agrégeant leurs prédictions. <br><br> <strong>Boosting :</strong> Approche séquentielle qui vise à réduire le biais en combinant des modèles faibles de manière séquentielle, où chaque nouveau modèle corrige les erreurs de ses prédécesseurs.</p>"
        },
        {
          "question": "<p><strong>3.2 (1 pt)</strong> Expliquez le rôle du <code>learning_rate</code> dans les algorithmes de Gradient Boosting (GBM, XGBoost). Quel est l'effet d'un learning rate très faible ?</p>",
          "reponse": "<p>Le <code>learning_rate</code> (ou taux d'apprentissage) contrôle la contribution de chaque nouvel arbre au modèle final. Il s'agit d'un facteur de pondération qui réduit l'impact de chaque arbre sur la prédiction. Un learning rate très faible ralentit l'apprentissage, ce qui nécessite d'ajouter un plus grand nombre d'arbres (<code>n_estimators</code>) pour atteindre une bonne performance. Cependant, cela permet souvent d'obtenir un modèle plus robuste et mieux généralisé.</p>"
        },
        {
          "question": "<p><strong>3.3 (1 pt)</strong> Quel est l'objectif principal des Machines à Vecteurs de Support (SVM) ? Expliquez brièvement ce que sont les \"vecteurs de support\".</p>",
          "reponse": "<p>L'objectif principal des SVM est de trouver l'hyperplan de séparation qui maximise la marge entre les différentes classes. La marge est la distance entre l'hyperplan et les points d'entraînement les plus proches. Les \"vecteurs de support\" sont précisément ces points d'entraînement qui se trouvent sur les marges et qui définissent l'hyperplan optimal. Ils sont les seuls points qui influencent la position et l'orientation de l'hyperplan.</p>"
        },
        {
          "question": "<p><strong>3.4 (1 pt)</strong> Que permet le \"truc du noyau\" (<i>kernel trick</i>) dans les SVM ? Citez un noyau non linéaire courant.</p>",
          "reponse": "<p>Le \"truc du noyau\" permet aux SVM de trouver des frontières de décision non linéaires sans avoir à effectuer explicitement le calcul dans un espace de dimension supérieure. Il utilise une fonction noyau pour calculer le produit scalaire entre les points dans cet espace de dimension supérieure de manière efficace. Un noyau non linéaire courant est le noyau à base radiale (RBF).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Régularisation et GLM",
      "points": "4 pts",
      "enonce": "<p>Cet exercice aborde les techniques de régularisation avancée et les Modèles Linéaires Généralisés (GLM).</p>",
      "questions": [
        {
          "question": "<p><strong>4.1 (1 pt)</strong> Décrivez l'effet principal de la régularisation L1 (Lasso) sur les coefficients d'un modèle. En quoi cela peut-il être utile pour la sélection de variables ?</p>",
          "reponse": "<p>La régularisation L1 (Lasso) ajoute une pénalité égale à la valeur absolue des coefficients. Cela a pour effet de forcer certains coefficients à devenir exactement nuls, réalisant ainsi une sélection de variables. Le modèle résultant est plus simple et plus interprétable, car seules les caractéristiques les plus importantes conservent un coefficient non nul.</p>"

        {

          "reponse": "<p>La fonction de lien généralement utilisée est le logarithme (log). Ce choix est pertinent car il garantit que les prédictions du modèle (le nombre attendu d'événements) restent toujours positives, ce qui est une exigence pour des données de comptage.</p>"

          "reponse": "<p>La surdispersion se produit lorsque la variance des données de comptage est supérieure à la moyenne, ce qui viole l'hypothèse d'équidispersion du modèle de Poisson. Pour y faire face, on utilise souvent un modèle de régression binomiale négative, qui introduit un paramètre supplémentaire pour modéliser la variance.</p>"

    {
      "titre": "Exercice 5 : Analyse Discriminante et Feature Engineering (Application)",
      "points": "2 pts",
      "enonce": "<p>Cet exercice se concentre sur l'Analyse Discriminante et le Feature Engineering.</p>",
      "questions": [
        {
          "question": "<p><strong>5.1 (1 pt)</strong> Quelle est l'hypothèse clé que fait l'Analyse Discriminante Linéaire (LDA) concernant les matrices de covariance des différentes classes ? Quelle est la conséquence de cette hypothèse sur la forme de la frontière de décision ?</p>",
          "reponse": "<p>L'hypothèse clé de la LDA est que les matrices de covariance des différentes classes sont identiques (<i>homoscédasticité</i>). La conséquence de cette hypothèse est que la frontière de décision entre les classes est linéaire.</p>"
        },
        {
          "question": "<p><strong>5.2 (1 pt)</strong> Citez une technique avancée de création de caractéristiques (feature engineering) pour les variables catégorielles, autre que le One-Hot Encoding. Expliquez brièvement son principe.</p>",
          "reponse": "<p>Le <strong>Target Encoding</strong> (ou Mean Encoding) consiste à remplacer chaque modalité d'une variable catégorielle par la moyenne de la variable cible pour les observations appartenant à cette modalité. Ceci est particulièrement utile pour les variables avec un grand nombre de modalités. Cependant, il faut faire attention au risque de sur-apprentissage, souvent géré par l'ajout de lissage (<i>smoothing</i>) ou par validation croisée.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
