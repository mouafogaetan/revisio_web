<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Optimisation et Recherche Opérationnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements de l'Optimisation et Classification des Problèmes",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les concepts fondamentaux de l'optimisation vus dans les leçons 1 et 2.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (1 pt)</strong> Considérons une entreprise de transport à Douala qui souhaite minimiser ses coûts de carburant en fonction du nombre de camions \\( x \\) et de la distance parcourue \\( y \\). La fonction de coût est donnée par <div class='math-block'><div class='math'>$$ f(x, y) = 3x^2 + 2y^2 - 4xy + 5x + 3y $$</div></div> <br> Déterminez si cette fonction est convexe en calculant sa matrice hessienne. Justifiez votre réponse.</p>",
          "reponse": "<p>Pour déterminer la convexité, on calcule la matrice hessienne :</p><div class='math-block'><div class='math'>$$ H = \\begin{pmatrix} \\frac{\\partial^2 f}{\\partial x^2} & \\frac{\\partial^2 f}{\\partial x \\partial y} \\\\ \\frac{\\partial^2 f}{\\partial y \\partial x} & \\frac{\\partial^2 f}{\\partial y^2} \\end{pmatrix} = \\begin{pmatrix} 6 & -4 \\\\ -4 & 4 \\end{pmatrix} $$</div></div><p>On vérifie si \\( H \\) est définie positive :</p><ul><li>Le premier mineur principal : \\( \\det(6) = 6 > 0 \\)</li><li>Le second mineur principal : \\( \\det(H) = 6 \\times 4 - (-4)^2 = 24 - 16 = 8 > 0 \\)</li></ul><p>Puisque tous les mineurs principaux sont strictement positifs, la matrice hessienne est définie positive. La fonction est donc <strong>strictement convexe</strong>.</p><p>En conséquence, tout minimum local de cette fonction est également un minimum global.</p>"
        },
        {
          "question": "<p><strong>1.2 (1 pt)</strong> Une PME camerounaise produit des articles en bois. Elle souhaite maximiser son bénéfice \\( B(x) \\) en fonction de la quantité produite \\( x \\) (en milliers d'unités), avec la fonction suivante :</p><div class='math-block'><div class='math'>$$ B(x) = -2x^3 + 15x^2 - 36x + 20 $$</div></div><p>Déterminez les quantités qui annulent la dérivée première. Classez chaque point comme minimum local, maximum local ou point d'inflexion en utilisant le test de la dérivée seconde.</p>",
          "reponse": "<p>On calcule d'abord la dérivée première :</p><div class='math-block'><div class='math'>$$ B'(x) = -6x^2 + 30x - 36 = -6(x^2 - 5x + 6) = -6(x-2)(x-3) $$</div></div><p>Les points critiques sont :</p><ul><li><strong>\\( x = 2 \\)</strong></li><li><strong>\\( x = 3 \\)</strong></li></ul><p>On calcule la dérivée seconde :</p><div class='math-block'><div class='math'>$$ B''(x) = -12x + 30 $$</div></div><p>On évalue la dérivée seconde aux points critiques :</p><ul><li>\\( B''(2) = -12(2) + 30 = 6 > 0 \\) → \\( x=2 \\) est un <strong>minimum local</strong>.</li><li>\\( B''(3) = -12(3) + 30 = -6 < 0 \\) → \\( x=3 \\) est un <strong>maximum local</strong>.</li></ul><p>Le bénéfice est donc minimal pour 2000 unités produites et maximal pour 3000 unités.</p>"
        },
        {
          "question": "<p><strong>1.3 (1 pt)</strong> Soit l'ensemble \\( S = \\{ (x, y) \\in \\mathbb{R}^2 \\;|\\; y \\geq x^2 \\} \\). Cet ensemble est-il convexe ? Justifiez votre réponse en utilisant la définition d'un ensemble convexe ou une représentation graphique.</p>",
          "reponse": "<p>L'ensemble \\( S = \\{ (x, y) \\in \\mathbb{R}^2 \\;|\\; y \\geq x^2 \\} \\) est l'épigraphe de la fonction \\( f(x) = x^2 \\).</p><p>La fonction \\( f(x) = x^2 \\) est convexe car sa dérivée seconde est \\( f''(x) = 2 > 0 \\).</p><p>On sait que l'épigraphe d'une fonction convexe est un ensemble convexe. Par conséquent, <strong>\\( S \\) est un ensemble convexe</strong>.</p><p>Graphiquement, cela correspond à la région au-dessus de la parabole, qui est bien une zone convexe.</p>"
        },
        {
          "question": "<p><strong>1.4 (1 pt)</strong> Classifiez chacun des problèmes d'optimisation suivants selon les critères : linéaire/non linéaire, continu/discret, avec/sans contraintes.</p><p>a) Trouver \\( x \\in \\mathbb{R}^n \\) qui minimise \\( f(x) = \\|Ax - b\\|^2 \\) avec \\( x \\in \\mathbb{R}^n \\).</p><p>b) Trouver \\( x \\in \\mathbb{Z}^n \\) qui maximise \\( c^T x \\) sous la contrainte \\( Ax \\leq b \\).</p><p>c) Trouver \\( x \\in \\mathbb{R} \\) qui minimise \\( f(x) = \\sin(x) \\).</p>",
          "reponse": "<ul><li><strong>a)</strong> Problème <strong>non linéaire</strong> (fonction quadratique), <strong>continu</strong> (variables réelles), <strong>sans contraintes</strong> (aucune restriction sur \\( x \\)).</li><li><strong>b)</strong> Problème <strong>linéaire</strong> (fonction objectif et contraintes linéaires), <strong>discret</strong> (variables entières), <strong>avec contraintes</strong> (inégalités \\( Ax \\leq b \\)).</li><li><strong>c)</strong> Problème <strong>non linéaire</strong> (fonction trigonométrique), <strong>continu</strong> (variable réelle), <strong>sans contraintes</strong> (aucune restriction sur \\( x \\)).</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Optimisation Sans Contrainte - Méthodes de Gradient",
      "points": "5 pts",
      "enonce": "<p>Cet exercice porte sur les méthodes d'optimisation sans contrainte vues dans les leçons 4 à 7.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (1.5 pts)</strong> On souhaite minimiser la fonction <div class='math-block'><div class='math'>$$ f(x) = (x - 3)^2 $$</div></div> en utilisant la descente de gradient avec un taux d'apprentissage \\( \\alpha = 0.5 \\).<br> a) Calculez le gradient de la fonction.<br> b) En partant de \\( x_0 = 0 \\), effectuez une itération de la descente de gradient pour trouver \\( x_1 \\).<br> c) Quelle est la valeur de la fonction en \\( x_1 \\) ?</p>",
          "reponse": "<p><strong>a)</strong> Le gradient est la dérivée première :</p><div class='math-block'><div class='math'>$$ \\nabla f(x) = 2(x - 3) $$</div></div><p><strong>b)</strong> La règle de mise à jour est :</p><div class='math-block'><div class='math'>$$ x_{k+1} = x_k - \\alpha \\nabla f(x_k) $$</div></div><p>Pour \\( x_0 = 0 \\) et \\( \\alpha = 0.5 \\) :</p><div class='math-block'><div class='math'>$$ \\nabla f(0) = 2(0 - 3) = -6 $$</div></div><div class='math-block'><div class='math'>$$ x_1 = 0 - 0.5 \\times (-6) = 3 $$</div></div><p><strong>c)</strong> La valeur de la fonction en \\( x_1 = 3 \\) est :</p><div class='math-block'><div class='math'>$$ f(3) = (3 - 3)^2 = 0 $$</div></div><p>La descente de gradient converge donc en une seule itération vers le minimum global \\( x^* = 3 \\).</p>"
        },
        {
          "question": "<p><strong>2.2 (1.5 pts)</strong> Comparez la méthode de Newton et la descente de gradient pour l'optimisation sans contrainte. Donnez au moins deux avantages et deux inconvénients de la méthode de Newton par rapport à la descente de gradient.</p>",
          "reponse": "<p><strong>Avantages de la méthode de Newton :</strong></p><ul><li><strong>Convergence plus rapide :</strong> La méthode de Newton a une convergence quadratique, c'est-à-dire que le nombre de chiffres corrects double à chaque itération, alors que la descente de gradient a une convergence linéaire (ou sous-linéaire dans certains cas).</li><li><strong>Meilleure direction de descente :</strong> En utilisant l'information de la courbure via la matrice hessienne, la méthode de Newton s'adapte mieux à la géométrie du problème et nécessite moins d'itérations.</li></ul><p><strong>Inconvénients de la méthode de Newton :</strong></p><ul><li><strong>Coût calculatoire élevé :</strong> Le calcul et l'inversion de la matrice hessienne sont \\( O(n^3) \\) en dimension \\( n \\), ce qui est prohibitif pour les problèmes de grande dimension.</li><li><strong>Nécessite une hessienne définie positive :</strong> La méthode de Newton nécessite que la hessienne soit définie positive (ou semi-définie positive) pour garantir une descente, ce qui n'est pas toujours le cas.</li></ul>"
        },
        {
          "question": "<p><strong>2.3 (1 pt)</strong> Dans la descente de gradient stochastique (SGD), quelle est la principale différence par rapport à la descente de gradient classique (batch gradient descent) ? Expliquez pourquoi SGD est particulièrement adapté aux grands jeux de données.</p>",
          "reponse": "<p>La principale différence entre le SGD et la descente de gradient classique réside dans le calcul du gradient :</p><ul><li><strong>Descente de gradient classique (Batch) :</strong> Le gradient est calculé sur l'intégralité du jeu de données à chaque itération :</li><div class='math-block'><div class='math'>$$ \\nabla f(x) = \\frac{1}{n} \\sum_{i=1}^{n} \\nabla f_i(x) $$</div></div><li><strong>Descente de gradient stochastique (SGD) :</strong> Le gradient est estimé à partir d'un seul point d'entraînement choisi aléatoirement :</li><div class='math-block'><div class='math'>$$ \\nabla f(x) \\approx \\nabla f_i(x) $$</div></div><p>pour un \\( i \\) sélectionné aléatoirement.</p></ul><p><strong>Adaptation aux grands jeux de données :</strong></p><ul><li>SGD est particulièrement adapté aux grands jeux de données car chaque itération ne nécessite qu'un seul échantillon, ce qui réduit considérablement le coût calculatoire par itération.</li><li>L'estimation bruitée du gradient permet de s'échapper des minima locaux et peut converger plus rapidement en pratique sur des jeux de données massifs.</li></ul>"
        },
        {
          "question": "<p><strong>2.4 (1 pt)</strong> Expliquez brièvement la méthode de recherche de ligne d'Armijo. À quoi sert-elle dans le contexte de l'optimisation sans contrainte ?</p>",
          "reponse": "<p>La recherche de ligne d'Armijo est une technique qui permet de déterminer un pas \\( \\alpha \\) satisfaisant à chaque itération de la descente de gradient.</p><p>La condition d'Armijo s'écrit :</p><div class='math-block'><div class='math'>$$ f(x_k + \\alpha d_k) \\leq f(x_k) + c \\alpha \\nabla f(x_k)^T d_k $$</div></div><p>avec \\( 0 < c < 1 \\) (généralement \\( c = 10^{-4} \\)).</p><p><strong>Utilité :</strong></p><ul><li>Elle garantit que le pas choisi permet une diminution suffisante de la fonction objectif.</li><li>Elle évite de choisir des pas trop grands qui pourraient faire diverger l'algorithme, ou des pas trop petits qui ralentiraient la convergence.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Optimisation avec Contraintes",
      "points": "6 pts",
      "enonce": "<p>Cet exercice porte sur les méthodes d'optimisation avec contraintes vues dans les leçons 8 à 10.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Considérons le problème d'optimisation suivant :</p><div class='math-block'><div class='math'>$$ \\min_{x,y} f(x,y) = x^2 + y^2 $$</div></div><p>sous la contrainte <div class='math-block'><div class='math'>$$ g(x,y) = x + y - 1 = 0 $$</div></div><br> Utilisez la méthode du Lagrangien pour résoudre ce problème.</p>",

        {

ign:center;'>5</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>25</td></tr></tbody></table>",

        {
          "question": "<p><strong>4.3 (1 pt)</strong> Expliquez brièvement l'algorithme du Simplexe et son principe de fonctionnement. Qu'appelle-t-on une solution de base réalisable ?</p>",
          "reponse": "<p><strong>Algorithme du Simplexe :</strong> C'est un algorithme itératif pour résoudre les problèmes de programmation linéaire. Il exploite le fait que l'optimum d'un problème linéaire se trouve à un sommet du polyèdre des contraintes (région réalisable).</p><p><strong>Principe de fonctionnement :</strong></p><ol><li>Partir d'une solution de base réalisable (un sommet du polyèdre).</li><li>À chaque itération, se déplacer vers un sommet adjacent qui améliore la valeur de la fonction objectif.</li><li>S'arrêter lorsqu'aucun sommet adjacent ne permet d'améliorer la solution (optimalité atteinte).</li></ol><p><strong>Solution de base réalisable :</strong> C'est une solution qui satisfait toutes les contraintes et qui est définie en fixant certaines variables (variables hors-base) à 0. Le nombre de variables en base est égal au nombre de contraintes (dans le cas où les contraintes sont linéairement;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
