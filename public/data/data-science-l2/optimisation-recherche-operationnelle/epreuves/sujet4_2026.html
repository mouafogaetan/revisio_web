<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Optimisation et Recherche Opérationnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4 - Applications en Data Science",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Question de cours sur l'Optimisation en Data Science (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #333;'>Cet exercice porte sur les concepts fondamentaux vus en cours, notamment la régularisation, les optimiseurs et les hyperparamètres en Data Science.</p>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>1. (2 pts)</strong> Expliquez en quelques lignes le rôle de la régularisation en apprentissage automatique. Que cherche-t-on à éviter et comment cela se traduit-il mathématiquement dans la fonction de coût ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>La régularisation est une technique pour éviter le surapprentissage (overfitting). Elle pénalise les modèles trop complexes en ajoutant un terme à la fonction de coût. Mathématiquement, on minimise une fonction de la forme : <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>Loss(Data|Model) + λ × complexity(Model)</span>. Le paramètre λ contrôle l'importance de la pénalité. [citation:1]</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>2. (2 pts)</strong> Distinguez les rôles des optimiseurs <strong>Adam</strong> et <strong>SGD</strong> dans l'apprentissage profond. Quel est l'avantage principal d'Adam ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>SGD (Stochastic Gradient Descent) est l'optimiseur de base qui met à jour les poids en utilisant le gradient de la fonction de coût. Adam (Adaptive Moment Estimation) combine les avantages de deux méthodes : le momentum (inertie) et la normalisation du gradient (comme dans RMSProp). L'avantage principal d'Adam est qu'il adapte le taux d'apprentissage pour chaque paramètre, ce qui permet une convergence plus rapide et plus stable sur des problèmes complexes comme les grands réseaux de neurones. [citation:3]</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>3. (2 pts)</strong> Citer deux méthodes d'optimisation des hyperparamètres et expliquer brièvement leurs principes.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>Grid Search (Recherche par grille) :</strong> consiste à tester toutes les combinaisons possibles d'hyperparamètres à partir d'une grille prédéfinie. C'est une méthode exhaustive mais coûteuse en temps de calcul.</p><p><strong>Random Search (Recherche aléatoire) :</strong> consiste à échantillonner aléatoirement des combinaisons d'hyperparamètres. Elle peut explorer un espace de recherche plus large et trouver de meilleures solutions avec moins d'évaluations que la recherche par grille. [citation:1]</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Régularisation et Optimisation Convexe (7 pts)",
      "points": "7 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #333;'>On s'intéresse à la régression Ridge, une technique de régularisation L2 qui ajoute une pénalité sur la norme des coefficients.</p>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>1. (1.5 pts)</strong> On considère le problème d'optimisation suivant :</p><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\min_{\\mathbf{w}} \\| \\mathbf{y} - \\mathbf{X} \\mathbf{w} \\|_2^2 + \\lambda \\| \\mathbf{w} \\|_2^2 $$</div></div><p>Il s'agit de la régression Ridge. Donner la solution analytique (forme close) de ce problème.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>La solution analytique de la régression Ridge est donnée par :</p><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\mathbf{w}^* = (\\mathbf{X}^T \\mathbf{X} + \\lambda \\mathbf{I})^{-1} \\mathbf{X}^T \\mathbf{y} $$</div></div><p>Le terme <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>λI</span> assure que la matrice est inversible, même si <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>X^T X</span> ne l'est pas. [citation:1]</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>2. (1.5 pts)</strong> Interpréter l'effet du paramètre de régularisation \( \\lambda \) dans le contexte de la régression Ridge. Que se passe-t-il quand \( \\lambda \\to \\infty \) ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>Le paramètre \( \\lambda \) contrôle l'ampleur de la pénalité. Plus \( \\lambda \) est grand, plus les coefficients \( \\mathbf{w} \) sont pénalisés. Lorsque \( \\lambda \\to \\infty \\), l'impact de la pénalité devient prépondérant, et les coefficients de régression Ridge tendent vers 0. Le modèle devient alors très simple, proche d'un modèle constant. [citation:1]</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>3. (2 pts)</strong> Sur un graphique 2D, la région de contrainte pour la régularisation L2 est un disque, tandis que pour L1 (Lasso), c'est un losange. Justifier qualitativement pourquoi la régularisation L1 conduit plus souvent à des solutions éparses (avec des coefficients exactement nuls).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>La forme de la région de contrainte influence le point de contact avec la fonction de coût. Pour L2 (région circulaire), le contact se fait généralement en un point où tous les coefficients sont non nuls. Pour L1 (région en losange avec des coins sur les axes), le contact a plus de chances de se produire sur un coin, ce qui force un ou plusieurs coefficients à être exactement nuls. C'est pourquoi L1 favorise la parcimonie (sélection de caractéristiques). [citation:1]</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>4. (2 pts)</strong> Expliquez la technique de l'<strong>early stopping</strong>. En quoi peut-elle être considérée comme une forme de régularisation ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>L'<strong>early stopping</strong> consiste à arrêter l'entraînement d'un modèle (comme un réseau de neurones) lorsque la performance sur un ensemble de validation cesse de s'améliorer pendant un certain nombre d'époques (patience). On sauvegarde alors le meilleur modèle.</p><p>Cette technique est considérée comme une régularisation car elle limite le temps d'entraînement et empêche le modèle d'apprendre trop de détails spécifiques aux données d'entraînement, ce qui réduit le risque de surapprentissage. En limitant le nombre d'itérations, on contraint implicitement la complexité du modèle. [citation:3]</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Application aux SVM (7 pts)",
      "points": "7 pts",
      "enonce": "<p style='font-size: 16px; line-height: 1.6; color: #333;'>Les Support Vector Machines (SVM) sont des modèles de classification puissants, dont l'entraînement repose sur un problème d'optimisation convexe.</p>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>1. (1.5 pts)</strong> Le problème d'optimisation primal pour un SVM linéairement séparable est le suivant :</p><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\min_{\\mathbf{w}, b} \\frac{1}{2} \\|\\mathbf{w}\\|^2 $$</div></div><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\text{s.c. } y_i(\\mathbf{w} \\cdot \\mathbf{x}_i + b) \\ge 1, \\quad i = 1, \\dots, n $$</div></div><p>Quelle est la signification géométrique de la fonction objectif \( \\frac{1}{2} \\|\\mathbf{w}\\|^2 \) ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>La fonction objectif \( \\frac{1}{2} \\|\\mathbf{w}\\|^2 \) est liée à la maximisation de la marge. La marge, qui est la distance entre l'hyperplan séparateur et les points les plus proches (les vecteurs de support), est égale à <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>2 / ||w||</span>. Ainsi, minimiser \( \\|\\mathbf{w}\\|^2 \) revient à maximiser la marge.</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>2. (2 pts)</strong> Écrire le lagrangien du problème primal et donner les conditions de stationnarité par rapport à \( \\mathbf{w} \) et \( b \).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>Le lagrangien est :</p><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\mathcal{L}(\\mathbf{w}, b, \\boldsymbol{\\alpha}) = \\frac{1}{2} \\|\\mathbf{w}\\|^2 - \\sum_{i=1}^n \\alpha_i [ y_i(\\mathbf{w} \\cdot \\mathbf{x}_i + b) - 1 ] $$</div></div><p>avec \( \\alpha_i \\ge 0 \).</p><p>Les conditions de stationnarité sont :</p><ul style='list-style-type: none; padding-left: 0;'><li>\( \\dfrac{\\partial \\mathcal{L}}{\\partial \\mathbf{w}} = \\mathbf{w} - \\sum_{i=1}^n \\alpha_i y_i \\mathbf{x}_i = 0 \\Rightarrow \\mathbf{w} = \\sum_{i=1}^n \\alpha_i y_i \\mathbf{x}_i \)</li><li>\( \\dfrac{\\partial \\mathcal{L}}{\\partial b} = -\\sum_{i=1}^n \\alpha_i y_i = 0 \\Rightarrow \\sum_{i=1}^n \\alpha_i y_i = 0 \)</li></ul></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>3. (2 pts)</strong> Expliquez l'utilité de la formulation duale du SVM. En quoi l'utilisation d'un noyau (kernel) devient-elle simple dans ce cadre ?</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p>La formulation duale du SVM s'écrit :</p><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\max_{\\boldsymbol{\\alpha}} \\sum_{i=1}^n \\alpha_i - \\frac{1}{2} \\sum_{i,j} \\alpha_i \\alpha_j y_i y_j (\\mathbf{x}_i \\cdot \\mathbf{x}_j) $$</div></div><div class='math-block' style='background: #f9f9f9; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center;'><div class='math'>$$ \\text{s.c. } 0 \\le \\alpha_i \\le C, \\quad \\sum_{i=1}^n \\alpha_i y_i = 0 $$</div></div><p>Cette formulation ne fait intervenir les données que par leur produit scalaire \( \\mathbf{x}_i \\cdot \\mathbf{x}_j \). C'est là que le <strong>kernel trick</strong> intervient : on peut remplacer ce produit scalaire par une fonction noyau \( K(\\mathbf{x}_i, \\mathbf{x}_j) \), qui correspond au produit scalaire des données après une transformation implicite dans un espace de plus grande dimension. Cela permet de construire des classifieurs non-linéaires sans avoir à calculer explicitement la transformation des données.</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>4. (1.5 pts)</strong> Donner deux exemples de fonctions noyau couramment utilisées en SVM.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.8; color: #333;'><p><strong>1. Noyau polynomial :</strong> <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>K(x, z) = (x · z + c)^d</span>, qui permet de créer des frontières de décision polynomiales.</p><p><strong>2. Noyau RBF (Gaussien) :</strong> <span style='background: #f0f0f0; padding: 2px 6px; border-radius: 4px;'>K(x, z) = exp(-γ||x - z||²)</span>, qui est un noyau très populaire, capable de capturer des relations non-linéaires complexes en projetant les données dans un espace de dimension infinie.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
