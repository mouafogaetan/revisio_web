<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Optimisation et Recherche Opérationnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements de l'Optimisation et Conditions d'Optimalité",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 16px; line-height: 1.8;'>On considère la fonction <span style='font-weight: bold;'>\\(f(x) = x^3 - 3x^2 + 2\\)</span> définie sur \\(\\mathbb{R}\\).</p><ol style='font-size: 15px; line-height: 2; padding-left: 20px;'><li>Déterminer les points critiques de \\(f\\).</li><li>En utilisant la dérivée seconde, déterminer la nature de chacun des points critiques (minimum local, maximum local ou point d'inflexion).</li><li>La fonction \\(f\\) est-elle convexe sur \\(\\mathbb{R}\\) ? Justifier votre réponse.</li><li>Trouver le minimum global de \\(f\\) sur l'intervalle \\([0, 3]\\).</li></ol><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; font-size: 14px;'><strong>Rappel :</strong> Une fonction est convexe si sa dérivée seconde est positive sur tout l'intervalle.</p></div></div>",
      "questions": [
        {
          "question": "1) Donner l'expression de la dérivée première \\(f'(x)\\) et résoudre \\(f'(x) = 0\\).",
          "reponse": "\\(f'(x) = 3x^2 - 6x = 3x(x - 2)\\)<br/>Les points critiques sont \\(x = 0\\) et \\(x = 2\\)."
        },
        {
          "question": "2) Calculer \\(f''(x)\\) et déterminer la nature des points \\(x=0\\) et \\(x=2\\).",
          "reponse": "\\(f''(x) = 6x - 6\\)<br/>- En \\(x=0\\) : \\(f''(0) = -6 < 0\\) → <strong>maximum local</strong> avec \\(f(0) = 2\\)<br/>- En \\(x=2\\) : \\(f''(2) = 6 > 0\\) → <strong>minimum local</strong> avec \\(f(2) = 8 - 12 + 2 = -2\\)"
        },
        {
          "question": "3) La fonction \\(f\\) est-elle convexe sur \\(\\mathbb{R}\\) ? Justifier.",
          "reponse": "Non, \\(f\\) n'est pas convexe sur \\(\\mathbb{R}\\) car \\(f''(x) = 6x - 6\\) change de signe en \\(x=1\\).<br/>- Sur \\(] -\\infty, 1[\\), \\(f''(x) < 0\\) : fonction concave<br/>- Sur \\(]1, +\\infty[\\), \\(f''(x) > 0\\) : fonction convexe<br/>La fonction a un point d'inflexion en \\(x=1\\)."
        },
        {
          "question": "4) Déterminer le minimum global de \\(f\\) sur \\([0, 3]\\).",
          "reponse": "Sur \\([0, 3]\\), on évalue :<br/>- \\(f(0) = 2\\)<br/>- \\(f(2) = -2\\) (minimum local)<br/>- \\(f(3) = 27 - 27 + 2 = 2\\)<br/>Le <strong>minimum global</strong> sur \\([0, 3]\\) est \\(\\min(2, -2, 2) = -2\\), atteint en \\(x = 2\\)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Optimisation sans Contrainte - Descente de Gradient et Newton",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 16px; line-height: 1.8;'>Soit la fonction <span style='font-weight: bold;'>\\(f(x) = x^2 + 4x + 5\\)</span>. On souhaite minimiser cette fonction en utilisant :</p><ol style='font-size: 15px; line-height: 2; padding-left: 20px;'><li>La méthode de descente de gradient avec un taux d'apprentissage \\(\\eta = 0.1\\), à partir du point initial \\(x_0 = 2\\). Effectuer une itération.</li><li>La méthode de Newton, à partir du même point initial \\(x_0 = 2\\). Effectuer une itération.</li><li>Comparer les résultats obtenus et expliquer la différence.</li></ol><div style='background: #e8f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; font-size: 14px;'><strong>Rappel :</strong> Descente de gradient : \\(x_{k+1} = x_k - \\eta \\nabla f(x_k)\\)<br/>Newton : \\(x_{k+1} = x_k - [\\nabla^2 f(x_k)]^{-1} \\nabla f(x_k)\\)</p></div></div>",
      "questions": [
        {
          "question": "1) Calculer \\(\\nabla f(x)\\) et \\(\\nabla^2 f(x)\\) pour \\(f(x) = x^2 + 4x + 5\\). Effectuer une itération de la descente de gradient avec \\(\\eta = 0.1\\) depuis \\(x_0 = 2\\).",
          "reponse": "\\(\\nabla f(x) = 2x + 4\\)<br/>\\(\\nabla^2 f(x) = 2\\)<br/><br/>Pour \\(x_0 = 2\\) : \\(\\nabla f(2) = 4 + 4 = 8\\)<br/>\\(x_1 = 2 - 0.1 \\times 8 = 2 - 0.8 = 1.2\\)<br/><br/>La première itération donne \\(x_1 = 1.2\\)"
        },
        {
          "question": "2) Effectuer une itération de la méthode de Newton depuis \\(x_0 = 2\\).",
          "reponse": "\\(\\nabla f(2) = 8\\) et \\(\\nabla^2 f(2) = 2\\)<br/>\\(x_1 = 2 - \\frac{8}{2} = 2 - 4 = -2\\)<br/><br/>La première itération donne \\(x_1 = -2\\), qui est le minimum exact de la fonction."
        },
        {
          "question": "3) Comparer les résultats obtenus par les deux méthodes. Pourquoi la méthode de Newton a-t-elle convergé en une seule itération ?",
          "reponse": "Résultats :<br/>- Descente de gradient : \\(x_1 = 1.2\\), valeur \\(f(1.2) = 1.44 + 4.8 + 5 = 11.24\\)<br/>- Méthode de Newton : \\(x_1 = -2\\), valeur \\(f(-2) = 4 - 8 + 5 = 1\\) (minimum exact)<br/><br/>La méthode de Newton converge en une itération car \\(f\\) est une fonction quadratique. Pour une fonction quadratique, l'approximation de Newton donne directement le minimum. La descente de gradient nécessite plusieurs itérations car elle se déplace progressivement vers le minimum avec un pas fixe."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Programmation Linéaire - Simplexe et Dualité",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 16px; line-height: 1.8;'>Une entreprise produit deux types de produits <strong>A</strong> et <strong>B</strong> en utilisant deux ressources <strong>R1</strong> et <strong>R2</strong>. Les contraintes de production sont les suivantes :</p><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math' style='font-size: 18px;'>$$\\max Z = 40x_1 + 30x_2$$ $$\\text{s.c. } 2x_1 + x_2 \\leq 100$$ $$x_1 + 2x_2 \\leq 80$$ $$x_1, x_2 \\geq 0$$</div></div><p style='font-size: 16px; line-height: 1.8;'>où \\(x_1\\) et \\(x_2\\) sont les quantités produites de A et B.</p><ol style='font-size: 15px; line-height: 2; padding-left: 20px;'><li>Résoudre graphiquement ce problème de programmation linéaire.</li><li>Écrire le problème dual associé.</li><li>Interpréter économiquement les variables duales.</li></ol></div>",
      "questions": [
        {
          "question": "1) Résoudre graphiquement le problème en identifiant la région réalisable et le sommet optimal.",
          "reponse": "Contraintes :<br/>- \\(2x_1 + x_2 \\leq 100\\) → \\(x_2 = 100 - 2x_1\\)<br/>- \\(x_1 + 2x_2 \\leq 80\\) → \\(x_2 = 40 - 0.5x_1\\)<br/><br/>Sommets de la région réalisable :<br/>- \\(O = (0, 0)\\) → \\(Z = 0\\)<br/>- \\(A = (40, 0)\\) → \\(Z = 40 \\times 40 + 30 \\times 0 = 1600\\)<br/>- \\(B = (0, 40)\\) → \\(Z = 0 + 30 \\times 40 = 1200\\)<br/>- \\(C\\) : intersection de \\(2x_1 + x_2 = 100\\) et \\(x_1 + 2x_2 = 80\\)<br/>Résolution : \\(x_1 = 40\\), \\(x_2 = 20\\) → \\(Z = 40 \\times 40 + 30 \\times 20 = 1600 + 600 = 2200\\)<br/><br/>Le <strong>sommet optimal</strong> est \\(C = (40, 20)\\) avec \\(Z_{\\max} = 2200\\)"
        },
        {
          "question": "2) Écrire le problème dual associé au primal.",
          "reponse": "Le problème dual est :<br/><div class='math-block' style='background: #f8f9fa; padding: 10px; border-radius: 8px; margin: 5px 0; text-align: center;'><div class='math' style='font-size: 16px;'>$$\\min W = 100y_1 + 80y_2$$ $$\\text{s.c. } 2y_1 + y_2 \\geq 40$$ $$y_1 + 2y_2 \\geq 30$$ $$y_1, y_2 \\geq 0$$</div></div>"
        },
        {
          "question": "3) Interpréter économiquement les variables duales \\(y_1\\) et \\(y_2\\).",
          "reponse": "Les variables duales représentent les <strong>prix fictifs</strong> (shadow prices) des ressources :<br/><br/>- \\(y_1\\) : le prix fictif de la ressource R1. Il indique de combien augmenterait le profit maximal si on disposait d'une unité supplémentaire de R1.<br/>- \\(y_2\\) : le prix fictif de la ressource R2. Il indique de combien augmenterait le profit maximal si on disposait d'une unité supplémentaire de R2.<br/><br/>À l'optimum, en résolvant le système des contraintes duales actives :<br/>\\(2y_1 + y_2 = 40\\) et \\(y_1 + 2y_2 = 30\\)<br/>On trouve \\(y_1 = \\frac{50}{3} \\approx 16.67\\) et \\(y_2 = \\frac{20}{3} \\approx 6.67\\).<br/><br/>Cela signifie qu'une unité supplémentaire de R1 augmenterait le profit de 16.67 unités monétaires, et une unité supplémentaire de R2 l'augmenterait de 6.67 unités monétaires."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Théorie des Jeux - Équilibre de Nash",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 16px; line-height: 1.8;'>Deux entreprises <strong>X</strong> et <strong>Y</strong> sont en concurrence sur un marché. Chacune peut choisir une stratégie de prix <strong>Bas</strong> ou <strong>Haut</strong>. La matrice des gains (en millions de FCFA) est la suivante :</p><table style='border-collapse: collapse; margin: 10px auto; width: 80%;'><tr><td style='padding: 8px; border: 1px solid #ddd;'></td><td style='padding: 8px; border: 1px solid #ddd; font-weight: bold; text-align: center;'>Prix Bas (Y)</td><td style='padding: 8px; border: 1px solid #ddd; font-weight: bold; text-align: center;'>Prix Haut (Y)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; font-weight: bold;'>Prix Bas (X)</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>(20, 20)</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>(50, 10)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; font-weight: bold;'>Prix Haut (X)</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>(10, 50)</td><td style='padding: 8px; border: 1px solid #ddd; text-align: center;'>(30, 30)</td></tr></table><p style='font-size: 16px; line-height: 1.8;'>Les gains du premier nombre correspondent à l'entreprise X et le second à l'entreprise Y.</p><ol style='font-size: 15px; line-height: 2; padding-left: 20px;'><li>Identifier l'équilibre de Nash en stratégies pures.</li><li>Justifier votre réponse en analysant les meilleures réponses de chaque joueur.</li><li>Cet équilibre est-il optimal au sens de Pareto ? Justifier.</li></ol></div>",
      "questions": [
        {
          "question": "1) Identifier l'équilibre de Nash en stratégies pures de ce jeu.",
          "reponse": "L'équilibre de Nash est <strong>(Prix Bas, Prix Bas)</strong> avec les gains (20, 20)."
        },
        {
          "question": "2) Justifier votre réponse en analysant les meilleures réponses de chaque joueur.",
          "reponse": "Analysons les meilleures réponses :<br/><br/>Pour l'entreprise X :<br/>- Si Y choisit Prix Bas : X peut obtenir 20 en choisissant Bas ou 10 en choisissant Haut. X préfère Bas (20 > 10).<br/>- Si Y choisit Prix Haut : X peut obtenir 50 en choisissant Bas ou 30 en choisissant Haut. X préfère Bas (50 > 30).<br/><br/>La <strong>stratégie dominante</strong> de X est donc Prix Bas.<br/><br/>Pour l'entreprise Y :<br/>- Si X choisit Prix Bas : Y peut obtenir 20 en choisissant Bas ou 10 en choisissant Haut. Y préfère Bas (20 > 10).<br/>- Si X choisit Prix Haut : Y peut obtenir 50 en choisissant Bas ou 30 en choisissant Haut. Y préfère Bas (50 > 30).<br/><br/>La <strong>stratégie dominante</strong> de Y est donc Prix Bas.<br/><br/>L'équilibre de Nash est (Prix Bas, Prix Bas) car c'est le seul profil où chaque joueur joue sa stratégie dominante."
        },
        {
          "question": "3) Cet équilibre est-il optimal au sens de Pareto ? Justifier.",
          "reponse": "L'équilibre (Prix Bas, Prix Bas) avec (20, 20) n'est <strong>pas optimal au sens de Pareto</strong>.<br/><br/>Le profil (Prix Haut, Prix Haut) avec (30, 30) donne à chaque joueur un gain supérieur (30 > 20 pour les deux). Cette situation est Pareto-supérieure à (Prix Bas, Prix Bas).<br/><br/>Cependant, (Prix Haut, Prix Haut) n'est pas stable car chaque joueur a intérêt à dévier vers Prix Bas pour augmenter son gain individuel (50 pour X si Y reste Haut, ou 50 pour Y si X reste Haut).<br/><br/>C'est un exemple classique de <strong>dilemme du prisonnier</strong> : la rationalité individuelle conduit à un équilibre sous-optimal pour les deux joueurs."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
