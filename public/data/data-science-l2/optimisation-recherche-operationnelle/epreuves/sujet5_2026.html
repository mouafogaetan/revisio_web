<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "intitule": "Comprendre le rôle des optimiseurs en Deep Learning",
    "type": "ressource",
    "niveau": "easy",
    "enonce": {
      "texte": "<p>En apprentissage profond, l'optimisation est un défi majeur. Répondez aux questions suivantes pour vérifier votre compréhension de base.</p>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Expliquez en vos propres mots la différence fondamentale entre un optimiseur comme le Gradient Descent (GD) classique et un optimiseur comme Adam. À quel problème spécifique du GD Adam tente-t-il de remédier ?",
        "niveau": "easy",
        "reponse": "Le gradient descent classique utilise un taux d'apprentissage unique pour toutes les mises à jour des poids. Adam adapte le taux d'apprentissage pour chaque paramètre en utilisant les moyennes des gradients passés et des carrés des gradients. Adam tente de remédier au problème du choix d'un bon taux d'apprentissage global et au problème des gradients qui peuvent être très petits ou très grands selon les paramètres.",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Citez deux avantages d'utiliser Adam par rapport à une descente de gradient stochastique (SGD) classique.",
            "niveau": "easy",
            "reponse": "1. Adam s'adapte automatiquement à chaque paramètre, ce qui réduit le besoin de régler manuellement le taux d'apprentissage. 2. Il converge souvent plus rapidement que SGD, en particulier pour les problèmes avec des espaces de paramètres complexes et pour les données non stationnaires."
          }
        ]
      },
      {
        "numero": 2,
        "texte": "Analysez l'impact du choix d'un optimiseur sur le processus d'entraînement d'un réseau de neurones profond en termes de vitesse de convergence et de qualité de la solution finale.",
        "niveau": "medium",
        "reponse": "Le choix de l'optimiseur influence directement la vitesse à laquelle le modèle apprend et la qualité de la solution trouvée. Un optimiseur comme SGD avec momentum peut converger rapidement vers une bonne solution, mais peut stagner dans des minima locaux. Adam, grâce à son adaptation, peut converger plus rapidement et trouver de meilleures solutions dans certains cas, mais il est parfois moins robuste sur des problèmes de généralisation. L'optimiseur doit être choisi en fonction de la nature du problème et des données.",
        "sousQuestions": []
      }
    ]
  },
  {
    "intitule": "Défis de l'optimisation en deep learning et solutions",
    "type": "ressource",
    "niveau": "medium",
    "enonce": {
      "texte": "<p>L'optimisation des modèles d'apprentissage profond est parsemée d'embûches. Cet exercice vous invite à les identifier et à proposer des solutions.</p>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Décrivez le problème des 'plateaux' dans le paysage de la fonction de perte. Pourquoi rendent-ils l'apprentissage difficile et comment peut-on les surmonter ?",
        "niveau": "medium",
        "reponse": "Les plateaux sont des régions de la fonction de perte où le gradient est très faible, voire nul, sur une large étendue. Cela rend l'apprentissage très lent, car l'optimiseur n'a pas une direction claire à suivre. On peut les surmonter en utilisant des optimiseurs avec momentum (comme SGD avec momentum ou Adam) qui accumulent l'inertie pour traverser ces plateaux, ou en utilisant des taux d'apprentissage adaptatifs qui peuvent augmenter le pas quand le gradient est faible.",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Quelle est la différence fondamentale entre un 'plateau' et un 'minimum local' ?",
            "niveau": "medium",
            "reponse": "Un minimum local est un point où la fonction de perte est inférieure à tous les points voisins, le gradient y est nul et il peut être difficile d'en sortir. Un plateau est une zone où le gradient est presque nul sur une grande surface, mais il peut y avoir une pente très faible qui permet éventuellement de descendre. Un minimum local est un point d'arrêt potentiel, un plateau est une zone de progression très lente."
          }
        ]
      },
      {
        "numero": 2,
        "texte": "Expliquez pourquoi les minima locaux sont moins un problème en deep learning qu'on ne le pensait autrefois, et ce qui constitue un défi plus important pour les optimiseurs modernes.",
        "niveau": "hard",
        "reponse": "On a découvert que dans les espaces de très haute dimension des réseaux profonds, la plupart des minima locaux ont une valeur de perte très proche du minimum global. Le véritable défi est de trouver un chemin qui mène à un point de selle, où certaines directions sont ascendantes et d'autres descendantes, plutôt qu'un minimum local. Les optimiseurs modernes sont conçus pour éviter de stagner dans ces points de selle.",
        "sousQuestions": []
      }
    ]
  },
  {
    "intitule": "Application des optimiseurs à un problème concret de Data Science",
    "type": "competence",
    "niveau": "hard",
    "enonce": {
      "texte": "<p>Vous travaillez pour une entreprise de E-commerce au Cameroun. Vous devez entraîner un modèle de réseau de neurones pour prédire les ventes quotidiennes. Vous disposez d'un grand jeu de données de 5 millions d'enregistrements. Le modèle est complexe et l'entraînement est long.</p>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Justifiez votre choix d'optimiseur parmi SGD, Adam ou RMSprop pour ce problème. Pourquoi cet optimiseur serait-il plus adapté qu'un autre, en considérant la taille des données, la complexité du modèle et les ressources disponibles ?",
        "niveau": "hard",
        "reponse": "Pour ce problème, Adam serait un bon choix. Étant donné la taille des données, un optimiseur adaptatif comme Adam converge généralement plus rapidement que SGD, ce qui est crucial pour réduire le temps d'entraînement. La complexité du modèle (réseau profond) bénéficie de l'adaptation des taux d'apprentissage par paramètre, ce qui aide à naviguer dans le paysage complexe de la fonction de perte. Bien qu'Adam puisse être plus gourmand en mémoire que SGD, la différence est souvent gérable pour des modèles standards. SGD avec momentum pourrait aussi être une option si on dispose de plus de temps pour le réglage, mais Adam offre une solution plus robuste 'out-of-the-box'.",
        "sousQuestions": []
      },
      {
        "numero": 2,
        "texte": "Pendant l'entraînement, vous observez que la perte sur l'ensemble d'entraînement diminue rapidement, mais que la perte sur l'ensemble de validation commence à augmenter après quelques époques. Diagnostiquez ce phénomène et proposez deux actions correctives en lien avec l'optimisation que vous pourriez entreprendre.",
        "niveau": "very hard",
        "reponse": "Le phénomène décrit est un surapprentissage (overfitting). Le modèle apprend trop bien les données d'entraînement et perd sa capacité de généralisation. Deux actions correctives liées à l'optimisation pourraient être : 1. Réduire le taux d'apprentissage pour ralentir l'apprentissage et permettre au modèle de trouver une solution plus générale. 2. Augmenter le coefficient de régularisation (L2 ou L1) si elle est intégrée à la fonction de perte, ce qui pénalise les poids importants et limite la complexité du modèle. On pourrait aussi envisager d'utiliser un 'learning rate schedule' pour diminuer le taux d'apprentissage au cours de l'entraînement.",
        "sousQuestions": []
      }
    ]
  },
  {
    "intitule": "Déboguer un entraînement de réseau de neurones",
    "type": "competence",
    "niveau": "medium",
    "enonce": {
      "texte": "<p>Vous êtes en train d'entraîner un réseau de neurones convolutif (CNN) pour la classification d'images de fruits tropicaux (mangues, bananes, ananas). L'entraînement avec SGD stagne avec une perte élevée, même après plusieurs époques. Vous soupçonnez un problème d'optimisation.</p>",
      "images": []
    },
    "questions": [
      {
        "numero": 1,
        "texte": "Proposez une stratégie pour diagnostiquer si le problème vient du taux d'apprentissage, des gradients ou de l'initialisation des poids. Expliquez brièvement comment mettre en œuvre chaque diagnostic.",
        "niveau": "hard",
        "reponse": "1. **Taux d'apprentissage** : Testez différents taux d'apprentissage (par exemple, 0.1, 0.01, 0.001, 0.0001) pour voir si l'un d'eux permet à la perte de diminuer. 2. **Gradients** : Vérifiez les normes des gradients. Si elles sont extrêmement petites (gradients qui s'évanouissent) ou extrêmement grandes (gradients explosifs), cela indique un problème. On peut afficher les histogrammes des gradients ou utiliser des 'gradient clipping' pour contrôler les explosions. 3. **Initialisation** : Une mauvaise initialisation peut conduire à des gradients nuls dès le début. On peut essayer différentes méthodes d'initialisation (comme He ou Xavier) pour voir si l'apprentissage démarre.",
        "sousQuestions": [
          {
            "numero": "1.a",
            "texte": "Si vous constatez que la perte ne diminue pas du tout, quelles seraient les premières choses à vérifier concernant votre implémentation de l'optimiseur ?",
            "niveau": "medium",
            "reponse": "Les premières vérifications concerneraient le calcul du gradient : assurez-vous que la fonction de perte est correctement définie, que la rétropropagation est activée, et que les mises à jour des poids sont effectuées dans la bonne direction (soustraire le gradient). Une erreur de signe dans la mise à jour (ajouter le gradient au lieu de le soustraire) empêcherait complètement l'apprentissage."
          }
        ]
      }
    ]
  }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
