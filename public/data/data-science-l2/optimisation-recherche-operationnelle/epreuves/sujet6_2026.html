<html lang="fr">

    <title>Épreuve</title>

    <script>

            options: {
                skipHtmlTypes: 'script',

            }

    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Optimisation et Recherche Opérationnelle - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Théorie des Jeux et Équilibre de Nash",
     "points": "6 pts",
     "enonce": "<p>Cet exercice porte sur les concepts fondamentaux de la théorie des jeux vus dans les leçons 22 à 24 (chapitre 7).</p>",
     "questions": [
       {
         "question": "<p><strong>1.1 (1.5 pts)</strong> Définissez un jeu non coopératif en stratégies mixtes. Quels sont les éléments qui le caractérisent ?</p>",
         "reponse": "<p>Un jeu non coopératif en stratégies mixtes est un modèle mathématique où plusieurs joueurs prennent des décisions de manière indépendante, sans possibilité de signer des accords contraignants. Chaque joueur choisit une distribution de probabilité sur l'ensemble de ses stratégies pures. Les éléments qui caractérisent un tel jeu sont :</p><ul><li>Un ensemble fini de joueurs \( N = \\{1, 2, ..., n\\} \\)</li><li>Pour chaque joueur \( i \\), un ensemble de stratégies pures \( S_i \\)</li><li>Une fonction de gain \( u_i(\\sigma_1, ..., \\sigma_n) \\) pour chaque joueur, où \( \\sigma_i \\) est une distribution de probabilité sur \( S_i \\)</li><li>La règle selon laquelle chaque joueur maximise son gain espéré compte tenu des stratégies des autres joueurs</li></ul>"
       },
       {
         "question": "<p><strong>1.2 (1.5 pts)</strong> Soit le jeu de la poule mouillée (Chicken) avec deux joueurs. Chaque joueur a deux stratégies : continuer (C) ou dévier (D). La matrice des gains (Joueur 1, Joueur 2) est :</p><table style='width:100%;border-collapse:collapse;margin:10px 0;'><thead><tr><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>\\</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>C</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>D</th></tr></thead><tbody><tr><td style='border:1px solid #ddd;padding:8px;background-color:#f9f9f9;'><strong>C</strong></td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>(-10, -10)</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>(10, -5)</td></tr><tr><td style='border:1px solid #ddd;padding:8px;background-color:#f9f9f9;'><strong>D</strong></td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>(-5, 10)</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>(0, 0)</td></tr></tbody></table><p>Déterminez les équilibres de Nash en stratégies pures de ce jeu.</p>",
         "reponse": "<p>Pour trouver les équilibres de Nash en stratégies pures, on analyse les meilleures réponses de chaque joueur :</p><ul><li>Si le Joueur 2 joue C : le Joueur 1 compare -10 (jouer C) et 10 (jouer D) → meilleure réponse : D</li><li>Si le Joueur 2 joue D : le Joueur 1 compare -5 (jouer C) et 0 (jouer D) → meilleure réponse : D</li><li>Si le Joueur 1 joue C : le Joueur 2 compare -10 (jouer C) et 10 (jouer D) → meilleure réponse : D</li><li>Si le Joueur 1 joue D : le Joueur 2 compare -5 (jouer C) et 0 (jouer D) → meilleure réponse : D</li></ul><p>Les équilibres de Nash en stratégies pures sont donc :</p><ul><li><strong>(C, D) :</strong> gains (10, -5). Le Joueur 1 joue C, le Joueur 2 joue D. Aucun joueur n'a intérêt à changer unilatéralement.</li><li><strong>(D, C) :</strong> gains (-5, 10). Le Joueur 1 joue D, le Joueur 2 joue C. Aucun joueur n'a intérêt à changer unilatéralement.</li></ul><p>Il y a donc deux équilibres de Nash en stratégies pures.</p>"
       },
       {
         "question": "<p><strong>1.3 (2 pts)</strong> On considère le même jeu de la poule mouillée. Calculez l'équilibre de Nash en stratégies mixtes.</p>",
         "reponse": "<p>Soit \\( p \\) la probabilité que le Joueur 1 joue C, et \\( q \\) la probabilité que le Joueur 2 joue C.</p><p><strong>Pour le Joueur 1 :</strong><br>Gain espéré en jouant C : \\( U_1(C) = (-10)q + 10(1-q) = -10q + 10 - 10q = 10 - 20q \\)<br>Gain espéré en jouant D : \\( U_1(D) = (-5)q + 0(1-q) = -5q \\)</p><p>Pour que le Joueur 1 soit indifférent : \\( U_1(C) = U_1(D) \\)<br>\\( 10 - 20q = -5q \\)<br>\\( 10 = 15q \\)<br>\\( q = \\frac{2}{3} \\)</p><p><strong>Pour le Joueur 2 :</strong><br>Gain espéré en jouant C : \\( U_2(C) = (-10)p + 10(1-p) = -10p + 10 - 10p = 10 - 20p \\)<br>Gain espéré en jouant D : \\( U_2(D) = (-5)p + 0(1-p) = -5p \\)</p><p>Pour que le Joueur 2 soit indifférent : \\( U_2(C) = U_2(D) \\)<br>\\( 10 - 20p = -5p \\)<br>\\( 10 = 15p \\)<br>\\( p = \\frac{2}{3} \\)</p><p>L'équilibre de Nash en stratégies mixtes est donc :</p><ul><li>Joueur 1 joue C avec probabilité \\( \\frac{2}{3} \\) et D avec probabilité \\( \\frac{1}{3} \\)</li><li>Joueur 2 joue C avec probabilité \\( \\frac{2}{3} \\) et D avec probabilité \\( \\frac{1}{3} \\)</li></ul>"
       },
       {
         "question": "<p><strong>1.4 (1 pt)</strong> Énoncez le théorème de Nash. Quelle est son importance en théorie des jeux ?</p>",
         "reponse": "<p><strong>Théorème de Nash :</strong> Tout jeu fini (c'est-à-dire avec un nombre fini de joueurs et un nombre fini de stratégies pures pour chaque joueur) admet au moins un équilibre de Nash, éventuellement en stratégies mixtes.</p><p><strong>Importance :</strong> Ce théorème est fondamental car il garantit l'existence d'une solution stable pour une très large classe de jeux. Il assure que dans tout conflit stratégique modélisable par un jeu fini, il existe toujours un état où aucun joueur n'a intérêt à dévier unilatéralement. Ce résultat a valu à John Nash le prix Nobel d'économie en 1994.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Applications en Data Science - Régularisation et Optimisation",
     "points": "7 pts",
     "enonce": "<p>Cet exercice porte sur les applications de l'optimisation en Data Science vues dans les leçons 26 à 28 (chapitre 8).</p>",
     "questions": [
       {
         "question": "<p><strong>2.1 (1.5 pts)</strong> Expliquez comment la régularisation L2 (Ridge) peut être interprétée comme un problème d'optimisation sous contrainte. Quelle est la différence fondamentale avec la régularisation L1 (Lasso) ?</p>",
         "reponse": "<p>La régularisation L2 (Ridge) peut être vue comme un problème d'optimisation sous contrainte :</p><div class='math-block'><div class='math'>$$ \\min_{\\theta} J(\\theta) \\quad \\text{sous la contrainte} \\quad \\sum_{j=1}^{p} \\theta_j^2 \\leq t $$</div></div><p>où \\( t \\) est une constante liée au paramètre de régularisation \\( \\lambda \\).</p><p><strong>Différence fondamentale avec la régularisation L1 (Lasso) :</strong></p><ul><li><strong>L2 (Ridge) :</strong> La contrainte est une boule euclidienne (cercle en 2D). Elle pénalise les grands poids mais ne les annule jamais complètement.</li><li><strong>L1 (Lasso) :</strong> La contrainte est une boule de Manhattan (losange en 2D). Elle peut annuler certains poids, réalisant ainsi une sélection de variables.</li></ul><p>Cette différence géométrique explique pourquoi Lasso produit des modèles parcimonieux, tandis que Ridge réduit les coefficients mais les garde non nuls.</p>"
       },
       {
         "question": "<p><strong>2.2 (1.5 pts)</strong> Dans un problème de régression linéaire avec régularisation L2, la fonction de coût est :</p><div class='math-block'><div class='math'>$$ J(\\theta) = \\frac{1}{2} \\sum_{i=1}^{n} (y_i - \\theta^T x_i)^2 + \\frac{\\lambda}{2} \\|\\theta\\|^2 $$</div></div><p>Calculez le gradient de cette fonction par rapport à \\( \\theta \\). En déduire la mise à jour pour une itération de descente de gradient.</p>",
         "reponse": "<p>On calcule le gradient de \\( J(\\theta) \\) :</p><div class='math-block'><div class='math'>$$ \\nabla J(\\theta) = -\\sum_{i=1}^{n} (y_i - \\theta^T x_i) x_i + \\lambda \\theta $$</div></div><p>Pour une descente de gradient avec un taux d'apprentissage \\( \\alpha \\) :</p><div class='math-block'><div class='math'>$$ \\theta_{k+1} = \\theta_k - \\alpha \\nabla J(\\theta_k) $$</div></div><div class='math-block'><div class='math'>$$ \\theta_{k+1} = \\theta_k + \\alpha \\sum_{i=1}^{n} (y_i - \\theta_k^T x_i) x_i - \\alpha \\lambda \\theta_k $$</div></div><p>On peut réécrire cette mise à jour comme :</p><div class='math-block'><div class='math'>$$ \\theta_{k+1} = (1 - \\alpha \\lambda) \\theta_k + \\alpha \\sum_{i=1}^{n} (y_i - \\theta_k^T x_i) x_i $$</div></div><p>Le terme \\( (1 - \\alpha \\lambda) \\) est le facteur de décroissance des poids, caractéristique de la régularisation L2.</p>"
       },
       {
         "question": "<p><strong>2.3 (2 pts)</strong> Un data scientist camerounais souhaite optimiser les hyperparamètres de son modèle de régression. Il hésite entre la recherche par grille (Grid Search) et la recherche aléatoire (Random Search). Comparez ces deux méthodes et indiquez dans quel cas chacune est préférable.</p>",
         "reponse": "<p><strong>Recherche par grille (Grid Search) :</strong></p><ul><li>Définit une grille fixe de valeurs pour chaque hyperparamètre.</li><li>Explore toutes les combinaisons possibles.</li><li>Garantit de trouver la meilleure combinaison sur la grille.</li><li>Peut devenir coûteux en temps de calcul quand le nombre de paramètres ou le nombre de valeurs augmente.</li></ul><p><strong>Recherche aléatoire (Random Search) :</strong></p><ul><li>Échantillonne aléatoirement des combinaisons d'hyperparamètres selon des distributions spécifiées.</li><li>Ne garantit pas de trouver l'optimum global, mais est souvent plus efficace en pratique.</li><li>Permet d'explorer plus de valeurs distinctes par hyperparamètre pour un nombre d'itérations donné.</li></ul><p><strong>Cas d'usage :</strong></p><ul><li><strong>Grid Search</strong> est préférable quand : l'espace de recherche est petit, les hyperparamètres sont peu nombreux, ou quand on dispose de beaucoup de ressources de calcul.</li><li><strong>Random Search</strong> est préférable quand : l'espace de recherche est grand, les hyperparamètres sont nombreux, ou quand on dispose de ressources limitées.</li></ul>"
       },
       {
         "question": "<p><strong>2.4 (2 pts)</strong> En apprentissage profond, quels sont les principaux défis de l'optimisation ? Expliquez comment des optimiseurs comme Adam ou RMSprop aident à surmonter ces défis par rapport au SGD classique.</p>",

         "question": "<p><strong>3.3 (1.5 pts)</strong> Un étudiant en Data Science doit préparer un voyage. Il a un sac à dos de capacité \\( W = 10 \\) kg. Il souhaite maximiser la valeur totale des objets qu'il emporte. Les objets disponibles sont :</p><table style='width:100%;border-collapse:collapse;margin:10px 0;'><thead><tr><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>Objet</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>1</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>2</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>3</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>4</th></tr></thead><tbody><tr><td style='border:1px solid #ddd;padding:8px;background-color:#f9f9f9;'><strong>Poids (kg)</strong></td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>6</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>3</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>4</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>2</td></tr><tr><td style='border:1px solid #ddd;padding:8px;background-color:#f9f9f9;'><strong>Valeur</strong></td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>30</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>14</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>20</td><td style='border:1px solid #ddd;padding:8px;text-align:center;'>9</td></tr></tbody></table><p>Résolvez ce problème du sac à dos par programmation dynamique.</p>",
         "reponse": "<p>On construit la table de programmation dynamique \\( dp[i][w] \\) = valeur maximale avec les \\( i \\) premiers objets et une capacité \\( w \\).</p><table style='width:100%;border-collapse:collapse;margin:10px 0;'><thead><tr><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>i \\ w</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>0</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>1</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>2</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>3</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>4</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>5</th><th style='border:1px solid #ddd;padding:8px;background-color:#f2f2f2;text-align:center;'>6</th><th style='border:1px solid #ddd;padding:8px;background;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
