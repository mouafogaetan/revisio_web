<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Gestion de Projet Data Science - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Questions de Cours (4 points)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 0.95em;'><p style='font-weight: bold;'>Répondez de manière concise et précise aux questions suivantes :</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1.</strong> Définir un risque en gestion de projet. Quelle est la différence entre un risque et un problème ? <em>(1 point)</em></p></div>",
          "reponse": "<div><p>Un <strong>risque</strong> est un événement incertain qui, s'il se produit, aura un impact (positif ou négatif) sur les objectifs du projet. La différence avec un problème est que le risque est <strong>potentiel</strong> (peut arriver ou non), alors qu'un problème est un événement <strong>avéré</strong> qui a déjà eu lieu et affecte le projet.</p></div>"
        },
        {
          "question": "<div><p><strong>2.</strong> Énoncer les trois contraintes classiques d'un projet (\"triangle d'or\"). Donner un exemple de leur application dans un projet Data Science. <em>(1.5 point)</em></p></div>",
          "reponse": "<div><p>Les trois contraintes classiques sont :</p><ul><li><strong>Coût</strong> (budget disponible)</li><li><strong>Délai</strong> (temps imparti)</li><li><strong>Qualité/Périmètre</strong> (ce qui doit être livré)</li></ul><p><strong>Exemple :</strong> Dans un projet de détection de fraude, si le budget est réduit, on peut soit réduire le périmètre (moins de fonctionnalités), soit augmenter le délai, soit accepter une qualité moindre (modèle moins performant).</p></div>"
        },
        {
          "question": "<div><p><strong>3.</strong> Pourquoi les méthodes agiles sont-elles particulièrement adaptées aux projets Data Science ? <em>(1.5 point)</em></p></div>",
          "reponse": "<div><p>Les méthodes agiles sont adaptées aux projets Data Science car elles permettent de :</p><ul><li>Faire face à l'<strong>incertitude</strong> et à la nature exploratoire des projets Data Science.</li><li>Intégrer les <strong>retours</strong> des parties prenantes de manière continue.</li><li>Livrer des <strong>prototypes</strong> rapidement pour valider les hypothèses.</li><li>S'adapter aux <strong>changements</strong> découverts lors de l'exploration des données.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 1 : Processus de Poisson (6 points)",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 0.95em;'><p>Soit \\( (N_t)_{t \\geq 0} \\) un processus de Poisson d'intensité \\( \\lambda > 0 \\). On note \\( (T_n)_{n \\geq 1} \\) ses temps d'arrivée (ou de saut).</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1.</strong> On considère \\( 0 \\leq s < t \\). Calculer l'espérance conditionnelle \\( \\mathbb{E}[N_s | N_t] \\). <em>(2 points)</em></p></div>",
          "reponse": "<div><p>Sachant \\( N_t = n \\), les \\( n \\) sauts du processus sont répartis uniformément sur \\( [0,t] \\).\nAinsi, \\( N_s \\) conditionnellement à \\( N_t = n \\) suit une loi binomiale de paramètres \\( n \\) et \\( p = s/t \\).\nDonc :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\mathbb{E}[N_s | N_t] = N_t \\cdot \\frac{s}{t} $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>2.</strong> Montrer que pour \\( s < t \\), \\( \\text{Cov}(N_s, N_t) = \\lambda s \\). <em>(2 points)</em></p></div>",
          "reponse": "<div><p>On utilise la propriété des accroissements indépendants :\n\\( N_t = N_s + (N_t - N_s) \\).</p><p>\\[ \\text{Cov}(N_s, N_t) = \\mathbb{E}[N_s N_t] - \\mathbb{E}[N_s]\\mathbb{E}[N_t] \\]\n\\[ = \\mathbb{E}[N_s (N_s + N_t - N_s)] - (\\lambda s)(\\lambda t) \\]\n\\[ = \\mathbb{E}[N_s^2] + \\mathbb{E}[N_s]\\mathbb{E}[N_t - N_s] - \\lambda^2 s t \\]\n\\[ = (\\lambda s + \\lambda^2 s^2) + (\\lambda s)(\\lambda(t-s)) - \\lambda^2 s t \\]\n\\[ = \\lambda s \\]</p></div>"
        },
        {
          "question": "<div><p><strong>3.</strong> En utilisant la loi des grands nombres, montrer que \\( \\frac{N_t}{t} \\to \\lambda \\) presque sûrement quand \\( t \\to \\infty \\). <em>(2 points)</em></p></div>",
          "reponse": "<div><p>Par la loi forte des grands nombres appliquée aux temps d'inter-arrivée \\( T_i \\) (i.i.d. de moyenne \\( 1/\\lambda \\)) :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\frac{T_1 + \\dots + T_{N_t}}{N_t} \\xrightarrow{p.s.} \\frac{1}{\\lambda} $$</div></div><p>Or \\( T_1 + \\dots + T_{N_t} \\approx t \\). Donc \\( \\frac{t}{N_t} \\to 1/\\lambda \\), soit \\( N_t/t \\to \\lambda \\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement Brownien et Processus de Poisson (5 points)",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 0.95em;'><p>Soit \\( (B_t)_{t \\geq 0} \\) un mouvement brownien standard et \\( (N_t)_{t \\geq 0} \\) un processus de Poisson d'intensité \\( \\lambda > 0 \\), indépendants.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1.</strong> Calculer \\( \\mathbb{E}[B_s^2 N_t] \\) pour \\( 0 \\leq s \\leq t \\). <em>(2 points)</em></p></div>",
          "reponse": "<div><p>Par indépendance, \\( \\mathbb{E}[B_s^2 N_t] = \\mathbb{E}[B_s^2] \\mathbb{E}[N_t] \\).\nPour un brownien, \\( \\mathbb{E}[B_s^2] = s \\), et \\( \\mathbb{E}[N_t] = \\lambda t \\). Donc :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\mathbb{E}[B_s^2 N_t] = s \\cdot \\lambda t $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>2.</strong> Pour \\( 0 \\leq s < t \\), déterminer \\( \\text{Cov}(B_s^2, N_t) \\). <em>(1.5 point)</em></p></div>",
          "reponse": "<div><p>La covariance est nulle car les processus sont indépendants :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\text{Cov}(B_s^2, N_t) = \\mathbb{E}[B_s^2 N_t] - \\mathbb{E}[B_s^2]\\mathbb{E}[N_t] = 0 $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3.</strong> Soit la fonction \\( f(t) = \\mathbb{E}[B_t N_t] \\). Déterminer \\( f(t) \\). <em>(1.5 point)</em></p></div>",
          "reponse": "<div><p>Par indépendance :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$ f(t) = \\mathbb{E}[B_t] \\mathbb{E}[N_t] = 0 \\times \\lambda t = 0 $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Gestion des Parties Prenantes (5 points)",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 0.95em;'><p>Une entreprise de e-commerce souhaite développer un <strong>système de recommandation de produits</strong> pour augmenter ses ventes. Vous êtes chef de projet sur ce projet.</p><p>Les parties prenantes identifiées sont :</p><ul><li><strong>Directeur Commercial</strong> - Sponsor du projet</li><li><strong>Responsable Marketing</strong> - Product Owner</li><li><strong>Équipe Data Science</strong> (4 personnes)</li><li><strong>Équipe Développement</strong> (5 personnes)</li><li><strong>Clients</strong> - Utilisateurs finaux</li><li><strong>Service IT</strong> - Infrastructure</li></ul></div>",
      "questions": [
        {
          "question": "<div><p><strong>1.</strong> En vous basant sur la matrice pouvoir/intérêt, classez ces parties prenantes dans les quatre quadrants. <em>(3 points)</em></p></div>",
          "reponse": "<div><p><strong>Quadrant A (Intérêt faible, Pouvoir faible) :</strong> Aucune partie prenante dans ce cas simple.</p><p><strong>Quadrant B (Intérêt élevé, Pouvoir faible) :</strong></p><ul><li><strong>Clients :</strong> Ils utilisent le système, leur satisfaction est importante mais ils ont peu de pouvoir direct.</li></ul><p><strong>Quadrant C (Intérêt faible, Pouvoir élevé) :</strong></p><ul><li><strong>Service IT :</strong> Ils gèrent l'infrastructure et la sécurité. Intérêt technique mais faible intérêt métier.</li></ul><p><strong>Quadrant D (Intérêt élevé, Pouvoir élevé) :</strong></p><ul><li><strong>Directeur Commercial :</strong> Décide du budget et de la stratégie.</li><li><strong>Responsable Marketing :</strong> Définit les besoins et valide les résultats.</li><li><strong>Équipe Data Science :</strong> Cœur du projet, expertise essentielle.</li><li><strong>Équipe Développement :</strong> Responsable de l'intégration technique.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2.</strong> Pour chaque quadrant, proposez une stratégie de communication adaptée. <em>(2 points)</em></p></div>",
          "reponse": "<div><p><strong>Quadrant B (Clients) :</strong></p><ul><li>Enquêtes de satisfaction, tests A/B, canaux de feedback.</li></ul><p><strong>Quadrant C (Service IT) :</strong></p><ul><li>Rapports techniques mensuels, réunions de validation architecture.</li></ul><p><strong>Quadrant D (Parties prenantes clés) :</strong></p><ul><li><strong>Directeur Commercial :</strong> Réunions de pilotage hebdomadaires, dashboard des KPIs.</li><li><strong>Responsable Marketing :</strong> Réunions bi-hebdomadaires pour aligner les besoins.</li><li><strong>Data Science et Développement :</strong> Daily Scrum, rétrospectives, revues de sprint.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Gestion des Risques (5 points)",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 0.95em;'><p>Vous êtes chef de projet pour un projet de <strong>détection de fraude en temps réel</strong> dans une banque.</p><p>Voici les risques identifiés :</p><ul><li><strong>R1 - Qualité des données</strong> : Les données historiques contiennent des erreurs et des valeurs manquantes.</li><li><strong>R2 - Biais du modèle</strong> : Le modèle pourrait discriminer certains groupes de clients.</li><li><strong>R3 - Performance</strong> : Le modèle pourrait ne pas atteindre les performances attendues en production.</li><li><strong>R4 - Sécurité</strong> : Les données sensibles pourraient être exposées.</li></ul></div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
