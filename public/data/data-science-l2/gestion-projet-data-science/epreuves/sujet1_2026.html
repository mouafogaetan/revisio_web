<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Gestion de Projet Data Science - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Définition et Caractéristiques d'un Projet Data Science",
      "points": "4 pts",
      "enonce": "<div style='padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #0d6efd;'><p style='font-size: 1.1em;'>Une entreprise de e-commerce souhaite développer un système de recommandation de produits. Le projet est confié à une équipe Data Science. Ce projet est caractérisé par une forte incertitude sur les résultats et nécessite une approche itérative.</p></div>",
      "questions": [
        {
          "question": "1) Rappeler la définition d'un projet et ses principales caractéristiques.",
          "reponse": "Un projet est un effort temporaire entrepris pour créer un produit, un service ou un résultat unique. Ses principales caractéristiques sont : \n• Un objectif clair et défini.\n• Un début et une fin définis.\n• Des ressources (humaines, matérielles, financières) allouées.\n• Un caractère unique et non répétitif.\n• Il est soumis à des contraintes de coût, de délai et de qualité (triangle d'or)."
        },
        {
          "question": "2) Expliquer en quoi ce projet de recommandation diffère d'un projet logiciel classique.",
          "reponse": "Contrairement à un projet logiciel classique où les spécifications sont souvent connues dès le départ, un projet Data Science est exploratoire. Il se caractérise par une forte incertitude sur la performance du modèle, la qualité des données disponibles et la faisabilité technique. Il nécessite une approche itérative et agile, avec une phase importante de recherche et d'expérimentation (exploration des données, test de plusieurs algorithmes). La livraison d'un modèle performant n'est jamais garantie, ce qui diffère de la livraison d'un logiciel fonctionnel."
        },
        {
          "question": "3) Identifier les trois contraintes classiques d'un projet (triangle d'or) en les appliquant au cas de ce système de recommandation. Donner un exemple de conflit entre ces contraintes.",
          "reponse": "Les trois contraintes sont le Coût (budget alloué aux ressources et aux infrastructures), le Délai (temps imparti pour la mise en production) et le Périmètre (fonctionnalités et performance attendues du système). \nExemple de conflit : Le sponsor souhaite un modèle avec une précision de 95% (périmètre élevé) dans un délai de 3 mois (délai court) avec un budget serré. Atteindre cette précision pourrait nécessiter plus de temps pour le nettoyage des données et l'expérimentation de modèles complexes, ce qui entraînerait un dépassement de délai ou une augmentation du coût (recrutement d'experts, augmentation des capacités de calcul)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Acteurs et Rôles dans un Projet Data Science",
      "points": "3 pts",
      "enonce": "<div style='padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #198754;'><p style='font-size: 1.1em;'>Le projet de système de recommandation réunit plusieurs acteurs aux compétences complémentaires.</p></div>",
      "questions": [
        {
          "question": "1) Définir les rôles et responsabilités des acteurs suivants : Product Owner, Data Scientist et Data Engineer.",
          "reponse": "• Product Owner : Il représente le client et les parties prenantes. Il est responsable de la vision du produit, de la priorisation des fonctionnalités (Product Backlog) et de la maximisation de la valeur apportée par le projet. Il définit les besoins métier et valide les livrables.\n• Data Scientist : Il est responsable de l'analyse exploratoire des données, de la construction, de l'entraînement et de l'évaluation des modèles de machine learning. Il transforme les données en insights et en modèles prédictifs.\n• Data Engineer : Il est responsable de l'infrastructure de données. Il construit et maintient les pipelines de données pour collecter, nettoyer, transformer et stocker les données nécessaires aux Data Scientists."
        },
        {
          "question": "2) Expliquer l'interaction entre le Data Scientist et le Data Engineer dans ce projet.",
          "reponse": "Le Data Engineer fournit au Data Scientist des données propres, structurées et accessibles via des pipelines robustes. Le Data Scientist travaille sur ces données pour construire le modèle. Si le Data Scientist identifie un besoin de données supplémentaires ou une anomalie dans le pipeline, il collabore avec le Data Engineer pour ajuster la collecte et le traitement des données. C'est une relation de dépendance étroite essentielle à la réussite du projet."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodologie Agile - Principes et Manifeste",
      "points": "4 pts",
      "enonce": "<div style='padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #dc3545;'><p style='font-size: 1.1em;'>L'équipe en charge du projet de recommandation a décidé d'adopter une approche agile.</p></div>",
      "questions": [
        {
          "question": "1) Rappeler l'une des quatre valeurs du Manifeste Agile.",
          "reponse": "Par exemple : \"Les individus et leurs interactions plus que les processus et les outils\". Les autres valeurs sont : \"Des logiciels opérationnels plus qu'une documentation exhaustive\", \"La collaboration avec les clients plus que la négociation contractuelle\" et \"L'adaptation au changement plus que le suivi d'un plan\"."
        },
        {
          "question": "2) Expliquer pourquoi les méthodes agiles (comme Scrum) sont particulièrement adaptées aux projets Data Science.",
          "reponse": "Les méthodes agiles sont adaptées car elles permettent de gérer l'incertitude inhérente à la Data Science. Le découpage en itérations courtes (Sprints) permet de valider régulièrement les hypothèses, d'intégrer les retours du Product Owner et de s'adapter aux découvertes (ex : un algorithme ne fonctionne pas comme prévu, une feature s'avère plus importante). L'accent sur la collaboration et l'adaptation au changement correspond bien à la nature exploratoire et expérimentale de la Data Science."
        },
        {
          "question": "3) Donner un exemple d'adaptation de Scrum pour un projet Data Science.",
          "reponse": "Au lieu de Sprints visant à livrer un incrément logiciel utilisable, on peut avoir des Sprints de recherche ou d'exploration. Par exemple, un Sprint peut avoir pour objectif de 'tester trois algorithmes de clustering sur les données clients' plutôt que de 'livrer une fonction de recommandation'. La revue de Sprint (Sprint Review) peut alors se concentrer sur les résultats des expériences et les insights découverts."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Planification et Gestion des Risques",
      "points": "5 pts",
      "enonce": "<div style='padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #6f42c1;'><p style='font-size: 1.1em;'>Lors de la phase de planification, l'équipe a identifié plusieurs risques potentiels pour le projet de système de recommandation.</p></div>",
      "questions": [
        {
          "question": "1) Définir ce qu'est un risque en gestion de projet.",
          "reponse": "Un risque est un événement ou une condition incertaine qui, s'il se produit, aura un effet positif ou négatif sur les objectifs du projet (coût, délai, périmètre, qualité)."
        },
        {
          "question": "2) Citer trois risques spécifiques aux projets Data Science.",
          "reponse": "1. Qualité des données : Les données disponibles peuvent être incomplètes, bruitées ou non représentatives, ce qui dégradera les performances du modèle.\n2. Dérive du modèle (Model Drift) : Les performances du modèle peuvent se dégrader dans le temps car le comportement des clients ou le contexte économique évolue (concept drift).\n3. Biais algorithmique : Le modèle peut apprendre et reproduire des biais présents dans les données d'entraînement, conduisant à des recommandations discriminantes."
        },
        {
          "question": "3) Construire une matrice de risques (Probabilité : Faible/Moyenne/Élevée, Impact : Faible/Moyen/Élevé) en y plaçant les risques suivants : (a) Serveur de production en panne, (b) Les données clients sont trop bruitées pour entraîner un modèle performant.",
          "reponse": "• Risque (b) : La qualité des données est un risque critique dans les projets Data Science. Elle a une forte probabilité de se produire et un impact très élevé sur la performance du modèle. On peut estimer : Probabilité = Élevée, Impact = Élevé. Ce risque doit être prioritaire.\n• Risque (a) : La panne d'un serveur de production est un risque technique classique. Sa probabilité est moyenne (si l'infrastructure est robuste) et son impact est élevé (arrêt du service). On peut estimer : Probabilité = Moyenne, Impact = Élevé."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Livrables et Documentation",
      "points": "4 pts",
      "enonce": "<div style='padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #fd7e14;'><p style='font-size: 1.1em;'>Le projet arrive en phase de finalisation. L'équipe doit préparer ses livrables pour la direction (public métier) et pour l'équipe de maintenance (public technique).</p></div>",
      "questions": [
        {
          "question": "1) Citer un livrable technique et un livrable métier pour ce projet.",
          "reponse": "• Livrable technique : Le code du modèle de recommandation, le notebook d'entraînement, l'API de déploiement, la documentation du pipeline de données.\n• Livrable métier : Un rapport présentant les insights sur les comportements des clients, la performance du modèle (ex : augmentation attendue du panier moyen), et des recommandations stratégiques pour l'entreprise."
        },
        {
          "question": "2) Expliquer l'importance d'un fichier README dans un projet Data Science.",
          "reponse": "Le fichier README est essentiel pour la reproductibilité et la collaboration. Il doit contenir la description du projet, les instructions d'installation et de configuration, les dépendances (fichier requirements.txt), un exemple d'utilisation du code ou du modèle, et expliquer l'organisation du dépôt. Il permet à un nouveau membre de l'équipe (ou à un évaluateur) de comprendre et d'utiliser le projet rapidement."
        },
        {
          "question": "3) Expliquer l'importance de la reproductibilité en Data Science et citer un élément essentiel pour l'assurer.",
          "reponse": "La reproductibilité garantit que les résultats obtenus peuvent être vérifiés et reproduits par d'autres scientifiques. Elle est cruciale pour la crédibilité du travail et pour la maintenance future. Un élément essentiel pour l'assurer est la gestion des versions du code (via Git) et des données (via des outils comme DVC), ainsi que l'utilisation d'environnements virtuels pour figer les versions des bibliothèques."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
