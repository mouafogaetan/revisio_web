<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Gestion de Projet Data Science - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 3 - Communication, Livrables, Outils et MLOps",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Identification et Analyse des Parties Prenantes",
      "points": "4 pts",
      "enonce": "<p>Vous êtes chef de projet pour le développement d'un système de recommandation de produits pour une plateforme e-commerce. Les données proviennent de l'historique des achats des clients, des données de navigation, et des retours clients. Le projet implique plusieurs services : marketing, informatique, service client, et direction générale.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Identifiez et classez les principales parties prenantes de ce projet selon leur intérêt et leur influence (matrice des parties prenantes). Justifiez chaque classement. (2 pts)</p>",
          "reponse": "<p><strong>Parties prenantes clés :</strong></p><ul><li><strong>Direction générale (Sponsor) :</strong> Intérêt élevé, Influence élevée. Finance le projet et attend un retour sur investissement.</li><li><strong>Marketing :</strong> Intérêt élevé, Influence moyenne. Utilisera le système pour les campagnes, influence les fonctionnalités.</li><li><strong>Informatique/Data Engineer :</strong> Intérêt élevé, Influence élevée. Responsable de l'infrastructure et de l'intégration des données.</li><li><strong>Service client :</strong> Intérêt moyen, Influence faible. Bénéficiera du système mais peu d'influence directe.</li><li><strong>Clients :</strong> Intérêt élevé, Influence faible (indirectement via les feedbacks). Utilisateurs finaux.</li></ul><p><strong>Matrice :</strong></p><ul><li><strong>Gérer étroitement :</strong> Direction générale, Data Engineer.</li><li><strong>Tenir informé :</strong> Marketing, Service client.</li><li><strong>Impliquer :</strong> Les équipes techniques.</li><li><strong>Surveiller :</strong> Clients (feedback).</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Proposez un plan de communication pour ces parties prenantes en précisant : les objectifs, les canaux, la fréquence et le format pour chaque catégorie. (2 pts)</p>",
          "reponse": "<p><strong>Plan de communication :</strong></p><ul><li><strong>Direction générale :</strong> Rapports mensuels (présentation synthétique, indicateurs clés, ROI attendu). Email de suivi hebdomadaire.</li><li><strong>Marketing :</strong> Réunions bimensuelles pour recueillir les besoins, démonstrations des fonctionnalités. Dashboard de suivi des performances du modèle.</li><li><strong>Équipe technique :</strong> Stand-up meetings quotidiens, Jira/Trello pour le suivi des tâches, réunions de sprint (Scrum).</li><li><strong>Service client :</strong> Newsletters d'information sur les nouvelles fonctionnalités, canal dédié pour les feedbacks.</li><li><strong>Clients :</strong> Sondages de satisfaction, feedbacks via l'application.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Communication Technique vs Métier",
      "points": "3 pts",
      "enonce": "<p>Vous avez terminé le développement d'un modèle de prédiction du désabonnement (churn) des clients. Les résultats techniques sont les suivants : précision = 92%, rappel = 88%, F1-score = 90%. Le modèle identifie 10% des clients comme 'à risque élevé' de désabonnement.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Rédigez un message destiné à l'équipe technique (Data Scientists, Data Engineers) présentant ces résultats. (1,5 pt)</p>",
          "reponse": "<p><strong>Message technique :</strong></p><p>\"Le modèle de prédiction de churn (version 2.1) a été évalué sur le jeu de test. Les performances sont les suivantes : précision = 92%, rappel = 88%, F1-score = 90%. La courbe AUC-ROC est de 0.95. La matrice de confusion montre que nous avons 85 vrais positifs, 7 faux positifs, 12 faux négatifs, et 96 vrais négatifs. Les variables les plus importantes sont : durée d'abonnement (0.45), nombre de réclamations (0.32), et montant des achats (0.23). Nous recommandons de déployer ce modèle en production et de mettre en place un monitoring pour détecter les dérives.\"</p>"
        },
        {
          "question": "<p><strong>2.</strong> Rédigez un message destiné à la direction (non technique) présentant ces résultats en termes d'impact sur l'entreprise. (1,5 pt)</p>",
          "reponse": "<p><strong>Message direction :</strong></p><p>\"Notre nouveau modèle de prédiction du désabonnement est opérationnel. Il identifie avec une fiabilité de 90% les clients à risque de nous quitter. Concrètement, sur 10 000 clients, le modèle nous permet d'identifier environ 900 clients susceptibles de se désabonner. En mettant en place des actions de fidélisation ciblées sur ces clients, nous estimons pouvoir réduire notre taux d'attrition de 15% sur les 6 prochains mois, ce qui représente un gain potentiel de 200 millions de FCFA. Nous recommandons de déployer ce système et de former les équipes marketing à son utilisation.\"</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Livrables en Data Science",
      "points": "4 pts",
      "enonce": "<p>Vous êtes en charge d'un projet Data Science de bout en bout : prédiction de la demande de produits pour une chaîne de distribution. Le projet est à mi-parcours.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Listez les livrables que vous produirez à chaque phase du projet (initiation, planification, exécution, clôture) en précisant s'ils sont techniques ou métier. (2 pts)</p>",
          "reponse": "<p><strong>Livrables par phase :</strong></p><ul><li><strong>Initiation :</strong> Charte de projet (métier), identification des parties prenantes (métier), analyse de faisabilité (technique).</li><li><strong>Planification :</strong> WBS (technique), diagramme de Gantt (métier), plan de gestion des risques (métier), cahier des charges technique (technique).</li><li><strong>Exécution :</strong> Notebooks Jupyter d'exploration et de modélisation (technique), rapports d'avancement (métier), dashboards de suivi (métier), modèles entraînés (technique).</li><li><strong>Clôture :</strong> Rapport final (métier), documentation technique (README, docstrings) (technique), présentation des résultats (métier), API de déploiement (technique).</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Pour le livrable 'modèle entraîné', détaillez ce que doit contenir sa documentation pour assurer la reproductibilité. (2 pts)</p>",
          "reponse": "<p><strong>Documentation du modèle :</strong></p><ul><li><strong>Description :</strong> Problème résolu, objectifs, contexte métier.</li><li><strong>Données :</strong> Source, description, volume, variables utilisées, prétraitements effectués.</li><li><strong>Modèle :</strong> Algorithme choisi, hyperparamètres, raison du choix.</li><li><strong>Performance :</strong> Métriques (précision, rappel, F1, AUC, RMSE, etc.) sur les jeux d'entraînement et de test.</li><li><strong>Environnement :</strong> Dépendances (requirements.txt ou environment.yml), versions des bibliothèques.</li><li><strong>Code :</strong> Lien vers le code source (GitHub), instructions pour reproduire les résultats.</li><li><strong>Limites :</strong> Biais connus, cas où le modèle est moins performant, perspectives d'amélioration.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Outils de Collaboration et Gestion de Version",
      "points": "3 pts",
      "enonce": "<p>Une équipe de 5 Data Scientists travaille sur un projet commun. Ils utilisent Git pour le versionnement du code. Le projet est hébergé sur GitHub.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décrivez le workflow Git que vous mettriez en place pour ce projet (branches, pull requests, revues de code). (1,5 pt)</p>",
          "reponse": "<p><strong>Workflow Git :</strong></p><ul><li><strong>Branche principale (main) :</strong> Code stable, prêt pour la production.</li><li><strong>Branche de développement (dev) :</strong> Intégration des nouvelles fonctionnalités.</li><li><strong>Branches de feature :</strong> Une branche par fonctionnalité (ex: feature/nettoyage-donnees, feature/modelisation).</li><li><strong>Pull requests (PR) :</strong> Les développeurs créent une PR depuis leur branche feature vers dev. La PR est revue par au moins un autre membre de l'équipe.</li><li><strong>Revue de code :</strong> Vérification de la qualité du code, des tests, de la documentation. La PR n'est fusionnée qu'après approbation.</li><li><strong>Fusion vers main :</strong> Après validation sur dev, une PR est créée de dev vers main.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Quels sont les avantages d'utiliser GitHub (ou GitLab) plutôt que Git seul pour ce projet collaboratif ? (1,5 pt)</p>",
          "reponse": "<p><strong>Avantages de GitHub :</strong></p><ul><li><strong>Collaboration :</strong> Interface pour les pull requests, commentaires, revues de code.</li><li><strong>Gestion de projet :</strong> Issues, milestones, projets pour suivre l'avancement des tâches.</li><li><strong>Hébergement centralisé :</strong> Accès partagé au dépôt, sauvegarde externe.</li><li><strong>Intégration continue (CI/CD) :</strong> GitHub Actions pour automatiser les tests et les déploiements.</li><li><strong>Documentation :</strong> README, wiki intégré.</li><li><strong>Gestion des accès :</strong> Contrôle des permissions par équipe.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Introduction au MLOps et au Cycle de Vie en Production",
      "points": "3 pts",
      "enonce": "<p>Votre équipe a développé un modèle de classification d'images pour un système de contrôle qualité dans une usine. Le modèle doit être déployé en production et maintenu dans le temps.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Quelles sont les étapes clés du cycle de vie d'un modèle en production selon les principes du MLOps ? (1,5 pt)</p>",
          "reponse": "<p><strong>Cycle de vie d'un modèle en production (MLOps) :</strong></p><ul><li><strong>Collecte et préparation des données :</strong> Acquisition, nettoyage, transformation.</li><li><strong>Développement et entraînement :</strong> Exploration, sélection du modèle, entraînement, validation.</li><li><strong>Déploiement :</strong> Conteneurisation (Docker), mise à disposition via une API, infrastructure (Kubernetes).</li><li><strong>Monitoring :</strong> Surveillance des performances (précision, temps de réponse), détection des dérives (data drift, concept drift).</li><li><strong>Maintenance et retraining :</strong> Planification du ré-entraînement avec de nouvelles données, mise à jour du modèle en production.</li><li><strong>Documentation :</strong> Traçabilité des versions, des données, des hyperparamètres.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquez l'importance du monitoring dans ce contexte et identifiez les indicateurs clés à surveiller. (1,5 pt)</p>",
          "reponse": "<p><strong>Importance du monitoring :</strong> Le monitoring permet de détecter les dérives (data drift, concept drift) qui peuvent rendre le modèle obsolète ou moins performant, et d'assurer la fiabilité du système.</p><p><strong>Indicateurs clés :</strong></p><ul><li><strong>Performance du modèle :</strong> Précision, rappel, F1-score, taux d'erreur (comparé aux performances initiales).</li><li><strong>Temps de réponse :</strong> Latence de l'API, pour garantir la réactivité.</li><li><strong>Data drift :</strong> Distribution des données d'entrée par rapport aux données d'entraînement.</li><li><strong>Concept drift :</strong> Modification de la relation entre les entrées et la sortie.</li><li><strong>Volume de données :</strong> Nombre de prédictions par heure/jour.</li><li><strong>Alertes :</strong> Notifications automatiques en cas de dépassement de seuils.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Cas Pratique - Gestion d'un Projet Data Science de A à Z",
      "points": "3 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
