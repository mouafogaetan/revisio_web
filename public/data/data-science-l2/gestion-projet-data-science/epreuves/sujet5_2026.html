<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Gestion de Projet Data Science - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Répondez aux questions suivantes de manière claire et précise.</p></div>",
      "questions": [
        {
          "question": "<div style='padding: 8px;'><p><strong>1.1</strong> (2 pts) Définissez un projet et ses trois contraintes classiques.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Un projet</strong> est un ensemble d'activités coordonnées et maîtrisées comportant des dates de début et de fin, entreprises pour atteindre un objectif conforme à des exigences spécifiques, dans des contraintes de coûts, de délais et de ressources. Les trois contraintes classiques sont :</p><ul><li><strong>Coût</strong> : le budget alloué au projet.</li><li><strong>Délai</strong> : le temps imparti pour réaliser le projet.</li><li><strong>Qualité</strong> : le niveau de performance attendu du livrable.</li></ul></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>1.2</strong> (2 pts) Citez deux spécificités des projets Data Science et expliquez pourquoi elles rendent la gestion de projet difficile.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Deux spécificités principales :</strong></p><ul><li><strong>L'incertitude et l'exploration</strong> : On ne sait pas toujours à l'avance quelle approche fonctionnera. La phase de recherche et d'expérimentation est essentielle, ce qui rend l'estimation des délais et des coûts difficile.</li><li><strong>L'aspect itératif</strong> : Le projet progresse par cycles successifs d'amélioration du modèle. Les résultats d'une itération peuvent remettre en cause les décisions prises lors des itérations précédentes, créant un besoin constant d'adaptation.</li></ul></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>1.3</strong> (2 pts) Nommez et décrivez brièvement trois rôles clés dans une équipe de projet Data Science.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Trois rôles clés :</strong></p><ul><li><strong>Le Data Scientist</strong> : Il est responsable de l'analyse exploratoire des données, de la construction, de l'entraînement et de l'évaluation des modèles de machine learning.</li><li><strong>Le Data Engineer</strong> : Il conçoit et maintient les pipelines de données. Il est chargé de collecter, nettoyer et préparer les données pour les rendre exploitables par les Data Scientists.</li><li><strong>Le Product Owner</strong> : Il est le représentant du client ou du métier. Il définit la vision du produit, priorise les fonctionnalités dans le backlog et s'assure que l'équipe développe la solution qui apporte le plus de valeur.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Méthodologie de Projet",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Vous êtes le chef de projet d'une équipe Data Science chargée de créer un modèle de prédiction des ventes pour une entreprise de e-commerce.</p></div>",
      "questions": [
        {
          "question": "<div style='padding: 8px;'><p><strong>2.1</strong> (2 pts) Justifiez le choix d'une méthode Agile plutôt qu'une méthode traditionnelle (Cycle en V) pour ce projet. Donnez au moins deux arguments.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p>Le choix d'une méthode Agile est justifié pour plusieurs raisons :</p><ul><li><strong>Incertitude et exploration</strong> : Les projets de Data Science sont exploratoires. Une méthode Agile, par son caractère itératif, permet de valider ou d'invalider des hypothèses rapidement (via des sprints courts) et d'ajuster le cap sans remettre en cause l'ensemble du projet, contrairement au Cycle en V qui est plus rigide.</li><li><strong>Adaptation aux changements</strong> : Les données ou les besoins du métier peuvent évoluer. L'Agile est conçu pour accueillir ces changements, même tard dans le projet, alors que le Cycle en V est difficile à modifier une fois la phase de conception terminée.</li></ul></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>2.2</strong> (2 pts) Décrivez la cérémonie de la <em>Sprint Review</em> dans Scrum. Quelle est son utilité dans le cadre de votre projet de prédiction de ventes ?</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p>La <strong>Sprint Review</strong> est une cérémonie qui se tient à la fin de chaque sprint. L'équipe présente les travaux accomplis durant le sprint (l'<em>Increment</em>) aux parties prenantes (Product Owner, métier, etc.).</p><p><strong>Utilité dans le projet de prédiction de ventes :</strong></p><ul><li>Elle permet de montrer l'avancement du modèle, de partager les résultats préliminaires et de recueillir des retours immédiats du métier sur sa pertinence.</li><li>Elle permet d'ajuster le Product Backlog en fonction des nouvelles découvertes ou des changements de priorités métier, assurant ainsi que l'équipe travaille toujours sur ce qui apporte le plus de valeur.</li></ul></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>2.3</strong> (2 pts) Expliquez quel est l'objectif d'un tableau Kanban et ce que signifie la notion de WIP (<em>Work In Progress</em>). Comment cela pourrait-il aider votre équipe ?</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Un tableau Kanban</strong> est un outil de gestion de projet qui permet de visualiser le flux de travail. Il est divisé en colonnes représentant les différentes étapes du processus (ex: 'À faire', 'En cours', 'En test', 'Terminé').</p><p><strong>Le WIP (Work In Progress)</strong> est une limite fixée pour chaque colonne, qui restreint le nombre de tâches pouvant s'y trouver simultanément.</p><p><strong>Utilité pour l'équipe :</strong></p><ul><li>En limitant le WIP, on identifie rapidement les goulots d'étranglement (ex: trop de tâches en test).</li><li>On force l'équipe à terminer les tâches en cours avant d'en commencer de nouvelles, ce qui améliore le flux et réduit le temps de cycle global.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Outils et Pratiques de Gestion",
      "points": "8 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Votre projet Data Science arrive en phase de planification. Vous devez organiser le travail de l'équipe et structurer les livrables.</p></div>",
      "questions": [
        {
          "question": "<div style='padding: 8px;'><p><strong>3.1</strong> (2 pts) Qu'est-ce qu'une WBS (<em>Work Breakdown Structure</em>) ? Construisez la WBS de premier niveau (les 4 ou 5 grandes phases) pour votre projet de prédiction de ventes.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p>La <strong>WBS (Work Breakdown Structure)</strong> est une structure de décomposition du travail qui permet de décomposer un projet en tâches plus petites et plus faciles à gérer.</p><p><strong>WBS de premier niveau pour le projet de prédiction de ventes :</strong></p><ul><li><strong>1. Compréhension du domaine et spécification des besoins</strong></li><li><strong>2. Collecte, exploration et préparation des données</strong></li><li><strong>3. Modélisation et évaluation du modèle</strong></li><li><strong>4. Déploiement et livraison des livrables</strong></li></ul></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>3.2</strong> (2 pts) Citez deux méthodes d'estimation des tâches. Expliquez laquelle serait la plus précise pour estimer la durée de la tâche 'Nettoyage des données' et pourquoi.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Deux méthodes d'estimation :</strong></p><ul><li><strong>Estimation ascendante</strong> : On décompose la tâche en sous-tâches très fines, on estime chacune d'elles, puis on les somme.</li><li><strong>Estimation analogique</strong> : On se base sur la durée de tâches similaires réalisées lors de projets antérieurs.</li></ul><p><strong>La méthode la plus précise</strong> pour le 'Nettoyage des données' est l'<strong>estimation ascendante</strong>. Cette tâche est souvent complexe et très dépendante de la qualité des données. La décomposer en sous-tâches (gestion des valeurs manquantes, des doublons, des formats, etc.) permet d'affiner l'estimation et de réduire l'incertitude.</p></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>3.3</strong> (2 pts) Décrivez ce qu'est un diagramme de Gantt. Quel est son principal avantage pour le suivi de l'avancement du projet ?</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p>Un <strong>diagramme de Gantt</strong> est un outil de planification qui représente les tâches d'un projet sous forme de barres horizontales sur un calendrier. Pour chaque tâche, on visualise sa date de début, sa durée et sa date de fin.</p><p><strong>Principal avantage pour le suivi :</strong> Il offre une <strong>visualisation simple et intuitive</strong> de l'état d'avancement. En comparant le planning prévu (les barres initiales) avec l'avancement réel (par exemple, en colorant une partie de la barre), le chef de projet et les parties prenantes peuvent facilement identifier les retards et les écarts, et ainsi prendre des décisions de pilotage rapidement.</p></div>"
        },
        {
          "question": "<div style='padding: 8px;'><p><strong>3.4</strong> (2 pts) Expliquez l'importance du monitoring et du concept de <em>Data Drift</em> dans la maintenance d'un modèle en production.</p></div>",
          "reponse": "<div style='padding: 8px; background-color: #f0f8ff; border-radius: 5px;'><p><strong>Le monitoring</strong> est l'activité de surveillance continue des performances d'un modèle déployé en production.</p><p><strong>Le Data Drift</strong> désigne la dérive des données d'entrée du modèle. Cela se produit lorsque les caractéristiques statistiques des données que le modèle reçoit en production (ex: distribution d'une variable) changent par rapport aux données sur lesquelles il a été entraîné.</p><p><strong>Son importance :</strong> Un modèle qui n'est pas surveillé peut voir ses performances se dégrader sans que personne ne s'en aperçoive (concept drift). La détection d'un Data Drift est un signal d'alerte qui indique qu'il est temps de ré-entraîner le modèle avec des données plus récentes pour maintenir sa pertinence et sa précision.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
