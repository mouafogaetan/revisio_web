<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algorithmique et Structures de Données Avancées - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Arbres Équilibrés",
      "points": "5 pts",
      "enonce": "<p>Cette exercice porte sur les arbres AVL et Rouge-Noir, deux structures de données fondamentales pour maintenir un ensemble ordonné avec des opérations en <span class='math'>\\(O(\\log n)\\)</span>.</p><p>Un arbre AVL est un arbre binaire de recherche où, pour chaque nœud, la hauteur des sous-arbres gauche et droit diffère d'au plus 1. Le facteur d'équilibre d'un nœud est défini comme : <span class='math'>\\(FE = hauteur(gauche) - hauteur(droite)\\)</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (1 pt)</strong> — Définissez la condition d'équilibre d'un arbre AVL. Que se passe-t-il si un nœud a un facteur d'équilibre de 2 ou -2 ?</p>",
          "reponse": "<p>Un arbre AVL est un arbre binaire de recherche où pour chaque nœud, le facteur d'équilibre (hauteur du sous-arbre gauche moins hauteur du sous-arbre droit) est compris entre -1 et 1. Si un nœud a un facteur d'équilibre de 2 ou -2, cela signifie que l'arbre est déséquilibré. Il faut alors effectuer une ou plusieurs rotations (simple ou double) pour rétablir l'équilibre [citation:1][citation:12].</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> — Un arbre Rouge-Noir est un autre type d'arbre équilibré. Énoncez les 5 propriétés qui le définissent. En quoi sa condition d'équilibre est-elle moins stricte que celle d'un AVL ?</p>",
          "reponse": "<p>Les 5 propriétés d'un arbre Rouge-Noir sont :</p><ol><li>Chaque nœud est soit rouge, soit noir.</li><li>La racine est noire.</li><li>Les feuilles (les nœuds NIL) sont noires.</li><li>Les enfants d'un nœud rouge sont noirs (il ne peut pas y avoir deux rouges consécutifs sur un chemin).</li><li>Pour chaque nœud, tous les chemins de ce nœud vers ses feuilles descendantes contiennent le même nombre de nœuds noirs.</li></ol><p>La condition est moins stricte que celle de l'AVL car elle n'exige pas que la hauteur des sous-arbres diffère d'au plus 1. Elle garantit seulement qu'aucun chemin n'est plus de deux fois plus long qu'un autre, ce qui est suffisant pour garantir une complexité de <span class='math'>\\(O(\\log n)\\)</span>. Les opérations de rééquilibrage sont donc souvent moins coûteuses qu'avec un AVL.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> — Comparez les arbres AVL et Rouge-Noir en termes de complexité pour la recherche, l'insertion et la suppression. Dans quels cas un AVL est-il préférable à un Rouge-Noir ?</p>",
          "reponse": "<p>Les deux structures offrent des complexités de <span class='math'>\\(O(\\log n)\\)</span> pour la recherche, l'insertion et la suppression. Cependant :</p><ul><li>Les <strong>AVL</strong> offrent une recherche légèrement plus rapide car ils sont plus équilibrés (hauteur < 1.44 log n), mais les insertions et suppressions peuvent nécessiter plus de rotations (jusqu'à <span class='math'>\\(O(\\log n)\\)</span> rotations).</li><li>Les <strong>Rouge-Noir</strong> offrent des insertions et suppressions plus rapides (au plus 3 rotations pour l'insertion) au prix d'une recherche légèrement plus lente (hauteur < 2 log n).</li></ul><p>L'AVL est préférable lorsque les opérations de recherche sont très fréquentes et les insertions/suppressions rares. Le Rouge-Noir est préférable pour les applications où les insertions et suppressions sont nombreuses.</p>"
        }
      ]
    },
    {
      "titre": "Tas et Files de Priorité",
      "points": "4 pts",
      "enonce": "<p>Un tas binaire est un arbre binaire complet qui respecte la propriété de tas : pour un max-heap, la clé d'un nœud est supérieure ou égale à celle de ses enfants.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (1 pt)</strong> — Expliquez les opérations de <strong>sift-up</strong> et de <strong>sift-down</strong> dans un tas binaire. Quelle est leur complexité et dans quel contexte chacune est-elle utilisée ?</p>",
          "reponse": "<p>Le <strong>sift-up</strong> (ou remontée) est utilisé lors de l'insertion d'un élément. On place l'élément en dernière position du tas, puis on le remonte vers la racine en l'échangeant avec son parent tant qu'il est supérieur (pour un max-heap). Sa complexité est <span class='math'>\\(O(\\log n)\\)</span>.</p><p>Le <strong>sift-down</strong> (ou descente) est utilisé lors de la suppression du maximum (ou minimum). On remplace la racine par le dernier élément du tas, puis on fait descendre cet élément en l'échangeant avec son enfant le plus grand (pour un max-heap) jusqu'à rétablir la propriété de tas. Sa complexité est également <span class='math'>\\(O(\\log n)\\)</span>.</p>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> — Le tri par tas (Heap Sort) utilise une structure de tas pour trier un tableau en <span class='math'>\\(O(n \\log n)\\)</span>. Décrivez les deux phases de l'algorithme. Comment construit-on un tas à partir d'un tableau non trié en <span class='math'>\\(O(n)\\)</span> ?</p>",
          "reponse": "<p>Le tri par tas se déroule en deux phases :</p><ol><li><strong>Construction du tas</strong> (build-heap) : on transforme le tableau en un tas. Pour cela, on part des derniers nœuds parents (à partir de l'indice n/2 - 1) et on applique sift-down sur chacun jusqu'à la racine. Cette opération est en <span class='math'>\\(O(n)\\)</span>.</li><li><strong>Extraction successive</strong> : on extrait la racine (le maximum) en l'échangeant avec le dernier élément du tas, on réduit la taille du tas de 1, puis on applique sift-down sur la racine. On répète cette opération n fois.</li></ol>"
        },
        {
          "question": "<p><strong>2.3 (1 pt)</strong> — Citez deux applications des files de priorité en Data Science et expliquez brièvement leur utilité.</p>",
          "reponse": "<p>Les files de priorité sont utilisées en Data Science pour :</p><ul><li><strong>Algorithme de Dijkstra</strong> : pour trouver les plus courts chemins dans un graphe, notamment dans les systèmes de recommandation ou pour l'analyse de réseaux.</li><li><strong>Recherche des k plus proches voisins (k-NN) optimisée</strong> : pour maintenir une liste des k plus proches voisins lors du parcours des données.</li><li><strong>Algorithme de Prim</strong> : pour la construction d'arbres couvrants minimaux, utilisés en clustering hiérarchique.</li></ul>"
        }
      ]
    },
    {
      "titre": "Tables de Hachage",
      "points": "3 pts",
      "enonce": "<p>Les tables de hachage sont des structures de données qui permettent d'associer des clés à des valeurs avec un temps d'accès moyen de <span class='math'>\\(O(1)\\)</span>. Une <strong>collision</strong> se produit lorsque deux clés différentes sont hachées vers le même emplacement.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (1 pt)</strong> — Distinguez les deux méthodes principales de résolution des collisions : le <strong>chaînage</strong> (chaining) et l'<strong>adressage ouvert</strong> (open addressing). Quels sont leurs avantages et inconvénients respectifs ?</p>",
          "reponse": "<p>Le <strong>chaînage</strong> consiste à stocker à chaque emplacement une liste chaînée des éléments ayant le même hachage. Avantages : simple à implémenter, insensible au facteur de charge, suppression facile. Inconvénients : utilisation de mémoire supplémentaire pour les pointeurs.</p><p>L'<strong>adressage ouvert</strong> stocke tous les éléments directement dans la table, et en cas de collision, on cherche un autre emplacement libre selon une séquence de sondage (linéaire, quadratique, double hachage). Avantages : économie de mémoire, meilleure localité des données. Inconvénients : plus sensible au facteur de charge, suppression plus complexe.</p>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> — Expliquez la technique du <strong>double hachage</strong>. Quelle condition doit être respectée pour garantir que toutes les positions de la table sont visitées par la séquence de sondage ?</p>",
          "reponse": "<p>Le double hachage utilise deux fonctions de hachage : <span class='math'>\\(h_1(k)\\)</span> pour l'emplacement initial et <span class='math'>\\(h_2(k)\\)</span> pour déterminer l'incrément de sondage. La séquence de sondage est donc : <span class='math'>\\(h_1(k), h_1(k)+h_2(k), h_1(k)+2h_2(k), ...\\)</span>.</p><p>Pour garantir que la séquence parcourt toutes les positions de la table de taille m, il faut que <span class='math'>\\(h_2(k)\\)</span> et m soient <strong>premiers entre eux</strong> (PGCD = 1). On choisit généralement m comme un nombre premier.</p>"
        }
      ]
    },
    {
      "titre": "Problèmes d'Optimisation sur Graphes",
      "points": "8 pts",
      "enonce": "<p>Les graphes sont des structures de données permettant de modéliser des relations complexes. Cette exercice porte sur les algorithmes de plus courts chemins, de flot et d'arbres couvrants.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1 (2 pts)</strong> — L'algorithme de <strong>Dijkstra</strong> permet de trouver les plus courts chemins depuis une source unique. Dans quel cas cet algorithme échoue-t-il ? Quel algorithme utilise-t-on à la place et pourquoi ?</p>",
          "reponse": "<p>L'algorithme de Dijkstra échoue lorsque le graphe contient des <strong>poids négatifs</strong> sur les arêtes. Dans ce cas, il peut produire des distances incorrectes car il suppose que la première distance trouvée pour un sommet est définitive [citation:7][citation:13].</p><p>On utilise à la place l'algorithme de <strong>Bellman-Ford</strong>, qui est capable de traiter des poids négatifs et de détecter les cycles de poids négatif. Sa complexité est <span class='math'>\\(O(V \\times E)\\)</span> contre <span class='math'>\\(O((V+E) \\log V)\\)</span> pour Dijkstra [citation:2].</p>"
        },
        {
          "question": "<p><strong>4.2 (2 pts)</strong> — Comparez les algorithmes de <strong>Kruskal</strong> et de <strong>Prim</strong> pour la recherche d'un arbre couvrant minimum. Quelle est la complexité de chacun et dans quel cas privilégier l'un plutôt que l'autre ?</p>",
          "reponse": "<p><strong>Kruskal</strong> : trie toutes les arêtes par poids croissant et les ajoute à l'arbre si elles ne créent pas de cycle (via Union-Find). Complexité : <span class='math'>\\(O(E \\log E)\\)</span>.</p><p><strong>Prim</strong> : construit l'arbre en partant d'un sommet source et ajoute itérativement la plus petite arête reliant un sommet déjà inclus à un sommet extérieur. Complexité : <span class='math'>\\(O(E \\log V)\\)</span> avec un tas binaire.</p><p>Kruskal est généralement préféré pour les graphes <strong>peu denses</strong> (<span class='math'>\\(E \\approx V\\)</span>) car le tri des arêtes est efficace. Prim est préféré pour les graphes <strong>denses</strong> (<span class='math'>\\(E \\approx V^2\\)</span>) car il ne nécessite pas de tri préalable et peut être optimisé avec une file de priorité [citation:3].</p>"
        },
        {
          "question": "<p><strong>4.3 (2 pts)</strong> — Expliquez le principe de l'algorithme de <strong>Floyd-Warshall</strong>. À quoi sert-il et quelle est sa complexité ?</p>",
          "reponse": "<p>Floyd-Warshall est un algorithme de programmation dynamique qui calcule les <strong>plus courts chemins entre toutes les paires de sommets</strong> dans un graphe [citation:2].</p><p>Le principe est de considérer les sommets intermédiaires un par un. L'algorithme maintient une matrice des distances <span class='math'>\\(dist[i][j]\\)</span> initialisée avec les poids des arêtes directes. Pour chaque sommet k, on met à jour la distance entre i et j avec <span class='math'>\\(dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])\\)</span>.</p><p>La complexité est <span class='math'>\\(O(V^3)\\)</span> en temps et <span class='math'>\\(O(V^2)\\)</span> en mémoire [citation:7].</p>"
        },
        {
          "question": "<p><strong>4.4 (2 pts)</strong> — Le <strong>problème du voyageur de commerce</strong> (TSP) est un problème d'optimisation classique. Pourquoi est-il qualifié de NP-difficile ? Quelle est la principale différence entre ce problème et celui de l'arbre couvrant minimum ?</p>",
          "reponse": "<p>Le TSP est NP-difficile car il n'existe pas d'algorithme polynomial connu pour le résoudre de manière exacte pour toutes les instances [citation:7]. Le nombre de cycles possibles à explorer étant <span class='math'>\\((n-1)!/2\\)</span>, le problème devient rapidement insoluble pour de grandes valeurs de n.</p><p>La différence fondamentale avec le problème de l'arbre couvrant minimum (MST) est que le TSP cherche un <strong>cycle</strong> (circuit) qui passe par chaque sommet exactement une fois et revient au point de départ, tandis que le MST cherche un <strong>arbre</strong> (sans cycle) qui connecte tous les sommets avec le poids total minimum.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
