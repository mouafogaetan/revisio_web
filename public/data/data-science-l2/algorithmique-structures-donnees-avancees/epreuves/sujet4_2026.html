<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algorithmique et Structures de Données Avancées - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arbres AVL et Équilibrage",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>On considère un arbre AVL initialement vide. On insère successivement les clés suivantes : <strong>15, 10, 20, 5, 12, 3</strong>.</p>\n  <p>Un arbre AVL est un arbre binaire de recherche dont la hauteur des sous-arbres de chaque nœud diffère d'au plus 1. Le facteur d'équilibre d'un nœud est défini par :</p>\n  <div class='math-block' style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.1em; color: #1a1a1a;'>\n      $$ \\text{FE}(\\text{nœud}) = h(\\text{sous-arbre droit}) - h(\\text{sous-arbre gauche}) $$\n    </div>\n  </div>\n  <p>où h est la hauteur du sous-arbre (la hauteur d'un arbre vide est -1).</p>\n</div>",
      "questions": [
        {
          "question": "1) Après chaque insertion, indiquez les rotations effectuées (simple droite, simple gauche, double droite-gauche, double gauche-droite) pour maintenir l'équilibre de l'arbre AVL. Justifiez vos réponses en indiquant les facteurs d'équilibre des nœuds concernés.",
          "reponse": "<p><strong>Insertion de 15 :</strong> Arbre vide, pas de rotation. Arbre : (15)</p><p><strong>Insertion de 10 :</strong> 10 < 15, à gauche de 15. Facteurs d'équilibre : FE(15)=0-1=-1, FE(10)=0. Arbre équilibré.</p><p><strong>Insertion de 20 :</strong> 20 > 15, à droite de 15. FE(15)=1-1=0, FE(20)=0. Arbre équilibré.</p><p><strong>Insertion de 5 :</strong> 5 < 10, à gauche de 10. FE(15)=0-2=-2 (déséquilibré), FE(10)=0-1=-1. Déséquilibre à gauche sur 15, sous-arbre gauche a un déséquilibre à gauche. Rotation <strong>simple droite</strong> autour de 15.</p><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>15 devient fils droit de 10, 10 monte. Arbre : 10 (gauche:5, droite:15(droite:20))</div></div><p><strong>Insertion de 12 :</strong> 12 < 15, à gauche de 15. FE(15)=1-1=0, FE(10)=1-2=-1. Arbre équilibré.</p><p><strong>Insertion de 3 :</strong> 3 < 5, à gauche de 5. FE(10)=0-2=-2 (déséquilibré), FE(5)=0-1=-1. Déséquilibre à gauche sur 10, sous-arbre gauche de 10 a un déséquilibre à gauche. Rotation <strong>simple droite</strong> autour de 10.</p><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1em; color: #1a1a1a;'>10 devient fils droit de 5, 5 monte. Arbre final : 5 (gauche:3, droite:10(gauche:12, droite:15(droite:20)))</div></div>"
        },
        {
          "question": "2) Quel est l'ordre d'insertion qui provoque une rotation double ? Justifiez.",
          "reponse": "<p>Aucune des insertions dans cette séquence ne provoque de rotation double. Une rotation double se produit lorsque le déséquilibre est du type <strong>gauche-droite</strong> ou <strong>droite-gauche</strong> :</p><ul><li><strong>Rotation gauche-droite :</strong> Le sous-arbre gauche du nœud déséquilibré a un sous-arbre droit plus haut que son sous-arbre gauche.</li><li><strong>Rotation droite-gauche :</strong> Le sous-arbre droit du nœud déséquilibré a un sous-arbre gauche plus haut que son sous-arbre droit.</li></ul><p>Dans cette séquence, toutes les insertions ont causé des déséquilibres de type <strong>gauche-gauche</strong> (insertion dans le sous-arbre gauche du fils gauche) qui se résolvent par une rotation simple droite.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Arbres Rouge-Noir",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>Un arbre rouge-noir est un arbre binaire de recherche équilibré avec les propriétés suivantes :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li><strong>Propriété 1 :</strong> Chaque nœud est rouge ou noir.</li>\n    <li><strong>Propriété 2 :</strong> La racine est noire.</li>\n    <li><strong>Propriété 3 :</strong> Les feuilles (NIL) sont noires.</li>\n    <li><strong>Propriété 4 :</strong> Un nœud rouge ne peut pas avoir de fils rouges (pas de deux rouges consécutifs).</li>\n    <li><strong>Propriété 5 :</strong> Pour tout nœud, tous les chemins de ce nœud aux feuilles descendants contiennent le même nombre de nœuds noirs (hauteur noire).</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "1) Montrez que la propriété 5 implique que tout arbre rouge-noir est équilibré. Quel est l'ordre de grandeur de la hauteur maximale d'un arbre rouge-noir ?",
          "reponse": "<p>La propriété 5 (hauteur noire constante) implique que l'arbre est équilibré car les chemins ne peuvent pas avoir de longueurs trop différentes. La hauteur d'un arbre rouge-noir est au maximum \( 2 \\times \\log_2(n+1) \), où n est le nombre de nœuds. En effet, le chemin le plus long contient alternativement des nœuds rouges et noirs, donc sa longueur est au plus deux fois la hauteur noire. La hauteur noire étant \( O(\\log n) \), la hauteur totale est \( O(\\log n) \).</p>"
        },
        {
          "question": "2) Comparer les arbres AVL et les arbres rouge-noir. Dans quels cas préfère-t-on l'un plutôt que l'autre ?",
          "reponse": "<p><strong>Arbres AVL :</strong></p><ul><li>Équilibre plus strict (différence de hauteur ≤ 1).</li><li>Opérations de recherche plus rapides (arbre plus équilibré).</li><li>Insertions/suppressions plus coûteuses (plus de rotations).</li></ul><p><strong>Arbres Rouge-Noir :</strong></p><ul><li>Équilibre moins strict (hauteur ≤ 2×hauteur noire).</li><li>Recherche légèrement plus lente qu'AVL.</li><li>Insertions/suppressions plus rapides (moins de rotations).</li></ul><p><strong>Choix :</strong></p><ul><li><strong>AVL</strong> pour les applications avec beaucoup de recherches et peu de modifications (bases de données en lecture).</li><li><strong>Rouge-Noir</strong> pour les applications avec beaucoup d'insertions/suppressions (dictionnaires en mémoire, Java TreeMap, C++ std::map).</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : B-arbres et B+ Arbres",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>Les B-arbres sont des arbres équilibrés utilisés dans les systèmes de gestion de bases de données pour l'indexation. Un B-arbre d'ordre m est un arbre où :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li>Chaque nœud (sauf la racine) a entre <span style='font-style: italic;'>m</span>/2 et <span style='font-style: italic;'>m</span> enfants.</li>\n    <li>La racine a entre 2 et <span style='font-style: italic;'>m</span> enfants.</li>\n    <li>Toutes les feuilles sont au même niveau.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "1) Soit un B-arbre d'ordre 4. Insérez successivement les clés : <strong>5, 10, 15, 20, 25, 30, 35, 40</strong>. Montrez l'évolution de l'arbre après chaque insertion.",
          "reponse": "<p>B-arbre d'ordre 4 : chaque nœud peut contenir au plus 3 clés (m-1 = 3) et au moins 1 clé (m/2 - 1 = 1) sauf la racine.</p><p><strong>Insertion de 5 :</strong> [5]</p><p><strong>Insertion de 10 :</strong> [5,10]</p><p><strong>Insertion de 15 :</strong> [5,10,15]</p><p><strong>Insertion de 20 :</strong> nœud plein [5,10,15,20] → division : 10 monte, gauche [5], droite [15,20]</p><p>Arbre :</p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; color: #1a1a1a;'>        [10]<br>       /    \\<br>    [5]    [15,20]</div><p><strong>Insertion de 25 :</strong> dans [15,20] → [15,20,25]</p><p><strong>Insertion de 30 :</strong> [15,20,25,30] → division : 20 monte, gauche [15], droite [25,30]</p><p>Arbre :</p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; color: #1a1a1a;'>        [10,20]<br>       /   |   \\<br>    [5]  [15]  [25,30]</div><p><strong>Insertion de 35 :</strong> dans [25,30] → [25,30,35]</p><p><strong>Insertion de 40 :</strong> [25,30,35,40] → division : 30 monte, gauche [25], droite [35,40]</p><p>Arbre :</p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; color: #1a1a1a;'>        [10,20,30]<br>       /   |   |   \\<br>    [5]  [15] [25] [35,40]</div>"
        },
        {
          "question": "2) Expliquer pourquoi les B+ arbres sont préférés aux B-arbres pour les bases de données. Quels sont leurs avantages ?",
          "reponse": "<p><strong>B+ arbre :</strong></p><ul><li>Les données ne sont stockées que dans les feuilles.</li><li>Les nœuds internes ne contiennent que des clés pour guider la recherche.</li><li>Les feuilles sont chaînées entre elles (liste chaînée).</li></ul><p><strong>Avantages pour les bases de données :</strong></p><ul><li><strong>Meilleure localité des données :</strong> Les données sont regroupées dans les feuilles, ce qui réduit les accès disque (un accès disque = une page).</li><li><strong>Recherche séquentielle efficace :</strong> Le chaînage des feuilles permet de parcourir les données dans l'ordre sans remonter dans l'arbre.</li><li><strong>Nœuds internes plus petits :</strong> Plus de clés par nœud, donc arbre moins profond.</li><li><strong>Insertion/suppression plus simples :</strong> Les modifications sont localisées dans les feuilles.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Algorithmes de Floyd-Warshall et Bellman-Ford",
      "points": "4 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
