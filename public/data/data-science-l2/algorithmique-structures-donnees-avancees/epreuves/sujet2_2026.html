<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "questionText": "<p>Qu'est-ce que le modèle Pregel dans le contexte des algorithmes distribués pour graphes ?</p>",
    "options": [
      "Un modèle de programmation pour le traitement distribué de grands graphes",
      "Un algorithme de recherche de plus court chemin",
      "Un système de gestion de bases de données relationnelles",
      "Un protocole de communication réseau"
    ],
    "correctAnswer": 0,
    "difficulty": "easy",
    "explanation": "<p>Pregel est un modèle de programmation conçu par Google pour le traitement distribué de grands graphes. Il s'inspire du modèle de programmation par sommets (vertex-centric) et utilise le concept de super-étapes pour l'exécution parallèle des calculs sur les graphes.</p>"
  },
  {
    "questionText": "<p>Quel est le rôle des super-étapes dans l'algorithme Pregel ?</p>",
    "options": [
      "Elles divisent le graphe en sous-ensembles pour le traitement parallèle",
      "Elles synchronisent les messages entre les sommets à chaque itération",
      "Elles stockent les résultats intermédiaires sur les disques",
      "Elles permettent de compresser les données du graphe"
    ],
    "correctAnswer": 1,
    "difficulty": "easy",
    "explanation": "<p>Les super-étapes sont les unités de synchronisation dans Pregel. À chaque super-étape, tous les sommets exécutent leur fonction de calcul en parallèle, et les messages sont échangés entre les sommets. À la fin de la super-étape, tous les messages sont livrés avant le début de la super-étape suivante.</p>"
  },
  {
    "questionText": "<p>Dans le modèle Pregel, comment les sommets communiquent-ils entre eux ?</p>",
    "options": [
      "Via des appels de fonction directs",
      "En utilisant une mémoire partagée globale",
      "En envoyant des messages asynchrones",
      "En écrivant dans un fichier commun"
    ],
    "correctAnswer": 2,
    "difficulty": "medium",
    "explanation": "<p>Dans Pregel, les sommets communiquent en envoyant des messages asynchrones à d'autres sommets. Ces messages sont échangés entre les super-étapes. L'asynchronisme permet de paralléliser efficacement les calculs tout en maintenant une cohérence globale.</p>"
  },
  {
    "questionText": "<p>Quelle est la principale différence entre l'algorithme PageRank distribué dans Pregel et sa version séquentielle classique ?</p>",
    "options": [
      "La version distribuée utilise des super-étapes au lieu d'itérations séquentielles",
      "La version distribuée ne converge pas vers la même solution",
      "La version séquentielle est plus rapide",
      "La version distribuée utilise des valeurs aléatoires"
    ],
    "correctAnswer": 0,
    "difficulty": "medium",
    "explanation": "<p>La principale différence est que le PageRank distribué dans Pregel est exécuté en parallèle sur plusieurs machines à travers des super-étapes synchronisées. Chaque sommet calcule sa contribution à ses voisins et envoie des messages, ce qui permet de traiter de très grands graphes de manière efficace.</p>"
  },
  {
    "questionText": "<p>Dans Pregel, qu'arrive-t-il à un sommet qui n'a plus de messages entrants et qui ne produit plus de messages sortants ?</p>",
    "options": [
      "Il est automatiquement supprimé du graphe",
      "Il devient inactif et peut être voté pour arrêter le calcul",
      "Il continue à s'exécuter indéfiniment",
      "Il est marqué comme erreur"
    ],
    "correctAnswer": 1,
    "difficulty": "medium",
    "explanation": "<p>Dans Pregel, un sommet qui n'a plus de messages entrants et qui ne produit plus de messages sortants devient inactif. Il peut alors voter pour arrêter le calcul via un mécanisme de vote. Quand tous les sommets sont inactifs et votent pour arrêter, l'algorithme se termine.</p>"
  },
  {
    "questionText": "<p>Comment la fonction map est-elle généralement utilisée dans le contexte des algorithmes distribués sur graphes ?</p>",
    "options": [
      "Pour transformer les données d'entrée en paires clé-valeur",
      "Pour réduire les données après le shuffle",
      "Pour fusionner les résultats partiels",
      "Pour partitionner le graphe entre les machines"
    ],
    "correctAnswer": 0,
    "difficulty": "medium",
    "explanation": "<p>Dans le contexte des algorithmes distribués, la fonction <strong>map</strong> est utilisée pour transformer les données d'entrée (par exemple, les arêtes ou les sommets) en paires clé-valeur. Ces paires sont ensuite utilisées par la phase shuffle pour regrouper les données par clé avant la phase reduce.</p>"
  },
  {
    "questionText": "<p>Quelle est la complexité temporelle d'un algorithme BFS (Breadth-First Search) distribué avec Pregel ?</p>",
    "options": [
      "\\(O(|V| + |E|)\\)",
      "\\(O(|V| \\times |E|)\\)",
      "\\(O(|V|)\\) super-étapes dans le pire cas",
      "\\(O(|E|)\\) super-étapes"
    ],
    "correctAnswer": 2,
    "difficulty": "hard",
    "explanation": "<p>Dans Pregel, un BFS distribué peut prendre jusqu'à \\(O(|V|)\\) super-étapes dans le pire cas, où \\(|V|\\) est le nombre de sommets. Cela correspond à la situation où le graphe est une chaîne linéaire, et la distance augmente de 1 à chaque super-étape.</p>"
  },
  {
    "questionText": "<p>Quel est l'avantage principal de l'utilisation de Pregel par rapport à MapReduce pour les algorithmes de graphes ?</p>",
    "options": [
      "Pregel est plus lent mais plus fiable",
      "Pregel est spécialisé pour les itérations sur les graphes avec communication entre voisins",
      "Pregel nécessite moins de mémoire",
      "Pregel est plus simple à implémenter"
    ],
    "correctAnswer": 1,
    "difficulty": "easy",
    "explanation": "<p>Pregel est spécifiquement conçu pour les algorithmes itératifs sur les graphes où les sommets communiquent avec leurs voisins. MapReduce est moins adapté car chaque itération nécessite de relire l'intégralité des données depuis le disque, ce qui est inefficace pour les graphes.</p>"
  },
  {
    "questionText": "<p>Dans le modèle Pregel, comment est assurée la tolérance aux pannes ?</p>",
    "options": [
      "Par des points de contrôle périodiques (checkpoints)",
      "Par la duplication des données sur plusieurs machines",
      "Par la réplication des sommets",
      "Par l'utilisation de transactions atomiques"
    ],
    "correctAnswer": 0,
    "difficulty": "hard",
    "explanation": "<p>Pregel assure la tolérance aux pannes en utilisant des points de contrôle (checkpoints) périodiques. L'état de chaque sommet et les messages en transit sont sauvegardés sur disque à la fin de chaque super-étape. En cas de panne, le calcul peut reprendre à partir du dernier checkpoint.</p>"
  },
  {
    "questionText": "<p>Quelle est la différence fondamentale entre MapReduce et Pregel pour le traitement des graphes ?</p>",
    "options": [
      "MapReduce traite les données par lots, Pregel par flux",
      "MapReduce est séquentiel, Pregel est parallèle",
      "MapReduce est conçu pour des calculs en une seule passe, Pregel pour des calculs itératifs",
      "MapReduce ne fonctionne qu'avec des données structurées"
    ],
    "correctAnswer": 2,
    "difficulty": "medium",
    "explanation": "<p>MapReduce est conçu pour des calculs en une seule passe sur de grands volumes de données, tandis que Pregel est spécialisé pour les calculs itératifs sur les graphes où chaque itération nécessite la communication entre les sommets voisins. Pregel maintient l'état du graphe en mémoire à travers les itérations, ce qui le rend plus efficace.</p>"
  },
  {
    "questionText": "<p>Dans l'algorithme PageRank distribué avec Pregel, comment chaque sommet calcule-t-il sa nouvelle valeur de PageRank ?</p>",
    "options": [
      "En utilisant uniquement sa valeur précédente",
      "En sommant les contributions de tous ses voisins entrants",
      "En divisant sa valeur par le nombre de voisins sortants",
      "En utilisant un générateur de nombres aléatoires"
    ],
    "correctAnswer": 1,
    "difficulty": "hard",
    "explanation": "<p>Dans PageRank distribué, chaque sommet calcule sa nouvelle valeur en sommant les contributions de tous ses voisins entrants. Chaque voisin sortant envoie une contribution égale à sa valeur PageRank divisée par son nombre de voisins sortants. La nouvelle valeur est ensuite \\(\\text{PR}(v) = (1 - \\alpha)/N + \\alpha \\sum_{u \\in \\text{in}(v)} \\text{PR}(u)/\\text{out}(u)\\).</p>"
  },
  {
    "questionText": "<p>Quelle est la condition d'arrêt typique d'un algorithme PageRank dans Pregel ?</p>",
    "options": [
      "Un nombre fixe d'itérations",
      "Quand tous les sommets sont inactifs",
      "Quand la variation de PageRank est inférieure à un seuil",
      "Quand le graphe est entièrement exploré"
    ],
    "correctAnswer": 2,
    "difficulty": "hard",
    "explanation": "<p>La condition d'arrêt typique pour PageRank est lorsque la variation de la valeur de PageRank est inférieure à un seuil défini par l'utilisateur (convergence). Alternativement, on peut aussi utiliser un nombre fixe d'itérations. La convergence est souvent préférée car elle garantit que l'algorithme a atteint un état stable.</p>"
  }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
