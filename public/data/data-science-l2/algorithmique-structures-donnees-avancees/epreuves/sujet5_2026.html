<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Algorithmique et Structures de Données Avancées - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Plus Courts Chemins avec Poids Négatifs",
     "points": "6 pts",
     "enonce": "<p style='color: #333; font-size: 1em;'>Le réseau de distribution d'eau potable de la ville de Douala est modélisé par le graphe orienté suivant. Les sommets représentent les réservoirs d'eau et les arcs représentent les conduites. Les poids sur les arcs indiquent le temps de transit (en minutes) pour que l'eau achemine d'un réservoir à un autre.</p><div style='background-color: #f8f9fa; border-radius: 8px; padding: 15px; margin: 10px 0;'><p style='color: #333;'><strong>Graphe G = (V, E) :</strong></p><ul style='list-style-type: none; padding-left: 5px; color: #333;'><li><strong>Sommets :</strong> A, B, C, D, E, F, G</li><li><strong>Arcs (u → v, poids) :</strong></li><li>A → B (6), A → C (5), A → D (5)</li><li>B → E (-1), B → F (2)</li><li>C → B (-2), C → E (1)</li><li>D → C (5), D → F (3)</li><li>E → G (3)</li><li>F → E (-3), F → G (4)</li></ul></div>",
     "questions":[
       {
         "question": "1) Appliquez l'algorithme de Bellman-Ford pour trouver les distances les plus courtes depuis le sommet A vers tous les autres sommets. Effectuez les relaxations dans l'ordre lexicographique des arcs (A→B, A→C, A→D, B→E, B→F, C→B, C→E, D→C, D→F, E→G, F→E, F→G). Donnez les distances après chaque passe. (3 pts)",
         "reponse": "<p style='color: #333; font-size: 1em;'><strong>Initialisation :</strong> d[A]=0, d[B]=∞, d[C]=∞, d[D]=∞, d[E]=∞, d[F]=∞, d[G]=∞</p><p style='color: #333; font-size: 1em;'><strong>Passe 1 :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>A→B : d[B]=6</li><li>A→C : d[C]=5</li><li>A→D : d[D]=5</li><li>B→E : d[E]=5</li><li>B→F : d[F]=8</li><li>C→B : d[B]=min(6, 5-2=3) = 3</li><li>C→E : d[E]=min(5, 5+1=6) = 5</li><li>D→C : d[C]=min(5, 5+5=10) = 5</li><li>D→F : d[F]=min(8, 5+3=8) = 8</li><li>E→G : d[G]=8</li><li>F→E : d[E]=min(5, 8-3=5) = 5</li><li>F→G : d[G]=min(8, 8+4=12) = 8</li></ul><p style='color: #333; font-size: 1em;'><strong>Résultats Passe 1 :</strong> d[A]=0, d[B]=3, d[C]=5, d[D]=5, d[E]=5, d[F]=8, d[G]=8</p><p style='color: #333; font-size: 1em;'><strong>Passe 2 :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>A→B : d[B]=3 (inchangé)</li><li>A→C : d[C]=5 (inchangé)</li><li>A→D : d[D]=5 (inchangé)</li><li>B→E : d[E]=min(5, 3-1=2) = 2</li><li>B→F : d[F]=min(8, 3+2=5) = 5</li><li>C→B : d[B]=min(3, 5-2=3) = 3</li><li>C→E : d[E]=min(2, 5+1=6) = 2</li><li>D→C : d[C]=min(5, 5+5=10) = 5</li><li>D→F : d[F]=min(5, 5+3=8) = 5</li><li>E→G : d[G]=min(8, 2+3=5) = 5</li><li>F→E : d[E]=min(2, 5-3=2) = 2</li><li>F→G : d[G]=min(5, 5+4=9) = 5</li></ul><p style='color: #333; font-size: 1em;'><strong>Résultats Passe 2 :</strong> d[A]=0, d[B]=3, d[C]=5, d[D]=5, d[E]=2, d[F]=5, d[G]=5</p><p style='color: #333; font-size: 1em;'><strong>Passe 3 :</strong> Aucune distance n'est modifiée. L'algorithme converge.</p><p style='color: #333; font-size: 1em;'><strong>Distances finales :</strong> d[A]=0, d[B]=3, d[C]=5, d[D]=5, d[E]=2, d[F]=5, d[G]=5</p>"
       },
       {
         "question": "2) Détectez la présence d'un cycle de poids négatif dans ce graphe. Justifiez votre réponse. (1 pt)",
         "reponse": "<p style='color: #333; font-size: 1em;'>Pour détecter un cycle de poids négatif, on exécute une passe supplémentaire de l'algorithme de Bellman-Ford. Si une distance peut encore être diminuée, alors il existe un cycle de poids négatif.</p><p style='color: #333; font-size: 1em;'><strong>Passe supplémentaire :</strong> Toutes les distances restent inchangées.</p><p style='color: #333; font-size: 1em;'><strong>Conclusion :</strong> Il n'y a <strong>pas</strong> de cycle de poids négatif dans ce graphe. Les distances calculées sont donc correctes.</p>"
       },
       {
         "question": "3) Proposez une modification du graphe qui introduirait un cycle de poids négatif. Expliquez comment Bellman-Ford détecterait ce cycle. (2 pts)",
         "reponse": "<p style='color: #333; font-size: 1em;'><strong>Modification :</strong> On peut modifier le poids de l'arc F→E de -3 à -10. Le cycle C→B→F→E→C devient : C→B (-2) + B→F (2) + F→E (-10) + E→C (1) = -9. Ce cycle est de poids négatif.</p><p style='color: #333; font-size: 1em;'><strong>Détection :</strong> Lors de la passe supplémentaire de Bellman-Ford, la distance de E sera mise à jour via le cycle négatif : d[E] peut être diminué indéfiniment en parcourant le cycle. L'algorithme détecte cela et signale la présence d'un cycle de poids négatif.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Flot Maximum et Coupe Minimum",
     "points": "6 pts",
     "enonce": "<p style='color: #333; font-size: 1em;'>Le réseau de distribution d'électricité de la ville de Yaoundé est modélisé par le graphe orienté suivant. Les sommets représentent les centrales électriques (sources) et les postes de transformation (puits). Les arcs représentent les lignes électriques avec leurs capacités maximales (en MW).</p><div style='background-color: #f8f9fa; border-radius: 8px; padding: 15px; margin: 10px 0;'><p style='color: #333;'><strong>Réseau G = (V, E) avec source S et puits T :</strong></p><ul style='list-style-type: none; padding-left: 5px; color: #333;'><li><strong>Arcs (u → v, capacité) :</strong></li><li>S → A (10), S → B (15)</li><li>A → B (5), A → C (10), A → D (5)</li><li>B → D (10), B → E (10)</li><li>C → E (5), C → T (10)</li><li>D → E (5), D → T (5)</li><li>E → T (15)</li></ul></div>",
     "questions":[
       {
         "question": "1) Appliquez l'algorithme de Ford-Fulkerson en utilisant l'algorithme d'Edmonds-Karp pour trouver un flot maximum de S à T. Vous devez clairement identifier les chemins augmentants utilisés, les quantités de flot ajoutées, et donner le flot final. (3 pts)",
         "reponse": "<p style='color: #333; font-size: 1em;'><strong>Flot initial :</strong> f = 0</p><p style='color: #333; font-size: 1em;'><strong>Chemin augmentant 1 (Edmonds-Karp - BFS) :</strong> S → A → C → T</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Capacités résiduelles : S→A (10), A→C (10), C→T (10)</li><li>Augmentation : min(10, 10, 10) = 10</li><li>Flot après C1 : f = 10</li><li>Mise à jour : S→A (0), A→S (10); A→C (0), C→A (10); C→T (0), T→C (10)</li></ul><p style='color: #333; font-size: 1em;'><strong>Chemin augmentant 2 :</strong> S → B → D → T</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Capacités résiduelles : S→B (15), B→D (10), D→T (5)</li><li>Augmentation : min(15, 10, 5) = 5</li><li>Flot après C2 : f = 15</li><li>Mise à jour : S→B (10), B→S (5); B→D (5), D→B (5); D→T (0), T→D (5)</li></ul><p style='color: #333; font-size: 1em;'><strong>Chemin augmentant 3 :</strong> S → B → E → T</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Capacités résiduelles : S→B (10), B→E (10), E→T (15)</li><li>Augmentation : min(10, 10, 15) = 10</li><li>Flot après C3 : f = 25</li><li>Mise à jour : S→B (0), B→S (15); B→E (0), E→B (10); E→T (5), T→E (10)</li></ul><p style='color: #333; font-size: 1em;'><strong>Chemin augmentant 4 :</strong> S → A → D → T (via résiduel S→A (0), mais on peut utiliser S→A (0) car il y a un chemin S→A (0) → D? Non, S→A est saturé. En réalité, plus de chemin augmentant)</p><p style='color: #333; font-size: 1em;'><strong>Flot maximum final :</strong> f = 25 MW</p><p style='color: #333; font-size: 1em;'><strong>Flot sur chaque arc :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>S→A : 10, S→B : 15</li><li>A→B : 0, A→C : 10, A→D : 0</li><li>B→D : 5, B→E : 10</li><li>C→E : 0, C→T : 10</li><li>D→E : 0, D→T : 5</li><li>E→T : 10 (5 de B→E et 5 de C→E? Non, C→E 0, B→E 10, donc E→T 10)</li></ul>"
       },
       {
         "question": "2) Trouvez une coupe minimum (S, V\\S) correspondante et calculez sa capacité. Vérifiez le théorème flot-max/coupe-min. (2 pts)",

       {
         "question": "1) Utilisez l'algorithme de Needleman-Wunsch pour trouver un alignement global optimal entre S1 et S2. Construisez la matrice de programmation dynamique. (2 pts)",
         "reponse": "<p style='color: #333; font-size: 1em;'><strong>Construction de la matrice DP :</strong></p><p style='color: #333; font-size: 1em;'>Soit DP[i][j] le score optimal pour aligner les i premiers caractères de S1 avec les j premiers caractères de S2.</p><p style='color: #333; font-size: 1em;'><strong>Matrice DP (5x5) :</strong></p><table style='width: 100%; border-collapse: collapse; color: #333; font-size: 0.85em;'><tr style='background-color: #0056b3; color: white;'><th style='padding: 5px; border: 1px solid #ddd;'>i\\j</th><th style='padding: 5px; border: 1px solid #ddd;'>0</th><th style='padding: 5px; border: 1px solid #ddd;'>1 (A)</th><th style='padding: 5px; border: 1px solid #ddd;'>2 (G)</th><th style='padding: 5px;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
