<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Algorithmique et Structures de Données Avancées - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Sequence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Arbres Rouge-Noir et Propriétés",
     "points": "5 pts",
     "enonce": "<p style='text-align: justify;'>Un arbre rouge-noir est un arbre binaire de recherche avec des propriétés spécifiques de coloration. On considère un arbre rouge-noir construit à partir des clés suivantes : <strong>15, 8, 20, 4, 12, 18, 25</strong>.</p><p style='text-align: justify;'>Rappels des propriétés d'un arbre rouge-noir :</p><ul style='text-align: justify;'><li>Chaque nœud est rouge ou noir.</li><li>La racine est noire.</li><li>Les feuilles (NIL) sont noires.</li><li>Les enfants d'un nœud rouge sont noirs (pas deux rouges consécutifs).</li><li>Pour chaque nœud, tous les chemins de ce nœud vers ses feuilles descendant contiennent le même nombre de nœuds noirs.</li></ul>",
     "questions": [
       {
         "question": "<strong>1.1</strong> Construisez l'arbre rouge-noir en insérant les clés dans l'ordre donné. Pour chaque insertion, indiquez la coloration et les rotations éventuelles effectuées pour maintenir les propriétés.",
         "reponse": "<p style='text-align: justify;'>L'insertion se fait d'abord comme dans un ABR, puis on recolore ou on effectue des rotations pour rétablir les propriétés.</p><ul style='text-align: justify;'><li><strong>Insertion de 15 :</strong> Racine, noire. Arbre : 15 (N).</li><li><strong>Insertion de 8 :</strong> Fils gauche de 15, rouge. Arbre : 15(N) avec 8(R) à gauche.</li><li><strong>Insertion de 20 :</strong> Fils droit de 15, rouge. Arbre : 15(N) avec 8(R) à gauche et 20(R) à droite.</li><li><strong>Insertion de 4 :</strong> Fils gauche de 8, rouge. On a une violation : 8(R) et 4(R) sont rouges. On effectue une rotation droite sur 15. Après rotation, 8 devient racine, 15 devient fils droit. Arbre : 8(N) avec 4(R) à gauche et 15(R) à droite, 15 a 20(R) à droite.</li><li><strong>Insertion de 12 :</strong> Fils droit de 8, rouge. Pas de violation immédiate.</li><li><strong>Insertion de 18 :</strong> Fils gauche de 20, rouge. Pas de violation.</li><li><strong>Insertion de 25 :</strong> Fils droit de 20, rouge. On a 20(R) et 25(R) consécutifs. On recolore 20 en noir, et on effectue une rotation gauche sur 15. Arbre final équilibré.</li></ul>"
       },
       {
         "question": "<strong>1.2</strong> Comparez les performances de l'arbre rouge-noir avec celles d'un arbre AVL pour les opérations d'insertion et de recherche. Justifiez.",
         "reponse": "<p style='text-align: justify;'>Les deux structures offrent des performances en \\(O(\\log n)\\) pour la recherche, l'insertion et la suppression. L'arbre AVL est plus strictement équilibré (différence de hauteur ≤ 1), ce qui le rend un peu plus rapide pour la recherche mais plus lent pour les insertions/suppressions car les rotations sont plus fréquentes. L'arbre rouge-noir est moins équilibré mais nécessite moins de rotations, ce qui le rend plus efficace pour les insertions/suppressions fréquentes.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Tas de Fibonacci et Analyse Amortie",
     "points": "4 pts",
     "enonce": "<p style='text-align: justify;'>Un tas de Fibonacci est une structure de données pour les files de priorité qui offre des performances amorties exceptionnelles. On considère un tas de Fibonacci initialement vide.</p>",
     "questions": [
       {
         "question": "<strong>2.1</strong> Décrivez brièvement les opérations de base d'un tas de Fibonacci et leurs complexités amorties.",
         "reponse": "<p style='text-align: justify;'>Les opérations d'un tas de Fibonacci sont :</p><ul style='text-align: justify;'><li><strong>Insertion :</strong> \\(O(1)\\) amorti. On ajoute l'élément dans la liste des racines.</li><li><strong>Find-min :</strong> \\(O(1)\\) amorti. On garde un pointeur sur le minimum.</li><li><strong>Delete-min :</strong> \\(O(\\log n)\\) amorti. On supprime le minimum, on fusionne ses fils dans la liste des racines, puis on consolide.</li><li><strong>Decrease-key :</strong> \\(O(1)\\) amorti. On diminue la clé d'un nœud et on coupe l'arbre si nécessaire.</li></ul><p style='text-align: justify;'>Les performances sont meilleures que celles du tas binaire, surtout pour decrease-key.</p>"
       },
       {
         "question": "<strong>2.2</strong> Expliquez le principe de l'analyse amortie pour l'opération de consolidation (delete-min) dans un tas de Fibonacci.",
         "reponse": "<p style='text-align: justify;'>La consolidation consiste à fusionner les arbres de même degré dans la liste des racines. L'analyse amortie montre que malgré un coût élevé pour une opération delete-min individuelle, le coût total sur une séquence d'opérations est \\(O(\\log n)\\) en moyenne. On utilise un tableau de taille \\(O(\\log n)\\) pour stocker les arbres par degré. Chaque arbre est fusionné au plus \\(O(\\log n)\\) fois avant d'être supprimé, ce qui garantit la complexité amortie.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Floyd-Warshall et Plus Courts Chemins",
     "points": "5 pts",
     "enonce": "<p style='text-align: justify;'>Soit un graphe orienté avec 4 sommets \\(A, B, C, D\\) et les arêtes pondérées suivantes :</p><div style='background: #f4f4f4; padding: 12px; border-radius: 8px; color: #333; margin: 15px 0; overflow-x: auto;'><ul><li>A → B : 3</li><li>A → C : 8</li><li>B → C : 2</li><li>B → D : 5</li><li>C → D : 1</li><li>D → A : 4</li></ul></div><p style='text-align: justify;'>On souhaite calculer les plus courts chemins entre toutes les paires de sommets en utilisant l'algorithme de Floyd-Warshall.</p>",
     "questions": [
       {
         "question": "<strong>3.1</strong> Initialisez la matrice des distances (dist[i][j]) avec les poids des arêtes directes. Expliquez comment sont initialisées les distances entre des sommets non connectés.",
         "reponse": "<p style='text-align: justify;'>La matrice des distances est initialisée comme suit :</p><ul style='text-align: justify;'><li>dist[i][i] = 0 pour tout i.</li><li>dist[i][j] = poids de l'arête si elle existe.</li><li>dist[i][j] = ∞ (infini) si aucune arête directe.</li></ul><p style='text-align: justify;'>La matrice initiale est :</p><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr><td style='padding: 5px; border: 1px solid #ccc;'></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>A</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>B</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>C</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>D</strong></td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>A</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>0</td><td style='padding: 5px; border: 1px solid #ccc;'>3</td><td style='padding: 5px; border: 1px solid #ccc;'>8</td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>B</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td><td style='padding: 5px; border: 1px solid #ccc;'>0</td><td style='padding: 5px; border: 1px solid #ccc;'>2</td><td style='padding: 5px; border: 1px solid #ccc;'>5</td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>C</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td><td style='padding: 5px; border: 1px solid #ccc;'>0</td><td style='padding: 5px; border: 1px solid #ccc;'>1</td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>D</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>4</td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td><td style='padding: 5px; border: 1px solid #ccc;'>∞</td><td style='padding: 5px; border: 1px solid #ccc;'>0</td></tr></table>"
       },
       {
         "question": "<strong>3.2</strong> Exécutez les itérations de Floyd-Warshall pour mettre à jour la matrice des distances. Donnez les étapes intermédiaires.",
         "reponse": "<p style='text-align: justify;'>Floyd-Warshall utilise une boucle sur les sommets intermédiaires \\(k\\).</p><p style='text-align: justify;'><strong>Itération k=1 (A) :</strong></p><ul><li>B→A→C : ∞ + 8 = ∞ (inchangé)</li><li>B→A→D : ∞ + 0 = ∞</li><li>C→A→B : ∞ (inchangé)</li><li>D→A→B : 4 + 3 = 7 → dist[D][B] = 7</li><li>D→A→C : 4 + 8 = 12 → dist[D][C] = 12</li></ul><p style='text-align: justify;'><strong>Itération k=2 (B) :</strong></p><ul><li>A→B→C : 3 + 2 = 5 < 8 → dist[A][C] = 5</li><li>A→B→D : 3 + 5 = 8 → dist[A][D] = 8</li><li>C→B→D : ∞ (inchangé)</li><li>D→B→C : 7 + 2 = 9 < 12 → dist[D][C] = 9</li></ul><p style='text-align: justify;'><strong>Itération k=3 (C) :</strong></p><ul><li>A→C→D : 5 + 1 = 6 < 8 → dist[A][D] = 6</li><li>B→C→D : 2 + 1 = 3 < 5 → dist[B][D] = 3</li><li>D→C→B : 9 (inchangé)</li></ul><p style='text-align: justify;'><strong>Itération k=4 (D) :</strong></p><ul><li>A→D→B : 6 + 7 = 13 (inchangé)</li><li>B→D→A : 3 + 4 = 7 → dist[B][A] = 7</li><li>C→D→A : 1 + 4 = 5 → dist[C][A] = 5</li></ul><p style='text-align: justify;'>Matrice finale :</p><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr><td style='padding: 5px; border: 1px solid #ccc;'></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>A</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>B</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>C</strong></td><td style='padding: 5px; border: 1px solid #ccc;'><strong>D</strong></td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>A</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>0</td><td style='padding: 5px; border: 1px solid #ccc;'>3</td><td style='padding: 5px; border: 1px solid #ccc;'>5</td><td style='padding: 5px; border: 1px solid #ccc;'>6</td></tr><tr><td style='padding: 5px; border: 1px solid #ccc;'><strong>B</strong></td><td style='padding: 5px; border: 1px solid #ccc;'>7</td><td style='padding: 5px; borde     // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
