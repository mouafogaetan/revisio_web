<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algorithmique et Structures de Données Avancées - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°6",
  "anneeScolaire": "2026-2027",
  "exercices": [
    {
      "titre": "Arbres AVL et Rouge-Noir",
      "points": "6 pts",
      "enonce": "<p>Cet exercice porte sur les arbres binaires de recherche équilibrés, essentiels pour maintenir des opérations en \(O(\\log n)\) dans le pire des cas. Deux familles principales sont étudiées : les arbres AVL, strictement équilibrés, et les arbres Rouge-Noir, plus souples.</p><div class='math-block'><div class='math'>$$ \\text{Facteur d'équilibre (AVL)} = \\text{Hauteur(FilsDroit)} - \\text{Hauteur(FilsGauche)} $$</div></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Définissez la condition d'équilibre d'un arbre AVL. Calculez le facteur d'équilibre pour chaque nœud de l'arbre suivant (dont les clés sont les lettres) :</p><div class='tree' style='text-align: center; font-family: monospace;'>A<br>├── B<br>│   └── C<br>└── D</div><p>Indiquez les rotations nécessaires pour rééquilibrer cet arbre.</p>",
          "reponse": "<p>Un arbre AVL est un arbre binaire de recherche où, pour chaque nœud, la hauteur de ses sous-arbres gauche et droit diffère au plus de 1.</p><p>Facteurs d'équilibre :</p><ul><li>Nœud A : hauteur(FD) = 1 (D), hauteur(FG) = 2 (B-C) → Facteur = 1 - 2 = -1</li><li>Nœud B : hauteur(FD) = 1 (C), hauteur(FG) = 0 → Facteur = 1 - 0 = 1</li><li>Nœud C : 0</li><li>Nœud D : 0</li></ul><p>L'arbre est déséquilibré au nœud A (facteur -1, cas de déséquilibre gauche-droit). Une rotation gauche-droite (double rotation) est nécessaire.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Énoncez les cinq propriétés d'un arbre Rouge-Noir. Comparez les complexités en temps des opérations d'insertion et de suppression entre un arbre AVL et un arbre Rouge-Noir. Dans quel cas préférerez-vous utiliser un arbre Rouge-Noir ?</p>",
          "reponse": "<p>Propriétés d'un arbre Rouge-Noir :</p><ol><li>Chaque nœud est soit rouge, soit noir.</li><li>La racine est noire.</li><li>Les feuilles (NIL) sont noires.</li><li>Un nœud rouge ne peut pas avoir d'enfant rouge (pas de deux rouges consécutifs).</li><li>Pour chaque nœud, tous les chemins simples de ce nœud vers les feuilles descendantes contiennent le même nombre de nœuds noirs (hauteur noire).</li></ol><p>Bien que les deux structures garantissent une hauteur \(O(\\log n)\), les rotations lors des insertions/suppressions sont moins fréquentes dans les arbres Rouge-Noir (au plus 3 rotations). En pratique, on préfère les arbres Rouge-Noir pour les applications avec de nombreuses insertions/suppressions (ex : les dictionnaires en Java ou C++), et les AVL pour les applications où les recherches sont plus fréquentes que les modifications.</p>"
        }
      ]
    },
    {
      "titre": "Tas Binaires et Files de Priorité",
      "points": "4 pts",
      "enonce": "<p>Le tas binaire est une structure de données fondamentale pour implémenter efficacement une file de priorité. Il repose sur un arbre binaire presque complet et sa propriété d'ordre partiel.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Expliquez comment maintenir la propriété de tas (heapify) après l'insertion d'un nouvel élément (sift-up) et après la suppression du maximum (sift-down) dans un max-heap. Illustrez avec un exemple sur le tas suivant : [100, 90, 80, 70, 60, 50, 40].</p>",
          "reponse": "<p><strong>Insertion (Sift-up) :</strong> L'élément est ajouté à la fin du tableau. On le compare avec son parent ; s'il est plus grand, on les échange. On répète jusqu'à ce que la propriété de tas soit rétablie.</p><p><strong>Suppression du maximum (Sift-down) :</strong> On remplace la racine par le dernier élément du tas. Ensuite, on compare ce nouvel élément avec ses enfants ; s'il est plus petit que l'un d'eux, on l'échange avec le plus grand des deux. On répète jusqu'à ce que la propriété soit rétablie.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Décrivez l'algorithme du tri par tas (Heap Sort). Quelle est sa complexité temporelle dans le pire des cas ?</p>",
          "reponse": "<p>Le tri par tas se déroule en deux phases :</p><ol><li><strong>Construction du tas :</strong> On transforme le tableau en un max-heap en utilisant l'opération heapify de bas en haut. Complexité : \(O(n)\).</li><li><strong>Tri :</strong> On échange la racine (le maximum) avec le dernier élément du tas, on réduit la taille du tas de 1, et on rétablit la propriété de tas sur la nouvelle racine (sift-down). On répète cette opération jusqu'à ce que le tas soit vide.</li></ol><p>La complexité du tri par tas est \(O(n \\log n)\) dans tous les cas (pire, moyen et meilleur). C'est un tri en place, ce qui est un avantage majeur.</p>"
        }
      ]
    },
    {
      "titre": "Tables de Hachage Dynamiques",
      "points": "4 pts",
      "enonce": "<p>Les tables de hachage sont des structures de données clé-valeur offrant des performances exceptionnelles en moyenne. Leur efficacité repose sur une bonne fonction de hachage et une gestion efficace des collisions et de la charge.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Qu'est-ce que le rehachage (rehashing) ? Expliquez son importance et son coût amorti.</p>",
          "reponse": "<p>Le rehachage est le processus qui consiste à agrandir la table de hachage et à y réinsérer toutes les clés existantes avec une nouvelle fonction de hachage adaptée à la nouvelle taille.</p><p>Il est déclenché lorsque le facteur de charge (nombre d'éléments / taille de la table) dépasse un seuil prédéfini. Cette opération est coûteuse (coût linéaire en \(O(n)\)), mais si elle est effectuée avec parcimonie (par exemple, en doublant la taille), son coût est amorti en \(O(1)\) par insertion, garantissant ainsi d'excellentes performances globales.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Qu'est-ce que le hachage extensible (extendible hashing) et pour quelle application est-il particulièrement adapté ?</p>",
          "reponse": "<p>Le hachage extensible est une technique de hachage dynamique utilisée principalement pour les bases de données et les systèmes de fichiers, où les données sont stockées sur disque. Elle permet d'ajouter ou de retirer des buckets (pages de disque) sans avoir à réorganiser toute la table, ce qui est crucial pour des volumes de données massifs. Elle repose sur un annuaire (tableau de pointeurs vers les buckets) qui est doublé lors des expansions, limitant ainsi les accès au disque.</p>"
        }
      ]
    },
    {
      "titre": "Algorithmes de Plus Courts Chemins",
      "points": "4 pts",
      "enonce": "<p>Le calcul des plus courts chemins est un problème central en théorie des graphes, avec des applications allant du routage réseau à la planification d'itinéraires. Deux algorithmes classiques sont Bellman-Ford et Floyd-Warshall.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> L'algorithme de Bellman-Ford permet de trouver le plus court chemin depuis une source vers tous les autres nœuds. Quel est son principal avantage par rapport à l'algorithme de Dijkstra ? Expliquez comment il détecte les cycles de poids négatif.</p>",
          "reponse": "<p>L'avantage principal de l'algorithme de Bellman-Ford est qu'il peut traiter des graphes avec des arêtes de poids négatif, contrairement à Dijkstra. Pour détecter un cycle de poids négatif, on exécute une \(n\)-ième itération (où \(n\) est le nombre de nœuds) sur les arêtes. Si une distance peut encore être améliorée, cela signifie qu'il existe un cycle de poids négatif atteignable depuis la source, et le problème n'a pas de solution (le plus court chemin n'est pas défini).</p>"
        },
        {
          "question": "<p><strong>4.2</strong> L'algorithme de Floyd-Warshall calcule les plus courts chemins entre toutes les paires de sommets. Décrivez son principe de fonctionnement basé sur la programmation dynamique et donnez sa complexité temporelle.</p>",
          "reponse": "<p>Floyd-Warshall utilise le principe de la programmation dynamique. Il considère itérativement chaque sommet \(k\) comme un intermédiaire potentiel sur un chemin entre \(i\) et \(j\). L'idée est de mettre à jour la distance \(dist[i][j]\) en prenant le minimum entre la distance actuelle et \(dist[i][k] + dist[k][j]\).</p><p>Sa complexité temporelle est \(O(n^3)\), où \(n\) est le nombre de sommets. Il est donc adapté pour des graphes de taille modérée mais est efficace à implémenter et fonctionne avec des poids négatifs (tant qu'il n'y a pas de cycle négatif).</p>"
        }
      ]
    },
    {
      "titre": "Programmation Dynamique : Problèmes Classiques",
      "points": "6 pts",
      "enonce": "<p>La programmation dynamique est une méthode algorithmique puissante pour résoudre des problèmes d'optimisation en les décomposant en sous-problèmes plus petits qui se chevauchent. Elle est caractérisée par une sous-structure optimale et le recours à la mémoïsation ou à l'itération.</p>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> Formulez l'équation de récurrence pour le problème du sac à dos (Knapsack) 0/1, où l'on doit maximiser la valeur totale des objets transportés sans dépasser une capacité \(W\). Expliquez ce que représente chaque terme de l'équation [citation:1].</p>",
          "reponse": "<p>Soit \(dp[i][w]\) la valeur maximale que l'on peut obtenir en considérant les \(i\) premiers objets avec une capacité \(w\).</p><div class='math-block'><div class='math'>$$ dp[i][w] = \\max(dp[i-1][w], \\; dp[i-1][w - poids_i] + valeur_i) $$</div></div><p>avec la condition \(w \\ge poids_i\).</p><ul><li><strong>\\(dp[i-1][w]\\)</strong> : On ne prend pas l'objet \\(i\\).</li><li><strong>\\(dp[i-1][w - poids_i] + valeur_i\\)</strong> : On prend l'objet \\(i\\), ce qui ajoute \\(valeur_i\\) et réduit la capacité disponible de \\(poids_i\\).</li></ul>"
        },
        {
          "question": "<p><strong>5.2</strong> Expliquez la différence entre l'approche descendante (mémoïsation) et l'approche ascendante (itération) en programmation dynamique [citation:2]. Illustrez avec un exemple simple sur le calcul de la suite de Fibonacci.</p>",
          "reponse": "<p><strong>Mémoïsation (Descendante) :</strong> On commence par le problème initial que l'on décompose récursivement en sous-problèmes. Chaque sous-problème résolu est stocké (en cache) pour éviter de le recalculer. On ne calcule que les sous-problèmes nécessaires.</p><p><strong>Itération (Ascendante) :</strong> On résout les sous-problèmes dans l'ordre, des plus petits aux plus grands, et on stocke les résultats dans un tableau. Cette approche est généralement plus efficace car elle évite la récursion et les appels de fonction.</p>"
        }
      ]
    },
    {
      "titre": "Algorithmes Probabilistes et Filtres de Bloom",
      "points": "4 pts",
      "enonce": "<p>Les algorithmes probabilistes introduisent le hasard pour résoudre des problèmes de manière efficace. Ils se divisent en deux grandes catégories : Monte Carlo (résultat parfois erroné) et Las Vegas (temps d'exécution variable). Le filtre de Bloom est une structure de données probabiliste emblématique.</p>",
      "questions": [
        {
          "question": "<p><strong>6.1</strong> Distinguez les algorithmes de Monte Carlo des algorithmes de Las Vegas [citation:6]. Donnez un exemple pour chaque type.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
