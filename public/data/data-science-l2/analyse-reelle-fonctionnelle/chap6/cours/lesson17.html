<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='padding: 20px; background: linear-gradient(135deg, #1a237e, #283593); border-radius: 15px; color: #ffffff; text-align: center;'><h2 style='color: #ffffff;'>Chapitre 6 : Équations Différentielles Linéaires</h2><h3 style='color: #e8eaf6;'>Leçon 17 : Systèmes Différentiels Linéaires</h3><p style='font-size: 1.2em;'>Bienvenue dans cette leçon consacrée aux systèmes d'équations différentielles linéaires.</p><p style='margin-top: 20px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px;'>Nous allons voir comment écrire ces systèmes sous forme matricielle, les résoudre à l'aide de l'exponentielle de matrice, et déterminer leur solution générale.</p><p style='margin-top: 10px;'><strong>Objectif :</strong> Maîtriser la résolution des systèmes différentiels linéaires.</p></div>",
    "texteParle": "Bonjour à tous et bienvenue dans cette leçon sur les systèmes différentiels linéaires. Nous allons apprendre à modéliser des problèmes complexes sous forme matricielle, utiliser l'exponentielle de matrice comme outil de résolution, et déterminer les solutions générales. Ces concepts sont fondamentaux en data science pour comprendre l'évolution des systèmes dynamiques.",
    "note": "Introduction au chapitre des systèmes différentiels linéaires."
  },
  {
    "titre": "Plan du cours",
    "contenu": "<div style='padding: 20px; background: #f5f5f5; border-radius: 15px; color: #1a237e;'><h3 style='color: #1a237e; text-align: center;'>Plan de la leçon</h3><ul style='list-style-type: none; padding: 0; font-size: 1.1em;'><li style='padding: 10px; border-bottom: 1px solid #e0e0e0;'>1️⃣ Forme matricielle d'un système différentiel</li><li style='padding: 10px; border-bottom: 1px solid #e0e0e0;'>2️⃣ Résolution du système homogène X' = AX</li><li style='padding: 10px; border-bottom: 1px solid #e0e0e0;'>3️⃣ Exponentielle de matrice et son utilisation</li><li style='padding: 10px; border-bottom: 1px solid #e0e0e0;'>4️⃣ Solution générale et applications</li><li style='padding: 10px;'>5️⃣ Exemples concrets en Data Science</li></ul></div>",
    "texteParle": "Voici le plan de notre leçon. Nous allons commencer par la forme matricielle des systèmes différentiels, puis nous verrons comment résoudre le système homogène. Ensuite, nous introduirons l'exponentielle de matrice, un outil puissant pour la résolution. Nous déterminerons la solution générale et terminerons par des exemples concrets en data science.",
    "note": "Structure de la leçon avec les différents thèmes abordés."
  },
  {
    "titre": "Forme matricielle",
    "contenu": "<div style='padding: 20px; background: #e8eaf6; border-radius: 15px;'><h3 style='color: #1a237e;'>Écriture matricielle</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'><p style='font-size: 1.1em;'>Un système différentiel linéaire s'écrit :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center;'><div class='math'><span style='font-size: 1.3em;'>X'(t) = A(t) X(t) + B(t)</span></div></div><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>X(t)</strong> : vecteur d'état (taille n)</li><li><strong>A(t)</strong> : matrice carrée n×n</li><li><strong>B(t)</strong> : second membre (vecteur)</li></ul></div><div style='background: #bbdefb; padding: 10px; border-radius: 8px;'><p><strong>Exemple :</strong> <br/> \( \begin{cases} x_1' = 2x_1 + x_2 \\ x_2' = -x_1 + 3x_2 \end{cases} \) <br/> \( X = \begin{pmatrix} x_1 \\ x_2 \end{pmatrix} \), \( A = \begin{pmatrix} 2 & 1 \\ -1 & 3 \end{pmatrix} \), \( B = 0 \)</p></div></div>",
    "texteParle": "Un système différentiel linéaire peut s'écrire sous une forme matricielle compacte. On a X'(t) égal à A(t) fois X(t) plus B(t). Ici, X est le vecteur d'état, A est une matrice carrée qui peut dépendre du temps, et B est le second membre. Par exemple, ce système de deux équations se transforme en une équation matricielle simple.",
    "note": "Forme générale d'un système différentiel linéaire : X'(t) = A(t) X(t) + B(t)"
  },
  {
    "titre": "Système homogène",
    "contenu": "<div style='padding: 20px; background: #e8f5e9; border-radius: 15px;'><h3 style='color: #1b5e20;'>Système homogène : X' = A X</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'><p>Lorsque <strong>B(t) = 0</strong>, le système est dit <strong>homogène</strong>.</p><div class='math-block' style='background: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center;'><div class='math'><span style='font-size: 1.2em;'>X'(t) = A X(t)</span></div></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px; margin-top: 15px;'><p><strong>Propriété fondamentale :</strong> Si X₁ et X₂ sont solutions, alors toute combinaison linéaire est aussi solution.</p><p>L'ensemble des solutions forme un <strong>espace vectoriel</strong> de dimension n.</p></div><div style='background: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p><strong>Exemple :</strong> Pour \( A = \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix} \), le système est \( x_1' = x_2, x_2' = -x_1 \).</p></div></div></div>",
    "texteParle": "Quand le second membre B est nul, le système est dit homogène. Il s'écrit simplement X' égale A fois X. Une propriété importante est que si on a deux solutions, leur combinaison linéaire est aussi solution. L'ensemble des solutions forme donc un espace vectoriel de dimension n, c'est-à-dire le nombre d'équations.",
    "note": "Système homogène X' = A X : espace vectoriel de solutions de dimension n."
  },
  {
    "titre": "Exponentielle de matrice",
    "contenu": "<div style='padding: 20px; background: #e3f2fd; border-radius: 15px;'><h3 style='color: #0d47a1;'>Exponentielle de matrice</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p>Pour une matrice carrée A, on définit :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center;'><div class='math'><span style='font-size: 1.3em;'>\( e^{A} = \sum_{k=0}^{\infty} \frac{A^k}{k!} \)</span></div></div><p style='margin-top: 15px;'>Cette série converge toujours pour toute matrice A.</p><div style='background: #e3f2fd; padding: 10px; border-radius: 8px; margin: 15px 0;'><p><strong>Propriétés clés :</strong></p><ul><li>\( e^{0} = I \) (matrice identité)</li><li>\( (e^{A})^{-1} = e^{-A} \)</li><li>Si A et B commutent (\( AB = BA \)), alors \( e^{A+B} = e^{A} e^{B} \)</li></ul></div><div style='background: #fff3e0; padding: 10px; border-radius: 8px;'><p><strong>Exemple :</strong> Pour une matrice diagonale \( A = \text{diag}(\lambda_1, \lambda_2) \), <br/> \( e^{A} = \begin{pmatrix} e^{\lambda_1} & 0 \\ 0 & e^{\lambda_2} \end{pmatrix} \)</p></div></div></div>",
    "texteParle": "L'exponentielle de matrice est définie par une série infinie, comme pour l'exponentielle classique. Cette série converge toujours. Les propriétés sont similaires à celles de l'exponentielle numérique. Par exemple, si la matrice est diagonale, l'exponentielle est simplement la matrice des exponentielles des coefficients diagonaux.",
    "note": "Définition et propriétés de l'exponentielle de matrice e^A = Σ A^k/k!"
  },
  {
    "titre": "Résolution par exponentielle",
    "contenu": "<div style='padding: 20px; background: #fce4ec; border-radius: 15px;'><h3 style='color: #b71c1c;'>Résolution du système homogène</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p>Le système homogène \( X'(t) = A X(t) \) a pour solution générale :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center;'><div class='math'><span style='font-size: 1.3em;'>\( X(t) = e^{tA} X(0) \)</span></div></div><div style='background: #fce4ec; padding: 10px; border-radius: 8px; margin: 15px 0;'><p><strong>Vérification :</strong></p><div class='math-block'><span style='font-size: 1.1em;'>\( X'(t) = A e^{tA} X(0) = A X(t) \)</span></div></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p><strong>Important :</strong> La solution est entièrement déterminée par la condition initiale \( X(0) \).</p><p>On peut aussi écrire \( X(t) = e^{tA} C \) où \( C = X(0) \) est un vecteur constant.</p></div></div></div>",
    "texteParle": "La solution du système homogène est donnée par l'exponentielle de tA multipliée par la condition initiale. On vérifie que cette expression satisfait bien l'équation différentielle. La solution est entièrement déterminée par la condition initiale, ce qui est logique car c'est un système d'ordre 1.",
    "note": "Solution générale du système homogène : X(t) = e^(tA) X(0)"
  },
  {
    "titre": "Cas des matrices diagonales",
    "contenu": "<div style='padding: 20px; background: #f3e5f5; border-radius: 15px;'><h3 style='color: #4a148c;'>Matrices diagonalisables</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p>Si A est diagonalisable : \( A = P D P^{-1} \), avec D diagonale.</p><div style='background: #f5f5f5; padding: 10px; border-radius: 8px;'><p>Alors \( e^{tA} = P e^{tD} P^{-1} \)</p></div><div style='background: #e8eaf6; padding: 10px; border-radius: 8px; margin: 15px 0;'><p><strong>Exemple :</strong> \( A = \begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix} \)</p><p>\( \lambda_1 = 1, \lambda_2 = 2 \)</p><p>\( P = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, D = \begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix} \)</p></div><div style='background: #e3f2fd; padding: 10px; border-radius: 8px;'><p><strong>Solution :</strong> \( X(t) = P \begin{pmatrix} e^t & 0 \\ 0 & e^{2t} \end{pmatrix} P^{-1} X(0) \)</p></div></div></div>",
    "texteParle": "Quand la matrice A est diagonalisable, on peut simplifier le calcul de l'exponentielle. On écrit A comme P fois D fois P inverse, où D est une matrice diagonale. Alors l'exponentielle de tA est P fois l'exponentielle de tD fois P inverse. L'exponentielle d'une matrice diagonale est très simple : c'est la matrice des exponentielles des coefficients diagonaux.",
    "note": "Pour A diagonalisable : e^(tA) = P e^(tD) P^(-1)"
  },
  {
    "titre": "Système avec second membre",
    "contenu": "<div style='padding: 20px; background: #fff8e1; border-radius: 15px;'><h3 style='color: #e65100;'>Système non homogène</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p>Pour \( X'(t) = A X(t) + B(t) \), on utilise la <strong>formule de Duhamel</strong> :</p><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center;'><div class='math'><span style='font-size: 1.2em;'>\( X(t) = e^{tA} X(0) + \int_0^t e^{(t-s)A} B(s) \, ds \)</span></div></div><div style='background: #fff3e0; padding: 10px; border-radius: 8px; margin: 15px 0;'><p><strong>Interprétation :</strong></p><ul><li>\( e^{tA} X(0) \) : solution homogène</li><li>\( \int_0^t e^{(t-s)A} B(s) ds \) : contribution du second membre</li></ul></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p><strong>Propriété :</strong> La solution est la somme de la solution homogène et d'une solution particulière.</p></div></div></div>",
    "texteParle": "Pour résoudre un système avec second membre non nul, on utilise la formule de Duhamel. La solution s'écrit comme la solution homogène, plus une intégrale qui représente la contribution du second membre. Cette intégrale est comme une convolution où l'exponentielle de matrice joue le rôle de fonction de Green.",
    "note": "Formule de Duhamel : X(t) = e^(tA) X(0) + ∫₀ᵗ e^((t-s)A) B(s) ds"
  },
  {
    "titre": "Exemple concret",
    "contenu": "<div style='padding: 20px; background: #e0f7fa; border-radius: 15px;'><h3 style='color: #00695c;'>Application en Data Science</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p><strong>Problème :</strong> Modélisation de la propagation d'un virus dans une population.</p><div style='background: #f5f5f5; padding: 10px; border-radius: 8px;'><p>Soient S(t) = susceptibles, I(t) = infectés.</p><div class='math-block'><span style='font-size: 1.1em;'>\( \begin{cases} S'(t) = -α S(t) I(t) \\ I'(t) = α S(t) I(t) - β I(t) \end{cases} \)</span></div></div><div style='background: #fff3e0; padding: 10px; border-radius: 8px; margin: 10px 0;'><p>À l'état initial (\( t=0 \)) : \( S(0) = 0.9, I(0) = 0.1 \)</p><p>Si on suppose \( \alpha = 0.3, \beta = 0.1 \) (constantes), on peut linéariser autour de l'état d'équilibre.</p></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p><strong>Matrice jacobienne :</strong> \( A = \begin{pmatrix} -0.27 & -0.03 \\ 0.27 & -0.07 \end{pmatrix} \)</p><p>La solution s'obtient par \( X(t) = e^{tA} X(0) \).</p></div></div></div>",
    "texteParle": "Prenons un exemple concret en data science : la modélisation de la propagation d'un virus. On a un système d'équations différentielles avec S les susceptibles et I les infectés. On peut linéariser ce système autour d'un point d'équilibre pour obtenir un système linéaire. La solution s'obtient alors par l'exponentielle de la matrice jacobienne.",
    "note": "Exemple d'application : modélisation épidémiologique SIR linéarisée."

  {
    "titre": "Résumé",
    "contenu": "<div style='padding: 20px; background: #f3e5f5; border-radius: 15px;'><h3 style='color: #4a148c; text-align: center;'>Points clés à retenir</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><ul style='list-style-type: none; padding: 0;'><li style='padding: 8px; border-bottom: 1px solid #e0e0e0;'>✅ Un système linéaire s'écrit \( X'(t) = A(t) X(t) + B(t) \)</li><li style='padding: 8px; border-bottom: 1px solid #e0e0e0;'>✅ Le système homogène est \( X' = A X \)</li><li style='padding: 8px; border-bottom: 1px solid #e0e0e0;'>✅ L'exponentielle de matrice est \( e^A = \sum_{k=0}^{\infty} A^k/k! \)</li><li style='padding: 8px; border-bottom: 1px solid #e0e0e0;'>✅ La solution homogène est \( X(t) = e^{tA} X(0) \)</li><li style='padding: 8px; border-bottom: 1px solid #e0e0e0;'>✅ La solution générale est \( X(t) = e^{tA} X(0) + \int_0^t e^{(t-s)A} B(s) ds \)</li><li style='padding: 8px;'>✅ Ces outils sont utilisés en modélisation de données temporelles</li></ul></div></div>",
    "texteParle": "Pour résumer, un système linéaire s'écrit sous forme matricielle. Le système homogène est résolu par l'exponentielle de matrice. La solution générale s'obtient par la formule de Duhamel. Ces concepts sont essentiels en data science pour la modélisation de données temporelles.",

    "contenu": "<div style='padding: 20px; background: #e8eaf6; border-radius: 15px;'><h3 style='color: #1a237e;'>Exercice d'application</h3><div style='background: #ffffff; padding: 15px; border-radius: 10px;'><p><strong>Énoncé :</strong></p><div style='background: #f5f5f5; padding: 10px; border-radius: 8px;'><p>Soit le système différentiel suivant :</p><div class='math-block'><span style='font-size: 1.1em;'>\( \begin{cases} x_1'(t) = 2x_1(t) - x_2(t) \\ x_2'(t) = -x_1(t) + 2x_2(t) \end{cases} \)</span></div><p>avec \( X(0) = \begin{pmatrix} 1 \\ 1 \end{pmatrix} \)</p></div><div style='background: #fff3e0; padding: 10px; border-radius: 8px; margin: 15px 0;'><p><strong>Questions :</strong></p><ol><li>Écrire le système sous forme matricielle \( X' = A X \)</li><li>Déterminer l'exponentielle \( e^{tA} \)</li><li>Calculer la solution générale \( X(t) \)</li><li>Donner la solution avec la condition initiale donnée</li></ol></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p><strong>Indice :</strong> La matrice A peut se décomposer en \( A = 2I + B \) où \( B = \begin{pmatrix} 0 & -1 \\ -1 & 0 \end{pmatrix} \).</p><p>Les matrices \( I \) et \( B \) commutent.</p></div></div></div>",

    "texteParle": "Merci pour votre attention. J'espère que cette leçon vous a été utile. N'hésitez pas à poser des questions et à pratiquer avec des exercices. La maîtrise de l'exponentielle de matrice est essentielle pour comprendre les systèmes dynamiques en data science.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        if (statusBadge) {

        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
