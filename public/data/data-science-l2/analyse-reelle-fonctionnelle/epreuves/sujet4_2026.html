<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse Réelle et Fonctionnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de cours sur le dual et le théorème de Riesz",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les notions fondamentales de dualité dans les espaces de Hilbert.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Définir le dual topologique \( H' \) d'un espace de Hilbert \( H \).</p>",
          "reponse": "<p>Le dual topologique \( H' \) est l'ensemble des formes linéaires continues sur \( H \), c'est-à-dire l'ensemble des applications \( \varphi : H \to \mathbb{R} \) (ou \( \mathbb{C} \)) qui sont linéaires et bornées.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Énoncer le théorème de représentation de Riesz.</p>",
          "reponse": "<p>Pour toute forme linéaire continue \( \varphi \in H' \), il existe un unique vecteur \( a \in H \) tel que \( \forall x \in H, \quad \varphi(x) = \langle x, a \rangle \). De plus, \( \| \varphi \|_{H'} = \| a \|_H \).</p>"
        },
        {
          "question": "<p><strong>3)</strong> Que signifie l'identification du dual de \( L^2 \) avec \( L^2 \) ?</p>",
          "reponse": "<p>Cela signifie que toute forme linéaire continue sur \( L^2 \) peut être représentée par une fonction de \( L^2 \) via le produit scalaire intégral : pour tout \( f \in L^2 \), la forme \( \varphi_f(g) = \int f g \) est continue, et réciproquement, toute forme continue est de ce type.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Forme linéaire sur un sous-espace",
      "points": "5 pts",
      "enonce": "<p>Soit \( H = \mathbb{R}^3 \) muni du produit scalaire usuel. Soit \( F = \{ (x,y,z) \in \mathbb{R}^3 \mid x + y + z = 0 \} \). On définit \( \varphi : F \to \mathbb{R} \) par \( \varphi(x,y,z) = x - y \).</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Montrer que \( F \) est un sous-espace vectoriel de \( H \). Est-il fermé ?</p>",
          "reponse": "<p>\( F \) est le noyau de la forme linéaire \( (x,y,z) \mapsto x + y + z \), donc c'est un sous-espace vectoriel de dimension 2. Il est fermé car tout sous-espace de dimension finie dans un espace normé est fermé.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Justifier que \( \varphi \) est une forme linéaire continue sur \( F \).</p>",
          "reponse": "<p>La linéarité est évidente. Pour la continuité, on a \( |\varphi(x,y,z)| = |x - y| \le \sqrt{x^2 + y^2 + z^2} = \| (x,y,z) \| \). Donc \( \varphi \) est continue.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Utiliser le théorème de Riesz pour trouver un vecteur \( a \in F \) tel que \( \varphi(v) = \langle v, a \rangle \) pour tout \( v \in F \).</p>",
          "reponse": "<p>On cherche \( a = (a_1, a_2, a_3) \in F \) tel que \( \langle v, a \rangle = x - y \) pour tout \( v = (x,y,z) \in F \), avec \( x + y + z = 0 \). On a \( \langle v, a \rangle = x a_1 + y a_2 + z a_3 \). Pour que ce soit égal à \( x - y \) sur \( F \), on peut prendre \( a_1 = 1, a_2 = -1, a_3 = 0 \). On vérifie que \( 1 - 1 + 0 = 0 \), donc \( a \in F \). Ainsi, \( a = (1, -1, 0) \) convient.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Calcul de l'adjoint dans \( L^2 \)",
      "points": "5 pts",
      "enonce": "<p>Soit \( H = L^2([0,1]) \) et soit \( T: H \to H \) défini par \( (Tf)(x) = \int_0^x f(t) \, dt \).</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Montrer que \( T \) est linéaire et continu.</p>",
          "reponse": "<p>La linéarité est immédiate. Pour la continuité, on a \( |(Tf)(x)| \le \int_0^x |f(t)| dt \le \sqrt{x} \|f\|_2 \). Donc \( \|Tf\|_2^2 \le \int_0^1 x \|f\|_2^2 dx = \frac12 \|f\|_2^2 \). Ainsi \( \|Tf\|_2 \le \frac{1}{\sqrt{2}} \|f\|_2 \). T est continu.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Déterminer l'adjoint \( T^* \) de \( T \).</p>",
          "reponse": "<p>Pour \( f,g \in H \), on a \( \langle Tf, g \rangle = \int_0^1 (Tf)(x) g(x) dx = \int_0^1 \int_0^x f(t) g(x) dt dx = \int_0^1 f(t) \int_t^1 g(x) dx dt = \langle f, T^*g \rangle \). Donc \( (T^*g)(t) = \int_t^1 g(x) dx \).</p>"
        },
        {
          "question": "<p><strong>3)</strong> Que représente \( T^*T \) ? Est-il compact ?</p>",
          "reponse": "<p>\( T \) est un opérateur de Volterra, qui est compact sur \( L^2([0,1]) \). Le produit \( T^*T \) est donc compact. \( T^*T \) est souvent appelé l'opérateur de covariance ou de Gram dans certains contextes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Application en Data Science - Régression ridge dans un RKHS",
      "points": "6 pts",
      "enonce": "<p>On considère le problème de régression ridge dans un espace de Hilbert à noyau reproduisant (RKHS) \( \mathcal{H} \) associé à un noyau \( K \). On dispose de \( n \) points de données \( (x_i, y_i) \), et on cherche \( f \in \mathcal{H} \) minimisant la fonctionnelle de régularisation de Tikhonov :</p><div class='math-block'><div class='math'>$$ J(f) = \\sum_{i=1}^n (y_i - f(x_i))^2 + \\lambda \\|f\\|_{\\mathcal{H}}^2 $$</div></div><p>avec \( \lambda > 0 \).</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Que signifie \( \\|f\\|_{\\mathcal{H}} \) et pourquoi ajoute-t-on ce terme à la fonction de coût ?</p>",
          "reponse": "<p>\( \\|f\\|_{\\mathcal{H}} \) est la norme de la fonction \( f \) dans le RKHS. Ce terme de pénalité contrôle la complexité de la fonction et permet d'éviter le surapprentissage. Il favorise les fonctions régulières (i.e., de norme faible).</p>"
        },
        {
          "question": "<p><strong>2)</strong> En utilisant le théorème de représentation, montrer que la solution \( f^* \) s'écrit \( f^*(x) = \\sum_{j=1}^n \\alpha_j K(x, x_j) \).</p>",
          "reponse": "<p>Le théorème de représentation affirme que la solution du problème de minimisation dans un RKHS est une combinaison linéaire finie des noyaux évalués aux points de données. Ainsi, il existe des coefficients \( \\alpha_j \\in \\mathbb{R} \) tels que \( f^*(x) = \\sum_{j=1}^n \\alpha_j K(x, x_j) \).</p>"
        },
        {
          "question": "<p><strong>3)</strong> En déduire que le problème se ramène à la résolution d'un système linéaire \( (K + \\lambda I) \\alpha = y \), où \( K \) est la matrice de Gram \( K_{ij} = K(x_i, x_j) \).</p>",
          "reponse": "<p>En substituant \( f(x) = \\sum_{j} \\alpha_j K(x, x_j) \) dans la fonctionnelle \( J(f) \), et en utilisant la propriété de reproduction \( f(x_i) = \\sum_j \\alpha_j K(x_i, x_j) = (K \\alpha)_i \) et \( \\|f\\|_{\\mathcal{H}}^2 = \\alpha^T K \\alpha \), on obtient \( J(\\alpha) = \\| y - K \\alpha \\|^2 + \\lambda \\alpha^T K \\alpha \). En dérivant par rapport à \( \\alpha \), on obtient l'équation normale \( (K + \\lambda I) \\alpha = y \).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
