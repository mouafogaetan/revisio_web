<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse Réelle et Fonctionnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Systèmes différentiels linéaires",
      "points": "7 pts",
      "enonce": "<p>On considère le système différentiel linéaire suivant :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x'(t) = 2x(t) + y(t) \\\\ y'(t) = x(t) + 2y(t) \\end{cases} $$</div></div><p>avec les conditions initiales \\( x(0) = 1 \\) et \\( y(0) = 0 \\).</p>",
      "questions": [
        {
          "question": "<strong>1.1 (2 pts) :</strong> Écrire ce système sous forme matricielle \\( X'(t) = A X(t) \\) en identifiant la matrice \\( A \\).",
          "reponse": "<p>On pose \\( X(t) = \\begin{pmatrix} x(t) \\\\ y(t) \\end{pmatrix} \\). Alors le système s'écrit :</p><div class='math-block'><div class='math'>$$ X'(t) = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} X(t) $$</div></div><p>Donc \\( A = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} \\).</p>"
        },
        {
          "question": "<strong>1.2 (3 pts) :</strong> Déterminer les valeurs propres et les vecteurs propres de la matrice \\( A \\).",
          "reponse": "<p>Le polynôme caractéristique est :</p><div class='math-block'><div class='math'>$$ \\det(A - \\lambda I) = \\begin{vmatrix} 2-\\lambda & 1 \\\\ 1 & 2-\\lambda \\end{vmatrix} = (2-\\lambda)^2 - 1 = (2-\\lambda - 1)(2-\\lambda + 1) = (1-\\lambda)(3-\\lambda) $$</div></div><p>Les valeurs propres sont donc \\( \\lambda_1 = 1 \\) et \\( \\lambda_2 = 3 \\).</p><p>Pour \\( \\lambda_1 = 1 \\), le vecteur propre associé vérifie :</p><div class='math-block'><div class='math'>$$ (A - I)v_1 = 0 \\iff \\begin{pmatrix} 1 & 1 \\\\ 1 & 1 \\end{pmatrix} \\begin{pmatrix} v_{1x} \\\\ v_{1y} \\end{pmatrix} = 0 \\iff v_{1x} + v_{1y} = 0 $$</div></div><p>Donc \\( v_1 = \\begin{pmatrix} 1 \\\\ -1 \\end{pmatrix} \\).</p><p>Pour \\( \\lambda_2 = 3 \\), on a :</p><div class='math-block'><div class='math'>$$ (A - 3I)v_2 = 0 \\iff \\begin{pmatrix} -1 & 1 \\\\ 1 & -1 \\end{pmatrix} \\begin{pmatrix} v_{2x} \\\\ v_{2y} \\end{pmatrix} = 0 \\iff -v_{2x} + v_{2y} = 0 $$</div></div><p>Donc \\( v_2 = \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} \\).</p>"
        },
        {
          "question": "<strong>1.3 (2 pts) :</strong> En déduire la solution générale du système, puis la solution vérifiant les conditions initiales données.",
          "reponse": "<p>La solution générale est :</p><div class='math-block'><div class='math'>$$ X(t) = C_1 e^{t} \\begin{pmatrix} 1 \\\\ -1 \\end{pmatrix} + C_2 e^{3t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} $$</div></div><p>En \\( t = 0 \\), on a \\( X(0) = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix} \\).</p><p>On résout :</p><div class='math-block'><div class='math'>$$ \\begin{cases} C_1 + C_2 = 1 \\\\ -C_1 + C_2 = 0 \\end{cases} \\implies C_1 = C_2 = \\frac{1}{2} $$</div></div><p>Donc la solution est :</p><div class='math-block'><div class='math'>$$ X(t) = \\frac{1}{2} e^{t} \\begin{pmatrix} 1 \\\\ -1 \\end{pmatrix} + \\frac{1}{2} e^{3t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} \\frac{e^t + e^{3t}}{2} \\\\ \\frac{-e^t + e^{3t}}{2} \\end{pmatrix} $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Variation des constantes",
      "points": "7 pts",
      "enonce": "<p>On considère le système différentiel :</p><div class='math-block'><div class='math'>$$ X'(t) = \\begin{pmatrix} 0 & 1 \\\\ -2 & 3 \\end{pmatrix} X(t) + \\begin{pmatrix} 0 \\\\ e^{t} \\end{pmatrix} $$</div></div><p>avec la condition initiale \\( X(0) = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} \\).</p>",
      "questions": [
        {
          "question": "<strong>2.1 (2 pts) :</strong> Résoudre le système homogène associé \\( X'(t) = A X(t) \\) avec \\( A = \\begin{pmatrix} 0 & 1 \\\\ -2 & 3 \\end{pmatrix} \\).",
          "reponse": "<p>Le polynôme caractéristique est :</p><div class='math-block'><div class='math'>$$ \\det(A - \\lambda I) = \\begin{vmatrix} -\\lambda & 1 \\\\ -2 & 3-\\lambda \\end{vmatrix} = (-\\lambda)(3-\\lambda) + 2 = \\lambda^2 - 3\\lambda + 2 = (\\lambda - 1)(\\lambda - 2) $$</div></div><p>Les valeurs propres sont \\( \\lambda_1 = 1 \\) et \\( \\lambda_2 = 2 \\).</p><p>Pour \\( \\lambda_1 = 1 \\), le vecteur propre vérifie \\( (A - I)v_1 = 0 \\) :</p><div class='math-block'><div class='math'>$$ \\begin{pmatrix} -1 & 1 \\\\ -2 & 2 \\end{pmatrix} \\begin{pmatrix} v_{1x} \\\\ v_{1y} \\end{pmatrix} = 0 \\iff -v_{1x} + v_{1y} = 0 \\iff v_1 = \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} $$</div></div><p>Pour \\( \\lambda_2 = 2 \\), on a :</p><div class='math-block'><div class='math'>$$ \\begin{pmatrix} -2 & 1 \\\\ -2 & 1 \\end{pmatrix} \\begin{pmatrix} v_{2x} \\\\ v_{2y} \\end{pmatrix} = 0 \\iff -2v_{2x} + v_{2y} = 0 \\iff v_2 = \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} $$</div></div><p>La solution homogène est donc :</p><div class='math-block'><div class='math'>$$ X_h(t) = C_1 e^{t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} + C_2 e^{2t} \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} $$</div></div>"
        },
        {
          "question": "<strong>2.2 (3 pts) :</strong> Utiliser la méthode de variation des constantes pour trouver une solution particulière du système non homogène.",
          "reponse": "<p>On cherche une solution particulière de la forme :</p><div class='math-block'><div class='math'>$$ X_p(t) = u_1(t) e^{t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} + u_2(t) e^{2t} \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} $$</div></div><p>On doit avoir :</p><div class='math-block'><div class='math'>$$ \\begin{pmatrix} e^t & e^{2t} \\\\ e^t & 2e^{2t} \\end{pmatrix} \\begin{pmatrix} u_1'(t) \\\\ u_2'(t) \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ e^{t} \\end{pmatrix} $$</div></div><p>Le déterminant de la matrice est \\( \\det = e^t \\cdot 2e^{2t} - e^{2t} \\cdot e^t = e^{3t} \\neq 0 \\).</p><p>On résout :</p><div class='math-block'><div class='math'>$$ u_1'(t) = \\frac{0 \\cdot 2e^{2t} - e^{2t} \\cdot e^{t}}{e^{3t}} = -1, \\quad u_2'(t) = \\frac{e^t \\cdot e^{t} - e^t \\cdot 0}{e^{3t}} = e^{-t} $$</div></div><p>Donc \\( u_1(t) = -t \\) et \\( u_2(t) = -e^{-t} \\).</p><p>La solution particulière est :</p><div class='math-block'><div class='math'>$$ X_p(t) = -t e^{t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} - e^{-t} e^{2t} \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} -t e^{t} - e^{t} \\\\ -t e^{t} - 2e^{t} \\end{pmatrix} = -e^{t} \\begin{pmatrix} t+1 \\\\ t+2 \\end{pmatrix} $$</div></div>"
        },
        {
          "question": "<strong>2.3 (2 pts) :</strong> Donner la solution générale du système et déterminer la solution vérifiant la condition initiale.",
          "reponse": "<p>La solution générale est :</p><div class='math-block'><div class='math'>$$ X(t) = C_1 e^{t} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} + C_2 e^{2t} \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} - e^{t} \\begin{pmatrix} t+1 \\\\ t+2 \\end{pmatrix} $$</div></div><p>En \\( t = 0 \\), on a :</p><div class='math-block'><div class='math'>$$ X(0) = C_1 \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix} + C_2 \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} - \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} $$</div></div><p>On obtient le système :</p><div class='math-block'><div class='math'>$$ \\begin{cases} C_1 + C_2 - 1 = 0 \\\\ C_1 + 2C_2 - 2 = 0 \\end{cases} \\implies C_1 = 0, \\quad C_2 = 1 $$</div></div><p>La solution est donc :</p><div class='math-block'><div class='math'>$$ X(t) = e^{2t} \\begin{pmatrix} 1 \\\\ 2 \\end{pmatrix} - e^{t} \\begin{pmatrix} t+1 \\\\ t+2 \\end{pmatrix} $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équation différentielle d'ordre supérieur",
      "points": "6 pts",
      "enonce": "<p>On considère l'équation différentielle linéaire d'ordre 2 suivante :</p><div class='math-block'><div class='math'>$$ y''(t) - 3y'(t) + 2y(t) = e^{t} $$</div></div>",
      "questions": [
        {
          "question": "<strong>3.1 (2 pts) :</strong> Transformer cette équation en un système différentiel linéaire d'ordre 1.",
          "reponse": "<p>On pose \\( x_1(t) = y(t) \\) et \\( x_2(t) = y'(t) \\). Alors :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x_1'(t) = x_2(t) \\\\ x_2'(t) = y''(t) = 3y'(t) - 2y(t) + e^{t} = 3x_2(t) - 2x_1(t) + e^{t} \\end{cases} $$</div></div><p>Sous forme matricielle :</p><div class='math-block'><div class='math'>$$ X'(t) = \\begin{pmatrix} 0 & 1 \\\\ -2 & 3 \\end{pmatrix} X(t) + \\begin{pmatrix} 0 \\\\ e^{t} \\end{pmatrix} $$</div></div>"
        },
        {
          "question": "<strong>3.2 (2 pts) :</strong> Déterminer le polynôme caractéristique de l'équation et en déduire la solution générale de l'équation homogène \\( y'' - 3y' + 2y = 0 \\).",
          "reponse": "<p>Le polynôme caractéristique est :</p><div class='math-block'><div class='math'>$$ r^2 - 3r + 2 = (r - 1)(r - 2) $$</div></div><p>Les racines sont \\( r_1 = 1 \\) et \\( r_2 = 2 \\).</p><p>La solution générale de l'équation homogène est donc :</p><div class='math-block'><div class='math'>$$ y_h(t) = C_1 e^{t} + C_2 e^{2t} $$</div></div>"
        },
        {
          "question": "<strong>3.3 (2 pts) :</strong> Trouver une solution particulière de l'équation complète, puis en déduire la solution générale.",
          "reponse": "<p>On cherche une solution particulière de la forme \\( y_p(t) = a t e^{t} \\) car \\( e^{t} \\) est solution de l'équation homogène (résonance).</p><p>On calcule :</p><div class='math-block'><div class='math'>$$ y_p'(t) = a e^{t} + a t e^{t} = a(1+t)e^{t}, \\quad y_p''(t) = a(2+t)e^{t} $$</div></div><p>En substituant dans l'équation :</p><div class='math-block'><div class='math'>$$ a(2+t)e^{t} - 3a(1+t)e^{t} + 2a t e^{t} = a(2+t - 3 - 3t + 2t)e^{t} = -a e^{t} = e^{t} $$</div></div><p>Donc \\( a = -1 \\), et \\( y_p(t) = -t e^{t} \\).</p><p>La solution générale est :</p><div class='math-block'><div class='math'>$$ y(t) = C_1 e^{t} + C_2 e^{2t} - t e^{t} $$</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
