<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse Réelle et Fonctionnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Convergence de suites de fonctions",
      "points": "6 pts",
      "enonce": "<p>On considère la suite de fonctions <span class='math inline'>\\( f_n(x) = \\frac{x}{1+nx} \\)</span> définies sur l'intervalle <span class='math inline'>\\( I = [0, +\\infty[ \\)</span>.</p>",
      "questions": [
        {
          "question": "<strong>1.1 (2 pts) :</strong> Déterminer la fonction limite simple \\( f \\) de la suite \\( (f_n) \\) sur \\( I \\). Étudier la convergence simple de \\( (f_n) \\) vers \\( f \\).",
          "reponse": "<p>Pour \\( x = 0 \\), \\( f_n(0) = 0 \\) pour tout \\( n \\), donc \\( f(0) = 0 \\).</p><p>Pour \\( x > 0 \\), on a \\( f_n(x) = \\frac{x}{1+nx} \\sim \\frac{1}{n} \\) lorsque \\( n \\to +\\infty \\). Donc \\( \\lim_{n \\to +\\infty} f_n(x) = 0 \\).</p><p>Ainsi, la fonction limite simple est \\( f(x) = 0 \\) pour tout \\( x \\in [0, +\\infty[ \\). La suite converge simplement vers la fonction nulle.</p>"
        },
        {
          "question": "<strong>1.2 (2 pts) :</strong> Calculer \\( \\|f_n - f\\|_{\\infty} \\) sur \\( I \\) et déterminer si la convergence est uniforme.",
          "reponse": "<p>On a \\( |f_n(x) - f(x)| = \\left| \\frac{x}{1+nx} \\right| = \\frac{x}{1+nx} \\) pour \\( x \\ge 0 \\).</p><p>La fonction \\( g(x) = \\frac{x}{1+nx} \\) est croissante sur \\( [0, +\\infty[ \\) car \\( g'(x) = \\frac{1}{(1+nx)^2} > 0 \\).</p><p>Donc \\( \\sup_{x \\ge 0} \\frac{x}{1+nx} = \\lim_{x \\to +\\infty} \\frac{x}{1+nx} = \\frac{1}{n} \\).</p><p>Ainsi \\( \\|f_n - f\\|_{\\infty} = \\frac{1}{n} \\to 0 \\) lorsque \\( n \\to +\\infty \\).</p><p>La convergence est donc uniforme sur \\( [0, +\\infty[ \\).</p>"
        },
        {
          "question": "<strong>1.3 (2 pts) :</strong> Étudier la continuité de la fonction limite \\( f \\) et vérifier le théorème de continuité de la limite uniforme.",
          "reponse": "<p>La fonction limite \\( f(x) = 0 \\) est continue sur \\( [0, +\\infty[ \\).</p><p>Chaque fonction \\( f_n \\) est continue sur \\( [0, +\\infty[ \\) comme quotient de fonctions continues.</p><p>La convergence uniforme de \\( (f_n) \\) vers \\( f \\) sur \\( [0, +\\infty[ \\) et la continuité des \\( f_n \\) impliquent que \\( f \\) est continue, ce qui est bien vérifié.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Série entière et rayon de convergence",
      "points": "7 pts",
      "enonce": "<p>On considère la série entière \\( \\sum_{n=0}^{+\\infty} \\frac{x^n}{n!} \\) et la série entière \\( \\sum_{n=1}^{+\\infty} \\frac{(-1)^{n+1} x^n}{n} \\).</p>",
      "questions": [
        {
          "question": "<strong>2.1 (2 pts) :</strong> Rappeler les développements en série entière de \\( e^x \\) et de \\( \\ln(1+x) \\) sur leurs intervalles de convergence respectifs.",
          "reponse": "<p>On a :</p><div class='math-block'><div class='math'>$$ e^x = \\sum_{n=0}^{+\\infty} \\frac{x^n}{n!} \\quad \\text{pour tout } x \\in \\mathbb{R} $$</div></div><div class='math-block'><div class='math'>$$ \\ln(1+x) = \\sum_{n=1}^{+\\infty} \\frac{(-1)^{n+1} x^n}{n} \\quad \\text{pour } x \\in ]-1, 1] $$</div></div>"
        },
        {
          "question": "<strong>2.2 (2 pts) :</strong> Déterminer le rayon de convergence de la série \\( \\sum_{n=1}^{+\\infty} \\frac{(-1)^{n+1} x^n}{n} \\) en utilisant la règle de d'Alembert.",
          "reponse": "<p>On pose \\( a_n = \\frac{(-1)^{n+1}}{n} \\). Alors \\( |a_n| = \\frac{1}{n} \\).</p><p>On calcule \\( \\lim_{n \\to +\\infty} \\left| \\frac{a_{n+1}}{a_n} \\right| = \\lim_{n \\to +\\infty} \\frac{n}{n+1} = 1 \\).</p><p>Par la règle de d'Alembert, le rayon de convergence est \\( R = 1 \\).</p>"
        },
        {
          "question": "<strong>2.3 (3 pts) :</strong> En utilisant le produit de Cauchy, déterminer le développement en série entière de \\( f(x) = e^x \\ln(1+x) \\) pour \\( x \\in ]-1, 1[ \\).",
          "reponse": "<p>Le produit de Cauchy des deux séries donne :</p><div class='math-block'><div class='math'>$$ e^x \\ln(1+x) = \\left( \\sum_{n=0}^{+\\infty} \\frac{x^n}{n!} \\right) \\left( \\sum_{n=1}^{+\\infty} \\frac{(-1)^{n+1} x^n}{n} \\right) = \\sum_{n=1}^{+\\infty} c_n x^n $$</div></div><p>où \\( c_n = \\sum_{k=1}^{n} \\frac{(-1)^{k+1}}{k} \\cdot \\frac{1}{(n-k)!} \\).</p><p>Le rayon de convergence du produit est au moins le minimum des rayons, donc \\( R \\ge 1 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Série de Fourier",
      "points": "7 pts",
      "enonce": "<p>Soit \\( f \\) la fonction \\( 2\\pi \\)-périodique définie sur \\( [-\\pi, \\pi] \\) par \\( f(x) = |x| \\).</p>",
      "questions": [
        {
          "question": "<strong>3.1 (2 pts) :</strong> Étudier la parité de \\( f \\) et en déduire la forme de sa série de Fourier.",
          "reponse": "<p>La fonction \\( f(x) = |x| \\) est paire car \\( f(-x) = |-x| = |x| = f(x) \\).</p><p>Sa série de Fourier ne contient donc que des termes en cosinus :</p><div class='math-block'><div class='math'>$$ f(x) \\sim \\frac{a_0}{2} + \\sum_{n=1}^{+\\infty} a_n \\cos(nx) $$</div></div>"
        },
        {
          "question": "<strong>3.2 (3 pts) :</strong> Calculer les coefficients de Fourier \\( a_n \\) pour \\( n \\ge 0 \\).",
          "reponse": "<p>Pour \\( n = 0 \\) :</p><div class='math-block'><div class='math'>$$ a_0 = \\frac{1}{\\pi} \\int_{-\\pi}^{\\pi} |x| \\, dx = \\frac{2}{\\pi} \\int_0^{\\pi} x \\, dx = \\frac{2}{\\pi} \\times \\frac{\\pi^2}{2} = \\pi $$</div></div><p>Pour \\( n \\ge 1 \\) :</p><div class='math-block'><div class='math'>$$ a_n = \\frac{1}{\\pi} \\int_{-\\pi}^{\\pi} |x| \\cos(nx) \\, dx = \\frac{2}{\\pi} \\int_0^{\\pi} x \\cos(nx) \\, dx $$</div></div><p>Par intégration par parties :</p><div class='math-block'><div class='math'>$$ \\int_0^{\\pi} x \\cos(nx) \\, dx = \\left[ \\frac{x \\sin(nx)}{n} \\right]_0^{\\pi} - \\int_0^{\\pi} \\frac{\\sin(nx)}{n} \\, dx = \\frac{1 - (-1)^n}{n^2} $$</div></div><p>Donc \\( a_n = \\frac{2}{\\pi} \\times \\frac{1 - (-1)^n}{n^2} = \\frac{4}{\\pi n^2} \\) si \\( n \\) est impair, et \\( a_n = 0 \\) si \\( n \\) est pair.</p>"
        },
        {
          "question": "<strong>3.3 (2 pts) :</strong> Écrire la série de Fourier de \\( f \\) et donner sa valeur en \\( x = 0 \\) et en \\( x = \\pi \\).",
          "reponse": "<p>La série de Fourier est :</p><div class='math-block'><div class='math'>$$ f(x) \\sim \\frac{\\pi}{2} + \\frac{4}{\\pi} \\sum_{k=0}^{+\\infty} \\frac{\\cos((2k+1)x)}{(2k+1)^2} $$</div></div><p>En \\( x = 0 \\), \\( f(0) = 0 \\) et la série donne :</p><div class='math-block'><div class='math'>$$ 0 = \\frac{\\pi}{2} + \\frac{4}{\\pi} \\sum_{k=0}^{+\\infty} \\frac{1}{(2k+1)^2} $$</div></div><p>En \\( x = \\pi \\), \\( f(\\pi) = \\pi \\) et la série donne :</p><div class='math-block'><div class='math'>$$ \\pi = \\frac{\\pi}{2} + \\frac{4}{\\pi} \\sum_{k=0}^{+\\infty} \\frac{(-1)^k}{(2k+1)^2} $$</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
