<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse Réelle et Fonctionnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°1 - Semestre 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Suites et Séries de Fonctions",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>L'objectif de cet exercice est de tester votre compréhension des différents modes de convergence des suites et séries de fonctions, un concept fondamental pour l'approximation de fonctions en Data Science.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Définitions (1.5 pts)</strong></p><p>1.a) Donner la définition de la convergence simple d'une suite de fonctions \\((f_n)\\) vers une fonction \\(f\\) sur un intervalle \\(I\\).</p><p>1.b) Donner la définition de la convergence uniforme d'une suite de fonctions \\((f_n)\\) vers une fonction \\(f\\) sur un intervalle \\(I\\).</p><p>1.c) Quelle est la relation entre la convergence uniforme et la convergence simple ?</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Convergence simple :</strong> La suite \\((f_n)\\) converge simplement vers \\(f\\) sur \\(I\\) si, pour tout \\(x \\in I\\), la suite numérique \\((f_n(x))\\) converge vers \\(f(x)\\). Autrement dit : \\(\\forall x \\in I, \\forall \\varepsilon > 0, \\exists N(x, \\varepsilon) \\in \\mathbb{N}, \\forall n \\ge N, |f_n(x) - f(x)| < \\varepsilon\\).</p><p><strong>1.b) Convergence uniforme :</strong> La suite \\((f_n)\\) converge uniformément vers \\(f\\) sur \\(I\\) si : \\(\\forall \\varepsilon > 0, \\exists N(\\varepsilon) \\in \\mathbb{N}, \\forall n \\ge N, \\forall x \\in I, |f_n(x) - f(x)| < \\varepsilon\\).</p><p><strong>1.c) Relation :</strong> La convergence uniforme implique la convergence simple. La réciproque est fausse.</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Norme uniforme (1.5 pts)</strong></p><p>Soit \\(f_n(x) = \\frac{x}{n}\\) pour \\(x \\in [0, 1]\\).</p><p>2.a) Montrer que \\((f_n)\\) converge simplement vers la fonction nulle sur \\([0, 1]\\).</p><p>2.b) La convergence est-elle uniforme ? Justifier en utilisant la norme uniforme.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>2.a) Convergence simple :</strong> Pour tout \\(x \\in [0, 1]\\), \\(\\lim_{n \\to +\\infty} \\frac{x}{n} = 0\\). Donc \\((f_n)\\) converge simplement vers la fonction nulle.</p><p><strong>2.b) Convergence uniforme :</strong> La norme uniforme est \\(\\|f_n - 0\\|_\\infty = \\sup_{x \\in [0,1]} |\\frac{x}{n}| = \\frac{1}{n}\\). Comme \\(\\lim_{n \\to +\\infty} \\frac{1}{n} = 0\\), la convergence est uniforme.</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>3. Critère de Weierstrass (2 pts)</strong></p><p>On considère la série de fonctions \\(\\sum_{n=1}^{+\\infty} \\frac{\\sin(nx)}{n^2}\\).</p><p>3.a) Montrer que cette série converge normalement sur \\(\\mathbb{R}\\).</p><p>3.b) En déduire que la somme de la série est une fonction continue sur \\(\\mathbb{R}\\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>3.a) Convergence normale :</strong> On a \\(|\\frac{\\sin(nx)}{n^2}| \\le \\frac{1}{n^2}\\) pour tout \\(x \\in \\mathbb{R}\\). La série numérique \\(\\sum \\frac{1}{n^2}\\) converge (série de Riemann avec \\(p=2 > 1\\)). Par le critère de Weierstrass, la série de fonctions converge normalement sur \\(\\mathbb{R}\\).</p><p><strong>3.b) Continuité :</strong> La convergence normale implique la convergence uniforme. Chaque terme \\(\\frac{\\sin(nx)}{n^2}\\) est une fonction continue. La limite uniforme d'une suite de fonctions continues est continue. Donc la somme de la série est continue sur \\(\\mathbb{R}\\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Séries Entières",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>Les séries entières sont des outils essentiels pour l'approximation de fonctions en Data Science. Cet exercice vous permettra de maîtriser les concepts de rayon de convergence et de développement en série entière.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Rayon de convergence (2 pts)</strong></p><p>Déterminer le rayon de convergence \\(R\\) et l'intervalle de convergence des séries entières suivantes :</p><p>1.a) \\(\\sum_{n=0}^{+\\infty} n! x^n\\)</p><p>1.b) \\(\\sum_{n=1}^{+\\infty} \\frac{x^n}{n}\\)</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Série \\(\\sum n! x^n\\) :</strong> En utilisant la règle de d'Alembert : \\(\\left| \\frac{a_{n+1}}{a_n} \\right| = \\frac{(n+1)!}{n!} = n+1 \\to +\\infty\\). Donc \\(R = 0\\). La série ne converge qu'en \\(x = 0\\).</p><p><strong>1.b) Série \\(\\sum \\frac{x^n}{n}\\) :</strong> On a \\(a_n = \\frac{1}{n}\\). \\(\\left| \\frac{a_{n+1}}{a_n} \\right| = \\frac{n}{n+1} \\to 1\\). Donc \\(R = 1\\).</p><p>En \\(x = 1\\) : \\(\\sum \\frac{1}{n}\\) diverge.</p><p>En \\(x = -1\\) : \\(\\sum \\frac{(-1)^n}{n}\\) converge (série alternée).</p><p>L'intervalle de convergence est \\([-1, 1[\\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Développement en série entière (1.5 pts)</strong></p><p>Développer la fonction \\(f(x) = \\ln(1+x)\\) en série entière au voisinage de 0. Donner le rayon de convergence du développement.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p>On a \\(\\ln(1+x) = \\sum_{n=1}^{+\\infty} (-1)^{n+1} \\frac{x^n}{n}\\) pour \\(-1 < x \\le 1\\).</p><p>Le rayon de convergence est \\(R = 1\\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>3. Application à l'optimisation (1.5 pts)</strong></p><p>En utilisant le développement de \\(\\sin(x)\\) en série entière, donner une approximation de \\(\\sin(0.1)\\) à \\(10^{-6}\\) près. Justifier le nombre de termes utilisés.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p>Le développement est \\(\\sin(x) = \\sum_{n=0}^{+\\infty} (-1)^n \\frac{x^{2n+1}}{(2n+1)!}\\).</p><p>Pour \\(x = 0.1\\), on a une série alternée. L'erreur est inférieure au premier terme négligé.</p><p>Termes successifs :</p><p>\\(n=0 : 0.1\\)</p><p>\\(n=1 : -\\frac{0.1^3}{6} \\approx -0.000166667\\)</p><p>\\(n=2 : \\frac{0.1^5}{120} \\approx 8.33 \\times 10^{-8}\\)</p><p>\\(n=3 : -\\frac{0.1^7}{5040} \\approx -1.98 \\times 10^{-11}\\)</p><p>L'erreur après le terme \\(n=2\\) est \\(< 10^{-11} < 10^{-6}\\).</p><p>Donc \\(\\sin(0.1) \\approx 0.1 - 0.000166667 + 0.0000000833 \\approx 0.0998334167\\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Intégrales Impropres",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>Les intégrales impropres sont essentielles en Data Science, notamment pour définir les lois de probabilité continues. Cet exercice vous permettra de maîtriser les critères de convergence.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Définitions (1.5 pts)</strong></p><p>1.a) Définir une intégrale impropre sur un intervalle non borné.</p><p>1.b) Définir une intégrale impropre en un point singulier.</p><p>1.c) Quelle est la différence entre convergence absolue et semi-convergence ?</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Intervalle non borné :</strong> \\(\\int_a^{+\\infty} f(x) dx = \\lim_{t \\to +\\infty} \\int_a^t f(x) dx\\). Elle converge si la limite existe et est finie.</p><p><strong>1.b) Point singulier :</strong> Si \\(f\\) est non bornée en \\(c \\in [a,b]\\), \\(\\int_a^b f(x) dx = \\lim_{\\varepsilon \\to 0^+} \\int_a^{c-\\varepsilon} f(x) dx + \\lim_{\\varepsilon \\to 0^+} \\int_{c+\\varepsilon}^b f(x) dx\\), sous réserve de convergence.</p><p><strong>1.c) Différence :</strong> Convergence absolue si \\(\\int |f| dx\\) converge. Semi-convergence si \\(\\int f dx\\) converge mais \\(\\int |f| dx\\) diverge.</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Étude de convergence (2.5 pts)</strong></p><p>Étudier la convergence des intégrales suivantes :</p><p>2.a) \\(\\int_1^{+\\infty} \\frac{dx}{x^2 + 1}\\)</p><p>2.b) \\(\\int_0^1 \\frac{dx}{\\sqrt{x}}\\)</p><p>2.c) \\(\\int_1^{+\\infty} \\frac{\\sin(x)}{x} dx\\)</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>2.a) \\(\\int_1^{+\\infty} \\frac{dx}{x^2+1}\\) :</strong> \\(\\frac{1}{x^2+1} \\sim \\frac{1}{x^2}\\) en \\(+\\infty\\). \\(\\int_1^{+\\infty} \\frac{dx}{x^2}\\) converge. Donc l'intégrale converge.</p><p><strong>2.b) \\(\\int_0^1 \\frac{dx}{\\sqrt{x}}\\) :</strong> En 0, \\(\\frac{1}{\\sqrt{x}} \\sim \\frac{1}{x^{1/2}}\\). \\(\\int_0^1 \\frac{dx}{x^{1/2}}\\) converge (critère de Riemann, \\(p = 1/2 < 1\\)). Donc l'intégrale converge.</p><p><strong>2.c) \\(\\int_1^{+\\infty} \\frac{\\sin(x)}{x} dx\\) :</strong> L'intégrale est semi-convergente. Elle converge par le critère d'Abel, mais \\(\\int_1^{+\\infty} |\\frac{\\sin(x)}{x}| dx\\) diverge.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème - Régression et Approximation",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>Cet exercice illustre l'application des concepts d'analyse fonctionnelle à un problème concret de Data Science : la régression linéaire dans un espace de Hilbert.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Modélisation fonctionnelle (1.5 pts)</strong></p><p>On considère l'espace de Hilbert \\(\\mathcal{H} = \\mathbb{R}^2\\) muni du produit scalaire usuel. Soit \\(\\mathcal{M} = \\text{Vect}(u)\\) où \\(u = (1, 2)^T\\).</p><p>Déterminer la projection orthogonale de \\(y = (1, 1)^T\\) sur \\(\\mathcal{M}\\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p>La projection est \\(\\hat{y} = \\frac{\\langle y, u \\rangle}{\\langle u, u \\rangle} u\\).</p><p>\\(\\langle y, u \\rangle = 1\\times1 + 1\\times2 = 3\\).</p><p>\\(\\langle u, u \\rangle = 1^2 + 2^2 = 5\\).</p><p>\\(\\hat{y} = \\frac{3}{5} (1, 2) = (0.6, 1.2)\\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Moindres carrés (2 pts)</strong></p><p>On considère le modèle de régression linéaire : \\(y = X\\beta + \\varepsilon\\), avec \\(X = \\begin{pmatrix} 1 & 1 \\\\ 1 & 2 \\\\ 1 & 3 \\end{pmatrix}\\), \\(y = \\begin{pmatrix} 2 \\\\ 3 \\\\ 4 \\end{pmatrix}\\).</p><p>Résoudre les équations normales pour trouver \\(\\hat{\\beta}\\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p>Les équations normales sont : \\(X^T X \\hat{\\beta} = X^T y\\).</p><p>\\(X^T X = \\begin{pmatrix} 1 & 1 & 1 \\\\ 1 & 2 & 3 \\end{pmatrix} \\begin{pmatrix} 1 & 1 \\\\ 1 & 2 \\\\ 1 & 3 \\end{pmatrix} = \\begin{pmatrix} 3 & 6 \\\\ 6 & 14 \\end{pmatrix}\\).</p><p>\\(X^T y = \\begin{pmatrix} 1 & 1 & 1 \\\\ 1 & 2 & 3 \\end{pmatrix} \\begin{pmatrix} 2 \\\\ 3 \\\\ 4 \\end{pmatrix} = \\begin{pmatrix} 9 \\\\ 20 \\end{pmatrix}\\).</p><p>On résout : \\(\\begin{cases} 3\\beta_1 + 6\\beta_2 = 9 \\\\ 6\\beta_1 + 14\\beta_2 = 20 \\end{cases}\\).</p><p>De la première équation : \\(\\beta_1 = 3 - 2\\beta_2\\).</p><p>En substituant : \\(6(3-2\\beta_2) + 14\\beta_2 = 20 \\Rightarrow 18 - 12\\beta_2 + 14\\beta_2 = 20 \\Rightarrow 2\\beta_2 = 2 \\Rightarrow \\beta_2 = 1\\).</p><p>Donc \\(\\beta_1 = 1\\). \\(\\hat{\\beta} = (1, 1)^T\\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>3. Régularisation (2.5 pts)</strong></p><p>On ajoute un terme de régularisation \\(\\lambda \\|\\beta\\|^2\\) au problème. Le nouveau problème est : \\(\\min_\\beta \\|y - X\\beta\\|^2 + \\lambda \\|\\beta\\|^2\\).</p><p>3.a) Montrer que la solution est \\(\\hat{\\beta}_\\lambda = (X^T X + \\lambda I)^{-1} X^T y\\).</p><p>3.b) Pour \\(\\lambda = 1\\), calculer \\(\\hat{\\beta}_\\lambda\\) avec les données précédentes.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>3.a) Dérivation :</strong> On dérive \\(J(\\beta) = \\|y - X\\beta\\|^2 + \\lambda \\|\\beta\\|^2\\) par rapport à \\(\\beta\\).</p><p>\\(\\frac{\\partial J}{\\partial \\beta} = -2X^T y + 2X^T X \\beta + 2\\lambda \\beta = 0\\).</p><p>Donc \\((X^T X + \\lambda I)\\beta = X^T y\\), soit \\(\\hat{\\beta}_\\lambda = (X^T X + \\lambda I)^{-1} X^T y\\).</p><p><strong>3.b) Pour \\(\\lambda = 1\\) :</strong></p><p>\\(X^T X + I = \\begin{pmatrix} 4 & 6 \\\\ 6 & 15 \\end{pmatrix}\\).</p><p>Le déterminant est \\(4\\times15 - 6\\times6 = 60 - 36 = 24\\).</p><p>L'inverse est \\(\\frac{1}{24} \\begin{pmatrix} 15 & -6 \\\\ -6 & 4 \\end{pmatrix}\\).</p><p>\\(\\hat{\\beta}_\\lambda = \\frac{1}{24} \\begin{pmatrix} 15 & -6 \\\\ -6 & 4 \\end{pmatrix} \\begin{pmatrix} 9 \\\\ 20 \\end{pmatrix} = \\frac{1}{24} \\begin{pmatrix} 135 - 120 \\\\ -54 + 80 \\end{pmatrix} = \\frac{1}{24} \\begin{pmatrix} 15 \\\\ 26 \\end{pmatrix} = \\begin{pmatrix} 0.625 \\\\ 1.0833 \\end{pmatrix}\\).</p></div>"
        }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
