<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse Réelle et Fonctionnelle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Matrice de covariance et Analyse en Composantes Principales (ACP)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p>Un data scientist analyse un jeu de données contenant deux variables \(X_1\) et \(X_2\). La matrice de covariance empirique est donnée par :</p><div class='math-block'><div class='math'>$$ \\Sigma = \\begin{pmatrix} 5 & 2 \\\\ 2 & 2 \\end{pmatrix} $$</div></div><p>Cette matrice est symétrique réelle, donc diagonalisable orthogonalement.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1.1</strong> Calculez les valeurs propres de la matrice de covariance \(\\Sigma\).</p><p><span style='font-style: italic;'>Rappel : Le polynôme caractéristique est \(\\det(\\Sigma - \\lambda I) = 0\).</span></p></div>",
          "reponse": "<div><p>Le polynôme caractéristique est :</p><div class='math-block'><div class='math'>$$ \\det(\\Sigma - \\lambda I) = \\begin{vmatrix} 5-\\lambda & 2 \\\\ 2 & 2-\\lambda \\end{vmatrix} = (5-\\lambda)(2-\\lambda) - 4 $$</div></div><div class='math-block'><div class='math'>$$ = 10 - 7\\lambda + \\lambda^2 - 4 = \\lambda^2 - 7\\lambda + 6 = (\\lambda - 1)(\\lambda - 6) $$</div></div><p>Les valeurs propres sont donc \(\\lambda_1 = 6\) et \(\\lambda_2 = 1\).</p><p>La variance totale est \(5 + 2 = 7\), et les valeurs propres donnent la variance expliquée par chaque composante principale.</p></div>"
        },
        {
          "question": "<div><p><strong>1.2</strong> Déterminez les vecteurs propres associés à chaque valeur propre.</p></div>",
          "reponse": "<div><p><strong>Pour \(\\lambda_1 = 6\) :</strong></p><p>Résolvons \((\\Sigma - 6I)v = 0\) :</p><div class='math-block'><div class='math'>$$ \\begin{pmatrix} -1 & 2 \\\\ 2 & -4 \\end{pmatrix} \\begin{pmatrix} v_1 \\\\ v_2 \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} $$</div></div><p>La première équation donne \(-v_1 + 2v_2 = 0 \\Rightarrow v_1 = 2v_2\).</p><p>Un vecteur propre est \(v_1 = \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix}\).</p><p><strong>Pour \(\\lambda_2 = 1\) :</strong></p><p>Résolvons \((\\Sigma - 1I)w = 0\) :</p><div class='math-block'><div class='math'>$$ \\begin{pmatrix} 4 & 2 \\\\ 2 & 1 \\end{pmatrix} \\begin{pmatrix} w_1 \\\\ w_2 \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 0 \\end{pmatrix} $$</div></div><p>La première équation donne \(4w_1 + 2w_2 = 0 \\Rightarrow w_2 = -2w_1\).</p><p>Un vecteur propre est \(w_1 = \\begin{pmatrix} 1 \\\\ -2 \\end{pmatrix}\).</p></div>"
        },
        {
          "question": "<div><p><strong>1.3</strong> Normalisez les vecteurs propres pour obtenir une base orthonormale et donnez la matrice de passage \(Q\).</p></div>",
          "reponse": "<div><p>Le vecteur \(v_1 = (2, 1)^T\) a pour norme \(\\sqrt{4 + 1} = \\sqrt{5}\).</p><p>Le vecteur \(w_1 = (1, -2)^T\) a pour norme \(\\sqrt{1 + 4} = \\sqrt{5}\).</p><p>Les vecteurs normalisés sont :</p><div class='math-block'><div class='math'>$$ q_1 = \\dfrac{1}{\\sqrt{5}} \\begin{pmatrix} 2 \\\\ 1 \\end{pmatrix}, \\quad q_2 = \\dfrac{1}{\\sqrt{5}} \\begin{pmatrix} 1 \\\\ -2 \\end{pmatrix} $$</div></div><p>La matrice de passage orthogonale est :</p><div class='math-block'><div class='math'>$$ Q = \\begin{pmatrix} 2/\\sqrt{5} & 1/\\sqrt{5} \\\\ 1/\\sqrt{5} & -2/\\sqrt{5} \\end{pmatrix} $$</div></div><p>On vérifie que \(Q^T Q = I\) et \(\\Sigma = Q \\Lambda Q^T\) avec \(\\Lambda = \\text{diag}(6, 1)\).</p></div>"
        },
        {
          "question": "<div><p><strong>1.4</strong> Interprétez le résultat. Quelle est la première composante principale ? Quel pourcentage de la variance totale explique-t-elle ?</p></div>",
          "reponse": "<div><p>La première composante principale est la direction \(q_1 = \\dfrac{1}{\\sqrt{5}}(2, 1)^T\).</p><p>La variance expliquée par cette composante est \(\\lambda_1 = 6\), soit un pourcentage :</p><div class='math-block'><div class='math'>$$ \\dfrac{6}{6 + 1} \\times 100 = \\dfrac{6}{7} \\times 100 \\approx 85.71\\% $$</div></div><p>La première composante explique donc environ 85,7% de la variance totale. Cela signifie que la plupart de l'information est contenue dans la direction \(q_1\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse Spectrale d'une Série Temporelle",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p>Un analyste financier étudie une série temporelle de rendements \(R_t\) sur une période de 100 jours. Il suspecte la présence d'un cycle de 25 jours (périodicité). Pour confirmer son intuition, il utilise l'analyse spectrale.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>2.1</strong> Quelle fréquence (en cycles par jour) correspond à un cycle de 25 jours ?</p></div>",
          "reponse": "<div><p>La fréquence est \(f = \\dfrac{1}{25} = 0.04\) cycles par jour.</p><p>La pulsation correspondante est \(\\omega = 2\\pi f = \\dfrac{2\\pi}{25} \\approx 0.2513\) rad/jour.</p><p>Un spectre de puissance présentera un pic à cette fréquence si le cycle existe effectivement.</p></div>"
        },
        {
          "question": "<div><p><strong>2.2</strong> Expliquez comment l'analyste pourrait vérifier la présence de ce cycle à l'aide du periodogramme.</p></div>",
          "reponse": "<div><p>Le <strong>periodogramme</strong> est une estimation du spectre de puissance d'un signal. Il est calculé comme le carré du module de la Transformée de Fourier Discrète (TFD) de la série :</p><div class='math-block'><div class='math'>$$ I(f) = \\dfrac{1}{N} \\left| \\sum_{t=1}^{N} R_t e^{-2i\\pi f t} \\right|^2 $$</div></div><p>Pour vérifier la présence du cycle, l'analyste doit :</p><ul><li>Calculer le periodogramme pour toutes les fréquences.</li><li>Identifier le pic le plus élevé dans le spectre.</li><li>Si le pic se situe autour de \(f = 0.04\), cela confirme la présence du cycle de 25 jours.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2.3</strong> L'analyste trouve un pic dans le spectre à la fréquence \(f_1 = 0.04\) et un autre à \(f_2 = 0.08\). Que peut-il en conclure ?</p></div>",
          "reponse": "<div><p>Le pic à \(f_1 = 0.04\) confirme le cycle de 25 jours.</p><p>Le pic à \(f_2 = 0.08 = 2 \\times 0.04\) correspond à la première harmonique du cycle fondamental (période de 12.5 jours).</p><p>La présence de cette harmonique indique que le cycle n'est pas purement sinusoïdal mais présente une forme d'onde plus complexe. L'analyste peut ainsi mieux comprendre la structure périodique de la série.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Décomposition en Valeurs Singulières (SVD)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p>Un data scientist travaille sur une matrice de données \(X\) de taille \(3 \\times 2\) représentant les notes de 3 étudiants à 2 épreuves. La matrice est :</p><div class='math-block'><div class='math'>$$ X = \\begin{pmatrix} 1 & 1 \\\\ 1 & 0 \\\\ 0 & 1 \\end{pmatrix} $$</div></div></div>",
      "questions": [
        {
          "question": "<div><p><strong>3.1</strong> Calculez la matrice \(X^T X\) et ses valeurs propres.</p></div>",
          "reponse": "<div><p>On a :</p><div class='math-block'><div class='math'>$$ X^T X = \\begin{pmatrix} 1 & 1 & 0 \\\\ 1 & 0 & 1 \\end{pmatrix} \\begin{pmatrix} 1 & 1 \\\\ 1 & 0 \\\\ 0 & 1 \\end{pmatrix} = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} $$</div></div><p>Le polynôme caractéristique est :</p><div class='math-block'><div class='math'>$$ \\det(\\begin{pmatrix} 2-\\lambda & 1 \\\\ 1 & 2-\\lambda \\end{pmatrix}) = (2-\\lambda)^2 - 1 = \\lambda^2 - 4\\lambda + 3 = (\\lambda - 1)(\\lambda - 3) $$</div></div><p>Les valeurs propres sont \(\\lambda_1 = 3\) et \(\\lambda_2 = 1\).</p><p>Les valeurs singulières de \(X\) sont \(\\sigma_1 = \\sqrt{3}\) et \(\\sigma_2 = 1\).</p></div>"
        },
        {
          "question": "<div><p><strong>3.2</strong> Déterminez les vecteurs propres de \(X^T X\) et la matrice \(V\).</p></div>",
          "reponse": "<div><p><strong>Pour \(\\lambda_1 = 3\) :</strong></p><p>\((X^T X - 3I)v = \\begin{pmatrix} -1 & 1 \\\\ 1 & -1 \\end{pmatrix} \\begin{pmatrix} v_1 \\\\ v_2 \\end{pmatrix} = 0 \\Rightarrow v_1 = v_2\).</p><p>Un vecteur propre normalisé est \(v_1 = \\dfrac{1}{\\sqrt{2}} \\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix}\).</p><p><strong>Pour \(\\lambda_2 = 1\) :</strong></p><p>\((X^T X - I)v = \\begin{pmatrix} 1 & 1 \\\\ 1 & 1 \\end{pmatrix} \\begin{pmatrix} v_1 \\\\ v_2 \\end{pmatrix} = 0 \\Rightarrow v_1 = -v_2\).</p><p>Un vecteur propre normalisé est \(v_2 = \\dfrac{1}{\\sqrt{2}} \\begin{pmatrix} 1 \\\\ -1 \\end{pmatrix}\).</p><p>Donc \(V = \\begin{pmatrix} 1/\\sqrt{2} & 1/\\sqrt{2} \\\\ 1/\\sqrt{2} & -1/\\sqrt{2} \\end{pmatrix}\).</p></div>"
        },
        {
          "question": "<div><p><strong>3.3</strong> Calculez la matrice \(U\) de la SVD \(X = U \\Sigma V^T\).</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
