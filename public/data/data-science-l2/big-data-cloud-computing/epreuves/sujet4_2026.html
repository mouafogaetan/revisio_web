<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Big Data et Cloud Computing - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modèles de service et de déploiement du Cloud (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 15px; border-radius: 8px; color: #1a202c;'><p><strong>Contexte :</strong> Vous êtes consultant en infrastructure cloud pour une PME camerounaise spécialisée dans la distribution de produits agricoles. L'entreprise souhaite moderniser son système d'information en migrant une partie de ses applications vers le cloud. Elle dispose actuellement :</p><ul style='color: #2d3748;'><li>D'un ERP hébergé sur un serveur physique dans leurs locaux à Douala.</li><li>D'une application de gestion de la relation client (CRM) qui nécessite une forte disponibilité et des mises à jour fréquentes.</li><li>D'un besoin de développement et de test d'une nouvelle application mobile pour ses clients.</li></ul><p>Vous devez analyser la situation et proposer des solutions adaptées.</p><div style='background-color: #e2e8f0; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Rappel :</strong> Les modèles de service cloud sont :</p><ul><li><strong>IaaS</strong> (Infrastructure as a Service) : fournit des ressources informatiques virtualisées (serveurs, stockage, réseau).</li><li><strong>PaaS</strong> (Platform as a Service) : fournit une plateforme de développement et de déploiement d'applications.</li><li><strong>SaaS</strong> (Software as a Service) : fournit des applications logicielles prêtes à l'emploi.</li></ul></div></div>",
      "questions": [
        {
          "question": "<div style='color: #1a202c;'><p><strong>1.1 (2 pts) :</strong> Pour chaque besoin identifié (ERP, CRM, développement de l'application mobile), proposez un modèle de service cloud approprié (IaaS, PaaS, SaaS). Justifiez clairement votre choix en expliquant les avantages pour l'entreprise.</p></div>",
          "reponse": "<div style='background-color: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #38a169; color: #22543d;'><p><strong>Réponse :</strong></p><ul><li><strong>ERP : IaaS</strong> - En migrant l'ERP existant, l'entreprise peut conserver son application actuelle et la faire tourner sur des serveurs virtuels (IaaS). Cela lui permet d'éviter de réécrire l'application tout en bénéficiant de la scalabilité et de la réduction des coûts de maintenance matérielle.</li><li><strong>CRM : SaaS</strong> - Une solution SaaS (comme Salesforce ou HubSpot) offre une disponibilité élevée, des mises à jour automatiques et une gestion simplifiée. Cela réduit la charge sur l'équipe IT, qui n'a pas à gérer l'infrastructure.</li><li><strong>Application mobile : PaaS</strong> - Le PaaS (comme Google App Engine ou AWS Elastic Beanstalk) fournit un environnement de développement et de test intégré, avec des outils de déploiement et de gestion de base de données, accélérant le cycle de développement.</li></ul></div>"
        },
        {
          "question": "<div style='color: #1a202c;'><p><strong>1.2 (2 pts) :</strong> L'entreprise hésite entre un cloud public et un cloud privé pour l'hébergement de ses données sensibles (finances, clients). Expliquez les différences entre ces deux modèles de déploiement et recommandez une solution adaptée au contexte camerounais.</p></div>",
          "reponse": "<div style='background-color: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #38a169; color: #22543d;'><p><strong>Réponse :</strong></p><ul><li><strong>Cloud public :</strong> Les ressources sont partagées entre plusieurs clients et gérées par un fournisseur tiers (AWS, GCP, Azure). Il offre une grande scalabilité et des coûts réduits (paiement à l'usage).</li><li><strong>Cloud privé :</strong> L'infrastructure est dédiée à une seule organisation (hébergée sur site ou par un fournisseur). Il offre un meilleur contrôle et une sécurité renforcée, mais est plus coûteux et moins scalable.</li></ul><p><strong>Recommandation :</strong> Une solution <strong>cloud hybride</strong> est idéale. Les données sensibles (finances, RH) peuvent être hébergées sur un cloud privé pour des raisons de conformité et de sécurité, tandis que les applications moins critiques et les environnements de test peuvent utiliser le cloud public. Cette approche offre un bon compromis entre sécurité, coût et flexibilité.</p><p>Au Cameroun, où la connectivité internet peut parfois être instable, le cloud hybride permet également de maintenir des applications critiques en local (en cas de coupure) tout en profitant des avantages du cloud public.</p></div>"
        },
        {
          "question": "<div style='color: #1a202c;'><p><strong>1.3 (1 pt) :</strong> Citer et expliquer brièvement <strong>deux</strong> avantages du Cloud Computing qui répondent aux besoins de cette PME.</p></div>",
          "reponse": "<div style='background-color: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #38a169; color: #22543d;'><p><strong>Réponse :</strong></p><ul><li><strong>Élasticité et scalabilité :</strong> La PME peut ajuster ses ressources (stockage, calcul) en fonction de ses besoins, par exemple pendant les périodes de forte activité (récoltes, fêtes). Elle paie uniquement pour ce qu'elle consomme.</li><li><strong>Réduction des coûts :</strong> La PME évite les investissements initiaux en matériel (serveurs, climatisation) et réduit les coûts de maintenance et d'électricité (notamment importants au Cameroun où l'électricité peut être coûteuse).</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Data Lake vs Data Warehouse (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 15px; border-radius: 8px; color: #1a202c;'><p><strong>Contexte :</strong> Une entreprise de télécommunications au Cameroun collecte quotidiennement des données massives provenant de ses tours de téléphonie mobile (logs d'appels, données de géolocalisation, consommation internet). Elle souhaite exploiter ces données pour :</p><ul><li>Analyser les zones de couverture et optimiser le réseau.</li><li>Proposer des offres personnalisées à ses clients.</li><li>Respecter les réglementations en vigueur sur la protection des données.</li></ul><p>L'entreprise hésite entre la mise en place d'un Data Lake et d'un Data Warehouse.</p></div>",
      "questions": [
        {
          "question": "<div style='color: #1a202c;'><p><strong>2.1 (2 pts) :</strong> Définissez un Data Lake et un Data Warehouse. Comparez leurs principales caractéristiques (types de données, structure, cas d'usage) en complétant le tableau ci-dessous.</p><table style='border-collapse: collapse; width: 100%; color: #1a202c;'><tr style='background-color: #e2e8f0;'><th style='border: 1px solid #a0aec0; padding: 8px;'>Caractéristique</th><th style='border: 1px solid #a0aec0; padding: 8px;'>Data Lake</th><th style='border: 1px solid #a0aec0; padding: 8px;'>Data Warehouse</th></tr><tr><td style='border: 1px solid #a0aec0; padding: 8px;'>Types de données</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td></tr><tr><td style='border: 1px solid #a0aec0; padding: 8px;'>Structure</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td></tr><tr><td style='border: 1px solid #a0aec0; padding: 8px;'>Cas d'usage principal</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td><td style='border: 1px solid #a0aec0; padding: 8px;'>[Réponse]</td></tr></table></div>",
          "reponse": "<div style='background-color: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #38a169; color: #22543d;'><table style='border-collapse: collapse; width: 100%;'><tr style='background-color: #c6f6d5;'><th style='border: 1px solid #22543d; padding: 8px;'>Caractéristique</th><th style='border: 1px solid #22543d; padding: 8px;'>Data Lake</th><th style='border: 1px solid #22543d; padding: 8px;'>Data Warehouse</th></tr><tr><td style='border: 1px solid #22543d; padding: 8px;'>Types de données</td><td style='border: 1px solid #22543d; padding: 8px;'>Structurées, semi-structurées, non-structurées (logs, JSON, images, vidéos)</td><td style='border: 1px solid #22543d; padding: 8px;'>Structurées (tables, colonnes, types définis)</td></tr><tr><td style='border: 1px solid #22543d; padding: 8px;'>Structure</td><td style='border: 1px solid #22543d; padding: 8px;'>Schéma à la lecture (les données sont stockées brutes, le schéma est défini lors de l'analyse)</td><td style='border: 1px solid #22543d; padding: 8px;'>Schéma à l'écriture (les données sont nettoyées et structurées avant le chargement)</td></tr><tr><td style='border: 1px solid #22543d; padding: 8px;'>Cas d'usage principal</td><td style='border: 1px solid #22543d; padding: 8px;'>Exploration de données, Machine Learning, Big Data (traitement massif)</td><td style='border: 1px solid #22543d; padding: 8px;'>Reporting, BI, tableaux de bord, analyses décisionnelles structurées</td></tr></table></div>"
        },
        {
          "question": "<div style='color: #1a202c;'><p><strong>2.2 (2 pts) :</strong> Pour l'entreprise de télécommunications, proposez une architecture combinant Data Lake et Data Warehouse. Justifiez votre réponse en expliquant quel service cloud serait utilisé pour chaque composant (en citant des exemples comme AWS S3, AWS Glue, Amazon Redshift, Amazon Athena).</p></div>",
          "reponse": "<div style='background-color: #f0fff4; padding: 12px; border-radius: 8px; border-left: 4px solid #38a169; color: #22543d;'><p><strong>Réponse :</strong> Une architecture <strong>Lakehouse</strong> (combinant Data Lake et Data Warehouse) est idéale.</p><ol><li><strong>Data Lake :</strong> AWS S3 stocke toutes les données brutes (logs des tours, données de géolocalisation, etc.) dans un format brut (JSON, CSV) puis transformé en colonnes (Parquet) pour optimiser les performances.</li><li><strong>ETL :</strong> AWS Glue nettoie, transforme et structure les données brutes en données prêtes pour l'analyse.</li><li><strong>Data Warehouse :</strong> Amazon Redshift (ou AWS Athena pour des requêtes ad-hoc) stocke les données structurées et agrégées pour les rapports et les tableaux de bord (exemple : évolution du trafic par zone).</li></ol><p><strong>Justification :</strong> Le Data Lake permet de stocker toutes les données (non-structurées) pour des analyses avancées (ex : prédiction des zones de congestion), tandis que le Data Warehouse (Redshift) fournit des performances rapides pour les requêtes SQL des équipes métiers.</p></div>"
        },
        {
          "question": "<div style='color: #1a202c;'><p><strong>2.3 (1 pt) :</strong> Citez deux formats de données couramment utilisés dans un Data Lake pour optimiser le stockage et les performances (en plus de JSON/CSV) et expliquez brièvement leur avantage.</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
