<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Big Data et Cloud Computing",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Services de Stockage et de Calcul AWS (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p><strong>Contexte :</strong> Vous êtes Data Engineer dans une entreprise de e-commerce. Votre équipe doit traiter des fichiers de logs (format CSV) stockés dans un bucket S3, puis charger les données nettoyées dans une base de données relationnelle. Vous devez également préparer l'infrastructure pour un futur entraînement de modèle de Machine Learning.</p><p><strong>Questions :</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Expliquez la différence entre les classes de stockage S3 'Standard' et 'Standard-IA'. Pour ce projet, justifiez le choix de la classe de stockage pour les logs (consultés quotidiennement).</p>",
          "reponse": "<p><strong>Différence :</strong> S3 Standard est conçu pour un accès fréquent avec une latence faible et une haute disponibilité. S3 Standard-IA (Infrequent Access) est adapté pour des données consultées moins souvent (ex : une fois par trimestre), avec un coût de stockage inférieur mais des frais de récupération.</p><p><strong>Justification :</strong> Pour les logs consultés quotidiennement, il est approprié d'utiliser S3 Standard. Le coût de stockage plus élevé est compensé par l'absence de frais de récupération et une performance optimale pour un accès régulier.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Décrivez comment vous utiliseriez EC2 dans ce contexte. Distinguez les rôles d'EC2 et d'AWS Lambda.</p>",
          "reponse": "<p><strong>EC2 :</strong> On peut utiliser une instance EC2 pour héberger une application de traitement de données ou un serveur de bases de données. EC2 offre un contrôle total sur le système d'exploitation et les ressources (CPU, mémoire), ce qui est utile pour des charges de travail lourdes ou nécessitant une configuration spécifique.</p><p><strong>Lambda :</strong> AWS Lambda est un service serverless. On peut l'utiliser pour exécuter des fonctions en réponse à des événements (ex : déclenchement lors de l'arrivée d'un fichier en S3). Lambda est idéal pour des tâches légères, sans gestion de serveur, et facturé à l'usage, contrairement à EC2 qui facture le temps d'instance.</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Pour le futur entraînement d'un modèle, vous envisagez d'utiliser SageMaker. Décrivez le processus de préparation des données sur S3 jusqu'au déploiement d'un endpoint.</p>",
          "reponse": "<p><strong>Processus :</strong></p><ol style='margin-left: 1.5rem;'><li><strong>Préparation des données :</strong> Les données sont nettoyées et transformées dans un notebook SageMaker.</li><li><strong>Stockage :</strong> Les données préparées sont sauvegardées dans un bucket S3.</li><li><strong>Entraînement :</strong> On lance un job d'entraînement SageMaker qui lit les données depuis S3, entraîne le modèle et sauvegarde les artefacts (le modèle) dans S3.</li><li><strong>Déploiement :</strong> On crée un endpoint SageMaker à partir de l'artefact, ce qui déploie le modèle sur une instance de calcul.</li><li><strong>Test :</strong> On envoie des requêtes HTTP POST à l'endpoint pour tester les prédictions.</li></ol>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Architecture Big Data (AWS Glue, Redshift, Athena) (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p><strong>Contexte :</strong> Une entreprise de logistique souhaite analyser ses données de traçage de véhicules (données volumineuses, semi-structurées). Vous devez proposer une architecture pour transformer et analyser ces données sur AWS.</p><p><strong>Questions :</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Proposez un pipeline de données sur AWS en utilisant les services suivants : S3, Glue, Redshift et Athena. Justifiez le rôle de chaque service.</p>",
          "reponse": "<p><strong>Pipeline :</strong></p><ol style='margin-left: 1.5rem;'><li><strong>S3 :</strong> Stockage des données brutes (Data Lake).</li><li><strong>AWS Glue :</strong> Service ETL (Extract, Transform, Load). Glue permet de lire les données brutes depuis S3, de les nettoyer, les transformer (ex : conversion en format Parquet) et les charger dans Redshift.</li><li><strong>Redshift :</strong> Data Warehouse. Stocke les données transformées dans une structure optimisée pour l'analyse (columnar). Il est utilisé pour des requêtes complexes et des analyses historiques.</li><li><strong>Athena :</strong> Service d'interrogation interactive. Permet d'exécuter des requêtes SQL directement sur les données stockées dans S3 sans les charger dans Redshift. Idéal pour l'exploration et l'analyse ad-hoc.</li></ol>"
        },
        {
          "question": "<p><strong>2.2</strong> Expliquez pourquoi AWS Glue est un service pertinent pour les tâches ETL dans ce pipeline, en mentionnant sa nature serverless.</p>",
          "reponse": "<p>AWS Glue est un service ETL serverless, ce qui signifie qu'il n'y a pas de serveurs à gérer. Il automatise la découverte, la préparation et le déplacement des données. Il peut s'adapter automatiquement à la volumétrie des données, ce qui est idéal pour des charges de travail variables. Il s'intègre nativement avec S3 et Redshift, ce qui facilite l'architecture du pipeline.</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Comparez l'utilisation de Redshift et d'Athena pour l'analyse de ces données. Dans quel cas privilégieriez-vous l'un plutôt que l'autre ?</p>",
          "reponse": "<p><strong>Redshift :</strong> Il est privilégié pour des analyses lourdes, des requêtes complexes (jointures, agrégations sur de gros volumes) et des cas où la performance constante est requise. Il est plus coûteux car il nécessite une infrastructure dédiée.</p><p><strong>Athena :</strong> Il est privilégié pour l'exploration interactive, des requêtes ponctuelles sur des données directement stockées en S3. Il est économique car on ne paie que pour les requêtes exécutées, mais les performances peuvent être moins prédictibles que Redshift.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : ETL vs ELT et Outils (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p><strong>Contexte :</strong> Vous devez mettre en place un pipeline de données pour alimenter un Data Warehouse dans le cloud.</p><p><strong>Questions :</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Distinguez les approches ETL (Extract-Transform-Load) et ELT (Extract-Load-Transform). Justifiez pourquoi ELT est devenu la norme avec les Data Warehouses cloud.</p>",
          "reponse": "<p><strong>ETL :</strong> La transformation est effectuée sur un serveur dédié avant le chargement des données dans le Data Warehouse.</p><p><strong>ELT :</strong> Les données sont chargées brutes dans le Data Warehouse, puis la transformation est effectuée à l'intérieur du Data Warehouse, en profitant de sa puissance de calcul.</p><p><strong>Justification :</strong> ELT est devenu la norme car les Data Warehouses cloud (comme Redshift, BigQuery) sont extrêmement puissants (calcul massif, élastique) et permettent des transformations à grande échelle. Le stockage est devenu bon marché, ce qui permet de conserver les données brutes. ELT offre plus de flexibilité et d'agilité pour les analystes.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Citez et comparez deux outils de ETL/ELT (Airbyte, Stitch, AWS Glue) en termes de modèle (open-source, SaaS), d'écosystème et de cas d'usage.</p>",
          "reponse": "<p><strong>Airbyte :</strong> Open-source, multi-cloud, 300+ connecteurs. Idéal pour des projets variés nécessitant une grande flexibilité et une communauté active.</p><p><strong>Stitch :</strong> SaaS payant, simple, connecteurs prêts à l'emploi pour des sources SaaS (Salesforce, Shopify). Idéal pour les équipes qui veulent se concentrer sur l'analyse et aller vite.</p><p><strong>AWS Glue :</strong> Service AWS payant, intégration native avec l'écosystème AWS, serverless. Idéal pour les entreprises déjà sur AWS qui veulent un ETL scalable et managé.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Si vous utilisez un Data Lake sur S3 et que vous souhaitez transformer les données en format columnar (ex: Parquet), quel outil serait le plus approprié ? Justifiez.</p>",
          "reponse": "<p>AWS Glue serait l'outil le plus approprié. Il s'intègre nativement avec S3, permet d'écrire des scripts de transformation en Python ou Scala, et supporte la conversion vers des formats columnar comme Parquet ou ORC, optimisant ainsi les performances et le coût de l'analyse.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Ordonnancement et Workflows (Airflow) (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p><strong>Contexte :</strong> L'entreprise souhaite automatiser son pipeline de données en utilisant Apache Airflow.</p><p><strong>Questions :</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Définissez les concepts suivants dans Apache Airflow : DAG, Tâche (Task), Opérateur (Operator).</p>",
          "reponse": "<p><strong>DAG (Directed Acyclic Graph) :</strong> C'est le workflow, une collection de tâches organisées de manière à refléter leurs relations et dépendances. Il est orienté et acyclique (pas de boucles).</p><p><strong>Tâche :</strong> C'est un nœud du DAG, représentant une unité de travail à exécuter (ex: une requête SQL, l'exécution d'un script).</p><p><strong>Opérateur :</strong> C'est une classe qui définit la logique d'une tâche spécifique (ex: BashOperator, PythonOperator, SparkSubmitOperator).</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Dans un DAG Airflow, vous devez orchestrer trois tâches : <code>load_data</code>, <code>transform_data</code>, <code>export_data</code>. <code>load_data</code> doit s'exécuter en premier. <code>transform_data</code> s'exécute après <code>load_data</code>. <code>export_data</code> s'exécute après <code>transform_data</code>. Écrivez les dépendances en utilisant la syntaxe Airflow (opérateur '>>').</p>",
          "reponse": "<p>La syntaxe pour définir les dépendances est :</p><pre style='background-color:#f4f4f4;padding:10px;border-radius:5px;'>load_data >> transform_data >> export_data</pre><p>Ou :</p><pre style='background-color:#f4f4f4;padding:10px;border-radius:5px;'>load_data.set_downstream(transform_data)<br>transform_data.set_downstream(export_data)</pre>"
        },
        {
          "question": "<p><strong>4.3</strong> Expliquez l'utilité du Scheduler et du Webserver dans l'architecture d'Airflow.</p>",
          "reponse": "<p><strong>Scheduler :</strong> Il est responsable de la planification des DAGs. Il surveille les fichiers DAG, vérifie les dépendances et les programmations, et soumet les tâches à l'Executor pour qu'elles soient exécutées par les Workers.</p><p><strong>Webserver :</strong> Il fournit l'interface utilisateur web. Elle permet de visualiser l'état d'exécution des DAGs et des tâches, consulter les logs, déclencher manuellement des DAGs, et gérer les connexions et variables.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Projet d'Entraînement et Déploiement sur SageMaker (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'><p><strong>Contexte :</strong> Vous devez développer un modèle de prédiction de demande de produits pour une entreprise de e-commerce en utilisant Amazon SageMaker. Les données d'entraînement sont stockées dans S3.</p><p><strong>Questions :</strong></p></div>",
      "questions": [
        {

        {

        {
          "question": "<p><strong>5.3</strong> Proposez deux bonnes pratiques pour optimiser les coûts sur SageMaker.</p>",
          "reponse": "<p><strong>Bonnes pratiques :</strong></p><ol style='margin-left: 1.5rem;'><li><strong>Arrêt des instances inutilisées :</strong> Arrêter les instances de notebook et de calcul lorsqu'elles ne sont pas utilisées, car elles sont facturées à l'heure.</li><li><strong>Choix du type d'instance :</strong> Choisir l'instance la plus adaptée aux besoins (ex: utiliser des instances spot pour l'entraînement si la tolérance à l'échec est acceptable). Éviter de surdimensionner les instances.</li></ol>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
