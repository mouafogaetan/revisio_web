<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Big Data et Cloud Computing - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Concepts Généraux du MLOps (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Le MLOps est une discipline émergente qui vise à appliquer les principes du DevOps au Machine Learning. Lisez attentivement les questions et répondez de manière précise.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Définissez le MLOps et expliquez son importance dans le cycle de vie d'un modèle de Machine Learning. (1.5 pt)</p>",
          "reponse": "<p>Le MLOps (Machine Learning Operations) est un ensemble de pratiques qui vise à automatiser et standardiser le cycle de vie des modèles de Machine Learning, de l'entraînement au déploiement en production, en passant par le monitoring et la maintenance. [citation:3]. Son importance est cruciale car elle permet de garantir la fiabilité, la performance et la maintenabilité des modèles, tout en réduisant les risques d'échec et en accélérant le time-to-market.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Distinguez clairement les concepts de 'Data Drift' et de 'Concept Drift' dans le contexte du monitoring des modèles. (1.5 pt)</p>",
          "reponse": "<p>Le <strong>Data Drift</strong> est la modification de la distribution des données d'entrée par rapport aux données utilisées pour l'entraînement du modèle. Cela peut dégrader les performances du modèle. Le <strong>Concept Drift</strong> est un changement dans la relation sous-jacente entre les variables d'entrée (features) et la variable cible (target) que le modèle a appris à prédire. Par exemple, si les comportements des consommateurs changent, un modèle de recommandation peut devenir obsolète.</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Citez et expliquez brièvement deux outils ou services couramment utilisés dans le MLOps pour orchestrer des pipelines de données ou entraîner des modèles. (1 pt)</p>",
          "reponse": "<p><strong>Apache Airflow :</strong> Un orchestrateur de workflows open-source qui permet de définir, planifier et surveiller des pipelines de données et de ML sous forme de DAGs (Directed Acyclic Graphs). Il est très flexible et s'intègre avec de nombreux services [citation:2][citation:3]. <strong>AWS SageMaker :</strong> Une plateforme gérée par AWS pour le Machine Learning, qui permet de préparer des données, entraîner, déployer et surveiller des modèles à grande échelle [citation:1][citation:2].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Orchestration avec Apache Airflow (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Apache Airflow est un outil puissant pour orchestrer des pipelines de données. Cet exercice se concentre sur sa mise en œuvre pour des cas concrets en entreprise.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Expliquez le concept de DAG (Directed Acyclic Graph) dans Airflow et comment il structure un workflow. (1.5 pt)</p>",
          "reponse": "<p>Un DAG (Directed Acyclic Graph) est la représentation d'un workflow dans Airflow. C'est un graphe orienté dans lequel chaque nœud est une tâche, et les arêtes définissent l'ordre d'exécution et les dépendances entre les tâches. Le caractère 'acyclique' (sans cycle) garantit qu'il n'y a pas de boucle de dépendances, ce qui permet une exécution déterministe.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Pourquoi Airflow est-il un outil privilégié pour les pipelines de Machine Learning (MLOps) ? (1.5 pt)</p>",
          "reponse": "<p>Airflow est privilégié en MLOps pour plusieurs raisons [citation:2][citation:3] : <ul><li><strong>Flexibilité :</strong> Il peut orchestrer à la fois des tâches de Data Engineering (ETL) et des tâches de ML (entraînement, évaluation) dans un seul DAG.</li><li><strong>Intégration :</strong> Il s'intègre avec de nombreuses plateformes ML comme AWS SageMaker, Databricks, etc. via des opérateurs.</li><li><strong>Observabilité :</strong> Son interface web permet de monitorer l'exécution des pipelines en temps réel et de debugger facilement.</li></ul></p>"
        },
        {
          "question": "<p><strong>2.3</strong> Décrivez comment Airflow peut être intégré avec AWS SageMaker pour créer un pipeline de ML. (1.5 pt)</p>",
          "reponse": "<p>Airflow s'intègre avec AWS SageMaker via des opérateurs spécifiques, comme le <code>SageMakerTrainingOperator</code> ou <code>SageMakerModelOperator</code> [citation:3]. Cela permet, au sein d'un DAG, de :<ul><li>Préparer les données dans S3.</li><li>Lancer un job d'entraînement sur SageMaker.</li><li>Déployer automatiquement le modèle entraîné en tant qu'endpoint.</li><li>Exécuter des tâches de monitoring post-déploiement.</li></ul> Cette intégration permet d'automatiser l'ensemble du cycle de vie du modèle.</p>"
        },
        {
          "question": "<p><strong>2.4</strong> Une entreprise souhaite automatiser le réentraînement de son modèle de prédiction des prix de l'immobilier. Proposez un workflow Airflow (sous forme d'étapes) qui décrit le pipeline. (2.5 pts)</p>",
          "reponse": "<p>Le pipeline pourrait être : <br/><br/><strong>1. Déclenchement :</strong> Planifié quotidiennement ou déclenché par un événement (ex: nouvelle donnée disponible). <br/><strong>2. Extraction :</strong> Utiliser un <code>PythonOperator</code> ou <code>S3Hook</code> pour extraire les nouvelles données de transactions immobilières depuis S3 ou une API. <br/><strong>3. Prétraitement :</strong> Un <code>PythonOperator</code> nettoie, transforme et sépare les données en ensembles d'entraînement et de test. <br/><strong>4. Entraînement :</strong> Lancer un job d'entraînement sur SageMaker avec <code>SageMakerTrainingOperator</code>. <br/><strong>5. Évaluation :</strong> Un <code>PythonOperator</code> évalue les performances du nouveau modèle sur les données de test. <br/><strong>6. Enregistrement :</strong> Si les performances sont satisfaisantes, enregistrer le modèle dans le Model Registry de SageMaker. <br/><strong>7. Déploiement :</strong> Utiliser <code>SageMakerModelOperator</code> pour déployer la nouvelle version du modèle en remplacement de l'ancienne. <br/><strong>8. Notification :</strong> Envoyer un email avec <code>EmailOperator</code> pour informer l'équipe du succès du réentraînement.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Utilisation d'AWS SageMaker (8 pts)",
      "points": "8 pts",
      "enonce": "<p>AWS SageMaker est une plateforme de Machine Learning entièrement gérée. Les questions suivantes portent sur son utilisation dans un contexte professionnel.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Quels sont les avantages principaux d'utiliser SageMaker plutôt que de gérer votre propre infrastructure ML ? (1.5 pt)</p>",
          "reponse": "<p>SageMaker offre des avantages majeurs [citation:2] :<ul><li><strong>Infrastructure gérée :</strong> Vous n'avez pas à configurer et gérer des serveurs pour l'entraînement ou l'inférence. </li><li><strong>Intégration native :</strong> Il s'intègre parfaitement avec d'autres services AWS comme S3 pour le stockage, VPC pour la sécurité, etc.</li><li><strong>Fonctionnalités avancées :</strong> Il propose des algorithmes intégrés, de l'optimisation hyperparamétrique automatique, et des pipelines de MLOps (SageMaker Pipelines).</li><li><strong>Scalabilité :</strong> Il peut s'adapter automatiquement aux besoins de calcul, que ce soit pour l'entraînement ou l'inférence.</li></ul></p>"
        },
        {
          "question": "<p><strong>3.2</strong> Citez les trois rôles ou composants principaux de l'infrastructure d'entraînement de SageMaker et expliquez brièvement leur fonction. (1.5 pt)</p>",
          "reponse": "<p>Les trois rôles principaux sont : <br/><strong>1. SageMaker Training Job :</strong> Le job qui exécute votre code d'entraînement sur une instance de calcul. <br/><strong>2. SageMaker Model :</strong> Un artefact qui contient le modèle entraîné (fichier de poids) et le code d'inférence. Il est créé à partir de l'output d'un Training Job. <br/><strong>3. SageMaker Endpoint :</strong> Le service qui déploie votre modèle pour l'inférence en temps réel. Il crée une ou plusieurs instances qui hébergent le modèle et exposent une API. <br/></p>"
        },
        {
          "question": "<p><strong>3.3</strong> Décrivez les étapes clés pour déployer un modèle entraîné sur SageMaker en tant qu'endpoint. (2 pts)</p>",
          "reponse": "<p>Les étapes sont les suivantes : <br/><strong>1. Création du modèle :</strong> Utiliser le SDK SageMaker pour créer un objet <code>Model</code> en spécifiant l'emplacement de l'artefact du modèle entraîné (dans S3) et l'image Docker contenant le code d'inférence. <br/><strong>2. Configuration de l'Endpoint :</strong> Choisir le type d'instance pour l'inférence (ex: ml.m5.large). <br/><strong>3. Déploiement :</strong> Appeler la méthode <code>model.deploy()</code> pour créer un <code>Endpoint</code>. Cela lance la création des instances de calcul et le déploiement du modèle. <br/><strong>4. Test :</strong> Utiliser le client <code>sagemaker-runtime</code> pour envoyer des requêtes de test à l'endpoint via l'API <code>invoke_endpoint</code>.</p>"
        },
        {
          "question": "<p><strong>3.4</strong> Un Data Scientist souhaite itérer rapidement sur son modèle et utilise un Notebook SageMaker. Décrivez deux fonctionnalités de SageMaker qui facilitent ce cycle d'itération. (1 pt)</p>",
          "reponse": "<p>Deux fonctionnalités clés sont : <br/><strong>1. Les Notebooks intégrés :</strong> SageMaker fournit des Jupyter Notebooks gérés qui sont pré-configurés avec les bibliothèques de ML et les accès aux services AWS, permettant de coder et de tester rapidement. <br/><strong>2. Les canaux de données :</strong> SageMaker permet de charger facilement des données depuis S3 dans les notebooks pour l'exploration et l'entraînement de petits modèles. <br/></p>"
        },
        {
          "question": "<p><strong>3.5</strong> Qu'est-ce que le SageMaker Model Registry et quel est son rôle dans un processus MLOps ? (1 pt)</p>",
          "reponse": "<p>Le <strong>SageMaker Model Registry</strong> est un référentiel centralisé qui permet de gérer les versions des modèles [citation:6]. Il joue un rôle crucial en MLOps en permettant :<ul><li>De stocker et de versionner les différents modèles entraînés.</li><li>D'assigner des statuts (ex: 'Approved', 'Pending', 'Rejected') pour contrôler les déploiements.</li><li>D'assurer la traçabilité et la gouvernance des modèles en production.</li></ul></p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
