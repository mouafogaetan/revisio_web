<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Big Data et Cloud Computing - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Concepts du Cloud et des Données (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Cet exercice porte sur les concepts fondamentaux du Cloud Computing, du Big Data et des architectures de données vus en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1,5 pt) :</strong> Définissez le <strong>Cloud Computing</strong> selon le modèle NIST. Citez deux de ses caractéristiques essentielles.</p>",
          "reponse": "<p><strong>Réponse :</strong> Le Cloud Computing est un modèle qui permet un accès réseau à la demande et à un ensemble configurable de ressources informatiques (réseaux, serveurs, stockage, applications, services) qui peuvent être rapidement provisionnées et libérées avec un minimum d'effort de gestion ou d'interaction avec le fournisseur [citation:2].</p><p><strong>Caractéristiques essentielles (NIST) :</strong> <br>1. <strong>Élasticité rapide (Rapid Elasticity) :</strong> Capacité à augmenter ou diminuer les ressources de manière élastique en fonction de la demande [citation:2].<br>2. <strong>Service mesuré (Measured Service) :</strong> Les ressources sont contrôlées et facturées en fonction de l'utilisation réelle, avec transparence [citation:2].</p>"
        },
        {
          "question": "<p><strong>Question 2 (1,5 pt) :</strong> Distinguez les modèles de service <strong>IaaS</strong>, <strong>PaaS</strong> et <strong>SaaS</strong> en donnant un exemple de service pour chacun.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>IaaS (Infrastructure as a Service) :</strong> Fournit des ressources d'infrastructure (serveurs, stockage, réseaux). L'utilisateur gère les OS et les applications. <em>Exemple : Amazon EC2, Google Compute Engine.</em><br><strong>PaaS (Platform as a Service) :</strong> Fournit une plateforme de développement et de déploiement d'applications. L'utilisateur gère uniquement ses applications. <em>Exemple : Google App Engine, AWS Elastic Beanstalk.</em><br><strong>SaaS (Software as a Service) :</strong> Fournit des applications logicielles complètes accessibles via le web. L'utilisateur n'a rien à gérer. <em>Exemple : Google Workspace (Gmail, Docs), Salesforce.</em></p>"
        },
        {
          "question": "<p><strong>Question 3 (1,5 pt) :</strong> Expliquez la différence fondamentale entre un <strong>Data Lake</strong> et un <strong>Data Warehouse</strong>.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>Data Lake :</strong> Stocke de grandes quantités de données brutes, dans leur format natif (structurées, semi-structurées, non structurées), sans schéma prédéfini. Les données sont chargées telles quelles et transformées lors de l'analyse [citation:2].<br><strong>Data Warehouse :</strong> Stocke des données structurées et transformées, optimisées pour les requêtes analytiques. Les données sont nettoyées, intégrées et organisées selon un schéma (ex: en étoile) avant d'être stockées [citation:2].</p>"
        },
        {
          "question": "<p><strong>Question 4 (1,5 pt) :</strong> Citez deux composants clés de l'écosystème Apache <strong>Hadoop</strong> et décrivez brièvement leur rôle.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>HDFS (Hadoop Distributed File System) :</strong> Système de fichiers distribué qui stocke les données sur plusieurs nœuds (DataNodes) avec un nœud maître (NameNode) pour les métadonnées. Il assure la tolérance aux pannes via la réplication des données [citation:2].<br><strong>YARN (Yet Another Resource Negotiator) :</strong> Gestionnaire de ressources qui alloue la mémoire et les CPU aux applications (comme MapReduce ou Spark) s'exécutant sur le cluster [citation:2].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Traitement de Données et Orchestration (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Cet exercice évalue votre compréhension des technologies de traitement de données (Spark, MapReduce) et d'orchestration (Airflow).</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (2 pts) :</strong> Expliquez la différence entre l'approche <strong>ETL</strong> (Extract-Transform-Load) et l'approche <strong>ELT</strong> (Extract-Load-Transform). Dans quel contexte ELT est-elle privilégiée ?</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>ETL :</strong> Les données sont extraites des sources, transformées dans un moteur dédié (nettoyage, agrégation), puis chargées dans le Data Warehouse. La transformation a lieu avant le chargement.<br><strong>ELT :</strong> Les données sont extraites et chargées directement dans le Data Lake ou Data Warehouse, puis les transformations sont effectuées directement dans le système cible, en utilisant sa puissance de calcul (ex: SQL dans BigQuery ou Redshift).</p><p><strong>ELT est privilégiée dans le contexte du Cloud</strong> car les Data Warehouses cloud (Redshift, BigQuery) sont très puissants et permettent de transformer les données efficacement. Cela offre également plus de flexibilité pour explorer les données brutes.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1,5 pt) :</strong> Dans le modèle de programmation <strong>MapReduce</strong> de Hadoop, décrivez les rôles des phases <strong>Map</strong> et <strong>Reduce</strong>.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>Phase Map :</strong> Les données d'entrée sont divisées en fragments et traitées en parallèle sur chaque nœud. La fonction Map transforme chaque entrée (clé, valeur) en une ou plusieurs paires (clé, valeur) intermédiaires [citation:2].<br><strong>Phase Reduce :</strong> Les paires intermédiaires sont regroupées par clé. La fonction Reduce agrège les valeurs pour chaque clé pour produire le résultat final. Cette phase effectue l'agrégation et le résumé des données [citation:2].</p>"
        },
        {
          "question": "<p><strong>Question 3 (1,5 pt) :</strong> Qu'est-ce qu'un <strong>DAG</strong> dans Apache Airflow ? Expliquez son utilité.</p>",
          "reponse": "<p><strong>Réponse :</strong> Un <strong>DAG</strong> (Directed Acyclic Graph) est un graphe orienté sans cycle qui définit un workflow dans Airflow. Il est composé de <strong>tâches</strong> (tâches) et des <strong>dépendances</strong> entre elles.</p><p><strong>Utilité :</strong> Un DAG permet de <strong>décrire, planifier et exécuter</strong> un pipeline de données de manière structurée. Il garantit que les tâches sont exécutées dans le bon ordre (les dépendances sont respectées) et permet de gérer les erreurs et les retries. C'est l'unité fondamentale pour l'orchestration de workflows.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Services AWS et MLOps (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les services AWS pour la Data Science et les concepts du MLOps.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Quel service AWS utilise-t-on pour créer un <strong>Data Lake</strong> ? Et quel service pour un <strong>Data Warehouse</strong> ?</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>Data Lake :</strong> <strong>Amazon S3</strong> (Simple Storage Service) est utilisé comme Data Lake pour stocker les données brutes dans leur format natif.<br><strong>Data Warehouse :</strong> <strong>Amazon Redshift</strong> est le service de Data Warehouse cloud optimisé pour les requêtes analytiques sur de grands volumes de données.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1 pt) :</strong> Quel service AWS permet de <strong>transformer</strong> des données dans le cadre d'un pipeline ETL ? Citez un autre service d'AWS permettant d'analyser des données directement sur S3 avec SQL.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>Transformation des données :</strong> <strong>AWS Glue</strong> est le service ETL sans serveur qui permet de transformer les données dans un pipeline [citation:1].<br><strong>Analyse sur S3 :</strong> <strong>Amazon Athena</strong> permet d'interroger des données directement dans S3 avec des requêtes SQL, sans les charger dans un Data Warehouse.</p>"
        },
        {
          "question": "<p><strong>Question 3 (1 pt) :</strong> Définissez le <strong>MLOps</strong> et citez deux de ses principes clés.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br><strong>MLOps (Machine Learning Operations) :</strong> Ensemble de pratiques visant à déployer et maintenir des modèles de Machine Learning en production de manière fiable, efficace et scalable. Il s'agit d'appliquer les principes du DevOps au Machine Learning.</p><p><strong>Principes clés :</strong> <br>1. <strong>Automatisation :</strong> Automatiser les pipelines d'entraînement, de validation et de déploiement.<br>2. <strong>Monitoring :</strong> Surveiller en continu la performance du modèle, la dérive des données (data drift) et les métriques métier.</p>"
        },
        {
          "question": "<p><strong>Question 4 (1 pt) :</strong> Pourquoi est-il crucial de <strong>monitorer</strong> un modèle de Machine Learning en production ?</p>",
          "reponse": "<p><strong>Réponse :</strong> Il est crucial de monitorer un modèle ML en production car :<br>1. <strong>Les données évoluent :</strong> La distribution des données d'entrée peut changer (data drift), dégradant les performances du modèle.<br>2. <strong>La performance se dégrade :</strong> Le concept à prédire peut changer (concept drift), rendant le modèle obsolète.<br>3. <strong>Détecter les problèmes rapidement :</strong> Le monitoring permet de détecter les baisses de performance et d'alerter les équipes avant qu'elles n'impactent les utilisateurs.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Projet de Pipeline de Données (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Vous êtes data engineer dans une entreprise de logistique au Cameroun. Vous devez concevoir un <strong>pipeline de données sur AWS</strong> pour ingérer, transformer et analyser les données de livraison.</p>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (2 pts) :</strong> Décrivez les <strong>quatre étapes principales</strong> de votre pipeline, en identifiant les services AWS que vous utiliserez pour chacune.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br>1. <strong>Ingestion :</strong> Les données de livraison sont chargées dans un Data Lake sur <strong>Amazon S3</strong>. (Utilisation possible de <strong>AWS DataSync</strong> ou de l'API S3).<br>2. <strong>Transformation :</strong> Les données sont nettoyées et transformées avec <strong>AWS Glue</strong> (ETL sans serveur) pour être préparées pour l'analyse.<br>3. <strong>Stockage analytique :</strong> Les données transformées sont chargées dans <strong>Amazon Redshift</strong> (Data Warehouse) ou rendues accessibles via <strong>Amazon Athena</strong> sur S3.<br>4. <strong>Analyse et Visualisation :</strong> Les analystes utilisent <strong>Amazon QuickSight</strong> pour créer des tableaux de bord et analyser les performances des livraisons.</p>"
        },
        {
          "question": "<p><strong>Question 2 (2 pts) :</strong> Expliquez comment vous utiliseriez <strong>AWS Glue</strong> pour automatiser le <strong>catalogage</strong> des données dans S3 et faciliter leur interrogation.</p>",
          "reponse": "<p><strong>Réponse :</strong> <br>AWS Glue propose un <strong>Glue Data Catalog</strong> qui sert de référentiel central pour les métadonnées.</p><p><strong>Fonctionnement :</strong> <br>1. Utiliser un <strong>Glue Crawler</strong> pour scanner automatiquement les données dans S3. Le Crawler infère le schéma (colonnes, types de données) et crée ou met à jour des tables dans le Glue Data Catalog.<br>2. Une fois les tables cataloguées, les services comme <strong>Athena</strong> et <strong>Redshift Spectrum</strong> peuvent interroger les données directement dans S3 en utilisant des requêtes SQL.<br>3. Le Data Catalog permet également de gérer les partitions (ex: par date) pour optimiser les performances des requêtes.</p>"
        },
        {
          "question": "<p><strong>Question 3 (1 pt) :</strong> Quel service AWS utiliseriez-vous pour <strong>orchestrer</strong> les différentes étapes de votre pipeline (ingestion, transformation, chargement) ?</p>",
          "reponse": "<p><strong>Réponse :</strong> Pour orchestrer les étapes du pipeline, on peut utiliser :<br>• <strong>AWS Step Functions</strong> : Pour définir des workflows complexes avec des étapes séquentielles ou parallèles, la gestion des erreurs et des retries.<br>• <strong>Apache Airflow</strong> (sur AWS) : Si on préfère utiliser un outil open-source standard pour la création de DAGs.<br>• <strong>AWS Glue Workflows</strong> : Une solution intégrée à Glue pour orchestrer des jobs Glue, des crawlers et d'autres tâches.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
