<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Big Data et Cloud Computing",
  "classe": "Licence 2 Data Science",
  "sequence": "Evaluation Séquentielle n°1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Définition et Concepts du Cloud Computing",
      "points": "5 pts",
      "enonce": "<p>Le Cloud Computing est un paradigme qui a révolutionné la manière de consommer les ressources informatiques.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Citez et expliquez brièvement les <strong>trois (3) modèles de service</strong> du Cloud Computing selon la définition du NIST (National Institute of Standards and Technology).</p>",
          "reponse": "<p>Les trois modèles de service du Cloud Computing sont :</p><ul><li><strong>IaaS (Infrastructure as a Service) :</strong> Fournit des ressources informatiques virtualisées (serveurs, stockage, réseau) à la demande. L'utilisateur a le contrôle sur les systèmes d'exploitation, le stockage et les applications déployées. Exemple : Amazon EC2, Google Compute Engine [citation:7].</li><li><strong>PaaS (Platform as a Service) :</strong> Fournit une plateforme de développement et de déploiement d'applications dans le cloud. L'utilisateur n'a pas à gérer l'infrastructure sous-jacente (serveurs, stockage, réseau, OS). Exemple : Google App Engine, AWS Elastic Beanstalk.</li><li><strong>SaaS (Software as a Service) :</strong> Fournit des applications logicielles complètes, accessibles via un navigateur web. L'utilisateur n'a aucune gestion de l'infrastructure ou de la plateforme. Exemple : Gmail, Google Drive, Salesforce [citation:7].</li></ul>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Distinguez les <strong>modèles de déploiement</strong> suivants : Cloud Public, Cloud Privé et Cloud Hybride. Donnez un exemple d'utilisation pour chacun.</p>",
          "reponse": "<p><strong>Cloud Public :</strong> Les ressources sont mises à disposition du grand public par un fournisseur tiers. Elles sont mutualisées entre plusieurs clients. <em>Exemple :</em> Utiliser AWS pour héberger un site web public [citation:7].</p><p><strong>Cloud Privé :</strong> Les ressources sont dédiées à une seule organisation. L'infrastructure peut être hébergée sur site ou par un fournisseur tiers. <em>Exemple :</em> Une banque qui héberge ses données clients sensibles dans un cloud privé pour des raisons de sécurité et de conformité.</p><p><strong>Cloud Hybride :</strong> Combine le Cloud Public et le Cloud Privé. Permet de garder les données sensibles dans le privé tout en utilisant le public pour des charges de travail variables ou des applications web. <em>Exemple :</em> Une entreprise de e-commerce qui utilise un cloud privé pour la gestion des données clients et le cloud public pour gérer les pics de trafic lors des soldes.</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Expliquez ce qu'est l'<strong>élasticité</strong> dans le contexte du Cloud Computing et pourquoi elle représente un avantage majeur par rapport à une infrastructure traditionnelle (on-premise).</p>",
          "reponse": "<p>L'<strong>élasticité</strong> est la capacité d'un système à s'adapter automatiquement à la demande en ressources (CPU, mémoire, stockage) en augmentant ou en diminuant les ressources allouées. C'est l'un des avantages fondamentaux du Cloud [citation:1].</p><p>Par rapport à une infrastructure traditionnelle (on-premise), l'élasticité offre plusieurs avantages :</p><ul><li><strong>Adaptation à la charge :</strong> Les ressources peuvent être augmentées pendant les pics d'activité (ex: périodes de soldes) et réduites pendant les périodes creuses, évitant le gaspillage.</li><li><strong>Paiement à l'usage :</strong> On ne paie que pour les ressources effectivement consommées, contrairement à l'achat de serveurs surdimensionnés pour gérer des pics occasionnels.</li><li><strong>Réactivité :</strong> Permet de répondre rapidement aux besoins changeants de l'entreprise, sans les délais d'achat et d'installation de matériel.</li></ul>"
        }
      ]
    },
    {
      "titre": "Services de Base du Cloud",
      "points": "6 pts",
      "enonce": "<p>Les fournisseurs de cloud proposent différents services de base pour répondre aux besoins en calcul, stockage et réseautage.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Citez <strong>trois (3) services de calcul</strong> proposés par les principaux fournisseurs Cloud (AWS, GCP, Azure) et décrivez brièvement chacun d'eux.</p>",
          "reponse": "<p><strong>AWS EC2 (Elastic Compute Cloud) :</strong> Service de calcul offrant des machines virtuelles (instances) configurables à la demande. Permet de choisir le type d'instance (CPU, mémoire, GPU) selon les besoins [citation:5].</p><p><strong>GCP Compute Engine :</strong> Service similaire à EC2, offrant des machines virtuelles avec un large choix de configurations et un réseau haute performance.</p><p><strong>Azure Virtual Machines :</strong> Service de machines virtuelles de Microsoft, permettant de déployer rapidement des applications Windows ou Linux sur l'infrastructure cloud Azure.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Présentez les <strong>services de stockage objet</strong> des trois principaux fournisseurs Cloud (S3, Cloud Storage, Blob Storage). Quelles sont leurs caractéristiques communes ?</p>",
          "reponse": "<p>Les services de stockage objet des principaux fournisseurs sont :</p><ul><li><strong>AWS S3 (Simple Storage Service) :</strong> Service de stockage objet hautement scalable, durable et sécurisé pour tout type de données.</li><li><strong>GCP Cloud Storage :</strong> Service de stockage objet unifié, avec plusieurs classes de stockage pour optimiser les coûts.</li><li><strong>Azure Blob Storage :</strong> Service de stockage objet pour des données non structurées de grande taille (textes, images, vidéos).</li></ul><p>Leurs <strong>caractéristiques communes</strong> sont :</p><ul><li><strong>Stockage objet :</strong> Les données sont stockées comme des objets avec des métadonnées.</li><li><strong>Haute scalabilité :</strong> Capables de stocker des pétaoctets de données.</li><li><strong>Durabilité :</strong> Réplication automatique des données sur plusieurs zones [citation:5].</li><li><strong>Accessibilité :</strong> Accessible via des API REST, SDK, ou interfaces web.</li></ul>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Définissez ce qu'est un <strong>VPC (Virtual Private Cloud)</strong> et quel est le rôle d'un <strong>Load Balancer</strong> dans une architecture cloud.</p>",
          "reponse": "<p>Un <strong>VPC (Virtual Private Cloud)</strong> est un réseau virtuel isolé logiquement dans le cloud, où l'utilisateur peut contrôler la configuration réseau (sous-réseaux, plages d'adresses IP, tables de routage, passerelles). Il permet de créer un environnement sécurisé pour déployer ses ressources cloud, à l'image d'un réseau local traditionnel [citation:12].</p><p>Un <strong>Load Balancer</strong> est un service qui distribue automatiquement le trafic réseau entrant vers plusieurs ressources (serveurs, instances) pour assurer la haute disponibilité, la scalabilité et la tolérance aux pannes. Il permet de répartir la charge entre les serveurs et de détecter les défaillances pour rediriger le trafic vers les serveurs sains.</p>"
        }
      ]
    },
    {
      "titre": "Data Lake vs Data Warehouse",
      "points": "5 pts",
      "enonce": "<p>Les architectures de données modernes distinguent souvent deux concepts : le Data Lake et le Data Warehouse.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Définissez un Data Lake et un Data Warehouse en soulignant leurs différences fondamentales.</p>",
          "reponse": "<p><strong>Data Lake :</strong> Un Data Lake est un système de stockage qui conserve les données brutes, non transformées, dans leur format natif (structurées, semi-structurées ou non structurées). Il est généralement utilisé pour le stockage de grandes quantités de données à un coût faible et permet une flexibilité dans l'exploration et l'analyse [citation:2].</p><p><strong>Data Warehouse :</strong> Un Data Warehouse est une base de données qui stocke des données structurées, transformées et organisées de manière optimisée pour l'analyse et le reporting. Les données sont généralement extraites de sources diverses, nettoyées, transformées et intégrées selon un schéma prédéfini (modèle en étoile ou en flocon) [citation:2].</p><p><strong>Différences fondamentales :</strong> Le Data Lake stocke les données brutes sans les transformer, tandis que le Data Warehouse stocke des données transformées et structurées. Le Data Lake est plus flexible pour l'exploration, tandis que le Data Warehouse est optimisé pour les requêtes analytiques rapides [citation:2].</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Citez <strong>deux (2) formats de données</strong> couramment utilisés dans les Data Lakes et expliquez leurs avantages.</p>",
          "reponse": "<p>Deux formats de données couramment utilisés dans les Data Lakes sont :</p><ul><li><strong>Parquet :</strong> Format de stockage en colonnes, optimisé pour le traitement de grandes quantités de données. Avantages : compression élevée, performances de lecture rapides pour les requêtes analytiques, supporté par de nombreux moteurs de traitement (Spark, Hive).</li><li><strong>Avro :</strong> Format de sérialisation de données qui stocke les données avec leur schéma. Avantages : prise en charge de l'évolution des schémas, format compact, support de la compression, adapté aux pipelines de streaming et aux systèmes de messagerie.</li></ul>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Expliquez la différence entre les approches <strong>ETL (Extract-Transform-Load)</strong> et <strong>ELT (Extract-Load-Transform)</strong>. Dans quel contexte l'approche ELT est-elle devenue privilégiée ?</p>",
          "reponse": "<p><strong>ETL (Extract-Transform-Load) :</strong> Dans cette approche, les données sont extraites des sources, transformées (nettoyage, agrégation, enrichment) dans un système intermédiaire, puis chargées dans le Data Warehouse. La transformation a lieu avant le chargement.</p><p><strong>ELT (Extract-Load-Transform) :</strong> Dans cette approche, les données brutes sont extraites et directement chargées dans le Data Warehouse. La transformation est effectuée après le chargement, à l'intérieur du Data Warehouse, en utilisant ses capacités de calcul.</p><p><strong>Contexte de privilégiation de l'ELT :</strong> L'approche ELT est devenue privilégiée avec l'émergence des Data Warehouses cloud comme Snowflake, BigQuery ou Redshift [citation:2], qui offrent une puissance de calcul scalable et des capacités de transformation avancées. Cela permet de stocker les données brutes et de les transformer à la demande, offrant plus de flexibilité et de rapidité pour les usages analytiques.</p>"
        }
      ]
    },
    {
      "titre": "Écosystème Hadoop et Apache Spark",
      "points": "4 pts",
      "enonce": "<p>Hadoop et Spark sont des piliers du traitement des Big Data.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Décrivez l'architecture de <strong>HDFS (Hadoop Distributed File System)</strong> en expliquant le rôle du <strong>NameNode</strong> et des <strong>DataNodes</strong>. Quelle est la fonction de la <strong>réplication</strong> des données ?</p>",
          "reponse": "<p><strong>HDFS</strong> est un système de fichiers distribué conçu pour fonctionner sur des clusters de machines [citation:1].</p><ul><li><strong>NameNode :</strong> Le nœud maître qui gère l'arborescence du système de fichiers et les métadonnées (emplacement des blocs de données). Il ne stocke pas les données, mais gère l'index et les permissions.</li><li><strong>DataNodes :</strong> Les nœuds esclaves qui stockent effectivement les données en blocs (par défaut 128 Mo). Ils reçoivent les instructions du NameNode pour lire, écrire et répliquer les données.</li><li><strong>Réplication :</strong> La réplication est la duplication de chaque bloc de données sur plusieurs DataNodes (par défaut 3 copies). Elle assure la tolérance aux pannes : si un DataNode tombe, les données sont toujours accessibles depuis d'autres nœuds. Elle permet également d'optimiser la localité des données pour le traitement.</li></ul>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Expliquez le rôle de <strong>YARN (Yet Another Resource Negotiator)</strong> dans l'écosystème Hadoop. Décrivez brièvement les composants <strong>ResourceManager</strong> et <strong>NodeManager</strong>.</p>",
          "reponse": "<p><strong>YARN</strong> est le système de gestion des ressources et de planification des tâches de Hadoop [citation:1]. Il sépare la gestion des ressources du traitement des données, permettant ainsi à différents moteurs de traitement (MapReduce, Spark, Tez) de fonctionner sur le même cluster.</p><ul><li><strong>ResourceManager (RM) :</strong> Le composant maître qui gère les ressources du cluster (CPU, mémoire). Il reçoit les demandes des applications, alloue les ressources et planifie l'exécution des tâches.</li><li><strong>NodeManager (NM) :</strong> Le composant esclave qui s'exécute sur chaque nœud du cluster. Il gère les ressources locales, démarre les conteneurs d'application et surveille leur utilisation des ressources.</li></ul>"

          "reponse": "<p><strong>MapReduce</strong> est un modèle de programmation pour le traitement de grandes quantités de données. Il fonctionne en deux phases : Map (transformation et filtrage) et Reduce (agrégation et synthèse) [citation:1]. Spark est un moteur de traitement de données rapide et unifié, conçu pour le traitement en mémoire.</p><p><strong>Performance :</strong> Spark est généralement plus rapide que MapReduce car il traite les données en mémoire (lorsque c'est possible) et évite les accès disque à chaque étape. Spark offre également des optimisations avancées comme l'évaluation paresseuse (lazy evaluation) et l'optimiseur Catalyst pour les requêtes SQL.</p><p><strong>Utilisation :</strong> MapReduce est orienté traitement par lots et a une interface de programmation plus simple. Spark offre une API plus riche (DataFrames, SQL, Streaming, MLlib) et est plus polyvalent pour différents types de traitements.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
