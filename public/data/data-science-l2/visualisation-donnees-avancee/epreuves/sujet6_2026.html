<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Visualisation de Données Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6 : Visualisation Temporelle, Réseaux et Storytelling",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur les Séries Temporelles et les Réseaux",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1.1rem; color: #34495e;'>Cet exercice porte sur les fondamentaux de la visualisation des séries temporelles et des réseaux. Répondez de manière claire et structurée aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<strong>1. Définitions et concepts (3 pts) :</strong><br>a) Définissez une <em>série temporelle</em>. Citez deux exemples concrets de séries temporelles dans un contexte camerounais.<br><br>b) Expliquez ce qu'est une <em>moyenne mobile</em> et décrivez son utilité dans l'analyse des séries temporelles.<br><br>c) En théorie des graphes, quelle est la différence entre un <em>graphe orienté</em> et un <em>graphe non orienté</em> ? Donnez un exemple pour chacun.",
          "reponse": "<strong>a) Série temporelle :</strong><br>Une <strong>série temporelle</strong> est une séquence de points de données mesurés à des <strong>intervalles de temps réguliers</strong>. Elle permet d'analyser l'évolution d'une variable dans le temps [citation:2].<br><br>Exemples dans un contexte camerounais :<br><ul><li>Les <strong>précipitations mensuelles</strong> enregistrées à Yaoundé sur les 10 dernières années.</li><li>Les <strong>prix quotidiens du cacao</strong> sur le marché international, impactant directement les revenus des producteurs camerounais.</li></ul><br><strong>b) Moyenne mobile :</strong><br>La <strong>moyenne mobile</strong> est un indicateur qui lisse les fluctuations à court terme d'une série temporelle pour mettre en évidence la <strong>tendance</strong> générale. Elle est calculée en faisant la moyenne d'un nombre fixe de points de données consécutifs. Plus la fenêtre de calcul est grande, plus la courbe est lissée. Elle est très utilisée en finance pour analyser les cours des actions, mais aussi pour les prévisions de ventes ou l'analyse météo [citation:2].<br><br><strong>c) Graphe orienté vs non orienté :</strong><br>Un <strong>graphe non orienté</strong> est un graphe dans lequel les arêtes n'ont pas de direction, représentant des relations symétriques.<br><strong>Exemple :</strong> Le réseau d'amitié sur Facebook. Si Alice est amie avec Bob, alors Bob est aussi ami avec Alice.<br>Un <strong>graphe orienté</strong> est un graphe dans lequel les arêtes ont une direction, représentant des relations asymétriques.<br><strong>Exemple :</strong> Le réseau de suivi sur Twitter. Si Alice suit Bob, cela ne signifie pas que Bob suit Alice [citation:6].",
          "sousQuestions": []
        },
        {
          "question": "<strong>2. Équité et Visualisation (3 pts) :</strong><br>a) Expliquez pourquoi il est important de considérer l'<em>équité</em> et les <em>biais</em> lors de la création de visualisations de données, en particulier dans le contexte de la data science.<br><br>b) Donnez un exemple concret de la façon dont une visualisation mal conçue pourrait introduire ou amplifier un biais.",
          "reponse": "<strong>a) Importance de l'équité et des biais :</strong><br>Il est crucial de considérer l'équité et les biais dans la visualisation de données pour garantir que les informations présentées sont <strong>honnêtes</strong> et ne conduisent pas à des interprétations erronées ou discriminatoires. Une visualisation biaisée peut :<br><ul><li><strong>Dissimuler des inégalités</strong> en présentant les données de manière trompeuse (ex: échelles manipulées).</li><li><strong>Renforcer des stéréotypes</strong> en mettant en avant certains groupes de manière disproportionnée.</li><li><strong>Conduire à de mauvaises décisions</strong> en ne reflétant pas la réalité des données.</li></ul>Dans un monde de plus en plus axé sur les données, les data scientists ont la responsabilité éthique de créer des visualisations justes et transparentes qui ne nuisent pas à certains groupes [citation:2].<br><br><strong>b) Exemple de biais dans une visualisation :</strong><br>Imaginons un graphique à barres comparant les performances commerciales de différentes régions du Cameroun. Si l'axe des ordonnées ne commence pas à zéro, les différences entre les régions peuvent sembler beaucoup plus importantes qu'elles ne le sont en réalité. Cela pourrait amener un responsable à concentrer injustement des ressources sur une région en croyant à tort qu'elle est en retard. Une <strong>échelle non appropriée</strong> est un biais de conception courant qui peut tromper le public et influencer des décisions stratégiques de manière erronée [citation:3].",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse et Visualisation de Séries Temporelles",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1.1rem; color: #34495e;'>Vous êtes Data Analyst dans une entreprise de distribution au Cameroun. On vous fournit les données de ventes mensuelles d'un produit phare pour les trois dernières années. Votre responsable souhaite comprendre les tendances et la saisonnalité pour mieux planifier les stocks.</p></div>",
      "questions": [
        {
          "question": "<strong>1. Analyse des données (2 pts) :</strong><br>Proposez une méthode pour analyser cette série temporelle. Quelles visualisations utiliseriez-vous pour identifier la tendance, la saisonnalité et le bruit ? Justifiez vos choix.",
          "reponse": "<strong>Méthode d'analyse :</strong><br>Pour analyser cette série temporelle, je suivrais une approche en deux étapes :<br><br><strong>1. Visualisation globale :</strong> Je commencerais par un <strong>graphique en courbes</strong> (<code>plt.plot()</code> avec Matplotlib ou Plotly) affichant l'évolution des ventes sur toute la période. Cela permet d'avoir une première vue d'ensemble et de repérer les tendances à long terme et les points d'inflexion [citation:2].<br><br><strong>2. Identification des composantes :</strong> Pour décomposer la série, j'utiliserais :<br><ul><li><strong>Tendance</strong> : Une <strong>moyenne mobile</strong> sur 12 mois (ou 6 mois selon la longueur de la série) pour lisser les fluctuations saisonnières et dégager la tendance générale.</li><li><strong>Saisonnalité</strong> : Des <strong>sous-graphiques</strong> ou un graphique à <strong>facettes</strong> montrant les ventes pour chaque mois de l'année sur les différentes années. Cela permet de visualiser visuellement les pics et les creux récurrents.</li><li><strong>Bruit</strong> : Les écarts résiduels entre la série originale et la tendance lissée peuvent être visualisés pour évaluer la part aléatoire.</li></ul><br><strong>Justification :</strong> Le graphique en courbes est la visualisation de base pour les séries temporelles. La moyenne mobile est un indicateur éprouvé pour la tendance. Les sous-graphiques par mois sont excellents pour une analyse comparative de la saisonnalité [citation:3].",
          "sousQuestions": []
        },
        {
          "question": "<strong>2. Implémentation avec Matplotlib (3 pts) :</strong><br>Écrivez le code Python (en utilisant Matplotlib) pour :<br>1. Tracer la série temporelle des ventes.<br>2. Superposer la moyenne mobile sur 12 mois.<br>3. Ajouter un titre, des labels d'axes et une légende.",
          "reponse": "<p>Voici le code Python pour visualiser la série temporelle et la moyenne mobile :</p><br><pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-size: 0.9rem; overflow-x: auto;'><code>import matplotlib.pyplot as plt<br>import pandas as pd<br><br># Chargement des données (simulation)<br># df = pd.read_csv('ventes.csv')<br># df['Date'] = pd.to_datetime(df['Date'])<br># df = df.set_index('Date')<br><br># Simulation de données pour l'exemple<br>dates = pd.date_range('2023-01-01', periods=36, freq='M')<br>ventes = [100, 120, 115, 130, 150, 165, 160, 180, 190, 210, 200, 220, 140, 160, 155, 170, 190, 205, 200, 220, 230, 250, 240, 260, 180, 200, 195, 210, 230, 245, 240, 260, 270, 290, 280, 300]<br>df = pd.DataFrame({'Ventes': ventes}, index=dates)<br><br># Calcul de la moyenne mobile sur 12 mois<br>df['MA_12'] = df['Ventes'].rolling(window=12).mean()<br><br># Création de la figure<br>plt.figure(figsize=(12, 6))<br>plt.plot(df.index, df['Ventes'], label='Ventes Mensuelles', color='blue', marker='o', markersize=4)<br>plt.plot(df.index, df['MA_12'], label='Moyenne Mobile (12 mois)', color='red', linewidth=2)<br><br># Personnalisation<br>plt.title('Évolution des Ventes Mensuelles', fontsize=16)<br>plt.xlabel('Date', fontsize=12)<br>plt.ylabel('Ventes (en milliers)', fontsize=12)<br>plt.legend()<br>plt.grid(True, linestyle='--', alpha=0.7)<br>plt.xticks(rotation=45)<br>plt.tight_layout()<br>plt.show()</code></pre><p>Ce code permet de visualiser clairement la tendance des ventes et son évolution saisonnière.</p>",
          "sousQuestions": []
        },
        {
          "question": "<strong>3. Interprétation (2 pts) :</strong><br>En vous basant sur les visualisations que vous avez créées, quelle serait votre interprétation pour le responsable commercial ? Quelles recommandations pourriez-vous lui faire concernant la gestion des stocks ?",
          "reponse": "<strong>Interprétation :</strong><br>On peut observer une <strong>tendance à la hausse</strong> des ventes sur les trois années. De plus, il y a une <strong>saisonnalité marquée</strong> avec des pics de ventes en fin d'année (novembre-décembre) et des creux en début d'année (janvier-février). La moyenne mobile confirme la tendance haussière en lissant les fluctuations.<br><br><strong>Recommandations :</strong><br><ul><li><strong>Anticiper les pics :</strong> Augmenter les stocks de manière significative avant la période de fin d'année pour répondre à la demande accrue et éviter les ruptures de stock.</li><li><strong>Gérer les creux :</strong> Profiter des périodes de ventes plus faibles pour réaliser des inventaires, des promotions ciblées ou des opérations de maintenance.</li><li><strong>Planifier à long terme :</strong> La tendance haussière suggère qu'il serait prudent de négocier des volumes d'achat plus importants avec les fournisseurs pour l'année à venir.</li></ul>",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de Cas - Visualisation d'un Réseau Social",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1.1rem; color: #34495e;'>Vous êtes consultant en analyse de données pour une ONG au Cameroun. Elle souhaite comprendre la structure de l'influence dans un réseau d'agriculteurs pour mieux diffuser les bonnes pratiques agricoles. Vous disposez d'une liste de relations 'suit' entre les agriculteurs.</p></div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
