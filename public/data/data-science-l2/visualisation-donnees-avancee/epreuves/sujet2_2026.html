<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Visualisation de Données Avancée - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Graphiques Avancés et Animation avec Plotly",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #333333; padding: 10px;'> <p>Cet exercice évalue votre capacité à créer et interpréter des graphiques avancés avec Plotly, notamment les graphiques 3D, les animations et les sous-graphiques.</p> <ul style='margin-top: 10px;'> <li><strong>Question 1</strong> (2 pts)</li> <li><strong>Question 2</strong> (2 pts)</li> <li><strong>Question 3</strong> (2 pts)</li> </ul> </div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 1 (2 pts)</strong><br> Soit un jeu de données contenant trois variables : <span style='font-style: italic;'>température</span>, <span style='font-style: italic;'>humidité</span> et <span style='font-style: italic;'>pression atmosphérique</span> mesurées sur plusieurs semaines.<br> <span style='font-weight: bold;'>a)</span> Quel type de graphique 3D serait le plus approprié pour visualiser simultanément ces trois variables ? Justifiez votre réponse. (1 pt)<br> <span style='font-weight: bold;'>b)</span> Expliquez comment vous utiliseriez l'argument <code>animation_frame</code> de Plotly Express pour visualiser l'évolution temporelle de ces données. (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> Un nuage de points 3D (<code>px.scatter_3d()</code> ou <code>go.Scatter3d()</code>) serait le plus approprié. Il permet de placer chaque observation selon trois axes (x, y, z) et de visualiser les corrélations ou les clusters entre les trois variables continues.<br> <strong>b)</strong> L'argument <code>animation_frame</code> permet de spécifier une colonne (par exemple la date) pour créer une animation. Plotly génère automatiquement un slider et des contrôles de lecture, chaque frame correspondant à une valeur de la colonne choisie. On peut aussi utiliser <code>animation_group</code> pour suivre des entités spécifiques dans le temps.</div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 2 (2 pts)</strong><br> Vous devez comparer l'évolution de deux séries temporelles distinctes sur un même graphique.<br> <span style='font-weight: bold;'>a)</span> Décrivez comment créer des sous-graphiques (subplots) avec Plotly pour afficher ces deux séries côte à côte ou l'une au-dessus de l'autre. (1 pt)<br> <span style='font-weight: bold;'>b)</span> Quel avantage apporte le partage d'un axe (<code>share_x</code> ou <code>share_y</code>) entre les sous-graphiques ? (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> On utilise la fonction <code>make_subplots()</code> du module <code>plotly.subplots</code> pour définir la grille (nombre de lignes et colonnes). On ajoute ensuite les traces avec <code>add_trace()</code> en spécifiant la position de chaque sous-graphique via les paramètres <code>row</code> et <code>col</code>.<br> <strong>b)</strong> Le partage d'un axe (par exemple <code>share_x=True</code>) permet de synchroniser les échelles. Cela facilite les comparaisons entre les séries, car les points temporels sont alignés verticalement, et améliore la lisibilité en évitant de répéter les étiquettes d'axe.</div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 3 (2 pts)</strong><br> <span style='font-weight: bold;'>a)</span> Expliquez la différence entre un graphique de surface (<code>go.Surface()</code>) et un maillage 3D (<code>go.Mesh3d()</code>) dans Plotly. (1 pt)<br> <span style='font-weight: bold;'>b)</span> Dans quel contexte utiliseriez-vous <code>go.Mesh3d()</code> plutôt qu'un nuage de points 3D ? (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> <code>go.Surface()</code> représente une surface continue définie par une grille régulière de points. <code>go.Mesh3d()</code> représente un maillage triangulaire, ce qui est plus flexible pour des surfaces irrégulières ou des formes complexes. Le maillage est construit à partir de triangles, ce qui le rend adapté aux données non structurées.<br> <strong>b)</strong> <code>go.Mesh3d()</code> est particulièrement utile pour représenter des terrains naturels, des modèles 3D, ou toute surface où les données ne sont pas disposées en grille régulière. Par exemple, pour visualiser une carte de densité de population sur un relief accidenté ou un objet issu d'une CAO.</div>"
       }
     ]
   },
   {
     "titre": "Applications avec Bokeh",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #333333; padding: 10px;'> <p>Cet exercice porte sur la bibliothèque Bokeh pour la visualisation interactive.</p> <ul style='margin-top: 10px;'> <li><strong>Question 1</strong> (2 pts)</li> <li><strong>Question 2</strong> (2 pts)</li> </ul> </div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 1 (2 pts)</strong><br> <span style='font-weight: bold;'>a)</span> Qu'est-ce qu'un <span style='font-style: italic;'>glyph</span> dans Bokeh et quel est son rôle ? (1 pt)<br> <span style='font-weight: bold;'>b)</span> Citez deux outils interactifs que Bokeh propose par défaut et expliquez leur utilité pour l'analyse de données. (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> Un <strong>glyph</strong> est un élément visuel de base dans Bokeh, comme des cercles, des carrés, des lignes ou des barres. Ils sont ajoutés à un objet <code>figure()</code> pour représenter graphiquement les données. Par exemple, <code>fig.circle()</code> crée un nuage de points.<br> <strong>b)</strong> Deux outils interactifs courants : <strong>Pan</strong> (pour déplacer la vue) et <strong>Zoom</strong> (pour agrandir ou réduire une zone). Le <strong>Hover</strong> (survol) est aussi très utile pour afficher des informations contextuelles (tooltips) lorsque le curseur passe sur un point. Ces outils permettent d'explorer les données en détail et de se concentrer sur des zones d'intérêt.</div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 2 (2 pts)</strong><br> Vous souhaitez créer un tableau de bord (dashboard) avec Bokeh pour présenter plusieurs graphiques liés à une même thématique.<br> <span style='font-weight: bold;'>a)</span> Décrivez comment organiser plusieurs graphiques dans un tableau de bord Bokeh. (1 pt)<br> <span style='font-weight: bold;'>b)</span> Expliquez l'intérêt d'utiliser des onglets (<code>tabs</code>) dans un tableau de bord. (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> Bokeh propose des outils de mise en page comme <code>row()</code>, <code>column()</code> et <code>gridplot()</code> pour organiser les graphiques. <code>gridplot()</code> est pratique pour une grille de graphiques. On peut aussi utiliser <code>layout()</code> pour structurer un tableau de bord plus complexe avec des éléments comme des sliders ou des textes.<br> <strong>b)</strong> Les onglets (<code>tabs</code>) permettent de regrouper des graphiques par thème et de naviguer facilement entre eux. Cela évite de surcharger une vue unique et améliore l'expérience utilisateur, surtout lorsqu'on a de nombreuses visualisations à présenter.</div>"
       }
     ]
   },
   {
     "titre": "Conception de Tableaux de Bord",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; background-color: #ffffff; color: #333333; padding: 10px;'> <p>Cet exercice vous invite à réfléchir à la conception d'un tableau de bord interactif pour un cas d'usage concret.</p> <ul style='margin-top: 10px;'> <li><strong>Question 1</strong> (2 pts)</li> <li><strong>Question 2</strong> (2 pts)</li> <li><strong>Question 3</strong> (1 pt)</li> </ul> </div>",
     "questions": [
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 1 (2 pts)</strong><br> Vous devez concevoir un tableau de bord pour une entreprise de e-commerce. Les indicateurs clés sont : le chiffre d'affaires quotidien, les ventes par catégorie de produits, et le taux de conversion.<br> <span style='font-weight: bold;'>a)</span> Proposez deux types de graphiques appropriés pour chacun de ces trois indicateurs. (1 pt)<br> <span style='font-weight: bold;'>b)</span> Quel outil (Plotly Dash ou Streamlit) utiliseriez-vous pour prototyper rapidement ce tableau de bord ? Justifiez votre choix. (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> • Chiffre d'affaires quotidien : graphique en ligne (série temporelle) ou graphique à barres pour comparer les jours. • Ventes par catégorie : graphique à barres (pour comparer les montants) ou graphique en secteurs (pour visualiser la part de chaque catégorie). • Taux de conversion : un indicateur de type jauge ou un graphique en ligne pour suivre l'évolution dans le temps.<br> <strong>b)</strong> Streamlit serait plus adapté pour un prototypage rapide grâce à sa syntaxe simple et sa courbe d'apprentissage douce. Il permet de créer rapidement une interface avec des widgets intégrés. Dash est plus puissant pour des applications très complexes avec de nombreuses interactions et une personnalisation avancée.</div>"
       },
       {
         "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Question 2 (2 pts)</strong><br> L'entreprise souhaite également analyser la répartition géographique de ses clients.<br> <span style='font-weight: bold;'>a)</span> Quel type de visualisation utiliseriez-vous pour présenter ces données ? (1 pt)<br> <span style='font-weight: bold;'>b)</span> Décrivez brièvement comment vous intégreriez cette visualisation dans le tableau de bord pour qu'elle soit interactive. (1 pt)</div>",
         "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;'><strong>Éléments de réponse :</strong><br> <strong>a)</strong> Une carte choroplèthe (carte de chaleur) avec Folium, ou une carte interactive avec Plotly (utilisant <code>px.scatter_mapbox</code> ou <code>px.choropleth</code>) serait idéale pour visualiser la répartition des clients par région.<br> <strong>b)</strong> Pour l'intégrer dans un tableau de bord, on peut utiliser les calques interactifs de Folium ou Plotly. On peut ajouter des <code>popups</code> pour afficher le nombre de clients ou le chiffre d'affaires par zone. L'interactivité peut être renforcée avec des filtres pour sélectionner une région ou une période.</div>"
       },
       {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
