<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Visualisation de Données Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse d'un Dashboard de Ventes",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>Vous êtes consultant en visualisation de données. Un client du secteur de la vente en ligne vous soumet le tableau de bord ci-dessous, qu'il utilise pour suivre les performances de son entreprise. Le dashboard est censé aider les managers à prendre des décisions stratégiques.</p>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;'>\n    <img alt=\"Dashboard commercial avec graphiques à barres 3D, courbes avec dégradés, indicateurs de performance (KPI) avec des icônes. Les couleurs sont vives et variées. Des éléments décoratifs (ombres, effets de brillance) sont présents. Les titres des graphiques sont techniques. Les échelles des axes sont différentes selon les graphiques.\" style='max-width: 100%; border-radius: 8px;' />\n  </div>\n  <p>Le client se plaint que ses équipes ont du mal à interpréter le tableau de bord et qu'il ne génère pas les insights attendus.</p>\n  <p><strong>Instructions :</strong> En vous basant sur les principes de design de visualisations (couleurs, chart junk, échelles, typographie, hiérarchie visuelle), vous allez analyser ce dashboard.</p>\n</div>",
      "questions": [
        {
          "question": "1) Identifier et décrire <strong>trois</strong> problèmes de design dans ce dashboard. Pour chaque problème, expliquez en quoi il nuit à la lisibilité ou à l'interprétation des données.",
          "reponse": "<p><strong>Problème 1 : Chart junk</strong> - Les graphiques à barres 3D, les dégradés et les effets de brillance sont des éléments décoratifs superflus. Ils distraient l'utilisateur et ne transmettent aucune information utile. Selon le principe de Tufte, le rapport data-ink doit être maximisé.</p><p><strong>Problème 2 : Échelles trompeuses</strong> - Les axes des graphiques n'ont pas la même échelle, ce qui peut induire en erreur sur les tendances et les comparaisons. Par exemple, si deux graphiques montrent des ventes, ils devraient avoir la même échelle pour faciliter la comparaison.</p><p><strong>Problème 3 : Hiérarchie visuelle et lisibilité</strong> - Les titres sont techniques et peu explicites (ex: \"Ventes Région\" au lieu de \"Ventes par Région\"). La légende est peu lisible. Il n'y a pas de hiérarchie visuelle claire pour guider l'attention de l'utilisateur vers les informations les plus importantes.</p>"
        },
        {
          "question": "2) Proposer <strong>trois</strong> améliorations concrètes pour ce dashboard, en justifiant chacune par un principe de design.",
          "reponse": "<p><strong>Amélioration 1 : Supprimer le chart junk</strong> - Remplacer les graphiques 3D par des graphiques 2D. Retirer les dégradés et les effets de brillance. Cela permet de respecter le principe de minimalisme et de se concentrer sur les données.</p><p><strong>Amélioration 2 : Uniformiser les échelles</strong> - Utiliser des échelles cohérentes entre les graphiques qui comparent les mêmes métriques. Par exemple, si deux graphiques montrent des ventes, ils doivent avoir la même échelle. Cela facilite la comparaison et évite les interprétations erronées.</p><p><strong>Amélioration 3 : Améliorer la hiérarchie visuelle</strong> - Utiliser des titres explicites pour chaque graphique. Mettre en gras ou en plus grand les KPI les plus importants. Utiliser une palette de couleurs cohérente (par exemple, les couleurs de l'entreprise). Cela permet de guider l'attention de l'utilisateur et de rendre l'information plus accessible.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Conception d'un Dashboard Marketing",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>Vous êtes Data Scientist dans une agence de marketing digital. Votre équipe vient de lancer une campagne multicanal (email, réseaux sociaux, publicité display) pour un client dans le secteur de la vente en ligne.</p>\n  <p>Le client souhaite disposer d'un tableau de bord pour suivre la performance de la campagne en temps réel. Les indicateurs clés sont :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li>Le nombre de clics et le taux de clics (CTR) par canal.</li>\n    <li>Le coût par clic (CPC) et le coût par acquisition (CPA).</li>\n    <li>Le retour sur investissement publicitaire (ROAS).</li>\n    <li>Le nombre de conversions (achats) par canal.</li>\n    <li>La répartition des dépenses par canal.</li>\n  </ul>\n  <p>Le client a également besoin de comparer les performances des canaux entre eux et d'identifier les canaux les plus rentables.</p>\n</div>",
      "questions": [
        {
          "question": "1) Déterminer le type de graphique le plus approprié pour chacun des indicateurs suivants : CTR, conversions par canal, dépenses par canal, ROAS par canal. Justifier chaque choix en vous appuyant sur les principes de design et de perception visuelle.",
          "reponse": "<ul><li><strong>CTR :</strong> Un <strong>indicateur (KPI card)</strong> en haut du tableau de bord, avec une valeur bien visible et une variation (évolution par rapport à la veille). Cela permet une lecture rapide de la performance globale.</li><li><strong>Conversions par canal :</strong> Un <strong>graphique à barres</strong> pour comparer les canaux. Les barres permettent une comparaison facile entre les catégories (principe de perception pré-attentive).</li><li><strong>Dépenses par canal :</strong> Un <strong>graphique en anneau (donut)</strong> ou un <strong>camembert</strong> pour visualiser la répartition du budget. Cependant, les comparaisons sont plus difficiles avec un camembert qu'avec un graphique à barres. On peut combiner les deux.</li><li><strong>ROAS par canal :</strong> Un <strong>graphique à barres horizontales</strong> pour comparer le retour sur investissement. Les barres horizontales sont plus lisibles pour des labels longs.</li></ul>"
        },
        {
          "question": "2) Proposer un agencement (layout) pour ce tableau de bord, en justifiant la hiérarchie visuelle et l'organisation des informations. Vous pouvez décrire l'organisation en lignes et colonnes.",
          "reponse": "<p><strong>Layout proposé :</strong></p><ol><li><strong>En-tête :</strong> Titre du dashboard, date, filtres (période, canal, etc.).</li><li><strong>Ligne 1 : KPI cards</strong> (CTR, CPC, CPA, ROAS) - les plus importants, lecture immédiate.</li><li><strong>Ligne 2 : Graphiques principaux</strong> (deux colonnes) : à gauche, un graphique à barres des clics et conversions par canal ; à droite, un graphique des dépenses par canal (donut ou barres).</li><li><strong>Ligne 3 : Graphiques secondaires</strong> (deux colonnes) : à gauche, un graphique du ROAS par canal (barres horizontales) ; à droite, un graphique de l'évolution temporelle des clics (courbe) pour voir les tendances.</li></ol><p><strong>Justification :</strong> Les KPI cards sont en haut (les plus importants, lecture immédiate). Les graphiques sont organisés par thème (performance par canal, dépenses, rentabilité, tendance). Les barres sont utilisées pour les comparaisons (canaux), les courbes pour les tendances.</p>"
        },
        {
          "question": "3) Discuter des choix de couleurs et de typographie que vous feriez pour ce dashboard. Expliquer comment ces choix peuvent améliorer la clarté et l'efficacité du tableau de bord.",
          "reponse": "<p><strong>Choix de couleurs :</strong></p><ul><li>Utiliser une <strong>palette de couleurs limitée</strong> (4-5 couleurs maximum), de préférence les couleurs de la charte graphique du client.</li><li>Attribuer une <strong>couleur spécifique à chaque canal</strong> (ex: bleu pour l'email, orange pour les réseaux sociaux, vert pour le display). Cela permet une identification rapide.</li><li>Utiliser le <strong>rouge pour les alertes</strong> (ex: CPA en hausse) et le <strong>vert pour les performances positives</strong> (ex: ROAS élevé).</li><li><strong>Éviter les couleurs trop vives ou saturées</strong> qui fatiguent l'œil. Utiliser des couleurs apaisantes (pastel) pour les arrière-plans.</li></ul><p><strong>Choix de typographie :</strong></p><ul><li>Utiliser une <strong>police sans-serif</strong> (Arial, Helvetica, Open Sans) pour une meilleure lisibilité à l'écran.</li><li>Mettre en <strong>gras ou en plus grand</strong> les informations clés (les KPI).</li><li>Utiliser des <strong>titres explicites</strong> pour chaque graphique.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Résolution d'un Conflit d'Éthique en Design",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333; font-family: sans-serif;'>\n  <p>Vous êtes responsable d'une équipe de visualisation de données pour une grande entreprise. L'équipe marketing souhaite un graphique qui montre une augmentation spectaculaire des ventes après le lancement d'une nouvelle campagne. Cependant, vous savez que cette augmentation est en partie due à un effet de saisonnalité et à une promotion exceptionnelle qui n'est pas reconductible.</p>\n  <p>L'équipe marketing insiste pour que le graphique soit conçu pour \"impressionner la direction\" et suggère de :</p>\n  <ul style='margin: 10px 0; padding-left: 20px;'>\n    <li>Commencer l'axe des y à une valeur élevée pour exagérer la hausse.</li>\n    <li>Utiliser des couleurs vives et des effets 3D pour rendre le graphique plus \"attrayant\".</li>\n    <li>Ajouter une flèche et du texte en gras pour souligner la hausse.</li>\n  </ul>\n  <p>Vous êtes en désaccord avec ces suggestions car elles déforment la réalité et vont à l'encontre des principes de design éthique et de transparence.</p>\n</div>",
      "questions": [
        {
          "question": "1) Rappeler les principes de design et d'éthique qui sont en jeu dans cette situation. Expliquer pourquoi les suggestions de l'équipe marketing sont problématiques.",
          "reponse": "<p><strong>Principes de design en jeu :</strong></p><ul><li><strong>Intégrité des données :</strong> Le graphique doit représenter fidèlement les données. Tromper intentionnellement le public est contraire à l'éthique.</li><li><strong>Échelles trompeuses :</strong> Commencer l'axe des y à une valeur élevée exagère artificiellement la hausse. C'est une pratique courante et trompeuse.</li><li><strong>Chart junk :</strong> Les effets 3D et les éléments décoratifs superflus distraient et ne rajoutent pas d'information.</li></ul><p><strong>Principes éthiques :</strong></p><ul><li><strong>Responsabilité :</strong> Le data scientist est responsable de l'intégrité des informations qu'il communique.</li><li><strong>Transparence :</strong> Il est important d'être transparent sur les limites des données et le contexte.</li></ul>"
        },
        {
          "question": "2) Proposer une solution qui permette de satisfaire à la fois le besoin de l'équipe marketing (mettre en valeur le succès de la campagne) et votre devoir de transparence et d'éthique.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
