<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Visualisation de Données Avancée - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Analyse d'un Jeu de Données",
     "points": "8 pts",
     "enonce": "<p>Vous êtes chargé d'analyser un jeu de données contenant les ventes d'une entreprise de commerce électronique au Cameroun. Le fichier CSV inclut les colonnes suivantes : <code>date</code> (format AAAA-MM-JJ), <code>ventes</code> (en FCFA), <code>region</code> (Douala, Yaoundé, Garoua, etc.), <code>categorie</code> (Électronique, Vêtements, Alimentation, etc.).</p>",
     "questions": [
       {
         "question": "<p><strong>1.1 (2 pts)</strong> – Identifier le type de chaque variable (quantitative continue, quantitative discrète, qualitative nominale, qualitative ordinale) et justifier votre réponse.</p>",
         "reponse": "<ul><li><strong>date</strong> : variable quantitative continue (peut être traitée comme une série temporelle continue).</li><li><strong>ventes</strong> : variable quantitative continue (mesure en FCFA).</li><li><strong>region</strong> : variable qualitative nominale (catégories sans ordre).</li><li><strong>categorie</strong> : variable qualitative nominale (catégories sans ordre).</li></ul><p>Il est essentiel de bien identifier le type de variable pour choisir les représentations graphiques appropriées, car les graphiques adaptés aux variables quantitatives ne conviennent pas aux variables qualitatives et inversement [citation:3].</p>"
       },
       {
         "question": "<p><strong>1.2 (3 pts)</strong> – Proposer un type de graphique adapté pour chaque analyse suivante : <br>a) Évolution des ventes sur l'année. <br>b) Comparaison des ventes par région. <br>c) Distribution des ventes par catégorie.</p>",
         "reponse": "<p><strong>a) Évolution des ventes</strong> : <strong>Graphique en courbes</strong> (line chart). Idéal pour visualiser les tendances temporelles et identifier les saisonnalités.</p><p><strong>b) Comparaison par région</strong> : <strong>Diagramme à barres</strong> (bar chart). Permet de comparer facilement les performances des régions entre elles.</p><p><strong>c) Distribution par catégorie</strong> : <strong>Diagramme à barres</strong> ou <strong>diagramme circulaire</strong> (pie chart) si le nombre de catégories est limité [citation:4].</p>"
       },
       {
         "question": "<p><strong>1.3 (3 pts)</strong> – Décrire les étapes de préparation des données avant la visualisation (nettoyage, transformation, validation) en expliquant leur importance.</p>",
         "reponse": "<p><strong>1. Nettoyage des données</strong> : Suppression des valeurs manquantes ou aberrantes, correction des erreurs de saisie (ex : dates incorrectes), dédoublonnage des enregistrements. Cette étape est cruciale pour éviter des conclusions erronées.</p><p><strong>2. Transformation des données</strong> : Conversion des types (date en datetime), agglomération des données (ex : ventes mensuelles), création de nouvelles variables (ex : mois, année). Cela permet d'adapter les données au format requis par l'outil de visualisation.</p><p><strong>3. Validation des données</strong> : Vérification de la cohérence (ex : les ventes ne peuvent pas être négatives) et de l'intégrité des données. Cette étape garantit la fiabilité des résultats [citation:4].</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Visualisations Interactives (6 pts)",
     "points": "6 pts",
     "enonce": "<p>Vous avez créé un graphique interactif avec Plotly. Vous devez maintenant l'intégrer dans une application Streamlit.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1 (2 pts)</strong> – Expliquer brièvement comment Streamlit permet de créer rapidement des applications de data science, et en quoi cette approche diffère des tableaux de bord statiques.</p>",
         "reponse": "<p>Streamlit est un framework Python qui permet de transformer un script en application web interactive en quelques lignes de code, sans avoir à gérer le HTML, CSS ou JavaScript [citation:2].</p><p>Contrairement aux tableaux de bord statiques (ex : rapports PDF), Streamlit rend l'utilisateur acteur de l'exploration : il peut interagir avec des widgets (sliders, menus déroulants) et voir les graphiques se mettre à jour en temps réel. C'est un exemple de <strong>data visualisation de niveau 3</strong> où l'utilisateur découvre par lui-même les données [citation:5].</p>"
       },
       {
         "question": "<p><strong>2.2 (2 pts)</strong> – Écrire un extrait de code Python pour créer un graphique Plotly dans Streamlit (utiliser <code>st.plotly_chart</code>) à partir d'un DataFrame Pandas <code>df</code> contenant les colonnes <code>date</code> et <code>ventes</code>.</p>",
         "reponse": "<pre><code>import streamlit as st<br>import plotly.express as px<br>import pandas as pd<br><br># Chargement des données (exemple)<br>df = pd.read_csv('ventes.csv')<br><br># Création du graphique Plotly<br>fig = px.line(df, x='date', y='ventes', title='Évolution des ventes')<br><br># Affichage dans Streamlit<br>st.plotly_chart(fig)</code></pre>"
       },
       {
         "question": "<p><strong>2.3 (2 pts)</strong> – Justifier l'utilisation de <code>st.plotly_chart</code> par rapport à <code>st.pyplot</code> pour intégrer ce graphique.</p>",
         "reponse": "<p><code>st.pyplot</code> intégrerait un graphique Matplotlib statique, tandis que <code>st.plotly_chart</code> intègre un graphique Plotly interactif.</p><p>Plotly permet de zoomer, de survoler pour voir les valeurs exactes, et de sélectionner des zones. Cette interactivité est plus riche et mieux adaptée à l'exploration des données, ce qui correspond à une visualisation de niveau 3 [citation:5].</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Storytelling avec Données (6 pts)",
     "points": "6 pts",
     "enonce": "<p>Vous devez présenter vos résultats sur les ventes au comité de direction. Vous choisissez de raconter une histoire avec vos données (data storytelling) plutôt que de présenter une série de graphiques sans lien.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1 (2 pts)</strong> – Identifier et décrire les trois étapes d'une histoire avec données (introduction, développement, conclusion).</p>",
         "reponse": "<p><strong>1. Introduction</strong> : Présente le contexte (entreprise, marché), la question (ex: les ventes sont-elles en hausse ?), et l'importance de l'analyse.</p><p><strong>2. Développement</strong> : Présente les découvertes progressivement, en utilisant des graphiques pour soutenir chaque point. Répond aux questions posées dans l'introduction.</p><p><strong>3. Conclusion</strong> : Résume les enseignements et propose des recommandations concrètes (ex : investir dans une région, lancer une promotion).</p><p>Cette structure permet de guider le public de manière logique et de renforcer la mémorisation des informations [citation:1].</p>"
       },
       {
         "question": "<p><strong>3.2 (2 pts)</strong> – Proposer un plan de story pour le cas des ventes au Cameroun, en indiquant les graphiques à utiliser à chaque étape.</p>",
         "reponse": "<p><strong>Introduction</strong> : Montrer l'évolution nationale des ventes sur 3 ans avec un <strong>graphique en courbes</strong> pour poser le contexte.</p><p><strong>Développement</strong> :</p><ul><li>Comparer les régions avec un <strong>diagramme à barres</strong> pour identifier les meilleures et les moins bonnes.</li><li>Analyser la saisonnalité avec un <strong>graphique en courbes</strong> par mois.</li><li>Comparer les catégories avec un <strong>diagramme à barres</strong> ou un <strong>diagramme circulaire</strong>.</li></ul><p><strong>Conclusion</strong> : Proposer des actions spécifiques pour chaque région (ex: augmenter les stocks à Douala avant la fin d'année) à l'aide d'un <strong>tableau de bord synthétique</strong>.</p>"
       },
       {
         "question": "<p><strong>3.3 (2 pts)</strong> – Expliquer pourquoi le data storytelling est plus efficace qu'une simple présentation de chiffres pour convaincre des décideurs.</p>",
         "reponse": "<p>Le storytelling transforme des données abstraites en un récit humain. Il crée une connexion émotionnelle et rend les informations mémorables [citation:1].</p><p>Une simple présentation de chiffres (niveau 0 de la data visualisation) est difficile à digérer, surtout pour des non-spécialistes [citation:5]. Le storytelling structure les informations, les rend plus accessibles et guide le public vers les conclusions souhaitées, ce qui facilite la prise de décision [citation:4].</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
