<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "titre": "Introduction à la Visualisation Géospatiale",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e;'>Qu'est-ce que la Visualisation Géospatiale ?</h2><div style='background-color: #e8f5e9; padding: 15px; border-radius: 10px; color: #1b5e20; margin: 10px 0;'><p style='font-size: 1em;'><strong>Définition :</strong> La visualisation géospatiale est l'art et la science de représenter des données qui ont une composante géographique (localisation) sous forme de cartes ou de graphiques interactifs.</p></div><ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'><li><strong>Objectif :</strong> Révéler des tendances, des motifs et des relations spatiales qui ne sont pas visibles dans des tableaux de données classiques.</li><li><strong>Applications :</strong> Urbanisme, environnement, santé publique, logistique, marketing, etc.</li><li><strong>Outils Python :</strong> Folium, Plotly, GeoPandas, Matplotlib, etc.</li><li><strong>Données :</strong> Coordonnées (latitude/longitude), adresses, codes postaux, régions, etc.</li></ul></div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons aborder un sujet passionnant : la visualisation géospatiale. La visualisation géospatiale, c'est l'utilisation de cartes et de représentations graphiques pour analyser des données qui ont une localisation géographique. Par exemple, les données de ventes par région, la répartition des populations, ou encore les trajets de transport. L'objectif est de révéler des tendances et des motifs qui ne sont pas visibles dans des tableaux de données classiques. Au Cameroun, la visualisation géospatiale peut être utilisée dans de nombreux domaines : pour la planification urbaine à Douala et Yaoundé, pour l'analyse des données agricoles, ou encore pour le suivi des épidémies. Dans ce projet, nous allons utiliser plusieurs outils Python comme Folium, Plotly et GeoPandas.",
    "note": "La visualisation géospatiale est un domaine en pleine croissance, avec de nombreuses applications concrètes."
  },
  {
    "titre": "Les Outils Python pour la Géospatiale",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e;'>Outils Python pour la Visualisation Géospatiale</h2><p style='font-size: 0.95em;'>Plusieurs bibliothèques Python sont disponibles pour la visualisation géospatiale :</p><div style='display: flex; flex-wrap: wrap; gap: 15px; margin: 10px 0;'><div style='background-color: #e3f2fd; padding: 15px; border-radius: 8px; flex: 1 1 45%; color: #0d47a1;'><h3>Folium</h3><ul style='font-size: 0.9em; padding-left: 15px;'><li><strong>Basé sur Leaflet.js</strong> (bibliothèque JavaScript interactive).</li><li><strong>Idéal pour :</strong> Cartes interactives simples, markers, popups, heatmaps.</li><li><strong>Avantage :</strong> Très intuitif, facile à prendre en main.</li></ul></div><div style='background-color: #e8f5e9; padding: 15px; border-radius: 8px; flex: 1 1 45%; color: #1b5e20;'><h3>Plotly</h3><ul style='font-size: 0.9em; padding-left: 15px;'><li><strong>Graphiques interactifs</strong> avec zoom, hover, etc.</li><li><strong>Idéal pour :</strong> Cartes choroplèthes, scatter mapbox, animations.</li><li><strong>Avantage :</strong> S'intègre bien avec Dash pour des applications web.</li></ul></div><div style='background-color: #f3e5f5; padding: 15px; border-radius: 8px; flex: 1 1 45%; color: #4a148c;'><h3>GeoPandas</h3><ul style='font-size: 0.9em; padding-left: 15px;'><li><strong>Manipulation de données géospatiales</strong> (shapefiles, GeoJSON).</li><li><strong>Idéal pour :</strong> Traiter et analyser des données spatiales.</li><li><strong>Avantage :</strong> S'intègre avec Pandas et Matplotlib.</li></ul></div><div style='background-color: #fff3e0; padding: 15px; border-radius: 8px; flex: 1 1 45%; color: #e65100;'><h3>Matplotlib + Basemap</h3><ul style='font-size: 0.9em; padding-left: 15px;'><li><strong>Visualisation statique</strong> de données géospatiales.</li><li><strong>Idéal pour :</strong> Cartes simples, contours, etc.</li><li><strong>Avantage :</strong> Très personnalisable.</li></ul></div></div></div>",
    "texteParle": "Pour réaliser notre projet de visualisation géospatiale, nous allons utiliser plusieurs bibliothèques Python. La première est Folium, qui est basée sur la bibliothèque JavaScript Leaflet. Folium permet de créer des cartes interactives très facilement, avec des markers, des popups et des heatmaps. La deuxième est Plotly, qui permet de créer des graphiques interactifs et des cartes choroplèthes. Plotly s'intègre très bien avec Dash si vous voulez créer des applications web. La troisième est GeoPandas, qui est une extension de Pandas pour manipuler des données géospatiales comme des shapefiles ou des GeoJSON. Enfin, nous avons Matplotlib qui peut être utilisé pour des visualisations statiques. Dans ce projet, nous allons principalement utiliser Folium et Plotly.",
    "note": "Chaque outil a ses forces : Folium pour l'interactivité simple, Plotly pour les choroplèthes, GeoPandas pour la manipulation de données."
  },
  {
    "titre": "Chargement des Données Géospatiales",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e;'>Charger des Données Géospatiales</h2><p style='font-size: 0.95em;'>Les données géospatiales peuvent prendre différentes formes :</p><div style='display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0;'><div style='background-color: #e8eaf6; padding: 15px; border-radius: 8px; flex: 1 1 30%; color: #1a237e;'><h4>Fichiers de formes (Shapefiles)</h4><ul style='font-size: 0.9em; padding-left: 15px;'><li>Format standard pour les données vectorielles.</li><li>Contient des points, des lignes, des polygones.</li><li>Se charge avec <strong>GeoPandas</strong>.</li></ul></div><div style='background-color: #e0f2f1; padding: 15px; border-radius: 8px; flex: 1 1 30%; color: #004d40;'><h4>GeoJSON</h4><ul style='font-size: 0.9em; padding-left: 15px;'><li>Format JSON pour les données géographiques.</li><li>Léger et facile à utiliser.</li><li>Se charge avec <strong>GeoPandas</strong> ou <strong>json</strong>.</li></ul></div><div style='background-color: #fce4ec; padding: 15px; border-radius: 8px; flex: 1 1 30%; color: #b71c1c;'><h4>Coordonnées CSV</h4><ul style='font-size: 0.9em; padding-left: 15px;'><li>Fichiers avec des colonnes latitude/longitude.</li><li>Se charge avec <strong>Pandas</strong>.</li><li>Facile à utiliser avec <strong>Folium</strong>.</li></ul></div></div><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; border-left: 5px solid #f57f17; color: #e65100;'><p style='font-size: 0.95em;'><strong>Exemple :</strong> Charger un fichier CSV avec Pandas puis créer une carte Folium avec les coordonnées.</p></div></div>",
    "texteParle": "Avant de créer des cartes, nous devons charger nos données géospatiales. Ces données peuvent prendre plusieurs formes. La première est le shapefile, un format standard pour les données vectorielles qui contient des points, des lignes ou des polygones. On peut les charger avec GeoPandas. La deuxième est le GeoJSON, qui est un format JSON pour les données géographiques. C'est un format léger et facile à utiliser. Enfin, nous avons les simples fichiers CSV qui contiennent des colonnes de latitude et de longitude. On peut les charger avec Pandas. Dans notre projet, nous allons utiliser principalement des CSV avec des coordonnées, car c'est le format le plus simple et le plus courant.",
    "note": "Les shapefiles sont composés de plusieurs fichiers (.shp, .shx, .dbf) qu'il faut tous avoir."
  },
  {
    "titre": "Créer une Carte avec Folium",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e;'>Créer une Carte de Base avec Folium</h2><div style='background-color: #e0f2f1; padding: 15px; border-radius: 8px; color: #004d40; margin: 10px 0;'><p style='font-size: 1em;'><strong>Code minimal :</strong></p><pre style='background-color: #263238; color: #e0e0e0; padding: 10px; border-radius: 5px; font-size: 0.85em;'>import folium<br># Créer une carte centrée sur Yaoundé<br>m = folium.Map(location=[3.8480, 11.5021], zoom_start=12)<br># Afficher la carte<br>m.save('carte_yaounde.html')</pre></div><ul style='font-size: 0.95em; line-height: 1.6; padding-left: 20px;'><li><strong>location :</strong> Coordonnées [latitude, longitude] du centre.</li><li><strong>zoom_start :</strong> Niveau de zoom initial (1 à 18).</li><li><strong>tiles :</strong> Type de fond de carte ('OpenStreetMap', 'Stamen Terrain', etc.).</li></ul><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; border-left: 5px solid #f57f17; color: #e65100;'><p style='font-size: 0.95em;'><strong>Exemple :</strong> <code>folium.Map(location=[3.8480, 11.5021], zoom_start=10, tiles='Stamen Terrain')</code></p></div></div>",
    "texteParle": "Commençons par créer une carte de base avec Folium. La première étape est d'importer la bibliothèque Folium. Ensuite, on crée une carte avec la fonction Map. On doit spécifier les coordonnées du centre de la carte, par exemple celles de Yaoundé avec la latitude 3.8480 et la longitude 11.5021. On peut aussi définir le niveau de zoom initial, par exemple 12. On peut également choisir le type de fond de carte, comme OpenStreetMap ou Stamen Terrain. Pour afficher la carte, on peut la sauvegarder dans un fichier HTML. C'est très simple et cela ne prend que quelques lignes de code. Vous pouvez ouvrir ce fichier HTML dans votre navigateur pour voir la carte interactive.",
    "note": "Les coordonnées sont en degrés décimaux : latitude (Nord/Sud) et longitude (Est/Ouest)."
  },
  {
    "titre": "Ajouter des Markers et Popups",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e;'>Ajouter des Markers et des Popups</h2><p style='font-size: 0.95em;'>Les markers permettent de marquer des points d'intérêt sur la carte :</p><div style='background-color: #e0f2f1; padding: 15px; border-radius: 8px; color: #004d40; margin: 10px 0;'><p style='font-size: 1em;'><strong>Code :</strong></p><pre style='background-color: #263238; color: #e0e0e0; padding: 10px; border-radius: 5px; font-size: 0.85em;'>import folium<br><br>m = folium.Map(location=[3.8480, 11.5021], zoom_start=12)<br><br># Ajouter un marker<br>folium.Marker(<br>    location=[3.8480, 11.5021],<br>    popup='Yaoundé',<br>    icon=folium.Icon(color='red', icon='info-sign')<br>).add_to(m)<br><br># Ajouter un deuxième marker<br>folium.Marker(<br>    location=[3.8667, 11.5167],<br>    popup='<strong>Université de Yaoundé I</strong>',<br>    icon=folium.Icon(color='blue', icon='university', prefix='fa')<br>).add_to(m)<br><br>m.save('carte_markers.html')</pre></div></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
