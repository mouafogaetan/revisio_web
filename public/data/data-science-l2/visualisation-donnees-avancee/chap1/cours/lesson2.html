<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;

        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {

        padding: 18px 16px 10px 16px;

    }

    .slide-header h1 {

        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;

        display: flex;
        flex-direction: column;
        gap: 14px;

    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {

    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;

        }

        .btn-play {

            margin-bottom: 20px;

    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;

    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;

    }
    .content-card {

        border: 1px solid rgba(0,0,0,0.08) !important;

    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {

    }
    .slide-counter {

    .btn {

<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>

            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>

            </button>

                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>

                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = {
  "matiere": "Éthique, Gouvernance et Conformité - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur l'Éthique et la Gouvernance",
      "points": "6 pts",
      "enonce": "Cet exercice porte sur les fondamentaux de l'éthique, des biais algorithmiques et de la gouvernance des données. Répondez de manière claire et structurée aux questions suivantes.",
      "questions": [
        {
          "question": "<strong>1. Définitions (2 pts) :</strong><br>a) En quelques phrases, distinguez les concepts d'<em>éthique</em>, de <em>déontologie</em> et de <em>conformité légale</em> en vous appuyant sur des exemples concrets en Data Science.<br><br>b) Expliquez ce qu'est un <em>biais algorithmique</em> et citez deux sources principales de ce type de biais.",
          "reponse": "<strong>a) Distinction Éthique, Déontologie et Conformité :</strong><br>L'<strong>éthique</strong> est une réflexion philosophique sur ce qui est bien ou mal, juste ou injuste. Elle fixe des principes moraux généraux. En Data Science, l'éthique questionne, par exemple, s'il est juste d'utiliser un système de notation de crédit qui pourrait défavoriser certains groupes sociaux. La <strong>déontologie</strong> est un ensemble de règles et de devoirs propres à une profession. Elle traduit les principes éthiques en comportements attendus. Un data scientist s'engage, par exemple, à respecter une charte déontologique qui l'oblige à ne pas manipuler les données pour tromper l'utilisateur. Enfin, la <strong>conformité légale</strong> est l'obligation de se conformer aux lois et règlements en vigueur. En Europe, un data scientist doit se conformer au RGPD [citation:4] pour la protection des données personnelles. Bien que distinctes, ces notions sont liées : l'éthique inspire la déontologie, et la conformité est un cadre minimal, parfois moins exigeant que l'éthique.<br><br><strong>b) Biais algorithmique et ses sources :</strong><br>Un <strong>biais algorithmique</strong> est une erreur systématique et non aléatoire dans un système informatique qui crée des résultats injustes, discriminatoires ou préférentiels envers certaines personnes ou groupes. Il ne s'agit pas d'un bug, mais d'un reflet des données ou du contexte de conception. Les deux principales sources sont :<br><br><strong>1. Les données :</strong> Les données utilisées pour entraîner un algorithme peuvent contenir des biais historiques. Par exemple, si un modèle d'embauche est entraîné sur des données historiques d'une entreprise qui a majoritairement embauché des hommes, il apprendra à favoriser les profils masculins.<br><strong>2. La conception :</strong> Les choix effectués par les concepteurs peuvent introduire des biais. Le choix de certaines variables (features) peut être discriminatoire. Par exemple, utiliser le code postal comme indicateur peut indirectement introduire un biais racial si les quartiers sont socialement ségrégués. L'objectif de performance peut également négliger l'équité, créant un biais dans l'optimisation de l'algorithme [citation:1]."
        },
        {
          "question": "<strong>2. L'Équité en ML (2 pts) :</strong><br>Définissez brièvement deux mesures d'équité (fairness) parmi les suivantes : <em>Disparate Impact</em>, <em>Equalized Odds</em>. Expliquez ensuite pourquoi il est difficile de les satisfaire toutes simultanément.",
          "reponse": "<strong>Définitions de mesures d'équité :</strong><br><br><strong>Disparate Impact (ou Impact Différentiel) :</strong> Cette mesure exige que le taux de décisions positives (ou de prédictions favorables) soit approximativement égal pour les différents groupes (ex: hommes/femmes). Par exemple, si un algorithme de recrutement sélectionne 50% des candidats hommes et seulement 20% des candidates femmes, alors il y a un disparate impact à l'encontre des femmes. Une règle courante est que le ratio de ces taux ne doit pas être inférieur à 0,8 (la fameuse règle des 4/5).<br><br><strong>Equalized Odds (ou Probabilités Égalisées) :</strong> Cette mesure est plus exigeante. Elle stipule que les taux de vrais positifs (TPR) et de faux positifs (FPR) doivent être identiques pour tous les groupes. Cela signifie que la performance du modèle (sa capacité à bien classer) doit être équivalente pour chaque groupe, qu'il s'agisse de prédire correctement un événement (TPR) ou de faire une fausse alerte (FPR).<br><br><strong>L'impossibilité de satisfaire toutes les mesures :</strong><br>Il est extrêmement difficile, voire impossible, de satisfaire simultanément toutes les définitions de l'équité, en particulier lorsque les données sous-jacentes sont différentes entre les groupes. Par exemple, si un groupe a un taux de base (base rate) de récidive plus élevé (comme dans le cas du logiciel COMPAS aux États-Unis), satisfaire à la fois le <em>Disparate Impact</em> et l'<em>Equalized Odds</em> devient impossible. Cet arbitrage, connu sous le nom d'<em>impossibilité statistique</em>, oblige les concepteurs à faire un choix moral explicite sur la définition de l'équité qu'ils souhaitent privilégier dans leur contexte d'application."
        },
        {
          "question": "<strong>3. Gouvernance des Données (2 pts) :</strong><br>a) Définissez la gouvernance des données et listez ses principaux composants.<br><br>b) Quels sont les rôles et responsabilités principaux des <em>Data Owner</em>, <em>Data Steward</em> et <em>Data Custodian</em> ?",
          "reponse": "<strong>a) Définition et Composants de la Gouvernance des Données :</strong><br>La <strong>gouvernance des données</strong> est l'ensemble des processus, politiques, standards et technologies qui assurent la gestion efficace, efficiente et conforme des données au sein d'une organisation. Son objectif est de garantir que les données sont traitées comme un actif stratégique, tout en maîtrisant les risques (sécurité, conformité). Ses principaux composants sont :<br><br><strong>Les politiques :</strong> Documents définissant les règles d'utilisation, d'accès et de protection des données.<br><strong>Les standards :</strong> Normes techniques et métier à suivre (ex: format des données, règles de nommage).<br><strong>Les processus :</strong> Procédures opérationnelles pour la collecte, le stockage, le nettoyage et la suppression des données.<br><strong>Les rôles et responsabilités :</strong> Définition claire de qui fait quoi, comme détaillé ci-dessous.<br><br><strong>b) Rôles et Responsabilités :</strong><br><br><strong>1. Data Owner (Propriétaire des Données) :</strong> Il s'agit généralement d'un responsable métier de haut niveau qui a l'autorité décisionnelle sur les données d'un domaine spécifique (ex: le directeur marketing est le Data Owner des données clients). Sa responsabilité principale est de garantir la qualité et la conformité des données de son périmètre. Il approuve les politiques d'accès et de sécurité, et est le garant ultime de la valeur des données. Il est responsable devant la direction et les régulateurs [citation:1].<br><br><strong>2. Data Steward (Intendant des Données) :</strong> C'est le responsable opérationnel de la gouvernance des données. Il assure la mise en œuvre des politiques définies par le Data Owner. Il veille à la qualité des données (complétude, exactitude) [citation:1], à la documentation des métadonnées, et sert d'interface entre le métier (Data Owner) et l'IT (Data Custodian). Il est le 'pom-pom girl' et le gardien de la qualité des données au quotidien.<br><br><strong>3. Data Custodian (Dépositaire des Données) :</strong> C'est un rôle technique, souvent tenu par l'équipe informatique (administrateur base de données, ingénieur cloud). Sa responsabilité est la mise en œuvre et le maintien des outils de stockage, de sauvegarde et de sécurité. Il est chargé de l'intégrité physique des données, de la gestion des accès techniques et des performances des systèmes. Il suit les instructions du Data Steward pour l'application des règles techniques (ex: effectuer une sauvegarde, restreindre un accès réseau)."

          "reponse": "<strong>Analyse des Risques :</strong><br>La proposition du chef de produit est non seulement problématique, mais dangereuse pour la startup. Elle entre en conflit direct avec les obligations légales liées à la fois au traitement des données personnelles (RGPD) et à l'IA (AI Act).<br><br><strong>Problèmes soulevés :</strong><br>1. <strong>Manquement à l'AIPD (RGPD) :</strong> Le RGPD exige qu'une <strong>Analyse d'Impact sur la Protection des Données (AIPD)</strong> soit réalisée lorsque le traitement est susceptible d'engendrer un risque élevé pour les droits et libertés des personnes [citation:10]. Le traitement massif de données de santé par une IA pour le diagnostic entre clairement dans cette catégorie. Ne pas réaliser d'AIPD est une infraction directe. L'AIPD doit évaluer la nécessité, la proportionnalité du traitement et identifier les risques (ex: biais de diagnostic, fuite de données) [citation:10].<br>2. <strong>Défaut de Documentation et de Traçabilité (AI Act) :</strong> L'AI Act impose un système de gestion des risques et des exigences de documentation strictes pour les systèmes à haut risque [citation:6]. Sans documentation, impossible de prouver que les exigences de transparence, de gestion des risques et de gouvernance des données sont respectées. En cas d'incident (un mauvais diagnostic), l'absence de documentation rendra l'entreprise automatiquement responsable, car elle ne pourra pas prouver avoir pris les mesures nécessaires.<br><br><strong>Risques Juridiques Majeurs :</strong><br><br><strong>1. Sanctions Financières :</strong> L'entreprise s'expose à des amendes astronomiques. Sous le RGPD, les amendes peuvent atteindre 20 millions d'euros ou 4% du chiffre d'affaires annuel mondial [citation:12]. Sous l'AI Act, pour un système à haut risque, les amendes peuvent aller jusqu'à 35 millions d'euros ou 7% du CA mondial [citation:12]. Ces deux régimes peuvent s'appliquer cumulativement.<br><strong>2. Responsabilité Civile :</strong> En l'absence de documentation et de preuve d'un processus rigoureux, la startup serait en position de faiblesse en cas de plainte. Un patient pourrait intenter une action en justice pour un préjudice lié à un diagnostic erroné ou à un traitement inéquitable, et l'entreprise pourrait être tenue responsable pour négligence."

          "reponse": "<strong>Obligations Légales :</strong><br><br><strong>a) Au titre du RGPD :</strong> Le système de MedPredict traitant des données de santé, les droits des patients (personnes concernées) sont fondamentaux. Deux droits cruciaux sont :<br><br><strong>1. Droit d'Accès et de Rectification (Articles 15 et 16 du RGPD) :</strong> Chaque patient a le droit de demander l'accès à ses données personnelles et d'obtenir leur rectification si elles sont inexactes. Si l'IA utilise des données médicales erronées, le patient a le droit de les faire corriger. Il a aussi le droit d'obtenir une copie des données utilisées par l'IA.<br><strong>2. Droit d'Opposition à la Décision Automatisée (Article 22 du RGPD) :</strong> Le patient a le droit de ne pas être soumis à une décision fondée exclusivement sur un traitement automatisé, y compris le profilage, produisant des effets juridiques ou l'affectant de manière significative. Même si MedPredict est un outil d'aide au diagnostic, le patient peut demander qu'une intervention humaine soit systématique dans son cas [citation:2][citation:10].<br><br><strong>b) Au titre de l'AI Act :</strong> Le système étant classifié comme <strong>'à haut risque'</strong> (impact sur la santé et la sécurité des personnes), MedPredict doit satisfaire à des exigences rigoureuses. Deux d'entre elles sont :<br><br><strong>1. Système de Gestion des Risques :</strong> MedPredict doit établir, mettre en œuvre et documenter un système continu de gestion des risques [citation:6]. Cela signifie identifier les risques connus et prévisibles (ex: biais dans les données d'imagerie qui pourraient conduire à un diagnostic erroné pour un certain groupe ethnique), les évaluer et mettre en place des mesures de mitigation.<br><strong>2. Exigences de Données et de Gouvernance :</strong> MedPredict doit garantir que les données d'entraînement sont pertinentes, représentatives, exemptes d'erreurs et complètes. Il faut une gouvernance stricte des données pour prévenir les biais [citation:1] et assurer la robustesse du modèle. Cela implique de documenter les sources de données, les méthodes de collecte et de prétraitement."

          "reponse": "<strong>a) Protocole d'Audit en 4 Étapes :</strong><br><br><strong>1. Définition du Périmètre et des Métriques d'Équité :</strong> La première étape est de définir en collaboration avec le cabinet qu'est-ce que l'équité signifie pour ce modèle. Quels groupes sont protégés (ex: genre, origine ethnique, âge) ? C'est ici qu'on choisit la ou les métriques d'équité à utiliser. Pour ce cas, on pourrait utiliser le <em>Disparate Impact</em> pour évaluer la différence de taux d'acceptation, et l'<em>Equalized Odds</em> pour s'assurer que le modèle n'est pas plus ou moins performant selon le quartier d'origine [citation:1].<br><strong>2. Collecte et Analyse des Données :</strong> Examiner les données d'entraînement. Rechercher des proxies (variables indirectement liées à l'origine ethnique, comme le code postal), vérifier la représentativité des données pour les différents groupes, et effectuer une analyse exploratoire pour voir s'il existe des disparités statistiques dans les taux de défaut de paiement par groupe. Cette étape est cruciale pour identifier les biais hérités [citation:1].<br><strong>3. Audit du Modèle :</strong> Appliquer le modèle aux données de test et calculer les métriques d'équité définies en étape 1. Pour un modèle 'black box', il est impératif d'utiliser des techniques d'explicabilité comme <strong>SHAP</strong> ou <strong>LIME</strong> [citation:1]. L'objectif est de comprendre quelles variables influencent le plus la décision et si des variables sensibles (ou leurs proxies) ont un poids important dans la décision finale.<br><strong>4. Formulation des Recommandations :</strong> Sur la base des résultats de l'audit, formuler des recommandations. Celles-ci peuvent inclure : la modification des données (prétraitement pour équilibrer), l'utilisation d'une technique de régularisation pour réduire l'impact des variables sensibles (in-processing), ou l'ajustement du seuil de décision pour chaque groupe (post-traitement) [citation:1].<br><br><strong>Importance de la Transparence et de l'Explicabilité :</strong> La transparence est la condition sine qua non d'un audit fiable. Sans elle, on ne peut pas savoir comment le modèle prend ses décisions. L'explicabilité, via des outils comme SHAP ou LIME [citation:1], est cruciale pour :<br>*   <strong>Identifier les biais :</strong> Permet de voir si une variable proxy de la race a une influence décisive.<br>*   <strong>Démontrer la conformité :</strong> Face au RGPD et à l'AI Act, le cabinet doit être capable d'expliquer ses décisions [citation:2][citation:6].<br>*   <strong>Gagner la confiance :</strong> Permet de justifier les décisions auprès des clients et des régulateurs.<br><br><strong>b) Recherche de l'Origine du Biais :</strong><br>Mes premières actions seraient :<br><br><strong>1. Vérifier les données :</strong> Analyser la distribution des variables dans les données d'entraînement. Y a-t-il un déséquilibre dans le nombre de prêts accordés par quartier ? Le taux de défaut de paiement est-il vraiment différent ? Si les données historiques reflètent des pratiques discriminatoires passées, le modèle l'apprendra automatiquement. C'est un <strong>biais de données</strong>.<br><strong>2. Analyser les variables (features) :</strong> Utiliser SHAP pour déterminer quelles variables sont les plus importantes. Si un proxy géographique (code postal) a un poids très élevé, c'est un biais de conception. Même si la variable 'origine ethnique' n'est pas directement utilisée, la conception du modèle et le choix des variables peuvent introduire un biais. <br><strong>3. Examiner le contexte sociétal :</strong> Si l'analyse des données et du modèle ne révèle pas de biais technique direct, le problème peut être d'origine <strong>sociétale</strong>. Par exemple, l'accès à l'information financière ou aux services bancaires peut être inégal selon les quartiers, ce qui affecte les données disponibles. Dans ce cas, le modèle ne fait que refléter une inégalité structurelle, et la solution n'est pas seulement technique mais aussi politique et sociale."

        {
          "question": "<strong>2. Mise en Œuvre de l'Explicabilité (2 pts) :</strong><br>a) Expliquez ce qu'est un modèle 'black box' et pourquoi il pose un problème d'équité dans ce cas.<br><br>b) Comment utiliseriez-vous un outil comme <em>LIME</em> ou <em>SHAP</em> pour analyser les décisions du modèle et fournir des explications aux clients recalés ?",
          "reponse": "<strong>a) Modèle Black Box et Problème d'Équité :</strong><br>Un modèle <strong>'black box'</strong> est un algorithme dont le fonctionnement interne est opaque ou trop complexe pour être compris par un humain. Des modèles comme les réseaux de neurones profonds ou XGBoost, bien que performants, sont réputés pour leur manque d'interprétabilité. Dans le cas de la notation de crédit, le problème d'équité est majeur. Si un client recalé demande 'Pourquoi mon prêt a-t-il été refusé ?', un modèle black box ne peut fournir de réponse claire. L'absence d'explication rend impossible de déterminer s'il y a eu discrimination (directe ou indirecte). De plus, l'AI Act exige de la transparence pour les systèmes à haut risque [citation:6] ; un modèle black box, sans outils d'explicabilité, ne serait pas conforme.<br><br><strong>b) Utilisation de LIME ou SHAP pour une Explication :</strong><br>Je commencerais par utiliser un outil comme <strong>SHAP</strong> (SHapley Additive exPlanations) pour expliquer une décision individuelle. Pour un client dont le prêt a été refusé, j'utiliserais SHAP de la manière suivante :<br><br>1. <strong>Sélection du cas :</strong> Je prends la demande de crédit de ce client spécifique. <br>2. <strong>Exécution de l'outil :</strong> SHAP calcule l'importance de chaque variable dans la prédiction pour ce cas précis. Il assigne une 'valeur SHAP' à chaque variable (ex: revenu, âge, code postal, historique de crédit).<br>3. <strong>Génération de l'explication :</strong> SHAP décompose la prédiction finale en montrant la contribution de chaque variable. On peut visualiser cela avec un graphique en barres ou un 'force plot'. Par exemple : 'Votre demande a été refusée parce que votre ratio d'endettement était trop élevé (ce qui a diminué votre score de 15 points) et votre ancienneté dans votre emploi est inférieure à la moyenne (diminution de 5 points).'<br>4. <strong>Communication :</strong> Cette explication, bien que simplifiée, pourrait être transformée en langage clair pour le client dans une lettre de refus motivée. Cela permet de respecter le principe de transparence du RGPD et d'offrir au client une possibilité de contester ou de comprendre la décision, ce qui est crucial pour un système d'IA responsable [citation:10]."

          "reponse": "<strong>Recommandations pour Améliorer l'Équité :</strong><br>Pour remédier au biais potentiel, je proposerais deux approches complémentaires, l'une agissant sur les données et l'autre sur la décision.<br><br><strong>1. Recommandation en Amont - Prétraitement (Data Preprocessing) :</strong><br>Il faut intervenir sur les données d'entraînement pour supprimer ou atténuer le biais avant qu'il ne soit appris par le modèle. Une technique efficace est la <strong>ré-échantillonnage (reweighting)</strong> ou la <strong>ré-étalonnage des scores</strong>. L'objectif est de rendre les données plus équitables. Par exemple, si l'on constate que le taux d'acceptation historique est plus faible pour les résidents du quartier X, on peut surpondérer les données des 'bons' clients de ce quartier lors de l'entraînement, ou au contraire, sous-pondérer les mauvais exemples des autres quartiers. Une autre approche est l'<strong>anonymisation</strong> pour supprimer ou transformer les variables identifiant le quartier en une variable plus générale qui ne capture pas la sensibilité sociale [citation:4][citation:10]. Cependant, il faut être prudent car cela peut masquer un vrai signal de risque.<br><br><strong>2. Recommandation en Aval - Post-traitement (Post-processing) :</strong><br>Une fois le modèle entraîné, on peut ajuster ses décisions pour garantir l'équité. Cela consiste à modifier les prédictions ou les seuils de décision pour chaque groupe. La technique du <strong>seuil différencié</strong> est une approche courante. Par exemple, le modèle donne une probabilité de défaut pour chaque candidat. L'audit pourrait révéler que pour un même niveau de risque prédit, le taux de rejet est plus élevé pour le quartier X. On pourrait alors définir un seuil d'acceptation plus bas pour le quartier X (et plus haut pour les autres) de manière à ce que les taux d'acceptation ou les taux d'erreurs (faux positifs/négatifs) soient équilibrés, en respectant une métrique comme l'<em>Equalized Odds</em> [citation:1]. Cette approche est plus flexible car elle n'implique pas de réentraîner le modèle, mais elle nécessite un suivi rigoureux pour s'assurer que les performances globales ne sont pas trop dégradées."

    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
