<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>
        MathJax = {

            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Non Supervisé - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Concepts Fondamentaux de l'Analyse Factorielle",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>L'analyse factorielle est un ensemble de méthodes statistiques permettant d'étudier les relations entre variables qualitatives ou quantitatives.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Questions de cours :</strong></p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Définir l'Analyse Factorielle des Correspondances (AFC) et citer <strong>deux</strong> domaines d'application.</p>",
          "reponse": "<p>L'Analyse Factorielle des Correspondances (AFC) est une méthode d'analyse de données <strong>qualitatives</strong> présentées sous forme de <strong>tableau de contingence</strong>. Elle permet d'étudier les relations entre deux variables catégorielles en visualisant les profils des lignes et des colonnes dans un espace réduit.</p><p>Deux domaines d'application :</p><ul><li><strong>Marketing</strong> : analyse des préférences des consommateurs par catégorie de produits.</li><li><strong>Sciences sociales</strong> : étude des corrélations entre catégories socio-professionnelles et comportements.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquer la notion de <strong>profil-ligne</strong> et de <strong>profil-colonne</strong> dans un tableau de contingence.</p>",
          "reponse": "<p><strong>Profil-ligne :</strong> Distribution des fréquences d'une ligne (ex: catégorie de clients) sur l'ensemble des colonnes (ex: produits). C'est le vecteur des proportions de la ligne.</p><p><strong>Profil-colonne :</strong> Distribution des fréquences d'une colonne sur l'ensemble des lignes.</p><p>L'AFC compare ces profils pour identifier les associations entre les modalités des deux variables. Deux lignes sont proches si elles ont des profils similaires sur les colonnes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application de l'AFC",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>On étudie les préférences de loisirs en fonction des tranches d'âge. Le tableau de contingence suivant donne les effectifs :</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><div style='overflow-x: auto;'><table style='width:100%; border-collapse: collapse; text-align: center; margin: 10px 0;'><tr style='background:#2c3e50; color:white;'><th></th><th>Sport</th><th>Lecture</th><th>Cinéma</th><th>Voyage</th></tr><tr><td style='background:#ecf0f1;'>< 25 ans</td><td>45</td><td>10</td><td>35</td><td>20</td></tr><tr><td style='background:#f8f9fa;'>25-50 ans</td><td>30</td><td>25</td><td>25</td><td>40</td></tr><tr><td style='background:#ecf0f1;'>> 50 ans</td><td>15</td><td>40</td><td>15</td><td>30</td></tr></table></div><p style='margin-top: 10px; color: #2c3e50;'>L'objectif est d'analyser les associations entre l'âge et les préférences de loisirs.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Calculer le <strong>profil-ligne</strong> pour la tranche d'âge des <strong>moins de 25 ans</strong> (en pourcentages).</p>",
          "reponse": "<p>Total des moins de 25 ans : 45 + 10 + 35 + 20 = 110</p><p>Profil :</p><ul><li>Sport : 45/110 = <strong>40.9%</strong></li><li>Lecture : 10/110 = <strong>9.1%</strong></li><li>Cinéma : 35/110 = <strong>31.8%</strong></li><li>Voyage : 20/110 = <strong>18.2%</strong></li></ul><p>Ce profil montre que les moins de 25 ans préfèrent majoritairement le sport (40.9%) et le cinéma (31.8%).</p>"
        },
        {
          "question": "<p><strong>2.</strong> Comment interprète-t-on la <strong>distance du χ²</strong> dans l'AFC ? Que signifie une distance nulle entre deux profils ?</p>",
          "reponse": "<p>La distance du χ² est une <strong>distance pondérée</strong> utilisée dans l'AFC pour comparer deux profils. Elle est définie par : $$d^2(i,i') = \\sum_j \\frac{(p_{ij} - p_{i'j})^2}{p_{.j}}$$ où $p_{ij}$ est la proportion de la ligne $i$ dans la colonne $j$, et $p_{.j}$ est la proportion marginale de la colonne $j$.</p><p>Une <strong>distance nulle</strong> entre deux profils signifie qu'ils sont <strong>identiques</strong> (les deux lignes ont exactement la même distribution sur les colonnes). Les deux modalités sont parfaitement associées.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Clustering de Textes (Topic Modeling)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>Un corpus de 500 articles scientifiques doit être analysé pour identifier les thèmes principaux (Topic Modeling).</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Étapes du projet :</strong></p><ul><li>Prétraitement des textes</li><li>Réduction de dimension pour visualisation</li><li>Clustering des articles</li><li>Interprétation des thèmes</li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décrire les <strong>étapes de prétraitement</strong> nécessaires avant d'appliquer un clustering sur des données textuelles.</p>",
          "reponse": "<p>Les étapes de prétraitement sont :</p><ol><li><strong>Tokenization</strong> : découpage du texte en mots (tokens).</li><li><strong>Suppression des stopwords</strong> : élimination des mots fréquents (le, la, et, etc.) qui n'apportent pas d'information sémantique.</li><li><strong>Stemming ou Lemmatization</strong> : réduction des mots à leur racine (ex: 'courant' → 'courir').</li><li><strong>Construction de la matrice document-terme</strong> : chaque document est un vecteur de fréquences des termes.</li><li><strong>Pondération TF-IDF</strong> : pondère les termes par leur importance dans le document et dans le corpus.</li></ol>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquer pourquoi t-SNE ou UMAP sont utilisés après la vectorisation des textes. Quelle est la principale limite de t-SNE sur un grand corpus ?</p>",
          "reponse": "<p>t-SNE et UMAP sont utilisés pour <strong>visualiser</strong> les documents dans un espace 2D ou 3D après réduction de dimension. La vectorisation des textes produit des vecteurs en très haute dimension (le nombre de mots uniques), ce qui rend la visualisation impossible sans réduction.</p><p><strong>Limite de t-SNE :</strong> t-SNE est lent sur les grands corpus car sa complexité est en $O(n^2)$. Il préserve bien la structure <strong>locale</strong> mais pas toujours la structure <strong>globale</strong> (les distances entre clusters éloignés sont mal conservées). UMAP est plus rapide et préserve mieux la structure globale.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Systèmes de Recommandation",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>Une plateforme de streaming souhaite améliorer ses recommandations de films en utilisant le filtrage collaboratif.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> Matrice de notation (10 000 utilisateurs × 5 000 films) avec une très faible densité (0.2% de cellules remplies).</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Quelle approche de filtrage collaboratif (user-based ou item-based) recommandez-vous pour ce problème ? Justifier votre réponse en tenant compte de la taille de la matrice.</p>",
          "reponse": "<p>Je recommande l'approche <strong>item-based</strong> pour les raisons suivantes :</p><ul><li><strong>Scalabilité</strong> : La matrice de similarité des items (5000×5000) est beaucoup plus petite que celle des utilisateurs (10000×10000).</li><li><strong>Stabilité</strong> : Les similarités entre items sont plus stables dans le temps que les similarités entre utilisateurs.</li><li><strong>Efficacité</strong> : Pour un utilisateur, on peut rapidement trouver les films similaires à ceux qu'il a notés.</li><li><strong>Robustesse</strong> : Moins sensible à la parcimonie des données.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Décrire le <strong>problème du cold-start</strong> et proposer <strong>deux</strong> solutions pour le gérer dans ce système de recommandation.</p>",
          "reponse": "<p>Le <strong>cold-start</strong> est le problème de recommandation pour les <strong>nouveaux utilisateurs</strong> (sans historique) ou les <strong>nouveaux items</strong> (sans notations).</p><p><strong>Solutions :</strong></p><ol><li><strong>Approche hybride</strong> : Utiliser le filtrage basé sur le contenu (caractéristiques des films) pour les nouveaux utilisateurs/items, en attendant d'avoir suffisamment de données pour le filtrage collaboratif.</li><li><strong>Exploration contrôlée</strong> : Recommander les films les plus populaires ou les plus récents à l'utilisateur tout en collectant ses préférences via des interactions (clics, visionnages).</li></ol>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Analyse Comparée des Algorithmes",
      "points": "2 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>On cherche à segmenter des clients d'une banque en fonction de leurs comportements financiers.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> 5000 clients avec 6 variables (revenu, âge, nombre de comptes, dettes, épargne, score de crédit).</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Proposer une <strong>stratégie complète</strong> pour réaliser cette segmentation. Décrire les étapes et justifier les choix méthodologiques.</p>",
          "reponse": "<p><strong>Stratégie en 5 étapes :</strong></p><p><strong>1. Prétraitement :</strong> Standardisation (car les variables ont des échelles différentes), traitement des valeurs manquantes (imputation), détection des outliers.</p><p><strong>2. Choix de l'algorithme :</strong></p><ul><li><strong>K-means</strong> : pour une première segmentation rapide et interprétable.</li><li><strong>DBSCAN</strong> : pour détecter des clients atypiques (outliers).</li><li><strong>GMM</strong> : pour un clustering probabiliste si les clusters peuvent se chevaucher.</li></ul><p><strong>3. Évaluation :</strong> Utiliser le coefficient de silhouette et la validation métier (les segments ont-ils un sens commercial ?).</p><p><strong>4. Interprétation :</strong> Analyser les profils des segments (moyennes, médianes) pour nommer chaque cluster (ex: 'Premium', 'Fidèle', 'Occasionnel', 'Endetté').</p><p><strong>5. Recommandations :</strong> Proposer des stratégies de communication et de produits adaptées à chaque segment.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
