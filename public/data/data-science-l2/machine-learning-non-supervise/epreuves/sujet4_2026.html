<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Non Supervisé - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4 - Systèmes de Recommandation et Analyse Factorielle",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Évaluation d'un Système de Recommandation",
      "points": "8 pts",
      "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #0d6efd;'><p>Un site de e-commerce souhaite évaluer son nouveau système de recommandation. Les données suivantes sont disponibles :</p><ul><li>Le modèle A (filtrage collaboratif) prédit les notes avec une <strong>RMSE de 0.85</strong> et une <strong>MAE de 0.72</strong>.</li><li>Le modèle B (filtrage basé sur le contenu) prédit les notes avec une <strong>RMSE de 0.92</strong> et une <strong>MAE de 0.78</strong>.</li><li>Un test A/B en ligne montre que les utilisateurs exposés au modèle A ont un <strong>taux de clic (CTR) de 12%</strong> contre <strong>9%</strong> pour le modèle B.</li><li>La precision@5 du modèle A est de 0.25 et celle du modèle B est de 0.20.</li></ul><p>Le nombre total d'items pertinents pour un utilisateur donné est de 8.</p></div>",
      "questions": [
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>1) (2 pts)</div><div>Expliquer la différence entre une métrique prédictive (RMSE, MAE) et une métrique de ranking (precision@k). Justifier l'importance d'utiliser les deux types de métriques pour évaluer un système de recommandation.</div>",
          "reponse": "<div><p>Les <strong>métriques prédictives</strong> comme la RMSE et la MAE évaluent la capacité du modèle à prédire la valeur exacte des notes. Elles mesurent l'erreur numérique entre la prédiction et la note réelle.</p><p>Les <strong>métriques de ranking</strong> comme la precision@k évaluent la qualité de l'ordre des recommandations proposées. Elles mesurent la pertinence des items recommandés dans le top-k, indépendamment de la valeur de la note prédite.</p><p>Il est <strong>essentiel</strong> d'utiliser les deux types car :<br>- Une bonne RMSE n'implique pas forcément de bonnes recommandations (ex: des notes proches mais des items non pertinents en tête de liste).<br>- Une bonne precision@k ne garantit pas une bonne prédiction des notes (ex: les items pertinents sont bien classés mais les notes estimées sont erronées).</p></div>"
        },
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>2) (2 pts)</div><div>Calculer le recall@5 pour le modèle A sachant que sur les 5 premiers items recommandés, 3 sont pertinents.</div>",
          "reponse": "<div><p><strong>Recall@5 = (Nombre d'items pertinents dans les 5 premiers) / (Nombre total d'items pertinents)</strong></p><p>Recall@5 = 3 / 8 = <strong>0.375 (soit 37.5%)</strong></p></div>"
        },
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>3) (2 pts)</div><div>Comparer les performances des modèles A et B. Expliquer pourquoi le modèle A est préféré malgré une RMSE légèrement inférieure à 1.</div>",
          "reponse": "<div><p>Le <strong>modèle A</strong> est préféré car :<br>- Il a une <strong>RMSE (0.85) et une MAE (0.72)</strong> plus faibles que le modèle B (0.92 et 0.78).<br>- Il a une <strong>precision@5 (0.25)</strong> supérieure à celle du modèle B (0.20).<br>- Le <strong>test A/B</strong> confirme sa supériorité avec un <strong>CTR de 12%</strong> contre 9% pour le modèle B.</p><p>La RMSE est inférieure à 1, ce qui signifie que l'erreur moyenne de prédiction est d'environ 0.85 point sur une échelle de 0 à 10 (ou 1 à 5), ce qui est <strong>acceptable</strong> pour une application de recommandation.</p></div>"
        },
        {
          "question": "<div style='color: #0d6efd; font-weight: bold;'>4) (2 pts)</div><div>Proposer une stratégie pour améliorer encore le système de recommandation. Justifier votre réponse en vous appuyant sur les limites des métriques actuelles.</div>",
          "reponse": "<div><p>Une stratégie serait de <strong>combiner</strong> les approches collaboratives et basées sur le contenu dans un <strong>système hybride</strong>. Cela permettrait de :<br>- <strong>Réduire le cold start</strong> : les nouveaux utilisateurs pourraient recevoir des recommandations basées sur le contenu.<br>- <strong>Améliorer la diversité</strong> des recommandations pour éviter de recommander toujours les mêmes items populaires.</p><p>Les métriques actuelles (RMSE, precision@k, CTR) ne mesurent pas la <strong>diversité</strong> ni la <strong>sérendipité</strong> (surprise agréable). Un test A/B avec des métriques comme le <strong>taux de conversion</strong> ou le <strong>panier moyen</strong> pourrait également être mis en place.</p></div>"
        }
      ]
    },
    {
      "titre": "Analyse des Correspondances Multiples (ACM)",
      "points": "6 pts",
      "enonce": "<div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #198754;'><p>Un institut de sondage a réalisé une enquête sur les habitudes de consommation de 200 personnes. Les variables suivantes ont été collectées :</p><ul><li><strong>Âge</strong> : [18-25], [26-35], [36-50], [50+]</li><li><strong>Catégorie socio-professionnelle (CSP)</strong> : Cadre, Employé, Ouvrier, Étudiant</li><li><strong>Type de produit acheté</strong> : Alimentaire, Électronique, Vêtements, Loisirs</li></ul><p>Un tableau de contingence croisant l'Âge et le Type de produit est donné ci-dessous :</p><table style='width:100%; border-collapse: collapse; margin: 10px 0;'><tr style='background: #198754; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Âge \\ Produit</th><th style='padding: 8px; border: 1px solid #ddd;'>Alimentaire</th><th style='padding: 8px; border: 1px solid #ddd;'>Électronique</th><th style='padding: 8px; border: 1px solid #ddd;'>Vêtements</th><th style='padding: 8px; border: 1px solid #ddd;'>Loisirs</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>18-25</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>26-35</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>36-50</td><td style='padding: 8px; border: 1px solid #ddd;'>30</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>50+</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td></tr></table></div>",
      "questions": [
        {
          "question": "<div style='color: #198754; font-weight: bold;'>1) (2 pts)</div><div>Construire le tableau de contingence complet en calculant les marges (totaux par ligne et par colonne). Interpréter les marges.</div>",
          "reponse": "<div><p><strong>Tableau avec marges :</strong></p><table style='width:100%; border-collapse: collapse; margin: 10px 0;'><tr style='background: #198754; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Âge \\ Produit</th><th style='padding: 8px; border: 1px solid #ddd;'>Alimentaire</th><th style='padding: 8px; border: 1px solid #ddd;'>Électronique</th><th style='padding: 8px; border: 1px solid #ddd;'>Vêtements</th><th style='padding: 8px; border: 1px solid #ddd;'>Loisirs</th><th style='padding: 8px; border: 1px solid #ddd;'>Total</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>18-25</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>70</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>26-35</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td><td style='padding: 8px; border: 1px solid #ddd;'>80</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>36-50</td><td style='padding: 8px; border: 1px solid #ddd;'>30</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>70</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>50+</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td></tr><tr style='background: #e8f5e9;'><td style='padding: 8px; border: 1px solid #ddd;'><strong>Total</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>90</td><td style='padding: 8px; border: 1px solid #ddd;'>70</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td><td style='padding: 8px; border: 1px solid #ddd;'>280</td></tr></table><p><strong>Interprétation :</strong><br>- Les <strong>marges colonnes</strong> indiquent que le produit le plus acheté est l'Alimentaire (90), suivi de l'Électronique (70).<br>- Les <strong>marges lignes</strong> montrent que la tranche d'âge 26-35 est la plus représentée (80).</p></div>"
        },
        {
          "question": "<div style='color: #198754; font-weight: bold;'>2) (2 pts)</div><div>Calculer le Khi-deux du tableau. Expliquer ce que mesure cette statistique.</div>",
          "reponse": "<div><p><strong>Calcul du Khi-deux :</strong></p><p>La formule est : <div class='math-block'><div class='math'>$$ \\chi^2 = \\sum_{i,j} \\frac{(O_{ij} - E_{ij})^2}{E_{ij}} $$</div></div>où \\( O_{ij} \\) est l'effectif observé et \\( E_{ij} = \\frac{\\text{Total ligne} \\times \\text{Total colonne}}{\\text{Total général}} \\).</p><p>Par exemple, pour la cellule (18-25, Alimentaire) :<br>\\( E = \\frac{70 \\times 90}{280} = 22.5 \\)</p><p>En calculant pour toutes les cellules, on obtient un <strong>Khi-deux total</strong> (à calculer avec les données fournies).</p><p><strong>Interprétation :</strong><br>Le Khi-deux mesure l'<strong>écart entre les distributions observées et les distributions théoriques sous l'hypothèse d'indépendance</strong>. Une valeur élevée indique une <strong>dépendance</strong> entre l'âge et le type de produit acheté.</p></div>"

          "reponse": "<div><p>L'<strong>Analyse des Correspondances Multiples (ACM)</strong> permet d'analyser simultanément plusieurs variables qualitatives. Les étapes sont :</p><ol><li><strong>Construction du tableau de Burt</strong> : tableau croisant toutes les modalités des variables (ex: Âge x CSP, Âge x Type, etc.).</li><li><strong>Transformation en variables indicatrices</strong> : chaque modalité devient une variable binaire (0 ou 1).</li><li><strong>Application d'une AFC</strong> sur le tableau de Burt pour obtenir les coordonnées factorielles des individus et des modalités.</li><li><strong>Interprétation</strong> : analyse des coordonnées pour identifier les <strong>associations entre modalités</strong> (ex: les jeunes achètent plus de vêtements, les cadres achètent plus d'électronique).</li></ol></div>"

          "reponse": "<div><p>L'<strong>AFM est la méthode la plus adaptée</strong> car :<br>- Les données sont <strong>mixtes</strong> : quantitatives (Groupes 1 et 3) et qualitatives (Groupe 2).<br>- L'ACP ne traite que les variables quantitatives, ignorant le Groupe 2.<br>- L'ACM ne traite que les variables qualitatives, ignorant les Groupes 1 et 3.<br>- L'AFM permet de <strong>combiner les groupes</strong> en les <strong>équilibrant</strong> grâce à une normalisation, évitant qu'un groupe domine l'analyse.</p></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
