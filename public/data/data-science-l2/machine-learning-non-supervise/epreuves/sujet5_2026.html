<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Non Supervisé - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Analyse Factorielle des Correspondances (AFC)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>On s'intéresse à une enquête sur les préférences de boissons (Café, Thé, Jus, Eau) en fonction de la tranche d'âge (Jeune, Adulte, Senior). Le tableau de contingence suivant a été obtenu :</p><div style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0;'><table style='width: 100%; border-collapse: collapse;'><tr style='background: #e0e0e0;'><th></th><th>Café</th><th>Thé</th><th>Jus</th><th>Eau</th></tr><tr><td><strong>Jeune</strong></td><td>20</td><td>30</td><td>40</td><td>10</td></tr><tr><td><strong>Adulte</strong></td><td>50</td><td>20</td><td>15</td><td>15</td></tr><tr><td><strong>Senior</strong></td><td>40</td><td>10</td><td>10</td><td>40</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Construisez les profils lignes (par tranche d'âge) et les profils colonnes (par boisson) du tableau de contingence. Quelles informations apportent-ils ? <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<p>Les profils lignes représentent la distribution des choix de boissons pour chaque tranche d'âge. Les profils colonnes représentent la distribution des tranches d'âge pour chaque boisson.</p><ul><li><strong>Profils lignes :</strong><br>Jeune : [20/100=0.20, 30/100=0.30, 40/100=0.40, 10/100=0.10]<br>Adulte : [50/100=0.50, 20/100=0.20, 15/100=0.15, 15/100=0.15]<br>Senior : [40/100=0.40, 10/100=0.10, 10/100=0.10, 40/100=0.40]</li><li><strong>Profils colonnes :</strong><br>Café : [20/110=0.182, 50/110=0.455, 40/110=0.364]<br>Thé : [30/60=0.50, 20/60=0.333, 10/60=0.167]<br>Jus : [40/65=0.615, 15/65=0.231, 10/65=0.154]<br>Eau : [10/65=0.154, 15/65=0.231, 40/65=0.615]</li></ul><p>Les profils montrent les tendances : les jeunes préfèrent le jus, les adultes le café, les seniors le café et l'eau.</p>"
        },
        {
          "question": "<strong>2.</strong> Expliquez comment l'AFC décompose le χ² pour analyser les associations entre les modalités. <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>L'AFC décompose l'inertie totale du tableau, qui est égale au χ² divisé par l'effectif total. Cette inertie est décomposée en valeurs propres associées aux axes factoriels. Chaque axe capture une partie de l'association entre les lignes et les colonnes. Plus la valeur propre est élevée, plus l'axe est important. Les coordonnées factorielles permettent de visualiser les profils et d'interpréter les associations.</p>"
        },
        {
          "question": "<strong>3.</strong> À partir des profils, déterminez quelles sont les associations fortes entre les tranches d'âge et les boissons. <span style='background: #e8f5e9; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Analyser</span>",
          "reponse": "<p>On observe les associations fortes suivantes :</p><ul><li><strong>Jeune ↔ Jus :</strong> Les jeunes représentent 61.5% des consommateurs de jus, et 40% des jeunes choisissent le jus.</li><li><strong>Adulte ↔ Café :</strong> Les adultes représentent 45.5% des consommateurs de café, et 50% des adultes choisissent le café.</li><li><strong>Senior ↔ Eau :</strong> Les seniors représentent 61.5% des consommateurs d'eau, et 40% des seniors choisissent l'eau.</li><li><strong>Senior ↔ Café :</strong> Les seniors représentent 36.4% des consommateurs de café, et 40% des seniors choisissent le café.</li></ul>"
        }
      ]
    },
    {
      "titre": "Analyse des Correspondances Multiples (ACM)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>Une enquête a recueilli des données qualitatives sur 10 individus pour 3 variables : <strong>Genre</strong> (H/F), <strong>CSP</strong> (Cadre, Employé, Ouvrier), et <strong>Transport</strong> (Voiture, Transport en commun, Vélo). Les données sont les suivantes :</p><div style='background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0;'><table style='width: 100%; border-collapse: collapse;'><tr style='background: #e0e0e0;'><th>Individu</th><th>Genre</th><th>CSP</th><th>Transport</th></tr><tr><td>1</td><td>H</td><td>Cadre</td><td>Voiture</td></tr><tr><td>2</td><td>F</td><td>Cadre</td><td>Voiture</td></tr><tr><td>3</td><td>H</td><td>Employé</td><td>Transport en commun</td></tr><tr><td>4</td><td>F</td><td>Employé</td><td>Transport en commun</td></tr><tr><td>5</td><td>H</td><td>Ouvrier</td><td>Vélo</td></tr><tr><td>6</td><td>F</td><td>Ouvrier</td><td>Vélo</td></tr><tr><td>7</td><td>H</td><td>Cadre</td><td>Vélo</td></tr><tr><td>8</td><td>F</td><td>Employé</td><td>Voiture</td></tr><tr><td>9</td><td>H</td><td>Ouvrier</td><td>Transport en commun</td></tr><tr><td>10</td><td>F</td><td>Cadre</td><td>Vélo</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Transformez les variables en variables indicatrices pour l'ACM. Combien de colonnes obtenez-vous ? <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<p>On transforme chaque modalité en une colonne binaire :</p><ul><li>Genre : 2 colonnes (H, F)</li><li>CSP : 3 colonnes (Cadre, Employé, Ouvrier)</li><li>Transport : 3 colonnes (Voiture, Transport en commun, Vélo)</li></ul><p>Total : 2 + 3 + 3 = 8 colonnes.</p><p>Chaque individu aura un 1 dans une colonne par variable.</p>"
        },
        {
          "question": "<strong>2.</strong> Expliquez ce qu'est le tableau de Burt et comment il est construit à partir des variables indicatrices. <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>Le tableau de Burt est une matrice carrée de taille (nombre de modalités total) × (nombre de modalités total).</p><ul><li>Les blocs <strong>diagonaux</strong> sont les tableaux de contingence de chaque variable avec elle-même, c'est-à-dire une matrice diagonale des effectifs des modalités.</li><li>Les blocs <strong>hors-diagonale</strong> sont les tableaux de contingence entre chaque paire de variables.</li></ul><p>Il est symétrique et permet d'appliquer l'AFC pour l'ACM.</p>"
        },
        {
          "question": "<strong>3.</strong> En observant les données, quelles associations entre les modalités pouvez-vous identifier ? <span style='background: #e8f5e9; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Analyser</span>",
          "reponse": "<p>Associations identifiables :</p><ul><li><strong>Cadre ↔ Voiture :</strong> Les individus 1, 2 et 8 (F) sont cadres et prennent la voiture.</li><li><strong>Employé ↔ Transport en commun :</strong> Les individus 3, 4 et 8 prennent les transports en commun.</li><li><strong>Ouvrier ↔ Vélo :</strong> Les individus 5, 6 et 9 utilisent le vélo.</li><li><strong>Cadre ↔ Vélo :</strong> Les individus 7 et 10 sont cadres et prennent le vélo.</li><li><strong>Genre :</strong> Les associations ne sont pas très marquées, les deux genres sont répartis dans les CSP et transports.</li></ul>"
        }
      ]
    },
    {
      "titre": "Analyse Factorielle Multiple (AFM)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>On étudie des données mixtes (quantitatives et qualitatives) sur des produits alimentaires.</p><div style='background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #0d47a1;'><strong>📊 Groupes de variables :</strong></p><ul style='color: #0d47a1;'><li><strong>Groupe 1 (Nutritionnelles) :</strong> Calories, Protéines, Lipides, Glucides (quantitatives)</li><li><strong>Groupe 2 (Qualitatives) :</strong> Catégorie (Viande, Poisson, Végétarien, Dessert), Origine (Local, Importé)</li><li><strong>Groupe 3 (Prix) :</strong> Prix (quantitatif)</li></ul></div></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Expliquez pourquoi l'AFM est adaptée pour ce type de données mixtes. <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>L'AFM est adaptée car elle peut traiter simultanément des variables quantitatives et qualitatives. Elle combine :</p><ul><li>L'ACP pour les variables quantitatives</li><li>L'AFC ou l'ACM pour les variables qualitatives</li><li>Elle pondère les groupes de variables pour qu'ils aient une influence équilibrée dans l'analyse</li></ul><p>C'est une méthode intégrative qui permet d'explorer les relations entre tous les types de variables.</p>"
        },
        {
          "question": "<strong>2.</strong> Quels types d'analyses factorielles l'AFM combine-t-elle pour les groupes 1, 2 et 3 ? <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<ul><li><strong>Groupe 1 (Nutritionnelles) :</strong> Analyse en Composantes Principales (ACP) car les variables sont quantitatives.</li><li><strong>Groupe 2 (Catégorie, Origine) :</strong> Analyse Factorielle des Correspondances (AFC) ou Analyse des Correspondances Multiples (ACM) car ce sont des variables qualitatives.</li><li><strong>Groupe 3 (Prix) :</strong> ACP (variable quantitative).</li></ul><p>L'AFM combine les résultats de ces analyses en une représentation commune.</p>"
        },
        {
          "question": "<strong>3.</strong> Dans un contexte marketing, comment pourrait-on interpréter les résultats de l'AFM ? <span style='background: #e8f5e9; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Évaluer</span>",
          "reponse": "<p>Les résultats de l'AFM permettraient :</p><ul><li>D'identifier des <strong>segments de produits</strong> en fonction de leur composition nutritionnelle, de leur catégorie et de leur prix.</li><li>De visualiser les <strong>associations</strong> entre la catégorie d'un produit, ses caractéristiques nutritionnelles et son prix.</li><li>D'orienter les stratégies de <strong>positionnement</strong> en identifiant les produits proches ou éloignés sur les axes factoriels.</li><li>De comprendre les <strong>déterminants</strong> du prix (ex: les produits importés ont-ils des caractéristiques nutritionnelles particulières ?).</li></ul>"
        }
      ]
    },
    {
      "titre": "Questions de Cours et Applications",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>Répondez aux questions suivantes en vous appuyant sur les concepts vus en cours.</p></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Qu'est-ce qu'un tableau de contingence en AFC et comment mesure-t-on l'association entre les lignes et les colonnes ? <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>Un tableau de contingence croise deux variables qualitatives. L'association est mesurée par le χ² (khi-deux). La distance entre les profils est la distance du χ², qui pondère les écarts par l'inverse des effectifs marginaux. En AFC, l'inertie totale est égale au χ² divisé par l'effectif total, et elle est décomposée en valeurs propres.</p>"
        },
        {
          "question": "<strong>2.</strong> Expliquez la différence entre l'AFC et l'ACM. Dans quel cas utiliseriez-vous l'ACM plutôt que l'AFC ? <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Analyser</span>",
          "reponse": "<ul><li><strong>AFC :</strong> Analyse deux variables qualitatives (tableau de contingence). Elle étudie les associations entre les modalités de deux variables.</li><li><strong>ACM :</strong> Analyse plusieurs variables qualitatives. Elle généralise l'AFC à plus de deux variables en utilisant le tableau de Burt.</li></ul><p>On utilise l'ACM lorsqu'on a plus de deux variables qualitatives à analyser simultanément.</p>"
        },
        {
          "question": "<strong>3.</strong> Quelle est la particularité de l'AFM pour l'analyse de données mixtes ? <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>L'AFM combine :</p><ul><li>L'ACP pour les variables quantitatives</li><li>L'AFC/ACM pour les variables qualitatives</li><li>Elle pondère les groupes de variables pour qu'ils aient une influence équilibrée</li></ul><p>Elle est particulièrement utile lorsque les données contiennent des variables de natures différentes et que l'on veut explorer les relations entre tous les groupes.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
