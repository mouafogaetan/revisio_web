<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Machine Learning Non Supervisé - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Compréhension des Concepts Fondamentaux",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>L'apprentissage non supervisé est une branche du machine learning où les données ne sont pas étiquetées. Plusieurs algorithmes permettent de découvrir des structures cachées dans les données.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Questions de cours :</strong></p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Définir l'apprentissage non supervisé et citer <strong>deux</strong> types de problèmes qu'il permet de résoudre.</p>",
          "reponse": "<p>L'apprentissage non supervisé consiste à analyser des données non étiquetées pour découvrir des structures, des motifs ou des relations cachées. Les deux types de problèmes principaux sont :</p><ul><li><strong>Le clustering</strong> (regroupement) : partitionner les données en groupes homogènes (ex: segmentation de clients).</li><li><strong>La réduction de dimension</strong> : réduire le nombre de variables tout en préservant l'essentiel de l'information (ex: ACP, t-SNE).</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquer brièvement la différence entre le clustering <strong>dur (hard)</strong> et le clustering <strong>doux (soft)</strong>.</p>",
          "reponse": "<p><strong>Clustering dur :</strong> Chaque point est assigné à un <strong>unique</strong> cluster. Exemple : K-means.</p><p><strong>Clustering doux :</strong> Chaque point a une <strong>probabilité d'appartenance</strong> à chaque cluster. Exemple : les Modèles de Mélange Gaussiens (GMM).</p><p>Le clustering doux est plus flexible car il capture l'incertitude et permet des chevauchements entre clusters.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse en Composantes Principales (ACP)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>L'Analyse en Composantes Principales (ACP) est une méthode de réduction de dimension linéaire. L'objectif est de projeter les données dans un espace de plus faible dimension tout en conservant un maximum de variance.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> On considère un jeu de données de 100 clients décrits par 5 variables : âge, revenu, dépenses mensuelles, nombre d'achats, score de fidélité.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Expliquer pourquoi il est <strong>nécessaire</strong> de standardiser les données avant d'appliquer une ACP. Que se passerait-il si on ne le faisait pas ?</p>",
          "reponse": "<p>La standardisation est nécessaire car l'ACP est <strong>sensible aux échelles</strong> des variables. Si les variables ont des unités différentes (ex: âge en années, revenu en milliers d'euros), les variables avec des variances plus élevées domineront les composantes principales.</p><p>Sans standardisation, une variable comme le revenu (qui peut varier de 0 à 100 000) aurait un poids bien plus important que l'âge (qui varie de 18 à 80), ce qui fausserait l'analyse et les composantes principales refléteraient principalement la variable avec la plus grande variance.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Après avoir réalisé l'ACP, vous obtenez les variances expliquées suivantes pour les 5 composantes : [3.2, 1.1, 0.5, 0.2, 0.0]. Déterminer le <strong>nombre de composantes</strong> à conserver pour expliquer au moins <strong>80%</strong> de la variance totale. Justifier votre réponse.</p>",
          "reponse": "<p>La variance totale est : 3.2 + 1.1 + 0.5 + 0.2 + 0.0 = 5.0</p><p>Variance expliquée cumulée :</p><ul><li>Composante 1 : 3.2/5.0 = 64%</li><li>Composante 2 : (3.2+1.1)/5.0 = 4.3/5.0 = 86%</li></ul><p>Il faut conserver <strong>2 composantes</strong> car elles expliquent 86% de la variance totale, ce qui dépasse le seuil de 80%. La 3ème composante n'apporte que 10% supplémentaire, ce qui n'est pas nécessaire pour atteindre l'objectif de 80%.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : DBSCAN",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>DBSCAN (Density-Based Spatial Clustering of Applications with Noise) est un algorithme de clustering basé sur la densité.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> Un jeu de données géographiques contenant les coordonnées (x, y) de 500 points.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Expliquer le rôle des <strong>deux paramètres</strong> principaux de DBSCAN : ε (epsilon) et minPts. Comment choisit-on ces paramètres en pratique ?</p>",
          "reponse": "<p><strong>ε (epsilon) :</strong> Rayon du voisinage autour d'un point. Un point est considéré comme noyau s'il y a au moins minPts points dans ce rayon.</p><p><strong>minPts :</strong> Nombre minimum de points requis dans le voisinage pour qu'un point soit un point noyau.</p><p>En pratique, on utilise la <strong>méthode du graphique des k-plus proches voisins</strong> : on calcule la distance au k-ème plus proche voisin pour chaque point, on trie ces distances et on trace le graphique. La valeur de ε est le point d'inflexion de la courbe (le 'coude'). minPts est souvent choisi comme 2 × dimension des données.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Définir les <strong>trois types</strong> de points dans DBSCAN : points <strong>noyaux</strong>, points <strong>frontière</strong> et <strong>bruit</strong>. Comment sont-ils déterminés ?</p>",
          "reponse": "<p><strong>Points noyaux :</strong> Points qui ont au moins minPts voisins dans leur rayon ε (y compris eux-mêmes). Ils sont le cœur des clusters.</p><p><strong>Points frontière :</strong> Points qui ont moins de minPts voisins dans leur rayon ε, mais qui sont dans le voisinage d'un point noyau. Ils appartiennent au cluster du point noyau.</p><p><strong>Bruit :</strong> Points qui ne sont ni noyaux ni frontière. Ils n'appartiennent à aucun cluster et sont ignorés.</p><p>La détermination se fait en parcourant les points : un point noyau crée un cluster avec tous ses voisins, et on propage le cluster en ajoutant les voisins des points noyaux trouvés.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Clustering Hiérarchique",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>Le clustering hiérarchique agglomératif construit une hiérarchie de clusters en fusionnant progressivement les points les plus proches.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> On considère 5 points A, B, C, D, E avec les distances suivantes (matrice de distance) :</p><div style='overflow-x: auto;'><table style='width:100%; border-collapse: collapse; text-align: center; margin: 10px 0;'><tr style='background:#2c3e50; color:white;'><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><td style='background:#ecf0f1;'>A</td><td>0</td><td>3</td><td>8</td><td>6</td><td>7</td></tr><tr><td style='background:#f8f9fa;'>B</td><td>3</td><td>0</td><td>5</td><td>4</td><td>9</td></tr><tr><td style='background:#ecf0f1;'>C</td><td>8</td><td>5</td><td>0</td><td>2</td><td>7</td></tr><tr><td style='background:#f8f9fa;'>D</td><td>6</td><td>4</td><td>2</td><td>0</td><td>6</td></tr><tr><td style='background:#ecf0f1;'>E</td><td>7</td><td>9</td><td>7</td><td>6</td><td>0</td></tr></table></div></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> En utilisant la <strong>liaison simple</strong> (distance minimale), effectuer les <strong>deux premières fusions</strong> de l'algorithme agglomératif. Montrer les clusters obtenus et les distances entre eux.</p>",
          "reponse": "<p><strong>Fusion 1 :</strong> La distance minimale est entre C et D (distance = 2). Premier cluster : {C, D}.</p><p><strong>Mise à jour des distances (liaison simple) :</strong></p><ul><li>d({C,D}, A) = min(d(C,A), d(D,A)) = min(8, 6) = 6</li><li>d({C,D}, B) = min(5, 4) = 4</li><li>d({C,D}, E) = min(7, 6) = 6</li></ul><p><strong>Fusion 2 :</strong> La distance minimale maintenant est entre A et B (distance = 3). Deuxième cluster : {A, B}.</p><p>Les deux clusters après 2 fusions : <strong>{A, B}</strong> et <strong>{C, D}</strong>.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquer la différence entre la <strong>liaison simple</strong> et la <strong>liaison complète</strong> dans le clustering hiérarchique. Dans quel cas la liaison simple est-elle préférable ?</p>",
          "reponse": "<p><strong>Liaison simple :</strong> La distance entre deux clusters est la <strong>distance minimale</strong> entre un point d'un cluster et un point de l'autre. Elle tend à créer des clusters de forme allongée (effet 'chaîne') et est sensible au bruit.</p><p><strong>Liaison complète :</strong> La distance entre deux clusters est la <strong>distance maximale</strong> entre un point d'un cluster et un point de l'autre. Elle tend à créer des clusters compacts et sphériques.</p><p><strong>Préférence :</strong> La liaison simple est préférable lorsque les clusters naturels ont des <strong>formes allongées ou irrégulières</strong>, ou lorsqu'on souhaite détecter des structures en forme de chaîne. Elle est aussi utilisée en analyse de proximité pour détecter des motifs de corrélation.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Application Pratique - Segmentation de Clients",
      "points": "2 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p style='font-size: 1em; line-height: 1.6; color: #333;'>Une entreprise de e-commerce souhaite segmenter ses clients en fonction de leur comportement d'achat pour personnaliser ses campagnes marketing.</p><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='margin: 0; color: #2c3e50;'><strong>Données :</strong> 1000 clients avec les variables : montant total dépensé, fréquence d'achat, nombre de catégories de produits achetées, ancienneté (en mois).</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Proposer une <strong>stratégie complète</strong> pour réaliser cette segmentation. Décrire les étapes : prétraitement, choix de l'algorithme, évaluation et interprétation des résultats.</p>",
          "reponse": "<p><strong>1. Prétraitement :</strong></p><ul><li>Standardisation des variables (car échelles différentes).</li><li>Détection et traitement des valeurs manquantes (imputation par moyenne).</li></ul><p><strong>2. Choix de l'algorithme :</strong></p><ul><li>Utiliser K-means (rapide et efficace pour ce type de données) avec la méthode du coude pour choisir K.</li><li>Comparer avec DBSCAN pour détecter d'éventuels outliers.</li><li>Comparer avec GMM pour un clustering probabiliste.</li></ul><p><strong>3. Évaluation :</strong></p><ul><li>Métriques internes : coefficient de silhouette, indice de Davies-Bouldin.</li><li>Validation métier : les segments ont-ils un sens commercial ? Peut-on les nommer ?</li></ul><p><strong>4. Interprétation :</strong></p><ul><li>Analyser les profils de chaque segment (moyennes des variables).</li><li>Nommer les segments : 'Premium', 'Fidèle', 'Occasionnel', etc.</li><li>Proposer des stratégies marketing pour chaque segment.</li></ul><p><strong>5. Recommandations :</strong></p><ul><li>Personnaliser les offres et communications.</li><li>Mettre en place un système de suivi pour réévaluer les segments périodiquement.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
