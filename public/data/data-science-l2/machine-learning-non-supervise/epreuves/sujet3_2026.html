<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Machine Learning Non Supervisé - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 3 : Détection d'Anomalies",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours",
     "points": "6 pts",
     "enonce": "<p>Répondez aux questions suivantes par Vrai ou Faux, ou en choisissant la ou les bonnes réponses.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1 pt)</strong> Dans le contexte de la détection d'anomalies, les données sont souvent <strong>déséquilibrées</strong>, ce qui signifie que le nombre d'anomalies est beaucoup plus faible que le nombre de points normaux.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>En effet, les données déséquilibrées sont la règle en détection d'anomalies. Par exemple, dans la détection de fraudes bancaires, moins de 1% des transactions sont frauduleuses. C'est ce déséquilibre qui rend la tâche difficile et impose l'utilisation de métriques adaptées comme le rappel ou le F1-score plutôt que l'accuracy.</p>"
       },
       {
         "question": "<p><strong>2. (1 pt)</strong> L'algorithme Isolation Forest détecte les anomalies en <strong>modélisant la distribution des données normales</strong> pour identifier celles qui s'en écartent.</p>",
         "reponse": "<p><strong>Réponse : Faux.</strong></p><p>Isolation Forest ne modélise pas la distribution normale. Il repose sur un principe radicalement différent : il isole les points en les séparant aléatoirement. Les anomalies sont plus faciles à isoler (elles sont seules ou en petit groupe) et ont donc un chemin d'isolation plus court que les points normaux qui forment des groupes denses. Cette approche est très efficace sur les données déséquilibrées.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Parmi les métriques suivantes, laquelle est <strong>la moins adaptée</strong> pour évaluer un modèle de détection de fraudes sur un jeu de données où 99% des transactions sont normales ?</p><ul><li><strong>A.</strong> Précision</li><li><strong>B.</strong> Rappel</li><li><strong>C.</strong> F1-score</li><li><strong>D.</strong> Accuracy</li></ul>",
         "reponse": "<p><strong>Réponse : D. Accuracy.</strong></p><p>L'accuracy (ou exactitude) est la proportion de bonnes prédictions sur l'ensemble des données. Sur des données déséquilibrées, un modèle qui prédit toujours 'normal' (sans jamais détecter de fraude) aura une accuracy de 99%, ce qui est trompeur. Les métriques comme la précision, le rappel et le F1-score sont beaucoup plus informatives car elles se concentrent sur la performance du modèle sur la classe minoritaire (les fraudes).</p>"
       },
       {
         "question": "<p><strong>4. (1 pt)</strong> Le paramètre <strong>contamination</strong> dans Isolation Forest et le paramètre <strong>nu (ν)</strong> dans One-Class SVM contrôlent tous les deux la <strong>proportion d'anomalies</strong> attendue dans les données.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>Ces deux paramètres jouent un rôle similaire : ils estiment la proportion d'anomalies dans le jeu de données. 'Contamination' dans Isolation Forest fixe le seuil de détection, tandis que 'nu' dans One-Class SVM contrôle la proportion de points qui seront considérés comme des anomalies et la marge de séparation. Le choix de ces paramètres est crucial et doit être basé sur la connaissance du domaine ou sur une validation croisée.</p>"
       },
       {
         "question": "<p><strong>5. (1 pt)</strong> Quelle est la principale raison de <strong>normaliser les variables numériques</strong> avant d'appliquer des algorithmes comme One-Class SVM ?</p><ul><li><strong>A.</strong> Pour réduire le temps de calcul.</li><li><strong>B.</strong> Pour éviter qu'une variable avec une large échelle ne domine la mesure de distance.</li><li><strong>C.</strong> Pour éliminer les valeurs manquantes.</li><li><strong>D.</strong> Pour augmenter le nombre de fraudes détectées.</li></ul>",
         "reponse": "<p><strong>Réponse : B.</strong></p><p>La normalisation (par exemple avec StandardScaler ou MinMaxScaler) est essentielle pour les algorithmes basés sur les distances ou les marges comme One-Class SVM, Isolation Forest ou LOF. Sans normalisation, une variable comme le montant d'une transaction (qui peut varier de 1 à 100 000) aurait une influence beaucoup plus grande qu'une variable comme le temps (qui varie de 0 à 24) sur la décision du modèle. La normalisation place toutes les variables sur une échelle comparable, ce qui garantit que l'algorithme ne soit pas biaisé par les unités de mesure.</p>"
       },
       {
         "question": "<p><strong>6. (1 pt)</strong> L'algorithme <strong>Local Outlier Factor (LOF)</strong> détecte les anomalies en comparant la <strong>densité locale</strong> d'un point avec celle de ses voisins. Un point avec une densité bien inférieure à celle de ses voisins est considéré comme une anomalie.</p>",
         "reponse": "<p><strong>Réponse : Vrai.</strong></p><p>C'est exactement le principe de LOF. Il calcule un facteur d'anomalie pour chaque point en comparant sa densité locale (distance à ses voisins) à la densité de ses voisins. Un point dont la densité est beaucoup plus faible que celle de ses voisins a un score LOF élevé et est considéré comme une anomalie. Cette approche est particulièrement efficace pour détecter des anomalies locales, c'est-à-dire des points qui sont anormaux par rapport à leur voisinage immédiat.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Application à la Détection de Fraudes",
     "points": "7 pts",
     "enonce": "<p>Une banque vous confie un jeu de données de transactions bancaires. Après exploration, vous constatez que seulement 0,5% des transactions sont frauduleuses. Vous décidez d'utiliser les trois méthodes suivantes : <strong>Isolation Forest, LOF et One-Class SVM</strong>.</p><p>Répondez aux questions suivantes.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1.5 pts)</strong> Justifiez le choix de ces trois méthodes plutôt qu'une simple règle de seuil sur le montant des transactions.</p>",
         "reponse": "<p>Ces trois méthodes sont des algorithmes de détection d'anomalies non supervisés qui peuvent capturer des <strong>patterns complexes</strong> dans les données. Une règle de seuil sur le montant est trop simple : elle ne détecterait que les fraudes de montant élevé et manquerait les petites fraudes ou les transactions anormales dans d'autres dimensions (ex : heure inhabituelle, localisation étrange, multiplication de transactions). Isolation Forest, LOF et One-Class SVM prennent en compte l'ensemble des caractéristiques de la transaction pour détecter les comportements anormaux, ce qui est bien plus efficace.</p><p>De plus, ces méthodes sont adaptées au <strong>déséquilibre des classes</strong> car elles n'ont pas besoin de données étiquetées pour la classe frauduleuse.</p>"
       },
       {
         "question": "<p><strong>2. (2 pts)</strong> Expliquez comment vous allez <strong>évaluer</strong> les performances de vos modèles. Quelles métriques allez-vous utiliser et pourquoi ?</p>",
         "reponse": "<p>Comme les données sont très déséquilibrées, je vais utiliser les métriques suivantes :</p><ul><li><strong>Le Rappel (Recall) :</strong> C'est la métrique la plus importante car elle mesure la proportion de fraudes réelles qui sont détectées. Un rappel de 0.90 signifie que 90% des fraudes ont été identifiées. Manquer une fraude peut avoir un coût énorme pour la banque, donc on veut maximiser le rappel.</li><li><strong>La Précision (Precision) :</strong> Elle mesure la proportion de fraudes détectées qui sont de vraies fraudes. Si la précision est faible, cela signifie que le modèle génère beaucoup de fausses alertes, ce qui est coûteux et frustrant pour les équipes de vérification.</li><li><strong>Le F1-score :</strong> C'est la moyenne harmonique entre la précision et le rappel. Il offre un bon compromis entre les deux.</li><li><strong>L'AUC-ROC :</strong> Cette métrique mesure la capacité du modèle à distinguer les classes (normal vs fraude). Elle est moins sensible au déséquilibre que l'accuracy.</li></ul><p><strong>Je ne vais PAS utiliser l'accuracy</strong> car un modèle qui prédit 'normal' pour tout le monde aurait 99.5% d'accuracy mais ne détecterait aucune fraude.</p>"
       },
       {
         "question": "<p><strong>3. (1.5 pts)</strong> L'équipe métier vous indique que chaque fausse alerte coûte 5€ à traiter, mais qu'une fraude non détectée coûte en moyenne 1000€. Quel compromis entre précision et rappel devriez-vous privilégier ?</p>",
         "reponse": "<p>Dans ce cas, le coût d'une <strong>fraude non détectée (faux négatif) est très élevé</strong> (1000€) par rapport au coût d'une fausse alerte (5€). Il est donc plus important de minimiser les faux négatifs, c'est-à-dire de <strong>maximiser le rappel</strong>, quitte à accepter plus de fausses alertes (précision plus faible).</p><p>Le coût d'une fausse alerte est 200 fois moins élevé qu'une fraude manquée, donc il est justifié de générer plus de fausses alertes pour capturer presque toutes les fraudes. On pourrait par exemple accepter une précision de 0.10 (10% des alertes sont des fraudes) pour avoir un rappel de 0.95 (95% des fraudes sont détectées). Le coût total resterait inférieur à celui de manquer des fraudes.</p>"
       },
       {
         "question": "<p><strong>4. (2 pts)</strong> Quel paramètre est le plus important à régler pour chacun des trois modèles dans ce contexte de déséquilibre ?</p>",
         "reponse": "<p>Pour chaque modèle, le paramètre le plus important est celui qui contrôle la proportion d'anomalies attendue :</p><ul><li><strong>Isolation Forest :</strong> le paramètre <strong>contamination</strong>. Il fixe la proportion d'anomalies dans le jeu de données. Une valeur de 0.005 (0.5%) serait appropriée ici, mais il faut le valider par validation croisée. Une contamination trop faible manquera des fraudes, une contamination trop élevée générera trop de fausses alertes.</li><li><strong>One-Class SVM :</strong> le paramètre <strong>nu (ν)</strong>. Il contrôle la proportion de points qui seront considérés comme des anomalies et la marge de séparation. Une valeur de 0.005 correspondrait au taux de fraude attendu, mais il faut le régler finement.</li><li><strong>Local Outlier Factor (LOF) :</strong> le paramètre <strong>n_neighbors</strong>. Il détermine le nombre de voisins à considérer pour estimer la densité locale. Une valeur trop petite peut rendre le modèle sensible au bruit, une valeur trop grande peut lisser les anomalies locales. Une valeur entre 20 et 50 est souvent un bon point de départ.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Analyse de Performance",
     "points": "7 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
