<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction au Verrouillage",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Pourquoi le verrouillage ?</strong></p>\n  <ul style='margin: 10px 0; padding-left: 20px; list-style-type: disc;'>\n    <li>Dans un système multi-utilisateurs, plusieurs transactions peuvent accéder aux mêmes données simultanément.</li>\n    <li>Sans contrôle, cela peut entraîner des <strong>incohérences</strong> et des <strong>anomalies</strong>.</li>\n    <li>Le verrouillage permet de <strong>synchroniser</strong> les accès et de garantir l'<strong>isolation</strong> des transactions.</li>\n  </ul>\n  <div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 15px 0; text-align: center;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Objectif :</strong> Assurer la cohérence des données en environnement concurrent.</p>\n  </div>\n  <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #1976d2;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Définition :</strong> Un verrou est un mécanisme qui empêche qu'une transaction modifie des données pendant qu'une autre transaction les utilise.</p>\n  </div>\n</div>",
    "texteParle": "Bonjour à tous. Dans ce cours, nous allons aborder un sujet essentiel pour les bases de données : le verrouillage. Pourquoi avons-nous besoin de verrouillage ? Dans un système multi-utilisateurs, plusieurs transactions peuvent accéder aux mêmes données en même temps. Sans contrôle, cela peut entraîner des incohérences et des anomalies. Le verrouillage permet de synchroniser les accès et de garantir l'isolation des transactions. L'objectif est d'assurer la cohérence des données en environnement concurrent. Un verrou est un mécanisme qui empêche qu'une transaction modifie des données pendant qu'une autre transaction les utilise.",
    "note": "Le verrouillage est essentiel pour maintenir l'intégrité des données dans les systèmes transactionnels."
  },
  {
    "titre": "Verrous Partagés vs Exclusifs",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Deux types de verrous :</strong></p>\n  <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #388e3c;'>\n      <p style='margin: 0; font-weight: bold; color: #1b5e20;'>🔓 Verrou Partagé (Shared Lock)</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Autorise plusieurs transactions à <strong>lire</strong> la même donnée simultanément. Aucune modification n'est permise.</p>\n      <p style='margin: 3px 0 0 0; color: #555; font-style: italic;'>Exemple : Deux utilisateurs consultent le même compte bancaire en même temps.</p>\n    </div>\n    <div style='background-color: #fce4ec; padding: 12px; border-radius: 8px; border-left: 4px solid #c62828;'>\n      <p style='margin: 0; font-weight: bold; color: #b71c1c;'>🔒 Verrou Exclusif (Exclusive Lock)</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Autorise une seule transaction à <strong>lire et modifier</strong> la donnée. Toute autre transaction est bloquée.</p>\n      <p style='margin: 3px 0 0 0; color: #555; font-style: italic;'>Exemple : Un utilisateur effectue un virement bancaire et met à jour le solde.</p>\n    </div>\n  </div>\n  <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>⚠️ Compatibilité :</strong> Plusieurs verrous partagés sont compatibles entre eux. Un verrou exclusif est incompatible avec tout autre verrou (partagé ou exclusif).</p>\n  </div>\n</div>",
    "texteParle": "Il existe deux types de verrous. Le verrou partagé, aussi appelé shared lock. Il autorise plusieurs transactions à lire la même donnée simultanément, mais aucune modification n'est permise. Par exemple, deux utilisateurs qui consultent le même compte bancaire en même temps. Le verrou exclusif, aussi appelé exclusive lock. Il autorise une seule transaction à lire et modifier la donnée. Toute autre transaction est bloquée. Par exemple, un utilisateur qui effectue un virement et met à jour le solde. La compatibilité est simple : plusieurs verrous partagés sont compatibles entre eux. Mais un verrou exclusif est incompatible avec tout autre verrou, qu'il soit partagé ou exclusif.",
    "note": "Le choix du type de verrou dépend de l'opération : lecture (partagé) ou écriture (exclusif)."
  },
  {
    "titre": "Verrouillage au Niveau des Lignes et des Tables",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Deux granularités de verrouillage :</strong></p>\n  <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'>\n    <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; border-left: 4px solid #1565c0;'>\n      <p style='margin: 0; font-weight: bold; color: #0d47a1;'>📊 Row-Level Locking (Niveau ligne)</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Le verrou est posé sur une <strong>ligne spécifique</strong> d'une table.</p>\n      <ul style='margin: 5px 0 0 20px; color: #1a1a1a;'>\n        <li><strong>Avantages :</strong> Meilleure concurrence (plusieurs transactions peuvent accéder à différentes lignes).</li>\n        <li><strong>Inconvénients :</strong> Plus de surcharge (gestion de nombreux verrous).</li>\n      </ul>\n    </div>\n    <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; border-left: 4px solid #e65100;'>\n      <p style='margin: 0; font-weight: bold; color: #e65100;'>📋 Table-Level Locking (Niveau table)</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Le verrou est posé sur <strong>toute la table</strong>.</p>\n      <ul style='margin: 5px 0 0 20px; color: #1a1a1a;'>\n        <li><strong>Avantages :</strong> Faible surcharge (un seul verrou).</li>\n        <li><strong>Inconvénients :</strong> Mauvaise concurrence (la table est bloquée).</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Exemple :</strong> PostgreSQL utilise le row-level locking. MySQL (MyISAM) utilise le table-level locking. InnoDB (MySQL) utilise le row-level locking.</p>\n  </div>\n</div>",
    "texteParle": "Le verrouillage peut se faire à deux granularités principales. D'abord, le verrouillage au niveau des lignes, ou row-level locking. Le verrou est posé sur une ligne spécifique d'une table. L'avantage est une meilleure concurrence, car plusieurs transactions peuvent accéder à différentes lignes en même temps. L'inconvénient est une plus grande surcharge, car il faut gérer de nombreux verrous. Ensuite, le verrouillage au niveau de la table, ou table-level locking. Le verrou est posé sur toute la table. L'avantage est une faible surcharge, car un seul verrou est géré. L'inconvénient est une mauvaise concurrence, car toute la table est bloquée. Par exemple, PostgreSQL utilise le row-level locking. MySQL avec MyISAM utilise le table-level, tandis qu'avec InnoDB, il utilise le row-level locking.",
    "note": "Le choix de la granularité est un compromis entre concurrence et performance."
  },
  {
    "titre": "Introduction au MVCC",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Qu'est-ce que le MVCC ?</strong></p>\n  <div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>MVCC = Multi-Version Concurrency Control</strong></p>\n  </div>\n  <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; margin: 15px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Principe :</strong> Au lieu de verrouiller les données, on conserve <strong>plusieurs versions</strong> d'une ligne de données.</p>\n  </div>\n  <ul style='margin: 10px 0; padding-left: 20px; list-style-type: disc;'>\n    <li>Chaque transaction voit une <strong>snapshot</strong> (instantané) des données à un moment donné.</li>\n    <li>Les transactions de lecture ne bloquent pas les transactions d'écriture, et vice-versa.</li>\n    <li>Très utilisé dans les bases de données modernes : <strong>PostgreSQL, MySQL (InnoDB), Oracle, SQL Server</strong>.</li>\n  </ul>\n  <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>✅ Avantage :</strong> Améliore considérablement la concurrence et les performances.</p>\n  </div>\n</div>",
    "texteParle": "Nous allons maintenant aborder le MVCC, ou Multi-Version Concurrency Control. C'est une technique avancée de gestion de la concurrence. Le principe est simple : au lieu de verrouiller les données, on conserve plusieurs versions d'une ligne de données. Chaque transaction voit un instantané des données à un moment donné. Ainsi, les transactions de lecture ne bloquent pas les transactions d'écriture, et vice-versa. Cette technique est très utilisée dans les bases de données modernes comme PostgreSQL, MySQL avec InnoDB, Oracle ou SQL Server. L'avantage est qu'elle améliore considérablement la concurrence et les performances.",
    "note": "Le MVCC est une alternative plus performante au verrouillage pur."
  },
  {
    "titre": "Fonctionnement du MVCC",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Comment fonctionne le MVCC ?</strong></p>\n  <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>1. Insertion :</strong> Une nouvelle version de la ligne est créée avec un <strong>identifiant de transaction</strong> (XID).</p>\n  </div>\n  <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>2. Mise à jour :</strong> Une nouvelle version est créée. L'ancienne version est marquée comme <strong>expirée</strong> pour les autres transactions.</p>\n  </div>\n  <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>3. Suppression :</strong> La ligne est marquée comme supprimée (une version <strong>tombstone</strong> est créée).</p>\n  </div>\n  <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 15px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Exemple :</strong> Dans PostgreSQL, chaque ligne a des champs cachés : <span style='font-family: monospace;'>xmin</span> (transaction de création) et <span style='font-family: monospace;'>xmax</span> (transaction de suppression).</p>\n  </div>\n  <div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'>\n    <p style='color: #1a1a1a; margin: 0;'>Le MVCC permet à chaque transaction de voir une <strong>vision cohérente</strong> des données.</p>\n  </div>\n</div>",
    "texteParle": "Comment fonctionne concrètement le MVCC ? Lors d'une insertion, une nouvelle version de la ligne est créée avec un identifiant de transaction. Pour une mise à jour, une nouvelle version est créée, et l'ancienne est marquée comme expirée pour les autres transactions. Pour une suppression, la ligne est marquée comme supprimée, une version tombe, une pierre tombale est créée. Dans PostgreSQL, par exemple, chaque ligne a des champs cachés comme xmin pour la transaction de création et xmax pour la transaction de suppression. Le MVCC permet donc à chaque transaction de voir une vision cohérente des données, sans bloquer les autres transactions.",
    "note": "Le MVCC repose sur des identifiants de transaction pour gérer la visibilité des versions."
  },
  {
    "titre": "Avantages et Limites du MVCC",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #388e3c;'>\n      <p style='margin: 0; font-weight: bold; color: #1b5e20;'>✅ Avantages</p>\n      <ul style='margin: 5px 0 0 20px; color: #1a1a1a;'>\n        <li><strong>Concurrence élevée :</strong> Les lectures ne bloquent pas les écritures.</li>\n        <li><strong>Performances :</strong> Moins de verrous, moins de deadlocks.</li>\n        <li><strong>Snapshots cohérents :</strong> Chaque transaction a une vue cohérente des données.</li>\n      </ul>\n    </div>\n    <div style='background-color: #fce4ec; padding: 12px; border-radius: 8px; border-left: 4px solid #c62828;'>\n      <p style='margin: 0; font-weight: bold; color: #b71c1c;'>⚠️ Limites et Inconvénients</p>\n      <ul style='margin: 5px 0 0 20px; color: #1a1a1a;'>\n        <li><strong>Surcharge de stockage :</strong> Plusieurs versions occupent de l'espace.</li>\n        <li><strong>Nettoyage des versions :</strong> Le VACUUM (PostgreSQL) ou le purge (Oracle) doit être exécuté régulièrement.</li>\n        <li><strong>Complexité :</strong> La gestion des versions et des snapshots est complexe.</li>\n      </ul>\n    </div>\n  </div>\n  <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>💡 Solution :</strong> PostgreSQL utilise le <strong>VACUUM</strong> pour nettoyer les versions mortes et récupérer l'espace.</p>\n  </div>\n</div>",
    "texteParle": "Le MVCC présente de nombreux avantages, mais aussi quelques limites. Parmi les avantages, on trouve une concurrence élevée, car les lectures ne bloquent pas les écritures. De meilleures performances, avec moins de verrous et moins de deadlocks. Et des snapshots cohérents, chaque transaction ayant une vue cohérente des données. Mais il y a aussi des limites. La surcharge de stockage, car plusieurs versions occupent de l'espace. Le besoin de nettoyage, car les versions mortes doivent être supprimées régulièrement. Enfin, la complexité de la gestion des versions et des snapshots. Pour résoudre le problème de stockage, PostgreSQL utilise le VACUUM pour nettoyer les versions mortes et récupérer l'espace.",
    "note": "Le MVCC est un compromis entre performance et gestion des versions."
  },
  {
    "titre": "Deadlocks (Interblocages)",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Qu'est-ce qu'un deadlock ?</strong></p>\n  <div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'>\n    <p style='color: #1a1a1a; margin: 0;'>Situation où deux transactions se bloquent mutuellement en attendant un verrou détenu par l'autre.</p>\n  </div>\n  <div style='background-color: #fce4ec; padding: 12px; border-radius: 8px; margin: 15px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>Exemple :</strong></p>\n    <ul style='margin: 5px 0 0 20px; color: #1a1a1a;'>\n      <li>Transaction A verrouille la table X et attend la table Y.</li>\n      <li>Transaction B verrouille la table Y et attend la table X.</li>\n      <li>Ni A ni B ne peuvent progresser → <strong>Deadlock</strong> !</li>\n    </ul>\n  </div>\n  <div style='display: flex; flex-direction: column; gap: 10px; margin: 15px 0;'>\n    <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px;'>\n      <p style='margin: 0; color: #1a1a1a;'><strong>Détection :</strong> Le SGBD détecte les cycles dans le graphe d'attente.</p>\n    </div>\n    <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px;'>\n      <p style='margin: 0; color: #1a1a1a;'><strong>Résolution :</strong> Une transaction est sacrifiée (ROLLBACK) pour libérer les verrous.</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Un deadlock, ou interblocage, est une situation où deux transactions se bloquent mutuellement en attendant un verrou détenu par l'autre. Par exemple, la transaction A verrouille la table X et attend la table Y. Pendant ce temps, la transaction B verrouille la table Y et attend la table X. Ni A ni B ne peuvent progresser, on est dans une situation de deadlock. Comment le système gère-t-il cela ? Il détecte les cycles dans le graphe d'attente des transactions. Une fois le deadlock détecté, une des transactions est sacrifiée, c'est-à-dire annulée par un ROLLBACK, pour libérer les verrous et permettre à l'autre de continuer.",
    "note": "Les deadlocks sont inévitables dans les systèmes concurrents, mais doivent être gérés correctement."
  },
  {
    "titre": "Prévention des Deadlocks",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <p style='margin-bottom: 15px;'><strong>Stratégies pour éviter les deadlocks :</strong></p>\n  <div style='display: flex; flex-direction: column; gap: 15px; margin: 15px 0;'>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #388e3c;'>\n      <p style='margin: 0; font-weight: bold; color: #1b5e20;'>1. Ordre d'accès</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Accéder aux ressources dans un <strong>ordre défini</strong> (ex: par ID).</p>\n    </div>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #388e3c;'>\n      <p style='margin: 0; font-weight: bold; color: #1b5e20;'>2. Timeout</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Définir un délai maximum d'attente. Si dépassé, la transaction est annulée.</p>\n    </div>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #388e3c;'>\n      <p style='margin: 0; font-weight: bold; color: #1b5e20;'>3. Verrouillage en deux phases (2PL)</p>\n      <p style='margin: 5px 0 0 0; color: #1a1a1a;'>Tous les verrous sont acquis en première phase, puis relâchés en deuxième phase.</p>\n    </div>\n  </div>\n  <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'>\n    <p style='color: #1a1a1a; margin: 0;'><strong>⚠️ Astuce :</strong> Dans les applications, il est recommandé d'accéder aux tables dans un ordre cohérent pour réduire les risques de deadlock.</p>\n  </div>\n</div>",
    "texteParle": "Pour prévenir les deadlocks, plusieurs stratégies existent. La première est l'ordre d'accès. Il s'agit d'accéder aux ressources dans un ordre défini, par exemple par identifiant. Cela évite les dépendances circulaires. La deuxième est le timeout. On définit un délai maximum d'attente. Si le délai est dépassé, la transaction est annulée. La troisième est le verrouillage en deux phases, ou two-phase locking. Tous les verrous sont acquis dans une première phase, puis relâchés dans une deuxième phase. Une astuce pratique : dans les applications, il est recommandé d'accéder aux tables dans un ordre cohérent pour réduire les risques de deadlock.",
    "note": "La prévention des deadlocks est une bonne pratique de conception des bases de données."
  },
  {
    "titre": "Résumé et Conclusion",
    "contenu": "<div style='font-size: 1em; line-height: 1.8; color: #333; font-family: sans-serif;'>\n  <div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p style='margin: 0; text-align: center; font-weight: bold; color: #1a1a1a;'>📌 À retenir</p>\n  </div>\n  <div style='display: flex; flex-direction: column; gap: 12px; margin: 15px 0;'>\n    <div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; border-left: 4px solid #1565c0;'>\n      <p style='margin: 0; color: #1a1a1a;'><strong>1. Verrous</strong></p>\n      <p style='margin: 5px 0 0 0; color: #555;'>Partagés (lecture) vs Exclusifs (écriture). Granularité : ligne vs table.</p>\n    </div>\n    <div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 4px solid #2e7d32;'>\n      <p style='margin: 0; color: #1a1a1a;'><strong>2. MVCC</strong></p>\n      <p style='margin: 5px 0 0 0; color: #555;'>Multi-Version Concurrency Control : plusieurs versions des données pour améliorer la concurrence.</p>\n    </div>\n    <div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; border-left: 4px solid #e65100;'>\n      <p style='margin: 0; color: #1a1a1a;'><strong>3. Deadlocks</strong></p>\n      <p style='margin: 5px 0 0 0; color: #555;'>Interblocages : détection, résolution (ROLLBACK), prévention (ordre, timeout).</p>\n    </div>\n  </div>\n  <div style='background-color: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'>\n    <p style='margin: 0; color: #1a1a1a;'><strong>🎯 Conclusion :</strong> La gestion de la concurrence est cruciale pour les performances et la fiabilité des bases de données.</p>\n  </div>\n</div>",
    "texteParle": "Pour conclure ce cours sur le verrouillage et le MVCC, retenons trois points clés. Premier point : les verrous. Ils peuvent être partagés pour les lectures, ou exclusifs pour les écritures. Ils peuvent être posés au niveau des lignes ou des tables. Deuxième point : le MVCC, qui utilise plusieurs versions des données pour améliorer la concurrence. Troisième point : les deadlocks, ou interblocages. Ils doivent être détectés et résolus, souvent par l'annulation d'une transaction. On peut aussi les prévenir par l'ordre d'accès ou les timeouts. En conclusion, la gestion de la concurrence est cruciale pour les performances et la fiabilité des bases de données.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';

            note.style.color = '#2c3e50';

            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {

            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
