<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Base de Données Avancées et Big Data - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Sequence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Modélisation Temporelle et SCD",
     "points": "5 pts",
     "enonce": "<p style='text-align: justify;'>Une entreprise souhaite suivre l'historique des changements de salaire de ses employés. Chaque employé a un identifiant, un nom, un poste et un salaire. Les modifications de salaire doivent être traçables dans le temps.</p>",
     "questions": [
       {
         "question": "<strong>1.1</strong> Proposez un schéma de base de données relationnelle permettant de gérer l'historique des salaires. Utilisez les notions de table de validité et de transaction.",
         "reponse": "<p style='text-align: justify;'>Pour gérer l'historique des salaires, on peut créer deux tables :</p><ul style='text-align: justify;'><li><strong>Employe</strong> : contient les informations permanentes (id, nom, poste).</li><li><strong>Employe_Salaire</strong> : contient l'historique des salaires avec les colonnes id_employe, salaire, date_debut (validité), date_fin (validité).</li></ul><p style='text-align: justify;'>Exemple de schéma :</p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE TABLE Employe ( id INT PRIMARY KEY, nom VARCHAR(100), poste VARCHAR(100)); CREATE TABLE Employe_Salaire ( id INT PRIMARY KEY, id_employe INT REFERENCES Employe(id), salaire DECIMAL(10,2), date_debut DATE, date_fin DATE);</pre>"
       },
       {
         "question": "<strong>1.2</strong> Expliquez la différence entre une SCD (Slowly Changing Dimension) de type 2 et une SCD de type 1. Quel type serait le plus adapté à cette situation ?",
         "reponse": "<p style='text-align: justify;'>Les différences sont :</p><ul style='text-align: justify;'><li><strong>SCD Type 1</strong> : les anciennes données sont écrasées. On ne conserve que la dernière valeur. Cela ne permet pas de tracer l'historique.</li><li><strong>SCD Type 2</strong> : on conserve l'historique en ajoutant une nouvelle ligne pour chaque modification, avec des dates de validité.</li></ul><p style='text-align: justify;'>Pour suivre l'historique des salaires, il est préférable d'utiliser une <strong>SCD Type 2</strong> car elle permet de conserver toutes les versions passées et d'analyser l'évolution des salaires dans le temps.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Modélisation des Hiérarchies",
     "points": "4 pts",
     "enonce": "<p style='text-align: justify;'>On souhaite modéliser une structure hiérarchique d'employés dans une entreprise. Chaque employé a un manager (sauf le directeur). On doit pouvoir effectuer des requêtes récursives pour obtenir la hiérarchie complète.</p>",
     "questions": [
       {
         "question": "<strong>2.1</strong> Proposez deux approches pour modéliser cette hiérarchie en base de données relationnelle. Donnez un exemple de schéma pour chaque approche.",
         "reponse": "<p style='text-align: justify;'><strong>Approche 1 : Tables imbriquées (Adjacency List)</strong></p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE TABLE Employe ( id INT PRIMARY KEY, nom VARCHAR(100), manager_id INT REFERENCES Employe(id));</pre><p style='text-align: justify;'>Cette approche est simple mais nécessite des requêtes récursives (CTE) pour obtenir toute la hiérarchie.</p><p style='text-align: justify;'><strong>Approche 2 : Closure Table</strong></p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE TABLE Employe ( id INT PRIMARY KEY, nom VARCHAR(100)); CREATE TABLE Employe_Closure ( ancestor INT REFERENCES Employe(id), descendant INT REFERENCES Employe(id), depth INT);</pre>"
       },
       {
         "question": "<strong>2.2</strong> Expliquez l'avantage de l'approche Closure Table par rapport à l'approche des tables imbriquées pour les requêtes hiérarchiques.",
         "reponse": "<p style='text-align: justify;'>L'approche Closure Table a l'avantage de permettre des requêtes hiérarchiques complexes (tous les descendants, tous les ancêtres, sous-arbre) en une seule requête SQL, sans utiliser de CTE récursives. Les requêtes sont plus simples et souvent plus rapides pour les hiérarchies profondes. En revanche, elle nécessite plus d'espace de stockage pour la table de closure.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Indexation Avancée",
     "points": "5 pts",
     "enonce": "<p style='text-align: justify;'>On considère une table <strong>Ventes</strong> avec les colonnes suivantes : id_vente, date_vente, id_produit, id_client, montant. La table contient 10 millions de lignes. Les requêtes les plus fréquentes sont :</p><ul><li>Recherche des ventes par produit sur une période donnée.</li><li>Recherche des ventes par client sur une période donnée.</li></ul>",
     "questions": [
       {
         "question": "<strong>3.1</strong> Quels types d'index recommanderiez-vous pour optimiser ces requêtes ? Justifiez votre réponse.",
         "reponse": "<p style='text-align: justify;'>Pour optimiser les requêtes, je recommande :</p><ul style='text-align: justify;'><li>Un <strong>index composite</strong> sur (id_produit, date_vente) pour la recherche par produit et période.</li><li>Un <strong>index composite</strong> sur (id_client, date_vente) pour la recherche par client et période.</li><li>Un <strong>index simple</strong> sur date_vente pour les requêtes de période uniquement.</li></ul><p style='text-align: justify;'>Les index composites sont particulièrement efficaces car ils couvrent les deux conditions de la requête (filtre par id + plage de dates).</p>"
       },
       {
         "question": "<strong>3.2</strong> Qu'est-ce qu'un index partiel et dans quel cas pourrait-il être utile sur cette table ?",
         "reponse": "<p style='text-align: justify;'>Un index partiel est un index qui ne porte que sur un sous-ensemble de lignes répondant à une condition. Par exemple, si 90% des requêtes portent sur les ventes des 12 derniers mois, on pourrait créer un index partiel :</p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE INDEX idx_ventes_recentes ON Ventes (id_produit, date_vente) WHERE date_vente >= CURRENT_DATE - INTERVAL '1 year';</pre><p style='text-align: justify;'>Cet index serait plus petit et plus rapide à maintenir qu'un index complet, tout en couvrant la majorité des requêtes.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Plans d'Exécution et EXPLAIN",
     "points": "4 pts",
     "enonce": "<p style='text-align: justify;'>On exécute la requête suivante sur une base de données :</p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>SELECT e.nom, v.montant FROM Ventes v JOIN Employe e ON v.id_employe = e.id WHERE v.date_vente > '2025-01-01';</pre><p style='text-align: justify;'>L'analyse avec EXPLAIN montre que la requête utilise un scan séquentiel sur la table Ventes.</p>",
     "questions": [
       {
         "question": "<strong>4.1</strong> Que signifie un scan séquentiel (table scan) et pourquoi peut-il être problématique pour une table volumineuse ?",
         "reponse": "<p style='text-align: justify;'>Un scan séquentiel (ou table scan) signifie que la base de données parcourt l'intégralité des lignes de la table pour trouver les données correspondant à la condition de la requête. Pour une table de 10 millions de lignes, cela signifie lire les 10 millions de lignes, ce qui est très coûteux en temps et en ressources I/O. C'est particulièrement problématique si la requête est exécutée fréquemment.</p>"
       },
       {
         "question": "<strong>4.2</strong> Proposez une solution pour améliorer les performances de cette requête en utilisant un index. Rédigez la commande SQL correspondante.",
         "reponse": "<p style='text-align: justify;'>Pour améliorer les performances, on peut créer un index sur la colonne <code>date_vente</code> :</p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE INDEX idx_ventes_date ON Ventes (date_vente);</pre><p style='text-align: justify;'>Cet index permettra au SGBD d'utiliser un index scan pour localiser rapidement les lignes correspondant à la condition <code>date_vente > '2025-01-01'</code>, au lieu de parcourir toute la table.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Introduction aux Bases NoSQL",
     "points": "4 pts",
     "enonce": "<p style='text-align: justify;'>Une application de gestion de réseaux sociaux doit stocker des informations sur les utilisateurs et leurs relations d'amitié. Les données sont très volumineuses (plus de 100 millions d'utilisateurs) et les requêtes de type \"amis d'amis\" sont fréquentes.</p>",
     "questions": [
       {
         "question": "<strong>5.1</strong> Quel type de base NoSQL recommanderiez-vous pour cette application et pourquoi ?",
         "reponse": "<p style='text-align: justify;'>Je recommanderais une <strong>base orientée graphes (ex: Neo4j)</strong> pour les raisons suivantes :</p><ul style='text-align: justify;'><li>Les relations d'amitié sont naturelles dans un modèle de graphes (nœuds = utilisateurs, relations = amitiés).</li><li>Les requêtes de type \"amis d'amis\" (parcours de graphes) sont très efficaces dans une base graphes.</li><li>Le modèle de graphes offre une grande flexibilité pour ajouter de nouveaux types de relations.</li></ul><p style='text-align: justify;'>Les bases de type document (MongoDB) ou clé-valeur (Redis) seraient moins adaptées pour ce type de requêtes relationnelles complexes.</p>"
       },
       {
         "question": "<strong>5.2</strong> Expliquez le théorème CAP et comment il s'applique aux bases de données NoSQL.",
         "reponse": "<p style='text-align: justify;'>Le théorème CAP (Consistency, Availability, Partition tolerance) stipule qu'un système distribué ne peut garantir simultanément que deux des trois propriétés suivantes :</p><ul style='text-align: justify;'><li><strong>Cohérence (Consistency)</strong> : toutes les copies des données sont identiques à tout moment.</li><li><strong>Disponibilité (Availability)</strong> : le système répond toujours aux requêtes.</li><li><strong>Tolérance aux partitions (Partition Tolerance)</strong> : le système continue de fonctionner malgré des partitions réseau.</li></ul><p style='text-align: justify;'>Les bases NoSQL font des compromis différents : MongoDB privilégie la cohérence, Cassandra privilégie la disponibilité et la tolérance aux partitions (AP), etc.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 6 : Procédures Stockées et Triggers",
     "points": "4 pts",
     "enonce": "<p style='text-align: justify;'>Dans une base de données de gestion de stock, on souhaite automatiser la mise à jour du niveau de stock lorsqu'une vente est enregistrée. Le stock est stocké dans la table <strong>Produit</strong> (id, nom, quantite) et les ventes dans la table <strong>Vente</strong> (id, id_produit, quantite, date).</p>",
     "questions": [
       {
         "question": "<strong>6.1</strong> Créez un trigger qui met automatiquement à jour le stock après l'insertion d'une vente.",
         "reponse": "<p style='text-align: justify;'>Le trigger doit décrémenter la quantité du produit concerné lors de l'insertion d'une vente :</p><pre style='background: #f4f4f4; padding: 10px; border-radius: 5px; color: #333; overflow-x: auto;'>CREATE TRIGGER update_stock AFTER INSERT ON Vente FOR EACH ROW BEGIN UPDATE Produit SET quantite = quantite - NEW.quantite WHERE id = NEW.id_produit; END;</pre><p style='text-align: justify;'>Ce trigger utilise les mots-clés <code>AFTER INSERT</code> pour s'exécuter après l'insertion, et <code>NEW.quantite</code> pour accéder à la nouvelle valeur insérée.</p>"
       },
       {
         "question": "<strong>6.2</strong> Quels sont les avantages et les inconvénients de l'utilisation d'un trigger par rapport à une procédure stockée ?",
         "reponse": "<p style='text-align: justify;'><strong>Avantages du trigger :</strong></p><ul><li>Automatique : s'exécute sans intervention explicite de l'utilisateur.</li><li>Garantit l'intégrité des données.</li></ul><p style='text-align: justify;'><strong>Inconvénients du trigger :</strong></p><ul><li>Moins visible : difficile à déboguer et à maintenir.</li><li>Peut ralentir les opérations d'insertion/mise à jour.</li></ul><p style='text-align: justify;'><strong>Avantage de la procédure stockée :</strong></p><ul><li>Plus contrôlable : l'appel est explicite.</li><li>Peut être réutilisée dans différents contextes.</li></ul>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
