<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Base de Données Avancées et Big Data",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modélisation Avancée - Gestion de Projet",
      "points": "4 pts",
      "enonce": "<p>Une entreprise informatique gère des projets de développement. Chaque projet est confié à une équipe de développeurs. Chaque développeur peut travailler sur plusieurs projets. Un projet nécessite la maîtrise de plusieurs langages de programmation. La relation entre Projet, Développeur et Langage est ternaire : un développeur sur un projet donné utilise un certain langage avec un niveau de maîtrise.</p><p><strong>Questions :</strong></p>",
      "questions": [
        {
          "question": "<p>1.1) (1 pt) Identifier les entités et les associations dans ce système. Déterminer les cardinalités de l'association ternaire.</p>",
          "reponse": "<p><strong>Entités :</strong> Projet, Développeur, Langage.</p><p><strong>Association :</strong> Utilise (ternaire entre Projet, Développeur, Langage).</p><p><strong>Cardinalités :</strong></p><ul><li>Un Développeur peut participer à plusieurs Projets et utiliser plusieurs Langages.</li><li>Un Projet peut impliquer plusieurs Développeurs et plusieurs Langages.</li><li>Un Langage peut être utilisé par plusieurs Développeurs sur plusieurs Projets.</li></ul>"
        },
        {
          "question": "<p>1.2) (1,5 pt) Proposer une structure de table pour implémenter cette association ternaire dans une base de données relationnelle. Inclure les clés primaires et étrangères.</p>",
          "reponse": "<p><strong>Tables :</strong></p><ul><li><strong>Projet</strong> (id_projet INT PRIMARY KEY, nom_projet VARCHAR(50), date_debut DATE, date_fin DATE)</li><li><strong>Developpeur</strong> (id_dev INT PRIMARY KEY, nom VARCHAR(50), prenom VARCHAR(50), email VARCHAR(50))</li><li><strong>Langage</strong> (id_langage INT PRIMARY KEY, nom_langage VARCHAR(30), categorie VARCHAR(30))</li><li><strong>Utilise</strong> (id_projet INT, id_dev INT, id_langage INT, niveau_maitrise VARCHAR(20), PRIMARY KEY (id_projet, id_dev, id_langage), FOREIGN KEY (id_projet) REFERENCES Projet(id_projet), FOREIGN KEY (id_dev) REFERENCES Developpeur(id_dev), FOREIGN KEY (id_langage) REFERENCES Langage(id_langage))</li></ul>"
        },
        {
          "question": "<p>1.3) (1,5 pt) Écrire la requête SQL qui permet de lister tous les développeurs qui participent au projet intitulé 'Projet Alpha' avec leur niveau de maîtrise en Python.</p>",
          "reponse": "<p>SELECT d.nom, d.prenom, u.niveau_maitrise<br>FROM Developpeur d<br>JOIN Utilise u ON d.id_dev = u.id_dev<br>JOIN Projet p ON u.id_projet = p.id_projet<br>JOIN Langage l ON u.id_langage = l.id_langage<br>WHERE p.nom_projet = 'Projet Alpha' AND l.nom_langage = 'Python';</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Optimisation des Requêtes SQL",
      "points": "4 pts",
      "enonce": "<p>Soit la table <strong>Ventes</strong> avec les colonnes suivantes : id_vente, id_produit, id_client, date_vente, montant, quantite, region. La table contient 10 millions d'enregistrements.</p><p><strong>Questions :</strong></p>",
      "questions": [
        {
          "question": "<p>2.1) (1,5 pt) Décrivez trois types d'index (B-Tree, Hash, Bitmap) et précisez dans quel contexte chacun est le plus adapté.</p>",
          "reponse": "<ul><li><strong>B-Tree :</strong> Index généraliste, adapté aux requêtes de recherche d'égalité et de plage. Efficace pour les requêtes avec des comparaisons (=, <, >, BETWEEN). Idéal pour les colonnes avec une cardinalité élevée.</li><li><strong>Hash :</strong> Optimisé pour les recherches d'égalité exacte. Très rapide pour les requêtes avec =. Ne supporte pas les recherches de plage.</li><li><strong>Bitmap :</strong> Adapté aux colonnes avec une faible cardinalité (ex: genre, statut). Utilisé pour les requêtes avec des conditions combinées (AND, OR). Très efficace dans les entrepôts de données pour les requêtes complexes.</li></ul>"
        },
        {
          "question": "<p>2.2) (1,5 pt) Vous exécutez la requête suivante : <code>SELECT SUM(montant) FROM Ventes WHERE date_vente BETWEEN '2025-01-01' AND '2025-12-31' AND region = 'Douala' AND quantite > 5;</code></p><p>Proposez une stratégie d'indexation pour optimiser cette requête. Justifiez votre choix.</p>",
          "reponse": "<p>Je propose un <strong>index composite</strong> sur (region, date_vente, quantite) ou un index sur (date_vente, region, quantite) selon la sélectivité.</p><p>Justification :</p><ul><li>L'index sur region permet de filtrer rapidement sur la région.</li><li>L'index sur date_vente permet de filtrer sur la plage de dates.</li><li>L'index sur quantite permet d'optimiser le filtre quantite > 5.</li><li>Un index composite couvre les trois conditions, ce qui réduit le nombre de lignes à parcourir.</li></ul>"
        },
        {
          "question": "<p>2.3) (1 pt) Expliquez la différence entre un index partiel et un index fonctionnel. Donnez un exemple pour chacun.</p>",
          "reponse": "<ul><li><strong>Index partiel :</strong> Index créé sur un sous-ensemble des lignes de la table, défini par une condition WHERE. Exemple : <code>CREATE INDEX idx_ventes_region_douala ON Ventes (id_produit) WHERE region = 'Douala';</code></li><li><strong>Index fonctionnel :</strong> Index créé sur le résultat d'une fonction appliquée à une colonne. Exemple : <code>CREATE INDEX idx_ventes_date_trunc ON Ventes (DATE_TRUNC('month', date_vente));</code></li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Transactions et Verrouillage",
      "points": "3 pts",
      "enonce": "<p>Une banque gère les comptes de ses clients. Deux transactions simultanées tentent d'effectuer les opérations suivantes :</p><ul><li><strong>Transaction A :</strong> Virement de 5000 FCFA du compte C1 vers le compte C2.</li><li><strong>Transaction B :</strong> Consultation du solde du compte C1 et du compte C2.</li></ul>",
      "questions": [
        {
          "question": "<p>3.1) (1 pt) Expliquez le concept de 'dirty read'. Cette situation est-elle possible dans cette configuration ?</p>",
          "reponse": "<p>Un 'dirty read' se produit lorsqu'une transaction lit des données qui ont été modifiées par une autre transaction non encore validée (commit). Dans cette configuration, si Transaction A modifie C1 et C2 sans avoir encore fait COMMIT, et que Transaction B lit ces valeurs modifiées, on a un dirty read. Cela peut poser problème si Transaction A est finalement annulée (ROLLBACK).</p>"
        },
        {
          "question": "<p>3.2) (1 pt) Quel niveau d'isolation recommanderiez-vous pour éviter ce phénomène ? Expliquez brièvement.</p>",
          "reponse": "<p>Je recommande le niveau <strong>READ COMMITTED</strong>.</p><p>Ce niveau empêche les dirty reads car une transaction ne peut lire que des données déjà commitées. Ainsi, Transaction B ne verra pas les modifications de Transaction A tant qu'elles ne sont pas validées.</p>"
        },
        {
          "question": "<p>3.3) (1 pt) Décrivez le problème d'interblocage (deadlock) et proposez une stratégie pour l'éviter dans ce contexte.</p>",
          "reponse": "<p>Un interblocage se produit lorsque deux transactions se bloquent mutuellement en attendant chacune que l'autre libère un verrou. Dans ce contexte, si Transaction A verrouille C1 puis C2, et Transaction B verrouille C2 puis C1, elles peuvent se bloquer.</p><p>Stratégie pour l'éviter : <strong>Verrouillage ordonné</strong> - toutes les transactions doivent verrouiller les comptes dans le même ordre (ex: par ordre croissant des IDs). On peut aussi utiliser un timeout pour interrompre les transactions qui attendent trop longtemps.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Procédures Stockées et Triggers",
      "points": "3 pts",
      "enonce": "<p>Une entreprise souhaite automatiser la gestion des stocks. À chaque nouvelle vente, la quantité en stock du produit correspondant doit être automatiquement mise à jour. De plus, si le stock tombe en dessous d'un seuil critique (10 unités), une alerte doit être enregistrée.</p>",
      "questions": [
        {
          "question": "<p>4.1) (2 pts) Écrire un trigger qui met à jour le stock après chaque insertion dans une table de ventes et qui enregistre une alerte si le stock devient critique.</p>",
          "reponse": "<p>CREATE TRIGGER gestion_stock<br>AFTER INSERT ON Ventes<br>FOR EACH ROW<br>BEGIN<br>&nbsp;&nbsp;&nbsp;&nbsp;UPDATE Produits<br>&nbsp;&nbsp;&nbsp;&nbsp;SET quantite_stock = quantite_stock - NEW.quantite<br>&nbsp;&nbsp;&nbsp;&nbsp;WHERE id_produit = NEW.id_produit;<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;-- Vérifier le stock<br>&nbsp;&nbsp;&nbsp;&nbsp;DECLARE stock_actuel INT;<br>&nbsp;&nbsp;&nbsp;&nbsp;SELECT quantite_stock INTO stock_actuel FROM Produits WHERE id_produit = NEW.id_produit;<br>&nbsp;&nbsp;&nbsp;&nbsp;IF stock_actuel < 10 THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;INSERT INTO Alertes (id_produit, message, date_alerte)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;VALUES (NEW.id_produit, 'Stock critique pour le produit', NOW());<br>&nbsp;&nbsp;&nbsp;&nbsp;END IF;<br>END;</p>"
        },
        {
          "question": "<p>4.2) (1 pt) Expliquez la différence entre un trigger BEFORE et un trigger AFTER. Quand utiliseriez-vous l'un plutôt que l'autre ?</p>",
          "reponse": "<p>Un trigger <strong>BEFORE</strong> s'exécute <strong>avant</strong> l'opération (INSERT, UPDATE, DELETE) sur la table. Il est utilisé pour valider ou modifier les données avant qu'elles ne soient enregistrées.</p><p>Un trigger <strong>AFTER</strong> s'exécute <strong>après</strong> l'opération. Il est utilisé pour des actions qui dépendent du résultat final de l'opération, comme la mise à jour d'autres tables.</p><p>Dans cet exercice, un trigger AFTER est approprié car l'action dépend du résultat de l'insertion dans la table Ventes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Introduction aux Bases NoSQL",
      "points": "3 pts",
      "enonce": "<p>Une startup souhaite choisir une base de données NoSQL pour son projet. Voici les différents cas d'usage :</p><ul><li><strong>Application 1 :</strong> Stockage de données de capteurs IoT en temps réel avec des millions d'écritures par jour.</li><li><strong>Application 2 :</strong> Réseau social avec des relations complexes entre utilisateurs (amis, abonnements, recommandations).</li><li><strong>Application 3 :</strong> Catalogue de produits avec des attributs variables (fiches produits personnalisées).</li></ul>",
      "questions": [
        {
          "question": "<p>5.1) (1,5 pt) Associez chaque application au type de base NoSQL le plus adapté et justifiez votre choix.</p>",
          "reponse": "<ul><li><strong>Application 1 (IoT) :</strong> Base <strong>Colonnes (ex: Cassandra)</strong> - Optimisée pour les écritures massives et la scalabilité horizontale.</li><li><strong>Application 2 (Réseau social) :</strong> Base <strong>Graphes (ex: Neo4j)</strong> - Idéale pour les relations complexes et les parcours de graphes.</li><li><strong>Application 3 (Catalogue) :</strong> Base <strong>Documentaire (ex: MongoDB)</strong> - Flexible pour des schémas variables et des structures de documents imbriquées.</li></ul>"
        },
        {
          "question": "<p>5.2) (1,5 pt) Expliquez le théorème CAP (Consistency, Availability, Partition tolerance) et comment il influence le choix d'une base NoSQL.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
