<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Base de Données Avancées et Big Data - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Les 5 V du Big Data - Étude de Cas",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.8; padding: 10px;'> <p style='font-size: 16px;'>Orange Cameroun, un opérateur de télécommunications, collecte chaque jour des données massives provenant de ses 12 millions d'abonnés à travers le pays. Ces données incluent :</p> <ul style='font-size: 15px; margin-left: 20px;'> <li>Les enregistrements de détails d'appels (CDR) pour chaque communication.</li> <li>Les logs de connexion Internet des utilisateurs.</li> <li>Les données de localisation en temps réel des mobiles.</li> <li>Les profils des clients et leurs habitudes de consommation.</li> <li>Les interactions avec le service client.</li> </ul> <p style='font-size: 16px;'>L'entreprise souhaite utiliser ces données pour optimiser son réseau et proposer des offres personnalisées.</p> </div>",
     "questions": [
       {
         "question": "1) <strong>Identifier les 5 V</strong> (2 pts) <p>Associez chaque V du Big Data à un défi spécifique rencontré par Orange Cameroun dans ce contexte. Justifiez chaque association par un exemple issu de la situation décrite.</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>1. Volume :</strong> La quantité massive de données générées chaque jour par 12 millions d'abonnés (CDR, logs Internet, localisation). <strong>Exemple :</strong> Stocker et traiter des pétaoctets de données d'appels et de navigation.</p> <p><strong>2. Vélocité :</strong> La rapidité à laquelle les données sont générées et doivent être traitées. <strong>Exemple :</strong> Analyser les données de localisation en temps réel pour optimiser le réseau lors d'événements spéciaux (fêtes, grands rassemblements) [citation:9].</p> <p><strong>3. Variété :</strong> La diversité des formats de données collectées. <strong>Exemple :</strong> Combiner des données structurées (profils clients) avec des données non structurées (logs, textes des interactions) [citation:9].</p> <p><strong>4. Véracité :</strong> La fiabilité et la qualité des données. <strong>Exemple :</strong> Gérer les données manquantes ou les doublons (clients avec plusieurs numéros, zones sans couverture) [citation:3].</p> <p><strong>5. Valeur :</strong> L'utilité des données pour générer des insights. <strong>Exemple :</strong> Analyser les habitudes de consommation pour créer des offres personnalisées et augmenter la satisfaction client [citation:11].</p> </div>"
       },
       {
         "question": "2) <strong>Analyser l'impact de la Vélocité</strong> (2 pts) <p>Expliquez pourquoi la Vélocité est critique pour Orange Cameroun. Proposez une solution technologique adaptée pour traiter les données de localisation en temps réel et discutez des avantages pour l'entreprise.</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Criticité de la Vélocité :</strong> Pour un opérateur télécom, la Vélocité est cruciale car :</p> <ul> <li><strong>Réactivité réseau :</strong> Permet de détecter et résoudre les congestions en temps réel.</li> <li><strong>Expérience client :</strong> Les offres personnalisées doivent être proposées au bon moment.</li> <li><strong>Sécurité :</strong> Détection rapide des fraudes ou des anomalies.</li> </ul> <p><strong>Solution technologique :</strong> Apache Kafka pour l'ingestion en temps réel et Apache Spark Streaming pour le traitement en micro-batchs [citation:2].</p> <p><strong>Avantages :</strong> <br> - Optimisation dynamique du réseau. <br> - Amélioration de la satisfaction client. <br> - Réduction des coûts opérationnels.</p> </div>"
       },
       {
         "question": "3) <strong>Proposer une stratégie pour la Véracité</strong> (1 pt) <p>Décrivez une stratégie que Orange Cameroun pourrait mettre en place pour améliorer la qualité (Véracité) de ses données. Mentionnez au moins deux actions concrètes.</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Stratégie d'amélioration de la Véracité :</strong></p> <ul> <li><strong>Nettoyage automatisé :</strong> Mettre en place des pipelines de données avec PySpark ou Pandas pour détecter et corriger les données manquantes, les doublons et les incohérences [citation:6].</li> <li><strong>Validation à la source :</strong> Imposer des règles de validation lors de la collecte des données (ex: format des numéros de téléphone, plages de dates valides).</li> <li><strong>Audit régulier :</strong> Mettre en place des rapports de qualité pour surveiller l'évolution de la fiabilité des données.</li> </ul> </div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Écosystème Hadoop et MapReduce",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.8; padding: 10px;'> <p style='font-size: 16px;'>L'écosystème Hadoop est au cœur du traitement des données massives. Comprendre ses composants est essentiel pour un data scientist.</p> <p>Répondez aux questions suivantes :</p> </div>",
     "questions": [
       {
         "question": "1) <strong>Architecture Hadoop</strong> (2 pts) <p>Décrivez l'architecture de Hadoop en détaillant les rôles de HDFS et de YARN. Expliquez comment ces deux composants interagissent pour exécuter un job MapReduce.</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Architecture Hadoop :</strong></p> <ul> <li><strong>HDFS (Hadoop Distributed File System) :</strong> Système de fichiers distribué. Il gère le stockage des données sur plusieurs nœuds. Il se compose d'un <strong>NameNode</strong> (gère les métadonnées) et de plusieurs <strong>DataNodes</strong> (stockent les blocs de données).</li> <li><strong>YARN (Yet Another Resource Negotiator) :</strong> Gestionnaire de ressources. Il alloue les ressources (CPU, mémoire) aux applications.</li> </ul> <p><strong>Interaction pour un job MapReduce :</strong></p> <ol> <li>Le client soumet le job à YARN (ResourceManager).</li> <li>YARN lance un ApplicationMaster sur un NodeManager.</li> <li>L'ApplicationMaster négocie les conteneurs pour les tâches Map et Reduce.</li> <li>Les tâches Map lisent les données depuis HDFS, les traitent et écrivent les résultats intermédiaires.</li> <li>Les tâches Reduce lisent les résultats intermédiaires, les agrègent et écrivent le résultat final dans HDFS [citation:14].</li> </ol> </div>"
       },
       {
         "question": "2) <strong>MapReduce en pratique</strong> (2 pts) <p>Implémentez un job MapReduce en Python (avec MRJob) pour compter le nombre d'occurrences de chaque mot dans un fichier texte. Expliquez le rôle de chaque étape (Map, Shuffle, Reduce).</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <pre style='background-color: #2c3e50; color: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto;'>from mrjob.job import MRJob\n\nclass MRWordCount(MRJob):\n    def mapper(self, _, line):\n        for word in line.split():\n            yield word, 1\n\n    def reducer(self, word, counts):\n        yield word, sum(counts)\n\nif __name__ == '__main__':\n    MRWordCount.run()</pre> <p><strong>Rôle des étapes :</strong></p> <ul> <li><strong>Map :</strong> Transforme chaque ligne en paires (mot, 1).</li> <li><strong>Shuffle :</strong> Regroupe automatiquement les paires par clé (mot).</li> <li><strong>Reduce :</strong> Agrège les valeurs pour chaque clé en calculant la somme [citation:4].</li> </ul> </div>"
       },
       {
         "question": "3) <strong>Spark vs MapReduce</strong> (2 pts) <p>Comparez Apache Spark et MapReduce sur trois critères : performance, modélisation et facilité d'utilisation. Expliquez pourquoi Spark est souvent préféré pour les projets Data Science.</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Comparaison :</strong></p> <table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <thead> <tr style='background-color: #34495e; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Critère</th> <th style='padding: 8px; border: 1px solid #ddd;'>MapReduce</th> <th style='padding: 8px; border: 1px solid #ddd;'>Apache Spark</th> </tr> </thead> <tbody> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Performance</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Plus lent (accès disque)</td> <td style='padding: 8px; border: 1px solid #ddd;'>Plus rapide (calcul en mémoire) [citation:2]</td> </tr> <tr style='background-color: #f9f9f9;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Modélisation</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Basé sur Map et Reduce</td> <td style='padding: 8px; border: 1px solid #ddd;'>RDD, DataFrames, SQL, Streaming, ML</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Facilité d'utilisation</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Plus complexe</td> <td style='padding: 8px; border: 1px solid #ddd;'>Plus simple (API Python, SQL) [citation:6]</td> </tr> </tbody> </table> <p><strong>Préférence pour Spark :</strong> Spark est préféré en Data Science pour sa vitesse (traitement en mémoire), sa polyvalence (SQL, Streaming, MLlib) et sa facilité d'utilisation avec PySpark [citation:2].</p> </div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Apache Spark - Programmation et Optimisation",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.8; padding: 10px;'> <p style='font-size: 16px;'>Apache Spark est un framework de choix pour le traitement de données à grande échelle. La maîtrise de ses concepts est fondamentale pour un data scientist.</p> </div>",
     "questions": [
       {
         "question": "1) <strong>RDD et DataFrames</strong> (2 pts) <p>Distinguez les RDD (Resilient Distributed Datasets) des DataFrames dans Spark. Pourquoi les DataFrames sont-ils généralement préférés pour l'analyse de données ?</p>",
         "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>RDD (Resilient Distributed Datasets) :</strong></p> <ul> <li>Collection distribuée d'objets (type générique).</li> <li>API fonctionnelle (map, filter, reduceByKey).</li> <li>Pas de schéma défini.</li> </ul> <p><strong>DataFrames :</strong></p> <ul> <li>Collection distribuée de données organisée en colonnes nommées (comme une table SQL).</li> <li>API déclarative avec Spark SQL.</li> <li>Schéma défini et optimisé.</li> </ul> <p><strong>Avantages des DataFrames :</strong></p> <ul> <li><strong>Optimisation :</strong> Catalyst optimizer améliore les performances.</li> <li><strong>Syntaxe :</strong> Plus simple et plus lisible.</li> <li><strong>Intégration :</strong> SQL et Python (PySpark) [citation:2].</li> </ul> </div>"
       },
       {
         "question": "2) <strong>Optimisation avec Catalyst</strong> (1 pt) <p>Expliquez le rôle du moteur d'optimisation Catalyst dans Spark. Comment améliore-t-il les performances des requêtes sur les DataFrames ?</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
