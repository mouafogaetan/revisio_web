<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Base de Données Avancées et Big Data - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modélisation Temporelle et SCD (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Une entreprise de e-commerce souhaite suivre l'historique des adresses de ses clients pour des analyses de fidélisation et de livraison. Un client peut changer d'adresse au fil du temps. L'entreprise doit pouvoir connaître l'adresse d'un client à n'importe quelle date passée.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Proposez un schéma de table (nom des colonnes, types) permettant de stocker les adresses des clients en conservant tout l'historique. Expliquez le rôle de chaque colonne.</p>",
          "reponse": "<p>Table : <strong>AdresseClient</strong></p><ul><li><strong>id_adresse</strong> (INT, PRIMARY KEY) : Identifiant unique de l'enregistrement.</li><li><strong>id_client</strong> (INT, FOREIGN KEY) : Référence vers le client.</li><li><strong>adresse</strong> (VARCHAR) : L'adresse complète.</li><li><strong>ville</strong> (VARCHAR) : La ville.</li><li><strong>code_postal</strong> (VARCHAR) : Le code postal.</li><li><strong>date_debut</strong> (DATE) : Date à partir de laquelle cette adresse est valide.</li><li><strong>date_fin</strong> (DATE) : Date à laquelle cette adresse cesse d'être valide (NULL si c'est l'adresse actuelle).</li><li><strong>flag_actif</strong> (BOOLEAN) : Indique si c'est l'adresse courante (True pour l'enregistrement actif).</li></ul>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Expliquez en quoi ce modèle correspond à une approche de type SCD (Slowly Changing Dimension) et précisez de quel type (SCD Type 1, 2 ou 3) il s'agit.</p>",
          "reponse": "<p>Il s'agit d'une approche <strong>SCD Type 2</strong>.</p><p>Le Type 2 est utilisé lorsque l'on doit conserver un historique complet des changements d'une dimension (ici l'adresse). Chaque changement de valeur entraîne la création d'une nouvelle ligne avec des dates de validité, ce qui permet de suivre l'évolution de l'attribut dans le temps. Cela contraste avec le Type 1 qui écrase les données (pas d'historique) ou le Type 3 qui n'en conserve que partiellement.</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Écrivez la requête SQL permettant de récupérer l'adresse du client avec <span class='math-inline'>\\( id\_client = 123 \\)</span> à la date du <span class='math-inline'>\\( 2025-05-15 \\)</span>.</p>",
          "reponse": "<pre><code>SELECT adresse, ville, code_postal\nFROM AdresseClient\nWHERE id_client = 123\n  AND date_debut <= '2025-05-15'\n  AND (date_fin > '2025-05-15' OR date_fin IS NULL);\n</code></pre><p>Cette requête sélectionne l'enregistrement dont la date de début est avant ou égale à la date recherchée, et dont la date de fin est après cette date (ou nulle, pour l'enregistrement courant).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Optimisation des Requêtes SQL (7 pts)",
      "points": "7 pts",
      "enonce": "<p>On considère une base de données d'une plateforme de streaming vidéo contenant les tables suivantes :</p><ul><li><strong>Utilisateur</strong> (id_utilisateur, nom, email, date_inscription, pays)</li><li><strong>Film</strong> (id_film, titre, annee_sortie, categorie, duree)</li><li><strong>Visionnage</strong> (id_visionnage, id_utilisateur, id_film, date_visionnage, duree_vue)</li></ul>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> La requête suivante est exécutée fréquemment pour obtenir le nombre de visionnages par pays :</p><pre><code>SELECT u.pays, COUNT(v.id_visionnage) AS nb_visionnages\nFROM Utilisateur u\nJOIN Visionnage v ON u.id_utilisateur = v.id_utilisateur\nGROUP BY u.pays;\n</code></pre><p>Proposez un ou plusieurs index permettant d'optimiser cette requête. Justifiez votre choix.</p>",
          "reponse": "<p>Il est recommandé de créer un index composite sur la table Visionnage pour accélérer la jointure :</p><pre><code>CREATE INDEX idx_visionnage_utilisateur ON Visionnage(id_utilisateur);\n</code></pre><p>Cet index permettra au SGBD de retrouver rapidement les visionnages associés à un utilisateur. Si la table Utilisateur est également volumineuse, un index sur la colonne <strong>pays</strong> pourrait être bénéfique pour les groupements, mais l'index sur la clé étrangère est prioritaire.</p>"
        },
        {
          "question": "<p><strong>2. (3 pts)</strong> Expliquez ce qu'est un <strong>index partiel</strong> et proposez un scénario pertinent pour son utilisation dans le contexte de cette base de données.</p>",
          "reponse": "<p>Un <strong>index partiel</strong> (ou index filtré) est un index qui ne porte que sur un sous-ensemble de lignes d'une table, défini par une condition. Il est plus petit et plus efficace qu'un index sur toute la table.</p><p>Scénario : Si les analyses ne portent que sur les films récents (les 5 dernières années), on pourrait créer un index partiel sur la colonne <strong>id_film</strong> de la table Visionnage, mais en filtrant sur les visionnages de films récents :</p><pre><code>CREATE INDEX idx_visionnage_recent ON Visionnage(id_film)\nWHERE id_film IN (SELECT id_film FROM Film WHERE annee_sortie > 2020);\n</code></pre><p>Cet index optimiserait les requêtes ciblant spécifiquement les films récents.</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Expliquez ce qu'est un <strong>index fonctionnel</strong> et donnez un exemple d'utilisation pour cette base de données.</p>",
          "reponse": "<p>Un <strong>index fonctionnel</strong> est un index dont la clé est le résultat d'une fonction ou d'une expression appliquée à une ou plusieurs colonnes. Il permet d'accélérer les requêtes qui utilisent cette fonction dans leur condition WHERE.</p><p>Exemple : Si les recherches de films se font souvent par titre en ignorant la casse, on pourrait créer :</p><pre><code>CREATE INDEX idx_film_titre_lower ON Film(LOWER(titre));\n</code></pre><p>Cet index accélérerait les requêtes du type <span class='math-inline'>\\( \\text{SELECT * FROM Film WHERE LOWER(titre) = 'le parrain';} \\)</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Transactions et Verrouillage (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Une banque gère un système de comptes bancaires. Les opérations sont effectuées via des transactions SQL pour garantir l'intégrité des données.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Définissez les propriétés ACID d'une transaction et expliquez ce que garantit chacune d'elles.</p>",
          "reponse": "<p>Les propriétés ACID sont :</p><ul><li><strong>Atomicité (A) :</strong> Une transaction est une unité indivisible. Soit toutes les opérations sont exécutées (COMMIT), soit aucune (ROLLBACK).</li><li><strong>Cohérence (C) :</strong> Une transaction doit laisser la base de données dans un état cohérent, respectant toutes les contraintes (clés, règles métier).</li><li><strong>Isolation (I) :</strong> Les transactions concurrentes ne doivent pas interférer entre elles. Le résultat final doit être équivalent à une exécution en série.</li><li><strong>Durabilité (D) :</strong> Une fois qu'une transaction est validée (COMMIT), ses modifications sont persistantes, même en cas de panne système.</li></ul>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Écrivez le script SQL d'une transaction qui transfère 100 € du compte A vers le compte B. Gérez les cas d'erreur (ROLLBACK).</p>",
          "reponse": "<pre><code>BEGIN TRANSACTION;\n\nUPDATE Comptes SET solde = solde - 100 WHERE id = 'A';\nUPDATE Comptes SET solde = solde + 100 WHERE id = 'B';\n\n-- Vérification des contraintes et validation\nIF (SELECT solde FROM Comptes WHERE id = 'A') >= 0\n    COMMIT;\nELSE\n    ROLLBACK;\nEND IF;\n</code></pre>"
        },
        {
          "question": "<p><strong>3. (3 pts)</strong> Expliquez ce qu'est un <strong>deadlock</strong> et comment il peut survenir dans un système bancaire. Proposez des solutions pour les éviter ou les résoudre.</p>",
          "reponse": "<p>Un <strong>deadlock</strong> (ou interblocage) est une situation où deux transactions (ou plus) se bloquent mutuellement en attendant que l'autre libère une ressource (un verrou) pour pouvoir continuer.</p><p><strong>Scénario :</strong> La transaction T1 verrouille le compte A et veut verrouiller le compte B. La transaction T2 verrouille le compte B et veut verrouiller le compte A. Les deux transactions attendent indéfiniment.</p><p><strong>Solutions :</strong></p><ul><li><strong>Prévention :</strong> Verrouiller les ressources dans un ordre prédéfini (par exemple, par ordre alphabétique des identifiants de compte).</li><li><strong>Timeout :</strong> Définir un délai d'attente maximal. Si une transaction dépasse ce délai, elle est annulée (ROLLBACK) pour libérer les verrous.</li><li><strong>Détection :</strong> Utiliser un mécanisme de détection de deadlocks, qui annule alors l'une des transactions impliquées.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
