<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Base de Données Avancées et Big Data - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modélisation des Relations dans Cassandra",
      "points": "4 pts",
      "enonce": "<p style='color: #333; font-size: 1em;'>Dans le cadre d'un projet d'analyse des données clients pour une entreprise de télécommunications au Cameroun, vous devez modéliser les informations suivantes dans la base de données Cassandra :</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Les clients ont un identifiant (id_client), un nom, un prénom, une date d'inscription et une région.</li><li>Les appels sont identifiés par un identifiant (id_appel), l'id_client, la date de l'appel, la durée en minutes et le numéro appelé.</li><li>Chaque client peut avoir plusieurs appels.</li></ul><p style='color: #333; font-size: 1em;'>Les requêtes les plus fréquentes seront :</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Récupérer tous les appels d'un client donné.</li><li>Récupérer les appels d'un client pour une période donnée.</li><li>Récupérer les appels d'un client pour une période donnée triés par date décroissante.</li></ul>",
      "questions": [
        {
          "question": "1) Proposez une table Cassandra pour stocker les appels. Justifiez le choix de la partition key et de la clustering key en expliquant comment elles répondent aux requêtes les plus fréquentes. (2 pts)",
          "reponse": "<p style='color: #333; font-size: 1em;'><strong>Table proposée :</strong></p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE appels (<br>    id_client text,<br>    date_appel timestamp,<br>    id_appel text,<br>    duree int,<br>    num_appele text,<br>    PRIMARY KEY (id_client, date_appel, id_appel)<br>) WITH CLUSTERING ORDER BY (date_appel DESC);</div><p style='color: #333; font-size: 1em;'><strong>Justification :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li><strong>Partition key (id_client) :</strong> Les requêtes les plus fréquentes portent sur un client spécifique. Cette clé permet de stocker tous les appels d'un même client sur le même nœud, rendant les requêtes très efficaces (O(1) sur une partition).</li><li><strong>Clustering key (date_appel, id_appel) :</strong> La date d'appel est utilisée pour les requêtes par période. Le tri par date décroissante est assuré par 'WITH CLUSTERING ORDER BY (date_appel DESC)'. L'id_appel est ajouté pour garantir l'unicité de la clé primaire si deux appels ont la même date.</li></ul><p style='color: #333; font-size: 1em;'><strong>Requêtes correspondantes :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Tous les appels d'un client : SELECT * FROM appels WHERE id_client = 'C001';</li><li>Appels par période : SELECT * FROM appels WHERE id_client = 'C001' AND date_appel >= '2025-01-01' AND date_appel < '2025-02-01';</li></ul>"
        },
        {
          "question": "2) Proposez une deuxième table pour stocker les informations des clients. Quelle serait la clé primaire ? (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'><strong>Table clients :</strong></p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE clients (<br>    id_client text PRIMARY KEY,<br>    nom text,<br>    prenom text,<br>    date_inscription date,<br>    region text<br>);</div><p style='color: #333; font-size: 1em;'><strong>Justification :</strong> La clé primaire est simplement id_client car les accès se feront par identifiant client. Comme il n'y a pas de requête spécifique nécessitant un autre type de partitionnement, cette conception est la plus simple et la plus efficace.</p>"
        },
        {
          "question": "3) Si l'entreprise souhaite également faire des requêtes par région pour analyser les habitudes d'appel des clients, comment pourriez-vous répondre à ce besoin sans utiliser ALLOW FILTERING ? (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>Pour répondre aux requêtes par région sans utiliser ALLOW FILTERING, il faut créer une <strong>table dédiée</strong> :</p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE appels_par_region (<br>    region text,<br>    date_appel timestamp,<br>    id_client text,<br>    id_appel text,<br>    duree int,<br>    num_appele text,<br>    PRIMARY KEY (region, date_appel, id_appel)<br>) WITH CLUSTERING ORDER BY (date_appel DESC);</div><p style='color: #333; font-size: 1em;'>Cette table est une <strong>dénormalisation</strong> des données. Elle permet d'interroger les appels par région avec une partition key (region) et un tri par date. Cette approche est typique de Cassandra où l'on conçoit les tables en fonction des requêtes (query-driven design).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Compréhension de CQL",
      "points": "3 pts",
      "enonce": "<p style='color: #333; font-size: 1em;'>Dans une base de données Cassandra, on dispose de la table suivante :</p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE commandes (<br>    id_client text,<br>    date_commande timestamp,<br>    id_commande text,<br>    montant decimal,<br>    statut text,<br>    PRIMARY KEY (id_client, date_commande, id_commande)<br>) WITH CLUSTERING ORDER BY (date_commande DESC);</div>",
      "questions": [
        {
          "question": "1) Écrivez une requête CQL pour récupérer toutes les commandes du client 'CL123' effectuées en janvier 2025. (1 pt)",
          "reponse": "<div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>SELECT * FROM commandes <br>WHERE id_client = 'CL123' <br>AND date_commande >= '2025-01-01' <br>AND date_commande < '2025-02-01';</div><p style='color: #333; font-size: 1em;'>Cette requête utilise la partition key (id_client) et une condition sur la clustering key (date_commande). Elle est donc efficace et ne nécessite pas ALLOW FILTERING.</p>"
        },
        {
          "question": "2) Écrivez une requête CQL pour compter le nombre de commandes du client 'CL123'. (1 pt)",
          "reponse": "<div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>SELECT COUNT(*) FROM commandes WHERE id_client = 'CL123';</div><p style='color: #333; font-size: 1em;'>Cette requête est également efficace car elle utilise la partition key pour localiser toutes les données du client sur un seul nœud.</p>"
        },
        {
          "question": "3) Expliquez pourquoi la requête suivante n'est pas recommandée : SELECT * FROM commandes WHERE date_commande >= '2025-01-01'; (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>Cette requête n'est pas recommandée car elle ne spécifie pas la <strong>partition key</strong> (id_client). Cassandra devrait alors scanner toutes les partitions du cluster pour trouver les commandes correspondant à la période, ce qui est très coûteux en performances.</p><p style='color: #333; font-size: 1em;'>Pour exécuter cette requête, il faudrait ajouter l'option <strong>ALLOW FILTERING</strong>, ce qui n'est pas recommandé en production car cela peut entraîner des temps de réponse très longs et une forte charge sur le cluster.</p><p style='color: #333; font-size: 1em;'>La bonne pratique est de concevoir une table dédiée si ce type de requête est fréquent.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Partitionnement et Clustering",
      "points": "4 pts",
      "enonce": "<p style='color: #333; font-size: 1em;'>Une entreprise de e-commerce souhaite stocker les paniers d'achat de ses clients dans Cassandra. Chaque panier contient plusieurs produits. Les requêtes attendues sont :</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Récupérer tous les paniers d'un client, triés par date décroissante.</li><li>Récupérer le panier d'un client à une date donnée.</li><li>Récupérer tous les produits d'un panier spécifique.</li></ul><p style='color: #333; font-size: 1em;'>Proposez une modélisation avec deux tables (une pour les paniers, une pour les produits des paniers).</p>",
      "questions": [
        {
          "question": "1) Proposez la structure de la table paniers. Justifiez le choix de la partition key et de la clustering key. (2 pts)",
          "reponse": "<p style='color: #333; font-size: 1em;'><strong>Table paniers :</strong></p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE paniers (<br>    id_client text,<br>    date_panier timestamp,<br>    id_panier text,<br>    total decimal,<br>    statut text,<br>    PRIMARY KEY (id_client, date_panier, id_panier)<br>) WITH CLUSTERING ORDER BY (date_panier DESC);</div><p style='color: #333; font-size: 1em;'><strong>Justification :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li><strong>Partition key (id_client) :</strong> Les requêtes portent sur un client spécifique. Cela permet de regrouper tous les paniers d'un client sur un seul nœud pour des accès efficaces.</li><li><strong>Clustering key (date_panier, id_panier) :</strong> La date permet de trier les paniers par date décroissante (ORDER BY date_panier DESC) et de filtrer par période. L'id_panier garantit l'unicité.</li></ul>"
        },
        {
          "question": "2) Proposez la structure de la table produits_panier. (2 pts)",
          "reponse": "<p style='color: #333; font-size: 1em;'><strong>Table produits_panier :</strong></p><div style='background-color: #f8f9fa; border-radius: 5px; padding: 10px; font-family: monospace; font-size: 0.9em; color: #333;'>CREATE TABLE produits_panier (<br>    id_panier text,<br>    id_produit text,<br>    quantite int,<br>    prix_unitaire decimal,<br>    PRIMARY KEY (id_panier, id_produit)<br>);</div><p style='color: #333; font-size: 1em;'><strong>Justification :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li><strong>Partition key (id_panier) :</strong> La requête principale est de récupérer tous les produits d'un panier spécifique. Cela permet de stocker tous les produits d'un même panier sur le même nœud.</li><li><strong>Clustering key (id_produit) :</strong> Permet d'identifier chaque produit de manière unique dans le panier.</li></ul><p style='color: #333; font-size: 1em;'>Cette approche suit le principe de <strong>dénormalisation</strong> : on crée des tables adaptées aux requêtes plutôt que d'utiliser des jointures.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Questions Théoriques",
      "points": "4 pts",
      "enonce": "<p style='color: #333; font-size: 1em;'>Répondez aux questions suivantes en vous basant sur vos connaissances de Cassandra.</p>",
      "questions": [
        {
          "question": "1) Expliquez le rôle du partitionneur (partitioner) dans Cassandra. (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>Le <strong>partitionneur</strong> dans Cassandra est responsable de la distribution des données à travers le cluster. Il prend en entrée la <strong>partition key</strong> d'une ligne et calcule une valeur de hachage (token). Cette valeur détermine sur quel nœud du cluster la ligne sera stockée. Le partitionneur assure ainsi l'équilibrage des données entre les nœuds et le routage des requêtes.</p><p style='color: #333; font-size: 1em;'>Les partitionneurs les plus courants sont :</p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li><strong>Murmur3Partitioner</strong> (défaut) : Distribution uniforme des données.</li><li><strong>RandomPartitioner</strong> : Utilise MD5 pour le hachage.</li></ul>"
        },
        {
          "question": "2) Qu'est-ce que le facteur de réplication et comment influence-t-il la tolérance aux pannes ? (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>Le <strong>facteur de réplication</strong> (replication factor) détermine le nombre de copies de chaque ligne de données qui sont stockées dans le cluster. Par exemple, avec un facteur de réplication de 3, chaque ligne est stockée sur 3 nœuds différents.</p><p style='color: #333; font-size: 1em;'><strong>Influence sur la tolérance aux pannes :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Avec RF=3, le cluster peut tolérer la panne de jusqu'à <strong>2 nœuds</strong> sans perte de données.</li><li>Plus le facteur de réplication est élevé, meilleure est la tolérance aux pannes, mais cela augmente également les coûts de stockage et le temps d'écriture.</li></ul>"
        },
        {
          "question": "3) Qu'est-ce que la cohérence tunable et quels sont les paramètres de cohérence possibles ? (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>La <strong>cohérence tunable</strong> est la possibilité de configurer le niveau de cohérence souhaité pour chaque requête en lecture (READ) ou en écriture (WRITE). Cela permet de faire un compromis entre cohérence des données et performances.</p><p style='color: #333; font-size: 1em;'><strong>Paramètres de cohérence possibles :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li><strong>ONE</strong> : Un seul réplica doit répondre/confirmer.</li><li><strong>QUORUM</strong> : La majorité des réplicas doit répondre/confirmer.</li><li><strong>ALL</strong> : Tous les réplicas doivent répondre/confirmer (plus lent).</li><li><strong>LOCAL_QUORUM</strong> : Quorum dans le datacenter local.</li><li><strong>EACH_QUORUM</strong> : Quorum dans chaque datacenter.</li></ul><p style='color: #333; font-size: 1em;'>Par exemple, pour une application bancaire, on utilisera QUORUM pour garantir la cohérence, tandis que pour une application de logs, ONE peut suffire pour la performance.</p>"
        },
        {
          "question": "4) Pourquoi dit-on que Cassandra suit une approche 'query-driven design' ? (1 pt)",
          "reponse": "<p style='color: #333; font-size: 1em;'>Cassandra suit une approche <strong>'query-driven design'</strong> car le schéma des tables est conçu en fonction des <strong>requêtes</strong> que l'application va exécuter, et non en fonction d'une modélisation normalisée des données (comme en SQL).</p><p style='color: #333; font-size: 1em;'><strong>Conséquences :</strong></p><ul style='list-style-type: disc; padding-left: 20px; color: #333;'><li>Les tables sont souvent <strong>dénormalisées</strong> pour éviter les jointures.</li><li>Les données peuvent être <strong>dupliquées</strong> dans plusieurs tables pour répondre à différentes requêtes.</li><li>La <strong>partition key</strong> et la <strong>clustering key</strong> sont choisies pour optimiser les requêtes les plus fréquentes.</li></ul><p style='color: #333; font-size: 1em;'>Cette approche est fondamentale pour obtenir de bonnes performances dans une base de données distribuée comme Cassandra.</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
