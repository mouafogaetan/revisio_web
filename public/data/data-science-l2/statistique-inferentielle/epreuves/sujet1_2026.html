<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Statistique Inférentielle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Théorie de l'Estimation (Propriétés des Estimateurs)",
      "points": "6 pts",
      "enonce": "<p>On considère un échantillon aléatoire i.i.d. <span style='font-style: italic;'>X</span><sub>1</sub>, <span style='font-style: italic;'>X</span><sub>2</sub>, ..., <span style='font-style: italic;'>X</span><sub>n</sub> issu d'une population de moyenne <span style='font-style: italic;'>μ</span> et de variance <span style='font-style: italic;'>σ</span><sup>2</sup>. On s'intéresse à l'estimation ponctuelle de la moyenne <span style='font-style: italic;'>μ</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (2 pts) Rappeler la définition d'un <strong>estimateur</strong> et d'une <strong>estimation</strong>. Donner un exemple pour la moyenne <span style='font-style: italic;'>μ</span>.</p>",
          "reponse": "<p>Un <strong>estimateur</strong> est une fonction des observations d'un échantillon qui permet d'approcher un paramètre inconnu de la population. C'est une variable aléatoire avant d'observer les données. Une <strong>estimation</strong> est la valeur numérique prise par l'estimateur sur un échantillon donné [citation:1][citation:2]. Pour la moyenne <span style='font-style: italic;'>μ</span>, un estimateur est la moyenne empirique <span style='font-style: italic;'>X̄</span> = (1/n)∑X<sub>i</sub>. L'estimation est la valeur numérique calculée à partir des données.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (2 pts) On considère deux estimateurs de <span style='font-style: italic;'>μ</span> : T<sub>1</sub> = X̄ et T<sub>2</sub> = (X<sub>1</sub> + X<sub>2</sub>)/2. Calculer le biais de chaque estimateur et déterminer lequel est sans biais.</p>",
          "reponse": "<p>Le <strong>biais</strong> d'un estimateur T est défini par Biais(T) = E(T) - μ. Pour T<sub>1</sub> = X̄, E(X̄) = μ donc Biais(T<sub>1</sub>) = 0. Pour T<sub>2</sub> = (X<sub>1</sub> + X<sub>2</sub>)/2, E(T<sub>2</sub>) = (E(X<sub>1</sub>) + E(X<sub>2</sub>))/2 = (μ+μ)/2 = μ. Donc Biais(T<sub>2</sub>) = 0. Les deux estimateurs sont sans biais.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (2 pts) Calculer la variance de T<sub>1</sub> et T<sub>2</sub> et en déduire l'estimateur le plus efficace.</p>",
          "reponse": "<p>La <strong>variance</strong> de T<sub>1</sub> est Var(X̄) = σ<sup>2</sup>/n. La variance de T<sub>2</sub> est Var((X<sub>1</sub>+X<sub>2</sub>)/2) = (1/4)(σ<sup>2</sup> + σ<sup>2</sup>) = σ<sup>2</sup>/2. Pour n ≥ 2, σ<sup>2</sup>/n ≤ σ<sup>2</sup>/2. Donc Var(T<sub>1</sub>) ≤ Var(T<sub>2</sub>), T<sub>1</sub> est plus efficace que T<sub>2</sub> car sa variance est plus petite.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Estimateurs Usuels et Maximum de Vraisemblance (MLE)",
      "points": "6 pts",
      "enonce": "<p>Un échantillon aléatoire i.i.d. X<sub>1</sub>, X<sub>2</sub>, ..., X<sub>n</sub> suit une loi exponentielle de paramètre λ > 0, de densité f(x) = λ e<sup>−λx</sup> pour x ≥ 0.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1.5 pts) Déterminer l'estimateur de λ par la méthode des moments.</p>",
          "reponse": "<p>La méthode des moments consiste à égaliser les moments théoriques et empiriques [citation:1]. Pour la loi exponentielle, E(X) = 1/λ. Le premier moment empirique est X̄ = (1/n)∑X<sub>i</sub>. On pose E(X) = X̄, donc 1/λ = X̄, d'où l'estimateur des moments λ̂ = 1/X̄.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (3 pts) Déterminer l'estimateur du maximum de vraisemblance (EMV) de λ.</p>",
          "reponse": "<p>La <strong>fonction de vraisemblance</strong> est L(λ) = ∏<sub>i=1</sub><sup>n</sup> λ e<sup>−λx<sub>i</sub></sup> = λ<sup>n</sup> exp(−λ ∑x<sub>i</sub>). La <strong>log-vraisemblance</strong> est ℓ(λ) = n ln(λ) − λ ∑x<sub>i</sub>. En dérivant par rapport à λ, on obtient ℓ'(λ) = n/λ − ∑x<sub>i</sub>. En annulant, on trouve n/λ = ∑x<sub>i</sub>, donc λ̂ = n/∑x<sub>i</sub> = 1/X̄. L'EMV est donc λ̂<sub>EMV</sub> = 1/X̄.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1.5 pts) Comparer l'estimateur des moments et l'EMV pour ce modèle.</p>",
          "reponse": "<p>Dans ce cas, l'estimateur des moments et l'EMV coïncident : λ̂ = 1/X̄. Les deux méthodes donnent le même estimateur. Les EMV ont de bonnes propriétés asymptotiques (consistance, efficacité asymptotique) [citation:2].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Intervalles de Confiance",
      "points": "8 pts",
      "enonce": "<p>Une étude est menée sur un échantillon de 100 étudiants de Licence 2 Data Science pour estimer le temps moyen passé sur les réseaux sociaux par jour. La moyenne observée est X̄ = 120 minutes et l'écart-type estimé est S = 30 minutes.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (2 pts) Déterminer un intervalle de confiance à 95% pour la moyenne μ du temps passé sur les réseaux sociaux, en supposant que l'écart-type σ est inconnu.</p>",
          "reponse": "<p>L'écart-type est inconnu, on utilise la loi de Student à n−1 = 99 degrés de liberté. L'intervalle de confiance est X̄ ± t<sub>99;0.025</sub> × S/√n. La valeur t<sub>99;0.025</sub> ≈ 1.984. L'intervalle est donc [120 − 1.984×30/10, 120 + 1.984×30/10] = [120 − 5.952, 120 + 5.952] = [114.048, 125.952]. L'IC à 95% est [114.05 ; 125.95] minutes.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (2 pts) Interpréter correctement l'intervalle de confiance obtenu.</p>",
          "reponse": "<p>Un intervalle de confiance à 95% signifie que si on répétait l'expérience un grand nombre de fois, 95% des intervalles construits contiendraient la vraie moyenne μ de la population. Cela ne signifie pas qu'il y a 95% de chances que μ soit dans cet intervalle particulier [citation:1]. L'intervalle contient la vraie valeur avec une confiance de 95%.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (2 pts) En supposant que l'écart-type σ soit connu et égal à 30, déterminer le nouvel intervalle de confiance à 95%.</p>",
          "reponse": "<p>Si σ est connu, on utilise la loi normale. L'intervalle est X̄ ± z<sub>0.025</sub> × σ/√n, avec z<sub>0.025</sub> ≈ 1.96. IC = [120 − 1.96×30/10, 120 + 1.96×30/10] = [120 − 5.88, 120 + 5.88] = [114.12, 125.88]. L'IC à 95% est [114.12 ; 125.88] minutes.</p>"
        },
        {
          "question": "<p><strong>4.</strong> (2 pts) Déterminer la taille d'échantillon nécessaire pour obtenir un intervalle de confiance à 95% d'amplitude 10 minutes, avec σ = 30.</p>",
          "reponse": "<p>L'amplitude de l'intervalle est 2 × z<sub>0.025</sub> × σ/√n. On veut une amplitude de 10, donc 2 × 1.96 × 30/√n = 10. D'où √n = (2 × 1.96 × 30)/10 = 11.76, donc n ≈ 138.3. Il faut au moins 139 étudiants.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
