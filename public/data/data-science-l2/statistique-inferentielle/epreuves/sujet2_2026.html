<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Statistique Inf\u00E9rentielle",
 "classe": "Licence 2 Data Science",
 "sequence": "S\u00E9quence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Intervalle de Confiance pour une Moyenne",
     "points": "3 pts",
     "enonce": "<p>Une entreprise agroalimentaire camerounaise souhaite estimer le poids moyen des sacs de ma\u00EFs qu'elle produit. Un \u00E9chantillon al\u00E9atoire de 50 sacs a donn\u00E9 un poids moyen de 49.8 kg avec un \u00E9cart-type de 1.2 kg.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1) (1 pt)</strong> Construire un intervalle de confiance \u00E0 95% pour le poids moyen \u03BC des sacs de ma\u00EFs. On supposera que l'\u00E9cart-type de la population est inconnu.</p>",
         "reponse": "<p>L'intervalle de confiance est donn\u00E9 par :</p><p>$$\\bar{x} \\pm t_{\\alpha/2, n-1} \\times \\frac{s}{\\sqrt{n}}$$</p><p>Avec :</p><ul><li>$$\\bar{x} = 49.8$$ kg</li><li>$$s = 1.2$$ kg</li><li>$$n = 50$$</li><li>$$t_{0.025, 49} \\approx 2.01$$</li></ul><p>La marge d'erreur est : $$2.01 \\times \\frac{1.2}{\\sqrt{50}} = 2.01 \\times 0.1697 \\approx 0.341$$</p><p>L'IC \u00E0 95% est donc : $$[49.8 - 0.341, 49.8 + 0.341] = [49.46, 50.14]$$ kg.</p>"
       },
       {
         "question": "<p><strong>1.2) (0.5 pt)</strong> Interpr\u00E9ter le r\u00E9sultat obtenu dans le contexte de l'entreprise.</p>",
         "reponse": "<p>Nous sommes confiants \u00E0 95% que le poids moyen r\u00E9el des sacs de ma\u00EFs se situe entre 49.46 kg et 50.14 kg. Cela signifie que si l'on r\u00E9p\u00E9tait l'\u00E9chantillonnage de nombreuses fois, environ 95% des intervalles calcul\u00E9s contiendraient la vraie moyenne \u03BC.</p>"
       },
       {
         "question": "<p><strong>1.3) (1.5 pt)</strong> L'entreprise souhaite que la largeur de l'intervalle de confiance soit au maximum de 0.5 kg. Quelle taille d'\u00E9chantillon doit-elle pr\u00E9lever ? On suppose que l'\u00E9cart-type de la population est proche de 1.2 kg.</p>",
         "reponse": "<p>La largeur de l'IC est $$2 \\times z_{\\alpha/2} \\times \\frac{\\sigma}{\\sqrt{n}}$$.</p><p>Pour une largeur de 0.5 kg, la marge d'erreur est de 0.25 kg.</p><p>$$0.25 = 1.96 \\times \\frac{1.2}{\\sqrt{n}}$$</p><p>$$\\sqrt{n} = \\frac{1.96 \\times 1.2}{0.25} = \\frac{2.352}{0.25} = 9.408$$</p><p>$$n = 9.408^2 \\approx 88.5$$</p><p>Il faut donc un \u00E9chantillon d'au moins <strong>89 sacs</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Intervalle de Confiance pour une Proportion",
     "points": "2.5 pts",
     "enonce": "<p>Un institut de sondage interroge 400 personnes \u00e0 Douala pour conna\u00EEtre la proportion de la population favorable \u00E0 un nouveau projet de loi. Parmi les personnes interrog\u00E9es, 220 se disent favorables.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1) (0.5 pt)</strong> Calculer la proportion observ\u00E9e $$\\hat{p}$$.</p>",
         "reponse": "<p>La proportion observ\u00E9e est : $$\\hat{p} = \\frac{220}{400} = 0.55$$ (55%).</p>"
       },
       {
         "question": "<p><strong>2.2) (1 pt)</strong> Construire un intervalle de confiance \u00E0 95% pour la proportion r\u00E9elle p de la population favorable.</p>",
         "reponse": "<p>L'intervalle de confiance pour une proportion est :</p><p>$$\\hat{p} \\pm z_{\\alpha/2} \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}}$$</p><p>Avec :</p><ul><li>$$\\hat{p} = 0.55$$</li><li>$$n = 400$$</li><li>$$z_{0.025} = 1.96$$</li></ul><p>L'erreur standard : $$\\sqrt{\\frac{0.55 \\times 0.45}{400}} = \\sqrt{\\frac{0.2475}{400}} = \\sqrt{0.00061875} \\approx 0.02487$$</p><p>La marge d'erreur : $$1.96 \\times 0.02487 \\approx 0.0487$$</p><p>L'IC \u00E0 95% est donc : $$[0.55 - 0.0487, 0.55 + 0.0487] = [0.5013, 0.5987]$$.</p><p>Soit entre <strong>50.1% et 59.9%</strong> de la population favorable.</p>"
       },
       {
         "question": "<p><strong>2.3) (1 pt)</strong> V\u00E9rifier les conditions d'application de l'approximation normale utilis\u00E9e.</p>",
         "reponse": "<p>Les conditions d'application sont :</p><ul><li>$$n\\hat{p} = 400 \\times 0.55 = 220 \\geq 5$$</li><li>$$n(1-\\hat{p}) = 400 \\times 0.45 = 180 \\geq 5$$</li></ul><p>Les deux conditions sont v\u00E9rifi\u00E9es, l'approximation normale est donc valide.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Test d'Hypoth\u00E8se sur une Moyenne",
     "points": "3 pts",
     "enonce": "<p>Une usine de production de jus de fruits annonce que ses bouteilles contiennent en moyenne 1 litre de jus. Le service qualit\u00E9 pr\u00E9l\u00E8ve un \u00E9chantillon de 36 bouteilles et obtient une moyenne de 0.98 litre avec un \u00E9cart-type de 0.08 litre. On souhaite tester l'hypoth\u00E8se que la quantit\u00E9 moyenne r\u00E9elle est inf\u00E9rieure \u00E0 1 litre.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1) (0.5 pt)</strong> Formuler les hypoth\u00E8ses du test.</p>",
         "reponse": "<p>Soit $$\\mu$$ la vraie quantit\u00E9 moyenne de jus dans les bouteilles.</p><p><strong>Hypoth\u00E8se nulle :</strong> $$H_0: \\mu = 1$$</p><p><strong>Hypoth\u00E8se alternative :</strong> $$H_1: \\mu < 1$$ (test unilat\u00E9ral \u00E0 gauche)</p>"
       },
       {
         "question": "<p><strong>3.2) (1 pt)</strong> Calculer la statistique de test et prendre une d\u00E9cision au seuil de signification $$\\alpha = 0.05$$.</p>",
         "reponse": "<p>La statistique de test (t de Student car $$\\sigma$$ est inconnu) est :</p><p>$$t = \\frac{\\bar{x} - \\mu_0}{s/\\sqrt{n}} = \\frac{0.98 - 1}{0.08/\\sqrt{36}} = \\frac{-0.02}{0.08/6} = \\frac{-0.02}{0.01333} \\approx -1.5$$</p><p>Degr\u00E9s de libert\u00E9 : $$n-1 = 35$$</p><p>Valeur critique pour $$\\alpha = 0.05$$ en test unilat\u00E9ral \u00E0 gauche : $$t_{0.05, 35} \\approx -1.69$$</p><p>R\u00E9gion de rejet : $$t < -1.69$$</p><p>Comme $$t = -1.5 > -1.69$$, on ne rejette pas $$H_0$$.</p><p>On ne peut pas conclure que la quantit\u00E9 moyenne est inf\u00E9rieure \u00E0 1 litre.</p>"
       },
       {
         "question": "<p><strong>3.3) (1 pt)</strong> Calculer et interpr\u00E9ter la p-value de ce test.</p>",
         "reponse": "<p>La p-value est la probabilit\u00E9 d'obtenir une statistique de test aussi extr\u00Eame que celle observ\u00E9e si $$H_0$$ est vraie.</p><p>$$p = P(T_{35} < -1.5)$$</p><p>D'apr\u00E8s la table de Student, $$P(T_{35} < -1.5) \\approx 0.071$$</p><p>La p-value est d'environ <strong>0.071</strong>.</p><p>Comme $$p = 0.071 > \\alpha = 0.05$$, on ne rejette pas $$H_0$$. Il n'y a pas suffisamment de preuves pour affirmer que la quantit\u00E9 moyenne est inf\u00E9rieure \u00E0 1 litre.</p>"
       },
       {
         "question": "<p><strong>3.4) (0.5 pt)</strong> Si le seuil de signification \u00E9tait $$\\alpha = 0.1$$, la conclusion serait-elle diff\u00E9rente ?</p>",
         "reponse": "<p>Avec $$\\alpha = 0.1$$, la valeur critique serait $$t_{0.1, 35} \\approx -1.31$$.</p><p>Comme $$t = -1.5 < -1.31$$, on rejetterait $$H_0$$ au seuil de 10%.</p><p>La conclusion serait diff\u00E9rente : on conclurait que la quantit\u00E9 moyenne est significativement inf\u00E9rieure \u00E0 1 litre.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Comparaison de Deux Proportions",
     "points": "2.5 pts",
     "enonce": "<p>Un institut de sondage compare la popularit\u00E9 de deux candidats \u00E0 une \u00E9lection r\u00E9gionale au Cameroun. Sur un \u00E9chantillon de 300 personnes interrog\u00E9es dans la r\u00E9gion du Centre, 120 d\u00E9clarent voter pour le candidat A. Sur un \u00E9chantillon de 250 personnes interrog\u00E9es dans la r\u00E9gion du Littoral, 90 d\u00E9clarent voter pour le candidat A.</p>",
     "questions": [
       {
         "question": "<p><strong>4.1) (0.5 pt)</strong> Calculer les proportions observ\u00E9es dans chaque r\u00E9gion.</p>",
         "reponse": "<p>R\u00E9gion du Centre : $$\\hat{p}_1 = \\frac{120}{300} = 0.40$$</p><p>R\u00E9gion du Littoral : $$\\hat{p}_2 = \\frac{90}{250} = 0.36$$</p>"
       },
       {
         "question": "<p><strong>4.2) (1.5 pt)</strong> Tester l'hypoth\u00E8se $$H_0: p_1 = p_2$$ contre $$H_1: p_1 \\neq p_2$$ au seuil $$\\alpha = 0.05$$.</p>",
         "reponse": "<p>La proportion combin\u00E9e est :</p><p>$$\\hat{p} = \\frac{120 + 90}{300 + 250} = \\frac{210}{550} \\approx 0.3818$$</p><p>La statistique de test est :</p><p>$$z = \\frac{\\hat{p}_1 - \\hat{p}_2}{\\sqrt{\\hat{p}(1-\\hat{p})(\\frac{1}{n_1} + \\frac{1}{n_2})}} = \\frac{0.40 - 0.36}{\\sqrt{0.3818 \\times 0.6182 \\times (\\frac{1}{300} + \\frac{1}{250})}}$$</p><p>$$z = \\frac{0.04}{\\sqrt{0.236 \\times (0.00333 + 0.004)}} = \\frac{0.04}{\\sqrt{0.236 \\times 0.00733}} = \\frac{0.04}{\\sqrt{0.00173}} = \\frac{0.04}{0.0416} \\approx 0.96$$</p><p>Valeur critique bilat\u00E9rale : $$z_{0.025} = 1.96$$</p><p>Comme $$|z| = 0.96 < 1.96$$, on ne rejette pas $$H_0$$.</p>"
       },

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
