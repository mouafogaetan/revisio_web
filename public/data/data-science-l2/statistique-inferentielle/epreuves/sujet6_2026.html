<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Statistique Inférentielle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6 : Régression Linéaire Multiple et Inférence Bayésienne",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modèle de Régression Multiple (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f9f9f9; border-radius: 8px;'><p style='font-size: 1.1em; color: #333;'>On considère le modèle de régression linéaire multiple suivant :</p><div class='math-block' style='background-color: #fff; padding: 10px; border-radius: 4px;'><div class='math'>$$Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\varepsilon$$</div></div><ul style='color: #444;'><li><strong>Y</strong> : ventes d'un produit (en milliers d'euros).</li><li><strong>X₁</strong> : budget publicitaire (en milliers d'euros).</li><li><strong>X₂</strong> : nombre de points de vente.</li><li>On dispose de 20 observations.</li></ul><p>Les résultats de l'estimation par les moindres carrés donnent :</p><ul style='color: #444;'><li>\\(\\hat{\\beta}_0 = 5.2\\)</li><li>\\(\\hat{\\beta}_1 = 1.8\\)</li><li>\\(\\hat{\\beta}_2 = 0.6\\)</li><li>\\(SSR = 450\\) (somme des carrés expliquée)</li><li>\\(SSE = 80\\) (somme des carrés résiduelle)</li></ul></div>",
      "questions": [
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>1) </strong> Interpréter les coefficients \\(\\hat{\\beta}_1\\) et \\(\\hat{\\beta}_2\\) dans le contexte de l'étude.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Interprétation :</strong><br><br>\\(\\hat{\\beta}_1 = 1.8\\) : lorsque le budget publicitaire augmente de 1 000 €, les ventes augmentent en moyenne de 1 800 €, toutes choses égales par ailleurs (le nombre de points de vente restant constant).<br><br>\\(\\hat{\\beta}_2 = 0.6\\) : lorsque le nombre de points de vente augmente de 1 unité, les ventes augmentent en moyenne de 600 €, toutes choses égales par ailleurs (le budget publicitaire restant constant).</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>2) </strong> Calculer le coefficient de détermination \\(R^2\\) et interpréter sa valeur.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Calcul :</strong><br><br>\\(SST = SSR + SSE = 450 + 80 = 530\\)<br><br>\\(R^2 = \\frac{SSR}{SST} = \\frac{450}{530} \\approx 0.849\\)<br><br><strong>Interprétation :</strong> Environ 84.9% de la variabilité des ventes est expliquée par le budget publicitaire et le nombre de points de vente. Le modèle explique bien les données.</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>3) </strong> Tester la nullité globale du modèle (test F) au seuil de signification \\(\\alpha = 0.05\\). Conclure.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Test F :</strong><br><br>Degrés de liberté : \\(p = 2\\) (nombre de variables), \\(n - p - 1 = 20 - 2 - 1 = 17\\).<br><br>\\(F_{obs} = \\frac{SSR/p}{SSE/(n-p-1)} = \\frac{450/2}{80/17} = \\frac{225}{4.7059} \\approx 47.81\\)<br><br>Valeur critique : \\(F_{0.05, 2, 17} \\approx 3.59\\)<br><br>Puisque \\(47.81 > 3.59\\), on rejette \\(H_0\\).<br><br><strong>Conclusion :</strong> Le modèle est globalement significatif. Au moins un des coefficients \\(\\beta_1\\) ou \\(\\beta_2\\) est non nul.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Inférence sur les Coefficients (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f9f9f9; border-radius: 8px;'><p>On reprend l'exercice 1. On donne les écarts-types estimés des coefficients :</p><ul style='color: #444;'><li>\\(se(\\hat{\\beta}_0) = 2.1\\)</li><li>\\(se(\\hat{\\beta}_1) = 0.4\\)</li><li>\\(se(\\hat{\\beta}_2) = 0.2\\)</li></ul></div>",
      "questions": [
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>1) </strong> Construire un intervalle de confiance à 95% pour le coefficient \\(\\beta_1\\).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>IC à 95% pour \\(\\beta_1\\) :</strong><br><br>\\(t_{0.025, 17} \\approx 2.110\\) (loi de Student à 17 ddl).<br><br>\\(IC = \\hat{\\beta}_1 \\pm t_{0.025, 17} \\times se(\\hat{\\beta}_1) = 1.8 \\pm 2.110 \\times 0.4 = 1.8 \\pm 0.844\\)<br><br>\\(IC = [0.956, 2.644]\\)<br><br><strong>Interprétation :</strong> On est confiant à 95% que le vrai coefficient \\(\\beta_1\\) est compris entre 0.956 et 2.644. Comme 0 n'est pas dans l'intervalle, \\(\\beta_1\\) est significativement différent de 0.</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>2) </strong> Tester l'hypothèse \\(H_0: \\beta_2 = 0\\) contre \\(H_1: \\beta_2 > 0\\) (test unilatéral à droite) au seuil de signification \\(\\alpha = 0.05\\).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Test de Student unilatéral :</strong><br><br>\\(t_{obs} = \\frac{\\hat{\\beta}_2 - 0}{se(\\hat{\\beta}_2)} = \\frac{0.6}{0.2} = 3.0\\)<br><br>Valeur critique : \\(t_{0.05, 17} \\approx 1.740\\) (pour un test unilatéral à droite).<br><br>Puisque \\(3.0 > 1.740\\), on rejette \\(H_0\\).<br><br><strong>Conclusion :</strong> Il existe une preuve significative que \\(\\beta_2 > 0\\). Le nombre de points de vente a un effet positif sur les ventes.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : ANOVA à un Facteur (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f9f9f9; border-radius: 8px;'><p>Un responsable souhaite comparer l'efficacité de quatre méthodes d'enseignement (A, B, C, D) sur les performances des élèves. Les notes (sur 20) sont :</p><ul style='color: #444;'><li>Méthode A : 12, 14, 16, 18</li><li>Méthode B : 10, 12, 14, 16, 18</li><li>Méthode C : 8, 10, 12</li><li>Méthode D : 15, 17, 19, 21, 23, 25</li></ul></div>",
      "questions": [
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>1) </strong> Calculer les moyennes par groupe et la moyenne générale.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Moyennes :</strong><br><br>Moyenne A : \\((12+14+16+18)/4 = 60/4 = 15\\)<br>Moyenne B : \\((10+12+14+16+18)/5 = 70/5 = 14\\)<br>Moyenne C : \\((8+10+12)/3 = 30/3 = 10\\)<br>Moyenne D : \\((15+17+19+21+23+25)/6 = 120/6 = 20\\)<br><br>Moyenne générale : \\((60+70+30+120)/18 = 280/18 \\approx 15.56\\)</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>2) </strong> Construire le tableau d'ANOVA complet (sources, ddl, SS, CM, F).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Tableau d'ANOVA :</strong><br><br>\\(SSR = \\sum n_i (\\bar{y}_{i.} - \\bar{y}_{..})^2 = 4(15-15.56)^2 + 5(14-15.56)^2 + 3(10-15.56)^2 + 6(20-15.56)^2\\)<br>\\(SSR = 4 \\times 0.3136 + 5 \\times 2.4336 + 3 \\times 30.9136 + 6 \\times 19.7136\\)<br>\\(SSR = 1.2544 + 12.168 + 92.741 + 118.282 = 224.445\\)<br><br>\\(SSE = \\sum (y_{ij} - \\bar{y}_{i.})^2\\)<br>A : \\((12-15)^2 + (14-15)^2 + (16-15)^2 + (18-15)^2 = 9+1+1+9 = 20\\)<br>B : \\((10-14)^2 + (12-14)^2 + (14-14)^2 + (16-14)^2 + (18-14)^2 = 16+4+0+4+16 = 40\\)<br>C : \\((8-10)^2 + (10-10)^2 + (12-10)^2 = 4+0+4 = 8\\)<br>D : \\((15-20)^2 + (17-20)^2 + (19-20)^2 + (21-20)^2 + (23-20)^2 + (25-20)^2 = 25+9+1+1+9+25 = 70\\)<br>\\(SSE = 20+40+8+70 = 138\\)<br><br>\\(SST = SSR + SSE = 224.445 + 138 = 362.445\\)<br><br>| Source | ddl | SS | CM | F |<br>|--------|-----|-----|-----|-----|<br>| Entre | 3 | 224.445 | 74.815 | \\(74.815 / 9.857 = 7.59\\) |<br>| Intra | 14 | 138 | 9.857 | |<br>| Total | 17 | 362.445 | | |</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>3) </strong> Tester l'hypothèse d'égalité des moyennes au seuil de signification \\(\\alpha = 0.05\\). Conclure.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Test F :</strong><br><br>Valeur critique : \\(F_{0.05, 3, 14} \\approx 3.34\\)<br><br>\\(F_{obs} = 7.59 > 3.34\\), donc on rejette \\(H_0\\).<br><br><strong>Conclusion :</strong> Il existe une différence significative entre les méthodes d'enseignement. La méthode D semble la plus efficace (moyenne 20), suivie de A (15), B (14) et C (10).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Estimation Bayésienne (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f9f9f9; border-radius: 8px;'><p>On souhaite estimer la proportion \\(p\\) de clients satisfaits d'un service. Sur un échantillon de 80 clients, 56 se disent satisfaits.</p><p>On utilise une approche bayésienne avec un a priori \\(p \\sim \\text{Beta}(1, 1)\\) (uniforme).</p></div>",
      "questions": [
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>1) </strong> Déterminer la distribution a posteriori de \\(p\\).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>A posteriori :</strong><br><br>Pour un a priori \\(\\text{Beta}(\\alpha, \\beta)\\) et une vraisemblance binomiale, la distribution a posteriori est \\(\\text{Beta}(\\alpha + x, \\beta + n - x)\\).<br><br>Ici : \\(\\alpha = 1\\), \\(\\beta = 1\\), \\(n = 80\\), \\(x = 56\\).<br><br>\\(p | x \\sim \\text{Beta}(1 + 56, 1 + 80 - 56) = \\text{Beta}(57, 25)\\)</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>2) </strong> Calculer l'estimateur bayésien de \\(p\\) (moyenne a posteriori).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Estimateur bayésien :</strong><br><br>La moyenne d'une loi \\(\\text{Beta}(\\alpha, \\beta)\\) est \\(\\alpha / (\\alpha + \\beta)\\).<br><br>\\(\\hat{p}_{Bayes} = 57 / (57 + 25) = 57 / 82 \\approx 0.6951\\)<br><br>La proportion estimée de clients satisfaits est d'environ 69.5%.</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>3) </strong> Construire un intervalle crédible à 95% pour \\(p\\) (utiliser les quantiles de la loi Bêta).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Intervalle crédible à 95% :</strong><br><br>On cherche \\([q_{0.025}, q_{0.975}]\\) pour la loi \\(\\text{Beta}(57, 25)\\).<br><br>En utilisant une table ou un logiciel (ex: R avec <code>qbeta(0.025, 57, 25)</code> et <code>qbeta(0.975, 57, 25)</code>) :<br><br>\\(IC_{95\\%} \\approx [0.588, 0.790]\\)<br><br><strong>Interprétation :</strong> Il y a 95% de chances que la vraie proportion \\(p\\) soit comprise entre 58.8% et 79.0%.</div>"
        },
        {
          "question": "<div style='padding: 10px; background-color: #eef2f7; border-radius: 6px; margin-bottom: 10px;'><strong>4) </strong> Comparer l'estimateur bayésien avec l'EMV (proportion empirique) et discuter de l'influence de l'a priori.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 6px;'><strong>Comparaison :</strong><br><br>EMV : \\(\\hat{p}_{MLE} = 56/80 = 0.70\\)<br><br>Estimateur bayésien : \\(\\hat{p}_{Bayes} \\approx 0.695\\)<br><br>Les deux estimateurs sont très proches (0.70 vs 0.695). L'a priori uniforme a peu d'influence car l'échantillon est relativement grand (n=80). La différence est due à l'ajout de 1 (a priori) qui tire légèrement l'estimation vers 0.5.</div>"
        }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
