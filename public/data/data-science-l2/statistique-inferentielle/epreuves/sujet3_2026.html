<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Statistique Inférentielle",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Estimation et Intervalles de Confiance",
      "points": "4 pts",
      "enonce": "<p>Dans le cadre d'une étude sur la consommation d'eau des ménages à Douala, on a prélevé un échantillon aléatoire de 100 ménages. La consommation moyenne observée est de \( \\bar{x} = 120 \) litres par jour avec un écart-type corrigé de \( s = 25 \) litres.</p>",
      "questions": [
        {
          "question": "1) Déterminez un intervalle de confiance à 95% pour la consommation moyenne \( \\mu \) de l'ensemble des ménages de Douala. Interprétez le résultat.",
          "reponse": "<p>L'intervalle de confiance est donné par :</p><div class='math-block'><div class='math'>$$ \\bar{x} \\pm t_{n-1; 1-\\alpha/2} \\frac{s}{\\sqrt{n}} $$</div></div><p>Avec \( n=100 \\), \( \\bar{x}=120 \\), \( s=25 \\), et \( t_{99; 0.975} \\approx 1.984 \).</p><p>\( 120 \\pm 1.984 \\times \\frac{25}{10} = 120 \\pm 4.96 \).</p><p>L'intervalle de confiance est \([115.04 ; 124.96]\).</p><p><strong>Interprétation :</strong> Nous sommes confiants à 95% que la consommation moyenne réelle des ménages se situe entre 115.04 et 124.96 litres par jour.</p>"
        },
        {
          "question": "2) Quelle devrait être la taille de l'échantillon pour que la largeur de l'intervalle de confiance à 95% soit de 5 litres ?",
          "reponse": "<p>La largeur de l'intervalle est \( 2 \\times t_{n-1; 0.975} \\times \\frac{s}{\\sqrt{n}} \\).</p><p>On souhaite \( 2 \\times 1.96 \\times \\frac{25}{\\sqrt{n}} = 5 \\).</p><p>\( \\frac{98}{\\sqrt{n}} = 5 \\Rightarrow \\sqrt{n} = 19.6 \\Rightarrow n \\approx 384.16 \\).</p><p>Il faudrait un échantillon d'au moins 385 ménages.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Tests d'Hypothèses sur une Moyenne",
      "points": "5 pts",
      "enonce": "<p>Une entreprise de transport affirme que le temps d'attente moyen à ses arrêts de bus est inférieur à 10 minutes. Un échantillon aléatoire de 36 mesures donne un temps d'attente moyen de \( \\bar{x} = 9.2 \) minutes avec un écart-type corrigé de \( s = 2.4 \) minutes. Testez l'affirmation de l'entreprise au seuil de signification \( \\alpha = 5\\% \).</p>",
      "questions": [
        {
          "question": "1) Formulez les hypothèses nulle et alternative du test.",
          "reponse": "<p>\( H_0 : \\mu \\geq 10 \) (le temps d'attente moyen est supérieur ou égal à 10 minutes).</p><p>\( H_1 : \\mu < 10 \) (le temps d'attente moyen est inférieur à 10 minutes).</p><p>Il s'agit d'un test unilatéral gauche.</p>"
        },
        {
          "question": "2) Calculez la statistique de test et concluez.",
          "reponse": "<p>La statistique de test est :</p><div class='math-block'><div class='math'>$$ t = \\frac{\\bar{x} - \\mu_0}{s / \\sqrt{n}} = \\frac{9.2 - 10}{2.4 / 6} = \\frac{-0.8}{0.4} = -2 $$</div></div><p>La valeur critique pour un test unilatéral à 5% avec \( n-1 = 35 \) degrés de liberté est \( t_{35; 0.05} \\approx -1.690 \).</p><p>Puisque \( t = -2 < -1.690 \), on rejette \( H_0 \\).</p><p>Il y a suffisamment de preuves pour affirmer que le temps d'attente moyen est inférieur à 10 minutes.</p>"
        },
        {
          "question": "3) Calculez la p-value du test et interprétez-la.",
          "reponse": "<p>La p-value est \( P(T \\leq -2) \) avec 35 degrés de liberté.</p><p>D'après les tables de Student, \( P(T \\leq -2) \\approx 0.0265 \).</p><p>La p-value est 2.65%, ce qui est inférieur à 5%. On rejette donc \( H_0 \) au seuil de 5%.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Comparaison de Deux Moyennes et ANOVA",
      "points": "6 pts",
      "enonce": "<p>Un chercheur souhaite comparer l'efficacité de trois méthodes d'enseignement (M1, M2, M3) sur les performances des étudiants en statistique. Pour chaque méthode, on a prélevé un échantillon de 15 étudiants et on a relevé leurs notes à un examen final. Le tableau d'ANOVA suivant a été obtenu :</p><table border='1'><tr><th>Source de variation</th><th>Somme des carrés (SS)</th><th>ddl</th><th>Carré moyen (MS)</th></tr><tr><td>Inter-groupes</td><td>120</td><td>2</td><td>?</td></tr><tr><td>Intra-groupes</td><td>168</td><td>42</td><td>?</td></tr><tr><td>Total</td><td>288</td><td>44</td><td></td></tr></table>",
      "questions": [
        {
          "question": "1) Complétez le tableau d'ANOVA en calculant les carrés moyens.",
          "reponse": "<p>Le carré moyen inter-groupes est \( MSB = 120 / 2 = 60 \).</p><p>Le carré moyen intra-groupes est \( MSW = 168 / 42 = 4 \\).</p>"
        },
        {
          "question": "2) Testez l'hypothèse d'égalité des moyennes au seuil de 5%. Concluez.",
          "reponse": "<p>La statistique de test F est :</p><div class='math-block'><div class='math'>$$ F = \\frac{MSB}{MSW} = \\frac{60}{4} = 15 $$</div></div><p>Avec \( k-1 = 2 \) et \( n-k = 42 \) degrés de liberté, la valeur critique à 5% est \( F_{2,42;0.95} \\approx 3.23 \\).</p><p>Puisque \( F = 15 > 3.23 \\), on rejette \( H_0 \\).</p><p>Il existe une différence significative entre les moyennes des trois méthodes d'enseignement.</p>"
        },
        {
          "question": "3) Proposez une méthode pour déterminer quelles paires de méthodes sont significativement différentes.",
          "reponse": "<p>On peut utiliser un test post-hoc de comparaisons multiples, comme le test de Tukey HSD ou la correction de Bonferroni.</p><p>Le test de Tukey HSD compare toutes les paires de moyennes et permet d'identifier celles qui sont significativement différentes tout en contrôlant le risque global d'erreur de type I.</p><p>La correction de Bonferroni consiste à ajuster le niveau de signification en divisant \( \\alpha \) par le nombre de comparaisons effectuées.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Régression Linéaire Multiple",
      "points": "5 pts",
      "enonce": "<p>Un économiste modélise le prix de vente des maisons (Y) en fonction de la surface habitable (\( X_1 \)), du nombre de chambres (\( X_2 \)) et de l'âge de la maison (\( X_3 \)). Le modèle estimé est :</p><div class='math-block'><div class='math'>$$ \\hat{Y} = 50 + 0.08 X_1 + 15 X_2 - 0.6 X_3 $$</div></div><p>La variance résiduelle estimée est \( \\hat{\\sigma}^2 = 36 \). La matrice \( (X^T X)^{-1} \) est donnée par :</p><div class='math-block'><div class='math'>$$ \\Sigma = \\begin{pmatrix} 0.2 & -0.005 & -0.01 \\\\ -0.005 & 0.0005 & 0.0001 \\\\ -0.01 & 0.0001 & 0.002 \\end{pmatrix} $$</div></div><p>Un acheteur potentiel souhaite connaître le prix d'une maison de 100 m², avec 3 chambres et âgée de 5 ans.</p>",
      "questions": [
        {
          "question": "1) Calculez le prix prédit pour cette maison.",
          "reponse": "<p>\( \\hat{Y} = 50 + 0.08(100) + 15(3) - 0.6(5) = 50 + 8 + 45 - 3 = 100 \\).</p><p>Le prix prédit est de 100 (en milliers de FCFA).</p>"
        },
        {
          "question": "2) Construisez un intervalle de confiance à 95% pour le coefficient de la surface habitable \( \\beta_1 \).",
          "reponse": "<p>L'écart-type de \( \\hat{\\beta}_1 \) est \( s_{\\hat{\\beta}_1} = \\hat{\\sigma} \\sqrt{(X^T X)^{-1}_{22}} = 6 \\times \\sqrt{0.0005} \\approx 6 \\times 0.0224 \\approx 0.134 \\).</p><p>Avec \( n-4 \) degrés de liberté (supposons \( n=30 \)), \( t_{26;0.975} \\approx 2.056 \\).</p><p>L'intervalle de confiance est \( 0.08 \\pm 2.056 \\times 0.134 = 0.08 \\pm 0.276 \\).</p><p>Soit \([-0.196 ; 0.356]\).</p><p>L'intervalle contient 0, donc le coefficient de la surface habitable n'est pas significativement différent de 0 au seuil de 5%.</p>"
        },
        {
          "question": "3) Interprétez le coefficient de la variable \"Âge de la maison\".",
          "reponse": "<p>Le coefficient \( \\hat{\\beta}_3 = -0.6 \) signifie que, toutes choses égales par ailleurs, lorsque l'âge de la maison augmente d'un an, le prix de vente diminue en moyenne de 0.6 milliers de FCFA (soit 600 FCFA).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
