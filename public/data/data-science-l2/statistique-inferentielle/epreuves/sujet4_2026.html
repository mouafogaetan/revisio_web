<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Statistique Inférentielle - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle n°4 (Régression et ANOVA)",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Test du Rapport de Vraisemblance",
      "points": "4 pts",
      "enonce": "<p>Un échantillon aléatoire i.i.d. \\(X_1, X_2, ..., X_n\\) suit une loi normale \\(\\mathcal{N}(\\mu, \\sigma^2)\\) de paramètres \\(\\mu\\) et \\(\\sigma^2\\) inconnus. On souhaite tester l'hypothèse nulle \\(H_0: \\mu = \\mu_0\\) contre l'hypothèse alternative \\(H_1: \\mu \\neq \\mu_0\\), où \\(\\mu_0\\) est une valeur connue.</p><p>On rappelle que la statistique du rapport de vraisemblance est définie par :</p><div class='math-block'><div class='math'>$$ \\Lambda = \\frac{\\sup_{\\theta \\in \\Theta_0} L(\\theta)}{\\sup_{\\theta \\in \\Theta} L(\\theta)} $$</div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1 pt) Définir la région de rejet du test du rapport de vraisemblance pour ce problème.</p>",
          "reponse": "<p>La région de rejet est de la forme <span style='font-weight: bold;'>Λ < c</span>, où c est une constante déterminée par le niveau de signification α. Comme 0 ≤ Λ ≤ 1, on rejette H₀ lorsque la vraisemblance sous H₀ est beaucoup plus petite que sous H₁.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (1.5 pts) Établir l'expression de la statistique \\(-2\\ln(\\Lambda)\\) pour ce test et préciser sa distribution asymptotique sous H₀.</p>",
          "reponse": "<p>Pour ce test, on obtient :</p><div class='math-block'><div class='math'>$$ -2\\ln(\\Lambda) = n\\ln\\left(1 + \\frac{t^2}{n-1}\\right) $$</div></div><p>où \\(t = \\frac{\\bar{x} - \\mu_0}{s/\\sqrt{n}}\\) est la statistique de Student. Sous H₀, la statistique \\(-2\\ln(\\Lambda)\\) converge en loi vers un <span style='font-weight: bold;'>χ² à 1 degré de liberté</span> (théorème de Wilks).</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1.5 pts) Expliquer la relation entre le test du rapport de vraisemblance et le test de Student pour ce problème particulier.</p>",
          "reponse": "<p>Le test du rapport de vraisemblance est asymptotiquement équivalent au test de Student, mais pas exactement équivalent. La statistique du rapport de vraisemblance \\(-2\\ln(\\Lambda) = n\\ln(1 + t^2/(n-1))\\) n'est pas égale à \\(t^2\\), mais elle lui est asymptotiquement équivalente (quand n → ∞, l'expansion de Taylor donne \\(n\\ln(1 + t^2/(n-1)) \\approx t^2\\)).</p><p>Pour un échantillon fini, le test de Student est préférable car il est exact, tandis que le test du rapport de vraisemblance est asymptotique.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Modèle de Régression Multiple",
      "points": "6 pts",
      "enonce": "<p>On considère le modèle de régression linéaire multiple suivant :</p><div class='math-block'><div class='math'>$$ Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\varepsilon $$</div></div><p>où \\(\\varepsilon \\sim \\mathcal{N}(0, \\sigma^2)\\). On dispose de n = 50 observations. Les résultats de l'estimation par les moindres carrés sont les suivants :</p><ul><li>R² = 0.75</li><li>Coefficient \\(\\hat{\\beta}_1 = 2.5\\) avec \\(\\text{se}(\\hat{\\beta}_1) = 0.8\\)</li><li>Coefficient \\(\\hat{\\beta}_2 = -1.2\\) avec \\(\\text{se}(\\hat{\\beta}_2) = 0.6\\)</li><li>La somme des carrés résiduelle est SSE = 240</li></ul>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1 pt) Interpréter les coefficients \\(\\hat{\\beta}_1\\) et \\(\\hat{\\beta}_2\\) dans le contexte du modèle.</p>",
          "reponse": "<p>\\(\\hat{\\beta}_1 = 2.5\\) : lorsque \\(X_1\\) augmente d'une unité, toutes choses égales par ailleurs, \\(Y\\) augmente en moyenne de 2.5 unités. \\(\\hat{\\beta}_2 = -1.2\\) : lorsque \\(X_2\\) augmente d'une unité, toutes choses égales par ailleurs, \\(Y\\) diminue en moyenne de 1.2 unités.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (1.5 pts) Tester la significativité individuelle de \\(\\beta_1\\) au seuil α = 0.05. On donne \\(t_{47;0.025} \\approx 2.011\\).</p>",
          "reponse": "<p>La statistique de test est \\(t = \\hat{\\beta}_1 / \\text{se}(\\hat{\\beta}_1) = 2.5 / 0.8 = 3.125\\). La valeur critique est 2.011. Comme |t| = 3.125 > 2.011, on rejette H₀ : \\(\\beta_1 = 0\\). Le coefficient \\(\\beta_1\\) est significativement différent de 0 au seuil de 5%.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1.5 pts) Tester la significativité individuelle de \\(\\beta_2\\) au seuil α = 0.05.</p>",
          "reponse": "<p>La statistique de test est \\(t = \\hat{\\beta}_2 / \\text{se}(\\hat{\\beta}_2) = -1.2 / 0.6 = -2.0\\). La valeur critique est 2.011. Comme |t| = 2.0 < 2.011, on ne rejette pas H₀ : \\(\\beta_2 = 0\\). Le coefficient \\(\\beta_2\\) n'est pas significativement différent de 0 au seuil de 5%.</p>"
        },
        {
          "question": "<p><strong>4.</strong> (2 pts) On souhaite tester la nullité globale du modèle : \\(H_0: \\beta_1 = \\beta_2 = 0\\). Calculer la statistique F et conclure. On donne \\(F_{0.05;2,47} \\approx 3.20\\).</p>",
          "reponse": "<p>On utilise la formule \\(F = \\frac{(SST - SSE)/p}{SSE/(n-p-1)}\\) où p est le nombre de variables (p=2). On a SSE = 240 et R² = 0.75, donc SST = SSE/(1-R²) = 240/0.25 = 960. La statistique F est donc :</p><div class='math-block'><div class='math'>$$ F = \\frac{(960 - 240)/2}{240/(50-2-1)} = \\frac{720/2}{240/47} = \\frac{360}{5.106} \\approx 70.5 $$</div></div><p>Comme F = 70.5 > 3.20, on rejette H₀. Le modèle est globalement significatif : au moins un des coefficients est non nul.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Diagnostics et Validation du Modèle de Régression",
      "points": "5 pts",
      "enonce": "<p>Après avoir ajusté le modèle de régression de l'exercice précédent, on procède à l'analyse des résidus.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1 pt) Le test de Shapiro-Wilk sur les résidus donne une p-value de 0.03. Que peut-on en conclure au seuil α = 0.05 ? Proposer une solution.</p>",
          "reponse": "<p>La p-value = 0.03 < 0.05, donc on rejette l'hypothèse de normalité des résidus au seuil de 5%. Cela suggère que les résidus ne suivent pas une distribution normale, ce qui peut affecter la validité des tests d'hypothèses sur les coefficients. Une solution serait de transformer la variable dépendante (par exemple, via une transformation de Box-Cox) ou d'utiliser des méthodes robustes (erreurs-types robustes).</p>"
        },
        {
          "question": "<p><strong>2.</strong> (1.5 pts) Le test de Breusch-Pagan donne une p-value de 0.12. Interpréter ce résultat.</p>",
          "reponse": "<p>La p-value = 0.12 > 0.05, donc on ne rejette pas l'hypothèse d'homoscédasticité au seuil de 5%. Il n'y a pas de preuve statistique suffisante pour conclure à une hétéroscédasticité des résidus. La variance des résidus semble constante, ce qui est favorable pour la validité du modèle.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1 pt) Une observation a un levier (leverage) de 0.15 alors que la moyenne du levier est p/n = 3/50 = 0.06. Que signifie cette valeur ?</p>",
          "reponse": "<p>Le levier de 0.15 est supérieur à 2×moyenne = 0.12. Cela indique que cette observation a une position atypique dans l'espace des variables explicatives et pourrait avoir une influence potentielle importante sur le modèle. Il s'agit d'une observation à surveiller.</p>"
        },
        {
          "question": "<p><strong>4.</strong> (1.5 pts) La distance de Cook maximale est de 0.85. Interpréter cette valeur.</p>",
          "reponse": "<p>La distance de Cook mesure l'influence globale d'une observation sur l'ensemble des coefficients du modèle. Une valeur de 0.85 est considérée comme élevée (proche de 1). Cela signifie que cette observation a un impact important sur les estimations des paramètres. Il est recommandé d'examiner cette observation pour vérifier s'il s'agit d'une erreur de saisie ou d'une valeur légitime. Si c'est une erreur, on peut la corriger ou l'exclure.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Sélection de Variables",
      "points": "5 pts",
      "enonce": "<p>Un data scientist souhaite construire un modèle de régression pour prédire la consommation d'énergie d'un bâtiment. Il dispose de 10 variables explicatives potentielles et souhaite sélectionner le meilleur modèle.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1 pt) Expliquer la différence entre les critères AIC et BIC pour la sélection de variables.</p>",
          "reponse": "<p>AIC (Akaike Information Criterion) et BIC (Bayesian Information Criterion) sont des critères de sélection de modèle qui pénalisent la complexité. Le BIC pénalise plus fortement l'ajout de variables que l'AIC (car le terme de pénalité est \\(k\\ln(n)\\) pour BIC contre \\(2k\\) pour AIC, où k est le nombre de paramètres). Le BIC tend donc à sélectionner des modèles plus parcimonieux que l'AIC.</p>"
        },
        {
          "question": "<p><strong>2.</strong> (1.5 pts) Décrire les méthodes de sélection pas à pas (forward, backward, stepwise) et leurs avantages/inconvénients.</p>",
          "reponse": "<p><span style='font-weight: bold;'>Forward :</span> On commence par un modèle vide et on ajoute itérativement la variable qui améliore le plus le critère de sélection. <span style='font-weight: bold;'>Backward :</span> On commence par le modèle complet et on retire itérativement la variable la moins pertinente. <span style='font-weight: bold;'>Stepwise :</span> Combinaison des deux (on peut ajouter ou retirer des variables à chaque étape).</p><p>Avantages : Simples à mettre en œuvre. Inconvénients : Risque de surajustement, ne garantissent pas l'obtention du meilleur modèle, peuvent être instables.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1 pt) Définir le problème de la multicolinéarité et expliquer comment le détecter.</p>",
          "reponse": "<p>La <span style='font-weight: bold;'>multicolinéarité</span> est une forte corrélation entre les variables explicatives. Elle pose problème car elle rend instables les estimations des coefficients et augmente leurs variances. On peut la détecter via le <span style='font-weight: bold;'>Facteur d'Inflation de la Variance (VIF)</span>. Un VIF > 10 (ou > 5) indique une multicolinéarité problématique.</p>"
        },
        {
          "question": "<p><strong>4.</strong> (1.5 pts) Expliquer brièvement le principe de la régularisation Ridge et Lasso.</p>",
          "reponse": "<p>La <span style='font-weight: bold;'>régularisation</span> consiste à ajouter une pénalité à la fonction de coût des moindres carrés.</p><ul><li><span style='font-weight: bold;'>Ridge (L2)</span> : ajoute une pénalité \\(\\lambda\\sum\\beta_j^2\\). Il réduit les coefficients vers zéro sans les annuler.</li><li><span style='font-weight: bold;'>Lasso (L1)</span> : ajoute une pénalité \\(\\lambda\\sum|\\beta_j|\\). Il peut annuler certains coefficients, ce qui permet une sélection de variables.</li></ul><p>Ces méthodes améliorent la stabilité du modèle en présence de multicolinéarité.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
