<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Inférence sur les Coefficients",
    "contenu": "<div style='text-align: center; padding: 20px 10px;'><h2 style='color: #1a237e; font-size: 1.8em;'>Inférence sur les Coefficients</h2><p style='font-size: 1.2em; color: #333;'>Lesson 20 - Régression Linéaire Multiple</p><div style='background: #e3f2fd; padding: 15px; border-radius: 12px; margin: 20px 0;'><p style='font-size: 1.1em; color: #0d47a1; margin: 0;'>Objectifs : Distribution de β̂, IC, tests de Student, test F</p></div><p style='color: #555; font-size: 0.95em;'>Licence 2 Data Science - Statistique Inférentielle</p></div>",
    "texteParle": "Bienvenue à tous. Dans cette leçon, nous allons voir comment faire de l'inférence sur les coefficients du modèle de régression linéaire multiple. Nous allons étudier la distribution des estimateurs, construire des intervalles de confiance, tester la significativité des coefficients et évaluer la nullité globale du modèle. Ce sont des outils essentiels pour valider et interpréter vos modèles de régression.",
    "note": "Cette leçon est fondamentale pour l'analyse des données en Data Science."
  },
  {
    "titre": "Rappel du Modèle",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Modèle de Régression Multiple</h3><div class='math-block' style='background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$Y = X\\beta + \\varepsilon$$</div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><ul style='list-style: none; padding: 0; color: #1b5e20;'><li>• <strong>Y</strong> : variable réponse (n × 1)</li><li>• <strong>X</strong> : matrice des prédicteurs (n × p)</li><li>• <strong>β</strong> : vecteur des coefficients (p × 1)</li><li>• <strong>ε</strong> : erreur ∼ N(0, σ²I)</li></ul></div><p style='color: #333; font-size: 0.95em; margin-top: 10px;'>Hypothèses : normalité, homoscédasticité, indépendance, linéarité</p></div>",
    "texteParle": "Rappelons d'abord le modèle de régression linéaire multiple. Nous avons Y égal à X beta plus epsilon, où Y est la variable réponse, X est la matrice des prédicteurs, beta est le vecteur des coefficients et epsilon est le terme d'erreur. Les erreurs sont supposées suivre une loi normale avec une moyenne de zéro et une variance sigma carré. Nous devons vérifier les hypothèses de normalité, d'homoscédasticité, d'indépendance et de linéarité.",
    "note": "Le modèle Y = Xβ + ε est la base de la régression multiple."
  },
  {
    "titre": "Distribution des Estimateurs",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Distribution de β̂</h3><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #e65100; font-weight: bold; margin: 0;'>Estimateur des Moindres Carrés</p><div class='math-block' style='background: #fff8e1; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\hat{\\beta} = (X^T X)^{-1} X^T Y$$</div></div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Distribution Normale</p><div class='math-block' style='background: #e8eaf6; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\hat{\\beta} \\sim \\mathcal{N}(\\beta, \\sigma^2 (X^T X)^{-1})$$</div></div></div><ul style='color: #333; font-size: 0.95em; padding-left: 20px;'><li>• Estimateur sans biais : <span style='font-weight: bold;'>E(β̂) = β</span></li><li>• Matrice de variance-covariance : <span style='font-weight: bold;'>Var(β̂) = σ² (XᵀX)⁻¹</span></li></ul></div>",
    "texteParle": "L'estimateur des moindres carrés pour beta est donné par X transpose X inverse fois X transpose Y. Cet estimateur suit une distribution normale multivariée avec une moyenne égale à la vraie valeur de beta et une variance égale à sigma carré fois X transpose X inverse. Il est non biaisé, ce qui signifie que sa valeur attendue est égale au vrai paramètre. La matrice de variance-covariance nous permet de construire des intervalles de confiance et de réaliser des tests d'hypothèses.",
    "note": "β̂ ∼ N(β, σ²(XᵀX)⁻¹) : base de toute inférence en régression."
  },
  {
    "titre": "Estimation de σ²",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Variance des Erreurs σ²</h3><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #c62828; font-weight: bold; margin: 0;'>Estimateur non biaisé</p><div class='math-block' style='background: #ffebee; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\hat{\\sigma}^2 = \\frac{SSE}{n-p} = \\frac{\\sum_{i=1}^n (Y_i - \\hat{Y}_i)^2}{n-p}$$</div></div></div><div style='background: #e0f7fa; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #00695c; font-weight: bold; margin: 0;'>Degrés de liberté</p><p style='color: #004d40; margin: 5px 0;'>• n - p : degrés de liberté (p = nombre de paramètres)</p><p style='color: #004d40; margin: 5px 0;'>• Distribution : <span style='font-weight: bold;'>(n-p)ŝ²/σ² ∼ χ²(n-p)</span></p></div><p style='color: #333; font-size: 0.95em; margin-top: 10px;'>Cette estimation est cruciale pour les IC et les tests</p></div>",
    "texteParle": "Nous avons besoin d'estimer la variance des erreurs sigma carré. L'estimateur non biaisé est la somme des carrés des erreurs divisée par n moins p, où p est le nombre de paramètres du modèle. Cette quantité suit une loi du chi-deux à n moins p degrés de liberté. Cette estimation est fondamentale pour calculer les variances des coefficients et construire les intervalles de confiance.",
    "note": "ŝ² = SSE/(n-p) est l'estimateur non biaisé de σ²."
  },
  {
    "titre": "Erreur Standard des Coefficients",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Erreur Standard de β̂ⱼ</h3><div style='background: #f3e5f5; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #4a148c; font-weight: bold; margin: 0;'>Formule Générale</p><div class='math-block' style='background: #f3e5f5; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$se(\\hat{\\beta}_j) = \\hat{\\sigma} \\sqrt{(X^T X)^{-1}_{jj}}$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Interprétation</p><ul style='color: #1b5e20; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• Mesure de la précision de l'estimation</li><li>• Plus l'erreur standard est petite, plus l'estimateur est précis</li><li>• Dépend de la variance des erreurs et de la structure de X</li></ul></div><div style='background: #fff8e1; padding: 10px; border-radius: 8px;'><p style='color: #e65100; font-size: 0.95em; margin: 0;'>Exemple : Dans la régression simple, se(β̂₁) = ŝ / √∑(xᵢ - x̄)²</p></div></div>",
    "texteParle": "L'erreur standard du coefficient beta j est obtenue en prenant la racine carrée de la variance estimée. C'est sigma chapeau fois la racine carrée de l'élément diagonal correspondant de X transpose X inverse. Plus l'erreur standard est petite, plus notre estimation est précise. Elle dépend de la variance des erreurs et de la structure des données. Plus les données sont dispersées autour de leur moyenne, plus l'erreur standard est petite.",
    "note": "se(β̂ⱼ) = ŝ × √[(XᵀX)⁻¹]_ⱼⱼ : précision des coefficients."

  {
    "titre": "Intervalle de Confiance pour βⱼ",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Intervalle de Confiance à (1-α)%</h3><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><div class='math-block' style='background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$IC_{1-\\alpha}(\\beta_j) = \\hat{\\beta}_j \\pm t_{n-p, \\alpha/2} \\cdot se(\\hat{\\beta}_j)$$</div></div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Procédure</p><ol style='color: #0d47a1; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>Choisir le niveau de confiance (1 - α)</li><li>Calculer β̂ⱼ et se(β̂ⱼ)</li><li>Déterminer le quantile tₙ₋ₚ,α/₂</li><li>Construire l'intervalle</li></ol></div><div style='background: #fff8e1; padding: 10px; border-radius: 8px;'><p style='color: #e65100; font-size: 0.95em; margin: 0;'>Interprétation : Il y a (1-α)% de chance que l'intervalle contienne la vraie valeur de βⱼ</p></div></div>",
    "texteParle": "L'intervalle de confiance pour un coefficient beta j est construit en utilisant la distribution de Student. Il est donné par beta j chapeau plus ou moins le quantile de Student au niveau alpha sur deux, fois l'erreur standard. Pour construire cet intervalle, on choisit d'abord le niveau de confiance, on calcule le coefficient et son erreur standard, on détermine le quantile approprié, puis on construit l'intervalle. Cet intervalle nous donne une plage de valeurs plausibles pour le vrai coefficient.",
    "note": "IC(βⱼ) = β̂ⱼ ± tₙ₋ₚ,α/₂ × se(β̂ⱼ) avec t de Student."

  {
    "titre": "Test de Student pour βⱼ",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Test de Significativité d'un Coefficient</h3><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #c62828; font-weight: bold; margin: 0;'>Hypothèses</p><p style='color: #b71c1c; margin: 5px 0;'>H₀ : βⱼ = 0 &nbsp;|&nbsp; H₁ : βⱼ ≠ 0</p></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #e65100; font-weight: bold; margin: 0;'>Statistique de Test</p><div class='math-block' style='background: #fff3e0; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$t = \\frac{\\hat{\\beta}_j}{se(\\hat{\\beta}_j)} \\sim t_{n-p}$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Règle de Décision</p><ul style='color: #1b5e20; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• Rejet H₀ si |t| > tₙ₋ₚ,α/₂</li><li>• Ou si p-value < α</li></ul></div></div>",
    "texteParle": "Le test de Student permet de vérifier si un coefficient est significativement différent de zéro. L'hypothèse nulle est que beta j est égal à zéro, c'est-à-dire que la variable n'a pas d'effet sur la réponse. La statistique de test est le coefficient divisé par son erreur standard. Elle suit une loi de Student à n moins p degrés de liberté. On rejette l'hypothèse nulle si la valeur absolue de t est supérieure au quantile critique, ou si la p-value est inférieure au seuil alpha.",
    "note": "t = β̂ⱼ/se(β̂ⱼ) ∼ tₙ₋ₚ : test d'effet d'une variable."

  {

    "texteParle": "Le test F global vérifie si au moins un coefficient est non nul, c'est-à-dire si le modèle explique une part significative de la variance. L'hypothèse nulle est que tous les coefficients sauf la constante sont égaux à zéro. La statistique de test est le rapport de la somme des carrés de la régression divisée par le nombre de prédicteurs, sur la somme des carrés des erreurs divisée par n moins p. Cette statistique suit une loi de Fisher avec p moins un et n moins p degrés de liberté. On rejette l'hypothèse nulle si F est grand.",
    "note": "F = (SSR/(p-1))/(SSE/(n-p)) ∼ Fₚ₋₁,ₙ₋ₚ : test global."

  {
    "titre": "P-value et Interprétation",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>P-value et Décision Statistique</h3><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Définition</p><p style='color: #0d47a1; font-size: 0.95em;'>Probabilité d'observer une statistique aussi extrême que celle observée, sous H₀</p></div><div style='background: #fff8e1; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #e65100; font-weight: bold; margin: 0;'>Règle de Décision</p><ul style='color: #e65100; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• Si p-value < α : <span style='color: #c62828; font-weight: bold;'>Rejet H₀</span> (effet significatif)</li><li>• Si p-value ≥ α : <span style='color: #2e7d32; font-weight: bold;'>Non rejet H₀</span> (effet non significatif)</li></ul></div><div style='background: #f3e5f5; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #4a148c; font-weight: bold; margin: 0;'>Exemple Camerounais</p><p style='color: #4a148c; font-size: 0.95em;'>Une p-value de 0.03 signifie qu'il y a 3% de chance d'observer un effet aussi fort par hasard. On conclut que la variable a un effet significatif au seuil α = 5%.</p></div></div>",
    "texteParle": "La p-value est la probabilité d'observer une statistique aussi extrême que celle que vous avez obtenue, en supposant que l'hypothèse nulle est vraie. Si la p-value est inférieure à alpha, on rejette l'hypothèse nulle et on conclut que l'effet est significatif. Sinon, on ne peut pas rejeter l'hypothèse nulle. Par exemple, une p-value de 0.03 signifie qu'il n'y a que trois pour cent de chance d'observer un effet aussi fort par pur hasard, donc on conclut que l'effet est réel.",
    "note": "Une p-value < α indique un effet statistiquement significatif."

sp; n = 50</p></div></div>",
    "texteParle": "Voici un exemple typique de tableau de régression. Il contient pour chaque variable : le coefficient estimé, son erreur standard, la statistique de test t, et la p-value. On voit ici que la variable X1 a une p-value de 0.002, ce qui est inférieur à 0.05, donc elle est significative. En revanche, X2 a une p-value de 0.118, donc elle n'est pas significative. Le R-carré est de 0.78, ce qui indique que le modèle explique 78 pour cent de la variance. Le test F global est significatif avec une p-value inférieure à 0.001.",

    "texteParle": "Pour conclure, retenez les points essentiels. L'estimateur des moindres carrés suit une distribution normale multivariée. L'intervalle de confiance d'un coefficient utilise la distribution de Student. Le test de Student permet de tester la significativité individuelle d'un coefficient. Le test F global évalue si au moins un coefficient est non nul. N'oubliez jamais de vérifier les conditions d'application de vos modèles. Ces outils sont essentiels pour l'analyse de données en Data Science.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

        }

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
