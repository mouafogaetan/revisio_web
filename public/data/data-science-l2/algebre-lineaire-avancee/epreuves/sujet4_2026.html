<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°4 - Semestre 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Espaces Euclidiens et Projection Orthogonale",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>L'objectif de cet exercice est de tester votre compréhension des espaces euclidiens, du produit scalaire et du théorème de projection orthogonale, concepts fondamentaux pour la régression linéaire.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Produit scalaire (1.5 pts)</strong></p><p>1.a) Rappeler la définition d'un produit scalaire sur un espace vectoriel réel \\( E \\). Quelles sont les trois propriétés qu'il doit vérifier ?</p><p>1.b) Sur \\( \\mathbb{R}^2 \\), on considère l'application \\( \\langle (x_1,y_1), (x_2,y_2) \\rangle = 2x_1x_2 + 3y_1y_2 \\). Montrer que c'est un produit scalaire.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Définition :</strong> Un produit scalaire sur \\( E \\) est une application \\( \\langle \\cdot, \\cdot \\rangle : E \\times E \\to \\mathbb{R} \\) vérifiant :</p><ul><li><strong>Symétrie :</strong> \\( \\langle x, y \\rangle = \\langle y, x \\rangle \\)</li><li><strong>Bilinéarité :</strong> \\( \\langle \\lambda x + \\mu y, z \\rangle = \\lambda \\langle x, z \\rangle + \\mu \\langle y, z \\rangle \\)</li><li><strong>Positivité :</strong> \\( \\langle x, x \\rangle \\ge 0 \\) et \\( \\langle x, x \\rangle = 0 \\iff x = 0 \\)</li></ul><p><strong>1.b) Vérification :</strong> Posons \\( u = (x_1,y_1) \\), \\( v = (x_2,y_2) \\).</p><p><strong>Symétrie :</strong> \\( \\langle u, v \\rangle = 2x_1x_2 + 3y_1y_2 = \\langle v, u \\rangle \\)</p><p><strong>Bilinéarité :</strong> Évidente par linéarité de la somme et du produit par un scalaire.</p><p><strong>Positivité :</strong> \\( \\langle u, u \\rangle = 2x_1^2 + 3y_1^2 \\ge 0 \\). L'égalité \\( 2x_1^2 + 3y_1^2 = 0 \\) implique \\( x_1 = y_1 = 0 \\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Théorème de Riesz (1.5 pts)</strong></p><p>Soit \\( E \\) un espace euclidien de dimension \\( n \\).</p><p>2.a) Énoncer le théorème de Riesz.</p><p>2.b) Sur \\( \\mathbb{R}^2 \\) muni du produit scalaire usuel, considérer la forme linéaire \\( \\varphi(x,y) = 3x - 2y \\). Déterminer l'unique vecteur \\( a \\in \\mathbb{R}^2 \\) tel que \\( \\varphi(u) = \\langle a, u \\rangle \\) pour tout \\( u \\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>2.a) Théorème de Riesz :</strong> Pour toute forme linéaire \\( \\varphi \\in E^* \\), il existe un unique vecteur \\( a \\in E \\) tel que :</p><p style='text-align: center;'>\\( \\forall x \\in E, \\quad \\varphi(x) = \\langle a, x \\rangle \\)</p><p><strong>2.b) Calcul :</strong> On cherche \\( a = (\\alpha, \\beta) \\) tel que :</p><p>\\( \\langle a, (x,y) \\rangle = \\alpha x + \\beta y = 3x - 2y \\)</p><p>Par identification, \\( \\alpha = 3 \\) et \\( \\beta = -2 \\). Donc \\( a = (3, -2) \\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>3. Projection orthogonale et moindres carrés (2 pts)</strong></p><p>On considère le sous-espace \\( F = \\text{Vect}\\{(1,1,1), (1,2,3)\\} \\) de \\( \\mathbb{R}^3 \\) muni du produit scalaire usuel.</p><p>3.a) Déterminer la projection orthogonale du vecteur \\( y = (1,2,4) \\) sur \\( F \\).</p><p>3.b) En déduire la solution des moindres carrés du système \\( X\\beta = y \\) où \\( X = \\begin{pmatrix} 1 & 1 \\\\ 1 & 2 \\\\ 1 & 3 \\end{pmatrix} \\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>3.a) Projection :</strong> On cherche \\( \\hat{y} = \\alpha u_1 + \\beta u_2 \\) avec \\( u_1 = (1,1,1) \\), \\( u_2 = (1,2,3) \\).</p><p>Les équations normales sont : \\( \\begin{cases} \\langle y - \\hat{y}, u_1 \\rangle = 0 \\\\ \\langle y - \\hat{y}, u_2 \\rangle = 0 \\end{cases} \\)</p><p>\\( \\langle y, u_1 \\rangle = 1+2+4 = 7 \\), \\( \\langle y, u_2 \\rangle = 1+4+12 = 17 \\)</p><p>\\( \\langle u_1, u_1 \\rangle = 3 \\), \\( \\langle u_1, u_2 \\rangle = 1+2+3 = 6 \\), \\( \\langle u_2, u_2 \\rangle = 1+4+9 = 14 \\)</p><p>Système : \\( \\begin{cases} 3\\alpha + 6\\beta = 7 \\\\ 6\\alpha + 14\\beta = 17 \\end{cases} \\)</p><p>De la première : \\( \\alpha = \\frac{7 - 6\\beta}{3} \\). En substituant : \\( 6\\frac{7 - 6\\beta}{3} + 14\\beta = 17 \\Rightarrow 14 - 12\\beta + 14\\beta = 17 \\Rightarrow 2\\beta = 3 \\Rightarrow \\beta = \\frac{3}{2} \\).</p><p>Donc \\( \\alpha = \\frac{7 - 9}{3} = -\\frac{2}{3} \\).</p><p>\\( \\hat{y} = -\\frac{2}{3}(1,1,1) + \\frac{3}{2}(1,2,3) = \\left( -\\frac{2}{3} + \\frac{3}{2}, -\\frac{2}{3} + 3, -\\frac{2}{3} + \\frac{9}{2} \\right) = \\left( \\frac{5}{6}, \\frac{7}{3}, \\frac{23}{6} \\right) \\).</p><p><strong>3.b) Solution des moindres carrés :</strong> \\( \\hat{\\beta} = (\\alpha, \\beta)^T = \\left( -\\frac{2}{3}, \\frac{3}{2} \\right)^T \\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Matrices Définies Positives et Décomposition de Cholesky",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>Les matrices définies positives sont omniprésentes en statistique (matrices de covariance) et en optimisation. La décomposition de Cholesky est un outil clé pour les manipuler efficacement.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Caractérisation des matrices définies positives (1.5 pts)</strong></p><p>Soit \\( A = \\begin{pmatrix} 2 & -1 \\\\ -1 & 2 \\end{pmatrix} \\).</p><p>1.a) Montrer que \\( A \\) est symétrique définie positive en utilisant la définition \\( x^T A x > 0 \\) pour \\( x \\neq 0 \\).</p><p>1.b) Calculer les valeurs propres de \\( A \\) et vérifier qu'elles sont positives.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Définition :</strong> \\( A \\) est symétrique car \\( A^T = A \\).</p><p>Soit \\( x = (x_1, x_2)^T \\neq 0 \\).</p><p>\\( x^T A x = 2x_1^2 - 2x_1x_2 + 2x_2^2 = (x_1 - x_2)^2 + x_1^2 + x_2^2 > 0 \\)</p><p>L'expression est strictement positive car \\( (x_1 - x_2)^2 \\ge 0 \\), \\( x_1^2 \\ge 0 \\), \\( x_2^2 \\ge 0 \\) et la somme ne peut s'annuler que si \\( x_1 = x_2 = 0 \\).</p><p><strong>1.b) Valeurs propres :</strong> \\( \\det(A - \\lambda I) = (2-\\lambda)^2 - 1 = \\lambda^2 - 4\\lambda + 3 = (\\lambda - 1)(\\lambda - 3) \\)</p><p>Les valeurs propres sont \\( \\lambda_1 = 1 \\) et \\( \\lambda_2 = 3 \\), toutes strictement positives.</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>2. Décomposition de Cholesky (2 pts)</strong></p><p>Soit \\( A = \\begin{pmatrix} 4 & 2 & 0 \\\\ 2 & 5 & 1 \\\\ 0 & 1 & 2 \\end{pmatrix} \\).</p><p>2.a) Vérifier que \\( A \\) est définie positive en utilisant le critère des mineurs principaux (critère de Sylvester).</p><p>2.b) Calculer la décomposition de Cholesky \\( A = L L^T \\) de \\( A \\).</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>2.a) Critère de Sylvester :</strong> Une matrice symétrique est définie positive si tous ses mineurs principaux sont strictement positifs.</p><p>\\( \\Delta_1 = 4 > 0 \\)</p><p>\\( \\Delta_2 = \\det\\begin{pmatrix} 4 & 2 \\\\ 2 & 5 \\end{pmatrix} = 20 - 4 = 16 > 0 \\)</p><p>\\( \\Delta_3 = \\det(A) = 4(5\\cdot2 - 1\\cdot1) - 2(2\\cdot2 - 0\\cdot1) + 0 = 4(9) - 2(4) = 36 - 8 = 28 > 0 \\)</p><p>Donc \\( A \\) est définie positive.</p><p><strong>2.b) Décomposition de Cholesky :</strong> On cherche \\( L = \\begin{pmatrix} l_{11} & 0 & 0 \\\\ l_{21} & l_{22} & 0 \\\\ l_{31} & l_{32} & l_{33} \\end{pmatrix} \\).</p><p><strong>Colonne 1 :</strong> \\( l_{11}^2 = 4 \\Rightarrow l_{11} = 2 \\) ; \\( l_{21}l_{11} = 2 \\Rightarrow l_{21} = 1 \\) ; \\( l_{31}l_{11} = 0 \\Rightarrow l_{31} = 0 \\)</p><p><strong>Colonne 2 :</strong> \\( l_{21}^2 + l_{22}^2 = 5 \\Rightarrow 1 + l_{22}^2 = 5 \\Rightarrow l_{22} = 2 \\) ; \\( l_{21}l_{31} + l_{22}l_{32} = 1 \\Rightarrow 0 + 2l_{32} = 1 \\Rightarrow l_{32} = \\frac{1}{2} \\)</p><p><strong>Colonne 3 :</strong> \\( l_{31}^2 + l_{32}^2 + l_{33}^2 = 2 \\Rightarrow 0 + \\frac{1}{4} + l_{33}^2 = 2 \\Rightarrow l_{33}^2 = \\frac{7}{4} \\Rightarrow l_{33} = \\frac{\\sqrt{7}}{2} \\)</p><p>Donc \\( L = \\begin{pmatrix} 2 & 0 & 0 \\\\ 1 & 2 & 0 \\\\ 0 & \\frac{1}{2} & \\frac{\\sqrt{7}}{2} \\end{pmatrix} \\).</p></div>"
        },
        {
          "question": "<div style='color: #2c3e50;'><p><strong>3. Application à la régularisation (1.5 pts)</strong></p><p>Soit \\( \\Sigma = \\begin{pmatrix} 1 & 0.8 \\\\ 0.8 & 1 \\end{pmatrix} \\) une matrice de covariance.</p><p>3.a) \\( \\Sigma \\) est-elle définie positive ? Justifier.</p><p>3.b) Proposer une méthode pour régulariser \\( \\Sigma \\) afin qu'elle devienne définie positive. Pourquoi cette régularisation est-elle importante en statistique ?</p></div>",

      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Définition et interprétation (2 pts)</strong></p><p>1.a) Donner la définition de la décomposition en valeurs singulières (SVD) d'une matrice \\( A \\in \\mathbb{R}^{m \\times n} \\).</p><p>1.b) Que représentent les matrices \\( U \\), \\( V \\) et \\( \\Sigma \\) dans la SVD ? Quelles sont leurs propriétés ?</p><p>1.c) Interpréter géométriquement les valeurs singulières.</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Définition :</strong> Pour toute matrice \\( A \\in \\mathbb{R}^{m \\times n} \\), il existe des matrices orthogonales \\( U \\in \\mathbb{R}^{m \\times m} \\), \\( V \\in \\mathbb{R}^{n \\times n} \\) et une matrice diagonale \\( \\Sigma \\in \\mathbb{R}^{m \\times n} \\) telles que :</p><p style='text-align: center;'>\\( A = U \\Sigma V^T \\)</p><p><strong>1.b) Propriétés :</strong></p><ul><li>\\( U \\) : Matrice orthogonale (\\( U^T U = I \\)), ses colonnes sont les vecteurs singuliers à gauche.</li><li>\\( V \\) : Matrice orthogonale (\\( V^T V = I \\)), ses colonnes sont les vecteurs singuliers à droite.</li><li>\\( \\Sigma \\) : Matrice diagonale (dans le cas rectangulaire), les éléments \\( \\sigma_i \\ge 0 \\) sont les valeurs singulières, généralement rangées par ordre décroissant.</li></ul><p><strong>1.c) Interprétation géométrique :</strong> La SVD décompose toute transformation linéaire en trois étapes :</p><ul><li>Une rotation/reflet dans l'espace de départ (par \\( V^T \\)).</li><li>Un scaling (multiplication par les \\( \\sigma_i \\)) le long des axes principaux.</li><li>Une rotation/reflet dans l'espace d'arrivée (par \\( U \\)).</li></ul><p>Les valeurs singulières \\( \\sigma_i \\) représentent les facteurs d'étirement dans les directions principales de la transformation.</p></div>"

      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 12px;'> <p style='color: #2c3e50;'>Cet exercice illustre l'application des concepts d'algèbre linéaire avancée à un problème concret de Data Science : la factorisation de matrices pour les systèmes de recommandation.</p> </div>",
      "questions": [
        {
          "question": "<div style='color: #2c3e50;'><p><strong>1. Modélisation (1.5 pts)</strong></p><p>On considère une matrice de notes \\( R \\in \\mathbb{R}^{m \\times n} \\) où \\( m \\) est le nombre d'utilisateurs et \\( n \\) le nombre de produits. On souhaite factoriser \\( R \\approx U V^T \\) avec \\( U \\in \\mathbb{R}^{m \\times k} \\) et \\( V \\in \\mathbb{R}^{n \\times k} \\).</p><p>1.a) Expliquer le principe de la factorisation de matrices pour la recommandation.</p><p>1.b) Quelle est l'utilité de la SVD dans ce contexte ?</p></div>",
          "reponse": "<div style='color: #2c3e50;'><p><strong>1.a) Principe :</strong> La factorisation de matrices consiste à approximer la matrice des notes \\( R \\) par le produit de deux matrices de rang plus faible : \\( R \\approx U V^T \\).</p><ul><li>\\( U \\) : Chaque ligne représente un utilisateur dans l'espace latent de dimension \\( k \\).</li><li>\\( V \\) : Chaque ligne représente un produit dans le même espace latent.</li><li>La note prédite est \\( \\hat{r}_{ij} = u_i^T v_j \\), le produit scalaire entre les facteurs de l'utilisateur et du produit.</li></ul><p><strong>1.b) Rôle de la SVD :</strong> La SVD permet de trouver la meilleure approximation de rang \\( k \\) de la matrice \\( R \\) au sens de la norme de Frobenius.</p><p>Si \\( R = U \\Sigma V^T \\) est la SVD complète, alors \\( R_k = U_k \\Sigma_k V_k^T \\) est la meilleure approximation de rang \\( k \\) de \\( R \\).</p></div>"

          "reponse": "<div style='color: #2c3e50;'><p><strong>2.a) Rôle de \\( \\lambda \\) :</strong> Le paramètre \\( \\lambda \\) est le coefficient de régularisation. Il contrôle la complexité du modèle :</p><ul><li>Plus \\( \\lambda \\) est grand, plus les coefficients sont pénalisés, ce qui donne un modèle plus simple (moins de variance, plus de biais).</li><li>Plus \\( \\lambda \\) est petit, plus le modèle s'ajuste aux données (risque de surapprentissage).</li></ul><p>La régularisation permet d'éviter le surapprentissage et de stabiliser les calculs numériques.</p><p><strong>2.b) ALS :</strong> La méthode ALS alterne entre deux étapes :</p><ul><li>On fixe \\( U \\) et on résout pour \\( V \\) (problème des moindres carrés).</li><li>On fixe \\( V \\) et on résout pour \\( U \\) (problème des moindres carrés).</li></ul><p>Cette approche est efficace car chaque sous-problème est un problème de moindres carrés avec une solution analytique. La non-convexité du problème global est contournée par cette alternance.</p></div>"

          "reponse": "<div style='color: #2c3e50;'><p><strong>Interprétation :</strong></p><ul><li><strong>\\( U \\)</strong> : La ligne \\( u_i \\) représente l'utilisateur \\( i \\) dans un espace de dimension \\( k \\). Les coordonnées capturent les préférences de l'utilisateur sur \\( k \\) facteurs latents (par exemple, genres de films, styles musicaux, etc.).</li><li><strong>\\( V \\)</strong> : La ligne \\( v_j \\) représente le produit \\( j \\) dans le même espace. Les coordonnées capturent les caractéristiques du produit sur ces mêmes \\( k \\) facteurs.</li></ul><p><strong>Prédiction d'une note :</strong> La note que l'utilisateur \\( i \\) donnerait au produit \\( j \\) est prédite par le produit scalaire :</p><p style='text-align: center;'>\\( \\hat{r}_{ij} = u_i^T v_j = \\sum_{l=1}^k u_{il} v_{jl} \\)</p></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
