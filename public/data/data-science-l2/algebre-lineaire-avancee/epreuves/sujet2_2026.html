<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire Avancée - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours et Vrai/Faux",
      "points": "4 pts",
      "enonce": "Pour chacune des affirmations suivantes, dites si elle est vraie ou fausse. Si l'affirmation est vraie, expliquez pourquoi brièvement. Si elle est fausse, donnez un contre-exemple.",
      "questions": [
        {
          "question": "1. Toute norme sur \\( \\mathbb{R}^n \\) est équivalente à la norme euclidienne.",
          "reponse": "Vrai. C'est un résultat fondamental d'équivalence des normes en dimension finie. Toutes les normes sur \\( \\mathbb{R}^n \\) définissent la même topologie et les mêmes suites convergentes."
        },
        {
          "question": "2. Un opérateur linéaire entre deux espaces normés est continu si et seulement s'il est borné.",
          "reponse": "Vrai. C'est une caractérisation fondamentale des applications linéaires continues. La continuité en un point implique la bornitude sur la boule unité, et réciproquement."
        },
        {
          "question": "3. Toute matrice carrée complexe est trigonalisable.",
          "reponse": "Vrai. C'est une conséquence du théorème fondamental de l'algèbre : sur un corps algébriquement clos comme \\( \\mathbb{C} \\), le polynôme caractéristique est scindé, ce qui assure la trigonalisabilité."
        },
        {
          "question": "4. La décomposition en valeurs singulières (SVD) d'une matrice \\( A \\) s'écrit toujours \\( A = U \\Sigma V^T \\) avec \\( U \\) et \\( V \\) orthogonales et \\( \\Sigma \\) diagonale.",
          "reponse": "Vrai. C'est la définition même de la SVD pour une matrice réelle. \\( U \\) et \\( V \\) sont orthogonales, et \\( \\Sigma \\) est diagonale (contenant les valeurs singulières)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Normes, Convergence et Applications Linéaires Continues",
      "points": "6 pts",
      "enonce": "Soit \\( E = \\mathcal{C}([0,1]) \\) l'espace des fonctions continues sur \\( [0,1] \\). On le munit de la norme \\( \\|f\\|_{\\infty} = \\sup_{x \\in [0,1]} |f(x)| \\).",
      "questions": [
        {
          "question": "1. Montrer que \\( (E, \\|\\cdot\\|_{\\infty}) \\) est un espace de Banach.",
          "reponse": "L'espace \\( \\mathcal{C}([0,1]) \\) muni de la norme uniforme est complet. C'est un résultat classique : toute suite de Cauchy de fonctions continues converge uniformément vers une fonction continue."
        },
        {
          "question": "2. On considère l'application linéaire \\( \\Phi : E \\rightarrow E \\) définie par \\( \\Phi(f)(x) = \\int_{0}^{x} f(t) dt \\). Montrer que \\( \\Phi \\) est continue et calculer sa norme d'opérateur.",
          "reponse": "Pour \\( f \\in E \\), on a \\( |\\Phi(f)(x)| \\le \\int_0^x |f(t)| dt \\le \\|f\\|_\\infty \\). Donc \\( \\|\\Phi(f)\\|_\\infty \\le \\|f\\|_\\infty \\), ce qui montre que \\( \\Phi \\) est continue et \\( \\|\\Phi\\| \\le 1 \\). En prenant \\( f \\equiv 1 \\), on obtient \\( \\|\\Phi(1)\\|_\\infty = 1 \\), donc \\( \\|\\Phi\\| = 1 \\)."
        },
        {
          "question": "3. La suite de fonctions \\( (f_n) \\) définie par \\( f_n(x) = x^n \\) est-elle une suite de Cauchy dans \\( (E, \\|\\cdot\\|_{\\infty}) \\) ? Justifier.",
          "reponse": "Non. La suite \\( (x^n) \\) converge simplement vers \\( 0 \\) sur \\( [0,1) \\) et vers \\( 1 \\) en \\( x=1 \\). Elle ne converge pas uniformément vers une fonction continue. En effet, \\( \\|x^n - x^m\\|_\\infty = 1 - \\max(0, (\\frac{n}{m})^{n/(m-n)}) \\) tend vers 1, donc la suite n'est pas de Cauchy dans \\( E \\) pour la norme uniforme."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Diagonalisation et Réduction de Jordan",
      "points": "5 pts",
      "enonce": "Soit la matrice \\( A = \\begin{pmatrix} 2 & 0 & 0 \\\\ 1 & 2 & 0 \\\\ 0 & 1 & 3 \\end{pmatrix} \\).",
      "questions": [
        {
          "question": "1. Calculer le polynôme caractéristique de \\( A \\), puis ses valeurs propres.",
          "reponse": "Le polynôme caractéristique est \\( P_A(\\lambda) = \\det(A - \\lambda I) = (2-\\lambda)^2(3-\\lambda) \\). Les valeurs propres sont \\( \\lambda_1 = 2 \\) (double) et \\( \\lambda_2 = 3 \\) (simple)."
        },
        {
          "question": "2. Déterminer les sous-espaces propres de \\( A \\). La matrice est-elle diagonalisable ?",
          "reponse": "Pour \\( \\lambda = 2 \\), on résout \\( (A - 2I)X = 0 \\), ce qui donne \\( y=0 \\), donc les vecteurs propres sont de la forme \\( (x,0,z) \\). Le sous-espace propre est de dimension 2 (engendré par \\( (1,0,0) \\) et \\( (0,0,1) \\)). Pour \\( \\lambda = 3 \\), on résout \\( (A - 3I)X = 0 \\), ce qui donne \\( x=0, y=0 \\), donc le vecteur propre est \\( (0,0,z) \\). Le sous-espace propre est de dimension 1 (engendré par \\( (0,0,1) \\)). La somme des dimensions des sous-espaces propres est 2 + 1 = 3, donc la matrice est diagonalisable. (La multiplicité algébrique de 2 est 2, et sa multiplicité géométrique est aussi 2)."
        },
        {
          "question": "3. Donner une matrice \\( P \\) de passage et la matrice diagonale \\( D \\) telle que \\( A = P D P^{-1} \\).",
          "reponse": "Prenons \\( P = \\begin{pmatrix} 1 & 0 & 0 \\\\ 0 & 0 & 1 \\\\ 0 & 1 & 0 \\end{pmatrix} \\), alors \\( D = \\begin{pmatrix} 2 & 0 & 0 \\\\ 0 & 3 & 0 \\\\ 0 & 0 & 2 \\end{pmatrix} \\)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : SVD et Applications en Data Science",
      "points": "5 pts",
      "enonce": "On considère la matrice des données \\( A = \\begin{pmatrix} 1 & 0 \\\\ 0 & 1 \\\\ 1 & 1 \\end{pmatrix} \\).",
      "questions": [
        {
          "question": "1. Calculer la SVD de la matrice \\( A \\), c'est-à-dire trouver \\( U \\), \\( \\Sigma \\) et \\( V \\) telles que \\( A = U \\Sigma V^T \\).",
          "reponse": "On calcule \\( A^T A = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} \\). Ses valeurs propres sont 3 et 1, donc les valeurs singulières sont \\( \\sigma_1 = \\sqrt{3} \\) et \\( \\sigma_2 = 1 \\). Les vecteurs propres de \\( A^T A \\) sont \\( v_1 = (1/\\sqrt{2}, 1/\\sqrt{2}) \\) et \\( v_2 = (1/\\sqrt{2}, -1/\\sqrt{2}) \\). On calcule \\( u_1 = \\frac{1}{\\sigma_1} A v_1 = \\frac{1}{\\sqrt{3}} \\begin{pmatrix} 1/\\sqrt{2} \\\\ 1/\\sqrt{2} \\\\ \\sqrt{2} \\end{pmatrix} = \\begin{pmatrix} 1/\\sqrt{6} \\\\ 1/\\sqrt{6} \\\\ 2/\\sqrt{6} \\end{pmatrix} \\) et \\( u_2 = \\frac{1}{\\sigma_2} A v_2 = \\begin{pmatrix} 1/\\sqrt{2} \\\\ -1/\\sqrt{2} \\\\ 0 \\end{pmatrix} \\). On complète \\( u_3 \\) pour obtenir une base orthonormée de \\( \\mathbb{R}^3 \\) : \\( u_3 = \\begin{pmatrix} 1/\\sqrt{3} \\\\ 1/\\sqrt{3} \\\\ -1/\\sqrt{3} \\end{pmatrix} \\). Ainsi, \\( U = \\begin{pmatrix} 1/\\sqrt{6} & 1/\\sqrt{2} & 1/\\sqrt{3} \\\\ 1/\\sqrt{6} & -1/\\sqrt{2} & 1/\\sqrt{3} \\\\ 2/\\sqrt{6} & 0 & -1/\\sqrt{3} \\end{pmatrix} \\), \\( \\Sigma = \\begin{pmatrix} \\sqrt{3} & 0 \\\\ 0 & 1 \\\\ 0 & 0 \\end{pmatrix} \\), et \\( V = \\begin{pmatrix} 1/\\sqrt{2} & 1/\\sqrt{2} \\\\ 1/\\sqrt{2} & -1/\\sqrt{2} \\end{pmatrix} \\)."
        },
        {
          "question": "2. Quel est le rang de la matrice \\( A \\) ?",
          "reponse": "Les deux valeurs singulières sont non nulles, donc le rang de \\( A \\) est 2."
        },
        {
          "question": "3. Donner la pseudo-inverse de Moore-Penrose de \\( A \\).",
          "reponse": "La pseudo-inverse est \\( A^+ = V \\Sigma^+ U^T \\), avec \\( \\Sigma^+ = \\begin{pmatrix} 1/\\sqrt{3} & 0 & 0 \\\\ 0 & 1 & 0 \\end{pmatrix} \\). Après calcul, \\( A^+ = \\begin{pmatrix} 1/2 & -1/2 & 1/2 \\\\ -1/2 & 1/2 & 1/2 \\end{pmatrix} \\)."
        },
        {
          "question": "4. En quoi la SVD est-elle utile pour la réduction de dimensionnalité en Data Science ?",
          "reponse": "La SVD permet de décomposer une matrice de données en composantes principales. En ne gardant que les \\( k \\) plus grandes valeurs singulières et les vecteurs singuliers associés, on obtient une approximation de rang \\( k \\) de la matrice. C'est la base de l'Analyse en Composantes Principales (ACP), qui permet de réduire la dimension des données tout en conservant un maximum de variance."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
