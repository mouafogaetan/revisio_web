<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction) - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Comprendre le cadre de l'Apprentissage par Renforcement",
      "points": "6 pts",
      "enonce": "<p>L'apprentissage par renforcement (RL) est un paradigme fondamental du Machine Learning. <strong>Partie 1 : Concepts fondamentaux</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> (2 pts) L'apprentissage par renforcement se distingue de l'apprentissage supervisé sur plusieurs points. Citez-en trois et justifiez votre réponse en vous appuyant sur des exemples concrets.</p>",
          "reponse": "<p><strong>Éléments de réponse :</strong><br>- En supervisé, on apprend à partir de données étiquetées (input-output), tandis qu'en RL on apprend par interaction avec un environnement via un système de récompenses [citation:1].<br>- Le supervisé cherche à imiter ou prédire une sortie (tâche statique), alors que le RL optimise une séquence de décisions (tâche séquentielle).<br>- Le supervisé dispose d'une 'bonne réponse' pour chaque exemple, alors qu'en RL le retour (récompense) est souvent différé et imparfait.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> (2 pts) Décrivez les composants principaux d'un système RL en les définissant : Agent, Environnement, Action, État et Récompense. Illustrez chacun d'eux par un exemple concret.</p>",
          "reponse": "<p>Exemple : Dans le jeu de Go [citation:1] :<br>- <strong>Agent</strong> : Le programme qui apprend<br>- <strong>Environnement</strong> : Le plateau de jeu<br>- <strong>État</strong> : La position des pièces<br>- <strong>Action</strong> : Le choix d'un coup<br>- <strong>Récompense</strong> : La victoire ou la défaite (+1/-1)</p>"
        },
        {
          "question": "<p><strong>1.3</strong> (2 pts) Expliquez le dilemme exploration/exploitation. Pourquoi ce compromis est-il fondamental en RL ?</p>",
          "reponse": "<p>L'exploration consiste à essayer de nouvelles actions pour découvrir leurs conséquences, tandis que l'exploitation consiste à choisir les actions qui ont donné les meilleures récompenses par le passé [citation:1].<br>Ce dilemme est fondamental car un agent qui n'explore jamais peut rester sur une solution sous-optimale, tandis qu'un agent qui n'exploite jamais ne tire pas profit de ses connaissances.</p>"
        }
      ]
    },
    {
      "titre": "Modélisation d'un problème par un Processus de Décision Markovien (MDP)",
      "points": "7 pts",
      "enonce": "<p>Formalisation d'un problème sous forme de MDP. <strong>Partie 2 : MDP et fonctions de valeur</strong></p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> (2 pts) Formalisez un Processus de Décision Markovien (MDP) en définissant les éléments du tuple $(S, A, P, R, \\gamma)$. Précisez le rôle du facteur d'actualisation $\\gamma$.</p>",
          "reponse": "<p>Un MDP est défini par :<br>- $S$ : L'ensemble des états possibles<br>- $A$ : L'ensemble des actions possibles<br>- $P$ : La fonction de transition $P(s'|s, a)$<br>- $R$ : La fonction de récompense $R(s, a, s')$<br>- $\\gamma \\in [0,1]$ : Le facteur d'actualisation qui détermine l'importance des récompenses futures [citation:1].</p>"
        },
        {
          "question": "<p><strong>2.2</strong> (2 pts) Écrivez l'équation de Bellman pour $V^{\\pi}(s)$ et pour $Q^{\\pi}(s, a)$. Donnez leur interprétation.</p>",
          "reponse": "<p>Équation de Bellman pour $V^{\\pi}$ :<br>$$ V^{\\pi}(s) = \\sum_{a \\in A} \\pi(a|s) \\sum_{s'} P(s'|s, a)[R(s, a, s') + \\gamma V^{\\pi}(s')] $$<br>Équation de Bellman pour $Q^{\\pi}$ :<br>$$ Q^{\\pi}(s, a) = \\sum_{s'} P(s'|s, a)[R(s, a, s') + \\gamma \\sum_{a'} \\pi(a'|s') Q^{\\pi}(s', a')] $$<br>Elles expriment la valeur d'un état (ou d'une paire état-action) comme la somme de la récompense immédiate et de la valeur future actualisée.</p>"
        },
        {
          "question": "<p><strong>2.3</strong> (3 pts) Qu'est-ce qu'une politique $\\pi$ ? Distinguez : politique déterministe vs stochastique, politique markovienne vs dépendante de l'historique. Qu'est-ce qu'une politique optimale ?</p>",
          "reponse": "<p>Une politique $\\pi$ est une stratégie qui définit le comportement de l'agent : l'action à choisir dans chaque état [citation:1].<br><br>Une politique est :<br>- <strong>déterministe</strong> : $\\pi(s) = a$ (une seule action)<br>- <strong>stochastique</strong> : $\\pi(a|s)$ (distribution de probabilité sur les actions)<br>- <strong>markovienne</strong> : dépend uniquement de l'état courant<br>- <strong>dépendante de l'historique</strong> : dépend de toute la séquence passée<br><br>Une politique optimale $\\pi^*$ maximise la valeur espérée (ou le retour) dans tous les états.</p>"
        }
      ]
    },
    {
      "titre": "Résolution par Programmation Dynamique",
      "points": "7 pts",
      "enonce": "<p>Méthodes de résolution exacte des MDP. <strong>Partie 3 : Programmation Dynamique</strong></p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> (2 pts) Décrivez l'algorithme d'itération de politique (Policy Iteration). Quelles sont ses deux étapes principales ? Expliquez leur rôle.</p>",
          "reponse": "<p>L'itération de politique alterne :<br>1. <strong>Évaluation de la politique</strong> : Calcul de $V^{\\pi}(s)$ pour la politique courante en résolvant les équations de Bellman.<br>2. <strong>Amélioration de la politique</strong> : Construction d'une politique gloutonne $\\pi'(s) = \\arg\\max_a Q^{\\pi}(s, a)$.<br>On répète jusqu'à convergence, c'est-à-dire quand $\\pi' = \\pi$.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> (2 pts) Décrivez l'algorithme d'itération de valeur (Value Iteration). Quelle équation utilise-t-il ? En quoi diffère-t-il de l'itération de politique ?</p>",
          "reponse": "<p>L'itération de valeur utilise l'équation de Bellman optimale :<br>$$ V_{k+1}(s) = \\max_a \\sum_{s'} P(s'|s, a)[R(s, a, s') + \\gamma V_k(s')] $$<br>Contrairement à l'itération de politique, elle combine évaluation et amélioration en une seule étape.<br>L'itération de valeur est plus simple à implémenter mais peut nécessiter plus d'itérations.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> (3 pts) Un problème de gestion de stock : Un entrepôt peut contenir au maximum 3 articles. La demande suit une distribution connue : 0 article avec probabilité 0.3, 1 article avec probabilité 0.4, 2 articles avec probabilité 0.3. Chaque jour, on peut commander 0, 1 ou 2 articles (coût de commande de 5€ par article). Vendre un article rapporte 10€. Le stock invendu a un coût de possession de 2€ par article. Formalisez ce problème en MDP. Calculez la fonction de valeur pour l'état $s=1$ en supposant une politique 'commander 1 article si stock < 2' et $\\gamma=0.9$.</p>",
          "reponse": "<p>Formalisation du MDP :<br>- États $S = {0, 1, 2, 3}$<br>- Actions $A = {0, 1, 2}$ (quantité commandée)<br>- Transition : $s' = \\min(3, s + a - d)$ avec $d \\sim P(d)$<br>- Récompense : $R = 10 \\times \\min(s, d) - 5a - 2 \\times (s + a - d)$<br><br>Pour $s=1$, avec $\\pi(1)=1$ (commander 1) :<br>$$ V(1) = \\sum_d P(d)[10 \\times \\min(1,d) - 5 - 2 \\times \\max(0,1+1-d) + \\gamma V(\\min(3,2-d))] $$<br>$V(1) = 0.3[-5 + 0.9V(1)] + 0.4[10 - 5 + 0.9V(1)] + 0.3[20 - 5 - 2 + 0.9V(0)]$<br>$V(1) = 0.3[-5 + 0.9V(1)] + 0.4[5 + 0.9V(1)] + 0.3[13 + 0.9V(0)]$<br>Ce système se résout avec les autres équations.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
