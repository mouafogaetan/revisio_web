<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction) - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Évaluation d'une Politique et Équation de Bellman",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>Considérez un environnement simple avec 3 états (<strong>S = {s1, s2, s3}</strong>) et 2 actions possibles (<strong>A = {a1, a2}</strong>). Le facteur d'actualisation est \\(\\gamma = 0.9\\).</p><p>Les fonctions de transition et de récompense sont données par :</p><ul><li>De <strong>s1</strong> avec <strong>a1</strong> : on va en <strong>s2</strong> avec une récompense de <strong>+5</strong>.</li><li>De <strong>s1</strong> avec <strong>a2</strong> : on va en <strong>s3</strong> avec une récompense de <strong>+1</strong>.</li><li>De <strong>s2</strong> avec <strong>a1</strong> : on va en <strong>s3</strong> avec une récompense de <strong>+2</strong>.</li><li>De <strong>s2</strong> avec <strong>a2</strong> : on reste en <strong>s2</strong> avec une récompense de <strong>0</strong>.</li><li>De <strong>s3</strong> avec <strong>a1</strong> : on va en <strong>s1</strong> avec une récompense de <strong>+10</strong>.</li><li>De <strong>s3</strong> avec <strong>a2</strong> : on reste en <strong>s3</strong> avec une récompense de <strong>-1</strong>.</li></ul><p>La politique \\(\\pi\\) considérée est la suivante : \\(\\pi(s1) = a1\\), \\(\\pi(s2) = a2\\), \\(\\pi(s3) = a1\\).</p></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Écrivez l'équation de Bellman pour la fonction de valeur d'état \\(V^{\\pi}(s)\\) pour chaque état, en utilisant la politique \\(\\pi\\). <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<p>L'équation de Bellman pour \\(V^{\\pi}(s)\\) est : \\( V^{\\pi}(s) = \\sum_{a} \\pi(a|s) \\sum_{s'} P(s'|s,a) [ R(s,a,s') + \\gamma V^{\\pi}(s') ] \\).<br><br>En appliquant la politique déterministe \\(\\pi\\) :</p><ul><li>\\(V^{\\pi}(s1) = R(s1,a1,s2) + \\gamma V^{\\pi}(s2) = 5 + 0.9 V^{\\pi}(s2)\\)</li><li>\\(V^{\\pi}(s2) = R(s2,a2,s2) + \\gamma V^{\\pi}(s2) = 0 + 0.9 V^{\\pi}(s2) \\Rightarrow V^{\\pi}(s2) = 0\\)</li><li>\\(V^{\\pi}(s3) = R(s3,a1,s1) + \\gamma V^{\\pi}(s1) = 10 + 0.9 V^{\\pi}(s1)\\)</li></ul>"
        },
        {
          "question": "<strong>2.</strong> Résolvez le système d'équations pour trouver les valeurs de \\(V^{\\pi}(s1)\\), \\(V^{\\pi}(s2)\\), et \\(V^{\\pi}(s3)\\). <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Analyser</span>",
          "reponse": "<p>En résolvant le système :</p><ul><li>De \\(V^{\\pi}(s2) = 0.9 V^{\\pi}(s2)\\), on déduit que \\(V^{\\pi}(s2) = 0\\).</li><li>En substituant dans l'équation pour s1 : \\(V^{\\pi}(s1) = 5 + 0.9 \\times 0 = 5\\).</li><li>En substituant dans l'équation pour s3 : \\(V^{\\pi}(s3) = 10 + 0.9 \\times 5 = 14.5\\).</li></ul><p><strong>Résultat :</strong> \\(V^{\\pi}(s1) = 5\\), \\(V^{\\pi}(s2) = 0\\), \\(V^{\\pi}(s3) = 14.5\\).</p>"
        },
        {
          "question": "<strong>3.</strong> Quelle serait la politique gloutonne (greedy) dérivée de ces valeurs ? <span style='background: #e8f5e9; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Évaluer</span>",
          "reponse": "<p>Pour dériver la politique gloutonne, on choisit l'action qui maximise \\(Q(s,a) = \\sum_{s'} P(s'|s,a) [ R(s,a,s') + \\gamma V(s') ]\\).</p><ul><li>Pour s1 : Q(s1,a1) = 5 + 0.9*0 = 5 ; Q(s1,a2) = 1 + 0.9*14.5 = 14.05. La politique gloutonne choisit donc a2.</li><li>Pour s2 : Q(s2,a1) = 2 + 0.9*14.5 = 15.05 ; Q(s2,a2) = 0 + 0.9*0 = 0. La politique gloutonne choisit donc a1.</li><li>Pour s3 : Q(s3,a1) = 10 + 0.9*5 = 14.5 ; Q(s3,a2) = -1 + 0.9*14.5 = 12.05. La politique gloutonne choisit donc a1.</li></ul><p><strong>Politique gloutonne :</strong> \\(\\pi'(s1) = a2\\), \\(\\pi'(s2) = a1\\), \\(\\pi'(s3) = a1\\).</p>"
        }
      ]
    },
    {
      "titre": "Itération de Politique et de Valeur",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>On considère un MDP avec deux états <strong>S = {A, B}</strong> et deux actions <strong>A = {L, R}</strong>, avec \\(\\gamma = 1\\).</p><p>Les transitions sont déterministes :</p><ul><li>De <strong>A</strong> avec <strong>L</strong> : on va en <strong>B</strong> avec récompense <strong>+1</strong>.</li><li>De <strong>A</strong> avec <strong>R</strong> : on va en <strong>A</strong> avec récompense <strong>-1</strong>.</li><li>De <strong>B</strong> avec <strong>L</strong> : on va en <strong>A</strong> avec récompense <strong>+2</strong>.</li><li>De <strong>B</strong> avec <strong>R</strong> : on va en <strong>B</strong> avec récompense <strong>0</strong>.</li></ul><p>La politique initiale est \\(\\pi_0(A) = L\\) et \\(\\pi_0(B) = R\\).</p></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Calculez les valeurs \\(V^{\\pi_0}(A)\\) et \\(V^{\\pi_0}(B)\\) par évaluation de la politique. <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<p>Avec \\(\\pi_0(A) = L\\) et \\(\\pi_0(B) = R\\) :</p><ul><li>\\(V(A) = R(A,L,B) + \\gamma V(B) = 1 + V(B)\\)</li><li>\\(V(B) = R(B,R,B) + \\gamma V(B) = 0 + V(B) \\Rightarrow V(B) = 0\\)</li><li>Donc \\(V(A) = 1 + 0 = 1\\).</li></ul><p><strong>Résultat :</strong> \\(V^{\\pi_0}(A) = 1\\), \\(V^{\\pi_0}(B) = 0\\).</p>"
        },
        {
          "question": "<strong>2.</strong> Effectuez une étape d'amélioration de la politique pour obtenir \\(\\pi_1\\). <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Analyser</span>",
          "reponse": "<p>On calcule \\(Q(s,a)\\) pour chaque état :</p><ul><li>Pour A : Q(A,L) = 1 + V(B) = 1 ; Q(A,R) = -1 + V(A) = 0. La meilleure action est L.</li><li>Pour B : Q(B,L) = 2 + V(A) = 3 ; Q(B,R) = 0 + V(B) = 0. La meilleure action est L.</li></ul><p><strong>Nouvelle politique :</strong> \\(\\pi_1(A) = L\\), \\(\\pi_1(B) = L\\).</p>"
        },
        {
          "question": "<strong>3.</strong> Si on utilisait l'itération de valeur, quelle serait la première mise à jour de \\(V(A)\\) et \\(V(B)\\) à partir de \\(V_0(A)=V_0(B)=0\\) ? <span style='background: #e8f5e9; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Appliquer</span>",
          "reponse": "<p>L'équation de Bellman optimale est : \\(V_{k+1}(s) = \\max_a \\sum_{s'} P(s'|s,a) [ R(s,a,s') + \\gamma V_k(s') ]\\).</p><p>Avec \\(V_0(A)=V_0(B)=0\\) :</p><ul><li>\\(V_1(A) = \\max( Q(A,L), Q(A,R) ) = \\max( 1+0, -1+0 ) = 1\\)</li><li>\\(V_1(B) = \\max( Q(B,L), Q(B,R) ) = \\max( 2+0, 0+0 ) = 2\\)</li></ul><p><strong>Résultat :</strong> \\(V_1(A) = 1\\), \\(V_1(B) = 2\\).</p>"
        }
      ]
    },
    {
      "titre": "Comparaison SARSA vs Q-Learning",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6;'><p>Un agent se trouve dans un environnement <strong>GridWorld 2×2</strong> avec les états <strong>s1, s2, s3, s4</strong>. L'état <strong>s4</strong> est un état terminal. Les actions possibles sont <strong>Haut, Bas, Gauche, Droite</strong>.</p><p>L'agent suit une politique \\(\\epsilon\\)-greedy avec \\(\\epsilon = 0.1\\) et \\(\\gamma = 0.9\\). Au cours d'un épisode, il effectue la séquence suivante :</p><p><strong>s1</strong> → (action Droite, récompense 0) → <strong>s2</strong> → (action Bas, récompense 0) → <strong>s3</strong> → (action Droite, récompense +10) → <strong>s4</strong> (état terminal).</p></div>",
      "questions": [
        {
          "question": "<strong>1.</strong> Expliquez comment SARSA mettrait à jour la valeur Q de la transition <strong>(s2, Bas)</strong>. <span style='background: #e3f2fd; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>SARSA est une méthode <strong>on-policy</strong> : la mise à jour utilise la prochaine action effectivement choisie par la politique.</p><p>La transition cible est \\((s_2, a_2)\\), et la prochaine transition est \\((s_3, a_3)\\) (Droite).</p><p>La mise à jour SARSA est : <br>\\(Q(s_2, a_2) \\leftarrow Q(s_2, a_2) + \\alpha [ r_2 + \\gamma Q(s_3, a_3) - Q(s_2, a_2) ]\\)<br>avec \\(r_2 = 0\\), \\(Q(s_3, a_3) = Q(s_3, \\text{Droite})\\).</p>"
        },
        {
          "question": "<strong>2.</strong> Expliquez comment Q-Learning mettrait à jour la valeur Q de la transition <strong>(s2, Bas)</strong>. <span style='background: #fff3e0; padding: 2px 8px; border-radius: 4px;'>🔍 Taxonomie de Bloom : Comprendre</span>",
          "reponse": "<p>Q-Learning est une méthode <strong>off-policy</strong> : la mise à jour utilise la meilleure action possible dans le prochain état, indépendamment de la politique suivie.</p><p>La mise à jour Q-Learning est : <br>\\(Q(s_2, a_2) \\leftarrow Q(s_2, a_2) + \\alpha [ r_2 + \\gamma \\max_{a'} Q(s_3, a') - Q(s_2, a_2) ]\\)<br>avec \\(r_2 = 0\\), \\(\\max_{a'} Q(s_3, a')\\) étant la valeur maximale parmi toutes les actions possibles depuis \\(s_3\\).</p>"
        },
        {

          "reponse": "<p><strong>Différence :</strong> SARSA utilise la prochaine action de la politique suivie (on-policy) tandis que Q-Learning utilise la meilleure action possible (off-policy). Q-Learning est plus optimiste et peut apprendre la politique optimale même en explorant.</p><p><strong>Préférence pour Q-Learning :</strong> On préfère Q-Learning lorsque l'exploration est suffisante et qu'on veut apprendre la politique optimale sans se soucier de la politique de comportement. C'est le cas dans la plupart des problèmes où l'exploration est contrôlée et où on cherche la solution optimale.</p>"

    {

          "reponse": "<p><strong>Réponse : B</strong></p><p>L'apprentissage par renforcement se distingue par l'interaction active de l'agent avec son environnement et l'apprentissage par essai-erreur à partir des récompenses reçues [citation:6][citation:15].</p>"

          "reponse": "<p><strong>Réponse : B</strong></p><p>La propriété de Markov est fondamentale en RL et signifie que l'état futur ne dépend que de l'état et de l'action présents, et non de l'historique complet [citation:6].</p>"

          "reponse": "<p><strong>Réponse : C</strong></p><p>Le facteur d'actualisation \\(\\gamma\\) (0 ≤ γ ≤ 1) permet de peser l'importance des récompenses futures par rapport aux récompenses immédiates. Plus γ est proche de 1, plus les récompenses futures sont importantes.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
