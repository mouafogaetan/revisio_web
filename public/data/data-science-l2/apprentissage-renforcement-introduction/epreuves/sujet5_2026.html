<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction)",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements du Reinforcement Learning",
      "points": "8 pts",
      "enonce": "<p>On considère un agent qui doit apprendre à jouer à un jeu de société simple. L'agent interagit avec l'environnement en effectuant des actions et en recevant des récompenses.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Définissez l'apprentissage par renforcement et distinguez-le de l'apprentissage supervisé.</p>",
          "reponse": "<p><strong>Apprentissage par renforcement (RL) :</strong> Un agent apprend à prendre des décisions en interagissant avec un environnement, en recevant des récompenses ou des pénalités pour ses actions. L'objectif est de maximiser la récompense cumulée sur le long terme.</p><p><strong>Différence avec l'apprentissage supervisé :</strong> En apprentissage supervisé, on dispose d'un ensemble de données étiquetées (entrées-sorties) et on apprend une fonction de mapping. L'agent reçoit un feedback correctif direct (label) pour chaque exemple. En RL, l'agent n'a pas de labels ; il apprend par essais-erreurs et reçoit un signal de récompense qui peut être différé dans le temps. L'agent doit explorer pour découvrir les bonnes actions.</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Identifiez et décrivez les composants d'un système RL en les reliant au contexte du jeu de société.</p>",
          "reponse": "<ul><li><strong>Agent :</strong> Le joueur qui apprend à jouer au jeu.</li><li><strong>Environnement :</strong> Le jeu de société lui-même (règles, plateau, adversaires).</li><li><strong>État (s) :</strong> La configuration du plateau, la position des pièces, le score actuel.</li><li><strong>Action (a) :</strong> Un mouvement possible dans le jeu (ex: déplacer une pièce d'une case à une autre).</li><li><strong>Récompense (r) :</strong> Un retour positif (+1) si l'agent gagne une partie, négatif (-1) s'il perd, ou nul (0) pour un match nul. Des récompenses intermédiaires peuvent guider l'apprentissage (ex: capturer une pièce adverse donne +0.1).</li></ul>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Définissez formellement un Processus de Décision Markovien (MDP).</p>",
          "reponse": "<p>Un MDP est défini par un tuple \\( (S, A, P, R, \\gamma) \\) où :</p><ul><li><strong>S :</strong> L'ensemble des états de l'environnement.</li><li><strong>A :</strong> L'ensemble des actions que peut effectuer l'agent.</li><li><strong>P :</strong> La fonction de transition \\( P(s'|s, a) \\) qui donne la probabilité de passer en \\( s' \\) après avoir effectué \\( a \\) en \\( s \\).</li><li><strong>R :</strong> La fonction de récompense \\( R(s, a, s') \\).</li><li><strong>\\(\\gamma\\) :</strong> Le facteur d'actualisation \\( \\gamma \\in [0, 1] \\) qui détermine l'importance des récompenses futures.</li></ul>"
        },
        {
          "question": "<p><strong>4) (2 pts)</strong> Expliquez la propriété de Markov et pourquoi elle est importante en RL.</p>",
          "reponse": "<p>La propriété de Markov stipule que l'état futur ne dépend que de l'état présent et non de l'historique des états précédents :</p><div class='math-block'><div class='math'>$$ P(s_{t+1} | s_t, a_t) = P(s_{t+1} | s_1, a_1, ..., s_t, a_t) $$</div></div><p>Cette propriété est cruciale car elle permet de simplifier le problème de prise de décision. L'agent n'a pas besoin de mémoriser tout le passé ; l'état présent résume toute l'information pertinente. Cela rend les problèmes de RL traitables mathématiquement et permet l'utilisation des équations de Bellman.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Programmation Dynamique",
      "points": "6 pts",
      "enonce": "<p>On considère un MDP avec 3 états \\( S = \\{A, B, C\\} \\), 2 actions \\( A = \\{0, 1\\} \\), un facteur d'actualisation \\( \\gamma = 0.9 \\). La politique \\( \\pi \\) est définie par \\( \\pi(A) = 0, \\pi(B) = 1, \\pi(C) = 0 \\). Les fonctions de transition et de récompense sont données.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Écrivez l'équation de Bellman pour l'évaluation de la politique \\( \\pi \\).</p>",
          "reponse": "<p>L'équation de Bellman pour une politique \\( \\pi \\) est :</p><div class='math-block'><div class='math'>$$ V^\\pi(s) = \\sum_{a} \\pi(a|s) \\sum_{s'} P(s'|s,a) [R(s,a,s') + \\gamma V^\\pi(s')] $$</div></div><p>Pour une politique déterministe, cela se simplifie en :</p><div class='math-block'><div class='math'>$$ V^\\pi(s) = \\sum_{s'} P(s'|s,\\pi(s)) [R(s,\\pi(s),s') + \\gamma V^\\pi(s')] $$</div></div>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Expliquez le principe de l'itération de politique. Quelles sont les deux étapes principales de cet algorithme ?</p>",
          "reponse": "<p>L'itération de politique est un algorithme qui alterne entre deux phases :</p><ol><li><strong>Évaluation de la politique :</strong> On calcule la fonction de valeur \\( V^\\pi(s) \\) pour la politique courante \\( \\pi \\) en utilisant l'équation de Bellman de manière itérative.</li><li><strong>Amélioration de la politique :</strong> On améliore la politique en choisissant pour chaque état l'action qui maximise \\( Q^\\pi(s,a) \\) :</li></ol><div class='math-block'><div class='math'>$$ \\pi'(s) = \\arg\\max_a Q^\\pi(s,a) $$</div></div><p>L'algorithme converge vers la politique optimale lorsque \\( \\pi' = \\pi \\).</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Quelle est la différence entre l'itération de politique et l'itération de valeur ? Dans quel cas l'itération de valeur est-elle préférable ?</p>",
          "reponse": "<p><strong>Différence :</strong> L'itération de valeur (value iteration) combine les deux étapes de l'itération de politique en une seule mise à jour. Elle utilise directement l'équation de Bellman optimale :</p><div class='math-block'><div class='math'>$$ V_{k+1}(s) = \\max_a \\sum_{s'} P(s'|s,a) [R(s,a,s') + \\gamma V_k(s')] $$</div></div><p>L'itération de valeur n'a pas besoin d'attendre la convergence complète de \\( V^\\pi \\) avant d'améliorer la politique.</p><p><strong>Quand l'utiliser :</strong> L'itération de valeur est souvent préférée quand le nombre d'itérations nécessaires est limité ou quand la convergence de l'évaluation de politique est lente. Elle est plus simple à implémenter car elle ne nécessite pas de gérer explicitement une politique \\( \\pi \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Temporal Difference Learning",
      "points": "6 pts",
      "enonce": "<p>Un agent interagit avec un environnement et doit apprendre une politique optimale. On considère les algorithmes SARSA et Q-Learning.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Écrivez les équations de mise à jour pour SARSA et Q-Learning.</p>",
          "reponse": "<p><strong>SARSA (On-policy) :</strong></p><div class='math-block'><div class='math'>$$ Q(s_t, a_t) \\leftarrow Q(s_t, a_t) + \\alpha [R_{t+1} + \\gamma Q(s_{t+1}, a_{t+1}) - Q(s_t, a_t)] $$</div></div><p><strong>Q-Learning (Off-policy) :</strong></p><div class='math-block'><div class='math'>$$ Q(s_t, a_t) \\leftarrow Q(s_t, a_t) + \\alpha [R_{t+1} + \\gamma \\max_{a'} Q(s_{t+1}, a') - Q(s_t, a_t)] $$</div></div>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Expliquez la différence fondamentale entre SARSA et Q-Learning en termes de politique d'apprentissage.</p>",
          "reponse": "<p>SARSA est un algorithme <strong>on-policy</strong> : il apprend la valeur Q de la politique qu'il suit effectivement. La cible utilise \\( Q(s_{t+1}, a_{t+1}) \\) où \\( a_{t+1} \\) est l'action qui sera réellement choisie (avec exploration).</p><p>Q-Learning est un algorithme <strong>off-policy</strong> : il apprend la valeur Q de la politique optimale, indépendamment de la politique suivie. La cible utilise \\( \\max_{a'} Q(s_{t+1}, a') \\), ce qui correspond à l'action optimale, pas nécessairement celle qui sera choisie.</p><p><strong>Conséquence :</strong> Q-Learning est plus agressif (il tend vers la politique optimale), tandis que SARSA est plus prudent (il tient compte de l'exploration).</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Dans quel contexte recommanderiez-vous d'utiliser SARSA plutôt que Q-Learning ? Justifiez votre réponse.</p>",
          "reponse": "<p>SARSA est recommandé dans les environnements où l'exploration peut être dangereuse ou coûteuse. Par exemple :</p><ul><li>Robotique où une mauvaise action peut endommager le robot ou son environnement.</li><li>Systèmes de contrôle où des actions risquées ont des conséquences graves.</li><li>Jeux avec des adversaires où l'agent doit être prudent.</li></ul><p>SARSA apprend une politique qui intègre le coût de l'exploration, ce qui le rend plus sûr.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Approches Avancées et Applications",
      "points": "5 pts",
      "enonce": "<p>L'apprentissage par renforcement est utilisé dans de nombreux domaines de la Data Science. On s'intéresse à l'optimisation des hyperparamètres et aux systèmes de recommandation.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Expliquez comment l'optimisation des hyperparamètres peut être modélisée comme un problème d'apprentissage par renforcement.</p>",
          "reponse": "<p>L'optimisation des hyperparamètres peut être modélisée comme un MDP où :</p><ul><li><strong>Agent :</strong> L'algorithme d'optimisation qui choisit les hyperparamètres.</li><li><strong>État :</strong> Les hyperparamètres déjà testés et leurs performances.</li><li><strong>Action :</strong> Le choix d'un nouvel ensemble d'hyperparamètres.</li><li><strong>Récompense :</strong> La performance du modèle sur un ensemble de validation.</li><li><strong>Objectif :</strong> Maximiser la performance cumulative ou finale.</li></ul><p>Cette approche est flexible et peut intégrer des contraintes complexes.</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Décrivez comment on peut utiliser Q-Learning pour un système de recommandation.</p>",
          "reponse": "<p>Dans un système de recommandation par RL :</p><ul><li><strong>État :</strong> Le profil de l'utilisateur (historique des interactions, préférences).</li><li><strong>Action :</strong> Recommander un article (un film, un produit, une vidéo).</li><li><strong>Récompense :</strong> Engagement de l'utilisateur (clic, like, temps passé).</li></ul><p>Q-Learning est particulièrement adapté car il est off-policy : on peut apprendre à partir de données historiques d'interactions, même si elles ont été générées par une politique différente. La mise à jour Q-Learning permet d'optimiser la recommandation pour maximiser l'engagement à long terme.</p>"
        },
        {
          "question": "<p><strong>3) (1 pt)</strong> Citez deux autres domaines d'application de l'apprentissage par renforcement dans le contexte de la Data Science.</p>",
          "reponse": "<ul><li><strong>A/B Testing et Bandits Manchots :</strong> Pour optimiser en temps réel la sélection de versions d'une page web ou d'une campagne publicitaire.</li><li><strong>Gestion de Portefeuille :</strong> Pour apprendre une stratégie d'investissement qui maximise le rendement ajusté au risque.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
