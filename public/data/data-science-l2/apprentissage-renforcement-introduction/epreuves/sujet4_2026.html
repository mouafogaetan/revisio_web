<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction) - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Évaluation Séquentielle N°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours et Concepts Fondamentaux",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.05em; line-height: 1.6; color: #333;'>Cet exercice vise à évaluer votre compréhension des concepts clés abordés depuis le début du semestre. Répondez de manière précise et concise aux questions suivantes.</div>",
      "questions": [
        {
          "question": "<div><strong>1.1)</strong> Définissez l'<strong>apprentissage par renforcement (RL)</strong> et distinguez-le de l'apprentissage supervisé et non supervisé. [citation:1]</div>",
          "reponse": "<div>L'apprentissage par renforcement est une méthode d'apprentissage automatique où un <strong>agent</strong> apprend en <strong>expérimentant</strong> dans un environnement inconnu, en utilisant ses interactions pour <strong>maximiser une récompense cumulée</strong> [citation:1].<br><ul><li><strong>Supervisé :</strong> Apprentissage à partir d'exemples étiquetés (entrées-sorties connues).</li><li><strong>Non supervisé :</strong> Apprentissage à partir de données non étiquetées pour trouver des structures cachées.</li><li><strong>Renforcement :</strong> Apprentissage par <strong>essais-erreurs</strong> avec des récompenses ou punitions pour guider l'apprentissage.</li></ul></div>"
        },
        {
          "question": "<div><strong>1.2)</strong> Dans un Processus de Décision Markovien (MDP), quels sont les cinq composants identifiés par le tuple <S, A, P, R, γ> ? Expliquez brièvement le rôle de chacun.</div>",
          "reponse": "<div>Un MDP est formalisé par le tuple :<br><ul><li><strong>S :</strong> L'ensemble des <strong>états</strong> possibles de l'environnement.</li><li><strong>A :</strong> L'ensemble des <strong>actions</strong> que l'agent peut entreprendre.</li><li><strong>P :</strong> La <strong>probabilité de transition</strong> d'un état à un autre suite à une action : \(P(s'|s, a)\).</li><li><strong>R :</strong> La <strong>fonction de récompense</strong> : \(R(s, a)\) ou \(R(s, a, s')\), qui donne la récompense immédiate.</li><li><strong>γ :</strong> Le <strong>facteur d'actualisation</strong> (\(0 ≤ γ ≤ 1\)) qui pondère l'importance des récompenses futures [citation:1].</li></ul></div>"
        },
        {
          "question": "<div><strong>1.3)</strong> Expliquez ce qu'est la <strong>propriété de Markov</strong> et pourquoi elle est importante en apprentissage par renforcement. Donnez un exemple d'environnement qui respecte cette propriété.</div>",
          "reponse": "<div>La <strong>propriété de Markov</strong> stipule que l'état futur de l'environnement dépend <strong>uniquement de l'état actuel</strong> et de l'action choisie, <strong>et non de l'historique</strong> des états ou actions passés. Cela simplifie le problème car l'agent n'a pas besoin de mémoriser tout le passé. Le jeu d'échecs est un exemple classique : pour décider du meilleur coup, seul l'état actuel du plateau est nécessaire, pas la séquence de coups précédents.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Programmation Dynamique et Équations de Bellman",
      "points": "8 pts",
      "enonce": "<div style='font-size: 1.05em; line-height: 1.6; color: #333;'>Les équations de Bellman sont le cœur de la programmation dynamique. Cet exercice vous permet de les utiliser pour résoudre un petit MDP.</div>",
      "questions": [
        {
          "question": "<div><strong>2.1)</strong> Soit un MDP simple avec deux états (A et B) et deux actions (Gauche et Droite). La politique est fixée. On donne :<br>V(A) = 0, V(B) = 5, γ = 0.9.<br>Si l'action 'Droite' depuis l'état A mène à l'état B avec une probabilité de 0.8 et à l'état A avec une probabilité de 0.2, avec une récompense R(A, Droite) = 2, <strong>calculez Q(A, Droite)</strong>.</div>",
          "reponse": "<div>La fonction de valeur d'action Q est définie par : \(Q^{\\pi}(s, a) = R(s, a) + \\gamma \\sum_{s'} P(s'|s, a) V^{\\pi}(s')\)<br><br>Donc :<br>\(Q(A, Droite) = 2 + 0.9 \\times [0.8 \\times V(B) + 0.2 \\times V(A)]\)<br>\(Q(A, Droite) = 2 + 0.9 \\times [0.8 \\times 5 + 0.2 \\times 0]\)<br>\(Q(A, Droite) = 2 + 0.9 \\times 4 = 2 + 3.6 = <strong>5.6</strong>\)</div>"
        },
        {
          "question": "<div><strong>2.2)</strong> Comparez l'<strong>itération de politique</strong> et l'<strong>itération de valeur</strong>. Quelle est la principale différence dans leur approche et leur convergence ? [citation:1]</div>",
          "reponse": "<div><ul><li><strong>Itération de politique :</strong> Alterne entre une phase d'<strong>évaluation complète</strong> de la politique courante (calcul de V) et une phase d'<strong>amélioration</strong> (politique gloutonne). Elle converge en un nombre fini d'itérations (au plus |A|<sup>|S|</sup> politiques).</li><li><strong>Itération de valeur :</strong> Met à jour V en utilisant l'équation de Bellman <strong>optimale</strong> (max sur les actions) à chaque itération, sans attendre la convergence de V. Elle converge <strong>asymptotiquement</strong> vers V*.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodes Sans Modèle (Monte Carlo et TD)",
      "points": "8 pts",
      "enonce": "<div style='font-size: 1.05em; line-height: 1.6; color: #333;'>Les méthodes sans modèle permettent à un agent d'apprendre par l'expérience directe. Q-Learning et SARSA sont deux algorithmes populaires. [citation:2]</div>",
      "questions": [
        {
          "question": "<div><strong>3.1)</strong> Un agent utilise Q-Learning dans un environnement. Expliquez pourquoi Q-Learning est considéré comme un algorithme <strong>off-policy</strong>, et précisez comment la mise à jour est effectuée.</div>",
          "reponse": "<div>Q-Learning est <strong>off-policy</strong> car la <strong>politique de comportement</strong> (celle qui génère les actions pour explorer, souvent ε-greedy) est différente de la <strong>politique cible</strong> (la politique optimale, gloutonne, que l'on apprend). La mise à jour utilise : <br>\(Q(S_t, A_t) \\leftarrow Q(S_t, A_t) + \\alpha [R_{t+1} + \\gamma \\max_a Q(S_{t+1}, a) - Q(S_t, A_t)]\)<br>Le terme \(\\max_a Q(S_{t+1}, a)\) correspond à la politique cible (gloutonne). [citation:1]</div>"
        },
        {
          "question": "<div><strong>3.2)</strong> Quelle est la principale différence dans la mise à jour entre <strong>Q-Learning</strong> et <strong>SARSA</strong> ? Dans quel contexte choisiriez-vous l'un plutôt que l'autre ?</div>",
          "reponse": "<div>La différence est dans la <strong>cible TD</strong> :<br><ul><li><strong>Q-Learning (off-policy) :</strong> \(R_{t+1} + \\gamma \\max_a Q(S_{t+1}, a)\). Apprend la politique optimale de manière directe et audacieuse.</li><li><strong>SARSA (on-policy) :</strong> \(R_{t+1} + \\gamma Q(S_{t+1}, A_{t+1})\). Prend en compte l'action réellement choisie par la politique de comportement. SARSA est plus prudent et mieux adapté si l'exploration est risquée (ex: robotique).</li></ul></div>"
        },
        {
          "question": "<div><strong>3.3)</strong> Expliquez l'utilisation de la stratégie <strong>ε-greedy</strong> dans le cadre du Q-Learning. [citation:1]</div>",
          "reponse": "<div>La stratégie ε-greedy est utilisée pour équilibrer exploration et exploitation :<br><ul><li>Avec une <strong>probabilité \(1-\\varepsilon\)</strong>, l'agent choisit l'action qui maximise la valeur Q (exploitation).</li><li>Avec une <strong>probabilité \(\\varepsilon\)</strong>, il choisit une action aléatoire (exploration). [citation:1]</li></ul>Cette stratégie garantit que l'agent continue d'explorer même après avoir trouvé une bonne politique, ce qui est crucial pour converger vers la politique optimale.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème du Bandit Manchot",
      "points": "8 pts",
      "enonce": "<div style='font-size: 1.05em; line-height: 1.6; color: #333;'>Cet exercice est inspiré des problèmes de bandit manchot, une application classique du dilemme exploration/exploitation. [citation:2]<br>On considère 4 bandits (bras) avec des probabilités de gain inconnues. L'agent a effectué 10 tirages et a obtenu les récompenses suivantes (1 = gain, 0 = perte).</div>",
      "questions": [
        {
          "question": "<div><strong>4.1)</strong> Le tableau ci-dessous présente la séquence des bras choisis et les récompenses obtenues. Calculez l'estimation de la récompense moyenne \( \\hat{\\mu}_i \) pour chaque bras \( i \). [citation:2]</div>",
          "reponse": "<div>On calcule la moyenne empirique pour chaque bras :<br><ul><li>Bras 1 : Choix aux t=1 (1), t=3 (1), t=8 (0). Total = 2/3 ≈ <strong>0.67</strong></li><li>Bras 2 : Choix aux t=2 (1), t=5 (0), t=9 (0). Total = 1/3 ≈ <strong>0.33</strong></li><li>Bras 3 : Choix aux t=6 (1), t=7 (1). Total = 2/2 = <strong>1.0</strong></li><li>Bras 4 : Choix aux t=4 (0), t=10 (1). Total = 1/2 = <strong>0.5</strong></li></ul></div>"
        },
        {
          "question": "<div><strong>4.2)</strong> Si l'agent utilise une politique <strong>gloutonne</strong> (greedy) pour choisir la prochaine action, quel bras sera choisi ? Justifiez votre réponse. [citation:2]</div>",
          "reponse": "<div>Une politique gloutonne choisit le bras avec la <strong>meilleure estimation de récompense</strong> \( \\hat{\\mu}_i \).<br>Parmi les estimations calculées précédemment :<br>\( \\hat{\\mu}_3 = 1.0\) est la plus élevée.<br>L'agent choisira donc le <strong>Bras 3</strong>.</div>"
        },
        {
          "question": "<div><strong>4.3)</strong> On apprend que les vraies probabilités de gain sont \(p_1 = 0.2, p_2 = 0.7, p_3 = 0.5, p_4 = 0.9\). Le choix glouton est-il optimal ? Justifiez votre réponse. [citation:2]</div>",
          "reponse": "<div>Le choix glouton (Bras 3 avec \(p=0.5\)) n'est <strong>pas optimal</strong>.<br>Le bras optimal est celui avec la plus grande probabilité de gain, soit le <strong>Bras 4 avec \(p_4 = 0.9\)</strong>. L'agent a choisi le Bras 3 car ses estimations initiales étaient biaisées par le hasard, illustrant le besoin d'exploration pour découvrir le vrai meilleur bras.</div>"
        },
        {
          "question": "<div><strong>4.4)</strong> Proposez une stratégie d'exploration qui pourrait aider l'agent à trouver le vrai bras optimal à long terme, même si elle n'est pas gloutonne à court terme.</div>",
          "reponse": "<div>L'agent pourrait utiliser une stratégie <strong>ε-greedy</strong> avec \(\\varepsilon\) décroissant, ou la stratégie <strong>UCB (Upper Confidence Bound)</strong>.<br><ul><li><strong>ε-Greedy :</strong> Explorer aléatoirement avec une probabilité \(\\varepsilon\) pour découvrir de meilleurs bras, puis exploiter de plus en plus.</li><li><strong>UCB :</strong> Choisir le bras qui maximise \( \\hat{\\mu}_i + c \\sqrt{\\frac{\\ln t}{N_i}} \), ce qui donne un bonus aux bras peu explorés. [citation:2]</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
