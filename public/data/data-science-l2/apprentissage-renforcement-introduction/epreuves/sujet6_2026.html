<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction) - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements d'un Système de Recommandation par RL",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Un système de recommandation de films doit proposer des films pertinents aux utilisateurs. L'objectif est de maximiser l'engagement des utilisateurs (clics, visionnages, notations).</p><p>L'apprentissage par renforcement est particulièrement adapté à ce type de problème car il permet de prendre en compte la dimension <strong>séquentielle</strong> des interactions et le <strong>feedback différé</strong> [citation:1].</p><p><strong>Consigne :</strong> Répondez aux questions suivantes en vous basant sur vos connaissances des MDP et du Q-Learning.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Définissez les composants du MDP pour ce système de recommandation : états, actions et récompenses.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>États (S)</strong> : Profil de l'utilisateur (historique de visionnage, notes données, genres préférés, temps passé sur la plateforme).</p><p><strong>Actions (A)</strong> : Recommander un film ou une liste de films à l'utilisateur.</p><p><strong>Récompenses (R)</strong> : +1 si l'utilisateur clique sur le film, +2 s'il le regarde jusqu'au bout, +3 s'il le note positivement, -1 s'il ignore la recommandation.</p><p>L'agent apprend à maximiser la récompense cumulée sur le long terme [citation:1].</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Expliquez le rôle du facteur d'actualisation \\(\\gamma\\) dans ce contexte et proposez une valeur appropriée.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le facteur d'actualisation \\(\\gamma \\in [0, 1]\\) permet de pondérer l'importance des récompenses futures par rapport aux récompenses immédiates. Il est défini par la relation :</p><div class='math-block'><div class='math'>$$ G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^2 R_{t+3} + ... $$</div></div><p>Une valeur de \\(\\gamma = 0.9\\) est appropriée car elle valorise à la fois les recommandations immédiates (satisfaction de l'utilisateur) et la satisfaction à long terme (fidélisation). Un \\(\\gamma\\) proche de 1 permet de prendre en compte l'impact des recommandations sur la rétention des utilisateurs.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application du Q-Learning à la Recommandation",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>On considère un système de recommandation de produits avec 4 produits (P1, P2, P3, P4) et 3 profils d'utilisateurs (U1, U2, U3). La table Q a été apprise et les valeurs sont les suivantes :</p><table style='border-collapse: collapse; width: 100%; font-size: 0.95em;'><tr style='background-color: #007bff; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'></th><th style='padding: 8px; border: 1px solid #ddd;'>P1</th><th style='padding: 8px; border: 1px solid #ddd;'>P2</th><th style='padding: 8px; border: 1px solid #ddd;'>P3</th><th style='padding: 8px; border: 1px solid #ddd;'>P4</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>U1</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>7</td><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>9</td><td style='padding: 8px; border: 1px solid #ddd;'>4</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>U2</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>9</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><strong>U3</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>7</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td></tr></table>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Déterminez la politique de recommandation optimale pour chaque utilisateur selon la table Q.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>La politique optimale choisit pour chaque état l'action qui maximise \\(Q(s,a)\\) :</p><ul><li><strong>U1</strong> : P3 (9 > 7 > 5 > 4)</li><li><strong>U2</strong> : P4 (9 > 8 > 6 > 3)</li><li><strong>U3</strong> : P4 (8 > 7 > 6 > 4)</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Un nouvel utilisateur (U4) arrive. Proposez une stratégie pour gérer ce problème de 'cold start'.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p>Le 'cold start' est le défi de recommander à un nouvel utilisateur sans historique. Plusieurs stratégies sont possibles :</p><ul><li><strong>Approche par similarité</strong> : Utiliser des données démographiques pour trouver les utilisateurs existants les plus similaires.</li><li><strong>Approche bandit</strong> : Commencer avec des recommandations aléatoires (exploration) et apprendre rapidement avec \\(\\epsilon\\)-greedy avec \\(\\epsilon\\) élevé.</li><li><strong>Approche par contenu</strong> : Recommander les produits les plus populaires ou les plus récents.</li><li><strong>Approche RL adaptative</strong> : Initialiser Q avec des valeurs optimistes pour encourager l'exploration (optimisme face à l'incertitude).</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Défis et Évaluation d'un Système de Recommandation",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; color: #333;'><p>L'utilisation du RL pour les systèmes de recommandation présente des défis spécifiques : feedback retardé, non-stationnarité des préférences, exploration coûteuse, grand espace d'actions.</p><p>Le système est évalué sur plusieurs métriques : temps de visionnage moyen, taux de clic (CTR), taux de rétention, satisfaction utilisateur.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1.</strong> Identifiez et expliquez deux défis majeurs de l'utilisation du RL pour les systèmes de recommandation.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>1. Feedback retardé :</strong> La récompense (satisfaction de l'utilisateur) peut prendre du temps à se manifester. Un utilisateur peut ne pas regarder un film recommandé immédiatement. Cela rend l'apprentissage plus difficile car l'agent doit associer une action à une récompense qui arrive plus tard.</p><p><strong>2. Non-stationnarité :</strong> Les préférences des utilisateurs évoluent dans le temps (goûts qui changent, nouvelles tendances). L'agent doit constamment s'adapter, ce qui complique la convergence vers une politique stable.</p></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>2.</strong> Proposez une métrique d'évaluation et expliquez comment elle permet de mesurer la performance du système.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; color: #333;'><p><strong>Métrique proposée : Temps de visionnage moyen</strong></p><div class='math-block'><div class='math'>$$ \\text{Temps moyen} = \\frac{1}{N} \\sum_{i=1}^N \\text{DuréeVisionnée}_i $$</div></div><p><strong>Justification :</strong></p><ul><li>Le temps de visionnage est un proxy direct de l'engagement de l'utilisateur.</li><li>Il est facile à mesurer de manière objective.</li><li>Il capture à la fois l'attractivité de la recommandation et la satisfaction de l'utilisateur.</li><li>Il peut être comparé entre différentes politiques (ex: RL vs recommandations aléatoires ou basées sur la popularité).</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
