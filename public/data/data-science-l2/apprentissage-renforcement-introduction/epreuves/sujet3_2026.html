<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement (Introduction) - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours et Concepts Fondamentaux (Partie 1)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 1.1em;'>Cette partie évalue votre compréhension des concepts clés vus depuis le début du semestre.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>1. (1 pt)</strong> Définissez un <strong>Processus de Décision Markovien (MDP)</strong> et énumérez ses composants. Expliquez le rôle de la propriété de Markov.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> Un MDP est un cadre formel pour modéliser la prise de décision séquentielle dans un environnement stochastique. Il est défini par le tuple <span class='math-inline'>\\( (S, A, P, R, \\gamma) \\)</span> [citation:9]. <strong>S</strong> est l'ensemble des états, <strong>A</strong> l'ensemble des actions, <strong>P</strong> la fonction de transition de probabilité, <strong>R</strong> la fonction de récompense et <strong>\\(\\gamma\\)</strong> le facteur d'actualisation. La <strong>propriété de Markov</strong> stipule que l'état futur ne dépend que de l'état présent, pas de l'historique passé, ce qui simplifie la résolution [citation:2][citation:7].</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>2. (1 pt)</strong> Expliquez la différence entre une politique <strong>déterministe</strong> et une politique <strong>stochastique</strong>. Donnez un exemple pour chaque cas.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> Une <strong>politique déterministe</strong>, notée <span class='math-inline'>\\(\\pi(s) = a\\)</span>, assigne une action unique à chaque état [citation:2]. Par exemple, dans un jeu, la politique pourrait toujours être 'avancer' sur un carreau vert. Une <strong>politique stochastique</strong>, notée <span class='math-inline'>\\(\\pi(a|s) = P(a|s)\\)</span>, définit une distribution de probabilité sur les actions pour chaque état [citation:2]. Par exemple, un agent pourrait choisir d'explorer une nouvelle action avec une probabilité de 10%.</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>3. (1 pt)</strong> Calculez le retour (return) <span class='math-inline'>\\(G_t\\)</span> pour un épisode de 3 pas avec les récompenses suivantes : <span class='math-inline'>\\(R_1 = 1\\)</span>, <span class='math-inline'>\\(R_2 = 3\\)</span>, <span class='math-inline'>\\(R_3 = 2\\)</span> et un facteur d'actualisation <span class='math-inline'>\\(\\gamma = 0.9\\)</span>. Écrivez la formule utilisée.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> <span class='math-inline'>\\(G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^2 R_{t+3}\\)</span>. Pour <span class='math-inline'>\\(t=1\\)</span>, <span class='math-inline'>\\(G_1 = 1 + 0.9 \\times 3 + 0.9^2 \\times 2 = 1 + 2.7 + 1.62 = 5.32\\)</span> [citation:5].</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>4. (1 pt)</strong> Quelle est l'équation de Bellman pour la fonction de valeur d'état <span class='math-inline'>\\(V^{\\pi}(s)\\)</span> ? Que représente cette équation ?</p></div>",
          "reponse": "<p><strong>Réponse :</strong> L'équation est <span class='math-inline'>\\(V^{\\pi}(s) = \\mathbb{E}_{\\pi}[R_{t+1} + \\gamma V^{\\pi}(S_{t+1}) | S_t = s]\\)</span> [citation:5]. Elle exprime la valeur d'un état comme la somme de la récompense immédiate et de la valeur actualisée de l'état suivant, en supposant que l'agent suit la politique <span class='math-inline'>\\(\\pi\\)</span>. Cette équation est fondamentale car elle permet de résoudre les MDPs de manière récursive [citation:7].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Questions de Cours et Concepts Fondamentaux (Partie 2)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 1.1em;'>Cette partie évalue votre compréhension des méthodes de programmation dynamique et de l'apprentissage par renforcement.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>1. (1 pt)</strong> Expliquez la différence entre une méthode <strong>on-policy</strong> et <strong>off-policy</strong> en apprentissage par renforcement. Citez un exemple d'algorithme pour chaque catégorie.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> Une méthode <strong>on-policy</strong> utilise la même politique pour l'exploration et l'apprentissage. L'agent apprend la valeur de la politique qu'il suit. <strong>SARSA</strong> est un exemple d'algorithme on-policy [citation:6][citation:8]. Une méthode <strong>off-policy</strong> utilise deux politiques distinctes : une politique comportementale pour explorer et une politique cible pour apprendre. <strong>Q-Learning</strong> est un exemple d'algorithme off-policy [citation:6][citation:8].</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>2. (1 pt)</strong> Décrivez les deux étapes principales de l'algorithme d'<strong>Itération de Politique (Policy Iteration)</strong>.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> L'itération de politique alterne entre deux étapes : (1) <strong>Évaluation de la politique</strong> : on calcule la fonction de valeur <span class='math-inline'>\\(V^{\\pi}(s)\\)</span> pour la politique actuelle <span class='math-inline'>\\(\\pi\\)</span> [citation:5][citation:9]. (2) <strong>Amélioration de la politique</strong> : on améliore la politique en la rendant gloutonne par rapport à <span class='math-inline'>\\(V^{\\pi}\\)</span>, c'est-à-dire <span class='math-inline'>\\(\\pi'(s) = \\arg\\max_a Q^{\\pi}(s,a)\\)</span> [citation:5]. Ce processus est répété jusqu'à convergence.</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>3. (1 pt)</strong> Comment la méthode de Monte Carlo estime-t-elle la fonction de valeur <span class='math-inline'>\\(V(s)\\)</span> ? Quelle est la principale différence avec l'estimation par TD(0) ?</p></div>",
          "reponse": "<p><strong>Réponse :</strong> La méthode de Monte Carlo estime <span class='math-inline'>\\(V(s)\\)</span> en moyennant les retours (returns) observés après la fin de chaque épisode [citation:8]. La mise à jour se fait donc en batch, après un épisode complet. En revanche, <strong>TD(0)</strong> met à jour la valeur de l'état après chaque pas de temps en utilisant la récompense immédiate et la valeur de l'état suivant, ce qui permet un apprentissage en ligne et incrémental [citation:8].</p>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>4. (1 pt)</strong> Écrivez l'équation de mise à jour pour l'algorithme <strong>Q-Learning</strong>. Expliquez pourquoi il est considéré comme un algorithme off-policy.</p></div>",
          "reponse": "<p><strong>Réponse :</strong> <span class='math-inline'>\\(Q(s, a) \\leftarrow Q(s, a) + \\alpha [r + \\gamma \\max_{a'} Q(s', a') - Q(s, a)]\\)</span> [citation:6][citation:8]. Il est considéré comme <strong>off-policy</strong> car la mise à jour utilise la valeur maximale <span class='math-inline'>\\(\\max_{a'} Q(s', a')\\)</span> pour l'état suivant, indépendamment de l'action réellement choisie par la politique d'exploration. Il apprend la politique optimale, même si l'agent explore [citation:8].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème de MDP et Application Numérique",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-size: 1.1em;'>Soit un MDP avec deux états <span class='math-inline'>\\(S = \\{s_0, s_1\\}\\)</span> et deux actions <span class='math-inline'>\\(A = \\{a_0, a_1\\}\\)</span>. Le facteur d'actualisation est <span class='math-inline'>\\(\\gamma = 0.9\\)</span>. Les transitions et récompenses sont données par le tableau suivant :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; background: #f8f9fa;'><tr><th style='border: 1px solid #ddd; padding: 8px;'>État</th><th style='border: 1px solid #ddd; padding: 8px;'>Action</th><th style='border: 1px solid #ddd; padding: 8px;'>État Suivant</th><th style='border: 1px solid #ddd; padding: 8px;'>Récompense</th></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(a_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(+5\\)</span></td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(a_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(+2\\)</span></td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(a_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_0\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(+1\\)</span></td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(a_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(s_1\\)</span></td><td style='border: 1px solid #ddd; padding: 8px;'><span class='math-inline'>\\(+8\\)</span></td></tr></table></div></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><p><strong>1. (2 pts)</strong> On considère la politique <span class='math-inline'>\\(\\pi\\)</span> suivante : <span class='math-inline'>\\(\\pi(s_0) = a_0\\)</span> et <span class='math-inline'>\\(\\pi(s_1) = a_1\\)</span>. Évaluez cette politique en calculant les valeurs <span class='math-inline'>\\(V^{\\pi}(s_0)\\)</span> et <span class='math-inline'>\\(V^{\\pi}(s_1)\\)</span> en utilisant les équations de Bellman.</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
