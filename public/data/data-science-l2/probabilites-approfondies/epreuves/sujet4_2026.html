<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "titre": "Introduction à l'Apprentissage par Renforcement",
    "contenu": "<div style='font-size: 1.1rem; line-height: 1.6;'><p><strong>L'Apprentissage par Renforcement (RL)</strong> est un paradigme d'apprentissage automatique où un <strong>agent</strong> apprend à prendre des décisions en interagissant avec un <strong>environnement</strong>.</p><ul style='margin-top: 15px;'><li><strong>But :</strong> Maximiser une <strong>récompense</strong> cumulée sur le long terme.</li><li><strong>Différence clé :</strong> L'agent apprend par essais et erreurs, sans données étiquetées.</li><li><strong>Lien avec les chaînes de Markov :</strong> La plupart des problèmes de RL sont formulés comme des <strong>Processus Décisionnels de Markov (MDP)</strong>.</li></ul></div>",
    "texteParle": "Cette leçon est dédiée aux applications des chaînes de Markov dans un domaine fascinant de la data science : l'apprentissage par renforcement. Contrairement à l'apprentissage supervisé, où l'on donne des exemples à la machine, ici, un agent apprend par essais et erreurs en interagissant avec son environnement pour maximiser une récompense. Le cadre mathématique privilégié pour formaliser ces problèmes est le Processus Décisionnel de Markov, que nous allons découvrir.",
    "note": "L'apprentissage par renforcement est inspiré de la manière dont les humains et les animaux apprennent."
  },
  {
    "titre": "Le Processus Décisionnel de Markov (MDP)",
    "contenu": "<div><p>Un MDP est un cadre mathématique pour modéliser la prise de décision dans des environnements aléatoires. Il est défini par le tuple <strong>(S, A, P, R, γ)</strong> :</p><ul style='margin: 15px 0;'><li><strong>S</strong> : <span style='font-weight: bold;'>Espace d'états</span> (<span style='font-style: italic;'>l'ensemble des situations possibles pour l'agent</span>).</li><li><strong>A</strong> : <span style='font-weight: bold;'>Espace d'actions</span> (<span style='font-style: italic;'>l'ensemble des actions que l'agent peut effectuer</span>).</li><li><strong>P</strong> : <span style='font-weight: bold;'>Fonction de transition</span> (<span style='font-style: italic;'>la probabilité d'arriver dans un nouvel état après avoir effectué une action</span>).</li><li><strong>R</strong> : <span style='font-weight: bold;'>Fonction de récompense</span> (<span style='font-style: italic;'>le retour immédiat que l'agent reçoit après une transition</span>).</li><li><strong>γ</strong> : <span style='font-weight: bold;'>Facteur d'actualisation</span> (<span style='font-style: italic;'>un paramètre entre 0 et 1 qui pondère l'importance des récompenses futures</span>).</li></ul></div>",
    "texteParle": "Le cœur de l'apprentissage par renforcement est le Processus Décisionnel de Markov, ou MDP. C'est une généralisation des chaînes de Markov qui intègre la notion d'action et de récompense. Un MDP est défini par cinq éléments clés : l'espace des états possibles, l'espace des actions que l'agent peut entreprendre, la fonction de transition qui décrit les probabilités de changer d'état, la fonction de récompense qui donne un retour immédiat à l'agent, et le facteur d'actualisation qui permet de privilégier les récompenses à court terme ou de planifier sur le long terme.",
    "note": "La propriété de Markov stipule que l'état futur ne dépend que de l'état présent et de l'action choisie, et non de l'historique complet."
  },
  {
    "titre": "Propriété de Markov et Processus de Décision",
    "contenu": "<div style='background-color: #f0f9ff; padding: 15px; border-radius: 8px; color: #1e293b;'> <h4 style='margin-top: 0;'><span style='font-weight: bold;'>🔑 La Propriété de Markov</span></h4> <p style='margin-bottom: 10px;'>La probabilité de passer à l'état futur \(S_{t+1}\) dépend uniquement de l'état et de l'action présents, et non de tout l'historique passé.</p> <div class='math-block'><div class='math'>$$ P(S_{t+1} = s' | S_t = s, A_t = a) $$</div></div> <p style='font-style: italic;'>Cette hypothèse est fondamentale pour rendre le problème traitable.</p> <hr style='border: 1px solid #bae6fd; margin: 15px 0;'> <h4 style='margin-top: 0;'><span style='font-weight: bold;'>🎯 Politique de l'Agent</span></h4> <p>Une <strong>politique</strong> (\(\pi\)) est la stratégie de l'agent, c'est-à-dire la règle qui définit l'action à prendre pour chaque état.</p> <ul> <li><strong>Déterministe :</strong> \(a = \pi(s)\)</li> <li><strong>Stochastique :</strong> \( \pi(a|s) = P(A_t = a | S_t = s) \)</li> </ul> </div>",
    "texteParle": "Deux concepts fondamentaux dans ce cadre. D'abord, la propriété de Markov, qui est une hypothèse simplificatrice essentielle : elle stipule que pour prendre une décision, seuls l'état et l'action présents importent, tout le passé est résumé dans l'état actuel. Ensuite, la politique, qui est la stratégie de l'agent. C'est la règle qui, pour un état donné, détermine quelle action doit être entreprise. Une politique peut être déterministe, c'est-à-dire qu'à un état correspond une seule action, ou stochastique, où l'action est choisie selon une distribution de probabilité.",
    "note": "Trouver la politique optimale est l'objectif ultime de l'apprentissage par renforcement."
  },
  {
    "titre": "Le Problème de la Récompense Totale",
    "contenu": "<div><p>L'objectif de l'agent est de maximiser la <strong>récompense totale attendue</strong> sur le long terme.</p> <div class='math-block'><div class='math'>$$ G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^2 R_{t+3} + ... = \\sum_{k=0}^{\\infty} \\gamma^k R_{t+k+1} $$</div></div> <ul style='margin-top: 15px;'> <li><strong>\(G_t\)</strong> : Le retour cumulé (gain total) à partir du temps \(t\).</li> <li><strong>\(\gamma\)</strong> : Le <strong>facteur d'actualisation</strong> \((0 \le \gamma \le 1)\). <ul> <li><span style='font-style: italic;'>\(\gamma\) proche de 1</span> : L'agent accorde autant d'importance aux récompenses futures qu'immédiates.</li> <li><span style='font-style: italic;'>\(\gamma = 0\)</span> : L'agent est myope, il ne considère que la récompense immédiate.</li> </ul> </li> </ul> <p style='margin-top: 15px;'>Cela permet d'éviter que le retour cumulé tende vers l'infini dans des problèmes à horizon infini.</p></div>",
    "texteParle": "Le but ultime de l'agent n'est pas de maximiser la récompense immédiate, mais la somme des récompenses futures, actualisées. C'est ce qu'on appelle le retour cumulé ou le gain total. La formule de ce retour fait intervenir le facteur d'actualisation gamma. Si gamma est proche de un, l'agent sera patient et planifiera sur le long terme. Si gamma est nul, il ne cherchera qu'à maximiser la récompense tout de suite, il sera myope. Cette notion est cruciale car elle guide la stratégie de l'agent.",
    "note": "Le choix de gamma est important et dépend du problème. Par exemple, dans un jeu, on peut vouloir gagner la partie (objectif lointain) plutôt qu'un point immédiat."
  },
  {
    "titre": "Introduction aux Équations de Bellman",
    "contenu": "<div> <p>Les <strong>équations de Bellman</strong> sont fondamentales en RL. Elles expriment la relation récursive entre la valeur d'un état et la valeur de ses états successeurs.</p> <p>Elles permettent de décomposer le problème de la planification optimale en sous-problèmes plus simples.</p> <ul style='margin: 15px 0;'> <li><strong>Fonction de valeur d'un état \(V^\pi(s)\)</strong> : Le retour espéré en partant de l'état \(s\) et en suivant la politique \(\pi\).</li> <li><strong>Fonction de valeur d'une paire état-action \(Q^\pi(s, a)\)</strong> : Le retour espéré en partant de l'état \(s\), en prenant l'action \(a\), puis en suivant la politique \(\pi\).</li> </ul> <p style='font-style: italic;'>Ces fonctions sont les outils clés pour évaluer et améliorer une politique.</p> </div>",
    "texteParle": "Les équations de Bellman sont les équations fondamentales de la programmation dynamique et de l'apprentissage par renforcement. Elles permettent d'exprimer la valeur d'un état en fonction des récompenses immédiates et de la valeur des états futurs. Il existe deux fonctions de valeur principales : la fonction V, qui donne la valeur d'un état en suivant une politique donnée, et la fonction Q, qui donne la valeur d'une action dans un état donné. Ces fonctions sont les piliers sur lesquels reposent tous les algorithmes de résolution des MDPs.",
    "note": "Les équations de Bellman sont au cœur des méthodes de résolution comme la programmation dynamique, le Q-learning et les méthodes de Monte Carlo."
  },
  {
    "titre": "Équations de Bellman pour \(V^\pi\) et \(Q^\pi\)",
    "contenu": "<div style='background-color: #f1f5f9; padding: 15px; border-radius: 8px; color: #0f172a;'> <h4 style='margin-top: 0;'><span style='font-weight: bold;'>Équation de Bellman pour \(V^\pi\)</span></h4> <div class='math-block'><div class='math'>$$ V^\pi(s) = \\sum_{a} \\pi(a|s) \\sum_{s', r} P(s', r | s, a) \\big[ r + \\gamma V^\pi(s') \\big] $$</div></div> <p style='font-style: italic;'>Cette équation exprime la valeur d'un état comme la moyenne des récompenses immédiates et des valeurs des états suivants, pondérées par les probabilités.</p> <hr style='border: 1px solid #cbd5e1; margin: 15px 0;'> <h4 style='margin-top: 0;'><span style='font-weight: bold;'>Équation de Bellman pour \(Q^\pi\)</span></h4> <div class='math-block'><div class='math'>$$ Q^\pi(s, a) = \\sum_{s', r} P(s', r | s, a) \\big[ r + \\gamma \\sum_{a'} \\pi(a'|s') Q^\pi(s', a') \\big] $$</div></div> <p style='font-style: italic;'>Elle exprime la valeur d'une paire état-action de manière similaire.</p> </div>",
    "texteParle": "Voyons maintenant la forme mathématique de ces équations de Bellman. L'équation pour V pi exprime la valeur d'un état comme l'espérance de la récompense immédiate plus la valeur actualisée de l'état suivant, en suivant la politique pi. L'équation pour Q pi est similaire, mais elle se concentre sur une action spécifique dans un état donné. Ces équations sont très importantes car elles permettent de calculer la valeur d'une politique et de l'améliorer itérativement. Elles sont la base de nombreux algorithmes.",
    "note": "Ces équations peuvent sembler complexes, mais elles expriment une idée simple : la valeur d'un état est la somme de la récompense immédiate et de ce qui va arriver ensuite."
  },
  {
    "titre": "Équation de Bellman pour la Politique Optimale",
    "contenu": "<div> <p>L'équation de Bellman pour la <strong>politique optimale</strong> \(\pi^*\) s'écrit :</p> <div class='math-block'><div class='math'>$$ V^*(s) = \\max_{a \\in A(s)} \\sum_{s', r} P(s', r | s, a) \\big[ r + \\gamma V^*(s') \\big] $$</div></div> <p>Cette équation est au cœur de la <strong>programmation dynamique</strong> pour les MDPs.</p> <ul style='margin: 15px 0;'> <li>La politique optimale est celle qui, pour chaque état, choisit l'action qui maximise la somme de la récompense immédiate et de la valeur du futur état.</li> <li><strong>Résoudre cette équation</strong> signifie trouver la fonction de valeur optimale \(V^*\), puis en déduire la politique optimale \(\pi^*\).</li> </ul> <p>Il s'agit d'un problème de point fixe qui peut être résolu par itération.</p> </div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
