<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités Approfondies - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Composants d'un Processus de Décision Markovien (MDP)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1em; line-height: 1.6; color: #333;'><p>Un agent d'apprentissage par renforcement doit apprendre à naviguer dans un environnement représenté par une grille. L'agent peut se déplacer dans quatre directions (haut, bas, gauche, droite) et reçoit une récompense de +10 lorsqu'il atteint la case objectif et -1 pour chaque déplacement effectué.</p><p>L'état de l'agent est sa position actuelle dans la grille.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Définissez les cinq composants d'un MDP (S, A, P, R, γ) dans le contexte de ce problème de navigation.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><ul style='padding-left: 20px;'><li><strong>S</strong> : L'ensemble des états est l'ensemble des positions possibles dans la grille.</li><li><strong>A</strong> : L'ensemble des actions est {haut, bas, gauche, droite}.</li><li><strong>P</strong> : La fonction de transition de probabilité $P(s'|s,a)$ donne la probabilité d'arriver dans l'état $s'$ en prenant l'action $a$ depuis l'état $s$.</li><li><strong>R</strong> : La fonction de récompense $R(s,a)$ vaut +10 si l'action mène à la case objectif, -1 pour tout déplacement, et 0 sinon.</li><li><strong>γ</strong> : Le facteur d'actualisation $\\gamma \\in [0,1]$ qui pondère l'importance des récompenses futures par rapport aux récompenses immédiates.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Expliquez l'importance de la propriété de Markov dans ce problème. Pourquoi est-elle essentielle pour l'apprentissage par renforcement ?</p>",
          "reponse": "<p><strong>Réponse :</strong> La propriété de Markov stipule que l'état futur dépend uniquement de l'état présent et de l'action choisie, et non de l'historique complet. Dans ce problème, cela signifie que la position future de l'agent ne dépend que de sa position actuelle et de la direction choisie, pas de son chemin précédent. Cette propriété est essentielle car elle permet de simplifier le problème : l'agent n'a besoin de connaître que sa position actuelle pour prendre une décision optimale, sans mémoriser tout son historique.</p>"
        }
      ]
    },
    {
      "titre": "Équations de Bellman",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 1em; line-height: 1.6; color: #333;'><p>On considère un MDP avec trois états $S = \\{s_1, s_2, s_3\\}$ et deux actions $A = \\{a_1, a_2\\}$. Les transitions sont déterministes :</p><ul><li>Depuis $s_1$, l'action $a_1$ mène à $s_2$ avec une récompense de 5.</li><li>Depuis $s_1$, l'action $a_2$ mène à $s_3$ avec une récompense de 10.</li><li>Depuis $s_2$, l'action $a_1$ mène à $s_1$ avec une récompense de 0.</li><li>Depuis $s_2$, l'action $a_2$ mène à $s_3$ avec une récompense de 2.</li><li>Depuis $s_3$, toutes les actions mènent à $s_3$ avec une récompense de 20 (état absorbant).</li></ul><p>Le facteur d'actualisation est $\\gamma = 0.9$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Écrivez les équations de Bellman pour la fonction de valeur $V^\\pi$ pour une politique $\\pi$ déterministe. Calculez $V^\\pi(s_1)$, $V^\\pi(s_2)$ et $V^\\pi(s_3)$ pour la politique $\\pi$ qui choisit $a_1$ dans tous les états.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>Les équations de Bellman pour une politique $\\pi$ déterministe sont :</p><div class='math-block'><div class='math'>$$V^\\pi(s) = R(s, \\pi(s)) + \\gamma \\sum_{s'} P(s'|s, \\pi(s)) V^\\pi(s')$$</div></div><p>Pour la politique $\\pi(s_1)=a_1$, $\\pi(s_2)=a_1$, $\\pi(s_3)=a_1$ :</p><p>$V^\\pi(s_3) = 20 + 0.9 V^\\pi(s_3) \\Rightarrow V^\\pi(s_3) = 200$</p><p>$V^\\pi(s_2) = 0 + 0.9 V^\\pi(s_1)$</p><p>$V^\\pi(s_1) = 5 + 0.9 V^\\pi(s_2) = 5 + 0.81 V^\\pi(s_1) \\Rightarrow V^\\pi(s_1) \\approx 26.32$</p><p>$V^\\pi(s_2) = 0.9 \\times 26.32 \\approx 23.68$</p>"
        },
        {
          "question": "<p><strong>2.</strong> Déterminez la politique optimale pour ce MDP en résolvant les équations de Bellman optimalité.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>Les équations de Bellman optimalité sont :</p><div class='math-block'><div class='math'>$$V^*(s) = \\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) V^*(s') \\right]$$</div></div><p>Pour $s_3$ (absorbant) : $V^*(s_3) = 200$.</p><p>Pour $s_2$ : $a_1$ donne $0.9 V^*(s_1)$, $a_2$ donne $2 + 0.9 \\times 200 = 182$.</p><p>Pour $s_1$ : $a_1$ donne $5 + 0.9 V^*(s_2)$, $a_2$ donne $10 + 0.9 \\times 200 = 190$.</p><p>On trouve : $V^*(s_1) = 190$, $V^*(s_2) = 182$.</p><p>La politique optimale est : $\\pi^*(s_1) = a_2$, $\\pi^*(s_2) = a_2$.</p>"
        }
      ]
    },
    {
      "titre": "Exploration vs Exploitation",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1em; line-height: 1.6; color: #333;'><p>Un agent d'apprentissage par renforcement doit choisir entre plusieurs actions dans un environnement inconnu. Il doit équilibrer l'exploration (essayer de nouvelles actions pour découvrir leurs récompenses) et l'exploitation (choisir l'action qui semble la meilleure selon les connaissances actuelles).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décrivez le dilemme exploration-exploitation dans le contexte de l'apprentissage par renforcement. Pourquoi est-il crucial de gérer cet équilibre ?</p>",
          "reponse": "<p><strong>Réponse :</strong> Le dilemme exploration-exploitation est le problème fondamental de l'apprentissage par renforcement :</p><ul><li><strong>Exploitation</strong> : choisir l'action qui semble la meilleure selon les connaissances actuelles pour maximiser la récompense immédiate.</li><li><strong>Exploration</strong> : essayer des actions qui ne sont pas encore connues pour découvrir si elles pourraient être meilleures à long terme.</li></ul><p>Il est crucial de gérer cet équilibre car une trop forte exploitation conduit à une sous-optimalité (on peut rater une action bien meilleure). Une trop forte exploration conduit à des récompenses faibles et une convergence lente. L'équilibre permet d'apprendre la politique optimale tout en maximisant les récompenses cumulées.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Comparez la stratégie $\\epsilon$-greedy avec la stratégie de Boltzmann (softmax) pour gérer le dilemme exploration-exploitation.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>ε-greedy</strong> : avec une probabilité $\\epsilon$, l'agent choisit une action aléatoire (exploration), et avec une probabilité $1-\\epsilon$, l'action avec la plus grande valeur $Q(s,a)$ (exploitation). Simple et efficace. $\\epsilon$ peut être fixe ou décroissant.</p><p><strong>Boltzmann (softmax)</strong> : l'agent choisit l'action $a$ avec une probabilité proportionnelle à $\\exp(Q(s,a)/T)$ où $T$ est la température. Quand $T$ est grand, les choix sont presque uniformes (exploration). Quand $T$ est petit, les choix tendent vers l'action avec la plus grande valeur (exploitation). Softmax est plus fine car elle pondère les actions selon leurs valeurs, mais nécessite de régler la température. ε-greedy est plus simple et souvent utilisée en pratique.</p>"
        }
      ]
    },
    {
      "titre": "Méthodes de Résolution de MDP",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 1em; line-height: 1.6; color: #333;'><p>On considère un MDP avec un grand nombre d'états. L'agent doit apprendre une politique optimale. Plusieurs méthodes sont disponibles : itération de la valeur, itération de la politique, Q-learning, SARSA.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Comparez les méthodes d'itération de la valeur et d'itération de la politique pour résoudre un MDP. Quels sont leurs avantages et inconvénients respectifs ?</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>Itération de la valeur</strong> : met à jour $V(s)$ avec $V(s) = \\max_a [R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) V(s')]$ pour tous les états simultanément. Avantages : converge plus rapidement, plus simple. Inconvénients : nécessite de connaître le modèle $P$ et $R$.</p><p><strong>Itération de la politique</strong> : alterne entre évaluation de la politique ($V^\\pi$) et amélioration de la politique ($\\pi' = \\text{greedy}(V^\\pi)$). Avantages : converge en un nombre fini d'itérations pour les MDP finis. Inconvénients : plus complexe, chaque itération d'évaluation peut être coûteuse.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Quand utiliserait-on Q-learning plutôt que l'itération de la valeur ? Expliquez la différence entre Q-learning et SARSA.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>Q-learning</strong> est une méthode sans modèle (model-free) qui apprend $Q(s,a)$ sans nécessiter la connaissance de $P$. Préférée quand le modèle n'est pas connu.</p><p><strong>Différence Q-learning vs SARSA</strong> :</p><ul><li><strong>Q-learning</strong> (off-policy) : mise à jour $Q(s,a) \\leftarrow Q(s,a) + \\alpha [R + \\gamma \\max_{a'} Q(s',a') - Q(s,a)]$. Utilise l'action optimale pour l'évaluation (max).</li><li><strong>SARSA</strong> (on-policy) : mise à jour $Q(s,a) \\leftarrow Q(s,a) + \\alpha [R + \\gamma Q(s',a') - Q(s,a)]$ où $a'$ est l'action effectivement choisie. Apprend la valeur de la politique suivie.</li></ul><p>Q-learning est plus agressif et peut converger plus vite vers la politique optimale, mais SARSA est plus prudent et plus stable dans certains environnements.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
