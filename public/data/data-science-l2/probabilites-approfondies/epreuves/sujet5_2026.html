<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Probabilités Approfondies - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Convergence et Théorèmes Limites (4 pts)",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>Soit \\( (X_n)_{n \\geq 1} \\) une suite de variables aléatoires indépendantes et identiquement distribuées (i.i.d.) suivant une loi de Bernoulli de paramètre \\( p \\in ]0,1[ \\). On définit la suite des moyennes empiriques :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$ \\bar{X}_n = \\frac{1}{n} \\sum_{i=1}^n X_i $$</div>\n  </div>\n</div>",
     "questions": [
       {
         "question": "<div><strong>1.1 (1 pt)</strong> Énoncer la loi faible des grands nombres (LGN) et déterminer vers quoi converge \\( \\bar{X}_n \\) en probabilité.</div>",
         "reponse": "<div>La loi faible des grands nombres stipule que la moyenne empirique \\( \\bar{X}_n \\) converge en probabilité vers l'espérance commune \\( E(X_1) = p \\). Autrement dit, pour tout \\( \\varepsilon > 0 \\), \\( \\lim_{n \\to \\infty} P(|\\bar{X}_n - p| > \\varepsilon) = 0 \\).</div>"
       },
       {
         "question": "<div><strong>1.2 (1.5 pts)</strong> Énoncer le théorème central-limite (TCL) pour cette suite et donner la loi asymptotique de \\( \\bar{X}_n \\).</div>",
         "reponse": "<div>Le théorème central-limite (version de Lindeberg-Lévy) s'applique :</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ \\sqrt{n}(\\bar{X}_n - p) \\xrightarrow{d} \\mathcal{N}(0, p(1-p)) $$</div></div><div>Ainsi, \\( \\bar{X}_n \\) suit approximativement une loi normale \\( \\mathcal{N}(p, \\frac{p(1-p)}{n}) \\) pour \\( n \\) grand.</div>"
       },
       {
         "question": "<div><strong>1.3 (1.5 pts)</strong> Expliquer l'importance de ces deux théorèmes en Data Science.</div>",
         "reponse": "<div>La LGN justifie la consistance des estimateurs (moyenne empirique, proportion, etc.) qui sont utilisés pour approcher les caractéristiques d'une population à partir d'un échantillon [citation:1]. Le TCL est fondamental pour la construction d'intervalles de confiance et la réalisation de tests d'hypothèses, car il permet d'approcher la distribution de la moyenne par une loi normale, même si la distribution initiale ne l'est pas.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Chaînes de Markov (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>On considère une chaîne de Markov \\( (X_n)_{n \\geq 0} \\) à temps discret sur l'espace d'états \\( \\{1, 2, 3\\} \\), dont la matrice de transition est donnée par :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$ P = \\begin{pmatrix} 0.5 & 0.3 & 0.2 \\\\ 0.1 & 0.4 & 0.5 \\\\ 0.2 & 0.5 & 0.3 \\end{pmatrix} $$</div>\n  </div>\n  <p>On suppose que la loi initiale est \\( \\pi^{(0)} = (0.2, 0.5, 0.3) \\).</p>\n</div>",
     "questions": [
       {
         "question": "<div><strong>2.1 (1 pt)</strong> Calculer la distribution de \\( X_1 \\), c'est-à-dire \\( \\pi^{(1)} = \\pi^{(0)} P \\).</div>",
         "reponse": "<div>$$\\pi^{(1)} = \\begin{pmatrix} 0.2 & 0.5 & 0.3 \\end{pmatrix} \\begin{pmatrix} 0.5 & 0.3 & 0.2 \\\\ 0.1 & 0.4 & 0.5 \\\\ 0.2 & 0.5 & 0.3 \\end{pmatrix} = \\begin{pmatrix} 0.21 & 0.41 & 0.38 \\end{pmatrix} $$</div>"
       },
       {
         "question": "<div><strong>2.2 (2 pts)</strong> Déterminer la distribution stationnaire \\( \\pi \\) de cette chaîne de Markov.</div>",
         "reponse": "<div>La distribution stationnaire \\( \\pi = (\\pi_1, \\pi_2, \\pi_3) \\) vérifie :</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ \\pi P = \\pi $$</div></div><div>avec \\( \\sum_{i=1}^3 \\pi_i = 1 \\). En résolvant le système, on obtient :</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ \\pi = \\begin{pmatrix} \\frac{7}{30} & \\frac{13}{30} & \\frac{10}{30} \\end{pmatrix} \\approx \\begin{pmatrix} 0.233 & 0.433 & 0.333 \\end{pmatrix} $$</div></div>"
       },
       {
         "question": "<div><strong>2.3 (1.5 pts)</strong> Interpréter la distribution stationnaire trouvée.</div>",
         "reponse": "<div>La distribution stationnaire représente la proportion de temps que la chaîne de Markov passe dans chaque état à long terme, indépendamment de la distribution initiale. C'est la distribution limite de la chaîne si celle-ci est ergodique (irréductible et apériodique).</div>"
       },
       {
         "question": "<div><strong>2.4 (1.5 pts)</strong> Donner un exemple d'application d'une chaîne de Markov en Data Science.</div>",
         "reponse": "<div>Les chaînes de Markov sont utilisées dans les modèles de Markov cachés (HMM) pour la reconnaissance de la parole, pour le PageRank de Google, ou encore pour la modélisation de séquences en bio-informatique.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Processus Stochastiques (5 pts)",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>Un standard téléphonique reçoit en moyenne 3 appels par minute. On modélise le nombre d'appels reçus par un processus de Poisson \\( (N_t)_{t \\geq 0} \\) d'intensité \\( \\lambda = 3 \\).</p>\n</div>",
     "questions": [
       {
         "question": "<div><strong>3.1 (1 pt)</strong> Définir un processus de Poisson et donner ses principales propriétés.</div>",
         "reponse": "<div>Un processus de Poisson \\( (N_t) \\) est un processus de comptage tel que :</div><ul><li>\\( N_0 = 0 \\)</li><li>Les accroissements sont indépendants et stationnaires.</li><li>Pour \\( t > 0 \\), \\( N_t \\sim \\mathcal{P}(\\lambda t) \\).</li></ul>"
       },
       {
         "question": "<div><strong>3.2 (1 pt)</strong> Calculer la probabilité qu'il y ait exactement 2 appels en 30 secondes.</div>",
         "reponse": "<div>Pour \\( t = 0.5 \\) minute, \\( \\lambda t = 3 \\times 0.5 = 1.5 \\).</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ P(N_{0.5} = 2) = \\frac{e^{-1.5} (1.5)^2}{2!} \\approx 0.251 $$</div></div>"
       },
       {
         "question": "<div><strong>3.3 (1.5 pts)</strong> Soit \\( T_1 \\) le temps d'attente du premier appel. Quelle est sa loi ? Calculer \\( P(T_1 > 1 \\text{ min}) \\).</div>",
         "reponse": "<div>Le temps d'attente du premier appel \\( T_1 \\) suit une loi exponentielle de paramètre \\( \\lambda = 3 \\).</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ P(T_1 > 1) = 1 - F(1) = e^{-3} \\approx 0.0498 $$</div></div>"
       },
       {
         "question": "<div><strong>3.4 (1.5 pts)</strong> Établir le lien entre le processus de Poisson et la loi exponentielle.</div>",
         "reponse": "<div>Le lien fondamental est que les temps inter-arrivées d'un processus de Poisson d'intensité \\( \\lambda \\) sont indépendants et suivent une loi exponentielle de paramètre \\( \\lambda \\).</div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Martingales (5 pts)",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px;'>\n  <p>Soit \\( (\\mathcal{F}_n)_{n \\geq 0} \\) une filtration et \\( (M_n)_{n \\geq 0} \\) un processus stochastique adapté, intégrable (i.e. \\( E(|M_n|) < \\infty \\) pour tout \\( n \\)).</p>\n</div>",
     "questions": [
       {
         "question": "<div><strong>4.1 (2 pts)</strong> Définir une martingale, une sous-martingale et une sur-martingale.</div>",
         "reponse": "<div><ul><li><strong>Martingale :</strong> \\( E(M_{n+1} | \\mathcal{F}_n) = M_n \\).</li><li><strong>Sous-martingale :</strong> \\( E(M_{n+1} | \\mathcal{F}_n) \\geq M_n \\).</li><li><strong>Sur-martingale :</strong> \\( E(M_{n+1} | \\mathcal{F}_n) \\leq M_n \\).</li></ul></div>"
       },
       {
         "question": "<div><strong>4.2 (1.5 pts)</strong> Soit \\( (X_n)_{n \\geq 1} \\) une suite de variables aléatoires i.i.d. d'espérance \\( \\mu \\) et de variance finie. On pose \\( S_n = \\sum_{i=1}^n X_i \\).</div><div>Montrer que \\( M_n = S_n - n\\mu \\) est une martingale.</div>",
         "reponse": "<div>On a \\( E(M_{n+1} | \\mathcal{F}_n) = E(S_{n+1} - (n+1)\\mu | \\mathcal{F}_n) = E(S_n + X_{n+1} - (n+1)\\mu | \\mathcal{F}_n) \\).</div><div>En utilisant l'espérance conditionnelle :</div><div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'><div class='math' style='font-size: 1.2em;'>$$ = S_n - n\\mu + E(X_{n+1}) - \\mu = S_n - n\\mu = M_n $$</div></div>"
       },
       {
         "question": "<div><strong>4.3 (1.5 pts)</strong> Citer un théorème de convergence des martingales.</div>",
         "reponse": "<div>Un théorème important est le théorème de convergence des martingales de Doob : Si \\( (M_n) \\) est une martingale uniformément intégrable, alors elle converge presque sûrement et dans \\( L^1 \\) vers une variable aléatoire \\( M_\\infty \\) intégrable.</div>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
