<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités Approfondies - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Vecteur gaussien et indépendance",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529; margin-bottom: 15px;'><p>Soit \\(X = (X_1, X_2, X_3)^T\\) un vecteur gaussien centré de matrice de covariance :</p><div class='math-block'><div class='math'>$$ \\Sigma = \\begin{pmatrix} 4 & 1 & 0 \\\\ 1 & 9 & 0 \\\\ 0 & 0 & 1 \\end{pmatrix} $$</div></div></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>1)</p><p>Déterminer les lois marginales de \\(X_1\\), \\(X_2\\) et \\(X_3\\).</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Les lois marginales d'un vecteur gaussien sont gaussiennes :</p><ul><li>\\(X_1 \\sim \\mathcal{N}(0, 4)\\)</li><li>\\(X_2 \\sim \\mathcal{N}(0, 9)\\)</li><li>\\(X_3 \\sim \\mathcal{N}(0, 1)\\)</li></ul></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>2)</p><p>Les variables \\(X_1\\) et \\(X_2\\) sont-elles indépendantes ? Justifier.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Non, \\(X_1\\) et \\(X_2\\) ne sont pas indépendantes car \\(\\text{Cov}(X_1, X_2) = 1 \\neq 0\\). Pour un vecteur gaussien, l'indépendance est équivalente à la nullité de la covariance.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>3)</p><p>Déterminer la loi de \\(Y = X_1 + X_2\\).</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>\\(Y = X_1 + X_2\\) est une combinaison linéaire de composantes d'un vecteur gaussien, donc \\(Y\\) est normale.</p><div class='math-block'><div class='math'>$$ E[Y] = 0 $$</div></div><div class='math-block'><div class='math'>$$ \\text{Var}(Y) = \\text{Var}(X_1) + \\text{Var}(X_2) + 2\\text{Cov}(X_1, X_2) = 4 + 9 + 2 = 15 $$</div></div><p>Donc \\(Y \\sim \\mathcal{N}(0, 15)\\).</p></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>4)</p><p>\\(X_3\\) est-elle indépendante de \\((X_1, X_2)\\) ? Justifier.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Oui, \\(X_3\\) est indépendante de \\((X_1, X_2)\\). La matrice de covariance est bloc-diagonale avec le bloc \\(\\begin{pmatrix} 4 & 1 \\\\ 1 & 9 \\end{pmatrix}\\) pour \\((X_1, X_2)\\) et le bloc \\([1]\\) pour \\(X_3\\). Pour un vecteur gaussien, cela implique l'indépendance.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Loi des grands nombres et intervalle de confiance",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529; margin-bottom: 15px;'><p>Un institut de sondage souhaite estimer la proportion \\(p\\) d'électeurs favorables à un candidat. Il interroge 400 personnes et obtient 220 réponses favorables.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>1)</p><p>Donner l'estimation ponctuelle \\(\\hat{p}\\) de \\(p\\).</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>$$\\hat{p} = \\frac{220}{400} = 0.55$$</p><p>La proportion estimée est de 55 %.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>2)</p><p>En utilisant l'inégalité de Chebyshev, donner une borne supérieure pour \\(P(|\\hat{p} - p| \\geq 0.05)\\).</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Pour une loi de Bernoulli, \\(\\text{Var}(\\hat{p}) = \\frac{p(1-p)}{n} \\leq \\frac{1}{4n}\\). Donc :</p><div class='math-block'><div class='math'>$$ P(|\\hat{p} - p| \\geq 0.05) \\leq \\frac{\\text{Var}(\\hat{p})}{0.05^2} \\leq \\frac{1}{4 \\times 400 \\times 0.0025} = \\frac{1}{4} = 0.25 $$</div></div><p>La probabilité est inférieure à 25 %.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>3)</p><p>En utilisant le théorème central-limite, construire un intervalle de confiance à 95 % pour \\(p\\).</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Par le TCL, \\(\\hat{p} \\approx \\mathcal{N}(p, p(1-p)/n)\\). L'intervalle de confiance à 95 % est :</p><div class='math-block'><div class='math'>$$ \\hat{p} \\pm 1.96 \\times \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} = 0.55 \\pm 1.96 \\times \\sqrt{\\frac{0.55 \\times 0.45}{400}} $$</div></div><div class='math-block'><div class='math'>$$ 0.55 \\pm 1.96 \\times 0.02487 = 0.55 \\pm 0.04875 $$</div></div><p>$$IC_{95\\%}(p) = [0.50125; 0.59875]$$</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Chaîne de Markov et classification des états",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529; margin-bottom: 15px;'><p>On considère une chaîne de Markov à temps discret sur l'espace d'états \\(E = \\{1, 2, 3\\}\\) de matrice de transition :</p><div class='math-block'><div class='math'>$$ P = \\begin{pmatrix} 0.5 & 0.5 & 0 \\\\ 0.3 & 0.7 & 0 \\\\ 0.2 & 0.3 & 0.5 \\end{pmatrix} $$</div></div></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>1)</p><p>Déterminer les classes de communication de cette chaîne.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Les états 1 et 2 communiquent entre eux : \\(1 \\leftrightarrow 2\\). L'état 3 communique avec 1 et 2 (on peut y aller depuis 1 ou 2), mais on ne peut pas revenir de 3 vers 1 ou 2 (car les colonnes 1 et 2 de la ligne 3 sont nulles). Donc les classes sont :</p><ul><li>\\(C_1 = \\{1, 2\\}\\) (classe fermée)</li><li>\\(C_2 = \\{3\\}\\) (classe fermée)</li></ul></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>2)</p><p>Les états sont-ils récurrents ou transitoires ? Justifier.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>La classe \\(C_1 = \\{1, 2\\}\\) est fermée et finie, donc les états 1 et 2 sont récurrents. La classe \\(C_2 = \\{3\\}\\) est également fermée et finie, donc l'état 3 est récurrent. Tous les états sont récurrents.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>3)</p><p>La chaîne est-elle irréductible ? Justifier.</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Non, la chaîne n'est pas irréductible car elle admet plusieurs classes de communication (\\(C_1\\) et \\(C_2\\)).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Processus de Poisson et temps d'attente",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529; margin-bottom: 15px;'><p>Les clients arrivent à un guichet selon un processus de Poisson de taux \\(\\lambda = 5\\) clients par heure.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>1)</p><p>Quelle est la probabilité qu'aucun client n'arrive pendant les 30 prochaines minutes ?</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le nombre d'arrivées en 30 minutes (0.5 heure) suit une loi de Poisson de paramètre \\(\\lambda \\times 0.5 = 2.5\\). La probabilité est :</p><div class='math-block'><div class='math'>$$ P(N(0.5) = 0) = e^{-2.5} \\approx 0.0821 $$</div></div></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>2)</p><p>Quelle est la probabilité qu'au moins 3 clients arrivent en 1 heure ?</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le nombre d'arrivées en 1 heure suit une loi de Poisson de paramètre \\(\\lambda = 5\\).</p><div class='math-block'><div class='math'>$$ P(N(1) \\geq 3) = 1 - P(N(1) \\leq 2) = 1 - e^{-5}\\left(1 + 5 + \\frac{25}{2}\\right) $$</div></div><div class='math-block'><div class='math'>$$ = 1 - e^{-5}(1 + 5 + 12.5) = 1 - 18.5 \\times e^{-5} \\approx 1 - 18.5 \\times 0.00674 \\approx 0.8753 $$</div></div></div>"
        },
        {
          "question": "<p style='font-weight: bold; color: #0d6efd;'>3)</p><p>Quelle est la loi du temps d'attente entre deux arrivées consécutives ?</p>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Le temps d'attente entre deux arrivées consécutives suit une loi exponentielle de paramètre \\(\\lambda = 5\\). Soit \\(T \\sim \\text{Exponentielle}(5)\\). La densité est \\(f_T(t) = 5e^{-5t}\\) pour \\(t \\geq 0\\).</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
