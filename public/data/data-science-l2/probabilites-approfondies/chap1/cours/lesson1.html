<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h2 style='color: #2c3e50;'>Variables Aléatoires Continues</h2>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Cette leçon est une introduction aux variables aléatoires continues, un concept fondamental en probabilités et en statistique.</p>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Contrairement aux variables discrètes qui prennent un nombre fini ou dénombrable de valeurs, les variables continues peuvent prendre n'importe quelle valeur dans un intervalle.</p>\n  <div style='background: #e8f4f8; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin-top: 15px;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Exemples :</strong> Taille d'une personne, durée de vie d'une machine, température, poids, etc.</p>\n  </div>\n</div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons aborder un sujet très important en probabilités : les variables aléatoires continues. Une variable aléatoire est dite continue lorsqu'elle peut prendre toutes les valeurs possibles dans un intervalle donné. Contrairement aux variables discrètes qui prennent des valeurs isolées, la variable continue peut prendre une infinité de valeurs. Par exemple, la taille d'une personne, la durée de vie d'une machine ou encore la température sont des exemples classiques de variables continues. Nous allons voir comment on peut les décrire mathématiquement à l'aide de la fonction de densité et de la fonction de répartition.",
    "note": "Variable continue : peut prendre une infinité de valeurs dans un intervalle."
  },
  {
    "titre": "Définition",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Qu'est-ce qu'une Variable Aléatoire Continue ?</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Une variable aléatoire <strong>continue</strong> est une variable qui peut prendre une infinité non dénombrable de valeurs dans un intervalle de \\(\\mathbb{R}\\).</p>\n  <p style='font-size: 1.1em; line-height: 1.6;'>On ne peut pas décrire une variable continue par une liste de valeurs et de probabilités comme pour une variable discrète.</p>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Propriété fondamentale :</strong> Pour une variable continue, la probabilité qu'elle prenne une valeur <em>exactement</em> égale à un nombre donné est toujours nulle.</p>\n    <p style='font-size: 1.1em; line-height: 1.6; margin-top: 5px;'>On a : \\(P(X = x) = 0\\) pour tout \\(x\\).</p>\n  </div>\n  <p style='font-size: 1.1em; line-height: 1.6;'>On s'intéresse donc à la probabilité que la variable se trouve dans un intervalle, comme \\(P(a \\leq X \\leq b)\\).</p>\n</div>",
    "texteParle": "Définissons maintenant ce qu'est une variable aléatoire continue. Une variable continue est une variable qui peut prendre une infinité non dénombrable de valeurs dans un intervalle de l'ensemble des nombres réels. Contrairement aux variables discrètes, on ne peut pas énumérer toutes les valeurs possibles. Une propriété très importante est que la probabilité qu'une variable continue prenne exactement une valeur donnée est toujours nulle. Cela peut paraître surprenant, mais c'est dû au fait qu'il y a une infinité de valeurs possibles. Par exemple, la probabilité qu'une personne mesure exactement 1.75 mètre est nulle, car il y a une infinité de mesures possibles. On s'intéresse donc plutôt à la probabilité que la variable se trouve dans un intervalle, par exemple entre 1.70 et 1.80 mètre.",
    "note": "P(X = x) = 0 pour toute variable continue."
  },
  {
    "titre": "Fonction de Densité",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>La Fonction de Densité de Probabilité (fdp)</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>La fonction de densité de probabilité (fdp), notée \\(f_X(x)\\), décrit la distribution d'une variable aléatoire continue.</p>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Elle vérifie les propriétés suivantes :</p>\n  <ul style='font-size: 1.1em; line-height: 1.8;'>\n    <li><strong>Positivité :</strong> \\(f_X(x) \\geq 0\\) pour tout \\(x\\).</li>\n    <li><strong>Normalisation :</strong> \\(\\int_{-\\infty}^{+\\infty} f_X(x) \\, dx = 1\\).</li>\n  </ul>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Interprétation :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8; margin-top: 5px;'>\n      <li>La densité n'est pas une probabilité, c'est une <strong>densité</strong> (une concentration de probabilité).</li>\n      <li>La probabilité que \\(X\\) soit dans l'intervalle \\([a,b]\\) est l'aire sous la courbe de \\(f_X\\) sur cet intervalle.</li>\n    </ul>\n  </div>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$P(a \\leq X \\leq b) = \\int_a^b f_X(x) \\, dx$$</div>\n  </div>\n</div>",
    "texteParle": "Pour décrire une variable aléatoire continue, on utilise la fonction de densité de probabilité, souvent notée f de x. Cette fonction a deux propriétés importantes. D'abord, elle est toujours positive ou nulle. Ensuite, l'aire totale sous sa courbe est égale à 1. Attention, la densité n'est pas une probabilité en soi. C'est plutôt une concentration de probabilité. La probabilité que la variable X se trouve entre a et b est donnée par l'aire sous la courbe de la densité entre a et b. En d'autres termes, on calcule l'intégrale de la densité entre a et b. Cette aire représente la probabilité que la variable prenne une valeur dans cet intervalle.",
    "note": "P(a ≤ X ≤ b) = ∫ₐᵇ f(x) dx."
  },
  {
    "titre": "Fonction de Répartition",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>La Fonction de Répartition</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>La fonction de répartition, notée \\(F_X(x)\\), est définie pour tout réel \\(x\\) par :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$F_X(x) = P(X \\leq x)$$</div>\n  </div>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Elle donne la probabilité que la variable \\(X\\) soit inférieure ou égale à une valeur \\(x\\).</p>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Propriétés :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8; margin-top: 5px;'>\n      <li>\\(F_X\\) est croissante (non décroissante).</li>\n      <li>\\(\\lim_{x \\to -\\infty} F_X(x) = 0\\).</li>\n      <li>\\(\\lim_{x \\to +\\infty} F_X(x) = 1\\).</li>\n      <li>Pour une variable continue, \\(F_X\\) est continue.</li>\n    </ul>\n  </div>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Le lien entre la densité et la fonction de répartition est :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$F_X(x) = \\int_{-\\infty}^{x} f_X(t) \\, dt \\quad \\text{et} \\quad f_X(x) = F_X'(x)$$</div>\n  </div>\n</div>",
    "texteParle": "Un autre outil important est la fonction de répartition. C'est la probabilité que la variable X soit inférieure ou égale à une valeur donnée x. Elle est définie comme la probabilité que X soit plus petit que x. La fonction de répartition a plusieurs propriétés : elle est croissante, elle tend vers 0 quand x tend vers moins l'infini, et elle tend vers 1 quand x tend vers plus l'infini. Pour une variable continue, la fonction de répartition est continue. Le lien entre la densité et la fonction de répartition est simple : la fonction de répartition est l'intégrale de la densité, et réciproquement, la densité est la dérivée de la fonction de répartition. C'est une relation fondamentale à retenir.",
    "note": "F(x) = ∫_{-∞}^{x} f(t) dt et f(x) = F'(x)."
  },
  {
    "titre": "Exemple 1",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Exemple : La Loi Uniforme sur [0,1]</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Considérons une variable aléatoire \\(X\\) uniformément distribuée sur l'intervalle \\([0,1]\\).</p>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Sa densité est :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$f_X(x) = \\begin{cases} 1 & \\text{si } 0 \\leq x \\leq 1 \\\\ 0 & \\text{sinon} \\end{cases}$$</div>\n  </div>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Sa fonction de répartition est :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$F_X(x) = \\begin{cases} 0 & \\text{si } x < 0 \\\\ x & \\text{si } 0 \\leq x \\leq 1 \\\\ 1 & \\text{si } x > 1 \\end{cases}$$</div>\n  </div>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Calcul de probabilité :</strong></p>\n    <p style='font-size: 1.1em; line-height: 1.6; margin-top: 5px;'>\\(P(0.2 \\leq X \\leq 0.7) = F_X(0.7) - F_X(0.2) = 0.7 - 0.2 = 0.5\\).</p>\n    <p style='font-size: 1.1em; line-height: 1.6;'>Ou directement : \\(\\int_{0.2}^{0.7} 1 \\, dx = 0.5\\).</p>\n  </div>\n</div>",
    "texteParle": "Prenons un exemple pour mieux comprendre. On considère une variable aléatoire X qui suit une loi uniforme sur l'intervalle 0,1. Sa densité est constante et égale à 1 sur cet intervalle, et 0 ailleurs. La fonction de répartition est alors égale à x pour x entre 0 et 1. Pour calculer la probabilité que X se trouve entre 0.2 et 0.7, on utilise la fonction de répartition : on fait la différence F de 0.7 moins F de 0.2, ce qui donne 0.5. On peut aussi calculer directement l'intégrale de la densité entre 0.2 et 0.7, ce qui donne aussi 0.5. Cela signifie qu'il y a 50% de chances que X soit entre 0.2 et 0.7.",
    "note": "Loi uniforme sur [0,1] : densité constante = 1."
  },
  {
    "titre": "Exemple 2",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Exemple : La Loi Exponentielle</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Considérons une variable aléatoire \\(X\\) suivant une loi exponentielle de paramètre \\(\\lambda > 0\\).</p>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Sa densité est :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$f_X(x) = \\lambda e^{-\\lambda x} \\quad \\text{pour } x \\geq 0$$</div>\n  </div>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Sa fonction de répartition est :</p>\n  <div class='math-block' style='background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;'>\n    <div class='math' style='font-size: 1.2em;'>$$F_X(x) = 1 - e^{-\\lambda x} \\quad \\text{pour } x \\geq 0$$</div>\n  </div>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Propriété :</strong> La loi exponentielle est souvent utilisée pour modéliser des temps d'attente ou des durées de vie.</p>\n  </div>\n</div>",
    "texteParle": "Voici un deuxième exemple avec la loi exponentielle. La loi exponentielle est très utilisée pour modéliser des temps d'attente ou des durées de vie. Elle dépend d'un paramètre lambda qui est positif. Sa densité est lambda fois exponentielle de moins lambda x, pour x positif. Sa fonction de répartition est 1 moins exponentielle de moins lambda x. La loi exponentielle a une propriété intéressante, c'est l'absence de mémoire, qui signifie que la probabilité de survivre encore un certain temps ne dépend pas du temps déjà écoulé. Cette loi est très utile dans de nombreux domaines, comme la fiabilité des machines ou les files d'attente.",
    "note": "Loi exponentielle : densité f(x) = λe^(-λx)."
  },
  {
    "titre": "Calcul de Probabilités",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Calcul de Probabilités par Intégration</h3>\n  <p style='font-size: 1.1em; line-height: 1.6;'>Pour une variable continue, la probabilité d'un événement est une <strong>aire</strong> sous la courbe de la densité.</p>\n  <div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Formules clés :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8; margin-top: 5px;'>\n      <li>\\(P(a < X \\leq b) = \\int_a^b f_X(x) \\, dx = F_X(b) - F_X(a)\\)</li>\n      <li>\\(P(X > a) = 1 - F_X(a) = \\int_a^{+\\infty} f_X(x) \\, dx\\)</li>\n      <li>\\(P(X < a) = F_X(a) = \\int_{-\\infty}^a f_X(x) \\, dx\\)</li>\n    </ul>\n  </div>\n  <div style='background: #e8f4f8; padding: 15px; border-radius: 8px; border-left: 4px solid #2980b9; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'><strong>Important :</strong> Pour une variable continue, \\(P(X = a) = 0\\), donc \\(P(X \\leq a) = P(X < a) = F_X(a)\\).</p>\n  </div>\n</div>",
    "texteParle": "Pour calculer des probabilités avec une variable continue, on utilise l'intégration de la densité. La probabilité que X soit entre a et b est l'intégrale de la densité entre a et b. C'est aussi la différence de la fonction de répartition en b et en a. La probabilité que X soit supérieur à a est 1 moins la fonction de répartition en a. N'oubliez pas que pour une variable continue, la probabilité que X soit exactement égal à a est nulle. Cela signifie qu'il n'y a pas de différence entre inférieur ou égal et strictement inférieur. C'est une spécificité des variables continues.",
    "note": "P(a < X ≤ b) = ∫ₐᵇ f(x) dx = F(b) - F(a)."
  },
  {
    "titre": "Résumé",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Résumé des Concepts Clés</h3>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6;'><strong>1. Variable aléatoire continue :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8;'>\n      <li>Prend une infinité de valeurs dans un intervalle.</li>\n      <li>\\(P(X = x) = 0\\) pour tout \\(x\\).</li>\n    </ul>\n  </div>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6;'><strong>2. Fonction de densité :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8;'>\n      <li>\\(f_X(x) \\geq 0\\).</li>\n      <li>\\(\\int_{-\\infty}^{+\\infty} f_X(x) \\, dx = 1\\).</li>\n      <li>\\(P(a \\leq X \\leq b) = \\int_a^b f_X(x) \\, dx\\).</li>\n    </ul>\n  </div>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; margin: 10px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6;'><strong>3. Fonction de répartition :</strong></p>\n    <ul style='font-size: 1.1em; line-height: 1.8;'>\n      <li>\\(F_X(x) = P(X \\leq x) = \\int_{-\\infty}^x f_X(t) \\, dt\\).</li>\n      <li>\\(f_X(x) = F_X'(x)\\).</li>\n    </ul>\n  </div>\n</div>",
    "texteParle": "Pour terminer cette leçon, faisons un résumé des points clés. Une variable aléatoire continue peut prendre une infinité de valeurs et la probabilité qu'elle prenne une valeur exacte est nulle. La fonction de densité est positive et son intégrale totale est égale à 1. La probabilité que la variable se trouve dans un intervalle est l'intégrale de la densité sur cet intervalle. La fonction de répartition est la probabilité que la variable soit inférieure ou égale à une valeur donnée. Elle est l'intégrale de la densité et sa dérivée est la densité. Ces trois concepts sont fondamentaux pour travailler avec les variables aléatoires continues. Nous les retrouverons dans les prochaines leçons avec les lois usuelles.",
    "note": "Résumé : densité f, répartition F, P(a≤X≤b) = ∫ₐᵇ f."
  },
  {
    "titre": "Exercices",
    "contenu": "<div style='font-family: Arial, sans-serif; max-width: 100%; padding: 10px; color: #333;'>\n  <h3 style='color: #2c3e50;'>Exercices d'Application</h3>\n  <div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6;'><strong>Exercice 1 :</strong> Soit \\(X\\) une variable aléatoire continue de densité \\(f(x) = c \\cdot x\\) sur \\([0,2]\\) et 0 ailleurs.</p>\n    <p style='font-size: 1.1em; line-height: 1.6; margin-top: 5px;'>a) Déterminer la constante \\(c\\).</p>\n    <p style='font-size: 1.1em; line-height: 1.6;'>b) Calculer \\(P(0.5 \\leq X \\leq 1.5)\\).</p>\n    <p style='font-size: 1.1em; line-height: 1.6;'>c) Déterminer la fonction de répartition \\(F_X\\).</p>\n  </div>\n  <div style='background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107; margin: 15px 0;'>\n    <p style='font-size: 1.1em; line-height: 1.6;'><strong>Exercice 2 :</strong> Soit \\(X\\) une variable aléatoire continue de densité \\(f(x) = \\frac{1}{2}\\) sur \\([0,2]\\).</p>\n    <p style='font-size: 1.1em; line-height: 1.6; margin-top: 5px;'>a) Quelle loi suit \\(X\\) ?</p>\n    <p style='font-size: 1.1em; line-height: 1.6;'>b) Calculer \\(P(X > 1.5)\\).</p>\n    <p style='font-size: 1.1em; line-height: 1.6;'>c) Calculer \\(F_X(1.2)\\).</p>\n  </div>\n  <div style='background: #f0f8ff; padding: 15px; border-radius: 8px; margin-top: 15px;'>\n    <p style='font-size: 1.1em; line-height: 1.6; margin: 0;'>Correction en classe. N'hésitez pas à poser des questions !</p>\n  </div>\n</div>",
    "texteParle": "Pour terminer, je vous propose deux exercices d'application. Le premier exercice concerne une variable X dont la densité est c fois x sur l'intervalle 0,2 et 0 ailleurs. Il faut d'abord déterminer la constante c pour que la densité soit une vraie densité de probabilité. Ensuite, il faut calculer la probabilité que X soit entre 0.5 et 1.5. Enfin, il faut déterminer la fonction de répartition de X. Le deuxième exercice est plus simple : X a une densité constante de 1/2 sur 0,2. Cela correspond à une loi uniforme. Il faut calculer la probabilité que X soit supérieur à 1.5, et aussi calculer la fonction de répartition en 1.2. Nous corrigerons ces exercices ensemble lors du prochain cours.",
    "note": "Exercices : déterminer c, calculer P(0.5≤X≤1.5), F(x)."

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
