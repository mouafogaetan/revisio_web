<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Bienvenue dans la Leçon 11 !",
        "contenu": "<div style='text-align: center; padding: 20px; background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%); border-radius: 15px;'><h2 style='color: #ffffff;'>Convergence de Variables Aléatoires</h2><h3 style='color: #bee3f8;'>Théorème Central-Limite (TCL)</h3><hr style='border: 1px solid #63b3ed; width: 50%;'><p style='font-size: 1.1em; color: #e2e8f0;'>Licence 2 Data Science - Université du Cameroun</p><p style='font-size: 1.1em; color: #e2e8f0;'>Enseignant : <strong style='color: #ffffff;'>Votre Nom</strong></p><div style='background: #2d3748; padding: 10px; border-radius: 10px; margin-top: 15px;'><p style='color: #e2e8f0;'>🎯 Objectif : Comprendre le théorème central-limite et ses applications</p></div></div>",
        "texteParle": "Bonjour à tous et bienvenue dans ce cours de Probabilités Approfondies. Nous sommes en Licence 2 Data Science. Aujourd'hui, nous allons aborder l'un des théorèmes les plus importants de toute la statistique : le théorème central-limite. Ce théorème explique pourquoi la loi normale est si omniprésente en statistique et en Data Science. Il est à la base de nombreux tests statistiques et intervalles de confiance.",
        "note": "Bienvenue dans la leçon sur le théorème central-limite."
    },
    {
        "titre": "Pourquoi le TCL est-il si Important ?",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px; border-left: 5px solid #3182ce;'><p style='color: #2d3748;'><strong>Le TCL est le pilier de l'inférence statistique.</strong></p></div><ul style='color: #4a5568; font-size: 0.95em; margin-top: 10px; list-style-type: disc; padding-left: 20px;'><li><strong>Que dit-il ?</strong> La moyenne d'un grand nombre de variables aléatoires indépendantes suit approximativement une loi normale.</li><li><strong>Pourquoi est-ce important ?</strong> Cela permet de faire des inférences sur des populations sans connaître leur distribution exacte.</li><li><strong>En Data Science :</strong> Base des tests d'hypothèses, des intervalles de confiance, des modèles de régression, etc.</li></ul><div style='background: #fbd38d; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #744210; margin: 0;'><strong>💡 Exemple :</strong> La moyenne des notes d'un échantillon d'étudiants suit une loi normale si l'échantillon est grand.</p></div>",
        "texteParle": "Le théorème central-limite est le pilier de l'inférence statistique. Il dit que la moyenne d'un grand nombre de variables aléatoires indépendantes suit approximativement une loi normale, quelle que soit la distribution d'origine de ces variables. Cela signifie que nous pouvons faire des inférences sur une population sans connaître sa distribution exacte. C'est pourquoi la loi normale est si importante en statistique et en Data Science.",
        "note": "Le TCL est le fondement de l'inférence statistique moderne."
    },
    {
        "titre": "Énoncé du Théorème Central-Limite",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Soit X₁, X₂, ..., Xₙ des variables aléatoires i.i.d. d'espérance μ et de variance σ² finie.</strong></p></div><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>√n (X̄ₙ - μ) / σ  →  N(0, 1)  en loi quand n → +∞</pre></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>X̄ₙ :</strong> moyenne empirique = (1/n) Σ Xᵢ.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📋 <strong>Convergence en loi :</strong> La distribution de √n (X̄ₙ - μ)/σ s'approche de N(0,1).</li></ul><div style='background: #bee3f8; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #2a4365; margin: 0;'><strong>📝 Note :</strong> Le TCL est valable pour des variables de <strong>n'importe quelle</strong> distribution (avec variance finie).</p></div>",
        "texteParle": "L'énoncé du TCL est le suivant : si nous avons des variables aléatoires indépendantes et identiquement distribuées (i.i.d.) avec une espérance μ et une variance σ² finies, alors la quantité normalisée √n (X̄ₙ - μ) / σ converge en loi vers une loi normale centrée réduite N(0,1). Cela signifie que pour n grand, la moyenne empirique X̄ₙ est approximativement normale de moyenne μ et de variance σ²/n.",
        "note": "Le TCL s'applique à toute distribution de variance finie."
    },
    {
        "titre": "Interprétation du TCL",
        "contenu": "<div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>Pour n grand, on peut approximer :</strong></p></div><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>X̄ₙ ≈ N(μ, σ²/n)</pre></div><ul style='color: #4a5568; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>Approximation :</strong> La moyenne empirique suit approximativement une loi normale.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📋 <strong>Convergence :</strong> Plus n est grand, meilleure est l'approximation.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📐 <strong>En statistique :</strong> On utilise cette approximation pour construire des intervalles de confiance et des tests.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>Exemple : Xᵢ ~ Bernoulli(p) ⇒ X̄ₙ ≈ N(p, p(1-p)/n)</pre></div>",
        "texteParle": "L'interprétation pratique du TCL est que pour un échantillon de taille n suffisamment grand, la moyenne empirique X̄ₙ est approximativement normale avec une moyenne μ et une variance σ²/n. Cette approximation est d'autant meilleure que n est grand. En pratique, on considère souvent que n ≥ 30 est suffisant, mais cela dépend de la distribution d'origine. Cette approximation est utilisée pour construire des intervalles de confiance et des tests d'hypothèses.",
        "note": "Pour n grand, la moyenne empirique est approximativement normale."
    },
    {
        "titre": "TCL pour la Somme",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Le TCL s'applique aussi à la somme Sₙ = Σ Xᵢ.</strong></p></div><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>Sₙ = X₁ + X₂ + ... + Xₙ ≈ N(nμ, nσ²)</pre></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>Equivalent :</strong> Sₙ est approximativement normale avec moyenne nμ et variance nσ².</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📋 <strong>Utilité :</strong> Modélisation de processus de comptage (loi binomiale, Poisson).</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>Exemple : Binomiale(n, p) ≈ N(np, np(1-p))</pre></div><div style='background: #bee3f8; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #2a4365; margin: 0;'><strong>📝 Note :</strong> L'approximation normale de la binomiale est bonne si np ≥ 5 et n(1-p) ≥ 5.</p></div>",
        "texteParle": "Le TCL s'applique également à la somme Sₙ = X₁ + X₂ + ... + Xₙ. Pour n grand, Sₙ suit approximativement une loi normale de moyenne nμ et de variance nσ². C'est particulièrement utile pour approximer des lois discrètes comme la loi binomiale par une loi normale. Par exemple, Binomiale(n, p) ≈ N(np, np(1-p)) lorsque n est grand et que p n'est pas trop proche de 0 ou 1.",
        "note": "La somme de variables aléatoires est approximativement normale pour n grand."
    },
    {
        "titre": "Conditions d'Application du TCL",
        "contenu": "<div style='background: #edf2f7; padding: 15px; border-radius: 10px;'><p style='color: #2d3748;'><strong>Le TCL a des conditions à respecter :</strong></p></div><ul style='color: #4a5568; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>1. <strong>Indépendance :</strong> Les variables Xᵢ doivent être indépendantes.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>2. <strong>Même distribution :</strong> Les variables doivent être identiquement distribuées (i.i.d.) dans la version de base.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>3. <strong>Variance finie :</strong> σ² < ∞ (la variance doit être finie).</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>4. <strong>n suffisamment grand :</strong> La qualité de l'approximation dépend de n.</li></ul><div style='background: #fed7d7; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #742a2a; margin: 0;'><strong>⚠️ Attention :</strong> Si les variables sont trop asymétriques, il faut un n plus grand.</p></div>",
        "texteParle": "Le TCL a des conditions d'application. Les variables doivent être indépendantes. Dans sa version de base, elles doivent être identiquement distribuées. La variance doit être finie. Et n doit être suffisamment grand. En pratique, n ≥ 30 est souvent considéré comme acceptable, mais cela dépend de la distribution. Plus les variables sont asymétriques, plus n doit être grand pour que l'approximation soit bonne.",
        "note": "Les conditions d'application du TCL sont importantes à connaître."

    {
        "titre": "TCL et Loi des Grands Nombres",

        "texteParle": "Le TCL complète la loi des grands nombres. La LGN nous dit que X̄ₙ converge vers μ. Le TCL nous dit comment X̄ₙ fluctue autour de μ : l'erreur √n(X̄ₙ - μ) suit une loi normale. La LGN est utile pour l'estimation, le TCL est utile pour l'inférence (intervalles de confiance, tests). Ce sont deux théorèmes complémentaires, les deux piliers de la statistique asymptotique.",
        "note": "La LGN dit où converge la moyenne, le TCL dit comment elle fluctue."
    },
    {
        "titre": "Application : Intervalle de Confiance pour la Moyenne",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Le TCL permet de construire des intervalles de confiance.</strong></p></div><ul style='color: #2d3748; margin-top: 10px;'><li>On sait que X̄ₙ ≈ N(μ, σ²/n).</li><li>Un intervalle de confiance à 95% pour μ est :</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>[ X̄ₙ - 1.96 × σ/√n ; X̄ₙ + 1.96 × σ/√n ]</pre></div><ul style='color: #4a5568; margin-top: 10px;'><li>1.96 est le quantile 97.5% de la loi normale centrée réduite.</li><li>En pratique, on remplace σ par l'écart-type empirique s si σ est inconnu.</li></ul>",
        "texteParle": "Une application majeure du TCL est la construction d'intervalles de confiance pour la moyenne. Puisque X̄ₙ est approximativement normal, on sait qu'avec une probabilité de 95%, la vraie moyenne μ se trouve dans l'intervalle X̄ₙ ± 1.96 × σ/√n. C'est la base de l'inférence statistique. En pratique, si σ est inconnu, on le remplace par l'écart-type empirique s de l'échantillon.",
        "note": "Le TCL est la base des intervalles de confiance pour la moyenne."
    },
    {
        "titre": "Application : Test d'Hypothèse",
        "contenu": "<div style='background: #fefcbf; padding: 15px; border-radius: 10px;'><p style='color: #744210;'><strong>Le TCL est la base des tests d'hypothèses.</strong></p></div><ul style='color: #4a5568; margin-top: 10px;'><li>On veut tester H₀ : μ = μ₀ contre H₁ : μ ≠ μ₀.</li><li>Sous H₀, la statistique de test est :</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>Z = (X̄ₙ - μ₀) / (σ/√n) ≈ N(0, 1)</pre></div><ul style='color: #4a5568; margin-top: 10px;'><li>On rejette H₀ si |Z| > 1.96 (pour α = 5%).</li><li>La p-value se calcule à partir de la loi normale.</li></ul><div style='background: #bee3f8; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #2a4365; margin: 0;'><strong>📝 Note :</strong> C'est le test Z, valable pour n grand (ou σ connu).</p></div>",
        "texteParle": "Le TCL est également la base des tests d'hypothèses. Par exemple, pour tester si la moyenne μ est égale à une valeur μ₀, on calcule la statistique Z = (X̄ₙ - μ₀) / (σ/√n). Sous l'hypothèse nulle, Z suit approximativement une loi normale centrée réduite. On rejette H₀ si |Z| est trop grand. C'est le test Z, que vous utiliserez fréquemment en statistique.",

    {
        "titre": "TCL pour des Variables Non Identiquement Distribuées",
        "contenu": "<div style='background: #c6f6d5; padding: 15px; border-radius: 10px;'><p style='color: #22543d;'><strong>Il existe des versions généralisées du TCL.</strong></p></div><ul style='color: #2d3748; margin-top: 10px; list-style-type: none; padding-left: 0;'><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📊 <strong>Condition de Lindeberg :</strong> Permet d'appliquer le TCL à des variables non identiquement distribuées.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📋 <strong>Intuition :</strong> Aucune variable ne domine la somme.</li><li style='background: #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px;'>📐 <strong>Utilité :</strong> Modèles de régression, séries temporelles.</li></ul><div style='background: #1a202c; padding: 15px; border-radius: 8px; margin-top: 10px;'><pre style='color: #68d391; font-family: monospace; margin: 0;'>Théorème de Lindeberg-Feller :<br>Si les variances σᵢ² sont finies et si max(σᵢ² / Σσⱼ²) → 0, alors le TCL s'applique.</pre></div>",
        "texteParle": "Il existe des versions généralisées du TCL pour des variables qui ne sont pas identiquement distribuées. La condition de Lindeberg-Feller permet de dire que la somme normalisée converge vers une loi normale si aucune variable ne domine la somme (c'est-à-dire si les variances sont toutes petites par rapport à la somme des variances). C'est utile en régression linéaire ou en séries temporelles.",

    {

        "contenu": "<div style='background: #e2e8f0; padding: 15px; border-radius: 10px;'><ul style='color: #2d3748; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 10px;'>✅ <strong>Énoncé :</strong> √n (X̄ₙ - μ)/σ → N(0,1) en loi.</li><li style='margin-bottom: 10px;'>✅ <strong>Approximation :</strong> X̄ₙ ≈ N(μ, σ²/n) pour n grand.</li><li style='margin-bottom: 10px;'>✅ <strong>Conditions :</strong> i.i.d., variance finie, n grand.</li><li style='margin-bottom: 10px;'>✅ <strong>Applications :</strong> Intervalles de confiance, tests Z, approximation de lois.</li><li style='margin-bottom: 10px;'>✅ <strong>Généralisation :</strong> TCL pour variables non i.i.d. (Lindeberg).</li></ul></div><div style='background: #3182ce; padding: 15px; border-radius: 8px; margin-top: 15px;'><p style='color: white; text-align: center; font-size: 1.1em;'>📊 Le TCL est le théorème le plus important de la statistique.</p></div>",
        "texteParle": "Pour résumer, le TCL est le théorème fondamental qui justifie l'utilisation de la loi normale en statistique. Il nous dit que la moyenne empirique de variables i.i.d. de variance finie est approximativement normale pour n grand. Ses applications sont innombrables : intervalles de confiance, tests d'hypothèses, approximation de lois discrètes. C'est un théorème que vous utiliserez constamment en Data Science.",

        "texteParle": "Félicitations pour cette leçon ! Vous avez maintenant les bases du théorème central-limite. Ce théorème est au cœur de la statistique inférentielle et vous l'utiliserez constamment en Data Science pour construire des intervalles de confiance et des tests d'hypothèses. La prochaine fois, nous verrons des théorèmes limites plus avancés. Merci pour votre attention et à bientôt !",

];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });

        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {

            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
