<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;

    }

        color: #4a5568 !important;

</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Distributions Stationnaires",
    "contenu": "<div style='text-align: center; padding: 20px 10px;'><h2 style='color: #1a237e; font-size: 1.8em;'>Distributions Stationnaires</h2><p style='font-size: 1.2em; color: #333;'>Lesson 15 - Chaînes de Markov à Temps Discret</p><div style='background: #e3f2fd; padding: 15px; border-radius: 12px; margin: 20px 0;'><p style='font-size: 1.1em; color: #0d47a1; margin: 0;'>Objectifs : Distribution stationnaire, convergence, absorption, théorème ergodique</p></div><p style='color: #555; font-size: 0.95em;'>Licence 2 Data Science - Probabilités Approfondies</p></div>",
    "texteParle": "Bienvenue à tous. Dans cette leçon, nous allons étudier les distributions stationnaires des chaînes de Markov à temps discret. Une distribution stationnaire est une distribution de probabilité qui reste inchangée après une transition de la chaîne. C'est un concept fondamental car il permet de comprendre le comportement à long terme des chaînes de Markov. Nous verrons comment la déterminer, comment la chaîne converge vers cette distribution, et comment calculer les probabilités d'absorption.",
    "note": "La distribution stationnaire est essentielle pour l'étude du comportement asymptotique des chaînes de Markov."
  },
  {
    "titre": "Définition d'une Distribution Stationnaire",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Qu'est-ce qu'une Distribution Stationnaire ?</h3><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Définition</p><p style='color: #1b5e20; margin: 5px 0;'>Une distribution de probabilité <span style='font-weight: bold;'>π</span> = (πᵢ) sur l'espace d'états E est dite <span style='font-weight: bold;'>stationnaire</span> si :</p><div class='math-block' style='background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\pi = \\pi P$$</div></div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Interprétation</p><ul style='color: #0d47a1; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• π est invariante sous la transition de la chaîne</li><li>• Si X₀ ∼ π, alors X₁ ∼ π, X₂ ∼ π, ...</li><li>• La chaîne est alors stationnaire (au sens strict)</li></ul></div><div style='background: #fff8e1; padding: 10px; border-radius: 8px;'><p style='color: #e65100; font-size: 0.95em; margin: 0;'>Exemple : Pour une chaîne à 2 états, π = (π₀, π₁) vérifie π₀ = π₀p₀₀ + π₁p₁₀ et π₁ = π₀p₀₁ + π₁p₁₁</p></div></div>",
    "texteParle": "Une distribution stationnaire est une distribution de probabilité sur les états de la chaîne qui reste inchangée après une transition. Mathématiquement, elle vérifie l'équation π égale π fois P. Cela signifie que si la chaîne démarre avec la distribution π, elle aura la même distribution à chaque étape. C'est une notion d'équilibre pour la chaîne de Markov. Par exemple, pour une chaîne à deux états, la distribution stationnaire est obtenue en résolvant un petit système d'équations.",
    "note": "π = πP est l'équation fondamentale des distributions stationnaires."
  },
  {
    "titre": "Calcul de la Distribution Stationnaire",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Comment Calculer π ?</h3><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #c62828; font-weight: bold; margin: 0;'>Méthode</p><ol style='color: #b71c1c; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>Résoudre le système linéaire : π = πP</li><li>Ajouter la contrainte de normalisation : ∑πᵢ = 1</li><li>La solution est la distribution stationnaire</li></ol></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Cas Particulier : Chaîne Irréductible</p><p style='color: #1b5e20; font-size: 0.95em;'>Si la chaîne est irréductible, la distribution stationnaire est unique.</p></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Condition de Réversibilité (Bilan Détaillé)</p><div class='math-block' style='background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\pi_i P_{ij} = \\pi_j P_{ji} \\quad \\forall i, j$$</div></div><p style='color: #0d47a1; font-size: 0.95em;'>Si cette condition est vérifiée, π est stationnaire.</p></div></div>",
    "texteParle": "Pour calculer la distribution stationnaire, on résout le système d'équations π égale π fois P, avec la condition que la somme des probabilités soit égale à un. Si la chaîne est irréductible, c'est-à-dire qu'elle peut passer d'un état à un autre, alors la distribution stationnaire est unique. Il y a aussi une condition plus simple appelée condition de réversibilité ou bilan détaillé : π_i fois P_ij égale π_j fois P_ji. Si cette condition est vérifiée pour toutes les paires d'états, alors π est stationnaire.",
    "note": "La réversibilité est une condition suffisante pour la stationnarité."
  },
  {
    "titre": "Théorème de Convergence vers la Stationnarité",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Convergence vers la Distribution Stationnaire</h3><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Théorème de Convergence</p><p style='color: #1b5e20; font-size: 0.95em;'>Soit une chaîne de Markov <span style='font-weight: bold;'>irréductible et apériodique</span> de matrice de transition P et de distribution stationnaire π. Alors, pour tout état initial i :</p><div class='math-block' style='background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$P^n_{ij} \\longrightarrow \\pi_j \\quad \\text{lorsque } n \\to \\infty$$</div></div></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #e65100; font-weight: bold; margin: 0;'>Conditions</p><ul style='color: #e65100; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• <span style='font-weight: bold;'>Irréductible</span> : un seul classe de communication</li><li>• <span style='font-weight: bold;'>Apériodique</span> : pas de période > 1</li></ul></div><div style='background: #fce4ec; padding: 10px; border-radius: 8px;'><p style='color: #c62828; font-size: 0.95em; margin: 0;'>Interprétation : Quelle que soit la distribution initiale, la distribution de Xₙ tend vers π quand n devient grand.</p></div></div>",
    "texteParle": "Le théorème de convergence est un résultat fondamental. Il dit que pour une chaîne de Markov irréductible et apériodique, la probabilité d'être dans un état j après n étapes, notée P puissance n indice ij, tend vers π indice j lorsque n tend vers l'infini. Autrement dit, quelle que soit la distribution initiale, la chaîne finit par oublier son passé et se rapproche de la distribution stationnaire. Deux conditions sont nécessaires : la chaîne doit être irréductible, c'est-à-dire qu'elle peut atteindre tous les états, et apériodique, c'est-à-dire qu'elle ne revient pas périodiquement à ses états.",
    "note": "La convergence nécessite irréductibilité et apériodicité."
  },
  {
    "titre": "Théorème Ergodique",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Théorème Ergodique</h3><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Convergence de la Moyenne Empirique</p><p style='color: #0d47a1; font-size: 0.95em;'>Si la chaîne est irréductible et admet une distribution stationnaire π, alors pour toute fonction f intégrable :</p><div class='math-block' style='background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$\\frac{1}{n} \\sum_{k=1}^n f(X_k) \\xrightarrow[n \\to \\infty]{p.s.} \\sum_{i \\in E} f(i) \\pi_i = E_{\\pi}[f(X)]$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Interprétation</p><ul style='color: #1b5e20; font-size: 0.95em; padding-left: 20px; margin: 5px 0;'><li>• La moyenne temporelle converge vers la moyenne spatiale</li><li>• Permet d'estimer π par simulation de la chaîne</li><li>• C'est la base des méthodes MCMC</li></ul></div><div style='background: #fff8e1; padding: 10px; border-radius: 8px;'><p style='color: #e65100; font-size: 0.95em; margin: 0;'>Exemple : La proportion de temps passé dans l'état j est πⱼ</p></div></div>",
    "texteParle": "Le théorème ergodique est une version plus forte du théorème de convergence. Il dit que la moyenne temporelle d'une fonction le long d'une trajectoire de la chaîne converge vers la moyenne sous la distribution stationnaire. Autrement dit, le temps passé par la chaîne dans un état est proportionnel à la probabilité stationnaire de cet état. Ce théorème est très important car il permet d'estimer la distribution stationnaire en simulant simplement la chaîne. C'est le principe de base des méthodes MCMC, qui sont très utilisées en statistique bayésienne.",
    "note": "Le théorème ergodique permet d'estimer π par simulation."
  },
  {
    "titre": "Probabilités d'Absorption",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Probabilités d'Absorption</h3><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #c62828; font-weight: bold; margin: 0;'>Définition</p><p style='color: #b71c1c; font-size: 0.95em;'>Pour une chaîne avec des états absorbants, la probabilité d'absorption est la probabilité d'être absorbé par un état donné.</p></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Calcul</p><p style='color: #0d47a1; font-size: 0.95em;'>Soit aᵢ = probabilité d'absorption par un état absorbant particulier, en partant de i. Alors :</p><div class='math-block' style='background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$a_i = \\sum_{j} P_{ij} a_j$$</div></div><p style='color: #0d47a1; font-size: 0.95em;'>Avec conditions aux limites : aⱼ = 1 si j est l'état absorbant cible, 0 sinon.</p></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 0.95em; margin: 0;'>Exemple : Dans un jeu de hasard, probabilité de ruine ou de gain.</p></div></div>",
    "texteParle": "Dans certaines chaînes de Markov, il existe des états absorbants, c'est-à-dire des états où la chaîne reste une fois atteinte. La probabilité d'absorption est la probabilité d'être absorbé par un état donné, en partant d'un autre état. Pour calculer ces probabilités, on résout un système d'équations linéaires où la probabilité de partir d'un état i est la moyenne des probabilités des états voisins. Les conditions aux limites sont simples : la probabilité est de 1 si on est déjà dans l'état absorbant cible, et de 0 pour les autres états absorbants.",
    "note": "Les probabilités d'absorption se calculent par un système linéaire."

  {
    "titre": "Exemple 1 : Chaîne à 2 États",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Exemple : Chaîne à 2 États</h3><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Matrice de Transition</p><div class='math-block' style='background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$P = \\begin{pmatrix} 0.7 & 0.3 \\\\ 0.4 & 0.6 \\end{pmatrix}$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1b5e20; font-weight: bold; margin: 0;'>Résolution</p><p style='color: #1b5e20; font-size: 0.95em;'>On cherche π = (π₀, π₁) tel que π = πP et π₀ + π₁ = 1.</p><p style='color: #1b5e20; font-size: 0.95em;'>π₀ = 0.7π₀ + 0.4π₁ → 0.3π₀ = 0.4π₁ → π₁ = 0.75π₀</p><p style='color: #1b5e20; font-size: 0.95em;'>π₀ + 0.75π₀ = 1 → π₀ = 1/1.75 ≈ 0.571, π₁ ≈ 0.429</p></div><div style='background: #fff8e1; padding: 10px; border-radius: 8px;'><p style='color: #e65100; font-size: 0.95em; margin: 0;'>La distribution stationnaire est π ≈ (0.571, 0.429)</p></div></div>",
    "texteParle": "Prenons un exemple simple avec deux états. La matrice de transition P est donnée par 0.7 pour rester dans l'état zéro, 0.3 pour passer à l'état un, 0.4 pour passer de un à zéro, et 0.6 pour rester dans l'état un. Pour trouver la distribution stationnaire, on résout le système π égale π fois P avec la condition que la somme des probabilités est égale à un. Les équations donnent une relation entre π zéro et π un. On obtient π zéro environ 0.571 et π un environ 0.429. Ainsi, à long terme, la chaîne passe environ 57 pour cent du temps dans l'état zéro et 43 pour cent dans l'état un.",
    "note": "La distribution stationnaire donne la proportion de temps passé dans chaque état."

  {

    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a237e;'>Exemple : Chaîne à 3 États</h3><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #0d47a1; font-weight: bold; margin: 0;'>Matrice de Transition</p><div class='math-block' style='background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$P = \\begin{pmatrix} 0.2 & 0.5 & 0.3 \\\\ 0.4 & 0.1 & 0.5 \\\\ 0.1 & 0.6 & 0.3 \\end{pmatrix}$$</div></div></div><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #c62828; font-weight: bold; margin: 0;'>Vérification de la Réversibilité</p><p style='color: #b71c1c; font-size: 0.95em;'>On peut vérifier si πᵢPᵢⱼ = πⱼPⱼᵢ pour toutes les paires.</p></div><div style='background: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 0.95em; margin: 0;'>À vous de jouer : Résoudre le système pour trouver π !</p></div></div>",
    "texteParle": "Prenons maintenant un exemple avec trois états. La matrice de transition est donnée. Pour trouver la distribution stationnaire, on résout le système de trois équations π égale π fois P avec la contrainte que la somme des probabilités soit égale à un. La solution de ce système donne la distribution stationnaire. On peut aussi vérifier la condition de réversibilité en testant si π_i fois P_ij est égal à π_j fois P_ji pour toutes les paires. Si cette condition est vérifiée, la distribution stationnaire est réversible, ce qui simplifie souvent les calculs.",

    "texteParle": "Les distributions stationnaires ont de nombreuses applications en Data Science. La première est les méthodes MCMC, qui consistent à simuler une chaîne de Markov dont la distribution stationnaire est la distribution que l'on souhaite étudier. Le théorème ergodique permet alors d'estimer des quantités d'intérêt. La deuxième application célèbre est le PageRank de Google, où la distribution stationnaire d'une chaîne modélisant la navigation aléatoire sur le web donne l'importance des pages. Enfin, dans les modèles de files d'attente, la distribution stationnaire décrit le régime permanent du système.",

    "texteParle": "Pour conclure, retenez les points essentiels. La distribution stationnaire est caractérisée par l'équation π égale π fois P. Si la chaîne est irréductible, cette distribution est unique. La convergence vers la stationnarité nécessite que la chaîne soit irréductible et apériodique. Le théorème ergodique permet de remplacer des moyennes temporelles par des moyennes sous la distribution stationnaire, ce qui est très utile pour les simulations. Enfin, les probabilités d'absorption se calculent en résolvant un système linéaire. Ces concepts sont fondamentaux pour de nombreuses applications en Data Science.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
