<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Éthique, Gouvernance et Conformité - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Evaluation Sequentielle n°1",
  "anneeScolaire": "2025-2026",
  "consignesGenerales": "<div style='font-size:1.1rem; color:#2c3e50;'><p>Durée : 2h00. Toute documentation est interdite. La qualité de la rédaction, la clarté du raisonnement et la rigueur des concepts seront évaluées.</p><p><strong>Barème indicatif :</strong></p><ul><li>Exercice 1 : 5 points</li><li>Exercice 2 : 8 points</li><li>Exercice 3 : 7 points</li></ul></div>",
  "exercices": [
    {
      "titre": "Dissertation : Fondements et défis d'une Data Science éthique",
      "points": "5 pts",
      "enonce": "<div style='font-size:1.1rem;'><p><strong>Sujet :</strong> <em>\"Face aux défis posés par le développement rapide de l'intelligence artificielle et des données massives, l'intégration de l'éthique dans la pratique du Data Scientist est-elle un frein à l'innovation ou une condition nécessaire à la confiance et à la performance ?\"</em></p><p>Pour répondre à cette question, vous construirez une argumentation structurée en mobilisant les concepts clés abordés dans les <strong>leçons 1 à 4</strong>.</p><p><strong>Votre dissertation devra :</strong></p><ol><li><strong>Définir</strong> les concepts fondamentaux : éthique, déontologie et conformité légale.</li><li><strong>Identifier et expliquer</strong> les grands enjeux éthiques de la Data Science (biais, équité, transparence, responsabilité).</li><li><strong>Discuter</strong> de l'impact de ces enjeux sur les différentes parties prenantes (citoyens, entreprises, régulateurs).</li><li><strong>Proposer</strong> une position personnelle et argumentée sur la question posée.</li></ol></div>",
      "questions": [
        {
          "question": "Rédigez votre dissertation sur le sujet proposé.",
          "reponse": "<p><strong>Éléments de correction clés :</strong></p><ul><li><strong>Introduction :</strong> Accroche sur l'essor de l'IA, définition des termes, annonce du plan (oui, l'éthique est un frein vs non, c'est un levier de confiance).</li><li><strong>Partie 1 - Les risques : l'éthique comme garde-fou nécessaire :</strong> <ul><li>Définition éthique (morale), déontologie (règles professionnelles), conformité (loi, RGPD).</li><li>Biais algorithmiques (origine : données, conception, société) et discriminations (exemple COMPAS).</li><li>Manque de transparence et problématique des boîtes noires (XAI).</li><li>Enjeux de responsabilité (qui est responsable ?).</li></ul></li><li><strong>Partie 2 - Les opportunités : l'éthique comme facteur de performance et d'innovation :</strong> <ul><li>Construction de la confiance des utilisateurs.</li><li>Atténuation des risques juridiques et réputationnels.</li><li>Conception d'IA équitable (fairness) et performante.</li><li>L'éthique comme différenciateur concurrentiel.</li></ul></li><li><strong>Conclusion :</strong> Synthèse des arguments, affirmation que l'éthique n'est pas un frein mais un cadre essentiel pour une IA durable et responsable, ouvrant sur l'avenir (AI Act).</li></ul>"
        }
      ]
    },
    {
      "titre": "Étude de cas : Audit Éthique d'un système de recrutement",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1rem;'> <p><strong>Contexte :</strong> <em>La société camerounaise de services numériques \"DataRecruit SARL\"</em> a développé une solution d'IA pour aider les entreprises à présélectionner des candidats. Le système analyse les CV, les lettres de motivation et les profils LinkedIn. Il attribue un score aux candidats sur une échelle de 1 à 100.</p> <p>Vous êtes le responsable conformité et éthique de DataRecruit. Vous devez auditer ce système avant sa mise sur le marché. Vos analyses révèlent les informations suivantes :</p> <ul><li><strong>Données d'entraînement :</strong> Le modèle a été entraîné sur les CV et parcours des 500 derniers employés d'une grande banque camerounaise, où l'équipe dirigeante est majoritairement composée d'hommes.</li><li><strong>Performance :</strong> Le modèle est précis pour les hommes (taux de rappel de 95%), mais pour les femmes, il attribue des scores plus bas pour des profils similaires (taux de rappel de 70%).</li><li><strong>Technique :</strong> Le modèle est un réseau de neurones complexe. Les développeurs ne savent pas exactement pourquoi il favorise certains mots-clés.</li><li><strong>Protection des données :</strong> L'entreprise stocke les données personnelles des candidats (nom, prénom, genre, photo) sans avoir mis en place de processus de pseudonymisation.</li></ul> <p><strong>Votre mission :</strong> Réalisez un audit éthique complet en répondant aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<strong>1. Analyse du Contexte (2 pts)</strong><br>Définissez et identifiez les parties prenantes de ce système d'IA. Expliquez les intérêts de chaque partie.",
          "reponse": "<p><strong>Définition :</strong> Les parties prenantes sont les personnes ou groupes dont les intérêts sont affectés par le système.</p><p><strong>Identification :</strong></p><ul><li><strong>Les candidats (hommes et femmes)</strong> : Leur avenir professionnel est en jeu. Ils ont droit à un traitement équitable et non discriminatoire.</li><li><strong>Les entreprises clientes :</strong> Elles souhaitent un outil efficace pour trouver les meilleurs talents, mais elles ont aussi un intérêt à protéger leur réputation et à se conformer à la loi.</li><li><strong>DataRecruit SARL :</strong> Elle a un intérêt commercial à vendre son produit, mais aussi un intérêt éthique et juridique à garantir que son outil ne cause pas de tort.</li><li><strong>Les régulateurs (ANTIC, CNIL) :</strong> Ils veillent au respect de la vie privée et à la non-discrimination.</li></ul>"
        },
        {
          "question": "<strong>2. Identification des Risques (2 pts)</strong><br>Identifiez les risques éthiques potentiels de ce système. Distinguez-les par leur source (données, conception, sociétale).",
          "reponse": "<p><strong>Risques identifiés :</strong></p><ul><li><strong>Source : Données :</strong> <ul><li><strong>Biais historique :</strong> Les données reflètent un passé où les femmes étaient sous-représentées dans les postes à responsabilité. Le modèle apprendra à perpétuer cette inégalité.</li><li><strong>Biais de représentation :</strong> L'échantillon n'est pas représentatif du vivier de talents actuel.</li></ul></li><li><strong>Source : Conception :</strong><ul><li><strong>Biais algorithmique :</strong> Le choix du réseau de neurones complexe crée une \"boîte noire\". Il est impossible de comprendre le poids des critères, ce qui peut cacher des discriminations.</li><li><strong>Score unique :</strong> La réduction du potentiel humain à un score unique est réductrice et peut être injuste.</li></ul></li><li><strong>Source : Sociétale :</strong><ul><li><strong>Discrimination systémique :</strong> En excluant les femmes, le système renforce les inégalités sociales existantes.</li><li><strong>Défiance :</strong> L'opacité du modèle peut engendrer une perte de confiance envers la technologie et les entreprises.</li><li><strong>Non-conformité :</strong> Violation potentielle des lois sur la protection des données (RGPD, loi camerounaise) en l'absence de pseudonymisation.</li></ul></li></ul>"
        },
        {
          "question": "<strong>3. Mesure des Biais (2 pts)</strong><br>Expliquez le concept de <em>Disparate Impact</em>. En vous basant sur les données de performance fournies, calculez et interprétez le <em>Disparate Impact</em> de ce système.",
          "reponse": "<p><strong>Définition du Disparate Impact :</strong> C'est une mesure statistique de l'équité. Elle compare le taux de sélection (ou de prédiction positive) d'un groupe défavorisé par rapport à un groupe favorisé. <div class='math-block' style='background:#2c3e50; color:#ecf0f1; padding:12px; border-radius:8px; margin:10px 0;'><div class='math' style='font-size:1.1rem;'>$$\\text{Disparate Impact} = \\frac{\\text{Taux de sélection du groupe défavorisé}}{\\text{Taux de sélection du groupe favorisé}}$$</div></div></p><p><strong>Application au cas :</strong></p><ul><li>Nous savons que le taux de rappel pour les hommes est de 95%. Cela peut être assimilé à leur taux de sélection.</li><li>Le taux de rappel pour les femmes est de 70%, assimilable à leur taux de sélection.</li><li><div class='math-block' style='background:#2c3e50; color:#ecf0f1; padding:12px; border-radius:8px; margin:10px 0;'><div class='math' style='font-size:1.1rem;'>$$\\text{Disparate Impact} = \\frac{0.70}{0.95} \\approx 0.737$$</div></div></li><li><strong>Interprétation :</strong> Le taux de sélection est de 73,7% pour les femmes par rapport aux hommes. Le seuil généralement accepté pour un risque de discrimination est de <strong>0.80 (ou 80%)</strong>. Un score de 0.737 indique <strong>une forte présomption de discrimination</strong> à l'encontre des candidates féminines.</li></ul>"
        },
        {
          "question": "<strong>4. Recommandations (2 pts)</strong><br>Proposez des recommandations concrètes (techniques et organisationnelles) pour corriger les problèmes identifiés.",
          "reponse": "<p><strong>Recommandations :</strong></p><ul><li><strong>Solutions Techniques (Mitigation) :</strong><ul><li><strong>Prétraitement :</strong> Rééquilibrer le jeu de données en enrichissant avec des profils de femmes ou en corrigeant les poids des échantillons.</li><li><strong>In-processing :</strong> Ajouter une contrainte d'équité (comme l'<em>equalized odds</em>) dans l'algorithme d'apprentissage.</li><li><strong>Post-traitement :</strong> Ajuster les scores finaux pour garantir un taux de sélection équitable entre les groupes.</li><li><strong>Explicabilité :</strong> Utiliser des techniques comme SHAP ou LIME pour tenter d'expliquer les prédictions du réseau de neurones.</li></ul></li><li><strong>Solutions Organisationnelles :</strong><ul><li><strong>Pseudonymisation :</strong> Supprimer ou coder les données directement identifiantes (genre, nom) pour éviter que le modèle ne s'en saisisse comme critère.</li><li><strong>Gouvernance :</strong> Mettre en place un comité d'éthique interne pour valider le modèle avant son déploiement.</li><li><strong>Audit continu :</strong> Assurer une surveillance du modèle après son lancement pour détecter des dérives de performance ou des biais.</li><li><strong>Transparence :</strong> Communiquer clairement aux candidats l'utilisation de l'IA et leurs droits (droit d'accès, de rectification).</li></ul></li></ul>"
        }
      ]
    },
    {
      "titre": "QCM : Conformité (RGPD) et Gouvernance",
      "points": "7 pts",
      "enonce": "<div style='font-size:1.1rem;'><p>Cochez la ou les bonnes réponses pour chaque question. Les questions à choix multiples peuvent avoir plusieurs réponses correctes.</p></div>",
      "questions": [
        {
          "question": "<strong>1. (1 pt)</strong> Selon le RGPD, le principe de <em>minimisation des données</em> signifie que :<br>A. Seules les données strictement nécessaires à la finalité du traitement doivent être collectées.<br>B. Les données doivent être conservées sous une forme permettant l'identification des personnes concernées pour une durée n'excédant pas celle nécessaire.<br>C. Toutes les données doivent être pseudonymisées, quel que soit le traitement.<br>D. Il est interdit de collecter des données personnelles sensibles.",
          "reponse": "<p><strong>Réponses correctes : A et B.</strong></p><ul><li><strong>A. Correcte :</strong> C'est la définition du principe de minimisation des données (article 5-1.c du RGPD).</li><li><strong>B. Correcte :</strong> C'est la définition du principe de limitation de la conservation (article 5-1.e). Bien que distinct, il est souvent associé à la minimisation.</li><li><strong>C. Incorrecte :</strong> La pseudonymisation est une mesure de sécurité recommandée, mais pas une obligation pour tous les traitements.</li><li><strong>D. Incorrecte :</strong> Les données sensibles peuvent être collectées si elles sont nécessaires et si des garanties appropriées sont mises en place (consentement explicite, etc.).</li></ul>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
