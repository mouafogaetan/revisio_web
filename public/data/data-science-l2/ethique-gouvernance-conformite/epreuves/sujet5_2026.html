<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Éthique, Gouvernance et Conformité - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Evaluation Sequentielle n°5",
  "anneeScolaire": "2025-2026",
  "consignesGenerales": "<div style='font-size:1.1rem; color:#2c3e50;'><p>Durée : 2h00. Toute documentation est interdite. La qualité de la rédaction, la clarté du raisonnement et la rigueur des concepts seront évaluées.</p><p><strong>Barème indicatif :</strong></p><ul><li>Exercice 1 : 6 points</li><li>Exercice 2 : 7 points</li><li>Exercice 3 : 7 points</li></ul></div>",
  "exercices": [
    {
      "titre": "Audit Éthique et Gouvernance d'un Système de Notation de Crédit",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1rem;'> <p><strong>Contexte :</strong> <em>La société camerounaise de services financiers \"ScoreCredit S.A\"</em> a développé un système d'IA pour évaluer la solvabilité des clients des banques partenaires. Le système analyse les données des clients (âge, profession, revenus, historique de crédit, localisation géographique) et attribue un score de crédit entre 0 et 1000, utilisé par les banques pour accorder ou refuser des prêts.</p> <p><strong>Analyse préliminaire :</strong> Vous êtes le responsable éthique et conformité de ScoreCredit. Vous devez auditer ce système avant son déploiement à grande échelle. Vos analyses révèlent :</p> <ul><li><strong>Données d'entraînement :</strong> Historique des prêts des 5 dernières années, avec un biais géographique : 85% des prêts accordés concernent des clients de la région de Douala et Yaoundé, négligeant les zones rurales.</li><li><strong>Performance :</strong> Le taux d'approbation des prêts est de 68% pour les clients des zones urbaines contre 42% pour les zones rurales, à profils identiques.</li><li><strong>Risques identifiés :</strong> Potentiel biais géographique et socio-économique, opacité des décisions (modèle de type \"boîte noire\"), questions sur la conformité au RGPD (collecte de données personnelles).</li><li><strong>Cadre réglementaire :</strong> Le projet est soumis au RGPD (pour les clients européens) et à la loi camerounaise sur la protection des données.</li></ul> </div>",
      "questions": [
        {
          "question": "<strong>1. Analyse du Contexte et des Parties Prenantes (1.5 pt)</strong><br>Identifiez et décrivez les principales parties prenantes de ce système. Expliquez leurs intérêts respectifs et les risques qu'elles encourent en cas de défaillance éthique du système.",
          "reponse": "<p><strong>Parties prenantes et leurs intérêts :</strong></p><ul><li><strong>Les clients/emprunteurs</strong> : Intérêt à obtenir un accès équitable au crédit, à ne pas être discriminés sur la base de leur lieu de résidence ou de leur profil socio-économique. Risque : exclusion financière, renforcement des inégalités sociales.</li><li><strong>Les banques partenaires</strong> : Intérêt à minimiser les risques de défaut de paiement, mais aussi à maintenir une bonne réputation et à respecter les obligations légales. Risque : perte de confiance des clients, sanctions réglementaires.</li><li><strong>ScoreCredit S.A</strong> : Intérêt commercial à vendre son produit, à démontrer son efficacité et sa conformité. Risque : perte de marché, atteinte à la réputation, amendes.</li><li><strong>Les régulateurs (ANTIC, CNIL, autorités bancaires)</strong> : Intérêt à protéger les consommateurs, à garantir l'équité et la transparence du système financier. Risque : perte de crédibilité de la régulation.</li><li><strong>La société civile</strong> : Intérêt à ce que les technologies financières ne creusent pas les inégalités. Risque : exclusion des populations rurales et vulnérables.</li></ul>"
        },
        {
          "question": "<strong>2. Identification des Risques Éthiques (1.5 pt)</strong><br>Distinguez et détaillez les sources potentielles de biais dans ce système (source : données, conception, sociétale). Classez chaque risque par catégorie et expliquez ses conséquences.",
          "reponse": "<p><strong>Risques identifiés :</strong></p><ul><li><strong>Source : Données (Biais de représentation)</strong><ul><li><strong>Description :</strong> Les données d'entraînement sont concentrées sur les zones urbaines (Douala, Yaoundé), ne représentant pas les réalités socio-économiques des zones rurales.</li><li><strong>Conséquence :</strong> Le modèle sera moins performant pour les clients ruraux, créant un biais géographique et une exclusion financière des populations rurales.</li></ul></li><li><strong>Source : Conception (Biais algorithmique)</strong><ul><li><strong>Description :</strong> L'utilisation d'un modèle de type \"boîte noire\" rend les décisions opaques et difficiles à expliquer.</li><li><strong>Conséquence :</strong> Impossible de justifier un refus de crédit, de détecter des biais cachés, ou d'assurer un contrôle par les parties prenantes.</li></ul></li><li><strong>Source : Sociétale (Discrimination systémique)</strong><ul><li><strong>Description :</strong> Le système pourrait perpétuer et amplifier les inégalités existantes entre zones urbaines et rurales.</li><li><strong>Conséquence :</strong> Renforcement des disparités régionales, exclusion des populations déjà vulnérables, risque d'instabilité sociale.</li></ul></li><li><strong>Source : Sociétale (Atteinte à la vie privée)</strong><ul><li><strong>Description :</strong> La collecte de données personnelles sensibles sans mesures de protection adéquates.</li><li><strong>Conséquence :</strong> Non-conformité au RGPD, risque de fuites de données, perte de confiance des clients.</li></ul></li></ul>"
        },
        {
          "question": "<strong>3. Mesure des Biais (1.5 pt)</strong><br>Expliquez le concept de <em>Disparate Impact</em>. En utilisant les données fournies, calculez le <em>Disparate Impact</em> du système et interprétez le résultat au regard du seuil de 80% (règle des 4/5).",
          "reponse": "<p><strong>Définition du Disparate Impact :</strong> C'est une mesure statistique qui compare le taux de sélection (ou d'approbation) d'un groupe défavorisé par rapport à un groupe favorisé.<div class='math-block' style='background:#2c3e50; color:#ecf0f1; padding:12px; border-radius:8px; margin:10px 0;'><div class='math' style='font-size:1.1rem;'>$$\\text{Disparate Impact} = \\frac{\\text{Taux d'approbation du groupe défavorisé (rural)}}{\\text{Taux d'approbation du groupe favorisé (urbain)}}$$</div></div></p><p><strong>Calcul :</strong></p><ul><li>Taux d'approbation zone rurale : 42% = 0.42</li><li>Taux d'approbation zone urbaine : 68% = 0.68</li><li><div class='math-block' style='background:#2c3e50; color:#ecf0f1; padding:12px; border-radius:8px; margin:10px 0;'><div class='math' style='font-size:1.1rem;'>$$\\text{Disparate Impact} = \\frac{0.42}{0.68} \\approx 0.6176$$</div></div></li><li><strong>Interprétation :</strong> Le taux d'approbation pour les clients ruraux est de 61.8% par rapport aux clients urbains. La règle des 4/5 (seuil de 80%) fixe un seuil d'alerte à 0.80. Un score de 0.6176 < 0.80 indique une <strong>forte présomption de discrimination</strong> à l'encontre des clients ruraux.</li></ul>"
        },
        {
          "question": "<strong>4. Recommandations (1.5 pt)</strong><br>Proposez des recommandations concrètes pour corriger les biais identifiés et assurer la conformité du système. Distinguez les solutions techniques et organisationnelles.",
          "reponse": "<p><strong>Recommandations :</strong></p><ul><li><strong>Solutions Techniques (Mitigation) :</strong><ul><li><strong>Prétraitement :</strong> Rééquilibrer le jeu de données en enrichissant avec des données des zones rurales ou en utilisant des techniques de sur-échantillonnage (SMOTE) pour équilibrer les groupes.</li><li><strong>In-processing :</strong> Introduire une contrainte d'équité (comme l'<em>equalized odds</em> ou le <em>disparate impact</em>) dans l'algorithme d'apprentissage pour garantir l'équité entre groupes géographiques.</li><li><strong>Post-traitement :</strong> Ajuster les scores finaux pour garantir un taux d'approbation équitable entre zones urbaines et rurales.</li><li><strong>Explicabilité :</strong> Remplacer ou accompagner le modèle \"boîte noire\" par des modèles plus interprétables, ou utiliser des techniques d'explicabilité (SHAP, LIME) pour comprendre et justifier les décisions.</li></ul></li><li><strong>Solutions Organisationnelles :</strong><ul><li><strong>Gouvernance éthique :</strong> Mettre en place un comité d'éthique interne pour valider le modèle avant déploiement et assurer un suivi continu [citation:1].</li><li><strong>Audit régulier :</strong> Réaliser des audits indépendants réguliers pour détecter les dérives de performance et les biais émergents [citation:1].</li><li><strong>Conformité RGPD :</strong> Mettre en œuvre des mesures de <em>Privacy by Design</em> (pseudonymisation des données, minimisation) et désigner un DPO.</li><li><strong>Formation :</strong> Former les équipes aux enjeux éthiques de l'IA et à la détection des biais [citation:1].</li></ul></li></ul>"
        }
      ]
    },
    {
      "titre": "Responsabilité et Redevabilité dans l'Intelligence Artificielle",
      "points": "7 pts",
      "enonce": "<div style='font-size:1.1rem;'><p><strong>Sujet :</strong> <em>À travers l'étude des cas COMPAS (biais dans la prédiction de récidive) et Cambridge Analytica (violation de données et manipulation), discutez des enjeux de responsabilité et de redevabilité dans le développement et l'utilisation des systèmes d'intelligence artificielle.</em></p><p>Pour répondre à cette question, vous construirez une argumentation structurée en mobilisant les concepts clés abordés dans les <strong>leçons 16 à 20</strong> du programme.</p><p><strong>Votre dissertation devra :</strong></p><ol><li><strong>Définir</strong> les concepts de responsabilité morale, légale et professionnelle en IA, ainsi que la notion de redevabilité (accountability).</li><li><strong>Analyser</strong> les cas COMPAS et Cambridge Analytica en identifiant les manquements à ces principes.</li><li><strong>Identifier</strong> les acteurs responsables dans chaque cas (concepteurs, déployeurs, utilisateurs).</li><li><strong>Proposer</strong> des mécanismes (audits, certifications, régulations) pour renforcer la redevabilité et prévenir ces défaillances.</li></ol></div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
