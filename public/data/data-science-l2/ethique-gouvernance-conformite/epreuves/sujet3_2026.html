<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Éthique, Gouvernance et Conformité - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Répondez aux questions suivantes de manière claire et concise.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> – Expliquez en quoi consiste le principe de <strong>Privacy by Design</strong> et citez deux de ses principes fondamentaux.</p>",
          "reponse": "<p>Le <strong>Privacy by Design</strong> est une approche qui consiste à intégrer la protection des données personnelles dès la conception des systèmes, des processus ou des produits, et non comme une couche ajoutée a posteriori [citation:1].</p><p>Deux principes fondamentaux parmi les 7 principes d'Ann Cavoukian :</p><ul><li><strong>Principe proactif</strong> : prévenir les atteintes à la vie privée plutôt que d'y remédier après coup.</li><li><strong>Protection par défaut</strong> : la vie privée doit être automatiquement garantie dans le système, sans que l'utilisateur ait à effectuer des réglages.</li></ul>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> – Distinguez l'<strong>anonymisation</strong> de la <strong>pseudonymisation</strong> dans le contexte du RGPD.</p>",
          "reponse": "<p>L'<strong>anonymisation</strong> est un processus irréversible qui rend impossible l'identification d'une personne, les données ne sont donc plus considérées comme des données personnelles [citation:7].</p><p>La <strong>pseudonymisation</strong> est un processus réversible qui remplace les identifiants directs par des pseudonymes, mais qui permet de retrouver l'identité grâce à une clé de chiffrement conservée séparément. Les données pseudonymisées restent des données personnelles et sont soumises au RGPD.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> – Expliquez le lien entre le <strong>Privacy by Design</strong> et l'<strong>Article 25 du RGPD</strong>.</p>",
          "reponse": "<p>L'Article 25 du RGPD, intitulé <em>« Protection des données dès la conception et par défaut »</em>, rend le Privacy by Design une <strong>obligation légale</strong> pour les responsables de traitement [citation:1][citation:7]. Il impose de mettre en œuvre des mesures techniques et organisationnelles appropriées pour garantir la protection des données personnelles dès la conception du traitement et par défaut. Le Privacy by Design n'est donc plus une simple recommandation éthique mais une exigence réglementaire [citation:3].</p>"
        },
        {
          "question": "<p><strong>1.4 (2 pts)</strong> – Citez deux défis ou limites de la mise en œuvre du Privacy by Design dans une organisation.</p>",
          "reponse": "<p>Deux défis de la mise en œuvre du Privacy by Design :</p><ul><li><strong>Coût et temps</strong> : Sa mise en œuvre est souvent perçue comme coûteuse et chronophage, notamment dans les organisations qui ne l'ont pas intégrée dès le départ.</li><li><strong>Complexité technique</strong> : Elle nécessite une expertise spécifique en sécurité et en protection des données, ce qui peut représenter un obstacle pour les petites structures.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse de Cas (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Une start-up camerounaise développe une application mobile de <strong>télésanté</strong> qui collecte des données médicales sensibles. L'application propose un diagnostic préliminaire basé sur un algorithme de Machine Learning. Actuellement, les données sont stockées en clair sur les serveurs de la start-up et partagées avec des partenaires de recherche sans le consentement explicite des utilisateurs.</p><p>En vous basant sur les principes du Privacy by Design et les exigences du RGPD, répondez aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> – Identifiez les <strong>problèmes éthiques et légaux</strong> dans la gestion actuelle des données par la start-up.</p>",
          "reponse": "<p><strong>Problèmes identifiés :</strong></p><ul><li><strong>Stockage en clair</strong> : Risque majeur de violation de données (data breach).</li><li><strong>Partage avec des tiers sans consentement</strong> : Violation du principe de licéité et de transparence du RGPD.</li><li><strong>Absence de contrôle utilisateur</strong> : Les utilisateurs ne sont pas informés et ne donnent pas leur consentement.</li></ul>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> – Proposez <strong>trois mesures concrètes</strong> inspirées du Privacy by Design pour corriger ces problèmes.</p>",
          "reponse": "<p><strong>Trois mesures :</strong></p><ol><li><strong>Pseudonymisation et chiffrement</strong> : Remplacer les identifiants directs par des pseudonymes et chiffrer les données stockées.</li><li><strong>Minimisation des données</strong> : Ne collecter que les données strictement nécessaires au diagnostic proposé.</li><li><strong>Consentement explicite</strong> : Mettre en place des interfaces claires pour recueillir le consentement des utilisateurs avant tout partage de données.</li></ol>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> – Expliquez comment la start-up pourrait intégrer le <strong>principe de protection par défaut</strong> dans son application.</p>",
          "reponse": "<p>La start-up pourrait intégrer le principe de protection par défaut en configurant l'application pour que :</p><ul><li>Les données soient automatiquement pseudonymisées et chiffrées dès leur collecte.</li><li>Le partage avec des tiers soit désactivé par défaut, l'utilisateur devant activer manuellement cette option.</li><li>Les paramètres de confidentialité soient réglés sur le niveau le plus protecteur dès la première utilisation.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Cas Pratique – Contexte Camerounais (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Le gouvernement camerounais souhaite moderniser l'administration en déployant des systèmes d'IA pour l'attribution automatique d'aides sociales. Ce projet est encadré par la <strong>Loi n°2010/012</strong> relative à la cybersécurité et à la protection des données.</p><p>Vous êtes consultant en gouvernance des données. Rédigez un avis pour le gouvernement, en vous appuyant sur les principes de l'IA responsable et du Privacy by Design.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (3 pts)</strong> – Rédigez un avis structuré qui :</p><ul><li>Rappelle les principes clés à respecter.</li><li>Identifie les risques éthiques potentiels.</li><li>Propose des mesures pour garantir l'équité et la transparence.</li></ul>",
          "reponse": "<p><strong>AVIS SUR LE DÉPLOIEMENT D'UN SYSTÈME D'IA POUR L'ATTRIBUTION D'AIDES SOCIALES</strong></p><p><strong>1. Principes clés à respecter :</strong></p><ul><li><strong>Primauté de l'humain</strong> : L'IA est un outil d'aide à la décision, la décision finale doit rester humaine [citation:1].</li><li><strong>Transparence et explicabilité</strong> : Le système doit pouvoir expliquer ses décisions, notamment en cas de refus [citation:1].</li><li><strong>Équité et non-discrimination</strong> : Les algorithmes doivent être audités pour détecter les biais discriminatoires [citation:1][citation:3].</li></ul><p><strong>2. Risques éthiques potentiels :</strong></p><ul><li><strong>Biais algorithmique</strong> : Si les données d'entraînement reflètent des inégalités passées, le système pourrait les perpétuer.</li><li><strong>Atteinte à la vie privée</strong> : La collecte massive de données personnelles nécessite des garanties fortes.</li><li><strong>Exclusion numérique</strong> : Les populations les plus vulnérables risquent d'être exclues si elles n'ont pas accès aux technologies.</li></ul><p><strong>3. Mesures proposées :</strong></p><ul><li><strong>Audit d'équité</strong> : Réaliser des audits réguliers pour mesurer le disparate impact.</li><li><strong>Transparence</strong> : Publier les critères généraux du modèle et permettre aux citoyens de demander des explications.</li><li><strong>Comité d'éthique</strong> : Mettre en place un comité indépendant pour superviser le projet.</li></ul>"
        },
        {
          "question": "<p><strong>3.2 (3 pts)</strong> – Expliquez en quoi le <strong>Privacy by Design</strong> pourrait renforcer la confiance des citoyens dans ce projet.</p>",
          "reponse": "<p>L'intégration du Privacy by Design renforcerait la confiance des citoyens pour plusieurs raisons :</p><ul><li><strong>Protection proactive</strong> : En intégrant la protection des données dès la conception, le gouvernement montre qu'il anticipe les risques plutôt que de réagir après une violation.</li><li><strong>Respect des droits</strong> : En garantissant le droit d'accès, de rectification et d'effacement des données, le système respecte les droits fondamentaux des citoyens.</li><li><strong>Visibilité et transparence</strong> : En rendant le système auditable et en publiant des rapports de conformité, le gouvernement démontre sa volonté de transparence, ce qui est essentiel pour la confiance publique [citation:1].</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
