<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Éthique, Gouvernance et Conformité - L2",
  "classe": "Licence 2 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Compréhension des concepts fondamentaux",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em;'><p>Cet exercice porte sur les concepts fondamentaux de la transparence, de l'explicabilité et de la responsabilité en IA.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>1.</strong> (1,5 pt) Qu'est-ce qu'un modèle opaque en Data Science ? Donnez un exemple concret de modèle opaque et expliquez pourquoi il est considéré comme tel.</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>Un modèle opaque, souvent appelé <strong>boîte noire</strong>, est un système dont le fonctionnement interne est difficile, voire impossible, à comprendre pour un humain.</p><p><strong>Exemple :</strong> Un réseau de neurones profond utilisé pour la notation de crédit. Sa complexité (multiples couches et paramètres) empêche d'expliquer clairement comment une décision a été prise.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>2.</strong> (1,5 pt) Distinguez clairement l'explicabilité (XAI) de l'interprétabilité. Pourquoi ces deux notions sont-elles cruciales dans le contexte de l'IA responsable ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>L'interprétabilité</strong> est la capacité d'un modèle à être compris intrinsèquement par un humain (ex: arbre de décision).</li><li><strong>L'explicabilité (XAI)</strong> est l'ensemble des techniques qui permettent d'expliquer <em>a posteriori</em> les décisions d'un modèle opaque (ex: SHAP, LIME).</li></ul><p>Ces notions sont cruciales pour la confiance, la conformité légale (RGPD, AI Act) et la détection des biais.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>3.</strong> (1,5 pt) Quelles sont les responsabilités du concepteur d'un système d'IA en matière d'éthique ? Identifiez au moins trois acteurs responsables et leur rôle.</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Concepteurs/Data Scientists</strong> : Assurer l'équité, détecter et corriger les biais, documenter les choix.</li><li><strong>Déployeurs/Chefs de projet</strong> : S'assurer de la conformité légale, mettre en place des processus d'audit.</li><li><strong>Utilisateurs/Décideurs</strong> : Utiliser le système de manière responsable, ne pas se fier aveuglément aux prédictions.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>4.</strong> (1,5 pt) Qu'est-ce que la redevabilité (accountability) en IA et pourquoi est-elle indissociable de la transparence ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>La <strong>redevabilité (accountability)</strong> est le principe selon lequel les concepteurs et les utilisateurs d'un système d'IA doivent pouvoir rendre compte de ses décisions et de ses impacts.</p><p>Elle est indissociable de la <strong>transparence</strong> car pour être redevable, il faut pouvoir expliquer (transparence) comment et pourquoi une décision a été prise. Sans transparence, la redevabilité est impossible.</p></div>"
        }
      ]
    },
    {
      "titre": "Analyse de cas d'usage",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1.1em;'><p>Cet exercice vous propose d'analyser des cas concrets d'utilisation de l'IA et d'identifier les enjeux éthiques, les risques et les bonnes pratiques à mettre en œuvre.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>1.</strong> (1 pt) Une banque camerounaise utilise un système d'IA pour évaluer la solvabilité de ses clients. Quels sont les risques éthiques principaux liés à ce système ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>Les risques principaux sont :</p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Discrimination</strong> : le modèle peut perpétuer des biais (ex: historique de crédit défavorable dans certains quartiers).</li><li><strong>Opacité</strong> : si le modèle est complexe, le client refusé ne pourra pas comprendre la raison du refus.</li><li><strong>Exclusion financière</strong> : des personnes pourraient être injustement exclues du système bancaire.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>2.</strong> (1,5 pt) Proposez des mesures de mitigation pour le cas de la banque décrit ci-dessus.</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Audit régulier</strong> des données et du modèle pour détecter les biais.</li><li>Utilisation de <strong>techniques d'explicabilité</strong> (SHAP, LIME) pour justifier les décisions.</li><li>Mise en place d'un <strong>droit d'opposition</strong> ou de <strong>réexamen humain</strong> pour les refus de prêt.</li><li><strong>Formation des équipes</strong> aux enjeux éthiques de l'IA.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>3.</strong> (1,5 pt) Expliquez l'importance du <strong>data lineage</strong> (traçabilité des données) dans le contexte d'un audit de conformité RGPD.</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>Le <strong>data lineage</strong> permet de tracer le parcours d'une donnée depuis sa collecte jusqu'à son utilisation finale. En audit de conformité RGPD, il est essentiel pour :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Vérifier la <strong>licéité</strong> de la collecte et du traitement.</li><li>Assurer la <strong>traçabilité</strong> des données personnelles.</li><li>Répondre aux <strong>demandes des personnes concernées</strong> (droit d'accès, rectification, effacement).</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>4.</strong> (1 pt) En quoi la <strong>certification</strong> d'un système d'IA (ex: norme ISO 42001) peut-elle rassurer les parties prenantes ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>La certification est une <strong>attestation indépendante</strong> de la qualité et de la conformité d'un système. Elle rassure les parties prenantes car :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Elle prouve que le système a été <strong>audité</strong> par un organisme externe.</li><li>Elle garantit que l'organisation a mis en place des <strong>processus de gestion des risques</strong> et de conformité.</li><li>Elle renforce la <strong>confiance</strong> des utilisateurs et des investisseurs.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>5.</strong> (2 pts) Vous êtes consultant en éthique de l'IA. Une entreprise camerounaise souhaite mettre en place un <strong>comité d'éthique</strong>. Quelles seraient vos recommandations sur sa composition et ses missions ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p><strong>Composition recommandée :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Un <strong>Data Scientist</strong> (expertise technique).</li><li>Un <strong>Juriste</strong> (conformité légale, RGPD, AI Act).</li><li>Un <strong>Responsable métier</strong> (compréhension des enjeux opérationnels).</li><li>Un <strong>représentant des utilisateurs</strong> ou des citoyens (point de vue externe).</li><li>Un <strong>expert en éthique</strong> ou un enseignant-chercheur.</li></ul><p><strong>Missions :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Auditer les projets d'IA sur les plans éthique et de la conformité.</li><li>Formuler des <strong>recommandations</strong> pour prévenir les risques.</li><li>Élaborer et mettre à jour la <strong>charte éthique</strong> de l'entreprise.</li><li>Être saisi en cas de <strong>signalement</strong> de dérive éthique.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Étude de cas : Modèle opaque de notation de crédit",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1.1em;'><p>Une société de crédit utilise un <strong>réseau de neurones profond</strong> pour évaluer les demandes de prêt. Ce modèle est qualifié d'<strong>opaque</strong> par le régulateur. Un client refusé conteste la décision et demande une explication.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>1.</strong> (2 pts) Quels sont les problèmes majeurs posés par l'utilisation d'un modèle opaque pour une décision aussi critique que l'octroi d'un crédit ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Absence de transparence</strong> : le client ne peut pas comprendre pourquoi sa demande a été refusée.</li><li><strong>Risque de discrimination invisible</strong> : le modèle peut intégrer des biais (genre, zone géographique) sans que l'on puisse l'identifier.</li><li><strong>Violation potentielle du RGPD</strong> : le droit d'explication (article 22) peut ne pas être respecté.</li><li><strong>Perte de confiance</strong> : l'opacité mine la confiance des clients dans l'institution.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>2.</strong> (2 pts) Que devrait faire la société de crédit pour répondre à la contestation du client tout en restant conforme aux régulations ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>La société devrait :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Utiliser une <strong>technique d'explicabilité</strong> (SHAP, LIME) pour fournir une explication des principaux facteurs ayant conduit au refus.</li><li>Mettre en place un <strong>processus de réexamen humain</strong> pour les demandes contestées.</li><li>Documenter la démarche pour <strong>prouver sa conformité</strong> en cas d'audit.</li><li>Communiquer clairement au client qu'il a le droit de contester la décision.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>3.</strong> (1,5 pt) Si la société décide de <strong>certifier</strong> son système (ISO 42001), quels bénéfices peut-elle en tirer ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Crédibilité</strong> : prouve son engagement envers une IA responsable.</li><li><strong>Avantage concurrentiel</strong> : se distingue des concurrents moins transparents.</li><li><strong>Réduction des risques</strong> : identifie et maîtrise les risques éthiques et juridiques.</li><li><strong>Conformité</strong> : facilite la démonstration du respect des régulations.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><p><strong>4.</strong> (1,5 pt) Comment une <strong>charte éthique</strong> pourrait-elle encadrer ce type de situation au sein de la société ?</p></div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px;'><p><strong>Correction :</strong></p><p>Une charte éthique pourrait établir des principes tels que :</p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Principe de transparence</strong> : Toute décision automatisée significative doit être explicable.</li><li><strong>Principe d'équité</strong> : Les algorithmes doivent être audités pour éviter les discriminations.</li><li><strong>Principe de responsabilité</strong> : Un responsable doit être désigné pour chaque système d'IA.</li><li><strong>Principe de recours</strong> : Tout utilisateur a le droit de contester une décision automatisée.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
