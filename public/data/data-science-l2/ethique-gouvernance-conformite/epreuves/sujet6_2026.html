<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Éthique, Gouvernance et Conformité - L2",
 "classe": "Licence 2 Data Science",
 "sequence": "Évaluation Séquentielle n°6 : Gouvernance, Conformité et IA Responsable",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Questions de Cours (Théorie)",
     "points": "6 pts",
     "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Répondez de manière claire et précise aux questions suivantes en vous appuyant sur vos connaissances du cours sur la gouvernance des données, la conformité et l'IA responsable.</div>",
     "questions": [
       {
         "question": "1. (2 pts) Définissez la gouvernance des données et expliquez son importance dans le cadre d'un projet Data Science.",
         "reponse": "La gouvernance des données est un ensemble de politiques, de processus et de standards qui assurent la gestion efficace, la qualité, la sécurité et la conformité des données tout au long de leur cycle de vie. Elle est cruciale en Data Science car elle garantit que les données utilisées sont fiables, traçables et conformes aux réglementations comme le RGPD [citation:8]. Elle permet de garantir la reproductibilité des analyses, de prévenir les biais et d'assurer la responsabilité des acteurs."
       },
       {
         "question": "2. (2 pts) Distinguez les rôles du Data Owner, du Data Steward et du Data Custodian dans une stratégie de gouvernance.",
         "reponse": "Le Data Owner est un responsable métier qui définit les règles de gestion et la qualité des données dans son périmètre [citation:1]. Il est l'expert du sens et de l'usage des données. Le Data Steward est le garant de la mise en œuvre opérationnelle des politiques. Il assure la qualité des données, gère les métadonnées et résout les problèmes quotidiens. Le Data Custodian, quant à lui, est un rôle technique (ex: DBA) qui est responsable du stockage, de la sécurité et de l'intégrité technique des données, en exécutant les directives définies."
       },
       {
         "question": "3. (2 pts) Qu'est-ce que le Privacy by Design et en quoi est-il un pilier de l'IA responsable ?",
         "reponse": "Le Privacy by Design est un principe qui intègre la protection des données personnelles dès la conception des systèmes, et non comme une couche de conformité ajoutée après coup. C'est un pilier de l'IA responsable car il permet de prévenir les risques de violation de la vie privée, de renforcer la confiance des utilisateurs et d'assurer une conformité proactive avec le RGPD [citation:8]. Il repose sur des principes tels que la minimisation des données, la transparence et la sécurité."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Analyse de Conformité et Cartographie des Risques",
     "points": "7 pts",
     "enonce": "<div style='background-color: #e8f4fd; padding: 15px; border-radius: 8px; border-left: 6px solid #007bff; color: #004085;'><p>Vous êtes consultant en conformité et une start-up camerounaise, \"AfriMed\", souhaite développer une application mobile d'aide au diagnostic médical basée sur l'IA. L'application doit analyser les symptômes saisis par les patients (données de santé) pour fournir une orientation médicale. L'équipe de direction n'a pas encore réfléchi aux implications réglementaires et éthiques.</p></div>",
     "questions": [
       {
         "question": "1. (3 pts) Identifiez les risques éthiques, légaux et de gouvernance auxquels AfriMed est confronté, en vous référant à l'AI Act et au RGPD.",
         "reponse": "AfriMed est confronté à plusieurs risques majeurs :<br>- <strong>Risques liés à l'AI Act</strong> : Le système d'IA pour le diagnostic médical est classé à <strong>haut risque</strong> [citation:3][citation:8]. Il devra donc se conformer à des exigences strictes : système de gestion des risques, gouvernance des données (pour éviter les biais), documentation technique et traçabilité, transparence envers les utilisateurs, surveillance humaine et robustesse.<br>- <strong>Risques liés au RGPD</strong> : Le traitement de données de santé, qui sont des données sensibles, nécessite une base légale solide (ex: consentement explicite). AfriMed devra garantir la minimisation des données, informer clairement les utilisateurs, et assurer la sécurité des données [citation:8].<br>- <strong>Risques de gouvernance</strong> : Absence de politiques de données, de rôles clairement définis (Data Owner, DPO), et de processus d'audit éthique."
       },
       {
         "question": "2. (4 pts) Proposez un plan d'action pour mettre AfriMed en conformité avec les exigences de l'AI Act pour les systèmes à haut risque.",
         "reponse": "Un plan d'action en plusieurs étapes :<br><strong>1. Mise en place d'une gouvernance</strong> : Désigner un responsable de la conformité et/ou un DPO. Définir les rôles et responsabilités (Data Owner pour les données médicales).<br><strong>2. Évaluation et gestion des risques</strong> : Réaliser une analyse d'impact relative à la protection des données (AIPD) et mettre en place un système de gestion des risques pour identifier et atténuer les risques (biais, sécurité, erreurs de diagnostic) [citation:3][citation:5].<br><strong>3. Gouvernance des données</strong> : Auditer les données utilisées pour s'assurer de leur qualité, de leur représentativité et de l'absence de biais. Mettre en place des processus de collecte de données conformes au RGPD.<br><strong>4. Documentation et traçabilité</strong> : Documenter toutes les étapes du cycle de vie du système (spécifications, données, architecture, résultats des tests) pour assurer la traçabilité [citation:8].<br><strong>5. Transparence et surveillance humaine</strong> : Concevoir une interface transparente pour les patients et les médecins. Mettre en place une surveillance humaine, avec un médecin qui valide les décisions critiques. Former les utilisateurs."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Mise en Situation Pratique - Audit Éthique",
     "points": "7 pts",
     "enonce": "<div style='background-color: #f1f8e9; padding: 15px; border-radius: 8px; border-left: 6px solid #28a745; color: #155724;'>Vous êtes responsable du programme d'IA responsable pour une grande banque. La banque utilise un modèle de notation de crédit basé sur un réseau de neurones profond (boîte noire). Suite à des plaintes de clients, vous soupçonnez des biais discriminatoires.</div>",
     "questions": [
       {
         "question": "1. (3 pts) Expliquez les limites éthiques de l'utilisation d'un modèle de type \"boîte noire\" pour la notation de crédit, en lien avec les principes de l'IA responsable.",
         "reponse": "Utiliser une boîte noire pour la notation de crédit pose plusieurs problèmes éthiques. Conformément aux principes de l'IA responsable (transparence, équité, responsabilité) [citation:6] :<br>- <strong>Manque de transparence et d'explicabilité</strong> : Il est impossible de comprendre pourquoi une décision de refus de prêt a été prise, ce qui empêche les clients de contester la décision.<br>- <strong>Biais et discrimination</strong> : Les biais cachés dans les données ou l'architecture du modèle peuvent conduire à des discriminations (genre, origine). L'opacité rend leur détection très difficile.<br>- <strong>Absence de recours</strong> : Cela prive les clients d'un droit fondamental à une explication et à un recours humain, comme l'exige le RGPD et l'AI Act [citation:3]."
       },
       {
         "question": "2. (2 pts) Quelles techniques d'explicabilité (XAI) pourriez-vous utiliser pour auditer ce modèle ?",
         "reponse": "Je pourrais utiliser des techniques comme <strong>SHAP</strong> (SHapley Additive exPlanations) pour comprendre l'importance globale de chaque variable dans le modèle, et <strong>LIME</strong> (Local Interpretable Model-agnostic Explanations) pour expliquer les décisions individuelles. SHAP aiderait à identifier les variables qui contribuent le plus aux décisions de la banque, tandis que LIME pourrait expliquer à un client pourquoi son prêt a été refusé [citation:6]."
       },
       {
         "question": "3. (2 pts) Proposez un plan d'actions pour mitiger les biais et améliorer la transparence de ce système.",
         "reponse": "Un plan d'actions en trois axes :<br>- <strong>Prétraitement</strong> : Auditer et équilibrer les données d'entraînement pour supprimer les biais historiques.<br>- <strong>In-processing</strong> : Modifier l'algorithme d'entraînement pour intégrer des contraintes d'équité, ou privilégier un modèle interprétable (ex: arbre de décision) si la performance le permet [citation:6].<br>- <strong>Post-traitement</strong> : Mettre en place une surveillance humaine pour examiner les décisions les plus critiques. Fournir aux clients une explication simple et non technique des critères utilisés par le modèle."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
