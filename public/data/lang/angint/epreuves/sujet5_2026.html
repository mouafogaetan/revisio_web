<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "English Intermediate to Advanced",
  "classe": "Languages",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "EXERCICE 1: GRAMMAR - Modals and Relative Clauses (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Complete the sentences with the correct modal verb or relative pronoun.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> You ______ (must / should / might) wear a seatbelt while driving. It's the law.</p>",
          "reponse": "<p><strong>must</strong></p><p>Explanation: 'Must' expresses a strong obligation or necessity. The law requires you to wear a seatbelt.</p>"
        },
        {
          "question": "<p><strong>2.</strong> She ______ (could / should / must) have studied harder for the exam. She failed.</p>",
          "reponse": "<p><strong>should</strong></p><p>Explanation: 'Should have + past participle' is used to express criticism or regret about a past action that was not done.</p>"
        },
        {
          "question": "<p><strong>3.</strong> The man ______ (who / which / whom) lives next door is a doctor.</p>",
          "reponse": "<p><strong>who</strong></p><p>Explanation: 'Who' is used as a relative pronoun for people, and it is the subject of the relative clause.</p>"
        },
        {
          "question": "<p><strong>4.</strong> This is the book ______ (who / which / whose) I told you about.</p>",
          "reponse": "<p><strong>which</strong></p><p>Explanation: 'Which' is used as a relative pronoun for things or animals. It is the object of the relative clause.</p>"
        },
        {
          "question": "<p><strong>5.</strong> The student ______ (who / whose / which) bag was stolen is very upset.</p>",
          "reponse": "<p><strong>whose</strong></p><p>Explanation: 'Whose' is the possessive relative pronoun used for people or things to show ownership.</p>"
        },
        {
          "question": "<p><strong>6.</strong> She ______ (can't / mustn't / needn't) have left already. I just saw her car in the parking lot.</p>",
          "reponse": "<p><strong>can't</strong></p><p>Explanation: 'Can't have + past participle' expresses a strong deduction that something is impossible. Since her car is there, she cannot have left.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 2: VOCABULARY - English Varieties and Cross-Cultural Communication (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Choose the correct answer to complete each sentence.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> In British English, the word for 'apartment' is ______.</p><p>A) flat &nbsp;&nbsp; B) condo &nbsp;&nbsp; C) unit &nbsp;&nbsp; D) loft</p>",
          "reponse": "<p><strong>A) flat</strong></p><p>Explanation: In British English, 'flat' is the standard term for a self-contained housing unit. 'Apartment' is used in American English.</p>"
        },
        {
          "question": "<p><strong>2.</strong> In American English, the word for 'rubbish' is ______.</p><p>A) garbage &nbsp;&nbsp; B) litter &nbsp;&nbsp; C) waste &nbsp;&nbsp; D) debris</p>",
          "reponse": "<p><strong>A) garbage</strong></p><p>Explanation: In American English, 'garbage' or 'trash' is used for household waste. 'Rubbish' is British English.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Which of the following is an <strong>African English</strong> expression meaning 'immediately' or 'right now'?</p><p>A) ASAP &nbsp;&nbsp; B) Now now &nbsp;&nbsp; C) Pronto &nbsp;&nbsp; D) Stat</p>",
          "reponse": "<p><strong>B) Now now</strong></p><p>Explanation: 'Now now' is a common expression in many African English varieties (especially in West and Southern Africa) meaning 'immediately' or 'right now'.</p>"
        },
        {
          "question": "<p><strong>4.</strong> To avoid cultural misunderstandings, it is important to ______.</p><p>A) only speak your native language &nbsp;&nbsp; B) research and respect cultural norms &nbsp;&nbsp; C) avoid all contact with others &nbsp;&nbsp; D) use formal language only</p>",
          "reponse": "<p><strong>B) research and respect cultural norms</strong></p><p>Explanation: Understanding and respecting cultural norms is essential for effective cross-cultural communication. This helps avoid misunderstandings and builds positive relationships.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 3: READING COMPREHENSION AND ANALYSIS (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Read the text below and answer the questions that follow.</p><div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; margin: 15px 0; color: #2c3e50;'><p><strong>Text:</strong> 'English is a global language, but it is spoken differently around the world. In Cameroon, English is one of the official languages, alongside French. Cameroonian English has its own unique characteristics, influenced by local languages and French. For example, Cameroonian speakers often use the phrase 'I am going' to express a habitual action, whereas in British English, the present simple would be used. Additionally, some vocabulary items differ. The word 'motor' is commonly used to refer to a motorcycle. Understanding these variations is crucial for effective communication in multicultural settings. As the world becomes more interconnected, being aware of cultural and linguistic differences helps build bridges between people.'</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> What is the main idea of this text? (1 pt)</p>",
          "reponse": "<p>The main idea is that English is a global language with regional variations, and understanding these variations is important for effective communication in multicultural settings.</p>"
        },
        {
          "question": "<p><strong>2.</strong> According to the text, what is one characteristic of Cameroonian English? (1 pt)</p>",
          "reponse": "<p>One characteristic is the use of the present progressive ('I am going') to express habitual actions, whereas British English would use the present simple.</p>"
        },
        {
          "question": "<p><strong>3.</strong> What does the word 'motor' mean in Cameroonian English? (1 pt)</p>",
          "reponse": "<p>In Cameroonian English, 'motor' commonly refers to a motorcycle.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Why is it important to understand cultural and linguistic differences? (1 pt)</p>",
          "reponse": "<p>Understanding cultural and linguistic differences is important for effective communication in multicultural settings and helps build bridges between people.</p>"
        },
        {
          "question": "<p><strong>5.</strong> What is the author's tone in this text? (1 pt)</p>",
          "reponse": "<p>The author's tone is informative and objective. The text presents facts about English varieties and emphasizes the importance of understanding them.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 4: GRAMMAR - Inversion and Cleft Sentences (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Rewrite the following sentences using inversion or cleft sentences as indicated.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Rewrite using <strong>inversion</strong> (negative adverbial): <em>He rarely speaks in public.</em></p>",
          "reponse": "<p><strong>Rarely does he speak in public.</strong></p><p>Explanation: Inversion is used with negative adverbs like 'rarely', 'never', 'hardly', etc., by placing the adverb at the beginning and inverting the subject and auxiliary verb.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Rewrite using <strong>inversion</strong> (negative adverbial): <em>She had never seen such a beautiful sunset.</em></p>",
          "reponse": "<p><strong>Never had she seen such a beautiful sunset.</strong></p><p>Explanation: 'Never' is a negative adverb. When placed at the beginning, the subject and auxiliary verb are inverted.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Rewrite using a <strong>cleft sentence</strong> (It + be): <em>I need your help.</em></p>",
          "reponse": "<p><strong>It is your help that I need.</strong></p><p>Explanation: Cleft sentences using 'It' + 'be' + emphasized element + 'that/who' clause highlight a specific part of the sentence.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 5: WRITING - Essay (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Choose ONE of the following topics and write a five-paragraph essay (200-250 words). Structure your essay with an introduction, three body paragraphs, and a conclusion.</p>",
      "questions": [
        {
          "question": "<p><strong>Topic A:</strong> 'Technology has made communication easier but less personal.' Do you agree or disagree? Support your argument with examples.</p><p><strong>Topic B:</strong> 'The rise of social media has led to a decline in face-to-face communication.' Present arguments for and against this statement.</p><p><strong>Topic C:</strong> 'English should remain the primary language of instruction in Cameroonian schools.' Write a persuasive essay on this topic.</p>",
          "reponse": "<p><strong>Example for Topic B:</strong></p><p><strong>Introduction:</strong> The advent of social media has dramatically changed the way we communicate. While some argue that it has led to a decline in face-to-face interaction, others believe it has enhanced communication. This essay will explore both perspectives before concluding that while social media has reduced some forms of physical interaction, it has also created new opportunities for connection.</p><p><strong>Body Paragraph 1:</strong> On one hand, social media has arguably reduced face-to-face communication. People spend more time on their phones, often ignoring those physically present. Studies show that family members in the same room may prefer texting over talking. This can weaken personal relationships and reduce social skills.</p><p><strong>Body Paragraph 2:</strong> On the other hand, social media has also facilitated communication. It allows people to stay connected with distant friends and family. For example, a student studying abroad can easily video call their parents. Additionally, social media has given a voice to marginalized communities and enabled social movements.</p><p><strong>Body Paragraph 3:</strong> Furthermore, social media can complement face-to-face communication rather than replace it. Many people use it to organize events and meetups. It can also be a tool for introverts to build confidence before interacting in person. Therefore, the impact of social media is not entirely negative.</p><p><strong>Conclusion:</strong> In conclusion, while social media has changed the way we interact, it does not necessarily lead to a decline in face-to-face communication. Instead, it offers new ways to connect. The key is to use it mindfully and maintain a balance between digital and physical interaction.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
