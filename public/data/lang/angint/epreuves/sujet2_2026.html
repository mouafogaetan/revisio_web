<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "English Intermediate to Advanced",
  "classe": "Languages",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Reading Comprehension and Vocabulary (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='padding: 15px; background: #f5f5f5; border-radius: 10px;'><p style='font-size: 16px; line-height: 1.6;'><strong>Read the text below carefully and answer the questions that follow.</strong></p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='font-size: 15px; line-height: 1.8;'><em>Cameroon, often called 'Africa in Miniature,' is a country of remarkable diversity. It is home to over 200 ethnic groups and more than 250 languages. The country's geography ranges from coastal plains in the west to savannahs in the north and rainforests in the south. This diversity makes Cameroon a unique destination for tourists and researchers alike. However, the country also faces significant challenges, including poverty, infrastructure deficits, and political tensions. Despite these challenges, Cameroon's population continues to grow, and its economy is slowly expanding. In recent years, the government has invested in education and health, hoping to improve the quality of life for all citizens.</em></p></div><p style='font-size: 16px; line-height: 1.6;'><strong>I. Comprehension (4 pts)</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> (1 pt) What is the nickname given to Cameroon?</p>",
          "reponse": "<p>Cameroon is often called 'Africa in Miniature.'</p>"
        },
        {
          "question": "<p><strong>2.</strong> (1 pt) How many ethnic groups and languages are mentioned in the text?</p>",
          "reponse": "<p>There are over 200 ethnic groups and more than 250 languages mentioned.</p>"
        },
        {
          "question": "<p><strong>3.</strong> (1 pt) Name three types of geographical areas found in Cameroon.</p>",
          "reponse": "<p>The text mentions coastal plains, savannahs, and rainforests.</p>"
        },
        {
          "question": "<p><strong>4.</strong> (1 pt) According to the text, what has the government invested in to improve the quality of life?</p>",
          "reponse": "<p>The government has invested in education and health.</p>"
        },
        {
          "question": "<p><strong>II. Vocabulary and Expression (4 pts)</strong></p><p><strong>5.</strong> (1 pt) Find a synonym for the word '<strong>diversity</strong>' from the text.</p>",
          "reponse": "<p>A synonym for 'diversity' from the text could be 'variety' or 'richness' (contextual).</p>"
        },
        {
          "question": "<p><strong>6.</strong> (1 pt) Explain what 'infrastructure deficits' means in your own words.</p>",
          "reponse": "<p>Infrastructure deficits refer to a lack or insufficiency of essential public facilities such as roads, bridges, hospitals, and schools.</p>"
        },
        {
          "question": "<p><strong>7.</strong> (1 pt) Choose the correct synonym for '<strong>remarkable</strong>' from the following: <span style='display: inline-block; margin: 5px 10px;'>a) ordinary</span> <span style='display: inline-block; margin: 5px 10px;'>b) exceptional</span> <span style='display: inline-block; margin: 5px 10px;'>c) insignificant</span> <span style='display: inline-block; margin: 5px 10px;'>d) typical</span></p>",
          "reponse": "<p>Correct answer: <strong>b) exceptional</strong></p>"
        },
        {
          "question": "<p><strong>8.</strong> (1 pt) Use the phrase '<strong>despite these challenges</strong>' in a new sentence of your own.</p>",
          "reponse": "<p>Accept any well-formed sentence. Example: 'Despite these challenges, the community continues to work together to build a better future.'</p>"
        }
      ]
    },
    {
      "titre": "Grammar in Context (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='padding: 15px; background: #f5f5f5; border-radius: 10px;'><p style='font-size: 16px; line-height: 1.6;'>Complete the following exercises to demonstrate your mastery of advanced grammar structures.</p></div>",
      "questions": [
        {
          "question": "<p><strong>I. Present Perfect vs Present Perfect Continuous (3 pts)</strong></p><p><strong>9.</strong> (1 pt) Complete the sentence: 'I ______ (work) on this project for three months, but I still haven't finished it.'</p>",
          "reponse": "<p>Correct answer: <strong>have been working</strong></p>"
        },
        {
          "question": "<p><strong>10.</strong> (1 pt) Choose the correct form: 'She ______ (visit) Paris twice in her life.'</p>",
          "reponse": "<p>Correct answer: <strong>has visited</strong></p>"
        },
        {
          "question": "<p><strong>11.</strong> (1 pt) Explain the difference in meaning between these two sentences:</p><p style='font-style: italic;'>a) I have lived in Yaoundé for five years.</p><p style='font-style: italic;'>b) I have been living in Yaoundé for five years.</p>",
          "reponse": "<p>Sentence (a) focuses on the completed fact of living there for five years. Sentence (b) emphasizes the ongoing nature of the action, often implying that it might continue. In many contexts, they can be interchangeable, but (b) puts more emphasis on the continuity.</p>"
        },
        {
          "question": "<p><strong>II. Reported Speech (4 pts)</strong></p><p><strong>12.</strong> (1 pt) Transform to reported speech: 'I am leaving for Douala tomorrow,' John said.</p>",
          "reponse": "<p>Correct answer: <strong>John said that he was leaving for Douala the next day.</strong></p>"
        },
        {
          "question": "<p><strong>13.</strong> (1 pt) Transform to reported speech: 'Did you see the president?' my friend asked me.</p>",
          "reponse": "<p>Correct answer: <strong>My friend asked me if I had seen the president.</strong></p>"
        },
        {
          "question": "<p><strong>14.</strong> (1 pt) Report this request: 'Please close the window,' she said.</p>",
          "reponse": "<p>Correct answer: <strong>She asked me to close the window.</strong></p>"
        },
        {
          "question": "<p><strong>15.</strong> (1 pt) Report this advice: 'You should see a doctor,' the nurse said to me.</p>",
          "reponse": "<p>Correct answer: <strong>The nurse advised me to see a doctor.</strong></p>"
        },
        {
          "question": "<p><strong>III. Conditional Forms (3 pts)</strong></p><p><strong>16.</strong> (1 pt) Complete the sentence: 'If I ______ (be) the president, I ______ (invest) more in education.'</p>",
          "reponse": "<p>Correct answer: <strong>If I were the president, I would invest more in education.</strong></p>"
        },
        {
          "question": "<p><strong>17.</strong> (1 pt) Complete the sentence: 'If you had studied harder, you ______ (pass) the exam.'</p>",
          "reponse": "<p>Correct answer: <strong>you would have passed</strong></p>"

        {
          "question": "<p><strong>18.</strong> (1 pt) Express a regret: 'I didn't buy the house. Now it's too expensive.' Use 'if only.'</p>",
          "reponse": "<p>Correct answer: <strong>If only I had bought the house!</strong> (or) <strong>If only I had bought it when it was cheaper.</strong></p>"
        }
      ]
    },
    {
      "titre": "Writing: Argumentative Essay (12 pts)",
      "points": "12 pts",
      "enonce": "<div style='padding: 15px; background: #f5f5f5; border-radius: 10px;'><p style='font-size: 16px; line-height: 1.6;'><strong>Choose one of the following topics and write a well-structured argumentative essay of 250-300 words.</strong></p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='font-size: 15px; line-height: 1.8;'><strong>Topic A:</strong> 'Should social media be banned for people under 16?'</p><p style='font-size: 15px; line-height: 1.8;'><strong>Topic B:</strong> 'Is online education as effective as traditional classroom learning?'</p><p style='font-size: 15px; line-height: 1.8;'><strong>Topic C:</strong> 'Should the government invest more in renewable energy?'</p></div><p style='font-size: 16px; line-height: 1.6;'><strong>Marking Criteria:</strong></p><ul style='font-size: 15px; line-height: 1.8;'><li>Structure: Clear introduction, body paragraphs, and conclusion (3 pts)</li><li>Thesis and Arguments: Clear thesis statement and well-developed arguments (3 pts)</li><li>Use of transition words and linking expressions (2 pts)</li><li>Grammar and vocabulary accuracy (2 pts)</li><li>Counterargument and rebuttal (2 pts)</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>19.</strong> Write your essay here.</p>",
          "reponse": "<p><strong>Sample Answer (Topic A):</strong></p><p>Social media has become an integral part of modern life, but its impact on young people is a growing concern. Some argue that social media should be banned for individuals under 16. This essay will discuss both sides of the argument and present a balanced view.</p><p>On one hand, banning social media for young people could protect them from harmful content and online predators. Many studies have shown that excessive use of social media can lead to anxiety, depression, and low self-esteem among teenagers. Furthermore, social media can be a major distraction, affecting students' academic performance. Therefore, a ban could help young people focus on their studies and real-world relationships.</p><p>On the other hand, social media also offers significant benefits. It can be a powerful tool for learning, self-expression, and social connection. For young people in remote areas of Cameroon, social media can connect them to educational resources and a wider community of learners. Banning it completely might deprive them of these opportunities.</p><p>In my opinion, a complete ban is not the best solution. Instead, parents and schools should focus on educating young people about responsible social media use. This would allow them to benefit from the positive aspects while minimizing the risks. In conclusion, the key is not to ban, but to guide and educate.</p>"
        }
      ]
    },
    {
      "titre": "Speaking: Presentation and Discussion (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='padding: 15px; background: #f5f5f5; border-radius: 10px;'><p style='font-size: 16px; line-height: 1.6;'><strong>PART A: Presentation (6 pts)</strong></p><p style='font-size: 16px; line-height: 1.6;'>You are a student representative at a school assembly. You have 5 minutes to present a proposal for a new environmental club at your school. Your presentation should include:</p><ul style='font-size: 15px; line-height: 1.8;'><li>An introduction that grabs attention (1 pt)</li><li>A clear statement of the purpose of the club (1 pt)</li><li>Three benefits of the club for students and the school (2 pts)</li><li>Activities the club would organize (1 pt)</li><li>A conclusion that asks for support (1 pt)</li></ul><p style='font-size: 16px; line-height: 1.6;'><strong>PART B: Discussion (4 pts)</strong></p><p style='font-size: 16px; line-height: 1.6;'>After your presentation, the principal asks you questions. Prepare answers for the following questions:</p><ul style='font-size: 15px; line-height: 1.8;'><li>Question 1: 'How will this club benefit students who are not already interested in the environment?' (2 pts)</li><li>Question 2: 'Where will you get the resources and funding for the club's activities?' (2 pts)</li></ul><p style='font-size: 16px; line-height: 1.6;'><strong>Note:</strong> This section will be assessed through a live presentation or a recorded video submission.</p></div>",
      "questions": [
        {
          "question": "<p><strong>20.</strong> Prepare your presentation script.</p>",
          "reponse": "<p><strong>Sample Presentation Script:</strong></p><p><strong>Introduction:</strong> Good morning, esteemed principal, teachers, and fellow students. I stand before you today to share an exciting opportunity for our school community. Imagine a greener, cleaner, and more sustainable school environment. This is the vision behind our proposed Environmental Club.</p><p><strong>Purpose:</strong> The purpose of the Environmental Club is to raise awareness about environmental issues and to take practical action to protect and improve our school environment and the wider community.</p><p><strong>Benefits:</strong> First, the club will help students develop a sense of responsibility and leadership. Second, it will improve the cleanliness and beauty of our school campus. Third, it will create opportunities for students to learn new skills like gardening, recycling, and waste management that are useful in everyday life.</p><p><strong>Activities:</strong> We plan to organize weekly clean-up campaigns, start a school garden, and host recycling competitions. We will also invite guest speakers to talk about environmental topics.</p><p><strong>Conclusion:</strong> In conclusion, I strongly believe that this club will be a valuable addition to our school. I kindly ask for your support to make this vision a reality. Thank you for your time and consideration.</p><p><strong>Discussion Answers:</strong></p><p><strong>Answer to Question 1:</strong> To engage students who are not yet interested in the environment, we will organize fun and interactive activities like tree-planting competitions with prizes, and we will also show how environmental actions connect to health, community pride, and academic learning. We will also invite students to suggest ideas for activities that interest them, making the club more inclusive.</p><p><strong>Answer to Question 2:</strong> We plan to request a small budget from the school administration, seek sponsorship from local businesses, and organize fundraising activities like car washes or bake sales. We will also approach local NGOs that support environmental education for partnership and resources.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
