<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Lesson 5 - Passive Voice in All Tenses",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e; text-align: center;'>Passive Voice in All Tenses</h2><p style='font-size: 18px; text-align: center;'>Learn when and how to use passive voice in English.</p><div style='background-color: #e8eaf6; padding: 15px; border-radius: 10px; margin-top: 20px;'><p style='color: #1a237e; font-size: 16px; text-align: center;'><strong>What is passive voice?</strong></p><p style='font-size: 16px; text-align: center;'>Passive voice shows that the subject receives the action instead of performing it.</p></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #bf360c; font-size: 16px; text-align: center;'><strong>Example:</strong> <span style='color: #c62828;'>Active:</span> The chef cooks the meal. → <span style='color: #c62828;'>Passive:</span> The meal is cooked by the chef.</p></div></div>",
    "texteParle": "Bienvenue à tous ! Aujourd'hui, nous allons apprendre la voix passive en anglais. La voix passive est une structure très utile, surtout dans les écrits formels, les rapports et les articles de presse. Contrairement à la voix active où le sujet fait l'action, dans la voix passive, le sujet reçoit l'action. Par exemple, 'le chef cuisine le repas' est actif, mais 'le repas est cuit par le chef' est passif. Nous allons voir comment former la voix passive dans tous les temps, y compris avec les verbes modaux. C'est une compétence importante pour votre niveau avancé. Allons-y !",
    "note": "La voix passive est souvent utilisée dans les écrits formels et les nouvelles."
  },
  {
    "titre": "Formation of Passive Voice",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>How to Form Passive Voice</h3><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px;'><p style='color: #0d47a1; font-size: 18px; text-align: center;'><strong>Formula:</strong></p><p style='color: #0d47a1; font-size: 18px; text-align: center;'><span style='color: #c62828;'>Subject</span> + <span style='color: #c62828;'>be</span> (in correct tense) + <span style='color: #c62828;'>past participle</span> + (by + agent)</p></div><div style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='font-size: 16px;'><strong>Steps to transform active to passive:</strong></p><ol style='font-size: 16px;'><li>Object of active sentence becomes subject of passive sentence.</li><li>Use the verb <strong>be</strong> in the same tense as the active verb.</li><li>Use the <strong>past participle</strong> of the main verb.</li><li>Add <strong>by + agent</strong> (optional).</li></ol></div><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #f57f17; font-size: 16px;'><strong>Example:</strong> Active: <span style='color: #c62828;'>They build</span> houses. → Passive: Houses <span style='color: #c62828;'>are built</span> by them.</p></div></div>",
    "texteParle": "Pour former la voix passive, on utilise une formule simple : sujet + le verbe 'be' au bon temps + le participe passé du verbe principal. On peut aussi ajouter 'by + agent' pour indiquer qui fait l'action, mais ce n'est pas obligatoire. Regardons les étapes : premièrement, l'objet de la phrase active devient le sujet de la phrase passive. Ensuite, on met le verbe 'be' au même temps que le verbe actif. Puis, on utilise le participe passé du verbe principal. C'est aussi simple que cela ! On va voir des exemples concrets maintenant.",
    "note": "Le verbe 'be' s'accorde en temps et en nombre avec le nouveau sujet."
  },
  {
    "titre": "Passive Voice - Present Simple",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Passive Voice in Present Simple</h3><div style='background-color: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 16px;'><strong>Structure:</strong> Subject + <span style='color: #c62828;'>am/is/are</span> + past participle</p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Active</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The chef <span style='color: #c62828;'>cooks</span> the food.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The food <span style='color: #c62828;'>is cooked</span> by the chef.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>speak</span> English here.</td> <td style='padding: 8px; border: 1px solid #ddd;'>English <span style='color: #c62828;'>is spoken</span> here.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>Workers <span style='color: #c62828;'>build</span> houses.</td> <td style='padding: 8px; border: 1px solid #ddd;'>Houses <span style='color: #c62828;'>are built</span> by workers.</td> </tr> </table><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Note:</strong> Use <span style='color: #c62828;'>is</span> for singular subjects, <span style='color: #c62828;'>are</span> for plural subjects, and <span style='color: #c62828;'>am</span> for <span style='color: #c62828;'>I</span>.</p></div></div>",
    "texteParle": "Commençons par le présent simple. La structure est : sujet + am/is/are + participe passé. Le participe passé, c'est le troisième colonne des verbes irréguliers ou le verbe + -ed pour les réguliers. Par exemple, 'cook' devient 'cooked'. Regardons ces exemples. 'Le chef cuisine la nourriture' devient 'La nourriture est cuite par le chef'. 'Ils parlent anglais ici' devient 'L'anglais est parlé ici'. C'est très simple. Utilisez 'is' pour les sujets singuliers, 'are' pour les pluriels et 'am' pour 'I'.",
    "note": "Les verbes réguliers ajoutent -ed, les irréguliers ont des formes à apprendre."
  },
  {
    "titre": "Passive Voice - Past Simple",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Passive Voice in Past Simple</h3><div style='background-color: #ffebee; padding: 10px; border-radius: 8px;'><p style='color: #b71c1c; font-size: 16px;'><strong>Structure:</strong> Subject + <span style='color: #c62828;'>was/were</span> + past participle</p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Active</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The chef <span style='color: #c62828;'>cooked</span> the food.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The food <span style='color: #c62828;'>was cooked</span> by the chef.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>built</span> this house in 1990.</td> <td style='padding: 8px; border: 1px solid #ddd;'>This house <span style='color: #c62828;'>was built</span> in 1990.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The team <span style='color: #c62828;'>won</span> the match.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The match <span style='color: #c62828;'>was won</span> by the team.</td> </tr> </table><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Note:</strong> Use <span style='color: #c62828;'>was</span> for singular subjects and <span style='color: #c62828;'>were</span> for plural subjects.</p></div></div>",
    "texteParle": "Maintenant, le passé simple. La structure est : sujet + was/were + participe passé. Ici, on utilise 'was' pour les sujets singuliers et 'were' pour les pluriels. Par exemple, 'Le chef a cuisiné la nourriture' devient 'La nourriture a été cuite par le chef'. 'Ils ont construit cette maison en 1990' devient 'Cette maison a été construite en 1990'. On voit que le temps change, mais le participe passé reste le même. C'est une structure très utile pour parler d'événements passés.",
    "note": "Was/were indique le temps passé, le participe passé reste constant."
  },
  {
    "titre": "Passive Voice - Future Simple",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Passive Voice in Future Simple</h3><div style='background-color: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 16px;'><strong>Structure:</strong> Subject + <span style='color: #c62828;'>will be</span> + past participle</p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Active</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The chef <span style='color: #c62828;'>will cook</span> the food.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The food <span style='color: #c62828;'>will be cooked</span> by the chef.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>will finish</span> the project.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The project <span style='color: #c62828;'>will be finished</span>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>She <span style='color: #c62828;'>will deliver</span> the package.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The package <span style='color: #c62828;'>will be delivered</span>.</td> </tr> </table><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #f57f17; font-size: 14px;'><strong>Note:</strong> 'Will be' is used for all subjects. No agreement changes!</p></div></div>",
    "texteParle": "Pour le futur simple, la structure est : sujet + will be + participe passé. Ici, 'will be' est utilisé pour tous les sujets. Pas de changement d'accord. Par exemple, 'Le chef cuisinera la nourriture' devient 'La nourriture sera cuite par le chef'. 'Ils finiront le projet' devient 'Le projet sera fini'. 'Elle livrera le colis' devient 'Le colis sera livré'. C'est très pratique pour parler de ce qui va arriver dans le futur.",
    "note": "Will be est invariable, quelle que soit la personne."

  {
    "titre": "Passive Voice - Present Perfect",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Passive Voice in Present Perfect</h3><div style='background-color: #f3e5f5; padding: 10px; border-radius: 8px;'><p style='color: #4a148c; font-size: 16px;'><strong>Structure:</strong> Subject + <span style='color: #c62828;'>has/have been</span> + past participle</p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Active</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The chef <span style='color: #c62828;'>has cooked</span> the food.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The food <span style='color: #c62828;'>has been cooked</span> by the chef.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>have built</span> many schools.</td> <td style='padding: 8px; border: 1px solid #ddd;'>Many schools <span style='color: #c62828;'>have been built</span>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>She <span style='color: #c62828;'>has written</span> three books.</td> <td style='padding: 8px; border: 1px solid #ddd;'>Three books <span style='color: #c62828;'>have been written</span> by her.</td> </tr> </table><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Note:</strong> Use <span style='color: #c62828;'>has</span> with singular subjects, <span style='color: #c62828;'>have</span> with plural subjects.</p></div></div>",
    "texteParle": "Le present perfect à la voix passive est un peu plus complexe, mais reste logique. La structure est : sujet + has/have been + participe passé. On utilise 'has' pour les sujets singuliers comme 'he', 'she', 'it' et 'have' pour les sujets pluriels comme 'I', 'you', 'we', 'they'. Par exemple, 'Le chef a cuisiné la nourriture' devient 'La nourriture a été cuite par le chef'. 'Ils ont construit beaucoup d'écoles' devient 'Beaucoup d'écoles ont été construites'.",
    "note": "Has/have been indique le present perfect, avec le participe passé."
  },

    "texteParle": "Pour les verbes modaux, la structure est : sujet + modal + be + participe passé. Les modaux les plus courants sont 'can', 'must', 'should', 'may', 'might'. Par exemple, 'Tu dois finir le travail' devient 'Le travail doit être fini'. 'Ils peuvent résoudre le problème' devient 'Le problème peut être résolu'. 'Elle devrait nettoyer la chambre' devient 'La chambre devrait être nettoyée'. Il y a aussi les modaux parfaits comme 'must have been' ou 'should have been' pour parler du passé.",

    "titre": "Passive Voice - When to Use It?",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>When to Use Passive Voice?</h3><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px;'><p style='color: #0d47a1; font-size: 16px;'><strong>Use passive voice when:</strong></p></div><ul style='font-size: 16px;'><li><strong>The doer is unknown or obvious:</strong> My car <span style='color: #c62828;'>was stolen</span> yesterday. (We don't know who stole it.)</li><li><strong>We want to emphasize the action or object:</strong> The letter <span style='color: #c62828;'>was written</span> by the president.</li><li><strong>In formal or academic writing:</strong> The results <span style='color: #c62828;'>are shown</span> in the table.</li><li><strong>In news reports:</strong> The suspect <span style='color: #c62828;'>has been arrested</span>.</li></ul><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #bf360c; font-size: 14px;'><strong>Tip:</strong> Passive voice is more common in English than in French. Use it to sound more natural and formal!</p></div></div>",
    "texteParle": "Quand faut-il utiliser la voix passive ? Il y a plusieurs situations. D'abord, quand on ne sait pas qui fait l'action, comme 'Ma voiture a été volée'. On ne sait pas qui l'a volée. Ensuite, quand on veut mettre l'accent sur l'action ou l'objet plutôt que sur la personne, comme 'La lettre a été écrite par le président'. Dans les écrits formels et académiques, la voix passive est très courante. Par exemple, 'Les résultats sont montrés dans le tableau'. Et dans les journaux, on dit souvent 'Le suspect a été arrêté'. Utilisez la voix passive pour paraître plus formel et naturel en anglais.",
    "note": "La voix passive est très utilisée dans les rapports et les actualités."

    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Active vs. Passive Comparison</h3><div style='background-color: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 16px;'><strong>Compare these sentences:</strong></p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Active Voice</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive Voice</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>The cat <span style='color: #c62828;'>ate</span> the fish.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The fish <span style='color: #c62828;'>was eaten</span> by the cat.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>The teacher <span style='color: #c62828;'>explained</span> the lesson.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The lesson <span style='color: #c62828;'>was explained</span> by the teacher.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>will open</span> the new store.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The new store <span style='color: #c62828;'>will be opened</span>.</td> </tr> </table><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #f57f17; font-size: 14px;'><strong>Rule:</strong> Use active voice for strong, direct statements. Use passive voice to be more formal or when the doer is unknown.</p></div></div>",
    "texteParle": "Il est important de savoir choisir entre la voix active et passive. La voix active est plus directe et dynamique, comme 'Le chat a mangé le poisson'. La voix passive met l'accent sur l'action, comme 'Le poisson a été mangé par le chat'. En général, utilisez la voix active pour les conversations quotidiennes et les écrits simples. Utilisez la voix passive pour les écrits formels, les rapports et quand le sujet qui fait l'action est inconnu ou sans importance. C'est une question de style et de contexte.",

  {

    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Common Mistakes</h3><div style='background-color: #ffebee; padding: 10px; border-radius: 8px;'><p style='color: #b71c1c; font-size: 16px;'><strong>Avoid these errors:</strong></p></div><ul style='font-size: 16px;'><li><span style='color: #c62828;'>Mistake 1:</span> Using the wrong form of 'be'. <br> <span style='color: #1a237e;'>Incorrect:</span> The book <span style='color: #c62828;'>were</span> read. → <span style='color: #1a237e;'>Correct:</span> The book <span style='color: #c62828;'>was</span> read.</li><li><span style='color: #c62828;'>Mistake 2:</span> Forgetting the past participle. <br> <span style='color: #1a237e;'>Incorrect:</span> The work is <span style='color: #c62828;'>finish</span>. → <span style='color: #1a237e;'>Correct:</span> The work is <span style='color: #c62828;'>finished</span>.</li><li><span style='color: #c62828;'>Mistake 3:</span> Using 'by' when it's not needed. <br> <span style='color: #1a237e;'>Incorrect:</span> The letter was written <span style='color: #c62828;'>by someone</span> (unknown). → <span style='color: #1a237e;'>Better:</span> The letter was written. (omit 'by someone')</li><li><span style='color: #c62828;'>Mistake 4:</span> Overusing passive voice. Use it only when appropriate!</li></ul></div>",
    "texteParle": "Il y a quelques erreurs courantes à éviter avec la voix passive. D'abord, il faut utiliser la bonne forme de 'be'. Par exemple, 'The book were read' est incorrect, on dit 'The book was read'. Ensuite, il ne faut pas oublier le participe passé. 'The work is finish' est faux, il faut dire 'finished'. Aussi, on utilise 'by' seulement quand on veut indiquer qui fait l'action. Si c'est inconnu, on l'omet. Et enfin, n'utilisez pas trop la voix passive ; elle peut rendre le texte lourd. Utilisez-la à bon escient.",

    // ================================================================
    // ÉTAT

    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
