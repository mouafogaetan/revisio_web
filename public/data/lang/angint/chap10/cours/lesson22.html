<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction to Relative Clauses",
    "contenu": "<div style='padding: 15px; background: #e3f2fd; border-radius: 12px;'> <h3 style='color: #0d47a1; margin-top: 0;'>What Are Relative Clauses?</h3> <p style='color: #0d47a1; font-size: 16px; line-height: 1.6;'>Relative clauses are clauses that begin with relative pronouns like <strong>who, which, that, whose,</strong> and <strong>whom</strong>. They are used to add extra information about a noun in a sentence.</p> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <p style='color: #0d47a1; font-size: 16px; line-height: 1.8;'><strong>Example:</strong><br> The man <strong>who lives next door</strong> is a teacher.<br> The book <strong>which I bought</strong> is very interesting.</p> </div> <p style='color: #0d47a1; font-size: 16px; line-height: 1.6;'><strong>Why are they important?</strong><br> They help you connect ideas and create more complex sentences. They are essential for advanced writing and speaking.</p> </div>",
    "texteParle": "Bonjour à tous ! Aujourd'hui, nous allons apprendre à utiliser les propositions relatives en anglais. Une proposition relative est une partie de phrase qui commence par un pronom relatif comme 'who', 'which', ou 'that'. Elle donne des informations supplémentaires sur un nom. Par exemple, dans 'The man who lives next door is a teacher', 'who lives next door' est la proposition relative qui donne des informations sur l'homme. Les relatives sont très importantes pour enrichir votre anglais et construire des phrases plus complexes.",
    "note": "Les pronoms relatifs en anglais sont : who (personnes), which (choses), that (personnes ou choses), whose (possession), whom (personnes - formel)."
  },
  {
    "titre": "Defining vs Non-Defining Relative Clauses",
    "contenu": "<div style='padding: 15px; background: #e8f5e9; border-radius: 12px;'> <h3 style='color: #1b5e20; margin-top: 0;'>Defining vs Non-Defining Clauses</h3> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #1b5e20; margin: 0;'>Defining Relative Clauses</h4> <ul style='list-style: none; padding: 0; color: #1b5e20; font-size: 16px; line-height: 1.8;'> <li>📝 <strong>Definition:</strong> Essential to the meaning of the sentence. Without it, the sentence is incomplete.</li> <li>📝 <strong>Example:</strong> The student <strong>who studies hard</strong> passes the exam. (Which student? The one who studies hard.)</li> <li>📝 <strong>No commas:</strong> She lives in a house <strong>that is very old</strong>.</li> </ul> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #1b5e20; margin: 0;'>Non-Defining Relative Clauses</h4> <ul style='list-style: none; padding: 0; color: #1b5e20; font-size: 16px; line-height: 1.8;'> <li>📝 <strong>Definition:</strong> Adds extra information. The sentence remains clear without it.</li> <li>📝 <strong>Example:</strong> My mother, <strong>who is 65 years old</strong>, is a nurse. (We know who she is; the extra info is just additional.)</li> <li>📝 <strong>Commas are used:</strong> Paris, <strong>which is the capital of France</strong>, is a beautiful city.</li> </ul> </div> </div>",
    "texteParle": "Il existe deux types de propositions relatives. Les relatives définissantes sont essentielles au sens de la phrase. Si vous les enlevez, la phrase devient incomplète. Par exemple, 'The student who studies hard passes the exam'. Sans la relative, on ne sait pas de quel étudiant on parle. Les relatives non-définissantes ajoutent une information supplémentaire. Vous pouvez les supprimer sans changer le sens principal. Par exemple, 'My mother, who is 65 years old, is a nurse'. Ici, l'information sur l'âge est juste un complément. Notez que les relatives non-définissantes sont toujours encadrées par des virgules.",
    "note": "Dans les relatives définissantes, on peut souvent supprimer le pronom relatif s'il est l'objet du verbe : 'The book (that) I read' est correct."
  },
  {
    "titre": "Relative Pronouns and Their Uses",
    "contenu": "<div style='padding: 15px; background: #fff3e0; border-radius: 12px;'> <h3 style='color: #e65100; margin-top: 0;'>Choosing the Right Relative Pronoun</h3> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <table style='width: 100%; border-collapse: collapse; color: #e65100; font-size: 14px;'> <tr style='background: #ffe0b2;'> <th style='padding: 8px; border: 1px solid #e65100; text-align: left;'>Pronoun</th> <th style='padding: 8px; border: 1px solid #e65100; text-align: left;'>Use</th> <th style='padding: 8px; border: 1px solid #e65100; text-align: left;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #e65100;'><strong>Who</strong></td> <td style='padding: 8px; border: 1px solid #e65100;'>For people (subject)</td> <td style='padding: 8px; border: 1px solid #e65100;'>The woman <strong>who</strong> called you is my sister.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #e65100;'><strong>Whom</strong></td> <td style='padding: 8px; border: 1px solid #e65100;'>For people (object) - formal</td> <td style='padding: 8px; border: 1px solid #e65100;'>The man <strong>whom</strong> I met is famous.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #e65100;'><strong>Which</strong></td> <td style='padding: 8px; border: 1px solid #e65100;'>For things or animals</td> <td style='padding: 8px; border: 1px solid #e65100;'>The car <strong>which</strong> I bought is red.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #e65100;'><strong>That</strong></td> <td style='padding: 8px; border: 1px solid #e65100;'>For people or things (defining only)</td> <td style='padding: 8px; border: 1px solid #e65100;'>The book <strong>that</strong> I read was great.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #e65100;'><strong>Whose</strong></td> <td style='padding: 8px; border: 1px solid #e65100;'>Possession (people or things)</td> <td style='padding: 8px; border: 1px solid #e65100;'>The student <strong>whose</strong> bag is lost is upset.</td> </tr> </table> </div> </div>",
    "texteParle": "Le choix du pronom relatif dépend de ce que vous décrivez. 'Who' est utilisé pour les personnes, 'which' pour les choses ou les animaux, et 'that' peut être utilisé pour les personnes ou les choses dans les relatives définissantes. 'Whom' est la forme formelle pour les personnes lorsqu'elles sont l'objet du verbe. 'Whose' indique la possession. Nous allons voir des exemples pour chaque pronom. Il est important de bien choisir le pronom pour que la phrase soit claire et grammaticalement correcte.",
    "note": "En anglais parlé, 'who' est souvent utilisé à la place de 'whom', même dans les contextes formels. L'usage de 'whom' devient rare."
  },
  {
    "titre": "Combining Sentences with Relative Clauses",
    "contenu": "<div style='padding: 15px; background: #fce4ec; border-radius: 12px;'> <h3 style='color: #880e4f; margin-top: 0;'>Combining Sentences</h3> <p style='color: #880e4f; font-size: 16px; line-height: 1.6;'>Relative clauses allow you to combine two sentences into one, making your writing more fluid and sophisticated.</p> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <p style='color: #880e4f; font-size: 16px; line-height: 1.8;'><strong>Example 1:</strong><br> • The man is my uncle. He lives in Douala.<br> ➡️ The man <strong>who lives in Douala</strong> is my uncle.</p> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <p style='color: #880e4f; font-size: 16px; line-height: 1.8;'><strong>Example 2:</strong><br> • I have a friend. Her brother is a doctor.<br> ➡️ I have a friend <strong>whose brother</strong> is a doctor.</p> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <p style='color: #880e4f; font-size: 16px; line-height: 1.8;'><strong>Example 3:</strong><br> • I bought a car. It is very fast.<br> ➡️ The car <strong>which I bought</strong> is very fast.</p> </div> </div>",
    "texteParle": "Les propositions relatives sont très utiles pour combiner deux phrases en une seule phrase plus fluide. Par exemple, au lieu de dire 'The man is my uncle. He lives in Douala', vous pouvez dire 'The man who lives in Douala is my uncle'. Cela évite les répétitions et rend votre anglais plus naturel. Nous allons pratiquer plusieurs combinaisons avec différents pronoms relatifs. C'est une compétence très utile à l'écrit et à l'oral.",
    "note": "Quand le pronom relatif est l'objet du verbe (comme 'the car which I bought'), on peut souvent le supprimer : 'the car I bought' est très courant."
  },
  {
    "titre": "Relative Clauses with Prepositions",
    "contenu": "<div style='padding: 15px; background: #ede7f6; border-radius: 12px;'> <h3 style='color: #311b92; margin-top: 0;'>Relative Clauses with Prepositions</h3> <p style='color: #311b92; font-size: 16px; line-height: 1.6;'>In more formal English, prepositions can be placed before the relative pronoun. In informal English, they are often placed at the end of the clause.</p> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #311b92; margin: 0;'>Formal Style</h4> <ul style='list-style: none; padding: 0; color: #311b92; font-size: 16px; line-height: 1.8;'> <li>📝 The person <strong>to whom</strong> I spoke is the director.</li> <li>📝 The company <strong>for which</strong> she works is in Yaoundé.</li> <li>📝 The subject <strong>about which</strong> we talked is interesting.</li> </ul> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #311b92; margin: 0;'>Informal Style</h4> <ul style='list-style: none; padding: 0; color: #311b92; font-size: 16px; line-height: 1.8;'> <li>📝 The person <strong>who</strong> I spoke <strong>to</strong> is the director.</li> <li>📝 The company <strong>which</strong> she works <strong>for</strong> is in Yaoundé.</li> <li>📝 The subject <strong>which</strong> we talked <strong>about</strong> is interesting.</li> </ul> </div> <p style='color: #311b92; font-size: 16px; line-height: 1.6;'><strong>Note:</strong> In formal writing, avoid ending sentences with prepositions. In everyday speech, it's perfectly acceptable.</p> </div>",
    "texteParle": "Dans les propositions relatives, la préposition peut être placée à différents endroits. Dans un style formel, on place la préposition avant le pronom relatif, comme dans 'the person to whom I spoke'. Dans un style informel, on place la préposition à la fin de la proposition, comme dans 'the person who I spoke to'. Les deux sont corrects, mais le style formel est plus utilisé à l'écrit et dans les situations professionnelles. Le style informel est plus courant à l'oral. Il est bon de connaître les deux et de savoir quand les utiliser.",
    "note": "En anglais, il est courant de terminer une phrase par une préposition dans le langage parlé, bien que cela soit souvent déconseillé à l'écrit formel."

  {
    "titre": "Advanced Sentence Patterns - Inversion",
    "contenu": "<div style='padding: 15px; background: #fff8e1; border-radius: 12px;'> <h3 style='color: #f57f17; margin-top: 0;'>Inversion in Relative Clauses</h3> <p style='color: #f57f17; font-size: 16px; line-height: 1.6;'>Inversion is a more advanced structure where the verb comes before the subject. It is often used for emphasis or in formal writing.</p> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #f57f17; margin: 0;'>Examples of Inversion</h4> <ul style='list-style: none; padding: 0; color: #f57f17; font-size: 16px; line-height: 1.8;'> <li>📝 <strong>Not only</strong> did she pass the exam, <strong>but</strong> she also got the highest grade. (emphasis)</li> <li>📝 <strong>Never</strong> have I seen such a beautiful view. (emphasis)</li> <li>📝 <strong>Had I</strong> known, I would have helped. (conditional with inversion)</li> </ul> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #f57f17; margin: 0;'>Inversion in Relative Clauses</h4> <ul style='list-style: none; padding: 0; color: #f57f17; font-size: 16px; line-height: 1.8;'> <li>📝 The house, <strong>in which</strong> lived a famous writer, is now a museum.</li> <li>📝 The country, <strong>with which</strong> are associated many traditions, is Cameroon.</li> </ul> </div> </div>",
    "texteParle": "L'inversion est une structure avancée qui consiste à inverser l'ordre sujet-verbe pour créer un effet de style ou pour mettre l'accent. Par exemple, au lieu de dire 'She not only passed the exam, but she also...', on peut dire 'Not only did she pass the exam, but she also...'. C'est plus formel et plus soutenu. L'inversion peut aussi être utilisée dans les propositions relatives, surtout à l'écrit. Par exemple, 'The house, in which lived a famous writer'. Cette structure est moins courante à l'oral, mais elle est utile pour les écrits académiques.",
    "note": "L'inversion se fait souvent avec des mots négatifs en début de phrase : Never, Not only, Rarely, Seldom, etc."
  },
  {
    "titre": "Advanced Sentence Patterns - Cleft Sentences",
    "contenu": "<div style='padding: 15px; background: #e8f5e9; border-radius: 12px;'> <h3 style='color: #1b5e20; margin-top: 0;'>Cleft Sentences</h3> <p style='color: #1b5e20; font-size: 16px; line-height: 1.6;'>Cleft sentences are used to emphasize a particular part of a sentence. They are formed by using 'it' or a relative clause.</p> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #1b5e20; margin: 0;'>It-cleft sentences</h4> <ul style='list-style: none; padding: 0; color: #1b5e20; font-size: 16px; line-height: 1.8;'> <li>📝 <strong>It was</strong> my brother <strong>who</strong> told me the news.</li> <li>📝 <strong>It is</strong> the weather <strong>that</strong> affects my mood.</li> <li>📝 <strong>It was</strong> in Douala <strong>where</strong> I grew up.</li> </ul> </div> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <h4 style='color: #1b5e20; margin: 0;'>What-cleft sentences</h4> <ul style='list-style: none; padding: 0; color: #1b5e20; font-size: 16px; line-height: 1.8;'> <li>📝 <strong>What</strong> I need <strong>is</strong> a good night's sleep.</li> <li>📝 <strong>What</strong> she said <strong>was</strong> very interesting.</li> <li>📝 <strong>What</strong> they want <strong>is</strong> more opportunities.</li> </ul> </div> </div>",
    "texteParle": "Les phrases clivées sont utilisées pour mettre l'accent sur une partie spécifique de la phrase. Par exemple, au lieu de dire 'My brother told me the news', on peut dire 'It was my brother who told me the news' pour insister sur le fait que c'est mon frère. On peut aussi utiliser 'what' pour insister sur une idée ou une action, comme dans 'What I need is a good night's sleep'. Les phrases clivées sont très utiles pour structurer vos arguments à l'oral et à l'écrit.",
    "note": "Les phrases clivées sont très courantes en anglais parlé et écrit pour mettre en valeur une information importante."
  },
  {

    "contenu": "<div style='padding: 15px; background: #ffebee; border-radius: 12px;'> <h3 style='color: #b71c1c; margin-top: 0;'>Common Mistakes</h3> <div style='background: white; padding: 12px; border-radius: 8px; margin: 10px 0;'> <ul style='list-style: none; padding: 0; color: #b71c1c; font-size: 16px; line-height: 1.8;'> <li>❌ <strong>Wrong:</strong> The man <strong>which</strong> is sitting there is my teacher.<br> ✅ <strong>Correct:</strong> The man <strong>who</strong> is sitting there is my teacher.</li> <li>❌ <strong>Wrong:</strong> She has a car <strong>who</strong> is very fast.<br> ✅ <strong>Correct:</strong> She has a car <strong>which/that</strong> is very fast.</li> <li>❌ <strong>Wrong:</strong> The book, <strong>that</strong> I read, is interesting.<br> ✅ <strong>Correct:</strong> The book, <strong>which</strong> I read, is interesting. (Non-defining, so 'that' is incorrect)</li> <li>❌ <strong>Wrong:</strong> The person <strong>who</strong> I spoke to <strong>him</strong> was nice.<br> ✅ <strong>Correct:</strong> The person <strong>who</strong> I spoke to was nice. (No 'him')</li> <li>❌ <strong>Wrong:</strong> I met a friend <strong>whose</strong> car is red. → (Correct if you mean a friend and the car belongs to them)<br> But don't use 'whose' for objects: ❌ The book whose cover is red. ✅ The book <strong>of which</strong> the cover is red. (or: The book with the red cover.)</li> </ul> </div> </div>",
    "texteParle": "Les propositions relatives peuvent être source d'erreurs. Il est important de bien choisir le pronom. Par exemple, on ne dit pas 'The man which' mais 'The man who'. 'Which' est pour les choses, 'who' pour les personnes. Dans les relatives non-définissantes, on utilise 'which' et non 'that'. Attention aussi à ne pas répéter le sujet dans la relative, comme dans 'The person who I spoke to him'. Nous allons voir d'autres erreurs courantes pour vous aider à les éviter.",
    "note": "Dans les relatives définissantes, on peut utiliser 'that' à la place de 'who' ou 'which', mais 'that' n'est jamais utilisé dans les relatives non-définissantes."

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
