<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Lesson 31 - Comprehensive Grammar and Vocabulary Review",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e; text-align: center;'>Comprehensive Grammar and Vocabulary Review</h2><p style='font-size: 18px; text-align: center;'>Consolidate everything you've learned!</p><div style='background-color: #e8eaf6; padding: 15px; border-radius: 10px; margin-top: 20px;'><p style='color: #1a237e; font-size: 16px; text-align: center;'><strong>Welcome to the final review!</strong></p><p style='font-size: 16px; text-align: center;'>We will review all the advanced grammar structures and vocabulary you have learned throughout this course.</p></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #bf360c; font-size: 16px; text-align: center;'><strong>Goal:</strong> Consolidate your knowledge and identify areas for improvement.</p></div></div>",
    "texteParle": "Bonjour à tous ! Bienvenue à cette dernière révision. Aujourd'hui, nous allons revoir toutes les structures grammaticales avancées et le vocabulaire que vous avez appris tout au long de ce cours. L'objectif est de consolider vos connaissances et d'identifier les points à améliorer. C'est l'occasion de voir vos progrès et de vous préparer pour la suite. Allons-y !",
    "note": "Cette révision vous prépare pour le niveau avancé (B2/C1)."
  },
  {
    "titre": "Tense Review - Perfect Tenses",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Perfect Tenses Review</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Tense</th> <th style='padding: 8px; border: 1px solid #ddd;'>Use</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Present Perfect</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Life experiences, recent actions</td> <td style='padding: 8px; border: 1px solid #ddd;'>I <span style='color: #c62828;'>have visited</span> Paris.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Present Perfect Continuous</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Actions that started in the past and continue</td> <td style='padding: 8px; border: 1px solid #ddd;'>She <span style='color: #c62828;'>has been working</span> here for 5 years.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Past Perfect</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Action before another past action</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>had left</span> before I arrived.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Future Perfect</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Action completed before a future time</td> <td style='padding: 8px; border: 1px solid #ddd;'>I <span style='color: #c62828;'>will have finished</span> by 5 p.m.</td> </tr> </table><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Key time expressions:</strong> for, since, already, yet, just, before, by + time.</p></div></div>",
    "texteParle": "Commençons par les temps parfaits. Le present perfect pour les expériences de vie et les actions récentes. Le present perfect continuous pour les actions qui ont commencé dans le passé et continuent. Le past perfect pour une action avant une autre action passée. Et le future perfect pour une action terminée avant un moment futur. N'oubliez pas les expressions de temps comme 'for', 'since', 'already', 'yet', 'just', 'before' et 'by + time'. Ces temps sont essentiels pour parler du passé et du futur de manière précise.",
    "note": "Les temps parfaits sont très importants pour un niveau avancé."
  },
  {
    "titre": "Conditionals Review",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Conditional Forms Review</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Conditional</th> <th style='padding: 8px; border: 1px solid #ddd;'>Structure</th> <th style='padding: 8px; border: 1px solid #ddd;'>Use</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Zero</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>If + present, present</td> <td style='padding: 8px; border: 1px solid #ddd;'>General truths</td> <td style='padding: 8px; border: 1px solid #ddd;'>If you heat water, it <span style='color: #c62828;'>boils</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>First</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>If + present, will + base</td> <td style='padding: 8px; border: 1px solid #ddd;'>Real future possibilities</td> <td style='padding: 8px; border: 1px solid #ddd;'>If it rains, I <span style='color: #c62828;'>will stay</span> home.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Second</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>If + past, would + base</td> <td style='padding: 8px; border: 1px solid #ddd;'>Hypothetical present/future</td> <td style='padding: 8px; border: 1px solid #ddd;'>If I <span style='color: #c62828;'>had</span> more money, I <span style='color: #c62828;'>would travel</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Third</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>If + past perfect, would have + past participle</td> <td style='padding: 8px; border: 1px solid #ddd;'>Hypothetical past</td> <td style='padding: 8px; border: 1px solid #ddd;'>If I <span style='color: #c62828;'>had studied</span>, I <span style='color: #c62828;'>would have passed</span>.</td> </tr> </table></div>",
    "texteParle": "Maintenant, les conditionnels. Le zéro conditionnel pour les vérités générales. Le premier conditionnel pour les possibilités réelles dans le futur. Le deuxième conditionnel pour des situations hypothétiques dans le présent ou le futur. Et le troisième conditionnel pour des situations hypothétiques dans le passé. Chaque conditionnel a une structure et un usage spécifiques. Assurez-vous de bien les maîtriser. Ils sont très utiles pour exprimer des possibilités, des hypothèses et des regrets.",
    "note": "Les conditionnels sont essentiels pour exprimer des hypothèses."
  },
  {
    "titre": "Reported Speech Review",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Reported Speech Review</h3><p style='font-size: 16px;'><strong>Key rules for reporting statements:</strong></p><ul style='font-size: 16px;'><li><strong>Change the tense:</strong> 'I am happy' → She <span style='color: #c62828;'>said</span> she <span style='color: #c62828;'>was</span> happy.</li><li><strong>Change pronouns:</strong> 'I like you' → He <span style='color: #c62828;'>said</span> he <span style='color: #c62828;'>liked</span> me.</li><li><strong>Change time expressions:</strong> 'I will come tomorrow' → She said she <span style='color: #c62828;'>would come the next day</span>.</li></ul><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Reporting verbs:</strong> <span style='color: #c62828;'>say, tell, ask, explain, suggest, advise, warn</span></p></div><div style='background-color: #f3e5f5; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #4a148c; font-size: 14px;'><strong>For questions:</strong> 'Where is the bank?' → He asked <span style='color: #c62828;'>where the bank was</span>.</p></div></div>",
    "texteParle": "Le discours rapporté est une compétence importante. Quand on rapporte des paroles, on change les temps, les pronoms et les expressions de temps. Par exemple, 'Je suis content' devient 'Elle a dit qu'elle était contente'. Les verbes introducteurs sont nombreux : 'say', 'tell', 'ask', 'explain', 'suggest', 'advise', 'warn'. Pour les questions, on change l'ordre des mots. Par exemple, 'Où est la banque ?' devient 'Il a demandé où était la banque'. Pratiquez ces transformations.",
    "note": "Le discours rapporté est très utilisé dans les conversations."
  },
  {
    "titre": "Passive Voice Review",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Passive Voice Review</h3><div style='background-color: #e8f5e9; padding: 10px; border-radius: 8px;'><p style='color: #1b5e20; font-size: 16px;'><strong>Structure:</strong> Subject + <span style='color: #c62828;'>be (in correct tense)</span> + <span style='color: #c62828;'>past participle</span></p></div><table style='width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Tense</th> <th style='padding: 8px; border: 1px solid #ddd;'>Active</th> <th style='padding: 8px; border: 1px solid #ddd;'>Passive</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>Present Simple</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>build</span> houses.</td> <td style='padding: 8px; border: 1px solid #ddd;'>Houses <span style='color: #c62828;'>are built</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>Past Simple</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>built</span> a new school.</td> <td style='padding: 8px; border: 1px solid #ddd;'>A new school <span style='color: #c62828;'>was built</span>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>Future Simple</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>will finish</span> the project.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The project <span style='color: #c62828;'>will be finished</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'>Present Perfect</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>have completed</span> the work.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The work <span style='color: #c62828;'>has been completed</span>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'>Modal</td> <td style='padding: 8px; border: 1px solid #ddd;'>You <span style='color: #c62828;'>must finish</span> the report.</td> <td style='padding: 8px; border: 1px solid #ddd;'>The report <span style='color: #c62828;'>must be finished</span>.</td> </tr> </table></div>",
    "texteParle": "La voix passive est très utilisée dans les écrits formels. La structure est : sujet + être (au bon temps) + participe passé. Nous avons vu la voix passive dans tous les temps : présent simple, passé simple, futur simple, present perfect et avec les verbes modaux. Utilisez la voix passive quand vous voulez mettre l'accent sur l'action plutôt que sur la personne qui l'a faite. C'est très utile dans les rapports, les actualités et les écrits académiques.",
    "note": "La voix passive est essentielle pour les écrits formels."
  },
  {
    "titre": "Modal Verbs Review",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Modal Verbs Review</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Modal</th> <th style='padding: 8px; border: 1px solid #ddd;'>Use</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Must</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Obligation, strong necessity</td> <td style='padding: 8px; border: 1px solid #ddd;'>You <span style='color: #c62828;'>must</span> wear a seatbelt.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Should</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Advice, recommendation</td> <td style='padding: 8px; border: 1px solid #ddd;'>You <span style='color: #c62828;'>should</span> see a doctor.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Can</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Ability, permission</td> <td style='padding: 8px; border: 1px solid #ddd;'>I <span style='color: #c62828;'>can</span> speak French.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Might</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Possibility (less certain)</td> <td style='padding: 8px; border: 1px solid #ddd;'>It <span style='color: #c62828;'>might</span> rain later.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Must have</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Strong deduction about the past</td> <td style='padding: 8px; border: 1px solid #ddd;'>She <span style='color: #c62828;'>must have</span> left early.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Should have</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Criticism, regret</td> <td style='padding: 8px; border: 1px solid #ddd;'>I <span style='color: #c62828;'>should have</span> studied more.</td> </tr> </table></div>",
    "texteParle": "Les verbes modaux sont très importants. 'Must' pour l'obligation et la nécessité. 'Should' pour le conseil et la recommandation. 'Can' pour la capacité et la permission. 'Might' pour la possibilité. 'Must have' pour une déduction forte sur le passé. 'Should have' pour la critique ou le regret. Ces modaux vous permettent d'exprimer des nuances très précises dans vos conversations et vos écrits. N'oubliez pas qu'ils sont invariables et toujours suivis d'un verbe à l'infinitif sans 'to'.",
    "note": "Les modaux permettent d'exprimer des nuances de sens."
  },
  {
    "titre": "Vocabulary Review - Phrasal Verbs",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Phrasal Verbs Review</h3><p style='font-size: 16px;'>Common phrasal verbs and their meanings:</p><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Phrasal Verb</th> <th style='padding: 8px; border: 1px solid #ddd;'>Meaning</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Look after</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Take care of</td> <td style='padding: 8px; border: 1px solid #ddd;'>Can you <span style='color: #c62828;'>look after</span> my bag?</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Give up</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Stop doing</td> <td style='padding: 8px; border: 1px solid #ddd;'>He <span style='color: #c62828;'>gave up</span> smoking.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Take off</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Remove (clothes); (plane) leave</td> <td style='padding: 8px; border: 1px solid #ddd;'>The plane <span style='color: #c62828;'>took off</span> at 3 p.m.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Get along</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Have a good relationship</td> <td style='padding: 8px; border: 1px solid #ddd;'>We <span style='color: #c62828;'>get along</span> very well.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Turn down</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Reject</td> <td style='padding: 8px; border: 1px solid #ddd;'>They <span style='color: #c62828;'>turned down</span> the offer.</td> </tr> </table></div>",
    "texteParle": "Les phrasal verbs sont très courants en anglais. 'Look after' signifie prendre soin de. 'Give up' signifie arrêter de faire. 'Take off' peut signifier enlever (des vêtements) ou décoller (pour un avion). 'Get along' signifie bien s'entendre avec quelqu'un. Et 'turn down' signifie refuser. Ces verbes sont très utilisés dans la conversation quotidienne. N'oubliez pas de distinguer les phrasal verbs séparables des inséparables.",
    "note": "Les phrasal verbs sont très fréquents en anglais parlé."
  },
  {
    "titre": "Vocabulary Review - Collocations",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Collocations Review</h3><p style='font-size: 16px;'>Words that naturally go together:</p><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Type</th> <th style='padding: 8px; border: 1px solid #ddd;'>Collocation</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Verb + Noun</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Make a decision</td> <td style='padding: 8px; border: 1px solid #ddd;'>We need to <span style='color: #c62828;'>make a decision</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Adjective + Noun</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Strong evidence</td> <td style='padding: 8px; border: 1px solid #ddd;'>There is <span style='color: #c62828;'>strong evidence</span>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Adverb + Adjective</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Highly effective</td> <td style='padding: 8px; border: 1px solid #ddd;'>This method is <span style='color: #c62828;'>highly effective</span>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Verb + Adverb</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Speak fluently</td> <td style='padding: 8px; border: 1px solid #ddd;'>He <span style='color: #c62828;'>speaks fluently</span>.</td> </tr> </table><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #f57f17; font-size: 14px;'><strong>Tip:</strong> Using collocations makes your English sound more natural and native-like.</p></div></div>",
    "texteParle": "Les collocations sont des mots qui vont naturellement ensemble en anglais. Par exemple, on dit 'make a decision' et non 'do a decision'. 'Strong evidence' et non 'big evidence'. 'Highly effective' et non 'very effective' (bien que les deux soient possibles, 'highly' est plus courant dans ce contexte). Utiliser les collocations correctes rend votre anglais plus naturel et plus proche de celui d'un natif. C'est une compétence clé pour le niveau avancé.",
    "note": "Les collocations sont essentielles pour un anglais naturel."
  },
  {
    "titre": "Vocabulary Review - Idioms and Slang",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Idioms and Slang Review</h3><p style='font-size: 16px;'>Common idioms and slang expressions:</p><ul style='font-size: 16px;'><li><span style='color: #c62828;'>Break the ice</span> – Start a conversation.</li><li><span style='color: #c62828;'>Piece of cake</span> – Very easy.</li><li><span style='color: #c62828;'>Cost an arm and a leg</span> – Very expensive.</li><li><span style='color: #c62828;'>Under the weather</span> – Feeling ill.</li><li><span style='color: #c62828;'>Bite the bullet</span> – Face a difficult situation.</li><li><span style='color: #c62828;'>Cool</span> – Excellent, good.</li><li><span style='color: #c62828;'>Gonna</span> – Going to.</li><li><span style='color: #c62828;'>Wanna</span> – Want to.</li></ul><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Remember:</strong> Idioms and slang are best used in informal contexts. Be careful with formal writing.</p></div></div>",
    "texteParle": "Les expressions idiomatiques et l'argot ajoutent de la couleur à votre anglais. 'Break the ice' pour commencer une conversation. 'Piece of cake' pour dire que c'est très facile. 'Cost an arm and a leg' pour dire que c'est très cher. 'Under the weather' pour dire qu'on se sent mal. 'Bite the bullet' pour affronter une situation difficile. Et les mots d'argot comme 'cool', 'gonna', 'wanna'. Souvenez-vous que l'argot s'utilise dans des contextes informels, avec des amis ou en famille. Pas dans des écrits formels.",
    "note": "Les idiomes et l'argot enrichissent votre expression orale."
  },
  {
    "titre": "Common Errors to Avoid",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Common Errors to Avoid</h3><ul style='font-size: 16px;'><li><span style='color: #c62828;'>Mistake 1:</span> Using present perfect with a specific time (e.g., 'I have seen him yesterday.' → Correct: <span style='color: #1a237e;'>I saw him yesterday</span>).</li><li><span style='color: #c62828;'>Mistake 2:</span> Confusing 'for' and 'since' (e.g., 'I have lived here for 2010.' → Correct: <span style='color: #1a237e;'>I have lived here since 2010</span>).</li><li><span style='color: #c62828;'>Mistake 3:</span> Double negative (e.g., 'I don't have nothing.' → Correct: <span style='color: #1a237e;'>I don't have anything</span>).</li><li><span style='color: #c62828;'>Mistake 4:</span> Using 'say' instead of 'tell' (e.g., 'He said me a story.' → Correct: <span style='color: #1a237e;'>He told me a story</span>).</li><li><span style='color: #c62828;'>Mistake 5:</span> Overusing passive voice. Use active voice for clear, direct sentences.</li></ul><div style='background-color: #ffebee; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #b71c1c; font-size: 14px;'><strong>Tip:</strong> Review these errors regularly to improve your accuracy.</p></div></div>",
    "texteParle": "Il y a quelques erreurs courantes à éviter. D'abord, ne pas utiliser le present perfect avec un moment précis. On dit 'I saw him yesterday', pas 'I have seen him yesterday'. Ensuite, ne pas confondre 'for' et 'since'. 'For' pour une durée, 'since' pour un point de départ. Évitez les doubles négations. Enfin, ne pas confondre 'say' et 'tell'. 'Say' est suivi de 'to' ou d'un objet direct, 'tell' est suivi d'un objet indirect. Et n'oubliez pas d'utiliser la voix active quand c'est plus direct. Ces erreurs sont fréquentes, mais vous pouvez les éviter.",
    "note": "Ces erreurs sont fréquentes, mais faciles à corriger."
  },
  {
    "titre": "Practice Time - Mixed Exercises",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Practice - Mixed Exercises</h3><p style='font-size: 16px;'>Let's test your knowledge with some mixed exercises.</p><ol style='font-size: 16px;'><li>Fill in the blank: 'By next year, I ________ (finish) my studies.' (Future Perfect)</li><li>Transform to passive: 'The chef prepared a delicious meal.'</li><li>Change to reported speech: 'I will come tomorrow,' she said.</li><li>Correct the error: 'I have seen him yesterday.'</li><li>Choose the correct phrasal verb: 'Please ________ (turn off / turn down) the lights before you leave.'</li></ol><div style='background-color: #e8f5e9; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #1b5e20;'><strong>Answers:</strong> 1. will have finished; 2. A delicious meal was prepared by the chef; 3. She said she would come the next day; 4. I saw him yesterday; 5. turn off.</p></div></div>",
    "texteParle": "Maintenant, on va s'entraîner avec des exercices mélangés. Je vais vous donner des phrases à compléter, transformer ou corriger. Par exemple, 'By next year, I ________ (finish) my studies' est au future perfect. Transformez 'The chef prepared a delicious meal' à la voix passive. Changez 'I will come tomorrow' en discours rapporté. Corrigez 'I have seen him yesterday'. Et choisissez le bon phrasal verb. Les réponses sont sur le slide pour que vous puissiez vérifier. C'est le moment de voir ce que vous avez retenu !",
    "note": "La pratique est essentielle pour consolider vos connaissances."
  },
  {
    "titre": "Homework - Self-Assessment",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Homework - Self-Assessment</h3><p style='font-size: 16px;'>Reflect on your progress and identify areas for improvement.</p><ol style='font-size: 16px;'><li>What are your strengths in English grammar?</li><li>What areas do you need to improve (e.g., conditionals, modals, phrasal verbs)?</li><li>Write 3-5 sentences using each of the following tenses: Present Perfect, Past Perfect, Future Perfect.</li><li>Write a short paragraph (5-7 sentences) using 5 phrasal verbs.</li></ol><div style='background-color: #e0f7fa; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #00695c; font-size: 14px;'><strong>Tip:</strong> Be honest with yourself. This self-assessment will help you focus your studies.</p></div></div>",
    "texteParle": "Pour les devoirs, je vous propose de faire une auto-évaluation. Réfléchissez à vos forces et à vos faiblesses en grammaire anglaise. Quels sont les points que vous maîtrisez le mieux ? Quels sont les domaines à améliorer ? Écrivez des phrases avec les temps parfaits. Écrivez un paragraphe avec des phrasal verbs. Cette auto-évaluation vous aidera à cibler vos révisions. Soyez honnête avec vous-même. C'est un outil pour progresser.",
    "note": "L'auto-évaluation est un outil puissant pour progresser."
  },
  {
    "titre": "Summary - Course Review",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});
