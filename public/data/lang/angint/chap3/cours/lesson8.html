<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Lesson 8 - Idiomatic Expressions and Slang",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h2 style='color: #1a237e; text-align: center;'>Idiomatic Expressions and Slang</h2><p style='font-size: 18px; text-align: center;'>Speak naturally and understand native speakers!</p><div style='background-color: #e8eaf6; padding: 15px; border-radius: 10px; margin-top: 20px;'><p style='color: #1a237e; font-size: 16px; text-align: center;'><strong>What are idioms?</strong></p><p style='font-size: 16px; text-align: center;'>Idioms are expressions whose meaning is not literal. They add color and personality to your English.</p></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #bf360c; font-size: 16px; text-align: center;'><strong>Example:</strong> <span style='color: #c62828;'>It's raining cats and dogs.</span> (It means it's raining very heavily!)</p></div></div>",
    "texteParle": "Bonjour à tous ! Aujourd'hui, nous allons parler des expressions idiomatiques et de l'argot anglais. Les expressions idiomatiques sont des phrases dont le sens n'est pas littéral. Par exemple, 'it's raining cats and dogs' ne signifie pas qu'il pleut des chats et des chiens, mais qu'il pleut très fort. L'argot est un langage informel souvent utilisé entre amis. Connaître ces expressions vous aidera à parler plus naturellement et à mieux comprendre les locuteurs natifs. Allons-y !",
    "note": "Les expressions idiomatiques sont essentielles pour un niveau avancé."
  },
  {
    "titre": "Why Learn Idioms?",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Why Are Idioms Important?</h3><ul style='font-size: 16px;'><li><strong>Sound natural:</strong> Using idioms makes you sound like a native speaker.</li><li><strong>Understand media:</strong> Movies, TV shows, and songs are full of idioms.</li><li><strong>Cultural insight:</strong> Idioms reflect the culture and history of a language.</li><li><strong>Express yourself:</strong> Idioms allow you to express ideas in a more colorful way.</li></ul><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 16px;'><strong>Did you know?</strong> English has thousands of idioms. We use them every day!</p></div></div>",
    "texteParle": "Pourquoi apprendre les expressions idiomatiques ? D'abord, elles vous aident à parler comme un locuteur natif. Ensuite, vous comprendrez mieux les films, les séries et les chansons en anglais. Les idiomes sont aussi un reflet de la culture anglaise. Ils permettent de s'exprimer de manière plus vivante et plus imagée. Par exemple, on dit souvent 'break a leg' pour souhaiter bonne chance. Sans connaitre l'expression, on pourrait penser qu'on veut casser une jambe ! Alors, apprenons ces expressions essentielles.",
    "note": "Les idiomes sont très courants dans la conversation quotidienne."
  },
  {
    "titre": "Common Idioms - Part 1",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>10 Common Idioms (Part 1)</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Idiom</th> <th style='padding: 8px; border: 1px solid #ddd;'>Meaning</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Break the ice</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Start a conversation</td> <td style='padding: 8px; border: 1px solid #ddd;'>He told a joke to <em>break the ice</em>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Piece of cake</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Very easy</td> <td style='padding: 8px; border: 1px solid #ddd;'>The exam was a <em>piece of cake</em>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Hit the nail on the head</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Be exactly right</td> <td style='padding: 8px; border: 1px solid #ddd;'>You <em>hit the nail on the head</em>!</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Cost an arm and a leg</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Very expensive</td> <td style='padding: 8px; border: 1px solid #ddd;'>The car <em>cost an arm and a leg</em>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Let the cat out of the bag</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Reveal a secret</td> <td style='padding: 8px; border: 1px solid #ddd;'>She <em>let the cat out of the bag</em>.</td> </tr> </table></div>",
    "texteParle": "Commençons par cinq expressions idiomatiques très courantes. 'Break the ice' signifie commencer une conversation, souvent quand les gens ne se connaissent pas. 'Piece of cake' veut dire très facile. 'Hit the nail on the head', c'est être exactement juste. 'Cost an arm and a leg', c'est être très cher. Et 'let the cat out of the bag', c'est révéler un secret. Ces expressions sont très utilisées. Essayez de les retenir !",
    "note": "Ces expressions sont très fréquentes dans la vie quotidienne."
  },
  {
    "titre": "Common Idioms - Part 2",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>10 Common Idioms (Part 2)</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Idiom</th> <th style='padding: 8px; border: 1px solid #ddd;'>Meaning</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Bite the bullet</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Face a difficult situation</td> <td style='padding: 8px; border: 1px solid #ddd;'>I had to <em>bite the bullet</em>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Under the weather</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Feeling ill</td> <td style='padding: 8px; border: 1px solid #ddd;'>I'm feeling <em>under the weather</em>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Once in a blue moon</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Very rarely</td> <td style='padding: 8px; border: 1px solid #ddd;'>We go out <em>once in a blue moon</em>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Spill the beans</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Reveal information</td> <td style='padding: 8px; border: 1px solid #ddd;'>He <em>spilled the beans</em>.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Hit the sack</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Go to bed</td> <td style='padding: 8px; border: 1px solid #ddd;'>I'm tired, let's <em>hit the sack</em>.</td> </tr> </table></div>",
    "texteParle": "Voici cinq autres expressions très courantes. 'Bite the bullet' signifie affronter une situation difficile. 'Under the weather' veut dire se sentir mal, comme si on était sous le mauvais temps. 'Once in a blue moon' signifie très rarement, comme une fois par siècle. 'Spill the beans' veut dire révéler des informations ou un secret. Et 'hit the sack' signifie aller se coucher. Ces expressions sont très utiles dans la vie de tous les jours.",
    "note": "Ces expressions sont très utilisées dans les conversations informelles."
  },
  {
    "titre": "Common Idioms - Part 3",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>10 Common Idioms (Part 3)</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Idiom</th> <th style='padding: 8px; border: 1px solid #ddd;'>Meaning</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Burn the midnight oil</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Work late into the night</td> <td style='padding: 8px; border: 1px solid #ddd;'>She <em>burned the midnight oil</em> to finish.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Keep an eye on</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Watch carefully</td> <td style='padding: 8px; border: 1px solid #ddd;'>Please <em>keep an eye on</em> my bag.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Break a leg</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Good luck! (theater)</td> <td style='padding: 8px; border: 1px solid #ddd;'><em>Break a leg</em> for the show!</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Hit the road</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Leave or start a journey</td> <td style='padding: 8px; border: 1px solid #ddd;'>We need to <em>hit the road</em> now.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Piece of the action</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Participate in something</td> <td style='padding: 8px; border: 1px solid #ddd;'>I want a <em>piece of the action</em>.</td> </tr> </table></div>",
    "texteParle": "Encore cinq expressions pour enrichir votre vocabulaire. 'Burn the midnight oil' signifie travailler très tard dans la nuit. 'Keep an eye on' veut dire surveiller attentivement. 'Break a leg' est une expression utilisée pour souhaiter bonne chance, surtout au théâtre. 'Hit the road' signifie partir ou commencer un voyage. Et 'piece of the action' veut dire participer à quelque chose. Ces expressions vous aideront à comprendre et à parler anglais plus naturellement.",
    "note": "Ces expressions sont très courantes dans les films et les séries."
  },
  {
    "titre": "What is Slang?",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Understanding Slang</h3><div style='background-color: #f3e5f5; padding: 10px; border-radius: 8px;'><p style='color: #4a148c; font-size: 16px;'><strong>Slang</strong> is very informal language used in everyday speech, especially among young people.</p></div><ul style='font-size: 16px;'><li><strong>Informal:</strong> Used with friends, family, and in casual contexts.</li><li><strong>Ever-changing:</strong> New slang appears all the time.</li><li><strong>Cultural:</strong> Different English-speaking countries have different slang.</li></ul><div style='background-color: #fff8e1; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #f57f17; font-size: 14px;'><strong>Warning:</strong> Avoid using slang in formal situations like job interviews or essays!</p></div></div>",
    "texteParle": "Qu'est-ce que l'argot en anglais ? L'argot est un langage très informel utilisé dans la vie quotidienne, surtout entre jeunes. Il est souvent utilisé entre amis ou en famille, mais jamais dans des situations formelles comme un entretien d'embauche ou un essai. L'argot change très vite, et il varie d'un pays à l'autre. Par exemple, l'argot américain est différent de l'argot britannique. Il est important de connaitre l'argot pour comprendre les conversations informelles, mais attention à ne pas l'utiliser dans un contexte professionnel.",
    "note": "L'argot est informel et varie selon les pays et les époques."
  },
  {
    "titre": "Common Slang Words",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>10 Common Slang Words</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Slang</th> <th style='padding: 8px; border: 1px solid #ddd;'>Meaning</th> <th style='padding: 8px; border: 1px solid #ddd;'>Example</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Cool</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Good, excellent</td> <td style='padding: 8px; border: 1px solid #ddd;'>That movie was <em>cool</em>!</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Gonna</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Going to</td> <td style='padding: 8px; border: 1px solid #ddd;'>I'm <em>gonna</em> go to the store.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Wanna</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Want to</td> <td style='padding: 8px; border: 1px solid #ddd;'>Do you <em>wanna</em> come?</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Kinda</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Kind of</td> <td style='padding: 8px; border: 1px solid #ddd;'>I'm <em>kinda</em> tired.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Awesome</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Amazing, excellent</td> <td style='padding: 8px; border: 1px solid #ddd;'>The concert was <em>awesome</em>!</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Chill</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Relax</td> <td style='padding: 8px; border: 1px solid #ddd;'>Just <em>chill</em> and enjoy.</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Hang out</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Spend time</td> <td style='padding: 8px; border: 1px solid #ddd;'>I <em>hang out</em> with friends.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>No way</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>I can't believe it!</td> <td style='padding: 8px; border: 1px solid #ddd;'><em>No way</em>! He's here?</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Whatever</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>I don't care</td> <td style='padding: 8px; border: 1px solid #ddd;'>Do what you want, <em>whatever</em>.</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Hang on</span></td> <td style='padding: 8px; border: 1px solid #ddd;'>Wait</td> <td style='padding: 8px; border: 1px solid #ddd;'><em>Hang on</em>, I'm coming.</td> </tr> </table></div>",
    "texteParle": "Voici quelques mots d'argot très courants en anglais. 'Cool' veut dire bon ou excellent. 'Gonna' et 'wanna' sont des contractions de 'going to' et 'want to'. 'Kinda' signifie 'kind of' ou plutôt. 'Awesome' veut dire extraordinaire. 'Chill' signifie se détendre. 'Hang out' veut dire passer du temps avec quelqu'un. 'No way' exprime la surprise. 'Whatever' signifie 'je m'en fiche' ou 'peu importe'. Et 'hang on' veut dire 'attends'. Ces mots sont très utilisés dans les conversations informelles. Utilisez-les avec vos amis !",
    "note": "L'argot est très courant dans les conversations entre jeunes."
  },
  {
    "titre": "Idioms vs Slang vs Collocations",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #1565c0;'>Idioms vs Slang vs Collocations</h3><table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <tr style='background-color: #1976d2; color: white;'> <th style='padding: 8px; border: 1px solid #ddd;'>Feature</th> <th style='padding: 8px; border: 1px solid #ddd;'>Idioms</th> <th style='padding: 8px; border: 1px solid #ddd;'>Slang</th> <th style='padding: 8px; border: 1px solid #ddd;'>Collocations</th> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Definition</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Fixed expressions with non-literal meaning</td> <td style='padding: 8px; border: 1px solid #ddd;'>Very informal words</td> <td style='padding: 8px; border: 1px solid #ddd;'>Words that naturally go together</td> </tr> <tr style='background-color: #f5f5f5;'> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Formality</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'>Informal to formal</td> <td style='padding: 8px; border: 1px solid #ddd;'>Very informal</td> <td style='padding: 8px; border: 1px solid #ddd;'>All levels</td> </tr> <tr> <td style='padding: 8px; border: 1px solid #ddd;'><strong>Example</strong></td> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>It's raining cats and dogs</span></td> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Cool / Gonna</span></td> <td style='padding: 8px; border: 1px solid #ddd;'><span style='color: #c62828;'>Make a decision</span></td> </tr> </table><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #0d47a1; font-size: 14px;'><strong>Tip:</strong> Collocations make you sound natural, idioms add personality, and slang shows cultural awareness!</p></div></div>",
    "texteParle": "Il est important de faire la différence entre les expressions idiomatiques, l'argot et les collocations. Les idiomes sont des expressions fixes avec un sens non littéral. L'argot est très informel et varie beaucoup. Les collocations sont des mots qui vont naturellement ensemble, comme 'make a decision'. Les trois sont importants pour parler anglais comme un natif. Les collocations vous aident à sonner naturel, les idiomes ajoutent de la couleur à votre langage, et l'argot montre que vous comprenez la culture anglaise.",
    "note": "Ces trois éléments sont complémentaires pour une maîtrise avancée."
  },

        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });

            btn.style.color = '#2d3748';
        });

        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {

        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
