<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "English for Software Engineers",
  "classe": "Languages",
  "sequence": "Sequence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercise 1: Technical Vocabulary and Definitions",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> Match each technical term with its correct definition. Write the letter of the definition next to the corresponding term.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1 Algorithm</strong> &nbsp;&nbsp;&nbsp; (A) A step-by-step procedure for solving a problem or performing a task.</p>",
          "reponse": "<p><strong>Answer:</strong> Algorithm - A</p>"
        },
        {
          "question": "<p><strong>1.2 Variable</strong> &nbsp;&nbsp;&nbsp; (B) A named container in programming that holds a value that can change.</p>",
          "reponse": "<p><strong>Answer:</strong> Variable - B</p>"
        },
        {
          "question": "<p><strong>1.3 Encryption</strong> &nbsp;&nbsp;&nbsp; (C) The process of converting data into a coded form to prevent unauthorized access.</p>",
          "reponse": "<p><strong>Answer:</strong> Encryption - C</p>"
        },
        {
          "question": "<p><strong>1.4 Sprint</strong> &nbsp;&nbsp;&nbsp; (D) A time-boxed period during which a specific set of work must be completed in Scrum.</p>",
          "reponse": "<p><strong>Answer:</strong> Sprint - D</p>"
        },
        {
          "question": "<p><strong>1.5 Vulnerability</strong> &nbsp;&nbsp;&nbsp; (E) A weakness or flaw in a system that can be exploited.</p>",
          "reponse": "<p><strong>Answer:</strong> Vulnerability - E</p>"
        },
        {
          "question": "<p><strong>1.6 Pull Request</strong> &nbsp;&nbsp;&nbsp; (F) A proposal to merge changes from one branch into another in a version control system.</p>",
          "reponse": "<p><strong>Answer:</strong> Pull Request - F</p>"
        }
      ]
    },
    {
      "titre": "Exercise 2: Professional Email Writing",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> You are a software engineer. Your colleague sent you a code review with several suggestions. Write a professional email responding to the feedback.</p><p><strong>Context:</strong> The review includes positive comments on your code structure and a suggestion to add more unit tests.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Write a professional email to your colleague. Your email should include: a subject line, a greeting, an acknowledgment of the feedback, a response to the suggestion, and a closing formula.</p>",
          "reponse": "<p><strong>Answer:</strong></p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><p><strong>Subject:</strong> Re: Code Review – Thank You!</p><p>Dear [Colleague's Name],</p><p>Thank you very much for the thorough code review. I really appreciated your positive comments on the code structure. It's encouraging to know that the organization of the code is clear.</p><p>Regarding your suggestion to add more unit tests, I completely agree. I have already started writing the additional tests to cover the edge cases you mentioned. I will push the updates to the pull request by the end of the day.</p><p>Thanks again for your time and valuable feedback.</p><p>Best regards,</p><p>[Your Name]</p></div>"
        }
      ]
    },
    {
      "titre": "Exercise 3: Code Review Communication",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> Read the following code snippet. Then, write a professional code review comment.</p><pre style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'>def calculate_discount(price, discount_percentage):\n    discount = price * discount_percentage / 100\n    return price - discount</pre><p><strong>Issue:</strong> The function does not validate the input. If the discount percentage is negative, the price will increase. If it is greater than 100, the price will become negative.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Write a constructive code review comment addressing the issue. Use polite and conditional language (e.g., <em>\"I would suggest...\"</em>, <em>\"You might consider...\"</em>).</p>",
          "reponse": "<p><strong>Answer:</strong></p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><p><em>\"This is a very clean and simple function, which is great! However, I would suggest adding input validation to prevent unexpected behavior. For example, if the discount percentage is negative or greater than 100, the result might not be what the user expects. You might consider adding a check to ensure the discount is between 0 and 100. What are your thoughts?\"</em></p></div>"
        }
      ]
    },
    {
      "titre": "Exercise 4: Describing a Technical Project",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> Imagine you are in a technical interview. The interviewer asks you the following question. Write a clear and structured answer using the STAR method.</p><p><strong>Question:</strong> <em>\"Can you describe a technical project you worked on and are proud of?\"</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Describe your project using the <strong>STAR</strong> method: <strong>S</strong>ituation, <strong>T</strong>ask, <strong>A</strong>ction, <strong>R</strong>esult. Your answer should be about 100-150 words.</p>",
          "reponse": "<p><strong>Answer:</strong></p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><p><strong>Situation:</strong> In my final year at university, we were tasked with building a web application for a local non-profit organization to help them manage their volunteer database.</p><p><strong>Task:</strong> My role was to design and implement the backend API and the database schema.</p><p><strong>Action:</strong> I chose to use Django REST Framework for the API because of its robustness and ORM capabilities. I designed a PostgreSQL schema, wrote the API endpoints, and implemented JWT authentication for security. I also wrote unit tests to ensure reliability.</p><p><strong>Result:</strong> The application was successfully delivered and is now being used by the organization. The volunteer management process has been streamlined, reducing manual data entry time by 70%.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercise 5: Writing a Bug Report",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> You are testing a web application. You have found a bug: when a user tries to reset their password, they do not receive the password reset email. Write a clear and concise bug report.</p></div>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> Write a bug report. Your report should include: a title, a description, steps to reproduce, expected behavior, actual behavior, and severity/priority levels.</p>",
          "reponse": "<p><strong>Answer:</strong></p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><p><strong>Title:</strong> Password Reset Email Not Received</p><p><strong>Description:</strong> When a user attempts to reset their password, the password reset email is not sent to their registered email address.</p><p><strong>Steps to Reproduce:</strong></p><ol><li>Go to the login page.</li><li>Click on the \"Forgot Password\" link.</li><li>Enter a registered email address.</li><li>Click the \"Send Reset Link\" button.</li></ol><p><strong>Expected Behavior:</strong> The user should receive an email with a password reset link.</p><p><strong>Actual Behavior:</strong> No email is received in the user's inbox or spam folder.</p><p><strong>Severity:</strong> Major (prevents users from resetting their password, a critical feature).</p><p><strong>Priority:</strong> High (affects user experience and security).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercise 6: Professional Communication in a Technical Discussion",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; padding: 10px;'><p><strong>Instructions:</strong> You are in a meeting with your team. A colleague disagrees with your proposed solution and says: <em>\"This is not the right way to do it. It's going to be too slow.\"</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>6.1</strong> Write a professional response to your colleague. Your response should acknowledge their concern, ask a clarifying question, and propose a way to move forward.</p>",
          "reponse": "<p><strong>Answer:</strong></p><div style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><p><em>\"Thank you for sharing that concern, I really appreciate you bringing it up. Could you elaborate on what specific aspects you think might cause the performance issue? I'd like to understand the potential bottlenecks you're anticipating. Maybe we could look at some metrics or do a quick proof-of-concept to test the performance. What would you think of that approach?\"</em></p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
