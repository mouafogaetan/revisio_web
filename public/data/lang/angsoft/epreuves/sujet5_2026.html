<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "English for Software Engineers",
  "classe": "Languages",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Reading Comprehension: Mentoring in Tech",
      "points": "6 pts",
      "enonce": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; color: #333; font-size: 0.95rem;'><p><strong>Read the text carefully and answer the questions that follow.</strong></p><p style='font-style: italic;'>Effective mentoring is one of the most valuable skills a senior software engineer can develop. A good mentor doesn't just tell junior developers what to do; they guide them to find solutions independently. This involves asking open-ended questions, providing context for decisions, and creating a safe environment where mistakes are seen as learning opportunities.</p><p style='font-style: italic;'>One of the key responsibilities of a mentor is to give constructive feedback. This feedback should be specific, actionable, and delivered with empathy. Instead of saying 'This code is wrong,' a mentor might say, 'I noticed this approach could be optimized. Have you considered using a different data structure here?' This approach encourages discussion and learning rather than defensiveness.</p><p style='font-style: italic;'>Mentoring also involves helping junior developers understand the bigger picture. This means explaining not just how to write code, but why certain architectural decisions are made, how the team's work fits into the company's goals, and how to navigate the professional landscape. Ultimately, effective mentoring builds stronger teams and prepares the next generation of tech leaders.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) According to the text, what is the difference between a good mentor and a poor mentor?</strong> (2 pts)</p>",
          "reponse": "<p>A good mentor guides junior developers to find solutions independently by asking open-ended questions and providing context, while a poor mentor simply tells them what to do without explanation.</p>"
        },
        {
          "question": "<p><strong>2) What are the three key elements of constructive feedback mentioned in the text?</strong> (2 pts)</p>",
          "reponse": "<p>The three key elements are: specific, actionable, and delivered with empathy.</p>"
        },
        {
          "question": "<p><strong>3) In your own words, explain why understanding the 'bigger picture' is important for junior developers.</strong> (2 pts)</p>",
          "reponse": "<p>Understanding the bigger picture helps junior developers see how their work contributes to team and company goals, make better architectural decisions, and navigate their professional careers more effectively.</p>"
        }
      ]
    },
    {
      "titre": "Vocabulary and Professional Communication",
      "points": "4 pts",
      "enonce": "<div style='background: #fff3e0; padding: 15px; border-radius: 10px; color: #e65100;'><p><strong>Complete the following sentences with the correct word or expression from the box below.</strong></p><p><em>mentorship, constructive feedback, networking, consensus, technical debt, action items, root cause analysis, stakeholders</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1) A good ___________ program helps junior developers grow and learn from experienced professionals.</strong> (1 pt)</p>",
          "reponse": "<p>mentorship</p>"
        },
        {
          "question": "<p><strong>2) During the post-mortem meeting, the team conducted a ___________ to understand why the incident happened.</strong> (1 pt)</p>",
          "reponse": "<p>root cause analysis</p>"
        },
        {
          "question": "<p><strong>3) The team was able to build ___________ after a long discussion about the best architectural approach.</strong> (1 pt)</p>",
          "reponse": "<p>consensus</p>"
        },
        {
          "question": "<p><strong>4) ___________ is essential for career growth, especially when attending tech conferences and meetups.</strong> (1 pt)</p>",
          "reponse": "<p>Networking</p>"
        }
      ]
    },
    {
      "titre": "Grammar in Context",
      "points": "4 pts",
      "enonce": "<div style='background: #e3f2fd; padding: 15px; border-radius: 10px; color: #0d47a1;'><p><strong>Rewrite the following sentences as instructed in brackets.</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>1) 'The project was delivered successfully by the team.' (Change to active voice)</strong> (1 pt)</p>",
          "reponse": "<p>The team delivered the project successfully.</p>"
        },
        {
          "question": "<p><strong>2) 'I suggest that we implement CI/CD to improve deployment speed.' (Rewrite using 'recommend')</strong> (1 pt)</p>",
          "reponse": "<p>I recommend implementing CI/CD to improve deployment speed.</p>"
        },
        {
          "question": "<p><strong>3) 'If the team had used a load balancer, the system wouldn't have crashed.' (Rewrite using conditional)</strong> (1 pt)</p>",
          "reponse": "<p>Had the team used a load balancer, the system wouldn't have crashed.</p>"
        },
        {
          "question": "<p><strong>4) 'The developer said, \"I will complete the feature by Friday.\"' (Change to reported speech)</strong> (1 pt)</p>",
          "reponse": "<p>The developer said that he/she would complete the feature by Friday.</p>"
        }
      ]
    },
    {
      "titre": "CV and LinkedIn Writing",
      "points": "6 pts",
      "enonce": "<div style='background: #e8f5e9; padding: 15px; border-radius: 10px; color: #1b5e20;'><p><strong>Instructions:</strong> You are applying for a Senior Software Engineer position. Write a CV summary and a LinkedIn About section based on the profile below.</p><p><strong>Profile Details:</strong></p><ul><li>7 years of experience in backend development</li><li>Skills: Python, Java, AWS, Docker, PostgreSQL, Microservices</li><li>Achievement: Led migration of a monolith to microservices, reducing costs by 30%</li><li>Achievement: Mentored 5 junior developers</li><li>Interest: Open source contributions, tech conferences</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>1) Write a professional CV summary (100-150 words).</strong> (3 pts)</p>",
          "reponse": "<p>Senior Software Engineer with 7 years of experience in backend development, specializing in Python, Java, and AWS cloud infrastructure. Proven track record of leading complex technical projects, including a successful migration from a monolith to microservices architecture that reduced infrastructure costs by 30%.</p><p>Passionate about mentoring junior developers, having guided 5 team members to advance their careers through code reviews and one-on-one coaching. Strong advocate for clean code, DevOps practices, and continuous improvement.</p><p>Active contributor to open source projects and frequent speaker at tech conferences. Looking for a challenging role where I can leverage my technical expertise and leadership skills to drive innovation and build high-performing teams.</p>"
        },
        {
          "question": "<p><strong>2) Write a LinkedIn About section (100-150 words) that is engaging and keyword-rich.</strong> (3 pts)</p>",
          "reponse": "<p>I'm a seasoned backend engineer with 7 years of experience building scalable, reliable systems. My expertise spans Python, Java, AWS, Docker, and microservices architecture. I thrive on solving complex problems and optimizing performance — most notably, I led a team to migrate a legacy monolith to microservices, achieving a 30% cost reduction and improving system reliability.</p><p>Beyond code, I'm deeply committed to mentoring and team growth. I've had the privilege of mentoring 5 junior developers, helping them navigate their careers and develop technical excellence. I believe that great engineering is built on collaboration, continuous learning, and a culture of feedback.</p><p>I'm passionate about open source, speaking at conferences, and connecting with like-minded professionals. Let's connect!</p>"
        }
      ]
    },
    {
      "titre": "Technical Leadership Role-Play",
      "points": "5 pts",
      "enonce": "<div style='background: #f3e5f5; padding: 15px; border-radius: 10px; color: #4a148c;'><p><strong>Instructions:</strong> You are leading a technical meeting with your team. Two team members disagree on the best approach to implement a new feature. One prefers a simpler, faster solution, while the other wants a more robust, scalable architecture.</p><p><strong>Write a script (200-250 words) of what you would say to:</strong></p><ul><li>Facilitate the discussion constructively</li><li>Manage the disagreement professionally</li><li>Help the team reach a consensus</li><li>Communicate the final decision</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>Write your script for the technical meeting.</strong> (5 pts)</p>",
          "reponse": "<p><strong>Lead (You):</strong> 'Thank you both for sharing your perspectives. I appreciate the passion and thought you've put into this discussion. Let's step back and clarify the requirements before we decide on the approach.'</p><p><strong>Lead (You):</strong> 'Marie, you mentioned that a simpler solution would allow us to deliver faster. Could you explain what trade-offs you see with the more robust approach? And David, you've highlighted scalability as a key concern. Could you walk us through the specific scenarios where the simpler approach might fall short?'</p><p><strong>Lead (You):</strong> 'Let's write the pros and cons of each approach on the board. I'd like everyone to consider two things: our current user load and our projected growth over the next 12 months.'</p><p><strong>Lead (You):</strong> 'Based on our discussion, I see we're all aligned on the need for quality. The question is whether we invest more time now or later. Given our roadmap, I recommend we adopt the more robust architecture but implement it in phases. We'll start with a minimal viable version and iterate.'</p><p><strong>Lead (You):</strong> 'Marie, does that work for you? David, what do you think? Great. Let's document the decision and assign tasks. I'll send an ADR (Architecture Decision Record) for review.'</p>"
        }
      ]
    },
    {
      "titre": "Writing Action Items",
      "points": "3 pts",
      "enonce": "<div style='background: #fff8e1; padding: 15px; border-radius: 10px; color: #f57f17;'><p><strong>Instructions:</strong> After a technical meeting, you need to send a summary with action items. Write a <strong>professional email</strong> to the team with clear, actionable items.</p><p><strong>Meeting Outcomes:</strong></p><ul><li>The team agreed to migrate the database to PostgreSQL</li><li>Maria will lead the migration plan</li><li>Jean will set up the testing environment</li><li>Everyone must complete security training by Friday</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>Write a professional email summarizing the action items.</strong> (3 pts)</p>",
          "reponse": "<p><strong>Subject:</strong> Action Items from Today's Technical Meeting</p><p>Dear Team,</p><p>Thank you all for the productive discussion today. I'm pleased to share that we've reached a consensus on the database migration to PostgreSQL.</p><p><strong>Action Items:</strong></p><ul><li><strong>Maria:</strong> Please lead the migration plan and share a draft timeline by Wednesday.</li><li><strong>Jean:</strong> Please set up the testing environment for the new database by Friday.</li><li><strong>All team members:</strong> Please complete the security training module by Friday. This is a mandatory requirement.</li></ul><p>I'll be available for any questions or support. Let's keep up the great collaboration!</p><p>Best regards,<br>[Your Name]</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
