<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "English for Software Engineers",
  "classe": "Languages",
  "sequence": "Sequence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "System Design Discussion",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; color: #2c3e50;'><p>Read the following scenario and answer the questions that follow. You are participating in a system design meeting for a new e-commerce platform.</p><p><strong>Scenario:</strong> The platform must handle up to 1 million users, support product searches, and process orders securely. The team is debating between a microservices architecture and a monolithic approach.</p></div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>1) Define the term <strong>\"microservices\"</strong> in your own words. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>Microservices is an architectural style where an application is composed of small, independent services. Each service runs a unique process and communicates through a well-defined, lightweight mechanism (e.g., HTTP/REST). They are independently deployable and organized around business capabilities.</div>"
        },
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>2) List <strong>two advantages</strong> of using microservices for this platform and <strong>one disadvantage</strong>. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'><strong>Advantages:</strong> <br>1. Scalability: Individual components can be scaled independently based on demand (e.g., search service).<br>2. Resilience: Failure in one service doesn't bring down the entire system.<br><strong>Disadvantage:</strong> <br>1. Complexity: Managing inter-service communication and data consistency is more complex.</div>"
        }
      ]
    },
    {
      "titre": "Security Communication",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; color: #2c3e50;'><p>You are a senior engineer asked to explain security requirements to a non-technical stakeholder.</p><p><strong>Context:</strong> The stakeholder is concerned about the security of user data in a new mobile application.</p></div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>1) Explain what <strong>\"end-to-end encryption\"</strong> means in simple terms that a non-technical person can understand. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>End-to-end encryption is a method of communication where only the communicating users can read the messages. It works like sending a letter in a locked box that only the sender and receiver have the key to. Even if someone intercepts the letter, they cannot open it. This prevents anyone in the middle, including the service provider, from accessing the data.</div>"
        },
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>2) Write a short professional email to the stakeholder addressing their concerns. Mention <strong>\"authentication\"</strong> and <strong>\"data privacy\"</strong> in your response. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'><strong>Subject:</strong> Security Measures for the New Mobile App<br><br>Dear [Stakeholder's Name],<br><br>Thank you for raising your concerns regarding user data security. I want to assure you that security is our top priority.<br><br>We are implementing robust <strong>authentication</strong> (like multi-factor authentication) to ensure only authorized users can access their accounts. Furthermore, we strictly follow <strong>data privacy</strong> best practices and regulations, including GDPR compliance, to ensure that all personal data is handled securely and transparently.<br><br>We would be happy to schedule a more detailed discussion about our security protocols at your convenience.<br><br>Best regards,<br>[Your Name/Title]</div>"
        }
      ]
    },
    {
      "titre": "Mentoring and Feedback",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; color: #2c3e50;'><p>As a tech lead, you are reviewing a junior developer's pull request. You need to provide constructive feedback.</p><p><strong>Context:</strong> You notice that the code has no comments, lacks error handling, and contains a bug in the user authentication logic.</p></div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>1) Write a polite but clear comment on the pull request, pointing out the <strong>lack of error handling</strong>. Use conditional language (e.g., <em>\"I would suggest\"</em>). (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>\"Great work on the overall structure of this module. I would suggest adding some robust error handling, especially around the database calls. For instance, you might consider using try-except blocks to manage any connection issues. This will make the system more stable and easier to debug.\"</div>"
        },
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>2) Explain to the junior developer the <strong>\"trade-off\"</strong> between writing clean code and delivering quickly, which you have also discussed in your code review. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>\"I understand we are working towards a deadline. However, spending a little extra time now to write clean, well-documented code with tests is a valuable investment. It reduces the cost of fixing bugs later and makes the system easier for other team members to understand and maintain. This 'trade-off' between speed and quality often pays off significantly in the long run.\"</div>"
        }
      ]
    },
    {
      "titre": "Career Development - CV Optimization",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; color: #2c3e50;'><p>You are a software engineer with 3 years of experience. Rewrite the following vague description of a project to make it stronger for your CV.</p><p><strong>Original description:</strong> <em>\"Worked on a project to improve the company website and made it faster.\"</em></p></div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>1) Rewrite this description using <strong>action verbs</strong> and, if possible, <strong>measurable results</strong> (even if hypothetical). (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>\"<strong>Led</strong> the front-end optimization project to <strong>enhance</strong> the company's e-commerce platform. <strong>Implemented</strong> modern caching strategies and lazy loading techniques that <strong>improved</strong> page load speed by <strong>40%</strong>, significantly <strong>boosting</strong> user engagement and conversion rates.\"</div>"
        },
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>2) You are about to attend a tech conference to network. Write a professional, concise introduction about yourself and your background. (2 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>\"Hello, I'm [Your Name]. I'm a Software Engineer with a strong focus on back-end systems and cloud infrastructure. I specialize in developing scalable microservices on AWS and have a passion for clean code and system architecture. It's a pleasure to connect with you here at [Conference Name].\"</div>"
        }
      ]
    },
    {
      "titre": "Comprehensive Communication - Blog Post",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px; color: #2c3e50;'><p>Write a short introductory paragraph for a technical blog post titled:</p><p><strong>\"The Rise of Green Software Engineering\"</strong></p><p>Your paragraph should be engaging, professional, and define the topic concisely. Aim for about 80-100 words.</p></div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0; color: #2c3e50;'>1) Write your introductory paragraph here. (4 pts)</div>",
          "reponse": "<div style='background: #eaf4e8; padding: 12px; border-radius: 6px; color: #1e4620;'>\"<p>In an era where technology evolves at lightning speed, its environmental footprint grows significantly. 'Green Software Engineering' emerges not just as a trend, but as a necessary discipline. It focuses on designing, developing, and operating software systems with sustainability as a core metric. This approach involves optimizing code efficiency, reducing energy consumption in data centers, and making conscious choices about system architecture. As we build the digital future, understanding and implementing green software practices is becoming a fundamental responsibility for every engineer.</p>\"</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
