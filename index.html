<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta tags SEO principales -->
    <title>Revisio - Cours en ligne, révisions et évaluations gratuites</title>
    <meta name="description" content="Revisio est une plateforme d'apprentissage en ligne proposant des cours, exercices, vidéos et évaluations pour tous les niveaux. Réviser efficacement et gratuitement." />
    <meta name="keywords" content="cours en ligne, révision, évaluation, exercices, vidéos éducatives, apprentissage, soutien scolaire, quiz, examen, révisions gratuites" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Revisio - Plateforme d'apprentissage en ligne" />
    <meta property="og:description" content="Cours, exercices, vidéos et évaluations pour réussir vos révisions gratuitement." />
    <meta property="og:url" content="https://revisio-web.vercel.app/" />
    <meta property="og:site_name" content="Revisio" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://revisio-web.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Revisio - Plateforme d'apprentissage" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revisio - Plateforme d'apprentissage en ligne" />
    <meta name="twitter:description" content="Cours, exercices, vidéos et évaluations pour réussir vos révisions gratuitement." />
    <meta name="twitter:image" content="https://revisio-web.vercel.app/icon-512.png" />
    <meta name="twitter:image:alt" content="Logo Revisio" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://revisio-web.vercel.app/" />
    
    <!-- Schema.org / Données structurées -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Revisio",
      "description": "Plateforme d'apprentissage en ligne avec cours, exercices, vidéos et évaluations",
      "url": "https://revisio-web.vercel.app/",
      "logo": "https://revisio-web.vercel.app/icon-512.png",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "support",
        "availableLanguage": ["French"]
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Revisio",
      "url": "https://revisio-web.vercel.app/",
      "description": "Plateforme d'apprentissage en ligne avec cours, exercices, vidéos et évaluations",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://revisio-web.vercel.app/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "fr-FR"
    }
    </script>
    
    <!-- PWA -->
    <meta name="theme-color" content="#66857A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-2576899782923895" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2576899782923895"></script>
    
    <!-- Configuration MathJax -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ['$', '$'],
            ['\\(', '\\)']
          ],
          displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]']
          ],
          processEscapes: true,
          processEnvironments: true,
        },
        svg: {
          fontCache: 'global',
          scale: 1,
          minScale: 0.5,
        },
        options: {
          ignoreHtmlClass: 'no-mathjax',
          processHtmlClass: 'math-content',
        },
        startup: {
          pageReady: () => {
            console.log('MathJax ready');
            return MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <script 
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" 
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
